summary_zh = "docs/privacy-and-security 于 2026-11-23 快照(#1389)把默认存储改为「新组织默认 ZDR」。What Together stores 段旧句「By default, Together stores the prompts you send and the responses models return, and may use them for product improvements. This data is not shared with third parties, and you can delete it at any time. Organization admins can turn storage off in privacy settings, which enables zero data retention (ZDR): request content is then not persisted or used for any secondary purpose.」改为「New organizations start with zero data retention (ZDR) enabled. When prompt storage is on, Together stores your prompts and model responses and may use them for product improvements. Together does not share this stored data with third parties, and you can delete it at any time.」；Prompt storage 开关由「On by default.」改为「Off by default for new organizations.」；Passthrough models 开关删去「On by default」，并改为「You can turn on passthrough models only while prompt storage is on.」。对 api_serverless：zdr 由 mark=yes / mode=opt_in 改为 mark=yes / mode=default（新组织默认）；training 仍为 mark=yes / mode=default，Model training 开关仍 Off by default；retention 仍为 object=mixed / basis=as_needed，但默认不再存储 prompt/output。passthrough 不再默认开启，新组织默认不可用。dedicated endpoints 是否适用该默认，本文档仍未单独说明，故 api_dedicated 的 zdr/retention 结论不变。"
summary_en = "In the 2026-11-23 snapshot (#1389), docs/privacy-and-security changed the default storage posture to ZDR by default for new organizations. The What Together stores paragraph changed from 'By default, Together stores the prompts you send and the responses models return, and may use them for product improvements. This data is not shared with third parties, and you can delete it at any time. Organization admins can turn storage off in privacy settings, which enables zero data retention (ZDR): request content is then not persisted or used for any secondary purpose.' to 'New organizations start with zero data retention (ZDR) enabled. When prompt storage is on, Together stores your prompts and model responses and may use them for product improvements. Together does not share this stored data with third parties, and you can delete it at any time.'; the Prompt storage toggle changed from 'On by default.' to 'Off by default for new organizations.'; and the Passthrough models toggle dropped 'On by default' and now reads 'You can turn on passthrough models only while prompt storage is on.' For api_serverless: zdr moves from mark=yes / mode=opt_in to mark=yes / mode=default (default for new organizations); training stays mark=yes / mode=default and the Model training toggle remains Off by default; retention stays object=mixed / basis=as_needed, but prompts and outputs are no longer stored by default. Passthrough is no longer on by default and is unavailable by default for new organizations. The document still does not say whether dedicated endpoints share this default, so the api_dedicated zdr/retention verdicts are unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/1390"
