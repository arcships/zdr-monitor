summary_zh = "docs/privacy-and-security 的 Enterprise data residency and private networking 段于 2026-10-24 快照(#831)改写：删除「Serverless endpoints do not offer region selection; use a dedicated endpoint or contact us to discuss the right setup for your workload.」，新增「For select serverless models, geo-specific inference keeps inference processing in the United States or Canada, with no GPUs to provision. The guarantee applies to the geography whose endpoint you use: us-api.together.ai for the United States or ca-api.together.ai for Canada. It covers only where those requests are processed, not where data is stored, logged, or routed.」。EU 等其余数据驻留需求仍引向 private networking / VPC 部署与 dedicated endpoint。对 api_serverless：部分 serverless 模型现在可选 US/CA 地理专用端点，processing_region codes 由 unknown 改为 US/CA；该保证只覆盖请求处理地，不覆盖存储、日志与路由，默认 serverless 端点的处理地仍未点名。原先「serverless 不提供区域选择」的表述已被厂商删除，相关锚点改绑到新句。此变化发生在上一次快照 PR，本 issue 一并修复失效引文与结论。"
summary_en = "The Enterprise data residency and private networking paragraph on docs/privacy-and-security was rewritten in the 2026-10-24 snapshot (#831): the sentence 'Serverless endpoints do not offer region selection; use a dedicated endpoint or contact us to discuss the right setup for your workload.' was removed, and the sentence 'For select serverless models, geo-specific inference keeps inference processing in the United States or Canada, with no GPUs to provision. The guarantee applies to the geography whose endpoint you use: us-api.together.ai for the United States or ca-api.together.ai for Canada. It covers only where those requests are processed, not where data is stored, logged, or routed.' was added. EU and other data-residency requirements are still directed to private networking/VPC deployments and dedicated endpoints. For api_serverless: select serverless models can now use US/CA geo-specific endpoints, so processing_region codes move from unknown to US/CA; the guarantee covers only where requests are processed, not storage, logging, or routing, and the default serverless endpoint's processing location remains unnamed. The vendor deleted the earlier 'serverless endpoints do not offer region selection' statement, so the related anchor is rebound to the new sentence. This change landed in an earlier snapshot PR; this issue fixes the stale quote and the verdict together."
issue = "https://github.com/arcships/zdr-monitor/issues/920"
