summary_zh = "docs/privacy-and-security 的 Enterprise data residency and private networking 段于 2026-10-30 快照(#945)改写：geo-specific inference 的地理范围由「United States or Canada」改为「United States」，端点说明由「The guarantee applies to the geography whose endpoint you use: us-api.together.ai for the United States or ca-api.together.ai for Canada.」改为「The guarantee applies to requests sent to us-api.together.ai.」。即文档不再列出加拿大端点（ca-api.together.ai），保证范围收窄到 us-api.together.ai；快照没有说明该端点是否仍可用或已停用。同段 EU/VPC 句的「contact us」改为「contact sales」，并删去句末「For the full legal picture, see the privacy policy.」；EU 需求仍引向 private networking / VPC 部署与 dedicated endpoint，语义未变。对 api_serverless：processing_region codes 由 US/CA 改为 US，相关锚点改绑到新句。该保证仍只覆盖请求处理地，不覆盖存储、日志与路由。"
summary_en = "The Enterprise data residency and private networking paragraph on docs/privacy-and-security was rewritten in the 2026-10-30 snapshot (#945): the geo-specific inference scope changed from 'United States or Canada' to 'United States', and the endpoint sentence changed from 'The guarantee applies to the geography whose endpoint you use: us-api.together.ai for the United States or ca-api.together.ai for Canada.' to 'The guarantee applies to requests sent to us-api.together.ai.'. That is, the document no longer lists a Canada endpoint (ca-api.together.ai) and the guarantee's scope narrows to us-api.together.ai; the snapshot does not say whether that endpoint remains available or has been retired. In the same paragraph, 'contact us' became 'contact sales' and the trailing 'For the full legal picture, see the privacy policy.' was removed; EU requirements are still directed to private networking/VPC deployments and a dedicated endpoint, so the meaning is unchanged. For api_serverless: processing_region codes move from US/CA to US, and the related anchor is rebound to the new sentence. The guarantee still covers only where requests are processed, not where data is stored, logged, or routed."
issue = "https://github.com/arcships/zdr-monitor/issues/946"
