summary_zh = "docs/zero-data-retention 于 2026-11-03 快照(#1019)按新的控制台标签改写启用步骤并删去账号级开关的重复说明，语义未变。旧「ZDR is not enabled by default. To enable it:」改为「ZDR is not enabled by default. To enable it for your organization:」；步骤「1. Open the **Privacy** section of Organization Settings. 2. Set **Store prompts and model responses** to **No**.」改为「1. Go to the **Privacy** section of Organization Settings. 2. Turn off **Prompt storage**.」；「Turning off prompt storage also turns off passthrough models automatically, because passthrough requires retained prompts.」删去 automatically；「ZDR applies from the moment you enable it. It does not retroactively affect data processed before then. To delete previously stored data, use the delete option in your settings or email [email protected].」改为「ZDR applies only to requests sent after you enable it. To delete data stored before then, use the delete option in your settings or email the privacy team.」；并删去「A similar storage toggle exists on your personal account profile, but it only applies to traffic sent under your personal account outside an organization. When a request uses an organization’s API key, the organization setting is what applies.」，该适用范围说明仍保留在同日抓取的 docs/privacy-and-security「Account vs. organization settings」段。ZDR 仍为组织级、默认关闭、只对启用后的请求生效，故 api_serverless 的 zdr 结论（mark=yes / mode=opt_in）不变。"
summary_en = "In the 2026-11-03 snapshot (#1019), docs/zero-data-retention rewrote the enable steps to match the new console labels and dropped a duplicate note about the account-level toggle; the meaning is unchanged. 'ZDR is not enabled by default. To enable it:' became 'ZDR is not enabled by default. To enable it for your organization:'; the steps '1. Open the **Privacy** section of Organization Settings. 2. Set **Store prompts and model responses** to **No**.' became '1. Go to the **Privacy** section of Organization Settings. 2. Turn off **Prompt storage**.'; 'Turning off prompt storage also turns off passthrough models automatically, because passthrough requires retained prompts.' dropped 'automatically'; 'ZDR applies from the moment you enable it. It does not retroactively affect data processed before then. To delete previously stored data, use the delete option in your settings or email [email protected].' became 'ZDR applies only to requests sent after you enable it. To delete data stored before then, use the delete option in your settings or email the privacy team.'; and 'A similar storage toggle exists on your personal account profile, but it only applies to traffic sent under your personal account outside an organization. When a request uses an organization’s API key, the organization setting is what applies.' was removed. The same scope statement remains in the 'Account vs. organization settings' section of docs/privacy-and-security captured the same day. ZDR remains organization-level, off by default, and applies only to requests sent after enabling it, so the api_serverless zdr verdict (mark=yes / mode=opt_in) is unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/1020"
