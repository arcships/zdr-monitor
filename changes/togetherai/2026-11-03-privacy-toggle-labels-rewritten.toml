summary_zh = "docs/privacy-and-security 于 2026-11-03 快照(#1019)按新的控制台标签改写组织级隐私开关，语义未变。旧句「Organization-level privacy toggles live on the main Organization Settings page under **Privacy**. Only organization admins can change them:」改为「Only organization admins can change the three toggles in the **Privacy** section of Organization Settings:」；存储开关由「**Store prompts and model responses:** On by default. Stores prompts and outputs for product improvements. Turn it off to enable zero data retention, which also turns off passthrough models because they require prompt storage.」改为「**Prompt storage:** On by default. Stores prompts and model responses for product improvements. Turn it off to enable ZDR, which also turns off passthrough models.」；训练开关由「**Allow organization’s data for training:** Off by default. Opt in to using your organization’s data for training models released by Together AI and partners.」改为「**Model training:** Off by default. Allows your organization’s data to be used for training models released by Together AI and partners.」；passthrough 开关由「**Allow passthrough models:** On by default. Allows models that forward prompts and responses to third-party providers (see below).」改为「**Passthrough models:** On by default. Allows your organization to use models that forward prompts and responses to third-party providers. Passthrough requires prompt storage, so you can’t turn this toggle on while prompt storage is off.」；Limited 档句的「before updating these settings」改为「before you change these settings」。Passthrough 段同步改写：旧「Some models are offered as **passthrough**, meaning that Together forwards your prompts and responses directly to the upstream provider, and data is handled under that provider’s own data policy. Passthrough is controlled by a separate organization-level toggle (“Allow my organization to use passthrough models…”) and is independent of the training opt-in above. If you do not want any traffic leaving Together’s infrastructure, turn that toggle off, and non-passthrough models will continue to work as normal.」改为「Some models are offered as *passthrough*, which means Together forwards your prompts and responses directly to the upstream provider. The provider handles that data under its own data policy. The **Passthrough models** toggle in organization privacy settings controls whether your organization can use these models, independent of the training opt-in. To keep all traffic on Together’s infrastructure, turn it off. Non-passthrough models keep working as normal.」。开关默认值、训练 opt-in 性质、passthrough 走上游政策与「passthrough 依赖 prompt storage」的语义均未变，故 api_serverless 的 training/zdr/retention 结论不变，相关锚点改绑到新句。"
summary_en = "In the 2026-11-03 snapshot (#1019), docs/privacy-and-security rewrote the organization-level privacy toggles to match new console labels; the meaning is unchanged. 'Organization-level privacy toggles live on the main Organization Settings page under **Privacy**. Only organization admins can change them:' became 'Only organization admins can change the three toggles in the **Privacy** section of Organization Settings:'; the storage toggle changed from '**Store prompts and model responses:** On by default. Stores prompts and outputs for product improvements. Turn it off to enable zero data retention, which also turns off passthrough models because they require prompt storage.' to '**Prompt storage:** On by default. Stores prompts and model responses for product improvements. Turn it off to enable ZDR, which also turns off passthrough models.'; the training toggle changed from '**Allow organization’s data for training:** Off by default. Opt in to using your organization’s data for training models released by Together AI and partners.' to '**Model training:** Off by default. Allows your organization’s data to be used for training models released by Together AI and partners.'; the passthrough toggle changed from '**Allow passthrough models:** On by default. Allows models that forward prompts and responses to third-party providers (see below).' to '**Passthrough models:** On by default. Allows your organization to use models that forward prompts and responses to third-party providers. Passthrough requires prompt storage, so you can’t turn this toggle on while prompt storage is off.'; and the Limited-tier sentence changed 'before updating these settings' to 'before you change these settings'. The passthrough paragraph was also rewritten: 'Some models are offered as **passthrough**, meaning that Together forwards your prompts and responses directly to the upstream provider, and data is handled under that provider’s own data policy. Passthrough is controlled by a separate organization-level toggle (“Allow my organization to use passthrough models…”) and is independent of the training opt-in above. If you do not want any traffic leaving Together’s infrastructure, turn that toggle off, and non-passthrough models will continue to work as normal.' became 'Some models are offered as *passthrough*, which means Together forwards your prompts and responses directly to the upstream provider. The provider handles that data under its own data policy. The **Passthrough models** toggle in organization privacy settings controls whether your organization can use these models, independent of the training opt-in. To keep all traffic on Together’s infrastructure, turn it off. Non-passthrough models keep working as normal.' The default values, the opt-in nature of training, the upstream-policy treatment of passthrough, and the dependency of passthrough on prompt storage are all unchanged, so the api_serverless training/zdr/retention verdicts are unchanged and the related anchors are rebound to the new sentences."
issue = "https://github.com/arcships/zdr-monitor/issues/1020"
