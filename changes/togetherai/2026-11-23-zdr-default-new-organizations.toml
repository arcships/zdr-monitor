summary_zh = "docs/zero-data-retention 于 2026-11-23 快照(#1389)把 ZDR 从「组织级、默认关闭」改为「新组织默认开启」。旧句「Together AI supports zero data retention (ZDR) at the organization level.」改为「Together AI enables zero data retention (ZDR) by default for new organizations.」；启用说明「ZDR is not enabled by default. To enable it for your organization:」改为「If your organization has prompt storage turned on, turn it off to enable ZDR.」；Default behavior 段由「Unless your organization enables ZDR, Together stores the prompts you send and the responses models return, and may use them for product improvements. This data will never be shared with third parties, and you can delete it at any time. Two related settings are independent of ZDR: - **Training:** Use of your data for training models is a separate opt-in and is off by default. Together does not train on your data without your explicit consent, whether or not ZDR is enabled. - **Passthrough models:** Models that forward requests to a third-party provider are allowed by default. Data sent to them is handled under that provider’s own policy.」改为「New organizations start with ZDR enabled and **Prompt storage** turned off. Passthrough models are unavailable while prompt storage is off. When prompt storage is on, Together stores your prompts and model responses and may use them for product improvements. Together does not share this stored data with third parties, and you can delete it at any time. Model training is a separate opt-in and is off by default. Together uses your data for training only with your explicit consent.」。对 api_serverless：zdr 由 mark=yes / mode=opt_in 改为 mark=yes / mode=default（文档限定为新组织默认，已有组织关闭 Prompt storage 即可启用）；training 仍为 mark=yes / mode=default，且旧「Together does not train on your data without your explicit consent, whether or not ZDR is enabled.」已删除，相关引文改绑到改写后的 Model training 句；retention 仍为 object=mixed / basis=as_needed，但默认姿态由「默认存储」变为「默认不存储、只有开启 prompt storage 才存储」。passthrough 现在在 prompt storage 关闭（即 ZDR 开启）时不可用，而新组织默认即此状态。"
summary_en = "In the 2026-11-23 snapshot (#1389), docs/zero-data-retention changed ZDR from organization-level and off by default to on by default for new organizations. 'Together AI supports zero data retention (ZDR) at the organization level.' became 'Together AI enables zero data retention (ZDR) by default for new organizations.'; the enable instruction 'ZDR is not enabled by default. To enable it for your organization:' became 'If your organization has prompt storage turned on, turn it off to enable ZDR.'; and the Default behavior section changed from 'Unless your organization enables ZDR, Together stores the prompts you send and the responses models return, and may use them for product improvements. This data will never be shared with third parties, and you can delete it at any time. Two related settings are independent of ZDR: - **Training:** Use of your data for training models is a separate opt-in and is off by default. Together does not train on your data without your explicit consent, whether or not ZDR is enabled. - **Passthrough models:** Models that forward requests to a third-party provider are allowed by default. Data sent to them is handled under that provider’s own policy.' to 'New organizations start with ZDR enabled and **Prompt storage** turned off. Passthrough models are unavailable while prompt storage is off. When prompt storage is on, Together stores your prompts and model responses and may use them for product improvements. Together does not share this stored data with third parties, and you can delete it at any time. Model training is a separate opt-in and is off by default. Together uses your data for training only with your explicit consent.' For api_serverless: zdr moves from mark=yes / mode=opt_in to mark=yes / mode=default (the document limits the default to new organizations; existing organizations enable it by turning Prompt storage off); training stays mark=yes / mode=default, and the removed sentence 'Together does not train on your data without your explicit consent, whether or not ZDR is enabled.' is rebound to the rewritten Model training sentence; retention stays object=mixed / basis=as_needed, but the default posture changes from stored by default to not stored by default, with storage only when prompt storage is on. Passthrough models are now unavailable while prompt storage is off (that is, while ZDR is on), which is the new default state for new organizations."
issue = "https://github.com/arcships/zdr-monitor/issues/1390"
