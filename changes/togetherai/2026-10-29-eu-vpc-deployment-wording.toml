summary_zh = "docs/zero-data-retention 的 Enterprise deployments 段于 2026-10-29 快照(#918)改写：旧句「Together supports private networking and VPC-based deployments, including in EU regions, on dedicated endpoints. Contact us to discuss the right setup for your workload.」改为「Together supports private networking and virtual private cloud (VPC) deployments on dedicated endpoints, including in EU regions. Contact sales to discuss the right setup for your workload.」。语义未变：VPC 展开为全称、两个状语换序、联系我们改为联系销售，EU regions 仍通过 private networking / VPC 部署与 dedicated endpoints 提供。processing_region 结论不变，api_dedicated 的 EU 锚点改绑到新句。同轮出现的导航文字（v2 移除、Assistant 提示位置调整）与五维无关。"
summary_en = "The Enterprise deployments paragraph on docs/zero-data-retention was reworded in the 2026-10-29 snapshot (#918): the old sentence 'Together supports private networking and VPC-based deployments, including in EU regions, on dedicated endpoints. Contact us to discuss the right setup for your workload.' became 'Together supports private networking and virtual private cloud (VPC) deployments on dedicated endpoints, including in EU regions. Contact sales to discuss the right setup for your workload.' The meaning is unchanged: VPC is expanded, two adverbial phrases are reordered, and 'Contact us' became 'Contact sales'; EU regions are still offered through private networking/VPC deployments and dedicated endpoints. The processing_region verdict is unchanged, and the api_dedicated EU anchor is rebound to the new sentence. The same snapshot's navigation changes (removal of 'v2', relocation of the Assistant notice) are unrelated to the five dimensions."
