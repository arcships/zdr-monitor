summary_zh = "kiro.dev/docs/models 的 Inference endpoint regions 表把 Auto 的 EU profile 由 Global 改回 EU（该 cell 在 2026-11-24 曾由 EU 改为 Global）：该行现在是「Auto | Active | US | EU」。EU profile 指 Europe (Frankfurt)，Global 指可在全球支持范围内的商业 AWS Region 处理，因此 EU profile 上的 Auto 请求从可能路由到 geography 之外收紧为留在 EU geography 内；US profile 仍为 US，不受影响。GPT-5.6 Sol/Terra/Luna 仍为 US profile=US、EU profile=Global，Fable 5.2/5.1、GPT 6.2 Astra、Grok 4.7、Kimi K3、DeepSeek 3.2、GLM-5 在 EU profile 仍为 —，其余 Claude、MiniMax、Qwen 模型仍为 EU。各档结论字段均不变：free 与 individual 的 codes 仍为 [\"US\"]（它们按 US profile 列处理，该列所有模型仍为 US）；enterprise 与 managed-models 仍为 [\"selected\", \"global\"]（EU profile 仍有 GPT-5.6 的 Global 取值）。锚点 kiro-models-us-profile-table 因旧表 Auto 行改写而改绑到新表；结论与说明文字同步为「Global 只出现在 EU profile 列的 GPT-5.6」。"
summary_en = "The Inference endpoint regions table on kiro.dev/docs/models changed Auto's EU profile cell from Global back to EU (the cell had moved from EU to Global on 2026-11-24): the row now reads 'Auto | Active | US | EU'. The EU profile is Europe (Frankfurt) and Global means Global routing across supported commercial AWS Regions worldwide, so Auto requests on the EU profile are narrowed from potentially being processed outside the geography to staying within the EU geography; the US profile remains US and is unaffected. GPT-5.6 Sol/Terra/Luna remain US on the US profile and Global on the EU profile; Claude Fable 5.2/5.1, GPT 6.2 Astra, Grok 4.7, Kimi K3, DeepSeek 3.2 and GLM-5 remain — on the EU profile, and the remaining Claude, MiniMax and Qwen models remain EU. No per-tier conclusion field changes: Free and individual keep codes=[\"US\"] (they follow the US profile column, every cell of which is still US); enterprise and managed-models keep [\"selected\", \"global\"] because the EU profile still has Global cells for GPT-5.6. The kiro-models-us-profile-table anchor is rebound to the new table after Auto's old row was rewritten, and the explanatory text now says Global appears only for GPT-5.6 in the EU profile column."
issue = "https://github.com/arcships/zdr-monitor/issues/1491"
