summary_zh = "kiro.dev/docs/models 新增 GPT 6.2 Astra 模型：Quick comparison 增加一行「GPT 6.2 Astra | 1M | 7.2x* | US only」，Free/Pro/Pro+/Pro Max/Power 列全部未勾选；Enterprise availability 新增一段，说明该模型对启用 model governance 的 Kiro Enterprise 组织提供 Preview，且「Inference runs only in the US geography」；Inference endpoint regions 表新增「GPT 6.2 Astra | Experimental | US | —」，即 US profile 为 US、EU profile 不提供。脚注把 GPT 6.2 Astra 加入两档上下文计价，并对超过 272K tokens 的请求给出 14.4x 费率。各档结论字段不变：Free 与 individual 无法选用该模型（各档列全未勾选），其可用模型的 US profile 仍为 US，codes=[\"US\"] 不变；enterprise 与 managed-models 仍为 [\"selected\", \"global\"]，新增的 US-only 推理与该档既有的 geography 内推理一致。锚点 kiro-models-free-availability（Free 列整表）与 kiro-models-us-profile-table（逐 profile 路由表）按新表改绑，说明文字同步补上 GPT 6.2 Astra。"
summary_en = "A new model, GPT 6.2 Astra, was added to kiro.dev/docs/models: the Quick comparison gains the row 'GPT 6.2 Astra | 1M | 7.2x* | US only' with the Free/Pro/Pro+/Pro Max/Power cells all unchecked; Enterprise availability gains a paragraph stating that the model is available in Preview to Kiro Enterprise organizations with model governance enabled and that 'Inference runs only in the US geography'; the Inference endpoint regions table gains 'GPT 6.2 Astra | Experimental | US | —', i.e. US on the US profile and not offered on the EU profile. A footnote adds GPT 6.2 Astra to two-tier context pricing with a 14.4x rate for requests over 272K tokens. No per-tier conclusion field changes: Free and individual cannot select this model (every plan cell is unchecked) and the US profile they follow remains US, so codes=[\"US\"] is unchanged; enterprise and managed-models remain [\"selected\", \"global\"], and the new US-only inference agrees with that tier's existing in-geography routing. The kiro-models-free-availability (whole Free column of the Quick comparison) and kiro-models-us-profile-table (per-profile routing table) anchors are rebound to the new tables, and their explanatory text now includes GPT 6.2 Astra."
issue = "https://github.com/arcships/zdr-monitor/issues/1440"
