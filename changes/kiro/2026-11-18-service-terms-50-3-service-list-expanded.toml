summary_zh = "AWS Service Terms §50.3 的服务清单改写：旧文为「… AWS FinOps Agent (Preview), Kiro Free Tier, and Kiro individual subscribers (as described here): (a) …」，新文在 Kiro 两项之后加入 AWS IoT SiteWise Scenario Discovery，并把连接词改为「Kiro Free Tier, Kiro individual subscribers (as described here), and AWS IoT SiteWise Scenario Discovery: (a) …」。Kiro Free Tier 与 Kiro individual subscribers 仍在同一授权清单中，(a)(b)(c) 三项对 Kiro 的表述逐字未变，新增的服务是另一产品。因此 free/individual 的 training=no、mode=opt_out、zdr=no、processing_region 结论值均不变；本条记录的是引文原文变化（锚点按新句改绑），不是 Kiro 待遇变化。同一快照里 §1.24、§50.1、§50.10、§50.17 的「Amazon Quick」改名「AWS Quick」、§50.10/§50.13 的 Amazon Q 范围加入「AWS assistant Free Tier」，以及新增 §1.33、§83 改为 AWS Support，都不涉及 Kiro。"
summary_en = "The service list in AWS Service Terms §50.3 was rewritten: the old text read '… AWS FinOps Agent (Preview), Kiro Free Tier, and Kiro individual subscribers (as described here): (a) …'; the new text appends AWS IoT SiteWise Scenario Discovery after the two Kiro entries and changes the conjunction to 'Kiro Free Tier, Kiro individual subscribers (as described here), and AWS IoT SiteWise Scenario Discovery: (a) …'. Kiro Free Tier and Kiro individual subscribers remain in the same authorisation list, and clauses (a)(b)(c) are word-for-word unchanged as they apply to Kiro; the added service is a different product. The free/individual verdicts (training=no, mode=opt_out, zdr=no, processing_region) are therefore unchanged — this record captures the vendor's wording change in the quoted sentence (the anchor is rebound to the new text), not a change in Kiro's treatment. In the same snapshot, 'Amazon Quick' was renamed 'AWS Quick' in §1.24, §50.1, §50.10 and §50.17; Amazon Q's scope in §50.10/§50.13 added 'AWS assistant Free Tier'; and new §1.33 plus the §83 AWS Support rewrite — none of these concern Kiro."
issue = "https://github.com/arcships/zdr-monitor/issues/1305"
