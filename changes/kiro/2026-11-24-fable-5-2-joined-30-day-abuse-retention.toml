summary_zh = "kiro.dev/docs/privacy-and-security/data-protection/ 的 Bedrock 滥用检测清单把 Claude Fable 5.2 并入 30 天全量流量留存：旧句为「For Anthropic Claude Fable 5.1, all traffic will be retained for up to 30 days (unless otherwise required by law) for automated offline abuse detection.」，新句为「For Anthropic Claude Fable 5.2 and Claude Fable 5.1, all traffic will be retained for up to 30 days (unless otherwise required by law) for automated offline abuse detection.」。30 天全量流量留存与「Classifier-flagged traffic will be subject to potential human review performed by AWS」这两项现在同样适用于 Fable 5.2，Fable 5.1 的表述逐字保留（仅与 5.2 并列）。期限（上限 30 天）、对象（输入输出流量）与例外（unless otherwise required by law）未变，但受强制留存约束的模型集合从 Fable 5.1 扩大到 Fable 5.2，因此记为 weakened，而不是纯澄清。同一页 OpenAI GPT 标记流量 30 天与 Free Tier 输入 60 天未变；kiro.dev/docs/web/data-protection 同步了同一句。各档 retention 结论字段（mark/days/object/basis）均不变；锚点 kiro-fable-abuse 按新句改绑。"
summary_en = "The Bedrock abuse-detection list on kiro.dev/docs/privacy-and-security/data-protection/ added Claude Fable 5.2 to the 30-day all-traffic retention: the old text read 'For Anthropic Claude Fable 5.1, all traffic will be retained for up to 30 days (unless otherwise required by law) for automated offline abuse detection.'; the new text reads 'For Anthropic Claude Fable 5.2 and Claude Fable 5.1, all traffic will be retained for up to 30 days (unless otherwise required by law) for automated offline abuse detection.' Both the 30-day all-traffic retention and the 'Classifier-flagged traffic will be subject to potential human review performed by AWS' treatment now also apply to Fable 5.2, while the Fable 5.1 wording is preserved verbatim (only joined with 5.2). The period (an upper bound of 30 days), object (inputs and outputs) and carve-out ('unless otherwise required by law') are unchanged, but the set of models subject to mandatory retention expands from Fable 5.1 to Fable 5.2, so this is recorded as weakened rather than a pure clarification. The OpenAI GPT 30-day classifier-flagged retention and the Free Tier 60-day input retention on the same page are untouched; kiro.dev/docs/web/data-protection carries the same sentence. No retention conclusion field (mark/days/object/basis) changes for any tier; the kiro-fable-abuse anchor is rebound to the new sentence."
issue = "https://github.com/arcships/zdr-monitor/issues/1403"
