source_id = "eeda603304a3f3c4"
summary_zh = "两页同向改写：Global routing 不再限于 experimental 模型，并让 individual 档第一次暴露在 Global 处理下。kiro.dev/docs/models 的 Inference endpoint regions 段重构：删去「The geography that serves requests from commercial profiles depends on both the model and the Kiro profile Region. GPT-5.6 models are served from the US regardless of profile Region…」与「Kiro is powered by Amazon Bedrock, which uses cross-region inference to distribute requests across the Regions within a geography」，改为逐模型 Inference scope（Global / Geography）表，GPT-5.6 Sol/Terra/Luna 标记为 Global；Free Tier/individual 一句由「always served from the commercial US geography」改为「use the US endpoint」；表下 Global 图例定义为「Across supported commercial AWS Regions worldwide, including outside the endpoint geography」。kiro.dev/docs/privacy-and-security/data-protection/ 删去「Global cross-region inference applies only to models explicitly designated as experimental」，把「For models and capabilities marked as experimental: Inference requests may be processed in multiple AWS Regions globally…」改为「Some Kiro models and capabilities use global cross-region inference. When Global routing applies, requests may be processed in supported commercial AWS Regions worldwide, including Regions outside your Kiro profile's geography.」，并保留「This does not change where Kiro stores your content」与 GovCloud 例外。结论变化只在 individual 档：processing_region codes 由 [\"US\"] 改为 [\"US\", \"global\"]——models 页 Quick comparison 把三个 Global scope 的 GPT-5.6 模型（Sol/Terra/Luna）列在 Pro、Pro+、Pro Max、Power（付费 individual 订阅档），而旧文里这些模型「served from the US regardless of profile Region」，因此这是该档第一次可在 US endpoint geography 之外处理。free 档不变（Free 一列没有任何 Global scope 模型，可用模型全是 Geography scope）；enterprise 与 managed-models 仍为 selected+global，结论值不变。"
summary_en = "Both pages were rewritten in the same direction: global routing is no longer experimental-only, and it exposes the individual tier to Global processing for the first time. On kiro.dev/docs/models, the Inference endpoint regions section was rebuilt: 'The geography that serves requests from commercial profiles depends on both the model and the Kiro profile Region. GPT-5.6 models are served from the US regardless of profile Region…' and 'Kiro is powered by Amazon Bedrock, which uses cross-region inference to distribute requests across the Regions within a geography' were removed, replaced by a per-model Inference scope (Global / Geography) table with GPT-5.6 Sol/Terra/Luna marked Global; the Free Tier/individual sentence changed from 'always served from the commercial US geography' to 'use the US endpoint'; the Global legend below the table is defined as 'Across supported commercial AWS Regions worldwide, including outside the endpoint geography'. On kiro.dev/docs/privacy-and-security/data-protection/, 'Global cross-region inference applies only to models explicitly designated as experimental' was removed and 'For models and capabilities marked as experimental: Inference requests may be processed in multiple AWS Regions globally…' became 'Some Kiro models and capabilities use global cross-region inference. When Global routing applies, requests may be processed in supported commercial AWS Regions worldwide, including Regions outside your Kiro profile's geography.', while 'This does not change where Kiro stores your content' and the GovCloud carve-out were kept. Only the individual tier's conclusion changes: processing_region codes move from [\"US\"] to [\"US\", \"global\"] — the models page's Quick comparison lists the three Global-scope GPT-5.6 models (Sol/Terra/Luna) on Pro, Pro+, Pro Max and Power (the paid individual subscription tiers), and the old text served those models from the US regardless of profile Region, so this is the first time this tier can be processed outside the US endpoint geography. Free is unchanged (no Global-scope model appears in the Free column; every model it offers is Geography scope); enterprise and managed-models remain selected+global with unchanged values."
issue = "https://github.com/arcships/zdr-monitor/issues/552"
