summary_zh = "kiro.dev/docs/models 的 Inference endpoint regions 两处改写：geography 句加上 commercial profiles 限定（「The geography that serves your request … region of your Kiro profile」→「The geography that serves requests from commercial profiles … Kiro profile Region」），Free Tier/individual 一句由「always served from the US」改为「always served from the commercial US geography」。同页新增 AWS GovCloud (US) 一节，experimental 模型全球处理的例外加上「For commercial profiles」并明确「This exception does not apply to AWS GovCloud (US)」，美国 geography 的 Region 列表移除 GovCloud 两处（挪到单独的 GovCloud 页）。各档 processing_region 结论值不变：free/individual 仍为 codes=[US]，enterprise/managed-models 仍为 selected+global；对商业 profiles 的服务 geography 与旧文一致，本次只是把 GovCloud 从商业 geography 中显式区分出去。"
summary_en = "Two rewrites in the Inference endpoint regions section of kiro.dev/docs/models: the geography sentence was scoped to commercial profiles ('The geography that serves your request … region of your Kiro profile' → 'The geography that serves requests from commercial profiles … Kiro profile Region'), and the Free Tier/individual sentence changed from 'always served from the US' to 'always served from the commercial US geography'. The same page added an AWS GovCloud (US) section, qualified the experimental-model global-processing exception with 'For commercial profiles' and stated 'This exception does not apply to AWS GovCloud (US)', and removed the two GovCloud entries from the US geography region list (moved to a separate GovCloud page). Per-tier processing_region conclusions are unchanged: free/individual remain codes=[US], enterprise/managed-models remain selected+global. The geography serving commercial profiles is the same as before; the change only makes the separation of GovCloud from the commercial geographies explicit."
issue = "https://github.com/arcships/zdr-monitor/issues/444"
