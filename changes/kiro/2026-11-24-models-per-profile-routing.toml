summary_zh = "kiro.dev/docs/models 的 Inference endpoint regions 从「逐模型 Inference scope（Global/Geography）＋每模型一个 endpoint」改成「按 Kiro profile 的逐列路由表」：列为 US profile / EU profile，取值为 US / EU / Global / —。旧表把 GPT-5.6 Sol/Terra/Luna 标为 Global scope、US 与 EU 两个 profile 的 endpoint 都写 US；新表把这三项改为 US profile=US、EU profile=Global。Auto 的 EU profile 由 EU 改为 Global。Fable 5.1 的 EU profile 仍为 —；新增 Fable 5.2（Experimental，EU profile 为 —）、Grok 4.7 与 Kimi K3（均 US profile=US、EU profile=—）、Claude Haiku 5.5（EU profile=EU）。DeepSeek 3.2 与 GLM-5 的 EU profile 由 EU 改为 —（EU profile 不再提供这两个模型）。Free Tier/individual 一句由「use the US endpoint」改为「follow the US profile column」。因此 individual 档 processing_region codes 由 [\"US\", \"global\"] 改为 [\"US\"]：individual 订阅者按 US profile 列处理，该列所有模型均为 US，Global 只出现在 EU profile 列（Auto 与 GPT-5.6）。除 individual codes 外，free 仍为 [\"US\"]，enterprise 与 managed-models 仍为 [\"selected\", \"global\"]（EU profile 仍存在 Global 取值），其余结论字段不变。data-protection 页把「A model's inference scope shows …」改为「The Inference endpoint regions table shows where each model processes requests.」并同步 Global routing 图例，语义与 models 页一致。"
summary_en = "The Inference endpoint regions section of kiro.dev/docs/models moved from a per-model 'Inference scope' (Global/Geography) plus one endpoint per model to a per-Kiro-profile routing table: columns are US profile / EU profile with values US / EU / Global / —. The old table marked GPT-5.6 Sol/Terra/Luna Global scope with US listed for both the US and EU profiles; the new table gives US profile=US and EU profile=Global for those three models. Auto's EU profile cell changes from EU to Global. Claude Fable 5.1's EU profile cell remains —; the page adds Claude Fable 5.2 (Experimental, EU profile —), Grok 4.7 and Kimi K3 (both US profile=US, EU profile=—), and Claude Haiku 5.5 (EU profile=EU). DeepSeek 3.2 and GLM-5 change from EU to — in the EU profile (no longer offered there). The Free Tier/individual sentence changes from 'use the US endpoint' to 'follow the US profile column'. The individual tier's processing_region codes therefore move from [\"US\", \"global\"] to [\"US\"]: individual subscribers follow the US profile column, every model there is US, and Global appears only in the EU profile column (Auto and GPT-5.6). Apart from the individual codes, Free remains [\"US\"] and enterprise/managed-models remain [\"selected\", \"global\"] (the EU profile still contains Global cells); no other conclusion field changes. The data-protection page replaces 'A model's inference scope shows …' with 'The Inference endpoint regions table shows where each model processes requests.' and syncs the Global routing legend, matching the models page semantics."
issue = "https://github.com/arcships/zdr-monitor/issues/1403"
