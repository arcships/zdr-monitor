summary_zh = "cognition.com/legal/privacy-policy 更新（Last updated 2026-03-09 → 2026-10-26）。Services 定义新增句：「If you use the Services through an organization that has an enterprise agreement with us, such as your employer, the personal information that the organization submits to the Services is governed by our agreement with that organization.」——组织依企业协议向 Services 提交的个人信息由该协议管辖。对 Customer Data 而言，该协议层即 Enterprise 协议与 DPA，其 Appendix C 把核心处理列在美国。该句并未把隐私政策整体移出 Enterprise 档：同一政策仍写明 Services 面向「individuals and enterprise customers」；DPA §2(b) 又规定 Account Data 在「the Licensor Privacy Policy as in effect at the time of processing」下处理。因此 Enterprise 的 processing_region 结论字段不变，仍为 codes=[US, global]：US 来自 DPA Appendix C，global 继续覆盖 Account Data（以及非由组织依企业协议提交的个人信息）的全球传输。另一新增句「If you use Devin EU at app.devin.eu, our EU Privacy Notice applies and Cognition AI Labs Ireland Limited is the controller of your personal information.」只适用于 app.devin.eu 的 Devin EU；本文件是 global 站的 Devin Desktop，不据此增删档位或处理地。同一版本还把服务例示由「Devin and Windsurf」改为「Devin」（产品更名），新增自动收集/广告合作方共享段落并删除原先的「不出售/不共享用于定向广告」声明，新增消费者「Right to opt out」条目，并删去年龄句中的「As set out in our Terms」——这些都不涉及训练、保留、ZDR、处理地或受托角色。training、retention、zdr、role 四维结论字段均未变。"
summary_en = "cognition.com/legal/privacy-policy was updated (Last updated 2026-03-09 to 2026-10-26). The Services definition added: 'If you use the Services through an organization that has an enterprise agreement with us, such as your employer, the personal information that the organization submits to the Services is governed by our agreement with that organization.' Personal information an organization submits under an enterprise agreement is thus governed by that agreement. For Customer Data, that agreement layer is the Enterprise agreement and the DPA, whose Appendix C puts core processing in the United States. The sentence does not remove the privacy policy from the Enterprise tier: the same policy still describes the Services as offerings 'we make available to individuals and enterprise customers', and DPA §2(b) provides that Account Data is processed in accordance with 'the Licensor Privacy Policy as in effect at the time of processing'. The Enterprise processing_region verdict fields are therefore unchanged at codes=[US, global]: US comes from DPA Appendix C, and global continues to cover Account Data (and any personal information not submitted by the organization under the enterprise agreement). A second new sentence, 'If you use Devin EU at app.devin.eu, our EU Privacy Notice applies and Cognition AI Labs Ireland Limited is the controller of your personal information.', applies only to Devin EU at app.devin.eu; this file covers Devin Desktop on the global site, so no tier or region is added or removed on its account. The same revision also changes the Services example from 'Devin and Windsurf' to 'Devin' (a product rename), adds an automatic-collection/advertising-partner sharing paragraph while removing the former 'we do not sell or share ... for targeted advertising' statement, adds a consumer 'Right to opt out' bullet, and drops 'As set out in our Terms' from the age sentence; none of these concerns training, retention, ZDR, processing region or processor role. The training, retention, zdr and role verdict fields are unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/881"
