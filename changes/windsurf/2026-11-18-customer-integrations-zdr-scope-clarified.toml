summary_zh = "cognition.com/legal/platform-terms-of-service 更新（Last updated 2026-06-30 → 2026-11-16），新增 §2.8 Customer Integrations：「By enabling a Customer Integration to interact with the Services, Customer permits the Services to exchange Customer Data with such Customer Integrations.」并写明此类客户自选的第三方集成「Use of Customer Integrations is subject to Customer's agreement with the relevant provider」，Cognition「does not control and is not responsible or liable for … how the Customer Integrations or their providers use Customer Data」。这把客户启用第三方集成后的数据使用明确交给客户与该提供商的协议约束：§3.3.1(B) 的 ZDR 只承诺「with our model providers」，§1.8 的 ZDR 定义也未提及客户自选的集成商；Cognition 自身对 Customer Data 的训练、Opt-Out/ZDR 与 §7.2 终止删除条款均未改。free、individual-paid、teams 的 zdr/retention 结论字段不变。同一版还删除开头「the prior terms shall control until 30 days from the posting of these Terms」的过渡句、新增 §2.7 Beta Products（仅免责声明，不涉及数据处理），二者与五个维度无关。"
summary_en = "The Cognition Platform Terms were updated (Last updated 2026-06-30 to 2026-11-16) and add §2.8 Customer Integrations: \"By enabling a Customer Integration to interact with the Services, Customer permits the Services to exchange Customer Data with such Customer Integrations.\" The clause also states that use of such customer-elected third-party integrations \"is subject to Customer's agreement with the relevant provider\" and that Cognition \"does not control and is not responsible or liable for … how the Customer Integrations or their providers use Customer Data.\" This makes explicit that use of a customer-enabled integration is governed by the customer's agreement with that provider: §3.3.1(B) promises ZDR only \"with our model providers\", and the §1.8 ZDR definition does not mention customer-elected integration providers. Cognition's own training, Opt-Out/ZDR and §7.2 termination-deletion clauses are unchanged. The zdr and retention verdict fields for the free, individual-paid and teams tiers are unchanged. The same revision also removes the opening transitional sentence \"the prior terms shall control until 30 days from the posting of these Terms\" and adds §2.7 Beta Products (a warranty/indemnity disclaimer with no data-processing terms); neither concerns the five dimensions."
