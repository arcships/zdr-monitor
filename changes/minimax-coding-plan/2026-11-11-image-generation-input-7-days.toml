summary_zh = "《Upload File》参考页（https://platform.minimax.io/docs/api-reference/file-management-upload）的 purpose 枚举新增第 6 项 image_generation_input：MiniMax-H3-Image 图像编辑的参考图，原文『Reference images for MiniMax-H3-Image image editing, referenced in the request's `images[].image_url` field as `mm_file://{file_id}`, valid for 7 days (after expiry, the request returns file expired and you must re-upload); files are validated on upload against the Image Edit reference image limits, and invalid files are rejected with 400 and not retained.』同页新增该用途的格式与单文件大小限制表（Image：jpg / jpeg / png / webp / heic / heif，64 MB）。原有 video_understanding『retained for up to 7 days』与 video_generation_input『valid for 7 days』两句未改。retention 结论字段不变（object=input_output、basis=as_needed，仍由隐私政策『as long as it is necessary or permitted by law』锚定），但上传对象清单新增一个带明确 7 天上限、且校验失败文件不保留的对象，故在个人版与团队版两个档位的 retention 对象级说明中补记 image_generation_input 并新增对应锚点。另有与五维无关的改动，不记入本次政策变化：顶部横幅由 MiniMax H3 视频模型换成 MiniMax H3 Image 图像模型、导航『Token Plan』改为『M Plan』、示例代码 `--form file='@example-file'` 去掉引号，均属措辞/格式。"
summary_en = "The \u2018Upload File\u2019 reference page (https://platform.minimax.io/docs/api-reference/file-management-upload) added a sixth purpose, image_generation_input: reference images for MiniMax-H3-Image image editing, \u2018Reference images for MiniMax-H3-Image image editing, referenced in the request's `images[].image_url` field as `mm_file://{file_id}`, valid for 7 days (after expiry, the request returns file expired and you must re-upload); files are validated on upload against the Image Edit reference image limits, and invalid files are rejected with 400 and not retained.\u2019 The same page added a format and per-file size table for that purpose (Image: jpg / jpeg / png / webp / heic / heif, 64 MB). The pre-existing video_understanding \u2018retained for up to 7 days\u2019 and video_generation_input \u2018valid for 7 days\u2019 sentences are unchanged. The retention verdict fields are unchanged (object=input_output, basis=as_needed, still anchored to the privacy policy's \u2018as long as it is necessary or permitted by law\u2019), but the upload object list gains an object with an explicit 7-day upper bound whose rejected files are not retained, so image_generation_input was added to the object-level retention notes of both the individual and team products with a new anchor. Unrelated wording/format edits are not recorded as policy changes: the top banner switched from the MiniMax H3 video model to the MiniMax H3 Image image model, the navigation label changed from \u2018Token Plan\u2019 to \u2018M Plan\u2019, and the example code dropped the quotes in `--form file='@example-file'`."
issue = "https://github.com/arcships/zdr-monitor/issues/1189"
