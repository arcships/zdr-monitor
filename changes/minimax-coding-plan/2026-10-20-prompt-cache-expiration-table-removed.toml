summary_zh = "《Prompt Caching》参考页（https://platform.minimax.io/docs/api-reference/text-prompt-caching）删除了整节「Explicit Prompt Caching (Anthropic API)」与其中的「Cache Comparison」表。该表原先把两种缓存分列：被动缓存（Prompt Caching (Passive)）的期限『Expiration time automatically adjusted based on system load』，仅显式缓存（Explicit Prompt Caching (Anthropic API)，即 Anthropic 兼容的显式缓存）的期限『5-minute expiration, automatically renewed with continued use』——5 分钟空闲到期、持续使用自动续期。两句均已从页面消失。同节删除的还有 Usage/Billing/Supported Models 对照行与显式缓存首次写入额外计费的说明。另有三处相关改写：① Features 的 Automatic Caching 条目由『Passive caching that automatically identifies repeated context content without changing API call methods (*In contrast, the caching mode that requires explicitly setting parameters in the Anthropic API is called “Explicit Prompt Caching”, see Explicit Prompt Caching (Anthropic API)*)』改为『Automatically identifies repeated context content without changing API call methods』，不再提被动/显式之分；② 原来的计价示例与『For MiniMax-M3, long-context pricing applies when input tokens are greater than 512k, including cache-hit tokens.』整块删除，改为『Pricing formula』；③ Important Notes 新增『Supported models: MiniMax-M3.1-Flash, MiniMax-M3, MiniMax-M2.7 series, MiniMax-M2.5 series, MiniMax-M2.1 series』。模型名由 MiniMax-M3 改为 MiniMax-M3.1-Flash、导航『Token Plan』改为『M Plan』等属于与五维无关的措辞/格式变化。retention 结论字段不变（object=input_output、basis=as_needed，仍由隐私政策『as long as it is necessary or permitted by law』锚定），但页面不再披露缓存对象的任何期限：原两条针对缓存对象的 point（仅显式缓存的 5 分钟空闲到期并自动续期 / 被动缓存的到期时间随系统负载调整）与其锚点一并删除，改为一条记录『缓存默认自动开启、适用于 512 及以上输入 token，页面未给出到期时间，归入一般按需保留』。对用户而言，仅显式缓存（Anthropic 兼容）的 5 分钟空闲到期、持续使用自动续期不再有官方依据，方向记为 weakened（披露减少）。"
summary_en = "The Prompt Caching reference page (https://platform.minimax.io/docs/api-reference/text-prompt-caching) removed the entire 'Explicit Prompt Caching (Anthropic API)' section together with its 'Cache Comparison' table. That table listed the expiry for each cache mode: the passive cache ('Prompt Caching (Passive)') 'Expiration time automatically adjusted based on system load', and the explicit cache only ('Explicit Prompt Caching (Anthropic API)', i.e. Anthropic-compatible explicit caching) '5-minute expiration, automatically renewed with continued use' — a 5-minute idle expiry, automatically renewed with continued use. Both sentences are gone from the page. The same section also removed its Usage / Billing / Supported Models comparison rows and the note that explicit cache writes incur additional charges. Three related rewordings: (1) the Features 'Automatic Caching' bullet changed from 'Passive caching that automatically identifies repeated context content without changing API call methods (*In contrast, the caching mode that requires explicitly setting parameters in the Anthropic API is called “Explicit Prompt Caching”, see Explicit Prompt Caching (Anthropic API)*)' to 'Automatically identifies repeated context content without changing API call methods', dropping the passive/explicit distinction; (2) the worked pricing example and 'For MiniMax-M3, long-context pricing applies when input tokens are greater than 512k, including cache-hit tokens.' were replaced by a 'Pricing formula' block; (3) Important Notes gained 'Supported models: MiniMax-M3.1-Flash, MiniMax-M3, MiniMax-M2.7 series, MiniMax-M2.5 series, MiniMax-M2.1 series'. The model-name change from MiniMax-M3 to MiniMax-M3.1-Flash, the navigation label from 'Token Plan' to 'M Plan', and similar wording/format edits are unrelated to the five dimensions. The retention verdict fields are unchanged (object=input_output, basis=as_needed, still anchored to the privacy policy's 'as long as it is necessary or permitted by law'), but the page no longer discloses any period for the cache object: the two object-level points (explicit cache only: 5-minute idle expiry with automatic renewal; passive cache: expiry adjusted by system load) and their anchors were removed and replaced by one point recording that caching is automatic by default, applies to API calls with 512 or more input tokens, and states no expiry, so the cache falls under the general as-needed retention term. For users, the explicit cache's (Anthropic-compatible) 5-minute idle expiry with automatic renewal on continued use no longer has an official basis, hence direction weakened (less disclosure)."
issue = "https://github.com/arcships/zdr-monitor/issues/731"
