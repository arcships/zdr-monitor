summary_zh = "《选择地域、服务部署范围和接入域名》改版：旧句「完整的地域与服务部署范围对应关系，请前往控制台查看」改为「各地域支持的服务部署范围和接入方式，请参见华北2（北京）、新加坡、美国（弗吉尼亚）、德国（法兰克福）、日本（东京）、中国香港」，即把对应关系指向各地域子页而非控制台；同时删除「**华北2（北京）**和**新加坡地域**各仅支持一种服务部署范围，无需选择」一句。保留的全文仍写明地域决定接入点和数据存储位置、请求数据存于所选地域、推理结果回到接入地域存储、用户静态数据始终存于所选地域，并列出德国（法兰克福）、日本（东京）、中国香港、美国（弗吉尼亚）通过业务空间区分部署范围。processing_region 的 codes 仍为 [CN]，依据改为合同：协议 §6.2.8 约定阿里云在您选定的阿里云百炼服务及模型服务所在国家或地区处理客户业务数据；本档 Base URL 属华北 2（北京）的 DashScope 域名，故选定地域为北京、处理地记 CN。被删句原用于支撑「北京仅一种服务部署范围」的推理位置推断；本页保留的存储与接入地表述只证明存储位置，不再单独证明北京地域的推理执行地。地域子页未纳入来源，无法据其补证。同轮「相关文档」里「概述」改为「Realtime API 协议选型」属导航改动，与五维无关。方向记为 clarified：厂商把部署范围对应关系移到地域子页并删去一句概括，未见北京实际可选范围发生变化的表述。"
summary_en = "The 'Select a region, deployment scope and endpoint' page was restructured: the old sentence 'For the complete region-to-deployment-scope mapping, see the console.' became 'For the deployment scopes and access methods supported by each region, see China North 2 (Beijing), Singapore, US (Virginia), Germany (Frankfurt), Japan (Tokyo) and China Hong Kong.', i.e. the mapping is now delegated to per-region pages instead of the console; at the same time the bullet '**China North 2 (Beijing)** and **Singapore** each support only one deployment scope, so no selection is needed.' was deleted. The remaining text still says the region determines the access point and data-storage location, request data is stored in the selected region, inference results are stored back in the access region, user static data always resides in the selected region, and names Germany (Frankfurt), Japan (Tokyo), China Hong Kong and US (Virginia) as the regions that distinguish deployment scope through a workspace. The processing_region codes remain [CN], but the basis is now contractual: §6.2.8 says Alibaba Cloud processes customer business data in the country or region where the selected Alibaba Cloud Model Studio service and model service are located, and this plan's Base URL belongs to the China North 2 (Beijing) DashScope domain, so the selected region is Beijing and the processing region is recorded as CN. The deleted sentence had supported the inference that Beijing offers only one deployment scope; the retained storage and access statements on this page prove storage location only and no longer independently establish Beijing's inference location. The per-region pages are not among the monitored sources, so they cannot be used to add evidence. In the same diff, the related-docs entry 'Overview' became 'Realtime API protocol selection', a navigation change unrelated to the five dimensions. Direction is recorded as clarified: the vendor moved the scope mapping to per-region pages and dropped one summary sentence, with no statement that Beijing's actual selectable scope changed."
issue = "https://github.com/arcships/zdr-monitor/issues/642"
