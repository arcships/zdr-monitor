summary_zh = "《什么是阿里云百炼》在 2026-11-03 快照（#990）改版为《模型服务概览》：标题与正文结构整体重写，原「常见问题」整段删除，其中两句训练口径随之消失——「阿里云严格保护数据隐私，使用百炼按量付费 API 和 Token Plan 团队版时，不会将您的数据用于模型训练」，以及加粗「重要」提示「Token Plan 个人版和 Coding Plan 的数据使用条款与上述承诺不同。使用 Coding Plan 期间，模型输入及模型生成的内容将用于服务改进与模型优化；Token Plan 个人版不包含团队版的『不使用数据训练模型』承诺」。新正文只剩快速开始、模型卡片与开始构建，不再涉及数据处理。coding-plan-personal 的 training 结论不变（mark=no / mode=opt_out），仍以服务协议 §5.2.2 的存储并使用授权为依据；api 对照行的 training 结论不变（mark=yes / mode=by_tier），主证据从被删的产品页句子改绑到服务协议 §6.2.5「我们不会在未获您授权的情况下使用您的对话数据训练我们的模型」，隐私说明的平台级「绝不会将您的数据用于模型训练」作为佐证。zdr、retention 等其他维度不依赖本页，不受影响。厂商删除了产品文档里的训练口径与档位例外表述，故方向记 weakened。"
summary_en = "In the 2026-11-03 snapshot (#990), 'What is Alibaba Cloud Model Studio' was rewritten as 'Model Service Overview': the title and body structure changed wholesale and the entire FAQ section was removed, including two training statements — 'Alibaba Cloud strictly protects data privacy. When you use the Model Studio pay-as-you-go API and Token Plan Team Edition, your data will not be used to train models.' and the bold 'Important' note 'The data usage terms of Token Plan Individual Edition and Coding Plan differ from the above commitment. While using Coding Plan, model inputs and model-generated content will be used for service improvement and model optimization; Token Plan Individual Edition does not include Team Edition's \"no training on data\" commitment.' The new body contains only a quick start, model cards and build sections, and no longer discusses data processing. The coding-plan-personal training verdict is unchanged (mark=no / mode=opt_out) and still rests on the storage-and-use authorization in service agreement §5.2.2; the api comparison row's training verdict is unchanged (mark=yes / mode=by_tier), with its main evidence rebound from the deleted product-page sentence to service agreement §6.2.5 ('we will not use your conversation data to train our models without your authorization'), corroborated by the privacy notice's platform-level 'will never use your data to train models'. zdr, retention and the other dimensions do not depend on this page and are unaffected. Because the vendor removed the training wording and the tier carve-out statement from its product documentation, the direction is recorded as weakened."
issue = "https://github.com/arcships/zdr-monitor/issues/993"
