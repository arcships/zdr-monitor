summary_zh = "百炼《机密推理》页第 4 节「开通与部署」删去「邀测」措辞：旧的「1. 邀测功能：机密推理目前为邀测功能，需联系阿里云商务申请开通。」改为「1. 开通服务：需联系阿里云商务申请开通。」；「使用流程」中的「开通服务（邀测 · 签署《特别规则》）」也改为「开通服务（签署《特别规则》）」。仍需联系阿里云商务申请开通、当前仅华北 2（北京）、部署前须签署《特别规则》三项前提未变，因此 CMaaS 仍是需申请开通的另一档零明文路径，api 档 zdr 结论不变（mark=no / mode=not_disclosed），引文由旧句改绑到保留的「需联系阿里云商务申请开通。」。同一快照的页面标题由「百炼 Confidential MaaS 最佳实践」改为「机密推理」、章节名「机密部署」改为「机密推理」、计费表排版与模型清单顺序、以及示例代码等改动与五个维度无关。"
summary_en = "Section 4 ('Activation and deployment') of Alibaba Model Studio's Confidential Inference page dropped the 'invite-only beta' wording: '1. Invite-only beta: Confidential Inference is currently an invite-only beta and requires applying through Alibaba Cloud sales.' became '1. Activation service: requires applying through Alibaba Cloud sales.'; the usage-flow line 'Activation service (invite-only beta · sign the Special Rules)' likewise became 'Activation service (sign the Special Rules)'. The three prerequisites remain unchanged — applying through Alibaba Cloud sales, China North 2 (Beijing) only, and signing the Special Rules before deployment — so CMaaS remains only the zero-plaintext path of a separate sub-product that must be applied for. The zdr verdict for the api tier is unchanged (mark=no / mode=not_disclosed), and the quote was rebound from the removed sentence to the retained 'requires applying through Alibaba Cloud sales'. The same snapshot's page-title change from 'Confidential MaaS best practice' to 'Confidential Inference', section renames from 'Confidential deployment' to 'Confidential inference', pricing-table reflow and model-list ordering, and example-code updates are unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1455"
