summary_zh = "百炼《机密推理（Confidential MaaS）最佳实践》第 4 节由「开通与使用前提」改为「开通与部署」：原「开通机密推理需满足定向邀请、地域支持与合规签署三项前提。」与「机密推理为定向邀请使用，需联系阿里云商务申请开通。」改写为编号列表「1. 邀测功能：机密推理目前为邀测功能，需联系阿里云商务申请开通。」；地域（当前支持华北2（北京）地域）与签署《特别规则》两项前提未变，另新增控制台「请确认开通并使用」的确认步骤。api 档 zdr 结论不变（mark=no / mode=not_disclosed），CMaaS 仍只是需申请开通的另一档零明文路径；引文由旧句改绑到新句。同一快照的计费表与模型清单、Base64 图片输入示例、Responses/Anthropic 示例及接口限制等改动与五个维度无关。"
summary_en = "Section 4 of Alibaba Model Studio's Confidential MaaS best-practice page changed from 'Prerequisites for activation and use' to 'Activation and deployment': the old statements 'Activating Confidential Inference requires three prerequisites: invitation, regional support, and compliance signing' and 'Confidential Inference is invitation-only; contact Alibaba Cloud sales to apply for activation' were rewritten as the numbered item '1. Invite-only beta: Confidential Inference is currently an invite-only beta and requires applying through Alibaba Cloud sales.' The regional prerequisite (currently China North 2 (Beijing) only) and the requirement to sign the Special Rules are unchanged, and a console step to confirm activation was added. The zdr verdict for the api tier is unchanged (mark=no / mode=not_disclosed); CMaaS remains only the zero-plaintext path of a separate sub-product that must be applied for, and the quote was rebound from the old sentence to the new one. The same snapshot's pricing/model tables, Base64 image-input examples, Responses/Anthropic examples and interface limitations are unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/952"
