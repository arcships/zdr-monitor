summary_zh = "百炼《机密推理（Confidential MaaS）最佳实践》更新：计费表新增 cmaas-qwen3.8-flash 与 cmaas-deepseek-v4-pro-0813 两个模型；openai-proxy 章节由「OpenAI 兼容 Chat 接口」改为「OpenAI 兼容接口」，补充 Responses API 示例；接口功能限制改写为「不支持多模态输入与显式缓存及相关参数功能」「出于数据安全隐私考虑，不支持联网搜索，代码解释器等内置工具」「Responses API 仅支持无状态调用（创建响应），不支持已存储会话等相关参数功能（previous_response_id、conversation、store）」。其中只有最后一条直接涉及会话是否留存：它把 CMaaS 的 Responses API 兼容路径限定为无状态调用，不涉及默认按量 API 档。页面原有的「平台不留存明文提示词、模型输出与加密密钥，密钥与内容由用户掌握」以及第 4 节定向邀请、当前仅华北 2（北京）、签署《特别规则》三项开通前提均未变。api 档五维结论与锚点不变（zdr 仍为 mark=no / mode=not_disclosed，CMaaS 仍只是邀请制另一档的零明文路径）；本条只记录厂商原文的澄清性改动。"
summary_en = "Alibaba Model Studio's Confidential MaaS best-practice page was updated: the pricing table added cmaas-qwen3.8-flash and cmaas-deepseek-v4-pro-0813; the openai-proxy section was renamed from 'OpenAI-compatible Chat interface' to 'OpenAI-compatible interface' and gained a Responses API example; and the feature-limitation list now reads 'no multimodal input or explicit caching and related parameters', 'for data security and privacy reasons, no web search, code interpreter or other built-in tools', and 'the Responses API supports only stateless calls (creating responses); stored-conversation and related parameters (previous_response_id, conversation, store) are not supported'. Only the last item directly concerns whether sessions are retained: it limits the CMaaS Responses API compatibility path to stateless calls and does not reach the default pay-as-you-go API tier. The page's existing statement that 'the platform does not retain plaintext prompts, model outputs or encryption keys; keys and content are held by the user' and the Section 4 prerequisites (invite-only, currently China North 2 (Beijing) only, signing the Special Rules) are unchanged. No verdict field or anchor on the api tier changes (zdr remains mark=no / mode=not_disclosed, and CMaaS remains only the zero-plaintext path of a separate invite-only tier); this entry records the vendor's clarifying wording change only."
issue = "https://github.com/arcships/zdr-monitor/issues/780"
