summary_zh = "《Vercel Terms of Service》重新发布：Last Updated 由 June 1, 2026 改为 October 19, 2026，章节整体重排——新增 §6 Managed Teams and Managed Accounts，AI Functionality 与 Third Party Tools 由 §6 移至 §7，Data Protection 由 §10 移至 §11，Vercel's Role 由 §10.1 移至 §11.1，System Data 由 §10.4 移至 §11.4，Payment of Fees 由 §17 移至 §18，Term and Termination 由 §18 移至 §19（终止时删除 Your Content 的条款由 §18.1 移至 §19.1），新增 §25 Changes to Services、§26 DORA；原 Schedule I 整节从页面移除，其中 Non-Vercel Services 移入 §20.2，原 Schedule I §4 对 AI Product Terms 的引用条款也不再出现在 ToS 正文。与五个维度相关的实质变化只有处理角色条款的改写：原 §10.1 的 'We will process the personal information in Your Content, Account Information, and System Data as a data controller or data processor in accordance with Vercel's Data Processing Addendum (\"**DPA**\"), which is incorporated by reference, and our Privacy Policy as applicable.' 在 §11.1 中于 Data Processing Addendum 后插入 DPA 网址 '(vercel.com/legal/dpa)'，其余措辞不变，仍是 controller 或 processor 的二选一表述。训练条款 ToS §3、System Data §11.4、§19.1 的删除句均只改引号或重编号，文字未变；DPA 与 AI Product Terms 两个来源本轮快照未变。判定：各档结论字段未变（v0 Free / v0 Premium 仍为 controller，v0 Team / v0 Enterprise 仍依 DPA §4.1 为 processor），方向为 clarified。处理：把 vercel-tos-10-1-vercel-role 的引文改绑到新句子并更新上下文，同时刷新各条说明与来源备注中的章节号。"
summary_en = "The Vercel Terms of Service was republished with Last Updated moved from June 1, 2026 to October 19, 2026 and the sections renumbered throughout: a new Section 6 Managed Teams and Managed Accounts was added, AI Functionality and Third Party Tools moved from Section 6 to Section 7, Data Protection from Section 10 to Section 11, Vercel's Role from Section 10.1 to Section 11.1, System Data from Section 10.4 to Section 11.4, Payment of Fees from Section 17 to Section 18, and Term and Termination from Section 18 to Section 19 (the termination-deletion sentence moved from Section 18.1 to Section 19.1); new Sections 25 Changes to Services and 26 DORA were added; the whole of Schedule I was removed from the page, with Non-Vercel Services moved into Section 20.2, and Schedule I Section 4's incorporation of the AI Product Terms no longer appears in the Terms of Service. The only substantive change touching the five dimensions is the processing-role clause: the old Section 10.1 sentence 'We will process the personal information in Your Content, Account Information, and System Data as a data controller or data processor in accordance with Vercel's Data Processing Addendum (\"**DPA**\"), which is incorporated by reference, and our Privacy Policy as applicable.' now appears in Section 11.1 with the DPA URL '(vercel.com/legal/dpa)' inserted after 'Data Processing Addendum'; the rest of the wording is unchanged and it still states the controller-or-processor disjunction. The training clause in Section 3, System Data in Section 11.4 and the deletion sentence in Section 19.1 changed only in quotation marks or numbering, not in wording; the DPA and AI Product Terms snapshots did not change in this round. Assessment: no verdict field changed on any tier (v0 Free and v0 Premium remain controller; v0 Team and v0 Enterprise remain processor under DPA Section 4.1), so the direction is clarified. Action: the vercel-tos-10-1-vercel-role quote was rebound to the new sentence with refreshed context, and the section numbers in the supporting text and source note were updated."
issue = "https://github.com/arcships/zdr-monitor/issues/737"
