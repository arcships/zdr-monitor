summary_zh = "docs.cline.bot/enterprise-solutions/overview.md 改版，删去企业自带推理（BYO）档的多句架构性表述。Security by Design 段的「Your code never leaves your environment. Cline processes everything locally - no uploads, no indexing, no training on your data.」被换成「Cline runs in the environment you choose: on developers' computers, or on remote hosts they connect it to. Prompts go to the inference provider you configure.」；四张卡片里 Client-side execution（All processing happens within your environment）、No data exfiltration（Code and context never transmitted externally）与 No model training（Your code and prompts aren't used for training）被替换为 Runs where you choose、Your inference provider（Prompts and code context go to the model provider you configure）与 Scoped telemetry（Cline's telemetry doesn't include your code, file contents or prompts, except for requests to the Cline and ClinePass providers），No codebase indexing 卡片由「Repositories are never indexed or cached」改为「Cline reads files when a task needs them and doesn't index or embed the contents of your repositories」；页首「Your code stays in your environment」改为「Cline runs in the environment you choose」。模型示例与页脚同时改动，与五维无关。据此，enterprise-byo 档原有的两条引文 cline-enterprise-local 与 cline-enterprise-no-training 在快照里已不存在，改绑到存留的三句（Cline runs in the environment you choose、Prompts and code context go to the model provider you configure、Cline's telemetry … except for requests to the Cline and ClinePass providers）加隐私通知的 BYOK 句「If you use your own API keys to access the AI model, you provide this information directly to the third-party provider, and we do not collect it.」。结论字段未变：training 与 zdr 仍是 mark=yes / mode=by_deployment，但依据收窄为「Cline 不在内容链路上」而非「正文不出客户环境」，上游跳是否训练或保留由客户所选 provider 的条款决定；retention（object=input_output、basis=undisclosed）与 processing_region（codes=[\"selected\"]）也不变。"
summary_en = "The docs.cline.bot/enterprise-solutions/overview.md page was rewritten and dropped several architectural statements for the enterprise BYO tier. In Security by Design, \"Your code never leaves your environment. Cline processes everything locally - no uploads, no indexing, no training on your data.\" became \"Cline runs in the environment you choose: on developers' computers, or on remote hosts they connect it to. Prompts go to the inference provider you configure.\" Of the four cards, Client-side execution (\"All processing happens within your environment\"), No data exfiltration (\"Code and context never transmitted externally\") and No model training (\"Your code and prompts aren't used for training\") were replaced by Runs where you choose, Your inference provider (\"Prompts and code context go to the model provider you configure\") and Scoped telemetry (\"Cline's telemetry doesn't include your code, file contents or prompts, except for requests to the Cline and ClinePass providers\"); the No codebase indexing card changed from \"Repositories are never indexed or cached\" to \"Cline reads files when a task needs them and doesn't index or embed the contents of your repositories\". The intro sentence \"Your code stays in your environment\" also became \"Cline runs in the environment you choose\"; the model examples and footer changed too and are immaterial. As a result, the two quotes previously used for the enterprise-byo tier (cline-enterprise-local and cline-enterprise-no-training) no longer exist in the snapshot and were rebound to three surviving sentences (Cline runs in the environment you choose; Prompts and code context go to the model provider you configure; Cline's telemetry ... except for requests to the Cline and ClinePass providers) plus the privacy notice's BYOK sentence \"If you use your own API keys to access the AI model, you provide this information directly to the third-party provider, and we do not collect it.\" No verdict field changed: training and zdr stay mark=yes / mode=by_deployment, but the basis is narrowed from \"content never leaves the customer's environment\" to \"Cline is not in the content path\", with whether the upstream hop trains on or retains the content left to the terms of the provider the customer chooses; retention (object=input_output, basis=undisclosed) and processing_region (codes=[\"selected\"]) are unchanged as well."
issue = "https://github.com/arcships/zdr-monitor/issues/532"
