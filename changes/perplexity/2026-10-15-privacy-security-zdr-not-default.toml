summary_zh = "文档站《Privacy & Security》在 2026-10-15 快照中整段改写。旧正文「Data Privacy & Retention / Zero Data Retention Policy」写「Perplexity maintains a strict Zero Data Retention Policy for the Chat Completions API. We do not retain data sent through the Chat Completions API, and we do not use customer data to train our models or for any purpose beyond processing the immediate request.」，计费一节并称「This billing metadata does not include any content from your prompts, responses, or other user data.」。新正文改为「API Privacy & Security」：训练口径为「No training by default: Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models. Certain APIs may be subject to product-specific terms.」；ZDR 改为「Zero Data Retention is not default: ZDR is available only to eligible customers through an account-level configuration under a written agreement with Perplexity. If ZDR has not been enabled for your account, do not assume that Perplexity or its model providers apply zero data retention to your requests.」，并新增模型级限制（并非所有模型支持 ZDR）与第三方模型提供方可能要求有限期保留；计费/账户数据一节改为「Perplexity collects limited usage metadata—such as request and token counts, model used, timestamps, duration, and API key—to operate and bill the service, along with account information such as name and email address.」，不再声明不含 prompt/response 内容。api 档 zdr 由 mark=yes/mode=default 改为 mark=yes/mode=by_agreement；retention 仍为 object=input_output/basis=none（依据未变的 FAQ「We do not retain any query data sent through the API...」），但计费元数据依据改绑到新句并删去「不含内容」的表述；training 仍为 mark=yes/mode=by_contract（依据未变的 API ToS §2.3.3）。"
summary_en = "The Privacy & Security page was rewritten in the 2026-10-15 snapshot. The old 'Data Privacy & Retention / Zero Data Retention Policy' text read 'Perplexity maintains a strict Zero Data Retention Policy for the Chat Completions API. We do not retain data sent through the Chat Completions API, and we do not use customer data to train our models or for any purpose beyond processing the immediate request.', and the billing section said 'This billing metadata does not include any content from your prompts, responses, or other user data.' The new 'API Privacy & Security' section says: 'No training by default: Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models. Certain APIs may be subject to product-specific terms.'; 'Zero Data Retention is not default: ZDR is available only to eligible customers through an account-level configuration under a written agreement with Perplexity. If ZDR has not been enabled for your account, do not assume that Perplexity or its model providers apply zero data retention to your requests.'; it adds model-level limits (not every model supports ZDR) and notes that third-party model providers may require limited retention; and the service/account data sentence now reads 'Perplexity collects limited usage metadata—such as request and token counts, model used, timestamps, duration, and API key—to operate and bill the service, along with account information such as name and email address.', no longer stating that billing metadata excludes prompt/response content. On the api tier, zdr changes from mark=yes/mode=default to mark=yes/mode=by_agreement. Retention remains object=input_output/basis=none on the unchanged FAQ sentence 'We do not retain any query data sent through the API...', but the billing-metadata point is rebound to the new sentence and the old 'does not include content' claim is removed. Training remains mark=yes/mode=by_contract on the unchanged API ToS §2.3.3."
issue = "https://github.com/arcships/zdr-monitor/issues/675"
