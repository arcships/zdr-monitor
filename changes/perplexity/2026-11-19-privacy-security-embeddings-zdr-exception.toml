summary_zh = "docs/resources/privacy-security 的 2026-11-19 快照(#1336)在「Zero Data Retention is not default」一条末尾新增一句：「The exception is the Embeddings API, which applies ZDR by default: inputs and outputs are not stored or logged.」该条旧正文止于「If ZDR has not been enabled for your account, do not assume that Perplexity or its model providers apply zero data retention to your requests.」，未提任何例外。其余 diff 只是标题层级（「API Privacy & Security」「Security Certifications & Compliance」等改为 markdown 标题）与页尾 Assistant/建议块移到页首，属格式变化。新增句直接覆盖 Embeddings 档：zdr 由 mark=unknown 改为 mark=yes / mode=default，retention 由 object=input_output / basis=undisclosed 改为 object=input_output / basis=none（明确「inputs and outputs are not stored or logged」），两个维度都绑到该句。DPA 序言的「Embeddings … may operate under data postures that differ from this DPA」仍作背景保留，不构成相反表述。Sonar / Chat Completions 档不受影响：该例外明确只针对 Embeddings API，故其 zdr 仍 mark=yes / mode=by_agreement，retention 仍 object=input_output / basis=undisclosed。厂商新增了本档的默认零保留与输入输出不留存承诺，故方向记 strengthened。"
summary_en = "In the 2026-11-19 snapshot (#1336) of docs/resources/privacy-security, a sentence was added to the end of the 'Zero Data Retention is not default' bullet: 'The exception is the Embeddings API, which applies ZDR by default: inputs and outputs are not stored or logged.' The previous text of that bullet ended at 'If ZDR has not been enabled for your account, do not assume that Perplexity or its model providers apply zero data retention to your requests.' and named no exception. The rest of the diff is formatting only: heading levels ('API Privacy & Security', 'Security Certifications & Compliance', etc. became markdown headings) and the Assistant/suggestions block moved from the page bottom to the top. The new sentence covers the Embeddings tier directly: zdr moves from mark=unknown to mark=yes / mode=default, and retention moves from object=input_output / basis=undisclosed to object=input_output / basis=none (an express 'inputs and outputs are not stored or logged'), with both dimensions anchored to that sentence. The DPA preamble's 'Embeddings … may operate under data postures that differ from this DPA' remains as background and is not contrary. The Sonar / Chat Completions tier is unaffected: the exception is expressly limited to the Embeddings API, so its zdr remains mark=yes / mode=by_agreement and its retention remains object=input_output / basis=undisclosed. Because the vendor added a default zero-retention and non-storage commitment for this tier, the direction is recorded as strengthened."
issue = "https://github.com/arcships/zdr-monitor/issues/1338"
