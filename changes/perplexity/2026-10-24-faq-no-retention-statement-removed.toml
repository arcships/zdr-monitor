summary_zh = "docs/resources/faq 的 Data, Privacy & Security 段于 2026-10-24 快照(#827)改版，删除「We do not retain any query data sent through the API and do not train on any of your data」与「By default, the API has zero day retention of user prompt data, which is never used for AI training」两句：训练句改为以合同为依据的「Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models」，保留句改为「Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default. See Privacy & Security for details.」。托管地一句「Our compute is hosted via Amazon Web Services in North America」保留，processing_region 不受影响。对 api 档(Sonar / Chat Completions 按量端点)：training 结论不变(mark=yes / mode=by_contract，仍以 API ToS §2.3.3 为准)，FAQ 依据改绑到新句；retention 失去「不保留 query data / 默认零日保留」依据，非个人输入输出在 FAQ、privacy-security、DPA、API ToS 四处都没有保留期限或不留存承诺，故 object=input_output 不变、basis 由 none 改为 undisclosed；zdr 的结论不变(mark=yes / mode=by_agreement)，FAQ 与 privacy-security 现在口径一致，原先记录的两页字面冲突消失。厂商删除了不保留与默认零日保留的承诺，故方向记 weakened。"
summary_en = "In the 2026-10-24 snapshot (#827) of docs/resources/faq's Data, Privacy & Security section, two sentences were removed: 'We do not retain any query data sent through the API and do not train on any of your data' and 'By default, the API has zero day retention of user prompt data, which is never used for AI training'. The training sentence now rests on the contract: 'Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models', and the retention sentence now reads 'Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default. See Privacy & Security for details.' The hosting sentence 'Our compute is hosted via Amazon Web Services in North America' is unchanged, so processing_region is unaffected. For the api tier (Sonar / Chat Completions pay-as-you-go): the training verdict is unchanged (mark=yes / mode=by_contract, still resting on API ToS §2.3.3) and its FAQ point is rebound to the new sentence; retention loses the 'does not retain query data / zero day retention by default' basis, and since the FAQ, privacy-security, DPA and API ToS all give no retention period or non-retention commitment for non-personal Input/Output, object=input_output is unchanged while basis moves from none to undisclosed; the zdr verdict is unchanged (mark=yes / mode=by_agreement), and the FAQ now agrees with privacy-security, so the literal conflict previously recorded is gone. Because the vendor removed the no-retention and default-zero-day commitments, the direction is recorded as weakened."
issue = "https://github.com/arcships/zdr-monitor/issues/830"
