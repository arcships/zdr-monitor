summary_zh = "docs/resources/faq 的 2026-10-31 快照(#969)删除了 Data, Privacy & Security 段中整段「Where Are Perplexity's Language Models Hosted?」问答，旧正文「Our compute is hosted via Amazon Web Services in North America. For how API data is retained, including when Zero Data Retention (ZDR) is available, see Privacy & Security.」两句均已不在页面上（后一句只是指向 Privacy & Security 的说明，不构成 retention/ZDR 的实体条款）。这一句是 api 档 processing_region（codes=[\"US\"]）的唯一依据；现行 FAQ、Privacy & Security、API ToS 均无处理地条款，DPA §11 只是传输合规机制，trust center 子处理者清单的 US 列是厂商公司所在地而非处理地（消费者、企业、Search、Embeddings 档已按同一理由不采）。故 api 档 processing_region 由 codes=[\"US\"] 改为 mark=unknown / basis=undisclosed、codes 清空，并记下查阅范围。本次快照未改动训练、保留、ZDR 三句，这三维结论不变。厂商删除了唯一的托管地披露，故方向记 weakened。"
summary_en = "The 2026-10-31 snapshot (#969) of docs/resources/faq removed the whole 'Where Are Perplexity's Language Models Hosted?' question from the Data, Privacy & Security section. The old text 'Our compute is hosted via Amazon Web Services in North America. For how API data is retained, including when Zero Data Retention (ZDR) is available, see Privacy & Security.' is gone; the second sentence was only a pointer to Privacy & Security and is not a substantive retention/ZDR clause. That hosting sentence was the sole basis for the api tier's processing_region (codes=[\"US\"]). The current FAQ, Privacy & Security and API ToS contain no processing-location clause, DPA §11 is only a transfer-compliance mechanism, and the US column of the trust-center subprocessor list is the vendor company's location rather than a processing location (already not used for the consumer, enterprise, search and embeddings tiers on the same reasoning). The api tier therefore moves from codes=[\"US\"] to mark=unknown / basis=undisclosed with codes cleared and the search scope recorded. The training, retention and ZDR sentences were not touched in this snapshot, so those verdicts are unchanged. Because the vendor removed the only hosting disclosure, the direction is recorded as weakened."
issue = "https://github.com/arcships/zdr-monitor/issues/974"
