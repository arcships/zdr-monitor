summary_zh = "help.openai.com/en/articles/8983778 的「Files saved to Library」一节改写为「Files saved to Library or Space」，并新增定义句「Depending on your account, you can find saved files in **Library** or **Space**.」。原句「For Enterprise, Edu, and Healthcare workspaces, Library files follow the workspace retention policy.」改为「For Enterprise, Edu, and Healthcare workspaces, these saved files follow the workspace retention policy.」：留存机制未变（仍由工作区留存策略决定），但适用对象从 Library 文件扩展为存入 Library 或 Space 的文件。codex-enterprise 的 retention 结论字段未变（object=input_output、basis=undisclosed），原锚点 openai-codex-enterprise-workspace-retention 改绑到新句（exact 仍是这一句政策原文），「these saved files」的指代由同节定义句说明，对应 point 的对象说明同步更新为 Library 或 Space。同轮其余改动是故障横幅移出、Updated 时间戳、相关文章列表，以及删除/归档文件段落随该节改名的连带措辞，与五维无关。"
summary_en = "On help.openai.com/en/articles/8983778 the section \"Files saved to Library\" became \"Files saved to Library or Space\", with a new defining sentence: \"Depending on your account, you can find saved files in **Library** or **Space**.\" The sentence \"For Enterprise, Edu, and Healthcare workspaces, Library files follow the workspace retention policy.\" became \"For Enterprise, Edu, and Healthcare workspaces, these saved files follow the workspace retention policy.\": the retention mechanism is unchanged (still set by the workspace retention policy), but its object widens from Library files to files saved in Library or Space. No retention verdict field changed for codex-enterprise (object=input_output, basis=undisclosed); anchor openai-codex-enterprise-workspace-retention was rebound to the new sentence, with `exact` still holding the policy sentence itself while the antecedent of \"these saved files\" is supplied by the section's defining sentence, and the corresponding point's object description now says Library or Space. The rest of the round — incident banner removal, the Updated timestamp, related-article links, and consequential wording in the delete/archive paragraphs — does not touch the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/944"
