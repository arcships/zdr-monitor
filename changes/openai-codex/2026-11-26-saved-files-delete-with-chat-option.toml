summary_zh = "help.openai.com/en/articles/8983778 的 Library/Space 删除段改写：旧句「Deleting a chat does not delete a separately saved file. Delete the file from **Library** or **Space** if you also want to remove that saved copy.」变为「When you delete a chat, you may see **Also delete files uploaded or created in this chat**. If the checkbox is selected when you confirm, ChatGPT moves eligible files from that chat, including screenshots, to **Trash**. If you clear the checkbox or don’t see it, files saved separately in **Library** or **Space** stay there. Delete the file from **Library** or **Space** if you also want to remove that saved copy.」。即删除对话不再被描述为「绝不会删到单独保存的文件」，而是多了一个可选的「Also delete files uploaded or created in this chat」勾选框：勾选后把该对话中符合条件的文件（含截图）移入 Trash，不勾选或看不到该选项时单独保存的文件留在原处。这是留存对象与用户删除路径的澄清，没有新增或缩短任何期限；Trash 的清理期限未披露。codex-free、codex-personal 的 retention 字段未变（object=input_output、basis=until_termination），新增留存说明点并绑定新锚点 openai-codex-consumer-saved-files-delete-option，写明该机制及「未量化、由用户主动删除」。对话保存至删除、删除后 30 天永久删除、临时对话最多 30 天、GPT/project 文件、Enterprise/Edu/Healthcare 工作区留存策略、临时文件 48 小时、备份最多再留 30 天均未变。同轮新增导航句「Data controls in ChatGPT explains your options for model training, data export, and account deletion.」并删除 Related articles 列表，与五维无关。"
summary_en = "On help.openai.com/en/articles/8983778 the Library/Space deletion paragraph was rewritten: the old sentence 「Deleting a chat does not delete a separately saved file. Delete the file from **Library** or **Space** if you also want to remove that saved copy.」 became 「When you delete a chat, you may see **Also delete files uploaded or created in this chat**. If the checkbox is selected when you confirm, ChatGPT moves eligible files from that chat, including screenshots, to **Trash**. If you clear the checkbox or don’t see it, files saved separately in **Library** or **Space** stay there. Delete the file from **Library** or **Space** if you also want to remove that saved copy.」. Deleting a chat is no longer described as never deleting a separately saved file; instead there is an optional 「Also delete files uploaded or created in this chat」 checkbox that, when selected, moves eligible files from that chat, including screenshots, to Trash, while separately saved files stay if the box is cleared or absent. This clarifies the retention object and the user-initiated deletion path; no period was added or shortened, and the Trash cleanup period is not disclosed. The retention fields for codex-free and codex-personal are unchanged (object=input_output, basis=until_termination); a retention point was added on both tiers, bound to the new anchor openai-codex-consumer-saved-files-delete-option, recording the mechanism and that it is unquantified and user-initiated. The clauses on chats saved until deletion, permanent deletion within 30 days after deletion, temporary chats up to 30 days, GPT/project files, the Enterprise/Edu/Healthcare workspace retention policy, 48-hour transient files and up to 30 additional days of backups are unchanged. The new navigational sentence 「Data controls in ChatGPT explains your options for model training, data export, and account deletion.」 and the removal of the Related articles list are unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1446"
