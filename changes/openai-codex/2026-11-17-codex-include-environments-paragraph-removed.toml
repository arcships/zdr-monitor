summary_zh = "help.openai.com/en/articles/5722486 与 /7730893 本轮都删除了 Codex 的「Include environments」独立开关段。5722486 的 Codex 小节原句「Codex has a separate **Include environments** setting in Codex settings for allowing training on full environments. Changing your settings in ChatGPT or the Privacy Portal does not change that setting.」替换为「When you use Codex with a personal ChatGPT account, your ChatGPT model-training preference applies to your Codex conversations.」，同页「Either option is sufficient for ChatGPT conversations and Codex tasks.」未变。7730893 的小节由「Manage model training for Codex tasks」改名为「Manage model training for Codex conversations」，原「Codex has a separate **Include environments** setting in Codex settings that controls whether additional context from your Codex environments can be used to train OpenAI models. Changing your ChatGPT setting or opting out through the Privacy Portal does not change that setting.」替换为个人 ChatGPT 账号可在网页端 Settings > Data controls > Improve the model for everyone 查看或修改训练偏好的分步说明，并新增 Business/Enterprise/Edu 默认不用于训练的表述。两页现行正文都不再声明「退出训练不覆盖全环境」这一例外，也不再单独说明全环境如何处理；但条款从页面消失不等于厂商确认该设置已取消，也不代表 ChatGPT 训练偏好或退出训练已覆盖全环境。codex-free、codex-personal 的 training 结论字段未变（mark=no、mode=opt_out）。原锚点 openai-codex-training-include-environments 因引文被删而改绑到新句「your ChatGPT model-training preference applies to your Codex conversations」，锚点 id 改为 openai-codex-personal-preference-applies；两个个人档的说明点收回到「Codex 对话」范围，并新增锚点 openai-codex-data-controls-preference-steps 支撑 Data Controls 路径。方向记为 strengthened：公开文本不再保留该例外。Related articles、Locked chats 措辞、FAQ 标题与时间戳等改动与五维无关。"
summary_en = "This round both help.openai.com/en/articles/5722486 and /7730893 removed Codex's separate 「Include environments」 paragraph. On 5722486 the Codex section sentence 「Codex has a separate **Include environments** setting in Codex settings for allowing training on full environments. Changing your settings in ChatGPT or the Privacy Portal does not change that setting.」 became 「When you use Codex with a personal ChatGPT account, your ChatGPT model-training preference applies to your Codex conversations.」; the same page's 「Either option is sufficient for ChatGPT conversations and Codex tasks.」 is unchanged. On 7730893 the section 「Manage model training for Codex tasks」 was renamed 「Manage model training for Codex conversations」 and its sentence 「Codex has a separate **Include environments** setting in Codex settings that controls whether additional context from your Codex environments can be used to train OpenAI models. Changing your ChatGPT setting or opting out through the Privacy Portal does not change that setting.」 was replaced with step-by-step instructions for a personal ChatGPT account to review or change the training preference on the web under Settings > Data controls > Improve the model for everyone, plus a statement that Business/Enterprise/Edu content is not used for training by default. Neither page now states the exception that opting out does not cover full environments, nor does either page separately describe how full environments are handled; however, a clause disappearing from a page is not confirmation that the setting was withdrawn, and it does not mean the ChatGPT training preference or opting out now covers full environments. The training verdict fields for codex-free and codex-personal are unchanged (mark=no, mode=opt_out). The anchor openai-codex-training-include-environments was rebound from the deleted quote to the new sentence 「your ChatGPT model-training preference applies to your Codex conversations」 and renamed openai-codex-personal-preference-applies; the two individual tiers' explanatory points now stay within the 「Codex conversations」 scope, and a new anchor openai-codex-data-controls-preference-steps supports the Data Controls path. Direction recorded as strengthened because the published text no longer carries that exception. Related-article links, Locked chats wording, the FAQ heading change and timestamps are unrelated to the five dimensions."
