summary_zh = "help.openai.com/en/articles/5722486 重抓后训练章节有两处改写。个人档主句由「When you use our services for individuals, such as ChatGPT and Codex, we may use your content to train our models.」改为「When you use our services for individuals (Free, Plus, Pro), we may use your content to train our models.」：适用范围从点名产品改为列档位；紧接的「Either option is sufficient for ChatGPT conversations and Codex tasks.」未变，Codex 仍被覆盖，因此个人档 training 结论不变（仍 mark=no / mode=opt_out），原锚点改绑到新句并把这两句一起纳入 exact，让 Codex 适用性可被机器核对。FAQ「What if I submit feedback after opting out?」由单段改为分档：个人档（Free/Plus/Pro）保留「即使退出训练，反馈关联的整段对话仍可能用于训练」；新增 Business/Enterprise/Edu「除非组织另签协议，否则不使用 prompts、responses 或文件改进模型，点赞/点踩反馈不构成对关联对话的训练授权」。Business/Enterprise 档 training 结论仍为 mark=yes，主证据仍是 Codex 档位页未变原文；本页企业段只作补充。方向记为 clarified。"
summary_en = "After re-fetching help.openai.com/en/articles/5722486, the training section changed in two places. The individual-services sentence changed from \"When you use our services for individuals, such as ChatGPT and Codex, we may use your content to train our models.\" to \"When you use our services for individuals (Free, Plus, Pro), we may use your content to train our models.\": the scope now names plan levels instead of products. The immediately following sentence, \"Either option is sufficient for ChatGPT conversations and Codex tasks.\", is unchanged, so Codex remains covered; the individual tiers' training verdict is unchanged (still mark=no / mode=opt_out) and the anchor was rebound to the new sentence with both sentences included in `exact`, so Codex applicability is machine-checkable. The FAQ item \"What if I submit feedback after opting out?\" was split by tier: the individual paragraph (Free/Plus/Pro) keeps the rule that, even after opting out, the entire conversation associated with submitted feedback may be used to train models; a new Business/Enterprise/Edu paragraph says OpenAI does not use prompts, responses, or files to improve its models unless the organization has signed a separate agreement, and that thumbs up/down feedback does not permit training on the associated conversation. The Business/Enterprise training verdict remains mark=yes, still anchored to the unchanged Codex plan page; this page's business paragraph is supplementary only. Direction recorded as clarified."
