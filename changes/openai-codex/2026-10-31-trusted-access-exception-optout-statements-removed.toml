summary_zh = "help.openai.com/en/articles/7730893（Data controls in ChatGPT）本轮正文有三处训练相关改动。(1)「Turn off Improve the model for everyone」节删去「When Improve the model for everyone is off, your new conversations won’t be used to train OpenAI models. They can still appear in your chat history.」，页面不再在该节声明退出后新对话不用于训练。(2)「Manage model training for Codex tasks」节删去首段「If you use Codex on a personal ChatGPT plan, Improve the model for everyone also applies to your Codex tasks. Turn it off in ChatGPT, or select Do not train on my content in the Privacy Portal. Either option is sufficient for ChatGPT conversations and Codex tasks. You don’t need to do both. After you opt out, new conversations and tasks won’t be used to train OpenAI models.」，只剩「Include environments」独立开关段。Codex 个人档仍受 ChatGPT 训练开关覆盖：另一官方来源 5722486 现行快照仍有「Either option is sufficient for ChatGPT conversations and Codex tasks.」，Codex 档位页也有「Your ChatGPT training data controls apply to content processed through Codex」，故 codex-free、codex-personal 的 training 结论字段未变（mark=no、mode=opt_out）。(3) 新增「Trusted Access on personal accounts」节：「During Daybreak sessions on your personal account, we may use content from your interactions to improve our models even when “Improve the model for everyone” is off.」即个人账号在 Daybreak 等 Trusted Access 会话期间退出训练也不阻止内容用于改进模型；已补为两个个人档的训练说明点并绑定新锚点 openai-codex-personal-trusted-access-exception。同时删除 FAQ「What happens if I previously opted out through OpenAI Support or a privacy request? / OpenAI continues to honor the opt-out associated with the account.」，页面删除本身不构成撤销承诺。方向记为 weakened。临时会话 30 天删除、留存、ZDR、处理地与角色未变。"
summary_en = "On help.openai.com/en/articles/7730893 (Data controls in ChatGPT) this round made three training-related changes. (1) The 「Turn off Improve the model for everyone」 section removed 「When Improve the model for everyone is off, your new conversations won’t be used to train OpenAI models. They can still appear in your chat history.」, so the page no longer states in that section that new conversations are not used for training after opting out. (2) The 「Manage model training for Codex tasks」 section removed its first paragraph, 「If you use Codex on a personal ChatGPT plan, Improve the model for everyone also applies to your Codex tasks. Turn it off in ChatGPT, or select Do not train on my content in the Privacy Portal. Either option is sufficient for ChatGPT conversations and Codex tasks. You don’t need to do both. After you opt out, new conversations and tasks won’t be used to train OpenAI models.」, leaving only the separate 「Include environments」 paragraph. Codex on personal plans is still covered by the ChatGPT training control: another official source, 5722486, still says 「Either option is sufficient for ChatGPT conversations and Codex tasks.」 in its current snapshot, and the Codex plan page says 「Your ChatGPT training data controls apply to content processed through Codex」, so the training verdict fields for codex-free and codex-personal are unchanged (mark=no, mode=opt_out). (3) A new section, 「Trusted Access on personal accounts」, says 「During Daybreak sessions on your personal account, we may use content from your interactions to improve our models even when “Improve the model for everyone” is off.」 — during Trusted Access sessions such as Daybreak on a personal account, opting out of training does not prevent content from being used to improve models. This is now recorded as a training point on both individual tiers, bound to the new anchor openai-codex-personal-trusted-access-exception. The FAQ 「What happens if I previously opted out through OpenAI Support or a privacy request? / OpenAI continues to honor the opt-out associated with the account.」 was also removed; removing it from the page does not itself revoke the commitment. Direction recorded as weakened. Temporary-chat 30-day deletion, retention, ZDR, processing region and role are unchanged."
