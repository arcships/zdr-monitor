summary_zh = "developers.openai.com/codex/pricing 的 Feature availability 一节新增两段模型可用性说明，其中与五维有关的只有一句：新增「GPT-6.1 Terra is available in Work and Codex on Plus, Pro, Business, Enterprise, and Edu plans. It does not support UAE inference residency.」，为 GPT-6.1 Terra 增加了一条模型级驻留资格限制——该模型在 Plus、Pro、Business、Enterprise、Edu 档可用，但不支持 UAE inference residency。同页 Enterprise 档的「Data retention and data residency controls」与功能矩阵的「Enterprise retention and residency controls」行原文均未改写，页面仍未给出默认处理地，也未列出 Codex 云任务正文的可选区域。因此四个档位的 processing_region 结论字段均未变（codex-free 不在该模型的适用档位内；codex-personal、codex-business、codex-enterprise 仍为 codes=[GLOBAL]），既有锚点原文未动，未改结论或锚点。方向记为 clarified：这是对新增模型驻留适用范围的说明，不是对既有承诺的收紧或放宽。同轮其余改动是模型阵容与定价（GPT-6.1 Sol/Terra、Pro 档位与 credits、token 与速度费率、Sites 可用性）、侧栏与功能矩阵行增删、GPT-5.5 退役措辞，与五维无关。"
summary_en = "The Feature availability section of developers.openai.com/codex/pricing gained two model-availability paragraphs; only one sentence touches the five dimensions: the new 「GPT-6.1 Terra is available in Work and Codex on Plus, Pro, Business, Enterprise, and Edu plans. It does not support UAE inference residency.」 adds a model-level residency eligibility limit — the model is available on Plus, Pro, Business, Enterprise, and Edu plans but does not support UAE inference residency. On the same page the Enterprise bullet 「Data retention and data residency controls」 and the feature-matrix row 「Enterprise retention and residency controls」 are unchanged; the page still does not state the default processing location or list which regions are selectable for Codex cloud-task content. No processing_region verdict field changed on any tier (codex-free is not among the plans for this model; codex-personal, codex-business and codex-enterprise remain codes=[GLOBAL]), and no existing anchor text moved, so no verdict or anchor was modified. Direction recorded as clarified: this scopes residency eligibility for a new model rather than tightening or loosening an existing commitment. The rest of the round is model lineup and pricing (GPT-6.1 Sol/Terra, Pro tiers and credits, token and speed rates, Sites availability), sidebar and feature-matrix row changes, and GPT-5.5 retirement wording, unrelated to the five dimensions."
