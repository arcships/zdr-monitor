summary_zh = "help.openai.com/en/articles/7730893 的 Codex 训练偏好分步说明改写：旧句「If you use Codex with a personal ChatGPT account, you can review or change your model-training preference in ChatGPT on the web: 1. Open **Settings**. 2. Select **Data controls**. 3. Select **Improve the model for everyone** to review or change your preference.」中的第 3 步现为「Select **Improve the model for everyone** to change whether your chats help train the model.」；同页 Web (signed in) 分步说明也改为「Open your profile menu」「Turn off **Improve the model for everyone**」，iOS/Android 与 Signed-out use 仅加粗或删去重复步骤。语义未变：仍是个人 ChatGPT 账号在 Settings > Data controls 用 Improve the model for everyone 改变训练偏好。Trusted Access on personal accounts、Managed workspaces、Business/Enterprise/Edu 默认不用于训练等条款未动，codex-free 与 codex-personal 的 training 字段不变（mark=no、mode=opt_out），锚点 openai-codex-data-controls-preference-steps 的 exact 随新引文改绑。"
summary_en = "On help.openai.com/en/articles/7730893 the Codex training-preference steps were reworded: in the sentence 「If you use Codex with a personal ChatGPT account, you can review or change your model-training preference in ChatGPT on the web: 1. Open **Settings**. 2. Select **Data controls**. 3. Select **Improve the model for everyone** to review or change your preference.」 step 3 now reads 「Select **Improve the model for everyone** to change whether your chats help train the model.」. The Web (signed in) steps also changed to 「Open your profile menu」 and 「Turn off **Improve the model for everyone**」, while iOS/Android and Signed-out use only gained bolding or dropped a duplicated step. The meaning is unchanged: a personal ChatGPT account still changes its training preference under Settings > Data controls via Improve the model for everyone. Trusted Access on personal accounts, Managed workspaces and the default no-training statement for Business/Enterprise/Edu are untouched; the training fields for codex-free and codex-personal are unchanged (mark=no, mode=opt_out), and the exact text of anchor openai-codex-data-controls-preference-steps was rebound to the new quote."
