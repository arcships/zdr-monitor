summary_zh = "data-privacy 页与 abuse-monitoring 页同时新增同文小节《What’s changing with Modified Abuse Monitoring》：「Modified Abuse Monitoring will continue to apply to models made available before November 1, 2026 for customers with an existing approval, with no change to the functionality provided under that approval.」但「For models made available on or after November 1, 2026, Modified Abuse Monitoring will no longer be available, beginning on a future date to be announced. From that date, these models will be subject to Microsoft’s updated approach to data retention, access, and safety monitoring, including for customers with an existing Modified Abuse Monitoring approval. Customers will receive at least 30 days’ notice before Modified Abuse Monitoring becomes unavailable for a given model.」即 by_agreement 的零保留机制对 2026-11-01 及之后发布的模型将在另行公布的日期停止提供，此后即使客户已有获批也改按未说明具体内容的『更新后的数据保留、访问与安全监测做法』处理。此前两页只写获批后的 data storage 与 human review 不进行，未给出停止提供的计划。api 档结论字段不变（zdr mark=yes / mode=by_agreement；retention object=mixed / basis=as_needed），但 zdr 与 retention 各新增一条范围说明：该豁免仅对 2026-11-01 之前发布且已有获批的模型继续适用，对新模型不再有可推定的零保留承诺。"
summary_en = "The data-privacy page and the abuse-monitoring page both added the same new subsection, 'What’s changing with Modified Abuse Monitoring': 'Modified Abuse Monitoring will continue to apply to models made available before November 1, 2026 for customers with an existing approval, with no change to the functionality provided under that approval.' But 'For models made available on or after November 1, 2026, Modified Abuse Monitoring will no longer be available, beginning on a future date to be announced. From that date, these models will be subject to Microsoft’s updated approach to data retention, access, and safety monitoring, including for customers with an existing Modified Abuse Monitoring approval. Customers will receive at least 30 days’ notice before Modified Abuse Monitoring becomes unavailable for a given model.' That is, the by-agreement zero-retention mechanism will be withdrawn for models made available on or after November 1, 2026 on a future date to be announced, after which those models fall under Microsoft's unspecified 'updated approach to data retention, access, and safety monitoring' even for customers with an existing approval. Previously the two pages only stated that data storage and human review are not performed once approved, with no plan to withdraw the option. The API tier's verdict fields are unchanged (zdr mark=yes / mode=by_agreement; retention object=mixed / basis=as_needed), but one scope point was added to each of zdr and retention: the exemption continues only for models made available before November 1, 2026 with an existing approval, and no zero-retention commitment can be assumed for newer models."
issue = "https://github.com/arcships/zdr-monitor/issues/1292"
