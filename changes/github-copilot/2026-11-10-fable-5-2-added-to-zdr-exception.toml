summary_zh = "快照 PR #1155 更新了 docs《Hosting of models for GitHub Copilot》的 Anthropic models 一节：模型列表新增 Claude Fable 5.2，并把 Fable 例外/限时 ZDR 豁免的全部相关句子由「Claude Fable 5 or Claude Fable 5.1」改为「Claude Fable 5, Claude Fable 5.1, or Claude Fable 5.2」。具体包括：(1) 默认保留句由「When Claude Fable 5 or Claude Fable 5.1 is used, Anthropic retains data, including prompts and outputs, by default to operate safety classifiers that detect harmful use.」改为「When Claude Fable 5, Claude Fable 5.1, or Claude Fable 5.2 is used, ...」；(2) 限时 ZDR 申请句与「An enterprise that has been approved and configured for this type of access, ... requests will use the ZDR endpoint through the end of 2026」均加入 Fable 5.2；(3) 显式启用句改为「Approval for access does not automatically enable Claude Fable 5, Claude Fable 5.1, or Claude Fable 5.2.」；(4) ZDR 覆盖句由「Other Claude models, except for Claude Fable 5 and Claude Fable 5.1, continue to operate under ZDR.」改为「Other Claude models, except for Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, continue to operate under ZDR.」；(5) Anthropic PBC 一跳的例外句同步加入 Fable 5.2。方向记为 weakened：ZDR 的例外集合从 5 / 5.1 扩到 5 / 5.1 / 5.2，新上架的 Fable 5.2 默认由 Anthropic 保留 prompts 与 outputs；既有模型的待遇未变。结论字段均未改：consumer / free 的 zdr 仍为 unknown，business / enterprise / upstream 的 zdr 仍为 yes / default；retention 的 object / basis / days 均未动。落地改动：更新 ghcopilot-model-hosting-anthropic-zdr-except-fable 的 exact，更新 ghcopilot-model-hosting-anthropic-fable-retains 的 exact、prefix 与 suffix，更新 ghcopilot-model-hosting-anthropic-preview-not-covered 的 prefix；并把 consumer / business / enterprise / upstream 中描述 Fable 例外的依据文本同步为 5 / 5.1 / 5.2。"
summary_en = "Snapshot PR #1155 updated the Anthropic models section of the docs page 'Hosting of models for GitHub Copilot': the model list gained Claude Fable 5.2, and every Fable exception / time-bound ZDR exemption sentence changed from 'Claude Fable 5 or Claude Fable 5.1' to 'Claude Fable 5, Claude Fable 5.1, or Claude Fable 5.2'. Specifically: (1) the default-retention sentence changed from 'When Claude Fable 5 or Claude Fable 5.1 is used, Anthropic retains data, including prompts and outputs, by default to operate safety classifiers that detect harmful use.' to 'When Claude Fable 5, Claude Fable 5.1, or Claude Fable 5.2 is used, ...'; (2) the ZDR request sentence and the approved-and-configured enterprise sentence now include Fable 5.2; (3) the enablement sentence now reads 'Approval for access does not automatically enable Claude Fable 5, Claude Fable 5.1, or Claude Fable 5.2.'; (4) the ZDR coverage sentence changed from 'Other Claude models, except for Claude Fable 5 and Claude Fable 5.1, continue to operate under ZDR.' to 'Other Claude models, except for Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, continue to operate under ZDR.'; (5) the Anthropic PBC hop's exception sentence likewise adds Fable 5.2. The direction is recorded as weakened: the ZDR exception set grows from 5 / 5.1 to 5 / 5.1 / 5.2, and the newly listed Fable 5.2 retains prompts and outputs at Anthropic by default, while existing models' treatment is unchanged. No verdict field changed: zdr remains unknown on consumer and free and yes / default on business, enterprise and upstream; retention object / basis / days are untouched. Changes made: the exact of ghcopilot-model-hosting-anthropic-zdr-except-fable, the exact, prefix and suffix of ghcopilot-model-hosting-anthropic-fable-retains, and the prefix of ghcopilot-model-hosting-anthropic-preview-not-covered were updated; the evidence prose describing the Fable exception on consumer, business, enterprise and upstream was synced to 5 / 5.1 / 5.2."
