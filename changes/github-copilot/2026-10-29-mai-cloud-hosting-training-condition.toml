summary_zh = "docs《Hosting of models for GitHub Copilot》的 Microsoft models 一节把 MAI-Code-1.1-Flash 改名为 MAI Code 1.1 Flash，新增本地托管句「This model can also be hosted locally on a user's own machine, if the GPU and memory requirements are met.」，并把训练段拆开改写：商业档句「GitHub does not use Copilot Business or Copilot Enterprise customer data to train AI models.」独立成句，个人订阅档句改为「When the model is cloud hosted, GitHub may use Copilot interaction data for individual subscribers—that is, users on Copilot Free, Copilot Pro, Copilot Pro+, and Copilot Max plans—to train and improve AI models…」，即该模型的个人档训练授权只对云托管路径成立；本地路径页面未写训练授权，也未说明数据处理。该段的 Azure AI Foundry 托管与数据处理句、内容过滤句也分别加上「When cloud hosted」/「When MAI Code 1.1 Flash is cloud hosted」限定，并新增本地托管可能不适用同一套安全过滤的提示。Moonshot AI models 一节另新增一段沿用改动前旧句式的文字，没有任何托管限定：「GitHub does not use Copilot Business or Copilot Enterprise customer data to train AI models. For individual subscribers—Copilot Free, Copilot Pro, Copilot Pro+, and Copilot Max users—GitHub may use Copilot interaction data, including prompts (inputs), suggestions (outputs), and code snippets generated during Copilot sessions to train and improve AI models…」。因此云托管条件只加在 Microsoft 段，Moonshot 段仍是无条件授权，两者不是同一条规则，不能把整页个人档训练读成统一收窄为云托管。五个维度的结论字段（mark/mode/basis/days/object/codes/kind）均不变：consumer 与 free 的 training 仍是 no/opt_out，business、enterprise、upstream 的 training 仍是 yes/by_contract；processing_region 的 codes 与 retention 的 days/object/basis 未动。落地改动：更新 ghcopilot-model-hosting-biz-no-training、ghcopilot-model-hosting-individual-may-train、ghcopilot-model-hosting-individual-optout、ghcopilot-model-hosting-mai-azure-tenant、ghcopilot-model-hosting-kimi-no-train 五个锚点以匹配新句/新模型名并修正上下文；新增 ghcopilot-model-hosting-moonshot-individual-may-train、ghcopilot-model-hosting-mai-local、ghcopilot-model-hosting-mai-azure-data-handling 三个锚点；在 consumer 与 free 的 training 各补两条依据（Microsoft 段的云托管条件、Moonshot 段的无条件授权），在 business 与 enterprise 的 retention 各补一条 MAI 云托管/本地路径的数据处理限定，在 enterprise 与 upstream 的 processing_region 补上本地托管路径并把原有「上游托管方」表述限定为云托管路径。同一次抓取还增删了模型名（OpenAI 列表删去 GPT-5 mini、GPT-5.4、GPT-5.4 mini、GPT-5.5 并新增 GPT-6.1 Terra，Google 列表删去 Gemini 3.7 Flash），与五个维度无关，不单独记录。"
summary_en = "The Microsoft models section of the docs page 'Hosting of models for GitHub Copilot' renamed MAI-Code-1.1-Flash to MAI Code 1.1 Flash and added a local-hosting sentence — 'This model can also be hosted locally on a user's own machine, if the GPU and memory requirements are met.' — and split and rewrote the training paragraph: the business sentence 'GitHub does not use Copilot Business or Copilot Enterprise customer data to train AI models.' now stands alone, and the individual-subscriber sentence reads 'When the model is cloud hosted, GitHub may use Copilot interaction data for individual subscribers—that is, users on Copilot Free, Copilot Pro, Copilot Pro+, and Copilot Max plans—to train and improve AI models…'. For this Microsoft model the individual-tier training permission therefore holds only for the cloud-hosted path; the page states no training permission and no data-handling detail for the local path. The Azure AI Foundry hosting/data-handling sentence and the content-filter sentence in the same section also gained 'When cloud hosted' / 'When MAI Code 1.1 Flash is cloud hosted' qualifiers, plus a new note that a locally hosted copy may not use the same safety filters. The Moonshot AI models section separately gained a paragraph in the older wording, with no hosting condition — 'GitHub does not use Copilot Business or Copilot Enterprise customer data to train AI models. For individual subscribers—Copilot Free, Copilot Pro, Copilot Pro+, and Copilot Max users—GitHub may use Copilot interaction data, including prompts (inputs), suggestions (outputs), and code snippets generated during Copilot sessions to train and improve AI models…'. The cloud-hosting condition is therefore added only in the Microsoft section while the Moonshot section remains unconditional; the two are not the same rule, and the page must not be read as narrowing individual-tier training to cloud hosting across the board. No verdict field changed on any tier (mark/mode/basis/days/object/codes/kind): training remains no/opt_out on consumer and free and yes/by_contract on business, enterprise and upstream, and processing_region codes and retention days/object/basis are untouched. Changes made: five anchors — ghcopilot-model-hosting-biz-no-training, ghcopilot-model-hosting-individual-may-train, ghcopilot-model-hosting-individual-optout, ghcopilot-model-hosting-mai-azure-tenant and ghcopilot-model-hosting-kimi-no-train — were updated for the new sentences and model name and for accurate surrounding context; three new anchors were added (ghcopilot-model-hosting-moonshot-individual-may-train, ghcopilot-model-hosting-mai-local and ghcopilot-model-hosting-mai-azure-data-handling); two points were added to training on consumer and free (the Microsoft-section cloud-hosting condition and the unconditional Moonshot-section permission), one MAI cloud/local data-handling point was added to retention on business and enterprise, and the local-hosting path was added to processing_region on enterprise and upstream while the earlier 'upstream host' statements were scoped to the cloud-hosting path. The same fetch also changed model lists (OpenAI removed GPT-5 mini, GPT-5.4, GPT-5.4 mini and GPT-5.5 and added GPT-6.1 Terra; Google removed Gemini 3.7 Flash), which does not touch the five dimensions and is not recorded separately."
