summary_zh = "快照 PR #1307 更新了 docs《Hosting of models for GitHub Copilot》的 Microsoft models 一节：模型列表在 MAI Code 1.1 Flash 之外新增 MAI Code 2 与 MAI Code 2 Flash，并把原先单模型的三句改写为通用句，使这些承诺明确覆盖三个模型：(1) 托管句由「MAI Code 1.1 Flash is a first-party Microsoft model hosted on Azure in GitHub's tenant.」改为「These models are first-party Microsoft models hosted on Azure in GitHub's tenant.」；(2) 个人订阅档训练句由「When the model is cloud hosted, GitHub may use Copilot interaction data for individual subscribers—that is, users on Copilot Free, Copilot Pro, Copilot Pro+, and Copilot Max plans—to train and improve AI models…」改为「When these models are cloud hosted, …」，云托管条件本身不变，只是授权范围随通用句扩到三个模型；(3) Azure AI Foundry 数据处理句由「When cloud hosted, MAI Code 1.1 Flash is served on Microsoft Azure AI Foundry within GitHub's tenant…」改为「When cloud hosted, these models are served on Microsoft Azure AI Foundry within GitHub's tenant…」，处理、保留与安全指向 Microsoft Foundry 文档的范围同步扩大。本地托管句则由「This model can also be hosted locally on a user's own machine, if the GPU and memory requirements are met.」改为「MAI Code 1.1 Flash can also be hosted locally on a user's own machine…」，即本地路径只保留给 MAI Code 1.1 Flash，新增的 MAI Code 2 / MAI Code 2 Flash 没有本地托管句；内容过滤句也由「When MAI Code 1.1 Flash is cloud hosted」改为「When these models are cloud hosted」，本地托管的过滤例外仍只点名 MAI Code 1.1 Flash。商业档不训练句「GitHub does not use Copilot Business or Copilot Enterprise customer data to train AI models.」逐字未变。五个维度的结论字段（mark/mode/basis/days/object/codes/kind）均不变：consumer 与 free 的 training 仍是 no/opt_out，business、enterprise、upstream 的 training 仍是 yes/by_contract，zdr、retention 与 processing_region 的字段未动。落地改动：更新 ghcopilot-model-hosting-biz-no-training 的 prefix 与 suffix（该句在页面上同时出现在 Microsoft 与 Moonshot 两节，需用新上下文唯一定位），更新 ghcopilot-model-hosting-individual-may-train 的 exact，更新 ghcopilot-model-hosting-mai-azure-tenant、ghcopilot-model-hosting-mai-local、ghcopilot-model-hosting-mai-azure-data-handling 三个锚点，并同步 consumer、free、business、enterprise、upstream 中引用这些句子的依据文本与来源 note。同一次抓取还增删了模型名（OpenAI 删去 GPT-5.6 Terra 并新增 GPT-6.2 Astra、GPT-6.2 Sol；Anthropic 删去 Claude Opus 5；Google 新增 Gemini 4 Carbon、Gemini 4 Hydrogen），与五个维度无关，不单独记录。"
summary_en = "Snapshot PR #1307 updated the Microsoft models section of the docs page 'Hosting of models for GitHub Copilot': the model list now adds MAI Code 2 and MAI Code 2 Flash alongside MAI Code 1.1 Flash, and three previously model-specific sentences were generalized so the commitments expressly cover all three models. (1) The hosting sentence changed from 'MAI Code 1.1 Flash is a first-party Microsoft model hosted on Azure in GitHub's tenant.' to 'These models are first-party Microsoft models hosted on Azure in GitHub's tenant.' (2) The individual-subscriber training sentence changed from 'When the model is cloud hosted, GitHub may use Copilot interaction data for individual subscribers—that is, users on Copilot Free, Copilot Pro, Copilot Pro+, and Copilot Max plans—to train and improve AI models…' to 'When these models are cloud hosted, …'; the cloud-hosting condition is unchanged, but the permission's scope now follows the generalized sentence to all three models. (3) The Azure AI Foundry data-handling sentence changed from 'When cloud hosted, MAI Code 1.1 Flash is served on Microsoft Azure AI Foundry within GitHub's tenant…' to 'When cloud hosted, these models are served on Microsoft Azure AI Foundry within GitHub's tenant…', extending the reference to Microsoft's Foundry documentation for processing, retention and security to the three models. The local-hosting sentence changed from 'This model can also be hosted locally on a user's own machine, if the GPU and memory requirements are met.' to 'MAI Code 1.1 Flash can also be hosted locally on a user's own machine…', so the local path now names MAI Code 1.1 Flash only and the newly listed MAI Code 2 / MAI Code 2 Flash have no local-hosting sentence. The content-filter sentence likewise changed from 'When MAI Code 1.1 Flash is cloud hosted' to 'When these models are cloud hosted', while the locally-hosted filter caveat still names MAI Code 1.1 Flash only. The business non-training sentence 'GitHub does not use Copilot Business or Copilot Enterprise customer data to train AI models.' is word-for-word unchanged. No verdict field changed on any tier (mark/mode/basis/days/object/codes/kind): training remains no/opt_out on consumer and free and yes/by_contract on business, enterprise and upstream; zdr, retention and processing_region fields are untouched. Changes made: the prefix and suffix of ghcopilot-model-hosting-biz-no-training were updated (the sentence appears in both the Microsoft and Moonshot sections, so the new context is needed to disambiguate it), the exact of ghcopilot-model-hosting-individual-may-train was updated, the anchors ghcopilot-model-hosting-mai-azure-tenant, ghcopilot-model-hosting-mai-local and ghcopilot-model-hosting-mai-azure-data-handling were updated, and the evidence prose quoting these sentences on consumer, free, business, enterprise and upstream plus the source note were synced. The same fetch also changed model lists (OpenAI removed GPT-5.6 Terra and added GPT-6.2 Astra and GPT-6.2 Sol; Anthropic removed Claude Opus 5; Google added Gemini 4 Carbon and Gemini 4 Hydrogen), which does not touch the five dimensions and is not recorded separately."
