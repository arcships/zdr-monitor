summary_zh = "docs《Hosting of models for GitHub Copilot》的 Google models 一节改写了缓存句：原「To provide better service quality and reduce latency, GitHub uses prompt caching.」改为「To provide better service quality and reduce latency, GitHub uses Google's Durable Caching. Cached data is encrypted and held for up to 24 hours. Cached data is never used to train or fine-tune models.」。厂商首次给出 Gemini 路径缓存对象的保留上限（24 小时），并新增缓存层不训练的明文承诺；请求正文的保留期仍未披露。Anthropic models 一节的 prompt caching 句未变，仍指向 Anthropic PBC、Amazon Bedrock 与 Google Cloud 三跳，因此 24 小时上限只适用于 Google models 一节的 Gemini，不能外推到 Anthropic-on-GCP，后者的缓存保留期仍未披露。所有档位的结论字段（mark/mode/basis/days/object/codes/kind）均不变：business / enterprise 的 retention 仍是默认 28 天上限、object=mixed，upstream 的 retention 仍是 basis=undisclosed，training 仍是 yes/by_contract。落地改动：新增锚点 ghcopilot-model-hosting-google-durable-caching-24h，并在 business / enterprise / upstream 的 retention 与 upstream 的 training 各补一条带锚点依据；同时把原先笼统写「GCP/Gemini 与 prompt caching 保留期未披露」的表述改为区分请求正文与缓存对象。同一次抓取还新增了 Claude Haiku 5.5、Gemini 4 Argon 两个模型名并清理了面包屑文案，与五个维度无关，不单独记录。"
summary_en = "The Google models section of the docs page 'Hosting of models for GitHub Copilot' rewrote its caching sentence: 'To provide better service quality and reduce latency, GitHub uses prompt caching.' became 'To provide better service quality and reduce latency, GitHub uses Google's Durable Caching. Cached data is encrypted and held for up to 24 hours. Cached data is never used to train or fine-tune models.' For the first time GitHub gives an upper bound on retention of the cache object on the Gemini path (24 hours) and adds an express no-training commitment for cached data; the retention period for request bodies is still not disclosed. The prompt caching sentence in the Anthropic models section is unchanged and still points to three hops — Anthropic PBC, Amazon Bedrock and Google Cloud — so the 24-hour ceiling applies only to Gemini in the Google models section and cannot be extrapolated to Anthropic-on-GCP, whose cache retention remains undisclosed. No verdict field changed on any tier (mark/mode/basis/days/object/codes/kind): business and enterprise retention remain a 28-day default ceiling with object=mixed, upstream retention remains basis=undisclosed, and training remains yes/by_contract. Changes made: a new anchor ghcopilot-model-hosting-google-durable-caching-24h, one anchored point added to retention on the business, enterprise and upstream tiers and to training on the upstream tier, and the earlier blanket statements that 'GCP/Gemini and prompt caching retention is undisclosed' now distinguish request bodies from the cache object. The same fetch also added the model names Claude Haiku 5.5 and Gemini 4 Argon and cleaned up breadcrumb text; neither touches the five dimensions and they are not recorded separately."
issue = "https://github.com/arcships/zdr-monitor/issues/652"
