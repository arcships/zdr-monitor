summary_zh = "docs《Hosting of models for GitHub Copilot》的 Moonshot AI models 一节移除 Kimi K2.7 Code：删去「Kimi K2.7 Code is hosted on Azure AI Foundry infrastructure managed by GitHub and Microsoft.」，两条上游承诺句由覆盖两家托管方改写为只覆盖 Fireworks AI 上的 Kimi K3——「Both models are covered by zero data retention agreements with the hosting providers. Fireworks AI and Azure AI Foundry do not use prompts or completions to train models, and prompts and completions are not sent to Moonshot AI.」→「Kimi K3 is covered by a zero data retention agreement with the hosting provider. Fireworks AI does not use prompts or completions to train models, and prompts and completions are not sent to Moonshot AI.」。剩下的 Kimi K3 仍有 ZDR 协议、托管方不训练、不发给 Moonshot AI，承诺内容不变，只是适用范围随模型下架收窄到一家托管方。business / enterprise / upstream 各档 training、zdr、retention 的结论字段均不变，只把 Kimi 相关依据点和两条锚点改绑到新句。Azure AI Foundry 仍是 MAI-Code-1.1-Flash 的托管方，不受影响。"
summary_en = "The Moonshot AI models section of the docs page 'Hosting of models for GitHub Copilot' dropped Kimi K2.7 Code: the sentence 'Kimi K2.7 Code is hosted on Azure AI Foundry infrastructure managed by GitHub and Microsoft.' was removed, and the two upstream-commitment sentences were rewritten from covering two hosting providers to covering only Kimi K3 on Fireworks AI — 'Both models are covered by zero data retention agreements with the hosting providers. Fireworks AI and Azure AI Foundry do not use prompts or completions to train models, and prompts and completions are not sent to Moonshot AI.' became 'Kimi K3 is covered by a zero data retention agreement with the hosting provider. Fireworks AI does not use prompts or completions to train models, and prompts and completions are not sent to Moonshot AI.' The remaining Kimi K3 keeps the ZDR agreement, the no-training commitment from the host, and the no-sharing-with-Moonshot commitment, so the substance is unchanged; only the scope narrows to one host as the model is withdrawn. No verdict field changed for training, zdr, or retention on the business, enterprise, or upstream tiers; only the Kimi points and their two anchors were rebound to the new sentences. Azure AI Foundry remains the host for MAI-Code-1.1-Flash and is unaffected."
issue = "https://github.com/arcships/zdr-monitor/issues/469"
