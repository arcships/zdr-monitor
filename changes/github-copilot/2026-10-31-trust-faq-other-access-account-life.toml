summary_zh = "快照 PR #959 改写了 Trust Center FAQ 中「How long does GitHub retain Copilot data for Business and Enterprise customers?」一段。三处与 retention 有关：(1) IDE 路径标题由「Access through IDE for Chat, Code Completions, and Copilot CLI:」改为「Access through IDE for Chat, Code Completions, Copilot App, and Copilot CLI:」，把 Copilot App 并入「Inputs and Outputs: Not retained by default」的路径；(2)「Other GitHub Copilot access and use」的输入输出由「Retained for up to 28 days by default」改为「Retained for the life of the account」，同段例外句由「GitHub may retain input and output data beyond this period, or enable retention where it would not otherwise occur…」删去「beyond this period」，改为「GitHub may enable retention where it would not otherwise occur…」；(3) 删去「Copilot Coding Agent: Session logs are retained for the life of the account in order to provide the service.」这一单列句。同一段内 User Engagement Data 两年、Feedback Data 按目的所需、Copilot Vision 48 小时/被标记 30 天均未变，仅去掉了列表项前的「>」引用符号。结论影响：business 与 enterprise 的 retention 由 days=28、basis=fixed_period、object=mixed 改为 basis=until_termination、object=mixed（days 移除），因为其他访问路径已无 28 天上限而改为留至账户存续；IDE 路径仍默认不留存。training、zdr、processing_region、role 不受影响。consumer 与 free 中用作对照的商业档说明随之改写，但这两档自身条款未变。"
summary_en = "Snapshot PR #959 rewrote the Trust Center FAQ answer to 'How long does GitHub retain Copilot data for Business and Enterprise customers?'. Three retention-related changes: (1) the IDE-path heading 'Access through IDE for Chat, Code Completions, and Copilot CLI:' became 'Access through IDE for Chat, Code Completions, Copilot App, and Copilot CLI:', adding Copilot App to the path whose 'Inputs and Outputs: Not retained by default'; (2) under 'Other GitHub Copilot access and use' the inputs and outputs line changed from 'Retained for up to 28 days by default' to 'Retained for the life of the account', and the exception sentence dropped 'beyond this period', becoming 'GitHub may enable retention where it would not otherwise occur…' instead of 'GitHub may retain input and output data beyond this period, or enable retention where it would not otherwise occur…'; (3) the standalone bullet 'Copilot Coding Agent: Session logs are retained for the life of the account in order to provide the service.' was removed. Within the same paragraph, User Engagement Data (two years), Feedback Data (as long as needed for its intended purpose) and Copilot Vision (48 hours, 30 days when flagged) are unchanged; only the '>' list markers were dropped. Conclusion impact: retention on the business and enterprise tiers moves from days=28, basis=fixed_period, object=mixed to basis=until_termination, object=mixed (days removed), because the other-access path no longer has a 28-day ceiling and is retained for the life of the account, while the IDE path is still not retained by default. training, zdr, processing_region and role are unaffected. The cross-reference text in consumer and free that cited the commercial-tier figures was updated accordingly, though those tiers' own terms did not change."
issue = "https://github.com/arcships/zdr-monitor/issues/962"
