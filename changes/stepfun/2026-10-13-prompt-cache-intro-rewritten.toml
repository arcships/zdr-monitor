summary_zh = "开发者文档《Prompt 缓存最佳实践》开头段改写：旧句『阶跃星辰为开发者提供了上下文缓存技术，将每次请求过程中的输入进行缓存，当开发者重复请求时，将会自动命中缓存，帮助开发者提升推理速度（在特定场景，推理首字速度最大可提升90%），降低推理成本』被改为『Prompt 缓存可复用请求中的重复前缀。缓存命中的输入 Token 按对应模型的缓存命中单价计费，单价见 API 定价。』，同段原有的 step-5-preview 单价示例（0.35 元 / 1M tokens，为未命中价的 5%）与 FAQ 中同口径的折扣句一并删除。改版同时调整了左侧导航条目（『开发指南/平台指南/Step Plan/Step Code/API 文档』改为『请求与上下文/首页/模型/使用指南/开发指南/Step Code/Step Plan/API 参考/更新与公告』），与五个维度无关。页内与保留相关的其余条款文字均未变：『当请求超过 256 个 Token 时，缓存会自动启用。』、未命中时『系统将会进行正常的推理并在处理完成后，将 Prompt 前缀进行缓存，以供下次请求使用。』、『完整的对话数组会进入到缓存系统当中，其中包含 System Prompt、User Message 以及 Assistant Message』以及图片/视频/工具调用信息同列、LRU 淘汰、『目前不提供手动清除缓存的能力』。因此 retention（object=mixed、basis=as_needed）与 zdr（mark=no）的结论字段均未变；只因旧引文『将每次请求过程中的输入进行缓存』被删，把 zdr 主锚点改绑到同页仍在的缓存机制句，并同步修正 zdr 依据的文字。方向记为 clarified。"
summary_en = "The opening paragraph of the developer doc 'Prompt Cache Best Practices' was rewritten: the old wording that StepFun provides context-caching technology and '将每次请求过程中的输入进行缓存' (caches the input of each request), with automatic cache hits on repeated requests, faster first-token generation (up to 90% in certain scenarios) and lower cost, was replaced by 'Prompt 缓存可复用请求中的重复前缀' (prompt caching reuses the repeated prefix in a request) plus a price statement. The step-5-preview price example in the same paragraph (0.35 CNY / 1M tokens, 5% of the miss price) and the matching discount sentence in the FAQ were removed at the same time. The revision also reshuffled the left navigation ('开发指南/平台指南/Step Plan/Step Code/API 文档' became '请求与上下文/首页/模型/使用指南/开发指南/Step Code/Step Plan/API 参考/更新与公告'), which is unrelated to the five dimensions. Every other retention-related sentence on the page is textually unchanged: automatic caching above 256 tokens, the miss path caching the prompt prefix after processing for the next request, the complete conversation array (System Prompt, User Message, Assistant Message) together with images, videos and tool-call information/results, LRU eviction, and no manual cache purge. The verdict fields for retention (object=mixed, basis=as_needed) and zdr (mark=no) are therefore unchanged; only the old quoted sentence was deleted, so the zdr primary anchor was rebound to the cache-mechanism sentence still present on the same page, and the zdr rationale wording was updated to match. Direction recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/628"
