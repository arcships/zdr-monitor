summary_zh = "《StepFun 开放平台隐私政策》生效日期由 2026-05-25 改为 2026-09-28（用户协议同日改版）。隐私政策正文新增『一.2 实名认证服务』（收集姓名、身份证号并交委托的实名认证合作方核验，含人脸信息）与『一.6 套餐兑换、充值、支付与发票管理』，并把『一.1 头像昵称』『六.3 更正』的主语由 AI Studio 平台扩为『本平台』；因新增一.2 整段，原一.2~一.12 顺延为一.3~一.13（三.5 的交叉引用同步由『第一条第9款』改为『第10款』）。与五个维度直接相关的是『三.2 委托处理』受托事项清单末尾新增『实名认证服务』：原句结束后为『……数据库存储服务、短信发送服务、内容安全审核服务。』，新版改为『……短信发送服务、内容安全审核服务、实名认证服务。』，这正是 role 与 processing_region 的锚点句。三.2 仍未写受托方名称与所在地，四.1 境内存储、四.2 保留/删除、用户协议里各维度条款文字均未变，故 role（kind=controller）与 processing_region（codes=[CN]、受托方所在地未披露）的判定值未变，只把依据条目补上新增事项、锚点扩到含『实名认证服务』的完整句。用户协议仅重排编号（1.→1.1/1.1.1、2.1.3、3.6、5.3、5.4、6.5 等）并更新生效日期，条款文字未变，与五维无关；一.1/六.3 的主语扩写、输入形式『录音』改『音频』、套餐兑换/充值/支付/发票等新增段落亦与五维无关。"
summary_en = "The effective date of the StepFun Open Platform Privacy Policy moved from 2026-05-25 to 2026-09-28 (the User Agreement was re-versioned the same day). The privacy policy gained a new Section 1.2 'Real-name authentication services' (collecting name and ID number and passing them to an entrusted authentication partner, including facial information) and a new Section 1.6 on package redemption, top-up, payment and invoicing, and broadened the subject of the '1.1 avatar/nickname' and '6.3 correction' clauses from the AI Studio platform to 'this platform'; because the new 1.2 section was inserted, the former sections 1.2-1.12 shifted to 1.3-1.13 (the cross-reference in 3.5 changed from 'paragraph 9 of Article 1' to 'paragraph 10'). The change directly relevant to the five dimensions is that the entrusted-tasks list in Section 3.2 'Entrusted processing' gained 'real-name authentication services' at its end: the old sentence ended '...database storage, SMS sending, content-safety review.', and the new version reads '...SMS sending, content-safety review, real-name authentication services.'; this is exactly the sentence anchored for role and processing_region. Section 3.2 still names neither the partners nor their locations, and the Section 4.1 in-China storage wording, the Section 4.2 retention/deletion wording and every dimension-relevant clause of the User Agreement are textually unchanged, so the verdict values for role (kind=controller) and processing_region (codes=[CN], entrusted-partner locations undisclosed) are unchanged; only the supporting points were updated to include the new item and the anchor was extended to the full sentence containing 'real-name authentication services'. The User Agreement change is renumbering only (1. to 1.1/1.1.1, 2.1.3, 3.6, 5.3, 5.4, 6.5, etc.) plus the effective date - no clause text changed, unrelated to the five dimensions; likewise the subject-wording broadening in 1.1/6.3, the input-form 'recording' to 'audio' edit, and the new package-redemption/top-up/payment/invoicing passages are unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/490"
