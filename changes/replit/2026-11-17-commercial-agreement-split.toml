summary_zh = "Replit 把原来的 Commercial Agreement 拆成 Replit Pro Agreement 与 Replit Enterprise Agreement 两份并分别指向：Terms of Service 首部从「If you use our Pro or Enterprise Service, the Replit Commercial Agreement will apply」改为「If you use Replit Pro, the Replit Pro Agreement governs ... If you use Replit Enterprise, the Replit Enterprise Agreement governs」，DPA 前言也从「incorporated into the Replit Commercial Agreement」改为「incorporated into the applicable Replit Pro Agreement or Replit Enterprise Agreement」。档位分流与角色结论不变：Pro 与 Enterprise 仍通过各自协议受 DPA 覆盖（processor），免费档与 Core 仍未被 DPA 覆盖（role 未公开界定）。"
summary_en = "Replit split the former Commercial Agreement into a Replit Pro Agreement and a Replit Enterprise Agreement. The Terms of Service preamble changed from 'If you use our Pro or Enterprise Service, the Replit Commercial Agreement will apply' to 'If you use Replit Pro, the Replit Pro Agreement governs ... If you use Replit Enterprise, the Replit Enterprise Agreement governs', and the DPA preamble changed from 'incorporated into the Replit Commercial Agreement' to 'incorporated into the applicable Replit Pro Agreement or Replit Enterprise Agreement'. The tier split and role conclusions are unchanged: Pro and Enterprise remain covered by the DPA through their respective agreements (processor), while the free tier and Core remain outside the DPA (role not publicly designated)."
issue = "https://github.com/arcships/zdr-monitor/issues/1273"
