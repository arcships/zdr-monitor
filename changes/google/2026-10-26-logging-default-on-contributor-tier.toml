summary_zh = "docs/logs-policy 的两处改动收紧了对用户有利的一面。其一，日志从「项目所有者自行 opt-in」改为默认开启：原文「As a project owner you have the choice to opt-in to logging of Gemini API calls」改为「Logging is on by default for Interactions API calls, and for Generate Content API calls in projects created on or after October 26, 2026」，并写明可随时在 AI Studio 的 Logs and Datasets 页面开关。默认 55 天（可调 7/14/28/55）的保留期因此默认适用，不再以项目所有者主动开启为前提；「By default ... prompts and responses within logs are not used for product improvement or development」与分享 dataset 的 opt-in 条款未改，api 档 training 的合同结论仍为不用于改进。zdr 仍可达成（页面写明可随时关闭日志），但默认配置下多了一层需主动关闭的保留面，且 ZDR 专页本身没有列出这项日志。其二，新增邀请制 private preview「Gemini API Contributor Tier」：开启后参与模型的数据按 Unpaid Services 条款处理，页面明写「your data will be used to improve Google products and machine learning technologies」，并以最高 50% 的 token 费用折扣换取数据使用许可。这是项目级的新 opt-in 训练路径，故 training 维度记 weakened；现有结论字段（api-paid training=yes、zdr=yes/opt_in、retention=55 天/logs/fixed_period）未变，只是补充了默认开启、ZDR 需关闭日志与新 opt-in 路径的适用范围。"
summary_en = "Two changes on docs/logs-policy weaken the user-favourable position. First, logging moved from a project-owner opt-in to on by default: 'As a project owner you have the choice to opt-in to logging of Gemini API calls' became 'Logging is on by default for Interactions API calls, and for Generate Content API calls in projects created on or after October 26, 2026', with a note that it can be turned on or off at any time from the Logs and Datasets page in AI Studio. The default 55-day retention window (configurable to 7/14/28/55 days) therefore applies without the project owner taking any action. 'By default ... prompts and responses within logs are not used for product improvement or development' and the dataset-sharing opt-in are unchanged, so the API tier's contractual training verdict remains no-improvement. Zero retention is still achievable because the page says logging can be turned off at any time, but the default configuration now adds a retention surface the customer must actively disable, and the ZDR page itself does not list this logging. Second, the page added an invite-only private preview, the 'Gemini API Contributor Tier': enabling it applies the Unpaid Services terms to data from participating model use, states that 'your data will be used to improve Google products and machine learning technologies', and offers up to 50% off token costs in exchange for permission to use the data. This is a new project-level opt-in training path, so training is recorded as weakened. The existing verdict fields (api-paid training=yes; zdr=yes/opt_in; retention=55 days/logs/fixed_period) are unchanged; the update adds the scope of the default-on logging, the extra action needed for ZDR, and the new opt-in path."
issue = "https://github.com/arcships/zdr-monitor/issues/851"
