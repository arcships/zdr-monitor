summary_zh = "Google AI Studio 反馈页从 Inline Preference Voting 扩展至评分、评论、Build/Build Arena 及 Gemini API Logs 的主动反馈;新文写明单条请求日志的 payload、回复、参数及元数据可随反馈记录。旧页明确承诺审阅前断开反馈数据与 Google 账号、API key 和 Cloud 项目的关联,现行反馈页删去该承诺,改为警告勿提交敏感信息并称反馈始终自愿。因此仅就此页公开的反馈审阅隐私保障记为 weakened,不推断实际处理方式已变。独立 logs-policy 仍承诺在人工审阅分享的 dataset 前断开关联;付费 API 默认不用于改进的合同结论不变。"
summary_en = "The Google AI Studio feedback page expanded from Inline Preference Voting to voluntary ratings, comments, Build/Build Arena and Gemini API Logs feedback; it now specifies that an individual request log's payload, response, parameters and metadata can be recorded with submitted feedback. The old feedback page expressly promised to disconnect the feedback data from the Google Account, API key and Cloud project before review. The current feedback page removes that assurance and instead warns against submitting sensitive information and says feedback is always voluntary. This weakens the review safeguard disclosed on this page without establishing a change in actual processing. The separate logs-policy still promises disconnection before human review of shared datasets, and the contractual no-default-improvement verdict for paid API traffic remains unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/308"
