summary_zh = "docs/logs-policy 把 dataset 分享条款后的旧警示「**Do not include personal, sensitive, or confidential information.**」改写为「Do not donate data from API clients available to users in the European Economic Area, Switzerland, or the United Kingdom, and do not donate data that is personal, sensitive, or confidential」，新增禁止捐赠 EEA/瑞士/UK 用户可用的 API client 数据这一地域限制，同时保留不得捐赠个人/敏感/机密数据的要求。dataset 共享（把日志放进 dataset 并分享给 Google 后按 Unpaid Services 条款处理、可用于训练）仍是 api 付费档的 opt-in 训练路径，新句缩小了这条路径的适用范围，对用户更有利，方向记为 strengthened。五个维度的结论字段均未变（api-paid training 仍为 yes/by_contract）；api-paid training 新增 point 与锚点 training-dataset-donation-restricted 记录该限制。同轮快照其余变化是文档站改版与排版（导航、link 标记、列表编号、Callout 格式、页脚 Last updated 消失），不涉及五个维度。"
summary_en = "docs/logs-policy replaced the warning after the dataset-sharing clause, '**Do not include personal, sensitive, or confidential information.**', with 'Do not donate data from API clients available to users in the European Economic Area, Switzerland, or the United Kingdom, and do not donate data that is personal, sensitive, or confidential'. This adds a geographic prohibition on donating data from API clients available to users in the EEA, Switzerland or the UK while keeping the ban on donating personal, sensitive or confidential data. Dataset sharing (logs placed in a dataset and shared with Google are processed under the Unpaid Services terms and may be used for training) remains the paid API tier's opt-in training path; the new sentence narrows who may use that path, which is more protective for users, so the direction is recorded as strengthened. No verdict field changed (api-paid training remains yes/by_contract); api-paid training gained a point and anchor training-dataset-donation-restricted recording the restriction. The rest of the snapshot change is the docs-site migration and markup (navigation, link markers, list numbering, callout formatting, the footer Last updated line disappearing) and does not touch the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1005"
