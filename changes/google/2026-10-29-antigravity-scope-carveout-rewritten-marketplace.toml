summary_zh = "antigravity.google/terms 改写了开头的企业访问例外,并新增 Marketplace 例外。旧文为 'If you are accessing the Service through Gemini Enterprise (Google Cloud), Gemini Enterprise for Business or a Google Workspace subscription on the Google Cloud Pre-GA Offering Terms, or with a Gemini Enterprise API Key, then you are subject to the terms of use accepted or signed by your administrator applicable to such service (including its applicable terms for downloadable software) and the terms below do not apply to you'。新文把 'Gemini Enterprise API Key' 改为 'an API Key in Gemini for business',并删去结尾的 'and the terms below do not apply to you',只保留这些访问 'you are subject to the terms of use accepted or signed by your administrator applicable to such service (including its applicable terms for downloadable software)'。明文排除本 Antigravity 条款的句子因此消失,现行文字也未说明这些路径是否同时适用本条款,role 维度对这一访问范围的书面边界从明确排除变为不确定,故记 weakened;consumer 档 role=controller 的结论值未变,但该结论不能套用到这些路径。新增第 9 条 'Enterprise or other signed or accepted terms do not apply to the use of the Antigravity Marketplace within the Service',即企业或其他签署/接受的条款不适用于 Service 内 Marketplace 的使用。第 5 条另补充 'Even when your Telemetry is toggled off, Google still uses your data to provide the service, process any feedback and help keep Antigravity safe':该句只列出关闭 Telemetry 后仍继续的用途(提供服务、处理反馈、维护 Antigravity 安全),原文未说明改进用途是否停止或继续;第 3 条把 'any feedback you provide' 定义为 Interactions 的一部分,第 5 条又写明 Interactions 用于评估、开发与改进 Google 及 Alphabet 的研究、产品、服务与机器学习技术,因此该句不能读作改进用途已终止。training 维度(no/opt_out)与退出边界均未改变,故变化记录只列 role,training 仅作澄清说明。"
summary_en = "antigravity.google/terms rewrote its opening enterprise-access carve-out and added a Marketplace carve-out. The old text read 'If you are accessing the Service through Gemini Enterprise (Google Cloud), Gemini Enterprise for Business or a Google Workspace subscription on the Google Cloud Pre-GA Offering Terms, or with a Gemini Enterprise API Key, then you are subject to the terms of use accepted or signed by your administrator applicable to such service (including its applicable terms for downloadable software) and the terms below do not apply to you'. The new text changes 'Gemini Enterprise API Key' to 'an API Key in Gemini for business' and deletes the closing 'and the terms below do not apply to you', keeping only that such access is 'subject to the terms of use accepted or signed by your administrator applicable to such service (including its applicable terms for downloadable software)'. The explicit exclusion of these Antigravity terms is therefore gone, and the current text does not state whether these terms also apply to those routes; the written role boundary for that access changed from an explicit exclusion to uncertainty, so this is recorded as weakened. The consumer-tier role=controller verdict is unchanged but does not determine those routes. New item 9 states 'Enterprise or other signed or accepted terms do not apply to the use of the Antigravity Marketplace within the Service', so enterprise or other signed or accepted terms do not apply to Marketplace use inside the Service. Item 5 also adds 'Even when your Telemetry is toggled off, Google still uses your data to provide the service, process any feedback and help keep Antigravity safe'. The sentence only lists uses that continue with Telemetry off (providing the service, processing feedback, keeping Antigravity safe); it does not say whether improvement use stops or continues. Item 3 defines 'any feedback you provide' as part of Interactions, and item 5 says Interactions are used to evaluate, develop, and improve Google and Alphabet research, products, services and machine learning technologies, so the sentence cannot be read as ending the improvement use. The training verdict (no/opt_out) and its opt-out boundary are unchanged, so only role is listed as affected and training is covered as a clarification."
issue = "https://github.com/arcships/zdr-monitor/issues/938"
