summary_zh = "Google Antigravity 附加条款开头的企业接入排除句改了一个产品名：旧文『or with a Gemini Enterprise Agent Platform API Key, then you are subject to the terms of use accepted or signed by your administrator』，现行『or with a Gemini Enterprise API Key, then you are subject to …』。规则本身（经企业渠道接入时适用管理员签署的条款、消费端条款不适用）没变，变的是排除条款点名的 API Key 名称。现有快照不足以确定两个名称是否指同一产品，因此记为措辞层面的澄清，不据此改动 role 结论。"
summary_en = "The enterprise carve-out at the top of the Google Antigravity Additional Terms renamed one product: it previously read 'or with a Gemini Enterprise Agent Platform API Key, then you are subject to the terms of use accepted or signed by your administrator' and now reads 'or with a Gemini Enterprise API Key, then you are subject to …'. The rule itself is unchanged (enterprise-channel access follows the administrator's terms and the consumer terms do not apply); only the API key named in the carve-out changed. The current snapshots cannot establish whether the two names refer to the same product, so this is recorded as a wording clarification and the role verdict is not changed on this basis."
issue = "https://github.com/arcships/zdr-monitor/issues/308"
