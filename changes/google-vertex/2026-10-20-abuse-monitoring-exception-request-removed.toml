summary_zh = "Agent Platform「客户数据保留与达成零数据保留」页（页脚 Last updated 由 2026-10-13 改为 2026-10-20）删去了标准滥用监控条目末尾的申请豁免句「If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring.」，连同同条目里的「See Abuse monitoring.」链接。该页其余条款未变：仅受 Google Cloud Platform Terms of Service 约束的客户在滥用监控范围内、Advanced AI 特性可能无法达成 ZDR、Grounding with Google Search/Maps 的存储无法关闭、各缓存/日志/Interactions API 动作照旧。此前 2026-10-02 版滥用监控页已删去标准滥用监控的 Customer opt-out 条目与申请表，因此申请豁免的官方说法至此从两份文档中全部消失：受 GCP ToS 约束的客户现在没有文档依据支持的标准滥用监控豁免路径，滥用监控领域有文档依据的路径只剩协议类型（持 Google Cloud Master Agreement 的客户默认豁免该记录）；其余要求是客户侧配置动作。api 档 zdr 仍为 mark=yes（页面仍有 ZDR 路径），但 mode 由 by_agreement 改为 opt_in——原 mode 在页面渲染为「是，需向厂商申请」，而现行原文已没有任何申请入口，ZDR 只剩客户侧逐项配置；retention 仍为 object=input_output、basis=as_needed。删除了原锚点 zdr-abuse-monitoring-exception（其 exact 已不存在），把 zdr 路径条目改绑到 zdr-must-take-actions，并把 zdr-abuse-scope-gcp-tos-only 的 exact 扩到包含 Master Agreement 默认豁免整句；retention 依据与两份 source note 中关于申请豁免仍存在的表述改为现状。"
summary_en = "The Agent Platform page on customer data retention and achieving zero data retention (footer Last updated changed from 2026-10-13 to 2026-10-20) deleted the request-an-exception sentence at the end of its standard abuse-monitoring bullet, 'If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring.', together with its 'See Abuse monitoring.' link. The rest of the page is unchanged: only customers whose use of Google Cloud is governed by the Google Cloud Platform Terms of Service are subject to abuse monitoring, zero data retention may not be possible for some Advanced AI features, storage for Grounding with Google Search and Google Maps cannot be disabled, and the caching/logging/Interactions API actions remain. The abuse-monitoring page had already removed its customer opt-out bullet and request form for standard prompt logging in its 2026-10-02 revision, so the official statement of an exception route has now disappeared from both documents: a customer under the GCP Terms of Service has no documented abuse-monitoring exemption path, and the only documented abuse-monitoring route is the agreement type (customers with a Google Cloud Master Agreement are exempt from this logging by default); the remaining ZDR requirements are customer-side configuration actions. The api tier keeps zdr mark=yes (the page still describes a ZDR path), but its mode changes from by_agreement to opt_in: by_agreement renders as 'Yes, on request', while the current text contains no request step at all and ZDR is left to customer-side configuration. Retention remains object=input_output, basis=as_needed. The former anchor zdr-abuse-monitoring-exception was removed because its exact text no longer exists, the zdr path point was re-bound to zdr-must-take-actions, the exact text of zdr-abuse-scope-gcp-tos-only was widened to include the full Master Agreement exemption sentence, and the retention point and both source notes that still described a surviving exception route were updated to the current state."
issue = "https://github.com/arcships/zdr-monitor/issues/757"
