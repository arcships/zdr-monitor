summary_zh = "Agent Platform「客户数据保留与达成零数据保留」页（页脚 Last updated 由 2026-09-28 改为 2026-10-13）重写了缓存一节：原「In-memory data caching」改为「Implicit data caching」，并明说隐式缓存分内存与落盘两层。内存层仍默认开启、仅存内存不落盘、按项目隔离、写入后 24 小时内删除、在处理该请求的地域处理。新增默认开启的 durable caching 落盘层：把由客户输入算出的派生缓存数据（key-value 表示）存入 Agent Platform 服务环境的持久存储，用 Google 默认加密、不支持 CMEK，写入后 24 小时内删除且常更早淘汰；只有用 regional/multi-regional 端点时才留在所选地域，用 global 端点时请求与缓存数据可在任意地域被服务；可按项目关闭，或经客户团队在组织级关闭（保留内存缓存）。原「This data is stored only in-memory (not at-rest)…24-hour TTL」「does not violate zero data retention」「adheres to all Data Residency requirements for the selected location」等句随之删除。api 档结论字段未变（retention 仍为 object=input_output、basis=as_needed；zdr 仍为 mark=yes / mode=by_agreement；processing_region 仍为 codes=[selected]），但这一维的对象与动作集合都变了：默认多出一层静态留存，该页原先唯一把缓存与零保留绑在一起的句子（缓存「does not violate zero data retention」）消失，达成 ZDR 时须额外关闭落盘层（或整体关闭缓存），且缓存留在所选地域的承诺改为只对 regional/multi-regional 端点成立，故在 retention、zdr、processing_region 三维各补一条带锚点的依据；内存缓存的引文改绑到新正文。同一次改版里训练口径由暗含改为明文排除，方向相反，另记一条。"
summary_en = "The Agent Platform page on customer data retention and achieving zero data retention (footer Last updated changed from 2026-09-28 to 2026-10-13) rewrote its caching section: the former \"In-memory data caching\" became \"Implicit data caching\" and is now explicitly two-tier. The in-memory tier is still on by default, stays in memory only (never at rest), is scoped to the project, is deleted no later than 24 hours after it is written, and is processed in the region that serves the request. A new durable caching tier is enabled by default and stores derived cache data (key-value representations computed from the customer's inputs) in durable storage within the Agent Platform serving environment, encrypted with Google default encryption, not supporting CMEK, deleted no later than 24 hours after it is written and often evicted sooner; it stays within the selected location only with a regional or multi-regional endpoint, while with the global endpoint requests and their cached data can be served from any region, and it can be turned off per project or organisation-wide via the account team while keeping in-memory caching. The old sentences \"This data is stored only in-memory (not-at-rest)... 24-hour TTL\", \"does not violate zero data retention\" and \"adheres to all Data Residency requirements for the selected location\" were removed with it. No verdict field on the api tier changed (retention remains object=input_output and basis=as_needed; zdr remains mark=yes / mode=by_agreement; processing_region remains codes=[selected]), but both the object and the action set changed: a default at-rest tier was added, the page's only sentence tying caching to zero data retention is gone, so reaching ZDR now requires additionally turning off the durable tier (or turning caching off entirely), and the selected-location commitment for cached data now holds only with a regional or multi-regional endpoint; one anchored point was added to each of retention, zdr and processing_region, and the in-memory quote was re-bound to the new text. In the same revision the training wording moved from implicit to an express exclusion, the opposite direction, and is recorded separately."
issue = "https://github.com/arcships/zdr-monitor/pull/653"
