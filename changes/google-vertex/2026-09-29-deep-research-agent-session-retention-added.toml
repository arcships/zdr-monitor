summary_zh = "Agent Platform「零数据保留」页（页脚 Last updated 由 2026-09-22 改为 2026-09-28）在 Agent products 一节新增「Deep Research agent session data」条目：经 Interactions API 保存 prompt 与会话数据（含搜索结果与生成的图片）固定 7 天，静态加密、7 天 TTL 到期自动删除，客户可提前删除会话，并明文写明「This feature cannot be disabled when using the Deep Research agent.」。api 档的结论字段未变（retention 仍为 object=input_output、basis=as_needed；zdr 仍为 mark=yes / mode=by_agreement），但这是该档新出现的、不可关闭的固定 7 天留存，并把 Deep Research agent 场景排除在本页所列的 ZDR 路径之外，故在 retention 与 zdr 两维各补一条带锚点的依据。同页其余条目（CodeMender 7 天、Sandbox snapshots、Interactions API store 默认 true、内存缓存 24 小时等）与正文未变。"
summary_en = "The Agent Platform zero-data-retention page (footer Last updated changed from 2026-09-22 to 2026-09-28) added a 'Deep Research agent session data' bullet under Agent products: prompts and session data — including search results and generated images — are stored via the Interactions API for a period of seven (7) days, encrypted at rest, deleted automatically at the seven-day TTL, deletable earlier by the customer, and the page states plainly 'This feature cannot be disabled when using the Deep Research agent.' No verdict field on the api tier changed (retention remains object=input_output and basis=as_needed; zdr remains mark=yes / mode=by_agreement), but this is a newly published, unavoidable fixed seven-day retention on that tier and it puts the Deep Research agent surface outside the ZDR path listed on the page, so a new anchored point was added to both the retention and zdr dimensions. The remaining entries on the page (CodeMender seven days, Sandbox snapshots, Interactions API store default true, the 24-hour in-memory cache, etc.) and the rest of the body text are unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/368"
