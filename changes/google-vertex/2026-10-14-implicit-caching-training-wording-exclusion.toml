summary_zh = "同一次缓存改版（页脚 Last updated 由 2026-09-28 改为 2026-10-13）里，训练口径由暗含改为明文排除：旧句「Cached data is used only for improving service performance」按本台账「用来改进服务算训练」的口径算训练，被新正文替换为内存缓存属性列表中的「It's used only to serve your requests faster, and is never used to train or fine-tune models.」。即厂商从「仅用于改进服务」改成明文排除模型训练，方向是承诺增强。api 档 training 结论字段未变（仍 mark=yes / mode=by_contract），依据仍是合同层 Service Specific Terms §18；同一改版新增默认开启落盘层、并改写缓存的地域口径属 retention/zdr/processing_region 方向，另记一条。"
summary_en = "In the same caching revision (footer Last updated changed from 2026-09-28 to 2026-10-13) the training wording moved from implicit to an express exclusion: the old sentence \"Cached data is used only for improving service performance\" — which this ledger's rule counts as training — was replaced by \"It's used only to serve your requests faster, and is never used to train or fine-tune models.\" in the in-memory cache property list. Google thus moved from \"only for improving service performance\" to an express exclusion of model training, i.e. a strengthened commitment. No verdict field on the api tier's training changed (still mark=yes / mode=by_contract) and the basis remains contract layer Service Specific Terms §18; the default-on durable tier added by the same revision, and the rewritten location wording, are retention/zdr/processing_region changes and are recorded separately."
issue = "https://github.com/arcships/zdr-monitor/pull/653"
