summary_zh = "Service Specific Terms 页的 Last modified 由 2026-10-08 改为 2026-10-12（2026-10-08 版进入该页 Previous versions 列表）。新增 §34「Google Frontier Models」：使用被指定为 Google Frontier Models 的模型或特性时，客户被视为指示 Google 在客户账户内保存 prompts 与 Generated Output 等某些 Customer Data 最长三十 (30) 天，供自动工具审查（§34.1.b 的 Purpose 仅为确保该模型的安全使用与合规），随后删除；§34.2 明写该指示「in addition to, and prevails to the extent of any conflict with」客户依协议给出的任何其他许可或指示，即客户无法用相反指示关掉这项存储；§34.3 该临时存储不收费用。该存储在客户账户内，而 §20.h 讲的是客户账户之外的存储，两者不冲突。§31(b) 新增 Google Frontier Cyber Models（Gemini Enterprise Agent Platform API 上的模型或特性），把它们纳入 §31(a)(i-iii) 与 §34，故 api 档在这条新增存储的适用范围内。§20 新增一句，把 (b)–(h) 小节中的「Generative AI Services」扩及 Agentic AI Services，§20.h「不超出生成所需时长存储」的默认口径范围随之扩大到 agent 流量（Grounding 的两小节 (k) 与 (m) 在 (b)–(h) 之外，不受影响）。§18 Training Restriction 与 §16 AI/ML Data Location 正文未变。其余改动是定义、改名与顺延编号，不改变 retention/zdr 口径：§14 新增 Agentic AI Action、Customer AI Agent、Google AI Agent、Third-Party AI Agent、Third-Party Service 等定义，§19 扩及 Customer AI Agent 与 Third-Party AI Agent（免责声明部分承接了旧 §20.n(ii) 的免责句），§20.n 重写——旧的 (iii)「The actions or tasks that an AI Agent performs are not Generated Output.」现由 §14 的 Agentic AI Action 定义承接，旧的 (ii) 的适用范围句没有承接，与新增的 §8 Third-Party Enterprise Models 一起记在 role 那条记录里；Gemini Cyber 改名为 Google Cyber Models。api 档结论字段未变（retention 仍为 object=input_output、basis=as_needed；zdr 仍为 mark=yes / mode=by_agreement），但这是合同层新增的一条客户无法用指示关闭的 30 天账户内存储，故在 retention 与 zdr 各补一条带锚点的依据；retention 另补一条记录 §20 默认口径的范围扩大。"
summary_en = "The Service Specific Terms page's Last modified moved from 2026-10-08 to 2026-10-12 (the 2026-10-08 version is now listed under Previous versions). A new Section 34 \"Google Frontier Models\" provides that when using a model or feature designated a Google Frontier Model the customer is deemed to instruct Google to store certain Customer Data, such as prompts and Generated Output, in Customer's Account for up to thirty (30) days for review by automated tools (the Purpose under §34.1.b is limited to ensuring safe use of those models and compliance with the Agreement) and then to delete it; §34.2 states that this Instruction is \"in addition to, and prevails to the extent of any conflict with\" any other permission or Instruction given by the customer under the Agreement, so the customer cannot switch that storage off by instructing otherwise; §34.3 charges no fee for it. The storage sits inside Customer's Account, which the Section 20.h default does not speak to (it covers storage outside Customer's Account). A new Section 31(b) adds Google Frontier Cyber Models (models or features of the Gemini Enterprise Agent Platform API) and brings them under Sections 31(a)(i-iii) and 34, so the api tier is in scope of that new storage. Section 20 gains one sentence extending \"Generative AI Services\" in subsections (b) through (h) to Agentic AI Services, widening the reach of the Section 20.h no-storage-beyond-the-output default to agent traffic (the two Grounding subsections (k) and (m) sit outside (b) through (h) and are unaffected). Sections 18 (Training Restriction) and 16 (AI/ML Data Location) are textually unchanged. The rest is definitions, a rename and renumbering, and does not change the retention/zdr position: Section 14 adds Agentic AI Action, Customer AI Agent, Google AI Agent, Third-Party AI Agent and Third-Party Service, Section 19 now covers Customer AI Agents and Third-Party AI Agents (its disclaimer carries the old Section 20.n(ii) disclaimer sentences), and Section 20.n is rewritten — the old clause (iii) \"The actions or tasks that an AI Agent performs are not Generated Output.\" is now carried by the Section 14 definition of Agentic AI Action, while the old clause (ii) applicability sentence has no carry-over and is recorded, together with the new Section 8 Third-Party Enterprise Models, under the role record; Gemini Cyber is renamed Google Cyber Models. No verdict field on the api tier changed (retention stays object=input_output and basis=as_needed; zdr stays mark=yes / mode=by_agreement), but this is a newly added contract-layer thirty-day in-account storage that a customer cannot switch off by instruction, so one anchored point was added to retention and one to zdr; retention also gains a point recording the widened scope of the Section 20 default."
issue = "https://github.com/arcships/zdr-monitor/issues/619"
