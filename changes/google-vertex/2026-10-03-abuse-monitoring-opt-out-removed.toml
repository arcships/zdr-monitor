summary_zh = "Agent Platform 滥用监控页（页脚 Last updated 由 2026-09-22 改为 2026-10-02）删去了标准滥用监控的客户退出途径：Prompt logging 条目末尾的「Customers also have the option to request an opt-out from abuse logging (see below).」被删，「Customer opt-out: Customers may request for an exception by filling out this form. If approved, Google won't store any prompts associated with the approved Google Cloud account.」整条被删。90 天上限、仅 GCP ToS 客户在范围内、持 Google Cloud Master Agreement 的客户默认豁免、Advanced AI 30 天记录等其余条款未变。zero-data-retention 页仍写「If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring」，所以 api 档 zdr 仍为 mark=yes / mode=by_agreement、retention 结论字段也未变；但申请表与「获批后不存储任何 prompt」的说明已从官方文档消失，相关依据条目改写为现状。"
summary_en = "The Agent Platform abuse-monitoring page (footer Last updated changed from 2026-09-22 to 2026-10-02) removed the customer opt-out from standard abuse monitoring: the sentence 'Customers also have the option to request an opt-out from abuse logging (see below).' at the end of the Prompt logging bullet was deleted, and the whole 'Customer opt-out: Customers may request for an exception by filling out this form. If approved, Google won't store any prompts associated with the approved Google Cloud account.' bullet was deleted. The 90-day upper bound, the scope limited to customers under the GCP Terms of Service, the default exemption for Google Cloud Master Agreement customers and the 30-day Advanced AI logging are unchanged. The zero-data-retention page still says 'If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring', so the api tier keeps zdr mark=yes / mode=by_agreement and its retention fields are unchanged; but the request form and the statement that approval means no prompts are stored are gone from the official docs, and the affected points were rewritten to the current state."
issue = "https://github.com/arcships/zdr-monitor/issues/471"
