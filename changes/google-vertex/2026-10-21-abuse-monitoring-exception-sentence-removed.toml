summary_zh = "Agent Platform 的 zero-data-retention 页（页脚 Last updated 由 2026-10-13 改为 2026-10-20）删去了「Prompt logging for abuse monitoring for Google models」条目末尾的『If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring. See Abuse monitoring.』。该条目其余内容未变：Google 可能记录 prompt 用于滥用检测，且只有受 Google Cloud Platform Terms of Service 约束的客户在该范围内。此前 2026-10-02 滥用监控页已删去标准 prompt 日志的 Customer opt-out 条目；这次删除后，本 provider 收录的官方文档不再说明范围内客户可申请滥用监控例外，仍有的 ZDR 依据是滥用监控页所写「customers with a Google Cloud Master Agreement are exempt from prompt logging for this abuse monitoring by default」。api 档 zdr 结论字段未变（仍 mark=yes / mode=by_agreement，ZDR 仍可按协议达成），retention 结论字段也未变；但相关依据条目改写为现状：受 GCP ToS 约束的客户在上述两页已无有文档的例外申请途径，只有 Master Agreement 客户默认豁免。"
summary_en = "The Agent Platform zero-data-retention page (footer Last updated changed from 2026-10-13 to 2026-10-20) removed the sentence at the end of its 'Prompt logging for abuse monitoring for Google models' bullet: 'If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring. See Abuse monitoring.' The rest of the bullet is unchanged: Google may log prompts to detect abuse, and only customers whose use of Google Cloud is governed by the Google Cloud Platform Terms of Service are in scope. The abuse-monitoring page had already removed the Customer opt-out for standard prompt logging in its 2026-10-02 revision; after this deletion the official docs collected for this provider no longer state that in-scope customers can request an abuse-monitoring exception, and the remaining ZDR basis is the abuse-monitoring page's statement that 'customers with a Google Cloud Master Agreement are exempt from prompt logging for this abuse monitoring by default'. No zdr verdict field on the api tier changed (still mark=yes / mode=by_agreement, since ZDR remains achievable by agreement), and no retention verdict field changed either; the affected evidence points were rewritten to the current state: for customers governed by the GCP Terms of Service these two pages no longer document an exception request route, while Master Agreement customers remain exempt by default."
issue = "https://github.com/arcships/zdr-monitor/issues/760"
