summary_zh = "同一次改版（页面 Last modified 2026-10-12）删去了旧 §20.n(ii) 的整段「Customer's access to and use of Agentic AI Services in Third Party Services」，其中包含一句关于适用范围的声明：「Customer acknowledges and agrees that all of the terms of the Agreement, including Google's obligations under the Cloud Data Processing Addendum, will apply to the Agentic AI Services accessed via a Third Party Service, but not to the Third Party Service itself.」新的 §20.n(ii) 换成了人工确认护栏的责任条款。该段其余内容各有承接：免责句由新 §19.b 承接（并把免责范围扩到经 AI/ML Service 访问、或据以访问 AI/ML Service 的第三方服务），行内的「Third Party Services」定义由 §14 的「Third-Party Service」承接（定义改为 platform、model、AI Agent、service、website、software library 或 API）。但上面那句适用范围声明在新正文里没有任何承接：§19.b 只剩免责，§14 只给定义，这次改版的 diff 里没有一个新增句承接这层表述，也没有与之相反的表述（同页其他 CDPA 提法未变，例如 §31(a)(vi) 的 Permitted User Log extracts 仍按 CDPA 处理）。同一段被删的还有「Customer's use of Third Party Services is not governed by the Agreement and may be subject to separate terms and conditions provided by an applicable third party.」；新 §19.a 只有一句对 Separate Offerings 与 Third-Party AI Agents 的类似表述（「Customer's use of Separate Offerings and Third-Party AI Agents is subject to separate terms and conditions.」），没有针对第三方服务本身重述。新 §20 唯一的范围句是「For the purposes of subsections (b) through (h) below, \"Generative AI Services\" includes Agentic AI Services.」，讲的是 Generative AI Services 各小节的适用范围，不是协议或 CDPA 的适用面。另新增 §8「Third-Party Enterprise Models」（列在第三方软件清单中，适用对象为 Gemini Enterprise、Antigravity for Enterprise 及 Admin Console 或文档指定的其他合格服务）：要求客户遵守 Anthropic 与 OpenAI 的 Usage Policy、Supported Regions Policy、Service Specific Terms 等，并写明若客户与第三方模型提供商另有直接协议，该协议的相关规定优先——这句属于「哪套条款管这项使用」的归属声明；该条讲的是使用限制与可接受使用政策，不含数据处理角色或保留期限的表述，且其适用服务未经快照确认覆盖 api 档自身的模型流量。api 档 role 结论字段未变（kind=processor，锚在 CDPA §4.1，该条正文未变）：被删的那句针对的是「经第三方服务访问 Agentic AI Services」这一配置，不是 api 档自身由 Google 处理的流量，故不改变本档判断；此处只记厂商删句这一事实与新增的第三方模型条款。"
summary_en = "The same revision (page Last modified 2026-10-12) deleted the whole old Section 20.n(ii) \"Customer's access to and use of Agentic AI Services in Third Party Services\", including a scope statement: \"Customer acknowledges and agrees that all of the terms of the Agreement, including Google's obligations under the Cloud Data Processing Addendum, will apply to the Agentic AI Services accessed via a Third Party Service, but not to the Third Party Service itself.\" The new Section 20.n(ii) is a responsibility clause about human-confirmation safeguards instead. The rest of the deleted paragraph is carried elsewhere: the disclaimer sentences by the new Section 19.b (which widens the disclaimer to third-party services accessed via an AI/ML Service or through which a customer accesses one), and the inline \"Third Party Services\" definition by Section 14's \"Third-Party Service\" (now defined as a platform, model, AI Agent, service, website, software library or API provided by a third party). The scope statement quoted above, however, has no carry-over in the new text: Section 19.b is only a disclaimer, Section 14 is only a definition, and no added line in this revision's diff restates it, nor does any added line state the opposite (other CDPA references on the page are unchanged, e.g. Section 31(a)(vi) still processes Permitted User Log extracts in accordance with the CDPA). The same deleted paragraph also contained \"Customer's use of Third Party Services is not governed by the Agreement and may be subject to separate terms and conditions provided by an applicable third party.\"; the new Section 19.a only has an analogous sentence for Separate Offerings and Third-Party AI Agents (\"Customer's use of Separate Offerings and Third-Party AI Agents is subject to separate terms and conditions.\"), with no restatement for third-party services themselves. The only new scope sentence in Section 20 is \"For the purposes of subsections (b) through (h) below, \"Generative AI Services\" includes Agentic AI Services.\", which concerns the reach of the Generative AI Services subsections, not the applicability of the Agreement or the CDPA. Also new is Section 8 \"Third-Party Enterprise Models\" (in the third-party software list, applying to Gemini Enterprise, Antigravity for Enterprise and other eligible Services specified in the Admin Console or Documentation): it requires customers to comply with Anthropic's and OpenAI's Usage Policy, Supported Regions Policy and Service Specific Terms, and states that where the customer has a direct agreement with the third-party model provider, the applicable provisions of that agreement control — a statement about which terms govern that use; it addresses use restrictions and acceptable-use policies, contains no data-processing role or retention wording, and the snapshot does not show its Applicable Services covering the api tier's own model traffic. No verdict field on the api tier's role changed (still kind=processor, anchored on CDPA Section 4.1, which is textually unchanged): the deleted sentence addressed the configuration \"Agentic AI Services accessed via a Third Party Service\", not the api tier's own traffic processed by Google, so the tier's conclusion stands; this record only logs the deletion and the new third-party model clause."
