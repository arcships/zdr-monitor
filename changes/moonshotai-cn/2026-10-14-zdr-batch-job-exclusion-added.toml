summary_zh = "开放平台《什么是零数据保留(ZDR)》页把「ZDR 适用所有数据类型吗？」的旧答句（「通过直接文件上传方式提交的图像或视频，使用 Kimi Hosted Agents 托管智能体的数据，零数据留存无法保证。安全日志、账单记录等运营数据不属于零留存范围；第三方模型、连接器、插件等不受本协议约束。」）改写为编号列表，并新增第 1 项「Batch Job 服务：通过 Batch API 提交的批处理任务不支持 ZDR」。其余四项为旧句的拆条改写，语义未变：直接上传的图像/视频与 Kimi Hosted Agents 托管智能体数据无法保证零留存、运营数据（安全日志、账单记录）不属于零留存范围、第三方模型/连接器/插件不受本 ZDR 政策约束。ZDR 主承诺（开通后请求内容响应返回即清除）与训练条款（企业客户数据不用于模型训练）均未改动，api 档 zdr 结论字段不变（mark=yes、mode=by_agreement），但适用边界新增 Batch API 这一明确例外，故按新正文改绑 zdr-scope-exclusions 锚点。"
summary_en = "On the Open Platform page 'What is Zero Data Retention (ZDR)?', the answer to 'Does ZDR apply to all data types?' was rewritten from a single sentence ('Images or videos submitted through direct file upload, and data processed by Kimi Hosted Agents, cannot be guaranteed zero data retention. Operational data such as security logs and billing records is outside the scope of zero retention; third-party models, connectors and plugins are not governed by this agreement.') into a numbered list, and a new item was added: '1. Batch Job service: batch jobs submitted through the Batch API do not support ZDR.' The other four items are split-out restatements with unchanged meaning: images/videos submitted through direct file upload and Kimi Hosted Agents data cannot be guaranteed zero retention; operational data (security logs, billing records) is outside zero-retention scope; third-party models, connectors and plugins are not governed by this ZDR policy. The main ZDR commitment (request content is cleared once the response is returned) and the training clause (enterprise customer data is not used for model training) are unchanged. The api tier's zdr verdict fields are unchanged (mark=yes, mode=by_agreement), but the scope now carries the explicit Batch API exception, so the zdr-scope-exclusions anchor was re-bound to the new wording."
issue = "https://github.com/arcships/zdr-monitor/issues/657"
