summary_zh = "《Oracle Cloud Hosting and Delivery Policies》由 3.12（May 2026）升到 3.13（September 2026），在概览段新增 AI Functionality 处理地条款：『To provide AI Functionality in the Oracle Cloud Services, Oracle may process Your Content using AI models located outside the Data Center Region applicable to such Services or on third-party infrastructure. Any such processing of Your Content is temporary, and Your Content remains stored in the Data Center Region applicable to such Services.』——存储仍留在客户选定的 Data Center Region，但为提供 AI Functionality 的处理可能离开该 Region、落在第三方基础设施上，且条款未指明具体处理地。这削弱了原先由存储条款推出的「处理限于选定 Region」口径，故方向记为放宽。字段层结论值未变：各 AI 档 processing_region 仍 codes=selected（指存储地），xai 模型档仍 basis=undisclosed；该例外以新增 point 并列保留。同版本另把 §1.14 Security Logs 重编号为 §1.13（原文未变），并改写 Support 的 Severity 响应时限与 Live Support 措辞，与五个维度无关。"
summary_en = "Oracle Cloud Hosting and Delivery Policies moved from v3.12 (May 2026) to v3.13 (September 2026), adding an AI Functionality processing clause to the Overview: 'To provide AI Functionality in the Oracle Cloud Services, Oracle may process Your Content using AI models located outside the Data Center Region applicable to such Services or on third-party infrastructure. Any such processing of Your Content is temporary, and Your Content remains stored in the Data Center Region applicable to such Services.' Storage stays in the customer-selected Data Center Region, but AI Functionality processing may leave that region and run on third-party infrastructure, and the clause names no specific location. This loosens the earlier 'processing confined to the selected region' reading drawn from the storage clause, so the direction is recorded as weakened. Verdict fields are unchanged: every AI tier keeps codes=selected (the storage region) and the xAI-models tier keeps basis=undisclosed; the carve-out is added as a point. The same release renumbers §1.14 Security Logs to §1.13 (text unchanged) and edits the Support severity response times and Live Support wording, none of which touch the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/452"
