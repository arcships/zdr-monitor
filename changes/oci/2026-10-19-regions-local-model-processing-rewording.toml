summary_zh = "OCI 文档『Generative AI Regions』在「Services that Call into the Generative AI Service」一节删除了旧句『Currently, the Oracle Cloud Infrastructure (OCI) Generative AI Service is not offered in every OCI commercial region. See the column below titled “Destination Region:” for a list of OCI commercial regions offering the OCI Generative AI Service.』，改为『Some OCI services call the Generative AI service. The following table lists the calling and destination regions for those service integrations.』；现行快照进一步把该节改写为「有本地模型处理」与「无本地模型处理」的商业 Region，并写明无本地处理的 Region 需创建 routing profile 选择可用的目标 Region 运行模型（『In a region with no local model processing, create a routing profile for the on-demand model you want to use and select target regions where it is available. Select the profile in your region's Playground or reference it in an API request to run the model in a selected target region.』）。调用/目标 Region 表（GRU/FRA/HYD/KIX/RUH/DXB/LHR/ORD）与跨 Region 调用句未变，实质口径是澄清而非收紧或放宽。字段层结论未变：api / dedicated-ai-cluster / agentic-api / generative-ai-agents 4 档 processing_region 仍 codes=selected，api-xai-models 档仍 basis=undisclosed；失效锚点 oci-regions-destination-region 改绑到上述 routing 句，api 档的说明文字同步改为「并非每个商业 Region 都有本地模型处理」。"
summary_en = "The OCI documentation page 'Generative AI Regions' removed, from the 'Services that Call into the Generative AI Service' section, the sentence 'Currently, the Oracle Cloud Infrastructure (OCI) Generative AI Service is not offered in every OCI commercial region. See the column below titled “Destination Region:” for a list of OCI commercial regions offering the OCI Generative AI Service.' and replaced it with 'Some OCI services call the Generative AI service. The following table lists the calling and destination regions for those service integrations.' The current snapshot further reframes the section as commercial regions with and without local model processing, stating that in a region with no local model processing you create a routing profile and select target regions where the model is available ('In a region with no local model processing, create a routing profile for the on-demand model you want to use and select target regions where it is available. Select the profile in your region's Playground or reference it in an API request to run the model in a selected target region.'). The calling/destination region table (GRU/FRA/HYD/KIX/RUH/DXB/LHR/ORD) and the cross-region-call sentence are unchanged, so the substance is a clarification rather than a tightening or loosening. Verdict fields are unchanged: the api, dedicated-ai-cluster, agentic-api, and generative-ai-agents tiers keep processing_region codes=selected, while the api-xai-models tier keeps basis=undisclosed; the now-missing anchor oci-regions-destination-region is rebound to the routing sentence above, and the api tier note is reworded to say local model processing is not available in every commercial region."
issue = "https://github.com/arcships/zdr-monitor/issues/719"
