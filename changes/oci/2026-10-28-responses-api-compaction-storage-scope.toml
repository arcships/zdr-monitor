summary_zh = "《OCI Responses API》新增『Manage Context with Compaction』一节。与五维有关的是一句存储口径：『Explicit compaction is synchronous and doesn't support storage, background execution, or streaming.』以及自动压缩在 store=false 时需由客户端继续携带『the latest compaction item and all subsequent output items』。这说明显式压缩（POST /responses/compact）不支持存储、自动压缩在 store=false 时压缩上下文项由客户端续传；但文档没有给出压缩内容本身的保留期限，也没有改变本档 responses/conversations 最长 720 小时（30 天）的保留上限，或后台执行模式即使 store=false 仍需临时响应存储的既有例外。agentic-api 档 retention 结论字段均未变（days=30、object=input_output、basis=fixed_period），zdr 仍为 no；既有锚点原文未动，未改结论或锚点。方向记为 clarified：这是对新增压缩功能存储范围的说明，不是对既有保留承诺的收紧或放宽。同轮其余改动（新增 /responses/compact 端点、Supported API Endpoints 改为复数、按 on-demand / dedicated hosting 选择 model 的说明、段落标点、目录）与五维无关。"
summary_en = "The OCI Responses API page added a 'Manage Context with Compaction' section. The part that touches the five dimensions is a storage statement: 'Explicit compaction is synchronous and doesn't support storage, background execution, or streaming.' Together with the note that automatic compaction with store=false requires the client to carry forward 'the latest compaction item and all subsequent output items', it says explicit compaction (POST /responses/compact) does not support storage and that with automatic compaction and store=false the compaction items are carried forward by the client. The page gives no retention period for the compacted content itself and does not change this tier's maximum response/conversation retention of 720 hours (30 days) or the existing exception that background execution requires temporary response storage even when store=false. No agentic-api retention verdict field changed (days=30, object=input_output, basis=fixed_period) and zdr remains no; existing anchor text is unchanged, so no verdict or anchor was modified. Direction recorded as clarified: this scopes storage for a newly documented compaction feature rather than tightening or loosening an existing retention commitment. The rest of the round (the new /responses/compact endpoint, 'Supported API Endpoints' plural, on-demand versus dedicated-hosting model selection, punctuation, and table of contents) is unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/876"
