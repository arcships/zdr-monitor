summary_zh = "《Data residency》页 Limitations 的 Nexus Auto 条改写：旧句「The `auto` model ID can pass a request through to a third-party provider, which Fireworks cannot constrain to a region.」改为「With US residency, `auto` works and serves open-model turns from US-only Serverless. Anthropic and OpenAI turns run on your own provider account, where that provider’s data policies apply. With other regions, `auto` is rejected.」，条目标题也由「Nexus Auto.」改为「Nexus Auto outside the US.」。即过去任何区域开启 residency 都拒绝 Nexus Auto，现在 US residency 下 `auto` 可用：开源轮次限定在 US-only Serverless，闭源轮次仍走客户自有 Anthropic/OpenAI 账号并适用上游 provider 的数据政策，其他区域继续拒绝。Fireworks 没有新增对闭源跳的区域约束承诺；该页与 Nexus Auto 页仍保留的「Accounts with data residency enabled cannot use Nexus Auto.」相冲突，按两页并列保留。gateway 档 processing_region 结论字段未变（codes 仍为 global/selected），旧引文因厂商改写而在快照中 missing，已改绑到新句。"
summary_en = "The Nexus Auto bullet in the Data residency page's Limitations section was rewritten: the old sentence 'The `auto` model ID can pass a request through to a third-party provider, which Fireworks cannot constrain to a region.' became 'With US residency, `auto` works and serves open-model turns from US-only Serverless. Anthropic and OpenAI turns run on your own provider account, where that provider’s data policies apply. With other regions, `auto` is rejected.', and the bullet label changed from 'Nexus Auto.' to 'Nexus Auto outside the US.'. Previously Nexus Auto was rejected whenever residency was enabled in any region; now `auto` works under US residency, with open-model turns served from US-only Serverless and closed-model turns still running on the customer's own Anthropic/OpenAI account under that provider's data policies, while other regions keep rejecting `auto`. Fireworks adds no new promise that it can constrain the closed-model hop to a region. This page conflicts with the Nexus Auto page's surviving sentence 'Accounts with data residency enabled cannot use Nexus Auto.'; both first-party statements are kept side by side. No gateway processing_region verdict field changed (codes remain global/selected); the old quote became missing after the vendor rewrite, so the anchor was rebound to the new sentences."
issue = "https://github.com/arcships/zdr-monitor/issues/1002"
