summary_zh = "新版 FireRouter 概览页更明确地写开源轮次走 Fireworks serverless、闭源轮次使用客户自有 Anthropic/OpenAI 账号，并新增 Amazon Bedrock 客户账号及逐模型的 Bedrock 区域映射说明；混合路由无法据旧 Anthropic 子处理者美国条目编码为仅 US，也不能将客户自有区域映射当成 FireRouter 全链驻留保证。另新增 Claude Fable 仅向已启用 data retention 的 Anthropic 组织提供的条件；它不是全部 FireRouter 请求正文的保留期限。这说明客户上游配置可影响处理地，但不是 FireRouter 全链区域锁定承诺；本记录不将原有 US 编码的纠错当成新增政策。gateway 档全链 input_output 保留期限仍未披露。"
summary_en = "The revised FireRouter overview describes Fireworks-serverless open-model turns and customer-owned Anthropic/OpenAI closed-model accounts more explicitly, and adds customer-owned Amazon Bedrock accounts with per-model Bedrock region mappings. The mixed route cannot be coded US-only on the basis of the old Anthropic US sub-processor entry, nor do customer-side mappings guarantee end-to-end FireRouter residency. The page also adds an Anthropic data-retention-enabled eligibility condition for Claude Fable; it is not a retention period for all FireRouter request bodies. Customer upstream settings can affect processing location, but do not guarantee end-to-end FireRouter residency; this record does not treat correction of the pre-existing US code as new vendor policy. The gateway's end-to-end input_output retention period remains undisclosed."
issue = "https://github.com/arcships/zdr-monitor/issues/255"
