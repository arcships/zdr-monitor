summary_zh = "《Zero Data Retention》页（docs /guides/security_compliance/data_handling）在 Zero data retention 要点列表之后新增一句：「Enterprise account admins can additionally turn on the Zero Data Retention policy to reject requests and jobs that would persist or log customer content.」。这是新增的一段企业管理员控制项——开启后对会持久化或记录客户内容的请求与任务直接拒绝，而不只是默认承诺不落盘；原有那句「Fireworks has Zero Data Retention by default」及其四条要点、Response API 30 天例外均未改动。api 档 zdr 结论字段未变（仍 mark=yes / mode=default），retention 仍为 basis=none，故未改结论或已有锚点，只在本档 zdr 补一条带锚点（fireworks-datahandling-enterprise-zdr-enforcement）的依据。同轮 data-residency 页只在「Configure with firectl」之后新增等价的「Configure with the API」配置小节（Update Policy Settings / updateMask=residency 的 curl 示例），不涉及任何处理地承诺的改动，故未记录。"
summary_en = "The Zero Data Retention page (docs /guides/security_compliance/data_handling) added one sentence after its Zero data retention bullet list: 'Enterprise account admins can additionally turn on the Zero Data Retention policy to reject requests and jobs that would persist or log customer content.' This is a new enterprise-admin control: once switched on, requests and jobs that would persist or log customer content are rejected outright, rather than only being covered by the default promise not to persist content. The existing 'Fireworks has Zero Data Retention by default' line, its four bullets, and the Response API 30-day exception are unchanged. No verdict field changed on the api tier (zdr remains mark=yes / mode=default; retention remains basis=none), so no verdict or existing anchor was modified; a new anchored point (fireworks-datahandling-enterprise-zdr-enforcement) was added to that tier's zdr dimension. In the same round the data-residency page only added an equivalent 'Configure with the API' subsection (curl example using Update Policy Settings / updateMask=residency) after the firectl section, with no change to any processing-location commitment, so it was not recorded."
issue = "https://github.com/arcships/zdr-monitor/issues/441"
