summary_zh = "FireRouter 概览页删除逐请求凭据保证「Provider keys sent on individual requests are not persisted by FireRouter.」；旧文随后也说明由 Fireworks 开通的 workspace BYOK 凭据会存于客户 workspace。这是凭据对象的书面保证减弱，不证明厂商现已持久化逐请求密钥，更不构成请求/响应正文保留期限的变更；gateway 档 input_output retention 仍为未披露。旧文已列 Anthropic/OpenAI 凭据及各自闭源模型路由，不能将原先 gateway 处理地的 US 编码纠错全归为本次厂商新增。"
summary_en = "The FireRouter overview removed the per-request credential assurance 'Provider keys sent on individual requests are not persisted by FireRouter.' The old page also said Fireworks-provisioned workspace BYOK credentials were stored in the customer workspace. This weakens the written assurance about credentials, but does not establish that per-request keys are now persisted or change the retention period for request/response content; gateway input_output retention remains undisclosed. The old page already described Anthropic/OpenAI credentials and closed-model routes, so correcting the gateway's former US-only processing-region code cannot wholly be attributed to this vendor change."
