summary_zh = "《Zero Data Retention》页（docs /guides/security_compliance/data_handling）2026-11-13 快照（#1217）改写 ZDR 总述并调整例外清单：旧句「Fireworks has Zero Data Retention by default. Specifically, this means」改为「Fireworks does not log or store prompt or generation data for open models, without explicit user opt-in. Zero Data Retention does not apply to certain services that require data storage, including Batch API and Responses API. Specifically, this means」；删除要点「Users can explicitly opt-in to log prompt and generation data for certain advanced features (e.g. FireOptimizer).」，新增「Zero Data Retention does not apply to Batch API, which requires dataset storage」与「Zero Data Retention does not apply to Responses API when the API request has `store=True` (the default)」。旧的无条件句「Fireworks has Zero Data Retention by default」不再出现，但要点「for any open models, without explicit user opt-in」与 Response API 30 天保留条款均未改动。影响：Batch API 被明确排除出 ZDR（此前该页未列此项），Responses API store=True 例外由正文隐含变为清单明示，同时页面不再点名 FireOptimizer 等 advanced features 作为 opt-in 记录路径，透明度与 ZDR 覆盖范围均收窄，故 direction 记为 weakened。api 档结论字段未变（zdr 仍 mark=yes / mode=default，retention 仍 object=input_output / basis=none）；旧引文因厂商删除而 missing，已改绑到仍保留的「without explicit user opt-in」句，并把 Batch API「保留期未披露」一条补上 ZDR 不适用的锚点。"
summary_en = "The 2026-11-13 snapshot (#1217) of the Zero Data Retention page (docs /guides/security_compliance/data_handling) rewrote the ZDR summary and adjusted the exception list. The old sentence 'Fireworks has Zero Data Retention by default. Specifically, this means' became 'Fireworks does not log or store prompt or generation data for open models, without explicit user opt-in. Zero Data Retention does not apply to certain services that require data storage, including Batch API and Responses API. Specifically, this means'. The bullet 'Users can explicitly opt-in to log prompt and generation data for certain advanced features (e.g. FireOptimizer).' was removed, and two bullets were added: 'Zero Data Retention does not apply to Batch API, which requires dataset storage' and 'Zero Data Retention does not apply to Responses API when the API request has `store=True` (the default)'. The unconditional 'Fireworks has Zero Data Retention by default' sentence no longer appears, but the 'for any open models, without explicit user opt-in' bullet and the Response API 30-day retention clause are unchanged. Effect: Batch API is now explicitly excluded from ZDR (it was not listed on this page before), the Responses API store=True exception moves from implicit in the body to an explicit list item, and the page no longer names FireOptimizer or other advanced features as the opt-in logging path; both transparency and the ZDR scope are narrowed, so the direction is recorded as weakened. No api-term verdict field changed (zdr remains mark=yes / mode=default; retention remains object=input_output / basis=none). The old quote became missing after the vendor deletion, so the anchor was rebound to the surviving 'without explicit user opt-in' sentence, and the Batch API 'period undisclosed' point now carries an anchor for its explicit ZDR exclusion."
issue = "https://github.com/arcships/zdr-monitor/issues/1219"
