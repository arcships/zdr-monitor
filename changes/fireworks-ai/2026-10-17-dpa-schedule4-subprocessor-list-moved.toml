summary_zh = "DPA 2026-10-17 版删除了内嵌的 Schedule 4 授权子处理者清单（原列 Amazon Web Services、Google Cloud Platform、Oracle Cloud Infrastructure、Cloudflare、Crusoe、Anthropic 等及其处理地），§6.2 与 Schedule 1 改为指向 https://trust.fireworks.ai/subprocessors；Schedule 2 的物理安全条款也由「managed by AWS, GCP, Oracle Cloud」改为「managed by the cloud service providers」。§6.1 允许在 Company、关联公司或子处理者设有设施的任何地方处理 Covered Data，§3(a) 的 processor 角色与 §4.5 的请求生命周期保留承诺未变。影响：原先可逐条核实的子处理者国别从合同正文消失，透明度减弱；训练档 processing_region 的 US 编码依据（GCP = United States）随之失效，改按 §6.1 记为 global；其余档位 codes 与 role 结论值未变。新清单页不在本快照，未据其推断任何地点。"
summary_en = "The 2026-10-17 DPA removed the embedded Schedule 4 list of authorised sub-processors (previously naming Amazon Web Services, Google Cloud Platform, Oracle Cloud Infrastructure, Cloudflare, Crusoe, Anthropic and others with their processing locations); §6.2 and Schedule 1 now point to https://trust.fireworks.ai/subprocessors. Schedule 2's physical-security clause changed from 'managed by AWS, GCP, Oracle Cloud' to 'managed by the cloud service providers'. §6.1 still allows processing anywhere Company, its Affiliates or Sub-processors maintain facilities; the §3(a) processor role and the §4.5 request-lifecycle retention promise are unchanged. Effect: per-sub-processor country evidence disappeared from the contract text, reducing transparency. The training tier's US processing_region code rested on the removed GCP/United States entry and is now recorded as global under §6.1; all other codes and the role verdict are unchanged. The new list page is not part of this snapshot, so no location is inferred from it."
issue = "https://github.com/arcships/zdr-monitor/pull/699"
