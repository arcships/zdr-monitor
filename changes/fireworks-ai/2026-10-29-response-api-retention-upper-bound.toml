summary_zh = "《Zero Data Retention》页（docs /guides/security_compliance/data_handling）的 Response API 保留条款改写：旧句「All stored conversation data is automatically deleted after 30 days.」改为「Stored conversation data is kept for up to 30 days and is automatically deleted no later than that. Stored responses are held in a cache and can be evicted earlier, often within about an hour, so they are not guaranteed to be retrievable for the full period.」；页面 meta 描述同步由「plus the Response API 30-day retention」改为「plus Response API retention of up to 30 days」。30 天的外层上限未变，新文本把期限性质写明为上限（no later than that），并补充所存响应放在缓存里、可能更早被清除（通常约一小时）、不保证整段期限都能取回。默认 ZDR 段落、store=False 退出选项与 DELETE 立即删除均未改动。api 档 retention 结论字段未变（object=input_output / basis=none；Response API 是本行的一个例外条目，不是默认结论），原引文因厂商改写而在快照中 missing，已改绑到新句并把期限类型写清为上限。"
summary_en = "The Response API retention clause on the Zero Data Retention page (docs /guides/security_compliance/data_handling) was rewritten: 'All stored conversation data is automatically deleted after 30 days.' became 'Stored conversation data is kept for up to 30 days and is automatically deleted no later than that. Stored responses are held in a cache and can be evicted earlier, often within about an hour, so they are not guaranteed to be retrievable for the full period.' The page meta description changed in step, from 'plus the Response API 30-day retention' to 'plus Response API retention of up to 30 days'. The 30-day outer bound is unchanged; the new text states that the period is an upper bound ('no later than that') and adds that stored responses sit in a cache and can be evicted earlier (often within about an hour), so they are not guaranteed to be retrievable for the full period. The default ZDR section, the store=False opt-out and the immediate DELETE path are untouched. No verdict field changed on the api tier (object=input_output / basis=none; the Response API is an exception point under that row, not the default verdict). The old quote became missing in the snapshot because of the vendor rewrite, so the anchor was rebound to the new sentence and the period type is now recorded as an upper bound."
issue = "https://github.com/arcships/zdr-monitor/issues/901"
