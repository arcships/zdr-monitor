summary_zh = "《Data residency》页在 2026-11-18 快照（#1296）重写了 Nexus 与第三方 provider 的区域口径。旧 Limitations 条「Nexus Auto outside the US. With US residency, `auto` works and serves open-model turns from US-only Serverless. Anthropic and OpenAI turns run on your own provider account, where that provider’s data policies apply. With other regions, `auto` is rejected.」改为「Nexus outside the US. US is the only region Nexus supports. Any other region rejects `auto`, and the Anthropic, OpenAI, and Amazon Bedrock models that route through it.」；新增「What residency covers」表，写明 Nexus 调用 Fireworks 开源模型（含 `auto`）由所选区域的 Serverless 提供，第三方 provider 上的模型遵循客户自己账号的配置；新增「Third-party providers」小节，写明 Fireworks 不为第三方选择区域（Anthropic 使用工作区默认、OpenAI 按密钥所属 host 判断、Bedrock 路由须落在驻留区域内但 `global.` profile 可能在 US 之外处理），Claude 订阅登录或 ChatGPT 登录的轮次也可能在 US 之外处理。另把 `inference_geo` 由「deprecated」改为「honored, not overridden」，并新增第三方模型目录 API 在设置驻留后被拒的说明。gateway 档 processing_region 的结论字段未变（codes 仍为 global/selected）：厂商没有新增闭源跳的单区域承诺，反而更明确披露第三方跳可能离开 US；旧引文因厂商改写而 missing，已改绑并拆成四条锚点。"
summary_en = "The 2026-11-18 snapshot (#1296) of the Data residency page rewrote the regional rules for Nexus and third-party providers. The old Limitations bullet 'Nexus Auto outside the US. With US residency, `auto` works and serves open-model turns from US-only Serverless. Anthropic and OpenAI turns run on your own provider account, where that provider’s data policies apply. With other regions, `auto` is rejected.' became 'Nexus outside the US. US is the only region Nexus supports. Any other region rejects `auto`, and the Anthropic, OpenAI, and Amazon Bedrock models that route through it.' A new 'What residency covers' table states that Nexus calls to a Fireworks open model, `auto` included, are served from the selected region’s Serverless, while models on a third-party provider follow the customer’s own account configuration. A new 'Third-party providers' subsection states that Fireworks picks no region for a third party: Anthropic applies the workspace default, OpenAI’s key host is detected, Bedrock routes must stay inside the residency region but a `global.` profile may process outside the US, and Claude subscription or ChatGPT sign-in turns may also be processed outside the US. The page also changed `inference_geo` from 'deprecated' to 'honored, not overridden' and added that the third-party model catalog API is denied while residency is set. No gateway processing_region verdict field changed (codes remain global/selected): the vendor adds no single-region promise for the closed-model hop and now states more explicitly that third-party hops may leave the US; the old quote became missing after the rewrite, so it was rebound and split into four anchors."
issue = "https://github.com/arcships/zdr-monitor/issues/1299"
