summary_zh = "《Data residency》页 2026-11-04 快照（#1029）把数据驻留的覆盖范围从推理扩展到推理与 dedicated 训练：旧句「Data residency restricts inference on your account to a single region. Once a region is set, every request must use that region’s API endpoint and a model served in that region.」改为「Data residency restricts inference and dedicated training on your account to a single region. Once a region is set, every request must use that region’s API endpoint and a model served in that region, and every dedicated training job must run in that region.」；新增 Dedicated training 小节，要求 Supervised fine-tuning、DPO、reinforcement fine-tuning、RLOR trainer 作业显式指定所选区域内的训练区域，未指定或超出该区域的作业被拒绝，并声明只强制作业运行地、不约束 checkpoint 与产物的存储地。Limitations 旧条「Training. Fine-tuning and training jobs are blocked. Support is coming soon.」改为「Serverless training. Serverless Training sessions, runs, and their samplers are blocked. Support is coming soon. Dedicated training is supported.」：开启驻留的账号此前完全不能训练，现在 dedicated 训练可在所选区域内运行，训练限制整体放宽，故 direction 记为 weakened，与同一快照的 fireworks-fire-pass 同日记录（2026-11-04-dedicated-training-region-residency.toml）一致。相应更新本家训练档的 processing_region：codes 由 global 改为 global/selected，反映 dedicated 训练现在可绑定到所选区域内的训练区域；这是限制放宽后新增的可用区域说明，不改变方向判定。原先「开启驻留的账号不能跑训练」的依据改为上述 serverless/dedicated 区分。api 档 codes 未变，仅把「residency 只约束推理」改为「同时约束推理与 dedicated 训练」；旧引文因厂商改写而 missing，已改绑到新句。"
summary_en = "The 2026-11-04 snapshot (#1029) of the Data residency page expanded residency from inference to inference and dedicated training. The old sentence 'Data residency restricts inference on your account to a single region. Once a region is set, every request must use that region’s API endpoint and a model served in that region.' became 'Data residency restricts inference and dedicated training on your account to a single region. Once a region is set, every request must use that region’s API endpoint and a model served in that region, and every dedicated training job must run in that region.' A new Dedicated training section requires supervised fine-tuning, DPO, reinforcement fine-tuning, and RLOR trainer jobs to set an explicit training region inside the selected region, rejects jobs without a region or with one outside it, and states that only where the job runs is enforced, not where its checkpoints and outputs are stored. The Limitations bullet 'Training. Fine-tuning and training jobs are blocked. Support is coming soon.' became 'Serverless training. Serverless Training sessions, runs, and their samplers are blocked. Support is coming soon. Dedicated training is supported.' Accounts with residency previously could not train at all; dedicated training can now run inside the selected region, so the training restriction is relaxed overall and direction is weakened, consistent with the same snapshot's same-day fireworks-fire-pass record (2026-11-04-dedicated-training-region-residency.toml). The training tier's processing_region is updated accordingly: codes move from global to global/selected to reflect that dedicated training can now be bound to a training region inside the selected region; this records the newly available option that follows from the relaxation and does not change the direction call. The former basis 'accounts with residency cannot run training' is replaced with the serverless/dedicated distinction above. The api tier's codes are unchanged; only the point saying residency restricts inference alone was corrected to cover dedicated training too, and the old quote became missing after the vendor rewrite, so the anchor was rebound to the new sentence."
issue = "https://github.com/arcships/zdr-monitor/issues/1031"
