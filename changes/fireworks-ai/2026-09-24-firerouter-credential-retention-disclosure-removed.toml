summary_zh = "FireRouter 概览页改版：上一版唯一与保留沾边的披露「Provider keys sent on individual requests are not persisted by FireRouter.」，连同 pass-through 路由表（闭源模型默认 Claude Opus 5、用客户自己的 Anthropic provider key 计费）都不再出现在页面上，该页也没有任何新表述替代它们。改版后的页面只讲 router id 选路、逐轮计费与各闭源模型所需凭据。网关档 retention 结论不变（仍为 basis=undisclosed：闭源模型这一跳的请求正文保留期从未披露过），此处记录的是那条凭据侧披露的消失。"
summary_en = "The FireRouter overview page was rewritten. The only retention-adjacent disclosure it carried — \"Provider keys sent on individual requests are not persisted by FireRouter.\" — is gone, along with the pass-through routing table (closed-source model by default Claude Opus 5, billed with the customer's own Anthropic provider key), and nothing on the new page replaces either one: it covers router-ID selection, per-turn billing, and the provider credential each closed model needs. The gateway tier's retention verdict is unchanged (still basis=undisclosed — the retention period of request content on the closed-model hop was never disclosed); what is recorded here is the removal of that credential-side disclosure."
issue = "https://github.com/arcships/zdr-monitor/issues/255"
