summary_zh = "中国站《Token Plan 个人版套餐概览》(最近更新时间 2026-11-04) 的「通用 Token Plan 套餐 › 可用模型」表把逐行重复的 DeepSeek 原厂直供说明合并为表前一条泛指说明。旧正文中 DeepSeek-V4.1-Flash 原厂直供与 DeepSeek-V4-Flash 正式版 原厂直供两行的「说明」都写『DeepSeek 直接提供的 DeepSeek V4 Flash 正式版模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。』(Flash 行另附版本说明)，DeepSeek-V4-Pro 正式版 原厂直供行的「说明」写『由 DeepSeek 直接提供的 DeepSeek V4 Pro 正式版模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。』(另附版本说明)；新版把这三行的「说明」都改为『-』，并在表格前新增说明『DeepSeek 原厂直接提供的模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。』。同表还把原厂直供行名由 DeepSeek-V4.1-Flash 原厂直供改为 DeepSeek-V4.1-Flash-1017 原厂直供(Model ID 仍为 deepseek/deepseek-flash)，并新增两行未标注原厂直供的 DeepSeek-V4.1-Flash-1017(deepseek-v4.1-flash-1017)与 DeepSeek-V4-Pro 0813 正式版(deepseek-v4-pro-0813)；标注原厂直供的行仍为三行，没有新模型进入第三方条款范围，但同表已同时列出未标注原厂直供的 DeepSeek 型号，故旧句『套餐内 DeepSeek-V4 系列为第三方原厂直供』的范围说明不再成立，已收窄为仅指标注原厂直供的型号。厂商只是把重复说明合并为泛指表述，第三方协议优先的口径未变，故方向记 clarified。旧句被厂商改写后，锚点 scope-deepseek-original-supply 由 missing 改绑到新的表前说明句，并作为独立 training point 的证据绑定；个人版 training 结论字段(mark=no / mode=opt_out)未变。同轮其余改动是套餐对比、价格与 Hy Token Plan 型号/额度调整，与五个维度无关。"
summary_en = "On the CN 《Token Plan 个人版套餐概览》 page (last updated 2026-11-04), the 通用 Token Plan › 可用模型 table consolidated the per-row DeepSeek original-supply notes into one generic note above the table. In the old text, the DeepSeek-V4.1-Flash 原厂直供 and DeepSeek-V4-Flash 正式版 原厂直供 rows both carried the 说明 'DeepSeek 直接提供的 DeepSeek V4 Flash 正式版模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。' (the Flash row also carried a version note), and the DeepSeek-V4-Pro 正式版 原厂直供 row carried '由 DeepSeek 直接提供的 DeepSeek V4 Pro 正式版模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。' (plus a version note). The new version replaces all three 说明 cells with '-', and adds a note before the table: 'DeepSeek 原厂直接提供的模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。'. The same table renames the original-supply row DeepSeek-V4.1-Flash 原厂直供 to DeepSeek-V4.1-Flash-1017 原厂直供 (Model ID unchanged, deepseek/deepseek-flash) and adds two rows without the 原厂直供 label: DeepSeek-V4.1-Flash-1017 (deepseek-v4.1-flash-1017) and DeepSeek-V4-Pro 0813 正式版 (deepseek-v4-pro-0813). The original-supply rows remain three, so no model newly enters the third-party-terms carve-out; however, the same table now also lists DeepSeek models without the 原厂直供 label, so the old scope wording '套餐内 DeepSeek-V4 系列为第三方原厂直供' no longer holds and was narrowed to the labeled original-supply models only. The vendor merely merged duplicated notes into a generic sentence and the third-party-terms-prevail position is unchanged, so the direction is recorded as clarified. The vendor rewrote the old sentence, so the anchor scope-deepseek-original-supply moves from missing to the new table-level note and is bound to a dedicated training point; the personal tier's training verdict fields (mark=no, mode=opt_out) are unchanged. The rest of the round is plan-comparison, pricing and Hy Token Plan model/quota changes, unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1057"
