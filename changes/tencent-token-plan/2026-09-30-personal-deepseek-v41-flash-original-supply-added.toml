summary_zh = "中国站《Token Plan 个人版套餐概览》(最近更新时间 2026-09-30) 的『通用 Token Plan 套餐 › 可用模型』表新增一行『DeepSeek-V4.1-Flash 原厂直供』(Model ID deepseek/deepseek-flash)；上一版该表只有 DeepSeek-V4-Flash 正式版 原厂直供、DeepSeek-V4-Pro 正式版 原厂直供两个原厂直供行，新增行在旧正文里逐字不存在。新增行的说明沿用 DeepSeek-V4-Flash 行的原句『DeepSeek 直接提供的 DeepSeek V4 Flash 正式版模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。』，该句在本页因此出现两次，绑在 Flash 行的原锚点 scope-deepseek-original-supply 由唯一命中变为 ambiguous，改绑到同表 DeepSeek-V4-Pro 行仍唯一的同款说明句『由 DeepSeek 直接提供的 DeepSeek V4 Pro 正式版模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守』。『原厂直供』(第三方直接供给)名单增加一个模型，意味着适用 DeepSeek 自身协议而非 TokenHub 平台规则的口径范围扩大，故方向记 weakened。本页没有留存/训练/ZDR/处理地/协议角色条款，个人版 training 结论字段(mark=no / mode=opt_out)未变。同轮其余改动是套餐价格与积分额度(Hy Token Plan 各档改为 560/1560/4760/9360 积分等)，与五个维度无关。"
summary_en = "On the CN 《Token Plan 个人版套餐概览》 page (last updated 2026-09-30), the 通用 Token Plan › 可用模型 table gained a row, DeepSeek-V4.1-Flash 原厂直供 (Model ID deepseek/deepseek-flash). The previous version of that table had only two 原厂直供 rows (DeepSeek-V4-Flash 正式版 原厂直供 and DeepSeek-V4-Pro 正式版 原厂直供); the added row does not appear verbatim anywhere in the old text. Its 说明 reuses verbatim the sentence already carried by the DeepSeek-V4-Flash row: DeepSeek 直接提供的 DeepSeek V4 Flash 正式版模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。 That sentence now occurs twice on the page, so the anchor scope-deepseek-original-supply, which was bound to the Flash row, went from a single hit to ambiguous; it was rebound to the still-unique equivalent sentence on the DeepSeek-V4-Pro row (由 DeepSeek 直接提供的 DeepSeek V4 Pro 正式版模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守). One more model joins the 原厂直供 group (supplied directly by DeepSeek), widening the carve-out under which DeepSeek's own terms rather than TokenHub's platform rules apply, so the direction is recorded as weakened. The page carries no retention/training/ZDR/region/role clauses of its own and the personal tier's training verdict fields (mark=no, mode=opt_out) are unchanged. The rest of the same round is plan pricing and credit quotas (e.g. the Hy Token Plan tiers moving to 560/1560/4760/9360 credits), unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/421"
