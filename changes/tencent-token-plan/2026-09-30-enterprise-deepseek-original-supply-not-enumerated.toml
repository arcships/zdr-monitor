summary_zh = "中国站《Token Plan 企业版专业套餐》(最近更新时间 2026-09-30) 把 DeepSeek 原厂直供说明由列举型号改写为泛指：旧句『由 DeepSeek 直接提供的模型服务（DeepSeek-V4-Flash 正式版 原厂直供、DeepSeek-V4-Flash 正式版 原厂直供、DeepSeek-V4-Pro 正式版 原厂直供、DeepSeek-V4-Flash-Vision-Exp 原厂直供），TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。』改为『由 DeepSeek 原厂直供的模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。』。旧括注与同页『可用模型』表本就对不上：漏列了表中已有的 DeepSeek-V4.1-Flash 原厂直供(deepseek/deepseek-flash)，又把 DeepSeek-V4-Flash 正式版重复写了两遍。同轮广州与新加坡两张可用模型表的『原厂直供』行改动前后都各为 4 行(DeepSeek-V4.1-Flash、DeepSeek-V4-Flash、DeepSeek-V4-Pro、DeepSeek-V4-Flash-Vision-Exp)，只是行名从『DeepSeek-V4-Flash 正式版 原厂直供』『DeepSeek-V4-Pro 正式版 原厂直供』改为带版本号的『DeepSeek-V4-Flash 0731 正式版 原厂直供』『DeepSeek-V4-Pro 0813 正式版 原厂直供』(Model ID 未变)，没有新模型进入第三方条款范围。故方向记 clarified：本轮是让句子跟上表格、去掉重复与漏列，不是收紧。旧句被厂商改写，锚点 scope-enterprise-deepseek-original-supply 由 missing 改绑到新句；企业版 training 结论字段(mark=yes / mode=by_tier)未变，第三方条款优先的口径仍由《第三方部署模型服务特别说明》301/136530 §3.5 支撑。同轮其余改动是积分抵扣价、峰谷计费与限时优惠条目的价格与生效说明，与五个维度无关。"
summary_en = "On the CN 《Token Plan 企业版专业套餐》 page (last updated 2026-09-30), the DeepSeek original-supply note was changed from an enumeration of models to a generic phrase: the old sentence '由 DeepSeek 直接提供的模型服务（DeepSeek-V4-Flash 正式版 原厂直供、DeepSeek-V4-Flash 正式版 原厂直供、DeepSeek-V4-Pro 正式版 原厂直供、DeepSeek-V4-Flash-Vision-Exp 原厂直供），TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。' became '由 DeepSeek 原厂直供的模型服务，TokenHub 不对该服务提供 SLA 保障。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读相关内容，如不接受上述内容，请立即停止使用。'. The old parenthetical was already inconsistent with the page's own 可用模型 tables: it omitted DeepSeek-V4.1-Flash 原厂直供 (deepseek/deepseek-flash), which those tables already listed, and repeated DeepSeek-V4-Flash 正式版 twice. In the same round each of the Guangzhou and Singapore 可用模型 tables still carries exactly four 原厂直供 rows (DeepSeek-V4.1-Flash, DeepSeek-V4-Flash, DeepSeek-V4-Pro, DeepSeek-V4-Flash-Vision-Exp); only the row names gained version tags (DeepSeek-V4-Flash 正式版 原厂直供 / DeepSeek-V4-Pro 正式版 原厂直供 became DeepSeek-V4-Flash 0731 正式版 原厂直供 / DeepSeek-V4-Pro 0813 正式版 原厂直供, Model IDs unchanged). No model newly entered the third-party-terms carve-out, so the direction is recorded as clarified: the sentence was brought in line with the tables and the stale duplicate/omission dropped, not tightened. The old sentence was rewritten by the vendor, so the anchor scope-enterprise-deepseek-original-supply moves from missing to the new sentence. The enterprise tier's training verdict fields (mark=yes, mode=by_tier) are unchanged, and third-party terms still prevail per 《第三方部署模型服务特别说明》301/136530 §3.5. The rest of the same round is pricing (积分抵扣价, peak/off-peak billing, 限时优惠) and effective-date wording, unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/421"
