summary_zh = """《产品和服务协议》重新发布：发布日期由 2024-06-14 改为 2026-11-27，生效日期由 2024-06-21 改为 2026-12-03。与五个维度相关的条款没有实质变化：旧版 §12.8 的服务终止后十五（15）天保留期整句保留、文字逐字未变，新版本编号为 §12.7；旧版 §6.6「除为了提供产品和服务所必须……并在提供服务后的合理期限内删除您的客户数据或进行匿名化处理」只把「所必须」写成「所必需」，§6.8 同样是「必须→必需」的用字修正；§1.3「中立的技术服务提供者」与 §6.7 运营数据条款未改。编号变化来自旧版 §12.7（提前三十日终止通知）并入新版 §12.8，旧 §12.9 提前终止情形顺延为 §12.8、旧 §12.10 变更通知顺延为 §12.9，故新版的 §12.8 不再指保留期。其余改动——新增 §5.4 把 AI 相关服务指向《火山引擎AI服务规则及免责声明》、§9.1 增加出口管制承诺、优惠与退款条款细化、删除行内加粗——都不涉及训练、保留、ZDR、处理地或受托角色，未改任何维度结论。"""
summary_en = """The Products and Services Agreement was republished: the publication date moved from 2024-06-14 to 2026-11-27 and the effective date from 2024-06-21 to 2026-12-03. None of the clauses bearing on the five dimensions changed in substance: the old §12.8's 15-day post-termination retention sentence is retained word for word and is now numbered §12.7; the old §6.6 ('except as necessary to provide the products and services ... delete your customer data or anonymize it within a reasonable period after providing the service') only corrects the character 所必须 to 所必需, as does §6.8. §1.3 ('a neutral technology service provider') and the §6.7 operating-data clause are unchanged. The renumbering comes from folding the old §12.7 (30-day termination notice) into the new §12.8; the old §12.9 early-termination list became §12.8 and the old §12.10 change-notice clause became §12.9, so §12.8 no longer denotes the retention period. The remaining edits — a new §5.4 referring AI-related services to the Volcengine AI Service Rules and Disclaimer, an export-control undertaking added to §9.1, expanded discount/refund wording, and removal of inline bold — do not touch training, retention, ZDR, processing region or the processor role. No verdict changed."""
issue = "https://github.com/arcships/zdr-monitor/issues/1502"
