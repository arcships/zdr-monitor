summary_zh = "docs /admin/monitor-comply/zero-data-retention 的 ZDR 适用范围收窄两处：(1) 信息框与 Vibe CLI 段由「ZDR is available on paid plans …」「on a paid plan」改为「on pay-as-you-go …」「on pay-as-you-go」，明确只在按量付费档提供，不再写作泛指付费计划；(2) 端点覆盖说明由「except Labs models」改为「except Labs and Public Preview models」，新增 Public Preview 模型为排除项。无状态 API 的 ZDR 承诺（不存储/记录输入输出）与申请制未变，api 档 zdr 仍为 mark=yes / by_agreement；retention 的 30 天输入输出口径未变。"
summary_en = "The ZDR scope on docs /admin/monitor-comply/zero-data-retention narrowed in two places: (1) the information box and the Vibe CLI paragraph changed from 'ZDR is available on paid plans …' / 'on a paid plan' to 'on pay-as-you-go …' / 'on pay-as-you-go', making pay-as-you-go the explicit eligibility rather than paid plans generally; (2) the endpoint coverage line changed from 'except Labs models' to 'except Labs and Public Preview models', adding Public Preview models to the exclusion. The ZDR commitment for stateless API calls (does not store or log inputs and outputs) and the application process are unchanged, and the api tier stays zdr mark=yes / by_agreement; the 30-day Input/Output retention figure is unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/1367"
