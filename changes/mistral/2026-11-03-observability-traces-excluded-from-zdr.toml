summary_zh = "docs /admin/monitor-comply/zero-data-retention 的 ZDR 排除清单新增「Traces sent to Studio Observability」，并补充说明：启用 Studio Observability 后，它会存储应用发送的 traces 以便日后查看；Org Admin 可为整个组织关闭 Observability，之后该组织任何 workspace 发出的 traces 不再被摄取。zdr 维度：ZDR 覆盖范围收窄，但仅针对可选的 Observability 功能；无状态 API 的 ZDR 承诺本身未变，api 档 zdr 仍为 mark=yes / by_agreement（旧正文只列 Agents、Batch、Conversations、Libraries、/v1/files、Vibe Work、Chat）。retention 维度：新增「启用 Observability 后 traces 会被存储」这一对象与语境事实，但页面未给出 traces 的保留期限；输入输出 30 天口径不变。"
summary_en = "The ZDR exclusion list on docs /admin/monitor-comply/zero-data-retention gained an entry for 'Traces sent to Studio Observability', with an added explanation: when Studio Observability is enabled it stores the traces applications send so they can be explored later, and an Org Admin can disable Observability for the organization, after which traces sent from any workspace in the organization are no longer ingested. For zdr this narrows ZDR's scope, but only for the optional Observability feature; the ZDR commitment for stateless API calls is unchanged, and the api tier stays zdr mark=yes / by_agreement (the old text listed only Agents, Batch, Conversations, Libraries, /v1/files, Vibe Work and Chat). For retention it adds an object/context fact — traces are stored when Observability is enabled — but no retention period is stated for them; the 30-day Input/Output figure is unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/1011"
