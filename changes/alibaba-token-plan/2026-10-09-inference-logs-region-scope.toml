summary_zh = "国际站 Model Studio「Model monitoring」页更新（Updated at 2026-09-11 14:33:01 → 2026-10-09 04:17:35）。与五维有关的变化只有一处：inference log 章在「Enable inference logs」段后新增 Note「Inference logs are currently supported only in the Beijing and Singapore regions; other regions are not yet supported.」——给唯一记录完整 Prompt/Response 的日志类型加了地域范围限定。本 provider 两档均在新加坡地域提供（Token Plan 仅新加坡），该功能可用，故五维结论字段均未变：retention 仍 object=input_output、basis=undisclosed，processing_region 个人版仍 codes=[SG, global]、团队版仍 codes=[SG]；本次只在 retention 维度补一条带锚点的范围说明。同页另两处改动不涉及五维：监控指标表新增 Cache hit volume / Cache hit rate 两行，属指标目录扩充，平台默认存储 monitoring metrics 的口径未变；页脚 Previous/Next 由「Permission management」改为「Asset center」，与 Updated at 时间戳同属装饰性改动。"
summary_en = "The Model monitoring page on the International site was updated (Updated at 2026-09-11 14:33:01 → 2026-10-09 04:17:35). Only one change touches the five dimensions: a Note was added after the 'Enable inference logs' paragraph — 'Inference logs are currently supported only in the Beijing and Singapore regions; other regions are not yet supported.' — putting a regional scope limit on the only log type that records the complete Prompt and Response. Both tiers of this provider are served from the Singapore region (Token Plan is Singapore-only), where inference logs are available, so no verdict field changed: retention stays object=input_output and basis=undisclosed, and processing_region stays codes=[SG, global] for Personal and codes=[SG] for Team; this round only adds one anchored scope point under retention. Two other changes on the page are unrelated to the five dimensions: the monitoring metric table gained the rows 'Cache hit volume' and 'Cache hit rate', a metric-catalog addition that does not change the platform's default storage of monitoring metrics; and the footer Previous/Next link changed from 'Permission management' to 'Asset center', together with the Updated-at timestamp — both cosmetic."
issue = "https://github.com/arcships/zdr-monitor/issues/568"
