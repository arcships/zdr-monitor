summary_zh = "docs /generative-apis/reference-content/data-privacy 的滥用临时留存段落收窄适用范围：原句「It is only in the event of misuse harming the service functionality ... that we may store temporarily and access the full content of HTTP requests」改为「For Serverless, it is only in the event of misuse ...」，并在该段末新增「This temporary data storage does not apply to Dedicated Deployments」。即该文档层的最多两周完整 HTTP 请求内容临时存储只适用于 Serverless，Dedicated Deployment 明确不适用；合同层 AI Services §4.4 的滥用例外未改动。五个维度结论值均不变。同一快照的其余改动只是给 General Privacy Policy、supervisory authority 等链接补「(External link)」标记，与政策语义无关。"
summary_en = "The abuse temporary-retention paragraph on docs /generative-apis/reference-content/data-privacy was narrowed in scope: the former sentence 'It is only in the event of misuse harming the service functionality ... that we may store temporarily and access the full content of HTTP requests' now reads 'For Serverless, it is only in the event of misuse ...', and a new closing sentence states 'This temporary data storage does not apply to Dedicated Deployments'. The document-level temporary storage of full HTTP request content (up to two weeks) therefore applies to Serverless only and is expressly excluded for Dedicated Deployment; the contract-level abuse exception in AI Services Section 4.4 is unchanged. No verdict value on the five dimensions changes. The remaining edits in the same snapshot only append '(External link)' markup to the General Privacy Policy and supervisory-authority links and carry no policy meaning."
issue = "https://github.com/arcships/zdr-monitor/issues/1223"
