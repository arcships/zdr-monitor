summary_zh = "2026-11-02 国际站百炼产品简介页（zh/en）整体改版为《模型服务概览》。中文页删除「我的数据安全吗？阿里云百炼会用我的数据进行训练吗？」问答整段，其中旧句『使用百炼按量付费 API 和 Token Plan 团队版时，不会将您的数据用于模型训练』与『Token Plan 个人版和 Coding Plan 的数据使用条款与上述承诺不同。使用 Coding Plan 期间，模型输入及模型生成的内容将用于服务改进与模型优化』一并消失；英文页删除同一 FAQ 的无例外句『Alibaba Cloud protects data privacy and will never use your data for model training.』。两页还删除了地域 FAQ：中文旧正文曾列出『华北2（北京）、美国（弗吉尼亚）、新加坡、德国（法兰克福）、日本（东京）和中国香港地域』及地域接入点说明，英文页删除对应的 region availability 说明；当前两页只剩产品概览、快速开始、模型卡片与开始构建，全篇没有关于使用或训练用户数据、数据保留、零保留或 Coding Plan/subscription 的表述。三处引文 wms-zh-training-codingplan-exception、wms-zh-training-baseline-scope、wms-en-training-baseline-no-exception 在新快照中 missing；原句确已删除且同页没有可改绑的新表述，故移除这三个锚点，未改绑到其它来源。training 结论字段未变：api 档仍为 mark=yes / mode=by_tier（锚点 pt-training-no-improve-unless-consent），coding-plan-personal 档仍为 mark=no / mode=opt_out（锚点 agr-training-codingplan-authorization）。processing_region 结论也未变：仍由 Regions 文档与 DPA §6.1 的现有锚点支撑；删除地域 FAQ 不证明具体 Coding Plan 处理地域变化，且原先关于订阅页链接的观察已改为仅指向 2026-11-02 前旧版页面，不能作为当前快照证据。retention、zdr、role 未受影响。方向记为 weakened：厂商撤下产品简介页的训练口径、Coding Plan 例外表述及地域 FAQ，但合同和专门来源的现行结论未因此改判。"
summary_en = "On 2026-11-02 the international-site Model Studio product-introduction pages (zh and en) were replaced with 'Model service overview'. The Chinese page dropped the whole FAQ entry 'Is my data secure? Will Alibaba Cloud Model Studio use my data for training?' together with the sentences 'When using the pay-as-you-go API and Token Plan Team edition, your data will not be used for model training' and 'The data-use terms of Token Plan Individual and Coding Plan differ from the above commitment. While using Coding Plan, model input and model-generated content will be used for service improvement and model optimization'. The English page dropped the same FAQ's unqualified sentence 'Alibaba Cloud protects data privacy and will never use your data for model training.' Both pages also dropped the region FAQ: the old Chinese body listed 'China (Beijing), US (Virginia), Singapore, Germany (Frankfurt), Japan (Tokyo), and China (Hong Kong)' and described regional endpoints, while the English page dropped the corresponding region-availability statement; the current pages contain only the product overview, quickstart, model cards and build sections, with no statement about using or training on user data, data retention, zero retention, or Coding Plan/subscription. The three quotes wms-zh-training-codingplan-exception, wms-zh-training-baseline-scope and wms-en-training-baseline-no-exception are now missing from the snapshots; the sentences were genuinely deleted and no same-page replacement exists, so the three anchors were removed rather than rebound to other sources. No conclusion field changed: api training remains mark=yes / mode=by_tier (anchor pt-training-no-improve-unless-consent), and coding-plan-personal training remains mark=no / mode=opt_out (anchor agr-training-codingplan-authorization). The processing_region conclusion also remains unchanged and continues to rest on the existing Regions and DPA §6.1 anchors; deletion of the region FAQ does not establish a change to Coding Plan processing locations. The former subscription-link observation is now explicitly limited to the pre-2026-11-02 page and is not treated as evidence from the current snapshot. retention, zdr and role are unaffected. Direction is recorded as weakened because the vendor withdrew the product-page training wording, Coding Plan carve-out and region FAQ, while the contractual and dedicated-source conclusions remain unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/996"
