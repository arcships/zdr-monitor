summary_zh = "Token Factory 文档站 Data Lab → Data Processing 页新增 Data retention 表（旧版没有该表）：未导出为数据集的 raw completions「Deleted automatically after 1 year」；上传的数据集、导出 completions 生成的数据集、批量任务完成后的数据集均「Kept until you delete them」，并写明「Datasets have no automatic expiration, so you can delete them at any time」。同时从「For all data you submit or generate through Data Lab, including」清单删去旧的「Fine-tuning results」一行；页面开头仍把 fine-tuning results 列为 Data Lab 数据类型，但清单和 retention 表都不再给出它的保留期限。该页是 Data Lab 产品说明，没有官方原句把这张表扩到按量 api 档，故 api 档 retention 维持 undisclosed；post-training-data-lab 档仍为 object=mixed、basis=undisclosed（词表没有「留至客户删除」的 basis，且各对象期限不同），逐对象期限记入 point。处理地句与 Data Processor 句未变。"
summary_en = "The Token Factory docs Data Lab → Data Processing page added a Data retention table (the previous version had none): raw completions not exported to a dataset are 'Deleted automatically after 1 year'; uploaded datasets, datasets created by exporting completions, and datasets created from completed batch jobs are all 'Kept until you delete them', with 'Datasets have no automatic expiration, so you can delete them at any time'. The old 'Fine-tuning results' list item was removed from the 'For all data you submit or generate through Data Lab, including' list; the page introduction still names fine-tuning results as a Data Lab data type, but neither the list nor the retention table states a retention period for them. The page describes the Data Lab product and no official sentence extends this table to the pay-as-you-go api tier, so that tier's retention stays undisclosed; post-training-data-lab stays object=mixed, basis=undisclosed (the vocabulary has no basis for 'kept until customer deletion' and the objects have different periods), with the object-level periods recorded in points. The processing-location sentence and the Data Processor sentence are unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/793"
