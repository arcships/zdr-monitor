summary_zh = "docs /accounts/data-residency（Enterprise 功能页）新增 What residency covers 一节与 Third-party providers 小节：『Residency sets where Fireworks serves. For a model that runs on a third-party provider, Fireworks follows the region you have already configured with that provider.』覆盖表中，Nexus calls to a Fireworks open model, auto included 受所选区域约束，而 Anthropic、OpenAI、Amazon Bedrock 走客户自己的 provider 账号时『Follows your provider setting』；正文并称 Claude 订阅登录或 ChatGPT 登录的轮次『follow that provider’s own policies and settings, and may be processed outside the US』。Serverless 小节把 inference_geo 从旧句『**`inference_geo` is deprecated** in favor of data residency. As you switch over, remove the `inference_geo` field from your request bodies and the `Fireworks-Inference-Geo` header from your requests.』改为『**`inference_geo` is honored, not overridden.**』：发送 us 可让单次请求只由该模型的 US 部署提供，模型无 US 部署则返回 404，账号级规则仍应改用 data residency。Limitations 中旧条『**Nexus Auto outside the US.** With US residency, `auto` works and serves open-model turns from US-only Serverless. Anthropic and OpenAI turns run on your own provider account, where that provider’s data policies apply. With other regions, `auto` is rejected. See Enterprise Controls.』改为『**Nexus outside the US.** US is the only region Nexus supports. Any other region rejects `auto`, and the Anthropic, OpenAI, and Amazon Bedrock models that route through it. See Enterprise Controls.』，并新增一条：设置区域后 ListThirdPartyModels / GetThirdPartyModel 返回 PERMISSION_DENIED。默认 None（不限制区域）、Enterprise feature 限定与 Residency applies account-wide 的原文均未变；本档 plan_level=individual，processing_region 的结论字段（codes=[\"global\"]）与全部锚点均未变，故只记厂商变化、不改判定。导航与各级标题的改动属版式调整，与五个维度无关。"
summary_en = "docs /accounts/data-residency (an Enterprise feature page) added a What residency covers section and a Third-party providers subsection: 'Residency sets where Fireworks serves. For a model that runs on a third-party provider, Fireworks follows the region you have already configured with that provider.' The coverage table marks 'Nexus calls to a Fireworks open model, `auto` included' as governed by the selected region, while 'Anthropic, OpenAI, and Amazon Bedrock on your own provider account' 'Follows your provider setting'. The text also states that turns from a Claude subscription login or a ChatGPT sign-in 'follow that provider’s own policies and settings, and may be processed outside the US'. In the Serverless subsection, the old sentence '**`inference_geo` is deprecated** in favor of data residency. As you switch over, remove the `inference_geo` field from your request bodies and the `Fireworks-Inference-Geo` header from your requests.' became '**`inference_geo` is honored, not overridden.**': sending us serves a single request only from that model's US deployments, a model with none returns 404, and account-wide rules should use data residency instead. In Limitations, the old bullet '**Nexus Auto outside the US.** With US residency, `auto` works and serves open-model turns from US-only Serverless. Anthropic and OpenAI turns run on your own provider account, where that provider’s data policies apply. With other regions, `auto` is rejected. See Enterprise Controls.' became '**Nexus outside the US.** US is the only region Nexus supports. Any other region rejects `auto`, and the Anthropic, OpenAI, and Amazon Bedrock models that route through it. See Enterprise Controls.', and a new bullet says ListThirdPartyModels / GetThirdPartyModel return PERMISSION_DENIED while a region is set. The default None (unrestricted) wording, the Enterprise feature restriction, and 'Residency applies account-wide' are unchanged. This tier has plan_level=individual, so no processing_region verdict field changed (codes=[\"global\"]) and all anchors remain valid; the change is recorded without altering the verdict. Navigation and heading-level edits are layout changes unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1298"
