summary_zh = "docs /accounts/data-residency 的 Limitations 一节改写 Nexus Auto 条目。旧句『**Nexus Auto.** The `auto` model ID can pass a request through to a third-party provider, which Fireworks cannot constrain to a region. See Nexus Auto.』改为『**Nexus Auto outside the US.** With US residency, `auto` works and serves open-model turns from US-only Serverless. Anthropic and OpenAI turns run on your own provider account, where that provider’s data policies apply. With other regions, `auto` is rejected. See Enterprise Controls.』旧句是在账号设置区域后对 auto 的一律限制（会转给第三方、Fireworks 无法约束区域）；新句按 region 分情况：US residency 下 auto 可用，开源模型轮次由 US-only Serverless 提供，Anthropic/OpenAI 轮次走客户自己的 provider 账号并适用该 provider 的数据政策，其他区域则拒绝 auto。第三方轮次仍不受 Fireworks 区域约束。该条目以账号已设置 region 为前提；本档 plan_level=individual，文档未明示本档能否启用该账号级开关，因此本档 processing_region 的结论字段（codes=[\"global\"]）与全部锚点均未变。页面其余部分（None 默认、Enterprise feature 限定、Training/BYOC 限制）原文未动。"
summary_en = "The Limitations section of docs /accounts/data-residency rewrote the Nexus Auto bullet. The old text, '**Nexus Auto.** The `auto` model ID can pass a request through to a third-party provider, which Fireworks cannot constrain to a region. See Nexus Auto.', became '**Nexus Auto outside the US.** With US residency, `auto` works and serves open-model turns from US-only Serverless. Anthropic and OpenAI turns run on your own provider account, where that provider’s data policies apply. With other regions, `auto` is rejected. See Enterprise Controls.' The old text was a blanket restriction once a region is set on the account (auto can route to a third party that Fireworks cannot constrain to a region); the new text splits the case by region: under US residency auto works, with open-model turns served from US-only Serverless while Anthropic/OpenAI turns use the customer's own provider account and that provider's data policies; in other regions auto is rejected. Third-party turns remain outside Fireworks' regional control. This bullet only applies when a region is set on the account. This tier has plan_level=individual, and the documentation does not state whether it can enable that account-level toggle, so no processing_region verdict field for this tier changed (codes=[\"global\"]) and all of its anchors remain valid. The rest of the page (None default, Enterprise feature scope, Training/BYOC limits) is untouched."
issue = "https://github.com/arcships/zdr-monitor/issues/1001"
