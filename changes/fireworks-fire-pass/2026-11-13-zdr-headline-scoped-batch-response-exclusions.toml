summary_zh = "docs /guides/security_compliance/data_handling 的 Zero data retention 一节重写：段首从无条件的『Fireworks has Zero Data Retention by default.』改为『Fireworks does not log or store prompt or generation data for open models, without explicit user opt-in. Zero Data Retention does not apply to certain services that require data storage, including Batch API and Responses API.』同节新增两条明文排除——『Zero Data Retention does not apply to Batch API, which requires dataset storage』与『Zero Data Retention does not apply to Responses API when the API request has `store=True` (the default)』——并删去『Users can explicitly opt-in to log prompt and generation data for certain advanced features (e.g. FireOptimizer).』这一条。ZDR 承诺的范围因此收窄（新增 Batch API 排除、段首改为按 open models 限定），但 Fire Pass 的结论字段未变：zdr 仍以 contract 层 ToS §3.6 为主证据（mark=yes、mode=default），retention 仍为 object=mixed、basis=none；本次只更新文档层说明与锚点，并为 Batch API 这一新披露的存储路径补一条 retention 说明。"
summary_en = "The Zero data retention section of docs /guides/security_compliance/data_handling was rewritten. The opening changed from the unqualified 'Fireworks has Zero Data Retention by default.' to 'Fireworks does not log or store prompt or generation data for open models, without explicit user opt-in. Zero Data Retention does not apply to certain services that require data storage, including Batch API and Responses API.' Two explicit exclusions were added to the same section — 'Zero Data Retention does not apply to Batch API, which requires dataset storage' and 'Zero Data Retention does not apply to Responses API when the API request has `store=True` (the default)' — and the bullet 'Users can explicitly opt-in to log prompt and generation data for certain advanced features (e.g. FireOptimizer).' was removed. The scope of the ZDR statement therefore narrowed (a new Batch API exclusion, and the opening now limited to open models), but no Fire Pass verdict field changed: zdr is still governed by the contract-layer ToS §3.6 (mark=yes, mode=default), and retention remains object=mixed, basis=none. Only the developer-data points and anchors were updated, plus one retention point for the newly disclosed Batch API storage path."
issue = "https://github.com/arcships/zdr-monitor/issues/1218"
