summary_zh = "docs /guides/security_compliance/data_handling 的 Response API 保留条款由『All stored conversation data is automatically deleted after 30 days.』改写为『Stored conversation data is kept for up to 30 days and is automatically deleted no later than that. Stored responses are held in a cache and can be evicted earlier, often within about an hour, so they are not guaranteed to be retrievable for the full period.』同页摘要也从『plus the Response API 30-day retention』改为『plus Response API retention of up to 30 days』。语义从固定『30 天后删除』改为上限式『最长 30 天、最晚届时删除』，并新增两点：存入缓存的响应可能更早被逐出（常见约 1 小时内），以及不保证整个期限内都可检索。Fire Pass 个人档属于 coding_plan 订阅，该条是 store=True（默认）时 Response API 对话数据的例外；retention 结论字段均未变（object=mixed、basis=none、未设 days），因此只改绑该条说明与锚点到新句，不改判定。默认推理路径的零保留表述（open models 不记录、不落盘）未动。"
summary_en = "On docs /guides/security_compliance/data_handling, the Response API retention clause changed from 'All stored conversation data is automatically deleted after 30 days.' to 'Stored conversation data is kept for up to 30 days and is automatically deleted no later than that. Stored responses are held in a cache and can be evicted earlier, often within about an hour, so they are not guaranteed to be retrievable for the full period.' The page summary changed correspondingly from 'plus the Response API 30-day retention' to 'plus Response API retention of up to 30 days'. The wording moves from a fixed 'deleted after 30 days' to a ceiling of 'up to 30 days, deleted no later than that', and adds that cached responses may be evicted earlier (often within about an hour) and are not guaranteed to be retrievable for the full period. For the individual Fire Pass coding_plan subscription this remains the store=True (default) Response API exception to conversation-data retention; no retention verdict field changed (object=mixed, basis=none, no days), so only the point and its anchor were rebound to the new sentences. The zero-retention wording for the default inference path (open models are not logged or stored) is untouched."
issue = "https://github.com/arcships/zdr-monitor/issues/902"
