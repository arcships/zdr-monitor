summary_zh = "docs /guides/security_compliance/data_handling 的 Zero data retention 一节在原有四条默认说明之后新增一句：'Enterprise account admins can additionally turn on the Zero Data Retention policy to reject requests and jobs that would persist or log customer content.' 这是面向 Enterprise 账号管理员、在默认 ZDR 之上追加的强制开关，拒绝会持久化或写入日志客户内容的请求与任务。Fire Pass 是个人订阅档（plan_level=individual），该开关不适用于本档，本档 zdr（mark=yes）与 retention（basis=none）的结论字段均未变；个人档默认『open models 不记录、不落盘』一节的原文未动，本记录不据此改写任何结论。"
summary_en = "The Zero data retention section of docs /guides/security_compliance/data_handling added a sentence after the four existing default-behaviour bullets: 'Enterprise account admins can additionally turn on the Zero Data Retention policy to reject requests and jobs that would persist or log customer content.' It describes an enforcement toggle available to Enterprise account admins on top of the default ZDR, rejecting requests and jobs that would persist or log customer content. Fire Pass is an individual subscription tier (plan_level=individual), so the toggle does not apply to it and no verdict field changed on this tier (zdr mark=yes, retention basis=none). The default 'no logging or storage for open models' wording for the individual path is untouched, and no conclusion is rewritten on the basis of this addition."
issue = "https://github.com/arcships/zdr-monitor/issues/442"
