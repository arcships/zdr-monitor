summary_zh = "docs /accounts/data-residency 把区域限制从只覆盖 inference 扩展到 inference + dedicated training，并改写 Limitations 里的 Training 条目：旧句「**Training.** Fine-tuning and training jobs are blocked. Support is coming soon.」改为「**Serverless training.** Serverless Training sessions, runs, and their samplers are blocked. Support is coming soon. Dedicated training is supported.」。同时新增 Dedicated training 一节：SFT、DPO、reinforcement fine-tuning、RLOR trainer 任务必须显式设置所选区域内的 training region，无区域或区域外的任务被拒绝；并明确「Only where the job runs is enforced. Where its checkpoints and outputs are stored is not.」，即只强制任务运行地，不强制 checkpoint 与输出存储地。旧文本是开启 residency 后训练一律被阻止，新文本放宽为 dedicated training 可在区域内运行，因此这一维度上的区域限制整体减弱。该页仍是 Enterprise 功能页，本档 plan_level=individual，processing_region 的结论字段（codes=[\"global\"]）与全部锚点均未变；默认 None 不限制区域的表述也未动。"
summary_en = "docs /accounts/data-residency expanded the regional restriction from inference to inference plus dedicated training and rewrote the Training bullet in Limitations. The old text, '**Training.** Fine-tuning and training jobs are blocked. Support is coming soon.', became '**Serverless training.** Serverless Training sessions, runs, and their samplers are blocked. Support is coming soon. Dedicated training is supported.' A new Dedicated training section adds that supervised fine-tuning, DPO, reinforcement fine-tuning, and RLOR trainer jobs must set an explicit training region inside the selected region, and that jobs without a region or with a region outside it are rejected. It also states 'Only where the job runs is enforced. Where its checkpoints and outputs are stored is not.', so checkpoint and output storage is not region-enforced. The previous promise blocked all training once residency was enabled; the new text relaxes this by supporting dedicated training in-region, so the regional restriction is weaker overall. The page remains an Enterprise feature page and this tier has plan_level=individual, so no processing_region verdict field changed (codes=[\"global\"]) and all anchors remain valid. The default None (unrestricted) wording is untouched."
issue = "https://github.com/arcships/zdr-monitor/issues/1030"
