summary_zh = "《StepFun 开放平台隐私政策》与《StepFun 开放平台用户协议》生效日期由 2026-05-25 改为 2026-09-28。与五个维度相关的是隐私政策『三.2 委托处理』的受托事项清单末尾新增『实名认证服务』：旧文结句为『……数据库存储服务、短信发送服务、内容安全审核服务。』，新文为『……短信发送服务、内容安全审核服务、实名认证服务。』——平台把实名认证也委托给第三方处理，本档 role 结论所依据的委托链条多了一项，故记一条；受托方名称与所在地仍未披露，role（kind=unknown）、retention（object=mixed、basis=as_needed）、processing_region（codes=[CN]）、training（mark=no）等判定值均未变。隐私政策新增『一.2 实名认证服务』（收集姓名、身份证号并交委托的实名认证合作方核验，人脸信息由合作方直接收集，平台声明不获取或留存）与『一.6 套餐兑换、充值、支付与发票管理』，主体是账户/身份/支付信息，不改变本档以请求正文为核心的 retention 结论；因插入一.2，原一.2~一.12 整段顺延为一.3~一.13，三.5 的交叉引用同步由『第一条第9款』改为『第10款』，用户协议编号也重排（1.→1.1/1.1.1、新增 1.2.1/1.2.2、原 2.2.4 行为记录迁到 1.2.6、原 2.4 竞争模型训练禁令迁到 2.2.3、3.6、5.3、5.4、6.5 等）。隐私政策『一.3 智能对话』把输入形式『录音』改为同义的『音频』并调整列举顺序，属措辞改写、不构成保留承诺变化（docs/judgment.md『判定不是政策变化』：reworded 需判断语义，语义未变），本档 retention 锚点 retention-collect-input-output 因此改绑到新表述、判定值不变。用户协议各维度所依据的条款句（3.6、5.3、5.4、6.2、6.4、6.5）文字未变，仅编号重排与生效日期更新，与五维无关。"
summary_en = "The effective date of the StepFun Open Platform Privacy Policy and User Agreement moved from 2026-05-25 to 2026-09-28. The change relevant to the five dimensions is that the entrusted-tasks list in Privacy Policy Section 3.2 'Entrusted processing' gained 'real-name authentication services' at its end: the old sentence ended '...database storage, SMS sending, content-safety review.', the new one '...SMS sending, content-safety review, real-name authentication services.' - the platform now also entrusts real-name authentication to third parties, so the entrusted-processing chain this tier's role verdict relies on gains an item, hence this record. The partners and their locations remain undisclosed, and the verdict values for role (kind=unknown), retention (object=mixed, basis=as_needed), processing_region (codes=[CN]) and training (mark=no) are unchanged. The privacy policy also gained new Section 1.2 'Real-name authentication services' (name and ID number collected and passed to an entrusted authentication partner for verification, facial information collected directly by the partner, which the platform says it does not obtain or retain) and new Section 1.6 on package redemption, top-up, payment and invoicing, covering account/identity/payment information and not changing this tier's request-content-centred retention conclusion. Because the new 1.2 section was inserted, the former sections 1.2-1.12 shifted to 1.3-1.13 (the cross-reference in 3.5 changed from 'paragraph 9 of Article 1' to 'paragraph 10'), and the User Agreement was likewise renumbered (1. to 1.1/1.1.1, new 1.2.1/1.2.2, the former 2.2.4 behavioural-records clause moving to 1.2.6, the former 2.4 competitor-training ban moving to 2.2.3, 3.6, 5.3, 5.4, 6.5, etc.). Privacy Policy Section 1.3 changed the input form 'recording' to the synonymous 'audio' and reordered the list - a wording rewrite, not a retention-commitment change (docs/judgment.md 'judging what is not a policy change': a reworded anchor needs a semantic read, and the semantics did not change), so this tier's retention anchor retention-collect-input-output was rebound to the new wording with no verdict change. Every dimension-relevant clause of the User Agreement (3.6, 5.3, 5.4, 6.2, 6.4, 6.5) is textually unchanged; the User Agreement change is renumbering plus the effective date only, unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/491"
