summary_zh = "《Does Model API support Zero Data Retention (ZDR)?》帮助页改版（快照 #1462）。逐句：① 首句由『Zero Data Retention (ZDR) is available for qualified Meta Model API accounts.』改为『...qualified Meta Model API teams.』；开通说明由『It's enabled at the organization level and requires separate enablement by Meta. ... confirm your organization's eligibility ... ZDR support may vary by model.』改为『Meta enables it for a team after reviewing the request. ... confirm your team's eligibility ...』，organization 一律改称 team。② 删去『ZDR support may vary by model』，新增『Which models support ZDR?』：『ZDR currently covers these models on Meta Model API』（Muse Spark 1.3/1.2/1.1、Muse Wonder、Muse Ember、Muse Image），并明确『ZDR doesn't cover the Contributor-mode variants of these models.』③ 新增『What can I use with ZDR?』，把 Web search 从不可用清单移入可用清单：『Search queries and results are processed in real time and aren't stored.』；不可用清单新增『Contributor mode, including Contributor-mode variants on Meta Model API and the Contributor mode setting in Muse Code』，并细化 stateful requests（store: true、previous_response_id、stored reasoning items）与 multipart 文件上传。④ 第三方集成一条由『Data processed by third-party tools or external integrations isn't covered by ZDR. Review those services' policies separately.』改为『Calling function tools or remote MCP servers doesn't turn off ZDR, but ZDR covers only Meta's handling of your content. Data sent to a third-party service follows that service's own terms and data handling practices.』⑤ 其余为页面导航/页脚与 Muse Code 使用说明，不改变五维结论。判断：api-standard 的 zdr 仍为 yes/by_agreement（ZDR 仍需向 sales 申请，覆盖范围由模糊改为列明模型）；api-contributor 的 zdr 由 unknown 改为 no——旧页未区分档位、本档只能记未表态，新页明确『ZDR doesn't cover the Contributor-mode variants』并把 Contributor mode 列为 ZDR 下不可用，属明确否定。training/retention/processing_region/role 的结论字段均未变。处理：改绑 zdr-available（accounts→teams），刷新 zdr-not-standard-org-level、zdr-scope-direct-calls-only 的上下文，新增 zdr-covered-models、zdr-contributor-not-covered、zdr-contributor-mode-unavailable 三个锚点及 api-contributor zdr 依据说明。"
summary_en = "The 'Does Model API support Zero Data Retention (ZDR)?' help page was republished (snapshot #1462). Sentence by sentence: (1) The opening changed from 'Zero Data Retention (ZDR) is available for qualified Meta Model API accounts.' to '... qualified Meta Model API teams.', and the enablement paragraph changed from 'It's enabled at the organization level and requires separate enablement by Meta. ... confirm your organization's eligibility ... ZDR support may vary by model.' to 'Meta enables it for a team after reviewing the request. ... confirm your team's eligibility ...', with 'organization' replaced throughout by 'team'. (2) 'ZDR support may vary by model' was removed and a new 'Which models support ZDR?' section states 'ZDR currently covers these models on Meta Model API' (Muse Spark 1.3/1.2/1.1, Muse Wonder, Muse Ember, Muse Image) and 'ZDR doesn't cover the Contributor-mode variants of these models.' (3) A new 'What can I use with ZDR?' section moves Web search out of the unavailable list and into the available list: 'Search queries and results are processed in real time and aren't stored.'; the unavailable list now includes 'Contributor mode, including Contributor-mode variants on Meta Model API and the Contributor mode setting in Muse Code', and it refines the stateful-request entry (store: true, previous_response_id, stored reasoning items) and multipart file uploads. (4) The third-party integrations bullet changed from 'Data processed by third-party tools or external integrations isn't covered by ZDR. Review those services' policies separately.' to 'Calling function tools or remote MCP servers doesn't turn off ZDR, but ZDR covers only Meta's handling of your content. Data sent to a third-party service follows that service's own terms and data handling practices.' (5) The rest is page navigation/footer and Muse Code usage guidance and changes no verdict. Assessment: api-standard zdr remains yes/by_agreement (ZDR still has to be requested from sales; its scope is now an explicit model list rather than a vague caveat); api-contributor zdr moves from unknown to no — the old page did not distinguish tiers, so this tier could only be recorded as unstated, while the new page says 'ZDR doesn't cover the Contributor-mode variants' and lists Contributor mode as unavailable with ZDR, an explicit negative. No other conclusion field changed on training/retention/processing_region/role. Actions: rebound zdr-available (accounts to teams), refreshed the context of zdr-not-standard-org-level and zdr-scope-direct-calls-only, and added three anchors (zdr-covered-models, zdr-contributor-not-covered, zdr-contributor-mode-unavailable) plus the api-contributor zdr rationale."
issue = "https://github.com/arcships/zdr-monitor/issues/1465"
