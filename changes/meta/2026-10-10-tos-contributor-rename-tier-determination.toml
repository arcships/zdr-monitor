summary_zh = "《Meta Model API Terms of Service》2026-10-09 版（Last updated 由 October 2 改为 October 9, 2026；页首『These Terms govern your access and use of the Services for a limited preview period.』一句删除）整体改版，核心是把档名 Discounted Models/Services 全局改称 Contributor Models/Services（同一档；Exhibit C §10 标题同步改名），并改写了档位判定与训练条款。逐句：① §1 档位判定由『The designation of the Services as Discounted Services or Standard Services is determined solely by the designation of the Model you select, regardless of any other Meta Model it invokes.』改为『The designation of the Services as Contributor Services or Standard Services is determined by the designation of the Model you are using, regardless of any other Meta Model invoked.』，并新增两点——经 Coding Harness Subscription 访问时档位改由账户设置决定（§3.3），以及『the system may route you to a Contributor Model, and you are responsible for ensuring that you are accessing and using a Standard or Contributor Model as you intend』。② 新增 §3.3：经 Coding Harness Subscription 访问『you are considered to be using the Contributor Services by default regardless of which Meta Model you select, and Section 6 applies』，须改账户设置才进入 Standard Services（§5），且改动只向将来生效、不追溯已提交给 Contributor Services 的 Content。③ §5 首句加入『including where you have changed your Account setting under a Coding Harness Subscription as described in Section 3.3』。④ §5.1 不训练承诺由『will not use Content from Standard Services to train Meta Models』改为『will not use Content submitted in a request to the Standard Services to train Meta Models』（方向不变，对象收窄为该次请求提交的 Content）。⑤ §6.1 新增『Content previously submitted to the Standard Services becomes Content submitted to the Contributor Services if it is included in any request to the Contributor Services, whether directly or as context or background for your prompts or instructions.』。⑥ §6.2 三处旧档名 Discounted Services 改称 Contributor Services。⑦ §13.4 删去『A Coding Harness Subscription does not provide any discount, fee reduction, or increased per-period allowance based on the Models you select, including Discounted Models.』与『The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.』，改为『When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.』。此外 §15.4 存续清单仅加一个序列逗号（Exhibit B and → Exhibit B, and），Exhibit A/B 标题与 Exhibit C 各节仅拆行/标点调整，均无实质变化。判断：两档五个维度的结论字段一律未变（api-standard：Standard Services 不用 Content 训练；api-contributor：Contributor Services 可用 Content 训练、不提供排除训练机制），属同一档改名并明确订阅档如何落档，方向为 clarified。处理：改绑四条 missing 引文（training-standard-5-1、tos-1-tier-by-model、tos-6-2-no-confidential、tos-6-2-no-training-exclusion），刷新 training-discounted-6-1 的上下文，并为 §6.1 新增的跨档转化句新增锚点 tos-6-1-standard-becomes-contributor 及两档的依据说明。Geographic Use Policy 与 Data Commitments 两个来源的快照本轮未变，仍用旧称呼 Discounted。"
summary_en = "The Meta Model API Terms of Service was republished on 2026-10-09 (Last updated moved from October 2 to October 9, 2026; the lead sentence 'These Terms govern your access and use of the Services for a limited preview period.' was removed). The core change is a global rename of the tier from Discounted Models/Services to Contributor Models/Services (the same tier; the Exhibit C section 10 heading was renamed too), together with rewrites of the tier-determination rule and the training clauses. Sentence by sentence: (1) Section 1 changed from 'The designation of the Services as Discounted Services or Standard Services is determined solely by the designation of the Model you select, regardless of any other Meta Model it invokes.' to 'The designation of the Services as Contributor Services or Standard Services is determined by the designation of the Model you are using, regardless of any other Meta Model invoked.', and adds two qualifications — on a Coding Harness Subscription the tier is instead governed by your Account setting (Section 3.3), and 'the system may route you to a Contributor Model, and you are responsible for ensuring that you are accessing and using a Standard or Contributor Model as you intend'. (2) A new Section 3.3 provides that on a Coding Harness Subscription 'you are considered to be using the Contributor Services by default regardless of which Meta Model you select, and Section 6 applies', and that reaching Standard Services (Section 5) requires changing the Account setting, prospectively only and without reaching Content already submitted to the Contributor Services. (3) The lead sentence of Section 5 gained 'including where you have changed your Account setting under a Coding Harness Subscription as described in Section 3.3'. (4) Section 5.1's no-training commitment changed from 'will not use Content from Standard Services to train Meta Models' to 'will not use Content submitted in a request to the Standard Services to train Meta Models' (same direction, object narrowed to the Content submitted in that request). (5) Section 6.1 gained 'Content previously submitted to the Standard Services becomes Content submitted to the Contributor Services if it is included in any request to the Contributor Services, whether directly or as context or background for your prompts or instructions.'. (6) Section 6.2's three references to the old tier name now read Contributor Services. (7) Section 13.4 dropped 'A Coding Harness Subscription does not provide any discount, fee reduction, or increased per-period allowance based on the Models you select, including Discounted Models.' and 'The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.', and now reads 'When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.'. In addition, the Section 15.4 survival list gained one serial comma (Exhibit B and to Exhibit B, and) and the Exhibit A/B headings and Exhibit C sections changed only in line breaks and punctuation. Assessment: no verdict field changed on either tier (api-standard: Standard Services Content is not used for training; api-contributor: Contributor Services Content may be used for training and offers no exclusion mechanism). This is a rename of one tier plus a clarification of how subscription access lands on a tier, so the direction is 'clarified'. Actions: the four missing quotes were rebound (training-standard-5-1, tos-1-tier-by-model, tos-6-2-no-confidential, tos-6-2-no-training-exclusion), the context of training-discounted-6-1 was refreshed, and a new anchor tos-6-1-standard-becomes-contributor plus supporting points on both tiers were added for the new Section 6.1 sentence. The Geographic Use Policy and Data Commitments source snapshots did not change in this round and still use the old 'Discounted' naming."
