summary_zh = "《Meta Model API Model Designation and Geographic Use Policy》Last updated 由 September 18, 2026 改为 October 12, 2026。① §1 把档名由 Discounted Models 改为 Contributor Models：『designated as Standard Models or Contributor Models』、『Contributor Models (use constitutes use of “Contributor Services”):』，与 ToS 2026-10-09 版的新称呼一致；档内模型不变（Muse Spark 1.2 Contributor、Muse Spark 1.3 Contributor）。② Standard Models 清单新增 Muse Wonder、Muse Wonder Full，并把『Segment Anything Model 3.1 (SAM 3.1)』简写为『SAM 3.1』。③ §1 新增一段：经 Coding Harness Subscription 访问时『you are considered to be using the Contributor Services by default regardless of which Meta Model you select』，要进入 Standard Services 须改账户设置，与 ToS §3.3 的口径一致。④ §2.2 的模型专属可用地域句由『you may not make Integrated Products that use that Meta Model available to or knowingly permit access by End Users located in』改为『you may not make the Meta Model or Integrated Products that use that Meta Model available to or permit access by End Users located in』，把模型本身也纳入限制并删去 knowingly；仍是访问地域限制，不涉及处理地。⑤ §3 与页首导航只改标点/格式。判断：两档五个维度的结论字段一律未变（api-standard 仍为 Standard Services 不用 Content 训练；api-contributor 仍为 Contributor Services 可用 Content 训练且无排除机制），属同一档改名、补充标准模型并明确订阅默认档，方向为 clarified。处理：旧引文『Discounted Models (use constitutes』被厂商删改，锚点 model-designation-discounted 改绑到新的 Contributor Models 标签句，并更新 training 依据说明与来源 note。"
summary_en = "The Meta Model API Model Designation and Geographic Use Policy moved its Last updated date from September 18, 2026 to October 12, 2026. (1) Section 1 renamed the tier from Discounted Models to Contributor Models — 'designated as Standard Models or Contributor Models' and 'Contributor Models (use constitutes use of “Contributor Services”):' — matching the new naming in the October 9, 2026 Terms; tier membership is unchanged (Muse Spark 1.2 Contributor, Muse Spark 1.3 Contributor). (2) The Standard Models list gained Muse Wonder and Muse Wonder Full, and 'Segment Anything Model 3.1 (SAM 3.1)' was shortened to 'SAM 3.1'. (3) Section 1 gained a paragraph providing that on a Coding Harness Subscription 'you are considered to be using the Contributor Services by default regardless of which Meta Model you select', and that reaching Standard Services requires changing the Account setting, consistent with Terms Section 3.3. (4) Section 2.2's model-specific availability sentence changed from 'you may not make Integrated Products that use that Meta Model available to or knowingly permit access by End Users located in' to 'you may not make the Meta Model or Integrated Products that use that Meta Model available to or permit access by End Users located in', adding the model itself to the restriction and dropping 'knowingly'; this remains an access restriction and says nothing about where data is processed. (5) Section 3 and the page navigation changed only in punctuation and formatting. Assessment: no verdict field changed on either tier (api-standard: Standard Services Content is still not used for training; api-contributor: Contributor Services Content may still be used for training with no exclusion mechanism). This is a rename of one tier, an addition of Standard Models and a restatement of the subscription default, so the direction is 'clarified'. Action: the vendor removed the old quote 'Discounted Models (use constitutes', so the anchor model-designation-discounted was rebound to the new Contributor Models label sentence, and the training rationale and source note were refreshed."
issue = "https://github.com/arcships/zdr-monitor/issues/622"
