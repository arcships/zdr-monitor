summary_zh = "《Does Model API support Zero Data Retention (ZDR)?》帮助页改版，把原先的模糊表述换成逐团队、逐模型的 ZDR 范围。逐句：① 可用主体由『Zero Data Retention (ZDR) is available for qualified Meta Model API accounts.』改为『... qualified Meta Model API teams.』；② 删去『It's enabled at the organization level and requires separate enablement by Meta.』，改为『Meta enables it for a team after reviewing the request.』；③ 删去『ZDR support may vary by model.』，新增『Which models support ZDR?』小节：『ZDR currently covers these models on Meta Model API』，列出 Muse Spark 1.3/1.2/1.1、Muse Wonder、Muse Ember、Muse Image，并明确『ZDR doesn't cover the Contributor-mode variants of these models.』；④ 『Which features aren't available with ZDR?』清单的『Web search』被移出——新版『What can I use with ZDR?』写明『Web search: Search queries and results are processed in real time and aren't stored.』，同时清单新增『Contributor mode, including Contributor-mode variants on Meta Model API and the Contributor mode setting in Muse Code』；⑤ 状态查询新增『How do I know if ZDR is enabled for my team?』（Settings 页 Data 区显示 Zero Data Retention 为 Enabled）；⑥ 新增 Muse Code 段：『If you use Muse Code, ZDR applies to the model requests it sends with an API key from your ZDR team.』并提示 META_API_KEY 优先级，以及 Muse Code 会另经 web search、telemetry、feedback 向 Meta 发送数据；⑦ 第三方集成由『Data processed by third-party tools or external integrations isn't covered by ZDR.』改为：调用 function tools 或远程 MCP server 不会关闭 ZDR，但 ZDR 只覆盖 Meta 对内容的处理，第三方按其自身条款处理；⑧ 其余仍保留项（使用统计、账户与团队数据、运维元数据、支持反馈、AUP 违规输入输出最长 2 年、状态请求/背景请求/文件上传不可用等）未改。判断：api-standard 的 zdr 仍为『是，需向厂商申请』（mark/mode 未变），retention 的结论字段未变；api-contributor 的 zdr 由 unknown 改为 no——旧版只说『ZDR support may vary by model』、未回答 Contributor 档能否开通，新版明确把 Contributor mode（含 Contributor-mode variants）排除在 ZDR 之外；本档即 Contributor Services，其模型（Muse Spark 1.2 Contributor、Muse Spark 1.3 Contributor）正是这类变体，故记为 no。方向为 clarified：范围被写明，不是新增或撤销 ZDR 方案。处理：改绑 zdr-available 到新句，更新 zdr-not-standard-org-level 的上下文，新增 zdr-model-coverage、zdr-muse-code-scope、zdr-contributor-mode-unavailable、zdr-contributor-variants-excluded 四个锚点，并把 api-contributor 的 zdr 结论改为 no。"
summary_en = "The help page 'Does Model API support Zero Data Retention (ZDR)?' was rewritten to state ZDR scope per team and per model instead of the earlier vague wording. Sentence by sentence: (1) the eligible subject changed from 'Zero Data Retention (ZDR) is available for qualified Meta Model API accounts.' to '... qualified Meta Model API teams.'; (2) 'It's enabled at the organization level and requires separate enablement by Meta.' was replaced by 'Meta enables it for a team after reviewing the request.'; (3) 'ZDR support may vary by model.' was removed and a new 'Which models support ZDR?' section now says 'ZDR currently covers these models on Meta Model API' — Muse Spark 1.3/1.2/1.1, Muse Wonder, Muse Ember and Muse Image — and adds 'ZDR doesn't cover the Contributor-mode variants of these models.'; (4) 'Web search' was removed from the 'Which features aren't available with ZDR?' list and now appears under 'What can I use with ZDR?' as 'Web search: Search queries and results are processed in real time and aren't stored.', while 'Contributor mode, including Contributor-mode variants on Meta Model API and the Contributor mode setting in Muse Code' was added to the unavailable list; (5) a new 'How do I know if ZDR is enabled for my team?' section points to the Settings page; (6) a new Muse Code paragraph says 'If you use Muse Code, ZDR applies to the model requests it sends with an API key from your ZDR team.', warns about META_API_KEY precedence, and notes that Muse Code can send data separately through web search, telemetry and feedback reports; (7) the third-party bullet changed from 'Data processed by third-party tools or external integrations isn't covered by ZDR.' to say that calling function tools or remote MCP servers does not turn ZDR off, but ZDR covers only Meta's handling and the third party follows its own terms; (8) the other retained categories (usage statistics, account and team data, operational metadata, support feedback, AUP inputs/outputs for up to 2 years) and the stateful/background/file-upload exclusions are unchanged. Assessment: api-standard zdr remains 'yes, on request' (mark/mode unchanged) and the retention fields are unchanged; api-contributor zdr moves from unknown to no — the old page said only 'ZDR support may vary by model' and did not answer whether the Contributor tier could enable ZDR, while the new page explicitly excludes Contributor mode (including Contributor-mode variants); this tier is Contributor Services, whose models (Muse Spark 1.2 Contributor and Muse Spark 1.3 Contributor) are exactly such variants. Direction is clarified: the scope was made explicit, not newly granted or withdrawn. Actions: rebound zdr-available to the new sentence, refreshed the context of zdr-not-standard-org-level, added anchors zdr-model-coverage, zdr-muse-code-scope, zdr-contributor-mode-unavailable and zdr-contributor-variants-excluded, and changed the api-contributor zdr verdict to no."
issue = "https://github.com/arcships/zdr-monitor/issues/1467"
