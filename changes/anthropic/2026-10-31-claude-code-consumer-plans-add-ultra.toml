summary_zh = "code.claude.com/docs/en/data-usage 把 Ultra 并入消费档。Data training policy 旧句：「Consumer users (Free, Pro, and Max plans): ... We will train new models using data from Free, Pro, and Max accounts when this setting is on (including when you use Claude Code from these accounts).」新句把这两处名单改为「Free, Pro, Max, and Ultra」。Data retention 的消费档标题由「Free, Pro, and Max plans」改为「Free, Pro, Max, and Ultra plans」；Error reports 的适用订阅也由「Pro or Max」/「Pro and Max」改为含 Ultra。训练 opt-in 规则本身（只有开启该设置才用于训练）、消费者保留期（允许训练 5 年 / 不允许 30 天）与商业档口径均未改，五维结论字段也未变：api 档 training 仍 mark=yes/by_contract，retention 仍 days=30/object=input_output/basis=fixed_period。cc-consumer-training-on 的原句被厂商改写，锚点改绑到新句。"
summary_en = "code.claude.com/docs/en/data-usage now includes Ultra in the consumer tier. Under Data training policy, the old text read 'Consumer users (Free, Pro, and Max plans): ... We will train new models using data from Free, Pro, and Max accounts when this setting is on (including when you use Claude Code from these accounts).'; both plan lists now read 'Free, Pro, Max, and Ultra'. The Data retention consumer heading changed from 'Free, Pro, and Max plans' to 'Free, Pro, Max, and Ultra plans', and the Error reports eligibility line changed from 'Pro or Max' / 'Pro and Max' to include Ultra. The opt-in training rule itself (training only when that setting is on), the consumer retention periods (5 years when model improvement is allowed, 30 days when it is not) and the commercial-tier wording are unchanged, and no verdict field changed (api tier training stays mark=yes/by_contract, retention stays days=30/object=input_output/basis=fixed_period). The vendor rewrote the sentence behind cc-consumer-training-on, so that anchor was rebound to the new wording."
issue = "https://github.com/arcships/zdr-monitor/issues/958"
