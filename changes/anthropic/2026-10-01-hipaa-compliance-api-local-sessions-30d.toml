summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 的『Several retention models sit outside the ZDR and HIPAA arrangements described on this page』一段改写末句。旧句：「The Compliance API does not capture local sessions for which ZDR is in effect, or any local sessions from organizations with HIPAA readiness enabled.」——ZDR 与启用 HIPAA readiness 的组织，Compliance API 一律不采集本地会话。新正文拆成两句：「The Compliance API does not capture local sessions for which ZDR is in effect. For organizations with HIPAA readiness enabled, it captures Cowork and Claude Code local sessions only and stores their transcripts for 30 days.」——ZDR 组织的本地会话仍不被采集，但对启用 HIPAA readiness 的组织，Compliance API 会采集 Cowork 与 Claude Code 的本地会话并把转写保存 30 天。对象=Cowork/Claude Code 本地会话转写，语境=启用 HIPAA readiness 的组织，期限=30 天（厂商自述固定值）。api 档 retention 的结论字段未变（仍 days=30、object=input_output、basis=fixed_period，仍以隐私中心 7996866 的『输入输出 30 天内自动删除』为结论依据），该页 retention 表述仍标 contradiction；本轮在 retention 维补一条绑定该句的 point 与锚点。同页其余改写见同日另一条记录。"
summary_en = "The paragraph 'Several retention models sit outside the ZDR and HIPAA arrangements described on this page' on platform.claude.com/docs/en/manage-claude/api-and-data-retention had its last sentence rewritten. Old sentence: 'The Compliance API does not capture local sessions for which ZDR is in effect, or any local sessions from organizations with HIPAA readiness enabled.' — for both ZDR organizations and organizations with HIPAA readiness enabled, the Compliance API captured no local sessions. The new text splits it in two: 'The Compliance API does not capture local sessions for which ZDR is in effect. For organizations with HIPAA readiness enabled, it captures Cowork and Claude Code local sessions only and stores their transcripts for 30 days.' — local sessions of ZDR organizations are still not captured, but for organizations with HIPAA readiness enabled the Compliance API does capture Cowork and Claude Code local sessions and stores their transcripts for 30 days. Object = Cowork and Claude Code local session transcripts; context = organizations with HIPAA readiness enabled; duration = 30 days as stated by the vendor. No verdict field on the API tier's retention changed (still days=30, object=input_output, basis=fixed_period, still based on privacy-centre article 7996866's 'we automatically delete inputs and outputs on our backend within 30 days of receipt or generation'), and the page's retention statement is still marked contradiction; a point and anchor binding this sentence were added to the retention dimension this round. The other rewrites on the same page are recorded in a separate change record of the same date."
issue = "https://github.com/arcships/zdr-monitor/issues/395"
