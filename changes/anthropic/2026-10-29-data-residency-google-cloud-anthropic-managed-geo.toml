summary_zh = "platform.claude.com/docs/en/manage-claude/data-residency 把 data residency 的地理控制扩展到 Anthropic 托管的 Claude Models on Google Cloud。旧句:「The `inference_geo` parameter is available on the Claude API (first-party) and Claude Platform on AWS. On Amazon Bedrock and Google Cloud, the inference region is determined by the endpoint URL or inference profile, so `inference_geo` is not applicable.」新句:「The `inference_geo` parameter is available on the Claude API (first-party), Claude Platform on AWS, and Claude Models on Google Cloud (Anthropic managed). On Amazon Bedrock and Claude Models on Google Cloud (Google managed), the inference region is determined by the endpoint URL or inference profile, so `inference_geo` is not applicable.」并新增该部署面的 workspace geo 说明:「**Claude Models on Google Cloud (Anthropic managed):** Workspace geo is not configurable. Every workspace uses `\"us\"` as its workspace geo, and the **Workspace geo** field doesn’t appear in the Claude Console.」Workspace-level restrictions 段另新增该部署面的说明:「**Claude Models on Google Cloud (Anthropic managed):** Every workspace allows all inference geos and uses `\"global\"` as its default inference geo. The Claude Console shows both settings as read-only. For US-only inference, set `inference_geo: \"us\"` on each request.」定价段把 Google Cloud 拆成 Anthropic managed / Google managed 两类,1.1x 适用面扩到 Anthropic managed(另新增 Claude Haiku 5.5 长上下文档位的倍数说明)。页面末尾新增 Availability 段:「Data residency is available on select models and eligible for zero data retention and HIPAA readiness.」,Data handling 列明适用端点为 `/v1/messages` 的 `inference_geo`、ZDR eligible 但不含 Covered Models、HIPAA eligible;原先 Inference geo 段的「To learn how zero data retention (ZDR) applies to this feature, see API and data retention.」随之删除。要点:inference geo 仍默认 global、可选 us;workspace geo 仍只有 us 且创建后不可改;变化是把同一套地理控制扩到一个新的部署面,并补上该部署面固定 us 的说明,未改变 api 档 processing_region 的结论字段(仍 codes=[global,US])或 zdr 结论(仍 mark=yes / mode=by_agreement)。该变化扩大了一个部署面上的地理控制与 ZDR/HIPAA 资格,故 direction 记为 strengthened。本轮据此更新 processing_region 的 point,把 workspace geo 的 us-only/创建后不可改、Anthropic 托管 Google Cloud 的固定 us、以及 DPA §I.1 的 SCC 跨境机制拆成各自绑定证据的独立 point,并新增 region-inference-availability、region-cloud-workspace-geo-fixed 两个锚点;同页建立 workspace 的界面步骤改写、撇号统一、Claude Sonnet 4.5 标注 deprecated 属版式/文案,与五维无关。"
summary_en = "platform.claude.com/docs/en/manage-claude/data-residency extends data residency controls to Anthropic-managed Claude Models on Google Cloud. Old sentence: 'The `inference_geo` parameter is available on the Claude API (first-party) and Claude Platform on AWS. On Amazon Bedrock and Google Cloud, the inference region is determined by the endpoint URL or inference profile, so `inference_geo` is not applicable.' New sentence: 'The `inference_geo` parameter is available on the Claude API (first-party), Claude Platform on AWS, and Claude Models on Google Cloud (Anthropic managed). On Amazon Bedrock and Claude Models on Google Cloud (Google managed), the inference region is determined by the endpoint URL or inference profile, so `inference_geo` is not applicable.' A workspace geo note for that deployment surface was added: '**Claude Models on Google Cloud (Anthropic managed):** Workspace geo is not configurable. Every workspace uses `\"us\"` as its workspace geo, and the **Workspace geo** field doesn’t appear in the Claude Console.' The Workspace-level restrictions section adds a note for that deployment surface: '**Claude Models on Google Cloud (Anthropic managed):** Every workspace allows all inference geos and uses `\"global\"` as its default inference geo. The Claude Console shows both settings as read-only. For US-only inference, set `inference_geo: \"us\"` on each request.' The pricing section now splits Google Cloud into Anthropic managed and Google managed, extending the 1.1x rate to Anthropic managed (and adds a multiplier note for Claude Haiku 5.5 long-context pricing). A new Availability section at the end states: 'Data residency is available on select models and eligible for zero data retention and HIPAA readiness.'; its Data handling block names `/v1/messages` with `inference_geo` as the applicable endpoint, ZDR as eligible but excluding Covered Models, and HIPAA as eligible. The earlier line 'To learn how zero data retention (ZDR) applies to this feature, see API and data retention.' was removed with that addition. Substance: inference geo still defaults to global with us as an option, and workspace geo is still us-only and fixed at creation; the change extends the same geographic controls to one more deployment surface and documents that surface's fixed us workspace geo. No API-tier conclusion field changed (processing_region codes are still [global, US]; zdr is still mark=yes / mode=by_agreement). Because this expands geographic control and ZDR/HIPAA eligibility on one more deployment surface, direction = strengthened. The processing_region points were updated for this round: the workspace-geo us-only/unchangeable claim, the fixed-us workspace geo on Anthropic-managed Google Cloud, and the DPA §I.1 SCC cross-border mechanism are now separate points, each bound to its own anchor; the anchors region-inference-availability and region-cloud-workspace-geo-fixed were added. The rewritten workspace-setup steps, apostrophe normalisation, and the 'Claude Sonnet 4.5 (deprecated)' label on the same page are formatting/copy edits unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/891"
