summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 的『What ZDR does not cover』与『What HIPAA readiness does not cover』两处消费档条目新增 Ultra。旧句（ZDR 段）：「Claude consumer products: Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.」新句：「Claude consumer products: Claude Free, Pro, Max, and Ultra plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.」HIPAA 段旧句：「Claude consumer products: Claude Free, Pro, and Max plans.」新句：「Claude consumer products: Claude Free, Pro, Max, and Ultra plans.」这只是把消费档新增的 Ultra 并入既有的消费档排除清单，排除方向和五维结论都没变：api 档 zdr 仍 mark=yes/by_agreement，retention 仍 days=30/object=input_output/basis=fixed_period，本页其余条款未动。zdr-consumer-excluded 的原句被厂商改写，锚点改绑到新句。"
summary_en = "On platform.claude.com/docs/en/manage-claude/api-and-data-retention, both consumer-plan bullets gained Ultra: 'Claude consumer products' under 'What ZDR does not cover' changed from 'Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.' to 'Claude Free, Pro, Max, and Ultra plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.', and the same bullet under 'What HIPAA readiness does not cover' changed from 'Claude Free, Pro, and Max plans.' to 'Claude Free, Pro, Max, and Ultra plans.' This only adds the consumer Ultra plan to an existing exclusion list; the direction of the exclusion and every verdict field are unchanged (api tier zdr stays mark=yes/by_agreement, retention stays days=30/object=input_output/basis=fixed_period), and the rest of the page is untouched. The vendor rewrote the sentence behind zdr-consumer-excluded, so that anchor was rebound to the new wording."
issue = "https://github.com/arcships/zdr-monitor/issues/958"
