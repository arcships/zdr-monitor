summary_zh = "code.claude.com/docs/en/data-usage 的『Local Claude Code: Data flow and dependencies』加密/数据流表里，Microsoft Foundry 行改写。旧句：「For Hosted on Azure deployments, prompts and completions remain within Azure; only usage metadata and content flagged by Anthropic’s safety systems egress to Anthropic.」新句：「For Hosted on Azure deployments, see where data is processed and stored.」新句指向的官方页是 https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry#hosting-options（Anthropic 第一方 platform.claude.com，不是 Microsoft/Azure 第三方页），其『Hosting options』现文为：「For deployments hosted on Azure, Anthropic processes prompts and completions on Azure infrastructure and stores retained content there. Retained content includes content flagged by Anthropic’s safety systems for Anthropic to review. Operational data that contains no prompts or completions is stored on Anthropic’s systems outside Azure. Examples include safety classifier scores, identifiers, and usage and billing data.」对照旧句：①prompt/completion 在 Azure 基础设施上处理、保留内容存于 Azure——旧句『remain within Azure』仍在；②不含 prompt/completion 的运营数据（安全分类分数、标识符、用量与账单数据）存于 Azure 外的 Anthropic 系统——旧句『only usage metadata … egress to Anthropic』的实质仍在。旧句说被安全系统标记的内容『出境到 Anthropic』，新目标页把它写成 Azure 上的 retained content、供 Anthropic 审核；就处理地而言这比旧句更有利（内容留在 Azure），不是删除有利表述。故本次是披露位置改写并细化了被标记内容的存放地，不是处理地承诺的收紧或放宽，direction 记 clarified。对象=Claude Code 在 Claude in Microsoft Foundry（Hosted on Azure）部署下的 prompt/completion 及保留内容；语境=该页数据流/静态加密说明指向的 Foundry hosting options。本 provider 没有独立的 Foundry 档位，api 档 processing_region 的 codes 仍为 global/US、kind/anchor 均未变，故不修改任何结论或锚点；该句过去也不是任何 point 或 anchor 的依据。providers/anthropic.toml 中 Foundry 的 processing_region point（region-inference-availability）讲的是 `inference_geo` 参数可用性，依据 data-residency 页；该页现文仍写 Foundry 不适用 `inference_geo`、Azure 部署可用 US Data Zone Standard，与新目标页的 hosting options 段不冲突，故无需补适用范围说明。同轮两页其余改动为版式与命名：data-usage 的小标题改为 markdown 标题、移除导航项 What’s New；api-and-data-retention 的小标题改为 markdown 标题、『Partner-operated platforms』由 Amazon Bedrock and Google Cloud’s Agent Platform 改为 Claude Models on Google Cloud (Google managed) and Amazon Bedrock、HIPAA 开通步骤的控制台页面由 Data retention page (settings/privacy) 改为 Data privacy page (settings/data-privacy)、Claude Managed Agents 的指引改为指向功能资格表行。这些均为版式、产品名与操作路径调整，与五个维度的结论无关。该页 retention/zdr 相关句子（『Conversation content … is not retained by default』、ZDR 不存储句、per-organization 开通句、consumer 排除句、HIPAA 本地会话 30 天句）逐字未变，既有锚点仍可唯一定位。"
summary_en = "On code.claude.com/docs/en/data-usage, the Microsoft Foundry row of the encryption/data-flow table under 'Local Claude Code: Data flow and dependencies' was rewritten. Old: 'For Hosted on Azure deployments, prompts and completions remain within Azure; only usage metadata and content flagged by Anthropic’s safety systems egress to Anthropic.' New: 'For Hosted on Azure deployments, see where data is processed and stored.' The new sentence links to https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry#hosting-options (Anthropic's own platform.claude.com page, not a Microsoft/Azure third-party page), whose current 'Hosting options' text reads: 'For deployments hosted on Azure, Anthropic processes prompts and completions on Azure infrastructure and stores retained content there. Retained content includes content flagged by Anthropic’s safety systems for Anthropic to review. Operational data that contains no prompts or completions is stored on Anthropic’s systems outside Azure. Examples include safety classifier scores, identifiers, and usage and billing data.' Against the old sentence: (1) prompts and completions are processed on Azure infrastructure and retained content is stored there, so the old 'remain within Azure' point is still present; (2) operational data that contains no prompts or completions (safety classifier scores, identifiers, usage and billing data) is stored on Anthropic's systems outside Azure, so the substance of the old 'only usage metadata … egress to Anthropic' point is still present. The old sentence placed safety-flagged content in the egress-to-Anthropic bucket; the target page instead describes it as retained content stored in Azure for Anthropic to review, which is more favourable on processing location, not a removed favourable statement. The change is therefore a relocation of the disclosure plus a more precise statement of where flagged content is stored, not a tightening or loosening of the processing-location commitment, so direction = clarified. Object = prompts/completions and retained content of Claude Code on Claude in Microsoft Foundry (Hosted on Azure); context = the data-flow/encryption-at-rest section pointing to Foundry's hosting options. This provider has no separate Foundry product; the api product's processing_region codes remain global/US with no change to kind or anchor, so no conclusion or anchor is modified — the removed sentence was never the basis of any point or anchor. The Foundry processing_region point in providers/anthropic.toml (region-inference-availability) is about `inference_geo` parameter availability and is based on the data-residency page; that page still says `inference_geo` is not applicable on Foundry and Azure-hosted deployments can use US Data Zone Standard, which does not conflict with the target page's hosting-options paragraph, so no applicability note is needed. The remaining changes on both pages this round are formatting and naming: on data-usage, subheadings became markdown headings and the 'What’s New' nav item was removed; on api-and-data-retention, subheadings became markdown headings, 'Partner-operated platforms' changed from 'Amazon Bedrock and Google Cloud’s Agent Platform' to 'Claude Models on Google Cloud (Google managed) and Amazon Bedrock', the HIPAA enablement step now points to the Data privacy page (settings/data-privacy) instead of the Data retention page (settings/privacy), and the Claude Managed Agents pointer now refers to the feature-eligibility table row. These are formatting, product-name and navigation-path adjustments unrelated to the five dimensions. The retention/ZDR sentences on that page ('Conversation content … is not retained by default', the ZDR no-storage sentence, the per-organization enablement sentence, the consumer exclusion and the HIPAA local-session 30-day sentences) are unchanged word for word, and all existing anchors still resolve uniquely."
issue = "https://github.com/arcships/zdr-monitor/issues/1291"
