summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 把 Claude in Microsoft Foundry 加入 HIPAA readiness 覆盖范围。旧『What HIPAA readiness does not cover』句:「**Claude Platform on AWS and Microsoft Foundry:** HIPAA readiness is not available on these platforms.」新正文改为:「**Claude Platform on AWS:** HIPAA readiness is not available on Claude Platform on AWS.」,并在『What HIPAA readiness covers』新增:「**Claude in Microsoft Foundry:** Claude in Microsoft Foundry (Hosted on Anthropic or Hosted on Azure) is an eligible service for customers with a BAA with Anthropic plus the HIPAA configuration enabled on the Azure subscription. Request the HIPAA configuration through your Anthropic account team. For requirements and covered features, see the HIPAA Implementation Guide.」要点:Microsoft Foundry 从「HIPAA readiness 不适用」变为「有 Anthropic BAA 且在 Azure 订阅开启 HIPAA 配置时合格」,Claude Platform on AWS 仍不适用;这是 HIPAA readiness 覆盖范围的扩大,故 direction 记为 strengthened。该页是 api 档 retention 的矛盾来源,其 ZDR/HIPAA 功能资格表仅作功能级范围参考、不作为 zdr 结论的依据;HIPAA readiness 是页面与 ZDR 并列的另一种数据处理安排(页面自述「HIPAA readiness applies a broader set of privacy and security safeguards than ZDR ... rather than requiring immediate deletion」),本轮未给出新的保留期限,也未改变任何 ZDR 功能资格值。api 档结论字段均未变(zdr mark=yes / mode=by_agreement;retention days=30 / object=input_output / basis=fixed_period,仍以 7996866 为 retention 依据),既有锚点 exact 未被删改(撇号由 ' 统一为 ’,不影响 NFKC 折叠后的匹配)。同轮把『Feature eligibility』单表拆成 Platform features / Messages API features / Managed Agents features / Other features 四张表,行名改为 Browser use tool、Computer use tool、Web fetch tool、Web search tool、Tool search tool、Code execution tool,Context management (compaction) 改名为 Threshold compaction,Cache diagnostics 与 Adaptive thinking 改为挂在其父功能下的子行,details 的『See X data retention』改为『Learn more about X (ZDR)』链接文本;逐行比对 ZDR / HIPAA 资格值全部未变,属版式与命名调整,与五维无关。新增的『In Claude Managed Agents, no feature is eligible for ZDR or HIPAA readiness』是对既有 Claude Managed Agents 行(No/No)的复述。"
summary_en = "platform.claude.com/docs/en/manage-claude/api-and-data-retention adds Claude in Microsoft Foundry to HIPAA readiness coverage. The old 'What HIPAA readiness does not cover' bullet read: '**Claude Platform on AWS and Microsoft Foundry:** HIPAA readiness is not available on these platforms.' The new text reads: '**Claude Platform on AWS:** HIPAA readiness is not available on Claude Platform on AWS.' and adds under 'What HIPAA readiness covers': '**Claude in Microsoft Foundry:** Claude in Microsoft Foundry (Hosted on Anthropic or Hosted on Azure) is an eligible service for customers with a BAA with Anthropic plus the HIPAA configuration enabled on the Azure subscription. Request the HIPAA configuration through your Anthropic account team. For requirements and covered features, see the HIPAA Implementation Guide.' Substance: Microsoft Foundry moves from 'HIPAA readiness not available' to 'eligible when the customer has an Anthropic BAA and the HIPAA configuration is enabled on the Azure subscription', while Claude Platform on AWS remains ineligible; this is an expansion of HIPAA readiness coverage, hence direction = strengthened. This page is the contradiction source for the API tier's retention; its ZDR/HIPAA feature-eligibility tables are only a reference for feature-level scope and are not the basis for the zdr verdict. HIPAA readiness is a separate data-handling arrangement presented alongside ZDR (the page says 'HIPAA readiness applies a broader set of privacy and security safeguards than ZDR ... rather than requiring immediate deletion'). This round states no new retention period and changes no ZDR feature-eligibility value. No API-tier conclusion field changed (zdr mark=yes / mode=by_agreement; retention days=30 / object=input_output / basis=fixed_period, still based on 7996866), and no existing anchor's exact text was removed or rewritten (apostrophes were normalised from ' to ’, which does not affect NFKC-folded matching). On the same page the single 'Feature eligibility' table was split into Platform features / Messages API features / Managed Agents features / Other features; rows were renamed to Browser use tool, Computer use tool, Web fetch tool, Web search tool, Tool search tool and Code execution tool, 'Context management (compaction)' became 'Threshold compaction', Cache diagnostics and Adaptive thinking became sub-rows under their parent features, and 'See X data retention' became 'Learn more about X (ZDR)' link text. Row-by-row, every ZDR and HIPAA eligibility value is unchanged, so this is formatting and naming only, unrelated to the five dimensions. The added sentence 'In Claude Managed Agents, no feature is eligible for ZDR or HIPAA readiness' restates the existing Claude Managed Agents row (No/No)."
issue = "https://github.com/arcships/zdr-monitor/issues/891"
