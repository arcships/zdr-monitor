summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 本轮把 Anthropic 托管的 Google Cloud 纳入本页范围，并在『What ZDR covers』新增该部署面的 ZDR 覆盖。旧页面范围句：「This page covers the Claude API (`api.anthropic.com`), Claude Platform on AWS, and Claude in Microsoft Foundry, where Anthropic is the data processor. On Amazon Bedrock and Google Cloud's Agent Platform, the cloud provider is the data processor; refer to those platforms' data retention and compliance documentation for their equivalent controls.」新句：「This page covers the Claude API (`api.anthropic.com`), Claude Platform on AWS, Claude in Microsoft Foundry, and Claude Models on Google Cloud (Anthropic managed), where Anthropic is the data processor. On Amazon Bedrock and Claude Models on Google Cloud (Google managed), the cloud provider is the data processor; refer to those platforms' data retention and compliance documentation for their equivalent controls.」新增 ZDR 条目：「**Claude Models on Google Cloud (Anthropic managed):** Claude Models on Google Cloud (Anthropic managed) follows the same data retention policy as the first-party Claude API. ZDR is available on request; contact your Anthropic account representative to enable it.」FAQ『Does this apply to Amazon Bedrock or Google Cloud?』旧答：「No. The ZDR and HIPAA arrangements described on this page apply to the Claude API, where Anthropic is the data processor. On Bedrock and Google Cloud, the cloud provider is the data processor; refer to those platforms' data retention and compliance policies for their equivalent controls.」新答：「Claude Models on Google Cloud (Anthropic managed) follows the same data retention policy as the first-party Claude API, and Anthropic is the data processor. ZDR is available there on request. On Amazon Bedrock and Claude Models on Google Cloud (Google managed), the cloud provider is the data processor; refer to those platforms' data retention and compliance policies for their equivalent controls.」要点：此前页面把 Bedrock 与 Google Cloud 都归为云厂商担任 data processor 的情形（页面范围句写作 Google Cloud's Agent Platform，FAQ 写作 Google Cloud），FAQ 直接答「No」；现在区分 Anthropic managed 与 Google managed，Anthropic managed 的 Claude Models on Google Cloud 与第一方 Claude API 适用同一保留政策、可按申请开通 ZDR，Google managed 与 Amazon Bedrock 仍由云厂商担任 data processor。该页是 api 档 retention 的矛盾来源、并为 role 提供 processor 旁证；本轮只是把 Anthropic managed 的 Google Cloud 纳入同一政策并澄清处理方归属，api 档五维结论字段均未变（training mark=yes/by_contract；zdr mark=yes/by_agreement；retention days=30/object=input_output/basis=fixed_period；processing_region codes=[global,US]；role kind=processor），既有锚点的 exact 未被删改，故未改任何结论；role-api-processor 的 prefix/suffix 随该句扩写同步更新。同轮三处「retained per standard policy」改为「retained according to standard policy」及表格换行属同义改写，与五维无关。"
summary_en = "platform.claude.com/docs/en/manage-claude/api-and-data-retention now includes Anthropic-managed Google Cloud in its scope and adds ZDR coverage for that deployment surface under 'What ZDR covers'. Old page-scope sentence: 'This page covers the Claude API (`api.anthropic.com`), Claude Platform on AWS, and Claude in Microsoft Foundry, where Anthropic is the data processor. On Amazon Bedrock and Google Cloud's Agent Platform, the cloud provider is the data processor; refer to those platforms' data retention and compliance documentation for their equivalent controls.' New sentence: 'This page covers the Claude API (`api.anthropic.com`), Claude Platform on AWS, Claude in Microsoft Foundry, and Claude Models on Google Cloud (Anthropic managed), where Anthropic is the data processor. On Amazon Bedrock and Claude Models on Google Cloud (Google managed), the cloud provider is the data processor; refer to those platforms' data retention and compliance documentation for their equivalent controls.' New ZDR bullet: '**Claude Models on Google Cloud (Anthropic managed):** Claude Models on Google Cloud (Anthropic managed) follows the same data retention policy as the first-party Claude API. ZDR is available on request; contact your Anthropic account representative to enable it.' The FAQ 'Does this apply to Amazon Bedrock or Google Cloud?' changed from 'No. The ZDR and HIPAA arrangements described on this page apply to the Claude API, where Anthropic is the data processor. On Bedrock and Google Cloud, the cloud provider is the data processor; refer to those platforms' data retention and compliance policies for their equivalent controls.' to 'Claude Models on Google Cloud (Anthropic managed) follows the same data retention policy as the first-party Claude API, and Anthropic is the data processor. ZDR is available there on request. On Amazon Bedrock and Claude Models on Google Cloud (Google managed), the cloud provider is the data processor; refer to those platforms' data retention and compliance policies for their equivalent controls.' Substance: previously the page treated Bedrock and Google Cloud alike as cloud-provider-processed (the page-scope sentence said Google Cloud's Agent Platform, the FAQ said Google Cloud), and the FAQ answered 'No'; it now distinguishes Anthropic managed from Google managed, puts Anthropic-managed Claude Models on Google Cloud under the same retention policy as the first-party Claude API with ZDR available on request, and leaves Google-managed Google Cloud and Amazon Bedrock with the cloud provider as data processor. This page is the contradiction source for the API tier's retention and the processor corroboration for role; this round only brings Anthropic-managed Google Cloud under the same policy and clarifies the processor attribution, so no verdict field changed on the API tier (training mark=yes/by_contract; zdr mark=yes/by_agreement; retention days=30/object=input_output/basis=fixed_period; processing_region codes=[global,US]; role kind=processor), and no anchor's exact text was removed or rewritten, so no conclusion changed; the role-api-processor prefix/suffix were updated to follow the expanded sentence. The three 'retained per standard policy' to 'retained according to standard policy' edits and the table line breaks are same-meaning rewrites unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/810"
