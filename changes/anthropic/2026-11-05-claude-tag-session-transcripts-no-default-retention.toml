summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 本轮在『Several retention models sit outside the ZDR and HIPAA arrangements』一段新增 Claude Tag 会话转写的保留说明。旧句(该段相邻句):「Remote session transcripts (Cowork in the cloud) are retained for 6 years, unless a user deletes the session sooner. The Compliance API does not capture local sessions for which ZDR is in effect.」新句在两者之间插入:「Claude Tag session transcripts, also remote sessions, have no default retention period; see Retention and deletion.」要点:Claude Tag 的会话转写虽然同样是远端会话,但厂商明确说它没有默认保留期限,并指向 Retention and deletion;对象=Claude Tag 会话转写;语境=默认,该段自述这些保留模型都在本页所述 ZDR 与 HIPAA 安排之外;期限类型=无默认保留期限(厂商在此未给删除期限,不能据此推出 6 年或其他固定上限)。该变化不影响 api 档结论字段:retention 仍为 days=30/object=input_output/basis=fixed_period(依据仍是隐私中心 7996866),zdr 仍为 mark=yes/mode=by_agreement(依据仍是 8956058);该页仍因 retention 表述与 7996866 冲突而标 contradiction,本句只是新增产品的具体保留模型,不改写 API 请求正文口径。既有锚点 exact 均未受影响。同轮还把『What ZDR does not cover』里的 CORS 条目改写成 ZDR 段落的正文,措辞从「CORS is not supported for organizations with ZDR arrangements... route requests through a backend proxy server」变为「Organizations with a ZDR arrangement cannot call the Claude API directly from a browser: the API rejects their cross-origin (CORS) requests... send the requests from your own back end」;限制本身未变(仍不能从浏览器直接调用,需走后端),不涉及数据保留或处理承诺,故不改变 zdr 结论;intro 与 FAQ 的『On Amazon Bedrock and Claude Models on Google Cloud (Google managed)』改为『On Claude Models on Google Cloud (Google managed) and Amazon Bedrock』,语义不变,role-api-processor 的 suffix 随语序同步更新(exact 未变)。"
summary_en = "platform.claude.com/docs/en/manage-claude/api-and-data-retention adds a retention note for Claude Tag session transcripts in the paragraph 'Several retention models sit outside the ZDR and HIPAA arrangements'. Old adjacent sentence: 'Remote session transcripts (Cowork in the cloud) are retained for 6 years, unless a user deletes the session sooner. The Compliance API does not capture local sessions for which ZDR is in effect.' New text inserts: 'Claude Tag session transcripts, also remote sessions, have no default retention period; see Retention and deletion.' Substance: Claude Tag session transcripts are also remote sessions, but the vendor states they have no default retention period and points to Retention and deletion; object = Claude Tag session transcripts; context = default, with the paragraph stating that these retention models sit outside the ZDR and HIPAA arrangements described on the page; type = no default retention period (no deletion deadline is given for this object, so no fixed upper bound such as 6 years can be inferred). This does not change any API-tier verdict field: retention remains days=30/object=input_output/basis=fixed_period (still based on privacy-centre article 7996866), and zdr remains mark=yes/mode=by_agreement (still based on 8956058); the page stays marked contradiction because its retention statement conflicts with 7996866, and this new sentence only records a product-specific retention model without restating the API request-body rule. No existing anchor's exact text is affected. In the same revision, the CORS bullet under 'What ZDR does not cover' was rewritten as prose in the ZDR section: 'CORS is not supported for organizations with ZDR arrangements... route requests through a backend proxy server' became 'Organizations with a ZDR arrangement cannot call the Claude API directly from a browser: the API rejects their cross-origin (CORS) requests... send the requests from your own back end'. The restriction itself is unchanged (no direct browser calls; requests must go through the customer's back end) and concerns neither data retention nor a data-handling commitment, so the zdr verdict is unchanged. The intro and FAQ reorder 'On Amazon Bedrock and Claude Models on Google Cloud (Google managed)' to 'On Claude Models on Google Cloud (Google managed) and Amazon Bedrock' with no change in meaning; the role-api-processor suffix was updated to follow the new order while its exact text is unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/1045"
