summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 的 Messages API features 功能资格表新增一行「Message threads」：旧正文没有这一行，新正文为「| Message threads | `/v1/messages` with `thread` | No | No | A thread’s contents (the conversation, system prompt, and tools) are held in memory, encrypted under a server-managed key, never written to durable storage, and deleted no more than 1 hour after the thread’s last use. Using this feature does not affect your use of other ZDR eligible features. |」。要点：通过 `/v1/messages` 的 `thread` 参数使用的功能 Message threads 被明确标为 ZDR 不适用、HIPAA readiness 不适用；线程内容（对话、system prompt、工具）仅驻留内存，以服务端管理的密钥加密，从不写入持久存储，并在线程最后一次使用后不超过 1 小时删除；使用该功能不影响其他 ZDR 合格功能。对象=Message threads 的线程内容；语境=使用 `thread` 参数的请求；期限=最后一次使用后不超过 1 小时，且仅在内存中、不落持久存储。尽管细节描述为仅内存、不写持久存储，厂商标注的 ZDR 资格仍是 No，即使用该功能属于走出 ZDR 安排。这是新增功能及其数据处理的披露，不改变既有功能的 ZDR 资格或 API 档默认保留口径。api 档的 zdr 结论字段未变（mark=yes / mode=by_agreement，依据仍是隐私中心 8956058），retention 结论字段也未变（days=30 / object=input_output / basis=fixed_period，依据仍是隐私中心 7996866）；该页仍因 retention 表述与 7996866 冲突而标 contradiction，功能资格表仅作功能级范围参考。现有锚点的 exact 均未受影响。"
summary_en = "The Messages API features eligibility table on platform.claude.com/docs/en/manage-claude/api-and-data-retention adds a 'Message threads' row: the old text had no such row, and the new row reads '| Message threads | `/v1/messages` with `thread` | No | No | A thread’s contents (the conversation, system prompt, and tools) are held in memory, encrypted under a server-managed key, never written to durable storage, and deleted no more than 1 hour after the thread’s last use. Using this feature does not affect your use of other ZDR eligible features. |'. Substance: Message threads, used through the `thread` parameter on `/v1/messages`, is expressly marked not eligible for ZDR and not eligible for HIPAA readiness; a thread's contents (the conversation, system prompt, and tools) are held in memory, encrypted under a server-managed key, never written to durable storage, and deleted no more than 1 hour after the thread's last use; using the feature does not affect the use of other ZDR-eligible features. Object = contents of a Message threads thread; context = requests using the `thread` parameter; duration = no more than 1 hour after the thread's last use, in memory only and never written to durable storage. Although the details describe in-memory handling with no durable storage, the vendor's ZDR eligibility value is still No, so using the feature means stepping outside the ZDR arrangement. This is a disclosure about a new feature and its data handling; it does not change the ZDR eligibility of existing features or the API tier's default retention rule. No API-tier zdr verdict field changed (mark=yes / mode=by_agreement, still based on privacy-centre article 8956058), and no retention verdict field changed (days=30 / object=input_output / basis=fixed_period, still based on privacy-centre article 7996866); the page remains marked contradiction because its retention statement conflicts with 7996866, and the feature eligibility table serves only as a feature-level scope reference. No existing anchor's exact text is affected."
issue = "https://github.com/arcships/zdr-monitor/issues/997"
