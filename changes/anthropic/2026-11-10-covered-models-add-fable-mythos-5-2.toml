summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 的 Covered Models 名单新增 Claude Fable 5.2 与 Claude Mythos 5.2。『What ZDR does not cover』旧句:「**Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, and Claude Mythos 5:** These models require 30-day data retention and are not available under ZDR unless expressly authorized by Anthropic. See Model-specific data retention requirements.」新句:「**Claude Fable 5.2, Claude Mythos 5.2, Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, and Claude Mythos 5:** These models require 30-day data retention and are not available under ZDR unless expressly authorized by Anthropic. See Model-specific data retention requirements.」『Model-specific data retention requirements』段旧句同样只列 Fable 5.1 / Mythos 5.1 / Fable 5 / Mythos 5，新句加入 Fable 5.2 与 Mythos 5.2。同轮 code.claude.com/docs/en/zero-data-retention 的『Model availability under ZDR』也把 Fable 5.2 加入默认要求数据保留的 Covered Models 名单（旧句只列 Claude Fable 5.1 和 Fable 5），并把 `best` alias 的说明改写为「Fable models aren’t the default, and the `best` alias resolves to Opus.」。要点：Fable 5.2 与 Mythos 5.2 被明确指定为 Covered Models，强制 30 天保留，未获 Anthropic 明确授权时不适用 ZDR；这是新增模型进入既有保留例外名单，既有模型的 30 天保留与 ZDR 排除口径未变。api 档结论字段均未变（zdr mark=yes/mode=by_agreement，依据仍是隐私中心 8956058；retention days=30/object=input_output/basis=fixed_period，依据仍是隐私中心 7996866），但厂商确实新增了受 30 天保留约束的模型，故记录；provider 文件中引用该名单的两处说明文字同步更新为 5.2 / 5.1 / 5。data-residency 页同轮只是把平铺的 Availability 支持表改成按平台列模型并用 ZDR / HIPAA 标签，支持范围与「Excludes Covered Models」的语义未变，不单独记录。"
summary_en = "platform.claude.com/docs/en/manage-claude/api-and-data-retention adds Claude Fable 5.2 and Claude Mythos 5.2 to its Covered Models list. Under 'What ZDR does not cover', the old sentence was '**Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, and Claude Mythos 5:** These models require 30-day data retention and are not available under ZDR unless expressly authorized by Anthropic. See Model-specific data retention requirements.'; the new sentence is '**Claude Fable 5.2, Claude Mythos 5.2, Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, and Claude Mythos 5:** These models require 30-day data retention and are not available under ZDR unless expressly authorized by Anthropic. See Model-specific data retention requirements.' The paragraph under 'Model-specific data retention requirements' likewise listed only Fable 5.1 / Mythos 5.1 / Fable 5 / Mythos 5 and now includes Fable 5.2 and Mythos 5.2. In the same round, 'Model availability under ZDR' on code.claude.com/docs/en/zero-data-retention adds Fable 5.2 to the Covered Models that require data retention by default (the old sentence listed only Claude Fable 5.1 and Fable 5) and rewrites the `best` alias note to 'Fable models aren’t the default, and the `best` alias resolves to Opus.' Substance: Fable 5.2 and Mythos 5.2 are expressly designated Covered Models, require 30-day data retention, and are not available under ZDR unless Anthropic expressly authorizes them; this is new models joining the existing retention exception list, while the 30-day retention and ZDR exclusion for the previously listed models are unchanged. No API-tier verdict field changed (zdr mark=yes/mode=by_agreement, still based on privacy-centre article 8956058; retention days=30/object=input_output/basis=fixed_period, still based on privacy-centre article 7996866), but the vendor did add models subject to the 30-day retention requirement, so this is recorded; the two explanatory passages in the provider file that cite the list are updated to 5.2 / 5.1 / 5. The data-residency page's Availability area was only restructured from a flat support table into per-platform model lists with ZDR / HIPAA tags; the supported scope and the 'Excludes Covered Models' meaning are unchanged, so it is not recorded separately."
issue = "https://github.com/arcships/zdr-monitor/issues/1146"
