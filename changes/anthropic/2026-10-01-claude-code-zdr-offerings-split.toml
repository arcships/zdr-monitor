summary_zh = "同一页把 Claude Code 的 ZDR 拆成两套并行方案，本页安排只留给 API key 路径。旧『What ZDR covers』：「Claude Code: ZDR applies when Claude Code is used with API keys from a Commercial organization … or through Claude Enterprise with ZDR enabled.」；旧『What ZDR does not cover』：「The exception is Claude Code used through Claude Enterprise with ZDR enabled; see What ZDR covers.」；旧 FAQ：「Claude Code is eligible for ZDR through two paths」。新正文把标题改为『Claude Code with API keys』并写明『Claude Code on Claude Enterprise is not covered by this arrangement and has a separate ZDR offering』，企业路径改述为『its own ZDR offering, separate from the ZDR arrangement described on this page … available only to qualified accounts on Claude Enterprise and requires separate enablement by Anthropic』，并新增『That documentation applies to Claude Enterprise organizations only and does not describe the ZDR arrangement for the Claude API.』。承诺本身没变：两条路径都仍可按 organization 开通 ZDR，企业路径仍需单独审批且限合格账号；变的是范围归属（哪份文档管哪套安排）。api 档 zdr 的结论字段未变（仍 mark=yes / mode=by_agreement），依据仍是隐私中心 8956058；该拆分落在 Claude Code 产品线（anthropic-claude-code 另有文件与专属来源），本轮不改它的结论。"
summary_en = "On the same page, Claude Code's ZDR was split into two parallel offerings and this page's arrangement was narrowed to the API-key path. Old 'What ZDR covers': 'Claude Code: ZDR applies when Claude Code is used with API keys from a Commercial organization … or through Claude Enterprise with ZDR enabled.'; old 'What ZDR does not cover': 'The exception is Claude Code used through Claude Enterprise with ZDR enabled; see What ZDR covers.'; old FAQ: 'Claude Code is eligible for ZDR through two paths'. The new text retitles the bullet 'Claude Code with API keys' and states 'Claude Code on Claude Enterprise is not covered by this arrangement and has a separate ZDR offering', re-describes the enterprise path as 'its own ZDR offering, separate from the ZDR arrangement described on this page … available only to qualified accounts on Claude Enterprise and requires separate enablement by Anthropic', and adds 'That documentation applies to Claude Enterprise organizations only and does not describe the ZDR arrangement for the Claude API.' The commitment itself is unchanged: both paths can still have ZDR enabled per organization, and the enterprise path still needs separate enablement and is limited to qualified accounts; what changed is which document governs which arrangement. No verdict field on the API tier's zdr changed (still mark=yes / mode=by_agreement), and the basis remains privacy-centre article 8956058; the split belongs to the Claude Code product line (which has its own provider file and dedicated sources), so its conclusions are untouched this round."
issue = "https://github.com/arcships/zdr-monitor/issues/395"
