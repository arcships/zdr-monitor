source_id = "6bc4022c8696d7c6"
summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 的『What ZDR does not cover』与功能资格表新增 self-hosted Claude Managed Agents 的 ZDR 例外。旧句:「**Claude Managed Agents:** Claude Managed Agents is a stateful resource; session transcripts persist until you delete them.」新句:「**Claude Managed Agents:** Claude Managed Agents is a stateful resource; session transcripts persist until you delete them. The exception is self-hosted Claude Managed Agents, where you store the transcripts yourself, as How long data is kept describes.」功能资格表『Platform features』段旧句:「In Claude Managed Agents, no feature is eligible for ZDR or HIPAA readiness; see the Claude Managed Agents row under Managed Agents features.」新句:「In Claude Managed Agents, no feature is eligible for ZDR or HIPAA readiness, except for self-hosted Managed Agents under ZDR; see the Claude Managed Agents row under Managed Agents features.」『Managed Agents features』表 Claude Managed Agents 行(/v1/agents、/v1/sessions、/v1/environments,ZDR 列仍为 No、HIPAA 列仍为 No)的 Details 旧句:「Sessions are stateful resources; transcripts persist until you delete them. Applies to all Managed Agents sub-features, including Self-hosted sandboxes.」新句:「Not eligible for ZDR, except for self-hosted Managed Agents. Sessions are stateful resources; transcripts persist until you delete them. Learn more about Claude Managed Agents (ZDR) Not eligible for HIPAA. Applies to all Managed Agents sub-features.」要点:此前 self-hosted sandboxes/sub-features 明确被纳入 Managed Agents 的 ZDR 不适用范围,现在 self-hosted Claude Managed Agents 因会话转写由客户自行保存而成为 ZDR 例外;Anthropic 托管形态的 Managed Agents 仍是 stateful、ZDR 与 HIPAA 均不适用。对象=self-hosted Claude Managed Agents 的会话转写;语境=self-hosted(转写保存在客户侧),而不是 Anthropic 托管的 Managed Agents;这是 ZDR 覆盖范围的扩大,故 direction 记为 strengthened。该页仍因 retention 表述与 7996866 冲突而标 contradiction,本页不作为 retention 结论依据;api 档 zdr 结论字段未变(mark=yes / mode=by_agreement,依据仍是隐私中心 8956058),retention 字段也未变(days=30 / object=input_output / basis=fixed_period,依据仍是 7996866),既有锚点的 exact 均未被删改。同轮其余改动均不涉及五个维度:侧栏新增 Security posture 项;HIPAA『Contact sales (custom BAA)』句由「Anthropic will execute the BAA and enable HIPAA readiness for your organization.」改为「Anthropic executes the BAA and enables HIPAA readiness for your organization.」;Covered Models 段把一句拆成三句(are designated Covered Models. See the Covered Models support article. They require 30-day data retention.),语义不变;『Platform features』段首句由『Features that relate to ... Some are available in only one of them.』改为『This section lists features that relate to ... Some are available in only one of them.』。"
summary_en = "The 'What ZDR does not cover' section and the feature-eligibility tables of platform.claude.com/docs/en/manage-claude/api-and-data-retention add a ZDR exception for self-hosted Claude Managed Agents. Old sentence: '**Claude Managed Agents:** Claude Managed Agents is a stateful resource; session transcripts persist until you delete them.' New sentence: '**Claude Managed Agents:** Claude Managed Agents is a stateful resource; session transcripts persist until you delete them. The exception is self-hosted Claude Managed Agents, where you store the transcripts yourself, as How long data is kept describes.' In the feature table's Platform features paragraph the old text read 'In Claude Managed Agents, no feature is eligible for ZDR or HIPAA readiness; see the Claude Managed Agents row under Managed Agents features.' and the new text reads 'In Claude Managed Agents, no feature is eligible for ZDR or HIPAA readiness, except for self-hosted Managed Agents under ZDR; see the Claude Managed Agents row under Managed Agents features.' The Claude Managed Agents row in the Managed Agents features table (/v1/agents, /v1/sessions, /v1/environments; ZDR column still No, HIPAA column still No) changed in Details from 'Sessions are stateful resources; transcripts persist until you delete them. Applies to all Managed Agents sub-features, including Self-hosted sandboxes.' to 'Not eligible for ZDR, except for self-hosted Managed Agents. Sessions are stateful resources; transcripts persist until you delete them. Learn more about Claude Managed Agents (ZDR) Not eligible for HIPAA. Applies to all Managed Agents sub-features.' Substance: self-hosted sandboxes/sub-features were previously expressly inside the Managed Agents ZDR exclusion; self-hosted Claude Managed Agents is now an exception because the customer stores the session transcripts itself, while Anthropic-hosted Managed Agents remains stateful and ineligible for both ZDR and HIPAA readiness. Object = session transcripts of self-hosted Claude Managed Agents; context = self-hosted (transcripts held on the customer side), not Anthropic-hosted Managed Agents; this expands ZDR coverage, hence direction = strengthened. The page remains marked contradiction because its retention statement conflicts with 7996866 and is not the basis for the retention verdict; no API-tier zdr field changed (mark=yes / mode=by_agreement, still based on privacy-centre article 8956058), no retention field changed (days=30 / object=input_output / basis=fixed_period, still based on 7996866), and no existing anchor's exact text was removed or rewritten. The other edits in the same revision do not touch the five dimensions: the sidebar gains a Security posture item; the HIPAA 'Contact sales (custom BAA)' sentence changes from 'Anthropic will execute the BAA and enable HIPAA readiness for your organization.' to 'Anthropic executes the BAA and enables HIPAA readiness for your organization.'; the Covered Models paragraph splits one sentence into three ('are designated Covered Models. See the Covered Models support article. They require 30-day data retention.') without changing meaning; and the Platform features paragraph opening changes from 'Features that relate to ... Some are available in only one of them.' to 'This section lists features that relate to ... Some are available in only one of them.'."
issue = "https://github.com/arcships/zdr-monitor/issues/1214"
