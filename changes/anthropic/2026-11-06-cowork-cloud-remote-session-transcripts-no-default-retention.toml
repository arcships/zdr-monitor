summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 的『Several retention models sit outside the ZDR and HIPAA arrangements』一段改写了远端会话转写的保留口径。旧句:「Local session transcripts (from sessions on users’ machines, in apps such as Cowork and Claude Code) are stored for 6 years by default, or for your organization’s custom conversation retention period when a finite one is set (the same claude.ai setting). Remote session transcripts (Cowork in the cloud) are retained for 6 years, unless a user deletes the session sooner. Claude Tag session transcripts, also remote sessions, have no default retention period; see Retention and deletion.」新句:「Local session transcripts come from sessions on users’ machines, in apps such as Cowork and Claude Code. These transcripts are stored for 6 years by default, or for your organization’s custom conversation retention period when a finite one is set (the same claude.ai setting). Remote session transcripts (Cowork in the cloud and Claude Tag) have no default retention period. See Retention and deletion.」要点:Cowork 云端远端会话转写从「保留 6 年,用户提前删除除外」改为与 Claude Tag 合并的「没有默认保留期限」;本地会话转写只是改写措辞,默认 6 年或组织自定义有限保留期的口径不变;对象=远端会话转写(Cowork 云端与 Claude Tag);语境=默认,该段自述这些保留模型都在本页所述 ZDR 与 HIPAA 安排之外;期限类型=无默认保留期限(厂商未给删除期限,不能据此推出 6 年或任何固定上限,也不能推出立即删除)。该变化不影响 api 档结论字段:retention 仍为 days=30/object=input_output/basis=fixed_period(依据仍是隐私中心 7996866),zdr 仍为 mark=yes/mode=by_agreement(依据仍是 8956058);该页仍因 retention 表述与 7996866 冲突而标 contradiction,本段仅作语境记录、不承载锚点,现有锚点的 exact 均未受影响。同轮 intro 的覆盖范围把 Claude in Microsoft Foundry 与 Claude Models on Google Cloud (Anthropic managed) 换序,role-api-processor 的 prefix 随语序同步更新(exact 未变);其余改动为侧栏新增 IP allowlisting (beta)、Files API reference 卡片提示文案、FAQ 标题不可见字符差异,以及『retained per the feature’s documented policy』改为『retained according to the feature’s documented policy』,均不涉及五个维度。"
summary_en = "The paragraph 'Several retention models sit outside the ZDR and HIPAA arrangements' on platform.claude.com/docs/en/manage-claude/api-and-data-retention rewrites the retention rule for remote session transcripts. Old text: 'Local session transcripts (from sessions on users’ machines, in apps such as Cowork and Claude Code) are stored for 6 years by default, or for your organization’s custom conversation retention period when a finite one is set (the same claude.ai setting). Remote session transcripts (Cowork in the cloud) are retained for 6 years, unless a user deletes the session sooner. Claude Tag session transcripts, also remote sessions, have no default retention period; see Retention and deletion.' New text: 'Local session transcripts come from sessions on users’ machines, in apps such as Cowork and Claude Code. These transcripts are stored for 6 years by default, or for your organization’s custom conversation retention period when a finite one is set (the same claude.ai setting). Remote session transcripts (Cowork in the cloud and Claude Tag) have no default retention period. See Retention and deletion.' Substance: remote session transcripts for Cowork in the cloud move from 'retained for 6 years, unless a user deletes the session sooner' to the same 'no default retention period' wording already used for Claude Tag; the local-session rule is only reworded and keeps the 6-year default or the organization's own finite conversation retention period. Object = remote session transcripts (Cowork in the cloud and Claude Tag); context = default, with the paragraph stating that these retention models sit outside the ZDR and HIPAA arrangements described on the page; type = no default retention period (no deletion deadline is given, so neither a 6-year nor any other fixed upper bound, nor immediate deletion, can be inferred). This does not change any API-tier verdict field: retention remains days=30/object=input_output/basis=fixed_period (still based on privacy-centre article 7996866), and zdr remains mark=yes/mode=by_agreement (still based on 8956058); the page stays marked contradiction because its retention statement conflicts with 7996866, and this paragraph is recorded as context only with no anchor. No existing anchor's exact text is affected. In the same revision the intro reorders Claude in Microsoft Foundry and Claude Models on Google Cloud (Anthropic managed), and the role-api-processor prefix was updated to follow the new order (exact unchanged); other edits are a new 'IP allowlisting (beta)' sidebar item, a preview hint on the Files API reference card, invisible-character differences in FAQ headings, and 'retained per the feature’s documented policy' becoming 'retained according to the feature’s documented policy', none of which touches the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1077"
