summary_zh = "code.claude.com/docs/en/data-usage 把 Ultra 加入消费档(consumer users)名单。旧句:「**Consumer users (Free, Pro, and Max plans)**: We give you the choice to allow your data to be used to improve future Claude models. We will train new models using data from Free, Pro, and Max accounts when this setting is on (including when you use Claude Code from these accounts).」新句:「**Consumer users (Free, Pro, Max, and Ultra plans)**: We give you the choice to allow your data to be used to improve future Claude models. We will train new models using data from Free, Pro, Max, and Ultra accounts when this setting is on (including when you use Claude Code from these accounts).」同页『Data retention』的消费档标题旧「**Consumer users (Free, Pro, and Max plans)**:」改为「**Consumer users (Free, Pro, Max, and Ultra plans)**:」,页面末尾旧「Consumer Terms (for Free, Pro, and Max users)」改为「Consumer Terms (for Free, Pro, Max, and Ultra users)」;消费档 5 年/30 天两档保留期限本身未改。要点:Ultra 被明确归入消费档,因此适用同一条训练口径(开启设置后其数据可用于训练新模型)与同一套 5 年/30 天保留口径。api 档五维结论字段均未变(training mark=yes/by_contract;retention days=30/object=input_output/basis=fixed_period,依据仍在商业档条款与 7996866),本页消费档条款不继承给 API 档;本轮只据此更新消费档训练锚点 cc-consumer-training-on 的 exact。同轮 telemetry 段「Pro or Max」改为「Pro, Max, or Ultra」、「Pro and Max sign-ins」改为「Pro, Max, and Ultra sign-ins」属运营遥测的默认开关范围,不属五个维度。"
summary_en = "code.claude.com/docs/en/data-usage adds Ultra to the consumer-users list. Old sentence: '**Consumer users (Free, Pro, and Max plans)**: We give you the choice to allow your data to be used to improve future Claude models. We will train new models using data from Free, Pro, and Max accounts when this setting is on (including when you use Claude Code from these accounts).' New sentence: '**Consumer users (Free, Pro, Max, and Ultra plans)**: We give you the choice to allow your data to be used to improve future Claude models. We will train new models using data from Free, Pro, Max, and Ultra accounts when this setting is on (including when you use Claude Code from these accounts).' The consumer header under 'Data retention' changes from '**Consumer users (Free, Pro, and Max plans)**:' to '**Consumer users (Free, Pro, Max, and Ultra plans)**:', and the closing reference changes from 'Consumer Terms (for Free, Pro, and Max users)' to 'Consumer Terms (for Free, Pro, Max, and Ultra users)'; the two consumer retention periods (5 years / 30 days) themselves are unchanged. Substance: Ultra is explicitly placed in the consumer tier, so it takes the same training statement (with the setting on, its data is used to train new models) and the same 5-year/30-day retention treatment. No API-tier verdict field changed (training mark=yes/by_contract; retention days=30/object=input_output/basis=fixed_period, still based on the commercial terms and 7996866), as consumer terms do not carry over to the API tier. This round only updates the exact of the consumer training anchor cc-consumer-training-on. The same commit's telemetry changes ('Pro or Max' to 'Pro, Max, or Ultra'; 'Pro and Max sign-ins' to 'Pro, Max, and Ultra sign-ins') concern the default scope of operational telemetry, not any of the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/955"
