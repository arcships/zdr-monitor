summary_zh = "privacy.claude.com 文章 8956058 改写 BAA 段，日期行由「June 9, 2026」变为「Updated today」。旧句：「If you have questions about Anthropic's Business Associate Agreement (BAA), which is only available to customers who use our HIPAA-eligible services, including those that qualify for zero data retention, please also read this article. As part of the BAA, customers of Anthropic’s HIPAA-eligible services are subject to certain configuration requirements and limitations on what features/integrations are available (e.g., the BAA would not apply to use of the web search functionality).」新句：「Anthropic's Business Associate Agreement (BAA) is available for Anthropic's HIPAA-ready services, such as the Claude API with HIPAA configuration enabled and HIPAA-ready Enterprise plans. Those services don't need Zero Data Retention. For Claude Code with a Claude Console API key, the BAA applies only when that Claude Console organization has Zero Data Retention enabled. For Claude Code on a HIPAA-ready Enterprise plan, the BAA applies with the HIPAA configuration applied to Claude Code (local mode) and Cowork (local mode), or with zero data retention for Claude Code. Our Business Associate Agreements (BAA) for Commercial Customers lists which features the BAA covers and the configuration each one needs.」要点：旧文只把 BAA 系于「HIPAA-eligible services」，并把「符合零数据保留」笼统列为可获得 BAA 的情形之一；新文按服务拆开，明确 HIPAA-ready 服务「don't need Zero Data Retention」，并分别给出 Claude Code 走 Console API key（须该组织启用 ZDR）与走 HIPAA-ready Enterprise plan（HIPAA 配置或 ZDR 均可）时 BAA 的前置条件。ZDR 安排本身（不存储输入输出、仍保留 User Safety 分类结果、按 organization 审批）逐字未改，api 档 zdr 结论字段与锚点不变（mark=yes / mode=by_agreement，依据仍是该文原句）。相关文章推荐项由「Can you delete data that I sent via Team and Enterprise plans?」换成「What Certifications has Anthropic obtained?」，属版式，不构成维度变化。"
summary_en = "On privacy.claude.com article 8956058 the BAA paragraph was rewritten and the date line changed from 'June 9, 2026' to 'Updated today'. Old sentence: 'If you have questions about Anthropic's Business Associate Agreement (BAA), which is only available to customers who use our HIPAA-eligible services, including those that qualify for zero data retention, please also read this article. As part of the BAA, customers of Anthropic’s HIPAA-eligible services are subject to certain configuration requirements and limitations on what features/integrations are available (e.g., the BAA would not apply to use of the web search functionality).' New sentence: 'Anthropic's Business Associate Agreement (BAA) is available for Anthropic's HIPAA-ready services, such as the Claude API with HIPAA configuration enabled and HIPAA-ready Enterprise plans. Those services don't need Zero Data Retention. For Claude Code with a Claude Console API key, the BAA applies only when that Claude Console organization has Zero Data Retention enabled. For Claude Code on a HIPAA-ready Enterprise plan, the BAA applies with the HIPAA configuration applied to Claude Code (local mode) and Cowork (local mode), or with zero data retention for Claude Code. Our Business Associate Agreements (BAA) for Commercial Customers lists which features the BAA covers and the configuration each one needs.' Substance: the old text tied BAA availability to 'HIPAA-eligible services' and listed 'those that qualify for zero data retention' as one such case without distinguishing which services need ZDR; the new text splits it by service, states explicitly that HIPAA-ready services 'don't need Zero Data Retention', and gives the BAA prerequisites separately for Claude Code via a Claude Console API key (that organization must have ZDR enabled) and Claude Code on a HIPAA-ready Enterprise plan (either the HIPAA configuration or ZDR). The ZDR arrangement itself (inputs and outputs are not stored, User Safety classifier results are still retained, approval is per organization) is unchanged word for word, so the API tier's zdr verdict fields and anchors are unchanged (mark=yes / mode=by_agreement, still based on this article's sentence). The related-article link changed from 'Can you delete data that I sent via Team and Enterprise plans?' to 'What Certifications has Anthropic obtained?'; that is a layout change, not a dimension change."
issue = "https://github.com/arcships/zdr-monitor/issues/508"
