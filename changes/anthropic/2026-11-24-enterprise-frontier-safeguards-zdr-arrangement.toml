summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 在 Legacy ZDR 与 HIPAA readiness 之外新增第三种安排 Enterprise Frontier Safeguards(EFS ZDR,beta),并允许 Covered Models 在该安排下使用 ZDR。页首旧句:『Anthropic offers two data handling arrangements for the Claude API: zero data retention (ZDR) and HIPAA readiness.』新句:『Anthropic now offers three data handling arrangements for the Claude API: legacy zero data retention (Legacy ZDR), HIPAA readiness, and Enterprise Frontier Safeguards (EFS ZDR).』页面并新增:『EFS ZDR is in beta. While EFS ZDR rolls out, if you see references to “ZDR” in our Documentation outside the Enterprise Frontier Safeguards guide, these references refer to Legacy ZDR.』『Model-specific data retention requirements』段在旧句『ZDR is therefore not available for any of them unless expressly authorized by Anthropic.』之后新增『With Enterprise Frontier Safeguards, eligible organizations can use these models under Enterprise Frontier Safeguards ZDR.』功能资格表的 Yes 说明由『Covered Models are not available under ZDR regardless of feature eligibility.』改为『…unless expressly authorized by Anthropic or used in a workspace on Enterprise Frontier Safeguards.』;No 说明新增『However, in a workspace with Anthropic Human Review off, such as any workspace on Enterprise Frontier Safeguards, the Batch API refuses new batches. Anthropic’s Claude Managed Agents service doesn’t run sessions there either.』,FAQ 以『But in a workspace with Anthropic Human Review off …』重复同一限制;资格表列名由 ZDR eligible 改为 Legacy ZDR eligible。要点:ZDR 现在分 Legacy ZDR 与 EFS ZDR(beta)两种,EFS 指南之外的『ZDR』均指 Legacy ZDR;Covered Models 在 Legacy ZDR 下仍须 Anthropic 明确授权,但合格组织可改走 EFS ZDR;EFS workspace(关闭 Human Review)会拒绝新 Batch、不运行 Claude Managed Agents 会话。api 档结论字段未变(zdr mark=yes/mode=by_agreement,依据仍是隐私中心 8956058;retention days=30/object=input_output/basis=fixed_period,依据仍是隐私中心 7996866),但厂商确实新增了 ZDR 安排与受约束模型的适用范围,故记录;provider 的 zdr 说明新增两条 point,retention 的 Covered Models 说明同步注明 Legacy ZDR 与 EFS 路径。该页仍因 retention 表述与 7996866 冲突而标 contradiction,本页不作为 retention 结论依据。EFS 指南本身不在本 provider 的来源清单内,以上 EFS 细节仅来自本页;同轮其余改动(HIPAA 自助开通措辞、Get help enabling 小节、Related resources 增加 EFS 链接、侧栏分组)不涉及五个维度。"
summary_en = "platform.claude.com/docs/en/manage-claude/api-and-data-retention adds a third arrangement, Enterprise Frontier Safeguards (EFS ZDR, beta), alongside Legacy ZDR and HIPAA readiness, and lets Covered Models run under ZDR through it. The opening sentence changed from 'Anthropic offers two data handling arrangements for the Claude API: zero data retention (ZDR) and HIPAA readiness.' to 'Anthropic now offers three data handling arrangements for the Claude API: legacy zero data retention (Legacy ZDR), HIPAA readiness, and Enterprise Frontier Safeguards (EFS ZDR).' A new paragraph reads 'EFS ZDR is in beta. While EFS ZDR rolls out, if you see references to “ZDR” in our Documentation outside the Enterprise Frontier Safeguards guide, these references refer to Legacy ZDR.' Under 'Model-specific data retention requirements', after the old sentence 'ZDR is therefore not available for any of them unless expressly authorized by Anthropic.', the page adds 'With Enterprise Frontier Safeguards, eligible organizations can use these models under Enterprise Frontier Safeguards ZDR.' The feature-eligibility legend's Yes entry changes from 'Covered Models are not available under ZDR regardless of feature eligibility.' to '…unless expressly authorized by Anthropic or used in a workspace on Enterprise Frontier Safeguards.'; the No entry now adds 'However, in a workspace with Anthropic Human Review off, such as any workspace on Enterprise Frontier Safeguards, the Batch API refuses new batches. Anthropic’s Claude Managed Agents service doesn’t run sessions there either.', and the FAQ repeats the same restriction with 'But in a workspace with Anthropic Human Review off …'; and the table column is renamed from 'ZDR eligible' to 'Legacy ZDR eligible'. Substance: ZDR now comes in two forms, Legacy ZDR and EFS ZDR (beta), and references to 'ZDR' outside the EFS guide mean Legacy ZDR; Covered Models still need Anthropic's express authorization under Legacy ZDR but eligible organizations can now use them under EFS ZDR; in an EFS workspace (Human Review off) the Batch API refuses new batches and Claude Managed Agents does not run sessions. No API-tier verdict field changed (zdr mark=yes/mode=by_agreement, still based on privacy-centre article 8956058; retention days=30/object=input_output/basis=fixed_period, still based on privacy-centre article 7996866), but the vendor did add a ZDR arrangement and broaden the models it can cover, so this is recorded; the provider file gains two zdr points and the Covered Models note in retention now names Legacy ZDR and the EFS route. The page remains marked contradiction because its retention statement conflicts with 7996866 and is not the basis for the retention verdict. The EFS guide itself is not among this provider's sources, so all EFS details above come from this page; the remaining edits in the same revision (HIPAA self-serve wording, the Get help enabling section, the EFS link in Related resources, sidebar grouping) do not touch the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1398"
