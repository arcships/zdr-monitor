summary_zh = "platform.claude.com/docs/en/manage-claude/api-and-data-retention 把 Ultra 加入消费档名单,用于 ZDR 与 HIPAA readiness 的排除范围。旧『What ZDR does not cover』句:「**Claude consumer products:** Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.」新句:「**Claude consumer products:** Claude Free, Pro, Max, and Ultra plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.」同页『What HIPAA readiness does not cover』旧「**Claude consumer products:** Claude Free, Pro, and Max plans.」改为「**Claude consumer products:** Claude Free, Pro, Max, and Ultra plans.」。要点:Ultra 计划明确不在本页 ZDR 与 HIPAA readiness 覆盖范围内,与 Free/Pro/Max 同列;这是消费档归属的澄清,未改变商业/API 档的 ZDR 资格或申请方式。api 档 zdr 结论字段未变(mark=yes / mode=by_agreement,依据仍是隐私中心 8956058),本页仅作矛盾来源保留;本轮只更新排除清单锚点 zdr-consumer-excluded 的 exact。同轮导航项改名(『Usage and Cost API』→『Usage and Cost Analytics API』及 legacy 条目)与标题锚点符号移除属版式,与五个维度无关。"
summary_en = "platform.claude.com/docs/en/manage-claude/api-and-data-retention adds Ultra to the consumer-plan lists used for the ZDR and HIPAA-readiness exclusions. Old 'What ZDR does not cover' bullet: '**Claude consumer products:** Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.' New bullet: '**Claude consumer products:** Claude Free, Pro, Max, and Ultra plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.' The 'What HIPAA readiness does not cover' bullet changes from '**Claude consumer products:** Claude Free, Pro, and Max plans.' to '**Claude consumer products:** Claude Free, Pro, Max, and Ultra plans.' Substance: Ultra is explicitly outside the page's ZDR and HIPAA-readiness coverage, listed alongside Free, Pro and Max; this clarifies the consumer-tier attribution and does not change the commercial/API tier's ZDR eligibility or request process. No API-tier zdr verdict field changed (mark=yes / mode=by_agreement, still based on privacy-centre article 8956058); this page remains the contradiction source, and this round only updates the exact of the exclusion-list anchor zdr-consumer-excluded. The same commit's navigation rename ('Usage and Cost API' to 'Usage and Cost Analytics API' plus a legacy entry) and removal of heading anchor symbols are formatting, unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/955"
