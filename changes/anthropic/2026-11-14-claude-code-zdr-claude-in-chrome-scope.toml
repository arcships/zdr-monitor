summary_zh = "code.claude.com/docs/en/zero-data-retention 的「What ZDR does not cover」表新增 Claude in Chrome 行:「The Claude in Chrome browser extension is not covered by ZDR. It is not available in Claude Code with ZDR, but members can still use it outside Claude Code where your organization allows it.」对象=Claude in Chrome 浏览器扩展（及其处理的数据）；语境=组织启用 ZDR 时该扩展仍不被 ZDR 覆盖（在 Claude Code 内不可用，但组织允许时可在 Claude Code 之外使用）。同轮把各级小标题从纯文本改成 markdown 标题（如「ZDR scope」→「## ZDR scope」），属版式。该句是 Claude Code on Claude for Enterprise 的功能级 ZDR 范围排除，不改变 ZDR 的资格与开通方式，也不影响本 provider（API 档）的结论字段与锚点：zdr 仍 mark=yes / mode=by_agreement（依据隐私中心 8956058），retention 仍 days=30 / object=input_output / basis=fixed_period（依据隐私中心 7996866）。因厂商确实新增了与 zdr 维度相关的排除条款，即使结论值未变也按规则记录；该页的 Claude Code 功能级细节由 anthropic-claude-code 的复核记录覆盖。"
summary_en = "On code.claude.com/docs/en/zero-data-retention, the 'What ZDR does not cover' table gains a Claude in Chrome row: 'The Claude in Chrome browser extension is not covered by ZDR. It is not available in Claude Code with ZDR, but members can still use it outside Claude Code where your organization allows it.' Object = the Claude in Chrome browser extension (and the data it processes); context = even with ZDR enabled for the organization, the extension is not covered (it is unavailable inside Claude Code with ZDR, but members can still use it outside Claude Code where the organization allows it). In the same round, subheadings changed from plain text to markdown headings (for example, 'ZDR scope' became '## ZDR scope'), which is formatting. This sentence is a feature-level ZDR scope exclusion for Claude Code on Claude for Enterprise; it does not change ZDR eligibility or enablement, and it changes no conclusion field or anchor of this provider (the API tier): zdr remains mark=yes / mode=by_agreement (based on privacy-centre article 8956058) and retention remains days=30 / object=input_output / basis=fixed_period (based on privacy-centre article 7996866). Because the vendor did add a clause touching the zdr dimension, this is recorded even though no verdict value changed; the page's Claude Code feature-level detail is covered by the anthropic-claude-code review record."
issue = "https://github.com/arcships/zdr-monitor/issues/1253"
