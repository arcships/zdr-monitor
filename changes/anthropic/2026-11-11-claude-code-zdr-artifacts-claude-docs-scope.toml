summary_zh = "code.claude.com/docs/en/zero-data-retention 本轮新增、改写了 Claude Code 功能级的 ZDR 范围表述，均不涉及 API 档的输入输出。(1)「What ZDR does not cover」的引导句由「ZDR does not extend to the following, even for organizations with ZDR enabled. These features follow standard data retention policies:」改为「ZDR does not extend to the following, even for organizations with ZDR enabled. Except where a row says otherwise, these features follow standard data retention policies:」，为表中偏离标准保留政策的行留出例外。(2) 同表新增 Artifacts 行：「Artifacts in chat conversations and Cowork sessions are not covered by ZDR, and are kept until deleted unless your organization sets a retention period for them. Artifacts are not available in Claude Code with ZDR.」对象=claude.ai 聊天与 Cowork 会话中的 Artifacts；语境=ZDR 组织；期限类型=无默认上限（删除前一直保留，除非组织为该类内容另设保留期）。(3)「Features disabled under ZDR」表把原「Artifacts」行改名为「Artifacts in Claude Code」，并新增「Claude Docs」行：「Requires storing document content on Anthropic-operated infrastructure.」即启用 ZDR 后 Claude Docs 因需在 Anthropic 运营的基础设施上存储文档内容而在后端被禁用。以上均为 Claude Code on Claude for Enterprise 的功能级范围，不改变 ZDR 的资格与开通方式（仍仅限合格 Claude for Enterprise 账号、由 Anthropic 按组织单独启用），也不改变本 provider（API 档）的任何结论字段与锚点：zdr 仍 mark=yes / mode=by_agreement（依据隐私中心 8956058），retention 仍 days=30 / object=input_output / basis=fixed_period（依据隐私中心 7996866），API 输入输出的 30 天口径未变。导航移除「What's New」属版式。因厂商确实新增了与 zdr/retention 相关的条款句子，按规则记录；该页的 Claude Code 功能级细节由 anthropic-claude-code 的复核记录覆盖。"
summary_en = "On code.claude.com/docs/en/zero-data-retention this round adds and rewrites Claude Code feature-level ZDR scope statements; none of them concern API-tier inputs and outputs. (1) The lead-in under 'What ZDR does not cover' changed from 'ZDR does not extend to the following, even for organizations with ZDR enabled. These features follow standard data retention policies:' to 'ZDR does not extend to the following, even for organizations with ZDR enabled. Except where a row says otherwise, these features follow standard data retention policies:', carving out an exception for rows that depart from the standard retention policy. (2) That table gains an Artifacts row: 'Artifacts in chat conversations and Cowork sessions are not covered by ZDR, and are kept until deleted unless your organization sets a retention period for them. Artifacts are not available in Claude Code with ZDR.' Object = Artifacts in claude.ai chat conversations and Cowork sessions; context = a ZDR organization; duration type = no default upper bound (kept until deleted unless the organization sets a retention period for that content). (3) The 'Features disabled under ZDR' table renames the existing 'Artifacts' row to 'Artifacts in Claude Code' and adds a 'Claude Docs' row: 'Requires storing document content on Anthropic-operated infrastructure.' That is, with ZDR enabled Claude Docs is disabled at the backend because it requires storing document content on Anthropic-operated infrastructure. All of this is feature-level scope for Claude Code on Claude for Enterprise; it does not change ZDR eligibility or enablement (still limited to qualified Claude for Enterprise accounts, enabled per organization by Anthropic), and it changes no verdict field or anchor of this provider (the API tier): zdr remains mark=yes / mode=by_agreement (based on privacy-centre article 8956058) and retention remains days=30 / object=input_output / basis=fixed_period (based on privacy-centre article 7996866); the 30-day rule for API inputs and outputs is unchanged. Removal of the 'What's New' navigation entry is a layout change. Because the vendor did add clauses touching the zdr/retention dimensions, this is recorded; the page's Claude Code feature-level detail is covered by the anthropic-claude-code review record."
issue = "https://github.com/arcships/zdr-monitor/issues/1175"
