summary_zh = "code.claude.com/docs/en/zero-data-retention 在「ZDR on Claude for Enterprise gives enterprise customers the ability to use Claude Code with zero data retention and access administrative capabilities:」这句之前新增一段 HIPAA/BAA 说明，新增原文：「Claude for Enterprise organizations that have enabled HIPAA can bring the Claude Code CLI and the Code tab in Claude Desktop under their Business Associate Agreement (BAA) without ZDR once the HIPAA configuration is applied to Claude Code (local mode) and Cowork (local mode). See Set up Claude Code (local mode) for a HIPAA-ready organization. Organizations without the HIPAA configuration still need ZDR for BAA coverage of Claude Code. See the Implementation Guide for a list of Eligible Services.」即：启用 HIPAA 配置的 Claude for Enterprise 组织可凭 BAA 覆盖 Claude Code CLI 与 Desktop 的 Code tab 而无需 ZDR；未启用 HIPAA 配置的组织，Claude Code 若要有 BAA 覆盖仍需要 ZDR。该新增段只补充 BAA 与 ZDR 的前置关系，页面其余 ZDR 覆盖范围、排除项、禁用功能、per-organization 开通口径（含锚点句「Zero Data Retention (ZDR) for Claude Code is available to qualified accounts on Claude for Enterprise.」）逐字未改，api 档 zdr 结论字段与锚点不变（仍 mark=yes / mode=by_agreement）。导航新增「Plugins」属版式，不构成维度变化。"
summary_en = "On code.claude.com/docs/en/zero-data-retention a HIPAA/BAA paragraph was added immediately before the sentence 'ZDR on Claude for Enterprise gives enterprise customers the ability to use Claude Code with zero data retention and access administrative capabilities:'. Added text: 'Claude for Enterprise organizations that have enabled HIPAA can bring the Claude Code CLI and the Code tab in Claude Desktop under their Business Associate Agreement (BAA) without ZDR once the HIPAA configuration is applied to Claude Code (local mode) and Cowork (local mode). See Set up Claude Code (local mode) for a HIPAA-ready organization. Organizations without the HIPAA configuration still need ZDR for BAA coverage of Claude Code. See the Implementation Guide for a list of Eligible Services.' In other words: Claude for Enterprise organizations with the HIPAA configuration enabled can bring the Claude Code CLI and the Desktop Code tab under their BAA without ZDR, while organizations without the HIPAA configuration still need ZDR for BAA coverage of Claude Code. The addition only records the BAA-versus-ZDR prerequisites; the rest of the page — ZDR scope, exclusions, disabled features, the per-organization enablement wording (including the anchor sentence 'Zero Data Retention (ZDR) for Claude Code is available to qualified accounts on Claude for Enterprise.') — is unchanged word for word, so the API tier's zdr verdict fields and anchors are unchanged (still mark=yes / mode=by_agreement). The navigation entry 'Plugins' was added; that is a layout change, not a dimension change."
issue = "https://github.com/arcships/zdr-monitor/issues/508"
