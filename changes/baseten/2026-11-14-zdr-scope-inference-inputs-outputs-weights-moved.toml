summary_zh = "《Baseten Security Practices》页内 Last Updated 由 November 5, 2026 改为 November 12, 2026，并把原 CUSTOMER CONTENT PROCESSING AND DATA RETENTION 一节拆为 CUSTOMER CONTENT PROCESSING、ZERO DATA RETENTION 与 DATA RETENTION 三节。ZDR 定义的对象由 Customer Content 收窄为 inference inputs or outputs：旧文为「Baseten shall not (a) log, record, or store Customer Content; or (b) save Customer Content to persistent storage」，新文为「Baseten shall not (a) log, record, or store inference inputs or outputs; or (b) save inference inputs or outputs to persistent storage」。Model APIs 条由「a Zero Data Retention posture for all Customer Content」改为「for all model inputs or outputs」；Dedicated Inference 条由「Customer Model inputs and outputs」改为「Customer Model inputs or outputs」。原列在 ZDR 产品清单里的「Customer Model Weights」条被删除并移入 DATA RETENTION 的「Dedicated Inference (non-input/output data)」段：新文称权重在服务推理请求时动态载入 GPU 内存、默认不持久化，客户可在运行时从客户控制的来源加载；视客户所选配置（包括使用 Baseten Delivery Network），权重可能按部署与推理需要在 Baseten 基础设施内被存储与缓存，并可按请求永久删除。旧文只说「Customers may enable weight caching via supported configurations; cached weights can be permanently deleted on request」。ZDR Configuration Changes 由「Customers may request changes to the applicable ZDR configuration」改为「Customers may elect to enable logging, traffic recording, retention, abuse monitoring, or other changes to the applicable ZDR configuration」；Customer-Controlled Factors 的 (c) 项则由「enable logging, retention, abuse monitoring, or any Third-Party Product」收窄为「enable any Third-Party Product」，客户可开启 logging/retention/abuse monitoring 的例外移入前者。Asynchronous Inference 条新增定性「Asynchronous inference is an elective feature of Dedicated Inference」。另新增 USE OF BASETEN SANDBOXES 使用限制一节，与五个维度无关。结论层面：api 与 dedicated 的 zdr 仍为 yes/default、retention 仍为 input_output/none，training 的 zdr 仍为 no、retention 仍为 mixed/until_termination，self_hosted 的 zdr 仍为 yes/by_deployment；方向记为 weakened，因为 ZDR 承诺的对象由 Customer Content 收窄为推理输入输出，权重被移出 ZDR 清单。"
summary_en = "The 'Last Updated' date on the Baseten Security Practices page moved from November 5, 2026 to November 12, 2026, and the former CUSTOMER CONTENT PROCESSING AND DATA RETENTION section was split into CUSTOMER CONTENT PROCESSING, ZERO DATA RETENTION and DATA RETENTION. The object of the ZDR definition narrowed from Customer Content to inference inputs or outputs: the old text read 'Baseten shall not (a) log, record, or store Customer Content; or (b) save Customer Content to persistent storage', the new text reads 'Baseten shall not (a) log, record, or store inference inputs or outputs; or (b) save inference inputs or outputs to persistent storage'. The Model APIs entry changed from 'a Zero Data Retention posture for all Customer Content' to 'for all model inputs or outputs'; the Dedicated Inference entry changed from 'Customer Model inputs and outputs' to 'Customer Model inputs or outputs'. The 'Customer Model Weights' bullet was removed from the ZDR product list and moved into the DATA RETENTION paragraph 'Dedicated Inference (non-input/output data)': the new text says weights are loaded dynamically into GPU memory to serve inference requests and are not persisted to storage by default, customers may load weights at runtime from a Customer-controlled source via supported configurations, and depending on the configuration selected by Customer (including use of the Baseten Delivery Network) weights may be stored and cached within Baseten's infrastructure as necessary to deploy and serve the model, and can be permanently deleted on request. The old text only said 'Customers may enable weight caching via supported configurations; cached weights can be permanently deleted on request'. ZDR Configuration Changes changed from 'Customers may request changes to the applicable ZDR configuration' to 'Customers may elect to enable logging, traffic recording, retention, abuse monitoring, or other changes to the applicable ZDR configuration'; item (c) of Customer-Controlled Factors narrowed from 'enable logging, retention, abuse monitoring, or any Third-Party Product' to 'enable any Third-Party Product', with the customer's ability to enable logging/retention/abuse monitoring now stated in the former clause. The Asynchronous Inference entry added the qualifier 'Asynchronous inference is an elective feature of Dedicated Inference'. A new USE OF BASETEN SANDBOXES section was added; it is unrelated to the five dimensions. On the verdict side, api and dedicated zdr remain yes/default and retention input_output/none, training zdr remains no and retention mixed/until_termination, and self_hosted zdr remains yes/by_deployment. Direction recorded as weakened because the object of the ZDR commitment narrowed from Customer Content to inference inputs and outputs, and weights were moved out of the ZDR list."
issue = "https://github.com/arcships/zdr-monitor/issues/1231"
