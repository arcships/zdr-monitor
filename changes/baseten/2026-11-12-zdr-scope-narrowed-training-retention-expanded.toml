summary_zh = "《Baseten Security Practices》页内 Last Updated 由 September 15, 2026 改为 November 5, 2026。CUSTOMER CONTENT PROCESSING AND DATA RETENTION 的 ZDR 范围句由「Baseten adheres to a Zero Data Retention posture across all inference products」改为「across the below inference products」，把承诺限定为其后列出的产品；该产品清单（Model APIs、Dedicated Inference、Asynchronous Inference、Customer Model Weights）在改动前后相同，自托管从来不在其中。Training 段由单句 30 天终止后条款扩写为「Training (including Loops and Serverless Loops)」：训练与采样异步运行，请求（含训练数据与 prompt）处理前临时排队，输出临时保存以便取回，原文称「Each is deleted once a request is processed」（最直接指请求，未单列输出的删除期限）；checkpoint 与其他由 Loops/Serverless Loops 创建的 Customer Models 保留至客户自行删除；终止后 30 天取回期与删除承诺不变。另新增 Baseten Sandboxes 条（内容保留至客户删除，使用结束后 30 天取回），并在 HIPAA 条注明 Serverless Loops 不在 BAA 覆盖范围。结论层面：training 档 retention 由固定 30 天（fixed_period，days=30）改为留至服务终止（until_termination，checkpoint 由客户删除控制），training 档 zdr 仍为 no；self_hosted 的 zdr 仍为 yes，但其依据改为自托管文档与架构，因为 Security Practices 的 ZDR 范围句现在只指向一个不含 Self-Hosted 的固定清单（改动前该清单同样不含 Self-Hosted）。方向记为 weakened：范围句由 all inference products 收窄为 below the listed products。"
summary_en = "The 'Last Updated' date on the Baseten Security Practices page moved from September 15, 2026 to November 5, 2026. The ZDR scope sentence changed from 'Baseten adheres to a Zero Data Retention posture across all inference products' to 'across the below inference products', limiting the commitment to the products listed below; that product list (Model APIs, Dedicated Inference, Asynchronous Inference, Customer Model Weights) is the same before and after the change, and Self-Hosted was never in it. The Training paragraph was expanded from a single 30-day post-termination sentence into 'Training (including Loops and Serverless Loops)': training and sampling operations run asynchronously, requests (training data and prompts included) are temporarily queued until processed, outputs are held temporarily for retrieval, and the page says 'Each is deleted once a request is processed' (most directly the requests; it states no separate deletion deadline for outputs); checkpoints and other Customer Models created through Loops and Serverless Loops are retained until the customer deletes them; the 30-day post-term retrieval and deletion commitment is unchanged. A new Baseten Sandboxes entry was added (content retained until Customer deletes it, with a 30-day retrieval window after use ends), and the HIPAA entry now notes that Serverless Loops is not covered by a BAA. On the verdict side, the training tier's retention basis moves from a fixed 30-day period (fixed_period, days=30) to until_termination (checkpoints are customer-deleted), while training zdr stays no; self-hosted zdr stays yes but now rests on the self-hosted documentation and architecture, because the Security Practices' ZDR scope sentence now points to a fixed list that does not include Self-Hosted (that list did not include it before either). Direction recorded as weakened: the scope sentence narrowed from all inference products to the products listed below."
issue = "https://github.com/arcships/zdr-monitor/issues/1202"
