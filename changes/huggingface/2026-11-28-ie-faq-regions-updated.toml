summary_zh = "hf-endpoints-documentation 的 support/faq.md 在 2026-11-28 快照（#1488）更新了 Inference Endpoints 可部署区域清单。旧句「Inference Endpoints are currently available on AWS in us-east-1 (N. Virginia) & eu-west-1 (Ireland), on Azure in eastus (Virginia), and on GCP in us-east4 (Virginia).」改为「Inference Endpoints are currently available on AWS in us-east-1 (N. Virginia), us-east-2 (Ohio), us-west-2 (Oregon) & eu-west-1 (Ireland), and on GCP in us-east4 (Virginia) & us-south1 (Dallas).」：AWS 新增 us-east-2、us-west-2，GCP 新增 us-south1，不再列出 Azure eastus；us-east-1、eu-west-1、us-east4 保留。dedicated_endpoints 档 processing_region 的结论字段未变（codes 仍为 US / IE / selected），因为可部署地仍全在 US 与 IE 内，只是区域数量由四增为六。锚点 huggingface-ie-faq-regions 改绑到新句，并更新档位说明中的区域清单。方向记为 clarified。"
summary_en = "The Inference Endpoints deployable-region list in hf-endpoints-documentation support/faq.md was updated in the 2026-11-28 snapshot (#1488). The old sentence 'Inference Endpoints are currently available on AWS in us-east-1 (N. Virginia) & eu-west-1 (Ireland), on Azure in eastus (Virginia), and on GCP in us-east4 (Virginia).' became 'Inference Endpoints are currently available on AWS in us-east-1 (N. Virginia), us-east-2 (Ohio), us-west-2 (Oregon) & eu-west-1 (Ireland), and on GCP in us-east4 (Virginia) & us-south1 (Dallas).': AWS adds us-east-2 and us-west-2, GCP adds us-south1, and Azure eastus is no longer listed; us-east-1, eu-west-1, and us-east4 remain. No dedicated_endpoints processing_region verdict field changed (codes remain US / IE / selected), because the deployable locations are still entirely within the US and Ireland; only the number of regions moved from four to six. The huggingface-ie-faq-regions anchor is rebound to the new sentence, and the tier note's region list is updated. Direction recorded as clarified."
