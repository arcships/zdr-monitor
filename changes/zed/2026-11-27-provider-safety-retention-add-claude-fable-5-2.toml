summary_zh = "docs/ai/privacy-and-security 的「Provider Safety Retention for Designated Models」一段把 Claude Fable 5.2 加入 Covered Models 示例列表：由「including Claude Fable 5.1 and Claude Fable 5」改为「including Claude Fable 5.2, Claude Fable 5.1, and Claude Fable 5」。该段主句「Anthropic retains prompts and outputs for models it designates as Covered Models」、30 天下限与「换端点躲不掉」均逐字未变。Fable 5.2 已于 2026-11-10 由 Anthropic 指定进入既有 Covered Models 名单（见 changes/anthropic/2026-11-10-covered-models-add-fable-mythos-5-2.toml），因此这次是 Zed 页面补列一个已被 Anthropic 指定的型号，不是 2026-11-27 新发生的承诺减弱。按 clarified 记录：机制、30 天下限与换端点规则未变；该留存本就适用于厂商提供这些模型的所有平台。同页其他内容（no-training 承诺、ZDR 表、「Zed does not retain your prompts or code context by default」）未变，因此五维结论字段均不变：training/zdr/retention 的说明文字本来就用「provider-designated models / Anthropic 的 Covered Models」泛指，不列举具体型号。"
summary_en = "The 'Provider Safety Retention for Designated Models' section of docs/ai/privacy-and-security adds Claude Fable 5.2 to the Covered Models example list: 'including Claude Fable 5.1 and Claude Fable 5' became 'including Claude Fable 5.2, Claude Fable 5.1, and Claude Fable 5'. The paragraph's main clause 'Anthropic retains prompts and outputs for models it designates as Covered Models', the 30-day floor and the 'switching endpoints does not avoid this' rule are word-for-word unchanged. Fable 5.2 had already been designated by Anthropic into the existing Covered Models list on 2026-11-10 (see changes/anthropic/2026-11-10-covered-models-add-fable-mythos-5-2.toml), so this is the Zed page adding a model Anthropic had already designated, not a new weakening on 2026-11-27. Recorded as clarified: the mechanism, the 30-day floor and the endpoint-switching rule are unchanged; the retention already applies on every platform where the provider offers these models. Nothing else on the page changed (no-training commitments, the ZDR table, 'Zed does not retain your prompts or code context by default'), so no verdict field changes: the training/zdr/retention notes refer generically to 'provider-designated models / Anthropic's Covered Models' and do not enumerate model IDs."
