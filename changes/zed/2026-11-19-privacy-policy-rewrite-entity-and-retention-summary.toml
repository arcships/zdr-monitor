summary_zh = "zed.dev/privacy-policy 于 2026-11-18 改版（快照 #1346，Last Updated: November 18, 2026）。全文把「Zed」统一改为「Zed Industries」，processor 关系从「on behalf of our Zed Business customers」泛化为「on your behalf」，文件名称由 Data Processing Agreement 改为 Data Processing Addendum。与五个维度相关的改动：(1) Summary 删去两句：「We do not store your source code」与「For a limited set of provider-designated AI models (such as Anthropic's Mythos-class models), the model provider retains prompts and outputs for a limited period for safety purposes; see our AI Privacy documentation」，改为「How each Zed Industries product handles your source code is described in our Terms of Service and product-specific terms」；(2) Retention 段的示例由「we don't store source code proxied during collaboration sessions, or audio, video, and screen contents from calls」改为「we don't store audio, video, and screen contents from calls」，删去源码部分；(3) AI Services Providers 披露句由「including website performance monitoring and sales and marketing of our products and services. Zed does not utilize third-party services which use this information for AI training purposes」改为「including product functionality and performance monitoring. Zed Industries requires its third-party AI service providers to contractually commit not to use this information for AI training purposes」；(4) 国际访问者段落（托管与处理地为美国、可再转移到其他国家或地区）逐字未变；(5) 遥测段落删去「You may opt out of local telemetry collection in the Software settings」，Your Choices 下的「Opting-out of Software Telemetry」条目也删除，本地遥测开关仍由未改动的 docs/telemetry 承载。结论字段全部不变：training/zdr/retention 的实质依据仍是未改动的 docs/ai/privacy-and-security 与 docs/telemetry 快照（如「Zed does not retain your prompts or code context by default」），role 个人档仍为 controller、Business 档仍为 processor，processing_region 仍为 US。隐私政策自身删除了源码留存与厂商安全留存的摘要式表述，按 weakened 记录；实际承诺由开发者文档承载，故不降级结论。"
summary_en = "zed.dev/privacy-policy was rewritten on 2026-11-18 (snapshot #1346; Last Updated: November 18, 2026). The entity name is now 'Zed Industries' throughout; the processor relationship changed from 'on behalf of our Zed Business customers' to 'on your behalf'; and the document was renamed from Data Processing Agreement to Data Processing Addendum. Changes relevant to the five dimensions: (1) The Summary drops two sentences — 'We do not store your source code' and 'For a limited set of provider-designated AI models (such as Anthropic's Mythos-class models), the model provider retains prompts and outputs for a limited period for safety purposes; see our AI Privacy documentation' — and replaces them with 'How each Zed Industries product handles your source code is described in our Terms of Service and product-specific terms'. (2) The Retention example changes from 'we don't store source code proxied during collaboration sessions, or audio, video, and screen contents from calls' to 'we don't store audio, video, and screen contents from calls', dropping source code. (3) The AI Services Providers disclosure changes from 'including website performance monitoring and sales and marketing of our products and services. Zed does not utilize third-party services which use this information for AI training purposes' to 'including product functionality and performance monitoring. Zed Industries requires its third-party AI service providers to contractually commit not to use this information for AI training purposes'. (4) The International Visitors paragraph (hosted and processed in the U.S.; onward transfers allowed) is word-for-word unchanged. (5) The telemetry bullet drops 'You may opt out of local telemetry collection in the Software settings', and the 'Opting-out of Software Telemetry' item under Your Choices is removed; the local telemetry switch remains documented in the unchanged docs/telemetry page. No verdict field changed: the substantive training/zdr/retention evidence remains the unchanged docs/ai/privacy-and-security and docs/telemetry snapshots (e.g. 'Zed does not retain your prompts or code context by default'); role remains controller for the individual tier and processor for the Business tier; processing_region remains US. Because the privacy policy itself removed its summary-level statements about source-code retention and provider safety retention, the direction is recorded as weakened; the operative commitments live in the developer documentation, so no verdict is downgraded."
issue = "https://github.com/arcships/zdr-monitor/issues/1347"
