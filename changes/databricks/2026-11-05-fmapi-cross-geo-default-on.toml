summary_zh = "FM APIs compliance 页（Last updated Oct 28, 2026 → Nov 3, 2026）的 Data processing and residency 节补充跨 Geo 的默认状态与处理地范围。原文「If your workspace is in a Model Serving region but not a US or EU region, your workspace must be enabled for cross-Geo data processing.」后新增「It's on by default for these workspaces unless the compliance security profile is enabled.」，并新增一条「When cross-Geo data processing is on, requests can be processed outside your workspace Geo. If your workloads have data-location requirements, turn it off.」。此前该页只写「must be enabled」，未说明默认状态与关闭方式；新增内容与 databricks-geos 页既有的「Cross-Geo processing is enabled by default for all workspaces in Geos outside the US and EU that don't have a compliance security profile enabled」一致。对非 US/EU 工作区，默认开启意味着请求可能在用户未主动配置时出 Geo 处理，保障弱于「需显式开启」的字面含义；但该默认行为在 geos 页早已存在，本页新增的是说明与 opt-out，故记 clarified，而非政策方向翻转。api 与 api-partner-models 的 processing_region 结论字段未变（均为 codes=[\"selected\"]）：非 US/EU 工作区默认开启跨 Geo（合规安全档除外），开启后请求可能在工作区 Geo 之外处理，可关闭。存储地不变，本页仍未给出存储出 Geo 的承诺；designated-services 页的「your data is not stored outside of your workspace's Geo regardless of this setting」继续适用。"
summary_en = "The Data processing and residency section of the FM APIs compliance page (Last updated Oct 28, 2026 → Nov 3, 2026) now spells out the default state and processing-location scope of cross-Geo processing. After 'If your workspace is in a Model Serving region but not a US or EU region, your workspace must be enabled for cross-Geo data processing.' the page adds 'It's on by default for these workspaces unless the compliance security profile is enabled.' and a new bullet: 'When cross-Geo data processing is on, requests can be processed outside your workspace Geo. If your workloads have data-location requirements, turn it off.' Previously the page only said 'must be enabled' and did not state the default or how to turn it off. The addition matches the existing databricks-geos statement 'Cross-Geo processing is enabled by default for all workspaces in Geos outside the US and EU that don't have a compliance security profile enabled'. For non-US/EU workspaces, default-on means requests may be processed outside the Geo without the user taking any action, which is weaker than the literal reading of 'must be enabled'; that default already existed on the geos page, and this page adds the explanation and an opt-out, so it is recorded as clarified rather than a reversal. The processing_region verdict fields for api and api-partner-models are unchanged (both codes=[\"selected\"]): cross-Geo is on by default for non-US/EU workspaces except those with the compliance security profile, requests may be processed outside the workspace Geo when it is on, and it can be turned off. Storage location is unchanged; this page still makes no promise that storage stays in-Geo, and the designated-services page's 'your data is not stored outside of your workspace's Geo regardless of this setting' continues to apply."
issue = "https://github.com/arcships/zdr-monitor/issues/1049"
