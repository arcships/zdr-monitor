summary_zh = "FM APIs compliance 页（Last updated Nov 18, 2026 → Nov 19, 2026）删除整个 Regional model availability 表：原 US-only / EU+US / EU+US+APAC / EU+US+Japan, Singapore, and Australia 四档清单及页末重复汇总表全部移除，改为一句指向「Model availability by region」页的说明。被删内容不只是模型可用地清单：EU+US 档的「Some of these models are also available in Asia Pacific regions without cross-Geo data processing」、US-only 档 Sonnet 5 的跨 Geo 句、EU+US 档的跨 Geo 句，以及两个亚太档的「If your workspace is not in an EU, US, or listed Asia Pacific region but is in a supported Model Serving region, you can enable cross-Geo data processing to access this model/models」均已删除。原句「The following tables show where each model is available, not where requests are processed. See Data processing and residency.」改写为「Model availability shows where you can use a model, not where requests are processed. See Data processing and residency.」。Data processing and residency 节逐字未变，仍写明 Databricks 可能在数据来源 region 与云厂商之外处理数据、非 US/EU 工作区须启用跨 Geo 处理且默认开启（compliance security profile 除外）、开启后请求可能在工作区 Geo 之外处理；Data privacy and use 节亦未变。判断：本页删除了逐模型可用区域以及「无需跨 Geo」和分档跨 Geo 条件这些处理地相关披露，披露范围较上一版收窄；同一 provider 为新增该亚太档记的是 strengthened，故本次记 weakened。processing_region 结论字段不变（api-partner-models 仍为 codes=[\"selected\"]，主锚点 fmapi-compliance-outside-region 与三条跨 Geo 锚点保留），因为 Data processing and residency 的核心处理地表述未改。本轮未新增 Model availability by region 来源，无法用快照证明同样的区域/cross-Geo 表述在该页完整保留，因此不把这次删除记为 clarified。锚点处理：fmapi-compliance-availability-not-processing 改绑到新句「Model availability shows where you can use a model, not where requests are processed」；新增 fmapi-compliance-model-availability-pointer 指向「Model availability by region」；删除已无原文支撑的 5 个逐模型区域锚点（fmapi-compliance-apac-model-regions、fmapi-compliance-apac-no-cross-geo、fmapi-compliance-apac-cross-geo、fmapi-compliance-apac-jp-sg-au-model-regions、fmapi-compliance-apac-jp-sg-au-cross-geo）及对应 point。"
summary_en = "The FM APIs compliance page (Last updated Nov 18, 2026 → Nov 19, 2026) removes the entire Regional model availability table: the four tiers US-only / EU+US / EU+US+APAC / EU+US+Japan, Singapore, and Australia, plus the duplicated summary table at the end of the page, are gone, replaced by a pointer to the 'Model availability by region' page. The removed content was not only a model-availability list: the EU+US tier's 'Some of these models are also available in Asia Pacific regions without cross-Geo data processing', the US-only tier's Sonnet 5 cross-Geo sentence, the EU+US tier's cross-Geo sentence, and both Asia Pacific tiers' 'If your workspace is not in an EU, US, or listed Asia Pacific region but is in a supported Model Serving region, you can enable cross-Geo data processing to access this model/models' are all deleted. The sentence 'The following tables show where each model is available, not where requests are processed. See Data processing and residency.' is rewritten as 'Model availability shows where you can use a model, not where requests are processed. See Data processing and residency.' The Data processing and residency section is unchanged word for word and still states that Databricks might process data outside the originating region and cloud provider, that workspaces in a Model Serving region but not a US or EU region must enable cross-Geo processing (on by default unless the compliance security profile is enabled), and that when it is on requests can be processed outside the workspace Geo; the Data privacy and use section is also unchanged. Assessment: this page removed per-model availability plus the 'without cross-Geo data processing' and per-tier cross-Geo condition statements, all of which touch processing location, so its disclosure is narrower than the previous version. The same provider recorded the addition of the Asia Pacific tier as strengthened, so this removal is recorded as weakened. The processing_region verdict fields are unchanged (api-partner-models remains codes=[\"selected\"], with the primary anchor fmapi-compliance-outside-region and the three cross-Geo anchors retained), because the core processing-location statements in Data processing and residency are unchanged. The 'Model availability by region' page was not added as a source in this round, so there is no snapshot proving that the same region/cross-Geo statements remain complete there; the removal is therefore not recorded as clarified. Anchor handling: fmapi-compliance-availability-not-processing is rebound to the new sentence 'Model availability shows where you can use a model, not where requests are processed'; a new anchor fmapi-compliance-model-availability-pointer points to 'Model availability by region'; the five per-model region anchors with no remaining source text (fmapi-compliance-apac-model-regions, fmapi-compliance-apac-no-cross-geo, fmapi-compliance-apac-cross-geo, fmapi-compliance-apac-jp-sg-au-model-regions, fmapi-compliance-apac-jp-sg-au-cross-geo) and their points are removed."
issue = "https://github.com/arcships/zdr-monitor/issues/1376"
