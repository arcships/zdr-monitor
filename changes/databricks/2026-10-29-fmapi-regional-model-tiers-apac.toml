summary_zh = "FM APIs compliance 页（Last updated Sep 22, 2026 → Oct 28, 2026）更新区域模型清单：EU+US 清单新增 OpenAI GPT-6.1 Terra / GPT-6.1 Sol；Anthropic Claude Sonnet 4 从两处清单中删除；Anthropic Claude Opus 5 从 EU+US 档移入新增的「EU, US, and Asia Pacific models」档，该档标题句为「The following models are available in pay-per-token EU and US supported regions and in `ap-northeast-2`, `ap-south-1`, `ap-southeast-1`, and `ap-southeast-2`」，档内仅列 Anthropic Claude Opus 5。EU+US 档的跨 Geo 句新增后半句「Some of these models are also available in Asia Pacific regions without cross-Geo data processing. See Foundation models hosted on Databricks.」，其中「these models」指 EU+US 档清单，未点名 Opus 5。新增档位的 cross-Geo 句为「If your workspace is not in an EU, US, or listed Asia Pacific region but is in a supported Model Serving region, you can enable cross-Geo data processing to access this model.」。Data processing and residency 节的两条未变，仍在：「As part of providing the Foundation Model APIs, Databricks might process your data outside of the region and cloud provider where your data originated.」「If your workspace is in a Model Serving region but not a US or EU region, your workspace must be enabled for cross-Geo data processing.」。判断：api-partner-models 的 processing_region 结论仍是 codes=[\"selected\"]，主锚点 fmapi-compliance-outside-region 不变；但可用区域扩大——Claude Opus 5 在 EU/US 之外新增四个亚太区域，按该档 cross-Geo 句，工作区位于 EU/US 或这些亚太区域时无需跨 Geo 处理，承诺范围扩大，故记 strengthened。模型目录增删本身不改变任何结论字段。本轮同步更新该档档位说明与来源 note，并新增锚点 fmapi-compliance-apac-model-regions、fmapi-compliance-apac-no-cross-geo、fmapi-compliance-apac-cross-geo。"
summary_en = "The FM APIs compliance page (Last updated Sep 22, 2026 → Oct 28, 2026) refreshed its regional model lists: the EU+US list gained OpenAI GPT-6.1 Terra and GPT-6.1 Sol; Anthropic Claude Sonnet 4 was removed from both list instances; Anthropic Claude Opus 5 moved out of the EU+US tier into a new 'EU, US, and Asia Pacific models' tier, whose heading reads 'The following models are available in pay-per-token EU and US supported regions and in `ap-northeast-2`, `ap-south-1`, `ap-southeast-1`, and `ap-southeast-2`' and whose only entry is Anthropic Claude Opus 5. The EU+US tier's cross-Geo sentence gained a second sentence: 'Some of these models are also available in Asia Pacific regions without cross-Geo data processing. See Foundation models hosted on Databricks.' Here 'these models' refers to the EU+US tier list and does not name Opus 5. The new tier's cross-Geo sentence is 'If your workspace is not in an EU, US, or listed Asia Pacific region but is in a supported Model Serving region, you can enable cross-Geo data processing to access this model.' The two Data processing and residency bullets are unchanged and still present: 'As part of providing the Foundation Model APIs, Databricks might process your data outside of the region and cloud provider where your data originated.' and 'If your workspace is in a Model Serving region but not a US or EU region, your workspace must be enabled for cross-Geo data processing.' Assessment: processing_region for api-partner-models remains codes=[\"selected\"] with the primary anchor fmapi-compliance-outside-region unchanged; however, the available area expanded — Claude Opus 5 is now also available in four Asia Pacific regions beyond EU/US, and per that tier's cross-Geo sentence, workspaces in EU/US or those Asia Pacific regions do not need cross-Geo processing. The scope of the commitment therefore grew, so this is recorded as strengthened. Model catalog additions/removals by themselves do not change any verdict field. The tier description and source note were updated, and the anchors fmapi-compliance-apac-model-regions, fmapi-compliance-apac-no-cross-geo and fmapi-compliance-apac-cross-geo were added."
issue = "https://github.com/arcships/zdr-monitor/issues/936"
