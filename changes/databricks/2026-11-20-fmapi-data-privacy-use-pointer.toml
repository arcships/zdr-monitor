summary_zh = "FM APIs compliance 页（Last updated Nov 3, 2026 → Nov 18, 2026）在 Data processing and residency 之后新增「Data privacy and use」节：「For how Databricks protects, uses, and retains the inputs and outputs of Foundation Model API requests, including partner model provider retention, see Data protection in Model Serving.」该句只把 FM APIs 输入输出的保护、使用与保留（含伙伴 provider 保留）指向既有的 Model Serving Data protection 页，本页自身没有给出新的保留期限、删除时限或 ZDR 承诺；目标页已是本 provider 的 retention/zdr 来源（2026-09-11 版）。api 档 retention 仍为 days=30、object=input_output、basis=fixed_period，zdr 仍为 no；api-partner-models 档 retention 仍为 object=input_output、basis=undisclosed，zdr 仍为 no。按程序性澄清记 clarified，结论字段均不变；新增 point 与锚点 fmapi-compliance-data-privacy-use-pointer。同轮 EU+US 模型清单（正文表与页末汇总表各一处）新增 OpenAI GPT-6.2 Astra / GPT-6.2 Sol，属既有档位内的模型目录刷新，未新增区域档位或改变处理地承诺，两档 processing_region 仍为 codes=[\"selected\"]；该目录变化不单独记录，已在 providers/databricks.toml 的档位说明中同步。Data processing and residency 节与四个区域档位标题句逐字未变，原有 10 个 processing_region 锚点仍可唯一定位。"
summary_en = "The FM APIs compliance page (Last updated Nov 3, 2026 → Nov 18, 2026) adds a 'Data privacy and use' section after 'Data processing and residency': 'For how Databricks protects, uses, and retains the inputs and outputs of Foundation Model API requests, including partner model provider retention, see Data protection in Model Serving.' The sentence only points to the existing Model Serving Data protection page for how FM APIs inputs and outputs are protected, used and retained (including partner model provider retention). This page itself gives no new retention period, deletion deadline or ZDR commitment; the target page is already this provider's retention/zdr source (2026-09-11 version). The api product's retention remains days=30, object=input_output, basis=fixed_period and zdr remains no; api-partner-models retention remains object=input_output, basis=undisclosed and zdr remains no. It is recorded as a procedural clarification (clarified) with no verdict field changes; a point and the anchor fmapi-compliance-data-privacy-use-pointer were added. In the same round, the EU+US model lists (the body table and the summary table, one instance each) add OpenAI GPT-6.2 Astra and GPT-6.2 Sol. This is a model-catalog refresh inside an existing tier: no new regional tier and no change to any processing-location commitment, and processing_region remains codes=[\"selected\"] for both products. That catalog change is not recorded separately and is reflected in the tier description in providers/databricks.toml. The Data processing and residency section and the four regional tier heading sentences are unchanged word for word, and all 10 existing processing_region anchors still resolve uniquely."
issue = "https://github.com/arcships/zdr-monitor/issues/1361"
