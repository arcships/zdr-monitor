summary_zh = "Designated Services 页（Last updated Sep 24, 2026 → Nov 25, 2026）的存储地承诺收窄。important 段删去句首「Importantly,」，并在「Your data is not stored outside of your workspace's Geo regardless of this setting」之后新增唯一点名例外：「with one exception: Genie Search stores a copy of your connected sources' content and permissions in the Geo an account admin selects during setup, which can differ from the Geos of some of your workspaces. See Set up Genie Search.」原句读起来是无条件承诺，新版明确 Genie Search 的连接来源内容与权限副本可能落在工作区 Geo 之外，故存储地保障较上一版收窄，记 weakened。表格同步更新，均属处理地/可用性明细：Pay-per-token 与 Provisioned throughput Foundation Model APIs 的 Americas 列由「Available」改为「Available‖」，新增脚注 ‖「Foundation Model API requests for workspaces in the Americas Geo are processed within the United States. Unless you enable cross-Geo processing, these requests do not leave the US.」；新增 AI Runtime 行及脚注 ¶「For AI Runtime, some GPU types require cross-Geo processing. For AWS workspaces in Asia, Australia & New Zealand, Europe, and India, cross-Geo GPU workloads run in the Americas Geo.」；新增 Lakehouse Real-Time 行；「Genie Code Agent mode」更名为「Genie Code agentic capabilities」；新增 Genie Code CLI 行及脚注 **（Brazil、Canada、United Kingdom 需跨 Geo；关闭跨 Geo 时 Australia and New Zealand 模型更少、上下文窗口更小），国别表也新增 Genie Code CLI「Requires cross-Geo processing」。结论字段不变：api、api-partner-models、ai-assistive-features 的 processing_region 仍为 codes=[\"selected\"]，其余四个维度的结论字段未变；AI Runtime、Lakehouse Real-Time、Genie Code CLI 不改变既有档位的结论，也未新增档位。锚点处理：ds-not-stored-outside-geo 因句首改动由原句改绑到去掉「Importantly,」后的现行句；新增 ds-genie-search-storage-exception 绑定例外句；api 与 ai-assistive-features 两个档位的处理地说明补上该例外，来源 note 同步。该例外与 trust 页所列 AI assistive features 的对应关系在两份快照中均无原文说明，故不推断「其余功能不受影响」，也未据此新增 retention 结论。"
summary_en = "The Designated Services page (Last updated Sep 24, 2026 → Nov 25, 2026) narrows its storage-location commitment. The important paragraph drops the leading 'Importantly,' and appends a single named exception to 'Your data is not stored outside of your workspace's Geo regardless of this setting': 'with one exception: Genie Search stores a copy of your connected sources' content and permissions in the Geo an account admin selects during setup, which can differ from the Geos of some of your workspaces. See Set up Genie Search.' The previous sentence read as an unconditional promise; the new version makes clear that Genie Search's copies of connected-source content and permissions can land outside the workspace Geo, so the storage-location safeguard is narrower than the previous version and is recorded as weakened. The tables were updated as well, all processing-location/availability detail: the Americas column for Pay-per-token and Provisioned throughput Foundation Model APIs changes from 'Available' to 'Available‖', with a new footnote ‖: 'Foundation Model API requests for workspaces in the Americas Geo are processed within the United States. Unless you enable cross-Geo processing, these requests do not leave the US.'; an AI Runtime row and footnote ¶ are added ('For AI Runtime, some GPU types require cross-Geo processing. For AWS workspaces in Asia, Australia & New Zealand, Europe, and India, cross-Geo GPU workloads run in the Americas Geo.'); a Lakehouse Real-Time row is added; 'Genie Code Agent mode' is renamed 'Genie Code agentic capabilities'; and a Genie Code CLI row with footnote ** is added (Brazil, Canada and the United Kingdom require cross-Geo processing; with cross-Geo disabled, workspaces in Australia and New Zealand have fewer models and a smaller context window), plus a Genie Code CLI 'Requires cross-Geo processing' entry in the country table. No conclusion fields change: processing_region remains codes=[\"selected\"] for api, api-partner-models and ai-assistive-features, and the other four dimensions' conclusion fields are unchanged. AI Runtime, Lakehouse Real-Time and Genie Code CLI do not alter any existing product's verdict and no product was added. Anchor handling: ds-not-stored-outside-geo is rebound from the old sentence to the current one without 'Importantly,'; a new anchor ds-genie-search-storage-exception binds the exception sentence; the processing-location notes for api and ai-assistive-features now state the exception, and the source note is updated accordingly. Neither snapshot documents how Genie Search relates to the AI assistive features named on the trust page, so the record does not infer that other features are unaffected and does not add a retention conclusion on that basis."
issue = "https://github.com/arcships/zdr-monitor/issues/1458"
