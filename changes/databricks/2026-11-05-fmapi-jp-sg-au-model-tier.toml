summary_zh = "FM APIs compliance 页（Last updated Oct 28, 2026 → Nov 3, 2026）的区域模型清单更新：EU+US 清单新增 Anthropic Claude Sonnet 5.5；新增「EU, US, Japan, Singapore, and Australia models」档，列 Anthropic Claude Opus 5.5 与 Claude Haiku 5.5，标题句为「The following models are available in pay-per-token EU and US supported regions and in `ap-northeast-1`, `ap-southeast-1`, and `ap-southeast-2`」，即东京、新加坡、悉尼三个亚太区域，不含 Opus 5 档所列的 ap-northeast-2 与 ap-south-1；该档 cross-Geo 句为「If your workspace is not in an EU, US, or listed Asia Pacific region but is in a supported Model Serving region, you can enable cross-Geo data processing to access these models.」。页面同时新增「The following tables show where each model is available, not where requests are processed. See Data processing and residency.」，明确区域表只表示模型可用地、不表示请求处理地。判断：可用区域扩大，api-partner-models 的 processing_region 结论仍为 codes=[\"selected\"]，主锚点 fmapi-compliance-outside-region 不变；新增锚点 fmapi-compliance-apac-jp-sg-au-model-regions、fmapi-compliance-apac-jp-sg-au-cross-geo 与 fmapi-compliance-availability-not-processing，并补充说明区域表不能直接当作处理地承诺。页末汇总表把 Opus 5.5 / Haiku 5.5 放在「EU, US, and Asia Pacific models」下，与正文的 Japan/Singapore/Australia 分档不一致；本记录按正文分档描述。"
summary_en = "The regional model lists on the FM APIs compliance page (Last updated Oct 28, 2026 → Nov 3, 2026) changed: the EU+US list gained Anthropic Claude Sonnet 5.5, and a new 'EU, US, Japan, Singapore, and Australia models' tier lists Anthropic Claude Opus 5.5 and Claude Haiku 5.5. Its heading sentence is 'The following models are available in pay-per-token EU and US supported regions and in `ap-northeast-1`, `ap-southeast-1`, and `ap-southeast-2`' (Tokyo, Singapore, Sydney), which does not include the ap-northeast-2 and ap-south-1 regions listed in the Opus 5 tier. The tier's cross-Geo sentence is 'If your workspace is not in an EU, US, or listed Asia Pacific region but is in a supported Model Serving region, you can enable cross-Geo data processing to access these models.' The page also adds 'The following tables show where each model is available, not where requests are processed. See Data processing and residency.', making clear that the tables describe availability, not processing location. Assessment: the available area expanded; the processing_region verdict for api-partner-models remains codes=[\"selected\"] and the primary anchor fmapi-compliance-outside-region is unchanged. New anchors fmapi-compliance-apac-jp-sg-au-model-regions, fmapi-compliance-apac-jp-sg-au-cross-geo and fmapi-compliance-availability-not-processing were added, with a note that model availability cannot be treated directly as a processing-location commitment. The summary table at the end of the page places Opus 5.5 / Haiku 5.5 under 'EU, US, and Asia Pacific models', inconsistent with the body's Japan/Singapore/Australia tier; this record follows the body."
issue = "https://github.com/arcships/zdr-monitor/issues/1049"
