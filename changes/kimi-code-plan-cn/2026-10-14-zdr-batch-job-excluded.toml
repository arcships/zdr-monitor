summary_zh = "platform.kimi.com/docs/guide/zero-data-retention 的 FAQ「ZDR 适用所有数据类型吗？」由一整段改写为五项列表，并新增一条排除：旧文「通过直接文件上传方式提交的图像或视频，使用 Kimi Hosted Agents 托管智能体的数据，零数据留存无法保证。安全日志、账单记录等运营数据不属于零留存范围；第三方模型、连接器、插件等不受本协议约束。」现为「不是。以下服务和数据类型需要特别注意：1. Batch Job 服务：通过 Batch API 提交的批处理任务不支持 ZDR。2. 直接上传的图像或视频：通过文件上传接口直接提交的图像或视频，无法保证零数据留存。3. Kimi Hosted Agents 托管智能体：使用 Kimi Hosted Agents 托管智能体处理的数据，无法保证零数据留存。4. 运营数据：安全日志、账单记录等运营数据，不属于零数据留存范围。5. 第三方服务：第三方模型、连接器、插件等第三方服务处理的数据，不受本 ZDR 政策约束。」新增的 Batch Job 一项使 ZDR 的排除范围扩大，原有四项语义未变。该页属 platform.kimi.com 开放平台企业档（另一条台账记录），在 kimi-code-plan-cn 中仅作本档 zdr 的边界佐证；本档 zdr 结论字段未变（mark=no、mode=not_disclosed），所引「零数据保留（Zero Data Retention，ZDR）是 Kimi 开放平台为企业客户提供的数据保护模式。」一句未改动。"
summary_en = "The FAQ 'ZDR 适用所有数据类型吗？' on platform.kimi.com/docs/guide/zero-data-retention was rewritten from one paragraph into a five-item list and gained a new exclusion. The old text read '通过直接文件上传方式提交的图像或视频，使用 Kimi Hosted Agents 托管智能体的数据，零数据留存无法保证。安全日志、账单记录等运营数据不属于零留存范围；第三方模型、连接器、插件等不受本协议约束。' It now reads '不是。以下服务和数据类型需要特别注意：1. Batch Job 服务：通过 Batch API 提交的批处理任务不支持 ZDR。2. 直接上传的图像或视频：通过文件上传接口直接提交的图像或视频，无法保证零数据留存。3. Kimi Hosted Agents 托管智能体：使用 Kimi Hosted Agents 托管智能体处理的数据，无法保证零数据留存。4. 运营数据：安全日志、账单记录等运营数据，不属于零数据留存范围。5. 第三方服务：第三方模型、连接器、插件等第三方服务处理的数据，不受本 ZDR 政策约束。' The added Batch Job item expands the set of data excluded from ZDR; the four existing items are unchanged in meaning. The page belongs to the platform.kimi.com Open Platform enterprise tier (a separate ledger entry) and serves only as boundary evidence for this provider's zdr verdict. The verdict fields for this tier are unchanged (mark=no, mode=not_disclosed), and the quoted sentence '零数据保留（Zero Data Retention，ZDR）是 Kimi 开放平台为企业客户提供的数据保护模式。' was not modified."
