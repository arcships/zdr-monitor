summary_zh = "《Kimi 用户服务协议》v2 §二.3 新增『账号注销的申请条件、冷静期、数据处理及付费权益处理等具体规则以《Kimi 账号注销协议》为准，该协议为本协议的有效组成部分』，并将注销不可逆及不可恢复的表述改为『账号注销一旦完成将无法撤销，账号内的信息、数据及付费权益将无法恢复，请您审慎注销』；同条末句『您注销后，我们仍需按照网络安全法等法律法规的要求，保留您相应的注册数据及行为记录等日志信息』未变。新增协议未作为本档来源，其数据处理与保留规则未经核实，故不据此推断任何期限；retention 结论字段不变（object=input_output、basis=undisclosed）。"
summary_en = "Kimi Terms of Service v2 §II.3 adds that the specific rules for account-cancellation application conditions, cooling-off period, data handling and paid-benefit handling are set out in the Kimi Account Cancellation Agreement, which forms an integral part of the Terms. It also revises the irreversibility wording, while the post-cancellation log-retention sentence remains unchanged. The referenced agreement is not a source for this tier, so its data-handling and retention rules are unverified and no period is inferred; the retention verdict remains unchanged (object=input_output, basis=undisclosed)."
issue = "https://github.com/arcships/zdr-monitor/issues/1089"
