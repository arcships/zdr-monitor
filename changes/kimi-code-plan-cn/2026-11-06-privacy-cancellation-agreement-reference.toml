summary_zh = "《Kimi 隐私政策》v2 §7.4 在注销说明中新增一句：『账号注销的申请条件、冷静期及确认规则请见《Kimi 账号注销协议》。』旧文没有这句；同节其余内容未变，包括『一旦注销，我们将停止为您提供服务并将按照法律法规的要求处理您的个人信息。如果删除、匿名化处理个人信息从技术上难以实现，我们会停止除存储和采取必要的安全保护措施之外的处理。』《Kimi 账号注销协议》尚未作为本档来源，其数据处理与保留规则未经核实；新增句只指向注销申请条件、冷静期与确认规则，没有给出新的保留期限或删除承诺，故 retention 结论字段不变（object=input_output、basis=undisclosed），本条按程序性澄清记录。"
summary_en = "§7.4 of Kimi Privacy Policy v2 adds '账号注销的申请条件、冷静期及确认规则请见《Kimi 账号注销协议》。' The old text did not contain this sentence and the deletion exception remains unchanged. The Kimi Account Cancellation Agreement is not a source for this tier, so its data-handling and retention rules are unverified; the new sentence gives no retention period or deletion commitment. The retention verdict remains unchanged (object=input_output, basis=undisclosed), and the change is recorded as a procedural clarification."
