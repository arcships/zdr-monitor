summary_zh = "《Kimi 隐私政策》v2 在 §2.4 新增『运营统计与广告分析』两条：运营分析『将优先使用经去标识化或匿名化处理的信息』；广告投放与效果衡量『可能与广告发布平台、广告代理商及统计分析服务提供商等合作伙伴合作，向其提供经去标识化处理的信息』，并指向《第三方信息共享清单》及本政策第4.2条。同版 §4.2 未改动，仍写『向其提供经匿名化处理的个人信息』，并保留『我们不会向广告合作伙伴提供您的对话内容、输入输出的文件等可以反映您具体使用情况的信息』。去标识化与匿名化并非同一口径：去标识化信息在可借助额外信息重新识别时仍属个人信息，匿名化则不可复原；新 §2.4 的共享表述因此比 §4.2 的『匿名化』更宽，两处口径存在内部不一致。按保守口径把这次共享表述记为承诺减弱，role 结论字段不变，因为 §4.1/§4.2 的委托/共享结构未变，且对话内容与输入输出文件仍被排除在广告链路之外。"
summary_en = "Kimi Privacy Policy v2 adds an '运营统计与广告分析' block in §2.4. Operational analysis will preferentially use de-identified or anonymised information, while advertising delivery and measurement partners may receive de-identified information. Unchanged §4.2 still says advertising partners receive anonymised personal information and excludes conversation content and input/output files. Because de-identification and anonymisation are not the same standard, the new sharing wording is broader; this is recorded as weakened on a conservative reading, while the role verdict fields remain unchanged because the entrustment/sharing structure is unchanged and the excluded content remains outside the advertising channel."
issue = "https://github.com/arcships/zdr-monitor/issues/1089"
