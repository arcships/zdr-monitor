summary_zh = "《Kimi 隐私政策》v2 的 training 退出句仅将旧文『本协议第11节』改为『本政策第11节』：『如您不希望您的内容被用于模型训练，您可以通过本政策第11节所载的联系方式联系我们的客服并提出要求；我们将在验证您的身份后，停止将您的内容用于模型训练。』该句指向同一份隐私政策的第11节；同节模型优化授权句未变，因此 training 结论字段不变（mark=no、mode=opt_out）。"
summary_en = "Kimi Privacy Policy v2 changes the training opt-out cross-reference from '本协议第11节' to '本政策第11节'. It still says users can contact customer service through §11 and, after identity verification, stop using their content for model training. The sentence points to §11 of the same policy; the model-optimisation licence is unchanged, so the training verdict remains unchanged (mark=no, mode=opt_out)."
issue = "https://github.com/arcships/zdr-monitor/issues/1089"
