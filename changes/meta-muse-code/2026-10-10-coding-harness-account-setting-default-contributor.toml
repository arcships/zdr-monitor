summary_zh = "《Meta Model API Terms of Service》Last updated 由 October 2, 2026 改为 October 9, 2026，并实质改了订阅档（Muse Code Coding Harness Subscription）的档位判定。旧文 §13.4 写『The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.』——档位随所选模型走；新文改为『When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.』。§1 相应加了一句『If you access the Services through a Coding Harness Subscription, the designation of the Services as Contributor Services or Standard Services is instead determined by your Account setting, as described in Section 3.3.』；新增的 §3.3 明写订阅『you are considered to be using the Contributor Services by default regardless of which Meta Model you select, and Section 6 applies to that access and use』，要停止训练须自行把 Account setting 切到 Standard Services（只向将来生效）。同版全篇把折扣档『Discounted Models / Discounted Services』更名为『Contributor Models / Contributor Services』；§5.1 的不训练句由『will not use Content from Standard Services to train Meta Models』改写为『will not use Content submitted in a request to the Standard Services to train Meta Models』。§6.1 在保留依据之后新增一句『Content previously submitted to the Standard Services becomes Content submitted to the Contributor Services if it is included in any request to the Contributor Services, whether directly or as context or background for your prompts or instructions.』——此前提交给 Standard Services 的 Content 一旦随请求进入 Contributor Services 即按 §6 处理，既把 §5.1 的不训练承诺再削一层，也把 §6.1 保留依据的覆盖范围扩到更早的 Standard 内容。影响两个维度的结论值：coding-plan-personal（Muse Code 个人订阅）的 training 由【不会训练】(mark=yes, mode=by_tier) 翻转为【会训练、可退出】(mark=no, mode=opt_out)——默认即 Contributor Services，§6.1 授权训练，只有改 Account setting 才能退出。role 由【受托处理】(kind=processor) 改为【独立控制者】(kind=controller)：旧结论把 §5.1 的 Service Provider/Processor 表述当作整档定性，但新 §5 引言已写明 §5 适用于 Standard Services、包含『changed your Account setting … as described in Section 3.3』的情形，§6（§6.1/§6.2）全篇没有任何 Service Provider / Processor 表述，而 §6.1 让 Meta 为自身模型开发处理 Content，默认档的处理目的由 Meta 自己决定，与仓库对 volcengine-coding-plan 个人版的读法一致。retention 的 object/basis 字段未变（input_output / as_needed），但 §6.1 的保留依据现在默认适用于订阅档、并新增上述跨档归入句，故 retention 也计入本次变化。zdr 与 processing_region 未变。两条 ToS 锚点因改写失效并改绑：training-standard-5-1、coding-harness-model-determines-use-13-4（后者因语义变化重命名为 coding-harness-account-setting-determines-use-13-4，并新增 §3.3 的两个训练锚点、一个 §6.1 跨档锚点 retention-6-1-standard-to-contributor 与一个 role 锚点 role-controller-6-1；retention-6-1-discounted-retain 因档名更名为 retention-6-1-contributor-retain，training-discounted-6-1 更名为 training-contributor-6-1）。"
summary_en = "Meta Model API Terms of Service moved Last updated from October 2, 2026 to October 9, 2026 and materially changed how the Coding Harness Subscription (Muse Code) tier is determined. Old §13.4 read 'The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.' — the tier followed the model selected; the new §13.4 reads 'When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.' §1 gained 'If you access the Services through a Coding Harness Subscription, the designation of the Services as Contributor Services or Standard Services is instead determined by your Account setting, as described in Section 3.3.', and the new §3.3 states a subscription is 'considered to be using the Contributor Services by default regardless of which Meta Model you select, and Section 6 applies to that access and use', so stopping training requires changing the Account setting to Standard Services (prospective only). The same revision renamed the discounted tier from Discounted Models/Services to Contributor Models/Services, and rewrote §5.1's no-training sentence from 'will not use Content from Standard Services to train Meta Models' to 'will not use Content submitted in a request to the Standard Services to train Meta Models'. §6.1 added, after its retention grounds, 'Content previously submitted to the Standard Services becomes Content submitted to the Contributor Services if it is included in any request to the Contributor Services, whether directly or as context or background for your prompts or instructions.' — Content previously submitted to the Standard Services is treated under Section 6 once it is carried into a Contributor Services request, which both narrows §5.1's no-training promise further and extends the §6.1 retention grounds to earlier Standard Content. Two verdict fields changed on coding-plan-personal (Muse Code individual subscription): training flips from 'will not train' (mark=yes, mode=by_tier) to 'trains, opt-out available' (mark=no, mode=opt_out) — the default is Contributor Services, §6.1 authorizes training, and only an Account-setting change opts out; and role moves from processor to controller — the old reading treated §5.1's Service Provider/Processor wording as governing the whole tier, but the new §5 heading scopes §5 to Standard Services (including the case of a changed Account setting under §3.3), §6 (§6.1/§6.2) contains no Service Provider or Processor wording, and §6.1 has Meta process Content for its own model development, so on the default tier Meta sets the processing purpose itself, matching the repo's reading of the volcengine-coding-plan individual tier. retention's object/basis fields are unchanged (input_output / as_needed), but §6.1's retention grounds now apply by default to the subscription tier and gained the cross-tier clause above, so retention is counted in this change too. zdr and processing_region are unchanged. Two ToS anchors broke on the rewording and were rebound: training-standard-5-1 and coding-harness-model-determines-use-13-4 (renamed to coding-harness-account-setting-determines-use-13-4, with two new §3.3 training anchors, a §6.1 cross-tier anchor retention-6-1-standard-to-contributor and a role anchor role-controller-6-1 added; retention-6-1-discounted-retain was renamed to retention-6-1-contributor-retain and training-discounted-6-1 to training-contributor-6-1 for the tier rename)."
issue = "https://github.com/arcships/zdr-monitor/issues/584"
