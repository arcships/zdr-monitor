summary_zh = "ZDR 帮助页《Does Model API support Zero Data Retention (ZDR)?》在 2026-11-27 抓取版本中改写并扩充。旧文把 ZDR 限定为面向『qualified Meta Model API accounts』、『enabled at the organization level』且『requires separate enablement by Meta』，并注明『ZDR support may vary by model』；新文改为面向『qualified Meta Model API teams』、『Meta enables it for a team after reviewing the request』，并新增支持 ZDR 的模型清单（Muse Spark 1.3/1.2/1.1、Muse Wonder、Muse Ember、Muse Image），明确『ZDR doesn't cover the Contributor-mode variants of these models』。旧文『Requests made with a personal account, or with a key from a different organization, aren't covered』改为『different team』，覆盖边界仍在。新增 Muse Code 专段：『If you use Muse Code, ZDR applies to the model requests it sends with an API key from your ZDR team.』同段提示 Muse Code 会优先读 META_API_KEY，可改用 ZDR team 的 key，且 web search、telemetry、feedback reports 会另行向 Meta 发送数据。功能清单也有变：Web search 从『Which features aren't available with ZDR?』移入『What can I use with ZDR?』并写明『Search queries and results are processed in real time and aren't stored』；新增 Contributor mode（含 Muse Code 的 Contributor mode setting）在 ZDR 下不可用；第三方集成由『Data processed by third-party tools or external integrations isn't covered by ZDR』改写为『Calling function tools or remote MCP servers doesn't turn off ZDR, but ZDR covers only Meta's handling of your content』。对 coding-plan-personal（Muse Code 个人订阅）的判定：zdr 维持 unknown——页面只覆盖『ZDR-enabled team 的 API key』，且要求销售确认『your team's eligibility』，但没有说明个人订阅者能否获得或加入这样的 team；同页又把 Muse Code 的 Contributor mode setting 列为 ZDR 不可用，而本订阅默认 Contributor Services（§3.3），页面未定义两者关系，故不推断默认配置可开 ZDR。这些都是证据缺口，不是厂商声明本档不能用 ZDR。retention 的 object/basis 不变（input_output / as_needed），新增两条依据：ZDR 下 web search 查询与结果实时处理、不留存；Muse Code 经 web search/telemetry/feedback 另发的数据不在 model-request 的 ZDR 路径内，页面未给 telemetry/feedback 期限。AUP 违规输入输出最长 2 年的上限未变。"
summary_en = "The ZDR help page 'Does Model API support Zero Data Retention (ZDR)?' was rewritten and expanded in the 2026-11-27 snapshot. The old text scoped ZDR to 'qualified Meta Model API accounts', said it was 'enabled at the organization level' and 'requires separate enablement by Meta', and added 'ZDR support may vary by model'. The new text scopes it to 'qualified Meta Model API teams', says 'Meta enables it for a team after reviewing the request', adds a list of ZDR-supported models (Muse Spark 1.3/1.2/1.1, Muse Wonder, Muse Ember, Muse Image), and states 'ZDR doesn't cover the Contributor-mode variants of these models.' The old exclusion 'Requests made with a personal account, or with a key from a different organization, aren't covered' now says 'different team'; the boundary remains. A new Muse Code paragraph says 'If you use Muse Code, ZDR applies to the model requests it sends with an API key from your ZDR team.' It notes that Muse Code uses META_API_KEY ahead of a stored key or browser sign-in, tells users to set META_API_KEY to their ZDR team's key, and adds that web search, telemetry and feedback reports send data to Meta separately. The feature list changed too: Web search moved from 'Which features aren't available with ZDR?' into 'What can I use with ZDR?' with 'Search queries and results are processed in real time and aren't stored'; Contributor mode (including the Contributor mode setting in Muse Code) was added to the ZDR-unavailable list; and the third-party bullet changed from 'Data processed by third-party tools or external integrations isn't covered by ZDR' to 'Calling function tools or remote MCP servers doesn't turn off ZDR, but ZDR covers only Meta's handling of your content.' For coding-plan-personal (the Muse Code individual subscription) the zdr verdict stays unknown: the page covers only requests made with a ZDR-enabled team's API key and asks sales to confirm 'your team's eligibility', but it does not state whether an individual subscriber can obtain or join such a team; the same page also lists the Muse Code Contributor mode setting as unavailable with ZDR, while this subscription defaults to Contributor Services (§3.3), and the page does not define the relationship, so no ZDR coverage is inferred for the default configuration. Those are evidence gaps, not a vendor statement that the tier cannot use ZDR. retention's object/basis are unchanged (input_output / as_needed), with two grounds added: under ZDR, web search queries and results are processed in real time and not stored; and data Muse Code sends separately via web search, telemetry and feedback reports sits outside the model-request ZDR path, with no period given for telemetry or feedback reports. The AUP-violation upper bound of 2 years is unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/1466"
