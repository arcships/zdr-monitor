summary_zh = "《Does Model API support Zero Data Retention (ZDR)?》帮助页改版。① 适用对象由『qualified Meta Model API accounts』改为『teams』，启用方式由『It's enabled at the organization level and requires separate enablement by Meta.』改为『Meta enables it for a team after reviewing the request.』。② 删除『ZDR support may vary by model.』，改为新增『Which models support ZDR?』一节：列出 Muse Spark 1.3/1.2/1.1、Muse Wonder、Muse Ember、Muse Image，并写明『ZDR doesn't cover the Contributor-mode variants of these models.』。③ ZDR 下不可用的功能清单调整：有状态请求改为『Stateful requests that store a response or reference one server-side, such as `store: true`, `previous_response_id` and stored reasoning items』；文件上传改为『File uploads, including multipart image uploads』；新增『Contributor mode, including Contributor-mode variants on Meta Model API and the Contributor mode setting in Muse Code』；删除原有的『Web search』一项，并在新增的『What can I use with ZDR?』一节写明搜索查询与结果『are processed in real time and aren't stored』。④ 第三方条款改写：旧句『Data processed by third-party tools or external integrations isn't covered by ZDR.』改为『Calling function tools or remote MCP servers doesn't turn off ZDR, but ZDR covers only Meta's handling of your content. Data sent to a third-party service follows that service's own terms and data handling practices.』。⑤ 新增 Muse Code 段：ZDR 覆盖其用 ZDR team 的 API key 发出的模型请求，META_API_KEY 优先于已存 key 或浏览器登录；Muse Code 还会通过 web search、telemetry、feedback 另行向 Meta 发送数据。判断：api-standard 的 zdr 仍为 yes(by_agreement)，只是支持模型与可用功能边界写得更明确；api-contributor 的 zdr 由 unknown 改为 no——页面现在明文排除 Contributor-mode variants，并把 Contributor mode 列为启用 ZDR 时不可用的功能，这是厂商新增的明确表述，不是从条款相斥推断出来的。training / retention / processing_region / role 的结论字段未变（AUP 违规输入输出最长 2 年的例外期限未改）。处理：新增锚点 llama-zdr-supported-models 与 llama-zdr-contributor-mode-not-covered，改写两条 zdr 依据、刷新仍成立但上下文已变的锚点前后缀（accounts→teams、organization→team，以及 features-disabled 前的章节位置）。"
summary_en = "The ZDR help page (Does Model API support Zero Data Retention (ZDR)?) was republished. (1) The audience changed from 'qualified Meta Model API accounts' to 'teams', and the enablement sentence changed from 'It's enabled at the organization level and requires separate enablement by Meta.' to 'Meta enables it for a team after reviewing the request.' (2) 'ZDR support may vary by model.' was deleted and replaced by a new section, 'Which models support ZDR?', which lists Muse Spark 1.3/1.2/1.1, Muse Wonder, Muse Ember and Muse Image and states 'ZDR doesn't cover the Contributor-mode variants of these models.' (3) The list of features unavailable with ZDR changed: the stateful-request bullet became 'Stateful requests that store a response or reference one server-side, such as `store: true`, `previous_response_id` and stored reasoning items'; file uploads became 'File uploads, including multipart image uploads'; a new bullet 'Contributor mode, including Contributor-mode variants on Meta Model API and the Contributor mode setting in Muse Code' was added; and the old 'Web search' bullet was removed, with the new 'What can I use with ZDR?' section saying search queries and results 'are processed in real time and aren't stored'. (4) The third-party sentence was reworded from 'Data processed by third-party tools or external integrations isn't covered by ZDR.' to 'Calling function tools or remote MCP servers doesn't turn off ZDR, but ZDR covers only Meta's handling of your content. Data sent to a third-party service follows that service's own terms and data handling practices.' (5) A Muse Code paragraph was added: ZDR applies to the model requests Muse Code sends with an API key from your ZDR team, META_API_KEY takes precedence over a stored key or a browser sign-in, and Muse Code can also send data to Meta separately through web search, telemetry and feedback reports. Assessment: api-standard zdr remains yes (by_agreement), with clearer model coverage and feature boundaries; api-contributor zdr changes from unknown to no, because the page now explicitly excludes Contributor-mode variants and lists Contributor mode among the features unavailable with ZDR -- a new express statement by the vendor, not an inference from incompatible clauses. No verdict field changed for training, retention, processing_region or role (the AUP-violation inputs-and-outputs exception remains 'up to 2 years'). Actions: two anchors were added (llama-zdr-supported-models, llama-zdr-contributor-mode-not-covered), two zdr evidence points were rewritten, and four anchors that still match were refreshed where their context changed (accounts to teams, organization to team, and the section heading before the features-disabled quote)."
