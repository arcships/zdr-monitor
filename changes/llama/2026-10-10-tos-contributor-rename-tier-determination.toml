summary_zh = "《Meta Model API Terms of Service》2026-10-09 版(Last updated 由 October 2 改为 October 9, 2026；页首 limited preview period 一句删除)整体改版，核心是把档名 Discounted Models/Services 全局改称 Contributor Models/Services，并改写了档位判定与相关训练条款：① §1 由『determined solely by the designation of the Model you select, regardless of any other Meta Model it invokes』改为『determined by the designation of the Model you are using, regardless of any other Meta Model invoked』，并新增两点——经 Coding Harness Subscription 访问时档位改由账户设置决定(§3.3)，且『the system may route you to a Contributor Model』，用户须自行确认所用档位；② 新增 §3.3，订阅默认按 Contributor Services 处理，改用 Standard 需改账户设置且不追溯既往 Content；③ §5.1 不训练承诺由『will not use Content from Standard Services to train Meta Models』改写为『will not use Content submitted in a request to the Standard Services to train Meta Models』；④ §6.1 新增『Content previously submitted to the Standard Services becomes Content submitted to the Contributor Services if it is included in any request to the Contributor Services, whether directly or as context or background for your prompts or instructions.』；⑤ §13.4 删去『does not provide any discount, fee reduction, or increased per-period allowance based on the Models you select, including Discounted Models』与『The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.』，改为『When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.』。此外 §15.4 存续清单(仅加一个逗号)与 Exhibit A/B/C 标题(标点、换行)只有排版改动，Exhibit C §10 档名同步改名。判断：两个档位的训练承诺方向未变——api-standard 仍 training=yes(Standard Services 不用于训练)、api-contributor 仍 training=no(Contributor Services 会用于训练)，retention / zdr / processing_region / role 的结论字段一律未变；§1 的系统路由提示与 §6.1 的跨档内容转化只在边缘收紧了对用户的保证，未撤销任何承诺，故方向记为 clarified。处理：改绑三条 missing 引文(llama-tos-5-1-no-train-standard、llama-tos-1-tier-by-model、llama-tos-6-2-no-confidential-to-discounted)，刷新几条仍成立但上下文已变的锚点前缀/后缀，并为 §6.1 新增的跨档转化句新增锚点 llama-tos-6-1-standard-becomes-contributor 及对应依据。"
summary_en = "The Meta Model API Terms of Service was republished on 2026-10-09 (Last updated moved from October 2 to October 9, 2026; the lead sentence about a limited preview period was removed). The core change is a global rename of the tier from Discounted Models/Services to Contributor Models/Services, together with rewrites of the tier-determination rule and the related training clauses: (1) Section 1 changed from 'determined solely by the designation of the Model you select, regardless of any other Meta Model it invokes' to 'determined by the designation of the Model you are using, regardless of any other Meta Model invoked', and adds two qualifications -- a Coding Harness Subscription is instead governed by your Account setting (Section 3.3), and 'the system may route you to a Contributor Model', so you must ensure you use the tier you intend; (2) a new Section 3.3 says a Coding Harness Subscription is Contributor Services by default, and switching to Standard requires an Account setting change that is not retroactive; (3) Section 5.1's no-training commitment changed from 'will not use Content from Standard Services to train Meta Models' to 'will not use Content submitted in a request to the Standard Services to train Meta Models'; (4) Section 6.1 gained a new sentence: 'Content previously submitted to the Standard Services becomes Content submitted to the Contributor Services if it is included in any request to the Contributor Services, whether directly or as context or background for your prompts or instructions.'; (5) Section 13.4 dropped 'does not provide any discount, fee reduction, or increased per-period allowance based on the Models you select, including Discounted Models' and 'The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.', and now reads 'When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.' In addition, the Section 15.4 survival list gained one comma and the Exhibit A/B/C headings changed only in punctuation and line breaks, and Exhibit C Section 10 followed the rename. Assessment: the direction of the training commitment is unchanged on both tiers -- api-standard stays training=yes (Standard Services Content is not used for training) and api-contributor stays training=no (Contributor Services Content is used for training) -- and no verdict field changed for retention, zdr, processing_region or role. The new Section 1 routing caveat and the Section 6.1 cross-tier conversion only tighten the user's guarantee at the edges and withdraw no commitment, so the direction is recorded as clarified. Actions: the three missing quotes were rebound (llama-tos-5-1-no-train-standard, llama-tos-1-tier-by-model, llama-tos-6-2-no-confidential-to-discounted), a few anchors whose prefix/suffix context had changed were refreshed, and a new anchor llama-tos-6-1-standard-becomes-contributor (with a supporting point) was added for the new Section 6.1 sentence."
