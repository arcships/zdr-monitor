summary_zh = "Abuse detection 页本轮改写两处与五维相关的正文。①Claude Fable 段的 EFS 条目旧句「If you're eligible for Enterprise Frontier Safeguards (EFS), you can use Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2 with zero data retention (ZDR) for internal use through at least June 30, 2027. After ZDR ends, all traffic will be retained for up to 30 days for automated offline abuse detection. The EFS program plans to enable customer-managed encryption and storage for automated offline abuse detection.」改为指向 EFS/EDC 计划页的一句「If your account is enrolled in Anthropic Enterprise Frontier Safeguards (EFS) or Anthropic Enterprise Data Controls (EDC), see the public preview of Enterprise Frontier Safeguards (EFS) and Enterprise Data Controls (EDC) for Anthropic models.」：ZDR 期限、客户自管加密与存储不再在本页展开，改由 EFS/EDC 计划页承载；30 天保留仍由本页 Claude Fable 条目「all traffic ... up to 30 days」与合同 §50.12.2 承载，结论仍是 ZDR 取决于 EFS 计划（mark=yes / mode=by_agreement），未撤销。②删除句末「If cross-region inference is enabled for these models, retained inputs and outputs are stored in destination regions (i.e., the region where your inference request is processed).」；紧挨其前的「For more information on data retention and related controls, see Data retention.」上一版已存在，本轮未变，不是本轮新增的指向。跨区域保留落点仍由 Geographic cross-Region inference 页的「To the extent we store data for abuse detection, your input prompts and output results will be stored in the destination region.」陈述，故 processing_region 仍为 codes=[selected]，不据此判为撤销。③Claude Fable 30 天保留句只新增「For more information, see Automated review and human review.」，保留上限与对象不变，retention 仍为 object=input_output / basis=fixed_period / days=30。④页脚导航由「Enterprise Frontier Safeguards」改为「Automated review and human review」，与五维无关。本轮把两页现在指向的官方 EFS/EDC 页（anthropic-efs-enterprise-data-controls.html）新增为来源，并绑定其「through at least June 30, 2027」、EFS 存于源 Region 客户桶、Amazon 托管存储 30 天或按桶生命周期删除、加入预览关闭 ZDR 等条款，使被移走的细节仍可追溯。"
summary_en = "The Abuse detection page rewrote two five-dimension clauses this round. (1) The Claude Fable EFS bullet's old text \"If you're eligible for Enterprise Frontier Safeguards (EFS), you can use Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2 with zero data retention (ZDR) for internal use through at least June 30, 2027. After ZDR ends, all traffic will be retained for up to 30 days for automated offline abuse detection. The EFS program plans to enable customer-managed encryption and storage for automated offline abuse detection.\" became a pointer to the EFS/EDC program page: \"If your account is enrolled in Anthropic Enterprise Frontier Safeguards (EFS) or Anthropic Enterprise Data Controls (EDC), see the public preview of Enterprise Frontier Safeguards (EFS) and Enterprise Data Controls (EDC) for Anthropic models.\" The ZDR window and customer-managed encryption and storage are no longer spelled out here and are carried by the EFS/EDC program page; the 30-day retention remains covered by this page's Claude Fable bullet (\"all traffic ... up to 30 days\") and by contract §50.12.2, and the conclusion remains that ZDR depends on the EFS program (mark=yes / mode=by_agreement), not that it was withdrawn. (2) It deleted the trailing sentence \"If cross-region inference is enabled for these models, retained inputs and outputs are stored in destination regions (i.e., the region where your inference request is processed).\"; the preceding \"For more information on data retention and related controls, see Data retention.\" was already present in the previous version and did not change this round, so it is not a new pointer added by this change. The cross-Region retained-data location is still stated on the Geographic cross-Region inference page as \"To the extent we store data for abuse detection, your input prompts and output results will be stored in the destination region.\" processing_region therefore remains codes=[selected], and this deletion is not treated as a withdrawal. (3) The Claude Fable 30-day retention bullet only added \"For more information, see Automated review and human review.\"; the retention object and upper bound are unchanged, and retention remains object=input_output / basis=fixed_period / days=30. (4) The footer navigation changed from \"Enterprise Frontier Safeguards\" to \"Automated review and human review\", which is unrelated to the five dimensions. This round adds the official EFS/EDC page that both changed pages now point to (anthropic-efs-enterprise-data-controls.html) as a source and binds its \"through at least June 30, 2027\", EFS stored in the source-Region customer bucket, 30-day Amazon-managed deletion or bucket lifecycle, and preview-turns-off-ZDR clauses so the moved details remain traceable."
issue = "https://github.com/arcships/zdr-monitor/issues/1410"
