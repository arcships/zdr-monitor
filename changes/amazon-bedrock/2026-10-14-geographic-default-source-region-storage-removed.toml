summary_zh = "Geographic cross-Region inference 页删除了旧句「By default, the data remains stored only in the source Region.」。现行正文仍写明「Cross-Region inference requests to an inference profile tied to a geography (such as US, EU, and APAC) stay within that geography. Your data remains in the AWS Regions where it originally resides.」，但紧接「Your input prompts and output results might move outside of your source Region during cross-Region inference.」，并继续写明 abuse detection 保留的输入输出存于 destination region。api 档 processing_region 的 codes=[selected] 未变，但不再能引用「默认只存源 Region」这一数据驻留表述；说明文字已删除该断言并改为只陈述现行正文。同一 diff 中地理前缀列表新增 in，与五维无关。"
summary_en = "The Geographic cross-Region inference page deleted the sentence \"By default, the data remains stored only in the source Region.\" The current text still says \"Cross-Region inference requests to an inference profile tied to a geography (such as US, EU, and APAC) stay within that geography. Your data remains in the AWS Regions where it originally resides.\", but it is immediately followed by \"Your input prompts and output results might move outside of your source Region during cross-Region inference.\", and it continues to state that inputs and outputs retained for abuse detection are stored in the destination region. The api tier's processing_region verdict is unchanged at codes=[selected], but the page can no longer be cited for the claim that data is stored only in the source Region by default; that assertion was removed from the descriptive point, which now states only what the current page says. The addition of the in geographic prefix in the same diff is unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/639"
