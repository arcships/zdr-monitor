summary_zh = "Data retention 页本轮改写多处。①「Anthropic Claude models」小节旧句「ZDR for Claude models that require data retention is granted to customers who are eligible for the Enterprise Frontier Safeguards program. To find out whether you're eligible, contact your AWS account team or AWS Support.」改为「If you're eligible for Anthropic Enterprise Frontier Safeguards (EFS), you can get ZDR for certain Claude models that require data retention. If you enroll in EFS or Anthropic Enterprise Data Controls (EDC) without ZDR, or after your ZDR period ends, Amazon Bedrock retains your inputs and outputs for those models. The program's page describes where Amazon Bedrock stores them, for how long, and who reviews them.」：保留「合格 EFS 客户可获得 ZDR」，新增 EDC 与「未带 ZDR 加入或 ZDR 期限结束后即保留」的条件，并把存储位置、期限、审查方改由 EFS/EDC 计划页说明。②删除「If cross-region inference is enabled for these models, retained inputs and outputs are stored in destination Regions (that is, the Region where your inference request is processed).」，新增「Where retained inputs and outputs are stored」小节：「By default, Amazon Bedrock stores retained inputs and outputs in Amazon-managed storage. Some trusted access programs let you store them in your own Amazon S3 bucket instead. For details, see the program's page.」③`default` 模式删去「if ZDR applied previously, then ZDR still applies」这句，它是对前一句「There is no change to previous model retention behavior.」的复述；前一句本轮保留未变，连续性承诺仍在，故这属于措辞精简，不是收紧或删除 ZDR 连续性承诺。④Model availability 段新增 EFS/EDC 说明：「You must explicitly set your data retention mode to `aws_review`, or to the legacy `provider_data_share`, before you can invoke these models, including when your account is enrolled in Anthropic Enterprise Frontier Safeguards (EFS) or Anthropic Enterprise Data Controls (EDC). If your effective mode is `none` or `default`, or if you haven't set a mode, these models will be unavailable. If your account is approved for ZDR on the model, you can also use `none` or `default`.」⑤新增总括句「Amazon Bedrock does not share your content with model providers for any current mode.」；`provider_data_share` 的 legacy 标注与「今天不向模型商共享」句在上一版快照已存在，本轮未变。结论字段均未变：api 档 training 仍 mark=yes，zdr 仍 mark=yes / mode=by_agreement，retention 仍 object=input_output / basis=fixed_period / days=30，processing_region 仍 codes=[selected]；本轮改绑失效锚点并补说明。"
summary_en = "The Data retention page changed in several places this round. (1) In the \"Anthropic Claude models\" subsection, the old sentence \"ZDR for Claude models that require data retention is granted to customers who are eligible for the Enterprise Frontier Safeguards program. To find out whether you're eligible, contact your AWS account team or AWS Support.\" became \"If you're eligible for Anthropic Enterprise Frontier Safeguards (EFS), you can get ZDR for certain Claude models that require data retention. If you enroll in EFS or Anthropic Enterprise Data Controls (EDC) without ZDR, or after your ZDR period ends, Amazon Bedrock retains your inputs and outputs for those models. The program's page describes where Amazon Bedrock stores them, for how long, and who reviews them.\" The page keeps \"eligible EFS customers can get ZDR\", adds EDC and the condition that enrolling without ZDR or after the ZDR period ends means retention, and delegates storage location, duration, and reviewer to the EFS/EDC program page. (2) It deleted \"If cross-region inference is enabled for these models, retained inputs and outputs are stored in destination Regions (that is, the Region where your inference request is processed).\" and added a \"Where retained inputs and outputs are stored\" section: \"By default, Amazon Bedrock stores retained inputs and outputs in Amazon-managed storage. Some trusted access programs let you store them in your own Amazon S3 bucket instead. For details, see the program's page.\" (3) The `default` mode bullet dropped the sentence \"if ZDR applied previously, then ZDR still applies\", which restated the preceding \"There is no change to previous model retention behavior.\"; that preceding sentence is unchanged this round and still carries the continuity commitment, so this is a wording simplification rather than a tightening or removal of the ZDR continuity commitment. (4) The Model availability section now says \"You must explicitly set your data retention mode to `aws_review`, or to the legacy `provider_data_share`, before you can invoke these models, including when your account is enrolled in Anthropic Enterprise Frontier Safeguards (EFS) or Anthropic Enterprise Data Controls (EDC). If your effective mode is `none` or `default`, or if you haven't set a mode, these models will be unavailable. If your account is approved for ZDR on the model, you can also use `none` or `default`.\" (5) It added \"Amazon Bedrock does not share your content with model providers for any current mode.\" The `provider_data_share` \"legacy\" label and the \"does not share your content with model providers today\" sentence were already present in the previous snapshot and did not change this round. No verdict field changed: for the api tier, training remains mark=yes, zdr remains mark=yes / mode=by_agreement, retention remains object=input_output / basis=fixed_period / days=30, and processing_region remains codes=[selected]; this round rebinds the broken anchors and updates the explanatory points."
issue = "https://github.com/arcships/zdr-monitor/issues/1410"
