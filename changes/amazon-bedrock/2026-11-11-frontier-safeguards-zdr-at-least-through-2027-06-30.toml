summary_zh = "abuse detection 页改写两条模型级条款。Claude Fable 段旧句「For Anthropic Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, all traffic will be retained for up to 30 days for automated offline abuse detection.」改为「For Anthropic Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, Amazon Bedrock retains all traffic for up to 30 days for automated offline abuse detection.」，只改主语与语态，对象仍是全部流量、上限仍是 30 天，语义不变，故 retention 结论与字段不动，锚点改绑到新句。EFS 段旧句「Customers that are eligible for the Enterprise Frontier Safeguards program will receive ZDR through June 30, 2027.」改为「If you're eligible for Enterprise Frontier Safeguards (EFS), you can use Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2 with zero data retention (ZDR) for internal use through at least June 30, 2027.」：截止日由「through June 30, 2027」改为「through at least June 30, 2027」，ZDR 由有明确终点变为至少到该日的下限，对合格客户是放宽；同时把范围明确为 Claude Fable 5、Claude Fable 5.1 与 Claude Fable 5.2 三个模型并按内部用途，与 data retention 页「ZDR for Claude models that require data retention」的口径一致。计划句由「customer-managed encryption keys and bring your own bucket for storage」改为「customer-managed encryption and storage」，仍属未来计划而非现行承诺。「After ZDR ends, all traffic will be retained for up to 30 days for automated offline abuse detection.」未变。api 档 zdr 仍为 mark=yes / mode=by_agreement，retention 仍为 object=input_output / basis=fixed_period / days=30；本轮只更新说明文字与锚点，锚点 id 由 zdr-frontier-safeguards-until-2027-06-30 改为 zdr-frontier-safeguards-through-at-least-2027-06-30。同一 diff 中页脚导航由「Watermarking」改为「Enterprise Frontier Safeguards」，与五个维度无关。"
summary_en = "The abuse detection page rewrote two model-level clauses. In the Claude Fable bullet the old sentence \"For Anthropic Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, all traffic will be retained for up to 30 days for automated offline abuse detection.\" became \"For Anthropic Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, Amazon Bedrock retains all traffic for up to 30 days for automated offline abuse detection.\" Only the subject and voice changed; the object is still all traffic and the 30-day upper bound is unchanged, so the retention verdict and its fields stay as they are and the anchor is rebound to the new sentence. In the EFS bullet the old sentence \"Customers that are eligible for the Enterprise Frontier Safeguards program will receive ZDR through June 30, 2027.\" became \"If you're eligible for Enterprise Frontier Safeguards (EFS), you can use Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2 with zero data retention (ZDR) for internal use through at least June 30, 2027.\" The end date changed from \"through June 30, 2027\" to \"through at least June 30, 2027\", so ZDR goes from having a fixed end point to a floor that lasts at least until that date, which is a relaxation for eligible customers. At the same time the scope is now explicit: the three Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2 models, for internal use, which matches the data retention page's \"ZDR for Claude models that require data retention\" wording. The forward-looking sentence changed from \"customer-managed encryption keys and bring your own bucket for storage\" to \"customer-managed encryption and storage\"; it remains a future plan rather than a current commitment. \"After ZDR ends, all traffic will be retained for up to 30 days for automated offline abuse detection.\" is unchanged. For the api tier, zdr remains mark=yes / mode=by_agreement and retention remains object=input_output / basis=fixed_period / days=30; this round only updates descriptions and anchors, with the anchor id renamed from zdr-frontier-safeguards-until-2027-06-30 to zdr-frontier-safeguards-through-at-least-2027-06-30. In the same diff the page footer navigation changed from \"Watermarking\" to \"Enterprise Frontier Safeguards\", which is unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1174"
