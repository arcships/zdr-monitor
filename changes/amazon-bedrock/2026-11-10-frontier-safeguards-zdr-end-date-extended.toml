summary_zh = "abuse detection 页把 Enterprise Frontier Safeguards 的 ZDR 截止日从「December 31, 2026」延后到「June 30, 2027」。旧句「Customers that are eligible for the Enterprise Frontier Safeguards program will receive ZDR through December 31, 2026.」改为「Customers that are eligible for the Enterprise Frontier Safeguards program will receive ZDR through June 30, 2027.」。ZDR 结束后的处理未变：「After ZDR ends, all traffic will be retained for up to 30 days for automated offline abuse detection.」；「The Enterprise Frontier Safeguards program plans to enable customer-managed encryption keys and bring your own bucket for storage for automated offline abuse detection.」一句上一版已存在，本轮未改。对合格客户而言 ZDR 多六个月，属于放宽；api 档 zdr 结论字段未变（仍 mark=yes / mode=by_agreement），retention 的 30 天上限也未变。本轮更新截止日的说明文字、锚点内容和锚点 id。"
summary_en = "The abuse detection page extended the Enterprise Frontier Safeguards ZDR end date from \"December 31, 2026\" to \"June 30, 2027\". The old sentence \"Customers that are eligible for the Enterprise Frontier Safeguards program will receive ZDR through December 31, 2026.\" became \"Customers that are eligible for the Enterprise Frontier Safeguards program will receive ZDR through June 30, 2027.\" The handling after ZDR ends is unchanged: \"After ZDR ends, all traffic will be retained for up to 30 days for automated offline abuse detection.\" The sentence \"The Enterprise Frontier Safeguards program plans to enable customer-managed encryption keys and bring your own bucket for storage for automated offline abuse detection.\" was already present in the previous version and did not change this round. Eligible customers get six more months of ZDR, which is a relaxation; the api tier zdr verdict fields are unchanged (still mark=yes / mode=by_agreement) and the 30-day retention upper bound is unchanged. This round updates the end-date description, the anchor text, and the anchor id."
issue = "https://github.com/arcships/zdr-monitor/issues/1148"
