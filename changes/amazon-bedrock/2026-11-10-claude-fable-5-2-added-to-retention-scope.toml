summary_zh = "abuse detection 页与 data retention 页都把 Claude Fable 5.2 加入需要保留 / 需要人工审查的模型清单。abuse detection 页旧句为「For Anthropic Claude Fable 5 and Claude Fable 5.1, all traffic will be retained for up to 30 days for automated offline abuse detection.」，新句为「For Anthropic Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, all traffic will be retained for up to 30 days for automated offline abuse detection.」。data retention 页同步在四处把「Claude Fable 5 and Claude Fable 5.1」改为「Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2」：provider_data_share 兼容段、Model availability 示例、bedrock-mantle opt-in 段，以及「For models requiring `aws_review` (currently …)」段。结论方向不变（这些模型仍要求 aws_review，全量流量保留上限 30 天），但强制保留的模型范围扩大到 Fable 5.2；api 档 zdr 仍为 mark=yes / mode=by_agreement，retention 仍为 object=input_output / basis=fixed_period / days=30，本轮只更新说明与锚点。同一 diff 中 abuse detection 页的导航链接由「Prompt injection security」改为「Watermarking」，与五个维度无关。"
summary_en = "Both the abuse detection page and the data retention page added Claude Fable 5.2 to the list of models that require retention and human review. The abuse detection page's old sentence was \"For Anthropic Claude Fable 5 and Claude Fable 5.1, all traffic will be retained for up to 30 days for automated offline abuse detection.\" and the new sentence is \"For Anthropic Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2, all traffic will be retained for up to 30 days for automated offline abuse detection.\" The data retention page made the same change in four places, replacing \"Claude Fable 5 and Claude Fable 5.1\" with \"Claude Fable 5, Claude Fable 5.1, and Claude Fable 5.2\": the provider_data_share compatibility paragraph, the Model availability example, the bedrock-mantle opt-in section, and the \"For models requiring `aws_review` (currently ...)\" paragraph. The direction of the verdicts is unchanged (these models still require aws_review, with all traffic retained for up to 30 days), but the scope of mandatory retention now includes Fable 5.2. For the api tier, zdr remains mark=yes / mode=by_agreement and retention remains object=input_output / basis=fixed_period / days=30; this round only updates descriptions and anchors. In the same diff the abuse detection page's navigation link changed from \"Prompt injection security\" to \"Watermarking\", which is unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1148"
