summary_zh = "Data retention 页的「Anthropic Claude models」小节改写了一段，从「ZDR eligibility for Claude models is managed by Anthropic. Contact your Anthropic account representative for support.」改为「ZDR for Claude models that require data retention is granted to customers who are eligible for the Enterprise Frontier Safeguards program. To find out whether you're eligible, contact your AWS account team or AWS Support. For more information, see Model-specific abuse detection.」。变化点有两处：一是 Claude 的 ZDR 资格从「由 Anthropic 管理」改为绑定 Enterprise Frontier Safeguards 计划的合格客户；二是申请渠道从 Anthropic 客户代表改为 AWS 客户团队或 AWS Support。承诺本身没变（仍是按账号、按模型审批的 ZDR），且新表述与 abuse detection 页既有的「Customers that are eligible for the Enterprise Frontier Safeguards program will receive ZDR through December 31, 2026.」一致；api 档 zdr 的结论字段未变（仍 mark=yes / mode=by_agreement），本轮只更新该点的说明与锚点。同一 diff 中 SCP 示例仅新增 Resource 字段，与五个维度无关。"
summary_en = "On the Data retention page's \"Anthropic Claude models\" subsection, the sentence \"ZDR eligibility for Claude models is managed by Anthropic. Contact your Anthropic account representative for support.\" was replaced with \"ZDR for Claude models that require data retention is granted to customers who are eligible for the Enterprise Frontier Safeguards program. To find out whether you're eligible, contact your AWS account team or AWS Support. For more information, see Model-specific abuse detection.\" Two things changed: Claude ZDR eligibility moved from being managed by Anthropic to being granted to customers eligible for the Enterprise Frontier Safeguards program, and the contact channel moved from an Anthropic account representative to the AWS account team or AWS Support. The commitment itself is unchanged (ZDR remains evaluated per account and per model), and the new wording matches the abuse detection page's existing statement that \"Customers that are eligible for the Enterprise Frontier Safeguards program will receive ZDR through December 31, 2026.\" No api tier zdr verdict field changed (still mark=yes / mode=by_agreement); this round only updates that point's description and anchor. In the same diff the SCP examples merely add a Resource field, which is unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1070"
