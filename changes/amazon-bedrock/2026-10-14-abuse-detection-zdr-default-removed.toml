summary_zh = "abuse detection 页改写与保留、ZDR 有关的正文。旧句「Amazon Bedrock uses a zero operator access (ZOA) data security model. This means no operators of the service can access model input or output. Also, Amazon Bedrock uses a zero data retention (ZDR) data security model. This means that by default, Amazon Bedrock does not store model inputs or outputs.」被拆改：ZDR 默认不留存句整句删除；ZOA 句改为「Amazon Bedrock uses a zero operator access (ZOA) data security model, subject to the model-specific abuse and CSAM detection detailed below.」。保留例外由「we may be required to store inputs and outputs」改为「we will store inputs and outputs as follows」；OpenAI 例外范围由「For OpenAI GPT-6 Astra, GPT-5.4, GPT-5.5, GPT-5.6 Sol, GPT-5.6 Terra, GPT-5.6 Luna, Daybreak Red: GPT-5.6 Cyber, and Daybreak Blue: GPT-5.6 Sol」改为「For all OpenAI models other than GPT OSS Safeguard 120B, GPT OSS Safeguard 20B, gpt-oss-120b, and gpt-oss-20b」。CSAM 段由「image inputs」「will block」改为「image inputs or outputs」「may block」，并删去 hash matching technology or classifiers 的方法说明。api 档 zdr 结论由 mark=yes / mode=default 改为 mark=yes / mode=by_agreement：对需要保留的模型（OpenAI 除 GPT OSS 外、Claude Fable 5/5.1 等）ZDR 按账号、按模型审批，Claude 由 Anthropic 管理；allowed_modes 含 none 的模型本来就不保留，无需申请。retention 的 object=input_output、basis=fixed_period、days=30 未变，但「默认不留存」的依据删除，改为 retention 页的 default 模式说明：default 适用模型自身保留策略，AWS 可能为安全与防滥用保留数据；保证零保留须设 data_retention_mode: none。"
summary_en = "The abuse detection page rewrote its retention and ZDR wording. The old passage \"Amazon Bedrock uses a zero operator access (ZOA) data security model. This means no operators of the service can access model input or output. Also, Amazon Bedrock uses a zero data retention (ZDR) data security model. This means that by default, Amazon Bedrock does not store model inputs or outputs.\" was split and changed: the ZDR default-no-store sentence was deleted, and the ZOA sentence became \"Amazon Bedrock uses a zero operator access (ZOA) data security model, subject to the model-specific abuse and CSAM detection detailed below.\" The retention exception changed from \"we may be required to store inputs and outputs\" to \"we will store inputs and outputs as follows\". The OpenAI exception scope changed from \"For OpenAI GPT-6 Astra, GPT-5.4, GPT-5.5, GPT-5.6 Sol, GPT-5.6 Terra, GPT-5.6 Luna, Daybreak Red: GPT-5.6 Cyber, and Daybreak Blue: GPT-5.6 Sol\" to \"all OpenAI models other than GPT OSS Safeguard 120B, GPT OSS Safeguard 20B, gpt-oss-120b, and gpt-oss-20b\". The CSAM section changed \"image inputs\" to \"image inputs or outputs\" and \"will block\" to \"may block\", and removed the hash matching technology or classifiers wording. For the api tier the zdr verdict changed from mark=yes / mode=default to mark=yes / mode=by_agreement: for models that require retention (all OpenAI models other than the GPT OSS exclusions, Claude Fable 5/5.1, and others) ZDR is evaluated per account and per model, with Claude managed by Anthropic, while models whose allowed_modes includes none do not persist anything and need no application. retention remains object=input_output, basis=fixed_period, days=30; the basis for the former default-no-store claim is now the retention page's default mode, under which the model's own policy applies and AWS may retain data for safety and abuse-prevention purposes, so guaranteed zero retention requires data_retention_mode: none."
issue = "https://github.com/arcships/zdr-monitor/issues/639"
