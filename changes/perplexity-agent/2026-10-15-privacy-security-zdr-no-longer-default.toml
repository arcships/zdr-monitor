summary_zh = "docs/resources/privacy-security 于 2026-10-15 改版：旧版 Chat Completions 专属的两句被删除——「Perplexity maintains a strict **Zero Data Retention Policy** for the Chat Completions API. We do not retain data sent through the Chat Completions API, and we do not use customer data to train our models or for any purpose beyond processing the immediate request.」与「This billing metadata does not include any content from your prompts, responses, or other user data.」，以及旧版「Data We Collect」小节及其分项清单（token 数、模型、时间戳与时长、API key 标识），后者被合并改写为一条用量元数据说明。新版改为平台级表述：不训练以 API ToS 为依据（未训练承诺仍成立）；「Zero Data Retention is not default」，ZDR 只向合格客户按账户级书面协议开通，未开通时不得假设 Perplexity 或其模型提供方零保留；并非所有模型支持 ZDR，第三方提供方可能要求有限保留；用量元数据与账户信息仍被收集，但不再声明不含请求/响应内容。因此 api-sonar-chat-completions 档：zdr 由 default 改为 by_agreement；retention 由 none 改为 object=mixed + basis=undisclosed，输入按 FAQ 的「By default, the API has zero day retention of user prompt data」记零日，输出按新版未给期限，不再用单一 undisclosed 覆盖 input_output；training 由 default 改为 by_contract（不训练的实体结论未变）。FAQ 仍保留「We do not retain any query data sent through the API」与「By default, the API has zero day retention of user prompt data」，与新页字面冲突；两条事实在 points 中并列保留，zdr 的 mode 以专门的 Privacy & Security 页为准（该页是唯一把 ZDR 作为机制描述的页面，FAQ 只给了默认零日保留的表述）。"
summary_en = "docs/resources/privacy-security was rewritten on 2026-10-15. Two Chat Completions-specific sentences were removed: 'Perplexity maintains a strict **Zero Data Retention Policy** for the Chat Completions API. We do not retain data sent through the Chat Completions API, and we do not use customer data to train our models or for any purpose beyond processing the immediate request.' and 'This billing metadata does not include any content from your prompts, responses, or other user data.' The 'Data We Collect' section and its itemized list (token counts, model, request timestamp and duration, API key identification) were consolidated into a single usage-metadata sentence. The page now states at platform level that no-training rests on the API Terms of Service (the substantive commitment still holds); that 'Zero Data Retention is not default': ZDR is available only to eligible customers through an account-level configuration under a written agreement, with no assumption of zero retention without it; that not every model supports ZDR and some third-party providers require limited retention; and that usage metadata and account information are collected, without the former statement that metadata excludes prompt/response content. Accordingly the api-sonar-chat-completions tier moves zdr from default to by_agreement; retention from none to object=mixed with basis=undisclosed (input recorded as zero-day per the FAQ's 'By default, the API has zero day retention of user prompt data', output as having no stated period, instead of one undisclosed value covering input_output); and training from default to by_contract (the substantive no-training verdict is unchanged). The FAQ still says 'We do not retain any query data sent through the API' and 'By default, the API has zero day retention of user prompt data', which conflicts literally with the rewritten page; both facts are kept side by side in the points, and zdr's mode is taken from the dedicated Privacy & Security page (the only page that describes ZDR as a program; the FAQ only states a default zero-day retention)."
issue = "https://github.com/arcships/zdr-monitor/issues/674"
