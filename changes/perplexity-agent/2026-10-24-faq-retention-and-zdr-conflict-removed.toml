summary_zh = "docs/resources/faq 的 Data, Privacy & Security 段于 2026-10-24 快照改版：删除「We do not retain any query data sent through the API and do not train on any of your data」与「By default, the API has zero day retention of user prompt data, which is never used for AI training」两句；训练句改为以合同为依据的「Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models」，保留句改为「Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default. See Privacy & Security for details.」。托管地一句「Our compute is hosted via Amazon Web Services in North America」保留，processing_region 不受影响。对 api-sonar-chat-completions 档：training 结论不变(仍是 by_contract)，但 FAQ 的引文改绑到新句；retention 的输入侧不再有 0 天依据，输入与输出都只能记「未公布期限」，object=mixed / basis=undisclosed 的表格值不变；zdr 的冲突消失，FAQ 与 privacy-security 页一致写 ZDR 非默认，mark=yes / mode=by_agreement 不变。旧的两句是 2026-10-15 记录中「FAQ 与隐私页字面冲突」的另一半，现已由厂商删除，故按放宽后的表述记 weakened：FAQ 不再承诺不保留或默认零日保留。"
summary_en = "In the 2026-10-24 snapshot of docs/resources/faq's Data, Privacy & Security section, two sentences were removed: 'We do not retain any query data sent through the API and do not train on any of your data' and 'By default, the API has zero day retention of user prompt data, which is never used for AI training'. The training sentence now rests on the contract: 'Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models', and the retention sentence now reads 'Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default. See Privacy & Security for details.' The hosting sentence 'Our compute is hosted via Amazon Web Services in North America' is unchanged, so processing_region is unaffected. For the api-sonar-chat-completions tier: the training verdict is unchanged (still by_contract) but its FAQ quote is rebound to the new sentence; the input side no longer has a 0-day basis, so both input and output are recorded as period-undisclosed while the table values object=mixed / basis=undisclosed stay the same; the zdr conflict is gone because the FAQ now agrees with the privacy-security page that ZDR is not the default, with mark=yes / mode=by_agreement unchanged. The removed sentences were the other half of the FAQ-vs-privacy-page conflict recorded on 2026-10-15; because the vendor deleted the no-retention and default-zero-day statements, the direction is recorded as weakened."
