summary_zh = "docs/resources/privacy-security 的 2026-11-19 快照(#1337)在「Zero Data Retention is not default」这条末尾新增一句：「The exception is the Embeddings API, which applies ZDR by default: inputs and outputs are not stored or logged.」该例外只及 Embeddings API，而本 provider 记录的三个档位是 Agent API、有状态 Agent API 与 Sonar API，都不是 Embeddings API，故三档 zdr 的 mark/mode、retention 的 object/basis 与各档锚点均不变；新增句只把「ZDR 非默认」的适用范围写明，不构成对本台账任一档位的承诺增强或减弱。同次快照其余改动为标题层级（##/###）与页面导航文本，与五个维度无关。"
summary_en = "The 2026-11-19 snapshot of docs/resources/privacy-security (#1337) appended one sentence to the 'Zero Data Retention is not default' bullet: 'The exception is the Embeddings API, which applies ZDR by default: inputs and outputs are not stored or logged.' The exception reaches only the Embeddings API, while the tiers recorded in this provider are Agent API, its stateful configuration, and Sonar API — none of them is the Embeddings API. The zdr mark/mode, the retention object/basis, and all tier anchors are therefore unchanged; the new sentence only fixes the scope of the 'not default' statement and neither strengthens nor weakens any commitment recorded for these tiers. The rest of the snapshot's changes are heading levels (##/###) and navigation text, unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1339"
