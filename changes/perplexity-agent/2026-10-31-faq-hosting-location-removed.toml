summary_zh = "docs/resources/faq 的 2026-10-31 快照(#969)删去了整段「Where Are Perplexity's Language Models Hosted?」问答，其中包括「Our compute is hosted via Amazon Web Services in North America. For how API data is retained, including when Zero Data Retention (ZDR) is available, see Privacy & Security.」。该句原是 api、api-agent-stateful、api-sonar-chat-completions 三个档位 processing_region 的唯一官方依据；删除后本条 provider 引用的 FAQ、privacy-security、conversation-state、DPA 与 API ToS 均未给出处理地或区域选择。Trust Center 子处理者清单的 US 列只是子处理者公司所在地、不是 Perplexity 的处理地（DPA Annex 2 将该清单并入合同），不能据此维持美国结论；DPA §11 也只规定跨境传输的合规机制（EU SCCs / UK Addendum、data importer 义务），未给出任何国家或地区。故三档 processing_region 由 codes=[\"US\"] 改为 mark=unknown / codes=[\"unknown\"]（未披露）。同次快照对 training 与 retention 的两句未作改动：训练仍以 API ToS 为依据、保留仍为「随 API/model/account 配置而异、ZDR 非默认」，两维结论不变；其余改动为 bug 反馈与社区链接等支持信息，与五个维度无关。"
summary_en = "The 2026-10-31 snapshot of docs/resources/faq (#969) removed the entire 'Where Are Perplexity's Language Models Hosted?' Q&A, including 'Our compute is hosted via Amazon Web Services in North America. For how API data is retained, including when Zero Data Retention (ZDR) is available, see Privacy & Security.' That sentence was the only official basis for processing_region on the api, api-agent-stateful, and api-sonar-chat-completions tiers. After its removal, the FAQ, privacy-security, conversation-state, DPA and API ToS cited by this provider state neither a processing location nor any region-selection option. The Trust Center subprocessor list's US column is the vendor company's location, not Perplexity's processing location (DPA Annex 2 incorporates that list), so it cannot sustain a US conclusion; DPA §11 likewise commits only to a transfer compliance mechanism (EU SCCs / UK Addendum, data importer obligations) and names no country or region. processing_region on all three tiers therefore changes from codes=[\"US\"] to mark=unknown / codes=[\"unknown\"] (undisclosed). The snapshot left the training and retention sentences unchanged — training still rests on the API ToS and retention still reads 'depends on the API, model, and account configuration, and ZDR is not the default' — so those verdicts are unchanged. The remaining edits are support/community links and do not touch the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/972"
