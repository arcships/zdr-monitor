summary_zh = "BYOK 文档「Declaring a Data Region on a Key」一节的规则列表新增一条：区域设置经管理 API 以 `declared_region` 暴露（取值 `global`、`europe`、`us`，或 `null` 表示未声明），更新时省略则保留原值、发送 `null` 则清除；且对 OpenAI 与 Fireworks，该值必须与 key 材料中的区域一致，需通过发送相应区域的 key 来更改。这仍是为同一条客户自述（OpenRouter 不核验）增加了 API 入口与约束，处理地结论方向不变：byok 档 processing_region 仍为 basis=undisclosed、不编码任何区域；新增锚点 openrouter-byok-region-management-api-declared-region-region 与一条带锚点的说明。同轮另两处改动与五个维度无关，未记录：① 免费额度一句把「Enterprise includes $200,000」改为「Enterprise allowances are custom」（定价）；② 「BYOK and Guardrail Budgets」段末新增指向 Spend Controls 最佳实践指南的内链（预算配置）。"
summary_en = "The rule list under the BYOK page's 'Declaring a Data Region on a Key' section gained an item: the region setting is exposed through the management API as `declared_region` (`global`, `europe`, `us`, or `null` for undeclared); omit it on update to keep the stored value, or send `null` to clear it; and for OpenAI and Fireworks the value must match the region in the key material, so it is changed by sending a key with that region. This adds an API surface and a constraint to the same customer attestation (which OpenRouter does not verify), so the processing-region verdict is unchanged: the BYOK tier's processing_region remains basis=undisclosed and is not coded to any region; a new anchor (openrouter-byok-region-management-api-declared-region-region) and one anchored point were added. The other two changes in the same round do not touch the five dimensions and were not recorded: (1) the free-allowance sentence changed 'Enterprise includes $200,000' to 'Enterprise allowances are custom' (pricing); (2) the 'BYOK and Guardrail Budgets' paragraph gained a link to the Spend Controls best-practices guide (budget configuration)."
issue = "https://github.com/arcships/zdr-monitor/issues/522"
