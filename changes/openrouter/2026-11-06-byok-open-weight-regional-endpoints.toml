summary_zh = "#1093 的 BYOK 文档改写「BYOK and Regional Endpoints」一段：旧文说 global API（openrouter.ai）对 region-pinned 端点（如 amazon-bedrock/us、google-vertex/europe-west1）默认跳过，除非用 provider.order 或 provider.only 显式指定；新文按 closed-weight 与 open-weight 模型区分——closed-weight 模型仍默认跳过，且 fallback key 不会解锁这些端点；但「Regional endpoints of open-weight models (models with a Hugging Face id) are not skipped: they stay in default routing and compete on price with the model’s other endpoints, so a BYOK key for that provider can be used on them like on any other endpoint.」即 open-weight 模型的区域端点留在默认路由，BYOK key 可像其他端点一样使用。byok 档 processing_region 结论未变（仍为 basis=undisclosed、不编码区域）：新文没有披露这些端点的实际处理地，也没有改变客户声明不被核验这一点。本轮新增锚点 openrouter-byok-open-weight-regional-endpoints-region 与一条说明。同轮页面首尾 Assistant/Suggestions 区块移动与五个维度无关，未记录。"
summary_en = "In #1093 the BYOK page rewrote the 'BYOK and Regional Endpoints' paragraph. The old text said requests to the global API (openrouter.ai) skip region-pinned endpoints such as amazon-bedrock/us or google-vertex/europe-west1 unless targeted explicitly with provider.order or provider.only. The new text splits closed-weight from open-weight models: closed-weight models are still skipped by default and fallback keys never unlock those endpoints, but 'Regional endpoints of open-weight models (models with a Hugging Face id) are not skipped: they stay in default routing and compete on price with the model’s other endpoints, so a BYOK key for that provider can be used on them like on any other endpoint.' Open-weight regional endpoints therefore stay in default routing and are usable by a BYOK key like any other endpoint. The byok tier's processing_region verdict is unchanged (still basis=undisclosed, no coded region): the new text does not disclose the actual processing location of these endpoints or alter the fact that the customer's declaration is not verified. New anchor openrouter-byok-open-weight-regional-endpoints-region and one explanatory point were added. The Assistant/Suggestions block moving between the top and bottom of the page in the same round does not touch the five dimensions and was not recorded."
issue = "https://github.com/arcships/zdr-monitor/issues/1094"
