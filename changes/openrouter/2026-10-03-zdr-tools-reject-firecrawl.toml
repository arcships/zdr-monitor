summary_zh = "ZDR 文档（docs /guides/features/zdr）的 <Warning> 块在「ZDR enforcement only applies to provider routing for inference requests. It does not apply to plugins and tools you choose to enable, such as web search.」之后新增一句：「One tool-level rule applies: when ZDR is enforced in your account privacy settings or a guardrail, the Web Search and Web Fetch server tools and the Web Search plugin reject the Firecrawl engine.」。这是 ZDR 强制范围在工具层的一处收紧：经账户隐私设置或 guardrail 强制 ZDR 时，Web Search / Web Fetch 服务端工具与 Web Search 插件不再使用 Firecrawl 引擎；原有「不适用于 plugins 与工具」的边界句一字未改，其余插件与工具仍不受 ZDR 强制，这几个工具的其他后端本句未表态。api 档 zdr 结论不变（仍 mark=yes / mode=opt_in），只在该档 zdr 补一条带锚点（openrouter-zdr-tools-reject-firecrawl-zdr）的说明。同轮 Data Collection 页把私有日志一项的「For organizations, only admins can view logged data.」改为「For organizations, org admins can view all logged data; members can view their own.」，属于客户组织内部的查看权限，不涉及保留对象、语境或期限，也不涉及训练、处理地或角色，故未记录。"
summary_en = "The <Warning> block on the ZDR page (docs /guides/features/zdr) gained a sentence after 'ZDR enforcement only applies to provider routing for inference requests. It does not apply to plugins and tools you choose to enable, such as web search.': 'One tool-level rule applies: when ZDR is enforced in your account privacy settings or a guardrail, the Web Search and Web Fetch server tools and the Web Search plugin reject the Firecrawl engine.' This tightens ZDR enforcement at the tool layer: with ZDR enforced through account privacy settings or a guardrail, the Web Search and Web Fetch server tools and the Web Search plugin no longer use the Firecrawl engine. The existing boundary sentence that ZDR does not apply to plugins and tools is unchanged word for word, other plugins and tools remain outside ZDR enforcement, and the sentence says nothing about the other backends of these tools. The api tier's zdr verdict is unchanged (still mark=yes / mode=opt_in); one anchored point (openrouter-zdr-tools-reject-firecrawl-zdr) was added to that tier's zdr dimension. In the same round the Data Collection page changed the private logging item from 'For organizations, only admins can view logged data.' to 'For organizations, org admins can view all logged data; members can view their own.', which concerns who inside the customer's own organization can view opted-in logs and does not touch the retention object, context or period, training, processing region or role, so it was not recorded."
issue = "https://github.com/arcships/zdr-monitor/issues/486"
