summary_zh = "#1013 的 ZDR 文档、Data Collection 页与 FAQ 同轮改写数据政策分层与 Safety Retention 口径。ZDR 文档把 ZDR 定义从 'Zero Data Retention (ZDR) means that a provider will not store your data for any period of time.' 改为 'Zero Data Retention (ZDR) means no routine storage of prompts or responses after processing, apart from the CSAM exception described on this page.'，新增 Data policy tiers 一节：ZDR 为 'No routine storage after processing, as described on this page.'；Safety Retention 为 'OpenRouter or a provider may retain prompts and responses from any request, whether flagged or not, only to detect, investigate, and prevent abuse.' 且不用于训练；Retention and Training 为 'Data may be stored and used for training under the applicable provider policy.'。页面并写明 'Safety Retention limits why data can be kept. It does not require a request to be flagged before it can be stored.'。新增 Allowing or excluding Safety Retention 一节，选择分为 Google 与 All other models；'If you haven't chosen, self-serve accounts allow Safety Retention and enterprise accounts use ZDR only.'。Google Safety Retention 一节的选项名从 'Zero retention only' / 'Safety retention allowed' 改为 'ZDR only' / 'Allow Safety Retention'，默认句相应改为 'If you don't choose, enterprise accounts default to ZDR only and all other accounts default to Allow Safety Retention.'，语义未变。请求级 zdr 句从 'the request is routed only to endpoints that have a Zero Data Retention policy. Endpoints that use Safety Retention are included only if Safety Retention is allowed for your account or guardrail (see Google Safety Retention).' 改为 'the request will only be routed to ZDR endpoints, plus Safety Retention endpoints if your settings allow them (see Allowing or excluding Safety Retention).'。Zero Retention Endpoints 的引导句从 'The following endpoints have a ZDR policy.' 改为 'The following endpoints are eligible when ZDR is enforced.'，并新增 'It also includes Safety Retention endpoints, which are used only if you allow Safety Retention.'。Data Collection 页页首新增 'Requests to Safety Retention endpoints are the exception: OpenRouter or the provider may retain prompts and responses from any request, only to prevent abuse, and not for training.'，并说明可用 ZDR only 排除这些端点。FAQ 新增 'What are ZDR, Safety Retention, and Retention and Training?' 一节，复述三层定义与 ZDR only / Allow Safety Retention 选项。方向为 weakened：ZDR 定义不再是 'will not store your data for any period of time' 的绝对表述，改为 'no routine storage ... apart from the CSAM exception'；Safety Retention 的保留范围从 Google 专节的分类器标记 prompt 扩展为一般端点可保留任何请求（无论是否被标记），且未给期限。结论字段未变：api 档 zdr 仍为 yes/opt_in，free-tier 仍为 no，byok 仍为 yes/by_agreement，enterprise 仍为 yes/by_agreement，consumer_chat 仍为 yes/default；各档 retention 的 object 与 basis 也保持原值（api/free-tier/byok/consumer_chat 为 mixed/undisclosed，enterprise 为 mixed/as_needed）。更新 openrouter-zdr-definition-zdr 与 openrouter-zdr-google-safety-retention-defaults-zdr 两个锚点；新增 Safety Retention 分层、Retention and Training 层与 Data Collection Safety Retention 例外三个锚点，并在 api/free-tier/byok/enterprise/consumer_chat 的 zdr、retention、training 说明中补充上述限定。FAQ 同时把 API 端点列表补上 /responses，页尾新增 Suggestions 区块，均与五维无关，未记录。"
summary_en = "In #1013 the ZDR page, the Data Collection page and the FAQ rewrote the data-policy tiers and the Safety Retention wording in the same round. The ZDR page changed the definition from 'Zero Data Retention (ZDR) means that a provider will not store your data for any period of time.' to 'Zero Data Retention (ZDR) means no routine storage of prompts or responses after processing, apart from the CSAM exception described on this page.' It added a Data policy tiers section: ZDR is 'No routine storage after processing, as described on this page.'; Safety Retention is 'OpenRouter or a provider may retain prompts and responses from any request, whether flagged or not, only to detect, investigate, and prevent abuse.' and is not used for training; Retention and Training is 'Data may be stored and used for training under the applicable provider policy.' The page also says 'Safety Retention limits why data can be kept. It does not require a request to be flagged before it can be stored.' A new Allowing or excluding Safety Retention section splits the choice between Google models and All other models and says 'If you haven't chosen, self-serve accounts allow Safety Retention and enterprise accounts use ZDR only.' In the Google Safety Retention section the option names changed from 'Zero retention only' / 'Safety retention allowed' to 'ZDR only' / 'Allow Safety Retention', with the defaults sentence now reading 'If you don't choose, enterprise accounts default to ZDR only and all other accounts default to Allow Safety Retention.'; the meaning is unchanged. The request-level zdr sentence changed from 'the request is routed only to endpoints that have a Zero Data Retention policy. Endpoints that use Safety Retention are included only if Safety Retention is allowed for your account or guardrail (see Google Safety Retention).' to 'the request will only be routed to ZDR endpoints, plus Safety Retention endpoints if your settings allow them (see Allowing or excluding Safety Retention).' The Zero Retention Endpoints lead changed from 'The following endpoints have a ZDR policy.' to 'The following endpoints are eligible when ZDR is enforced.', adding 'It also includes Safety Retention endpoints, which are used only if you allow Safety Retention.' The Data Collection page added 'Requests to Safety Retention endpoints are the exception: OpenRouter or the provider may retain prompts and responses from any request, only to prevent abuse, and not for training.' and says they can be excluded with ZDR only. The FAQ added a 'What are ZDR, Safety Retention, and Retention and Training?' entry restating the three tiers and the ZDR only / Allow Safety Retention choice. Direction is weakened: the ZDR definition is no longer the absolute 'will not store your data for any period of time' but 'no routine storage ... apart from the CSAM exception', and Safety Retention retention is generalized from the Google-specific classifier-flagged prompts to any request, flagged or not, with no stated period. No verdict field changed: api zdr remains yes/opt_in, free-tier no, byok yes/by_agreement, enterprise yes/by_agreement and consumer_chat yes/default; retention keeps mixed/undisclosed on api, free-tier, byok and consumer_chat and mixed/as_needed on enterprise. The anchors openrouter-zdr-definition-zdr and openrouter-zdr-google-safety-retention-defaults-zdr were rebound to the new sentences; three anchors were added for the Safety Retention tier, the Retention and Training tier and the Data Collection Safety Retention exception, and the api, free-tier, byok, enterprise and consumer_chat zdr/retention/training notes were extended with those limits. The FAQ also added /responses to the API endpoint list and a Suggestions footer; neither touches the five dimensions, so they were not recorded."
issue = "https://github.com/arcships/zdr-monitor/issues/1015"
