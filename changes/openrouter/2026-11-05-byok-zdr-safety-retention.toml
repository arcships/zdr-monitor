summary_zh = "#1053 的 BYOK 文档与 ZDR 文档同轮补充 ZDR 声明与 Safety Retention 的关系。BYOK 页把「The setting is not yet available through the BYOK management API. Change it in your workspace BYOK settings.」替换为「You can also set it with the `declared_zdr` field in the BYOK management API: `true` for **My account has ZDR**, `false` for **My account does not have ZDR**, and `null` for **Use OpenRouter’s default**.」，并新增两条规则：「A ZDR declaration also covers Safety Retention. Requests through a key with **My account has ZDR** are treated as ZDR even when you choose **ZDR only**. Declare ZDR only if your own provider agreement excludes the provider’s safety retention.」以及「To use a provider only through your key under ZDR, and never through OpenRouter’s shared capacity, also set **Shared capacity fallback** to **Never use shared capacity for any model on this provider**」。ZDR 页在 Google Safety Retention 一节新增「If your own Google Cloud agreement includes zero data retention, you can use Vertex through your own key with **ZDR only**. Declare ZDR on your BYOK key. Requests through that key are treated as ZDR. See Declaring ZDR on a Key.」。方向记为 clarified：BYOK 的 ZDR 声明机制原本就允许已声明的 key 在上游保留 prompt 时仍可服务（「The key can serve the model even when the shared endpoint retains prompts.」），本轮只是把同一套客户自述机制明确覆盖到 Safety Retention，并给出 Vertex 场景与 API 入口；条件仍是客户自有协议排除该上游的 safety retention，没有新增 OpenRouter 自身的保留或训练许可。结论字段未变：byok 档 zdr 仍为 yes/by_agreement，retention 仍为 mixed/undisclosed。新增锚点 openrouter-byok-declared-zdr-api-zdr、openrouter-byok-zdr-covers-safety-retention-zdr 与 openrouter-zdr-google-safety-retention-byok-zdr；byok 的 zdr 与 retention 说明补充 Safety Retention 例外。同轮 BYOK 页尾新增 Suggestions 区块，与五维无关，未记录。"
summary_en = "In #1053 the BYOK page and the ZDR page clarified how a ZDR declaration interacts with Safety Retention. The BYOK page replaced 'The setting is not yet available through the BYOK management API. Change it in your workspace BYOK settings.' with 'You can also set it with the `declared_zdr` field in the BYOK management API: `true` for **My account has ZDR**, `false` for **My account does not have ZDR**, and `null` for **Use OpenRouter’s default**.' It also added two rules: 'A ZDR declaration also covers Safety Retention. Requests through a key with **My account has ZDR** are treated as ZDR even when you choose **ZDR only**. Declare ZDR only if your own provider agreement excludes the provider’s safety retention.' and 'To use a provider only through your key under ZDR, and never through OpenRouter’s shared capacity, also set **Shared capacity fallback** to **Never use shared capacity for any model on this provider**'. The ZDR page added, in its Google Safety Retention section: 'If your own Google Cloud agreement includes zero data retention, you can use Vertex through your own key with **ZDR only**. Declare ZDR on your BYOK key. Requests through that key are treated as ZDR. See Declaring ZDR on a Key.' Direction is clarified: the BYOK declaration already let a declared key serve a model when the shared endpoint retained prompts ('The key can serve the model even when the shared endpoint retains prompts.'); this round only extends that same customer-attestation mechanism explicitly to Safety Retention, with a Vertex example and an API surface. The condition remains that the customer's own agreement excludes the provider's safety retention, and no new retention or training permission for OpenRouter itself was added. No verdict field changed: byok zdr remains yes/by_agreement and retention remains mixed/undisclosed. New anchors openrouter-byok-declared-zdr-api-zdr, openrouter-byok-zdr-covers-safety-retention-zdr and openrouter-zdr-google-safety-retention-byok-zdr were added, and the byok zdr and retention notes gained the Safety Retention exception. A Suggestions footer added to the BYOK page in the same round does not touch the five dimensions and was not recorded."
issue = "https://github.com/arcships/zdr-monitor/issues/1054"
