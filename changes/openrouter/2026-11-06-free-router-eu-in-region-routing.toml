summary_zh = "#1093 的 Free Models Router（openrouter/free）页新增一句「Not currently available through EU in-region routing.」，明确该免费路由器当前不提供 EU in-region routing。这为免费档 processing_region 的 EU 不可用提供了直接依据；结论字段未变（仍为 codes=[US]，以 DPA Schedule 2 的 GCP US regions 为主证据），因为该句没有披露上游实际处理地，也没有扩大可用区域。本轮新增锚点 openrouter-freemodels-eu-in-region-unavailable-region 与一条说明。同轮其余变化与五个维度无关或属于动态目录：模型清单从 27 个变为 22 个并调整条目（含删除 Horizon Alpha、Cypher Alpha 两条）、新增 Top models 使用量、FAQ 上下文长度措辞改写与文档入口，均未记录。"
summary_en = "In #1093 the Free Models Router (openrouter/free) page added 'Not currently available through EU in-region routing.', explicitly stating that this free router does not currently offer EU in-region routing. This gives direct evidence for the free tier's lack of EU in-region routing. No verdict field changed (codes remains [US], based primarily on the DPA Schedule 2 GCP US regions): the sentence does not disclose the upstream's actual processing location and does not widen the available regions. New anchor openrouter-freemodels-eu-in-region-unavailable-region and one explanatory point were added. The other changes in the same round are unrelated to the five dimensions or part of the dynamic catalogue: the model list changed from 27 to 22 with entry changes (including removal of Horizon Alpha and Cypher Alpha), a Top models usage panel was added, and FAQ context-length wording plus documentation links changed; none were recorded."
issue = "https://github.com/arcships/zdr-monitor/issues/1094"
