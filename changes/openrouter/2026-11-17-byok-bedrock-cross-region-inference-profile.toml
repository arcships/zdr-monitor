summary_zh = "#1264 的 BYOK 文档在 AWS Bedrock 一节新增「Choosing a Cross-Region Inference Profile」：Bedrock 模型常用以 `global.`、`us.`、`eu.`、`apac.` 为前缀的 cross-region inference profile，原文写明「A `global.` profile can process a request in any supported AWS commercial region; a geographic profile keeps it within that geography.」；key 可用 `crisScope`（`global`/`us`/`eu`/`apac`）与 `crisScopeOverrides` 指定范围，地理范围必须与 key 的 `region` 匹配；未设置 `crisScope` 时 `openrouter.ai` 上的请求沿用 `global.` profile，而在 `us.openrouter.ai` 与 `eu.openrouter.ai` 上 key 总是使用 US 或 EU 地理 profile。旧文此处只有「For enhanced security, we recommend creating dedicated IAM users with limited permissions specifically for use with OpenRouter. Learn more in the AWS Bedrock Getting Started with the API documentation, IAM Permissions Setup guide, or the AWS Bedrock API Reference.」一句，没有区域 profile 的说明。byok 档 processing_region 结论未变（仍为 basis=undisclosed、不编码区域）：新文只说明客户可如何收窄 Bedrock key 的 AWS 侧处理范围，没有披露单次请求实际在哪个区域处理，也没有改变客户区域声明不被 OpenRouter 核验这一点。本轮新增锚点 openrouter-byok-bedrock-cross-region-profile-region 与一条说明。同轮 Markdown 标题层级、Suggestions 文案、把 IAM 建议句与「Learn more」拆行属于格式/导航调整；新增的「Private Cloud Storage inputs」（`gs://` 引用由 Vertex 直接读取、OpenRouter 不下载对象，强制内容筛查账户不可用）是功能与数据传输说明，不改变五个维度的保留期限、训练、ZDR 或区域披露结论，均未记录。"
summary_en = "In #1264 the BYOK page added a 'Choosing a Cross-Region Inference Profile' subsection under AWS Bedrock. Bedrock models are commonly invoked through a cross-region inference profile prefixed `global.`, `us.`, `eu.`, or `apac.`, and the text states: 'A `global.` profile can process a request in any supported AWS commercial region; a geographic profile keeps it within that geography.' A key can set `crisScope` (`global`, `us`, `eu`, or `apac`) and `crisScopeOverrides`; a geographic scope must match the key's `region`; without `crisScope`, requests on `openrouter.ai` keep `global.` profiles, while on `us.openrouter.ai` and `eu.openrouter.ai` the key always uses the US or EU geographic profile. The old text here was only 'For enhanced security, we recommend creating dedicated IAM users with limited permissions specifically for use with OpenRouter. Learn more in the AWS Bedrock Getting Started with the API documentation, IAM Permissions Setup guide, or the AWS Bedrock API Reference.' and contained no regional-profile description. The byok tier's processing_region verdict is unchanged (still basis=undisclosed, no coded region): the new text only explains how a customer can narrow the AWS-side processing scope of a Bedrock key; it does not disclose the actual region where a given request is processed, nor does it change the fact that OpenRouter does not verify the customer's region declaration. New anchor openrouter-byok-bedrock-cross-region-profile-region and one explanatory point were added. The markdown heading levels, Suggestions text, and the split of the IAM recommendation from the 'Learn more' sentence in the same round are formatting/navigation changes. The new 'Private Cloud Storage inputs' subsection (`gs://` references read directly by Vertex, objects never downloaded by OpenRouter, unavailable to accounts under forced content screening) describes a feature and data flow and does not change any five-dimension retention, training, ZDR, or region-disclosure verdict; none of these were recorded."
issue = "https://github.com/arcships/zdr-monitor/issues/1269"
