summary_zh = "BYOK 文档「Declaring a Data Region on a Key」把区域声明从其前的 OpenAI/Azure 扩展到 Anthropic：原句「OpenRouter cannot see where your own OpenAI or Azure account processes requests」改为「OpenRouter cannot see where your own OpenAI, Azure, or Anthropic account processes requests」，并说明 OpenAI/Azure key 仍有 Global / European Union / United States 三档、Anthropic key 只有 Global / United States，US 声明还会让 OpenRouter 对符合条件的请求附加 inference_geo: \"us\"。byok 档 processing_region 结论不变（仍为 basis=undisclosed、不编码区域），只把失效的锚点 openrouter-byok-region-declaration-region 改绑到新原句并同步说明。该快照其余改动（BYOK 与 provider ordering 的组合规则、Vertex 部署 region 为 global/空时的端点区域说明、页尾「Was this page helpful?」）不改变本档五个维度的结论；本记录只覆盖上面这条处理地条款。"
summary_en = "The BYOK page's 'Declaring a Data Region on a Key' section extended region declarations from OpenAI/Azure to Anthropic: 'OpenRouter cannot see where your own OpenAI or Azure account processes requests' became 'OpenRouter cannot see where your own OpenAI, Azure, or Anthropic account processes requests'; OpenAI and Azure keys still have Global / European Union / United States, Anthropic keys have only Global / United States, and a US declaration makes OpenRouter add inference_geo: \"us\" to qualifying requests. The byok tier's processing_region verdict is unchanged (still basis=undisclosed with no coded region); the stale anchor openrouter-byok-region-declaration-region was rebound to the new sentence and its note updated. The other changes in this snapshot (BYOK with provider ordering, the Vertex deployment region note, and the 'Was this page helpful?' footer) do not change this tier's five-dimension verdicts; this record covers only the processing-region clause above."
