summary_zh = "OpenRouter FAQ 新增「Does OpenRouter support EU data residency?」一节：EU 数据驻留只覆盖 prompt 与 completion，请求在欧盟解密并只路由到欧洲的共享端点（EU/EEA、英国、瑞士）；BYOK 请求去自身部署区域；账户与账单数据可能在美存储或处理；DPA Exhibit A 在书面选定后覆盖 API payload；Business 为自助、无合同，但 DPA 含 SCC。处理地结论方向不变：api 档仍为默认美国、可选 EU（codes 不变），新增锚点与说明写明 EU 选项的欧洲端点含英国与瑞士、账户/账单数据可能在美国；byok 档仍为 basis=undisclosed、不编码区域，新增一句 FAQ 佐证「请求去自身部署区域」但不改变未核验的性质；role 结论亦不变（api 档仍为 processor），FAQ 的 Business+DPA+SCC 一句作为补充说明锚定。同轮另两处改动与五个维度无关，未记录：BYOK 费用一句补全为 Pay-as-you-go 每月 $25,000 免额、超出按 5% 收费（定价）；页尾新增「Was this page helpful? YesNo」（界面）。"
summary_en = "The OpenRouter FAQ gained a 'Does OpenRouter support EU data residency?' entry: EU residency covers prompts and completions only, with requests decrypted in the EU and routed only to shared provider endpoints in Europe (the EU/EEA, the UK, and Switzerland); BYOK requests go to the customer's own deployment region; account and billing data may be stored or processed in the US; DPA Exhibit A covers API payloads when elected in writing; and Business is self-serve with no contract but the DPA includes SCCs. The processing-region verdict direction is unchanged: the api tier is still US by default with an EU option (codes unchanged), and the new anchored point records that the EU option's European endpoints include the UK and Switzerland while account/billing data may be in the US; the byok tier remains basis=undisclosed with no coded region, with one new FAQ point noting that requests go to the customer's own deployment region without making that region disclosed or verified; the role verdict is also unchanged (api tier remains processor), with the Business/DPA/SCC sentence added as anchored supporting detail. Two other changes in the same round do not touch the five dimensions and were not recorded: the BYOK fee sentence was filled in as Pay-as-you-go $25,000/month with no fee and 5% above the allowance (pricing); and a 'Was this page helpful? YesNo' footer was added (UI)."
issue = "https://github.com/arcships/zdr-monitor/issues/706"
