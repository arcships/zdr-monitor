summary_zh = "#977 的 ZDR 文档把模型组表格 Google 行从「| **Google** | Removes AI Studio endpoints (Vertex remains available) |」改为「| **Google** | Removes AI Studio endpoints. Vertex endpoints that use Safety Retention remain available only if Safety Retention is allowed (see Google Safety Retention) |」，并新增 Google Safety Retention 一节：自 2026-10-18 起 Google 要求经 Vertex 提供的 Google 模型采用 Safety Retention；Google 默认不留存 prompt，但可将安全分类器标记的 prompt 最多保留 90 天用于滥用监测，且不用于训练；这些端点不满足严格 ZDR。启用 ZDR 强制时，Zero retention only 排除此类端点（多数 Google 模型不可用），Safety retention allowed 则可放行；企业账户未选择时默认前者，其他账户默认后者。该开关也覆盖其他使用 Safety Retention 的模型，如 Vertex 上的 open-weight 模型（guardrail 使用 allow_safety_retention_other）；文档未另写这些模型的保留期限，不把 Google 的 90 天套用过去。请求级旧句「When `zdr` is set to `true`, the request will only be routed to endpoints that have a Zero Data Retention policy.」改为「When `zdr` is set to `true`, the request is routed only to endpoints that have a Zero Data Retention policy.」，并增加允许 Safety Retention 时才纳入相关端点的说明。private endpoints 的几句在本轮改写：去掉「today」并把声明核验句改成「does not independently verify」；仅更新锚点上下文，未改变声明机制，也没有本轮 deployments→endpoints 的改名。方向为 weakened：以前表格笼统称 Vertex 在强制 ZDR 后仍可用，现在明确非企业账户默认可放行不满足严格 ZDR、可能保留标记 prompt 的端点。结论字段不变：API 的 ZDR 仍为 yes/opt_in，企业为 yes/by_agreement，免费档为 no，BYOK 为 yes/by_agreement，网页对话为 yes/default；保留期限的各档整体判据也不变。API 和企业档的 ZDR、retention 增加限定说明及锚点；私有端点核验句的锚点上下文随本轮改写修正。旧 HTML selector 上下文是遗留问题，清理它不属于本轮厂商变化。"
summary_en = "In #977 the ZDR page changed the Google model-group row from '| **Google** | Removes AI Studio endpoints (Vertex remains available) |' to '| **Google** | Removes AI Studio endpoints. Vertex endpoints that use Safety Retention remain available only if Safety Retention is allowed (see Google Safety Retention) |'. A new Google Safety Retention section says that from October 18, 2026 Google requires Safety Retention for Google models served through Vertex; Google does not retain prompts by default but may keep safety-classifier-flagged prompts for up to 90 days for abuse monitoring, does not train on retained prompts, and these endpoints do not meet strict ZDR. Zero retention only excludes these endpoints (making most Google models unavailable), while Safety retention allowed admits them; without a choice enterprise accounts default to the former and other accounts to the latter. The gate also covers other models using Safety Retention, such as open-weight models on Vertex (guardrail field allow_safety_retention_other); the page gives no separate retention period for those models, so Google's 90 days must not be generalized. The request-level sentence changed from 'When `zdr` is set to `true`, the request will only be routed to endpoints that have a Zero Data Retention policy.' to 'When `zdr` is set to `true`, the request is routed only to endpoints that have a Zero Data Retention policy.', with a new qualification admitting Safety Retention endpoints only when allowed. Several private-endpoint sentences were also rewritten in this round (removing 'today' and changing the attestation-verification wording to 'does not independently verify'); the declaration mechanism is unchanged, so only selector context was updated. The deployments-to-endpoints rename belonged to #875, not #977. Direction is weakened: where the old row broadly said Vertex remained available under ZDR enforcement, the new text explicitly allows non-strict endpoints that may retain flagged prompts by default on non-enterprise accounts. No verdict field changed: API ZDR remains yes/opt_in, enterprise yes/by_agreement, free tier no, BYOK yes/by_agreement and chat yes/default; tier-wide retention bases also remain unchanged. API and enterprise ZDR/retention gained scoped evidence points, and the private-endpoint verification selector context was updated for this round's rewrite. Cleaning stale HTML selector context was a pre-existing bookkeeping correction, not a vendor change in #977."
issue = "https://github.com/arcships/zdr-monitor/issues/980"
