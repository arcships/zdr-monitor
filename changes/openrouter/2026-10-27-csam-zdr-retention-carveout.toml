summary_zh = "ZDR 文档与 Data Collection 页同轮改写 OpenRouter 自身保留口径，并新增 CSAM 相关例外。ZDR 页页首新增一则标记为「Planned update (October 27, 2026)」的提示：OpenRouter will screen all inference requests, including ZDR traffic, for child sexual abuse material (CSAM) in flight；被标记为疑似 CSAM 的内容 may be retained for human review, reporting, and preservation where required by law；提示并写明这不授权一般性保留或用于模型训练，且「We're updating this page and our related terms.」。该提示仍用 will screen 的计划语气，故台账只按已公告/计划记录筛查，不把它写成已生效。与此同时，ZDR 页「OpenRouter's Retention Policy」的旧句「OpenRouter itself has a ZDR policy; your prompts are not retained unless you specifically opt in to prompt logging.」改写为现在时的「For inference content covered by OpenRouter's ZDR policy, we do not retain prompts or responses after processing, except when you explicitly choose to have us store them or when retention is needed for CSAM review, reporting, and related legal preservation.」，并新增一句「CSAM screening will also apply to requests covered by OpenRouter's ZDR policy.」。改写后的句子同时把承诺限定为「受 OpenRouter ZDR 政策覆盖的推理内容」，不再是一句无条件的「OpenRouter itself has a ZDR policy」。Data Collection 页也把页首旧句「Any prompt retention on OpenRouter is always opt-in.」改为现在时的「OpenRouter retains prompts only when you opt in, or when retention is needed for CSAM review, reporting, and related legal preservation.」，把默认不存储句「OpenRouter does not store your prompts or responses, *unless* you opt in to one or both of the following:」改为「…unless you opt in to one or both of the following, or content is flagged as potential CSAM:」，并新增一段仍用 will screen 的 CSAM screening 说明。页首同轮还删去旧句「OpenRouter has never shared, sold, or licensed underlying prompt data to any third party.」，改为「OpenRouter has never sold or licensed prompt data. We share it only to deliver the service or meet legal duties, such as NCMEC reports.」——这是共享口径的澄清，服务于 CSAM 上报/法定留存语境，不改变五维结论。方向记为 weakened：现在时的默认不存储句与保留政策句都加入了 CSAM 复核、上报与法定留存例外，ZDR 与默认不存储不再是绝对承诺；筛查本身仍为计划中，不计为已生效。结论字段未变：api 档 zdr 仍为 yes/opt_in，free-tier 仍为 no，byok 仍为 yes/by_agreement，enterprise 仍为 yes/by_agreement，consumer_chat 仍为 yes/default；各档 retention 的 object 与 basis 也保持原值（api/free-tier/byok/consumer_chat 为 mixed/undisclosed，enterprise 为 mixed/as_needed）。锚点 openrouter-zdr-own-retention-policy-zdr 改绑到改写后的现在时句子；新增 openrouter-zdr-csam-screening-exception-zdr（计划提示）、openrouter-datacollection-csam-retention-retention（Data Collection 现在时保留句）与 openrouter-datacollection-chat-interface-scope-zdr（聊天/API 适用范围）等锚点。consumer_chat 与 free-tier 的 ZDR 说明改绑到 Data Collection 的默认不存储句及 FAQ，不再用 ZDR 页未写例外来推断覆盖范围。同轮把 private deployments 统一改称 private endpoints、把 <Note>/<Warning>/<Tip> 改为 blockquote、替换 ZDR 端点表的代码块，均与五维无关。"
summary_en = "The ZDR page and the Data Collection page rewrote OpenRouter's own retention policy in the same round and added a CSAM-related exception. At the top of the ZDR page, a note labelled 'Planned update (October 27, 2026)' says OpenRouter will screen all inference requests, including ZDR traffic, for child sexual abuse material (CSAM) in flight; content flagged as potential CSAM may be retained for human review, reporting, and preservation where required by law; the note adds that this does not permit general retention or use for model training and that 'We're updating this page and our related terms.' Because the note still uses the planned wording 'will screen', the ledger records the screening only as announced/planned, not as already in force. In the same round, the old sentence under 'OpenRouter's Retention Policy', 'OpenRouter itself has a ZDR policy; your prompts are not retained unless you specifically opt in to prompt logging.', was rewritten in the present tense as 'For inference content covered by OpenRouter's ZDR policy, we do not retain prompts or responses after processing, except when you explicitly choose to have us store them or when retention is needed for CSAM review, reporting, and related legal preservation.', with an added sentence 'CSAM screening will also apply to requests covered by OpenRouter's ZDR policy.' The rewritten sentence also narrows the promise to 'inference content covered by OpenRouter's ZDR policy' rather than an unconditional statement that OpenRouter itself has a ZDR policy. The Data Collection page likewise replaced the old header sentence 'Any prompt retention on OpenRouter is always opt-in.' with the present-tense 'OpenRouter retains prompts only when you opt in, or when retention is needed for CSAM review, reporting, and related legal preservation.', changed the default no-store sentence from 'OpenRouter does not store your prompts or responses, *unless* you opt in to one or both of the following:' to '...unless you opt in to one or both of the following, or content is flagged as potential CSAM:', and added a CSAM screening paragraph that is still worded with 'will screen'. In the same round the header also replaced 'OpenRouter has never shared, sold, or licensed underlying prompt data to any third party.' with 'OpenRouter has never sold or licensed prompt data. We share it only to deliver the service or meet legal duties, such as NCMEC reports.' — a clarification of the sharing wording that fits the CSAM reporting/legal-preservation context and does not change any verdict. Direction is weakened: the present-tense default no-store sentence and retention-policy sentence now include CSAM review, reporting and legally required preservation as an exception, so ZDR and the default no-store promise are no longer absolute; the screening itself remains announced and is not recorded as in force. No verdict field changed: zdr remains yes/opt_in on api, no on free-tier, yes/by_agreement on byok and enterprise, and yes/default on consumer_chat; retention keeps mixed/undisclosed on api, free-tier, byok and consumer_chat and mixed/as_needed on enterprise. The anchor openrouter-zdr-own-retention-policy-zdr is rebound to the rewritten present-tense sentence, and new anchors cover the planned note (openrouter-zdr-csam-screening-exception-zdr), the Data Collection present-tense retention sentence (openrouter-datacollection-csam-retention-retention) and the chat/API scope sentence (openrouter-datacollection-chat-interface-scope-zdr). The consumer_chat and free-tier ZDR descriptions are rebound to the Data Collection default no-store sentence and the FAQ rather than inferring coverage from the ZDR page's silence about exceptions. The same round renamed 'private deployments' to 'private endpoints', converted <Note>/<Warning>/<Tip> to blockquotes, and replaced the ZDR endpoints table code block; none of that touches the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/877"
