summary_zh = "BYOK 文档「Declaring a Data Region on a Key」一节改写：把区域声明机制从 OpenAI 键扩展到 OpenAI 与 Azure 键——正文由「your own OpenAI account」「an OpenAI key card」改为「your own OpenAI or Azure account」「an OpenAI or Azure key card」，声明内容由「where your own OpenAI account processes requests」改为「where your own OpenAI project or Azure resource processes requests」，并新增一条 bullet：区域域名下没有匹配声明的 OpenAI/Azure 键「is never used on eu.openrouter.ai or us.openrouter.ai, even when the provider's shared endpoint is in-region」，因为 OpenRouter 把这些键发往客户自有主机（OpenAI 区域主机或客户 Azure 资源），只能依赖声明而非自有端点记录。处理地结论方向不变：仍是客户自述（OpenRouter 不核验），byok 档 processing_region 仍为未披露，不编码为任何区域。相关锚点由旧句改绑到改写后的原句。"
summary_en = "The BYOK page's 'Declaring a Data Region on a Key' section was rewritten to extend the region declaration mechanism from OpenAI keys to OpenAI and Azure keys: 'your own OpenAI account' / 'an OpenAI key card' became 'your own OpenAI or Azure account' / 'an OpenAI or Azure key card', the attestation became 'where your own OpenAI project or Azure resource processes requests', and a new bullet was added stating that on a regional domain an OpenAI or Azure key without a matching declaration 'is never used on eu.openrouter.ai or us.openrouter.ai, even when the provider's shared endpoint is in-region', because OpenRouter sends those keys to a host the customer controls (an OpenAI regional host or the customer's Azure resource) and so relies on the declaration rather than its own endpoint record. The processing-region verdict is unchanged: it still rests on the customer's own attestation (OpenRouter does not verify it), so the BYOK tier's processing_region remains undisclosed and is not coded to any region. The affected anchor was rebound from the old sentence to the rewritten one."
issue = "https://github.com/arcships/zdr-monitor/issues/371"
