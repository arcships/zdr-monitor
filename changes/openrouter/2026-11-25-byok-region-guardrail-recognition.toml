summary_zh = "#1420 的 BYOK 文档改写了区域声明与 `allowed_data_regions` guardrail 的关系。旧文：「A guardrail that restricts `allowed_data_regions` does not yet recognize the declaration. It judges every endpoint, including your key’s, by OpenRouter’s own classification, so under such a guardrail the key’s endpoint for a shared endpoint outside the region is removed even though the region declaration would otherwise allow it. Until the guardrail learns about declarations, a region declaration only widens routing for requests whose guardrails do not restrict `allowed_data_regions`.」新文：「A guardrail that restricts `allowed_data_regions` recognizes the declaration under the same rules. Your key’s endpoint passes the guardrail when the key declares a region the guardrail allows, the declaration can apply to that endpoint, and the provider supports a declared region (OpenAI, Azure, or Anthropic). For any other provider, the guardrail judges your key’s endpoint by OpenRouter’s classification only. OpenRouter’s own endpoints are still judged by OpenRouter’s classification, so a declaration never makes an OpenRouter-credit endpoint pass the guardrail.」即区域声明在 guardrail 下从「尚不识别」改为「按同一规则识别」，但仍只适用于 OpenAI/Azure/Anthropic，其它 provider 仍按 OpenRouter 分类判定，声明也不能让 OpenRouter 自己计费的端点通过。byok 档 processing_region 结论未变（仍为 basis=undisclosed、不编码区域）：新文只说明声明与 guardrail 的交互，没有披露上游主机实际处理地，也没有改变声明不被 OpenRouter 核验这一点。本轮新增锚点 openrouter-byok-region-guardrail-recognition-region 与一条说明。同轮其余改动不涉及五个维度，未记录：共享容量回退新增第四档「Never use any other provider or key for this key’s models」及 `is_exclusive` 字段，属于路由与密钥范围控制，没有保留、训练、ZDR 或处理地表述；Vertex Batch API 的 Google 权限说明改为要求两个 service agent，属于部署配置，不涉及数据保留或处理地；其余为格式与示例调整。"
summary_en = "In #1420 the BYOK page rewrote how a region declaration interacts with the `allowed_data_regions` guardrail. The old text said: \"A guardrail that restricts `allowed_data_regions` does not yet recognize the declaration. It judges every endpoint, including your key’s, by OpenRouter’s own classification, so under such a guardrail the key’s endpoint for a shared endpoint outside the region is removed even though the region declaration would otherwise allow it. Until the guardrail learns about declarations, a region declaration only widens routing for requests whose guardrails do not restrict `allowed_data_regions`.\" The new text says: \"A guardrail that restricts `allowed_data_regions` recognizes the declaration under the same rules. Your key’s endpoint passes the guardrail when the key declares a region the guardrail allows, the declaration can apply to that endpoint, and the provider supports a declared region (OpenAI, Azure, or Anthropic). For any other provider, the guardrail judges your key’s endpoint by OpenRouter’s classification only. OpenRouter’s own endpoints are still judged by OpenRouter’s classification, so a declaration never makes an OpenRouter-credit endpoint pass the guardrail.\" The declaration thus moved from 'not yet recognized' to 'recognized under the same rules', still limited to OpenAI, Azure, and Anthropic; for other providers the guardrail keeps judging by OpenRouter's own classification, and a declaration still cannot make an OpenRouter-credit endpoint pass. The byok tier's processing_region verdict is unchanged (still basis=undisclosed, no coded region): the new text only explains how a declaration interacts with guardrails, does not disclose where the upstream host actually processes requests, and does not change the fact that OpenRouter does not verify the declaration. New anchor openrouter-byok-region-guardrail-recognition-region and one explanatory point were added. The other changes in this round do not touch the five dimensions and were not recorded: the shared-capacity fallback gained a fourth level, 'Never use any other provider or key for this key’s models', plus the `is_exclusive` field, which is routing and key-scope control with no retention, training, ZDR, or processing-location statement; the Vertex Batch API Google permissions text now requires two service agents, which is deployment configuration with no retention or processing-region statement; the rest is formatting and example code."
issue = "https://github.com/arcships/zdr-monitor/issues/1421"
