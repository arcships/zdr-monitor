summary_zh = """
《Cursor Master Services Agreement》整页更新（Last updated 由 2026-08-13 改为 2026-10-09）。与五个维度相关的合同层改动有三处：(1) 前言把 "the Data Processing Agreement" 改为 "the Anysphere Data Processing Addendum (DPA), which is incorporated into this Agreement by reference"，§11.1 相应由 "the Anysphere Data Processing Addendum (DPA) applies and is incorporated into this Agreement by reference" 缩短为 "the DPA applies"——DPA 仍并入协议，role 的 processor 认定与 retention/zdr 的合同层挂钩不变，属改写措辞；(2) §1 新增定义 §1.7 "Key Technology Providers"＝"the third-party providers of (a) AI models and (b) cloud hosting infrastructure, in each case used by Anysphere or its Affiliates to deliver the core functionality of the Service"；该术语只随 Affiliates 一并写进 §7.2 免责（"ANYSPHERE, ITS AFFILIATES, AND THEIR KEY TECHNOLOGY PROVIDERS HEREBY DISCLAIM ALL WARRANTIES..."），§8/§9 责任相关条款新增的只有 Affiliates（§8.3 "Anysphere, its Affiliates, and their respective officers, directors, employees, and agents" 被列为 indemnitee；§9.1 "EITHER PARTY OR ITS AFFILIATES BE LIABLE"；§9.2 "EACH PARTY'S (AND ITS AFFILIATES') TOTAL CUMULATIVE LIABILITY"），Key Technology Providers 并未进入 §8/§9——第三方 AI 模型/云托管方只被 §7.2 免责覆盖，没有被写进客户赔偿义务或责任上限；属责任划分，未就该等第三方如何处理数据作出任何承诺；(3) §14.4 由单方改约条款 "Anysphere may update this MSA at any time by providing reasonable notice... If, in our sole judgment, an update materially impacts your rights or obligations, Anysphere will provide at least thirty (30) days' notice before the update goes into effect..." 改为 "This MSA may only be amended or modified by a written agreement signed by both Parties"，取消单方改约与 30 日预告。另新增 §14.11 Affiliates（含 SpaceXAI LLC）为第三方受益人、§13.4 陪审团弃权、§13.2 增加 Tarrant County 法院、§14.6 允许转让给 Affiliates、§1.1 改写 Affiliate 定义。各档结论值全部不变：§3.3 "ANYSPHERE WILL NOT USE CUSTOMER DATA OR SUGGESTIONS TO TRAIN, OR ALLOW ANY THIRD PARTY TO TRAIN, ANY AI MODELS, UNLESS CUSTOMER EXPLICITLY AGREES TO SUCH USE." 一字未动，Teams/Enterprise 的 training 仍以该条为合同层证据；§10.3 的 30 日下载 / 31 日删除条款未动，retention 不变；processing_region（Teams 看 DPA §13 第三国、Enterprise 的 US-only 驻留）不受影响。
"""
summary_en = """
The Cursor Master Services Agreement was updated across the page (Last updated moved from August 13, 2026 to October 9, 2026). Three contract-layer edits relate to the five dimensions: (1) the preamble now reads "the Anysphere Data Processing Addendum (DPA), which is incorporated into this Agreement by reference" instead of "the Data Processing Agreement", and Section 11.1 shrank from "the Anysphere Data Processing Addendum (DPA) applies and is incorporated into this Agreement by reference" to "the DPA applies" — the DPA is still incorporated, so the processor finding for role and the contract-layer hook for retention/zdr are unchanged, this is a rewording; (2) a new definition, Section 1.7 "Key Technology Providers", reads "the third-party providers of (a) AI models and (b) cloud hosting infrastructure, in each case used by Anysphere or its Affiliates to deliver the core functionality of the Service"; the term was added to the Section 7.2 disclaimers together with Affiliates ("ANYSPHERE, ITS AFFILIATES, AND THEIR KEY TECHNOLOGY PROVIDERS HEREBY DISCLAIM ALL WARRANTIES..."), whereas Sections 8 and 9 gained only Affiliates (Section 8.3 "Anysphere, its Affiliates, and their respective officers, directors, employees, and agents" as indemnitees; Section 9.1 "EITHER PARTY OR ITS AFFILIATES BE LIABLE"; Section 9.2 "EACH PARTY'S (AND ITS AFFILIATES') TOTAL CUMULATIVE LIABILITY"). Key Technology Providers did not enter Sections 8 or 9: the third-party AI model and cloud hosting providers are covered only by the Section 7.2 disclaimers and are not written into the customer indemnity or the liability cap; this is liability allocation only and makes no commitment about how those third parties handle data; (3) Section 14.4 changed from the unilateral-update clause ("Anysphere may update this MSA at any time by providing reasonable notice... If, in our sole judgment, an update materially impacts your rights or obligations, Anysphere will provide at least thirty (30) days' notice before the update goes into effect...") to "This MSA may only be amended or modified by a written agreement signed by both Parties", removing unilateral amendment and the 30-day notice. A new Section 14.11 names Anysphere's Affiliates (including SpaceXAI LLC) as third-party beneficiaries, together with a Section 13.4 jury trial waiver, Tarrant County added to Section 13.2, assignment to Affiliates allowed under Section 14.6, and a rewritten Affiliate definition in Section 1.1. No tier verdict value changes: Section 3.3 ("ANYSPHERE WILL NOT USE CUSTOMER DATA OR SUGGESTIONS TO TRAIN, OR ALLOW ANY THIRD PARTY TO TRAIN, ANY AI MODELS, UNLESS CUSTOMER EXPLICITLY AGREES TO SUCH USE.") is word-for-word unchanged and remains the contract-layer evidence for Teams/Enterprise training; the Section 10.3 30-day download / 31-day deletion clause is unchanged, so retention is unaffected; and processing_region (Third Country processing under DPA Section 13 for Teams, US-only residency for Enterprise) is untouched.
"""
