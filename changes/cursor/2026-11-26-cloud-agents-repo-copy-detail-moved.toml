For all three Cloud Agents tiers the retention verdict fields are unchanged (days=30, object=repository_snapshot, basis=fixed_period). The old exact of anchor cursor-governance-cloud-agents-repo-copy no longer resolves and was rebound to the remaining sentence "Encrypted copies of repositories that Cloud Agents work on" plus the suffix "See what data is stored, where, and for how long."; a new anchor, cursor-cloud-agent-runtime-workspace, binds the runtime-workspace row, and the three tier points now state both objects instead of claiming the 30-day bound is the only current statement for repository copies.

