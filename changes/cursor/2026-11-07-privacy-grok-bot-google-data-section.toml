ject) change. The Section 2 training sentence and the processing-region paragraph are untouched, so the existing anchors cursor-privacy-training-exceptions and cursor-privacy-global-processing still resolve uniquely with their exact/prefix/suffix. The same revision reworded the Payment Information bullet and changed the page date; these concern payment scope and formatting, not the five dimensions. Grok Bot has no separate product tier in providers/cursor.toml (only the Enterprise processing_region note mentions that US-only residency covers Grok Bot), so this round records the vendor's new clause without changing any verdict or anchor.
