cursor.com/privacy 更新（Last updated 由 2026-09-29 改为 2026-11-06，快照 PR #1131）。与五个维度相关的是新增 §7「Google user data in Grok Bot」（原 §7/§8 顺延为 §8/§9）：连接 Google 账号后，Grok Bot 读取 Gmail、Google Calendar、Google Drive、Google Docs/Sheets/Slides 与账号邮箱。训练方面新增「**AI training.** For users who opt to connect to Google Apps via Google OAuth, we shall not use any Google Apps content for any of our internal AI or other training purposes (such as training our machine learning models), including developing new products or services based on such content.」——对通过 Google OAuth 接入的 Google Apps 内容作出不用于内部 AI 或其他训练目的的承诺，范围仅限该类内容。保留方面新增「**Storage and deletion.** Grok Bot keeps conversations, including any Google data in them, until you delete the bot or your account. Team admins can set a retention period of 30 to 365 days, after which messages and attachments are deleted automatically. You can disconnect Google at any time in Grok Bot or in your Google Account settings, and disconnecting immediately deletes the Google tokens we hold.」——为 Grok Bot 对话（含其中的 Google 数据）新增保留与删除说明：保留至删除 bot 或账号，团队管理员可把保留期设为 30 至 365 天，断开 Google 连接立即删除 Cursor 持有的 Google token；该句没有给出无需用户操作的自动删除期限。该节只针对 Grok Bot 的 Google 用户数据；providers/cursor.toml 现有档位（Free/Pro、Teams、Enterprise、Cloud Agents）的 training 结论分别以 Inputs/Suggestions 的 §2 规则、Privacy Mode 默认值与合同禁令、Cloud Agent 的 Privacy Mode 前提为对象，retention 结论的 object 为 input_output 或 repository_snapshot，均不因此改变（mark/mode/basis/days/object 全部不变）。§2 训练句与 processing_region 引用的处理地段落一字未动，既有锚点 cursor-privacy-training-exceptions 与 cursor-privacy-global-processing 的 exact/prefix/suffix 仍可唯一定位。同轮改写 Payment Information 一句、更新页首日期，分别涉及付款对象与页面格式，不在五个维度内。Grok Bot 在 providers/cursor.toml 中没有独立 product 档（仅 Enterprise processing_region 的说明点提及 US-only 驻留覆盖 Grok Bot），故本轮只记录厂商新增条款，不改任何档位结论与引文。
