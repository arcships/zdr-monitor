summary_zh = """
Cloud Agent 安全文档把 VM 快照的保留期由「Rolling 90 days of inactivity; each start or resume extends it, then automatic deletion」改为「Rolling 30 days of inactivity; each start or resume extends it, then automatic deletion」。同一改动在页内出现四处：数据表 VM snapshots 行、表后说明「they follow the 90-day inactivity window above」→「30-day inactivity window」、Data deletion 表「Automatic after 90 days of inactivity」→「30 days」、FAQ「Snapshots are deleted after 90 days of inactivity」→「30 days」。含克隆代码的 VM 快照不再在 90 天不活动后删除，而是在 30 天后自动删除；每次启动或恢复仍会重置计时，且快照仍不能按需删除。方向上保留期缩短，对用户收紧。三个 Cloud Agents 档的 retention 结论只改期限数值（days 90→30，object=repository_snapshot、basis=fixed_period 不变），zdr 仍为 no（VM 快照与对话状态仍由 Cursor 保存），training、processing_region、role 均不受影响。同次快照还删除了两处 repository blocklist 描述（Protected Git Scopes 之外「exclude repositories with a blocklist」），属访问控制而非五个维度；导航新增 Release Notes、Rollouts、BDK 等条目属页面结构变化。
"""
summary_en = """
The Cloud Agent security page changed the VM snapshot retention from "Rolling 90 days of inactivity; each start or resume extends it, then automatic deletion" to "Rolling 30 days of inactivity; each start or resume extends it, then automatic deletion". The same change appears in four places on the page: the VM snapshots row of the data table, the paragraph after the table ("they follow the 90-day inactivity window above" → "30-day inactivity window"), the Data deletion table ("Automatic after 90 days of inactivity" → "30 days"), and the FAQ ("Snapshots are deleted after 90 days of inactivity" → "30 days"). VM snapshots, including cloned code, are now deleted automatically after 30 days of inactivity instead of 90; each start or resume still resets the timer, and snapshots still cannot be deleted on demand. The direction is strengthened for the user because the retention period is shorter. For all three Cloud Agents tiers only the retention period value changed (days 90→30; object=repository_snapshot and basis=fixed_period unchanged); zdr remains no because Cursor still stores VM snapshots and conversation state, and training, processing_region and role are unaffected. The same snapshot also removed two repository blocklist sentences ("exclude repositories with a blocklist" beyond Protected Git Scopes), which concern access control rather than the five dimensions, and added navigation entries (Release Notes, Rollouts, BDK), which are page structure changes.
"""
