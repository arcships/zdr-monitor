summary_zh = "Service-Specific Terms 的「Cloudflare Workers AI; AI Gateway」小节（页面 Last updated 由 2026-06-02 改为 2026-09-28）改写三处与本台账相关的条款，api 与 enterprise 两档结论均不变。(1) §1 把「Inputs/Outputs 构成 Customer Content」与「客户保留知识产权」两句并为一句：删去「For clarity,」、句首加「As between Cloudflare and you,」、以 and 连接；「Unless otherwise agreed, Cloudflare does not use any Customer Content to train generative AI tools」一字未动。(2) §3 把「Machine learning models」扩为「Machine learning models and search services」，定义依据由 Subscription Terms 改为 Agreement，新增「whether or not you have entered an agreement with the third-party provider」，并补入 AS IS / AS AVAILABLE 与不就搜索服务赔偿的免责（属许可与责任划分，不改变 Cloudflare 的 processor 地位）。(3) §9 在「Cloudflare does not reference or use any Customer Content except as needed to provide and improve the Services」前加「Unless otherwise agreed,」并补「as between Cloudflare and you,」，与 §1 的门控对齐；造成张力的「improve the Services」措辞未变。因 §1、§3 原引文失效，已把 sst-dp-inputs-outputs-customer-content、sst-dp-models-are-third-party-products 两条锚点改绑到改写后的原句；training（mark=yes / by_contract）与 role（processor）结论不变。"
summary_en = "The 'Cloudflare Workers AI; AI Gateway' subsection of the Service-Specific Terms (page 'Last updated' changed from June 02, 2026 to September 28, 2026) rewrote three clauses tracked in this ledger; the verdicts on both the api and enterprise tiers are unchanged. (1) Section 1 merged 'Inputs/Outputs constitute Customer Content' and 'you retain intellectual property rights' into one sentence: 'For clarity,' was dropped, 'As between Cloudflare and you,' was added at the front, and the two halves were joined with 'and'; 'Unless otherwise agreed, Cloudflare does not use any Customer Content to train generative AI tools' is unchanged word for word. (2) Section 3 widened 'Machine learning models' to 'Machine learning models and search services', changed the definitional basis from 'Subscription Terms' to 'Agreement', added 'whether or not you have entered an agreement with the third-party provider', and added 'AS IS' / 'AS AVAILABLE' and no-indemnity wording for search services (licensing and liability allocation, not Cloudflare's processor status). (3) Section 9 gained 'Unless otherwise agreed,' before 'Cloudflare does not reference or use any Customer Content except as needed to provide and improve the Services' plus 'as between Cloudflare and you,', aligning it with Section 1's gate; the 'improve the Services' wording that creates the tension is unchanged. Because the old Section 1 and Section 3 quotations no longer resolve, anchors sst-dp-inputs-outputs-customer-content and sst-dp-models-are-third-party-products were rebound to the rewritten sentences; the training (mark=yes / by_contract) and role (processor) verdicts are unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/365"
