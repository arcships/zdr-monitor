summary_zh = """Trust Center FAQ 第 3 条（What data do you collect, and for how long is it retained?）改写并收窄零保留承诺的范围：删去「Zero Data Retention is the default for all endpoints, including serverless API calls」与「Our no-retention commitment applies to the substantive content of your API inputs and outputs across all endpoints, including serverless API calls.」两句，新增「For clarity, this commitment applies solely to Novita AI’s own processing of your content in connection with Novita-Managed Models. It does not apply to your content submitted to, or processed through, Third-Party APIs, which is subject to the applicable Model Terms and the relevant third-party provider’s own policies.」以及指向 https://novita.ai/models 的 Third-Party API/Model Terms 清单说明。此前 FAQ 的「all endpoints」口径与 TOS §10.2/§6.4 的模型类别限定冲突；本次修改使 FAQ 与合同一致，冲突消失。按量 API 与企业版两档的结论值不变：training 仍为 no（TOS §6.4 明文允许 Model Provider 训练）、zdr 仍为 no（Third-Party API 一跳被排除在 ZDR 之外）、retention 仍为 basis=undisclosed（第三方路径无期限、托管模型路径为无固定天数的上限）。GPU 云档不涉及 API 内容，结论不变。"""
summary_en = """FAQ item 3 ("What data do you collect, and for how long is it retained?") was rewritten and the scope of the zero-retention promise narrowed: the sentences "Zero Data Retention is the default for all endpoints, including serverless API calls" and "Our no-retention commitment applies to the substantive content of your API inputs and outputs across all endpoints, including serverless API calls." were removed, and a new sentence was added: "For clarity, this commitment applies solely to Novita AI’s own processing of your content in connection with Novita-Managed Models. It does not apply to your content submitted to, or processed through, Third-Party APIs, which is subject to the applicable Model Terms and the relevant third-party provider’s own policies." It also points to the Third-Party API / Model Terms list at https://novita.ai/models. Previously the FAQ's "all endpoints" wording conflicted with the model-category limit in TOS §10.2/§6.4; this change brings the FAQ in line with the contract, so the conflict is gone. Verdict values for the pay-as-you-go API and enterprise tiers are unchanged: training stays no (TOS §6.4 expressly permits a Model Provider to train), zdr stays no (the Third-Party API hop is excluded from ZDR), and retention stays basis=undisclosed (no period on the third-party path; an upper bound with no fixed day count on the managed-model path). The GPU Cloud tier does not concern API content and is unchanged."""
issue = "https://github.com/arcships/zdr-monitor/issues/1495"
