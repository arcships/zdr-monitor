summary_zh = """《Novita AI Terms of Service》Updated 由 August 5, 2026 改为 November 27, 2026。§6 由「Model Availability」整节替换为「Models and Model Terms」（§6.1–§6.10）：§6.1 区分 Novita-Managed Models 与 Third-Party APIs，§6.4 Data Handling for Third-Party APIs 写明提交给 Third-Party API 的 Inputs/Outputs 由相应 Model Provider 在其自有基础设施上按适用 Model Terms 处理；「Novita AI's data handling commitments under Section 10, including the Zero Data Retention policy set out in Section 10.2, apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider」；并明示「A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms」。§10.2 主句（默认不训练、不超期保留、安全筛查不构成保留）逐字未变，但末尾新增范围句「For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.」旧正文 §6 只有 Model Availability，§10.2 也没有模型类别限定。按量 API 与企业版两档都通过同一份 TOS 的 Services 访问 Models，§6.1 明示 Services 同时提供 Novita-Managed Models 与 Third-Party APIs，因此整条链存在一个合同明文允许训练与保留的跳：training 由 yes 改为 no、zdr 由 yes 改为 no、retention 由 fixed_period（days=180）改为 basis=undisclosed。GPU 云档不受影响：§6 针对 Models/Third-Party APIs，§10.2 针对 Content，均不覆盖实例磁盘/卷/镜像数据。processing_region 与 role 的结论值未变，仅补边界说明；FAQ 第 3 条「all endpoints」的零保留表述与合同新范围冲突，两条并列保留、以合同为准。"""
summary_en = """The 'Updated' date on the Novita AI Terms of Service moved from August 5, 2026 to November 27, 2026. Section 6 was replaced wholesale: 'Model Availability' became 'Models and Model Terms' (§6.1-§6.10). §6.1 splits Models into Novita-Managed Models and Third-Party APIs; §6.4 (Data Handling for Third-Party APIs) says Inputs and Outputs sent to a Third-Party API are processed by the applicable Model Provider on its own infrastructure under the applicable Model Terms, that 'Novita AI's data handling commitments under Section 10, including the Zero Data Retention policy set out in Section 10.2, apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider', and that 'A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms'. The main §10.2 sentences (default no-training, no retention beyond generating and delivering Output, safety screening not constituting retention) are word-for-word unchanged, but a new scope sentence was appended: 'For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.' The old text had only a Model Availability section and no model-category limit in §10.2. Both the pay-as-you-go API and enterprise tiers access Models through the same TOS Services, and §6.1 states the Services provide access to both Novita-Managed Models and Third-Party APIs. The chain therefore contains a hop that the contract expressly allows to train and retain: training moves from yes to no, zdr from yes to no, and retention from fixed_period (days=180) to basis=undisclosed. The GPU Cloud tier is unaffected: §6 concerns Models/Third-Party APIs and §10.2 concerns Content, neither of which covers instance disk, volume or image data. processing_region and role values are unchanged, with boundary notes added; the FAQ's 'all endpoints' zero-retention wording now conflicts with the contract and both are kept, with the contract governing."""
issue = "https://github.com/arcships/zdr-monitor/issues/1471"
