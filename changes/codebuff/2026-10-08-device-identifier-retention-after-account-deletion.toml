summary_zh = "隐私政策（56524e038896a2bf，Last updated 10/08/2026）的 Device Identification 一节改写了账号删除后的保留条款。旧句：「We keep these records while the account exists and as long as needed to prevent abuse; for an account suspended for abuse, we may keep keyed hashes of its identifiers after the account is deleted, to enforce the suspension.」新句：「We store a keyed hash of these identifiers … We keep these records while the account exists and as long as needed to prevent abuse. When an account is deleted, we keep keyed hashes of its identifiers (email address, sign-in account ids, verified phone number and device identifiers, never the raw values) together with whether it was suspended or limited to a region, the free allowance it had used that day and which Earn rewards it was paid for, so that deleting an account and signing up again does not reset a suspension, a region limit, the daily allowance, a referral or an Earn reward.」变化：删除后保留 keyed hash 的范围由「仅因滥用被停权的账号」扩大到「所有被删除的账号」，并新增列举保留对象（邮箱、登录账号 id、已验证手机号、设备标识）连同区域限制状态、当日免费额度用量与已发放的 Earn 奖励；保留期限仍未量化，方向为放宽（删除后留存的数据更多、范围更广）。该句的对象是设备与账号标识及防滥用记录，不是本台账追踪的 Prompt and Project Data，因此五个维度的结论字段一律未变：managed 与 training-labeled 两档 retention 仍 object=input_output_code / basis=undisclosed，training、zdr、processing_region、role 均不变，providers/codebuff.toml 未作修改。"
summary_en = 'The Device Identification section of the Privacy Policy (56524e038896a2bf, Last updated 10/08/2026) rewrote its post-deletion retention clause. Old: "We keep these records while the account exists and as long as needed to prevent abuse; for an account suspended for abuse, we may keep keyed hashes of its identifiers after the account is deleted, to enforce the suspension." New: "We keep these records while the account exists and as long as needed to prevent abuse. When an account is deleted, we keep keyed hashes of its identifiers (email address, sign-in account ids, verified phone number and device identifiers, never the raw values) together with whether it was suspended or limited to a region, the free allowance it had used that day and which Earn rewards it was paid for, so that deleting an account and signing up again does not reset a suspension, a region limit, the daily allowance, a referral or an Earn reward." The retention of keyed hashes after deletion is broadened from "only accounts suspended for abuse" to "all deleted accounts", and the kept items are now enumerated (email address, sign-in account ids, verified phone number, device identifiers) together with region-limit state, the day free-allowance usage and paid Earn rewards; the retention period is still unquantified, so the direction is weakened (more data, wider scope, kept after deletion). The sentence concerns device and account identifiers and anti-abuse records, not the Prompt and Project Data this ledger tracks, so no verdict field changes: retention stays object=input_output_code / basis=undisclosed on both the managed and training-labeled tiers, and training, zdr, processing_region and role are unchanged; providers/codebuff.toml is left untouched.'
issue = "https://github.com/arcships/zdr-monitor/issues/545"
