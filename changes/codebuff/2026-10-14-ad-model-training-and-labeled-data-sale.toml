summary_zh = "隐私政策（56524e038896a2bf，Last updated October 13, 2026，Effective November 12, 2026）与 Terms of Service（63758b88db24f120，同日改版、同日生效）改写了训练、广告、标注数据、Codebase Evaluation 和数据范围条款。AI Training 旧句「We do not use Prompt and Project Data to train our or third-party AI models unless, before you use the applicable model or feature, we clearly state that the data may be used for AI training.」改为「Except to train the models we use to select and measure advertising, as described in Personalized Advertising, we do not use …」——默认仍不用于训练，但明确排除训练广告选择与衡量模型。与此同时，Codebase Evaluation 删除了旧句「AI training is permitted only as described in the next section.」，新正文改为「connecting a repository does not permit us or a partner to train AI models on it」。两句适用范围存在张力：前者针对连接仓库内容，后者针对更广义 Prompt and Project Data；政策未明确调和广告训练例外是否覆盖仓库内容，因此台账并列记录。Personalized Advertising 新增项目概况推导、自动审阅项目文件，以及公司和服务商训练广告模型；新增赞助问卷/任务披露，赞助方可能收到包括引用代码的 agent messages。AI Training 又新增「We may also share, license, or sell that data, including agent traces, to third parties, such as researchers and companies, who may use it for AI training, research, and other commercial purposes.」，How We Disclose Information 新增向购买或许可标注训练数据的第三方披露，并允许出售标注训练数据。Terms 新增标注训练 Content 的可转授许可。因此 managed 档 training 从 mark=yes、mode=default 改为 mark=no；training-labeled 档 training 仍为 mark=no，但补充第三方分享、许可、出售和 Terms 可转授许可证据，zdr 仍为 no。标注训练数据 retention 旧句「may not be removable after it is deidentified or incorporated into a model」改为「may not be removable after it is deidentified, incorporated into a model, or provided to a third party」，basis 仍为 undisclosed。Retention 同时新增账号删除后保留标识符 keyed hash 的统一条款：「When you delete your account, we keep keyed hashes of its identifiers, such as email address, phone number, identity document, and device identifiers, with its suspension, limit, and reward status, so that deleting an account does not reset a suspension, limit, or reward.」这取代了同一快照中 Device Identification 的旧句「When an account is deleted, we keep keyed hashes of its identifiers (email address, sign-in account ids, verified phone number and device identifiers, never the raw values) together with whether it was suspended or limited to a region, the free allowance it had used that day and which Earn rewards it was paid for, so that deleting an account and signing up again does not reset a suspension, a region limit, the daily allowance, a referral or an Earn reward.」，也取代了 Identity Verification 中旧句「When you delete your account, we ask Didit to erase your verification, except where the account was suspended for abuse; the keyed document hash is kept so that deleting an account does not reset the one-account-per-person rule.」。变化方向是把账号删除后的留存规则从设备识别/身份验证章节重写为统一的账号标识、停权、限制和奖励状态保留；这些标识、账号状态、证件 keyed hash 的变化不改变 Prompt and Project Data 的 retention verdict，但必须纳入变化历史。隐私政策还把 Prompt and Project Data 的旧定义「Prompts, messages, code, files, repository data, images, feedback, agent activity and tool traces, support communications and attachments, information about third parties, and other content you submit, connect, create, or modify through Service」改为「Prompts, messages, code, files, repository data, images, feedback, support messages, and other content you submit or connect, or that an agent reads or produces for you」，并新增 Agents on Your Device，规定 agent 可读取设备账号可访问的项目外文件、凭据、环境变量和其他数据，且「Anything an agent reads becomes Prompt and Project Data」；Terms 新增「AI agents act autonomously and may take actions you did not request or expect, including executing commands, deleting or corrupting data, interacting with external systems, and accessing files, credentials, environment variables, or other data available to them, including outside your project, and including that data in requests to model providers」。这些条款扩大了 Prompt and Project Data 的潜在范围，但未新增期限、角色术语或零保留承诺，故 retention 仍 object=input_output_code、basis=undisclosed，role 仍 unknown，zdr 与 processing_region 不变。"
summary_en = "The Privacy Policy (56524e038896a2bf, last updated October 13, 2026, effective November 12, 2026) and Terms of Service (63758b88db24f120, revised and effective the same day) rewrote the training, advertising, labelled-data, Codebase Evaluation, and data-scope provisions. The AI Training sentence 'We do not use Prompt and Project Data to train our or third-party AI models unless, before you use the applicable model or feature, we clearly state that the data may be used for AI training.' became 'Except to train the models we use to select and measure advertising, as described in Personalized Advertising, we do not use …' — the default remains no training, but advertising-selection and measurement model training is expressly carved out. The old Codebase Evaluation sentence 'AI training is permitted only as described in the next section.' was deleted and the revised paragraph now says 'connecting a repository does not permit us or a partner to train AI models on it'. The scopes remain in tension: the former addresses connected-repository content while the latter addresses broader Prompt and Project Data; the policy does not expressly reconcile whether the advertising exception reaches repository content, so the ledger records both without treating them as a blanket permission or prohibition. Personalized Advertising adds project-profile derivation, automatic review of project files, and company/service-provider training of advertising models; it also adds sponsored-survey and sponsored-task disclosure under which sponsors may receive agent messages that may quote code. AI Training adds 'We may also share, license, or sell that data, including agent traces, to third parties, such as researchers and companies, who may use it for AI training, research, and other commercial purposes.' How We Disclose Information adds disclosure to third parties that license or buy labelled training data and permits sale of data submitted through labelled training models or features. The Terms add a sublicensable licence for labelled-training Content. Accordingly, the managed tier changes from training mark=yes / mode=default to mark=no; the training-labeled tier remains mark=no, but gains evidence for third-party sharing, licensing, sale, and the Terms' sublicensable licence, while zdr remains no. The labelled-training Retention sentence changed from 'may not be removable after it is deidentified or incorporated into a model' to 'may not be removable after it is deidentified, incorporated into a model, or provided to a third party', with basis still undisclosed. Retention also gains the account-deletion identifier clause 'When you delete your account, we keep keyed hashes of its identifiers, such as email address, phone number, identity document, and device identifiers, with its suspension, limit, and reward status, so that deleting an account does not reset a suspension, limit, or reward.'. This replaces the same-snapshot Device Identification sentence 'When an account is deleted, we keep keyed hashes of its identifiers (email address, sign-in account ids, verified phone number and device identifiers, never the raw values) together with whether it was suspended or limited to a region, the free allowance it had used that day and which Earn rewards it was paid for, so that deleting an account and signing up again does not reset a suspension, a region limit, the daily allowance, a referral or an Earn reward.' and the old Identity Verification sentence 'When you delete your account, we ask Didit to erase your verification, except where the account was suspended for abuse; the keyed document hash is kept so that deleting an account does not reset the one-account-per-person rule.'. The old Privacy Policy Prompt and Project Data definition 'Prompts, messages, code, files, repository data, images, feedback, agent activity and tool traces, support communications and attachments, information about third parties, and other content you submit, connect, create, or modify through Service' was rewritten as 'Prompts, messages, code, files, repository data, images, feedback, support messages, and other content you submit or connect, or that an agent reads or produces for you'. It also adds Agents on Your Device: an agent may read files, credentials, environment variables, and other data accessible to the device account, including outside the project, and 'Anything an agent reads becomes Prompt and Project Data'. The Terms add 'AI agents act autonomously and may take actions you did not request or expect, including executing commands, deleting or corrupting data, interacting with external systems, and accessing files, credentials, environment variables, or other data available to them, including outside your project, and including that data in requests to model providers.'. These identifier, account-status, document-hash, and agent-scope changes do not alter the Prompt and Project Data retention verdict, but are included in the change history. They expand the potential Prompt and Project Data scope without adding a retention period, role terminology, or zero-retention commitment, so retention remains object=input_output_code / basis=undisclosed, role remains unknown, and zdr and processing_region are unchanged."
