summary_zh = "隐私政策新增「## Identity Verification」一节，Terms of Service 新增「## Identity Verification and Identity Lock」一节，并在隐私政策「How We Disclose Information」的披露清单里新增一条「Our identity verification provider, Didit」。新增隐私条款把厂商自己的身份验证服务商称作「our processor Didit (Didit Identity S.L.)」——此前政策里的 processor 只出现于支付处理商，这是第一处例外，所以旧结论里「the only occurrences of processor refer to payment processors」这句依据文字被同一轮新增条款作废。该节同时披露身份验证数据的保留规则：厂商只留验证结果、证件签发国与类型、证件号的 keyed hash 与评分，不留证件照片、自拍、证件上的姓名与出生日期；生物特征数据不超过必要期限，且在你最后一次交互后最多三年；完成账号删除请求时要求 Didit 抹除验证，仅因滥用被停权的账号例外，证件 keyed hash 保留以维持一人一号。ToS 同节另写明身份锁定在删除账号后仍然保留。这些条款的对象是身份验证数据（证件、自拍、生物特征、锁定状态），不是本台账追踪的 Prompt and Project Data，因此五个维度的结论字段全部未变：managed 档 role 仍 mark=unknown / kind=unknown，retention 仍 object=input_output_code / basis=undisclosed（厂商仍未公布提示词与项目数据的保留期限），zdr 仍 mark=unknown，processing_region 仍 codes=[US, global]。对 provider 文件的实质改动只有 role 的一处依据文字（改正被新增条款作废的表述，并补锚点 codebuff-identity-processor），未删除、未替换任何 [[source]]。"
summary_en = "The Privacy Policy gained a new '## Identity Verification' section, the Terms of Service gained a '## Identity Verification and Identity Lock' section, and the Privacy Policy's 'How We Disclose Information' list gained the bullet 'Our identity verification provider, Didit'. The new privacy text calls the company's identity-verification vendor 'our processor Didit (Didit Identity S.L.)'. Until this change the only use of processor in the policy was for payment processors, so the old evidence sentence 'the only occurrences of processor refer to payment processors' is invalidated by the same addition. The section also discloses retention rules for identity-verification data: the company keeps the outcome, issuing country and document type, a keyed hash of the document number, and the scores, but not the photos, selfie, or the name and date of birth from the document; biometric data is never retained longer than necessary and in any case no longer than three years after the last interaction; on account deletion it asks Didit to erase the verification, except for accounts suspended for abuse, keeping the keyed document hash to keep one account per person. The matching Terms section adds that the identity lock stays in place after account deletion. All of this concerns identity-verification data (document, selfie, biometrics, lock state), not the Prompt and Project Data this ledger tracks, so no verdict field changed on any tier: the managed tier keeps role mark=unknown / kind=unknown, retention object=input_output_code / basis=undisclosed (no prompt or project retention period is published), zdr mark=unknown, and processing_region codes=[US, global]. The only substantive provider-file change is one role evidence sentence, corrected because the addition invalidated it, plus its new anchor codebuff-identity-processor; no [[source]] was removed or replaced."
issue = "https://github.com/arcships/zdr-monitor/issues/403"
