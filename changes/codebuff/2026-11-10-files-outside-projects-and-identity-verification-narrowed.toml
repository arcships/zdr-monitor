summary_zh = "隐私政策（56524e038896a2bf，Last updated November 8, 2026，Effective November 12, 2026）新增「## Files Outside Your Projects」一节，并改写身份验证的触发条件。新节称 Freebuff Desktop 与 CLI「do not scan your computer or read arbitrary files on it」，项目外只读取 agent 读取或命令使用的文件、用户选择打开/附加/导入的文件、Freebuff 自有文件、为 shell/编辑器/Git/编码 agent 等开发者工具准备的设置、指令和 skills，以及设备和已安装软件信息；同时新增「We may also copy skills and instructions you set up for coding agents to your account」，并说明 Claude Code、Codex、MCP servers 等第三方 agent 和工具「may access files under their own terms」。身份验证旧句「You may be able to verify your identity from your account settings, and when we need to confirm that an account belongs to a unique person (for example, an account that shares a device with another account, or that shows signs of abuse) we may require it, including before the account can keep using free features.」改为「We ask for identity verification in one case only: when you confirm a full-access country from a connection flagged as a VPN or proxy, and choose to confirm it with an ID. You then verify from your account settings, after a phone number.」；「Verification is performed by our processor Didit (Didit Identity S.L.)」一句未变。判断：新增的文件访问范围明确了项目外读取的边界，但同时把开发者工具的 skills 与指令复制到账号，扩大了账号侧保存的数据范围（这些文件被 agent 读取时仍属 Prompt and Project Data）；厂商仍未公布 Prompt and Project Data 的保留期限，retention 仍 object=input_output_code / basis=undisclosed。身份验证由「共享设备或滥用迹象即可要求」收窄为「仅 VPN/代理连接下确认 full-access country 并选择用证件确认」这一种情形，方向对用户更有利，但涉及的是身份验证数据，未改变 Codebuff 对 Prompt and Project Data 的 retention 结论，也未改变 role（Didit 仍被称为 our processor，Codebuff 自身仍无 controller/processor 定性）。五维结论字段一律未变，故未改动 providers/codebuff.toml。"
summary_en = "The Privacy Policy (56524e038896a2bf, last updated November 8, 2026, effective November 12, 2026) adds a new '## Files Outside Your Projects' section and rewrites the trigger for identity verification. The new section says Freebuff Desktop and CLI 'do not scan your computer or read arbitrary files on it'; outside the projects the user opens, they read only files an agent reads or that its commands use, files and folders the user chooses to open, attach, or import, Freebuff's own files, settings, instructions, skills, and similar files for the shell, editors, Git, coding agents, and other developer tools, and information about the device, system, and installed software. It also adds 'We may also copy skills and instructions you set up for coding agents to your account' and says third-party agents and tools used in Freebuff, such as Claude Code, Codex, or MCP servers, 'may access files under their own terms'. The old identity-verification sentence 'You may be able to verify your identity from your account settings, and when we need to confirm that an account belongs to a unique person (for example, an account that shares a device with another account, or that shows signs of abuse) we may require it, including before the account can keep using free features.' becomes 'We ask for identity verification in one case only: when you confirm a full-access country from a connection flagged as a VPN or proxy, and choose to confirm it with an ID. You then verify from your account settings, after a phone number.' The sentence 'Verification is performed by our processor Didit (Didit Identity S.L.)' is unchanged. Assessment: the new section clarifies the boundary of file reads outside projects but also copies developer-tool skills and instructions to the account, expanding the account-side data scope (these files still become Prompt and Project Data when an agent reads them); the company still publishes no retention period for Prompt and Project Data, so retention remains object=input_output_code / basis=undisclosed. Identity verification narrows from 'may be required when an account shares a device or shows signs of abuse' to one case only (confirming a full-access country from a VPN or proxy connection and choosing ID verification), which is more favourable to users but concerns identity-verification data, not Prompt and Project Data; it changes neither the retention verdict nor role (Didit is still called our processor, and Codebuff itself still has no controller/processor characterisation). No verdict field changed, so providers/codebuff.toml is left untouched."
issue = "https://github.com/arcships/zdr-monitor/issues/1151"
