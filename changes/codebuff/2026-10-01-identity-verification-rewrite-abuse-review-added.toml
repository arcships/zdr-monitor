summary_zh = "隐私政策（56524e038896a2bf，Last updated 10/01/2026）与 Terms of Service（63758b88db24f120）同步改写了身份验证一节，并新增针对 Prompt and Project Data 的滥用审查条款。身份验证：隐私政策旧句「When we need to confirm that an account belongs to a unique person … we ask you to verify your identity with our processor Didit (Didit Identity S.L.).」改为「You can choose to verify your identity from your account settings, and when we need to confirm … we may ask you to. Verification is performed by our processor Didit (Didit Identity S.L.).」——厂商仍称 Didit 为「our processor」，但验证由强制改为用户可选；同时把「information about the network you connect from」加入 Didit 处理的数据，并删去旧句「In some countries Didit also checks the name and date of birth on your ID against official or financial records …」。ToS 同节旧句「we may require an account to verify the identity of the person using it before it can sign in to our products」改为「… before it can keep using free features」，新增「You may verify your identity from your account settings to get a verified badge」与「A verified badge does not exempt an account from these Terms.」，并新增身份锁定的连带停权句「A suspension for abuse applies to the person: if an account verified with an identity is suspended for how it was used, every other account verified with the same identity, including later ones, is suspended too.」。滥用审查：隐私政策新增「## Abuse Detection and Safety Review」一节，ToS 在「Prohibited Uses」清单末新增一段，均写明厂商可用自有系统与「service providers acting on our behalf」审查 Prompt and Project Data（提示词、消息、agent activity），必要时授权人员可审阅具体内容，相关数据与结果按 Retention 一节保留。判断：这些改动只涉及身份验证数据（证件、自拍、生物特征、身份锁定状态）与既有的滥用防范目的，未新增任何 Prompt and Project Data 的保留期限（retention 仍 object=input_output_code、basis=undisclosed），也未就 Codebuff 自身角色用 controller/processor 表态（role 仍 mark=unknown、kind=unknown），training、zdr、processing_region 未受影响，五维结论字段一律未变。唯一实质改动是 role 档的依据锚点 codebuff-identity-processor：旧引文被改写成新句，改绑到「Verification is performed by our processor Didit (Didit Identity S.L.)」。"
summary_en = "The Privacy Policy (56524e038896a2bf, Last updated 10/01/2026) and the Terms of Service (63758b88db24f120) were updated together: the identity-verification provisions were rewritten and new abuse-review clauses covering Prompt and Project Data were added. Identity verification: the Privacy Policy's old sentence 'When we need to confirm that an account belongs to a unique person … we ask you to verify your identity with our processor Didit (Didit Identity S.L.).' became 'You can choose to verify your identity from your account settings, and when we need to confirm … we may ask you to. Verification is performed by our processor Didit (Didit Identity S.L.).' — the company still calls Didit 'our processor', but verification moved from required to user-optional; 'information about the network you connect from' was added to the data Didit processes and the old sentence 'In some countries Didit also checks the name and date of birth on your ID against official or financial records …' was deleted. In the Terms the old 'we may require an account to verify the identity of the person using it before it can sign in to our products' became '… before it can keep using free features', with the new sentences 'You may verify your identity from your account settings to get a verified badge' and 'A verified badge does not exempt an account from these Terms.', plus the new identity-lock consequence 'A suspension for abuse applies to the person: if an account verified with an identity is suspended for how it was used, every other account verified with the same identity, including later ones, is suspended too.' Abuse review: the Privacy Policy gained a '## Abuse Detection and Safety Review' section and the Terms gained a paragraph at the end of the 'Prohibited Uses' list; both state that the company may review Prompt and Project Data (prompts, messages, agent activity) using its own systems and 'service providers acting on our behalf', that authorised personnel may review specific content when needed, and that the relevant data and results are retained as described in Retention. Assessment: these changes concern only identity-verification data (document, selfie, biometrics, identity-lock state) and the pre-existing abuse-prevention purpose; they publish no retention period for Prompt and Project Data (retention stays object=input_output_code, basis=undisclosed) and still name no controller/processor role for Codebuff itself (role stays mark=unknown, kind=unknown); training, zdr and processing_region are unaffected, and no verdict field changed on any tier. The only substantive provider-file change is the role tier's evidence anchor codebuff-identity-processor: the quoted sentence was rewritten, so it was rebound to 'Verification is performed by our processor Didit (Didit Identity S.L.)'."
issue = "https://github.com/arcships/zdr-monitor/issues/438"
