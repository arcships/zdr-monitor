summary_zh = "隐私政策（56524e038896a2bf，Last updated November 25, 2026，Effective December 26, 2026）删除了默认不用于训练的承诺，并改写了 AI Training、Retention 与许可的适用口径。旧 AI Training 段落「Except to train the models we use to select and measure advertising, as described in Personalized Advertising, we do not use Prompt and Project Data to train our or third-party AI models unless, before you use the applicable model or feature, we clearly state that the data may be used for AI training. A label or notice such as May use data for AI training means that Prompt and Project Data submitted through that model or feature may be retained and used by Company or the applicable provider to train, evaluate, and improve AI models and products.」以及末句「A general notice that data is collected or stored does not by itself permit these uses.」被整段替换为「Some models and features collect Prompt and Project Data, including agent traces, for AI training. In some countries and regions, and when you use a VPN or proxy, these are the only models available. We and the model provider may use this data to train, evaluate, and improve AI models and products, and we may share, license, or sell it to third parties, such as researchers and companies, for AI training, research, and other commercial purposes. We also use data to train the models that select and measure advertising, as described in Personalized Advertising. You agree to these uses when you sign up.」：以 label/notice 界定训练范围的机制被「采集 AI 训练数据的模型或功能」取代，默认不训练的承诺被删除，注册即视为同意训练；并明确在部分国家和地区以及使用 VPN 或代理时，可采集训练数据的模型是唯一可用的模型。Retention 旧句「retained longer when reasonably needed for legitimate business, security, legal, dispute-resolution, or clearly disclosed AI-training purposes. Data submitted through a model or feature labeled for AI training may be retained …」改为「… or AI-training purposes. Data submitted through a model or feature that collects data for AI training may be retained …」，删除「clearly disclosed」限定并改用 collect 口径；How We Disclose Information 与出售条款中的「labeled for AI training」也改为「that collect data for AI training」。Terms of Service（63758b88db24f120，同日改版、同日生效）把许可范围里的「the advertising, limited Codebase Evaluation, or clearly disclosed AI-training and related development uses」「For Content submitted through a model or feature labeled for AI training, this license is also sublicensable」「data retained under a clearly disclosed AI-training use」改为「AI-training and related development uses」「For Content submitted through a model or feature that collects data for AI training, this license is also sublicensable」「data retained for AI training」。此外，Personalized Advertising 新增广告与衡量服务商可收到已验证手机号的 hash 值，以及（在移动端设置允许时）设备广告标识符；Phone and Identity Verification 新增向广告与衡量服务商共享手机号 hash 的句子。判断：managed 与 training-labeled 两档的 training 仍为 mark=no（广告选择与衡量模型训练仍在，且默认不训练承诺已删除）；training-labeled 的 zdr 仍为 no、retention 仍为 object=input_output_code / basis=undisclosed，五维结论字段均未变。默认不训练承诺与「clearly disclosed」限定的删除、以及注册即同意训练和部分地域只能使用训练模型，均属对用户更不利的放宽，故按厂商原文变化记录；手机号 hash 与广告标识符的新披露不改变 role 的 unknown 结论。"
summary_en = "The Privacy Policy (56524e038896a2bf, last updated November 25, 2026, effective December 26, 2026) removes the default no-training promise and rewrites the scope of AI Training, Retention, and the Content licence. The old AI Training paragraph 'Except to train the models we use to select and measure advertising, as described in Personalized Advertising, we do not use Prompt and Project Data to train our or third-party AI models unless, before you use the applicable model or feature, we clearly state that the data may be used for AI training. A label or notice such as May use data for AI training means that Prompt and Project Data submitted through that model or feature may be retained and used by Company or the applicable provider to train, evaluate, and improve AI models and products.' and its closing sentence 'A general notice that data is collected or stored does not by itself permit these uses.' are replaced in full by 'Some models and features collect Prompt and Project Data, including agent traces, for AI training. In some countries and regions, and when you use a VPN or proxy, these are the only models available. We and the model provider may use this data to train, evaluate, and improve AI models and products, and we may share, license, or sell it to third parties, such as researchers and companies, for AI training, research, and other commercial purposes. We also use data to train the models that select and measure advertising, as described in Personalized Advertising. You agree to these uses when you sign up.'. The label/notice mechanism that bounded training is replaced by 'models and features that collect data for AI training', the default no-training promise is deleted, users are treated as agreeing to these uses at sign-up, and in some countries and regions and when using a VPN or proxy the training-collecting models are the only models available. In Retention, 'retained longer when reasonably needed for legitimate business, security, legal, dispute-resolution, or clearly disclosed AI-training purposes. Data submitted through a model or feature labeled for AI training may be retained …' becomes '… or AI-training purposes. Data submitted through a model or feature that collects data for AI training may be retained …', dropping the 'clearly disclosed' qualifier and switching to the collect wording; the same 'labeled for AI training' to 'that collect data for AI training' change appears in How We Disclose Information and the sale clause. The Terms of Service (63758b88db24f120, revised and effective the same day) change 'the advertising, limited Codebase Evaluation, or clearly disclosed AI-training and related development uses', 'For Content submitted through a model or feature labeled for AI training, this license is also sublicensable', and 'data retained under a clearly disclosed AI-training use' to 'AI-training and related development uses', 'For Content submitted through a model or feature that collects data for AI training, this license is also sublicensable', and 'data retained for AI training'. In addition, Personalized Advertising now says advertising and measurement providers may receive a hashed form of the verified phone number and, in mobile apps where device settings permit it, the device advertising identifier, and Phone and Identity Verification adds the same hashed-number sharing sentence. Assessment: training remains mark=no for both the managed and training-labeled tiers (advertising selection and measurement training remains, and the default no-training promise is gone); the training-labeled tier keeps zdr=no and retention object=input_output_code / basis=undisclosed, and no verdict field changes. Deleting the default no-training promise and the 'clearly disclosed' qualifier, agreeing to training at sign-up, and making training-collecting models the only option in some regions all loosen the policy and are recorded as a vendor-side change; the new phone-hash and advertising-identifier disclosures do not change the role verdict of unknown."
issue = "https://github.com/arcships/zdr-monitor/issues/1437"
