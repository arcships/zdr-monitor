summary_zh = "价格页 https://www.warp.dev/pricing 改版：页内「Warp Factories, now in Early Access」小段落被替换为独立的「Pricing for Warp Factories」定价区（新增 $0/month 的 Pay as you go 档，取消 Max 档）。旧版 Factories Business 一栏写「Admin-configurable data controls with ZDR」，新版该栏改为「Team telemetry and content controls」，整段不再出现任何 ZDR 表述；同轮该区整体重写（Build/Max 的 credits 措辞改为 usage、Enterprise 的 BYOLLM 等改写），Warp 终端各档（Free/Build/Max/Business/Enterprise）的价格与条款文字基本未变。原锚点 warp-pricing-factories-business-zdr 所引句子已从页面删除，且 Factories 段无等价新句可改绑，故删除该依据点及其锚点。paid-teams 档 zdr 结论字段未变（仍 mark=no / 依据 warp-cloud-storage）；页内仅存的一句 marketing ZDR 表述（Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers…，锚点 warp-pricing-zdr-marketing）与安全页各 ZDR 依据点均逐字未改。"
summary_en = "The pricing page (https://www.warp.dev/pricing) was redesigned: the in-page 'Warp Factories, now in Early Access' blurb was replaced by a standalone 'Pricing for Warp Factories' section (a new $0/month 'Pay as you go' tier was added; the Max tier was dropped). The old Factories Business tier read 'Admin-configurable data controls with ZDR'; the new Business tier lists 'Team telemetry and content controls' instead, and the section carries no ZDR wording at all. In the same round the section was rewritten wholesale (Build/Max 'credits' wording became 'usage', Enterprise/BYOLLM wording changed), while the Warp terminal tiers (Free/Build/Max/Business/Enterprise) are textually and pricewise essentially unchanged. The sentence quoted by the warp-pricing-factories-business-zdr anchor has been deleted from the page and no equivalent new sentence exists in the Factories section to rebind to, so the point and its anchor were removed. No verdict field changed on the paid-teams zdr row (still mark=no, basis anchor warp-cloud-storage); the one remaining marketing ZDR sentence on the page ('Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers...', anchor warp-pricing-zdr-marketing) and every ZDR point on the security page are verbatim unchanged."
issue = "https://github.com/arcships/zdr-monitor/issues/525"
