summary_zh = "价格页 https://www.warp.dev/pricing 改版并新增 Pricing FAQ。保留原 marketing 句「Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers…」，新增说明：ZDR 协议覆盖包括 Fireworks AI 在内的 supported LLM providers；受支持模型的提示词与输出须在响应生成后的固定期限内删除，且不得用于训练；ZDR 只适用于 Warp-provided inference，自有 API key、订阅、自定义端点或 LLM 的请求「sent directly to your provider under your own account and terms」。同一 FAQ 又称任何用户关闭 Help Improve Warp 即可为本人启用 full ZDR、Business/Enterprise 管理员可在 admin panel 为全员强制 ZDR；这两句与安全页「provider ZDR 管厂商保留、不管 Warp 存储」的区分并列保留，不据此翻转 zdr 结论。新增「Model provider ZDR」比较行与「Paid plans include frontier models from OpenAI, Anthropic, Google, and xAI, plus top open-source models like GLM 5.2, Kimi K3, and DeepSeek V4 hosted on Fireworks AI in the US.」句。受影响结论：business-enterprise 的 processing_region codes 由 [unknown] 改为 [US, unknown]（US 只覆盖 paid plan 的 Warp-managed 开源模型，不覆盖企业 DPA 下的数据）；其余档位的 zdr/retention/training/role 结论值未变，但补入了 provider ZDR 范围、删除期限与自有账号边界。Factories 定价区由 Pay as you go/Build/Business/Enterprise 改写为 Start/Scale/Enterprise。"
summary_en = "The pricing page (https://www.warp.dev/pricing) was revised and gained a Pricing FAQ. The previous marketing sentence ('Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers...') remains, and a new FAQ says the agreements cover supported LLM providers including Fireworks AI; for supported models prompts and outputs must be deleted after the response within a fixed period and must not be used for training; ZDR applies to Warp-provided inference only, while requests through your own API key, subscription, custom endpoint, or LLM are 'sent directly to your provider under your own account and terms'. The same FAQ says any user can enable full ZDR by disabling Help Improve Warp, and Business/Enterprise admins can enforce ZDR for all members from the admin panel; both claims are kept side by side with the security overview's distinction that provider ZDR concerns what providers retain, not what Warp stores, and the zdr verdict is not flipped on that basis. A 'Model provider ZDR' comparison row and the sentence 'Paid plans include frontier models from OpenAI, Anthropic, Google, and xAI, plus top open-source models like GLM 5.2, Kimi K3, and DeepSeek V4 hosted on Fireworks AI in the US.' were added. Verdict impact: business-enterprise processing_region codes change from [unknown] to [US, unknown] (US covers only Warp-managed open-source models on paid plans, not data under the enterprise DPA); other tiers keep their zdr/retention/training/role values, with provider ZDR scope, deletion period, and own-account boundary added as evidence. The Factories pricing section was rewritten from Pay as you go/Build/Business/Enterprise to Start/Scale/Enterprise."
issue = "https://github.com/arcships/zdr-monitor/issues/1323"
