summary_zh = "安全总览 https://docs.warp.dev/enterprise/security-and-compliance/security-overview 改版：删除「Warp has Zero Data Retention (ZDR) agreements … ZDR applies across all Warp plans」整段、按档位的遥测默认值（Free / Paid teams / Business and Enterprise 三句）、ZDR 例外句、云对话存储必需的说明、BYOLLM「Warp does not store the content of these requests」、自托管控制面「Warp does not persistently store your source code or use it for model training」以及「Hosted on GCP with SOC 2 and ISO 27001 certified datacenters」。上游 ZDR、分析采集与产品存储改为指向 Privacy and data control；BYOLLM 改为「Requests pass through Warp's servers … See retention for requests through your provider account」；控制面改为「Transcripts … persist as product data independently of provider ZDR」。受影响结论：enterprise-byollm 的 training 由 yes/by_deployment 改为 unknown；其 retention 由「Warp 不存储请求内容」改为未披露（basis 字段原本就是 undisclosed，未变）。GCP 依据点删除，处理地仍保留「Warp 那一跳未声明国别」的 caveat。其余档位的结论值未变，但 ZDR、采集与保留依据全部改绑到新页面或本页剩余句子。"
summary_en = "The security overview (https://docs.warp.dev/enterprise/security-and-compliance/security-overview) was rewritten: the whole 'Warp has Zero Data Retention (ZDR) agreements ... ZDR applies across all Warp plans' block, the per-plan telemetry defaults (Free / Paid teams / Business and Enterprise), the ZDR exception, the cloud-conversation storage note, the BYOLLM sentence 'Warp does not store the content of these requests', the self-hosted control-plane sentence 'Warp does not persistently store your source code or use it for model training', and 'Hosted on GCP with SOC 2 and ISO 27001 certified datacenters' were removed. Provider ZDR, analytics collection, and product storage now point to Privacy and data control; BYOLLM became 'Requests pass through Warp's servers ... See retention for requests through your provider account'; the control plane became 'Transcripts ... persist as product data independently of provider ZDR'. Verdict impact: enterprise-byollm training changes from yes/by_deployment to unknown; its retention note changes from 'Warp does not store the request content' to undisclosed (the basis field was already undisclosed and did not change). The GCP evidence point is removed while the processing-region caveat that the Warp-hosted hop states no country is retained. Other tiers keep their verdict values, but their ZDR, collection, and retention evidence is rebound to the new page or to the remaining sentences on this page."
issue = "https://github.com/arcships/zdr-monitor/issues/1323"
