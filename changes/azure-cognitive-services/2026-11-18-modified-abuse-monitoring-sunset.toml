summary_zh = "官方《Data, privacy, and security for Models sold by Azure in Microsoft Foundry》新增「What’s changing with Modified Abuse Monitoring」一节：2026-11-01 之前上线的模型，对已有获批客户继续适用 Modified Abuse Monitoring 且功能不变；2026-11-01 及之后上线的模型，Modified Abuse Monitoring 将在另行宣布的日期起不再提供，自该日起这些模型适用 Microsoft 更新后的数据保留、访问与安全监测做法（已有获批亦不例外），并会提前至少 30 天通知。api 档 zdr 仍为 yes / by_agreement，retention 仍为 mixed / as_needed，但两者都新增了针对新模型的前瞻性范围限定：新模型上不再有可申请的零保留路径，替代的保留做法文中未披露。"
summary_en = "The official 'Data, privacy, and security for Models sold by Azure in Microsoft Foundry' page added a section titled 'What’s changing with Modified Abuse Monitoring': Modified Abuse Monitoring continues to apply, unchanged, to models made available before November 1, 2026 for customers with an existing approval; for models made available on or after November 1, 2026 it will no longer be available beginning on a future date to be announced, from which those models will be subject to Microsoft's updated approach to data retention, access, and safety monitoring (including for customers with an existing approval), with at least 30 days' notice. The api tier's zdr verdict remains yes / by_agreement and its retention verdict remains mixed / as_needed, but both now carry a forward-looking scope limit for the newer models: no approval-based zero-retention route will remain for them, and the replacement retention approach is not described."
issue = "https://github.com/arcships/zdr-monitor/issues/1293"
