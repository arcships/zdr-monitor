summary_zh = "Unified Billing 页逐字保留『routes Unified Billing traffic through provider endpoints that do not retain prompts or responses』及不控制网关日志的限定;『This setting only applies to Unified Billing requests that use Cloudflare-managed credentials』改为『ZDR only applies to Unified Billing requests that use Cloudflare-managed credentials』。删除了网关级 zdr 的开通步骤、OpenAI/Anthropic 名单、非 ZDR 回退句『If ZDR is enabled for a provider that does not support it, AI Gateway falls back to the standard (non-ZDR) Unified Billing configuration』及逐请求 cf-aig-zdr 用法,改为指向模型目录。书面说明减少:开通方式、支持名单与回退行为不再写明,按删去书面表述记为减弱;上游不保留 prompt/response 的承诺句逐字未变,zdr 结论不变,不证明实际行为改变;现行 Update a gateway API 仍列 zdr 可选布尔字段。"
summary_en = "The Unified Billing page retains verbatim 'routes Unified Billing traffic through provider endpoints that do not retain prompts or responses' and the gateway-logging caveat. It rewords 'This setting only applies to Unified Billing requests that use Cloudflare-managed credentials' to 'ZDR only applies to Unified Billing requests that use Cloudflare-managed credentials'; it removes gateway activation steps, the OpenAI/Anthropic list, 'If ZDR is enabled for a provider that does not support it, AI Gateway falls back to the standard (non-ZDR) Unified Billing configuration', and per-request cf-aig-zdr guidance, instead referring to the model catalog. Recorded as weakened because the written guidance shrank: activation steps, the supported-provider list and the fallback behaviour are no longer documented. The upstream no-retention routing sentence is unchanged verbatim and the zdr verdict stays the same; this does not show a change in actual behaviour. The current Update a gateway API still exposes the optional boolean zdr field."
issue = "https://github.com/arcships/zdr-monitor/issues/346"
