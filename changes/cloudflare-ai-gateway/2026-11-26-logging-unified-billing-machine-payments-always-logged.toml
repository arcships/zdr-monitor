provider = "cloudflare-ai-gateway"
dimensions = ["retention"]
direction = "weakened"
observed_at = "2026-11-26"
source_id = "a010df22132f478a"
summary_zh = "AI Gateway Logging 页改写日志关闭时的统一计费例外,并把例外扩到 Machine Payments (x402)。旧句『For Unified Billing requests, AI Gateway always logs the request billing details. If the collect logs headers are set to `false`, the entry is logged without the request and response bodies.』在逐请求一节被替换为『Requests paid through Unified Billing or Machine Payments (x402) are the exception. Refer to Default configuration.』,同时 Default configuration 新增 Note:『Requests paid through Unified Billing or Machine Payments (x402) are always logged, even when logs are turned off for the gateway or the request. The log entry includes metadata and billing details, but not the request and response bodies.』即始终记录的请求类型新增 x402,且明确网关级关闭日志也不豁免(旧文本只围绕逐请求 header 设为 false 展开);日志条目仍不含请求/响应正文。四个档位的 retention 结论字段均未变;两个统一计费档的 retention 说明按新句重写,锚点 cf-aigw-logging-collect-log-unified-billing-billing-details 改绑新的 Default configuration 句子。"
summary_en = "The AI Gateway Logging page rewrote the Unified Billing exception to logging being off and extended it to Machine Payments (x402). The old sentence 'For Unified Billing requests, AI Gateway always logs the request billing details. If the collect logs headers are set to `false`, the entry is logged without the request and response bodies.' was replaced in the per-request section by 'Requests paid through Unified Billing or Machine Payments (x402) are the exception. Refer to Default configuration.', and a new note was added under Default configuration: 'Requests paid through Unified Billing or Machine Payments (x402) are always logged, even when logs are turned off for the gateway or the request. The log entry includes metadata and billing details, but not the request and response bodies.' The always-logged request class therefore now includes x402, and the text states explicitly that turning logs off at the gateway does not exempt these requests (the old wording only addressed per-request headers set to false); request and response bodies are still excluded. No retention verdict field changed on any tier; the retention notes for the two Unified Billing tiers were rewritten to the new sentence, and anchor cf-aigw-logging-collect-log-unified-billing-billing-details is rebound to the new Default configuration sentence."
issue = "https://github.com/arcships/zdr-monitor/issues/1436"
