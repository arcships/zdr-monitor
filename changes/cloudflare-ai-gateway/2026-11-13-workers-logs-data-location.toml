summary_zh = "Workers Logs 文档（Last updated 由 2026-10-02 改为 2026-11-12）新增「Data location」一节：『Cloudflare-stored Workers Logs, including invocation logs, follow your account's Customer Metadata Boundary setting when one is configured. If no boundary is configured, logs may be stored in Cloudflare's core data centers globally.』该句首次点名 Workers Logs（含 invocation logs）的存储地：未配置 Customer Metadata Boundary 时日志可能存放于 Cloudflare 全球核心数据中心，配置了则遵循该边界，查看可用性受 Data Localization 兼容性表所列 CMB 限制约束。此前处理地结论依据的是通用的 CMB 文档，本条把同一默认/边界规则明确落到 Workers Logs。两个 Workers Logs 档（BYOK 与统一计费新客户）的 processing_region 结论值不变（仍为 global），仅新增档位专属锚点 cf-aigw-workers-logs-data-location；Legacy Logs 两档不使用 Workers Logs，不受影响。同次更新新增的 source maps 说明与五个维度无关。"
summary_en = "The Workers Logs page (Last updated changed from October 2, 2026 to November 12, 2026) added a 'Data location' section: 'Cloudflare-stored Workers Logs, including invocation logs, follow your account's Customer Metadata Boundary setting when one is configured. If no boundary is configured, logs may be stored in Cloudflare's core data centers globally.' This is the first sentence to name the storage location of Workers Logs (including invocation logs) directly: without a configured Customer Metadata Boundary, logs may be stored in Cloudflare's core data centers globally; with one, that boundary applies, and viewing availability is subject to the CMB limitations listed in Data Localization compatibility. The prior processing_region verdict relied on the general CMB documentation; this sentence applies the same default/boundary rule expressly to Workers Logs. The processing_region verdicts for the two Workers Logs tiers (BYOK and Unified Billing new customers) are unchanged (still global); the update only adds the tier-specific anchor cf-aigw-workers-logs-data-location. The two Legacy Logs tiers do not use Workers Logs and are unaffected. The separately added source-maps note is unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1216"
