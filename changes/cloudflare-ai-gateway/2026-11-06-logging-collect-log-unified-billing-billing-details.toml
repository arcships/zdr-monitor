provider = "cloudflare-ai-gateway"
dimensions = ["retention"]
direction = "weakened"
observed_at = "2026-11-06"
source_id = "a010df22132f478a"
summary_zh = "AI Gateway Logging 页改写 cf-aig-collect-log 关闭时的说明:旧句『the entire log entry (including metadata) is skipped regardless of the `cf-aig-collect-log-payload` value』改为『AI Gateway does not store the request and response bodies ... and skips the rest of the log entry』,并新增统一计费例外——『For Unified Billing requests, AI Gateway always logs the request billing details. If the collect logs headers are set to `false`, the entry is logged without the request and response bodies.』BYOK 档仍可逐请求跳过日志条目其余部分;统一计费档无法完全抑制条目,但请求/响应正文仍可不存。结论字段未变(两个 BYOK 档 retention 仍为 as_needed / fixed_period,两个统一计费档 retention 仍为 as_needed / fixed_period);锚点 cf-aigw-logging-collect-log-false-skips-entry 改绑改写后的句子,新增锚点 cf-aigw-logging-collect-log-unified-billing-billing-details 记录计费明细例外。"
summary_en = "The AI Gateway Logging page rewrote the cf-aig-collect-log: false note. The old sentence 'the entire log entry (including metadata) is skipped regardless of the `cf-aig-collect-log-payload` value' became 'AI Gateway does not store the request and response bodies ... and skips the rest of the log entry', and the page added a Unified Billing exception: 'For Unified Billing requests, AI Gateway always logs the request billing details. If the collect logs headers are set to `false`, the entry is logged without the request and response bodies.' BYOK tiers can still skip the rest of the log entry per request; on Unified Billing the entry cannot be fully suppressed, though request and response bodies can still be omitted. No verdict field changed (retention remains as_needed on the legacy tiers and fixed_period on the Workers Logs tiers). Anchor cf-aigw-logging-collect-log-false-skips-entry is rebound to the rewritten sentence, and new anchor cf-aigw-logging-collect-log-unified-billing-billing-details records the billing-details exception."
issue = "https://github.com/arcships/zdr-monitor/issues/1080"
