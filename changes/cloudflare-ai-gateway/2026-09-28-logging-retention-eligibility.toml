summary_zh = "Logging 页删去旧版『These logs persist, giving you the flexibility to store them for your preferred duration』及按条数上限、自动/API 删除的说明,改为按客户首次创建 gateway 日期分流:2026-09-24 及以后首次创建者适用 Workers Logs 保留规则(Free 3 天、Paid 最多 7 天);此前创建者使用 Legacy Logs (已存日志留至客户删除,触顶时可能自动删最旧日志)。收紧仅指新客户网关日志有明确按日上限,不适用于旧客户或上游请求内容。"
summary_en = "The Logging page removed 'These logs persist, giving you the flexibility to store them for your preferred duration' and its count-based storage/deletion guidance. It now assigns customers first creating a gateway on or after September 24, 2026 to Workers Logs retention (3 days Free, 7 days Paid maximum); earlier customers use Legacy Logs (stored logs persist until customer deletion, subject to oldest-first deletion at capacity). Strengthened refers only to the newly explicit time bound on new customers' gateway logs, not legacy customers or upstream request content."
issue = "https://github.com/arcships/zdr-monitor/issues/346"
