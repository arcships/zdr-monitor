summary_zh = "Unified Billing 页改写凭据优先序并补充识别规则:第 1 步由『若请求带有 provider 认证(例如 Authorization header),AI Gateway 原样转给上游』改为『若请求带有 AI Gateway 为该 provider 与 endpoint 识别的凭据,则使用该凭据』;第 3 步加入『and Unified Billing fallback is allowed』这一前提。新增按 provider/endpoint 列出可识别请求凭据的表格、『Anthropic Messages 只认 x-api-key,bearer header 不能阻止 stored-key 查找或 Unified Billing 回退』的说明,以及『require provider credentials;找不到可用凭据则返回错误 2044』。另新增 Machine Payments(x402 支付,属计费路径)。ZDR 一节未改,仍为『ZDR only applies to Unified Billing requests that use Cloudflare-managed credentials. It does not apply to BYOK or other AI Gateway requests.』这次变化收窄了『调用方自带凭据』的认定范围,使更多请求可能落到 BYOK 或 Unified Billing,属适用范围澄清;结论字段均未变(两个统一计费档 zdr 仍为 yes/opt_in,role 仍为 processor),没有原文依据称上游零保留路由承诺减弱或 Cloudflare 角色改变。锚点 cf-aigw-ub-credential-resolution-order 改绑到改写后的句子。"
summary_en = "The Unified Billing page rewrote credential precedence and added recognition rules: step 1 changed from 'if the request carries provider authentication (for example, an Authorization header), AI Gateway forwards it to the provider unchanged' to 'if the request carries credentials AI Gateway recognizes for the provider and endpoint, AI Gateway uses those credentials'; step 3 now requires 'and Unified Billing fallback is allowed'. It adds a table of recognized request credentials per provider/endpoint, a note that on Anthropic Messages only x-api-key is recognized and 'A bearer header alone does not prevent stored-key lookup or Unified Billing fallback', and 'To prevent Unified Billing fallback, require provider credentials. If AI Gateway cannot find applicable request or stored credentials, it returns error 2044.' It also adds Machine Payments (x402, a billing path). The ZDR section is unchanged: 'ZDR only applies to Unified Billing requests that use Cloudflare-managed credentials. It does not apply to BYOK or other AI Gateway requests.' The revision narrows what counts as caller-supplied provider credentials, so more requests may fall through to BYOK or Unified Billing; this is a scope clarification. No verdict field changed (both Unified Billing tiers keep zdr yes/opt_in and role processor), and the text gives no basis for a weaker upstream no-retention routing promise or a different Cloudflare role. Anchor cf-aigw-ub-credential-resolution-order is rebound to the rewritten sentence."
issue = "https://github.com/arcships/zdr-monitor/issues/867"
