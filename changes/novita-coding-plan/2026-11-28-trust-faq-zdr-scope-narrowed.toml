summary_zh = """《Novita AI Trust Center FAQ》第 3 条（What data do you collect, and for how long is it retained?）的零保留表述被收窄。旧正文为「... except where required by applicable law. Zero Data Retention is the default for all endpoints, including serverless API calls. ... Our no-retention commitment applies to the substantive content of your API inputs and outputs across all endpoints, including serverless API calls. ...」，把不保留承诺扩至全部端点（含 serverless API calls）。新正文删去这两句，改为「For clarity, this commitment applies solely to Novita AI’s own processing of your content in connection with Novita-Managed Models. It does not apply to your content submitted to, or processed through, Third-Party APIs, which is subject to the applicable Model Terms and the relevant third-party provider’s own policies. A list of Third-Party APIs and links to the applicable Model Terms is maintained at https://novita.ai/models and may be updated from time to time.」——FAQ 层面也不再声称零保留覆盖 Third-Party APIs，与 TOS §10.2/§6.4 的模型类别限定一致。技术元数据 6 个月、账户与鉴权数据为账户存续期加法定期间等量化期限未变，第 1 条不训练的问答也未变。本档结论值不变：zdr 仍为 no（链上含第三方 API 跳），retention basis 仍为 undisclosed；本次快照删除了旧引文，锚点改绑到新的整段。"""
summary_en = """FAQ item 3 ('What data do you collect, and for how long is it retained?') narrowed its zero-retention wording. The old text said '... except where required by applicable law. Zero Data Retention is the default for all endpoints, including serverless API calls. ... Our no-retention commitment applies to the substantive content of your API inputs and outputs across all endpoints, including serverless API calls. ...', extending the no-retention commitment to all endpoints including serverless API calls. The new text deletes both sentences and substitutes: 'For clarity, this commitment applies solely to Novita AI’s own processing of your content in connection with Novita-Managed Models. It does not apply to your content submitted to, or processed through, Third-Party APIs, which is subject to the applicable Model Terms and the relevant third-party provider’s own policies. A list of Third-Party APIs and links to the applicable Model Terms is maintained at https://novita.ai/models and may be updated from time to time.' The FAQ therefore no longer claims that zero retention covers Third-Party APIs, matching the model-category limit in TOS §10.2/§6.4. The quantified periods (6 months for technical metadata; duration of the account plus statutory periods for account and authentication data) are unchanged, as is the no-training answer in FAQ item 1. The tier's verdict values do not change: zdr remains no (the chain contains a third-party API hop) and retention basis remains undisclosed; this snapshot deleted the old quote, so the anchor is rebound to the new paragraph."""
issue = "https://github.com/arcships/zdr-monitor/issues/1494"
