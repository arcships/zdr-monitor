summary_zh = "Claude Code 的 ZDR 页在『ZDR is not included in the standard Claude for Enterprise plan… cannot be enabled from your admin settings.』一段之后、『ZDR on Claude for Enterprise gives enterprise customers the ability to use Claude Code with zero data retention and access administrative capabilities:』之前，新增了一句 HIPAA/BAA 说明：\"Claude for Enterprise organizations that have enabled HIPAA can bring the Claude Code CLI and the Code tab in Claude Desktop under their Business Associate Agreement (BAA) without ZDR once the HIPAA configuration is applied to Claude Code (local mode) and Cowork (local mode).\"，并接着说 \"Organizations without the HIPAA configuration still need ZDR for BAA coverage of Claude Code.\" 即：启用 HIPAA 配置的 Claude for Enterprise 组织，可在不启用 ZDR 的情况下把 Claude Code CLI 与 Claude Desktop 的 Code 标签页纳入其 BAA（Business Associate Agreement，HIPAA 业务伙伴协议）覆盖范围；未启用 HIPAA 配置的组织仍需 ZDR 才能获得 Claude Code 的 BAA 覆盖。这句讲的是 BAA 覆盖路径与 ZDR 的关系，没有改变 ZDR 的开通资格或范围（仍仅限合格 Claude for Enterprise 账号、须由 Anthropic 按组织单独启用），也没有改动本 provider 三档任一维度的结论字段（mark/mode/basis/days/object/codes/kind）。同轮另一处改动是文档侧栏新增 Plugins 导航，与五个维度无关。锚点 cc-zdr-enterprise-only、zdr-cc-personal-not-covered、cc-zdr-covered-models、cc-zdr-violation-2y、cc-zdr-disabled-features、cc-zdr-feedback-disabled 所引原句在本版快照中逐字未变，故未改结论、未改绑引文；方向记为 clarified。"
summary_en = "On the Claude Code ZDR page, a new HIPAA/BAA sentence was inserted after the paragraph 'ZDR is not included in the standard Claude for Enterprise plan… cannot be enabled from your admin settings.' and before 'ZDR on Claude for Enterprise gives enterprise customers the ability to use Claude Code with zero data retention and access administrative capabilities:': \"Claude for Enterprise organizations that have enabled HIPAA can bring the Claude Code CLI and the Code tab in Claude Desktop under their Business Associate Agreement (BAA) without ZDR once the HIPAA configuration is applied to Claude Code (local mode) and Cowork (local mode).\", followed by \"Organizations without the HIPAA configuration still need ZDR for BAA coverage of Claude Code.\" In other words: a Claude for Enterprise organization with the HIPAA configuration can bring the Claude Code CLI and the Code tab in Claude Desktop under its BAA without ZDR; organizations without the HIPAA configuration still need ZDR for BAA coverage of Claude Code. This sentence is about the BAA-coverage route relative to ZDR; it does not change ZDR eligibility or scope (still limited to qualified Claude for Enterprise accounts and separate per-organization enablement by Anthropic) and does not change any verdict field (mark/mode/basis/days/object/codes/kind) of any of this provider's three tiers. The other change in this round is a new 'Plugins' item in the docs sidebar and is unrelated to the five dimensions. The sentences quoted by anchors cc-zdr-enterprise-only, zdr-cc-personal-not-covered, cc-zdr-covered-models, cc-zdr-violation-2y, cc-zdr-disabled-features and cc-zdr-feedback-disabled are verbatim unchanged in this snapshot, so no verdict was changed and no quote was rebound; the direction is recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/509"
