summary_zh = "Claude 平台《API and data retention》页把「What ZDR does not cover」里的消费档排除句由 \"Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.\" 改为 \"Claude Free, Pro, Max, and Ultra plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.\"；「What HIPAA readiness does not cover」的对应句也由 \"Claude Free, Pro, and Max plans.\" 改为 \"Claude Free, Pro, Max, and Ultra plans.\"。两处都是把 Ultra 明确列入消费档，ZDR 的资格与范围没有实质变化（本 provider 的 individual 档仍覆盖 Free/Pro/Max 等全部消费档，zdr 仍 mark=no；Team/Enterprise 档的结论字段 mark/mode/basis/days/object/codes/kind 均未改动）。旧引文因句中加了 \"Max, and Ultra\" 而不再逐字命中，已把锚点 cc-zdr-api-consumer-excluded 的 exact 与 individual 档 zdr 说明改绑到新句，方向记为 clarified。同轮其余改动为侧栏导航改名、功能资格表拆成 Platform features / Messages API features / Managed Agents features / Other features 四张表、若干功能改名（Tool search→Tool search tool、Web fetch→Web fetch tool、Web search→Web search tool、Computer use→Computer use tool、Browser use→Browser use tool、Code execution→Code execution tool、Context management (compaction)→Threshold compaction）以及新增若干 Part of 子行和 Microsoft Foundry 的 HIPAA 覆盖条目，均与这五维结论无关。"
summary_en = "On the Claude platform page 'API and data retention', the consumer-plan exclusion under 'What ZDR does not cover' changed from \"Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.\" to \"Claude Free, Pro, Max, and Ultra plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.\"; the matching bullet under 'What HIPAA readiness does not cover' changed from \"Claude Free, Pro, and Max plans.\" to \"Claude Free, Pro, Max, and Ultra plans.\". Both additions merely name Ultra as part of the consumer plans; ZDR eligibility and scope are substantively unchanged (this provider's individual tier still covers all consumer plans including Free/Pro/Max, zdr stays mark=no; no verdict field (mark/mode/basis/days/object/codes/kind) of the Team or Enterprise tier changed). The old quote no longer matched verbatim because of the inserted 'Max, and Ultra', so the exact of anchor cc-zdr-api-consumer-excluded and the individual tier's zdr explanation were re-bound to the new sentence; the direction is recorded as clarified. The rest of the round is sidebar navigation renames, splitting the feature eligibility table into Platform features / Messages API features / Managed Agents features / Other features, several feature renames (Tool search→Tool search tool, Web fetch→Web fetch tool, Web search→Web search tool, Computer use→Computer use tool, Browser use→Browser use tool, Code execution→Code execution tool, Context management (compaction)→Threshold compaction), new 'Part of' sub-rows and a Microsoft Foundry HIPAA coverage bullet, none of which affects this provider's five-dimension verdicts."
issue = "https://github.com/arcships/zdr-monitor/issues/956"
