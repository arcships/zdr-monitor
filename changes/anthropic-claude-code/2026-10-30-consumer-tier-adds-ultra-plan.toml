summary_zh = "Claude Code 数据处理页（source_id 06b2864aaa7d8bc3）与 Claude API 的 API and data retention 页（source_id 6bc4022c8696d7c6）在同一轮把消费档名单由 Free/Pro/Max 扩为 Free/Pro/Max/Ultra。数据处理页三处：训练政策段 'We will train new models using data from Free, Pro, and Max accounts when this setting is on (including when you use Claude Code from these accounts)' 改为 'We will train new models using data from Free, Pro, Max, and Ultra accounts when this setting is on (including when you use Claude Code from these accounts)'；保留段标题 '**Consumer users (Free, Pro, and Max plans)**' 改为 '**Consumer users (Free, Pro, Max, and Ultra plans)**'；指引句 'Consumer Terms (for Free, Pro, and Max users)' 改为 'Consumer Terms (for Free, Pro, Max, and Ultra users)'。同页错误报告资格由 'Claude Pro or Max subscription' / 'Pro and Max sign-ins' 改为 'Claude Pro, Max, or Ultra subscription' / 'Pro, Max, and Ultra sign-ins'（运营遥测，不属五个维度）。API 页把 ZDR 不覆盖项 'Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.' 改为 'Claude Free, Pro, Max, and Ultra plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.'，HIPAA 不覆盖项同步加入 Ultra。三个既有消费档（Free/Pro/Max）的处理方式未变：训练仍为开关打开即训练、保留仍为 5 年/30 天双轨、仍不在 ZDR 覆盖范围；新增的 Ultra 被明文归入同一消费档口径。本 provider 三档的结论字段（mark/mode/basis/days/object/codes/kind）均未改动。API 页锚点 cc-zdr-api-consumer-excluded 因原句被改写而改绑到新句；data-usage 页 cc-retention-5y 与 cc-commercial-terms-applies 的前缀/后缀同步更新。provider 文件内其余消费档注释（含 ZDR 页与 Commercial Terms 的范围声明、隐私中心文章的转述）统一补为 Free/Pro/Max/Ultra；仅复述 7996866 原词处注明该文原文未列 Ultra。"
summary_en = "The Claude Code data usage page (source_id 06b2864aaa7d8bc3) and the Claude API 'API and data retention' page (source_id 6bc4022c8696d7c6) expanded the consumer-tier list from Free/Pro/Max to Free/Pro/Max/Ultra in the same round. Three places on the data usage page: the training policy changed from 'We will train new models using data from Free, Pro, and Max accounts when this setting is on (including when you use Claude Code from these accounts)' to 'We will train new models using data from Free, Pro, Max, and Ultra accounts when this setting is on (including when you use Claude Code from these accounts)'; the retention heading changed from '**Consumer users (Free, Pro, and Max plans)**' to '**Consumer users (Free, Pro, Max, and Ultra plans)**'; and the pointer changed from 'Consumer Terms (for Free, Pro, and Max users)' to 'Consumer Terms (for Free, Pro, Max, and Ultra users)'. On the same page, error-report eligibility changed from 'Claude Pro or Max subscription' / 'Pro and Max sign-ins' to 'Claude Pro, Max, or Ultra subscription' / 'Pro, Max, and Ultra sign-ins' (operational telemetry, outside the five dimensions). The API page changed its ZDR exclusion from 'Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.' to 'Claude Free, Pro, Max, and Ultra plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.', and added Ultra to the HIPAA exclusion as well. The treatment of the three existing consumer plans (Free/Pro/Max) is unchanged: training still applies when the toggle is on, retention still has the 5-year/30-day tracks, and they remain outside ZDR; the new Ultra plan is expressly placed under the same consumer-tier wording. No verdict field (mark/mode/basis/days/object/codes/kind) of this provider's three tiers was changed. The API page anchor cc-zdr-api-consumer-excluded was rebound to the new sentence because the old one was rewritten, and the prefix/suffix of the data usage page anchors cc-retention-5y and cc-commercial-terms-applies were updated in step. The remaining consumer-tier annotations in the provider file (including the ZDR page and Commercial Terms scope statements and the restatement of the privacy-center article) were brought to Free/Pro/Max/Ultra; the one place that restates the 7996866 wording notes that the article itself does not list Ultra."
issue = "https://github.com/arcships/zdr-monitor/issues/957"
