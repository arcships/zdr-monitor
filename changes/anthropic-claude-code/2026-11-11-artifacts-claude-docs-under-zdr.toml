summary_zh = "Claude Code 的 ZDR 页在「Features disabled under ZDR」表格把 \"| Artifacts | Requires storing published page content on Anthropic-operated infrastructure. |\" 改为 \"| Artifacts in Claude Code | Requires storing published page content on Anthropic-operated infrastructure. |\"，并在其后新增 \"| Claude Docs | Requires storing document content on Anthropic-operated infrastructure. |\"，禁用功能清单由六项增至七项。同页「What ZDR does not cover」另新增一行 \"| Artifacts | Artifacts in chat conversations and Cowork sessions are not covered by ZDR, and are kept until deleted unless your organization sets a retention period for them. Artifacts are not available in Claude Code with ZDR. |\"，该表的引导句也由 \"These features follow standard data retention policies\" 改为 \"Except where a row says otherwise, these features follow standard data retention policies\"。这些改动澄清 ZDR 的覆盖边界：Claude Code 中的 Artifacts 与新增的 Claude Docs 在启用 ZDR 时于后端禁用；Chat/Cowork 中的 Artifacts 不在 ZDR 范围、未删除即保留（组织可另设保留期），但在 Claude Code 的 ZDR 下不可用。ZDR 的资格、范围与例外结构未改变（仍仅限合格 Claude for Enterprise 账号、须由 Anthropic 按组织单独启用；Covered Models 仍默认要求保留、违规会话最多 2 年），本 provider 三档的结论字段（mark/mode/basis/days/object/codes/kind）均未改动。原锚点 cc-zdr-disabled-features 因表格行改名并插入新行而不再命中，已把改名后的 Artifacts 行与新增的 Claude Docs 行纳入 exact，并同步更新 Enterprise 档 zdr 说明与来源 note。同轮其余改动只有侧栏移除 What's New，与五个维度无关。方向记为 clarified。"
summary_en = "On the Claude Code ZDR page, the 'Features disabled under ZDR' table changed \"| Artifacts | Requires storing published page content on Anthropic-operated infrastructure. |\" to \"| Artifacts in Claude Code | Requires storing published page content on Anthropic-operated infrastructure. |\" and added \"| Claude Docs | Requires storing document content on Anthropic-operated infrastructure. |\" right after it, growing the disabled-feature list from six to seven rows. The same page also added a row to 'What ZDR does not cover': \"| Artifacts | Artifacts in chat conversations and Cowork sessions are not covered by ZDR, and are kept until deleted unless your organization sets a retention period for them. Artifacts are not available in Claude Code with ZDR. |\", and the table's lead-in changed from \"These features follow standard data retention policies\" to \"Except where a row says otherwise, these features follow standard data retention policies\". These changes clarify the ZDR boundary: Artifacts in Claude Code and the newly added Claude Docs are disabled at the backend when ZDR is enabled; Artifacts in chat conversations and Cowork are outside ZDR and kept until deleted unless the organization sets a retention period, but they are not available in Claude Code under ZDR. ZDR eligibility, scope and exception structure are unchanged (still limited to qualified Claude for Enterprise accounts with separate per-organization enablement by Anthropic; Covered Models still require retention by default and flagged sessions may be retained up to 2 years). No verdict field (mark/mode/basis/days/object/codes/kind) of this provider's three tiers was changed. The anchor cc-zdr-disabled-features no longer matched because a table row was renamed and a new row inserted; the renamed row and the new row were added to the exact, and the Enterprise tier's zdr explanation and the source note were updated in step. The only other change in this round is the removal of 'What's New' from the sidebar, unrelated to the five dimensions. Direction is recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/1177"
