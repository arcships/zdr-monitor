summary_zh = "Claude Platform 的 API and data retention 页有两处改写到五个维度(同轮其余改动只有侧栏新增 Plugins API、Encryption keys 改为 Encryption keys (CMEK),与维度无关)。(1) ZDR 一节把 Claude Code 的两条开通路径改写为两种彼此独立的安排:① What ZDR covers 的条目由 \"**Claude Code:** ZDR applies when Claude Code is used with API keys from a Commercial organization (an organization under Anthropic's Commercial Terms of Service, as distinct from a consumer Claude account) or through Claude Enterprise with ZDR enabled.\" 改为 \"**Claude Code with API keys:** ZDR applies when Claude Code is used with API keys from a Commercial organization (an organization under Anthropic's Commercial Terms of Service, as distinct from a consumer Claude account).\",并新增 \"Claude Code on Claude Enterprise is not covered by this arrangement and has a separate ZDR offering; see What ZDR does not cover.\";② What ZDR does not cover 的条目由 \"The exception is Claude Code used through Claude Enterprise with ZDR enabled; see What ZDR covers.\" 改为 \"The one exception is Claude Code on Claude Enterprise, which has its own ZDR offering, separate from the ZDR arrangement described on this page. That offering is available only to qualified accounts on Claude Enterprise and requires separate enablement by Anthropic. See the Claude Code ZDR documentation, which applies to Claude Enterprise organizations only.\";③ FAQ 小节由 \"Claude Code is eligible for ZDR through two paths:\" 改为 \"Claude Code is eligible for ZDR under two separate offerings:\",Enterprise 一条补上 \"is covered by a separate offering, ZDR for Claude Code on Claude Enterprise, when Anthropic has enabled it for the organization.\",段末新增 \"That documentation applies to Claude Enterprise organizations only and does not describe the ZDR arrangement for the Claude API.\"。资格没有变化(仍仅限合格 Claude Enterprise 账号、须由 Anthropic 单独启用;本页这套 ZDR arrangement 明确只覆盖用 API key 的 Claude Code),本 provider 三档的 zdr 结论字段与锚点均未动,属适用范围措辞澄清,不构成对 Claude Code on Enterprise 零保留承诺的削弱。(2) 保留模型段(Several retention models sit outside...)把 HIPAA readiness 的从句由 \"The Compliance API does not capture local sessions for which ZDR is in effect, or any local sessions from organizations with HIPAA readiness enabled.\" 改为 \"The Compliance API does not capture local sessions for which ZDR is in effect. For organizations with HIPAA readiness enabled, it captures Cowork and Claude Code local sessions only and stores their transcripts for 30 days.\"——HIPAA 组织的本地会话由「一律不抓取」改为「只抓取 Cowork 与 Claude Code 的本地会话、保留 30 天」;按字面读是收紧,但它描述的是本 provider 未建模的 HIPAA readiness 配置(该页另明确 Claude Code 不在 HIPAA readiness 覆盖范围内),三档的 retention 结论字段与锚点都不受影响。两向并存且对任一档位的结论字段零影响,方向记为 clarified。锚点 cc-zdr-api-consumer-excluded 与 cc-local-transcripts-6y 所引原句在本版快照中逐字未变,故未改结论、未改绑引文。"
summary_en = "The API and data retention page on the Claude Platform rewrote two places that touch the five dimensions (the only other change in this round is cosmetic: the sidebar gained Plugins API and 'Encryption keys' became 'Encryption keys (CMEK)'). (1) The ZDR section now splits Claude Code's two enablement paths into two separate arrangements: the What ZDR covers bullet changed from '**Claude Code:** ZDR applies when Claude Code is used with API keys from a Commercial organization (an organization under Anthropic's Commercial Terms of Service, as distinct from a consumer Claude account) or through Claude Enterprise with ZDR enabled.' to '**Claude Code with API keys:** ZDR applies when Claude Code is used with API keys from a Commercial organization (an organization under Anthropic's Commercial Terms of Service, as distinct from a consumer Claude account).', adding 'Claude Code on Claude Enterprise is not covered by this arrangement and has a separate ZDR offering; see What ZDR does not cover.'; the What ZDR does not cover bullet changed from 'The exception is Claude Code used through Claude Enterprise with ZDR enabled; see What ZDR covers.' to 'The one exception is Claude Code on Claude Enterprise, which has its own ZDR offering, separate from the ZDR arrangement described on this page. That offering is available only to qualified accounts on Claude Enterprise and requires separate enablement by Anthropic. See the Claude Code ZDR documentation, which applies to Claude Enterprise organizations only.'; and the FAQ changed 'Claude Code is eligible for ZDR through two paths:' to 'Claude Code is eligible for ZDR under two separate offerings:', added 'is covered by a separate offering, ZDR for Claude Code on Claude Enterprise, when Anthropic has enabled it for the organization.' to the Enterprise bullet, and appended 'That documentation applies to Claude Enterprise organizations only and does not describe the ZDR arrangement for the Claude API.'. Eligibility is unchanged (still limited to qualified Claude Enterprise accounts and separate enablement by Anthropic; this page's ZDR arrangement expressly covers only Claude Code used with API keys), and no zdr verdict field or anchor of this provider's three tiers was touched, so this is scope-wording clarification, not a weakening of the zero-retention commitment for Claude Code on Claude Enterprise. (2) The retention-models paragraph (Several retention models sit outside...) rewrote the HIPAA readiness clause from 'The Compliance API does not capture local sessions for which ZDR is in effect, or any local sessions from organizations with HIPAA readiness enabled.' to 'The Compliance API does not capture local sessions for which ZDR is in effect. For organizations with HIPAA readiness enabled, it captures Cowork and Claude Code local sessions only and stores their transcripts for 30 days.' — i.e. for HIPAA organizations local sessions went from 'never captured' to 'only Cowork and Claude Code local sessions captured, transcripts stored for 30 days'; read literally that is a tightening, but it describes a HIPAA readiness configuration this provider does not model (the same page states separately that Claude Code is not covered under HIPAA readiness) and it leaves the retention verdict fields and anchors of all three tiers untouched. With both directions present and zero effect on any verdict field, the direction is recorded as clarified. The sentences quoted by anchors cc-zdr-api-consumer-excluded and cc-local-transcripts-6y are verbatim unchanged in this snapshot, so no verdict was changed and no quote was rebound."
issue = "https://github.com/arcships/zdr-monitor/issues/396"
