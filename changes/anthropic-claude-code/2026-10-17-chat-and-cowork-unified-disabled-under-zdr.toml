summary_zh = "Claude Code 的 ZDR 页在「Features disabled under ZDR」表格中新增一行：\"| Chat and Cowork unified | Requires cloud sessions. |\"，位置在 Cloud sessions 与 Claude Tag 之间。该行说明启用 ZDR 后 Chat and Cowork unified 也因依赖云会话而在后端被禁用（同段仍写\"These features are blocked in the backend regardless of client-side display.\"）。禁用功能清单由五项增至六项，但 ZDR 的资格与范围没有变化（仍仅限合格 Claude for Enterprise 账号、须由 Anthropic 按组织单独启用），本 provider 三档的结论字段（mark/mode/basis/days/object/codes/kind）均未改动。原锚点 cc-zdr-disabled-features 的 exact 是多行连续引用，新增行插在该引用中间导致引文不再命中；已把新行纳入 exact 并同步补进 Enterprise 档 zdr 的说明，属澄清，方向记为 clarified。同轮其余改动只有侧栏导航与措辞替换，与五个维度无关。"
summary_en = "On the Claude Code ZDR page, the 'Features disabled under ZDR' table gained a row: \"| Chat and Cowork unified | Requires cloud sessions. |\", placed between Cloud sessions and Claude Tag. It states that with ZDR enabled, Chat and Cowork unified is also disabled at the backend because it requires cloud sessions (the paragraph still says \"These features are blocked in the backend regardless of client-side display.\"). The disabled-feature list grows from five to six items, but ZDR eligibility and scope are unchanged (still limited to qualified Claude for Enterprise accounts and separate per-organization enablement by Anthropic), and no verdict field (mark/mode/basis/days/object/codes/kind) of this provider's three tiers was changed. The exact of anchor cc-zdr-disabled-features was a contiguous multi-row quote; the inserted row broke it, so the new row was added to the exact and to the Enterprise tier's zdr explanation. Direction is recorded as clarified. The only other changes in this round are sidebar navigation and wording substitutions, unrelated to the five dimensions."
