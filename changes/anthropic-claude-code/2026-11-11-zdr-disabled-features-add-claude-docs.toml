summary_zh = "Claude Code 的 ZDR 页在「Features disabled under ZDR」表格删改并新增行：原 \"| Artifacts | Requires storing published page content on Anthropic-operated infrastructure. |\" 改为 \"| Artifacts in Claude Code | Requires storing published page content on Anthropic-operated infrastructure. |\"（把适用范围收窄到 Claude Code），并在其后新增 \"| Claude Docs | Requires storing document content on Anthropic-operated infrastructure. |\"。启用 ZDR 时需要在后端存储提示或响应的禁用功能清单由六项增至七项。同页「What ZDR does not cover」的引导句由 \"These features follow standard data retention policies:\" 改为 \"Except where a row says otherwise, these features follow standard data retention policies:\"，并新增一行 \"| Artifacts | Artifacts in chat conversations and Cowork sessions are not covered by ZDR, and are kept until deleted unless your organization sets a retention period for them. Artifacts are not available in Claude Code with ZDR. |\"，明确 chat/Cowork 里的 Artifacts 不在 ZDR 覆盖内、删除前一直保留（组织可另设保留期），且 ZDR 下 Claude Code 不提供 Artifacts。ZDR 的资格与范围没有变化（仍仅限合格 Claude for Enterprise 账号、须由 Anthropic 按组织单独启用；仍不覆盖 claude.ai Chat/Cowork、Bedrock/Google Cloud/Foundry 部署），Covered Models 与违规会话的例外也没有变化，本 provider 三档的结论字段（mark/mode/basis/days/object/codes/kind）均未改动。原锚点 cc-zdr-disabled-features 的 exact 是多行连续引用，Artifacts 行改名并在其后插入 Claude Docs 行导致引文不再命中；已按新表改绑 exact 并同步更新 Enterprise 档 zdr 说明与来源 note。Artifacts 的保留表述对象是 chat/Cowork 会话里的 Artifacts，不是 Claude Code 推理请求，故本 provider retention 的对象与期限不变。同轮其余改动只有侧栏去掉 What's New，属导航，与五个维度无关。方向记为 clarified。"
summary_en = "On the Claude Code ZDR page, the 'Features disabled under ZDR' table changed and gained a row: \"| Artifacts | Requires storing published page content on Anthropic-operated infrastructure. |\" became \"| Artifacts in Claude Code | Requires storing published page content on Anthropic-operated infrastructure. |\" (narrowing its scope to Claude Code), followed by a new row \"| Claude Docs | Requires storing document content on Anthropic-operated infrastructure. |\". The list of features disabled at the backend under ZDR because they require storing prompts or completions grows from six to seven items. On the same page, the lead-in to 'What ZDR does not cover' changed from \"These features follow standard data retention policies:\" to \"Except where a row says otherwise, these features follow standard data retention policies:\", and a new row was added: \"| Artifacts | Artifacts in chat conversations and Cowork sessions are not covered by ZDR, and are kept until deleted unless your organization sets a retention period for them. Artifacts are not available in Claude Code with ZDR. |\", stating that artifacts in chat conversations and Cowork sessions are outside ZDR and kept until deleted unless the organization sets a retention period, and that Artifacts are not available in Claude Code under ZDR. ZDR eligibility and scope are unchanged (still limited to qualified Claude for Enterprise accounts, separate per-organization enablement by Anthropic; still not covering claude.ai Chat/Cowork or Bedrock/Google Cloud/Foundry deployments), and the Covered Models and policy-violation exceptions are unchanged. No verdict field (mark/mode/basis/days/object/codes/kind) of this provider's three tiers was changed. The exact of anchor cc-zdr-disabled-features was a contiguous multi-row quote; renaming the Artifacts row and inserting the Claude Docs row broke it, so the exact was rebound to the new table and the Enterprise tier's zdr explanation and the source note were updated in step. The Artifacts retention statement concerns artifacts in chat/Cowork sessions, not Claude Code inference requests, so this provider's retention object and period are unchanged. The only other change in this round is removal of 'What's New' from the sidebar navigation, unrelated to the five dimensions. Direction is recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/1176"
