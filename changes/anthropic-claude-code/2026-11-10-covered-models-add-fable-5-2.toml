summary_zh = "Claude Code 的 ZDR 页在「Model availability under ZDR」把 Covered Models 名单由 \"Claude Fable 5.1 and Fable 5 are Covered Models that require data retention by default...\" 改为 \"Claude Fable 5.2, Fable 5.1, and Fable 5 are Covered Models that require data retention by default...\"，新增 Fable 5.2。同句后半段的 best alias 说明同时由 \"Fable models are not the default, and the `best` alias, which resolves to the latest Fable model where it is available, resolves to Opus for organizations where it is not.\" 简化为 \"Fable models aren’t the default, and the `best` alias resolves to Opus.\"（不涉及五个维度）。同一轮 Claude API 的 API and data retention 页（source_id 6bc4022c8696d7c6）在 ZDR 不覆盖项与 Model-specific data retention requirements 两处把名单由 \"Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, and Claude Mythos 5\" 扩为 \"Claude Fable 5.2, Claude Mythos 5.2, Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, and Claude Mythos 5\"，新增 Fable 5.2 与 Mythos 5.2，30 天保留要求不变。ZDR 的资格、范围与例外结构均未改变（仍仅限合格 Claude for Enterprise 账号、须由 Anthropic 按组织单独启用；Covered Models 仍默认要求保留、违规会话最多 2 年）。本 provider 三档的结论字段（mark/mode/basis/days/object/codes/kind）均未改动。原锚点 cc-zdr-covered-models 因原句被改写而不再命中，已改绑到新句并同步更新 Enterprise 档 zdr 说明与来源 note。同轮其余改动只有页面顶部 Assistant 提示位置、\"Identity providers\" 空白与 FAQ 标题末尾字符，属格式，与五个维度无关。"
summary_en = "On the Claude Code ZDR page, 'Model availability under ZDR' changed the Covered Models list from \"Claude Fable 5.1 and Fable 5 are Covered Models that require data retention by default...\" to \"Claude Fable 5.2, Fable 5.1, and Fable 5 are Covered Models that require data retention by default...\", adding Fable 5.2. In the same sentence the best-alias note was simplified from \"Fable models are not the default, and the `best` alias, which resolves to the latest Fable model where it is available, resolves to Opus for organizations where it is not.\" to \"Fable models aren’t the default, and the `best` alias resolves to Opus.\" (outside the five dimensions). In the same round, the Claude API 'API and data retention' page (source_id 6bc4022c8696d7c6) expanded the list in both the ZDR exclusions and 'Model-specific data retention requirements' from \"Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, and Claude Mythos 5\" to \"Claude Fable 5.2, Claude Mythos 5.2, Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, and Claude Mythos 5\", adding Fable 5.2 and Mythos 5.2; the 30-day retention requirement is unchanged. ZDR eligibility, scope and exception structure are unchanged (still limited to qualified Claude for Enterprise accounts, separate per-organization enablement by Anthropic; Covered Models still require retention by default, flagged sessions still up to 2 years). No verdict field (mark/mode/basis/days/object/codes/kind) of this provider's three tiers was changed. The anchor cc-zdr-covered-models no longer matched because the sentence was rewritten; it was rebound to the new sentence, and the Enterprise tier's zdr explanation and the source note were updated in step. The only other changes in this round are the position of the Assistant banner at the top of the page, whitespace around 'Identity providers', and trailing characters in FAQ headings — formatting, unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1147"
