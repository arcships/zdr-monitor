summary_zh = "《Meta Model API Terms of Service》由 October 2, 2026 改为 October 9, 2026，有三处与五个维度相关的改动。其一，全文把 Discounted Models / Discounted Services 改名为 Contributor Models / Contributor Services（Standard 档不变）。其二，新增 §3.3「Account Setting for Coding Harness Subscriptions」：通过 Coding Harness Subscription 访问时「you are considered to be using the Contributor Services by default regardless of which Meta Model you select, and Section 6 applies to that access and use」，要走到 Standard Services 须改 Account 设置（改了才适用 §5），且切换只向将来生效、Meta 对更早提交 Content 的 §6 权利不受影响。其三，§13.4 由「The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.」改为「When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.」，并删去「does not provide any discount, fee reduction, or increased per-period allowance based on the Models you select, including Discounted Models.」。此外 §5.1 的不训练承诺由「will not use Content from Standard Services to train Meta Models」窄化为「will not use Content submitted in a request to the Standard Services to train Meta Models」（§6.1 配套新增：此前提交给 Standard Services 的 Content 一旦随请求进入 Contributor Services 即视为提交给 Contributor Services），§6.2 的不提交机密信息义务随改名指向 Contributor Services。对 Muse Code 订阅档的影响：§3.3 把订阅默认档位从「由所选模型决定、默认未明」改成「默认即 Contributor Services（§6，会训练）」，因此 training 结论由 mark=yes / mode=by_tier 改为 mark=no / mode=opt_out（可通过改 Account 设置切到 Standard 退出训练，但只向将来生效）；retention 的 object/basis 值未变，但 §6.1 的保留依据现在默认适用、并新增「Standard 内容转为 Contributor 内容」一句；role 仍为未约定——processor 表述只在 Standard 档（§5.1），默认的 Contributor 档没有。zdr 与 processing_region 不受影响，均未变。"
summary_en = "The Meta Model API Terms of Service moved from October 2, 2026 to October 9, 2026 with three changes that touch the five dimensions. First, Discounted Models / Discounted Services were renamed Contributor Models / Contributor Services throughout (the Standard tier is unchanged). Second, a new §3.3 'Account Setting for Coding Harness Subscriptions' states that a Coding Harness Subscription user 'you are considered to be using the Contributor Services by default regardless of which Meta Model you select, and Section 6 applies to that access and use', that reaching the Standard Services requires changing the Account setting (Section 5 then applies), and that such a change is prospective only, leaving Meta's Section 6 rights over earlier Content intact. Third, §13.4 changed from 'The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.' to 'When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.', and the sentence 'does not provide any discount, fee reduction, or increased per-period allowance based on the Models you select, including Discounted Models.' was removed. In addition, §5.1's no-training promise narrowed from 'will not use Content from Standard Services to train Meta Models' to 'will not use Content submitted in a request to the Standard Services to train Meta Models' (with a matching addition in §6.1 that Content previously submitted to the Standard Services becomes Contributor Services Content when included in a request to the Contributor Services), and §6.2's duty not to submit confidential information now points at the Contributor Services. Effect on the Muse Code subscription tier: §3.3 changed the subscription's default from 'determined by the model selected, default undisclosed' to 'Contributor Services by default (Section 6, trains)', so the training verdict moves from mark=yes / mode=by_tier to mark=no / mode=opt_out (training can be left by switching the Account setting to Standard, but only prospectively); retention's object/basis values are unchanged, but the §6.1 retention ground now applies by default and gained the 'Standard Content becoming Contributor Content' sentence; role stays not specified — the processor wording sits only in the Standard tier (§5.1), which the default Contributor tier lacks. zdr and processing_region are not implicated and are unchanged."
