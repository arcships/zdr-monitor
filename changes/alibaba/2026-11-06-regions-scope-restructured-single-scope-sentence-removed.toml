summary_zh = "国际站 Model Studio 地域页改版（标题 Regions and endpoints → Regions and service deployment scopes，Updated at 2026-09-17 11:37:46 → 2026-11-06 14:06:41）。与 processing_region 有关的变化有两处：①「For a complete list of regions and their supported service deployment scopes, go to the console.」改为「For the service deployment scopes and access information for each region, see China (Beijing), Singapore, US (Virginia), Germany (Frankfurt), Japan (Tokyo), China (Hong Kong).」，把地域与服务部署范围的对应关系指向各地域页而非控制台；②删除「**China (Beijing)** and **Singapore** regions each support only one service deployment scope (Chinese mainland and International, respectively), so no selection is needed.」一句。保留正文仍写明地域决定接入点和数据存储位置、请求数据存于所选地域、推理结果回到接入地域存储、静态数据始终留在所选地域，并写明 service deployment scope 决定推理执行地、选 Global 会使用更大的推理资源池。processing_region 的 codes 仍为 [selected]，结论值未变；但原用于支撑「Singapore 仅 International、China (Beijing) 仅中国大陆」的句子已不在快照中，该页现只列 Germany (Frankfurt)、Japan (Tokyo)、China (Hong Kong)、US (Virginia) 通过 Workspaces 区分 scope，故从证据说明中删去这两地的 scope 细节并标注该页不再单独证明其推理执行范围，来源 note 同步记录该边界。地域子页未纳入本 provider 来源，无法据其补证。同轮其余改动与五维无关：站点顶部导航改名/增删（如 User Guide → Token Plan、AI DeepSign → DeepSynID）、Endpoints 表格两行的行首竖线被去掉属格式调整、页脚 Previous/Next 与 Realtime API 链接改名属导航改动。方向记为 clarified：厂商把地域与部署范围的对应关系指向各地域页并删去一句概括，未见厂商表示各地域实际可选范围发生变化。"
summary_en = "The International Model Studio regions page was restructured (title 'Regions and endpoints' → 'Regions and service deployment scopes'; Updated at 2026-09-17 11:37:46 → 2026-11-06 14:06:41). Two changes touch processing_region: (1) 'For a complete list of regions and their supported service deployment scopes, go to the console.' became 'For the service deployment scopes and access information for each region, see China (Beijing), Singapore, US (Virginia), Germany (Frankfurt), Japan (Tokyo), China (Hong Kong).', delegating the region-to-scope mapping to the per-region pages instead of the console; and (2) the bullet '**China (Beijing)** and **Singapore** regions each support only one service deployment scope (Chinese mainland and International, respectively), so no selection is needed.' was removed. The remaining text still says the region determines the access point and data storage location, request data is stored in the selected region, inference results are stored back in the access region, and static data always remains in the selected region; it also still says the service deployment scope determines the inference execution location and that the Global scope uses a larger inference resource pool. The processing_region codes remain [selected] and no verdict field changed. However, the deleted sentence was the support for 'Singapore has only International, China (Beijing) has only mainland China'; the page now names only Germany (Frankfurt), Japan (Tokyo), China (Hong Kong) and US (Virginia) as regions that separate scopes through Workspaces, so that detail was removed from the evidence note and the page is marked as no longer independently establishing those two regions' inference location; the source note records the same boundary. The per-region pages are not among this provider's sources and cannot be used to add evidence. The remaining changes in the same diff are unrelated to the five dimensions: site top-navigation renames/additions (e.g. User Guide → Token Plan, AI DeepSign → DeepSynID), leading pipes dropped from two endpoint-table rows (formatting), and footer Previous/Next and Realtime API link names changed (navigation). Direction is recorded as clarified: the vendor delegated the mapping to per-region pages and dropped one summary sentence, with no statement that any region's actual selectable scope changed."
issue = "https://github.com/arcships/zdr-monitor/issues/1102"
