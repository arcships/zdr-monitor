summary_zh = "security.md 的 ZDR 功能表「Stored image and video outputs」一行改写：旧文在 ZDR 下写「no URL-format image results」且「For images, return base64 only」，并把 Console 视频 playground 记为不可用；新文允许图像经客户自带的预签名上传地址交付（`output.upload_urls`，延迟图像请求必填）、视频仍用 `output.upload_url`，并明确两种情形都由 SpaceXAI 通过 HTTP PUT 把结果传到客户 URL、自身不存储，Console 视频 playground 改为每次生成前询问预签名上传 URL（另有可选的预签名查看 URL）。「Under ZDR there is no SpaceXAI-side output storage…stores nothing itself」这一零存储保证本身未变，故方向记为 clarified。该行属按量 API 档的 ZDR 功能清单，不触及 Grok Build 的订阅登录路径；本 provider 的 supergrok / free 两档五维结论字段均未改（zdr 仍 unknown、retention 仍 undisclosed），也没有任何引文锚点引用该句。"
summary_en = "On security.md, the 'Stored image and video outputs' row of the ZDR feature table was rewritten: the old text said that under ZDR there are 'no URL-format image results' and 'For images, return base64 only', and recorded the Console video playground as unavailable; the new text allows images to be delivered via customer-supplied pre-signed upload URLs (`output.upload_urls`, required for deferred image requests) and video via `output.upload_url`, states that in both cases SpaceXAI uploads the result to your URL over HTTP PUT and stores nothing itself, and changes the Console video playground to ask for a pre-signed upload URL before each generation (plus an optional pre-signed view URL). The zero-storage assurance 'Under ZDR there is no SpaceXAI-side output storage... stores nothing itself' is itself unchanged, so the direction is recorded as clarified. The row belongs to the pay-as-you-go API tier's ZDR feature list and does not reach Grok Build's subscription login path; no verdict field changed on this provider's supergrok / free tiers (zdr stays unknown, retention stays undisclosed), and no anchor cites this sentence."
