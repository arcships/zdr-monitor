summary_zh = "developers Data residency 页本轮撤销印度的区域准入限制：Support by region 卡片的 India 行不再列出「Contact sales to access this region」这一额外准入要求，完整区域支持表的 India 行在「Additional access requirements」列改为「—」；United Arab Emirates 在卡片与完整区域支持表中仍写「Contact sales to access this region」。同时新增 /v1/moderations (CSAM classifier)（模型 `omni-moderation-csam-latest`）：逐端点表把 Storage regions 与 Processing regions 均记为「Not specified」，Notes 为「Available to approved organizations. Regional processing coverage is not specified for this model.」，支持服务计数由 26 增至 27。判定：印度区域处理的准入限制放宽，属 strengthened；新端点没有区域处理承诺，不构成对既有承诺的削弱，台账不替它推断覆盖范围。api 档 processing_region 结论字段未变（codes=[GLOBAL]）。原 India Contact sales 说明点与锚点因现行正文无对应句而撤除，新增 CSAM classifier 未指定区域覆盖的说明点与锚点。同轮侧栏（Specialized models 新增 CSAM classifier、Collections 展开）、导航与主题变化与五维无关。"
summary_en = "On the developers Data residency page, the India regional access restriction was removed this round: the India row of the Support by region card no longer lists the additional access requirement 'Contact sales to access this region', and the India row of the complete regional support table now shows '—' in the 'Additional access requirements' column; the United Arab Emirates row still says 'Contact sales to access this region' in both the card and the complete table. At the same time, a new /v1/moderations (CSAM classifier) endpoint (model `omni-moderation-csam-latest`) was added: the endpoint table marks both Storage regions and Processing regions as 'Not specified', the Notes read 'Available to approved organizations. Regional processing coverage is not specified for this model.', and the supported-services count rose from 26 to 27. Assessment: relaxing India's access restriction strengthens regional-processing availability; the new endpoint carries no regional-processing commitment, which does not weaken any existing commitment, and the ledger does not infer coverage for it. The API-tier processing_region verdict fields are unchanged (codes=[GLOBAL]). The old India contact-sales point and anchor were removed because no current sentence supports them, and a new point and anchor were added for the CSAM classifier's unspecified regional coverage. The same round's sidebar changes (CSAM classifier under Specialized models, expanded Collections), navigation, and theme are unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1270"
