summary_zh = "API 档退役 /v1/videos 的现行留存规则不再适用：2026-09-24 停机后，该端点从逐端点表删除；原 48 小时视频下载窗口与随后 30 天滥用监测改列为停机前的历史政策，且页面不承诺停机后的下载访问。仅就原视频端点的现行期限承诺记为减弱；其他 API 端点及默认滥用监测日志最多 30 天的条款未变，api 档总体 retention 结论仍为日志 30 天固定期。"
summary_en = "For the retired /v1/videos endpoint on the API tier, the previously current retention terms no longer apply: after its September 24, 2026 shutdown, the endpoint was removed from the per-endpoint table, and its former 48-hour download window followed by 30 days of abuse-monitoring retention is now described as pre-shutdown policy, with no promise of download access after shutdown. 'Weakened' applies only to the former live retention period for this retired endpoint; the terms for other API endpoints and the default up-to-30-day abuse-monitoring logs remain unchanged, as does the API tier's overall retention verdict."
