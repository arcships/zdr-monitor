summary_zh = "developers Data residency 页本轮把 GPT-6.2 Astra 与 GPT-6.2 Sol 加入区域驻留资格。资格说明段在澳/印/日句之后新增:「GPT-6.2 Astra and GPT-6.2 Sol support US and EU data residency with Standard, Fast, and Batch processing. Both models support Ultrafast with US data residency only.」;/v1/batches 的 Notes 由「GPT-6.1 Sol, GPT-6.1 Terra, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. GPT-6.1 Sol and GPT-6.1 Terra support only US and EU data residency.」改为在前面加入「GPT-6.2 Astra and GPT-6.2 Sol support US and EU data residency with Batch processing.」;/v1/chat/completions 的 Notes 同样在前面加入「GPT-6.2 Astra and GPT-6.2 Sol support US and EU data residency with Standard and Fast processing.」;两行 Supported models 与 /v1/responses 的模型清单都加入 `gpt-6.2-astra`、`gpt-6.2-sol`,模型快照计数由 33 增至 35、由 27 增至 29。逐端点表的 Processing regions、区域支持表与 Additional access requirements 列本轮未变,既有区域资格句(含澳/印/日 `gpt-6-luna`、eligible organizations、UAE Contact sales、图片支持需批准、CSAM classifier 区域覆盖未指定)原文均未动。判定:两个新模型进入 US 与 EU 区域驻留名单(Standard/Fast/Batch;Ultrafast 仅 US),属区域驻留/处理资格范围扩大,方向 strengthened;这对新模型是资格清单,不改变既有模型的覆盖。api 档 processing_region 结论字段未变(codes=[GLOBAL]),本轮未改锚点。同轮代码示例把 `gpt-5.6-terra` 换成 `gpt-6.1-terra`,侧栏新增 Using GPT-6.2 与 Google Cloud,与五维无关。"
summary_en = "On the developers Data residency page, GPT-6.2 Astra and GPT-6.2 Sol were added to the regional residency eligibility this round. After the Australia/India/Japan sentence, the eligibility paragraph now adds: 'GPT-6.2 Astra and GPT-6.2 Sol support US and EU data residency with Standard, Fast, and Batch processing. Both models support Ultrafast with US data residency only.' The /v1/batches Notes gained a leading 'GPT-6.2 Astra and GPT-6.2 Sol support US and EU data residency with Batch processing.' before the existing 'GPT-6.1 Sol, GPT-6.1 Terra, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. GPT-6.1 Sol and GPT-6.1 Terra support only US and EU data residency.' The /v1/chat/completions Notes likewise gained a leading 'GPT-6.2 Astra and GPT-6.2 Sol support US and EU data residency with Standard and Fast processing.' Both Supported models lists and the /v1/responses model list now include `gpt-6.2-astra` and `gpt-6.2-sol`, and the model snapshot counts rose from 33 to 35 and from 27 to 29. The per-endpoint table's Processing regions, the regional support table, and the Additional access requirements column are unchanged this round, and all existing regional-eligibility sentences (Australia/India/Japan `gpt-6-luna`, eligible organizations, UAE contact sales, image support requiring approval, and the CSAM classifier's unspecified regional coverage) are untouched. Assessment: two new models joined the US and EU regional residency lists (Standard/Fast/Batch; Ultrafast US-only), which expands the scope of regional residency and processing eligibility, so the direction is strengthened; for these new models this is an eligibility listing and it does not change coverage for existing models. No API-tier processing_region verdict field changed (codes=[GLOBAL]), and no anchor was modified this round. The same round changed the example code model from `gpt-5.6-terra` to `gpt-6.1-terra` and added Using GPT-6.2 and Google Cloud to the sidebar, unrelated to the five dimensions."
