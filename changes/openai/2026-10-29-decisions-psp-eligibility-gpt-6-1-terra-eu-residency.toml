summary_zh = "developers /api/docs/guides/your-data 本轮有两处与五维有关的正文变化。(1) Decisions API 的保留控制资格由待确认变为已确认：/v1/decisions 在逐端点表的 Private Retention with PSP and Safety Retention eligible 列由「Pending confirmation」改为「Yes, see below for limitations」。对应端点说明原为「By default, abuse monitoring logs are retained for up to 30 days. Eligible customers can use Zero Data Retention, subject to the limitations below.」，现改为先保留「By default, abuse monitoring logs are retained for up to 30 days.」，再新增「The Decisions API supports Zero Data Retention, Private Retention with PSP, and Safety Retention, subject to the eligibility and account configuration requirements described above.」「The Decisions API follows the same Private Retention with PSP policy as the Responses API. Flagged content and a sample of requests may be retained for automated safety review. See Private Retention with PSP for details.」与「The following limitations apply:」；ZDR eligible 列仍为「Yes, see below for limitations」，滥用监测 30 天与 prompt caching 24 小时两条限制未变。(2) Data residency 新增 GPT-6.1 Terra 的 EU 驻留资格：资格说明段由「EU data residency is not available for every model in Fast mode. Fast mode supports EU data residency for GPT-6.1 Sol and GPT-6 Luna. Fast mode is not available with EU data residency for GPT-6 Astra or GPT-6 Sol. GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. Ultrafast mode for GPT-6.1 Sol supports US and EU data residency and global processing. GPT-6 Astra Ultrafast supports US data residency and global processing only.」改为把 Fast 模式的 EU 驻留名单与 Standard/Flex/Batch 的 EU 驻留名单都加入 GPT-6.1 Terra，并把区域限制句改为「GPT-6.1 Sol and GPT-6.1 Terra support only US and EU data residency」；/v1/batches、/v1/chat/completions、/v1/responses 的 Notes 与区域支持表同步改写，Supported models 与模型快照计数随新增模型更新（32→33、26→27）。判定：Decisions 的 PSP/Safety Retention 资格由待确认变为确认属表述澄清（clarified），ZDR eligible 未变；GPT-6.1 Terra 加入 EU 驻留名单是资格范围扩大（strengthened）。api 档五维结论字段未变：zdr 仍 mark=yes/mode=opt_in，processing_region 仍 codes=[GLOBAL]；既有锚点句原文均未动，故未改结论或锚点。同轮其余变化为侧栏、代码示例与 Copy Page 顺序，与五维无关。"
summary_en = "The developers /api/docs/guides/your-data page carried two body changes relevant to the five dimensions this round. (1) Decisions API retention-control eligibility moved from pending confirmation to confirmed: in the per-endpoint table, the Private Retention with PSP and Safety Retention eligible cell for /v1/decisions changed from 'Pending confirmation' to 'Yes, see below for limitations'. The corresponding endpoint note used to read 'By default, abuse monitoring logs are retained for up to 30 days. Eligible customers can use Zero Data Retention, subject to the limitations below.'; it now keeps 'By default, abuse monitoring logs are retained for up to 30 days.' and adds 'The Decisions API supports Zero Data Retention, Private Retention with PSP, and Safety Retention, subject to the eligibility and account configuration requirements described above.', 'The Decisions API follows the same Private Retention with PSP policy as the Responses API. Flagged content and a sample of requests may be retained for automated safety review. See Private Retention with PSP for details.', and 'The following limitations apply:'. The Zero Data Retention eligible cell remains 'Yes, see below for limitations', and the 30-day abuse monitoring and 24-hour prompt caching limitations are unchanged. (2) Data residency added GPT-6.1 Terra EU residency eligibility. The eligibility paragraph previously read 'EU data residency is not available for every model in Fast mode. Fast mode supports EU data residency for GPT-6.1 Sol and GPT-6 Luna. Fast mode is not available with EU data residency for GPT-6 Astra or GPT-6 Sol. GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. Ultrafast mode for GPT-6.1 Sol supports US and EU data residency and global processing. GPT-6 Astra Ultrafast supports US data residency and global processing only.'; it now adds GPT-6.1 Terra to both the Fast mode EU residency list and the Standard/Flex/Batch EU residency list, and the regional restriction sentence becomes 'GPT-6.1 Sol and GPT-6.1 Terra support only US and EU data residency'. The Notes for /v1/batches, /v1/chat/completions, and /v1/responses and the regional support table were rewritten in step, and the Supported models lists and model snapshot counts were updated with the new model (32 to 33, 26 to 27). Assessment: confirming the Decisions API's PSP/Safety Retention eligibility is a clarification (clarified) while Zero Data Retention eligible stays unchanged; adding GPT-6.1 Terra to the EU residency list expands eligibility (strengthened). No verdict field changed on the API tier: zdr remains mark=yes/mode=opt_in and processing_region remains codes=[GLOBAL]; all existing anchor sentences are unchanged, so no verdict or anchor was modified. The rest of this round's diff is sidebar churn, example code, and Copy Page ordering, unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/916"
