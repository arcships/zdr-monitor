summary_zh = "developers /api/docs/guides/your-data 本轮在 /v1/responses 小节新增一条与五维有关的正文:「Projects with Zero Data Retention can use the `2h` and `8h` background completion windows. The API treats `store` as `false` and temporarily stores application state to process the request and make the response available for retrieval.」。旧正文没有这句:此前的 ZDR 相关说明没有提到 2h/8h 后台完成窗口,也没有说明这些窗口下仍会临时存储应用状态。新句写明 ZDR 项目可用 2h/8h 后台完成窗口、API 把 store 当作 false,并临时存储应用状态以完成请求和供检索;页面未给出该临时应用状态的固定保留期限,故只能记为临时存储,不能推成 2h/8h 的存储期。同一小节 Background mode 段同时改写:旧句「Background mode stores response data to disk for roughly 10 minutes to enable polling.」改为「Background mode with the default completion window stores response data to disk for roughly 10 minutes to run the request and make the response available for retrieval.」;旧句「Background responses follow the standard retention period only when the request explicitly sets `store=true`.」改为「With the default completion window, background responses follow the standard retention period only if you explicitly set `store=true`.」;旧句「If `store` is omitted or set to `false` for a background request, the response is deleted after the temporary polling period.」改为「If you omit `store` or set it to `false`, the response is deleted after the temporary retention period.」。10 分钟临时落盘、以及 MAM(含 enhanced MAM)项目前台请求与 store=true 后台响应的标准保留条件未变,改的是限定语与期限名称(polling→retention)。判定:新增句披露的是 ZDR 与 2h/8h 后台完成窗口并存时的临时存储行为,不削弱 ZDR 的可申请性,也不改变滥用监测日志 30 天上限的 retention 结论,属 clarified;api 档 zdr 结论字段未变(mark=yes、mode=opt_in),retention 结论字段未变(days=30、object=logs、basis=fixed_period)。retention 下新增一条说明点与锚点,并把既有 /v1/responses 30 天下限锚点的 suffix 更新为改写后的下一句(原 suffix 句已不存在)。同轮侧栏(Using GPT-6.2、CSAM classifier、Google Cloud、Collections 展开)、导航与主题与五维无关。"
summary_en = "On the developers /api/docs/guides/your-data page, the /v1/responses section gained a new sentence relevant to the five dimensions this round: 'Projects with Zero Data Retention can use the `2h` and `8h` background completion windows. The API treats `store` as `false` and temporarily stores application state to process the request and make the response available for retrieval.' The old text had no such sentence: the prior Zero Data Retention disclosures did not mention the 2h and 8h background completion windows and did not say that application state is still stored temporarily under those windows. The new sentence says ZDR projects can use the 2h and 8h background completion windows, that the API treats store as false, and that it temporarily stores application state to process the request and make the response available for retrieval. The page gives no fixed retention period for that temporary application state, so it can only be recorded as temporary storage; the 2h and 8h figures must not be read as storage periods. The same section's Background mode paragraph was also reworded: 'Background mode stores response data to disk for roughly 10 minutes to enable polling.' became 'Background mode with the default completion window stores response data to disk for roughly 10 minutes to run the request and make the response available for retrieval.'; 'Background responses follow the standard retention period only when the request explicitly sets `store=true`.' became 'With the default completion window, background responses follow the standard retention period only if you explicitly set `store=true`.'; and 'If `store` is omitted or set to `false` for a background request, the response is deleted after the temporary polling period.' became 'If you omit `store` or set it to `false`, the response is deleted after the temporary retention period.' The roughly 10-minute temporary disk storage and the conditions under which Modified Abuse Monitoring (including enhanced MAM) projects get standard retention for foreground requests and for background responses with store=true are unchanged; only the qualifier and the name of the period (polling to retention) changed. Assessment: the new sentence discloses how temporary storage behaves when ZDR and the 2h and 8h background completion windows coexist. It does not weaken the availability of ZDR and does not change the retention conclusion that abuse monitoring logs are capped at 30 days, so the direction is clarified. No API-tier verdict field changed: zdr remains mark=yes/mode=opt_in and retention remains days=30/object=logs/basis=fixed_period. A retention point and anchor were added, and the suffix of the existing /v1/responses 30-day lower-bound anchor was updated to the reworded following sentence (the old suffix sentence no longer exists). This round's sidebar changes (Using GPT-6.2, CSAM classifier, Google Cloud, expanded Collections), navigation, and theme are unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1315"
