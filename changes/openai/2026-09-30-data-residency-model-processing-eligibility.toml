summary_zh = "developers /api/docs/guides/your-data 的 Data residency 资格说明有两处互不相同的改写,不是同一次改写:(1) Data residency 自由文本段(Which models and features are eligible for data residency?)把旧句 A「For GPT-6 Sol and Luna, EU data residency is available only with Standard processing for Responses and Chat Completions.」换成 C「Fast mode is not available with EU data residency for GPT-6 Astra, GPT-6.1 Sol, GPT-6 Sol, or GPT-6 Luna. GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. Ultrafast mode supports US data residency and global processing only. It does not support EU or other non-US regional processing endpoints.」;(2) 同页 /v1/batches 的 Notes 把较短旧句 A′「For GPT-6 Sol and Luna, EU data residency is available only with Standard processing.」换成 B「GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. GPT-6.1 Sol supports only US and EU data residency.」。A 与 A′ 是分处两段的旧句(A 多出 for Responses and Chat Completions),所以是 A→C、A′→B,不能把 A 配到 B。另 /v1/chat/completions 的 Notes 新增本端点专属的「Fast mode is not available with EU data residency for GPT-6 Astra, GPT-6.1 Sol, GPT-6 Sol, or GPT-6 Luna. GPT-6.1 Sol supports only US and EU data residency.」;逐端点区域支持表中 /v1/batches、/v1/chat/completions、/v1/responses 的 EU「Standard processing only」regional-processing 例外被删除(/v1/batches 改列为 None,另两个只剩 UAE 例外),支持模型名单加入 gpt-6.1-sol。侧栏「Performance and quality」下旧正文本来就有 Fast mode 条目,本轮只是把它上移到 Ultrafast mode 之前,所以 Fast mode 不是本次新引入的模式,本次新增的模式是 Ultrafast mode;Fast mode 本次新增的是关于它的 EU 驻留限制说明「Fast mode is not available with EU data residency…」。同轮其余改动是侧栏/目录与模型快照名单,与五维无关。判定:对既有模型(GPT-6 Sol、GPT-6 Luna),EU 驻留可选处理模式由仅 Standard 扩为 Standard/Flex/Batch,且原「Standard only」regional-processing 例外被删,属放宽;同时新引入的 Ultrafast 模式与新模式 GPT-6.1 Sol 各带区域限制(Ultrafast 仅 US 驻留与全局处理、GPT-6.1 Sol 仅 US/EU),加之 Fast mode 新增的 EU 驻留限制说明,属收紧。两向并存,故方向记为 clarified。api 档 processing_region 的结论字段未变(仍 codes=[GLOBAL]:默认无驻留、项目级可选区域存储、非美国区域需额外审批),其锚点句「your customer content (as defined in your services agreement) for that project will be stored at rest in the selected region」原文未动,故未改结论或锚点。"
summary_en = "The data-residency eligibility notes in developers /api/docs/guides/your-data were rewritten in two distinct places, not one. (1) In the Data residency free-text section (Which models and features are eligible for data residency?) the old sentence A, 'For GPT-6 Sol and Luna, EU data residency is available only with Standard processing for Responses and Chat Completions.', was replaced by C, 'Fast mode is not available with EU data residency for GPT-6 Astra, GPT-6.1 Sol, GPT-6 Sol, or GPT-6 Luna. GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. Ultrafast mode supports US data residency and global processing only. It does not support EU or other non-US regional processing endpoints.'. (2) On the same page the /v1/batches Notes replaced the shorter old sentence A-prime, 'For GPT-6 Sol and Luna, EU data residency is available only with Standard processing.', with B, 'GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. GPT-6.1 Sol supports only US and EU data residency.'. A and A-prime are two different old sentences in two different sections (A adds 'for Responses and Chat Completions'), so the pairs are A to C and A-prime to B; A must not be paired with B. In addition, the /v1/chat/completions Notes gained an endpoint-specific addition, 'Fast mode is not available with EU data residency for GPT-6 Astra, GPT-6.1 Sol, GPT-6 Sol, or GPT-6 Luna. GPT-6.1 Sol supports only US and EU data residency.'; in the per-endpoint regional-support table the EU 'Standard processing only' regional-processing exception was deleted for /v1/batches, /v1/chat/completions, and /v1/responses (/v1/batches now reads None, the other two keep only the UAE exception), and gpt-6.1-sol was added to the supported-model lists. In the sidebar the old text already carried a Fast mode entry under 'Performance and quality'; this round merely moved it above Ultrafast mode, so Fast mode is not a mode introduced in this change — the mode introduced now is Ultrafast mode, while what is new about Fast mode is the EU residency restriction statement 'Fast mode is not available with EU data residency...'. The rest of this round's diff is sidebar/table-of-contents and model snapshot lists, unrelated to the five dimensions. Assessment: for the existing models (GPT-6 Sol, GPT-6 Luna) the processing modes available under EU residency expanded from Standard only to Standard, Flex, and Batch, and the former 'Standard only' regional-processing exception was removed — a loosening; at the same time the newly introduced Ultrafast mode and the new GPT-6.1 Sol carry their own regional limits (Ultrafast mode US residency and global processing only, GPT-6.1 Sol US and EU only), and Fast mode gained its new EU residency restriction statement — a tightening. With both directions present, the direction is recorded as clarified. No verdict field on the API tier's processing_region changed (still codes=[GLOBAL]: no residency by default, optional project-level regional storage, non-US regions require additional approval), and its anchor sentence 'your customer content (as defined in your services agreement) for that project will be stored at rest in the selected region' is unchanged, so no verdict or anchor was modified."
