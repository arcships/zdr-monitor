summary_zh = "developers /api/docs/guides/your-data 本轮有四处与五维有关的正文变化。(1) Data residency 资格说明（Which models and features are eligible for data residency?）与 /v1/chat/completions、/v1/responses 的 Notes 改写 Fast/Ultrafast 模式的 EU 驻留资格：旧句「Fast mode is not available with EU data residency for GPT-6 Astra, GPT-6.1 Sol, GPT-6 Sol, or GPT-6 Luna. GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. Ultrafast mode supports US data residency and global processing only. It does not support EU or other non-US regional processing endpoints.」改为「EU data residency is not available for every model in Fast mode. Fast mode supports EU data residency for GPT-6.1 Sol and GPT-6 Luna. Fast mode is not available with EU data residency for GPT-6 Astra or GPT-6 Sol. GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. Ultrafast mode for GPT-6.1 Sol supports US and EU data residency and global processing. GPT-6 Astra Ultrafast supports US data residency and global processing only.」。即 Fast 模式的 EU 驻留由四个模型全部不适用改为 GPT-6.1 Sol 与 GPT-6 Luna 适用（仍不适用 GPT-6 Astra 与 GPT-6 Sol）；Ultrafast 由一律仅 US 驻留与全局处理改为 GPT-6.1 Sol 支持 US 与 EU 驻留及全局处理、GPT-6 Astra 仍仅 US 驻留与全局处理。两条逐端点 Notes 同步改写，GPT-6.1 Sol、GPT-6 Sol、GPT-6 Luna 的 Standard/Flex/Batch 说明与 /v1/batches 的 Notes 未变。(2) 逐端点表新增 /v1/audio/voices 一行：Data used for training「No」、Abuse monitoring retention「30 days」、Application state retention「Until deleted」、Zero Data Retention eligible「No」、Private Retention with PSP and Safety Retention eligible「No」。(3) /v1/responses 的 Notes 删除一句「When Zero Data Retention is not enabled for an organization, all queries use extended prompt caching for all supported models.」，没有替代句；其余 prompt caching 24 小时句与逐端点表未动。(4) /v1/images 的 ZDR 兼容模型名单删除 `gpt-image-1`，保留 `gpt-image-2.5-sunburst`、`gpt-image-2.5-sunburst-2026-09-08`、`gpt-image-2.5-flare`、`gpt-image-2.5-flare-2026-09-08`、`gpt-image-2`、`gpt-image-1.5`、`gpt-image-1-mini`；同页 Data residency 的支持模型名单（/v1/images/edits、/v1/images/generations）与 Supported models 列表也不再列 `gpt-image-1`，/v1/images/generations 的支持模型列表变为空，页面未说明原因。判定：Fast/Ultrafast 的 EU 驻留资格对 GPT-6.1 Sol、GPT-6 Luna 放宽（strengthened），图片 ZDR 兼容名单缩小（weakened）；新增端点行与删除缓存说明属披露结构调整（clarified）。api 档 processing_region 结论字段未变（仍 codes=[GLOBAL]），zdr 仍为 mark=yes/mode=opt_in，retention 仍为滥用监测日志 30 天上限；三个维度的既有锚点句原文均未动，故未改结论或锚点。同轮其余改动是侧栏/目录、模型快照名单与 Copy Page 顺序，与五维无关。"
summary_en = "The developers /api/docs/guides/your-data page carried four body changes relevant to the five dimensions this round. (1) The data-residency eligibility section (Which models and features are eligible for data residency?) and the Notes for /v1/chat/completions and /v1/responses rewrote Fast/Ultrafast EU residency eligibility. The old sentence, 'Fast mode is not available with EU data residency for GPT-6 Astra, GPT-6.1 Sol, GPT-6 Sol, or GPT-6 Luna. GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. Ultrafast mode supports US data residency and global processing only. It does not support EU or other non-US regional processing endpoints.', became 'EU data residency is not available for every model in Fast mode. Fast mode supports EU data residency for GPT-6.1 Sol and GPT-6 Luna. Fast mode is not available with EU data residency for GPT-6 Astra or GPT-6 Sol. GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna support EU data residency with Standard, Flex, and Batch processing. Ultrafast mode for GPT-6.1 Sol supports US and EU data residency and global processing. GPT-6 Astra Ultrafast supports US data residency and global processing only.'. In other words, Fast mode EU residency moved from unavailable for all four models to available for GPT-6.1 Sol and GPT-6 Luna (still unavailable for GPT-6 Astra and GPT-6 Sol); Ultrafast moved from US residency and global processing only for every model to US and EU residency plus global processing for GPT-6.1 Sol, while GPT-6 Astra Ultrafast remains US residency and global processing only. The two per-endpoint Notes were rewritten in step; the Standard/Flex/Batch statement for GPT-6.1 Sol, GPT-6 Sol, and GPT-6 Luna and the /v1/batches Notes are unchanged. (2) The per-endpoint table gained a /v1/audio/voices row: Data used for training 'No', Abuse monitoring retention '30 days', Application state retention 'Until deleted', Zero Data Retention eligible 'No', and Private Retention with PSP and Safety Retention eligible 'No'. (3) The /v1/responses Notes deleted the sentence 'When Zero Data Retention is not enabled for an organization, all queries use extended prompt caching for all supported models.' with no replacement; the other prompt-caching 24-hour sentence and the per-endpoint table are unchanged. (4) The /v1/images list of ZDR-compatible models dropped `gpt-image-1`, keeping `gpt-image-2.5-sunburst`, `gpt-image-2.5-sunburst-2026-09-08`, `gpt-image-2.5-flare`, `gpt-image-2.5-flare-2026-09-08`, `gpt-image-2`, `gpt-image-1.5`, and `gpt-image-1-mini`; on the same page the data-residency supported-model lists for /v1/images/edits and /v1/images/generations and the Supported models lists no longer include `gpt-image-1` either, and the /v1/images/generations supported-model list is now empty, with no explanation on the page. Assessment: EU residency eligibility for Fast/Ultrafast expanded for GPT-6.1 Sol and GPT-6 Luna (strengthened), the image ZDR compatibility list narrowed (weakened), and the added endpoint row plus removed caching sentence are disclosure restructuring (clarified). No verdict field changed on the API tier: processing_region remains codes=[GLOBAL], zdr remains mark=yes/mode=opt_in, and retention remains the 30-day cap for abuse monitoring logs; all existing anchor sentences for these three dimensions are unchanged, so no verdict or anchor was modified. The rest of this round's diff is sidebar/table-of-contents churn, model snapshot lists, and Copy Page ordering, unrelated to the five dimensions."
