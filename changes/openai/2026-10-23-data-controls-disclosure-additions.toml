summary_zh = "help.openai.com 文章 7730893（Data controls in ChatGPT）新增四处与五维有关的正文。其一，在「Turn off Improve the model for everyone」下新增「On personal workspaces with ChatGPT Free, Plus, or Pro, data sharing is enabled by default. You can turn off Improve the model for everyone and keep your chat history.」，把个人档默认开启数据共享、关闭训练后仍保留对话历史写成明确句子。其二，新增「Voice mode has a separate control for sharing data for model training.」，说明语音数据另有独立的训练开关，本节的 Improve the model for everyone 不覆盖语音；紧随其后的「The Privacy Portal has more information about your privacy options.」只是隐私选项入口说明，本条记录不据此推断隐私门户选项与语音开关的关系。其三，「What happens to saved chats」新增锁定对话条目：「When Locked chats is available for your account, locked chats remain saved but are hidden from the regular sidebar, Search, recents, notifications, and previews. Your Improve the model for everyone setting and applicable workspace policies continue to apply.」，即锁定是隐藏而非删除，训练设置与工作区策略继续生效。其四，「Managed workspaces」新增「By default, OpenAI also does not use inputs and outputs provided through the API Platform to train its models.」，是 API 训练默认口径的 enterprise_privacy_faq 层旁证。消费档 training 仍为 mark=no、mode=opt_out，retention 仍为 object=input_output、basis=until_termination；api 档 training 仍为 mark=yes、mode=default，主证据仍是 developer_data 页。本轮把语音模式句、锁定对话句分别补进消费档 training/retention 说明点，并把 API 训练句作为旁证补进 api 档 training 说明点；默认共享句由既有 training 说明点覆盖。同轮该页标题层级（#→##/###）、Updated 时间戳、Related articles、状态横幅，以及「this setting applies to your account across devices」改为「Improve the model for everyone applies to your account across web and mobile devices」的同义改写与五维无关；另一来源 8983778 同轮只有状态横幅、Updated 时间戳和 Related articles 标题/顺序变化，留存条款正文未变。五维结论字段均未变，方向记为 clarified。"
summary_en = "The help.openai.com article 7730893 (Data controls in ChatGPT) added four passages relevant to the five dimensions. First, under 'Turn off Improve the model for everyone' it added 'On personal workspaces with ChatGPT Free, Plus, or Pro, data sharing is enabled by default. You can turn off Improve the model for everyone and keep your chat history.', making explicit that individual plans have data sharing on by default and that turning training off keeps chat history. Second, it added 'Voice mode has a separate control for sharing data for model training.', so voice data has its own training control and the Improve the model for everyone setting described in this section does not cover voice; the sentence that follows, 'The Privacy Portal has more information about your privacy options.', only points to where privacy options are documented, and this record makes no claim about whether the Privacy Portal option is also the voice control. Third, 'What happens to saved chats' added a locked-chats bullet: 'When Locked chats is available for your account, locked chats remain saved but are hidden from the regular sidebar, Search, recents, notifications, and previews. Your Improve the model for everyone setting and applicable workspace policies continue to apply.' Locking therefore hides rather than deletes, and the training setting and workspace policies still apply. Fourth, 'Managed workspaces' added 'By default, OpenAI also does not use inputs and outputs provided through the API Platform to train its models.', which is enterprise_privacy_faq-tier corroboration of the API no-training default. The consumer training verdict remains mark=no, mode=opt_out, and consumer retention remains object=input_output, basis=until_termination; the API training verdict remains mark=yes, mode=default with the developer_data page as primary evidence. This round adds the voice-mode and locked-chats sentences as consumer training/retention points, and records the API training sentence as corroboration on the API training verdict; the default-sharing sentence is covered by the existing training point. In the same diff, heading levels (# to ##/###), the Updated timestamp, Related articles, the status banner, and the same-meaning rewrite from 'this setting applies to your account across devices' to 'Improve the model for everyone applies to your account across web and mobile devices' are unrelated to the five dimensions; the other source 8983778 changed only its status banner, Updated timestamp and a Related articles title/order, with the retention clauses unchanged. No verdict field changed on either tier; direction is recorded as clarified."
