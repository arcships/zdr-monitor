summary_zh = "help.openai.com 文章 7730893（Data controls in ChatGPT）本轮把 Managed workspaces 节的原句「By default, OpenAI also does not use inputs and outputs provided through the API Platform to train its models.」删除，改写为「By default, API inputs and outputs are not used to train our foundation models. Separately, we may use API content from a limited subset of API customers for safety-classifier training and safety evaluations. See the API Platform FAQ on our Enterprise Privacy page for details about these uses and which customers they apply to.」：默认不训练口径由「its models」收窄到「our foundation models」，并新增安全分类器训练与安全评估的例外。同一轮 5722486（How your data is used to improve model performance）在 Business services and managed workspaces 节新增同义例外段，并给出范围：「For a limited subset of API customers who do not have modified retention enabled and are not managed by our sales team, we may use API content to train safety classifiers and conduct safety evaluations that help detect and prevent abuse. This use is separate from foundation model training and does not require an opt-in to model training.」即仅对未启用 modified retention 且非销售团队管理的部分 API 客户，API 内容可能用于训练安全分类器与安全评估；厂商写明该用途与基础模型训练分开、且不要求 opt-in。两页均未给该用途的保留期限。api 档 training 结论字段未变（mark=yes、mode=default）：主证据 developer_data 页仍写「data sent to the OpenAI API is not used to train or improve OpenAI models (unless you explicitly opt in to share data with us)」，高权威来源的默认不训练结论未被低权威帮助页推翻；新增例外已作为 enterprise_privacy_faq 层旁证补进说明点，原锚点 openai-api-training-not-used-faq-corroboration 因原句删除改绑到新句。方向记为 weakened：公开文本新增了一项对 API 内容的训练用途例外。同轮 7730893 的标题层级（#↔##）、iOS 步骤新增 Home tab、Updated 时间戳、Related articles、页首 OpenAI Support 与状态行，以及 5722486 的 Updated 时间戳、Related articles 与页首 OpenAI Support，均与五维无关。"
summary_en = "On help.openai.com article 7730893 (Data controls in ChatGPT), the Managed workspaces section replaced the sentence 'By default, OpenAI also does not use inputs and outputs provided through the API Platform to train its models.' with 'By default, API inputs and outputs are not used to train our foundation models. Separately, we may use API content from a limited subset of API customers for safety-classifier training and safety evaluations. See the API Platform FAQ on our Enterprise Privacy page for details about these uses and which customers they apply to.' The no-training default is narrowed from 'its models' to 'our foundation models' and now carries an explicit safety-classifier-training and safety-evaluation carve-out. In the same round, article 5722486 (How your data is used to improve model performance) added a parallel paragraph under Business services and managed workspaces: 'For a limited subset of API customers who do not have modified retention enabled and are not managed by our sales team, we may use API content to train safety classifiers and conduct safety evaluations that help detect and prevent abuse. This use is separate from foundation model training and does not require an opt-in to model training.' Only that subset of API customers is affected; the vendor states the use is separate from foundation model training and requires no opt-in. Neither page states a retention period for this use. The API training verdict fields are unchanged (mark=yes, mode=default): the primary developer_data page still states 'data sent to the OpenAI API is not used to train or improve OpenAI models (unless you explicitly opt in to share data with us)', and the lower-authority help page does not overturn that default; the new carve-out is recorded as an enterprise_privacy_faq-tier caveat, and anchor openai-api-training-not-used-faq-corroboration was rebound to the new sentence because the old one was deleted. The direction is recorded as weakened because the published text adds a training use exception for API content. The heading-level changes (# to ##), the new Home tab step, the Updated timestamp, Related articles, the OpenAI Support header and status line on 7730893, and the Updated timestamp, Related articles and OpenAI Support header on 5722486 are unrelated to the five dimensions."
