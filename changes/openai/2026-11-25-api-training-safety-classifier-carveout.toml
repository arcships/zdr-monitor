summary_zh = "help.openai.com 文章 7730893（Data controls in ChatGPT）的 Managed workspaces 节本轮把整句「By default, OpenAI also does not use inputs and outputs provided through the API Platform to train its models.」改为「By default, API inputs and outputs are not used to train our foundation models. Separately, we may use API content from a limited subset of API customers for safety-classifier training and safety evaluations. See the API Platform FAQ on our Enterprise Privacy page for details about these uses and which customers they apply to.」：原句对「its models」的全面不训练表述被限缩为 foundation models，并新增对有限子集 API 客户内容的安全分类器训练与安全评估用途。同轮文章 5722486（How your data is used to improve model performance）在 Business services and managed workspaces 节新增同一口径的展开句「For a limited subset of API customers who do not have modified retention enabled and are not managed by our sales team, we may use API content to train safety classifiers and conduct safety evaluations that help detect and prevent abuse. This use is separate from foundation model training and does not require an opt-in to model training.」，写明适用子集（未启用 modified retention 且不由销售团队管理）且无需 opt-in。方向记为 weakened：默认不训练的表述被限缩并新增默认训练用途，对用户不利。api 档 training 结论字段未变（mark=yes、mode=default）：主证据 developer_data 页仍为无保留的「data sent to the OpenAI API is not used to train or improve OpenAI models」，两条官方文本按原样并列；原 FAQ 旁证锚点改绑新首句，并新增安全分类器例外说明点与锚点。消费档 training 不受影响（新句位于 Business services and managed workspaces 节）。同轮两页其余变化为标题层级、iOS/Android 入口说明、Updated 时间戳与 Related articles，与五维无关。"
summary_en = "On help.openai.com article 7730893 (Data controls in ChatGPT), the Managed workspaces section replaced the sentence 'By default, OpenAI also does not use inputs and outputs provided through the API Platform to train its models.' with 'By default, API inputs and outputs are not used to train our foundation models. Separately, we may use API content from a limited subset of API customers for safety-classifier training and safety evaluations. See the API Platform FAQ on our Enterprise Privacy page for details about these uses and which customers they apply to.' The unqualified no-training statement about 'its models' is narrowed to foundation models, and a safety-classifier training and safety-evaluation use is added for API content from a limited subset of customers. In the same round, article 5722486 (How your data is used to improve model performance) added the parallel sentence under Business services and managed workspaces: 'For a limited subset of API customers who do not have modified retention enabled and are not managed by our sales team, we may use API content to train safety classifiers and conduct safety evaluations that help detect and prevent abuse. This use is separate from foundation model training and does not require an opt-in to model training.' It defines the subset (no modified retention enabled and not managed by the sales team) and states that no opt-in is required. The direction is recorded as weakened: the no-training default is narrowed and a default training use is added, which moves against the user. The API tier's training verdict fields are unchanged (mark=yes, mode=default): the primary developer_data page still states without qualification that 'data sent to the OpenAI API is not used to train or improve OpenAI models', and both official texts are recorded as they stand. The old FAQ corroboration anchor was rebound to the new first sentence, and a safety-classifier exception point and anchor were added. The consumer training verdict is unaffected (the new sentence sits under Business services and managed workspaces). The remaining changes on both pages this round (heading levels, iOS/Android entry instructions, Updated timestamps, Related articles) are unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1423"
