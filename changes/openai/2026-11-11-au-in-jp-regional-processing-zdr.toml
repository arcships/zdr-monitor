summary_zh = "developers /api/docs/guides/your-data 本轮新增澳大利亚、印度、日本的区域处理资格。Data residency 资格说明段新增「In Australia, India, and Japan, organizations with active Zero Data Retention can use `gpt-6-luna` for regional processing. These regions support Standard pay-as-you-go only. Use a project in the selected region. The Responses and Chat Completions APIs support text and image inputs and text output. Hosted tools are unavailable for regional processing in these three regions.」;旧正文在这三地的 Processing 均为「No」,也没有这条资格说明。Support by region 卡片与完整区域支持表把 Australia（`au.api.openai.com`）、India（`in.api.openai.com`）、Japan（`jp.api.openai.com`）的 Processing 由「No」改为「Yes」:卡片的要求行由「Requires MAM or ZDR」改为「Requires MAM or ZDR***」,完整区域支持表的「MAM or ZDR required」列由「Yes」改为「Yes***」,并新增脚注「*** Regional processing in Australia, India, and Japan requires active Zero Data Retention (ZDR). Modified Abuse Monitoring (MAM) alone is insufficient.」。同一页面对这三地的模型例外有三处不同显示,按冲突并列记录:(1) 完整区域支持表(Australia 行的 Processing services 单元格列出 `/v1/chat/completions` (`gpt-6-luna`) 与 `/v1/responses` (`gpt-6-luna`),Japan、India 行的同一单元格列出 `/v1/responses` (`gpt-6-luna`));(2) 筛选视图的 Support by region 卡片只在 `/v1/chat/completions` 下显示 `gpt-6-luna`,其余服务折叠在「Show 18 more services」之后;(3) 逐端点表里 `/v1/chat/completions` 与 `/v1/responses` 的 Processing regions 均加入 Australia、India、Japan,但 Regional processing snapshot exceptions 列只有 `/v1/chat/completions` 行写「Australia, India, Japan: `gpt-6-luna`」,`/v1/responses` 行该列仍只有 UAE。即缺该例外记录的只是逐端点表的 exceptions 列,不能据此说快照未显示 `/v1/responses` 的三地模型例外。判定:三地由不支持区域处理变为支持(仅 Standard 按量付费、仅 `gpt-6-luna`,Data residency 段写明 Responses 与 Chat Completions 支持文本与图片输入/文本输出、无托管工具),属区域处理资格扩大;同时该资格要求已启用 Zero Data Retention,且明确「Modified Abuse Monitoring (MAM) alone is insufficient」,比欧洲的「Requires MAM or ZDR**」更严,故变化记录同时覆盖 zdr 维度。放宽与收紧并存,方向按仓库既有做法记 clarified。api 档结论字段未变:processing_region 仍 codes=[GLOBAL],zdr 仍 mark=yes/mode=opt_in;既有锚点句原文均未动,本轮只在 processing_region 下新增两条说明点及对应两个锚点。同轮其余变化为侧栏/目录(新增 Cloud providers、Automatic review、API keys and service accounts、Keep the prefix unchanged 等,删去 Reinforcement fine-tuning、RFT use cases、Deep research、Local shell 等)、主题切换与最新博客条目,与五维无关。"
summary_en = "The developers /api/docs/guides/your-data page added regional processing for Australia, India, and Japan. The data-residency eligibility paragraph now says: 'In Australia, India, and Japan, organizations with active Zero Data Retention can use `gpt-6-luna` for regional processing. These regions support Standard pay-as-you-go only. Use a project in the selected region. The Responses and Chat Completions APIs support text and image inputs and text output. Hosted tools are unavailable for regional processing in these three regions.' The old text listed these three regions with Processing set to 'No' and had no such eligibility statement. The Support by region cards and the complete regional support table changed Processing for Australia (`au.api.openai.com`), India (`in.api.openai.com`), and Japan (`jp.api.openai.com`) from 'No' to 'Yes': the cards' requirement line changed from 'Requires MAM or ZDR' to 'Requires MAM or ZDR***', the complete table's 'MAM or ZDR required' column changed from 'Yes' to 'Yes***', and the page added the footnote '*** Regional processing in Australia, India, and Japan requires active Zero Data Retention (ZDR). Modified Abuse Monitoring (MAM) alone is insufficient.' The same page displays the model exception for these three regions in three different ways, recorded side by side as a conflict: (1) in the complete regional support table the Australia processing-services cell lists `/v1/chat/completions` (`gpt-6-luna`) and `/v1/responses` (`gpt-6-luna`), while the Japan and India cells list `/v1/responses` (`gpt-6-luna`); (2) the filtered Support by region cards show `gpt-6-luna` only under `/v1/chat/completions`, with the remaining services collapsed behind 'Show 18 more services'; (3) in the per-endpoint table the Processing regions for both /v1/chat/completions and /v1/responses now include Australia, India, and Japan, but the Regional processing snapshot exceptions column carries 'Australia, India, Japan: `gpt-6-luna`' only on the /v1/chat/completions row, and the /v1/responses row's exception cell still lists only the UAE. The missing record is only in the per-endpoint table's exceptions column; it would be wrong to say the snapshot does not show a three-region model exception for /v1/responses. Assessment: these three regions moved from no regional processing to supported regional processing (Standard pay-as-you-go only, `gpt-6-luna` only; the data-residency paragraph says Responses and Chat Completions support text and image inputs and text output; no hosted tools), which expands regional-processing eligibility; at the same time the eligibility requires active Zero Data Retention and states that 'Modified Abuse Monitoring (MAM) alone is insufficient', which is stricter than Europe's 'Requires MAM or ZDR**', so the change record also covers the zdr dimension. With both a loosening and a tightening present, the direction follows the repository's existing practice and is recorded as clarified. No API-tier verdict field changed: processing_region remains codes=[GLOBAL] and zdr remains mark=yes/mode=opt_in; all existing anchor sentences are unchanged, and this round only adds two processing_region points and their two anchors. The rest of the diff is sidebar/navigation churn (adds Cloud providers, Automatic review, API keys and service accounts, Keep the prefix unchanged, etc.; removes Reinforcement fine-tuning, RFT use cases, Deep research, Local shell, etc.), theme toggle, and recent blog entries, unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/1190"
