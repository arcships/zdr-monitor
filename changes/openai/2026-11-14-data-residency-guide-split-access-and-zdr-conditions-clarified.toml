summary_zh = "developers /api/docs/guides/your-data 本轮把 Data residency controls 整节移出本页,改为「See the Data residency guide for regional storage and processing options, eligibility, setup instructions, and supported models and endpoints.」,正文落位到新页 /api/docs/guides/data-residency。迁移中有六处与五维有关的变化。(1) 区域存储与处理原句改写:旧句「If you use the supported endpoints, models, and snapshots listed below, your customer content (as defined in your services agreement) for that project will be stored at rest in the selected region to the extent the endpoint requires data persistence to function (such as /v1/batches).」改为「For supported endpoints, models, and snapshots, your Customer Content (as defined in your services agreement) is stored at rest in the selected region when the endpoint requires persistence, such as /v1/batches.」;旧句「If you select a region that supports regional processing, as specifically identified below, the services will perform inference for your Customer Content in the selected region as well.」改为「If the region supports regional processing, inference for your Customer Content also runs in that region.」。语义未变,仅改写措辞。(2) Sub-processors 句扩域(处理地承诺增强):旧句「OpenAI uses sub-processors to provide its services. For requests sent to `us.api.openai.com` or `eu.api.openai.com`, OpenAI uses Cloudflare Regional Services so that TLS termination and HTTPS decryption occur within the selected processing region.」改为「OpenAI uses sub-processors to provide its services. For requests sent to `us.api.openai.com`, `eu.api.openai.com`, `au.api.openai.com`, `in.api.openai.com`, or `jp.api.openai.com`, OpenAI uses Cloudflare Regional Services so that TLS termination and HTTPS decryption occur within the selected processing region.」,即 au/in/jp 三个区域域的 TLS termination 与 HTTPS decryption 也明确在所选处理区域内完成。(3) 澳/印/日区域处理不再要求 active ZDR:旧句「In Australia, India, and Japan, organizations with active Zero Data Retention can use `gpt-6-luna` for regional processing. These regions support Standard pay-as-you-go only. Use a project in the selected region. The Responses and Chat Completions APIs support text and image inputs and text output. Hosted tools are unavailable for regional processing in these three regions.」改为「In Australia, India, and Japan, `gpt-6-luna` supports regional processing. These regions support Standard pay-as-you-go only. Use a project in the selected region. The Responses and Chat Completions APIs support text and image inputs and text output. Hosted tools are unavailable for regional processing in these three regions.」;原脚注「*** Regional processing in Australia, India, and Japan requires active Zero Data Retention (ZDR). Modified Abuse Monitoring (MAM) alone is insufficient.」不再出现。(4) 区域表准入条件列由「MAM or ZDR required」改为「Additional access requirements」:旧句「Contact our sales team to see if you’re eligible for using data residency controls.」改为「Eligible organizations can enable data residency when creating a project in the API Platform.」,资格仍限 eligible organizations,但不再要求先联系销售确认;Europe、Australia、Japan 等由「Yes**/Yes***」变为「—」;India、United Arab Emirates 改为「Contact sales to access this region」(旧卡片分别为「Requires MAM or ZDR***」与「Requires MAM or ZDR」)。原「Additional requirements for non-US regions」段「To use data residency with any region other than the United States, you must be approved for abuse monitoring controls, and execute a Modified Retention amendment.」与「Selecting the United Arab Emirates region requires additional approval. Contact sales for assistance.」不再出现;旧脚注「* Image support in these regions requires approval for enhanced Zero Data Retention or enhanced Modified Abuse Monitoring.」「** Requires Zero Data Retention, Modified Abuse Monitoring, Private Retention with PSP, or Safety Retention.」不再出现,图片支持改为「Image support in these regions requires additional approval. Contact sales.」。区域处理的 ZDR/MAM 前提放宽,但新页仍写「Eligible organizations can enable data residency when creating a project in the API Platform」,India 与 UAE 仍要求 Contact sales。(5) 逐请求区域处理段改写:旧句「As an alternative to creating a region-specific project, you can select regional processing for an individual request by using the prefixed domain with an API key from a project having Global geography. Existing eligibility and data retention control requirements still apply. The selected endpoint and model must also support regional processing, as shown in the table below.」改为「To enable per-request data residency for a new Global project, follow the creation steps above, leave Data and inference residency set to Global, and select Enable per-request data residency before selecting Create. The project remains Global. Use an API key from that Global project with a regional domain prefix for each request that needs regional processing. The selected endpoint and model must support regional processing, as shown in the table below. If your existing Global project already supports per-request data residency, you can continue using its API keys.」。新页用建项目时的显式开关替代原「以 Global 项目 API key + 区域前缀直接选区域处理」的描述,但「Existing eligibility and data retention control requirements still apply.」不再出现;端点/模型支持要求仍在,页面未再写明数据保留控制要求。(6) 逐端点表与 Endpoint limitations 的其余内容随节迁入新页,包括 /v1/live/sessions 的 ZDR 会话保留说明。判定:既有区域处理承诺增强(sub-processors 扩至 au/in/jp),又有 ZDR/MAM 前提、非美国通行审批与逐请求数据保留控制要求被删除带来的放宽,方向记 clarified;api 档 processing_region 结论字段未变(codes=[GLOBAL]),zdr 结论字段未变(mark=yes/mode=opt_in)。processing_region 的旧区域引文按新页改绑;原「MAM alone is insufficient」锚点因现行正文不存在而撤除;新增 sub-processors、eligibility、India/UAE Contact sales 与图片支持限制的说明点及锚点。"
summary_en = "The developers /api/docs/guides/your-data page moved the entire Data residency controls section to a new page, /api/docs/guides/data-residency, leaving only 'See the Data residency guide for regional storage and processing options, eligibility, setup instructions, and supported models and endpoints.' Six changes relevant to the five dimensions occurred in the move. (1) The storage and processing sentences were reworded without changing their meaning: 'If you use the supported endpoints, models, and snapshots listed below, your customer content (as defined in your services agreement) for that project will be stored at rest in the selected region to the extent the endpoint requires data persistence to function (such as /v1/batches).' became 'For supported endpoints, models, and snapshots, your Customer Content (as defined in your services agreement) is stored at rest in the selected region when the endpoint requires persistence, such as /v1/batches.'; 'If you select a region that supports regional processing, as specifically identified below, the services will perform inference for your Customer Content in the selected region as well.' became 'If the region supports regional processing, inference for your Customer Content also runs in that region.' (2) The sub-processors sentence expanded (a strengthening for processing_region): 'OpenAI uses sub-processors to provide its services. For requests sent to `us.api.openai.com` or `eu.api.openai.com`, OpenAI uses Cloudflare Regional Services so that TLS termination and HTTPS decryption occur within the selected processing region.' became 'OpenAI uses sub-processors to provide its services. For requests sent to `us.api.openai.com`, `eu.api.openai.com`, `au.api.openai.com`, `in.api.openai.com`, or `jp.api.openai.com`, OpenAI uses Cloudflare Regional Services so that TLS termination and HTTPS decryption occur within the selected processing region.', so TLS termination and HTTPS decryption for the au/in/jp domains are now expressly performed within the selected processing region. (3) Australia/India/Japan regional processing no longer states an active ZDR precondition: 'In Australia, India, and Japan, organizations with active Zero Data Retention can use `gpt-6-luna` for regional processing. These regions support Standard pay-as-you-go only. Use a project in the selected region. The Responses and Chat Completions APIs support text and image inputs and text output. Hosted tools are unavailable for regional processing in these three regions.' became 'In Australia, India, and Japan, `gpt-6-luna` supports regional processing. These regions support Standard pay-as-you-go only. Use a project in the selected region. The Responses and Chat Completions APIs support text and image inputs and text output. Hosted tools are unavailable for regional processing in these three regions.'; the footnote '*** Regional processing in Australia, India, and Japan requires active Zero Data Retention (ZDR). Modified Abuse Monitoring (MAM) alone is insufficient.' no longer appears. (4) The regional table's access-condition column changed from 'MAM or ZDR required' to 'Additional access requirements': the old sentence 'Contact our sales team to see if you're eligible for using data residency controls.' became 'Eligible organizations can enable data residency when creating a project in the API Platform.'; eligibility is still limited to eligible organizations, but the page no longer tells readers to contact sales to confirm eligibility. Europe, Australia, Japan, and others moved from 'Yes**/Yes***' to '—'; India and the United Arab Emirates now show 'Contact sales to access this region' (their old cards said 'Requires MAM or ZDR***' and 'Requires MAM or ZDR' respectively). The old 'Additional requirements for non-US regions' paragraph ('To use data residency with any region other than the United States, you must be approved for abuse monitoring controls, and execute a Modified Retention amendment.') and 'Selecting the United Arab Emirates region requires additional approval. Contact sales for assistance.' no longer appear; the old footnotes '* Image support in these regions requires approval for enhanced Zero Data Retention or enhanced Modified Abuse Monitoring.' and '** Requires Zero Data Retention, Modified Abuse Monitoring, Private Retention with PSP, or Safety Retention.' are gone, and image support is now 'Image support in these regions requires additional approval. Contact sales.'. The ZDR/MAM preconditions for regional processing are relaxed, but the new page still says 'Eligible organizations can enable data residency when creating a project in the API Platform', and India and the UAE still require contacting sales. (5) The per-request regional processing paragraph was reworded: 'As an alternative to creating a region-specific project, you can select regional processing for an individual request by using the prefixed domain with an API key from a project having Global geography. Existing eligibility and data retention control requirements still apply. The selected endpoint and model must also support regional processing, as shown in the table below.' became 'To enable per-request data residency for a new Global project, follow the creation steps above, leave Data and inference residency set to Global, and select Enable per-request data residency before selecting Create. The project remains Global. Use an API key from that Global project with a regional domain prefix for each request that needs regional processing. The selected endpoint and model must support regional processing, as shown in the table below. If your existing Global project already supports per-request data residency, you can continue using its API keys.'. The new page replaces the old description (Global-project API key plus regional prefix) with an explicit project-creation toggle, but 'Existing eligibility and data retention control requirements still apply.' no longer appears; the endpoint/model support requirement remains, while the page no longer states the data retention control requirement. (6) The rest of the per-endpoint table and Endpoint limitations moved with the section, including the /v1/live/sessions ZDR session-retention text. Assessment: the change both strengthens regional-processing commitments (sub-processors expanded to au/in/jp) and relaxes them (removal of the ZDR/MAM preconditions, the blanket non-US approval and Modified Retention amendment requirement, and the per-request data retention control requirement), so the direction is clarified. No API-tier verdict field changed: processing_region remains codes=[GLOBAL] and zdr remains mark=yes/mode=opt_in. The old regional quotes were rebound to the new page; the old 'MAM alone is insufficient' anchor was removed because the sentence no longer exists; points and anchors were added for sub-processors, eligibility, India/UAE contact sales, and the image-support restriction."
