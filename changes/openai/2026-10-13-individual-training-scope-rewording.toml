summary_zh = "help.openai.com 文章 5722486（How your data is used to improve model performance）改写了两处与训练有关的正文，语义未变。其一，个人档训练句由旧句「When you use our services for individuals, such as ChatGPT and Codex, we may use your content to train our models.」改为「When you use our services for individuals (Free, Plus, Pro), we may use your content to train our models.」：档位范围改为明示 Free/Plus/Pro，Codex 不再出现在该句，但紧随其后的「Either option is sufficient for ChatGPT conversations and Codex tasks.」仍把退出方式覆盖到 Codex 任务，个人档默认可能用于训练的结论不变。其二，FAQ「What if I submit feedback after opting out?」的旧段「If you proactively choose to submit feedback, such as by selecting thumbs up or thumbs down on a response, the entire conversation associated with that feedback may be used to improve our models, even if you’ve opted out.」拆为个人档与企业档两段：个人档（Free、Plus、Pro）提交反馈后整段对话仍可能用于改进模型，即使已退出训练；企业档（ChatGPT Business/Enterprise/Edu）除非组织另签协议，否则不使用 prompts、responses 或文件改进模型，反馈也不授权训练。消费档 training 结论字段未变（mark=no、mode=opt_out），仅按新正文改绑训练锚点并同步说明文字。同轮 diff 中的 Pro $200 暂停横幅删除、「Updated」时间戳与 Related articles 列表变化与五维无关。"
summary_en = "The help.openai.com article 5722486 (How your data is used to improve model performance) rewrote two training-related passages without changing their meaning. First, the individual-tier training sentence changed from 'When you use our services for individuals, such as ChatGPT and Codex, we may use your content to train our models.' to 'When you use our services for individuals (Free, Plus, Pro), we may use your content to train our models.': the tier scope now names Free/Plus/Pro, and Codex is no longer in that sentence, but the immediately following 'Either option is sufficient for ChatGPT conversations and Codex tasks.' still extends the opt-out to Codex tasks, so the conclusion that individual-tier content may be used for training by default is unchanged. Second, the FAQ 'What if I submit feedback after opting out?' paragraph was split into individual and business paragraphs. The old text was 'If you proactively choose to submit feedback, such as by selecting thumbs up or thumbs down on a response, the entire conversation associated with that feedback may be used to improve our models, even if you’ve opted out.' The new text says that for individual plans (Free, Plus, Pro) the entire conversation associated with feedback may still be used to improve models even after opting out of model training, while for ChatGPT Business, Enterprise, and Edu OpenAI does not use prompts, responses, or files to improve its models unless the organization has signed a separate agreement, and response feedback does not permit training on the conversation. The consumer-tier training verdict fields are unchanged (mark=no, mode=opt_out); only the training anchor was rebound to the new wording and the descriptive text was synchronized. The removal of the Pro $200 pause banner, the 'Updated' timestamp, and the Related articles list in the same diff are unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/626"
