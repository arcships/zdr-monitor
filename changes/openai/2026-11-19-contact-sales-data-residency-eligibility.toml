summary_zh = "developers Data residency 页本轮在开头的资格说明段新增一句:「Contact sales to discuss your data residency needs and become eligible.」该句排在既有资格句「Eligible organizations can enable data residency when creating a project in the API Platform. Data residency endpoints are charged a 10% uplift for models released on or after March 5, 2026, that are eligible for data residency.」之后,说明尚未取得资格的组织可以联系销售讨论数据驻留需求并取得资格。上一版快照没有这句,也没有其他与资格获取有关的补充。判定:新增的是取得资格的途径说明,既没有删改「Eligible organizations」的资格限制,也没有改变各区域覆盖、区域准入列(United Arab Emirates 仍写 Contact sales to access this region)、图片支持需批准或 CSAM classifier 区域覆盖未指定等既有正文;它不取消任何区域处理/驻留承诺,也不承诺联系销售即获批。按澄清资格获取路径记 clarified,api 档 processing_region 结论字段未变(codes=[GLOBAL])。本轮补一条资格获取途径说明点与锚点;其余正文无与五维有关的变化。"
summary_en = "On the developers Data residency page, the introductory eligibility paragraph gained the sentence: 'Contact sales to discuss your data residency needs and become eligible.' It follows the existing 'Eligible organizations can enable data residency when creating a project in the API Platform. Data residency endpoints are charged a 10% uplift for models released on or after March 5, 2026, that are eligible for data residency.' and describes how organizations that are not yet eligible can discuss their data residency needs with sales and become eligible. The previous snapshot did not contain this sentence and had no other eligibility-acquisition wording. Assessment: this adds an eligibility path; it neither edits nor removes the 'Eligible organizations' requirement, and it leaves the regional coverage, the access-requirement column (the United Arab Emirates still says 'Contact sales to access this region'), image support requiring approval, and the CSAM classifier's unspecified regional coverage unchanged. It withdraws no regional residency or processing commitment, and it does not promise that contacting sales yields approval. Recorded as clarified for the eligibility path; the API-tier processing_region verdict fields are unchanged (codes=[GLOBAL]). This round adds one eligibility-path point and anchor; no other body change relates to the five dimensions."
