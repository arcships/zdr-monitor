summary_zh = "developers /api/docs/guides/your-data 新增 Decisions API（/v1/decisions）的逐端点数据条款、区域支持与限制说明。逐端点表新增一行：/v1/decisions 训练 No、滥用监测保留 30 天、应用状态保留「None, see below for exceptions」、ZDR eligible「Yes, see below for limitations」、Private Retention with PSP 与 Safety Retention「Pending confirmation」。端点说明新增「#### /v1/decisions」小节，复用与 /v1/chat/completions 相同的两句：「By default, abuse monitoring logs are retained for up to 30 days. Eligible customers can use Zero Data Retention, subject to the limitations below.」与「Prompt caching may store encrypted key/value tensors in GPU-local storage as application state. This data is stored on the local GPU machines and is not retained after the 24-hour expiration.」，后者因此在同一快照内出现两次，原 /v1/chat/completions 处的 retention 锚点由 ok 变为 ambiguous，本轮只补 suffix 把引文定位回原处，引文语义未改；该小节另新增「See image and file inputs for the CSAM retention exception for image inputs.」与 Decisions API 的 HIPAA 说明。图片/文件输入段新增「Images may also be uploaded to /v1/decisions.」。区域支持表把 /v1/decisions 列入全部区域（支持服务数 25→26、各区域 Show N more 计数 +1），并新增区域行注释「Available in all supported API regions. Regional processing is supported in the United States and Europe (EEA + Switzerland). Prompt caching is subject to the retention limitations below.」。Endpoint limitations 新增 /v1/decisions 小节，并把原属 /v1/chat/completions 的「Extended prompt caching in regions that do not support Regional processing may require that OpenAI process and temporarily store Customer Content outside of the Region to deliver the services.」移入该小节（chat/completions 处删除）。api 档五维结论字段未变：新端点复用的是既有默认条款，既有端点的承诺未改；方向记为 clarified。"
summary_en = "The developers /api/docs/guides/your-data page added the Decisions API endpoint (/v1/decisions) along with its per-endpoint data clauses, regional support, and limitations. The per-endpoint table gained a row: /v1/decisions — training No, abuse monitoring retention 30 days, application state retention 'None, see below for exceptions', Zero Data Retention eligible 'Yes, see below for limitations', and Private Retention with PSP and Safety Retention eligible 'Pending confirmation'. The endpoint notes gained a '#### /v1/decisions' subsection reusing the same two clauses as /v1/chat/completions: 'By default, abuse monitoring logs are retained for up to 30 days. Eligible customers can use Zero Data Retention, subject to the limitations below.' and 'Prompt caching may store encrypted key/value tensors in GPU-local storage as application state. This data is stored on the local GPU machines and is not retained after the 24-hour expiration.' Because the latter now appears twice in the same snapshot, the existing /v1/chat/completions retention anchor changed from ok to ambiguous; this round only adds a suffix to locate the quote back to its original occurrence, with no change to the quote's meaning. That subsection also adds 'See image and file inputs for the CSAM retention exception for image inputs.' and a HIPAA note for the Decisions API. The image-and-file-inputs paragraph adds 'Images may also be uploaded to /v1/decisions.'. The regional support table lists /v1/decisions in every region (supported services 25 to 26, each per-region 'Show N more' count +1) with the new row note 'Available in all supported API regions. Regional processing is supported in the United States and Europe (EEA + Switzerland). Prompt caching is subject to the retention limitations below.'. Endpoint limitations gained a /v1/decisions subsection, and the sentence previously listed under /v1/chat/completions — 'Extended prompt caching in regions that do not support Regional processing may require that OpenAI process and temporarily store Customer Content outside of the Region to deliver the services.' — was moved into it (deleted from chat/completions). No verdict field changed on the API tier: the new endpoint reuses the existing default terms, and the commitments for existing endpoints are unchanged; the direction is recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/523"
