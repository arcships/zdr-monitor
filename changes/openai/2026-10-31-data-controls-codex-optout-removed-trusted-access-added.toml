summary_zh = "help.openai.com 文章 7730893（Data controls in ChatGPT）本轮删除了三处与训练有关的正文，并新增一段明确例外。(1)「Turn off Improve the model for everyone」节删去「When Improve the model for everyone is off, your new conversations won’t be used to train OpenAI models. They can still appear in your chat history.」，该页不再在该节说明退出后新对话不用于训练。(2)「Manage model training for Codex tasks」节删去整段「If you use Codex on a personal ChatGPT plan, Improve the model for everyone also applies to your Codex tasks. Turn it off in ChatGPT, or select Do not train on my content in the Privacy Portal. Either option is sufficient for ChatGPT conversations and Codex tasks. You don’t need to do both. After you opt out, new conversations and tasks won’t be used to train OpenAI models.」，只保留「Include environments」独立开关段。该表述仍见于另一官方来源 5722486（How your data is used to improve model performance）的现行快照「Either option is sufficient for ChatGPT conversations and Codex tasks.」及「After you opt out, we won’t use your new conversations to improve our models.」，因此消费档 training 的结论方向不变，仅把 Anchor openai-consumer-codex-optout-applies 从本页改绑到 5722486。(3) FAQ「What happens if I previously opted out through OpenAI Support or a privacy request?」连同「OpenAI continues to honor the opt-out associated with the account.」被删；这是对既往退出承诺的处理说明，页面删除本身不构成撤销承诺，也不改变五维结论。(4) 新增「Trusted Access on personal accounts」段：「Trusted Access programs like Daybreak Blue support more sensitive work. During Daybreak sessions on your personal account, we may use content from your interactions to improve our models even when “Improve the model for everyone” is off. This helps us to strengthen safeguards against cyber misuse. Your “Improve the model for everyone” setting still applies to your other activity when not in a Trusted Access session (see “Accessing Daybreak”).」即 Daybreak 等 Trusted Access 会话期间，即使关闭 Improve the model for everyone，交互内容仍可能被用于改进模型；这是对退出机制的实质收窄，已补为消费档 training 说明点并绑定新锚点。消费档 training 仍为 mark=no、mode=opt_out（默认可用于训练、可退出），判定字段未变，方向记为 weakened。同轮其余变化是状态横幅删除、Updated 时间戳、Related articles 与侧栏，与五维无关。"
summary_en = "This round the help.openai.com article 7730893 (Data controls in ChatGPT) removed three training-related passages and added one explicit exception. (1) Under 'Turn off Improve the model for everyone' it deleted 'When Improve the model for everyone is off, your new conversations won’t be used to train OpenAI models. They can still appear in your chat history.', so that section no longer states that new conversations are excluded from training after opting out. (2) Under 'Manage model training for Codex tasks' it deleted the whole paragraph 'If you use Codex on a personal ChatGPT plan, Improve the model for everyone also applies to your Codex tasks. Turn it off in ChatGPT, or select Do not train on my content in the Privacy Portal. Either option is sufficient for ChatGPT conversations and Codex tasks. You don’t need to do both. After you opt out, new conversations and tasks won’t be used to train OpenAI models.', leaving only the separate 'Include environments' paragraph. The same statement still appears on the current snapshot of another official source, 5722486 (How your data is used to improve model performance): 'Either option is sufficient for ChatGPT conversations and Codex tasks.' and 'After you opt out, we won’t use your new conversations to improve our models.' The direction of the consumer training verdict therefore does not change; Anchor openai-consumer-codex-optout-applies is merely rebound from this page to 5722486. (3) The FAQ 'What happens if I previously opted out through OpenAI Support or a privacy request?' was removed together with 'OpenAI continues to honor the opt-out associated with the account.'; that passage describes how prior opt-outs are handled, and removing it from the page does not revoke the commitment or change any verdict. (4) A new section 'Trusted Access on personal accounts' was added: 'Trusted Access programs like Daybreak Blue support more sensitive work. During Daybreak sessions on your personal account, we may use content from your interactions to improve our models even when “Improve the model for everyone” is off. This helps us to strengthen safeguards against cyber misuse. Your “Improve the model for everyone” setting still applies to your other activity when not in a Trusted Access session (see “Accessing Daybreak”).' During Daybreak and similar Trusted Access sessions, interaction content may therefore still be used to improve models even with 'Improve the model for everyone' off; this is a substantive narrowing of the opt-out, now recorded as a consumer training point bound to a new anchor. Consumer training remains mark=no, mode=opt_out (may be used for training by default, opt-out available) and no verdict field changed; the direction is recorded as weakened. The removal of the status banner, the Updated timestamp, Related articles, and the sidebar are unrelated to the five dimensions in the same diff."
