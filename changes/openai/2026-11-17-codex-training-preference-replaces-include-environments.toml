summary_zh = "help.openai.com 文章 5722486（How your data is used to improve model performance）的「## Codex」节本轮把整句「Codex has a separate **Include environments** setting in Codex settings for allowing training on full environments. Changing your settings in ChatGPT or the Privacy Portal does not change that setting.」改为「When you use Codex with a personal ChatGPT account, your ChatGPT model-training preference applies to your Codex conversations. For instructions on reviewing or changing this preference, see: Data controls in ChatGPT.」；同一轮 7730893（Data controls in ChatGPT）把「Manage model training for Codex tasks」节改名为「Manage model training for Codex conversations」，并删去同义整段「Codex has a separate **Include environments** setting in Codex settings that controls whether additional context from your Codex environments can be used to train OpenAI models. Changing your ChatGPT setting or opting out through the Privacy Portal does not change that setting.」，改为在 ChatGPT 网页内更改训练偏好的步骤、Business/Enterprise/Edu 默认不训练说明与联系支持说明。两页现行正文均不再写全环境训练的独立开关，也不再保留「在 ChatGPT 或隐私门户退出不覆盖全环境」这一例外；新句只说明个人账号的 ChatGPT 训练偏好适用于 Codex 对话。方向记为 strengthened，与同轮 openai-codex 记录一致：公开文本不再保留该例外，方向对用户有利。页面删除该说明不等于厂商撤销全环境训练开关，本记录不据此推断；消费档 training 结论字段未变（mark=no、mode=opt_out）。原「全环境独立开关」说明点因无现行原文支撑而撤除，新的 Codex 训练偏好句与仍可引用的反馈例外（点赞/点踩关联整段对话仍可能用于训练）分别补为说明点并绑定锚点。同轮 7730893 的「What happens to saved chats」把 Locked chats 项的「When **Locked chats** is available for your account,」前缀删去，retention 语义未变；两页其余变化为 FAQ 标题、Related articles、标题层级与 Updated 时间戳，与五维无关。"
summary_en = "On help.openai.com article 5722486 (How your data is used to improve model performance), the '## Codex' section replaced the sentence 'Codex has a separate **Include environments** setting in Codex settings for allowing training on full environments. Changing your settings in ChatGPT or the Privacy Portal does not change that setting.' with 'When you use Codex with a personal ChatGPT account, your ChatGPT model-training preference applies to your Codex conversations. For instructions on reviewing or changing this preference, see: Data controls in ChatGPT.' In the same round, article 7730893 (Data controls in ChatGPT) renamed the section 'Manage model training for Codex tasks' to 'Manage model training for Codex conversations' and deleted the parallel paragraph 'Codex has a separate **Include environments** setting in Codex settings that controls whether additional context from your Codex environments can be used to train OpenAI models. Changing your ChatGPT setting or opting out through the Privacy Portal does not change that setting.', replacing it with steps to change the training preference on the ChatGPT web app, a statement that Business/Enterprise/Edu content is not used for training by default, and a support note. Neither page now describes a separate full-environments training setting, and neither retains the exception that opting out in ChatGPT or the Privacy Portal does not cover full environments; the new sentence only says the personal-account ChatGPT training preference applies to Codex conversations. The direction is recorded as strengthened, matching the openai-codex record for the same round: the published text no longer carries that exception, which moves in the user's favor. Removing that description does not prove the vendor revoked the full-environments setting, and this record does not infer that. The consumer training verdict fields are unchanged (mark=no, mode=opt_out). The old full-environments point was removed because no current snapshot supports it; the new Codex training-preference sentence and the still-citable feedback exception (the whole conversation attached to thumbs up/down may still be used for training) are recorded as separate points with anchors. In the same round, the Locked chats bullet on 7730893 dropped the prefix 'When **Locked chats** is available for your account,' with no change in retention meaning; the remaining changes on both pages (FAQ heading, Related articles, heading levels, Updated timestamp) are unrelated to the five dimensions."
