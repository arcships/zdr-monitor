summary_zh = "your-data 页面把 /v1/videos 从逐端点留存表移除:该 API 已于 2026-09-24 停机,原「48 小时下载窗口 + 30 天滥用监测」被改写成「Historical Videos API retention」一节,明确那只是停机前记录过的政策、不对停机后作任何承诺。API 档 retention 结论(滥用监测日志最多 30 天)不变,只修正我们原先援引的 48 小时示例。"
summary_en = "The your-data page removed /v1/videos from the per-endpoint retention table: the API was shut down on 2026-09-24 and its former 48-hour download window plus 30 days of abuse monitoring were rewritten as a Historical Videos API retention section stating that those periods describe pre-shutdown policy and promise nothing after shutdown. The API-tier retention verdict (abuse monitoring logs kept up to 30 days) is unchanged; only the 48-hour example we used to cite was corrected."
