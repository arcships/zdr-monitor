source_id = "07d09ce3d7911532"
summary_zh = "《DeepInfra Terms of Service》页面 Last modified 由 August 17th, 2026 改为 October 15th, 2026。§7(b) 的 Zero Data Retention 主承诺（不保留超过处理并返回请求所必需的期间，之后从系统删除）与不训练承诺逐字未变，但例外清单由 (i)–(iii) 扩为 (i)–(iv)：新增「Customer Data that Provider retains for a feature or Service that Customer elects to use, such as batch requests, asynchronous media outputs, third-party integrations, or paid cache retention, for no longer than the retention period stated in the documentation for that feature or Service」。同段新增「Key-value and prefix cache state derived from Customer Data is held temporarily in memory solely to serve requests and is not used for any other purpose」，段末新增范围句「Zero Data Retention applies to models hosted by Provider; Customer Data that Customer elects to submit to a third-party model made available through the Services is governed by Section 18 and the applicable third party's terms」。旧正文没有这条范围句，§5(a) 又称该承诺「applies to all Customer Data」，因此第三方模型档的合同层证据由「与 docs 页冲突」变为「与 docs 页同向」：ZDR 只覆盖 Provider 自托管模型，提交给第三方模型的数据受 §18 与第三方条款约束。api 档的结论字段未变（training=yes、zdr=yes、retention 仍 basis=none、object=input_output），第三方模型档也未变（zdr 仍 mark=no、retention 仍 basis=undisclosed）；但新增的第 (iv) 项例外与范围句缩小了 ZDR 的合同覆盖，故方向记为 weakened。"
summary_en = "The 'Last modified' date on the DeepInfra Terms of Service moved from August 17th, 2026 to October 15th, 2026. The Section 7(b) Zero Data Retention commitment (no retention, storage, or logging beyond the period strictly necessary to process and return the request, after which the data is deleted) and the no-training promise are word-for-word unchanged, but the exception list grew from (i)-(iii) to (i)-(iv): a new item reads 'Customer Data that Provider retains for a feature or Service that Customer elects to use, such as batch requests, asynchronous media outputs, third-party integrations, or paid cache retention, for no longer than the retention period stated in the documentation for that feature or Service'. The same section adds 'Key-value and prefix cache state derived from Customer Data is held temporarily in memory solely to serve requests and is not used for any other purpose', and closes with a new scope sentence: 'Zero Data Retention applies to models hosted by Provider; Customer Data that Customer elects to submit to a third-party model made available through the Services is governed by Section 18 and the applicable third party's terms'. The old text had no such scope sentence and Section 5(a) said the commitment 'applies to all Customer Data', so the contract-layer evidence for the third-party-model tier changes from 'conflicts with the docs page' to 'agrees with the docs page': ZDR covers only Provider-hosted models, and data submitted to a third-party model is governed by Section 18 and that third party's terms. No verdict field changed on the api tier (training=yes, zdr=yes, retention still basis=none, object=input_output) or on the third-party-model tier (zdr still mark=no, retention still basis=undisclosed); the new exception (iv) and scope sentence nonetheless narrow the contractual reach of ZDR, so the direction is recorded as weakened."
issue = "https://github.com/arcships/zdr-monitor/issues/687"
