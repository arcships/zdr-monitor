summary_zh = "docs /account/data-privacy 的日志条款收紧：删去「We reserve the right to log a small portion of requests when necessary for debugging or security purposes」这一例外，同时把「We generally do not log the content of your requests」「We log metadata」改为「We do not log the content of your requests」「We log only metadata」。api 档 retention 结论不变（不留存），例外清单由五项减为四项；ToS §7(b) 的 Zero Data Retention 承诺与隐私政策的条件式承诺均未改动。"
summary_en = "The logs clause on docs /account/data-privacy was tightened: the reservation 'We reserve the right to log a small portion of requests when necessary for debugging or security purposes' was removed, and 'We generally do not log the content of your requests' / 'We log metadata' became 'We do not log the content of your requests' / 'We log only metadata'. The retention verdict for the API tier is unchanged (not retained); the tier's exception list drops from five items to four. The Section 7(b) Zero Data Retention commitment and the Privacy Policy's conditional promise are untouched."
issue = "https://github.com/arcships/zdr-monitor/issues/305"
