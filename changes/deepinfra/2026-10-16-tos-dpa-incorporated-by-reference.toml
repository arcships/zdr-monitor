summary_zh = "同一次改版（页面 Last modified: October 15th, 2026）改写了 §5(a) 的 DPA 条款。旧正文为「If the Parties execute a data processing agreement (\"DPA\"), the DPA governs and, to the extent of any conflict, supersedes the Privacy Policy and this Agreement solely as to its subject matter.」，后句还有「an executed DPA supplements, and does not narrow, that commitment」。新正文改为「Provider's data processing agreement made available at https://trust.deepinfra.com (as updated from time to time in accordance with this Agreement, the \"DPA\") is incorporated by reference and applies to Provider's processing of personal data included in Customer Data, and the DPA governs and, to the extent of any conflict, supersedes the Privacy Policy and this Agreement solely as to its subject matter.」，并把后句改为「the DPA supplements, and does not narrow, that commitment, which applies to all Customer Data」。即 DPA 不再取决于双方另行签署，而是合同直接并入一份公开 DPA 并声明其适用于 Customer Data 中的个人数据、就该主题优先于隐私政策与本协议。合同正文仍不含 DPA 内容，本轮未抓取 trust.deepinfra.com 快照，故 role 结论字段未变（api 与专属部署档均 kind=processor），只更新说明并新增锚点 deepinfra-tos-5a-dpa-incorporated。方向记为 strengthened。"
summary_en = "In the same revision (page Last modified October 15th, 2026), Section 5(a)'s DPA clause was rewritten. The old text read 'If the Parties execute a data processing agreement (\"DPA\"), the DPA governs and, to the extent of any conflict, supersedes the Privacy Policy and this Agreement solely as to its subject matter.', with a later reference to 'an executed DPA supplements, and does not narrow, that commitment'. The new text reads 'Provider's data processing agreement made available at https://trust.deepinfra.com (as updated from time to time in accordance with this Agreement, the \"DPA\") is incorporated by reference and applies to Provider's processing of personal data included in Customer Data, and the DPA governs and, to the extent of any conflict, supersedes the Privacy Policy and this Agreement solely as to its subject matter.', and the later reference now reads 'the DPA supplements, and does not narrow, that commitment, which applies to all Customer Data'. The DPA therefore no longer depends on a separately executed agreement: the Terms incorporate a published DPA by reference, state that it applies to Provider's processing of personal data included in Customer Data, and give it precedence over the Privacy Policy and the Agreement as to its subject matter. The Terms still do not contain the DPA text, and trust.deepinfra.com was not fetched in this round, so no role verdict field changed (api and dedicated-deployment tiers both remain kind=processor); only the notes and the new anchor deepinfra-tos-5a-dpa-incorporated were added. Direction recorded as strengthened."
issue = "https://github.com/arcships/zdr-monitor/issues/687"
