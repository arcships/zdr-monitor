summary_zh = "SC 由 Version dated 26 August 2026（53 页）更新为 18 November 2026（59 页），附录 10 重写。training：旧 §5 只写「OVHcloud has no knowledge of Inputs and Outputs, and OVHcloud does not reuse them in any way. OVHcloud does not carry out any backups of Inputs or Outputs.」，未逐字禁止训练；新 §5 增写「Inputs and Outputs are not used to train, retrain, or improve a Model, including an OVHcloud Model.」，新 §7 再写「Client Data is not used to train, retrain, evaluate or improve a Model.」——合同层首次逐字禁止训练。processing_region：旧附录 10 没有地点条款，新 §1 写「the Client does not choose the location of the AI Endpoints Service. The Models provided by OVHcloud are hosted and executed in Datacentres located in the European Union.」，§7「Location」同旨；附录 7 §2.3 的 Datacenters 仅改为 Datacentres 拼写。role：旧附录 10 没有角色条款，新 §7 写「As part of the use and security of the AI Endpoints Service, OVHcloud processes personal data as a data processor upon instruction from the Client.」，并披露非关联子处理者 Shadow；附录 4/8 的角色句由「OVHcloud carries out processing of personal data as a sub-processor on the instructions of the Client」改为「OVHcloud processes personal data as a data processor upon instruction from the Client」。以上三个维度方向记 strengthened。"
summary_en = "The Public Cloud Specific Conditions moved from Version dated 26 August 2026 (53 pages) to 18 November 2026 (59 pages), rewriting Appendix 10. training: the old §5 only said 'OVHcloud has no knowledge of Inputs and Outputs, and OVHcloud does not reuse them in any way. OVHcloud does not carry out any backups of Inputs or Outputs.' and did not prohibit training verbatim; the new §5 adds 'Inputs and Outputs are not used to train, retrain, or improve a Model, including an OVHcloud Model.', and the new §7 adds 'Client Data is not used to train, retrain, evaluate or improve a Model.' — the contract now prohibits training verbatim. processing_region: the old Appendix 10 had no location clause; new §1 states 'the Client does not choose the location of the AI Endpoints Service. The Models provided by OVHcloud are hosted and executed in Datacentres located in the European Union.', and §7 'Location' repeats it; Appendix 7 §2.3 only changes the spelling Datacenters to Datacentres. role: the old Appendix 10 had no role clause; new §7 states 'As part of the use and security of the AI Endpoints Service, OVHcloud processes personal data as a data processor upon instruction from the Client.' and discloses Shadow as a non-affiliate sub-processor; the role sentence in Appendices 4 and 8 changed from 'OVHcloud carries out processing of personal data as a sub-processor on the instructions of the Client' to 'OVHcloud processes personal data as a data processor upon instruction from the Client'. Those three dimensions are recorded as strengthened."
issue = "https://github.com/arcships/zdr-monitor/issues/1334"
