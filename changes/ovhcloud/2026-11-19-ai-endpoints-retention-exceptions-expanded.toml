summary_zh = "附录 10 的保留例外由 Batch API 一项扩为 Batch API 与 real-time audio transcription（speech-to-text）两项，并新增 §7 给出量化期限：Batch 入参文件最多 72 小时（客户可配置），输出/错误文件处理结束后 15 天删除；speech-to-text 音频流随请求处理删除、转写文本 90 天删除；API Logs 安全与正常运行用途 1 年、计费明细 24 个月，另以聚合形式用于「Monitoring of commercial activity」（统计服务使用，原文未另给该项期限），且 §7 明确 API Logs 不含 Inputs/Outputs。旧 §2 只写 Batch API「temporarily stores incoming and outgoing data for the Service」，未列 speech-to-text 也未给期限。同步推理的 Inputs/Outputs 仍明文不留存、不备份（新 §2「Inputs are processed only for the duration necessary for the execution of the Request and are not retained beyond that.」、§5「OVHcloud does not carry out any backups of Inputs or Outputs.」），故 api-eu 的 zdr 仍为 yes、retention 仍为 basis=none（请求正文默认不留存）；但例外范围扩大、日志期限与用途明确，方向记 weakened。另：附录 7 §2.4.3 的 Workspace 删除句由「Content of the Workspace is deleted…」改为「Workspace Content is deleted…」，同一事实的语序调整，语义未变。"
summary_en = "Appendix 10's retention exceptions expanded from the Batch API alone to both the Batch API and real-time audio transcription (speech-to-text), and the new §7 quantifies the periods: Batch input files for at most 72 hours (client-configurable), output and error files deleted 15 days after processing ends; speech-to-text audio streams deleted after the Request is processed and transcriptions after 90 days; API logs kept for 1 year for security and proper functioning and billing details for 24 months, and also used in aggregated form for 'Monitoring of commercial activity' (service usage statistics, with no separate period stated), while §7 states that API logs contain neither Inputs nor Outputs. The old §2 only said the Batch API 'temporarily stores incoming and outgoing data for the Service', listed no speech-to-text exception and gave no periods. Synchronous Inputs and Outputs are still stated not to be retained or backed up (new §2 'Inputs are processed only for the duration necessary for the execution of the Request and are not retained beyond that.' and §5 'OVHcloud does not carry out any backups of Inputs or Outputs.'), so the api-eu tier remains zdr yes and retention basis=none (request content is not retained by default); however, the exception scope widened and the log periods and purposes became explicit, so the direction is recorded as weakened. Also: Appendix 7 §2.4.3 reworded the Workspace deletion sentence from 'Content of the Workspace is deleted…' to 'Workspace Content is deleted…', the same fact with adjusted word order, no semantic change."
issue = "https://github.com/arcships/zdr-monitor/issues/1334"
