summary_zh = "AI Endpoints capabilities 页的处理地表述由「Our infrastructure, located in Gravelines, France, adheres to European data protection regulations.」改为「Our infrastructure, hosted in Europe, adheres to European data protection regulations.」——厂商不再逐字承诺法国 Gravelines，只承诺欧洲（Europe）。同页「Data is not stored or shared during or after model use」与「fully compliant with strict European regulations」未变，故 training/zdr/retention 不受影响。api-eu 档 processing_region 仍有明确的处理区域表述，结构化区域代码由 FR 改为 EU；EU 是词表里最接近 Europe 的宽泛归类，不是厂商逐字承诺「欧盟」。条款层仍无 AI Endpoints 专用地点条款。"
summary_en = "On the AI Endpoints capabilities page the infrastructure-location sentence changed from \"Our infrastructure, located in Gravelines, France, adheres to European data protection regulations.\" to \"Our infrastructure, hosted in Europe, adheres to European data protection regulations.\" The vendor no longer names Gravelines, France, and now states only Europe. The adjacent \"Data is not stored or shared during or after model use\" and \"fully compliant with strict European regulations\" are unchanged, so training, zdr and retention are unaffected. For the api-eu tier processing_region still has an explicit location statement, and the structured region code changes from FR to EU; EU is the closest broad category in the vocabulary for 'Europe', not a verbatim vendor commitment to the European Union. The contract layer still has no AI Endpoints-specific location clause."
issue = "https://github.com/arcships/zdr-monitor/issues/941"
