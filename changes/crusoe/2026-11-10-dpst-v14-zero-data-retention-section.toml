summary_zh = "Crusoe 同日更新 DPST v1.4 与 SST v5.1。旧 SST v5.0『Processing and Storage of Inputs and Outputs』原句：『Crusoe does not store Inputs and Outputs to disk, and only processes them as long as necessary to provide Customer with the Crusoe Intelligence Foundry or as otherwise provided in the Data Processing and Security Terms. This processing includes standard cache use patterns for inference, including temporarily caching Inputs and Outputs in memory, evicting cache entries to make room for new requests, and immediately wiping the cache when the model instance is deleted.』现行 SST v5.1 改题为 Zero Data Retention，并在句首新增『For the Managed Inference Service, 』，将不落盘范围收窄至托管推理；原节『We do not use Inputs or Outputs to train Models or improve our Services without Customer’s explicit opt-in consent.』被移除（历史 v5.0 中仍可见）。DPST v1.4 新增同名节，明确『This section does not apply to any feature of the Services that by design requires the retention or further processing of data beyond the time needed to generate and deliver Output, which includes, among other things, asynchronous inference and any training or fine-tuning features.』并新增『Crusoe does not use Inputs or Outputs to train Models or improve our Services without Customer’s explicit opt-in consent.』直连档限定为同步 Managed Inference，微调另建档，按 SST 未变化的 Training Data 不训练承诺记 training=yes，依明文排除记 zdr=no；Files API 的任务后期限未披露。经 OpenRouter 转售档的 Crusoe 跳也受 DPST 新范围限制，全链不能由此推出 ZDR。处理地与角色原句未实质变化。方向记为收紧：虽新增有名的 DPST ZDR 节，但原 SST 的不落盘范围收窄且 DPST 明确排除异步与微调。"
summary_en = "Crusoe updated DPST to v1.4 and SST to v5.1, effective the same day. Former SST v5.0 'Processing and Storage of Inputs and Outputs' said: 'Crusoe does not store Inputs and Outputs to disk, and only processes them as long as necessary to provide Customer with the Crusoe Intelligence Foundry or as otherwise provided in the Data Processing and Security Terms. This processing includes standard cache use patterns for inference, including temporarily caching Inputs and Outputs in memory, evicting cache entries to make room for new requests, and immediately wiping the cache when the model instance is deleted.' SST v5.1 renames the section Zero Data Retention and adds the prefix 'For the Managed Inference Service, ', restricting non-persistence to managed inference. The old section's 'We do not use Inputs or Outputs to train Models or improve our Services without Customer’s explicit opt-in consent.' was removed (it remains in embedded v5.0 history). DPST v1.4 adds its own Zero Data Retention section and explicitly excludes 'asynchronous inference and any training or fine-tuning features'; it adds 'Crusoe does not use Inputs or Outputs to train Models or improve our Services without Customer’s explicit opt-in consent.' The direct tier is limited to synchronous Managed Inference; fine-tuning is recorded separately with a retained Training Data no-training promise, express ZDR scope exclusion, and undisclosed Files API post-job duration. The OpenRouter resale tier's Crusoe hop is also subject to the DPST scope; no end-to-end ZDR is inferred. Processing location and role clauses remain substantively unchanged. Direction is weakened despite the new named DPST commitment: the former SST non-persistence scope narrows and the DPST expressly excludes asynchronous inference and fine-tuning."
issue = "https://github.com/arcships/zdr-monitor/issues/1153"
