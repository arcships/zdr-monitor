summary_zh = "legal.crusoe.ai 同日更新两份通知。(1) Crusoe Cloud Platform Privacy Notice 由 v1.3（2026-03-12 生效）升到 v1.4（2026-11-13 生效），官方 Summary of changes 自述为澄清联系与退订方式。与 retention 有关的唯一新增是：『To request that we delete your information from our marketing systems, you can email your request to privacy@crusoe.ai. This will not delete your Account or the Service Data we need to provide the Services. We may keep your email address on a suppression list so that we can continue to honor your request.』旧版 v1.3 没有这句。该通知明文『This Privacy Notice applies solely to Service Data and does not apply to Customer Data.』，故这句只涉及营销联系数据的保留（退出名单），不涉及 API 输入输出；其余改动为注册来源归因、促销邮件、合法利益与审计/衡量表述的扩充，同样限于 Service Data。直连、微调、经 OpenRouter 转售与 GPU 云各档的结论字段均未改，输入输出非持久化、DPST 删除义务与隐私通知既有引文均未失效。(2) 同一页面内 Crusoe Website Privacy Notice 由 v2.3 升到 v2.5（2026-11-13 生效），改动集中在网站分析、cookie 分类（三类改四类）、营销归因与 CCPA 出售/共享表述；该通知不是任何五维结论的证据来源，故未改动结论，也不计入本次变化记录。方向记为 clarified：厂商新增的是营销数据处理与退出名单保留的具体说明，未收紧或放宽 API 请求内容的保留承诺。"
summary_en = "On the same day legal.crusoe.ai updated two notices. (1) The Crusoe Cloud Platform Privacy Notice moved from v1.3 (effective 2026-03-12) to v1.4 (effective 2026-11-13); its Summary of changes says the update clarifies how Crusoe may contact customers and how to opt out. The only addition relevant to retention is: 'To request that we delete your information from our marketing systems, you can email your request to privacy@crusoe.ai. This will not delete your Account or the Service Data we need to provide the Services. We may keep your email address on a suppression list so that we can continue to honor your request.' That sentence is absent from v1.3. The notice states 'This Privacy Notice applies solely to Service Data and does not apply to Customer Data.', so the sentence concerns retention of marketing contact data (a suppression list), not API Inputs or Outputs. The other edits expand sign-up attribution, promotional email, legitimate-interests and auditing/measurement wording, also limited to Service Data. No conclusion field changed for the direct, fine-tuning, OpenRouter resale or GPU cloud tiers, and none of the existing Inputs/Outputs non-persistence, DPST deletion or privacy-notice anchors stopped matching. (2) The Crusoe Website Privacy Notice on the same page moved from v2.3 to v2.5 (effective 2026-11-13), with changes to website analytics, cookie categories (three to four), marketing attribution and CCPA sale/sharing wording; that notice is not the evidence source for any five-dimension verdict, so no conclusion changed and it is not recorded here. Direction is clarified: the vendor added a specific description of marketing-data handling and suppression-list retention, without tightening or loosening the API request-content retention commitment."
issue = "https://github.com/arcships/zdr-monitor/issues/1232"
