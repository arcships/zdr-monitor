summary_zh = "trust.crusoe.ai 首页「Data and privacy」控制项新增一条「Customer data deleted upon leaving」，插在原有「Data retention procedures established」与「Data classification policy established」之间。同一轮快照的其他变化是控制项数量与安全/合规控制项名称的增删（Portable media encrypted、Cybersecurity insurance maintained、Production deployment access restricted 移除；Code of Conduct、Backup and Recovery、Development lifecycle established 新增）、子处理者条目排版合并成一行，以及「Updated … minutes ago」时间文案，均不涉及 training / zdr / processing_region / role。新增条目只是 Trust Center 的控制项标签，没有给出删除对象、触发语境或期限；该页仍无量化保留期限、无 ZDR 表述，本台账也未把它作为任何档位 retention 的权威依据，故五个维度的结论字段均未改动。原先只引用相邻两条 bullet 的锚点因新条目插入而失效，已改绑到包含新条目的连续三条 bullet。方向记为 clarified：这是厂商在 Trust Center 新公开的一条与删除/保留相关的控制项说明，不是对既有合同条款的收紧或放宽。"
summary_en = "The 'Data and privacy' controls on the trust.crusoe.ai homepage added 'Customer data deleted upon leaving' between the existing 'Data retention procedures established' and 'Data classification policy established'. The other changes in this snapshot round are control counts and security/compliance control names (Portable media encrypted, Cybersecurity insurance maintained and Production deployment access restricted removed; Code of Conduct, Backup and Recovery and Development lifecycle established added), subprocessor entries merged onto one line, and the 'Updated ... minutes ago' timestamp wording; none of these touches training, zdr, processing_region or role. The new item is only a Trust Center control label: it gives no deletion object, triggering context or timeframe, the page still states no quantified retention period and no ZDR wording, and this ledger does not use it as authority for any tier's retention verdict, so no conclusion field changed. The anchor that quoted the two formerly adjacent bullets stopped matching because of the insertion and has been rebound to the contiguous three-bullet block that includes the new item. Direction is 'clarified': the vendor newly published a retention/deletion-related control statement on its Trust Center, not a tightening or loosening of any existing contractual clause."
issue = "https://github.com/arcships/zdr-monitor/issues/896"
