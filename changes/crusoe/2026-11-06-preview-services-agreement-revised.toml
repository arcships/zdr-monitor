summary_zh = "legal.crusoe.ai 同日更新两份合同。(1) Crusoe Cloud Platform Terms of Service 由 v1.10（2026-08-10 生效）升到 v1.11（2026-11-05 生效）。本轮 TOS 的唯一实质新增是「Preview Services」节：Crusoe 可提供其指定为 alpha、beta、private preview、preview、early access、experimental 或类似 pre-GA 状态的产品、功能；该节写「Preview Services are not Promotional Offerings. Customer’s use of Preview Services is governed by the then-current Preview Services Agreement found at https://legal.crusoe.ai/#preview-services-agreement」，且「With respect to Preview Services, the order of precedence in the Preview Services Agreement applies, notwithstanding Conflicting Terms」。TOS 的 Protection of Customer Data 等数据条款逐字未动。(2) Preview Services Agreement 由 2026-10-20 生效的 v1.0 换为 2026-11-05 生效的新版：新版去掉版本号，把生效条件从 click-accept 改为「starting on the earlier of the date Customer accepts this Agreement or the date Customer first accesses or uses a Preview Service」，并把章节编号化（1–7）、调整部分标题与加粗格式。与五维判断相关的实质改写是：Quote 义务从「任何使用中的 Preview Service」收窄为「Crusoe designates as a private preview」的 Preview Service；新增「Updates to this Agreement」；Section 4 存续条款从旧版「The Quote license and Feedback provisions of Section 2, and Sections 3 and 5-7, survive termination of this Agreement and the end of any Preview Period.」改为把「the End of Preview provisions of Section 4」纳入存续，使三十天取回窗口与其后的删除义务在协议或 Preview Period 结束后继续有效；End of Preview 的违约例外由「Unless Crusoe terminates for Customer’s breach」改为「Unless Crusoe ends Customer’s access due to Customer’s breach」，删除义务的语义未变。此外，引言把 Cloud ToS 的引用范围扩为「or any other agreement between Crusoe and Customer that governs Customer’s use of the Services, each as amended from time to time」，Confidentiality 条款从对 Preview Services 整体的保密义务改为针对指定 private preview 或标识为 confidential 的非公开信息；这两处不改变五维结论。需要特别说明：Base Model / Customer Inputs / Customer Output / Job 定义与「Customer Inputs and Customer Outputs are Customer Data under the Cloud ToS.」在 2026-10-20 的 v1.0 原文中已经逐字存在（本轮 diff 的 context 行可核对），新版只是调整编号/顺序/加粗格式，属形式改写而非新增实体条款；Fees、仅限 internal testing and evaluation 的使用许可、Third-Party Terms Compliance、Customer Code、Third-Party Offerings、EU AI Act、Availability and Changes 与九条 Restrictions 也已在 v1.0 原文中逐字存在（本轮 diff 的 - 行或 context 行可核对），新版只是重新编号/调整顺序与格式，不是新增这些实体条款。新快照内嵌的旧版历史块在 Limitation of Liability 处截断，不能用它证明这些条款在旧版不存在。五个维度的结论字段均未改：training=yes/default、zdr=no、retention=input_output/until_termination、processing_region=global、role=processor（处理地条款未改，故不列入受影响维度）。方向记为 strengthened：End of Preview 存续使删除/取回义务在协议终止或 Preview Period 结束后继续有效，是对保留义务的实质加强；这不改变 retention 的对象或期限类型。"
summary_en = "On the same day legal.crusoe.ai updated two contracts. (1) The Crusoe Cloud Platform Terms of Service moved from v1.10 (effective 2026-08-10) to v1.11 (effective 2026-11-05). The only substantive addition in this round's TOS diff is a new 'Preview Services' section: Crusoe may make available products, features or functionality that it designates as alpha, beta, private preview, preview, early access, experimental or with a similar pre-general availability designation. The section states: 'Preview Services are not Promotional Offerings. Customer’s use of Preview Services is governed by the then-current Preview Services Agreement found at https://legal.crusoe.ai/#preview-services-agreement', and 'With respect to Preview Services, the order of precedence in the Preview Services Agreement applies, notwithstanding Conflicting Terms.' The TOS data clauses, including Protection of Customer Data, are unchanged word for word. (2) The Preview Services Agreement was replaced: the old version was v1.0, effective 2026-10-20; the new version drops the version label, is effective 2026-11-05, and changes the effective trigger from click-accept to 'starting on the earlier of the date Customer accepts this Agreement or the date Customer first accesses or uses a Preview Service', with sections renumbered 1–7 and some headings and bold formatting adjusted. The substantive rewrites relevant to the five dimensions are: the Quote obligation narrowed from any Preview Service in use to a Preview Service that 'Crusoe designates as a private preview'; a new 'Updates to this Agreement' clause; and Section 4's survival clause changed from 'The Quote license and Feedback provisions of Section 2, and Sections 3 and 5-7, survive termination of this Agreement and the end of any Preview Period.' to also include 'the End of Preview provisions of Section 4', so the thirty-day retrieval window and the subsequent deletion obligation remain in force after the agreement or the Preview Period ends. The breach carve-out in End of Preview was reworded from 'Unless Crusoe terminates for Customer’s breach' to 'Unless Crusoe ends Customer’s access due to Customer’s breach', with no change to the deletion obligation's meaning. In addition, the introduction broadens the Cloud ToS reference to 'or any other agreement between Crusoe and Customer that governs Customer’s use of the Services, each as amended from time to time', and the Confidentiality clause is narrowed from the Preview Services as a whole to non-public information that Crusoe designates as a private preview or otherwise identifies as confidential; neither changes the five-dimension conclusions. Important: the Base Model / Customer Inputs / Customer Output / Job definitions and the sentence 'Customer Inputs and Customer Outputs are Customer Data under the Cloud ToS.' were already present verbatim in v1.0 (the context lines in this round's diff confirm this); the new version only changes their numbering, order and bold formatting, a formal rewrite rather than a new substantive clause. Fees, the licence limited to internal testing and evaluation, Third-Party Terms Compliance, Customer Code, Third-Party Offerings, EU AI Act, Availability and Changes and the nine-item Restrictions list were also already present verbatim in v1.0 (the removed or context lines in this round's diff confirm this); the new version only renumbers/reorders/reformats them and does not add these substantive clauses. The historical block embedded in the new snapshot is truncated at Limitation of Liability, so it cannot be used to prove that these clauses were absent from the old version. No conclusion field changed: training=yes/default, zdr=no, retention=input_output/until_termination, processing_region=global, role=processor (the data-location text is unchanged, so processing_region is not listed as affected). Direction is 'strengthened': the survival of the End of Preview provisions keeps the deletion/retrieval obligation in force after termination or the end of the Preview Period, a substantive strengthening of the retention obligation; it does not change the retention object or period type."
