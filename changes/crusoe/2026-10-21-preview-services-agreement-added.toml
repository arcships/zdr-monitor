summary_zh = "legal.crusoe.ai 新增 Preview Services Agreement v1.0（2026-10-20 生效）并在文档索引加入该条目；本轮快照只有新增，没有既有正文的删除或改写。协议把 Preview Service 定义为 Crusoe 指定为「alpha」「beta」「private preview」「preview」「early access」「experimental」或类似 pre-GA 状态的产品、服务、功能、API、模型、工具、集成或功能组件。快照没有把本台账已有的三个档位（Managed Inference 直连、经 OpenRouter 转售、GPU 云）指定为 Preview Service，也没有证明这三个档位已 GA；这三个档位的五维结论字段均未改，其 GA 状态未确认，需另开 follow-up 核实 Crusoe 的 designation。协议本身与五维相关的实质表述：(1) training——Crusoe 处理 Customer Inputs/Outputs 的许可「solely to」提供 Preview Services（含执行客户提交的 Job、按客户指示存储 Outputs）、应客户请求排障与支持、遵守适用法律；Ownership 节保留的聚合、去标识使用与性能数据明确不包含 Customer Inputs/Outputs，协议没有出现授权 Crusoe 用这些数据训练自己模型的条款。(2) zdr/retention——协议明文设想 Customer Inputs/Outputs 存放在 Preview Service 中；Preview Period 结束后，除因客户违约终止外，Crusoe 会尽力让客户在三十 (30) 天内取回 Customer Outputs，其后按 DPST 与适用的 Preview Service Terms 删除该 Preview Service 中存储的 Customer Inputs 与 Outputs（若服务转为 GA 且客户继续使用则除外）。三十天是取回窗口，不是删除截止期限；协议没有零保留承诺。(3) processing_region——pre-GA 服务可能不在任何 data location commitments 的覆盖范围内，DPST 仍优先适用，仅审计/认证/数据位置承诺由协议第 6 节控制。(4) role——协议补充 Cloud ToS 与 Service Terms，并把 DPST 列为冲突时的第一优先（第 6 节仅控制审计、认证与数据位置），故 DPST 的 processor/controller 角色划分继续适用。据此为该 pre-GA 档单列：training=yes/default、zdr=no、retention=input_output/until_termination、processing_region=global、role=processor。方向记为 clarified：这是为新的 pre-GA 档建立独立合同与档位，不是既有档位条款的收紧或放宽。"
summary_en = "legal.crusoe.ai added the Preview Services Agreement v1.0 (effective 2026-10-20) and a corresponding entry in the document index; this snapshot round contains additions only, with no deletion or rewrite of existing text. The agreement defines a Preview Service as any product, service, feature, API, model, tool, integration or functionality that Crusoe designates as alpha, beta, private preview, preview, early access, experimental or with a similar pre-GA designation. The snapshot does not designate the three pre-existing tiers (Managed Inference direct, OpenRouter resale, GPU cloud) as Preview Services, and it does not establish that those tiers are generally available; their five verdict fields are unchanged, and their GA status remains unconfirmed, so a follow-up is needed to verify Crusoe's designation. The agreement's substantive statements relevant to the five dimensions are: (1) training - Crusoe's license to process Customer Inputs and Customer Outputs is limited 'solely to' providing the Preview Services (including performing Jobs submitted by the Customer and storing Customer Outputs as directed), troubleshooting and supporting at the Customer's request, and complying with applicable law; the ownership section's aggregated, de-identified usage and performance data expressly excludes Customer Inputs and Customer Outputs, and the agreement contains no clause authorizing Crusoe to train its own models on that data. (2) zdr/retention - the agreement expressly contemplates Customer Inputs and Customer Outputs stored in the Preview Service; after the Preview Period ends, unless Crusoe terminates for the Customer's breach, Crusoe will make reasonable efforts to allow the Customer to retrieve Customer Outputs for thirty (30) days, and will thereafter delete Customer Inputs and Customer Outputs stored in that Preview Service in accordance with the DPST and applicable Preview Service Terms (unless the service became generally available and the Customer continues to use it). The thirty days is a retrieval window, not a deletion deadline, and the agreement contains no zero-retention commitment. (3) processing region - pre-GA services may not be in scope for any data location commitments, while the DPST still takes precedence, with Section 6 controlling only audits, certifications and data location commitments. (4) role - the agreement supplements the Cloud ToS and Service Terms and places the DPST first in the order of precedence (Section 6 controls only audits, certifications and data location commitments), so the DPST's processor/controller allocation continues to apply. Accordingly the pre-GA tier is recorded as training=yes/default, zdr=no, retention=input_output/until_termination, processing_region=global, role=processor. Direction is 'clarified': this creates a standalone contract and tier for pre-GA services, not a tightening or loosening of the existing tiers' clauses."
