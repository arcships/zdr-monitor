summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #690 快照把 Nemotron 3.5 Super VL Free 加入端点表、价目表和免费模型列表，并在 Privacy 零保留例外清单新增一条：「Nemotron 3.5 Super VL Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.」。该条与既有的 Nemotron 3 Ultra Free / Nemotron 3.5 Lightning Free 同构，属于数据收集/记录型例外，未给保留期限；模型可在工作区启用，因此 zen-team / zen-enterprise 的培训范围清单同步加入。同一快照删除了 10-14 已下架的 Ling 3.1 Flash Free 与 Ling 3.0 Flash Fin Free 留在例外清单里的两条陈旧条目；按条目数例外清单净减一条，但减少的两条对应已下架、无法再启用的模型，实际新增的是可在工作区启用的数据收集模型，因此方向记为放宽。同一快照新增 DeepSeek V4.1 Flash Free，免费模型说明明确其供应商零保留、不训练，且未进入例外清单；Step 5 Preview Free 同期从端点表、价目表和免费模型列表下架（零保留、不训练，未进入例外清单，属目录变化）。结论字段未变（data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed、basis=undisclosed；zen-standard / zen-team / zen-enterprise 不变）。"
summary_en = "In snapshot #690 the OpenCode Console docs (https://opencode.ai/docs/zen) added Nemotron 3.5 Super VL Free to the endpoints, pricing and free-model tables and added a Privacy zero-retention exception: 'Nemotron 3.5 Super VL Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.' The bullet mirrors the existing Nemotron 3 Ultra Free / Nemotron 3.5 Lightning Free entries: a data-collecting/logging exception with no stated retention period. The model can be enabled in a workspace, so the training scope list in zen-team / zen-enterprise gains it. The same snapshot removed the two stale exception bullets for Ling 3.1 Flash Free and Ling 3.0 Flash Fin Free, which had already been delisted from the catalog on 10-14; the exception list therefore shrinks by one entry, but the two removed entries correspond to models that are no longer offered and cannot be enabled, while the actual addition is a data-collecting model that a workspace can enable, so the direction is recorded as weakened. The same snapshot also added DeepSeek V4.1 Flash Free, whose free-model description says its provider is zero-retention and does not train on the data, and it did not enter the exception list; Step 5 Preview Free was delisted from the endpoints, pricing and free-model tables in the same snapshot (zero-retention, no-training, not in the exception list, a catalog change). No verdict field changed (the data-collecting tier keeps training / zdr mark=no and retention object=mixed with basis=undisclosed; zen-standard / zen-team / zen-enterprise are unchanged)."
issue = "https://github.com/arcships/zdr-monitor/issues/664"
