summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1164 快照把 LongCat 2.5 Free 加入端点表、价目表和「Free models」列表，并在 Privacy 例外清单新增：「LongCat 2.5 Free: Hosted in China. Prompts and other inputs are not used for training or retained.」。免费模型列表同时写明该模型由服务商零保留、不用于训练，因此 training / zdr / retention 结论不变；但它位于「All our models are hosted in the US and EU.」这句的例外清单中，处理地不再只有 US/EU。zen-standard / zen-team / zen-enterprise 的 processing_region codes 由 [\"US\",\"EU\"] 改为 [\"US\",\"EU\",\"CN\"]，并各新增一条绑定该句的处理地依据；data-collecting 档与 shared-conversations 不变。方向记为放宽（可用处理区域扩大）。"
summary_en = "In snapshot #1164 the OpenCode Console docs (https://opencode.ai/docs/zen) added LongCat 2.5 Free to the endpoints table, the pricing table and the Free models list, and added a Privacy exception: 'LongCat 2.5 Free: Hosted in China. Prompts and other inputs are not used for training or retained.'. The Free models entry also states that the provider follows a zero-retention policy and does not use the data for model training, so the training / zdr / retention verdicts are unchanged; however, the model sits in the exception list to 'All our models are hosted in the US and EU.', so the processing region is no longer US/EU only. The processing_region codes of zen-standard / zen-team / zen-enterprise change from [\"US\",\"EU\"] to [\"US\",\"EU\",\"CN\"], and each tier gains a processing-region point bound to that sentence; the data-collecting tier and shared-conversations are unchanged. The direction is recorded as weakened (the available processing regions widen)."
issue = "https://github.com/arcships/zdr-monitor/issues/1165"
