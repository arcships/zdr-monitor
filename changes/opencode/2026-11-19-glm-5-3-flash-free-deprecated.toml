summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1330 快照把 GLM-5.3-Flash Free 从端点表、价目表和「Free models」列表整条移除，并在 Deprecated models 表新增一行，下架日期为 November 18, 2026，属产品下架。其免费模型条目原句「GLM-5.3-Flash Free is free on OpenCode for a limited time. Its provider follows a zero-retention policy and does not use your data for model training.」随模型一并消失。该模型此前不在 Privacy 零保留例外清单内，这句只是默认句「All our models are hosted in the US and EU. Our providers follow a zero-retention policy and do not use your data for model training, with the following exceptions:」的重复表述，因此例外清单没有增减，其余模型的零保留/不训练口径与保留姿态均未变；付费的 GLM 5.3 Flash 仍在端点表中，不在本次移除范围。同一快照把标题「# Models」改为「# Console models」，并在模型列表 API 说明后新增「See the model list API for every field in the response, and for the Console list that also includes the providers your workspace connected.」，都属文档结构与目录说明，与五个维度无关。五个维度的结论字段均未变（zen-standard / zen-team / zen-enterprise 的 training / zdr 仍 mark=yes、mode=default，retention 仍 object=input_output、basis=none，处理地仍 US/EU/CN；data-collecting 档不变）；台账中没有引用 GLM-5.3-Flash Free 的锚点需要改绑。方向记为澄清。"
summary_en = "In snapshot #1330 the OpenCode Console docs (https://opencode.ai/docs/zen) removed GLM-5.3-Flash Free wholesale from the endpoints table, the pricing table and the Free models list, and added it to the Deprecated models table with a deprecation date of November 18, 2026, i.e. it was delisted. Its free-model bullet — 'GLM-5.3-Flash Free is free on OpenCode for a limited time. Its provider follows a zero-retention policy and does not use your data for model training.' — disappeared with the model. The model was not in the Privacy zero-retention exception list; that bullet merely restated the default sentence 'All our models are hosted in the US and EU. Our providers follow a zero-retention policy and do not use your data for model training, with the following exceptions:', so the exception list neither grew nor shrank, and the zero-retention/no-training posture and retention terms of the remaining models are unchanged. The paid GLM 5.3 Flash is still listed in the endpoints table and is outside this removal. The same snapshot renamed the heading '# Models' to '# Console models' and added 'See the model list API for every field in the response, and for the Console list that also includes the providers your workspace connected.' after the models endpoint text, both documentation-structure/catalog statements unrelated to the five dimensions. No verdict field changed (zen-standard / zen-team / zen-enterprise keep training / zdr mark=yes with mode=default, retention object=input_output with basis=none and processing_region US/EU/CN; the data-collecting tier is unchanged), and no anchor in the ledger cited GLM-5.3-Flash Free, so none needed rebinding. The direction is recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/1333"
