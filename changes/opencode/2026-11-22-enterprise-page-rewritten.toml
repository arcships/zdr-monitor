summary_zh = "OpenCode Enterprise 文档（https://opencode.ai/docs/enterprise/）在 #1382 快照（2026-11-22）被整体重写：原先以「OpenCode Enterprise is for organizations that want to ensure that their code and data never leaves their infrastructure.」「OpenCode does not store your code or context data. All processing happens locally or through direct API calls to your AI provider.」「OpenCode is open source and does not store any of your code or context data」以及按席位定价、SSO/内部 AI 网关、分享页自托管为主要内容的页面，改为以「Use policies to control what OpenCode can use on your organization’s machines.」为中心的托管策略配置文档（部署、屏蔽免费模型、限定 Console 工作区、仅允许批准的上游、限制 MCP/工具、版本要求）。新正文不再出现不存储代码/上下文、本地处理、数据不离开组织基础设施、分享页自托管或按席位定价的表述。台账的 Zen 托管档结论本就不以这些句子为锚点，Enterprise 行也只覆盖 Zen 托管路径，因此五个维度的结论字段均未变；shared-conversations 的 processing_region 仍为 undisclosed，且企业文档现在连分享页/自托管都不再提及。方向记为 weakened：官方页面删除了原先对数据不存储/本地处理的表述。"
summary_en = "The OpenCode Enterprise docs (https://opencode.ai/docs/enterprise/) were rewritten wholesale in snapshot #1382 (2026-11-22). The previous page, built around 'OpenCode Enterprise is for organizations that want to ensure that their code and data never leaves their infrastructure.', 'OpenCode does not store your code or context data. All processing happens locally or through direct API calls to your AI provider.', 'OpenCode is open source and does not store any of your code or context data', per-seat pricing, SSO/internal AI gateway, and self-hosting share pages, was replaced by a managed-policy configuration page centred on 'Use policies to control what OpenCode can use on your organization’s machines.' (deployment, blocking free models, requiring a Console workspace, allowing only approved providers, restricting MCP servers and tools, and version requirements). The new text no longer states that code or context data is not stored, that processing happens locally, that data never leaves the organization's infrastructure, that share pages can be self-hosted, or that pricing is per-seat. The Zen-hosted verdicts never used those sentences as anchors, and the Enterprise row covers only the Zen-hosted path, so no verdict field changed; the processing_region of shared-conversations remains undisclosed, and the Enterprise docs now do not mention share pages or self-hosting at all. The direction is recorded as weakened because the official page removed the earlier no-storage/local-processing statements."
issue = "https://github.com/arcships/zdr-monitor/issues/1383"
