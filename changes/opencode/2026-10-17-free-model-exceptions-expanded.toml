summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）的 Privacy 零保留例外清单在 #703 净增一条例外：「LL Alpha Free: During its free period, collected data may be used to improve the model. Data is retained for 30 days.」（该模型后来在 #794 改名为 Flint 40B Free，措辞与 30 天期限不变，现引文使用 Flint 条目）。同一处「Cat Jam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」被改名为「Beam Free: ...」，措辞与 30 天期限不变，不是新增一条再删一条。端点表、价目表和免费模型列表同步把 Cat Jam Free 改名为 Beam Free、加入 LL Alpha Free；另新增零保留、不训练的 GLM-5.3-Flash Free，未进入例外清单。例外清单净增一条，方向记为放宽；结论字段未变（data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed、basis=undisclosed；zen-standard / zen-team / zen-enterprise 不变）。台账同步更新 zen-team / zen-enterprise 里列举的数据收集类模型；LL Alpha Free（现 Flint 40B Free）的 30 天期限记在 data-collecting 档，Beam Free 不是数据收集模型，其「不训练 + 30 天保留」记在 zen-standard / zen-team / zen-enterprise 的 zdr 与 retention 依据中。"
summary_en = "The Privacy zero-retention exception list of the OpenCode Console docs (https://opencode.ai/docs/zen) gained exactly one new exception in #703: 'LL Alpha Free: During its free period, collected data may be used to improve the model. Data is retained for 30 days.' (the model was later renamed Flint 40B Free in #794 with identical wording and the same 30-day period, and the current quote uses the Flint bullet). The existing bullet 'Cat Jam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.' was renamed to 'Beam Free: ...' in the same snapshot with identical wording and the same 30-day period — it was not a new carve-out replacing a deleted one. The endpoints, pricing and free-model tables likewise rename Cat Jam Free to Beam Free and add LL Alpha Free; GLM-5.3-Flash Free was added as a zero-retention, no-training free model and did not enter the exception list. The exception list has one net new entry, so the direction is recorded as weakened; no verdict field changed (the data-collecting tier keeps training / zdr mark=no and retention object=mixed with basis=undisclosed; zen-standard / zen-team / zen-enterprise are unchanged). The ledger updates the data-collecting model list in zen-team / zen-enterprise; LL Alpha Free (now Flint 40B Free)'s 30-day period is recorded in the data-collecting tier, while Beam Free is not a data-collecting model and its no-training + 30-day retention is recorded in the zdr and retention evidence of zen-standard / zen-team / zen-enterprise."
issue = "https://github.com/arcships/zdr-monitor/issues/664"
