summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1164 快照把 Crouton Alpha Free 从端点表、价目表和「Free models」列表整条移除，并在 Privacy 零保留例外清单删去对应条目：「Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.」。同一快照把该模型加入 Deprecated models 表，下架日期为 November 9, 2026，属产品下架。该模型此前的训练口径冲突（Free models 条目说团队利用免费期改进模型，Privacy 条目说不用于训练）随两条原文一起消失，固定的 30 天保留例外同时移除，零保留例外清单净减一条。台账据此删除 zen-standard / zen-team / zen-enterprise 中 Crouton Alpha Free 的 training、zdr、retention 依据，以及「Zen 数据收集模型」档中说明其不归入本档的 retention 依据；结论字段均未变（各 Zen 达标档 training / zdr 仍 mark=yes、mode=default，retention 仍 object=input_output、basis=none）。方向记为收紧。"
summary_en = "In snapshot #1164 the OpenCode Console docs (https://opencode.ai/docs/zen) removed Crouton Alpha Free wholesale from the endpoints table, the pricing table and the Free models list, and deleted its Privacy zero-retention exception: 'Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.'. The same snapshot added the model to the Deprecated models table with a deprecation date of November 9, 2026, i.e. it was delisted. The model's prior training-position conflict (the Free models entry said the team uses the free period to improve the model, while the Privacy entry said the data is not used for model training) disappears with both sentences, and the fixed 30-day retention exception is removed as well, so the zero-retention exception list shrinks by one. The ledger therefore removes the Crouton Alpha Free training, zdr and retention evidence from zen-standard / zen-team / zen-enterprise, and the retention point in the 'Zen 数据收集模型' tier that explained why it was not assigned there. No verdict field changed (the Zen eligible tiers keep training / zdr mark=yes with mode=default and retention object=input_output with basis=none). The direction is recorded as strengthened."
issue = "https://github.com/arcships/zdr-monitor/issues/1165"
