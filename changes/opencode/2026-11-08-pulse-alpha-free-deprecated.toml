summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1133 快照把 Pulse Alpha Free 从端点表、价目表和「Free models」列表整条移除，并在 Privacy 零保留例外清单删去对应条目：「Pulse Alpha Free: During its free period, collected data may be retained and used to improve the model.」。同一快照把该模型加入 Deprecated models 表，下架日期为 November 6, 2026，属产品下架，数据收集型例外净减一条。台账据此删除「Zen 数据收集模型」档里 Pulse Alpha Free 的 training / zdr / retention 依据，并从 zen-team / zen-enterprise 的数据收集模型清单中移出；结论字段均未变（data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed、basis=undisclosed；zen-standard / zen-team / zen-enterprise 的 training / zdr 仍 mark=yes / default，retention 仍 object=input_output / basis=none，处理地仍 US/EU）。方向记为收紧。"
summary_en = "In snapshot #1133 the OpenCode Console docs (https://opencode.ai/docs/zen) removed Pulse Alpha Free wholesale from the endpoints table, the pricing table and the Free models list, and deleted its Privacy zero-retention exception: 'Pulse Alpha Free: During its free period, collected data may be retained and used to improve the model.'. The same snapshot added the model to the Deprecated models table with a deprecation date of November 6, 2026, i.e. it was delisted, so the data-collecting exceptions shrink by one. The ledger therefore removes the Pulse Alpha Free training / zdr / retention evidence from the 'Zen 数据收集模型' tier and drops it from the data-collecting model lists in zen-team / zen-enterprise. No verdict field changed (the data-collecting tier keeps training / zdr mark=no and retention object=mixed with basis=undisclosed; zen-standard / zen-team / zen-enterprise keep training / zdr mark=yes / default, retention object=input_output / basis=none and processing_region US/EU). The direction is recorded as strengthened."
issue = "https://github.com/arcships/zdr-monitor/issues/1134"
