summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1125 快照把新免费模型 Iceman Free 加入端点表、价目表和「Free models」列表，并在 Privacy 零保留例外清单新增一条：「Iceman Free: During its free period, collected data is retained and used to improve the model.」。与 Big Pickle 等只写「may be used to improve the model」的条目不同，这条同时明文允许保留收集的数据，且未给保留期限或删除承诺，属数据收集/保留型例外。免费模型列表对同一模型写「Iceman Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.」，与 Privacy 条目方向一致，不像 Crouton Alpha Free 那样存在冲突，因此归入「Zen 数据收集模型」档（training / zdr mark=no，retention object=mixed / basis=undisclosed）。该模型可在工作区启用，因此 zen-team / zen-enterprise 的培训范围清单同步加入。同一快照把 Crouton Alpha Free 的端点从 chat/completions（@ai-sdk/openai-compatible）改为 responses（@ai-sdk/openai），只涉及调用方式，未涉及数据处理口径；其余改动是各标题末尾追加「#」锚点记号。结论字段未变（zen-standard / zen-team / zen-enterprise 的 training / zdr 仍 mark=yes / default，retention 仍 object=input_output / basis=none，处理地仍 US/EU；data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed / basis=undisclosed）。例外清单净增一条，方向记为放宽。"
summary_en = "In snapshot #1125 the OpenCode Console docs (https://opencode.ai/docs/zen) added the new free model Iceman Free to the endpoints table, the pricing table and the Free models list, and added a Privacy zero-retention exception: 'Iceman Free: During its free period, collected data is retained and used to improve the model.' Unlike the existing Big Pickle-style bullets that only say collected data 'may be used to improve the model', this bullet also expressly permits retaining the collected data, and it states no retention period or deletion commitment, so it is a data-collecting/retention exception. The Free models list entry for the same model says 'Iceman Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.', which points the same way; unlike Crouton Alpha Free there is no conflict, so the model is assigned to the 'Zen 数据收集模型' tier (training / zdr mark=no, retention object=mixed / basis=undisclosed). The model can be enabled in a workspace, so the training scope lists in zen-team / zen-enterprise gain it. The same snapshot changed Crouton Alpha Free's endpoint from chat/completions (@ai-sdk/openai-compatible) to responses (@ai-sdk/openai), which concerns access method only and states no data-handling terms; every other change is a trailing '#' anchor marker appended to headings. No verdict field changed (zen-standard / zen-team / zen-enterprise keep training / zdr mark=yes / mode=default, retention object=input_output / basis=none and processing_region US/EU; the data-collecting tier keeps training / zdr mark=no and retention object=mixed / basis=undisclosed). The exception list has one net new entry, so the direction is recorded as weakened."
issue = "https://github.com/arcships/zdr-monitor/issues/1126"
