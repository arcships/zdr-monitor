summary_zh = "OpenCode Enterprise 文档（https://opencode.ai/docs/enterprise/）在 #690 快照删除了 Data handling 下的整个 Sharing conversations 小节，包括「The only caveat here is the optional `/share` feature.」「If a user enables the `/share` feature, the conversation and the data associated with it are sent to the service we use to host these share pages at opencode.ai.」「The data is currently served through our CDN’s edge network, and is cached on the edge near your users.」和试用期建议。分享链路的事实依据改由 https://opencode.ai/docs/share 快照承担：同步对象仍可锚定「Syncs your conversation history to our servers」，保留规则仍是「Shared conversations remain accessible until you explicitly unshare them.」直到用户 /unshare 删除，因此 shared-conversations 的 retention 仍为 object=input_output、basis=until_termination、zdr mark=no。处理地则失去唯一的 CDN 边缘披露，现行官方文本没有给出分享页的处理位置，只保留自托管选项，所以 processing_region 由 codes=[\"global\"] 改为 mark=unknown、codes=[\"unknown\"]，searched 记入 docs/share 与 docs/enterprise。方向记为放宽（少了一条位置披露），结论按保守假设显示为未披露。"
summary_en = "In snapshot #690 the OpenCode Enterprise docs (https://opencode.ai/docs/enterprise/) removed the entire Sharing conversations subsection under Data handling, including 'The only caveat here is the optional `/share` feature.', 'If a user enables the `/share` feature, the conversation and the data associated with it are sent to the service we use to host these share pages at opencode.ai.', 'The data is currently served through our CDN’s edge network, and is cached on the edge near your users.' and the trial advice. The shared-conversations product now relies on the https://opencode.ai/docs/share snapshot: the sync object is still anchored to 'Syncs your conversation history to our servers', and retention remains 'Shared conversations remain accessible until you explicitly unshare them.' until the user runs /unshare and deletes the data, so retention stays object=input_output, basis=until_termination and zdr stays mark=no. Processing region loses its only CDN-edge disclosure: current official text gives no location for the share pages and only keeps the self-hosting option, so processing_region changes from codes=[\"global\"] to mark=unknown with codes=[\"unknown\"], with docs/share and docs/enterprise listed in searched. Direction is recorded as weakened (a location disclosure was removed); the verdict shows undisclosed under the conservative rule."
issue = "https://github.com/arcships/zdr-monitor/issues/664"
