summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1382 快照（2026-11-22）有两组与五维相关的变化。其一，数据收集型免费模型 Inkling 2 Small Free 从端点表、价目表和「Free models」列表整条移除，并加入 Deprecated models 表（November 19, 2026）；其 Privacy 例外原句「Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training. See Thinking Machines’ Terms of Service and Privacy Notice.」随之消失。其二，新免费模型 Tidepool Alpha Free 加入端点表、价目表和「Free models」列表，并在 Privacy 例外清单新增：「Tidepool Alpha Free: During its free period, collected data is retained and used to improve the model.」；免费模型列表写「Tidepool Alpha Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.」。按本台账口径，用于改进模型算训练；该模型仍会被保留且未给期限，因此 data-collecting 档继续是 training / zdr = no、retention object=mixed / basis=undisclosed。同一快照新增 Embedding models / Embedding pricing 与 Gemini 4 Neon，调整 GLM、DeepSeek 价目，并把 GLM 5.2、GLM 5.1 加入下架表，均属目录/计价变化，与五维无关。结论字段均未变；一条数据收集例外替换为另一条同姿态例外，方向记为 clarified。"
summary_en = "The OpenCode Console docs (https://opencode.ai/docs/zen) changed in two five-dimension-relevant ways in snapshot #1382 (2026-11-22). First, the data-collecting free model Inkling 2 Small Free was removed wholesale from the endpoints table, the pricing table and the Free models list, and added to the Deprecated models table (November 19, 2026); its Privacy exception bullet — 'Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training. See Thinking Machines’ Terms of Service and Privacy Notice.' — disappeared with it. Second, the new free model Tidepool Alpha Free was added to the endpoints table, the pricing table and the Free models list, and to the Privacy exception list: 'Tidepool Alpha Free: During its free period, collected data is retained and used to improve the model.' The Free models list says 'Tidepool Alpha Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.' Under this ledger's rules, using data to improve the model counts as training; the data is still retained with no stated period, so the data-collecting tier keeps training / zdr = no and retention object=mixed with basis=undisclosed. The same snapshot added Embedding models / Embedding pricing and Gemini 4 Neon, adjusted GLM and DeepSeek prices, and added GLM 5.2 and GLM 5.1 to the deprecation table, all catalog/pricing changes unrelated to the five dimensions. No verdict field changed; one data-collecting exception was replaced by another with the same posture, so the direction is recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/1383"
