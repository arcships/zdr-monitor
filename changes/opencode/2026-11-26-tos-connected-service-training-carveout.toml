summary_zh = "OpenCode Terms of Use（https://opencode.ai/legal/terms-of-service）的 #1442 快照（我们于 2026-11-26 观察）新增了一处与训练维度有关的例外。旧句「In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services.」改为「…, except Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.」；页首 Summary 也新增「We never use Content obtained or derived from a Connected Service for that.」。页面当前版本标注 Effective date: Nov 25, 2026。版本对应：我们上一份快照（2026-11-07 抓取）仍是没有该例外的正文，其「All versions」顶部为 Aug 15, 2026（2 added, 1 removed，#42813，即当前列表第 4 条现在标为 Aug 24 的版本）。从那次抓取到 #1442 之间，页面版本列表新增三个候选：Nov 5, 2026（4 added, 4 removed；提交说明 feat(site): deploy the opencode.ai site separately from the docs #62209；该版仍 states effective Aug 15, 2026）、Nov 8, 2026（2 added, 2 removed；提交说明 docs(legal): cover integrations with third-party services #62700；states effective Nov 8, 2026）、Nov 25, 2026（16 added, 3 removed；提交说明 docs(site): publish the updated Terms of Use and the Refund Policy #66126；states effective Nov 25, 2026）。Nov 25 版可以排除：其 What changed 的 Removed 只有 3 条且已完整列出，不含旧训练句，也没有单独的「还有 N 条」提示；若该版改写了这句，旧句应出现在 Removed 里，因此它不是引入例外的版本。Nov 5 版的 diff 没有抓到，不能排除；其提交说明是站点部署、且该版仍标注 Aug 15 生效，只能算指向非实质性改动的线索，不足以作为排除依据。Nov 8 版的 2 added / 2 removed 与「正文训练句 + 页首 Summary 句各替换一次」的数量吻合，提交说明也直接对应第三方服务集成，但它同样没有抓到该版 diff 原文，因此只作为最可能的候选，而不是唯一候选。基于以上，本记录不填 effective_at，只把 2026-11-26 记为观察日期。该例外所指的 Privacy Policy 不在本 provider 已抓取的来源中，「Connected Service」的定义与范围在本台账内未定，因此本记录不判断 Zen 免费模型的输入或分享会话是否落在例外内，也不排除它与 Zen 隐私例外（收集数据保留并用于改进模型）之间可能存在分歧。结论字段未变。本次观察到的其他厂商改动——Nov 25 版新增的反转售限制、Refund Policy 引用、Prepaid Credits、Usage Limits、争议付款与退款条款——均与五维无关。方向记为 strengthened：对 Connected Service 内容新增了不用于改进的明确承诺。"
summary_en = "Snapshot #1442 of the OpenCode Terms of Use (https://opencode.ai/legal/terms-of-service), which we observed on 2026-11-26, added a training-related exception. The old sentence \"In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services.\" now reads \"..., except Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.\" and the page summary also adds \"We never use Content obtained or derived from a Connected Service for that.\" The page's current version states Effective date: Nov 25, 2026. Version mapping: our previous snapshot (captured 2026-11-07) still had the text without this exception, and its All versions list started with Aug 15, 2026 (2 added, 1 removed, #42813 — the entry now labelled Aug 24). Between that capture and #1442 the version list gained three candidates: Nov 5, 2026 (4 added, 4 removed; commit note \"feat(site): deploy the opencode.ai site separately from the docs\" #62209; that revision still states effective Aug 15, 2026), Nov 8, 2026 (2 added, 2 removed; commit note \"docs(legal): cover integrations with third-party services\" #62700; states effective Nov 8, 2026) and Nov 25, 2026 (16 added, 3 removed; commit note \"docs(site): publish the updated Terms of Use and the Refund Policy\" #66126; states effective Nov 25, 2026). Nov 25 can be excluded: its What changed Removed list has only 3 items and is complete, with no \"and N more\" note, and it does not contain the old training sentence; had that revision rewritten the sentence, the old wording would appear under Removed, so Nov 25 is not the revision that introduced the exception. The Nov 5 diff was not captured and cannot be excluded; its commit note is a site deployment and that revision still states effective Aug 15, which is only a hint of a non-substantive change, not grounds for exclusion. Nov 8's 2 added / 2 removed matches a single replacement each in the body training sentence and the page-summary sentence, and its commit note directly matches third-party service integrations, but its diff was not captured either, so it is the most likely candidate, not the only one. On that basis this record does not set effective_at and uses 2026-11-26 only as the observation date. The Privacy Policy the exception points to is not among this provider's captured sources, so the definition and scope of \"Connected Service\" are undetermined in this ledger; this record therefore does not decide whether Zen free-model inputs or shared conversations fall inside the exception, and it leaves open the possible divergence between the TOS commitment and the Zen privacy exceptions (collected data retained and used to improve the model). No verdict field changed. The other vendor edits observed here — the Nov 25 anti-resale restriction, the Refund Policy reference, Prepaid Credits, Usage Limits, and the disputed-payment and refund clauses — are unrelated to the five dimensions. The direction is recorded as strengthened because of the new explicit commitment not to use Connected Service content for improvement."
