summary_zh = "Zen 文档（https://opencode.ai/docs/zen）Privacy 一节的零保留例外清单新增一条：「Jev APIs: Prompts and other inputs are not used for training. Data is retained in accordance with TypeSafe AI’s Privacy Policy.」。Jev 1.13 与 Jev 1.13 Free 本来就在端点表和价目表里，此前没有出现在例外清单中；新增后 Jev 请求被明确排除在「上游零保留」默认之外，且本条不给出保留期限，而是把期限指向第三方 TypeSafe AI 的政策。五个维度的结论字段未变（各 Zen 档 training 仍 mark=yes / default，zdr 仍 mark=yes / default，retention 仍 basis=none），但在 zen-standard、zen-team、zen-enterprise 三档的 zdr 与 retention 各补一条带锚点（opencode-zen-jev-exception）的依据。同一份快照里 GPT 6.1 Sol 加入端点表与价目表，属产品目录新增、与五维无关，未记录。"
summary_en = "The Privacy section of the Zen docs (https://opencode.ai/docs/zen) gained a bullet in its zero-retention exception list: 'Jev APIs: Prompts and other inputs are not used for training. Data is retained in accordance with TypeSafe AI’s Privacy Policy.' Jev 1.13 and Jev 1.13 Free were already listed in the endpoints and pricing tables but had not appeared in the exception list; with this addition Jev requests are explicitly carved out of the upstream zero-retention default, and no retention period is given in the bullet — the period is deferred to the third party TypeSafe AI's policy. No verdict field changed on any tier (the Zen tiers keep training mark=yes/default, zdr mark=yes/default and retention basis=none), but a new anchored point (opencode-zen-jev-exception) was added to the zdr and retention dimensions of the zen-standard, zen-team and zen-enterprise tiers. The same snapshot also added GPT 6.1 Sol to the endpoints and pricing tables, a catalog change unrelated to the five dimensions, and it was not recorded."
issue = "https://github.com/arcships/zdr-monitor/issues/386"
