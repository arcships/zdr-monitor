summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1050 快照把新免费模型 Crouton Alpha Free 加入端点表、价目表和「Free models」列表，并在 Privacy 零保留例外清单新增一条：「- Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.」。免费模型列表对同一模型另有：「- Crouton Alpha Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.」按本台账「用于改进模型算训练」的口径，后者是训练用途表述，与 Privacy 条目「is not used for model training」直接冲突。两句都是同一页的官方现行表述，按 docs/judgment.md 的要求并列保留、各自标注适用范围（免费模型列表 vs Privacy 例外清单），不选边；因此 Crouton 的训练口径记为「冲突待澄清」，不能声称 training 未变。保留方面，Privacy 条目把免费期内收集的数据固定保留 30 天，属零保留默认之外的例外；该模型可在工作区启用，zen-standard / zen-team / zen-enterprise 的 zdr 与 retention 依据各新增该 30 天 carve-out。Crouton 不归入「Zen 数据收集模型」档，因为两句冲突未裁定，不能只凭其中一句把它归为训练型或零训练型。表格上的 mark/mode/basis 等字段未翻转：zen-standard / zen-team / zen-enterprise 的 training 仍 mark=yes、mode=default，zdr 仍 mark=yes、mode=default，retention 仍 object=input_output、basis=none，处理地仍 US/EU；data-collecting 档与 shared-conversations 不变。例外清单净增一条，方向记为放宽。"
summary_en = "In snapshot #1050 the OpenCode Console docs (https://opencode.ai/docs/zen) added the new free model Crouton Alpha Free to the endpoints table, the pricing table and the Free models list, and added a Privacy zero-retention exception: '- Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.' The same page's Free models list entry for the same model also says: '- Crouton Alpha Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.' Under this ledger's rule that use to improve the model counts as training, that is a training-use statement and directly conflicts with the Privacy bullet's 'is not used for model training'. Both are current first-party statements on the same page; per docs/judgment.md they are kept side by side with their own scope (Free models list vs Privacy exception list), and the conflict is left unresolved. Crouton's training posture is therefore recorded as conflicting/pending clarification, not as unchanged training. On retention, the Privacy bullet keeps data collected during the free period for a fixed 30 days, a carve-out from the zero-retention default; because the model can be enabled in a workspace, the zdr and retention evidence of zen-standard / zen-team / zen-enterprise each gains this 30-day carve-out. Crouton is not assigned to the 'Zen 数据收集模型' tier because the conflict is unresolved: it is not classified as either a training/data-collecting model or a confirmed no-training model on the strength of one sentence. The table fields (mark/mode/basis etc.) are not flipped: zen-standard / zen-team / zen-enterprise keep training mark=yes with mode=default, zdr mark=yes with mode=default, retention object=input_output with basis=none, and processing_region US/EU; the data-collecting tier and shared-conversations are unchanged. The exception list has one net new entry, so the direction is recorded as weakened."
issue = "https://github.com/arcships/zdr-monitor/issues/1052"
