summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1387 快照（2026-11-23）把 LongCat 2.5 Free 从端点表、价目表、「Free models」列表和 Privacy 例外清单整条移除，并在 Deprecated models 表新增一行「| LongCat-2.0 | November 22, 2026 |」。其 Privacy 原句「- LongCat 2.5 Free: Hosted in China. Prompts and other inputs are not used for training or retained.」随之消失，当前文档的端点表、价目表和免费模型列表中已经没有 LongCat 2.5 Free。该句是 zen-standard / zen-team / zen-enterprise 的 processing_region 里 CN 的唯一依据：原句位于「All our models are hosted in the US and EU.」的例外清单中；移除后当前文档没有任何模型声明为中国托管，三个档的 processing_region codes 由 [\"US\",\"EU\",\"CN\"] 改为 [\"US\",\"EU\"]，并删除对应的处理地依据与锚点 opencode-zen-longcat-china。training / zdr / retention 的结论不变：该模型本来不在训练例外清单内，其零保留表述与默认句同向，且模型已不在当前目录中，无需再为它单独保留结论。同一快照新增 Jev 1.14（System One 端点与价目）并调整 Jev 1.13 免费模型说明，还把 Inkling 2 Small Free、GLM-5.3-Flash Free、MiniMax M3.1 Flash Free、Crouton Alpha Free、Pulse Alpha Free 移出 Deprecated models 表，均属目录/计价变化，与五维无关。方向记为收紧（可用处理区域收窄）。"
summary_en = "In snapshot #1387 (2026-11-23) the OpenCode Console docs (https://opencode.ai/docs/zen) removed LongCat 2.5 Free wholesale from the endpoints table, the pricing table, the Free models list and the Privacy exception list, and added a row '| LongCat-2.0 | November 22, 2026 |' to the Deprecated models table. Its Privacy bullet '- LongCat 2.5 Free: Hosted in China. Prompts and other inputs are not used for training or retained.' disappeared with it, and LongCat 2.5 Free no longer appears in the current endpoints, pricing or free-model tables. That bullet was the only basis for CN in the processing_region of zen-standard / zen-team / zen-enterprise: it sat in the exception list to 'All our models are hosted in the US and EU.'. After the removal no model is stated to be hosted in China, so the processing_region codes of the three tiers change from [\"US\",\"EU\",\"CN\"] to [\"US\",\"EU\"], and the corresponding processing-region point and the opencode-zen-longcat-china anchor are deleted. The training / zdr / retention verdicts are unchanged: the model was not in the training exception list, its zero-retention wording matched the default sentence, and it is no longer part of the current catalog, so no model-specific conclusion needs to be kept. The same snapshot added Jev 1.14 (System One endpoint and pricing), reworded the Jev 1.13 free-model note, and removed Inkling 2 Small Free, GLM-5.3-Flash Free, MiniMax M3.1 Flash Free, Crouton Alpha Free and Pulse Alpha Free from the Deprecated models table, all catalog/pricing changes unrelated to the five dimensions. The direction is recorded as strengthened (the available processing regions narrow)."
issue = "https://github.com/arcships/zdr-monitor/issues/1388"
