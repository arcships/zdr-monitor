summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #842 快照的 Privacy 例外清单删去两条数据收集类免费模型：「Exo Free: During its free period, collected data may be used to improve the model.」与「MiMo-V2.5 Free: During its free period, collected data may be used to improve the model.」。同一快照里这两个模型也从端点表、价目表和「The free models」列表整条移除，属产品下架，数据收集类例外条目由八条减为六条（Big Pickle、Flint 40B Free、MiMo-V2.6-Flash Free、Nemotron 3 Ultra Free、Nemotron 3.5 Lightning Free、Nemotron 3.5 Super VL Free），方向记为收紧。零保留、不训练的 LongCat 2.5 Preview Free 同样从端点表、价目表和免费模型列表整条下架，其原句「LongCat 2.5 Preview Free is free on OpenCode for a limited time. Its provider follows a zero-retention policy and does not use your data for model training.」随之消失，但该模型本来就不在例外清单内，故不改变 carve-out 数量。端点表新增一句「Free-tier chat models require OpenCode; use paid models or Go from other clients.」，限定免费档聊天模型的客户端，属访问方式而非数据处理口径。Qwen3.7 Max、Qwen3.7 Plus 从端点表和价目表下架（付费模型，无对应隐私条款）；Kimi K3 新增 cached write 价格 $3.00、示例模型改为 opencode/gpt-6.1-sol，均属目录与计价变化。五个维度的结论字段均未变（data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed、basis=undisclosed；zen-standard / zen-team / zen-enterprise 的 training / zdr 仍 mark=yes / default，retention 仍 basis=none，处理地仍 US/EU）；zen-team 与 zen-enterprise 两档 training 依据里列举的「数据收集类模型」清单同步删去 Exo Free 与 MiMo-V2.5 Free，以与快照一致。"
summary_en = "The Privacy exception list of the OpenCode Console docs (https://opencode.ai/docs/zen) lost two data-collecting free-model bullets in snapshot #842: 'Exo Free: During its free period, collected data may be used to improve the model.' and 'MiMo-V2.5 Free: During its free period, collected data may be used to improve the model.'. In the same snapshot both models were also removed wholesale from the endpoints table, the pricing table and the 'The free models' list, i.e. delisted, so the data-collecting exception entries shrink from eight to six (Big Pickle, Flint 40B Free, MiMo-V2.6-Flash Free, Nemotron 3 Ultra Free, Nemotron 3.5 Lightning Free, Nemotron 3.5 Super VL Free); the direction is recorded as strengthened. The zero-retention, no-training LongCat 2.5 Preview Free was likewise delisted from the endpoints, pricing and free-model tables, and its sentence 'LongCat 2.5 Preview Free is free on OpenCode for a limited time. Its provider follows a zero-retention policy and does not use your data for model training.' disappeared with it, but that model was never in the exception list, so the number of carve-outs does not change. The endpoints section gained 'Free-tier chat models require OpenCode; use paid models or Go from other clients.', a client restriction on free-tier chat models rather than a data-handling statement. Qwen3.7 Max and Qwen3.7 Plus were delisted from the endpoints and pricing tables (paid models with no corresponding privacy clause); Kimi K3 gained a $3.00 cached-write price and the example model became opencode/gpt-6.1-sol, both catalog/pricing changes. No verdict field changed (the data-collecting tier keeps training / zdr mark=no and retention object=mixed with basis=undisclosed; zen-standard / zen-team / zen-enterprise keep training / zdr mark=yes / default, retention basis=none and processing_region US/EU); the data-collecting model list in the training points of zen-team and zen-enterprise drops Exo Free and MiMo-V2.5 Free to stay consistent with the snapshot."
issue = "https://github.com/arcships/zdr-monitor/issues/843"
