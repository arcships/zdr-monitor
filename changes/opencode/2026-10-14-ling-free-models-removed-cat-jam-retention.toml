summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #671 快照的免费模型目录删除了 Ling 3.1 Flash Free 与 Ling 3.0 Flash Fin Free（端点表、价目表和免费模型列表均不再列出），并把 Cat Jam Free 从数据收集条目改为不训练、保留 30 天：「Cat Jam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」。DeepSeek V4 Flash 与 DeepSeek V4 Flash Vision Exp 也从端点表和价目表下架。数据收集与训练型免费模型减少，方向记为收紧。注意：Ling 两条例外条目在本次快照仍留在 Privacy 例外清单中，直到 #690（2026-10-16）才被删除；本次只记录目录下架与 Cat Jam 的条款变化。结论字段未变（data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed、basis=undisclosed；zen-standard / zen-team / zen-enterprise 不变）。zen-team / zen-enterprise 的数据收集类模型清单同步删去 Ling 3.1 Flash Free 与 Ling 3.0 Flash Fin Free。"
summary_en = "In snapshot #671 the free-model catalog of the OpenCode Console docs (https://opencode.ai/docs/zen) dropped Ling 3.1 Flash Free and Ling 3.0 Flash Fin Free (no longer listed in the endpoints, pricing or free-model tables), and Cat Jam Free moved from a data-collecting bullet to a no-training, 30-day-retention bullet: 'Cat Jam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.' DeepSeek V4 Flash and DeepSeek V4 Flash Vision Exp were also delisted from the endpoints and pricing tables. Data-collecting and training free models shrank, so the direction is recorded as strengthened. Note: the two Ling exception bullets were still in the Privacy exception list in this snapshot and were only removed in #690 (2026-10-16); this record covers the catalog delisting and the Cat Jam terms only. No verdict field changed (the data-collecting tier keeps training / zdr mark=no and retention object=mixed with basis=undisclosed; zen-standard / zen-team / zen-enterprise are unchanged). The data-collecting model list in zen-team / zen-enterprise drops Ling 3.1 Flash Free and Ling 3.0 Flash Fin Free."
issue = "https://github.com/arcships/zdr-monitor/issues/664"
