summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1442 快照（2026-11-26）新增免费模型 Seaglass Alpha Free，同时加入端点表、价目表、「Free models」列表和 Privacy 例外清单。Privacy 例外原句：「Seaglass Alpha Free: During its free period, collected data is retained and used to improve the model.」；免费模型列表写：「Seaglass Alpha Free is a stealth model that's free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.」。按本台账口径，用于改进模型算训练；保留仅以免费期为范围，未给期限，也未说明免费期结束后是否删除。因此该模型沿用 data-collecting 档的 training=no、zdr=no 与 retention object=mixed / basis=undisclosed，台账为该模型新增依据点和锚点 opencode-zen-seaglass-exception，zen-team / zen-enterprise 的 scope lists 同步加入 Seaglass。同一快照新增付费模型 Kimi K3.1 Pro（并列出 cached write 价目）、把图像工具名由 experimental_image_generate 改为 generate_image、调整 Embedding 免费档说明和导航标题，均属目录/计价/文档措辞变化，与五维无关。方向记为 weakened：新增了一个保留数据并用于改进模型的免费档。结论字段未变。"
summary_en = "The OpenCode Console docs (https://opencode.ai/docs/zen) added a new free model, Seaglass Alpha Free, in snapshot #1442 (2026-11-26), listing it in the endpoints table, pricing table, Free models list and Privacy exception list. The Privacy exception reads \"Seaglass Alpha Free: During its free period, collected data is retained and used to improve the model.\" and the Free models list reads \"Seaglass Alpha Free is a stealth model that's free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.\" Under this ledger's rules, using data to improve the model counts as training; retention is scoped to the free period with no stated length and no statement about deletion after the free period. The model therefore keeps the data-collecting tier's training=no, zdr=no and retention object=mixed / basis=undisclosed, the ledger gains a supporting point and the opencode-zen-seaglass-exception anchor for it, and the zen-team / zen-enterprise scope lists now include Seaglass. The same snapshot added the paid model Kimi K3.1 Pro (with a cached-write price), renamed the image tool from experimental_image_generate to generate_image, and adjusted the Embedding free-tier wording and navigation heading, all catalog/pricing/document-wording changes unrelated to the five dimensions. The direction is recorded as weakened because a new free tier that retains data and uses it to improve the model was added. No verdict field changed."
issue = "https://github.com/arcships/zdr-monitor/issues/1443"
