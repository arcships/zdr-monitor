summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1012 快照把新免费模型 Pulse Alpha Free 加入端点表、价目表和免费模型列表，并在 Privacy 零保留例外清单新增一条：「Pulse Alpha Free: During its free period, collected data may be retained and used to improve the model.」。与既有的 Big Pickle 等「仅用于改进模型」条目不同，这条同时明文允许保留收集的数据；保留授权以免费期为范围，免费期多长、免费期结束后是否删除均未说明，属数据收集/保留型例外。模型可在工作区启用，因此 zen-team / zen-enterprise 的培训范围清单同步加入。例外清单净增一条，方向记为放宽。同一快照新增一句「Each model is listed with its native API, but every text model also works through the other APIs, which Console translates. See Base URLs for the full set.」，只讲端点调用方式与翻译，未涉及数据处理口径；DeepSeek V4 Flash 加入 Deprecated models 表（下架日期 2026-10-26），属目录变化。结论字段未变（data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed、basis=undisclosed；zen-standard / zen-team / zen-enterprise 的 training / zdr 仍 mark=yes / default，retention 仍 basis=none，处理地仍 US/EU）。"
summary_en = "In snapshot #1012 the OpenCode Console docs (https://opencode.ai/docs/zen) added the new free model Pulse Alpha Free to the endpoints, pricing and free-model tables and added a Privacy zero-retention exception: 'Pulse Alpha Free: During its free period, collected data may be retained and used to improve the model.' Unlike the existing Big Pickle-style bullets that only permit use for model improvement, this bullet also expressly permits retaining the collected data; the retention permission is scoped to the free period, and its length and any post-free-period deletion are not stated, so it is a data-collecting/retention exception. The model can be enabled in a workspace, so the training scope list in zen-team / zen-enterprise gains it. The exception list has one net new entry, so the direction is recorded as weakened. The same snapshot adds the sentence 'Each model is listed with its native API, but every text model also works through the other APIs, which Console translates. See Base URLs for the full set.', which concerns endpoint access and translation only and states no data-handling terms; DeepSeek V4 Flash was added to the Deprecated models table (deprecation date 2026-10-26), a catalog change. No verdict field changed (the data-collecting tier keeps training / zdr mark=no and retention object=mixed with basis=undisclosed; zen-standard / zen-team / zen-enterprise keep training / zdr mark=yes / default, retention basis=none and processing_region US/EU)."
issue = "https://github.com/arcships/zdr-monitor/issues/1014"
