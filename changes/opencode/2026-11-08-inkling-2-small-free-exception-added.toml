summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1133 快照把新免费模型 Inkling 2 Small Free 加入端点表、价目表和「Free models」列表，并在 Privacy 零保留例外清单新增一条：「Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training. See Thinking Machines’ Terms of Service and Privacy Notice.」。免费模型列表对同一模型写「Inkling 2 Small Free is free on OpenCode for a limited time. Its provider retains your data and may use it for model training; see Privacy.」，两句方向一致：明文允许保留收集的数据，并可用于模型训练与监测实际表现，按本台账口径属数据收集型例外，且未给保留期限或删除承诺。该模型可在工作区启用，因此 training / zdr / retention 依据记入「Zen 数据收集模型」档，zen-team / zen-enterprise 的数据收集模型清单同步加入。结论字段未变（data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed、basis=undisclosed；zen-standard / zen-team / zen-enterprise 的 training / zdr 仍 mark=yes / default，retention 仍 object=input_output / basis=none，处理地仍 US/EU）。例外清单净增一条，方向记为放宽。"
summary_en = "In snapshot #1133 the OpenCode Console docs (https://opencode.ai/docs/zen) added the new free model Inkling 2 Small Free to the endpoints table, the pricing table and the Free models list, and added a Privacy zero-retention exception: 'Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training. See Thinking Machines’ Terms of Service and Privacy Notice.'. The Free models list says the same thing for the same model — 'Inkling 2 Small Free is free on OpenCode for a limited time. Its provider retains your data and may use it for model training; see Privacy.' — so both statements point the same way: collected data is expressly retained and may be used for model training and for monitoring real-world performance. Under this ledger's rules that is a data-collecting exception, and it states no retention period or deletion commitment. The model can be enabled in a workspace, so its training / zdr / retention evidence is recorded in the 'Zen 数据收集模型' tier and the data-collecting model lists in zen-team / zen-enterprise gain it. No verdict field changed (the data-collecting tier keeps training / zdr mark=no and retention object=mixed with basis=undisclosed; zen-standard / zen-team / zen-enterprise keep training / zdr mark=yes / default, retention object=input_output / basis=none and processing_region US/EU). The exception list has one net new entry, so the direction is recorded as weakened."
issue = "https://github.com/arcships/zdr-monitor/issues/1134"
