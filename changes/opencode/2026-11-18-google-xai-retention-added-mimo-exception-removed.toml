summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1312 快照（2026-11-18）的 Privacy 例外清单有三组与五维相关的变化。其一，新增两条上游保留例外：「Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.」与「xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.」。按端点表，Google 例外适用于列在 `google/v1beta/models/...` 端点上的 Gemini 模型；Gemini Decision 1 列在 `systemone/v1/systemone`，不属于 Google 端点，因此不适用 55 天。xAI 例外只归到新增的 Grok Imagine Image 2.0（`xai/v1/images/generations`）；Grok 4.7 / 4.6 / 4.5 / Grok Build 0.1 在端点表里列于 `openai/v1/responses`，原文没有说明其上游 API，因此不把 30 天期限记到这些文本模型上。这些 Gemini 模型此前只受默认零保留句约束，现在有明确的最长 55 天保留期限；新增的 Grok Imagine Image 2.0 与 xAI 例外同时出现，现在有明确的 30 天期限。zen-standard / zen-team / zen-enterprise 的 zdr 与 retention 各补一条依据，verdict 字段未变（training / zdr 仍 mark=yes、mode=default，retention 仍 object=input_output、basis=none）。其二，MiMo-V2.6-Flash Free 从例外清单删除，原条目「MiMo-V2.6-Flash Free: During its free period, collected data may be used to improve the model.」消失；其免费模型条目由「...collect feedback and improve the model.」改为「MiMo-V2.6-Flash Free is available on OpenCode for a limited time. The team is using this time to collect feedback.」。既然不再属于默认句「All our models are hosted in the US and EU. Our providers follow a zero-retention policy and do not use your data for model training, with the following exceptions:」的例外，MiMo 现按默认口径处理：零保留、不训练；不再列入 data-collecting 档，zen-team / zen-enterprise 的 scope lists 同步删去。其三，Nemotron 3 Ultra Free 的 Privacy 条目「...Trial use only — do not submit personal or confidential data. Your use is logged...」随该模型从端点表、价目表和免费模型列表下架而删除，属产品下架；opencode-zen-nvidia-free 锚点改绑到仍在列的 Nemotron 3.5 Lightning Free 同文条目，data-collecting 档的 NVIDIA 依据以及 zen-team / zen-enterprise 的 scope lists 同步更新。同一快照把 Gemini 3.1 Pro、Gemini 3 Flash、MiniMax M3.1 Flash Free 移出各表并列入下架清单（2026-11-17），新增 GPT 6.2 Astra / GPT 6.2 Sol（OpenAI 端点，适用既有 OpenAI 30 天例外）、三个图像模型及 Image pricing 小节，均属目录/计价变化。综合看，新增的 Google 最长 55 天例外与 xAI 30 天例外对主档影响更大，方向记为放宽；MiMo 的例外移除与 Nemotron 3 Ultra 下架方向相反。"
summary_en = "The Privacy exception list of the OpenCode Console docs (https://opencode.ai/docs/zen) changed in three five-dimension-relevant ways in snapshot #1312 (2026-11-18). First, two upstream retention exceptions were added: \"Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.\" and \"xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.\" Per the endpoint table, the Google exception applies to the Gemini models listed on `google/v1beta/models/...` endpoints; Gemini Decision 1 is listed on `systemone/v1/systemone`, not a Google endpoint, so the 55 days do not apply to it. The xAI exception is attributed only to the new Grok Imagine Image 2.0 model (`xai/v1/images/generations`); Grok 4.7 / 4.6 / 4.5 / Grok Build 0.1 are listed on `openai/v1/responses`, and the docs do not state which upstream API serves them, so the 30-day period is not recorded for those text models. Those Gemini models were previously covered only by the default zero-retention sentence and now have an explicit upper bound of 55 days; the new Grok Imagine Image 2.0 arrives together with the xAI exception and now has an explicit 30-day period. The zdr and retention dimensions of zen-standard / zen-team / zen-enterprise each gain a point; no verdict field changed (training / zdr keep mark=yes with mode=default, retention keeps object=input_output with basis=none). Second, MiMo-V2.6-Flash Free was removed from the exception list: its old bullet \"MiMo-V2.6-Flash Free: During its free period, collected data may be used to improve the model.\" disappeared, and its Free models bullet changed from \"...collect feedback and improve the model.\" to \"MiMo-V2.6-Flash Free is available on OpenCode for a limited time. The team is using this time to collect feedback.\" Since it is no longer an exception to the default sentence \"All our models are hosted in the US and EU. Our providers follow a zero-retention policy and do not use your data for model training, with the following exceptions:\", MiMo now falls under the default posture: zero retention and no training. It is no longer part of the data-collecting tier, and the scope lists in zen-team / zen-enterprise drop it. Third, the Privacy bullet of Nemotron 3 Ultra Free (\"...Trial use only — do not submit personal or confidential data. Your use is logged...\") disappeared together with the model from the endpoints, pricing and Free models tables, a product removal; the opencode-zen-nvidia-free anchor is rebound to the identical bullet of the still-listed Nemotron 3.5 Lightning Free, and the NVIDIA evidence in the data-collecting tier plus the scope lists in zen-team / zen-enterprise are updated. The same snapshot removed Gemini 3.1 Pro, Gemini 3 Flash and MiniMax M3.1 Flash Free from the tables and added them to the deprecation list (dated 2026-11-17), and added GPT 6.2 Astra / GPT 6.2 Sol (OpenAI endpoint, falling under the existing OpenAI 30-day exception), three image models and an Image pricing section, all catalog/pricing changes. On balance the new Google (up to 55 days) and xAI (30 days) exceptions have the larger effect on the main tiers, so the direction is recorded as weakened; the MiMo exception removal and the Nemotron 3 Ultra delisting point the other way."
issue = "https://github.com/arcships/zdr-monitor/issues/1313"
