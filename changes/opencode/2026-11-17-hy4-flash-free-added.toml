summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #1263 快照把新免费模型 Hy4 flash Free 加入端点表、价目表和「Free models」列表，免费模型条目新增：'Hy4 flash Free is free on OpenCode for a limited time. Its provider follows a zero-retention policy and does not use your data for model training.'。该模型未进入 Privacy 零保留例外清单，仍适用 'All our models are hosted in the US and EU. Our providers follow a zero-retention policy and do not use your data for model training, with the following exceptions:' 的默认口径，因此没有新增 carve-out，也没有新增保留期限或处理地例外；五个维度的结论字段均未变（zen-standard / zen-team / zen-enterprise 的 training / zdr 仍 mark=yes、mode=default，retention 仍 object=input_output、basis=none，处理地仍 US/EU/CN；data-collecting 档不变）。同一快照把 Gemini 4 Carbon、Gemini 4 Hydrogen（Google 端点）、GPT 6 Luna Decision、Gemini Decision 1（System One 端点）加入端点表与价目表；新增的 GPT 6 Luna Decision and Gemini Decision 1 小节只描述请求格式与输入模态，未涉及数据处理口径。这些模型均未进入例外清单，属目录新增，未改变五维结论。同一快照把 Muse Ember 1.0 的价目按长上下文分档，并把 Gemini 4 Carbon 加入 50% 折扣说明，均属计价/目录变化。免费模型新句明确写明该模型由服务商零保留、不训练，属对既有默认口径的表述澄清，方向记为 clarified。"
summary_en = "In snapshot #1263 the OpenCode Console docs (https://opencode.ai/docs/zen) added the new free model Hy4 flash Free to the endpoints table, the pricing table and the Free models list, with the new bullet 'Hy4 flash Free is free on OpenCode for a limited time. Its provider follows a zero-retention policy and does not use your data for model training.'. The model was not added to the Privacy zero-retention exception list, so the default statement — 'All our models are hosted in the US and EU. Our providers follow a zero-retention policy and do not use your data for model training, with the following exceptions:' — still covers it: no carve-out, retention period or processing-region exception was added, and no verdict field changed (zen-standard / zen-team / zen-enterprise keep training / zdr mark=yes with mode=default, retention object=input_output with basis=none and processing_region US/EU/CN; the data-collecting tier is unchanged). The same snapshot added Gemini 4 Carbon and Gemini 4 Hydrogen (Google endpoints) plus GPT 6 Luna Decision and Gemini Decision 1 (System One endpoint) to the endpoints and pricing tables; the new GPT 6 Luna Decision and Gemini Decision 1 section describes request format and input modalities only and states no data-handling terms. None of these models entered the exception list, so they are catalog additions that do not change any of the five dimensions. The same snapshot split Muse Ember 1.0 pricing into long-context tiers and added Gemini 4 Carbon to the 50% discount note, both pricing/catalog changes. The new free-model sentence explicitly states that the model's provider is zero-retention and does not train on the data, a clarification of the existing default posture; the direction is recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/1265"
