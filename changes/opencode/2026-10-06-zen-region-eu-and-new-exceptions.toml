summary_zh = "OpenCode Zen 文档（https://opencode.ai/docs/zen）Privacy 一节有三处变化。其一，处理地口径由「All our models are hosted in the US.」改为「All our models are hosted in the US and EU.」，各 Zen 档 processing_region 的 codes 由 [\"US\"] 改为 [\"US\",\"EU\"]。其二，零保留例外清单新增三条数据收集类免费模型（Exo Free、Fledge Alpha Free、Ling 3.1 Flash Free），与既有条目同句「During its free period, collected data may be used to improve the model.」。其三，新增一条上游例外「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」，把 Mistral 请求的保留期限指向第三方政策，与既有的 Jev 例外同构。结论字段方面只有处理地变了（各 Zen 档 codes 加 EU）；training / zdr / retention 各档的 mark、mode、basis 均未变（Zen 达标档仍 training=yes/default、zdr=yes/default、retention basis=none），但零保留例外清单范围扩大、处理地由单区域变多区域，整体方向记为放宽。zen-standard、zen-team、zen-enterprise 三档的 zdr 与 retention 各补一条 Mistral 例外依据（opencode-zen-mistral-exception），training 档列举的数据收集模型清单同步补入三个新免费模型。同一快照另把 Mistral Large 4 及三个免费模型加入端点表和价目表，属产品目录新增。"
summary_en = "Three changes in the Privacy section of the OpenCode Zen docs (https://opencode.ai/docs/zen). First, the hosting statement changed from 'All our models are hosted in the US.' to 'All our models are hosted in the US and EU.', and every Zen tier's processing_region codes go from [\"US\"] to [\"US\",\"EU\"]. Second, the zero-retention exception list gained three data-collecting free models (Exo Free, Fledge Alpha Free, Ling 3.1 Flash Free), each with the existing bullet wording 'During its free period, collected data may be used to improve the model.' Third, a new upstream exception bullet was added: 'Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.', deferring Mistral requests' retention to the third party's policy and mirroring the existing Jev exception. On verdict fields only the region changed (each Zen tier's codes gains EU); the training / zdr / retention mark, mode and basis are unchanged for every tier (the Zen Hosted tiers keep training=yes/default, zdr=yes/default and retention basis=none), but the zero-retention exception list widened and the processing region went from one region to several, so the direction is recorded as weakened. The zdr and retention dimensions of the zen-standard, zen-team and zen-enterprise tiers each gain a Mistral-exception point (opencode-zen-mistral-exception), and the data-collecting model list enumerated in their training points gains the three new free models. The same snapshot also added Mistral Large 4 and the three free models to the endpoints and pricing tables, a catalog change."
issue = "https://github.com/arcships/zdr-monitor/issues/519"
