summary_zh = "OpenCode Console 文档（https://opencode.ai/docs/zen）在 #732 快照从 Privacy 例外清单删除了 Muse Spark 1.3 Contributor Free：「Muse Spark 1.3 Contributor Free: Heavily discounted token pricing in exchange for permission to use your prompts and completions to train future Meta models. Learn more.」。同一快照里该模型也从端点表、价目表和免费模型列表整条下架。Space Bunny Free 在端点表、价目表和免费模型列表中的位置由 MiniMax M3.1 Flash Free 取代（当时仍是零保留、不训练，未进入例外清单），不是新增一条再删一条。训练授权型例外减少一条，方向记为收紧；结论字段未变（data-collecting 档 training / zdr 仍 mark=no，retention 仍 object=mixed、basis=undisclosed；zen-standard / zen-team / zen-enterprise 不变）。zen-team / zen-enterprise 的数据收集类模型清单同步删去 Muse Spark 1.3 Contributor Free。"
summary_en = "In snapshot #732 the Privacy exception list of the OpenCode Console docs (https://opencode.ai/docs/zen) dropped Muse Spark 1.3 Contributor Free: 'Muse Spark 1.3 Contributor Free: Heavily discounted token pricing in exchange for permission to use your prompts and completions to train future Meta models. Learn more.' In the same snapshot the model was also delisted from the endpoints, pricing and free-model tables. Space Bunny Free's position in the endpoints, pricing and free-model tables was taken by MiniMax M3.1 Flash Free (still zero-retention and no-training at the time, and not in the exception list), rather than being two separate changes. A training-permission exception was removed, so the direction is recorded as strengthened; no verdict field changed (the data-collecting tier keeps training / zdr mark=no and retention object=mixed with basis=undisclosed). The data-collecting model list in zen-team / zen-enterprise drops Muse Spark 1.3 Contributor Free."
issue = "https://github.com/arcships/zdr-monitor/issues/664"
