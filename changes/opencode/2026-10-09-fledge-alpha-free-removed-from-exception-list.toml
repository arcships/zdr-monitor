summary_zh = "OpenCode Zen 文档（https://opencode.ai/docs/zen）Privacy 一节的零保留例外清单删去一条数据收集类免费模型：「Fledge Alpha Free: During its free period, collected data may be used to improve the model.」。同一快照里 Fledge Alpha Free 也从端点表、价目表和「The free models」列表整条移除，属产品下架，例外清单因此缩小一条。同时「The free models」列表新增 Step 5 Preview Free，措辞为「Step 5 Preview Free is free on OpenCode for a limited time. Its provider follows a zero-retention policy and does not use your data for model training.」——它与 Space Bunny Free、LongCat 2.5 Preview Free 同构，明确零保留、不训练，且未进入隐私例外清单，因此不扩大 carve-out。同一快照另把 Claude Sonnet 5.5、Claude Haiku 5.5 加入端点表与价目表，属产品目录新增、与五维无关。五个维度的结论字段均未变（各 Zen 档 training 仍 mark=yes / default，zdr 仍 mark=yes / default，retention 仍 basis=none，处理地仍 US/EU）；zen-team 与 zen-enterprise 两档 training 依据里列举的「数据收集类模型」清单同步删去 Fledge Alpha Free，以与快照一致。"
summary_en = "The zero-retention exception list in the Privacy section of the OpenCode Zen docs (https://opencode.ai/docs/zen) lost a data-collecting free model: 'Fledge Alpha Free: During its free period, collected data may be used to improve the model.'. In the same snapshot Fledge Alpha Free was also removed wholesale from the endpoints table, the pricing table and the 'The free models' list, i.e. it was delisted, so the exception list shrank by one entry. At the same time 'The free models' list gained Step 5 Preview Free with the wording 'Step 5 Preview Free is free on OpenCode for a limited time. Its provider follows a zero-retention policy and does not use your data for model training.' — parallel to Space Bunny Free and LongCat 2.5 Preview Free, it is explicitly zero-retention and not used for training, and it did not enter the privacy exception list, so the carve-outs did not widen. The same snapshot also added Claude Sonnet 5.5 and Claude Haiku 5.5 to the endpoints and pricing tables, a catalog change unrelated to the five dimensions. No verdict field changed on any tier (the Zen tiers keep training mark=yes/default, zdr mark=yes/default, retention basis=none and processing_region US/EU); the data-collecting model list enumerated in the training points of the zen-team and zen-enterprise tiers drops Fledge Alpha Free to stay consistent with the snapshot."
issue = "https://github.com/arcships/zdr-monitor/issues/555"
