summary_zh = "OpenCode 在 #663 快照把 https://opencode.ai/docs/zen 的正文从 Zen 改写为 Console（产品改名，端点路径改为 /inference/），并删除了 Privacy 零保留例外清单中的 Jev 条目：「Jev APIs: Prompts and other inputs are not used for training. Data is retained in accordance with TypeSafe AI’s Privacy Policy.」。Jev 1.13 与 Jev 1.13 Free 仍留在端点表和价目表内，但不再出现在例外清单中，因此文档开头「Our providers follow a zero-retention policy and do not use your data for model training, with the following exceptions:」的默认口径现在按原文覆盖 Jev；原先指向 TypeSafe AI 政策的保留期 carve-out 消失。同一份快照把「For Teams」整节替换为一句团队工作区说明，并删除了「Admins can enable or disable specific models for the workspace. Requests made to a disabled model will return an error.」「This is useful for cases where you want to disable the use of a model that collects data.」以及 beta 期免费工作区那句「Workspaces are currently free for teams as a part of the beta.」。新的团队句「Owners and admins can invite members, choose which models are enabled from the **Models** tab, set budgets, and connect their own providers.」仍支持「模型清单由管理员选择、会收集数据的模型可能被启用」这一范围限定，因此 zen-team 与 zen-enterprise 的培训范围依据改绑到该句；beta 免费不再是文档事实，unpaid account 条款的适用性继续记为待澄清。本快照的例外清单尚未出现 Nemotron 3.5 Super VL Free（该模型在 #690 才加入，见 2026-10-16 记录）。结论字段未变（zen-standard / zen-team / zen-enterprise 的 training / zdr 仍 mark=yes、mode=default，retention 仍 basis=none），但 Jev 不再被排除在零保留默认之外，方向记为收紧。"
summary_en = "In snapshot #663 OpenCode rewrote https://opencode.ai/docs/zen from Zen to Console (product rename, endpoint paths moved under /inference/) and deleted the Jev bullet from the Privacy zero-retention exception list: 'Jev APIs: Prompts and other inputs are not used for training. Data is retained in accordance with TypeSafe AI’s Privacy Policy.' Jev 1.13 and Jev 1.13 Free remain in the endpoints and pricing tables but no longer appear in the exception list, so the blanket statement at the top of the section — 'Our providers follow a zero-retention policy and do not use your data for model training, with the following exceptions:' — now covers Jev on its face; the carve-out that deferred Jev retention to TypeSafe AI's policy is gone. The same snapshot replaced the whole 'For Teams' section with one workspace sentence and removed 'Admins can enable or disable specific models for the workspace. Requests made to a disabled model will return an error.', 'This is useful for cases where you want to disable the use of a model that collects data.', and the beta-free sentence 'Workspaces are currently free for teams as a part of the beta.' The new sentence — 'Owners and admins can invite members, choose which models are enabled from the **Models** tab, set budgets, and connect their own providers.' — still supports the scope limit that the model list is an admin choice and data-collecting models can be enabled, so the zen-team and zen-enterprise training scope evidence is rebound to it; beta-free access is no longer a documented fact and the applicability of the unpaid-account clause remains an open question. Nemotron 3.5 Super VL Free does not yet appear in this snapshot's exception list (it entered in #690; see the 2026-10-16 record). No verdict field changed (zen-standard / zen-team / zen-enterprise keep training / zdr mark=yes with mode=default and retention basis=none), but Jev is no longer excluded from the zero-retention default, so the direction is recorded as strengthened."
issue = "https://github.com/arcships/zdr-monitor/issues/664"
