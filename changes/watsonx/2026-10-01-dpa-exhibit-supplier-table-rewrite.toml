summary_zh = "两份 Data Sheet（即 DPA Exhibit：Runtime as a Service cdeef54d0de00208、as a Service Multicloud af9a866de3f59d69）第 6、7 节同步改写。§7 标题由「Third-Party Subprocessors」改为「Third-party suppliers」，表头由「| Subprocessor | 'Corporate Headquarters | 'Processing Activities |」改为「| Third-party suppliers | 'Processing Activities |」——表格不再列各家的 Corporate Headquarters，各国信息改由同节指向的 http://www.ibm.com/terms/?id=i127-9379 提供；并新增一句「When the DPA applies, these third-party suppliers are considered Subprocessors and any changes to these Subprocessors are subject to the DPA.」（IBM 关联方那一句同句由「When the DPA is applicable」改为「When the DPA applies」并加逗号）。§6 首句由「Content is Processed at the following locations.」改为「The following table is a list of locations where IBM provides the Cloud Services and where Content may be processed, including the storage location.」；「may be able to limit Processing of Content to a subset of these locations, upon request」保留；IBM 自身访问限定由「accessed or moved by IBM, the access or movement is limited」改为「accessed or otherwise processed by IBM, this is limited」。Runtime 那份另有 §4.4 认证归属措辞改动（「This Cloud Service maintains…」改为「The IBM corporation maintains…」），不属五个维度。处理地清单（Runtime 八地 / Multicloud 五地）与 30 天删除窗口未变，故 processing_region、role 的判定值不变（codes、kind 未动），只把锚点改绑到新正文；retention、training、zdr 未受影响。锚点改绑范围：cdeef 的 ds-runtime-processing-locations-may-limit / ds-runtime-ibm-affiliates-are-subprocessors / ds-runtime-third-party-subprocessors / ds-runtime-cloudflare-subprocessor / ds-runtime-ibm-generally-no-content-access，af9a 的 ds-multicloud-aws-india-subprocessor / ds-multicloud-third-party-subprocessors / ds-multicloud-salesforce-subprocessor / ds-multicloud-slack-subprocessor / ds-multicloud-additional-subprocessor-details-on-request / ds-multicloud-processing-locations-may-limit；两条 may-limit 锚点按 §6 首句 + may-limit 句两句连排绑定。"
summary_en = "Sections 6 and 7 of both Data Sheets (the DPA Exhibits for watsonx.ai Runtime as a Service cdeef54d0de00208 and watsonx.ai as a Service Multicloud af9a866de3f59d69) were rewritten together. In Section 7 the heading changed from 'Third-Party Subprocessors' to 'Third-party suppliers' and the table header from '| Subprocessor | Corporate Headquarters | Processing Activities |' to '| Third-party suppliers | Processing Activities |' — the Corporate Headquarters column was dropped and country information is now pointed to http://www.ibm.com/terms/?id=i127-9379 from the same section; a sentence was added: 'When the DPA applies, these third-party suppliers are considered Subprocessors and any changes to these Subprocessors are subject to the DPA.' (the IBM-affiliates sentence was reworded from 'When the DPA is applicable' to 'When the DPA applies', with a comma added). In Section 6 the lead-in sentence changed from 'Content is Processed at the following locations.' to 'The following table is a list of locations where IBM provides the Cloud Services and where Content may be processed, including the storage location.'; the clause 'may be able to limit Processing of Content to a subset of these locations, upon request' is retained; and the IBM-access limitation changed from 'accessed or moved by IBM, the access or movement is limited' to 'accessed or otherwise processed by IBM, this is limited'. The Runtime Data Sheet also had a Section 4.4 certification-attribution rewording ('This Cloud Service maintains...' to 'The IBM corporation maintains...'), which is not one of the five dimensions. The processing-location lists (8 for Runtime, 5 for Multicloud) and the 30-day deletion window are unchanged, so the processing_region and role verdicts are unchanged (codes and kind untouched); only their anchors were rebound to the new text. retention, training and zdr are unaffected. Anchors rebound: on cdeef, ds-runtime-processing-locations-may-limit, ds-runtime-ibm-affiliates-are-subprocessors, ds-runtime-third-party-subprocessors, ds-runtime-cloudflare-subprocessor, ds-runtime-ibm-generally-no-content-access; on af9a, ds-multicloud-aws-india-subprocessor, ds-multicloud-third-party-subprocessors, ds-multicloud-salesforce-subprocessor, ds-multicloud-slack-subprocessor, ds-multicloud-additional-subprocessor-details-on-request, ds-multicloud-processing-locations-may-limit. Both may-limit anchors now bind the Section 6 lead-in sentence followed by the may-limit sentence."
issue = "https://github.com/arcships/zdr-monitor/issues/423"
