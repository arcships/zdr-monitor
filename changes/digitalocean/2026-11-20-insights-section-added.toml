summary_zh = "2026-11-20 的快照把页首 Last Updated 由 November 6, 2026 改为 November 19, 2026，并在 §10 MicroVMs 之后新增 §11 DigitalOcean Insights（§11.1–§11.7）；除此之外正文没有改动（diff 只有这两处 hunk）。§11 是 DigitalOcean Insights 的服务专用条款：一个可观测性服务，提供 metrics、logs、traces、alerting、dashboards、uptime checks，替代旧的 DigitalOcean Monitoring（§11 引言）。与维度相关的新增原文有三处。① training：§11.3「DigitalOcean processes Telemetry Data solely to provide and maintain Insights for you and will not use Telemetry Data to train, fine-tune, or improve any DigitalOcean model.」；同节允许用 Usage Data「to operate, secure, evaluate, and improve the Services」，但明文「Usage Data does not include the content of your Telemetry Data」。② retention：§11.2「Once enabled, Telemetry Data streams automatically from the resource until you disable Insights.」；§11.6 把 Telemetry Data 在第三方目的地的「security, use, and retention」交给客户负责，未给 DO 侧保留期限。③ role/内容定性：§11.3「Telemetry Data is your Services Content」，§11.4 由客户承担 notice/consent 义务，§11.6 第三方目的地按客户与该第三方的协议处理；本节没有 controller/processor 定性。§11 没有处理地声明，也没有 ZDR 承诺。该节仅适用于 Insights，不改变本文件已有三档（api / agent-platform / gpu-droplets）的推理、Agent 或 GPU 条款；三个档位的结论字段、既有锚点与引文均未变，故未改 providers/digitalocean.toml。Insights 是可观测性服务而非模型推理档位，本台账不为它单列 [[product]]，本轮只记录厂商新增的条款。方向记为 clarified：新服务条款就遥测内容的训练使用、采集停止条件与第三方目的地责任作出澄清，但没有收紧或放宽任何现有档位的承诺。"
summary_en = "The 2026-11-20 snapshot changes the page header from Last Updated on November 6, 2026 to November 19, 2026 and adds a new §11 DigitalOcean Insights after §10 MicroVMs (§11.1–§11.7); no other body text changed (the diff has only these two hunks). §11 sets out service-specific terms for DigitalOcean Insights, an observability Service providing metrics, logs, traces, alerting, dashboards, uptime checks and related features, replacing the legacy DigitalOcean Monitoring product (§11 introduction). Three additions bear on the dimensions. (1) Training: §11.3 provides 'DigitalOcean processes Telemetry Data solely to provide and maintain Insights for you and will not use Telemetry Data to train, fine-tune, or improve any DigitalOcean model.'; the same section allows Usage Data to be used 'to operate, secure, evaluate, and improve the Services' but states 'Usage Data does not include the content of your Telemetry Data.' (2) Retention: §11.2 provides 'Once enabled, Telemetry Data streams automatically from the resource until you disable Insights.'; §11.6 leaves the 'security, use, and retention of Telemetry Data at or by the Third-Party Destination' to the customer and states no DigitalOcean-side retention period. (3) Role/content characterization: §11.3 provides 'Telemetry Data is your Services Content', §11.4 places notice/consent obligations on the customer, and §11.6 makes a Third-Party Destination governed by the customer's agreement with that third party; the section contains no controller/processor characterization. §11 contains no processing-location statement and no ZDR commitment. The section applies only to Insights and does not change the inference, Agent or GPU terms of this file's three existing tiers (api / agent-platform / gpu-droplets); no verdict field, existing anchor or quote changed, so providers/digitalocean.toml carries no conclusion change. Insights is an observability service rather than a model-inference tier, and this ledger has no separate [[product]] for it, so this round records only the vendor's new terms. Direction recorded as clarified: the new service terms clarify the training use of telemetry content, the condition for stopping collection, and responsibility for third-party destinations, but they neither tighten nor loosen any existing commitment of an existing tier."
issue = "https://github.com/arcships/zdr-monitor/issues/1362"
