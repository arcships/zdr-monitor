summary_zh = "AI 数据隐私页(页首 Last verified 由 1 Sep 2026 改为 12 Oct 2026)有两处实质改动。① 页首那句绝对表述「We do not store inputs or outputs on DigitalOcean infrastructure for any models.」被改写为「We do not store model inputs or outputs on DigitalOcean infrastructure, except for conversation data that DigitalOcean Signals collects after you enable it.」——「for any models」消失,并新增一个明文例外:启用 Signals 后其采集的会话内容不在「不存」之列。② 新增整节「DigitalOcean Signals (Public Preview)」:定义 Trace/Session/Signal/End User;经客户同意(或用于 Simulations/Evaluations)后处理 Trace 内容(End User prompts and inputs、tool/database 调用与参数、retrieved content、model responses、intermediate steps)、派生 Signals 与用量数据;「We use Trace content and Signals only to provide Signals to you and support it」,且「We may use anonymized, aggregated Usage Data to improve the Service」;新增反训练承诺「DigitalOcean does not use your Trace content, Signals, inference inputs and outputs, agent inputs, or agent outputs to train, fine-tune, or improve any generalized artificial-intelligence or machine-learning model, including any foundation model offered to other customers」;不做跨客户使用;自动脱敏(明文声明不是保证);客户可在控制台/CLI/API 开关 Signals、关闭即停止继续采集、可通过 Signals data deletion API 申请删除;Trace 内容中的个人数据客户为 Controller、DO 为 Processor;Trace 内容与 Signals「processed and stored in a DigitalOcean United States data center region」且暂不提供区域化存储或数据本地化;保留「in accordance with DigitalOcean’s standard retention practices」;数据最小化设计。五个维度都被这次改动碰到,但 api 档与 Agent 平台档的结论字段均未变(training 仍 yes/default;zdr 仍 yes/default(api)、unknown(平台);retention 分别仍是 混合/30/fixed_period 与 混合/undisclosed;processing_region 分别仍 codes=[selected] 与 [US, CA];role 均仍 processor):本轮只改绑因改写而失效的锚点 do-infra-no-store-inputs-outputs,并为 Signals 新增 6 条锚点及各档带锚点的依据(含 zdr/retention 的 Signals 例外)。方向记为 weakened:那句原本无例外的「不存输入输出」被加了例外,并新出现一条(自选)会话内容存储与保留路径 —— 尽管同一次改版也新增了口径更宽的反训练承诺与开关/删除手段。"
summary_en = "Two substantive changes on the AI data privacy page (page header Last verified moved from 1 Sep 2026 to 12 Oct 2026). (1) The blanket sentence 'We do not store inputs or outputs on DigitalOcean infrastructure for any models.' was rewritten to 'We do not store model inputs or outputs on DigitalOcean infrastructure, except for conversation data that DigitalOcean Signals collects after you enable it.' — 'for any models' is gone and an express exception was added: conversation data collected by Signals after you enable it falls outside the no-store claim. (2) A whole new section, 'DigitalOcean Signals (Public Preview)', was added: it defines Trace/Session/Signal/End User; on customer consent (or for Simulations/Evaluations) it processes Trace content (End User prompts and inputs, tool and database calls and their parameters, retrieved content, model responses, intermediate steps), derived Signals and Usage Data; 'We use Trace content and Signals only to provide Signals to you and support it', and 'We may use anonymized, aggregated Usage Data to improve the Service'; it adds a no-training commitment ('DigitalOcean does not use your Trace content, Signals, inference inputs and outputs, agent inputs, or agent outputs to train, fine-tune, or improve any generalized artificial-intelligence or machine-learning model, including any foundation model offered to other customers'); no cross-customer use; automated redaction (expressly stated not to be a guarantee); customer enable/disable via Control Panel, CLI or API with capture stopping on disable and deletion available through the Signals data deletion API; the customer is the Controller and DigitalOcean the Processor for personal data in Trace content; Trace content and Signals are 'processed and stored in a DigitalOcean United States data center region' with no regional storage or localization offered; retention follows 'DigitalOcean’s standard retention practices'; and a data-minimization design. All five dimensions are touched, but no verdict field changed on either the api tier or the Agent Platform tier (training stays yes/default; zdr stays yes/default on api and unknown on the platform tier; retention stays mixed/30/fixed_period and mixed/undisclosed respectively; processing_region stays codes=[selected] and [US, CA]; role stays processor on both): this round only rebinds the anchor that the rewrite broke (do-infra-no-store-inputs-outputs) and adds six Signals anchors plus anchored points for each dimension (including the Signals exceptions under zdr/retention). Direction recorded as weakened: the previously unqualified no-store sentence gained an exception and a new (opt-in) content-storage and retention path appeared — even though the same revision also added a broader no-training commitment and opt-out/deletion controls."
issue = "https://github.com/arcships/zdr-monitor/issues/616"
