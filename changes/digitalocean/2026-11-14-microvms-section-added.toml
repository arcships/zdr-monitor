summary_zh = "2026-11-14 的快照在 §9 Prompt Caching 之后新增 §10 MicroVMs(上一版快照止于 §9.6;页面首行 Last Updated 仍为 November 6, 2026,仅凭快照无法判定该节实际上线时间)。§10 是 DigitalOcean MicroVMs 的专用条款:CPU-backed、Firecracker 硬件隔离、面向 agentic 及其他突发/隔离敏感负载的轻量虚拟机(§10 引言、§10.6)。与维度相关的新增原文有两处。① retention:§10.1「Checkpoints you create are retained, and continue to incur storage charges, until you delete them, including after the MicroVM they were created from is deleted.」;§10.7(b)「Checkpoints are created only at your request through the Cloud Console, API, or CLI」,且客户仍须自行维护独立备份与导出。② training/access:§10.8「DigitalOcean does not use the content of your workloads, images, checkpoints, or data to train, fine-tune, retrain, or improve any DigitalOcean or third-party machine learning model.」;同节把客户代码、容器镜像、checkpoint 等定为 Services Content 与 Confidential Information,DO 仅在提供服务/安全运维、客户发起的支持请求或法律要求时访问内容,并明确技术/运营 Usage Data(不含内容)可用于运营、安全和改进服务(§10.8)。该节没有 ZDR 承诺、没有处理地声明,也没有 controller/processor 角色表述;§10.3 仅规定 checkpoint 只能在同一 region、同一规格创建新 MicroVM。§10 的适用范围限于 MicroVMs,不改变本文件已有三档(api / agent-platform / gpu-droplets)的推理或 GPU 条款;三个档位的结论字段、既有锚点与引文均未变,故未改 providers/digitalocean.toml 的结论。MicroVMs 是 CPU 计算服务、不是模型推理档位,本台账未为它单列 [[product]],本轮只记录厂商新增的条款。方向记为 clarified:新服务条款明确了内容不用于训练、访问受限、checkpoint 由客户删除并在删除前持续计费,但没有收紧或放宽现有任何档位的既有承诺。"
summary_en = "The 2026-11-14 snapshot adds a new §10 MicroVMs after §9 Prompt Caching (the previous snapshot ended at §9.6; the page header still reads Last Updated on November 6, 2026, so the snapshot alone does not establish when the section went live). §10 sets out service-specific terms for DigitalOcean MicroVMs: lightweight CPU-backed, Firecracker-based, hardware-isolated virtual machines for agentic and other bursty, isolation-sensitive workloads (§10 introduction and §10.6). Two additions bear on the dimensions. (1) Retention: §10.1 provides 'Checkpoints you create are retained, and continue to incur storage charges, until you delete them, including after the MicroVM they were created from is deleted.'; §10.7(b) provides 'Checkpoints are created only at your request through the Cloud Console, API, or CLI' and leaves the customer responsible for independent backups and exports. (2) Training/access: §10.8 provides 'DigitalOcean does not use the content of your workloads, images, checkpoints, or data to train, fine-tune, retrain, or improve any DigitalOcean or third-party machine learning model.'; the same section makes the customer's code, container images, checkpoints and other data Services Content and Confidential Information, limits DigitalOcean's access to what is necessary to provide, secure and operate the Service, to respond to a customer-initiated support request, or as required by law, and states that technical and operational Usage Data (which excludes content) may be used to operate, secure and improve the Service (§10.8). The section contains no ZDR commitment, no processing-location statement and no controller/processor role statement; §10.3 only provides that a checkpoint can create a new MicroVM in the same region and at the same size. Section 10 applies only to MicroVMs and does not change the inference or GPU terms of this file's three existing tiers (api / agent-platform / gpu-droplets); no verdict field, existing anchor or quote changed, so providers/digitalocean.toml carries no conclusion change. MicroVMs is a CPU compute service rather than a model-inference tier, and this ledger has no separate [[product]] for it, so this round records only the vendor's new terms. Direction recorded as clarified: the new service terms state that content is not used for training, limit access, and leave checkpoints to customer deletion with continuing storage charges, but they neither tighten nor loosen any existing commitment of an existing tier."
issue = "https://github.com/arcships/zdr-monitor/issues/1234"
