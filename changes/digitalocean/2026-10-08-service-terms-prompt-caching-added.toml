summary_zh = "服务专用条款(Service Terms)在 §8 Managed Databases 之后新增 §9「Prompt Caching」。§9.1 规定缓存条目由 Services Content 派生、按 Services Content 处理,「We process cache entries solely to provide the Services to you and do not use them to train, fine-tune, or improve any DigitalOcean model」,缓存元数据属 Usage Data;§9.3 规定缓存条目短暂、保留窗口见 Documentation、非存储/备份功能、不保证任何条目存续;§9.4 为 per-account 隔离与客户自控;§9.5 可关闭并请求 flush;§9.6 可在 DO 选择的 infra/存储层路由与存储,与第三方模型同用时缓存与保留另受上游条款约束。§9.2 为定价条款:其收尾句「We do not guarantee any cache hit rate, retention outcome, or level of savings」与 §9.3 的「We do not guarantee that any cache entry will persist…」是同一不保证口径,故未单独锚定。api 档五维结论字段未变(training=yes、zdr=yes、retention 仍是拼出的档位期限、processing_region 仍为 codes=[selected]),故未改任何结论;本轮为 training/retention/processing_region 各补一条带锚点的合同层依据(do-st-prompt-cache-no-training、do-st-prompt-cache-ephemeral、do-st-prompt-cache-routing),并把 training 首条 point 中「合同层只有 §7.2.2 一条窄口径承诺」的表述改为并列 §9.1。§9 是 Prompt Caching 功能的 Service Term、无产品排除条款,本文件已把该平台档的缓存例外记在共用推理路径上,故本轮也把 §9.1/§9.3 应用到 Agent 平台档:把该档「知识库/agent 侧无合同层不训练条款」改为 §9.1 的窄口径承诺(仅限 prompt-cache 条目、不覆盖知识库/会话内容),给 retention 补一条 §9.3 缓存条目,并更新 zdr 的范围说明;该档五维结论字段同样未变(training 仍 mark=yes、zdr 仍 unknown、retention 仍 basis=undisclosed)。方向记为 clarified。"
summary_en = "The Service Terms gained a new §9 'Prompt Caching' after §8 Managed Databases. §9.1 provides that cache entries are derived from Services Content and treated as Services Content, that 'We process cache entries solely to provide the Services to you and do not use them to train, fine-tune, or improve any DigitalOcean model', and that cache metadata is Usage Data; §9.3 states that cache entries are ephemeral with retention windows described in the Documentation, that Prompt Caching is not a storage or backup feature, and that no cache entry is guaranteed to persist; §9.4 covers per-account isolation and customer controls; §9.5 allows opt-out and a cache flush; §9.6 permits routing and storage on infrastructure and storage tiers DigitalOcean selects, with third-party-model caching subject to the upstream provider's terms. §9.2 is a pricing clause: its closing sentence 'We do not guarantee any cache hit rate, retention outcome, or level of savings' is the same disclaimer as §9.3's 'We do not guarantee that any cache entry will persist...', so it is not anchored separately. No verdict field changed on the api tier (training=yes, zdr=yes, retention remains the composite tier period, processing_region remains codes=[selected]), so no conclusion was changed; this round adds one anchored contract-layer point each to training/retention/processing_region (do-st-prompt-cache-no-training, do-st-prompt-cache-ephemeral, do-st-prompt-cache-routing) and updates the first training point's statement that the only narrow contract clause is §7.2.2 to list §9.1 alongside it. §9 is a Service Term for the Prompt Caching feature with no product carve-out, and this file already records the platform tier's cache exception against the shared inference path, so §9.1/§9.3 are also applied to the Agent Platform tier this round: its statement that there is no contract-layer no-training clause on the knowledge base or agent side becomes §9.1's narrow clause (prompt-cache entries only, not knowledge base or session content), a §9.3 cache point is added to its retention dimension, and its zdr scope note is updated; that tier's verdict fields are likewise unchanged (training stays mark=yes, zdr stays unknown, retention stays basis=undisclosed). Direction recorded as clarified."
