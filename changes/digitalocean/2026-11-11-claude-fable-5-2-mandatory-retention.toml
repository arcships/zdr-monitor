summary_zh = "AI 数据隐私页(页首 Last verified 由 12 Oct 2026 改为 10 Nov 2026)有一处实质改动,其余正文与上一版相同。Third-Party Models 段中,适用强制保留的那句由「For Claude Fable 5.1 and Claude Fable 5, access requires a mandatory 30-day data retention of prompts and completions for trust and safety reviews」改为「For Claude Fable 5, 5.1, and 5.2, access requires a mandatory 30-day data retention...」——强制 30 天保留的模型范围新增 Claude Fable 5.2(句子主体「access requires a mandatory 30-day data retention of prompts and completions for trust and safety reviews」未变)。因此 api 档 zdr 的 Claude Fable 例外与 retention 的第 (5) 项、以及档位级「30 天」拼出说明中的模型列表都补上 5.2;结论字段未变(zdr 仍 yes/default,retention 仍混合/30/fixed_period),锚点 do-fable-mandatory-30d 的 prefix 按新措辞同步(该句 exact 在快照中仍唯一定位)。方向记为 weakened:更多模型被纳入不可关闭的强制保留。"
summary_en = "One substantive change on the AI data privacy page (page header Last verified moved from 12 Oct 2026 to 10 Nov 2026); the rest of the body is unchanged. In the Third-Party Models section the sentence imposing mandatory retention changed from 'For Claude Fable 5.1 and Claude Fable 5, access requires a mandatory 30-day data retention of prompts and completions for trust and safety reviews' to 'For Claude Fable 5, 5.1, and 5.2, access requires a mandatory 30-day data retention...' — Claude Fable 5.2 is added to the set of models subject to the mandatory 30-day retention (the operative clause 'access requires a mandatory 30-day data retention of prompts and completions for trust and safety reviews' is unchanged). The model list is therefore extended to 5.2 in the api tier's zdr Claude Fable exception, in retention point (5), and in the tier-level composite '30 days' description; no verdict field changed (zdr remains yes/default, retention remains mixed/30/fixed_period). The do-fable-mandatory-30d anchor prefix is updated to the new wording (its exact quote still locates uniquely in the snapshot). Direction recorded as weakened: more models fall under a mandatory retention the customer cannot switch off."
issue = "https://github.com/arcships/zdr-monitor/issues/1181"
