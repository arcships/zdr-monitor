summary_zh = "prompt caching how-to 页(Serverless Inference)重写。① 「Caches are isolated per customer account.」改为「Caches are always isolated per customer account.」;② 原「Open-Source Models (public)」段改名为「DigitalOcean-Hosted Models」,原 Note「Prompt caches are held for an unbounded period of time.」被「### Cache Retention and Eviction」下的「Cached entries have no configured expiry time. They are evicted on a least-recently-used basis as capacity is needed」取代,并新增「The cache stores the model's internal state, known as the key-value (KV) cache, for a matched prefix. It does not store your prompt text.」与「prompt_cache_retention is not supported for DigitalOcean-hosted models」。缓存例外并非统一有界的判断实质未变(DO 托管模型自动缓存、条目无配置的到期时间且无法退出),故无任何结论字段变化;仅改绑两条定位失效的锚点(do-cache-isolated-per-account、do-prompt-cache-unbounded),并同步更新 api 档 zdr 依据与 Agent 平台档 zdr 范围说明中的缓存描述。方向记为 clarified。"
summary_en = "The Serverless Inference prompt-caching how-to page was rewritten. (1) 'Caches are isolated per customer account.' became 'Caches are always isolated per customer account.'; (2) the 'Open-Source Models (public)' section was renamed 'DigitalOcean-Hosted Models', and its note 'Prompt caches are held for an unbounded period of time.' was replaced under '### Cache Retention and Eviction' by 'Cached entries have no configured expiry time. They are evicted on a least-recently-used basis as capacity is needed', together with new statements that 'The cache stores the model's internal state, known as the key-value (KV) cache, for a matched prefix. It does not store your prompt text.' and 'prompt_cache_retention is not supported for DigitalOcean-hosted models'. The reading that the cache exception is not uniformly bounded is unchanged in substance (DigitalOcean-hosted models cache automatically, entries have no configured expiry time, and the cache cannot be opted out for them), so no verdict field changed; only the two anchors that no longer located were rebound (do-cache-isolated-per-account, do-prompt-cache-unbounded), with the cache descriptions in the api-tier zdr point and the agent-platform zdr scope note updated to the new wording. Direction recorded as clarified."
issue = "https://github.com/arcships/zdr-monitor/issues/546"
