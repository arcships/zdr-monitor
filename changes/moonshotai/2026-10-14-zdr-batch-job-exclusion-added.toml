summary_zh = "platform.kimi.ai 的《What is Zero Data Retention (ZDR)?》在 2026-10-14 快照中首次观察到 FAQ「Does ZDR apply to all data types?」的答句被改写：旧正文为「ZDR cannot be guaranteed for images or videos submitted through direct file uploads. Operational data, such as security logs and billing records, is outside the scope of zero data retention. Third-party models, connectors, and plugins are not covered by this policy.」，新正文改为「No. Please note the following exceptions:」加编号列表，并新增第 1 项「Batch Job service: The Batch API does not support ZDR for batch jobs.」，即 Batch API 提交的批处理任务明确不在 ZDR 覆盖范围内。其余三项是旧句的拆条改写：图片/视频一条由「through direct file uploads」改为「directly through the File Upload API」，第三方一条由「Third-party models, connectors, and plugins are not covered by this policy」改为「Data processed by third-party models, connectors, or plugins is not covered by this ZDR policy」，运营数据一句逐字未变。ZDR 主承诺（开通后请求内容在生成响应期间处理、响应返回即删除）与训练条款（企业客户数据默认不用于训练模型）均未改动。api 档 zdr 结论字段不变（mark=yes、mode=by_agreement），但排除清单由三项增至四项。"
summary_en = "On platform.kimi.ai's 'What is Zero Data Retention (ZDR)?', the 2026-10-14 snapshot first shows the FAQ answer to 'Does ZDR apply to all data types?' rewritten. The previous text was 'ZDR cannot be guaranteed for images or videos submitted through direct file uploads. Operational data, such as security logs and billing records, is outside the scope of zero data retention. Third-party models, connectors, and plugins are not covered by this policy.'; it is now 'No. Please note the following exceptions:' followed by a numbered list, with a new first item: 'Batch Job service: The Batch API does not support ZDR for batch jobs.' Batch jobs submitted through the Batch API are therefore explicitly outside ZDR coverage. The other three items are split-out restatements of the old sentence: the images/videos item changed from 'through direct file uploads' to 'directly through the File Upload API', and the third-party item from 'Third-party models, connectors, and plugins are not covered by this policy' to 'Data processed by third-party models, connectors, or plugins is not covered by this ZDR policy'; the operational-data sentence is word-for-word unchanged. The main ZDR commitment (request content is processed while the response is generated and deleted once the response is returned) and the training clause (enterprise customer data is not used to train models by default) are untouched. The api tier's zdr verdict fields are unchanged (mark=yes, mode=by_agreement), but the exclusion list grows from three items to four."
issue = "https://github.com/arcships/zdr-monitor/issues/660"
