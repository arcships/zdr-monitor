summary_zh = "《Prompt Caching》页（https://platform.minimax.io/docs/api-reference/text-prompt-caching）的 Important Notes 把 prefix 构造顺序由『tool list → system prompts → user messages』改为『system prompts → tool list → user messages』，Best Practices 中括号内的并列顺序同步调整；Supported models 由 MiniMax-M3.1-Flash、MiniMax-M3、MiniMax-M2.7 series、MiniMax-M2.5 series、MiniMax-M2.1 series 收窄为 MiniMax-M3.1-Flash、MiniMax-M3。其余改动不涉及五维：OpenAI 示例删除两处 reasoning_split 与一个 First Request 标题，计价公式补上 ÷1,000,000 与一个算例。retention 的结论字段（object=input_output、basis=as_needed）与 zdr 的 unknown 均未变；缓存仍默认开启、仍覆盖 system prompts / tool list / user messages，故只把前缀顺序句的锚点 exact 及两条对象级 point 的描述改绑到新正文。方向记为 clarified：厂商纠正了缓存前缀的构造顺序，对数据处理的承诺范围未变。"
summary_en = "On https://platform.minimax.io/docs/api-reference/text-prompt-caching the Important Notes prefix order changed from 'tool list → system prompts → user messages' to 'system prompts → tool list → user messages', and the parenthetical order in Best Practices was updated to match. The Supported models list narrowed from MiniMax-M3.1-Flash, MiniMax-M3 and the M2.7/M2.5/M2.1 series to MiniMax-M3.1-Flash and MiniMax-M3. The remaining edits are unrelated to the five dimensions: the OpenAI example dropped two reasoning_split lines and one First Request heading, and the pricing formula gained the ÷1,000,000 divisor plus a worked example. The retention fields (object=input_output, basis=as_needed) and the zdr unknown verdict are unchanged; caching remains automatic and still covers system prompts, tool list and user messages, so only the prefix-order anchor exact and the two object-level points were rebound to the new text. Direction recorded as clarified: the vendor corrected the cache-prefix construction order without changing the scope of its data-handling commitments."
issue = "https://github.com/arcships/zdr-monitor/issues/1163"
