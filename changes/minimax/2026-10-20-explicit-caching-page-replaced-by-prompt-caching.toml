summary_zh = "《Explicit Prompt Caching (Anthropic API)》页（https://platform.minimax.io/docs/api-reference/anthropic-api-compatible-cache）被替换为通用《Prompt Caching》页：原页开头『MiniMax supports Anthropic API compatible caching that is managed through explicit cache_control settings.』、显式缓存期限『Cached content has a **lifetime of 5 minutes**. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.』以及 What Can Be Cached 清单（含『**Text messages**: Content blocks in the `messages.content` array, for both user and assistant turns』与 tools / system 内容块）全部删除；新正文只剩 Automatic Caching、512 token 阈值和 prefix 顺序，并称『Caching applies to API calls with 512 or more input tokens』。retention 的结论字段（object=input_output、basis=as_needed）与 zdr 的 unknown 来自隐私政策与全站检索，未变；但缓存条目的对象级期限证据失效，故删除显式缓存 5 分钟那条 point 与 anchor；缓存对象范围（tools / system / messages）在旧页删除，provider 中的覆盖范围说明改绑到新页仍在的 prefix 顺序句。方向记为 weakened（披露的缓存期限与可缓存对象范围减少）。"
summary_en = "The page at https://platform.minimax.io/docs/api-reference/anthropic-api-compatible-cache, formerly 'Explicit Prompt Caching (Anthropic API)', was replaced by the generic 'Prompt Caching' page. The old opener 'MiniMax supports Anthropic API compatible caching that is managed through explicit cache_control settings.', the explicit-cache lifetime 'Cached content has a **lifetime of 5 minutes**. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.' and the entire 'What Can Be Cached' list (including '**Text messages**: Content blocks in the `messages.content` array, for both user and assistant turns' plus tools and system blocks) were removed. The new text only has Automatic Caching, the 512-token threshold ('Caching applies to API calls with 512 or more input tokens') and prefix ordering. The retention fields (object=input_output, basis=as_needed) and zdr unknown verdict come from the privacy policy and site-wide search and are unchanged; the object-level cache-lifetime evidence is gone, so the explicit-cache 5-minute point and anchor were deleted; the cached-content scope (tools / system / messages) was removed from the old page, so the provider's coverage statement was rebound to the prefix-order sentence remaining on the new page. Direction recorded as weakened (less disclosed cache lifetime and scope)."
issue = "https://github.com/arcships/zdr-monitor/issues/730"
