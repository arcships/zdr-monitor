summary_zh = "《Prompt Caching》页（https://platform.minimax.io/docs/api-reference/text-prompt-caching）的 Features 由『Passive caching that automatically identifies repeated context content without changing API call methods』改为『Automatically identifies repeated context content without changing API call methods』；页尾原来的 Passive/Explicit 对比表整段删除，其中含被动缓存『Expiration time automatically adjusted based on system load』与显式缓存『5-minute expiration, automatically renewed with continued use』两行，以及 Further Reading 入口。仍在的只有『Caching applies to API calls with 512 or more input tokens』与 prefix 顺序句。retention 的结论字段（object=input_output、basis=as_needed）与 zdr 的 unknown 均未变；因被动缓存的期限表述消失，删除『默认被动缓存无固定期限』这条对象级 point 及对应 anchor，把「自动缓存无需改动调用方式」与缓存覆盖范围改绑到新正文仍在的句子；显式缓存 5 分钟期限证据的删除见同日的 explicit-caching-page-replaced 记录。方向记为 weakened（缓存期限披露减少）。"
summary_en = "On https://platform.minimax.io/docs/api-reference/text-prompt-caching the Features bullet changed from 'Passive caching that automatically identifies repeated context content without changing API call methods' to 'Automatically identifies repeated context content without changing API call methods'. The former Passive/Explicit comparison table was removed wholesale, including the passive-cache row 'Expiration time automatically adjusted based on system load' and the explicit-cache row '5-minute expiration, automatically renewed with continued use', together with the Further Reading link. What remains is 'Caching applies to API calls with 512 or more input tokens' and the prefix-order sentence. The retention fields (object=input_output, basis=as_needed) and zdr unknown verdict are unchanged; because the passive-cache expiration statement disappeared, the object-level point and anchor for 'no fixed period' were deleted, and the automatic-cache/no-API-change and cache-coverage statements were rebound to sentences still present in the new text; removal of the explicit-cache 5-minute evidence is covered by the same-day explicit-caching-page-replaced record. Direction recorded as weakened (less disclosure of cache lifetime)."
issue = "https://github.com/arcships/zdr-monitor/issues/730"
