summary_zh = "platform.kimi.ai ZDR 文档 FAQ「Does ZDR apply to all data types?」由一段散文改为四项例外清单：新增「The Batch API does not support ZDR for batch jobs.」；图片/视频一句改为「ZDR cannot be guaranteed for images or videos submitted directly through the File Upload API.」；第三方一句改为「Data processed by third-party models, connectors, or plugins is not covered by this ZDR policy.」；运营数据一句文字未变。ZDR 本体的零保留承诺（请求内容仅在生成响应期间处理、返回即删，法律要求除外）未变，但例外范围新增 Batch Job，故方向记为 weakened。该页仍只面向开放平台企业客户，本 provider 的 api 档 zdr 仍为 yes / by_agreement，Kimi Code 订阅档不受影响，结论字段均未改。"
summary_en = "On the platform.kimi.ai ZDR page, the FAQ answer 'Does ZDR apply to all data types?' was changed from one prose sentence into a four-item exception list: a new item states 'The Batch API does not support ZDR for batch jobs.'; the images/videos item now reads 'ZDR cannot be guaranteed for images or videos submitted directly through the File Upload API.'; the third-party item now reads 'Data processed by third-party models, connectors, or plugins is not covered by this ZDR policy.'; the operational-data item is textually unchanged. The core zero-retention promise itself (request content processed only during generation and deleted on return, except where required by law) is unchanged, but the addition of the Batch Job exception narrows the scope, so the direction is recorded as weakened. The page still applies only to Open Platform enterprise customers; this provider's api tier remains zdr yes / by_agreement and the Kimi Code subscription tier is unaffected. No verdict fields changed."
issue = "https://github.com/arcships/zdr-monitor/issues/659"
