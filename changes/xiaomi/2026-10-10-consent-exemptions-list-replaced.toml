summary_zh = "《Xiaomi MiMo 隐私政策》（privacy.mi.com/XiaomiMiMoPlatform/zh_CN/）改版：页首生效日期由 2026-06-25 改为 2026-10-10，原「版本号：v20260806」行移除。实质条款改动是 §一（三）「我们收集、使用个人信息无需征得您的同意」的法定情形清单——原 10 项（含第 8 项「用于维护所提供的产品与/或服务的安全稳定运行所必需的，例如发现、处置产品与/或服务的故障；」）整体替换为按《个人信息保护法》第 13 条口径书写的 6 项。被删的第 8 项是本文件 training 维度一条语境引文（锚点 mimo-cn-pp-consent-exemptions）的原文；新清单里没有等价句可改绑，故删除该语境点与锚点。该引文本就声明「不改变本档判定」，训练结论仍由未改动的「未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途。」支撑，training 结论字段不变；api-cn 的 zdr / retention / processing_region / role 结论与引文均未受影响。"
summary_en = "The Xiaomi MiMo Privacy Policy (privacy.mi.com/XiaomiMiMoPlatform/zh_CN/) was revised: the header effective date changed from 2026-06-25 to 2026-10-10 and the former '版本号：v20260806' line was dropped. The substantive clause change is the section 1(3) list of statutory situations in which collecting or using personal information needs no consent: the previous ten items (including item 8, '用于维护所提供的产品与/或服务的安全稳定运行所必需的，例如发现、处置产品与/或服务的故障；') were replaced wholesale by six items written to the PIPL Article 13 standard. The deleted item 8 was the source sentence of this file's training-dimension context anchor (mimo-cn-pp-consent-exemptions); the new list has no equivalent sentence to rebind to, so that context point and its anchor were removed. The anchor was context only and never changed the verdict; the training verdict still rests on the unchanged sentence '未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途。', so the training verdict field is unchanged. The zdr / retention / processing_region / role verdicts and anchors of api-cn are unaffected."
issue = "https://github.com/arcships/zdr-monitor/issues/605"
