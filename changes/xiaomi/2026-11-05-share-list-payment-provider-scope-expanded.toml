summary_zh = "《Xiaomi MiMo 第三方数据共享说明》（privacy.mi.com/XiaomiMiMoPlatform-s/zh_CN/，境内档）在 2026-11-05 抓取中改动两处。其一，页首「版本号：v20260420」一行被删除，当前正文不再包含版本号。其二，捷付睿通（内蒙古）支付股份有限公司条目扩写：共享目的由「判断用户的实名认证状态及进行身份认证」改为「核验用户实名认证状态、完成身份核验及充值支付相关流程」，共享数据类型由「姓名、身份证号、小米账号」改为「姓名、居民身份证号码、小米账号、充值相关信息（订单编号、交易金额、支付方式）」；共享方式仍为「接口传输」。同一文件中的上海小宿科技有限公司条目（联网搜索，共享「基于用户输入内容生成的关键词」）逐字未变。该改动的对象是实名认证与充值支付环节的账号/支付数据，不涉及 API 提交的文本、图片、视频、音频内容；共享清单仍只有这两个接收方，未出现大模型推理上游或模型原厂，小米在服务协议中的受托处理定性也未变。因此 api-cn / api-intl 两档的 role 结论字段（kind=processor）不变，training、retention、zdr、processing_region 也均不变。披露的共享数据类别增加，故方向记为 weakened。"
summary_en = "On 2026-11-05 the Xiaomi MiMo Third-Party Data Sharing Statement (privacy.mi.com/XiaomiMiMoPlatform-s/zh_CN/, domestic tier) showed two edits. First, the header line '版本号：v20260420' was removed and the current text no longer carries a version number. Second, the JieFuRuitong (Inner Mongolia) Payment Co., Ltd. entry was expanded: its sharing purpose changed from '判断用户的实名认证状态及进行身份认证' (determining the user's real-name verification status and performing identity verification) to '核验用户实名认证状态、完成身份核验及充值支付相关流程' (verifying real-name status and completing identity verification and recharge/payment flows), and its shared data types changed from '姓名、身份证号、小米账号' (name, ID number, Xiaomi account) to '姓名、居民身份证号码、小米账号、充值相关信息（订单编号、交易金额、支付方式）' (name, resident ID number, Xiaomi account, recharge information: order number, transaction amount, payment method); the sharing method remains interface transfer. The Shanghai Xiaosu entry (web search; shares keywords generated from user input) is unchanged word for word. The edit concerns account and payment data in the real-name and recharge flows, not API-submitted text, image, video or audio content; the list still has only these two recipients, still names no model-inference upstream or model vendor, and does not change Xiaomi's entrusted-processor characterization in the service agreement. The role verdict field (kind=processor) is therefore unchanged for both api-cn and api-intl, as are training, retention, zdr and processing_region. Because the disclosed categories of shared data increased, the direction is recorded as weakened."
issue = "https://github.com/arcships/zdr-monitor/issues/1063"
