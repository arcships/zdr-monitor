summary_zh = "《Xiaomi MiMo 隐私政策》（privacy.mi.com/XiaomiMiMoPlatform/zh_CN/，页首仍为 2026 年 10 月 10 日发布生效）§一（一）2「API服务」新增一句面向用户的输入合规提示：「请您谨慎在输入内容中输入个人信息，尤其谨慎输入敏感个人信息。确需使用的，请先行脱敏处理，并取得信息主体必要同意。」同一次抓取里该段被拆成两段：前句止于「生成返回的内容。」，IP 信息句与训练承诺句移到下一段；训练承诺句「未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途。」逐字未变。新增句只规定用户对输入中个人信息的脱敏与取得数据主体同意的义务，把取得同意的责任明确放在用户一侧，与现有 role 判定（用户为个人信息处理者、小米为受托人）同向，没有改变小米自身的训练、保留、ZDR、处理地或受托/控制方表述。api-cn 的 role 结论字段不变（kind=processor），training、retention、zdr、processing_region 也均不变。"
summary_en = "The Xiaomi MiMo Privacy Policy (privacy.mi.com/XiaomiMiMoPlatform/zh_CN/, header still says effective 2026-10-10) adds a user-facing input-compliance sentence to section 1(1)2 'API service': '请您谨慎在输入内容中输入个人信息，尤其谨慎输入敏感个人信息。确需使用的，请先行脱敏处理，并取得信息主体必要同意。' (Please be careful about entering personal information in your input, especially sensitive personal information; where necessary, de-identify it first and obtain the necessary consent of the data subject.) In the same capture the paragraph was split in two: the first sentence now ends at '生成返回的内容。', and the IP-information sentence plus the training promise moved to the next paragraph; the training promise '未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途。' is unchanged word for word. The new sentence only imposes on the user a duty to de-identify personal information in inputs and to obtain data-subject consent, placing the controller-side consent duty clearly on the user, which is consistent with the existing role verdict (the user is the personal-information processor/controller and Xiaomi is the entrusted processor); it does not change any Xiaomi statement about training, retention, ZDR, processing location, or processor/controller status. The api-cn role verdict fields are unchanged (kind=processor), as are training, retention, zdr and processing_region."
issue = "https://github.com/arcships/zdr-monitor/issues/679"
