summary_zh = "定价页 FAQ「Where are models hosted?」的地域句改写：旧句「Ollama hosts models and compute resources primarily in the United States. To serve global demand, we may route to Europe and Singapore for additional capacity.」改为「Ollama hosts models and compute resources primarily in the United States. To serve global demand, we may route to Europe for additional capacity.」——声明的按容量路由地域由「欧洲和新加坡」缩为「仅欧洲」，新加坡从处理地声明中移除。四个档（cloud、cloud-free、cloud-team、cloud-enterprise）processing_region 的 codes 由 [US, EU, SG] 改为 [US, EU]，锚点 ollama-cloud-region 改绑到新句（旧句含 and Singapore，已找不到）；其余维度与结论字段均未动。该句性质仍是按需容量的路由、非数据驻留承诺，且不能据此断言 Ollama 已停止在新加坡处理——只是声明覆盖的地域收窄、书面处理足迹变小，方向记为 strengthened。同轮 diff 中模型定价表的增删（新增 mistral-large-4，移除 deepseek-v4-flash、deepseek-v4-flash (Off-Peak)、glm-5.1、qwen3.5:397b）属定价目录变动，与五个维度无关，未记录。"
summary_en = "The pricing FAQ's 'Where are models hosted?' sentence was rewritten: its old text 'Ollama hosts models and compute resources primarily in the United States. To serve global demand, we may route to Europe and Singapore for additional capacity.' became 'Ollama hosts models and compute resources primarily in the United States. To serve global demand, we may route to Europe for additional capacity.' — the declared capacity-routing regions narrowed from Europe and Singapore to Europe only, dropping Singapore from the processing-location disclosure. For all four tiers (cloud, cloud-free, cloud-team, cloud-enterprise) the processing_region codes changed from [US, EU, SG] to [US, EU], and the ollama-cloud-region anchor was rebound to the new sentence (the old sentence containing 'and Singapore' no longer locates); no other dimension or verdict field changed. The statement remains capacity routing, not a residency commitment, and it does not establish that Ollama has stopped processing in Singapore — only the declared geographic scope narrowed, shrinking the written processing footprint, so the direction is recorded as strengthened. The model-pricing table edits in the same diff (mistral-large-4 added; deepseek-v4-flash, deepseek-v4-flash (Off-Peak), glm-5.1 and qwen3.5:397b removed) are a pricing-catalog change unrelated to the five dimensions and were not recorded."
