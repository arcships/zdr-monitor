summary_zh = "Agent Platform 滥用监控页（页脚 Last updated 由 2026-09-22 改为 2026-10-02）删去了标准滥用监控的客户退出途径：Prompt logging 条目末尾的「Customers also have the option to request an opt-out from abuse logging (see below).」被删，「Customer opt-out: Customers may request for an exception by filling out this form. If approved, Google won't store any prompts associated with the approved Google Cloud account.」整条被删——本行此前据以写「获批后 Google 不再为获批账户存储任何 prompt」的原句已不存在。90 天上限、仅 GCP ToS 客户在范围内、持 Google Cloud Master Agreement 的客户默认豁免、Advanced AI 30 天记录与 Anthropic 段落均未变。zero-data-retention 页仍写「If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring」，所以 api 档（Claude 常规模型）retention 仍为 days=90 / object=logs / basis=fixed_period、zdr 仍为 mark=yes / mode=by_agreement；退出相关的依据条目改绑到该句并改写为现状。Covered Models 行不受影响。"
summary_en = "The Agent Platform abuse-monitoring page (footer Last updated changed from 2026-09-22 to 2026-10-02) removed the customer opt-out from standard abuse monitoring: the sentence 'Customers also have the option to request an opt-out from abuse logging (see below).' at the end of the Prompt logging bullet was deleted, and the whole 'Customer opt-out: Customers may request for an exception by filling out this form. If approved, Google won't store any prompts associated with the approved Google Cloud account.' bullet was deleted, so the sentence this row cited for 'once approved, Google stores no prompts for the account' no longer exists. The 90-day upper bound, the scope limited to customers under the GCP Terms of Service, the default exemption for Google Cloud Master Agreement customers, the 30-day Advanced AI logging and the Anthropic section are unchanged. The zero-data-retention page still says 'If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring', so the api tier (regular Claude models) keeps retention days=90 / object=logs / basis=fixed_period and zdr mark=yes / mode=by_agreement; the opt-out point was rebound to that sentence and rewritten to the current state. The Covered Models row is unaffected."
issue = "https://github.com/arcships/zdr-monitor/issues/472"
