summary_zh = "Agent Platform zero-data-retention 页（页脚 Last updated 由 2026-10-13 改为 2026-10-20）删去了滥用监控条目末尾的「If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring. See Abuse monitoring.」。这是该页此前唯一说明客户可申请豁免的句子；滥用监控页（当前 2026-10-13 版，其 2026-10-02 版已删去标准 prompt 日志的 Customer opt-out 内容）仍无客户申请路径。现行两页均不再说明豁免申请途径、申请表或获批后的保证；唯一仍写明的路径是滥用监控页的 Google Cloud Master Agreement 默认豁免。标准 90 天 prompt 日志上限、仅受 GCP ToS 管辖客户在范围内、持 Google Cloud Master Agreement 客户默认豁免、Advanced AI 30 天记录与 Anthropic 30 天段落均未变。api 档 retention 仍为 days=90 / object=logs / basis=fixed_period；zdr 仍为 mark=yes，mode 由 by_agreement 改为 opt_in——2026-10-20 版删去申请句后，「需向厂商申请」不再有官方依据，该页仍把 ZDR 写成客户须逐项执行的动作（关闭 request-response logging、Interactions API store=false、不用 Sandbox），并对持 Google Cloud Master Agreement 的客户由滥用监控页默认豁免 prompt 记录。相关 point 改绑到仍存在的适用范围句和 Master Agreement 豁免句。Covered Models 行不受影响。"
summary_en = "The Agent Platform zero-data-retention page (footer Last updated changed from 2026-10-13 to 2026-10-20) removed the sentence at the end of the abuse-monitoring bullet: 'If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring. See Abuse monitoring.' That was the last sentence on the page stating that customers can request an exception. The abuse-monitoring page (current 2026-10-13 revision; its 2026-10-02 revision had already removed the customer opt-out content for standard prompt logging) still has no customer application route. Neither current page now states an exception-application route, a request form, or what approval guarantees; the only remaining documented path is the abuse-monitoring page's default exemption for customers with a Google Cloud Master Agreement. The 90-day upper bound on standard prompt logs, the scope limited to customers under the GCP Terms of Service, the Master Agreement exemption, the 30-day Advanced AI logging and the Anthropic 30-day section are unchanged. The api tier keeps retention at days=90 / object=logs / basis=fixed_period; zdr keeps mark=yes but its mode changes from by_agreement to opt_in because, after the application sentence was removed, 'on request' has no official basis. The page still frames ZDR as a set of actions the customer must take (leave request-response logging off, set Interactions API store=false, do not use the Sandbox API), and customers with a Google Cloud Master Agreement are exempt from the prompt log by default. The affected points were rebound to the surviving scope sentence and the Master Agreement exemption sentence. The Covered Models row is unaffected."
issue = "https://github.com/arcships/zdr-monitor/issues/758"
