summary_zh = "zero-data-retention 页（页脚 Last updated 由 2026-10-13 改为 2026-10-20）删去了 Prompt logging for abuse monitoring for Google models 条目末尾的「If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring. See Abuse monitoring.」整句。该条目现在保留描述句（Google 可能为滥用监控记录 prompt）与范围句「Only customers whose use of Google Cloud is governed by the Google Cloud Platform Terms of Service are subject to prompt logging for abuse monitoring.」，对在范围内的客户不再给出任何动作。滥用监控页（当前快照页脚 Last updated 2026-10-13）仍写标准 prompt 日志最长 90 天，未列出标准 prompt 日志的客户退出条目、申请表或获批后的保证。因此 api 档（Claude 常规模型）的 zdr 由 mark=yes / mode=by_agreement 改为 mark=unknown，searched 列出这两页：原 yes 只对持 Google Cloud Master Agreement 的客户成立（滥用监控页写明其默认豁免 prompt 记录），受 GCP ToS 约束的客户仍受 prompt 记录约束，而这两页未描述其豁免途径。retention 的 days=90 / object=logs / basis=fixed_period 未变——期限与对象未动，变的是退出途径的表述。本页其余条目（Advanced AI、Grounding、request-response logging、Interactions API、Agent products、caching）未变；Covered Models 行不受影响。"
summary_en = "The zero-data-retention page (footer Last updated changed from 2026-10-13 to 2026-10-20) removed the whole sentence at the end of the Prompt logging for abuse monitoring for Google models bullet: 'If you are in scope for prompt logging for abuse monitoring and want zero data retention, you can request an exception for abuse monitoring. See Abuse monitoring.' The bullet now keeps the descriptive sentence (Google may log prompts for abuse monitoring) and the scope sentence 'Only customers whose use of Google Cloud is governed by the Google Cloud Platform Terms of Service are subject to prompt logging for abuse monitoring.', and gives in-scope customers no action. The abuse-monitoring page (current snapshot footer Last updated 2026-10-13) still states an upper bound of 90 days for standard prompt logs and lists no customer opt-out for standard prompt logging, no request form, and no description of what an approved exception guarantees. The api tier (regular Claude models) therefore moves zdr from mark=yes / mode=by_agreement to mark=unknown with searched listing those two pages: a yes would hold only for customers with a Google Cloud Master Agreement (the abuse-monitoring page states they are exempt from prompt logging by default), while customers under the GCP Terms of Service remain subject to prompt logging and those two pages describe no exception route for them. Retention stays days=90 / object=logs / basis=fixed_period — the period and object are unchanged; only the description of the opt-out route changed. The rest of the page (Advanced AI, Grounding, request-response logging, Interactions API, Agent products, caching) is unchanged, and the Covered Models row is unaffected."
issue = "https://github.com/arcships/zdr-monitor/issues/759"
