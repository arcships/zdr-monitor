summary_zh = "Agent Platform 滥用监控页（页脚 Last updated 由 2026-10-02 改为 2026-10-13）新增 Google Frontier Models 分节和 Non-Google Advanced AI models 分节。前者写明 Frontier 模型的 prompt/response 记录最多 30 天、持 Cloud Master Agreement 客户的记录按 ZDR 标准处理、受 GCP ToS 管辖的客户仍适用人工审查，Models in scope 为 Gemini 4 Argon；后者是把原有 Advanced AI 分节改名为 Non-Google Advanced AI models。标准滥用监控的「Prompt logging」条目改名为「Prompt logging and human review」，90 天上限、仅 GCP ToS 客户在范围内、Master Agreement 默认豁免均未变；Anthropic 段落未变。新增内容的范围是 Gemini Frontier 模型，不覆盖本行的 Claude 常规模型，故本行 retention 仍为 days=90 / object=logs / basis=fixed_period，zdr 的适用边界不变；记录此次页面实质变化。"
summary_en = "The Agent Platform abuse-monitoring page (footer Last updated changed from 2026-10-02 to 2026-10-13) added a Google Frontier Models section and a Non-Google Advanced AI models section. The former states that Frontier-model prompts and responses are logged for up to 30 days, that logs for customers with Cloud Master Agreements adhere to ZDR standards, that customers under the GCP Terms of Service remain subject to human review, and that the models in scope are Gemini 4 Argon; the latter renames the existing Advanced AI section to Non-Google Advanced AI models. The standard abuse-monitoring 'Prompt logging' bullet was renamed 'Prompt logging and human review'; the 90-day upper bound, the GCP-ToS-only scope and the Master Agreement default exemption are unchanged, and the Anthropic section is unchanged. The additions are scoped to Gemini Frontier models and do not cover this row's regular Claude models, so retention remains days=90 / object=logs / basis=fixed_period and the zdr scope is unchanged; this record documents the substantive page change."
issue = "https://github.com/arcships/zdr-monitor/issues/758"
