summary_zh = "《Vercel Terms of Service》Last Updated 由 June 1, 2026 改为 October 19, 2026。Data Protection 一节现在位于 §11（Vercel's Role 为 §11.1、System Data 为 §11.4），Term and Termination 位于 §19（Effect of Termination 为 §19.3）；旧文件引用的 §10.1 / §10.4 / §18.3 已对不上正文编号。§11.1 的 DPA 引用新增 vercel.com/legal/dpa 链接；Schedule I 整节删除，改由引言中的 Service Terms 指向额外条款，AI Product Terms 自身仍声明构成 Terms of Service 的一部分。上述条款的实体内容逐字未变，五维结论字段不变；平台档的 role / retention / training 证据锚点改绑到新编号。"
summary_en = "The Vercel Terms of Service 'Last Updated' date moved from June 1, 2026 to October 19, 2026. Data Protection now sits in Section 11 (Vercel's Role in 11.1, System Data in 11.4), and Term and Termination in Section 19 (Effect of Termination in 19.3); the old file's references to 10.1, 10.4, and 18.3 no longer match the body numbering. The DPA reference in Section 11.1 now carries a vercel.com/legal/dpa link. Schedule I was removed and replaced by a Service Terms pointer in the introduction, while the AI Product Terms still state that they form part of the Terms of Service. The substantive wording of these clauses is unchanged, no verdict field changed, and the platform tier's role / retention / training anchors were rebound to the current numbering."
