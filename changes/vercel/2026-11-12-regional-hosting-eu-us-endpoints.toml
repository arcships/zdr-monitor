summary_zh = "Regional Inference 页新增 regional hosting（beta）：可把请求发到 EU/US 的区域端点，由该区域接收并解密，与 inferenceRegion 是两个独立设置，可单用或合用；两者合用时可把请求接收与模型推理都留在同一区域。旧正文称 inferenceRegion 不约束请求进入网关的位置、区域化网关主机 coming，区域端点补上了这部分控制。AU/JP 目前只能钉推理，没有区域端点；区域端点另收 5% 推理成本。processing_region 结论字段未变。"
summary_en = "The Regional Inference page added regional hosting (beta): requests can be sent to an EU or US regional endpoint, which receives and decrypts the request in that region. It is a separate setting from inferenceRegion and can be used alone or together; together they keep both request receipt and model inference in the same region. The old text said inferenceRegion does not pin where the request reaches the gateway and that region-pinned gateway hosts were coming; the regional endpoints supply that control. Australia and Japan currently support inference pinning only, with no regional endpoint. Regional hosting adds 5% of inference cost. No processing_region verdict field changed."
issue = "https://github.com/arcships/zdr-monitor/pull/1209"
