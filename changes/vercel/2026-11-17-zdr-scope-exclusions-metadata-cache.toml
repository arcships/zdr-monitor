summary_zh = "ZDR 页新增 What ZDR covers 一节并重写 Vercel 小节。范围：ZDR 按 model/provider 生效；缺 ZDR 的 provider 被跳过，无可用 provider 或模型在所有 provider 都保留数据时请求失败；batch 与异步视频在提交时拒绝；provider 自己运行的工具不受 ZDR 覆盖，可能由独立服务按自身条款保留；provider 级 prompt cache 最长保留 24 小时且 Vercel 不计为保留。旧句「AI Gateway will not fail these requests if ZDR is enabled」被更细的分情况表取代。Vercel 自己的删除承诺由「prompts, outputs, or sensitive data」改为「the prompts or responses in your requests」，并新增明确记录 request metadata（model / provider / token usage / cost / duration）；可用档位也扩为已购买 AI Gateway credits 的团队。retention 结论字段未变（对象 input_output、basis undisclosed 指上游）。"
summary_en = "The ZDR page added a 'What ZDR covers' section and rewrote the Vercel section. Scope: ZDR applies per model and per provider; a provider without ZDR for the model is skipped; the request fails when no provider remains or every provider retains data for the model; batch and asynchronous video jobs are rejected at submission; provider-run tools are outside ZDR and may be retained by a separate service under its own terms; the provider-level prompt cache can be held for up to 24 hours and Vercel does not count it as retention. The old sentence 'AI Gateway will not fail these requests if ZDR is enabled' was replaced by a more granular case table. Vercel's own deletion promise changed from 'prompts, outputs, or sensitive data' to 'the prompts or responses in your requests', and the page now explicitly says AI Gateway records request metadata (model, provider, token usage, cost, duration). Availability was also broadened to teams that have purchased AI Gateway credits. No retention verdict field changed (object input_output, basis undisclosed refers to the upstream hop)."
issue = "https://github.com/arcships/zdr-monitor/pull/1279"
