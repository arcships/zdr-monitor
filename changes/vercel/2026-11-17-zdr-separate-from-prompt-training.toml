summary_zh = "ZDR 页与 Disallow Prompt Training 页都把旧句「ZDR 是 disallow prompt training 的超集 / 所有 ZDR-compliant provider 也 disallow prompt training」替换为「ZDR and disallowing prompt training are separate controls」。ZDR 不再被官方表述为不训练的充分条件，两页都要求用户同时打开两个控制。ZDR provider 表新增 Notes 列，Meta 行的 No prompt training 由「—」变为 ✓，旧的自相矛盾消失。ZDR 与 training 的结论字段未变（网关档 zdr=yes、training=no）。"
summary_en = "Both the ZDR page and the Disallow Prompt Training page replaced the old sentence 'ZDR is a superset of disallowing prompt training / all ZDR-compliant providers also disallow prompt training' with 'ZDR and disallowing prompt training are separate controls'. ZDR is no longer described as a sufficient condition for no training, and both pages tell users to enable both controls. The ZDR provider table gained a Notes column and the Meta row's No prompt training value changed from a dash to a checkmark, resolving the earlier self-contradiction. No zdr or training verdict field changed (gateway zdr=yes, training=no)."
