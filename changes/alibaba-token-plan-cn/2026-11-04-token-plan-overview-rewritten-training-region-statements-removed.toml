summary_zh = "《Token Plan 概述》在 2026-11-04 快照（#1026）改版为《Token Plan 概览》：标题改为「概览」，正文由分档位产品介绍重写为快速接入、AI 工具接入、Harness 配置与场景 Playbook，原「产品简介」、个人版/团队版定价表、「套餐限额」与「常见问题」整段删除。随之删去两句与五维相关的表述：团队版条目「**团队版**：面向团队和企业，提供标准座席、高级座席、尊享座席三个档位，支持多席位管理、用量分析，承诺不使用数据训练模型。」，以及说明栏「Token Plan 目前仅支持**华北2（北京）**地域，请在百炼控制台左上角将地域切换至**华北2（北京）**后购买并使用。」。被删的训练承诺对象是范围较宽的「数据」；档位专用页保留的是范围更窄的「对话数据」（token-plan-team-overview 两处：「承诺不使用对话数据进行模型训练」「Token Plan 团队版不会使用对话数据训练模型」），本页这层更宽的表述已无对应原文。同等地域承诺仍在档位专用页：token-plan-team-overview 写明「Token Plan 团队版目前仅支持**华北2（北京）**地域」，token-plan-personal-overview 写明「Token Plan 个人版目前仅支持**华北2（北京）**地域」。团队版 training 仍为 mark=yes / mode=by_tier（服务协议 §6.2.5 为主证据），个人版 training 仍为 mark=no，两档 processing_region 仍为 codes=[CN]，结论值均不变。本页原有两个锚点（training-team-commitment-overview、processing-region-tokenplan-cn-beijing）的 exact 已不在快照中，且未被任何结论引用，故删除。方向记 weakened：厂商在本页删去了团队版「不使用数据训练模型」与「仅支持华北2（北京）」两句，属披露减少；档位专用页保留同类（且训练承诺范围更窄的「对话数据」）表述，只能说明结论值不用改，不能把本页的删句记成澄清。"
summary_en = "In the 2026-11-04 snapshot (#1026), 'Token Plan Overview' was rewritten as 'Token Plan at a Glance': the title changed and the body changed from a per-tier product introduction to quick start, AI-tool onboarding, Harness configuration and scenario playbooks; the former product introduction, the individual/team pricing tables, the quota section and the FAQ were removed wholesale. Two five-dimension statements disappeared with them: the team bullet 'Team Edition: for teams and enterprises, offering three seat tiers, with multi-seat management and usage analytics, and a commitment not to use data to train models.', and the note 'Token Plan currently supports only China North 2 (Beijing); switch the region in the Model Studio console to China North 2 (Beijing) before purchase and use.' The deleted training commitment covered the broader object 'data'; the tier-specific pages retain the narrower 'conversation data' (token-plan-team-overview states twice that it commits not to use conversation data to train models: '承诺不使用对话数据进行模型训练' and 'Token Plan 团队版不会使用对话数据训练模型'), so this page's broader wording has no counterpart left. The region commitments remain on the tier-specific pages: token-plan-team-overview says 'Token Plan Team Edition currently supports only China North 2 (Beijing)' and token-plan-personal-overview says 'Token Plan Individual Edition currently supports only China North 2 (Beijing)'. The team training verdict remains mark=yes / mode=by_tier (service agreement §6.2.5 is the main evidence), the individual training verdict remains mark=no, and processing_region remains codes=[CN] for both tiers; no verdict value changed. The page's two anchors (training-team-commitment-overview, processing-region-tokenplan-cn-beijing) no longer match the snapshot and were not referenced by any verdict, so they were removed. Direction is recorded as weakened: the vendor deleted this page's team 'does not use data to train models' and 'supports only China North 2 (Beijing)' statements, a reduction in disclosure; the tier-specific pages retaining similar (and, for training, narrower 'conversation data') wording only means the verdict values need not change, and does not make the deleted statements on this page a clarification."
issue = "https://github.com/arcships/zdr-monitor/issues/1027"
