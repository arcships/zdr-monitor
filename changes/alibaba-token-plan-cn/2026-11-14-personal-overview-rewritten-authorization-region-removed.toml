summary_zh = "《Token Plan 个人版 概述》在 2026-11-14 快照（#1226）改版为《个人版订阅与权益》：正文由产品介绍、Credits 计费机制与「订阅前须知」重写为套餐档位、支持模型与订阅管理。与五维相关的删除有两处：(1) 说明栏旧句「**说明**Token Plan 个人版目前仅支持**华北2（北京）**地域。」；(2)「订阅前须知」第 2 条「**数据使用授权**：使用 Token Plan 个人版期间，模型输入以及模型生成的内容将用于服务改进与模型优化。停止使用 Token Plan 个人版服务可终止后续数据授权，但终止授权的范围不涵盖已授权使用的数据。详细条款请参见阿里云百炼服务协议第 5.2 条。」删除后本页不再承载 training/zdr/processing_region 的结论：training 与 zdr 仍为 mark=no，依据服务协议 §5.2.2（未改动）；processing_region 仍为 codes=[CN]，本页删去的北京地域句已由官方《Harness 权益》页「注意事项」中的「Token Plan 个人版目前仅支持华北2（北京）地域。」承接，该页为本轮新增来源，属我们补证据、不是厂商改动。额度、计费、续费、退订等改写与五维无关。方向记 weakened：厂商删去本页两处与五维相关的披露，属披露减少；其他官方页仍保留等价地域句、合同级训练授权也仍在，只能说明结论值不变，不能把本页删句记成 clarified——这与 2026-11-04 记录对《Token Plan 概览》删去同类地域/训练句记 weakened 的口径一致。"
summary_en = "In the 2026-11-14 snapshot (#1226), 'Token Plan Individual Edition Overview' was rewritten as 'Individual Edition Subscription and Entitlements': the product introduction, Credits billing section and 'Before subscribing' notice were replaced by tier pricing, supported models and subscription management. Two five-dimension statements were removed: (1) the note '**说明**Token Plan 个人版目前仅支持**华北2（北京）**地域。'; and (2) item 2 of the 'Before subscribing' notice, '**数据使用授权**：使用 Token Plan 个人版期间，模型输入以及模型生成的内容将用于服务改进与模型优化。停止使用 Token Plan 个人版服务可终止后续数据授权，但终止授权的范围不涵盖已授权使用的数据。详细条款请参见阿里云百炼服务协议第 5.2 条。' After the rewrite this page no longer carries the training, zdr or processing_region verdicts. Training and zdr remain mark=no on service agreement §5.2.2, which is unchanged. processing_region remains codes=[CN]: the Beijing-only sentence removed from this page is now carried by the official Harness benefits page, whose '注意事项' states 'Token Plan 个人版目前仅支持华北2（北京）地域。' That page was added as a new source in this round; adding it is our evidence work, not a vendor change. Quota, billing, renewal and refund rewrites are unrelated to the five dimensions. Direction is recorded as weakened: the vendor deleted two five-dimension disclosures from this page, a reduction in disclosure. Equivalent region wording on another official page and the contract-level training authorization only mean the verdict values do not change; they do not make the deletion on this page a clarification. This is consistent with the 2026-11-04 record, which recorded the same kind of region/training deletions on the Token Plan overview page as weakened."
