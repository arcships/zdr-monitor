summary_zh = "《Token Plan 团队版 概述》在 2026-11-14 快照（#1226）改版为《团队版订阅与权益》：正文重写为套餐与定价、支持模型与订阅管理。与五维相关的删除有两处：(1)「核心特性」中的「**数据安全**：承诺不使用对话数据进行模型训练，满足企业级数据隐私要求。」；(2)「订阅前须知」第 2 条「**数据安全**：Token Plan 团队版不会使用对话数据训练模型。」说明栏的「Token Plan 团队版目前仅支持**华北2（北京）**地域。如需从海外调用，请确认符合当地法律法规要求。」保留，故 processing_region 仍为 codes=[CN]；「服务地域」条目的移动另记一条 clarified。training 结论值仍为 mark=yes，但依据从产品页的两处明示改为服务协议 §6.2.5「我们不会在未获您授权的情况下使用您的对话数据训练我们的模型。」结合 §5.2.2 明文排除团队版，mode 由 by_tier 改为 by_contract。方向记 weakened：厂商删去团队版产品页两处「不使用对话数据训练模型」表述，属披露减少；合同级承诺仍在只能说明结论值不变，不能把产品页删句记成 clarified。"
summary_en = "In the 2026-11-14 snapshot (#1226), 'Token Plan Team Edition Overview' was rewritten as 'Team Edition Subscription and Entitlements': the body was replaced by plan pricing, supported models and subscription management. Two five-dimension statements were removed: (1) the core-feature bullet '**数据安全**：承诺不使用对话数据进行模型训练，满足企业级数据隐私要求。'; and (2) item 2 of the 'Before subscribing' notice, '**数据安全**：Token Plan 团队版不会使用对话数据训练模型。' The note 'Token Plan 团队版目前仅支持**华北2（北京）**地域。如需从海外调用，请确认符合当地法律法规要求。' is retained, so processing_region stays codes=[CN]; the move of the '服务地域' bullet is recorded separately as clarified. The training verdict stays mark=yes, but its basis moves from the two product-page statements to service agreement §6.2.5 ('we will not use your conversation data to train our models without your authorization') together with §5.2.2's express exclusion of the team plan, and mode changes from by_tier to by_contract. Direction is recorded as weakened: the vendor removed the team page's two 'does not use conversation data to train models' statements, a reduction in disclosure; the surviving contract-level promise only means the verdict value does not change and does not turn the product-page deletion into a clarification."
issue = "https://github.com/arcships/zdr-monitor/issues/1227"
