summary_zh = "《Token Plan 团队版 概述》在 2026-11-14 快照（#1226）改版为《团队版订阅与权益》时，删除了「订阅前须知」第 4 条「**服务地域**：Token Plan 团队版目前仅在特定地域提供服务，如需从海外调用，请确认符合当地法律法规要求。」同时说明栏由「**说明**Token Plan 团队版目前仅支持**华北2（北京）**地域。」扩为「**说明**Token Plan 团队版目前仅支持**华北2（北京）**地域。如需从海外调用，请确认符合当地法律法规要求。」——被删条目只写「特定地域」，保留并扩充的说明栏给出更具体的地域并保留海外调用提示，processing_region 仍为 codes=[CN]。方向记 clarified：信息从须知条目移到说明栏并具体化，未见服务地域范围发生变化的表述。"
summary_en = "When 'Token Plan Team Edition Overview' was rewritten as 'Team Edition Subscription and Entitlements' in the 2026-11-14 snapshot (#1226), item 4 of the 'Before subscribing' notice was removed: '**服务地域**：Token Plan 团队版目前仅在特定地域提供服务，如需从海外调用，请确认符合当地法律法规要求。' At the same time the note grew from '**说明**Token Plan 团队版目前仅支持**华北2（北京）**地域。' to '**说明**Token Plan 团队版目前仅支持**华北2（北京）**地域。如需从海外调用，请确认符合当地法律法规要求。' The removed bullet only said 'certain regions', while the retained and expanded note gives the specific region and keeps the overseas-use caveat, so processing_region stays codes=[CN]. Direction is recorded as clarified: the information moved from the notice bullet into the note and became more specific, with no statement that the supported region scope changed."
issue = "https://github.com/arcships/zdr-monitor/issues/1227"
