summary_zh = "订阅套餐专用条款 §1.2 将《火山方舟大模型服务平台专用条款》增列为完整协议第（3）项，并将《火山引擎AI服务规则及免责声明》列为第（4）项；旧正文为「（4）《服务等级协议》（如有）和（5）服务规则等所适用的其他协议共同构成您与火山引擎之间就订购或（和）使用本服务的完整协议。」原第（3）至（5）项顺延为第（5）至（7）项。该并入使平台条款 §3.7.7 成为 Coding Plan 企业版证据范围的一部分：其首句仍规定未经单独同意不存储、不使用数据训练或优化模型，但新增登记的（1）允许为履行法律法规合规要求对提交和输出内容自动化过滤审核并建立、改进风险过滤机制及违法违规侵权内容特征库；（2）允许为排障在合理时间内存储用户主动提供的数据；（3）允许存储和审查触发模型异常告警的数据直至解除告警。§3.7.11 另规定启用缓存存储、日志记录、AI 应用监控与调试、可观测性平台、加标识或 Managed Agents 托管时数据存入方舟存储空间，并明确未经授权不会访问或使用。企业版 training、retention、zdr 结论值不变，但补登记合规审查、功能存储、排障存储和异常告警存储等处理场景；§1.4 与 §1.1 的特别约定规则仍支撑企业版不留存结论。个人版 §1.3 的授权及其特别条款优先关系不变。processing_region 与 role 无变化。新增 §2.13 的模型下架提前七日通知与五个维度无关。"
summary_en = "Subscription plan terms §1.2 added the Ark platform-specific terms as item (3) of the complete agreement and the Volcengine AI Service Rules and Disclaimer as item (4), shifting the former items (3) through (5) to items (5) through (7). This incorporation makes platform terms §3.7.7 part of the Coding Plan Enterprise evidence scope: its first sentence still says that, without separate consent, Volcengine will not store or use data to train or optimize models, while the newly registered scenarios are (1) automated filtering and review of submitted and generated content and building or improving risk filters and infringement-content feature libraries for legal and regulatory compliance; (2) storage for a reasonable time of data actively provided for troubleshooting; and (3) storage and review of data triggering model-abnormality alerts until the alert is lifted. Section 3.7.11 separately says that enabling cache storage, logging, AI application monitoring and debugging, observability, labeling or Managed Agents hosting stores data in Ark storage space, and states that Volcengine will not access or use the data without authorization. The enterprise training, retention and ZDR verdict values are unchanged, but the compliance-review, feature-storage, troubleshooting-storage and anomaly-alert-storage scenarios are now registered; the specific §1.4 promise and §1.1 precedence rule still support the enterprise non-retention conclusion. The personal edition's §1.3 authorization and special-terms precedence are unchanged. processing_region and role are unaffected. New §2.13's seven-day model-withdrawal notice is unrelated to the five dimensions."
issue = "https://github.com/arcships/zdr-monitor/issues/767"
