[[product.retention.point]]
text_zh = "与国内站的关键差异:国际站 §5.9 无 AI 例外,协议期满或终止后统一『保留三十（30）个自然日』,期满自动清除含缓存与备份"

[[product.retention.point]]
text = "A second, parallel period in the intl privacy policy: §2.6 states that even if your relationship with Qiniu ends or changes in any way (for example, termination or variation under contract), the purposes listed in section 2 continue to apply for a reasonable period thereafter (including, where applicable, the period needed to enforce Qiniu's rights under any contract with you). Object: collection and use of personal information; context: after the relationship ends or changes; period type: an open-ended \"reasonable period\", not a deletion deadline. It sits alongside the thirty-day retention window in §5.9: §5.9 governs the user data and server-side content in your account, §2.6 governs how long the collection/use purposes for personal information survive."
text_zh = "国际站隐私政策还有第二条期限口径,与 §5.9 的终止后 30 天并列:§2.6『即使您与我们的关系已经以任何方式终止或变更（例如，按照合同终止或变更），在之后合理的期限内（如适用，包括按照与您签订的任何合同执行我们的权利所需的期限），本第2条所列的目的也应继续适用。』——对象=个人信息的收集与使用目的,语境=关系终止或变更后,期限类型=『合理期限』(开放式,不是删除截止期)。与 §5.9 的关系:§5.9 管账号内用户数据与服务器内容的 30 天保留期,§2.6 管个人信息收集/使用目的在关系结束后的延续,两者不是同一对象"
anchor = "qiniu-pp-intl-purposes-after-termination"

[[product.retention.point]]
text_zh = "§5.5 另有『提供服务后的合理期限内』删除或匿名化的原则性表述"

[[product.retention.point]]
text_zh = "国际站隐私政策 §5.4 补充『出于研究或统计目的』匿名化后『可以无限期地使用该信息』。国内站 §4.8 的 AI 排除条款在国际站不存在"
anchor = "qiniu-pp-intl-retention-anon"

[[product.retention.point]]
text = "Exception to deletion on account closure: §5.4 of the intl privacy policy says that where you close your account or delete the information, Qiniu will keep certain of your personal information for as long as applicable law reasonably requires in order to meet its legal obligations — for example, keeping the personal information necessary for tax and accounting purposes — but will not use it for commercial purposes during that period. Object: personal information; context: after account closure or deletion, i.e. an exception to the deletion-or-anonymisation rule in §6.4; period type: the period applicable law requires."
text_zh = "注销/删除后的例外:国际站隐私政策 §5.4 写明『七牛云将在适用法律合理要求的期限内保留你的某些个人信息以履行我们的法律义务，例如保留必要的个人信息以实现税务和会计目的』,期间不再作商业化使用——对象=个人信息,语境=注销账号或主动删除后(即同政策 §6.4『注销后删除或匿名化』的例外),期限类型=适用法律要求的期限。与同段的匿名化无限期使用并列"
anchor = "qiniu-pp-intl-retention-legal-exception"

