[[product.zdr.point]]
text_zh = "③合同 §4.8 承诺服务终止即删除。例外=①Claude 系列可主动开启 prompt caching,缓存内容默认保留 5 分钟(客户端显式设置才生效)"

[[product.zdr.point]]
text_zh = "②日志与计费元数据约保留 30 天"

[[product.zdr.point]]
text_zh = "③上游模型供应商自行处理(§9.3.1),七牛的不存储承诺不覆盖上游。因唯一正面依据是帮助文档而非合同,置信度记 medium"

[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "qiniu-ua-cn-ai-retention"

[[product.retention.point]]
text_zh = "分三层,不要混:(1) **AI 类服务的对话内容**:帮助文档承诺『七牛云不会存储您的对话内容和敏感信息』(developer_data),而合同 §4.8 只作排除式约定——AI 类服务不适用通用 30 天保留期,『政策未公布的,服务终止即删除』。两条方向不同、权威也不同(contract > developer_data),本维度以合同为准记 basis=until_termination(留至服务终止):合同不承诺零留存,只承诺终止即删"
anchor = "qiniu-apidocs-no-content-storage"

[[product.retention.point]]
text_zh = "(2) **请求日志(元数据)**:接口文档明示『日志保留周期约为 30 天(以实际配置为准)』——对象=请求日志,语境=默认,期限类型=典型区间(约 30 天,不是删除上限),且日志字段只有 model_id/api_key(脱敏)/start_time/end_time/server_type/code/errors/usage/费用,**不含 prompt/response 内容**"
anchor = "qiniu-log-retention-30d"

[[product.retention.point]]
text_zh = "(3) **账号类个人信息**:隐私政策 §5.4 为实现目的所必需的最小化时间保存,在法律要求的最短保存期限内(身份与交易信息)至少 3 年——对象=账号类个人信息,语境=注销或主动删除后,期限类型=下限。三者对象不同,旧记录把它们并成一条容易误读。用户协议 §4.8 所引用的『AI 服务数据政策』没有在本文件登记来源,其内容无从核对"
anchor = "qiniu-pp-cn-retention-min"

[[product.retention.point]]
text = "Two exceptions to the right of deletion (privacy policy §6.3): after you delete information, the backup system may not delete it immediately — it is deleted when the backup is refreshed; and where the retention period set by law or administrative regulation has not expired, or deletion is technically impracticable, Qiniu stops all processing other than storage and necessary security measures. Object: source data and backup data; context: after the user deletes information or exercises the right; period type: at the next backup refresh / before the statutory period expires."
text_zh = "(4) **删除权的两条保留例外**(隐私政策 §6.3):用户删除信息后,备份系统可能延迟删除(备份更新时才删);法律、行政法规规定的保存期限未届满,或者删除个人信息从技术上难以实现的,仅停止除存储和采取必要安全保护措施之外的处理——对象=源数据与备份数据,语境=用户删除或行权后,期限类型=备份更新时/法定期限届满前"
anchor = "qiniu-pp-cn-deletion-exceptions"

[[product.retention.point]]
text = "Arrears-driven freezing is a second deletion mechanism with a quantified period (user agreement §7.2.2): if the account freeze is not lifted within 30 natural days, the user is deemed to have abandoned the service, the agreement terminates, the storage space is reclaimed and the data in it is deleted and zeroed, irrecoverably. Object: data in the storage space; context: freeze for non-payment (a different context from expiry or early termination under §4.8)."
text_zh = "(5) **欠费冻结是另一条有量化期限的删除机制**(用户协议 §7.2.2):账号被冻结后 30 个自然日内未解除即视为放弃服务、协议终止、存储空间回收、数据删除清零且不可恢复——对象=存储空间内的数据,语境=欠费冻结(与 §4.8 的协议期满/提前终止不是同一语境)"
anchor = "qiniu-ua-cn-freeze-30d"

[[product.retention.point]]
text = "The same FAQ section that promises no storage of conversation content also states that every API call has detailed logs. \"Detailed logs\" there means call metadata: the log export API field list (id, model_id, masked api_key, start_time, end_time, server_type, code, errors, state, usage, billing fields) contains no prompt or response body, so the two statements do not conflict."
text_zh = "(6) FAQ『不存储敏感数据』同一节另写『所有 API 调用都有详细日志，可追溯查询』:此处『详细日志』指调用元数据——请求日志下载接口的字段表只有 id/model_id/api_key(脱敏)/start_time/end_time/server_type/code/errors/state/usage/费用,**不含 prompt/response 正文**。两句并排不构成矛盾"
anchor = "qiniu-apidocs-audit-log"

[product.processing_region]
codes = ["CN"]
anchor = "qiniu-pp-cn-region-in-china"

[[product.processing_region.point]]
text_zh = "平台层:隐私政策 §5.4『将在境内运营过程中收集和产生的个人信息存储于中华人民共和国境内，且不会将该等信息向境外进行传输』(英文版同义),用户协议 §3.1.11.1(1) 亦要求用户不向境外传输个人信息"

[[product.processing_region.point]]
text_zh = "FAQ 另称『目前AI产品仅支持中国大陆账号使用』"

[[product.processing_region.point]]
text_zh = "接入点文档区分国内 api.qnaigc.com(中国大陆节点)与海外 api.modelink.ai,并称两者『仅网络路由不同』。**未披露的部分**:逐模型的实际推理算力所在地没有公开说明,而 §9.3.1/FAQ Q11 已表明模型计算由上游供应商直接提供、且平台转售 Claude/GPT/Gemini 等国际模型(apidocs 亦提供 bypass Anthropic/Vertex/OpenAI 原厂直通),这些模型的算力与数据处理地须按各原厂政策核实"

[[product.processing_region.point]]
text_zh = "因此本条只覆盖七牛自身层与账号/日志数据,不构成『全部推理在中国境内完成』的结论"

[product.role]
kind = "processor"
anchor = "qiniu-pp-cn-processor"

[[product.role.point]]
text_zh = "双角色,分开记:(1) 对**客户数据/最终用户个人信息**:隐私政策 §3.2『我们将按照您的指令、委托处理您的客户数据。您应当就委托我们处理的客户数据独立向您的客户/用户履行相关义务并承担相应责任』→ 七牛是受托处理者(processor)"

[[product.role.point]]
text_zh = "(2) 对**账号注册与业务联系类个人信息**:隐私政策 §2 以自身目的收集使用 → 控制者(controller)角色。(3) 网关/转售层:用户协议 §9.3.1 明确七牛义务是『提供稳定的技术接入、计费与服务平台』、模型能力由模型供应商直接提供且供应商有『完整的独立控制权』"

[[product.role.point]]
text_zh = "§4.7.4『为提供您所要求的软件或服务，而必须和第三方共用您的数据』与 SLA §1.4(3) 的『七牛以及七牛使用的服务供应商』都印证数据会流向上游。§3.2.5 另保留对内容合规的抽查审查权。未在公开文本中找到『个人信息处理者/控制者』的自述字样"

