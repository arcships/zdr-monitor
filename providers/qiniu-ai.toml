[[product.training.point]]
text_zh = "合同级:用户协议 §4.5『除依据适用法律法规或为了提供服务所需，未经您授权同意，七牛云不会擅自使用用户数据』——无授权即不得使用(含训练)"

[[product.training.point]]
text_zh = "§4.4 是唯一的『改善服务』型授权,但对象限定为『运营数据』(系统日志、账单数据、客服信息等),不含客户上传/请求内容。帮助文档级(developer_data):apidocs FAQ『安全与隐私』以加粗『明确承诺』写明『您通过七牛云 AI 服务提交的数据 不会被用于训练模型！』(anchor qiniu-apidocs-no-training),与合同不冲突、口径更明确。隐私政策 §2.2.2 的改善用途只使用匿名化综合/统计信息。**上游边界**:用户协议 §9.3.1 与 FAQ Q11 表明模型计算/推理/内容生成由第三方模型供应商直接提供,七牛仅做技术接入、计费与平台,故本结论只覆盖七牛自身层"

[[product.training.point]]
text_zh = "所选模型的供应商是否训练须按其各自政策另行核实"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "qiniu-apidocs-no-content-storage"

[[product.zdr.point]]
text_zh = "七牛**没有**独立的 ZDR 产品/申请流程,只有帮助文档的『不存储对话内容和敏感信息』承诺(developer_data,非合同)。三条支撑与三条例外:支撑=①上述 FAQ 承诺"

[[product.zdr.point]]
text_zh = "②请求日志字段清单无 prompt/response(仅元数据)"

[[product.zdr.point]]
text_zh = "③合同 §4.8 承诺服务终止即删除。例外=①Claude 系列可主动开启 prompt caching,缓存内容默认保留 5 分钟(客户端显式设置才生效)"

[[product.zdr.point]]
text_zh = "②日志与计费元数据约保留 30 天"

[[product.zdr.point]]
text_zh = "③上游模型供应商自行处理(§9.3.1),七牛的不存储承诺不覆盖上游。因唯一正面依据是帮助文档而非合同,置信度记 medium"

[product.retention]
object = "mixed"
basis = "none"
anchor = "qiniu-ua-cn-ai-retention"

[[product.retention.point]]
text_zh = "分三层,不要混:(1) **AI 类服务的对话内容**:帮助文档承诺『七牛云不会存储您的对话内容和敏感信息』,而合同 §4.8 只作排除式约定——AI 类服务不适用通用 30 天保留期,『政策未公布的,服务终止即删除』,即合同不承诺零留存、只承诺终止即删"

[[product.retention.point]]
text_zh = "(2) **请求日志(元数据)**:接口文档明示『日志保留周期约为 30 天(以实际配置为准)』,且日志字段只有 model_id/api_key(脱敏)/start_time/end_time/server_type/code/errors/usage/费用,**不含 prompt/response 内容**"

[[product.retention.point]]
text_zh = "(3) **账号类个人信息**:隐私政策 §5.4 为实现目的所必需的最小化时间保存,法律要求的最短保存期限内(身份与交易信息)至少 3 年。三者对象不同,旧记录把它们并成一条容易误读。另外用户协议 §4.8 本身引用的『AI 服务数据政策』并未公布(见 sources 中 dead 条目)"

[product.processing_region]
codes = ["CN"]
anchor = "qiniu-pp-cn-region-in-china"

[[product.processing_region.point]]
text_zh = "平台层:隐私政策 §5.4『将在境内运营过程中收集和产生的个人信息存储于中华人民共和国境内，且不会将该等信息向境外进行传输』(英文版同义),用户协议 §3.1.11.1(1) 亦要求用户不向境外传输个人信息"

[[product.processing_region.point]]
text_zh = "FAQ 另称『目前AI产品仅支持中国大陆账号使用』"

[[product.processing_region.point]]
text_zh = "接入点文档区分国内 api.qnaigc.com(中国大陆节点)与海外 api.modelink.ai,并称两者『仅网络路由不同』。**未披露的部分**:逐模型的实际推理算力所在地没有公开说明,而 §9.3.1/FAQ Q11 已表明模型计算由上游供应商直接提供、且平台转售 Claude/GPT/Gemini 等国际模型(apidocs 亦提供 bypass Anthropic/Vertex/OpenAI 原厂直通),这些模型的算力与数据处理地须按各原厂政策核实"

[[product.processing_region.point]]
text_zh = "因此本条只覆盖七牛自身层与账号/日志数据,不构成『全部推理在中国境内完成』的结论"

[product.role]
kind = "processor"
anchor = "qiniu-pp-cn-processor"

[[product.role.point]]
text_zh = "双角色,分开记:(1) 对**客户数据/最终用户个人信息**:隐私政策 §3.2『我们将按照您的指令、委托处理您的客户数据。您应当就委托我们处理的客户数据独立向您的客户/用户履行相关义务并承担相应责任』→ 七牛是受托处理者(processor)"

[[product.role.point]]
text_zh = "(2) 对**账号注册与业务联系类个人信息**:隐私政策 §2 以自身目的收集使用 → 控制者(controller)角色。(3) 网关/转售层:用户协议 §9.3.1 明确七牛义务是『提供稳定的技术接入、计费与服务平台』、模型能力由模型供应商直接提供且供应商有『完整的独立控制权』"

[[product.role.point]]
text_zh = "§4.7.4『为提供您所要求的软件或服务，而必须和第三方共用您的数据』与 SLA §1.4(3) 的『七牛以及七牛使用的服务供应商』都印证数据会流向上游。§3.2.5 另保留对内容合规的抽查审查权。未在公开文本中找到『个人信息处理者/控制者』的自述字样"

