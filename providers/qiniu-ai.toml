[[product.training.point]]
text = "Why this is not a yes (not used for training): §5.5 is only a general restriction on arbitrary use of user data — \"except as necessary to provide the service or with your authorisation, Qiniu will not make arbitrary use of your user data\". It neither authorises nor rules out model training, and judging yes requires a statement that explicitly shuts model training out, not the mere absence of a mention. Search scope in searched."
text_zh = "本维度不能记 yes 的理由:§5.5『除为了提供服务所必须或经您的授权外，七牛云不会对您的用户数据进行任意使用』是对用户数据使用的概括限制,既未授权也未排除模型训练——判 yes(不用于训练)需要明确把模型训练挡在外面的表述,而不是没提到。查阅范围见 searched"
anchor = "qiniu-ua-intl-no-arbitrary-use"

[[product.training.point]]
text = "Why this is mark=no: §5.7 is a disclosed service-improvement authorisation over data Qiniu may collect — Qiniu may collect your data or produce certain technical and operational data (system logs, billing data, customer-service conversations, lead information) and \"has the right to decide on its own to use such operational data to optimise and improve Qiniu Cloud services\", with no opt-out, and neither intl document excludes model training. Under the house rule that using data to improve services counts as training, this points the training way; its object is operational data (including customer-service conversations), not necessarily the API request body, which is why the tier is recorded as terms-permit rather than an explicit statement that API inputs are trained on. The CN agreement §4.4 is worded almost identically, but the CN site additionally has the apidocs FAQ commitment and §4.5, which the intl site lacks — that is why the two tiers point in different directions."
text_zh = "本档记 mark=no 的依据:§5.7『七牛云有权自行决定利用该等运营数据优化和改善七牛云服务』是一条例外式的『改善服务』型授权——对象是运营数据(系统日志、账单数据、客服对话、留资信息),无退出开关,而国际站两份文本都没有排除模型训练。按『用来改进服务算训练』的口径,这是训练向授权;对象是运营数据(含客服对话),不必然是 API 请求正文,故记『条款允许』而不是『明示拿 API 输入训练』。国内站 §4.4 措辞与本条近乎平行,但国内站另有 apidocs FAQ 的明确承诺与 §4.5 的『不会擅自使用用户数据』,国际站两者都没有——这是两档结论方向不同的原因"
anchor = "qiniu-ua-intl-ops-data"

[[product.training.point]]
text_zh = "§1.4『授权七牛云使用、处理和传输任何相关的客户内容』是反向授权,但目的限定为『为了向您提供服务』,未提训练或模型改进,既不能支持 yes(不用于训练),也不是本档记 mark=no 的正面依据"
anchor = "qiniu-ua-intl-content-license"

[[product.training.point]]
text = "The closest the intl agreement comes to limiting what Qiniu does with content is §10.5, in the disclaimers and liability-limitation chapter: in the course of the service Qiniu only carries out lawfully, validly and necessarily authorised distribution, transmission, caching and parameter processing of your data (including user data), and does not process the content of your data itself on its own initiative. It is a description of processing forms under a liability disclaimer — it neither authorises nor rules out model training, so it must not be read as a positive basis for \"not used for training\". It is also the source for caching as a processing form. The CN-site agreement has a near-identical clause (§9.2.3)."
text_zh = "国际站文本里最接近『不会拿内容做别的事』的是 §10.5(位于『免责条款与责任限制』章):『七牛云服务过程中仅对您的数据（包括用户数据）进行经合法、有效、必要授权的分发、传输、缓存、参数处理等工作，而不会私自对您的数据内容本身进行加工。』它既不授权也不排除训练,属责任限制语境下的处理形态描述,不是数据保护承诺,不能读成『不用于训练』的正面依据;zdr 侧『缓存』这一处理形态也出自此处。国内站协议 §9.2.3 有几乎同义的表述"
anchor = "qiniu-ua-intl-processing-forms"

[[product.training.point]]
text_zh = "国际站协议无 AI 专章,亦无『不用于训练』的明示承诺;所选模型的上游供应商是否训练须按其各自政策另行核实"

