text_zh = "国际站隐私政策无国内站 §3.2 那种『委托处理您的客户数据』条款,只能从用户协议 §5.4(用户须保证有权『将其个人信息传输给七牛云或其指定的主体进行数据处理』)与隐私政策 §4.1(七牛自身委托新加坡/境外供应商为受托方)间接推出:七牛对客户数据是受托处理方,对其自身收集的个人信息是控制者。置信度低"

[[product.role.point]]
text = "The intl agreement's own clause on data flow to third parties is §5.8: user data and personal data may be disclosed in whole or in part (1) with your consent, (2) where required by applicable law or a lawful request from a regulator or judicial body, or (3) to a third party in order to provide the service you requested. The CN-site agreement has the parallel clause §4.7.4. This describes the direction of the data flow (including to upstream providers where the service requires it); it is not by itself a self-declaration of processor or controller status."
text_zh = "数据流向的直接条款:国际站协议 §5.8『您确认并同意，您的数据（用户数据和个人数据）可能在下述情况下部分或全部被七牛云披露:(1) 经您授权同意后披露；(2) 根据可适用法律或者应监管机构或司法机构的合法要求披露；或者 (3) 为提供您所要求的服务而向第三方披露。』国内站对应条款为 §4.7.4。本条说明数据会流向第三方(含为提供服务所需的上游),本身不构成受托/控制角色的自述"
