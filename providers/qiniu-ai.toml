text = "Structured conclusion: the cited clause states affirmatively that user data and content stored on Qiniu servers are kept for thirty (30) natural days from expiry or termination, and the agreement contains no zero-retention or no-storage commitment. The tier is therefore recorded as mark=no (terms state retention)."
text_zh = "结构化结论：原引条款正面写明账号内全部用户数据及存储在服务器中的内容自届满/终止之日起保留三十（30）个自然日，且协议没有任何零留存/不存储承诺。据此记 mark=no（条款明示会留存）。"

[[product.zdr.point]]
text_zh = "国际站协议只有『合理期限内删除或匿名化』『终止后 30 天』,没有任何零留存/不存储内容的承诺"

[[product.zdr.point]]
