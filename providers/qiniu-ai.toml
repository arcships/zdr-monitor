[[product.training.point]]
text_zh = "合同级:用户协议 §4.5『除依据适用法律法规或为了提供服务所需，未经您授权同意，七牛云不会擅自使用用户数据』——无授权即不得使用(含训练)"

[[product.training.point]]
text_zh = "§4.4 是唯一的『改善服务』型授权,但对象限定为『运营数据』(系统日志、账单数据、客服信息等),不含客户上传/请求内容。帮助文档级(developer_data):apidocs FAQ『安全与隐私』以加粗『明确承诺』写明『您通过七牛云 AI 服务提交的数据 不会被用于训练模型！』(anchor qiniu-apidocs-no-training),与合同不冲突、口径更明确。隐私政策 §2.2.2 的改善用途只使用匿名化综合/统计信息。**上游边界**:用户协议 §9.3.1 与 FAQ Q11 表明模型计算/推理/内容生成由第三方模型供应商直接提供,七牛仅做技术接入、计费与平台,故本结论只覆盖七牛自身层"

[[product.training.point]]
text_zh = "所选模型的供应商是否训练须按其各自政策另行核实"

