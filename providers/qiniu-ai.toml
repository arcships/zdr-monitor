[[product.processing_region.point]]
text_zh = "§4.1 说明受托方可能位于新加坡或新加坡境外。未披露具体处理地。**归属不确定性**:海外接入点 api.modelink.ai 只在七牛国内站 apidocs 中被描述为『面向海外用户或需要访问境外模型』,公开文本没有明示该接入点由新加坡主体签约、或适用国际站协议——本条按站点归属推断(国际站协议主体 SUPERSTIFY TECHNOLOGY PTE.LTD.),置信度低"

