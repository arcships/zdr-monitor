[[product.zdr.point]]
text = "No per-request zero-retention or no-storage commitment in the official texts, and no enablement path or enterprise addendum"
text_zh = "官方文本无逐请求零保留/不存储承诺，也无开通方式或企业附加条款"

[[product.zdr.point]]
text = "Contrary evidence: the store right in ToS §4.1(ii) and a DPA deletion obligation that bites only after termination. /trust, /security, /dpa and /enterprise return 404 and the main site stepfun.ai returns 503, so this is a retrieval gap."
text_zh = "反向证据：ToS §4.1(ii) 的 store 权能、DPA 删除义务仅在终止后。/trust、/security、/dpa、/enterprise 404，主站 stepfun.ai 503，属检索缺口。"

[[product.zdr.point]]
anchor = "dpa-security-measures"
text = "Contrary evidence (contract level; replaces the product page FAQ answer naming TLS 1.3 encryption, which cannot be captured): DPA §5 requires reasonable and appropriate technical and organizational measures, not no storage, so it is not a zero-retention commitment. The FAQ answer itself stays a pending-capture note."
text_zh = "反向证据（合同层；替代产品页 FAQ 里那句抓不到的 TLS 1.3 加密表述）：DPA §5 要求的是「reasonable and appropriate technical and organizational measures」，不是不存储，也不构成零保留承诺。该 FAQ 答案只作待抓回的记录。"

[[product.zdr.point]]
anchor = "dpa-processing-nature-debugging"
text = "Contrary evidence (contract level): DPA Schedule 1 Part B describes the nature of processing as collection, storage, organization and structuring of personal data as part of AI-powered functions, plus debugging to identify and repair errors — the contract-level counterpart of the product page's troubleshooting-analysis exception."
text_zh = "反向证据（合同层）：DPA Schedule 1 Part B 把处理性质写为「collection, storage, organization, and structuring of personal data as part of AI-powered functions」以及「debugging to identify and repair errors」——正是产品页排障分析例外在合同层的对应条款。"

[[product.zdr.point]]
anchor = "zdr-content-access-review-anytime"
text = "Contrary evidence: ToS §4.1(iii) — \"While we’re not required to do so, we may access, review, screen, edit, modify and delete your Content at any time and for any reason\" — with Content defined in §4 to include Prompts and Outputs, so content is presumed still accessible after the response, which is incompatible with zero retention."
text_zh = "反向证据：ToS §4.1(iii)「While we’re not required to do so, we may access, review, screen, edit, modify and delete your Content at any time and for any reason」，§4 定义 Content 含 Prompts/Outputs，即预设内容在响应后仍可被访问，与零保留不相容。"

[[product.zdr.point]]
text = "Cross-tier note on the same wording: the store right in ToS §4.1(ii) and the access right in §4.1(iii) sit in the platform ToS that this tier's paid agreement incorporates, and the sibling entry providers/stepfun-ai.toml marks the API tier zdr = \"no\" on exactly those clauses, while this tier stays unknown because its tier-specific texts (paid service agreement, product page) say nothing about retention and none of the sources listed in searched contains zero-retention / no-storage wording. The two readings are recorded side by side instead of being silently reconciled, and the clauses anchored here are contrary evidence only: they are not a statement about any zero-retention option in this tier."
text_zh = "同一措辞的跨档说明：ToS §4.1(ii) 的 store 权能与 §4.1(iii) 的访问权属于本档付费协议并入的平台 ToS，姊妹条目 providers/stepfun-ai.toml 正是拿这两条把 API 档判 zdr = no；本档维持 unknown，因为档位专属文本（付费协议、产品页）对保留只字未提，且 searched 列出的来源里都没有零保留/不存储表述。两档读法并列记录，不做静默调和；这里绑的条款只作反向旁证，不构成本档对零保留方案的表述。"

[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "retention-delete-30-days-after-termination"

[[product.retention.point]]
anchor = "retention-delete-30-days-after-termination"
text = "DPA §7: the 30 days is the window after termination or expiration of the Agreement in which StepFun must return or delete Customer Data — an upper bound on the deletion step, not a retention period for request content. Return is conditional: \"if requested by Customer within that period\", or self-service functionality allowing the Customer to do the same."
text_zh = "DPA §7：30 天是协议终止/到期后 StepFun 返还或删除 Customer Data 的窗口——删除动作的上限，不是请求内容的保留期。返还带条件：以 Customer 在该期间内提出请求为前提，或提供让 Customer 自行操作的自助功能。"

[[product.retention.point]]
anchor = "retention-delete-all-copies-exceptions"
text = "Deletion of all copies is not conditional on a request, and carries three exceptions: applicable law or regulatory requirements requiring storage, retention necessary to resolve a dispute between the parties, and retention necessary to combat harmful use of the Services."
text_zh = "删除全部副本不以请求为条件，但有三类例外：适用法或监管要求必须存储、为解决当事人之间的争议所必需、为打击服务滥用所必需。"

[[product.retention.point]]
anchor = "retention-no-outside-purpose"
text = "§2 prohibits retaining, using or disclosing Customer Personal Data outside the business purposes. No disclosed retention period for per-request Prompts/Outputs."
text_zh = "§2 禁止业务目的外的保留、使用或披露 Customer Personal Data。逐请求的 Prompt/Output 保留期未披露。"

[[product.retention.point]]
anchor = "retention-storage-limitation-legal"
text = "DPA Schedule 1 Part B sets no general retention period: storage limitation is defined only as \"compliance with legal retention requirements under applicable law\", so the contract layer points to statutory retention requirements instead of giving a ceiling for request content."
text_zh = "DPA Schedule 1 Part B 没有通用保留期限：Storage limitation 只定义为「compliance with legal retention requirements under applicable law」，合同层只指向法定保留要求，不给请求内容的期限上限。"

[[product.retention.point]]
anchor = "retention-deactivate-delete-anonymize"
text = "Privacy Policy §7 is at the personal-information level: deletion or anonymization on deactivation, deletion request or expiry of the retention period (phone number retained continuously, IP addresses 3 years) — not a period for request content."
text_zh = "隐私政策 §7 是个人信息层面的规则：注销、请求删除或保留期届满即删除或匿名化（手机号持续保留、IP 3 年）——不等于请求内容的期限。"

[[product.retention.point]]
anchor = "retention-personal-info-delete-exceptions"
text = "Two exceptions qualify that deletion: compliance with legal requirements regarding data retention according to the applicable laws, and extension of the period for financial, audit, dispute resolution, or other legitimate purposes."
text_zh = "该删除义务有两条例外：遵守适用法下的法定保留要求，以及为财务、审计、争议解决或其他正当目的延长保留期。"

[[product.retention.point]]
anchor = "dpa-processing-nature-debugging"
text = "DPA Schedule 1 Part B lists debugging to identify and repair errors among the nature of processing, with no period given. The product page FAQ answer that adds \"a limited amount of data under strict access control\" is client-rendered and absent from the snapshot, so it stays a pending-capture note rather than an anchor."
text_zh = "DPA Schedule 1 Part B 把「debugging to identify and repair errors」写进处理性质，未给期限。产品页 FAQ 补充「在严格访问控制下分析有限数据」的那条答案由客户端渲染、不在快照内，故只作待抓回的记录，不绑锚点。"

[product.processing_region]
codes = ["US"]
anchor = "region-servers-in-united-states"

[[product.processing_region.point]]
text = "§5「Our servers are located in the United States.」"

[[product.processing_region.point]]
text = "Cross-border transfers rely on Standard Contractual Clauses or compliant data transfer agreements (DPA §8 + Schedule 2 EU SCC Module 2/3, UK/Swiss addenda). The privacy policy version naming SPARKLING AI as contracting entity also states the United States, so the conclusion does not change with the version."
text_zh = "跨境依 SCC 或合规数据传输协议（DPA §8 + Schedule 2 EU SCC Module 2/3、UK/Swiss 附录）。签约主体 SPARKLING AI 那一版隐私政策同样写美国，结论不随版本变化。"

[product.role]
kind = "processor"
anchor = "role-customer-controller-stepfun-processor"

[[product.role.point]]
text = "DPA §2 \"Customer is the controller and StepFun is the processor\", processing only on Customer's instructions. Exception: under Privacy Policy §1.3(b), StepFun acts as controller in program scenarios"
text_zh = "DPA §2「Customer is the controller and StepFun is the processor」，仅按 Customer 指示处理。例外：隐私政策 §1.3(b) 项目场景下 StepFun 自任 controller"

[[product.role.point]]
text = "Individual account registration information is governed directly by the Privacy Policy (StepFun as controller). One more point on tier structure: Step Plan describes itself as aimed at \"individual developers and small teams\", while enterprise bulk purchases go through custom sales contracts (no public terms), so whether an enterprise custom version carries different data terms is undisclosed."
text_zh = "个人账户注册信息由隐私政策直接管辖（StepFun 为 controller）。档位结构上还有一条：Step Plan 自述面向「individual developers and small teams」，企业批量采购走销售定制（无公开条款），故企业定制版是否存在不同数据条款属未公开范围。"

