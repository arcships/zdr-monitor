[product.training]
mark = "yes"
mode = "default"
anchor = "training-license-program-scoped"

[[product.training.point]]
text = "Tier-specific product page FAQ: \"Your conversation data is not used to train our general models by default.\" (https://platform.stepfun.ai/step-plan, official_blog grade). Two limits: the sentence covers \"general models\" only, and the FAQ answer is client-rendered, so it is absent from the current snapshot (979f7f8db0d2b600) — this quote is not machine-checkable: it is kept as tier-specific secondary evidence, not as the dimension anchor, and the anchor that carried it was removed on 2026-09-23 (it had never matched any snapshot) while this source was switched to fetch = \"browser\" so the answer can be captured and the anchor re-added."
text_zh = "档位专属产品页 FAQ：「Your conversation data is not used to train our general models by default.」（https://platform.stepfun.ai/step-plan，official_blog 级）。两点限定：该句只覆盖「general models」；且 FAQ 答案由客户端渲染，当前快照（979f7f8db0d2b600）里没有答案正文，该引文不可机器复核，仅作档位专属旁证、不作维度锚点；其锚点已于 2026-09-23 移除（此前从未命中任何快照），本来源已改为 fetch = \"browser\"，待答案抓回后再重新绑锚。"

[[product.training.point]]
anchor = "training-license-program-scoped"
text = "Contract-grade support, stated as a scope inference rather than an explicit no-training wording: ToS §4.4 + §1.4 + the second paragraph of §4.1(ii) condition the training/fine-tuning license on participation in the StepFun Startup Program / Builder Program / early access projects, and Privacy Policy §1.3(b) points the same way. judgment.md asks for wording that keeps model training out; these clauses only bound the training right to programs, so mark = \"yes\" rests on that scope plus the tier-specific FAQ above."
text_zh = "contract 级佐证（属范围推断，不是明示「不训练」表述）：ToS §4.4 + §1.4 + §4.1(ii) 第二段把训练/微调授权限定为参与 StepFun Startup Program / Builder Program / early access 项目，隐私政策 §1.3(b) 同向。judgment.md 要求的是明确把模型训练挡在外面的表述，这些条款只是把训练权限制在项目范围内，故 mark = yes 由该范围读法加档位专属 FAQ 共同支撑。"

[[product.training.point]]
anchor = "training-license-for-avoidance"
text = "Contrary wording kept on record: the closing sentence of ToS §4.1(ii) — \"the license granted herein specifically includes the right to use Usage Data for training, fine-tuning, and otherwise improving StepFun’s artificial intelligence models and systems\" — is not scoped to programs on its face, and \"the license granted herein\" is ambiguous: it can be read as the broad license in the first paragraph of §4.1(ii) (copy, store, exploit, for any purpose) or as the program paragraph. The sibling entry providers/stepfun-ai.toml marks the API tier training = \"no\" on this same sentence."
text_zh = "反向表述保留在案：ToS §4.1(ii) 末句「the license granted herein specifically includes the right to use Usage Data for training, fine-tuning, and otherwise improving StepFun’s artificial intelligence models and systems」句面未限定项目，且「the license granted herein」指代待澄清：可读作 §4.1(ii) 第一段含 copy/store/exploit/for any purpose 的宽泛许可，也可读作项目段许可。姊妹条目 providers/stepfun-ai.toml 正是拿这一句把 API 档判成 training = no。"

[[product.training.point]]
anchor = "training-use-content-improve-services"
text = "Contrary wording kept on record: ToS §4.1(iv) lets Content (defined in §4 to include Prompts, Outputs and Feedback) be used to \"develop and improve our Services\" with no program limit — training under judgment.md, and a divergence from the program-only reading of §4.4 / §1.4."
text_zh = "反向表述保留在案：ToS §4.1(iv) 允许把 Content（§4 定义含 Prompts/Outputs/Feedback）用于「develop and improve our Services」，不设项目限定——按 judgment.md 算训练，与 §4.4 / §1.4 的「仅限项目」读法构成分歧。"

[[product.training.point]]
anchor = "training-improved-through-usage-data"
text = "Contrary wording kept on record: the §8.1 disclaimer states that the Services \"ARE CONTINUOUSLY EVOLVING AND MAY BE IMPROVED THROUGH THE USE OF USAGE DATA FOR MODEL TRAINING AND FINE-TUNING\", again with no program limit."
text_zh = "反向表述保留在案：§8.1 免责声明载明服务「MAY BE IMPROVED THROUGH THE USE OF USAGE DATA FOR MODEL TRAINING AND FINE-TUNING」，同样不限项目。"

[[product.training.point]]
anchor = "training-evaluate-improve-models"
text = "Contrary wording kept on record: Privacy Policy §2 lists \"To evaluate and improve our models, products, and services, where permitted by applicable law.\" as a general purpose, and the §12 legal-basis table maps it to End Users’ Interaction Information under \"Consent & Legitimate interests\" — no program limit, wider than the §1.3(b) program exception. Scope note: that Policy states it does not apply where StepFun acts as a data processor on behalf of a commercial customer, so the two wordings must not be read as one."
text_zh = "反向表述保留在案：隐私政策 §2 的通用用途清单含「To evaluate and improve our models, products, and services, where permitted by applicable law.」，§12 合法性基础表把它对应到 End Users’ Interaction Information | Consent & Legitimate interests，不限项目，比 §1.3(b) 的项目例外更宽。适用范围提醒：该政策声明其不适用于 StepFun 作为受托处理方为商业客户处理个人数据的情形，两条口径不可混读。"

[[product.training.point]]
text = "The tier's own paid service agreement contains no training clause at all, so every training statement above comes from the platform-level texts it incorporates."
text_zh = "本档专属付费协议完全不含训练条款，故以上训练表述全部来自它并入的平台级文本。"

