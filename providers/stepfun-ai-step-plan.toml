  "https://platform.stepfun.ai/legal/privacy-policy-en.html",
]

[[product.zdr.point]]
text = "No per-request zero-retention or no-storage commitment in the official texts, and no enablement path or enterprise addendum"
text_zh = "官方文本无逐请求零保留/不存储承诺，也无开通方式或企业附加条款"

[[product.zdr.point]]
text = "Contrary evidence: the store right in ToS §4.1(ii), a DPA deletion obligation that bites only after termination, and the FAQ's troubleshooting-analysis exception. /trust, /security, /dpa and /enterprise return 404 and the main site stepfun.ai returns 503, so this is a retrieval gap."
text_zh = "反向证据：ToS §4.1(ii) 的 store 权能、DPA 删除义务仅在终止后、FAQ 的排障分析例外。/trust、/security、/dpa、/enterprise 404，主站 stepfun.ai 503，属检索缺口。"

[product.retention]
days = 30
object = "mixed"
basis = "fixed_period"
anchor = "retention-delete-30-days-after-termination"

[[product.retention.point]]
text = "DPA §7: within 30 days of termination or expiration of the Agreement, all Customer Data is returned or deleted on request (exceptions: legal retention requirements, dispute resolution, anti-abuse)"
text_zh = "DPA §7：协议终止/到期后 30 天内应要求返还或删除全部 Customer Data（例外：法定留存要求、争议解决、反滥用）"

[[product.retention.point]]
text = "§2 prohibits retention outside the business purposes. No disclosed retention period for per-request Prompts/Outputs"
text_zh = "§2 禁止业务目的外的保留。逐请求的 Prompt/Output 保留期未披露"

[[product.retention.point]]
text = "Privacy Policy §7 states general rules at the personal-information level (phone numbers retained on an ongoing basis, IP addresses retained for 3 years, deletion or anonymization on account deactivation)"
text_zh = "隐私政策 §7 为个人信息层面的通用规则（手机号持续保留、IP 3 年、注销即删或匿名化）"

[[product.retention.point]]
text = "The product page FAQ acknowledges that a limited amount of data may be analyzed when diagnosing issues (no period given)."
text_zh = "产品页 FAQ 承认排障时可能分析有限数据（无期限）。"

[product.processing_region]
codes = ["US"]
anchor = "region-servers-in-united-states"

[[product.processing_region.point]]
text = "§5「Our servers are located in the United States.」"

[[product.processing_region.point]]
text = "Cross-border transfers rely on Standard Contractual Clauses or compliant data transfer agreements (DPA §8 + Schedule 2 EU SCC Module 2/3, UK/Swiss addenda). The privacy policy version naming SPARKLING AI as contracting entity also states the United States, so the conclusion does not change with the version."
text_zh = "跨境依 SCC 或合规数据传输协议（DPA §8 + Schedule 2 EU SCC Module 2/3、UK/Swiss 附录）。签约主体 SPARKLING AI 那一版隐私政策同样写美国，结论不随版本变化。"

[product.role]
kind = "processor"
anchor = "role-customer-controller-stepfun-processor"

[[product.role.point]]
text = "DPA §2 \"Customer is the controller and StepFun is the processor\", processing only on Customer's instructions. Exception: under Privacy Policy §1.3(b), StepFun acts as controller in program scenarios"
text_zh = "DPA §2「Customer is the controller and StepFun is the processor」，仅按 Customer 指示处理。例外：隐私政策 §1.3(b) 项目场景下 StepFun 自任 controller"

[[product.role.point]]
text = "Individual account registration information is governed directly by the Privacy Policy (StepFun as controller). One more point on tier structure: Step Plan describes itself as aimed at \"individual developers and small teams\", while enterprise bulk purchases go through custom sales contracts (no public terms), so whether an enterprise custom version carries different data terms is undisclosed."
text_zh = "个人账户注册信息由隐私政策直接管辖（StepFun 为 controller）。档位结构上还有一条：Step Plan 自述面向「individual developers and small teams」，企业批量采购走销售定制（无公开条款），故企业定制版是否存在不同数据条款属未公开范围。"

