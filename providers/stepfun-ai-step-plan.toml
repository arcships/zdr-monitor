[product.training]
mark = "yes"
mode = "default"
anchor = "stepplan-faq-not-used-for-training-by-default"

[[product.training.point]]
text = "Tier-specific product page FAQ: \"Your conversation data is not used to train our general models by default.\" (https://platform.stepfun.ai/step-plan, official_blog grade)"
text_zh = "档位专属产品页 FAQ：「Your conversation data is not used to train our general models by default.」（https://platform.stepfun.ai/step-plan，official_blog 级）"

[[product.training.point]]
text = "Contract-grade support is ToS §4.4 + §1.4 + the second paragraph of §4.1(ii) (the training license is conditioned on participation in the Startup Program / Builder Program / early access projects), with Privacy Policy §1.3(b) pointing the same way. Contrary wording kept on record: the broad worldwide/perpetual/irrevocable license in the first paragraph of ToS §4.1(ii) (covering store/exploit/for any purpose) and the training wording in §8.1, which is not scoped to programs. The paid service agreement itself has no training clause."
text_zh = "contract 级佐证为 ToS §4.4 + §1.4 + §4.1(ii) 第二段（训练授权以参与 Startup Program / Builder Program / early access 项目为前提）、隐私政策 §1.3(b) 同向。反向表述保留在案：ToS §4.1(ii) 第一段的 worldwide/perpetual/irrevocable 宽泛许可（含 store/exploit/for any purpose）与 §8.1 未限定项目的训练表述。付费协议自身无训练条款。"

