[[source]]
url = "https://platform.stepfun.ai/docs/en/agreement/dataprocess"
channel = "contract"
tier = "core"
note = "Data Processing Agreement（生效 2025-11-28），由 ToS §4.2 并入条款体系，适用于 Customer Data（经服务提交的全部数据，含 Customer Personal Data）。§2 定性协议角色（Customer=controller，StepFun=processor）并禁止业务目的外的 retain/use/disclose；§7 终止后 30 天内返还/删除及三类例外；Schedule 1 Part B 的 Storage limitation 仅指向「适用法下的法定保留要求」；§8 + Schedule 2 载 EU SCC Module 2/3 与 UK/Swiss 附录。本档（Step Plan 订阅）的付费协议并入平台 ToS，故 DPA 同样适用。role 与 retention 的 contract 级来源。"

[[source]]
url = "https://platform.stepfun.ai/docs/en/agreement/userprivacy"
channel = "enterprise_privacy_faq"
tier = "core"
note = "User Privacy（平台隐私政策，生效 2026-08-07，主体 STEPFUN TECHNOLOGY (HK) LIMITED）。§1.3 专门覆盖商业客户经 API 提交的数据（StepFun 为 processor），并载明「参与 Startup Program / early access 项目并共享 API 数据」时 StepFun 就该数据自任 controller 的例外；§5 服务器所在地与跨境机制；§7 个人信息保留期限（IP 3 年、手机号持续保留、注销或到期即删除/匿名化）。channel 取 enterprise_privacy_faq，与同源条目 stepfun-ai 保持一致。"

[[source]]
url = "https://platform.stepfun.ai/docs/en/agreement/userservice"
channel = "contract"
tier = "core"
note = "StepFun Open Platform 服务条款（Terms of Service，生效 2026-08-07，主体 STEPFUN TECHNOLOGY (HK) LIMITED）。本档付费协议（SPARKLING AI PTE. LTD.）把平台 ToS 与隐私政策并入自身，故本 ToS 是本档的 contract 级训练条款来源。§1.4 定义 Early Access（Startup Program / Builder Program / 其他合作项目），§4.1(ii) 第二段的训练/微调明示授权以参与上述项目为前提，§4.4「AI Training in Certain Programs」同向；§4.1(ii) 第一段则是未提训练、但含 store/exploit/for any purpose 的宽泛许可；§8.1 免责声明另有一句未限定项目的「MAY BE IMPROVED THROUGH THE USE OF USAGE DATA FOR MODEL TRAINING AND FINE-TUNING」。§4.2 把 DPA 并入条款体系（role/retention 的 contract 来源入口）。"

[[source]]
url = "https://platform.stepfun.ai/docs/en/step-plan/paid-service-agreement"
channel = "contract"
tier = "core"
note = "本档专属付费协议（StepPlan Paid Services Agreement，生效 2026-03-16；签约方 SPARKLING AI PTE. LTD.，与平台运营方 STEPFUN TECHNOLOGY (HK) LIMITED 不同一）。逐节核对：全文只覆盖订阅层级、计费与自动续费、限流配额、暂停终止、责任限制、仲裁；训练/保留/删除/ZDR/处理地/角色 0 命中，「数据」只出现在免责语境（data loss / data breaches）与「retain proof of purchase」。第 21 行自述本协议是 StepFun Open Platform 的 Terms of Services 与 Privacy Policy 的组成部分，且冲突时本协议就「与本服务相关的事项」优先——但它对数据事项完全沉默，故数据条款全部回落到平台 ToS / 隐私政策 / DPA。authoritative_for 置空：只作档位、签约主体与「无档位专属数据条款」的证据。"

[[source]]
url = "https://platform.stepfun.ai/step-plan"
fetch = "browser"
channel = "official_blog"
tier = "core"
note = "本档专属产品页（Step Plan 国际站落地页，含档位、计价与 FAQ）。FAQ 第 4 条「How is data security ensured?」是本档唯一一句厂商正向的数据承诺：「Your conversation data is not used to train our general models by default.」——比 ToS 的项目限定结构推断更直接，故本档 training 用它作档位专属佐证（channel=official_blog，低于 contract，不作 dimensions.source 的主源）。同答还给出加密（TLS 1.3）与「排障时可能在严格访问控制下分析有限数据」的例外。**抓取通道注意（2026-09-22 复核，仍未找到稳定源）**：该 FAQ 答案由客户端渲染，SSR HTML（65980B）只有问题、没有答案，答案文本只存在于该页加载的 i18n 包 /_next/static/chunks/*.js（键 common-problem.a4）。而 r.jina.ai 拒绝 JS：抓该 chunk 返回 HTTP 422「unexpected content type application/javascript」。旁路已逐一排除——/zh/step-plan 只回 shadow DOM 警告壳、?lang=zh-CN 与 www.stepfun.com/step-plan 均无 FAQ、/docs/llms-full.txt（684KB）与 /legal/step-plan-user-agreement.html 都不含该文案。故三条 FAQ 锚点（not-used-for-training-by-default、tls13-encryption、limited-analysis-for-diagnosis）在该通道下会持续落空——那是抓取通道问题，不是条款消失，不得据此改结论，也不得把锚点降级成非官方文本。**2026-09-23 处置**：这三条锚点已移除——verify-anchors 报告确认其引文在该来源的全部历史快照里一次都没命中过，无法机器复核；本来源改为 fetch = \"browser\"，待 JS 渲染后的 FAQ 答案进入快照再重新绑锚。training 的档位专属依据留在 point 文字里（维度锚点已是 contract 级 training-license-program-scoped），zdr/retention 原先引用该 FAQ 的两处改引 DPA 里可复核的条款。结论不因此改变（training 仍为 yes）。"

