[[product.training.point]]
text_zh = "Roo Code 这个牌子现在指开源扩展，云端产品叫 Roomote。Roomote 没有公布任何数据处理政策：roocode.com/legal 是个前端路由，渲染出来还是首页；docs 整站 sitemap 里没有 cloud、privacy、terms 任何一页；仓库里的 PRIVACY.md 只描述扩展自身的行为（API key 只存本机、PostHog 遥测不含代码和 prompt），全文未提及托管服务——那是沉默，不是排除。五列因此全部是「厂商未公开」，不是我们没查。"

[[product.training.point]]
text = "Scope note rather than an anchor for this tier: PRIVACY.md carries one vendor-level training statement, \"We do not train any models on your data.\" (line 14, under How We Use Your Data). That file is the extension's own privacy policy and describes the extension's data flows; the hosted Roomote service this tier covers is not mentioned anywhere in it. The sentence therefore constrains the extension tier only. The two tiers are separate, so it is recorded as a known vendor statement plus its scope, not bound as evidence for this tier, and the mark stays unknown."
text_zh = "适用范围说明，不作本档锚点：PRIVACY.md 里唯一的厂商级训练表态是第 14 行（How We Use Your Data 一节）的「We do not train any models on your data.」。该文件是扩展自身的隐私政策，讲的全是扩展的数据流，本档覆盖的托管 Roomote 服务全文未提及，故这句话只约束扩展档。两个档位不同，这里只把它登记为「已知的厂商表态 + 适用范围」，不绑成本档的证据，mark 维持 unknown。"

[[product.training.point]]
text = "Separate data stream collected by the vendor: telemetry. \"We use telemetry to understand feature usage and improve Roo Code.\" (line 12); the same section says the telemetry is powered by PostHog and covers the VS Code machine ID, feature usage patterns and exception reports, explicitly excludes personally identifiable information, your code and AI prompts, and can be turned off in settings. Under the project rule that service-improvement purposes count as training this would matter if the object were API inputs, but the object here is telemetry rather than prompts or code, so it neither supports nor contradicts a training statement about this tier and does not change the mark."
text_zh = "厂商自收的另一条数据流：遥测。第 12 行「We use telemetry to understand feature usage and improve Roo Code.」；同节写明遥测由 PostHog 承载，含 VS Code machine ID、功能使用模式与异常报告，明确不含个人可识别信息、你的代码与 AI prompt，且可在设置里关闭。按「用来改进服务/提高质量算训练」的口径，若对象是 API 输入就必须单独交代；但这里的对象是遥测数据而不是提示词或代码，故它既不支持也不否定本档的训练表态，不改变 mark。"

[[product.training.point]]
text_zh = "官方也没有公布 Cloud 的档次划分，所以按「不分档」收录。只有许可证里提到超过 10 个用户要 license key，那是自托管版的限制，不是云端的档位。"

