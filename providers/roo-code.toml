[[product.training.point]]
text_zh = "Roo Code 这个牌子现在指开源扩展，云端产品叫 Roomote。Roomote 没有公布任何数据处理政策：roocode.com/legal 是个前端路由，渲染出来还是首页；docs 整站 sitemap 里没有 cloud、privacy、terms 任何一页；仓库里的 PRIVACY.md 只讲扩展本身（API key 只存本机、PostHog 遥测不含代码和 prompt），明确不覆盖托管服务。五列因此全部是「厂商未公开」，不是我们没查。"

[[product.training.point]]
text_zh = "官方也没有公布 Cloud 的档次划分，所以按「不分档」收录。只有许可证里提到超过 10 个用户要 license key，那是自托管版的限制，不是云端的档位。"

