[[product.zdr.point]]
text = "Extension-side no-store statement, not a zero-retention commitment for this tier: \"We do not have access to or store this data, but AI providers may process it per their privacy policies.\" (PRIVACY.md line 7, under Commands). The object is the code and context of commands that the extension forwards to the AI model provider the customer selected (BYOK), and the same sentence hands that data to the upstream provider's own policy, which makes the upstream a separate hop that this statement cannot cover. It says nothing about Roomote's hosted infrastructure, so it is not a zero-retention option for this tier and the mark stays unknown. Note that the premise \"this tier routes inference through the customer's own key\" currently rests on our own product label, not on official text; the chain for the hosted tier has to be judged once a hosted-tier source is fetched."
text_zh = "扩展侧的不留存表述，不是本档的零保留承诺：PRIVACY.md 第 7 行（Commands 一节）「We do not have access to or store this data, but AI providers may process it per their privacy policies.」。对象是扩展把命令相关的代码与上下文发给客户自选的模型提供方（BYOK）；同一句把该数据交给上游厂商自己的政策处理，说明上游是另一跳，这句盖不住它。全句没有提到 Roomote 托管基础设施，因此不构成本档的零保留方案，mark 维持 unknown。另需注明：本档「推理走客户自己的 key」这一前提目前只有我们自己写的产品 label 为依据，不是官方文本；托管档的链路要等托管档来源抓回快照后再判。"
anchor = "roo-extension-no-store-commands"

[product.retention]
object = "mixed"
basis = "undisclosed"
searched = [
  "https://roocode.com/legal",
  "https://docs.roocode.com/sitemap.xml",
  "https://raw.githubusercontent.com/RooCodeInc/Roo-Code/main/PRIVACY.md",
]

[[product.retention.point]]
text = "Extension-side statement about command code and context: \"We do not have access to or store this data, but AI providers may process it per their privacy policies.\" (PRIVACY.md line 7). Object = the code and context of commands sent to the customer-selected model provider; context = the BYOK flow, where the data goes straight to that provider and whatever it keeps is governed by its own policy (the second hop of the chain). This describes the extension's own handling rather than Roomote's hosted infrastructure, so it is neither a retention period nor a zero-retention basis for this tier. The premise that this tier routes inference through the customer's own key comes from our own product label, not from official text."
text_zh = "扩展侧关于命令代码与上下文的表述：PRIVACY.md 第 7 行「We do not have access to or store this data, but AI providers may process it per their privacy policies.」。对象=发往客户自选模型提供方的命令代码与上下文；语境=BYOK，数据直接到该提供方，上游保留什么由其自身政策决定（链路第二跳）。它讲的是扩展自身的行为，不涉及 Roomote 托管基础设施，故既不构成本档的保留期限，也不构成零保留依据。本档「推理走客户自己的 key」这一前提来自我们自己写的 label，不是官方文本。"
anchor = "roo-extension-no-store-commands"

[[product.retention.point]]
text = "Prompts and project context: \"We do not store or process this data.\" (PRIVACY.md line 8, under Prompts & AI Requests). Object = prompts and the related project context sent to the customer-selected provider; the next sentence adds that those providers have their own privacy policies and may store data per their terms of service, i.e. the upstream is a separate hop. Same caveat as above: this describes the extension plus BYOK flow, so the object and context differ from the hosted tier, and this tier's object/basis stay as recorded until a hosted-tier source is fetched."
text_zh = "提示词与项目上下文：PRIVACY.md 第 8 行（Prompts & AI Requests 一节）「We do not store or process this data.」。对象=发往客户自选提供方的提示词与相关项目上下文；紧接的一句说明这些厂商有自己的隐私政策、可能按各自服务条款存储数据，即上游是另一跳。与上一条同样的限定：这句描述的是扩展 + BYOK 流程，对象与语境都与托管档不同，本档的 object/basis 在托管档来源抓回快照前保持不变。"
anchor = "roo-extension-no-store-prompts"

[[product.retention.point]]
text = "Extension indexing feature (customer-selected Qdrant): \"**Clear Index Data**: Deletes all data from the Qdrant collection and clears the local file cache.\" The same page states that vectors are stored in the Qdrant instance the customer chooses, that the customer controls where data lives, and that the action cannot be undone — a manual delete rather than an automatic expiry, and the vendor discloses no automatic expiry. This constrains the extension's indexing feature and the customer-side Qdrant only, so it is not evidence of a retention period for the hosted tier. The source stays core as the extension-side reference for this product line's retention and deletion objects."
text_zh = "扩展的索引功能（客户自选 Qdrant）：「**Clear Index Data**: Deletes all data from the Qdrant collection and clears the local file cache.」。同页写明向量存放在客户自己选的 Qdrant 实例、数据放在哪里由客户控制，且该操作不可撤销——是手动删除而非自动到期，官方未披露自动到期。它只约束扩展的索引功能与客户侧的 Qdrant，不构成托管档保留期限的证据。该来源仍保留为 core：它是本产品线扩展侧保留与删除对象的官方文本，也是托管档的对照来源。"
anchor = "roo-index-clear-data"

