[product.training]
mark = "yes"
mode = "default"
anchor = "gitee-ai-terms-7-2-no-training-input"

[[product.training.point]]
text = "The training-specific exclusion is terms §7.2 『在此明确，未经您的允许，我们不会使用您的内容作为人工智能模型训练的输入』, the same clause that carries the serverless-api tier. §7.1 『我们不会以本服务条款未允许的其他任何方式使用您的模型、数据集、应用等内容』 is a general limitation on the scope of use and contains no reference to training, so it is kept as a supporting point rather than as the basis of this verdict."
text_zh = "把「模型训练」单独排除的是 §7.2「在此明确，未经您的允许，我们不会使用您的内容作为人工智能模型训练的输入」，与按量 API 档同一句。§7.1「我们不会以本服务条款未允许的其他任何方式使用您的模型、数据集、应用等内容」是概括性的使用范围限制、不含「训练」字样，故只作旁证 point 保留，不再充当本档结论的锚点。"
anchor = "gitee-ai-terms-7-1-no-other-use"

[[product.training.point]]
text_zh = "§7.2 的例外句同样以「未经您的允许」为前提。本档另有大量把合规义务压给用户的条款（§4.1/§4.2 模型备案、§5.9 违法信息不得作训练语料、§6.10 应用采集使用者输入作训练语料须事前约定并给关闭选项）。"

[[product.training.point]]
text = "Opposite-direction clauses in the same terms, kept side by side and not reconciled: §8.3 『根据我们的隐私政策，我们可能会汇总、匿名化或以其他方式从与您使用我们网站和服务相关的数据中进行学习，并用其改进这些服务，您对此知晓并同意』 and §8.2 (a perpetual, irrevocable licence over 『反馈』 to commercialise it, improve the services and develop new products). Under docs/judgment.md (using data to improve the service counts as training) both are training-relevant, and §7.2 does not carve them out."
text_zh = "同一份条款里方向相反的两条，并列保留、不裁决：§8.3「根据我们的隐私政策，我们可能会汇总、匿名化或以其他方式从与您使用我们网站和服务相关的数据中进行学习，并用其改进这些服务，您对此知晓并同意」，以及 §8.2（对「反馈」的永久、不可撤销许可，可用于商业化利用反馈、改进服务、开发新产品）。按 docs/judgment.md「用来改进服务/提高质量算训练」，两条都属训练相关表述，且 §7.2 没有把它们排除在外。"
anchor = "gitee-ai-terms-8-3-learn-improve"

[[product.training.point]]
text = "Privacy policy §2 lists the purposes the collected information is used for; item 4 is 『评估、改善我们的服务』 and item 5 is 『出于业务运营或科学目的对服务或与之相关的任何主题进行分析或研究』. The list never mentions model training, but it does authorise service-improvement and research uses."
text_zh = "隐私政策 §2 的用途清单：第 4 项「评估、改善我们的服务」、第 5 项「出于业务运营或科学目的对服务或与之相关的任何主题进行分析或研究」。清单没有出现「模型训练」，但明确授权了服务改进与研究用途。"
anchor = "gitee-ai-privacy-2-4-improve-service"

[[product.training.point]]
text = "Ledger treatment: training=yes rests on §7.2 alone (the only training-specific exclusion in the documents); the §8.3/§8.2/privacy-§2 authorisations above point the other way and are recorded beside it, not adjudicated (docs/judgment.md: a vendor's own conflicting statements are kept side by side)."
text_zh = "本台账的处理：training=yes 只由 §7.2 支撑（全文唯一针对训练的排除）；上面 §8.3/§8.2/隐私政策 §2 三条方向相反，并列记录、不裁决（docs/judgment.md：厂商自己说法冲突时两条事实并列保留）。"

