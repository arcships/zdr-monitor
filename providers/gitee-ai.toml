[[product.retention.point]]
text_zh = "本档 retention 的对象是**用户存储的内容**，是五维度里唯一有量化天数的一档：§3.10 服务期限届满或终止后 90 天保留期（或另行约定期限），期满有权删除"

[[product.retention.point]]
text_zh = "§16.3 注销账号后「尽商业上的合理努力在 90 天内删除您自己的存储库」，但不删除他人制作的副本"

[[product.retention.point]]
text_zh = "§3.7 用户主动释放服务或删除内容即清除"

[[product.retention.point]]
text_zh = "§3.10 末尾同时保留「根据档案管理、恢复和备份流程、业界惯例以及隐私政策…留存您的内容和信息以符合法律法规要求的权利」。注意 90 天是**清理窗口/上限型表述**，不是「内容一定保留 90 天」。"

[[product.retention.point]]
text = "Not this tier's object either: privacy policy §4.2 『一般而言，我们仅在为实现目的所必需的最短时间内保留您的数据信息，但下列情况除外』 and §4.4 『我们会在提供服务、遵守任何适用的法律要求、维护安全和防止事件以及总体上追求我们的合法利益所需的时间内保留您的信息』 apply to the personal information collected under §1.1/§1.2 and carry no number of days. They are not the basis of this verdict (the 90-day window is) and they add no quantified period for API request bodies."
text_zh = "同样不是本档的对象：隐私政策 §4.2「一般而言，我们仅在为实现目的所必需的最短时间内保留您的数据信息，但下列情况除外」与 §4.4「我们会在提供服务、遵守任何适用的法律要求、维护安全和防止事件以及总体上追求我们的合法利益所需的时间内保留您的信息」针对的是 §1.1/§1.2 所收集的个人信息，且不含天数。它们不是本档结论的依据（本档依据是 90 天清理窗口），也没有为 API 请求正文提供任何量化期限。"
anchor = "gitee-ai-privacy-4-2-shortest-necessary"

[product.processing_region]
codes = ["CN"]
anchor = "gitee-ai-privacy-4-1-storage-in-cn"

[[product.processing_region.point]]
text_zh = "同顶层：条款层只承诺个人信息境内存储"

[[product.processing_region.point]]
text_zh = "「模型专属部署」独享算力的实际机房地域条款未披露。"

[[product.processing_region.point]]
text = "Qualification on the CN conclusion, from privacy policy §4.3: 『通过服务收集的个人信息可能会在公司或其附属公司、子公司存储和处理』, with §4.3.1/§4.3.2 adding affiliates (including entities joining the group on a change of control, merger, acquisition or sale) and third-party service providers, without naming any region for them. The storage-in-China commitment therefore covers the company and its servers; it does not rule out storage or processing by group companies elsewhere."
text_zh = "对 CN 结论的限定，出自隐私政策 §4.3：「通过服务收集的个人信息可能会在公司或其附属公司、子公司存储和处理」，§4.3.1/§4.3.2 进一步包括附属机构（含控制权变更、合并、收购或出售时并入集团的企业）与第三方服务提供商，且未限定地域。境内存储承诺覆盖的是公司及其服务器，不排除集团内其他主体在别处存储或处理。"
anchor = "gitee-ai-privacy-4-3-affiliates"

[product.role]
kind = "controller"
anchor = "gitee-ai-terms-7-4-private-repo-access"

[[product.role.point]]
text_zh = "§7.4 私有存储库保密义务同时保留「根据隐私政策中规定的条款访问或共享您的私人信息」的权利"

[[product.role.point]]
text_zh = "§4.1/§4.2 要求用户自行完成模型备案并自担使用责任——平台把自己定位为算力与存储的提供方，不承诺按用户指示处理。"

[[product.role.point]]
text = "Subcontracting: terms §17.3 『我们可以自行决定分包我们在本服务条款下的全部或部分义务，而无需通知您』, with the platform taking the same responsibility for a subcontractor's acts and omissions as for its own performance. No sub-processor list and no notice duty are published. Context for the role reading only — it does not on its own establish a processor designation."
text_zh = "分包：§17.3「我们可以自行决定分包我们在本服务条款下的全部或部分义务，而无需通知您」，且平台对分包商的作为和不作为承担与自身履行相同的责任。无公开子处理者清单，也无通知义务。此条只作角色口径的旁证，不据此单独推出 processor 定性。"
anchor = "gitee-ai-terms-17-3-subcontract-no-notice"

