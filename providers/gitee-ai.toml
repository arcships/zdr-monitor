[[product.role.point]]
text = "Both international documents were read line by line this round and neither designates Moark as a processor or a controller — there is no controller/processor wording and no DPA. The two clauses that bear on the data relationship are the IP clause and the confidentiality clause below; neither is a role designation, so the role stays unknown."
text_zh = "本轮逐条核过国际站两份文本，都没有把 Moark 定性为受托处理者或独立控制者——没有 controller/processor 用语，也没有 DPA。与数据关系相关的只有下面两条（IP 条与无保密义务条），两条都不构成角色定性，故仍记 kind=unknown。"

[[product.role.point]]
