text_zh = "服务条款 Confidentiality Restrictions：「The parties will have no confidentiality obligations to each other unless otherwise agreed in writing.」——国际站不把 Prompts/Inputs 置于保密义务之下，因此也不能从保密义务推出保留期限。（国内站是另一实体、另一文本，本条不适用。）"
