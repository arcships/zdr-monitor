text = "Terms, Services section: 『The Company may monitor your use of the Services to assess compliance with this Agreement and the quality of operations of the Services and to make improvements to the Services.』 Under docs/judgment.md (using data to improve the service counts as training) this is a training-relevant authorisation, and neither international document excludes model training."
text_zh = "服务条款 Services 节：「The Company may monitor your use of the Services to assess compliance with this Agreement and the quality of operations of the Services and to make improvements to the Services.」——按 docs/judgment.md「用来改进服务/提高质量算训练」属训练相关授权，而国际站两份文本都没有把模型训练排除在外，故本档记 training=no（条款授权、无开关）。"
anchor = "moark-ai-terms-monitoring-improve"

[[product.training.point]]
text = "Privacy policy, Service Enhancement: 『To improve user experience and maintain security, we may gather network logs, usage frequency, crash reports, usage scenarios, and performance metrics. This data helps us optimize the Platform and enhance service quality.』"
text_zh = "隐私政策 Service Enhancement 条：「To improve user experience and maintain security, we may gather network logs, usage frequency, crash reports, usage scenarios, and performance metrics. This data helps us optimize the Platform and enhance service quality.」——服务改进/优化用途的明文表述。"
anchor = "moark-ai-privacy-service-enhancement"

[[product.training.point]]
text = "The only sentence about training itself concerns third-party sources rather than user Prompts/Inputs: privacy policy 『We may collect publicly available data from internet sources to train our models and deliver our services.』 The terms also describe the service scope as programmatic APIs and web interfaces to host, use, fine tune and train large AI models. There is no commitment anywhere that user Prompts/Inputs are not used for training."
text_zh = "唯一直接提到训练的句子针对的是互联网公开数据而非用户 Prompts/Inputs：隐私政策「We may collect publicly available data from internet sources to train our models and deliver our services.」；服务条款把服务范围写成 host/use/fine tune/train 大模型。国际站对 Prompts/Inputs 不用于训练没有任何承诺。"
anchor = "moark-ai-privacy-public-data-train"

[[product.training.point]]
text = "Scope of this round's check: both international documents (terms and privacy policy) were read line by line, which is why this verdict is no longer recorded as unknown — the monitoring and service-enhancement clauses are statements about this dimension, and under the ledger rule a verdict that quotes the record cannot also say no wording was found."
text_zh = "本轮核查范围：国际站两份文本（服务条款与隐私政策）已逐条核过，故本档不再记 unknown——monitoring 与 Service Enhancement 两条都是针对本维度的表述，按台账规则「绑了引文就不能判 unknown」。"

