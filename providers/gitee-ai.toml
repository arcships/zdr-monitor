[[product.role.point]]
text = "§四.1: 『为识别设备身份，我们可能收集硬件序列号、MAC 地址、系统版本号』, and with your authorisation crash records 『以改进性能』 — device identifiers collected for the vendor's own device-identification purpose, which is what this tier's controller reading rests on. The agreement names no controller/processor role, so this is an interpretation (confidence medium). The definition of 『模力方舟（Moark）』 in the glossary says only who provides the MaaS platform; it is not a statement about data-processing roles and is no longer bound to this verdict."
text_zh = "§四.1：「为识别设备身份，我们可能收集硬件序列号、MAC 地址、系统版本号」，并在您授权下收集系统崩溃记录「以改进性能」——为厂商自身的设备识别目的收集设备标识，这是本档记 controller 的依据。协议没有出现控制者/处理者定性，属解释性结论（置信度 medium）。术语表对「模力方舟（Moark）」的定义只说明 MaaS 平台由谁提供，不含任何数据处理角色定性，故不再绑在本条。"
anchor = "pocketclaw-4-1-device-info-collection"

[[product.role.point]]
text = "§四.2 third-party scenario: 『您的数据将直接发送至该第三方服务商。』 with 『关于此类数据的处理规则，请您务必阅读并认可该第三方服务商的隐私政策，我们对第三方服务商的行为不承担法律责任。』 The third-party hop is a relationship the user forms directly with that provider; the platform does not act as a processor for it."
text_zh = "§四.2 第三方场景：「您的数据将直接发送至该第三方服务商。」「关于此类数据的处理规则，请您务必阅读并认可该第三方服务商的隐私政策，我们对第三方服务商的行为不承担法律责任。」——第三方那一跳由用户与第三方直接建立关系，平台不充当受托方。"
anchor = "pocketclaw-4-2-third-party-no-liability"

[[product.role.point]]
text_zh = "官方服务场景（本公司自己的模力方舟 MaaS）由本公司提供，§四.1 的收集行为与 §四.2 的第三方免责是全文与角色相关的两条表述；除此之外协议没有任何角色定性，也没有公开 DPA。《模力方舟服务条款》§17.3 的分包条不在本档适用范围内——本档由《PocketClaw 用户协议与隐私政策》管辖，该协议 §五.1 把模力方舟的服务条款另行指向别处文本。"

