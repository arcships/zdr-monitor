[product.training]
mark = "yes"
mode = "default"
anchor = "gitee-ai-terms-7-2-no-training-input"

[[product.training.point]]
text = "The only clause that puts model training itself outside is terms §7.2: 『在此明确，未经您的允许，我们不会使用您的内容作为人工智能模型训练的输入』. It is a conditional negative — the gate is 『未经您的允许』 — and the clause does not say how that permission is obtained, whether it can be withdrawn, or whether a switch exists."
text_zh = "全文只有 §7.2 这一句把「模型训练」本身单独排除：「在此明确，未经您的允许，我们不会使用您的内容作为人工智能模型训练的输入」。它是以「未经您的允许」为前提的条件式否定，条款没写「允许」如何取得、能否撤回、有无开关。"
anchor = "gitee-ai-terms-7-2-no-training-input"

[[product.training.point]]
text = "Opposite-direction clause in the same terms, kept side by side and not reconciled: §8.3 『根据我们的隐私政策，我们可能会汇总、匿名化或以其他方式从与您使用我们网站和服务相关的数据中进行学习，并用其改进这些服务，您对此知晓并同意』. The object is data related to your use of the website and services, the use is learning plus service improvement; under docs/judgment.md (using data to improve the service counts as training) this is a training-relevant authorisation, and §7.2 does not carve it out."
text_zh = "同一份条款里方向相反的一条，并列保留、不裁决：§8.3「根据我们的隐私政策，我们可能会汇总、匿名化或以其他方式从与您使用我们网站和服务相关的数据中进行学习，并用其改进这些服务，您对此知晓并同意」。对象是「与您使用我们网站和服务相关的数据」，用途是「学习 + 改进服务」——按 docs/judgment.md「用来改进服务/提高质量算训练」，这属训练相关表述，且 §7.2 没有把它排除在外。"
anchor = "gitee-ai-terms-8-3-learn-improve"

[[product.training.point]]
text = "§8.2 gives the platform a perpetual, irrevocable, worldwide, royalty-free, non-exclusive licence over any 『反馈』 you provide about the website or service — to commercialise the feedback, improve the services, and develop and/or commercialise new products. Feedback is information the user supplies about use, operation, performance or features, and the clause does not exclude feedback that contains user input."
text_zh = "§8.2 对「反馈」给出永久、不可撤销、全球性、免费的许可：可用于商业化利用反馈、改进我们的服务、开发和/或商业化新产品。对象是用户就网站/服务的使用、操作、性能或功能提供的反馈，条款没有把含用户输入内容的反馈排除在外。"
anchor = "gitee-ai-terms-8-2-feedback-license"

[[product.training.point]]
text = "Privacy policy §2 lists the purposes the collected information is used for; item 4 is 『评估、改善我们的服务』 and the section opens with 『若我们超出以下用途使用您的信息，我们将再次向您进行说明，并征得您的同意』. The list never mentions model training, but it does authorise service-improvement uses."
text_zh = "隐私政策 §2 的用途清单里，第 4 项是「评估、改善我们的服务」；同节开头写「若我们超出以下用途使用您的信息，我们将再次向您进行说明，并征得您的同意」。清单没有出现「模型训练」，但明确授权了服务改进用途。"
anchor = "gitee-ai-privacy-2-4-improve-service"

[[product.training.point]]
text = "Item 5 of the same list authorises analysis or research on the services or on any subject related to them, for business-operation or scientific purposes."
text_zh = "同一清单第 5 项：「出于业务运营或科学目的对服务或与之相关的任何主题进行分析或研究。」"
anchor = "gitee-ai-privacy-2-5-research"

[[product.training.point]]
text = "Ledger treatment: training=yes rests on §7.2 alone (the only training-specific exclusion in the documents); the §8.3, §8.2 and privacy-§2 authorisations above point the other way and are recorded beside it, not adjudicated (docs/judgment.md: a vendor's own conflicting statements are kept side by side). 『默认不用于模型迭代训练』 comes from the PocketClaw AI safety statement, a different tier, and only counts as circumstantial evidence."
text_zh = "本台账的处理：training=yes 只由 §7.2 支撑（全文唯一针对训练的排除）；上面 §8.3/§8.2/隐私政策 §2 三条方向相反，并列记录、不裁决（docs/judgment.md：厂商自己说法冲突时两条事实并列保留）。「默认不用于模型迭代训练」那句来自 PocketClaw 的 AI 安全声明，属另一档位，只能作旁证。"

