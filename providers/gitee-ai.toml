[product.retention]
object = "input_output"
basis = "undisclosed"

[[product.retention.point]]
text_zh = "同顶层 retention：API 请求正文保留期未披露"

[[product.retention.point]]
text = "The 90-day clauses previously bound here are about another object and are no longer bound to this verdict: terms §3.10 『您应当在 90 天的保留期（或者我们和您特别约定的期限）内完成内容清理或迁移』 and §16.3 govern content the user stores — the repositories a user must clean up or migrate when the service term ends or the account is closed — not the retention of API request bodies. They stay bound to the model-hosting tier, where user-stored content is the object. Readers must not read the 90 days as an API input/output retention period."
text_zh = "原先绑在本条的 90 天条款对象不对，故不再绑在本条：§3.10「您应当在 90 天的保留期（或者我们和您特别约定的期限）内完成内容清理或迁移」与 §16.3 约束的是用户自己存储的内容（服务期满或注销账号时的清理窗口），不是 API 请求正文的保留期。它们仍绑在 model-hosting 档（那一档的对象才是用户存储的内容）。不能把这 90 天读成 API 输入输出的保留期。"

[[product.retention.point]]
text = "Privacy policy §4.2 『一般而言，我们仅在为实现目的所必需的最短时间内保留您的数据信息，但下列情况除外』 (exceptions: laws and regulations, court rulings, government enforcement) is the only retention wording in the documents, and its object is the personal information the policy collects — §1.1/§1.2 list nicknames, phone numbers, emails, usernames, passwords, images, log/device/location data, contacts and cookie data, and never list API inference inputs or outputs. It gives no number of days and does not cover this verdict's object."
text_zh = "隐私政策 §4.2「一般而言，我们仅在为实现目的所必需的最短时间内保留您的数据信息，但下列情况除外」（例外：法律法规、法院判决、政府执法）是全文仅有的保留期表述，对象是政策所收集的个人信息——§1.1/§1.2 列举的是昵称、手机号、邮箱、用户名、密码、图片、日志/设备/位置信息、通讯录与 Cookie，没有把 API 推理输入输出列为收集对象。它不含天数，也不覆盖本结论的对象。"
anchor = "gitee-ai-privacy-4-2-shortest-necessary"

[[product.retention.point]]
text = "Privacy policy §4.4 『我们会在提供服务、遵守任何适用的法律要求、维护安全和防止事件以及总体上追求我们的合法利益所需的时间内保留您的信息』 is an as-needed wording with no number of days, and its object is likewise 『您的信息』 (personal information), not API request bodies."
text_zh = "隐私政策 §4.4「我们会在提供服务、遵守任何适用的法律要求、维护安全和防止事件以及总体上追求我们的合法利益所需的时间内保留您的信息」是按需保留型表述、无天数，对象同样是「您的信息」（个人信息），不是 API 请求正文。"
anchor = "gitee-ai-privacy-4-4-retention-purpose"

[[product.retention.point]]
text = "Access and metering logs: privacy policy §1.2.1 collects 『服务日志信息（如会话日期、地点、IP 地址等）』 and terms §8.8 says the platform owns the rights in the information and data it records about your use of the service (log, metering and billing, service-enquiry information). Neither gives any number of days, and the documents contain no 『network logs kept at least six months』 floor of the kind common on Chinese sites."
text_zh = "访问与计量日志：隐私政策 §1.2.1 收集「服务日志信息（如会话日期、地点、IP 地址等）」，服务条款 §8.8 声明平台对「您使用我们的服务而产生的由我们记录的信息和数据，例如日志信息、计量和费用信息、服务咨询信息」拥有权益。两者都没有给出保留天数，全文也没有国内站常见的「相关网络日志不少于六个月」下限表述。"
anchor = "gitee-ai-terms-8-8-logs-owned-by-platform"

[[product.retention.point]]
text_zh = "提示词缓存与异步任务产物的保留期文档未写，属本档 retention 的已知空白。"

[product.processing_region]
codes = ["CN"]
anchor = "gitee-ai-privacy-4-1-storage-in-cn"

[[product.processing_region.point]]
text_zh = "同顶层 processing_region：个人信息境内存储，无出境条款"

[[product.processing_region.point]]
text_zh = "国际站 moark.ai 属另一实体。"

[[product.processing_region.point]]
text = "Qualification on the CN conclusion, from privacy policy §4.3: 『通过服务收集的个人信息可能会在公司或其附属公司、子公司存储和处理』, and §4.3.1/§4.3.2 add affiliates (including entities that become part of the group on a change of control, merger, acquisition or sale) and third-party service providers. The clause names no region for those affiliates, so the storage-in-China commitment covers the company and its servers and does not rule out storage or processing by group companies elsewhere. §8 of the same policy lists only analytics/SMS/payment vendors (百度统计、神策数据、SendCloud、云片、支付宝/微信支付) and no model or compute provider."
text_zh = "对 CN 结论的限定，出自隐私政策 §4.3：「通过服务收集的个人信息可能会在公司或其附属公司、子公司存储和处理」，§4.3.1/§4.3.2 进一步包括附属机构（含控制权变更、合并、收购或出售时并入集团的企业）与第三方服务提供商，且未对这些关联方限定地域——即境内存储承诺覆盖的是公司及其服务器，不排除集团内其他主体在别处存储或处理。同政策 §8 的第三方名单只有统计/短信/支付类（百度统计、神策数据、SendCloud、云片、支付宝/微信支付），未列任何模型或算力供应商。"
anchor = "gitee-ai-privacy-4-3-affiliates"

[product.role]
kind = "controller"
anchor = "gitee-ai-terms-8-8-logs-owned-by-platform"
searched = [
  "https://ai.gitee.com/docs/appendix/terms",
  "https://ai.gitee.com/docs/appendix/privacy",
  "https://ai.gitee.com/docs/appendix/terms-privacy",
  "https://ai.gitee.com/docs/appendix/dpa",
]

[[product.role.point]]
text = "Neither the terms nor the privacy policy designates the platform as a processor or a controller: the only role-like wording in the privacy policy is 『个人信息保护团队和个人信息保护负责人』, which is a PIPL compliance role, not a controller/processor designation. The clauses that come closest all describe processing for the platform's own purposes: §8.8 『您使用我们的服务而产生的由我们记录的信息和数据，例如日志信息、计量和费用信息、服务咨询信息，我们拥有相应的权益』 with 『您不得也不会主张对于这些信息和数据的权利』; §7.4 『我们可能会根据我们的隐私政策中规定的条款访问或共享您的私人信息』; §11.2 (it may disclose your identity information to a rights holder when handling an infringement complaint). Recorded as controller on that basis — this is an interpretation drawn from the platform's own data rights and the absence of any processor commitment, not a designation in the text (confidence medium)."
text_zh = "服务条款与隐私政策都没有把平台定性为受托处理者或独立控制者：隐私政策里唯一近似角色的表述是「个人信息保护团队和个人信息保护负责人」（PIPL 合规角色，不是控制者/处理者定性）。最接近的几条都描述「为平台自身目的处理」：§8.8「您使用我们的服务而产生的由我们记录的信息和数据，例如日志信息、计量和费用信息、服务咨询信息，我们拥有相应的权益」并写「您不得也不会主张对于这些信息和数据的权利」；§7.4「我们可能会根据我们的隐私政策中规定的条款访问或共享您的私人信息」；§11.2（处置侵权投诉时有权向权利人披露您的身份信息）。据此记 controller——这是从平台自身数据权益与「无任何受托承诺」推出的解释性结论，不是原文定性（置信度 medium）。"
anchor = "gitee-ai-terms-8-8-logs-owned-by-platform"

[[product.role.point]]
text = "§7.4 only promises that reasonable and appropriate measures will be taken to keep private repositories confidential, while keeping the right to access or share private information under the privacy policy — an access right, not a processor undertaking."
text_zh = "§7.4 私有存储库条款只承诺「采取合理和适当的措施来保护您的内容保密」，同时保留按隐私政策访问或共享私人信息的权利——是访问权，不是受托处理承诺。"
anchor = "gitee-ai-terms-7-4-private-repo-access"

[[product.role.point]]
text = "Subcontracting: terms §17.3 『我们可以自行决定分包我们在本服务条款下的全部或部分义务，而无需通知您』, with the platform taking the same responsibility for a subcontractor's acts and omissions as for its own performance. There is no published sub-processor list and no notice duty. This is context for the role reading only — it does not on its own establish a processor designation."
text_zh = "分包：§17.3「我们可以自行决定分包我们在本服务条款下的全部或部分义务，而无需通知您」，且平台对分包商的作为和不作为承担与自身履行相同的责任。无公开子处理者清单，也无通知义务。此条只作角色口径的旁证，不据此单独推出 processor 定性。"
anchor = "gitee-ai-terms-17-3-subcontract-no-notice"

[[product.role.point]]
text_zh = "同顶层 role：自述中立平台，保留内容访问/删除权与日志权益，无 processor 定性、无公开 DPA。原绑在本条的 §17.8 只是文件冲突时的效力优先顺序，不含任何数据处理角色定性，故不再绑在本条。"

