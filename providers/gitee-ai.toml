[[source]]
url = "https://ai.gitee.com/docs/appendix/privacy"
channel = "consumer_privacy"
tier = "core"
note = "《模力方舟隐私政策》（jina 报 Published Time 2026-09-18），主体同上（深圳奥思研工）。它被服务条款 §10 以「我们将根据我们的隐私政策提供服务」并入协议，且自称「本政策是《模力方舟服务条款》的一部分」。但文本对象是「个人信息」：§1.1 主动提供的信息只列举昵称/手机号/邮箱/用户名/密码/图片，§1.2 只列举日志信息、位置信息、通讯录、第三方分享信息、Cookie，**没有把 API 推理的输入/输出正文单独列为收集对象**——这是与 moark.ai 国际站隐私政策最明显的差别（国际站明列 Prompts/Inputs/Outputs）。§4.1 境内存储；§4.2/§4.4 目的必需/最短必要保留；§4.3 允许关联公司与子公司存储处理；§8 第三方服务提供商名单只有百度统计、神策数据、SendCloud、云片、支付宝/微信支付，**未列任何模型原厂、推理算力供应商或云厂商**。全文无 ZDR、无「出境/跨境传输」条款、无个人信息处理者/受托处理者定性、无请求级保留天数。"

[[source]]
url = "https://ai.gitee.com/docs/appendix/terms"
channel = "contract"
tier = "core"
note = "《模力方舟服务条款》（jina 报 Published Time 2026-09-18），签约主体「深圳奥思研工智能科技有限公司」（§0.1），范围覆盖模力方舟平台全部服务：模型/数据集/应用的存储库托管、模型引擎、无服务器推理引擎、以及模型广场的按量推理 API（§0.13 给「推理应用程序编程接口（API）」下定义，§2.1(7) 给「无服务器推理引擎」下定义）。本档=按量 API 档，全文没有订阅套餐/Coding Plan 的专用条款，也没有企业版专用条款（§17.8 只预留了「订单/工作范围/补充条款」的优先位，这些文件未公开）。关键位置：§7.1「我们不会以本服务条款未允许的其他任何方式使用您的模型、数据集、应用等内容」、§7.2 训练例外句、§0.17「内容」定义（含「生成的」材料）、§3.1 用户对内容负责、§3.7/§3.10/§16.3 内容保留与删除、§8.8 日志与计量数据权益归平台、§17.7/§17.8 完整协议与冲突优先顺序。全文出现「训练」19 次，其中 §5.9/§5.11/§5.16/§6.3/§6.4/§6.10 全部是要求**用户**（作为数据集/应用提供者）履行合规义务，只有 §7.2 是平台对**自己**的约束。全文无「零数据保留/ZDR/不落盘/请求处理完成后不保留」，无请求级保留期，也没有国内站常见的「相关网络日志不少于六个月」下限表述。本条款不覆盖 PocketClaw 硬件（另有附录《PocketClaw 用户协议与隐私政策》），也不覆盖国际站 moark.ai。"

[[source]]
url = "https://ai.gitee.com/docs/appendix/terms-privacy"
channel = "contract"
tier = "core"
note = "《PocketClaw 用户协议与隐私政策》（页内版本生效日期：二〇二六年〇四月〇一日；落款深圳奥思研工智能科技有限公司）。覆盖档位是**PocketClaw 硬件+软件产品**，不是 API 档；但 §四.2「云端交互与 AI 算力 → 官方服务（模力方舟）」是本家目前唯一一处对模力方舟 MaaS 的实体性承诺：「该等数据仅用于实时推理，除非获得您的显式授权或法律法规要求，我们不会对您的对话内容进行持久化存储，亦不会将其用于模型训练」。读法边界：①承诺对象是「本公司提供的模力方舟算力服务」，触发场景是 PocketClaw 经官方服务调用 MaaS；②直接用 API Key 调 ai.gitee.com 的用户并未签署本协议，本协议 §五.1 反而把「模力方舟服务条款」指向 moark.com/docs/appendix/terms；③同节对第三方大模型 API（通义千问、DeepSeek 等）写「我们不会中转或留存该等数据」——这是 PocketClaw 作为接入方不留存，不是第三方不留存。因此本条是 zdr 维度最接近的书面证据，但不能当作按量 API 档的 ZDR 承诺。"

[[source]]
url = "https://moark.ai/docs/appendix/privacy"
channel = "consumer_privacy"
tier = "core"
note = "**国际站** MoArk 隐私政策，主体是 Moark, Inc.（与国内站深圳奥思研工是不同法律实体、不同文本）。它明列收集对象包含「your text inputs, prompts, uploaded files, feedback … chat history …（Prompts/Inputs）」以及据此生成的 Outputs，另写「We may collect publicly available data from internet sources to train our models」。全文**没有**保留期限章节、没有对用户输入不用于训练的承诺、没有 ZDR。本条目（gitee-ai）不采用它作为结论依据；列出是为了说明国内站/国际站政策不同源，国际站应另建 provider 条目。"

[[source]]
url = "https://moark.ai/docs/appendix/terms"
channel = "contract"
tier = "core"
note = "**国际站** MoArk 服务条款，主体「Moark Inc., a Delaware corporation」（Delaware 公司），服务范围含 programmatic APIs 与 host/use/fine tune/train 大模型，另有条款说明第三方模型自带条款、冲突时模型条款优先。与国内站《模力方舟服务条款》（深圳奥思研工、受中国法律管辖）是两套独立文本，不得混用。"

