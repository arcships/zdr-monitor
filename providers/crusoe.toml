[product.training]
mark = "yes"
anchor = "sst-v50-processing-and-storage-inputs-outputs"
mode = "default"

[[product.training.point]]
text = "Direct-access tier conclusion: not used for training by default, available only after the customer explicitly opts in. The authoritative clause is \"Processing and Storage of Inputs and Outputs\" in the Crusoe Intelligence Foundry Terms within Service Specific Terms v5.0: \"Crusoe does not store Inputs and Outputs to disk…\" plus \"We do not use Inputs or Outputs to train Models or improve our Services without Customer's explicit opt-in consent.\""
text_zh = "直连档结论：默认不用于训练，仅在客户明确 opt-in 后可用。权威条款＝Service Specific Terms v5.0 内 Crusoe Intelligence Foundry Terms 的「Processing and Storage of Inputs and Outputs」：「Crusoe does not store Inputs and Outputs to disk…」＋「We do not use Inputs or Outputs to train Models or improve our Services without Customer's explicit opt-in consent.」"

[[product.training.point]]
text = "On the fine-tuning side there is also \"We do not use Training Data to train Models or improve our Services without Customer's explicit opt-in consent.\" Platform-level comparison: Cloud Platform TOS v1.10 \"Protection of Customer Data\" — Crusoe will only access or use Customer Data to provide the Services and TSS or as instructed by the customer and \"will not use it for any other Crusoe products, services, or advertising\". The official product page also says \"zero data sharing… never used to improve shared or third-party models\" (official_blog grade, not used as primary evidence). Undisclosed: how opt-in is given and withdrawn, which model or corpus opted-in data enters, and how long opted-in data is kept."
text_zh = "微调侧另有「We do not use Training Data to train Models or improve our Services without Customer's explicit opt-in consent.」。平台层对照＝Cloud Platform TOS v1.10「Protection of Customer Data」：Crusoe 只会为提供服务/TSS 或依客户指示访问或使用 Customer Data，「will not use it for any other Crusoe products, services, or advertising」。官方产品页亦称「zero data sharing…never used to improve shared or third-party models」（official_blog 档，不作主证据）。未披露：opt-in 的申请与撤回方式、opt-in 后数据进入哪个模型或语料、opt-in 数据的保留期限。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "sst-v50-processing-and-storage-inputs-outputs"

[[product.zdr.point]]
text = "Reading (the main divergence from the old record): the terms do commit that inputs and outputs are not written to disk, are cached in memory only, and are cleared when the instance is deleted — request-level non-persistence by default design"
text_zh = "口径（与旧记录的主要分歧）：条款层确实承诺输入输出不落盘、仅内存缓存、实例删除即清空，这是默认设计上的请求级不持久化"

[[product.zdr.point]]
text = "But Crusoe has never made a commitment under the name ZDR / zero retention / zero data retention — those words appear nowhere in the Cloud TOS, AUP, DPST, Cloud Platform Privacy Notice, SST or Website terms, and there is no ZDR switch, application path or approval process. Clauses pointing the other way remain: the Cloud Platform TOS reserves the right to \"investigate any potential violation of the AUP…may include reviewing Customer Applications or Customer Data\", DPST v1.3 has a law-enforcement request exception, and SST v4.0 used to state expressly that Crusoe could delete or block Inputs/Outputs in abuse or infringement investigations (the current v5.0 has removed that paragraph, the right now resting on the investigation clause in the Cloud TOS and on the AUP). URLs checked this round, none of which contains ZDR wording: legal.crusoe.ai/, legal.crusoe.ai/open-router, legal.crusoe.ai/#data-processing, legal.crusoe.ai/#service-specific-terms, trust.crusoe.ai, trust.crusoe.ai/subprocessors, trust.crusoe.ai/controls, trust.crusoe.ai/faq, docs.crusoecloud.com/llms.txt, docs.crusoecloud.com/managed-ai/overview, docs.crusoecloud.com/serverless-inference/overview, docs.crusoecloud.com/identity-and-security, www.crusoe.ai/cloud/managed-inference, www.crusoe.ai/cloud/serverless-fine-tuning."
text_zh = "但 Crusoe 从未以 ZDR / 零保留 / zero data retention 的名义作出承诺——Cloud TOS、AUP、DPST、Cloud Platform Privacy Notice、SST、Website 条款里都没有这些字样，也没有 ZDR 开关、申请入口或审批流程。相反方向的条款仍在：Cloud Platform TOS 保留「investigate any potential violation of the AUP…may include reviewing Customer Applications or Customer Data」，DPST v1.3 有执法请求例外，SST v4.0 曾明写 Crusoe 有权在滥用/侵权调查中删除或屏蔽 Inputs/Outputs（现行 v5.0 已删除该段，该权利改由 Cloud TOS 的调查条款与 AUP 承接）。本轮查过、均未发现 ZDR 表述的 URL：legal.crusoe.ai/、legal.crusoe.ai/open-router、legal.crusoe.ai/#data-processing、legal.crusoe.ai/#service-specific-terms、trust.crusoe.ai、trust.crusoe.ai/subprocessors、trust.crusoe.ai/controls、trust.crusoe.ai/faq、docs.crusoecloud.com/llms.txt、docs.crusoecloud.com/managed-ai/overview、docs.crusoecloud.com/serverless-inference/overview、docs.crusoecloud.com/identity-and-security、www.crusoe.ai/cloud/managed-inference、www.crusoe.ai/cloud/serverless-fine-tuning。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "sst-v50-processing-and-storage-inputs-outputs"

[[product.retention.point]]
text = "Recorded by object (direct-access tier): (1) Input and output content = not written to disk, cached only in memory under the standard inference caching pattern, evicted to make room for new requests, and the cache cleared when the model instance is deleted"
text_zh = "按对象分记（直连档）：(1) 输入输出正文＝不落盘，仅在内存中按标准推理缓存模式临时缓存、为新请求腾位时淘汰、模型实例删除即清空缓存"

[[product.retention.point]]
text = "There is no \"deleted after N days\" commitment of any kind; the period type is non-persistence. (2) KV cache = described by both the official product page and the documentation site as a cluster-level memory cache (cluster-wide KV cache / cluster-aware routing), i.e. in memory"
text_zh = "没有任何「N 天后删除」的天数承诺，期限类型为非持久化。(2) KV 缓存＝官方产品页与文档站都描述为集群级内存缓存（cluster-wide KV cache / cluster-aware routing），属内存态"

[[product.retention.point]]
text = "The terms describe only the eviction mechanism and give no lifetime for the cache. (3) Training Data and Checkpoints = processed only to run the fine-tuning job the customer requested, and the customer can delete them at any time under the DPST. (4) Termination = all Customer Data (including existing copies) remaining in Crusoe's systems at the end of the Term is deleted unless European Law requires storage. (5) Service Data (account, billing, technical and operational logs and so on) = Cloud Platform Privacy Notice v1.3 says retention periods are set separately by data type and use, and that data is deleted or anonymized once no longer needed, with no number of days"
text_zh = "条款只说明淘汰机制，未给缓存存活时限。(3) Training Data 与 Checkpoints＝只为执行客户提交的微调任务而处理，客户可依 DPST 随时删除。(4) 服务终止＝Term 结束时 Crusoe 系统内的 Customer Data（含既有副本）全部删除，除非欧洲法要求保存。(5) Service Data（账号、计费、技术/运营日志等）＝Cloud Platform Privacy Notice v1.3 称按数据类型与用途分别设定保留期、不再需要即删除或匿名化，未给天数"

[[product.retention.point]]
text = "That notice states expressly that it does not apply to Customer Data. (6) Exception = DPST v1.3 \"Law Enforcement Requests\" permits Inputs/Outputs/Training Data/Checkpoints/Customer Models to be provided in response to law enforcement requests (Crusoe must challenge any request that is not binding and valid, notify the customer, and request a waiver where notice is prohibited by law). There is no \"retained for at least N months\" floor anywhere in the texts, and no fixed ceiling."
text_zh = "该通知明文不适用于 Customer Data。(6) 例外＝DPST v1.3「Law Enforcement Requests」允许在执法请求下提供 Inputs/Outputs/Training Data/Checkpoints/Customer Models（须先质疑不具约束力的请求并通知客户，法律禁止通知时须申请豁免）。全文无「至少保留 N 个月」类下限表述，也无固定上限。"

[product.processing_region]
codes = ["global"]
anchor = "sst-v50-data-location-clause"

[[product.processing_region.point]]
text = "Direct-access tier conclusion: no data residency commitment. Three clauses at terms level: (a) SST v5.0 \"General Service Terms / Data Location\" — the service does not restrict where the customer accesses Customer Data from, nor where Customer Data may be moved to"
text_zh = "直连档结论：无数据驻留承诺。条款层三条：(a) SST v5.0「General Service Terms / Data Location」——服务不限制客户从哪里访问 Customer Data、也不限制把 Customer Data 移到哪里"

[[product.processing_region.point]]
text = "(b) DPST v1.3 \"Data Transfers / Data Storage and Processing Facilities\" — \"Customer Data may be processed in any country in which Crusoe or its Subprocessors maintain facilities\""
text_zh = "(b) DPST v1.3「Data Transfers / Data Storage and Processing Facilities」——Customer Data 可在 Crusoe 或其子处理者拥有设施的任何国家处理"

[[product.processing_region.point]]
text = "(c) DPST Appendix 1 — a multi-tenant environment on Crusoe-owned servers, with Customer Data replicated between multiple data centers unless the customer instructs otherwise (for example through a data location selection)"
text_zh = "(c) DPST 附录 1——多租户环境、Crusoe 自有服务器，除客户另有指示（例如 data location selection）外会在多个数据中心之间复制 Customer Data"

[[product.processing_region.point]]
text = "The \"data location selection\" mechanism is mentioned in the terms, but the public documentation gives no list of available locations, no scope, and no statement of whether it applies to Managed Inference. (d) Service Data side: Cloud Platform Privacy Notice v1.3 says Service Data may be processed on servers outside the user's own country (centralized or regionalized billing, support and security operations). Infrastructure facts (developer_data): the documentation site lists data centers in Iceland / Houston, TX / Virginia / Sparks, NV / Norway (Norway coming soon)"
text_zh = "「按指令选择数据位置」的机制在条款里被提到，但公开文档未给出可选位置清单、适用范围或是否适用于 Managed Inference。(d) Service Data 侧：Cloud Platform Privacy Notice v1.3 称 Service Data 可能在用户所在国以外的服务器上处理（集中式或区域化的计费、支持、安全运营）。基础设施事实（developer_data）：文档站列出数据中心 Iceland / Houston, TX / Virginia / Sparks, NV / Norway（Norway 即将上线）"

[[product.processing_region.point]]
text = "The Serverless Fine-Tuning documentation states plainly that \"You don't pick a region, instance type, or GPU count.\" Subprocessor locations (enterprise_privacy_faq): the Trust Center publishes Google Cloud Platform / Mailgun / Stripe / Zendesk, all marked United States"
text_zh = "Serverless Fine-Tuning 文档明说客户不能选 region、instance type 或 GPU 数量。子处理者位置（enterprise_privacy_faq）：Trust Center 公布 Google Cloud Platform / Mailgun / Stripe / Zendesk，均标注 United States"

[[product.processing_region.point]]
text = "Svix, added in 2026-02, \"processes data primarily in the United States using AWS infrastructure\". Overall: request content is processed by default in Crusoe's own facilities, but there is no contractual guarantee of processing or storage in any one country, and the actual location depends on the product chosen and on available capacity."
text_zh = "2026-02 新增的 Svix 主要在美国用 AWS 处理。综合：请求内容默认在 Crusoe 自有机房处理，但没有「仅在某国处理/存储」的合同保证，实际位置取决于所选产品与容量。"

[product.role]
kind = "processor"
anchor = "dpst-processor-and-controller-roles"

[[product.role.point]]
text = "Direct-access tier conclusion: Crusoe designates itself processor. DPST v1.3 \"Processor and Controller Responsibilities\" verbatim: \"If European Data Protection Law applies to the processing of Customer Personal Data: 1. Crusoe is a processor of that Customer Personal Data under European Data Protection Law; 2. Customer is a controller or processor, as applicable…\""
text_zh = "直连档结论：Crusoe 自认 processor。DPST v1.3「Processor and Controller Responsibilities」逐字：「If European Data Protection Law applies to the processing of Customer Personal Data: 1. Crusoe is a processor of that Customer Personal Data under European Data Protection Law; 2. Customer is a controller or processor, as applicable…」"

[[product.role.point]]
text = "The same document defines a Subprocessor as \"a third party authorized as another processor under these Terms\". Accompanying clauses: SST v5.0 \"Crusoe shall process Inputs, Outputs, Customer Models, Checkpoints and Training Data according to the Data Processing and Security Terms\", and \"Customer will have sole access to Customer Models deployed in the Managed Inference Service, and neither Crusoe nor any third party not authorized by Customer may access or use such Customer Models except as needed to provide the Managed Inference Service\""
text_zh = "同文件把 Subprocessor 定义为「a third party authorized as another processor under these Terms」。配套条款：SST v5.0「Crusoe shall process Inputs, Outputs, Customer Models, Checkpoints and Training Data according to the Data Processing and Security Terms」、「Customer will have sole access to Customer Models deployed in the Managed Inference Service, and neither Crusoe nor any third party not authorized by Customer may access or use such Customer Models except as needed to provide the Managed Inference Service」"

[[product.role.point]]
text = "Cloud Platform TOS v1.10: \"Crusoe will only access or use Customer Data to provide the Services and TSS to Customer or as otherwise instructed by Customer\". Two reservations: (1) the processor statement is conditioned on \"if European Data Protection Law applies\"; outside European jurisdictions the DPST says only that each party complies with applicable law"
text_zh = "Cloud Platform TOS v1.10「Crusoe will only access or use Customer Data to provide the Services and TSS to Customer or as otherwise instructed by Customer」。两点保留：(1) processor 声明以「若欧洲数据保护法适用」为前提，非欧法域下 DPST 只写各方遵守适用法律"

[[product.role.point]]
text = "(2) That sentence appears 4 times on the legal page (the four embedded versions DPST v1.0–v1.3 are word for word identical), so it cannot be located uniquely, see notes."
text_zh = "(2) 该句在 legal 页面内出现 4 次（DPST v1.0–v1.3 四份内嵌版本逐字相同），无法唯一定位，见 notes。"

[[product]]
id = "openrouter-resale"
badge = "经 OpenRouter 转售"
category = "api"
plan_level = "any"
label = "经 OpenRouter 转售的 Crusoe Managed Inference（多跳：客户 → OpenRouter → Crusoe）"

[product.training]
mark = "yes"
anchor = "tos-or-processing-and-storage-customer-data"
mode = "default"

[[product.training.point]]
text = "Resale tier (customer → OpenRouter → Crusoe Managed Inference), Crusoe-side conclusion: likewise not used for training by default. TOS for OpenRouter Customers v4.6 \"Processing and Storage of Customer Data\": \"Crusoe does not store Inputs and Outputs to disk…\" plus \"We do not use Inputs or Outputs to train Models or improve our Services without Customer's explicit opt-in consent.\" — that opt-in sentence is the only substantive clause v4.6 adds over v4.5, which confirms that what was fetched this round is the current version. DPST v1.3, SST v5.0 and AUP v1.1 are incorporated into this agreement through the \"URL Terms\" definition in v4.6 (URL Terms = AUP + Data Processing and Security Terms + Service Specific Terms). Chain note: \"Customer\" on this tier is OpenRouter's customer, and Crusoe's commitment covers the Crusoe hop only"
text_zh = "转售档（客户 → OpenRouter → Crusoe Managed Inference）Crusoe 侧结论：同样默认不用于训练。TOS for OpenRouter Customers v4.6「Processing and Storage of Customer Data」：「Crusoe does not store Inputs and Outputs to disk…」＋「We do not use Inputs or Outputs to train Models or improve our Services without Customer's explicit opt-in consent.」——该 opt-in 句是 v4.6 相对 v4.5 新增的唯一实质条款，说明本轮抓到的正是当前版本。DPST v1.3、SST v5.0、AUP v1.1 通过 v4.6 的「URL Terms」定义一并纳入本协议（v4.6 定义「URL Terms」= AUP + Data Processing and Security Terms + Service Specific Terms）。链路提示：本档的「Customer」是 OpenRouter 的客户，Crusoe 的承诺只覆盖 Crusoe 这一跳"

[[product.training.point]]
text = "Whether OpenRouter itself resells or retains inputs and outputs must be checked on the other hop (this round took openrouter.ai/privacy only as a lead)."
text_zh = "OpenRouter 自身是否转售/留存输入输出需按另一跳核（本轮只取 openrouter.ai/privacy 作线索）。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "tos-or-processing-and-storage-customer-data"

[[product.zdr.point]]
text = "On the resale tier the Crusoe side matches the direct tier: nothing written to disk by default, no commitment under the ZDR name, and no switch or application path"
text_zh = "转售档 Crusoe 侧同直连档：默认不落盘、无 ZDR 名义承诺、无开关或申请入口"

[[product.zdr.point]]
text = "The law-enforcement exception applies here too (DPST v1.3 is incorporated through the URL Terms). Whether the other hop offers zero retention is outside this vendor's scope, and end-to-end zero retention must not be inferred from this."
text_zh = "执法请求例外同样适用（DPST v1.3 已并入 URL Terms）。链路另一跳是否提供零保留不在本家范围内，不得据此推断全链可零保留。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "tos-or-processing-and-storage-customer-data"

[[product.retention.point]]
text = "Crusoe side of the resale tier: the same sentence as the direct tier — inputs and outputs are not written to disk, cached in memory only, and cleared when the model instance is deleted"
text_zh = "转售档 Crusoe 侧：与直连档同一句话——输入输出不落盘、仅内存缓存、模型实例删除即清空"

[[product.retention.point]]
text = "No number of days. Customer Data is defined as \"Input, Output, and any personal data about Customer that Crusoe may receive from OpenRouter\". The post-termination deletion obligation, the Service Data retention periods and the law-enforcement exception all come from the DPST v1.3 / Cloud Platform Privacy Notice v1.3 embedded in the same page and match the direct tier. v4.6 also has a \"Required Disclosure\" clause permitting disclosure of Confidential Information (Customer Data being the customer's confidential information) to comply with Legal Process; that sentence appears 12 times on the page (12 TOS versions, word for word identical), so no anchor is given and it is noted here only."
text_zh = "无天数。Customer Data 定义＝「Input, Output, and any personal data about Customer that Crusoe may receive from OpenRouter」。服务终止后删除义务、Service Data 保留期、执法请求例外均来自同一页面内嵌的 DPST v1.3 / Cloud Platform Privacy Notice v1.3，与直连档一致。v4.6 另有一条「Required Disclosure」允许为遵守 Legal Process 披露 Confidential Information（Customer Data 属客户保密信息），该句在页面内出现 12 次（12 个 TOS 版本逐字相同），故未提锚点，仅在此说明。"

[product.processing_region]
codes = ["global"]
anchor = "dpst-data-storage-and-processing-facilities"

[[product.processing_region.point]]
text = "The regional conclusion on the resale tier is the same as on the direct tier, because the applicable text is the same DPST v1.3 (incorporated through the URL Terms definition in TOS for OpenRouter Customers v4.6) plus SST v5.0 \"Data Location\". This tier has no residency or regional clause of its own"
text_zh = "转售档的地域结论与直连档相同，因为适用的是同一份 DPST v1.3（经 TOS for OpenRouter Customers v4.6 的 URL Terms 定义并入）＋ SST v5.0「Data Location」。该档没有任何专门的驻留或地域条款"

[[product.processing_region.point]]
text = "How OpenRouter routes to which Crusoe facility is not explained in the public documentation."
text_zh = "OpenRouter 侧如何路由到 Crusoe 的哪个机房，公开文档未说明。"

[product.role]
kind = "processor"
anchor = "dpst-processor-and-controller-roles"

[[product.role.point]]
text = "The role on the resale tier has two layers, not reconciled: (1) For OpenRouter's customer, Crusoe's DPST v1.3 still says \"Crusoe is a processor of that Customer Personal Data\" — but the direct counterparty to that agreement is \"the entity or person agreeing to these terms\" (OpenRouter's customer), while Customer Data is defined as what \"Crusoe may receive from OpenRouter\", so OpenRouter still stands between Crusoe and the end customer"
text_zh = "转售档角色分两层，不调和：(1) 对 OpenRouter 的客户而言，Crusoe 的 DPST v1.3 仍写「Crusoe is a processor of that Customer Personal Data」——但这份协议的直接签约相对方是「the entity or person agreeing to these terms」（即 OpenRouter 的客户），而 Customer Data 被定义为「Crusoe may receive from OpenRouter」，即 Crusoe 与终端客户之间还隔着 OpenRouter"

[[product.role.point]]
text = "The terms do not say whether Crusoe is processor or sub-processor relative to the end customer. (2) OpenRouter's own role in the chain (whether it passes requests to Crusoe as a controller) has to be checked separately and was not covered this round. That is why confidence is medium."
text_zh = "条款未说明 Crusoe 相对于终端客户是 processor 还是 sub-processor。(2) OpenRouter 自身在其链路中的角色（它是否以 controller 身份向 Crusoe 传递请求）需另核，本轮未纳入。置信度 medium 的原因即在此。"

[[product]]
id = "gpu-cloud"
badge = "GPU 云"
category = "api"
plan_level = "any"
label = "Crusoe Cloud Infrastructure / GPU 云（IaaS：VM、磁盘、对象存储、CMK，客户自管环境）"

[product.training]
mark = "yes"
anchor = "cloud-tos-protection-of-customer-data"
mode = "default"

[[product.training.point]]
text = "GPU / Infrastructure Cloud tier (the customer runs their own environment in VMs, disks and CMK): the platform-level contract commits that Crusoe will only access or use Customer Data to provide the Services and TSS or as instructed by the customer, and \"will not use it for any other Crusoe products, services, or advertising\". The key difference from the Managed Inference tier is that this tier has no \"Customer Licenses to Crusoe\" content-use grant (the license clause in SST v5.0 covers only Intelligence Foundry Inputs/Outputs/Customer Models/Training Data/Checkpoints). The DPST also assigns responsibility for protecting data inside customer-managed resources to the customer: \"Customer is responsible for implementing and maintaining privacy protections and security measures for aspects of the Services that it controls (such as… resources provisioned by Customer using the Services, such as a virtual machine or storage)\". So a customer training models inside their own VM is not governed by Crusoe's training clauses, and Crusoe acquires no content license from it."
text_zh = "GPU/Infrastructure Cloud 档（客户在 VM、磁盘、CMK 里自管环境）：平台层合同承诺 Crusoe 只会为提供服务/TSS 或依客户指示访问或使用 Customer Data，「will not use it for any other Crusoe products, services, or advertising」。与 Managed Inference 档的关键区别：本档没有「Customer Licenses to Crusoe」那类内容使用授权（SST v5.0 的授权条款只覆盖 Intelligence Foundry 的 Inputs/Outputs/Customer Models/Training Data/Checkpoints）。DPST 同时把客户自管资源内的数据保护责任划给客户：「Customer is responsible for implementing and maintaining privacy protections and security measures for aspects of the Services that it controls (such as… resources provisioned by Customer using the Services, such as a virtual machine or storage)」。即：客户在 VM 内自行训练模型不受 Crusoe 训练条款约束，Crusoe 也不会因此取得内容授权。"

[product.zdr]
mark = "no"
mode = "not_disclosed"
searched = [
  "https://legal.crusoe.ai/",
  "https://legal.crusoe.ai/#data-processing",
  "https://legal.crusoe.ai/#service-specific-terms",
