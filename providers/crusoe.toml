  "https://docs.crusoecloud.com/compute/virtual-machines/overview",
  "https://docs.crusoecloud.com/identity-and-security",
  "https://docs.crusoecloud.com/storage/object-storage/overview",
]

[[product.zdr.point]]
text = "There is no ZDR concept on this tier and no zero-retention clause at all: the \"not written to disk\" commitment applies only to Managed Inference Inputs/Outputs"
text_zh = "该档不存在 ZDR 概念，也没有任何零保留条款：「不落盘」承诺只针对 Managed Inference 的 Inputs/Outputs"

[[product.zdr.point]]
text = "Retention and erasure in customer-managed resources are determined by the customer's own configuration (the DPST assigns security responsibility for the customer-controlled surface, such as VMs and storage, to the customer). All the URLs above were checked and contain no ZDR / zero-retention / not-written-to-disk wording. This is \"the vendor has not disclosed ZDR for this tier\", not \"the vendor commits to the opposite\"."
text_zh = "客户自管资源的保留与清除由客户自己的配置决定（DPST 把 VM/存储等客户控制面的安全责任划给客户）。以上 URL 均查过、无 ZDR / 零保留 / 不落盘表述。这是「官方未披露该档 ZDR」，不是「厂商承诺相反」。"

[[product.zdr.point]]
text = "The Cloud Platform Privacy Notice scope clause previously bound here (\"This Privacy Notice applies solely to Service Data and does not apply to Customer Data\") says which data the notice covers, not whether zero retention is offered, so it is not a statement on this dimension and is no longer bound. The anchor definition stays in this file, now unreferenced by any verdict."
text_zh = "原先绑在本条的 Cloud Platform Privacy Notice 范围条款（「This Privacy Notice applies solely to Service Data and does not apply to Customer Data」）只说明该通知覆盖哪些数据，没有说是否提供零保留，不构成对本维度的表述，故不再绑在本条；该 anchor 定义仍保留在本文件中（现无维度引用它）。"

[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "dpst-return-or-deletion-end-of-term"

[[product.retention.point]]
text = "Data on this tier is managed by the customer, and the only commitment verifiable on Crusoe's side is that Customer Data left in its systems at the end of the Term is deleted (including existing copies, unless European Law requires storage)"
text_zh = "本档数据由客户自管，Crusoe 侧可复核的承诺只有：Term 结束时删除其系统内残留的 Customer Data（含既有副本，除非欧洲法要求保存）"

[[product.retention.point]]
text = "Service Data has retention periods set according to its use and is deleted or anonymized once no longer needed (no number of days)"
text_zh = "Service Data 按用途设定保留期、不再需要即删除或匿名化（无天数）"

[[product.retention.point]]
text = "DPST v1.3 also carries the law-enforcement exception. What happens when the customer deletes a disk is documented specifically (developer_data): an Ephemeral Disk is \"cryptographically erased\" when the VM is destroyed, while for Persistent Disks and Shared Disks \"When a disk is deleted, data is soft-deleted, but cryptographic erasure is not currently available\" — deletion is a soft delete with no guarantee of irrecoverability, and the at-rest encryption keys for those two disk types are pooled among all users of the storage cluster. Undisclosed: how long soft-deleted data actually stays in the storage cluster, backup system retention, and retention rules for VM snapshots and images. Confidence is medium because the contract level offers only \"deletion after termination\" while retention during operation depends entirely on the customer's configuration."
text_zh = "DPST v1.3 另有执法请求例外。客户自己删除磁盘时会发生什么，官方文档有具体说明（developer_data）：Ephemeral Disk 在 VM 销毁时「cryptographically erased」，而 Persistent Disk / Shared Disk「When a disk is deleted, data is soft-deleted, but cryptographic erasure is not currently available」——即删除是软删除、不保证不可恢复，且这两类盘的静态加密密钥在存储集群全体用户间共享。未披露：软删除数据在存储集群中的实际清除时限、备份系统保留期、VM 快照/镜像留存规则。置信度 medium 是因为合同层只有「终止后删除」，运行期保留完全取决于客户配置。"

[product.processing_region]
codes = ["selected"]
anchor = "dpst-multitenant-replication"

[[product.processing_region.point]]
text = "This tier shares the same regional clauses as the Managed Inference tier (DPST v1.3 + SST v5.0 Data Location): no residency commitment. One extra layer of fact here: the published data center list on the documentation site (Iceland, Houston TX, Virginia, Sparks NV, Norway) and the locations resource in the CLI show that the customer can choose a location ID when ordering"
text_zh = "与 Managed Inference 档共用同一套地域条款（DPST v1.3 + SST v5.0 Data Location）：无驻留承诺。本档多一层事实：文档站公开的数据中心位置清单（Iceland、Houston TX、Virginia、Sparks NV、Norway）与 CLI 的 locations 资源，说明客户可在下单时选 location ID"

[[product.processing_region.point]]
text = "The DPST likewise mentions a customer instruction \"in the form of a data location selection\". But the public terms do not turn the selected location into a guarantee about where data is processed, so it is not recorded as a residency commitment."
text_zh = "DPST 也提到「in the form of a data location selection」的客户指示。但公开条款未把「所选 location」写成数据处理地保证，故不作驻留承诺记录。"

[product.role]
kind = "processor"
anchor = "dpst-processor-and-controller-roles"

[[product.role.point]]
text = "Same DPST v1.3 \"Processor and Controller Responsibilities\": Crusoe is the processor of Customer Personal Data and the customer is controller or processor. That statement covers every Crusoe Cloud Platform service (Infrastructure Cloud included) and does not distinguish tiers."
text_zh = "同 DPST v1.3「Processor and Controller Responsibilities」：Crusoe 对 Customer Personal Data 是 processor，客户是 controller 或 processor。该声明覆盖 Crusoe Cloud Platform 全部服务（含 Infrastructure Cloud），不区分档位。"

