channel = "contract"
tier = "core"
note = "Codebuff 与 Freebuff 产品统一合同及内容处理许可。"

[[product]]
id = "managed"
badge = "托管 CLI"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "yes"
mode = "default"
anchor = "codebuff-training-default"

[[product.training.point]]
text_zh = "只有明确标注“May use data for AI training”的模型/功能例外；使用该例外时训练结论反转。连接 Freebuff Cloud 仓库还允许有限 Codebase Evaluation，但该行为本身不授权训练。"
anchor = "codebuff-training-default"

[product.zdr]
mark = "unknown"
searched = ["https://www.codebuff.com/privacy-policy", "https://www.codebuff.com/terms-of-service", "https://www.codebuff.com/docs/advanced/how-does-it-work", "https://www.codebuff.com/pricing", "https://freebuff.com/enterprise"]

[product.retention]
object = "input_output_code"
basis = "undisclosed"
anchor = "codebuff-retention"

[[product.retention.point]]
text_zh = "输入、代码、文件、agent traces 与项目数据可被收集；只给按目的合理必要的泛化期限。账号删除请求完成后，不再仅为 Codebase Evaluation 保留 raw source code/agent traces，但断开 GitHub 或 Delete project 本身不会删除已收集数据。"
anchor = "codebuff-retention"

[[product.retention.point]]
text_zh = "Tree-sitter 在本地建立 code map，但官方未披露该本地索引/缓存的清理期限。"
anchor = "codebuff-local-map"

[[product.retention.point]]
text_zh = "产品默认会向 analytics/observability 服务商发送有界的使用、性能和诊断事件；官方政策及 CLI 文档未披露全局关闭开关或遥测保留期限。"
anchor = "codebuff-telemetry"

[[product.retention.point]]
text = "A deletion request does not remove everything: deleted information may remain in backups, and deidentified or aggregated data, derived interests, derived Codebase Evaluation results that contain no raw source code or agent traces, permitted training data, and content others keep through a sharing or publishing feature may all survive deletion."
text_zh = "删除请求不等于全删：已删除信息可能仍留在备份中，去标识或聚合数据、派生兴趣、不含原始源码与 agent traces 的派生 Codebase Evaluation 结果、已授权的训练数据，以及他人通过分享或发布功能保留的内容，都可能在删除后继续存在。"
anchor = "codebuff-deletion-exceptions"

[product.processing_region]
codes = ["US", "global"]
anchor = "codebuff-region"

[[product.processing_region.point]]
text = "Edits and commands run locally, but relevant prompts, code, files, and repository context are sent to Freebuff and to model providers, so the processing region — and the role of each hop — is additionally governed by those providers' own terms."
text_zh = "编辑与命令在本机执行，但相关提示词、代码、文件与仓库上下文会发往 Freebuff 及各模型商，处理地（以及各跳的角色）还受这些模型商各自条款约束。"
anchor = "codebuff-data-path"

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://www.codebuff.com/privacy-policy", "https://www.codebuff.com/terms-of-service", "https://freebuff.com/enterprise"]

[[product.role.point]]
text = "The policy never uses controller or processor for Codebuff's own role; the only occurrences of processor refer to payment processors. No enterprise DPA or processor commitment is published, so the role has to be confirmed separately before procurement."
text_zh = "政策未用 controller/processor 术语描述自身角色，processor 仅指支付处理商；企业 DPA 或受托处理方身份未公开，采购前需另行确认。"

[[product.role.point]]
text = "The policy grounds processing in the company's own legal bases — performing the contract, complying with legal obligations, and pursuing its own legitimate interests such as securing and improving Service, preventing abuse, and supporting its business. That reads like processing for its own purposes, but the clause names no role, so it is recorded as context rather than as proof of controller status."
text_zh = "政策把处理建立在自身合法依据上（履行合同、遵守法定义务，以及保护与改进服务、防止滥用、支持自身业务等自有合法利益），口径接近为自身目的处理；但该句未指明角色，只作背景记录，不足以据此改判角色。"
anchor = "codebuff-legal-bases"

[[product.role.point]]
text = "Prompt and Project Data are also used to personalize advertising inside the Service, including by deriving general interest categories — again processing for the company's own purposes, and no retention period is published for those derived interest categories."
text_zh = "提示词与项目数据还被用于站内广告个性化，包括派生一般兴趣类别，同样是为自身目的处理，且政策未公布这些派生兴趣类别的保留期限。"
anchor = "codebuff-ad-personalization"

[[product]]
id = "training-labeled"
badge = "标注可训练模型"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
anchor = "codebuff-training-exception"
[product.zdr]
mark = "no"
anchor = "codebuff-training-exception"
[product.retention]
object = "input_output_code"
basis = "undisclosed"
anchor = "codebuff-training-exception"

[[product.retention.point]]
text = "Data submitted through a model or feature labeled for AI training may be retained for the permitted development and improvement uses and may not be removable once it has been deidentified or incorporated into a model — an authorised retention with no deletion ceiling."
text_zh = "带 AI 训练标注的模型或功能所提交的数据可按已授权的开发与改进用途留存，且在去标识或并入模型后可能不可移除——属授权性留存，没有删除上限。"
anchor = "codebuff-training-retention"

[product.processing_region]
codes = ["US", "global"]
anchor = "codebuff-region"
[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://www.codebuff.com/privacy-policy", "https://www.codebuff.com/terms-of-service"]

[[product.role.point]]
text = "In jurisdictions where these advertising choices are not legally required, certain advertising processing may be necessary to use the free Service — advertising the provider runs for its own purposes rather than on a customer's instruction. The policy still names no role for Codebuff."
text_zh = "在未强制提供广告选择的辖区，部分广告处理是使用免费服务的必要条件，即厂商为自身广告目的而非按客户指示进行的处理；但政策仍未指明 Codebuff 的角色。"
anchor = "codebuff-ad-necessity"

