[[product]]
id = "managed"
badge = "托管 CLI"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
anchor = "codebuff-training-default"

[[product.training.point]]
text = "Except to train the models used to select and measure advertising, Company does not use Prompt and Project Data to train its or third-party AI models unless the applicable model or feature is clearly labelled before use as permitting AI training."
text_zh = "除训练用于选择和衡量广告的模型外，公司不会用 Prompt and Project Data 训练自研或第三方 AI 模型，除非在使用前明确标注适用模型或功能允许 AI 训练。"
anchor = "codebuff-training-default"

[[product.training.point]]
text = "Connecting a GitHub repository to Freebuff Cloud authorizes Codebase Evaluation only of code, files, and other content in that connected repository."
text_zh = "连接 GitHub 仓库到 Freebuff Cloud 只授权对该连接仓库中的代码、文件及其他内容进行 Codebase Evaluation。"
anchor = "codebuff-codebase-evaluation-scope"

[[product.training.point]]
text = "Connecting a repository does not permit us or a partner to train AI models on it."
text_zh = "连接仓库并不允许公司或合作伙伴在其上训练 AI 模型。"
anchor = "codebuff-codebase-evaluation-no-training"

[[product.training.point]]
text = "Scope conflict kept explicit: the Codebase Evaluation prohibition applies to training AI models on the connected repository's code, files, and other content, while the AI Training exception expressly permits training models used to select and measure advertising from the broader Prompt and Project Data. The policy does not expressly reconcile whether that advertising exception can reach connected-repository content, so these statements are not treated as a blanket permission or blanket prohibition."
text_zh = "明确保留适用范围冲突：Codebase Evaluation 的禁训句适用于连接仓库中的代码、文件及其他内容；AI Training 例外则明确允许用更广义 Prompt and Project Data 训练用于选择和衡量广告的模型。政策没有明确说明广告例外是否能覆盖连接仓库内容，因此不把两句合并解读为全面许可或全面禁止。"
anchor = "codebuff-training-default"

[product.zdr]
mark = "unknown"
searched = ["https://www.codebuff.com/privacy-policy", "https://www.codebuff.com/terms-of-service", "https://www.codebuff.com/docs/advanced/how-does-it-work", "https://www.codebuff.com/pricing", "https://freebuff.com/enterprise"]

[product.retention]
object = "input_output_code"
basis = "undisclosed"
anchor = "codebuff-retention"

[[product.retention.point]]
text_zh = "输入、代码、文件、agent traces 与项目数据可被收集；只给按目的合理必要的泛化期限。账号删除请求完成后，不再仅为 Codebase Evaluation 保留 raw source code/agent traces，但断开 GitHub 或 Delete project 本身不会删除已收集数据。"
anchor = "codebuff-retention"

[[product.retention.point]]
text = "Agents in Freebuff Desktop and CLI can read files, run commands, and access environment variables and other data that the device account can access, including outside the project; anything an agent reads becomes Prompt and Project Data."
text_zh = "Freebuff Desktop 与 CLI 中的 agent 可读取文件、运行命令，并访问设备账号可访问的环境变量及其他数据，包括项目之外的数据；agent 读取的任何内容都会成为 Prompt and Project Data。"
anchor = "codebuff-agent-data-scope"

[[product.retention.point]]
text = "When you delete your account, Company keeps keyed hashes of identifiers such as email address, phone number, identity document, and device identifiers, together with suspension, limit, and reward status, so deletion does not reset a suspension, limit, or reward."
text_zh = "删除账号时，公司会保留邮箱、手机号、身份证件和设备标识等标识符的 keyed hash，以及停权、限制和奖励状态，使删除账号不会重置停权、限制或奖励。"
anchor = "codebuff-account-deletion-identifiers"

[[product.retention.point]]
text = "AI agents may access files, credentials, environment variables, and other data available to them, including outside the project, and include that data in requests to model providers; this expands the potential Prompt and Project Data scope but does not publish a retention period."
text_zh = "AI agent 可访问文件、凭据、环境变量及其可访问的其他数据，包括项目之外的数据，并将这些数据包含在发给模型商的请求中；这扩大了潜在 Prompt and Project Data 范围，但没有公布保留期限。"
anchor = "codebuff-terms-agent-data-scope"

[[product.retention.point]]
text_zh = "Tree-sitter 在本地建立 code map，但官方未披露该本地索引/缓存的清理期限。"
anchor = "codebuff-local-map"

[[product.retention.point]]
text_zh = "产品默认会向 analytics/observability 服务商发送有界的使用、性能和诊断事件；官方政策及 CLI 文档未披露全局关闭开关或遥测保留期限。"
anchor = "codebuff-telemetry"

[[product.retention.point]]
text = "A deletion request does not remove everything: deleted information may remain in backups, and deidentified or aggregated data, derived interests, derived Codebase Evaluation results that contain no raw source code or agent traces, permitted training data, and content others keep through a sharing or publishing feature may all survive deletion."
text_zh = "删除请求不等于全删：已删除信息可能仍留在备份中，去标识或聚合数据、派生兴趣、不含原始源码与 agent traces 的派生 Codebase Evaluation 结果、已授权的训练数据，以及他人通过分享或发布功能保留的内容，都可能在删除后继续存在。"
anchor = "codebuff-deletion-exceptions"

[product.processing_region]
codes = ["US", "global"]
anchor = "codebuff-region"

[[product.processing_region.point]]
text = "Edits and commands run locally, but relevant prompts, code, files, and repository context are sent to Freebuff and to model providers, so the processing region — and the role of each hop — is additionally governed by those providers' own terms."
text_zh = "编辑与命令在本机执行，但相关提示词、代码、文件与仓库上下文会发往 Freebuff 及各模型商，处理地（以及各跳的角色）还受这些模型商各自条款约束。"
anchor = "codebuff-data-path"

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://www.codebuff.com/privacy-policy", "https://www.codebuff.com/terms-of-service", "https://freebuff.com/enterprise"]

[[product.role.point]]
text = "The policy still never uses controller or processor for Codebuff's own role, but processor is no longer limited to payment processors: the Identity Verification section calls the identity-verification vendor “our processor Didit (Didit Identity S.L.)”. That sentence casts Company as the party directing a processor for its own verification purpose, and it says nothing about Codebuff's role for Prompt and Project Data. No enterprise DPA or processor commitment is published, so the role has to be confirmed separately before procurement."
text_zh = "政策仍未用 controller/processor 描述 Codebuff 自身的角色，但 processor 已不再仅指支付处理商：Identity Verification 一节把厂商自己的身份验证服务商称作「our processor Didit (Didit Identity S.L.)」。该句把 Company 描述成为自身验证目的指挥处理商的一方，并未就 Prompt and Project Data 指定 Codebuff 的角色。企业 DPA 或受托处理方身份仍未公开，采购前需另行确认。"
anchor = "codebuff-identity-processor"

[[product.role.point]]
text = "The policy grounds processing in the company's own legal bases — performing the contract, complying with legal obligations, and pursuing its own legitimate interests such as securing and improving Service, preventing abuse, and supporting its business. That reads like processing for its own purposes, but the clause names no role, so it is recorded as context rather than as proof of controller status."
text_zh = "政策把处理建立在自身合法依据上（履行合同、遵守法定义务，以及保护与改进服务、防止滥用、支持自身业务等自有合法利益），口径接近为自身目的处理；但该句未指明角色，只作背景记录，不足以据此改判角色。"
anchor = "codebuff-legal-bases"

[[product.role.point]]
text = "Prompt and Project Data are used to personalize advertising inside the Service, including by deriving general interest categories and a general profile of the projects a user works on; the applications may automatically review project files to build these profiles."
text_zh = "提示词与项目数据被用于站内广告个性化，包括派生一般兴趣类别与用户项目概况；应用可能自动审阅项目文件来建立这些概况。"
anchor = "codebuff-ad-personalization"

[[product.role.point]]
text = "Company and service providers acting on its behalf, including AI model providers, analyze advertising data to select, deliver, measure, and prevent fraud in advertising, and to train the models that do so."
text_zh = "公司及代表公司行事的服务商（包括 AI 模型商）会分析广告数据，用于选择、投放、衡量广告、防止广告欺诈及训练执行这些工作的模型。"
anchor = "codebuff-ad-training"

[[product.role.point]]
text = "A sponsor of a survey or task a user chooses to take part in may receive the user's responses with general profile details or a task record, including agent messages that may quote the user's code; with permission, Company may also share the user's email address."
text_zh = "用户选择参加的问卷或任务的赞助方可能收到用户的回答及一般资料（如职务或团队规模），或任务记录（包括可能引用用户代码的 agent messages）；经用户许可，公司还可分享用户的电子邮件地址。"
anchor = "codebuff-sponsored-disclosure"

[[product]]
id = "training-labeled"
badge = "标注可训练模型"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
anchor = "codebuff-training-exception"

[[product.training.point]]
text = "Data submitted through a model or feature labeled for AI training may also be shared, licensed, or sold, including agent traces, to third parties such as researchers and companies for AI training, research, and other commercial purposes."
text_zh = "通过标注可用于 AI 训练的模型或功能提交的数据还可被分享、许可或出售（包括 agent traces）给研究机构和企业等第三方，供其用于 AI 训练、研究及其他商业用途。"
anchor = "codebuff-training-sale"

[[product.training.point]]
text = "For Content submitted through a model or feature labeled for AI training, the Terms make the license sublicensable, so Company may share, license, or sell that Content to third parties."
text_zh = "对于通过标注可用于 AI 训练的模型或功能提交的 Content，服务条款将许可设为可转授，因此公司可将该 Content 分享、许可或出售给第三方。"
anchor = "codebuff-terms-sublicense"

[product.zdr]
mark = "no"
anchor = "codebuff-training-exception"
[product.retention]
object = "input_output_code"
basis = "undisclosed"
anchor = "codebuff-training-exception"

[[product.retention.point]]
text = "Data submitted through a model or feature labeled for AI training may be retained for the permitted uses and may not be removable once it has been deidentified, incorporated into a model, or provided to a third party — an authorised retention with no deletion ceiling, where transfer to a third party also ends removability."
text_zh = "带 AI 训练标注的模型或功能所提交的数据可按已授权用途留存，且在去标识、并入模型或提供给第三方后可能不可移除——属授权性留存，没有删除上限，向第三方提供同样会使数据不可移除。"
anchor = "codebuff-training-retention"

[product.processing_region]
codes = ["US", "global"]
anchor = "codebuff-region"
[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://www.codebuff.com/privacy-policy", "https://www.codebuff.com/terms-of-service"]

[[product.role.point]]
text = "In jurisdictions where these choices are not legally required, certain advertising processing may be necessary to use the free Service."
text_zh = "在未强制提供广告选择的辖区，部分广告处理可能是使用免费服务的必要条件。"
anchor = "codebuff-ad-necessity"

[[product.role.point]]
text = "For labelled data, Company may share, license, or sell Content including agent traces to third parties for AI training, research, and other commercial uses."
text_zh = "对于标注可训练的数据，公司可将包括 agent traces 在内的 Content 分享、许可或出售给第三方，供其用于 AI 训练、研究及其他商业用途。"
anchor = "codebuff-training-sale"

[[product.role.point]]
text = "The Terms make the Content licence sublicensable for labelled data, so Company may share, license, or sell that Content to third parties as described in the Privacy Policy."
text_zh = "服务条款还把标注可训练数据的 Content 许可设为可转授，允许公司按隐私政策所述将这类内容分享、许可或出售给第三方。"
anchor = "codebuff-terms-sublicense"

[[product.role.point]]
text = "A sponsor of a survey or task a user chooses to take part in may receive responses with general profile details or a task record, including agent messages that may quote code; with permission, Company may also share the user's email address."
text_zh = "用户选择参加的问卷或任务的赞助方可能收到回答及一般资料或任务记录（包括可能引用代码的 agent messages）；经用户许可，公司还可分享用户的电子邮件地址。"
anchor = "codebuff-sponsored-disclosure"

