note = "OpenRouter 隐私政策（全站 + Service，含「Enterprise and API Users」与「Model Provider Data Practices」两节）。是「OpenRouter 自身不训练」与「上游可能训练」两句话的出处，也是默认保留（目的导向）、媒体文件不持久化、Files API 保留、处理地转移、以及与模型厂商责任划分的依据。"

[[source]]
url = "https://openrouter.ai/terms"
channel = "contract"
tier = "core"
note = "OpenRouter 服务条款（页脚 © 2026 OpenRouter, Inc）。覆盖全部档位的合同层：§3.1 组织账户管理员可配置的项里含 zero data retention；§6.1「User Content Generally; Training Data」是训练维度的合同依据（内容许可 + 上游可能训练 + OpenRouter 尽可能 opt out）；§6.3(b) 批量/大体积请求的临时存储、§6.3(c) 保留期按功能而定；§10.2 把 DPA 并入本条款并限定商业/组织客户。"

[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "openrouter-privacy-model-provider-data-practices-training"

[[product.training.point]]
text = "Whole-chain verdict. OpenRouter itself commits not to train, but the upstream hop decides the chain and that hop is a no: the privacy policy says \"Some Model Providers may use your Inputs and Outputs for model training or improvement.\", and terms §6.1 says the same at contract level (\"Some Models may store or train on your Inputs for improving their own large language models and may allow you to opt-out of model training, as described in their Model Terms.\"). Under \"a clear no on any hop makes the whole chain a no\", this tier is treated as possibly used for training."
text_zh = "全链判定。OpenRouter 自身承诺不训练，但定全链的是上游那一跳，而那一跳为「否」：隐私政策明说「Some Model Providers may use your Inputs and Outputs for model training or improvement.」，terms §6.1 是同一件事的合同表述（「Some Models may store or train on your Inputs for improving their own large language models…」）。按「任一跳明确为否，则全链为否」，本档按可能用于训练处理。"

[[product.training.point]]
anchor = "openrouter-privacy-enterprise-api-training"
text = "OpenRouter's own hop only: \"OpenRouter does not use your Inputs or Outputs for model training.\" That is the provider's own commitment and cannot settle the chain."
text_zh = "只覆盖 OpenRouter 自身这一跳：「OpenRouter does not use your Inputs or Outputs for model training.」这是厂商自身的承诺，定不了全链。"

[[product.training.point]]
anchor = "openrouter-zdr-conservative-stance-zdr"
text = "Endpoints whose policy cannot be confirmed count as training: \"If OpenRouter is not able to establish or ascertain a clear policy for a provider or endpoint, we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such.\""
text_zh = "政策无法确认的端点按会训练计：「If OpenRouter is not able to establish or ascertain a clear policy for a provider or endpoint, we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such.」"

[[product.training.point]]
text = "Account settings and the request-level `data_collection` / `provider.zdr` parameters can restrict routing, but OpenRouter does not guarantee upstream compliance."
text_zh = "账户设置与请求级 `data_collection`/`provider.zdr` 可限制路由，但 OpenRouter 不保证上游合规。"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "openrouter-zdr-enforcement-modes-zdr"

[[product.zdr.point]]
text = "Self-service enforcement, four ways: \"You can enforce ZDR globally, per model group, per guardrail, or per request.\" — account privacy settings, per-model-group scopes, guardrails, and the request-level `provider.zdr: true` (the request parameter ORs with the account and guardrail settings)."
text_zh = "自助强制，四种方式：「You can enforce ZDR globally, per model group, per guardrail, or per request.」即账户隐私设置、模型组范围、guardrail、请求级 `provider.zdr: true`（请求参数与账户/guardrail 设置取「或」）。"

[[product.zdr.point]]
anchor = "openrouter-dpa-1-19-zdr-definition-zdr"
text = "Supporting only: the DPA defines what ZDR means (\"means OpenRouter does not persistently store API Payloads after completion of the applicable API request and response, except for transient processing in memory, short-lived buffering or caching strictly necessary to transmit, secure, or complete the request, and records required by law.\"). The definition itself does not say the option can be turned on; that comes from the enforcement clause above."
text_zh = "仅作辅证：DPA 给出 ZDR 的定义（「means OpenRouter does not persistently store API Payloads after completion of the applicable API request and response, except for transient processing in memory, short-lived buffering or caching strictly necessary to transmit, secure, or complete the request, and records required by law.」）。定义本身不含「可开通」之意，后者以上面的强制条款为准。"

[[product.zdr.point]]
anchor = "openrouter-dpa-2-4-b-no-upstream-guarantee-zdr"
text = "Boundary of this tier's ZDR: with ZDR-only routing OpenRouter \"will not route Customer API requests to AI Model Providers that are not designated as ZDR-eligible in OpenRouter's provider registry\", but the list only \"reflects the AI Model Provider's published or represented policy of \"no retention and no training\" on zero-data-retention API payloads; it does not constitute OpenRouter's guarantee of AI Model Provider compliance\" — the upstream hop is still judged on its own."
text_zh = "本档 ZDR 的边界：启用 ZDR-only 路由时 OpenRouter「will not route Customer API requests to AI Model Providers that are not designated as ZDR-eligible in OpenRouter's provider registry」，但该名单只反映上游自称的政策，且「it does not constitute OpenRouter's guarantee of AI Model Provider compliance」——上游那一跳仍逐跳判定。"

[[product.zdr.point]]
anchor = "openrouter-zdr-conservative-stance-zdr"
text = "Unverified endpoints: \"If OpenRouter is not able to establish or ascertain a clear policy for a provider or endpoint, we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such.\" So what ZDR buys depends on the endpoint being on the ZDR list."
text_zh = "未核实端点：「If OpenRouter is not able to establish or ascertain a clear policy for a provider or endpoint, we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such.」故 ZDR 的实际效果取决于端点是否在 ZDR 名单内。"

[[product.zdr.point]]
text = "\"ZDR enforcement only applies to provider routing for inference requests.\" — it does not cover plugins or web search."
text_zh = "只覆盖推理路由，不含 plugins 与 web search。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "openrouter-datacollection-no-store-unless-optin-retention"

[[product.retention.point]]
text = "Object and context — inputs and outputs: by default \"OpenRouter does not store your prompts or responses, _unless_ you opt in to one or both of the following\" (private input & output logging, or letting OpenRouter use your inputs/outputs for a 1% discount). Periods for content stored after opting in vary by feature and are only pointed at feature documentation (terms §6.3(c): \"Retention periods for User Content stored under this Section 6.3 vary by feature and are described in the applicable feature documentation\"), so no period is published either by default or after opt-in."
text_zh = "对象与语境——输入输出：默认「OpenRouter does not store your prompts or responses, _unless_ you opt in to one or both of the following」（私有日志，或以 1% 折扣换取 OpenRouter 使用输入输出）。opt-in 后所存内容的期限按功能而定、只指向功能文档（terms §6.3(c)：「Retention periods for User Content stored under this Section 6.3 vary by feature and are described in the applicable feature documentation」），故默认与 opt-in 两种情形都没有公布期限。"

[[product.retention.point]]
anchor = "openrouter-terms-6-2-optin-perpetual-license-retention"
text = "What opting in means: terms §6.2 provides that you \"grant OpenRouter a worldwide, perpetual, irrevocable, non-exclusive, royalty-free, fully paid right and license (with the right to sublicense) to host, store, transfer, display, perform, reproduce, modify for the purpose of formatting for display, adapt, translate, and prepare derivative works of, and distribute your User Content, in whole or in part, in any media formats and through any media channels now known or hereafter developed, for purposes of providing the Services to you and for our own commercial and business purposes.\""
text_zh = "opt-in 的含义：terms §6.2 规定你「grant OpenRouter a worldwide, perpetual, irrevocable, non-exclusive, royalty-free, fully paid right and license (with the right to sublicense) to host, store, transfer, display, perform, reproduce, modify for the purpose of formatting for display, adapt, translate, and prepare derivative works of, and distribute your User Content, in whole or in part, in any media formats and through any media channels now known or hereafter developed, for purposes of providing the Services to you and for our own commercial and business purposes.」"

[[product.retention.point]]
anchor = "openrouter-terms-6-2-anonymized-sale-retention"
text = "That licence expressly includes example (3): \"license or sell your User Content in anonymized form, where your User Content is not associated with you or your account.\" So any period given for logged content is a floor, not a deletion promise."
text_zh = "该许可明确含示例 (3)：「license or sell your User Content in anonymized form, where your User Content is not associated with you or your account.」故已记录内容的任何期限都只是下限，不是删除承诺。"

[[product.retention.point]]
anchor = "openrouter-terms-6-3-b-processing-storage-retention"
text = "Context — bulk/large-volume requests: terms §6.3(b) says certain features \"such as batch or other large-volume request processing, require OpenRouter to temporarily store your User Content in order to process, route, and fulfill your request, including where the volume or size of a request cannot be processed in memory.\""
text_zh = "语境——批量/大体积请求：terms §6.3(b) 规定某些功能「such as batch or other large-volume request processing, require OpenRouter to temporarily store your User Content in order to process, route, and fulfill your request, including where the volume or size of a request cannot be processed in memory.」"

[[product.retention.point]]
anchor = "openrouter-privacy-files-api-retention-retention"
text = "Other object — Files API uploads: \"Uploaded Files are retained by us until you delete them or close your account, subject to the exceptions described below.\""
text_zh = "另一类对象——Files API 上传文件：「Uploaded Files are retained by us until you delete them or close your account, subject to the exceptions described below.」"

[[product.retention.point]]
anchor = "openrouter-privacy-media-ephemeral-retention"
text = "Other object — image/audio/video inputs: \"We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.\""
text_zh = "另一类对象——图片/音频/视频输入：「We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.」"

[[product.retention.point]]
anchor = "openrouter-datacollection-metadata-retention"
text = "Logs/metadata: \"OpenRouter does store metadata (e.g. number of prompt and completion tokens, latency, etc) for each request.\" with no period given."
text_zh = "日志/元数据：「OpenRouter does store metadata (e.g. number of prompt and completion tokens, latency, etc) for each request.」无期限。"

[[product.retention.point]]
anchor = "openrouter-dpa-schedule2-deletion-30-business-days-retention"
text = "DPA customers can request deletion: \"OpenRouter deletes Customer Data from the datastores and backups within 30 business days of request\"."
text_zh = "DPA 客户可要求删除：「OpenRouter deletes Customer Data from the datastores and backups within 30 business days of request」。"

[product.processing_region]
codes = ["US", "EU"]
anchor = "openrouter-dpa-schedule2-us-regions-region"

[[product.processing_region.point]]
text = "See top-level processing_region. The default is \"Google Cloud Platform hosting in US regions; data at rest is region-restricted\""
text_zh = "见顶层 processing_region。默认 GCP US regions"

[[product.processing_region.point]]
text = "In-region routing (EU/US) is a paid Business/Enterprise feature, and EU-only processing has its own DPA Exhibit A."
text_zh = "in-region（EU/US）是 Business/Enterprise 付费功能，EU-only 另有 DPA Exhibit A。"

[product.role]
kind = "processor"
anchor = "openrouter-dpa-2-1-roles-role"

[[product.role.point]]
text = "See top-level role. For customer personal data, \"Customer is the Controller, and OpenRouter is the Processor\""
text_zh = "见顶层 role。对客户个人数据 OpenRouter 是 Processor"

[[product.role.point]]
text = "For site and account data it uses the data in its own right as a controller (marketing, analytics)."
text_zh = "对站点/账户数据它自己以控制者身份使用（营销、分析）。"

[[product]]
id = "free-tier"
badge = "免费层"
category = "api"
plan_level = "free"

[product.training]
mark = "no"
anchor = "openrouter-freemodels-provider-logs-training"
mode = "opt_out"

[[product.training.point]]
text = "The upstream hop on the free tier is a no: for each free/anonymous model listed at the time, the model catalogue page discloses \"All prompts and completions for this model are logged by the provider and may be used to improve the model.\" (a few entries read \"logged by the model creator for feedback and training\"). OpenRouter itself still commits not to train (the same privacy policy clause applies to the free tier), but under \"a clear no on any hop makes the whole chain a no\", the free tier's whole chain should be treated as **possibly used for training**. Control: account settings have a separate training toggle for free models (provider-logging: \"There are separate settings for paid and free models.\"). Uncertainty: that list is dynamic and OpenRouter writes no separate clause for the free tier in its policy documents — this point rests on the per-model disclosures on the model catalogue page, not on policy text."
text_zh = "免费档的上游那一跳为「否」：模型目录页对当时列出的免费/匿名模型逐条披露「All prompts and completions for this model are logged by the provider and may be used to improve the model.」（个别条目为「logged by the model creator for feedback and training」）。OpenRouter 自身仍承诺不训练（隐私政策同一条适用于免费档），但按「任一跳明确为否，则全链为否」，免费档全链应视为**可能用于训练**。控制手段：账户设置里 free 档有独立的训练开关（provider-logging「There are separate settings for paid and free models.」）。不确定性：该清单是动态的，且 OpenRouter 未在政策文档中单独为免费档写条款——本条依据是模型目录页的逐模型披露，不是政策文本。"

[product.zdr]
mark = "no"
anchor = "openrouter-freemodels-provider-logs-training"

[[product.zdr.point]]
text = "Whole-chain verdict. OpenRouter's own hop has a ZDR policy, but on the free tier the weak hop is upstream: the model catalogue page discloses for the free/anonymous models listed at the time that \"**Note:** All prompts and completions for this model are logged by the provider and may be used to improve the model.\" Enforcing ZDR then removes those endpoints, so \"free tier + ZDR\" holds only for the free endpoints that are on the ZDR list — which cannot be confirmed in advance from the public pages (the list is a dynamic table)."
text_zh = "全链判定。OpenRouter 自身这一跳有 ZDR 政策，但免费档的弱跳在上游：模型目录页对当时列出的免费/匿名模型披露「All prompts and completions for this model are logged by the provider and may be used to improve the model.」。强制 ZDR 会把这些端点排除，故「免费档 + ZDR」只在免费端点位于 ZDR 名单内时成立，公开页面无法预先确认（清单是动态表格）。"

[[product.zdr.point]]
anchor = "openrouter-zdr-own-retention-policy-zdr"
text = "OpenRouter's own hop: \"OpenRouter itself has a ZDR policy; your prompts are not retained unless you specifically opt in to prompt logging.\" The same policy applies to the free tier, but it says nothing about the upstream hop."
text_zh = "OpenRouter 自身这一跳：「OpenRouter itself has a ZDR policy; your prompts are not retained unless you specifically opt in to prompt logging.」同一条政策适用于免费档，但对上游那一跳没有表态。"

[[product.zdr.point]]
anchor = "openrouter-zdr-conservative-stance-zdr"
text = "For endpoints whose policy cannot be confirmed, OpenRouter takes a conservative stance and will \"assume that the endpoint both retains and trains on data and mark it as such\"."
text_zh = "对政策无法确认的端点，OpenRouter 取保守假设「assume that the endpoint both retains and trains on data and mark it as such」。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "openrouter-datacollection-no-store-unless-optin-retention"

[[product.retention.point]]
text = "Object and context kept apart: on OpenRouter's own hop prompts and responses are likewise not written to disk on the free tier (the same policy clause), but the **upstream** retention period for free/anonymous models is not disclosed on OpenRouter's public pages (in the dynamic provider-logging table most upstreams show \"Prompts are retained for unknown period\"). So the content retention period for the free tier is unspecified overall."
text_zh = "对象与语境分开：OpenRouter 自身这一跳对免费档同样不落盘 prompt/response（同一条政策），但**上游**对免费/匿名模型的保留期在 OpenRouter 公开页面上未披露（provider-logging 的动态表里多数上游显示「Prompts are retained for unknown period」）。故免费档的正文保留期整体为 unspecified。"

[[product.retention.point]]
anchor = "openrouter-privacy-files-api-retention-retention"
text = "Other object — Files API uploads: \"Uploaded Files are retained by us until you delete them or close your account, subject to the exceptions described below.\""
text_zh = "另一类对象——Files API 上传文件：「Uploaded Files are retained by us until you delete them or close your account, subject to the exceptions described below.」"

[[product.retention.point]]
anchor = "openrouter-privacy-media-ephemeral-retention"
text = "Other object — image/audio/video inputs: \"We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.\""
text_zh = "另一类对象——图片/音频/视频输入：「We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.」"

[product.processing_region]
codes = ["US"]
anchor = "openrouter-dpa-schedule2-us-regions-region"

[[product.processing_region.point]]
text = "Same as the API tier: Google Cloud Platform hosting in US regions by default"
text_zh = "同 API 档：默认 GCP US regions"

[[product.processing_region.point]]
text = "In-region routing is a paid Business/Enterprise feature that the free tier usually does not have. The actual processing location of an upstream endpoint is decided by each vendor, and OpenRouter does not disclose it model by model for free models."
text_zh = "in-region 是 Business/Enterprise 付费功能，免费档通常不具备。上游端点的实际处理地由各厂商决定，OpenRouter 未按免费模型逐条披露。"

[product.role]
kind = "processor"
anchor = "openrouter-dpa-2-1-roles-role"

[[product.role.point]]
anchor = "openrouter-terms-10-2-dpa-commercial-scope-role"
text = "Same as the API tier, with the scope limit stated in the terms: the DPA is addressed to \"If you are part of and represent an organization in entering into these Terms or use the Service for commercial, for-profit purposes\", so whether an individual user on the free tier falls under the DPA — and therefore whether OpenRouter is their Processor — is not stated, hence low confidence."
text_zh = "同 API 档，并写明条款里的适用范围限定：DPA 面向「If you are part of and represent an organization in entering into these Terms or use the Service for commercial, for-profit purposes」，故免费档个人用户是否落入 DPA（即 OpenRouter 是否为其 Processor）未明确，置信度低。"

[[product]]
id = "byok"
badge = "BYOK"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "openrouter-privacy-model-provider-data-practices-training"

[[product.training.point]]
text = "Whole-chain verdict, same as the API tier: OpenRouter itself commits not to train, but the upstream hop is a no — the privacy policy says \"Some Model Providers may use your Inputs and Outputs for model training or improvement.\", and BYOK does not change that: \"Training (`data_collection`) restrictions still follow the policy that OpenRouter tracks for the endpoint.\""
text_zh = "全链判定，同 API 档：OpenRouter 自身承诺不训练，但上游那一跳为「否」——隐私政策明说「Some Model Providers may use your Inputs and Outputs for model training or improvement.」，而 BYOK 不改变这一点：「Training (`data_collection`) restrictions still follow the policy that OpenRouter tracks for the endpoint.」"

[[product.training.point]]
anchor = "openrouter-byok-training-restrictions-follow-endpoint-training"
text = "Training restrictions on a BYOK request are still the endpoint's, and BYOK changes neither the routing pool nor the data policy: \"Your data policies apply to BYOK endpoints. A BYOK key changes the credential for the upstream request. It does not change which endpoints you can route to.\""
text_zh = "BYOK 请求的训练限制仍按端点政策，且 BYOK 既不改变可路由端点也不改变 data policy：「Your data policies apply to BYOK endpoints. A BYOK key changes the credential for the upstream request. It does not change which endpoints you can route to.」"

[[product.training.point]]
anchor = "openrouter-zdr-conservative-stance-zdr"
text = "Endpoints whose policy cannot be confirmed count as training: \"If OpenRouter is not able to establish or ascertain a clear policy for a provider or endpoint, we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such.\""
text_zh = "政策无法确认的端点按会训练计：「If OpenRouter is not able to establish or ascertain a clear policy for a provider or endpoint, we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such.」"

[[product.training.point]]
text = "The upstream hop is governed by your own agreement with that provider (which OpenRouter cannot see)."
text_zh = "上游那一跳以你自己与厂商的协议为准（OpenRouter 看不到该协议）。"

[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "openrouter-byok-zdr-declaration-zdr"

[[product.zdr.point]]
text = "By default a BYOK key does not exempt you from ZDR restrictions: an endpoint that retains prompts stays blocked (\"When you do, an endpoint that retains prompts stays blocked. Your own key does not change that.\"). The exception is a key whose \"Provider agreement → Zero data retention\" is declared as \"My account has ZDR\", which is let through; the declaration **does not cover video generation**, and OpenRouter says plainly that \"OpenRouter cannot see your provider agreement\", i.e. it is the customer's own attestation, not verification by OpenRouter."
text_zh = "默认情况下 BYOK 键不豁免 ZDR 限制：端点会保留 prompt 时仍被拦（「When you do, an endpoint that retains prompts stays blocked. Your own key does not change that.」）。例外是 key 上「Provider agreement → Zero data retention」声明为「My account has ZDR」时放行，声明**不覆盖视频生成**，且 OpenRouter 明说「OpenRouter cannot see your provider agreement」，即这只是客户自述、不是 OpenRouter 的核验。"

[[product.zdr.point]]
anchor = "openrouter-zdr-conservative-stance-zdr"
text = "Even with a declaration in place, endpoints whose policy cannot be confirmed count as retaining: \"If OpenRouter is not able to establish or ascertain a clear policy for a provider or endpoint, we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such.\""
text_zh = "即便有声明，政策无法确认的端点仍按保留计：「If OpenRouter is not able to establish or ascertain a clear policy for a provider or endpoint, we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such.」"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "openrouter-datacollection-no-store-unless-optin-retention"

[[product.retention.point]]
text = "OpenRouter's own hop is the same as the default tier: \"OpenRouter does not store your prompts or responses, _unless_ you opt in to one or both of the following\", and once you opt in the period varies by feature and is only pointed at feature documentation (terms §6.3(c))."
text_zh = "OpenRouter 这一跳同默认档：「OpenRouter does not store your prompts or responses, _unless_ you opt in to one or both of the following」；opt-in 后的期限按功能而定、只指向功能文档（terms §6.3(c)）。"

[[product.retention.point]]
anchor = "openrouter-terms-6-2-optin-perpetual-license-retention"
text = "What opting in means: terms §6.2 grants OpenRouter a \"worldwide, perpetual, irrevocable, non-exclusive, royalty-free, fully paid right and license (with the right to sublicense) to host, store, transfer, display, perform, reproduce, modify for the purpose of formatting for display, adapt, translate, and prepare derivative works of, and distribute your User Content, in whole or in part, in any media formats and through any media channels now known or hereafter developed, for purposes of providing the Services to you and for our own commercial and business purposes.\""
text_zh = "opt-in 的含义：terms §6.2 授予 OpenRouter「worldwide, perpetual, irrevocable, non-exclusive, royalty-free, fully paid right and license (with the right to sublicense) to host, store, transfer, display, perform, reproduce, modify for the purpose of formatting for display, adapt, translate, and prepare derivative works of, and distribute your User Content, in whole or in part, in any media formats and through any media channels now known or hereafter developed, for purposes of providing the Services to you and for our own commercial and business purposes.」"

[[product.retention.point]]
anchor = "openrouter-terms-6-2-anonymized-sale-retention"
text = "That licence expressly includes example (3): \"license or sell your User Content in anonymized form, where your User Content is not associated with you or your account.\" So any period given for logged content is a floor, not a deletion promise."
text_zh = "该许可明确含示例 (3)：「license or sell your User Content in anonymized form, where your User Content is not associated with you or your account.」故已记录内容的任何期限都只是下限，不是删除承诺。"

[[product.retention.point]]
anchor = "openrouter-terms-6-3-b-processing-storage-retention"
text = "Context — bulk/large-volume requests: terms §6.3(b) says certain features \"such as batch or other large-volume request processing, require OpenRouter to temporarily store your User Content in order to process, route, and fulfill your request, including where the volume or size of a request cannot be processed in memory.\""
text_zh = "语境——批量/大体积请求：terms §6.3(b) 规定某些功能「such as batch or other large-volume request processing, require OpenRouter to temporarily store your User Content in order to process, route, and fulfill your request, including where the volume or size of a request cannot be processed in memory.」"

[[product.retention.point]]
anchor = "openrouter-privacy-files-api-retention-retention"
text = "Other object — Files API uploads: \"Uploaded Files are retained by us until you delete them or close your account, subject to the exceptions described below.\""
text_zh = "另一类对象——Files API 上传文件：「Uploaded Files are retained by us until you delete them or close your account, subject to the exceptions described below.」"

[[product.retention.point]]
anchor = "openrouter-privacy-media-ephemeral-retention"
text = "Other object — image/audio/video inputs: \"We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.\""
text_zh = "另一类对象——图片/音频/视频输入：「We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.」"

[[product.retention.point]]
text = "The upstream hop is determined by the customer's own agreement, which OpenRouter does not disclose on their behalf."
text_zh = "上游那一跳由客户自有协议决定，OpenRouter 不代为披露。"

[product.processing_region]
basis = "undisclosed"
anchor = "openrouter-byok-region-declaration-region"

[[product.processing_region.point]]
text = "Region rests on a declaration: \"On a regional domain, OpenRouter routes only to endpoints it has onboarded for that region (see In-Region Routing). OpenRouter cannot see where your own OpenAI account processes requests, so you tell OpenRouter.\" The Data region setting on a key offers Global / European Union / United States, and the declaration is the customer's attestation — \"OpenRouter does not verify it\"."
text_zh = "区域靠声明：「On a regional domain, OpenRouter routes only to endpoints it has onboarded for that region (see In-Region Routing). OpenRouter cannot see where your own OpenAI account processes requests, so you tell OpenRouter.」key 上的 Data region 有 Global / European Union / United States 三档，声明是客户自述——「OpenRouter does not verify it」。"

[[product.processing_region.point]]
text = "A region declaration does not change the key's retention policy (\"A region declaration does not change your key's retention policy.\")."
text_zh = "区域声明不改变 key 的保留政策（「A region declaration does not change your key's retention policy.」）。"

[product.role]
kind = "processor"
anchor = "openrouter-dpa-2-1-roles-role"

[[product.role.point]]
text = "For the part of the data OpenRouter itself processes it is still the Processor"
text_zh = "就 OpenRouter 自己处理的那部分数据仍是 Processor"

[[product.role.point]]
text = "But on the BYOK tier there is a further direct relationship between the customer and the upstream vendor (the customer holds the key), and the upstream's use of content is determined by that agreement."
text_zh = "但 BYOK 档下客户与上游厂商之间另有一层直接关系（客户自持密钥），上游对内容的使用由该协议决定。"

[[product]]
id = "enterprise"
badge = "企业版"
category = "api"
plan_level = "enterprise"

[product.training]
mark = "yes"
anchor = "openrouter-dpa-exhibitA-no-train-training"
mode = "by_contract"

[[product.training.point]]
text = "When the EU API is selected (Exhibit A), the DPA expressly says OpenRouter will \"not use API Payloads submitted through the EU API to train, fine-tune, improve, or develop models or services except as expressly instructed by Customer in writing\". Without EU-only it falls back to the general tier: OpenRouter itself does not train, and upstreams may still train (see top-level training)."
text_zh = "选择 EU API（Exhibit A）时，DPA 明文「not use API Payloads submitted through the EU API to train, fine-tune, improve, or develop models or services except as expressly instructed by Customer in writing」。未选择 EU-only 时回到通用档：OpenRouter 自身不训练，上游仍可能训练（见顶层 training）。"

[[product.training.point]]
anchor = "openrouter-zdr-conservative-stance-zdr"
text = "Outside EU-only processing the upstream hop is still the general case, and endpoints whose policy cannot be confirmed are assumed by OpenRouter to \"both retain and train on data\"."
text_zh = "未选择 EU-only 时上游那一跳仍按通用口径，政策无法确认的端点被 OpenRouter 假定「both retain and train on data」。"

[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "openrouter-dpa-2-4-a-delete-after-output-retention"

[[product.zdr.point]]
text = "The enterprise basis is the DPA itself, not the routing switches: §2.4(a) has OpenRouter delete Inputs and Outputs promptly following generation of the relevant Output (unless the customer has opted into prompt and/or chat logging, or where law or an abuse investigation requires otherwise), and §9 restates that \"OpenRouter's Zero Data Retention commitment applies immediately upon completion of each API request and response\", subject only to the narrow exceptions in the ZDR definition."
text_zh = "企业档的依据是 DPA 本身而非路由开关：§2.4(a) 规定 OpenRouter 在生成相应 Output 后及时删除 Inputs 与 Outputs（客户 opt-in 记录、或法律/恶意使用调查要求时除外），§9 重申「OpenRouter's Zero Data Retention commitment applies immediately upon completion of each API request and response」，仅受 ZDR 定义里的窄例外限制。"

[[product.zdr.point]]
anchor = "openrouter-dpa-9-zdr-immediate-zdr"
text = "§9 gives the immediate effect in its own words: \"OpenRouter's Zero Data Retention commitment applies immediately upon completion of each API request and response\"."
text_zh = "§9 用自己的措辞给出即时生效：「OpenRouter's Zero Data Retention commitment applies immediately upon completion of each API request and response」。"

[[product.zdr.point]]
anchor = "openrouter-dpa-2-4-b-no-upstream-guarantee-zdr"
text = "ZDR-only routing admits only registered upstreams and carries no guarantee for them: inclusion on the list \"reflects the AI Model Provider's published or represented policy of \"no retention and no training\" on zero-data-retention API payloads; it does not constitute OpenRouter's guarantee of AI Model Provider compliance\", so upstreams are still judged hop by hop."
text_zh = "ZDR-only 路由只放行已登记的上游，且不对其作保证：名单只「reflects the AI Model Provider's published or represented policy of \"no retention and no training\" on zero-data-retention API payloads; it does not constitute OpenRouter's guarantee of AI Model Provider compliance」，上游仍逐跳判定。"

[[product.zdr.point]]
anchor = "openrouter-zdr-conservative-stance-zdr"
text = "Endpoints whose policy cannot be confirmed count as retaining: \"we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such\"."
text_zh = "政策无法确认的端点按保留计：「we take a conservative stance and assume that the endpoint both retains and trains on data and mark it as such」。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "openrouter-dpa-2-4-a-delete-after-output-retention"

[[product.retention.point]]
text = "Object and context — inputs and outputs: \"OpenRouter will delete Inputs and Outputs promptly following generation of the relevant Output\" (DPA §2.4(a)), except where required by law or as necessary to address malicious use, and only if the customer has not opted into prompt and/or chat logging. That is a deletion commitment, not a fixed period."
text_zh = "对象与语境——输入输出：「OpenRouter will delete Inputs and Outputs promptly following generation of the relevant Output」（DPA §2.4(a)），例外为法律要求、恶意使用调查所需，且以客户未 opt-in 记录为前提。这是删除承诺，不是固定期限。"

[[product.retention.point]]
anchor = "openrouter-dpa-schedule1-retention-criteria-retention"
text = "Where a period is needed at all, the DPA states the criterion rather than a number: \"Personal Data will be retained for as long as necessary taking into account the purpose of the Processing, and in compliance with applicable laws, including laws on the statute of limitations and Data Protection Laws.\""
text_zh = "需要期限时，DPA 给的是判据而不是数字：「Personal Data will be retained for as long as necessary taking into account the purpose of the Processing, and in compliance with applicable laws, including laws on the statute of limitations and Data Protection Laws.」"

[[product.retention.point]]
anchor = "openrouter-dpa-schedule2-deletion-30-business-days-retention"
text = "The customer may request deletion at any time, and Schedule 2 commits to deletion from the datastores and backups within 30 business days."
text_zh = "客户可随时要求删除，Schedule 2 承诺 30 个工作日内从数据存储与备份删除。"

[[product.retention.point]]
anchor = "openrouter-terms-6-2-optin-perpetual-license-retention"
text = "If the customer opts into logging, terms §6.2 attaches a permanent licence: a \"worldwide, perpetual, irrevocable, non-exclusive, royalty-free, fully paid right and license (with the right to sublicense) to host, store, transfer, display, perform, reproduce, modify for the purpose of formatting for display, adapt, translate, and prepare derivative works of, and distribute your User Content, in whole or in part, in any media formats and through any media channels now known or hereafter developed, for purposes of providing the Services to you and for our own commercial and business purposes.\""
text_zh = "若客户 opt-in 记录，terms §6.2 附带永久许可：「worldwide, perpetual, irrevocable, non-exclusive, royalty-free, fully paid right and license (with the right to sublicense) to host, store, transfer, display, perform, reproduce, modify for the purpose of formatting for display, adapt, translate, and prepare derivative works of, and distribute your User Content, in whole or in part, in any media formats and through any media channels now known or hereafter developed, for purposes of providing the Services to you and for our own commercial and business purposes.」"

[[product.retention.point]]
anchor = "openrouter-terms-6-2-anonymized-sale-retention"
text = "That licence expressly includes example (3): \"license or sell your User Content in anonymized form, where your User Content is not associated with you or your account.\""
text_zh = "该许可明确含示例 (3)：「license or sell your User Content in anonymized form, where your User Content is not associated with you or your account.」"

[[product.retention.point]]
anchor = "openrouter-terms-6-3-b-processing-storage-retention"
text = "Context — bulk/large-volume requests: terms §6.3(b) says certain features \"such as batch or other large-volume request processing, require OpenRouter to temporarily store your User Content in order to process, route, and fulfill your request, including where the volume or size of a request cannot be processed in memory.\""
text_zh = "语境——批量/大体积请求：terms §6.3(b) 规定某些功能「such as batch or other large-volume request processing, require OpenRouter to temporarily store your User Content in order to process, route, and fulfill your request, including where the volume or size of a request cannot be processed in memory.」"

[[product.retention.point]]
anchor = "openrouter-privacy-files-api-retention-retention"
text = "Other object — Files API uploads: \"Uploaded Files are retained by us until you delete them or close your account, subject to the exceptions described below.\""
text_zh = "另一类对象——Files API 上传文件：「Uploaded Files are retained by us until you delete them or close your account, subject to the exceptions described below.」"

[[product.retention.point]]
anchor = "openrouter-privacy-media-ephemeral-retention"
text = "Other object — image/audio/video inputs: \"We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.\""
text_zh = "另一类对象——图片/音频/视频输入：「We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.」"

[product.processing_region]
codes = ["US", "EU"]
anchor = "openrouter-dpa-exhibitA-eu-only-processing-region"

[[product.processing_region.point]]
text = "The default is still Google Cloud Platform hosting in US regions"
text_zh = "默认仍是 GCP US regions"

[[product.processing_region.point]]
text = "Enterprise customers can choose in-region routing (EU/US), or select DPA Exhibit A on the Order Form for EU-only processing (which covers API Payloads only; account, billing and security logs are not restricted)."
text_zh = "企业客户可选 in-region routing（EU/US），或在 Order Form 选择 DPA Exhibit A 做 EU-only 处理（仅覆盖 API Payloads，账户/账单/安全日志不受限）。"

[product.role]
kind = "processor"
anchor = "openrouter-dpa-2-1-roles-role"

[[product.role.point]]
text = "The DPA states that Customer = Controller and OpenRouter = Processor, and includes subprocessor clauses (§5, with the list at trust.openrouter.ai), audit rights, SCCs/UK Addendum and other enterprise terms."
text_zh = "DPA 明确 Customer=Controller、OpenRouter=Processor，并含子处理者条款（§5，名单在 trust.openrouter.ai）、审计权、SCC/UK Addendum 等企业条款。"

[[product]]
id = "consumer_chat"
badge = "网页对话"
category = "web"
plan_level = "any"

[product.training]
mark = "no"
anchor = "openrouter-privacy-model-provider-data-practices-training"

[[product.training.point]]
text = "Whole-chain verdict, same as the API tier: the upstream hop is a no — the privacy policy says \"Some Model Providers may use your Inputs and Outputs for model training or improvement.\", and the FAQ states \"The same data privacy applies to the chatroom as the API.\", so that section covers the Chatroom too."
text_zh = "全链判定，同 API 档：上游那一跳为「否」——隐私政策明说「Some Model Providers may use your Inputs and Outputs for model training or improvement.」，FAQ 又写明「The same data privacy applies to the chatroom as the API.」，故该节同样覆盖 Chatroom。"

[[product.training.point]]
anchor = "openrouter-faq-chatroom-same-privacy-training"
text = "The Chatroom shares the API's data privacy: \"The same data privacy applies to the chatroom as the API.\""
text_zh = "Chatroom 与 API 是同一套数据隐私口径：「The same data privacy applies to the chatroom as the API.」"

[[product.training.point]]
anchor = "openrouter-privacy-enterprise-api-training"
text = "OpenRouter itself does not train on inputs or outputs (\"OpenRouter does not use your Inputs or Outputs for model training.\"), but that covers its own hop only."
text_zh = "OpenRouter 自身不训练输入输出（「OpenRouter does not use your Inputs or Outputs for model training.」），但只覆盖自身这一跳。"

[[product.training.point]]
text = "Upstreams still follow their own policies, and the \"Model Provider Data Practices\" section of the privacy policy applies to the Chatroom as well."
text_zh = "上游仍按其自身政策，隐私政策「Model Provider Data Practices」一节同样适用于 Chatroom。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "openrouter-zdr-own-retention-policy-zdr"

[[product.zdr.point]]
text = "OpenRouter's own \"your prompts are not retained unless you specifically opt in to prompt logging\" holds for the Chatroom as well"
text_zh = "OpenRouter 自身的「prompts are not retained unless you specifically opt in to prompt logging」对 Chatroom 同样成立"

[[product.zdr.point]]
text = "But the ZDR enforcement switches sit on the API routing side (`provider.zdr` / guardrail) and the Chatroom has no equivalent parameter, so this is recorded as a policy-layer statement only."
text_zh = "但 ZDR 强制开关是 API 路由侧的（`provider.zdr` / guardrail），Chatroom 没有对应参数，故此处只作政策层说明。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "openrouter-faq-chatroom-local-retention"

[[product.retention.point]]
text = "FAQ \"What data is logged during Chatroom use?\": \"The same data privacy applies to the chatroom as the API. All conversations in the chatroom are stored locally on your device. Conversations will not sync across devices.\" — i.e. conversation history does not go to the cloud"
text_zh = "FAQ「What data is logged during Chatroom use?」：『The same data privacy applies to the chatroom as the API. All conversations in the chatroom are stored locally on your device. Conversations will not sync across devices.』即会话历史不上云"

[[product.retention.point]]
text = "Logging on the request side is the same as the API (prompts and completions are not logged by default)."
text_zh = "请求侧日志口径同 API（默认不记录 prompt/completion）。"

[[product.retention.point]]
anchor = "openrouter-privacy-media-ephemeral-retention"
text = "Other object — image/audio/video inputs: \"We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.\""
text_zh = "另一类对象——图片/音频/视频输入：「We do not persist image, audio or video files beyond the duration necessary to route the request, except as required for abuse detection, security, billing, or legal compliance.」"

[product.processing_region]
codes = ["US"]
anchor = "openrouter-privacy-data-transfers-us-region"

[[product.processing_region.point]]
text = "In-region routing does not apply to the consumer tier (a Business/Enterprise feature); there is only the default wording of privacy policy §9: \"your personal data may be transferred to our servers in the US, or to other countries outside the European Economic Area\"."
text_zh = "消费档不适用 in-region routing（Business/Enterprise 功能），只有隐私政策 §9 的默认口径：数据可能被转移到美国或 EEA/UK 以外。"

[product.role]
kind = "controller"
anchor = "openrouter-terms-10-2-dpa-commercial-scope-role"

[[product.role.point]]
anchor = "openrouter-privacy-section11-purpose-table-role"
text = "The controller side is the privacy policy's §11 table of purposes, where OpenRouter relies on its own legal bases for its own purposes, e.g. \"Improve and develop our Service and conduct research. The legal basis is a legitimate interest.\""
text_zh = "控制者侧的依据是隐私政策 §11 用途表：OpenRouter 为自己的目的援引自己的法律基础，例如「Improve and develop our Service and conduct research. The legal basis is a legitimate interest.」"

[[product.role.point]]
text = "Individual users on the consumer tier generally do not fall under the DPA: terms §10.2 addresses \"If you are part of and represent an organization in entering into these Terms or use the Service for commercial, for-profit purposes\", so the DPA's Customer=Controller / OpenRouter=Processor allocation does not describe this tier."
text_zh = "消费档个人用户一般不落入 DPA：terms §10.2 面向「If you are part of and represent an organization in entering into these Terms or use the Service for commercial, for-profit purposes」，故 DPA 的 Customer=Controller / OpenRouter=Processor 分工不描述本档。"

[[product.role.point]]
text = "For content forwarded to a model provider, the model provider is independently responsible for its own use of it."
text_zh = "对转发给模型厂商的内容，模型厂商对其自身使用独立负责。"

