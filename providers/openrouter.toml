note = "OpenRouter FAQ 的「Privacy and data logging」节。给出 API 与 Chatroom 两档的日志口径、以及「OpenRouter 是 proxy」的自认。注意此页与 provider-selection 文档对「会训练的 provider 默认是否路由」说法不一致，两条并列见 training 维度 note。"

