note = "「Data Collection」文档页，覆盖 OpenRouter 自身对 prompt/response 的处理：默认不存储、两个 opt-in 开关（私有日志、以及以 1% 折扣换取 OpenRouter 使用输入输出）、匿名分类、以及始终保留的请求元数据。注意 jina 渲染的这版正文里没有页首 <Note> 块（「Any prompt retention on OpenRouter is always opt-in.」只存在于 .md 通道），故该句未作锚点。"

[[source]]
url = "https://openrouter.ai/openrouter/free"
channel = "developer_data"
tier = "core"
note = "Free Models Router（openrouter/free）的模型目录页，不是政策文档：它的「Related models」逐条列出当时的免费/匿名(cloaked)模型，其中绝大多数带一句上游数据披露『**Note:** All prompts and completions for this model are logged by the provider and may be used to improve the model.』（个别条目写作『It's free to use during this testing period, and prompts and completions are logged by the model creator for feedback and training』）。只用于免费档 products 行的上游那一跳，不作为 OpenRouter 自身政策的依据；该页模型清单是动态的。"

[[source]]
url = "https://openrouter.ai/privacy"
channel = "consumer_privacy"
