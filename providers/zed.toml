prefix = ""
exact = "Zed has no-training commitments from model providers, and provider agreements require zero data retention for inference requests except for [provider-designated models with safety retention](https://zed.dev/docs/ai/privacy-and-security#provider-safety-retention), such as Anthropic’s Covered Models."
suffix = ""
