[[product]]
id = "hosted"
badge = "Zed 托管模型"
category = "coding_plan"
plan_level = "individual"
label = "Zed 托管模型；也可改用本地模型或自带 key 绕过 Zed 托管推理，此时数据姿态由所选端点决定"
[product.training]
mark = "yes"
mode = "default"
anchor = "zed-hosted-zdr"

[[product.training.point]]
text_zh = "例外有两条：少数被模型厂商指定为「安全留存」的模型（如 Anthropic 的 Covered Models）不走零保留；以及你自己点了反馈或主动打开训练数据收集时，Zed 才会留 AI 数据。"
[product.zdr]
mark = "yes"
mode = "default"
anchor = "zed-hosted-zdr"
[product.retention]
object = "input_output"
basis = "none"
anchor = "zed-does-not-retain"
[[product.retention.point]]
text_zh = "Zed 默认不留提示词/代码上下文；托管模型商也为 ZDR。例外：供应商指定的安全保留模型（如 Anthropic Covered Models）至少保留 30 天，Zed 无法关闭。"
[product.processing_region]
codes = ["unknown"]
searched = ["https://zed.dev/docs/ai/privacy-and-security", "https://zed.dev/privacy-policy"]
[product.role]
kind = "controller"
anchor = "zed-role"
[[product.role.point]]
text_zh = "个人档隐私数据由 Zed 作为 controller；Business 客户范围内可转为 processor。遥测：编辑器本地遥测默认自动收集但可在设置关闭；使用托管服务时服务端遥测仍收集，且不包含源码。"

