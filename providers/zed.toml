text = "Business adds an org-level control the individual tier does not have: administrators on Zed Business can enforce a no-sharing policy org-wide, after which members cannot opt into Edit Prediction training data sharing or AI feedback ratings. It only strengthens the no-training verdict."
text_zh = "Business 档多了一层个人档没有的组织级控制：管理员可在全组织范围强制 no-sharing 策略，此后成员无法 opt-in Edit Prediction 训练数据共享与 AI 反馈评级。这一条只加强「不用于训练」的判定。"
anchor = "zed-business-nosharing"
[product.zdr]
mark = "yes"
mode = "default"
anchor = "zed-hosted-zdr"

