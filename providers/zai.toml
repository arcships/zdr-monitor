[[source]]
url = "https://docs.z.ai/legal-agreement/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "Z.AI 国际站 Privacy Policy（Last Update: September 29, 2025；控制者 JINGSHENG HENGXING TECHNOLOGY PTE.LTD，新加坡），同页末尾内嵌 Data Processing Addendum for API Services（DPA）。文档自身划了两条 scope：隐私政策本体『only applies to individual users and does not apply to content that we process on behalf of customers of our business offerings』→ 覆盖个人档（Lite/Pro/Max）：§1 公司为 controller、§7 保留期（input 随账户存续）、§8 处理地新加坡；DPA『governs the processing of the data provided by business and enterprises users（“Customers”）through API Services』→ 只覆盖企业/API 档：§1 客户为 controller、公司为 processor，§3(a) 新加坡，§4(b) 内容实时处理不存服务器，§4(c) 其他 Customer Data 终止后删除。同一 URL 覆盖两套档位口径，档位差异写入 scope_note 与 products[]。channel 判为 consumer_privacy：该 URL 是面向 individual users 的隐私政策本体，企业 DPA 只是同页内嵌章节。"

[[source]]
url = "https://docs.z.ai/legal-agreement/terms-of-use"
channel = "contract"
tier = "core"
note = "Z.AI 国际站 Terms of Use（Last Update: April 14, 2026；签约主体 JINGSHENG HENGXING TECHNOLOGY PTE.LTD，新加坡；适用范围自述为『as a user of the Z.ai accessible via z.ai/model-api』）。本页同时内嵌 Additional Terms for API Services。本档（GLM Coding Plan）没有独立条款页，subscription-terms §4.1 要求订阅者遵守 Terms of Use，故 ToU 是本档的合同层。页内并存两套训练口径：§IV.3(a)『For individual users, we reserve the right to process any User Content to improve our existing Services and/or to develop new products and services』并授权把非个人数据的 User Content 用于开发改进 ML/AI 技术、可存储于境外；§IV.5 对 individual users 又授予『unconditional, irrevocable … perpetual, worldwide license』；而 §IV.7 与 Additional Terms §3(b) 的『不训练』只写给『enterprises and developers using API Services』，Additional Terms 并声明其对该类使用优先于 ToU。本档被 subscription-terms §4.3 定义为 Personal-Use Only 的自然人个人订阅，落哪一套无厂商明文。"

