[[product]]
id = "api"
badge = "BYOK 转发"
category = "api"
plan_level = "any"
label = "AI Gateway 默认档(请求自带 provider key 或 BYOK;Cloudflare 仅代理转发)"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "cf-aigw-selfserve-customer-content-license-scope"

[[product.training.point]]
text = "Gateway hop (Cloudflare) conclusion: at contract level Cloudflare is granted no license to train models on customer content. The content license in Self-Serve Subscription Agreement §2.5.1 is limited verbatim to \"to the extent necessary to provide the Services\""
text_zh = "网关跳(Cloudflare)结论:合同层没有授予 Cloudflare 用客户内容训练模型的许可。《自助订阅协议》§2.5.1 的内容许可逐字限于『to the extent necessary to provide the Services』"

[[product.training.point]]
text = "§2.5.5 assigns to Cloudflare only the Network Data derived from server, network and traffic data, which it \"shall have the right to use ... for purposes of providing, maintaining, developing, and improving its Services\", and states expressly that \"Cloudflare may monitor and inspect the traffic on the Cloudflare network, including any related logs, as necessary to perform the Services or protect the security or integrity of Cloudflare's network\" — derived data and security monitoring are the two openings left"
text_zh = "§2.5.5 只把由服务器/网络/流量数据衍生出的 Network Data 归 Cloudflare,并可『use Network Data for purposes of providing, maintaining, developing, and improving its Services』,同时明文『Cloudflare may monitor and inspect the traffic on the Cloudflare network, including any related logs, as necessary to perform the Services or protect the security or integrity of Cloudflare's network』——衍生数据与安全监控是两个留出的口子"

[[product.training.point]]
text = "§2.5.3 separately authorizes Cloudflare to modify or scan customer content to enhance performance, security or the functionality of the Services. DPA §3.3 (CCPA scope) says \"Cloudflare will not retain, use, or disclose that Personal Data for any purposes other than the purposes set out in the Main Agreement and this DPA\", and the Network Data wording in Enterprise §5.4 matches the self-serve version. Cloudflare has a blunter sentence of its own — \"we do not use our customers' content to train any LLMs\" (Trust Hub Responsible AI page) — but that page consistently returns a tracking-pixel shell through the production fetch channel r.jina.ai and its body cannot be retrieved (see the render_error entry in sources), so it is not treated as an authoritative source this round, only as a lead. Upstream hop: AI Gateway is a forwarding gateway and the request is ultimately processed by the upstream provider"
text_zh = "§2.5.3 另授权 Cloudflare 修改/扫描客户内容以提升性能、安全或服务功能。DPA §3.3(CCPA 范围)写『Cloudflare will not retain, use, or disclose that Personal Data for any purposes other than the purposes set out in the Main Agreement and this DPA』,企业档 §5.4 的 Network Data 措辞与自助档同旨。Cloudflare 自己另有更直白的一句『we do not use our customers' content to train any LLMs』(Trust Hub Responsible AI 页),但该页在生产抓取通道 r.jina.ai 下固定返回跟踪像素壳、拿不到正文(见 sources 的 render_error 条),本轮不作为权威来源,只作线索。上游跳:AI Gateway 是转发网关,请求最终由上游 provider 处理"

[[product.training.point]]
text = "The documentation points the \"Terms and License\" of third-party models directly at each provider's own terms (every entry in the model catalog links to the upstream terms), and Self-Serve Subscription Agreement §3 likewise says a Third-Party Product is \"governed by the terms of service ... of the third party provider\" and that access is \"solely between you and the applicable Third-Party Product provider\". Cloudflare makes no commitment about whether upstreams train on requests; each has to be checked separately. Under the multi-hop rule, the end-to-end conclusion is governed by each upstream"
text_zh = "文档把第三方模型的『Terms and License』直接指向 provider 自家条款(模型目录页每条都链到上游条款),《自助订阅协议》§3 亦写第三方产品『governed by the terms of service ... of the third party provider』『solely between you and the applicable Third-Party Product provider』。上游是否用请求训练,Cloudflare 不作任何承诺,须逐家核。按多跳规则,全链结论以上游各家为准"

[[product.training.point]]
text = "This round reaches a conclusion for the gateway hop only."
text_zh = "本轮只对网关跳给结论。"

[product.zdr]
mark = "no"
anchor = "cf-aigw-ub-zdr-scope-managed-creds"

[[product.zdr.point]]
text = "BYOK / bring-your-own provider key tier: no ZDR option, and this is an express denial rather than a non-disclosure — the Unified Billing page states verbatim that the ZDR setting \"only applies to Unified Billing requests that use Cloudflare-managed credentials. It does not apply to BYOK or other AI Gateway requests.\" All this tier can do is switch logging or caching off; there is no request-level zero-retention commitment. Two further notes: (1) the AI Gateway Header Glossary calls itself a \"complete list of all supported headers\" yet omits cf-aig-zdr, while the Unified Billing page documents that header — on re-check this was judged a completeness problem of the reference page (not updated for the new header), not a contrary statement about the same tier and dimension, so it is not a contradiction and that source has been dropped. (2) Even with ZDR enabled on the Unified Billing tier, the vendor states that \"ZDR does not control AI Gateway logging\"."
text_zh = "BYOK / 请求自带 provider key 档:没有 ZDR 选项,且这是明确否定而非未披露——Unified Billing 页逐字写 ZDR 设置『only applies to Unified Billing requests that use Cloudflare-managed credentials. It does not apply to BYOK or other AI Gateway requests.』该档能做的只有关日志/关缓存,没有任何请求级零保留承诺。另记两处:①AI Gateway Header Glossary 自称是『complete list of all supported headers』,清单里却没有 cf-aig-zdr,而 Unified Billing 页明确文档了该头——重查后判为参考页文档完备性问题(参考页未随新头更新),不是对同一档位、同一维度的相反表述,不构成 contradiction,该 source 已 drop。②即便在 Unified Billing 档开了 ZDR,官方也说『ZDR does not control AI Gateway logging』。"

[product.retention]
object = "logs"
basis = "undisclosed"
anchor = "cf-aigw-logging-persist-no-time-limit"

[[product.retention.point]]
text = "Gateway hop conclusion: there is no time commitment at request level; content is persisted by default until the storage cap triggers deletion or logging is switched off. (1) Content kept by default: \"Logs, which include metrics as well as request and response data, are enabled by default for each gateway\", and the content includes the user prompt and the model response themselves"
text_zh = "网关跳结论:请求级没有任何时限承诺,正文默认被持久保存,直到触顶删除或被主动关闭。①默认留正文:日志对每个 gateway 默认开启(『Logs, which include metrics as well as request and response data, are enabled by default for each gateway』),内容含 user prompt 与 model response 正文"

[[product.retention.point]]
text = "Official wording: \"These logs persist, giving you the flexibility to store them for your preferred duration\" — only an entry-count cap is given (free 100,000 per account, paid 10,000,000 per gateway, 10 MB per entry), with no limit in days. (2) How to switch it off: disable logging as a whole in the settings"
text_zh = "官方措辞『These logs persist, giving you the flexibility to store them for your preferred duration』——只给条数上限(免费 100,000 条/账号、付费 10,000,000 条/gateway、单条 10 MB),没有天数上限。②关闭方式:设置里整体关闭日志"

[[product.retention.point]]
text = "Per request, cf-aig-collect-log: false skips the entire log entry"
text_zh = "逐请求 cf-aig-collect-log: false 跳过整条日志"

[[product.retention.point]]
text = "cf-aig-collect-log-payload: false skips only the payload and keeps the metadata (\"Payload storage is skipped. Metadata-only log entries are still saved.\"). (3) Behaviour at the cap: Automatic Log Deletion can be switched on to delete the oldest logs automatically, or new logs stop being written. (4) Cache: off by default"
text_zh = "cf-aig-collect-log-payload: false 只跳过正文而保留 metadata(『Payload storage is skipped. Metadata-only log entries are still saved.』)。③触顶行为:可开 Automatic Log Deletion 自动删最旧,或停止写入新日志。④缓存:默认关闭"

[[product.retention.point]]
text = "Once enabled, responses are cached by Cloudflare with a TTL of at least 60 seconds and at most 1 month. (5) Export: on paid tiers, Workers Logpush can push logs to the customer's own external storage. Contract-level comparison: Enterprise §5.2 says of Customer Data not stored on the customer's behalf as described in the documentation that Cloudflare \"may delete Customer Data at any time after seventy-two (72) hours\", but AI Gateway logs are content stored on the customer's behalf as documented, so that 72-hour floor does not apply — and \"logs are deleted after 72 hours\" cannot be inferred from it"
text_zh = "开启后响应由 Cloudflare 缓存,TTL 最短 60 秒、最长 1 个月。⑤导出:付费档 Workers Logpush 可把日志推送到客户自己的外部存储。合同层对照:企业档 §5.2 对『未按文档约定代客户存储』的 Customer Data 写『may delete Customer Data at any time after seventy-two (72) hours』,但 AI Gateway 日志属于文档约定代客户存储的内容,不适用该 72 小时下限——不能反推『日志 72 小时后删除』"

[[product.retention.point]]
text = "The retention period in the DPA Annex is written as \"Until the earliest of (i) expiry/termination of the Main Agreement, or (ii) the date upon which processing is no longer necessary...\", a contract-level retention criterion rather than a request-level period. Also: §2.5.5 gives Cloudflare the right to inspect network traffic and related logs, but no retention commitment for abuse-monitoring logs."
text_zh = "DPA Annex 的保留期写法是『Until the earliest of (i) expiry/termination of the Main Agreement, or (ii) the date upon which processing is no longer necessary...』,是合同层保留准则,不是请求级期限。另:§2.5.5 给了 Cloudflare 检查网络流量与相关日志的权限,但没有给 abuse 监控日志的保留期承诺。"

[product.processing_region]
codes = ["global"]
anchor = "cf-aigw-dls-compat-ai-gateway-row"

[[product.processing_region.point]]
text = "Gateway hop conclusion: by default there is no commitment at all about where data is processed or stored; only a paid enterprise add-on provides a limited regional boundary. (1) Default state: the CMB documentation says \"by default no boundary is applied and logs may be stored in Cloudflare's core data centers globally\""
text_zh = "网关跳结论:默认没有任何处理地/存储地承诺,只有企业付费附加项提供有限的区域边界。①默认态:CMB 文档写『by default no boundary is applied and logs may be stored in Cloudflare's core data centers globally』"

[[product.processing_region.point]]
text = "DPA §6.1: \"the parties anticipate that Cloudflare (and its sub-Processors) may process outside of the European Economic Area\", and §7.1 acknowledges processing outside the Originating Country. (2) In the DLS compatibility table the AI Gateway row reads Geo Key Manager ✘ / Regional Services ✘ / Customer Metadata Boundary 🚧 (conditional)"
text_zh = "DPA §6.1『the parties anticipate that Cloudflare (and its sub-Processors) may process outside of the European Economic Area』,§7.1 承认会在 Originating Country 之外处理。②DLS 兼容性表里 AI Gateway 一行是 Geo Key Manager ✘ / Regional Services ✘ / Customer Metadata Boundary 🚧(有条件)"

[[product.processing_region.point]]
text = "Footnote 15, as rendered by the direct .md channel of the docs, reads \"Jurisdictional Restrictions (storage) options for Logs are not supported today. All other features are available to all CMB regions.\" — i.e. AI Gateway can be placed under CMB, but CMB supports only the eu and us regions. (3) The contractual CMB commitment is \"Cloudflare will not transfer outside the configured region(s) any End User Customer Logs arising from Covered Services\", and DLS is sold only for Enterprise-plan zones at an extra 30% fee (Data Localization Suite section of the Service-Specific Terms). (4) Upstream hop: which provider processes the request in which region is governed by each provider's own policy; Cloudflare neither commits to nor discloses the target region of per-request routing. (5) Unverified / uncertain: whether AI Gateway is on CMB's \"Covered Services\" list is not itemized in the public documentation"
text_zh = "docs 的 .md 直连通道给出的脚注 15 原文为『Jurisdictional Restrictions (storage) options for Logs are not supported today. All other features are available to all CMB regions.』——即 AI Gateway 可配 CMB,但 CMB 只支持 eu / us 两区。③CMB 的合同承诺是『Cloudflare will not transfer outside the configured region(s) any End User Customer Logs arising from Covered Services』,且 DLS 只对企业版 zone 销售、额外收 30% 费用(《服务专用条款》Data Localization Suite 一节)。④上游跳:请求最终由哪家 provider 在哪个区域处理,由各家自己的政策决定,Cloudflare 不承诺、也不披露逐请求路由的目标区域。⑤未核/不确定:AI Gateway 是否被列入 CMB 的『Covered Services』清单,公开文档没有逐项列名"

[[product.processing_region.point]]
text = "Footnote 15 is readable only through the direct channel (jina drops footnotes)."
text_zh = "脚注 15 只在 direct 通道可读(jina 丢脚注)。"

[product.role]
kind = "processor"
anchor = "cf-aigw-dpa-cloudflare-is-processor"

[[product.role.point]]
text = "Gateway hop conclusion: Cloudflare designates itself processor. DPA §2.3: \"the Customer is the Controller (or a Processor processing Personal Data on behalf of a third-party Controller), and Cloudflare is a Processor (or sub-Processor, as applicable)\", and the Annex role table says the same"
text_zh = "网关跳结论:Cloudflare 自认处理受托方(processor)。DPA §2.3『the Customer is the Controller (or a Processor processing Personal Data on behalf of a third-party Controller), and Cloudflare is a Processor (or sub-Processor, as applicable)』,Annex 角色表同旨"

[[product.role.point]]
text = "§3.1(i) provides that, following termination or expiry of the Main Agreement or completion of the Service, all personal data is deleted or returned at the customer's choice"
text_zh = "§3.1(i) 约定主协议终止/到期或服务完成后,按客户选择删除或返还全部个人数据"

[[product.role.point]]
text = "§4.3 has the customer give blanket written authorization for Cloudflare group members and data-center and support third parties to act as sub-processors, with the sub-processor list at cloudflare.com/gdpr/subprocessors/. Upstream hop: not a question about Cloudflare's role — Self-Serve Subscription Agreement §3 states plainly that a Third-Party Product is \"governed by the terms of service ... of the third party provider\" and is \"solely between you and the applicable Third-Party Product provider\", each upstream provider being responsible for its own processing. Difference between the two tiers: on the BYOK / own-key tier the customer has a direct contractual and credential relationship with the upstream and Cloudflare is only a proxy"
text_zh = "§4.3 客户对 Cloudflare 集团成员及数据中心/支持类第三方作为子处理者给出一揽子书面授权,子处理者清单在 cloudflare.com/gdpr/subprocessors/。上游跳:不是 Cloudflare 的角色问题——《自助订阅协议》§3 明写第三方产品『governed by the terms of service ... of the third party provider』『solely between you and the applicable Third-Party Product provider』,上游 provider 各自对其处理负责。两档差异:BYOK/自带 key 档,客户与上游有直接的合同与凭据关系,Cloudflare 只是代理"

[[product.role.point]]
text = "On the Unified Billing tier the credentials are held by Cloudflare and usage is billed against Cloudflare credit (\"the request is served with Cloudflare-managed credentials and billed against your Cloudflare credit balance\", with provider inference pricing \"passed through with no markup\"), so Cloudflare is an intermediary in the billing chain — but the documentation does not disclose on what terms Cloudflare contracts with the upstreams, which is this tier's biggest open question."
text_zh = "Unified Billing 档凭据由 Cloudflare 托管、按 Cloudflare 额度计费(『the request is served with Cloudflare-managed credentials and billed against your Cloudflare credit balance』,provider 推理价『passed through with no markup』),即 Cloudflare 在结算上是中间方——但文档没有披露 Cloudflare 与上游之间以何种条款签约,这是本档最大的不确定点。"

[[product]]
id = "unified-billing"
badge = "统一计费"
category = "api"
plan_level = "any"
label = "AI Gateway Unified Billing(Cloudflare 托管凭据、预付费转售;唯一可开 ZDR 的档)"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "cf-aigw-selfserve-customer-content-license-scope"

[[product.training.point]]
text = "Same source as the api tier: the contractual content license is still limited to what is \"necessary to provide the Services\", and the same two openings (Network Data and security monitoring) apply"
text_zh = "与 api 档同源:合同层内容许可仍限于『necessary to provide the Services』,Network Data 与安全监控两个口子同样适用"

[[product.training.point]]
text = "The documentation makes no separate training commitment for Unified Billing. The difference lies in credentials and billing — requests on this tier are sent with Cloudflare-managed credentials and billed against Cloudflare credit, but the public documentation does not disclose on what terms Cloudflare contracts with the upstream providers, so whether upstreams train on requests is equally unresolved on this tier."
text_zh = "文档没有对 Unified Billing 另作训练承诺。差别在凭据与结算——该档请求由 Cloudflare 托管凭据发出、按 Cloudflare 额度计费,但公开文档未披露 Cloudflare 与上游 provider 之间以何种条款签约,因此上游是否用请求训练在本档同样无解。"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "cf-aigw-ub-zdr-routes-upstream"

[[product.zdr.point]]
text = "Unified Billing tier: there is a ZDR switch, but with three layers of qualification, and the commitment lands on the upstream endpoint side. (1) The wording is verbatim \"Zero Data Retention (ZDR) routes Unified Billing traffic through provider endpoints that do not retain prompts or responses\" — the party not retaining prompts or responses is the provider endpoints (upstream), while what Cloudflare provides is the routing and the setting (\"maps to ZDR-capable upstream provider configurations\"). (2) Scope: only Unified Billing requests that use Cloudflare-managed credentials; BYOK and other AI Gateway requests are out of scope"
text_zh = "Unified Billing 档:有 ZDR 开关,但有三层限定,且承诺落在上游端点一侧。①逐字表述是『Zero Data Retention (ZDR) routes Unified Billing traffic through provider endpoints that do not retain prompts or responses』——不保留 prompt/response 的主体是 provider endpoints(上游),Cloudflare 侧提供的是路由与设置(『maps to ZDR-capable upstream provider configurations』)。②适用范围:仅使用 Cloudflare 托管凭据的 Unified Billing 请求,BYOK 与其他 AI Gateway 请求不适用"

[[product.zdr.point]]
text = "The documentation at the time listed only two supported upstreams, OpenAI and Anthropic; enabling it for a provider that does not support ZDR means AI Gateway \"falls back to the standard (non-ZDR) Unified Billing configuration\". (3) \"ZDR does not control AI Gateway logging.\" — with ZDR on, logging still has to be switched off separately, or the gateway side still keeps the prompt and response content. How to enable: the gateway-level zdr setting (off by default) or cf-aig-zdr: true per request. For the model-by-model view see the AI model catalog page (90 of 226 entries carry a Zero data retention marker, and the same page also has entries without it). This tier's ZDR must not be read as \"Cloudflare commits to zero retention\": it is a mapping onto upstream endpoint configurations and does not cover the gateway's own logs."
text_zh = "文档当时只列 OpenAI 与 Anthropic 两个上游支持,给不支持 ZDR 的 provider 开启会『falls back to the standard (non-ZDR) Unified Billing configuration』。③『ZDR does not control AI Gateway logging.』——开了 ZDR 仍要单独关日志,否则网关侧仍留 prompt/response 正文。开启方式:网关级 zdr 设置(默认未开启)或逐请求 cf-aig-zdr: true。逐模型对照见 AI 模型目录页(226 条中 90 条带 Zero data retention 标记,同页也有不带该标记的条目)。不能把本档的 ZDR 当成『Cloudflare 承诺零保留』:它是对上游端点配置的映射,且不覆盖网关自身日志。"

[product.retention]
object = "logs"
basis = "undisclosed"
anchor = "cf-aigw-logging-persist-no-time-limit"

[[product.retention.point]]
text = "Same as the api tier: logging is a gateway-level behaviour, on by default, containing prompt and response content, persisted, and bounded by an entry-count cap. One official qualification must be recorded alongside on this tier: \"ZDR does not control AI Gateway logging\" — with ZDR on, logging still has to be switched off separately before nothing is written on the gateway side."
text_zh = "与 api 档相同:日志是 gateway 级行为,默认开、含 prompt/response 正文、持久保存、按条数上限。该档另有一处必须并列的官方限定:『ZDR does not control AI Gateway logging』——开了 ZDR 仍要单独关日志才算网关侧不落盘。"

[product.processing_region]
codes = ["global"]
anchor = "cf-aigw-dls-compat-ai-gateway-row"

[[product.processing_region.point]]
text = "Gateway hop conclusion: by default there is no commitment at all about where data is processed or stored; only a paid enterprise add-on provides a limited regional boundary. (1) Default state: the CMB documentation says \"by default no boundary is applied and logs may be stored in Cloudflare's core data centers globally\""
text_zh = "网关跳结论:默认没有任何处理地/存储地承诺,只有企业付费附加项提供有限的区域边界。①默认态:CMB 文档写『by default no boundary is applied and logs may be stored in Cloudflare's core data centers globally』"

[[product.processing_region.point]]
text = "DPA §6.1: \"the parties anticipate that Cloudflare (and its sub-Processors) may process outside of the European Economic Area\", and §7.1 acknowledges processing outside the Originating Country. (2) In the DLS compatibility table the AI Gateway row reads Geo Key Manager ✘ / Regional Services ✘ / Customer Metadata Boundary 🚧 (conditional)"
text_zh = "DPA §6.1『the parties anticipate that Cloudflare (and its sub-Processors) may process outside of the European Economic Area』,§7.1 承认会在 Originating Country 之外处理。②DLS 兼容性表里 AI Gateway 一行是 Geo Key Manager ✘ / Regional Services ✘ / Customer Metadata Boundary 🚧(有条件)"

[[product.processing_region.point]]
text = "Footnote 15, as rendered by the direct .md channel of the docs, reads \"Jurisdictional Restrictions (storage) options for Logs are not supported today. All other features are available to all CMB regions.\" — i.e. AI Gateway can be placed under CMB, but CMB supports only the eu and us regions. (3) The contractual CMB commitment is \"Cloudflare will not transfer outside the configured region(s) any End User Customer Logs arising from Covered Services\", and DLS is sold only for Enterprise-plan zones at an extra 30% fee (Data Localization Suite section of the Service-Specific Terms). (4) Upstream hop: which provider processes the request in which region is governed by each provider's own policy; Cloudflare neither commits to nor discloses the target region of per-request routing. (5) Unverified / uncertain: whether AI Gateway is on CMB's \"Covered Services\" list is not itemized in the public documentation"
text_zh = "docs 的 .md 直连通道给出的脚注 15 原文为『Jurisdictional Restrictions (storage) options for Logs are not supported today. All other features are available to all CMB regions.』——即 AI Gateway 可配 CMB,但 CMB 只支持 eu / us 两区。③CMB 的合同承诺是『Cloudflare will not transfer outside the configured region(s) any End User Customer Logs arising from Covered Services』,且 DLS 只对企业版 zone 销售、额外收 30% 费用(《服务专用条款》Data Localization Suite 一节)。④上游跳:请求最终由哪家 provider 在哪个区域处理,由各家自己的政策决定,Cloudflare 不承诺、也不披露逐请求路由的目标区域。⑤未核/不确定:AI Gateway 是否被列入 CMB 的『Covered Services』清单,公开文档没有逐项列名"

[[product.processing_region.point]]
text = "Footnote 15 is readable only through the direct channel (jina drops footnotes)."
text_zh = "脚注 15 只在 direct 通道可读(jina 丢脚注)。"

[product.role]
kind = "processor"
anchor = "cf-aigw-dpa-cloudflare-is-processor"

[[product.role.point]]
text = "Gateway hop conclusion: Cloudflare designates itself processor. DPA §2.3: \"the Customer is the Controller (or a Processor processing Personal Data on behalf of a third-party Controller), and Cloudflare is a Processor (or sub-Processor, as applicable)\", and the Annex role table says the same"
text_zh = "网关跳结论:Cloudflare 自认处理受托方(processor)。DPA §2.3『the Customer is the Controller (or a Processor processing Personal Data on behalf of a third-party Controller), and Cloudflare is a Processor (or sub-Processor, as applicable)』,Annex 角色表同旨"

[[product.role.point]]
text = "§3.1(i) provides that, following termination or expiry of the Main Agreement or completion of the Service, all personal data is deleted or returned at the customer's choice"
text_zh = "§3.1(i) 约定主协议终止/到期或服务完成后,按客户选择删除或返还全部个人数据"

[[product.role.point]]
text = "§4.3 has the customer give blanket written authorization for Cloudflare group members and data-center and support third parties to act as sub-processors, with the sub-processor list at cloudflare.com/gdpr/subprocessors/. Upstream hop: not a question about Cloudflare's role — Self-Serve Subscription Agreement §3 states plainly that a Third-Party Product is \"governed by the terms of service ... of the third party provider\" and is \"solely between you and the applicable Third-Party Product provider\", each upstream provider being responsible for its own processing. Difference between the two tiers: on the BYOK / own-key tier the customer has a direct contractual and credential relationship with the upstream and Cloudflare is only a proxy"
text_zh = "§4.3 客户对 Cloudflare 集团成员及数据中心/支持类第三方作为子处理者给出一揽子书面授权,子处理者清单在 cloudflare.com/gdpr/subprocessors/。上游跳:不是 Cloudflare 的角色问题——《自助订阅协议》§3 明写第三方产品『governed by the terms of service ... of the third party provider』『solely between you and the applicable Third-Party Product provider』,上游 provider 各自对其处理负责。两档差异:BYOK/自带 key 档,客户与上游有直接的合同与凭据关系,Cloudflare 只是代理"

[[product.role.point]]
text = "On the Unified Billing tier the credentials are held by Cloudflare and usage is billed against Cloudflare credit (\"the request is served with Cloudflare-managed credentials and billed against your Cloudflare credit balance\", with provider inference pricing \"passed through with no markup\"), so Cloudflare is an intermediary in the billing chain — but the documentation does not disclose on what terms Cloudflare contracts with the upstreams, which is this tier's biggest open question. Additional note for this tier: Cloudflare is a reselling intermediary in the billing chain (5% fee, provider inference pricing passed through), but the documentation does not say whether it contracts with the upstream in its own name."
text_zh = "Unified Billing 档凭据由 Cloudflare 托管、按 Cloudflare 额度计费(『the request is served with Cloudflare-managed credentials and billed against your Cloudflare credit balance』,provider 推理价『passed through with no markup』),即 Cloudflare 在结算上是中间方——但文档没有披露 Cloudflare 与上游之间以何种条款签约,这是本档最大的不确定点。 本档补充:Cloudflare 在结算上是转售中间方(5% 手续费、provider 推理价透传),但文档未说明它是否以自己名义与上游签约。"

