[[product.zdr.point]]
text = "The vendor discloses no zero-retention / ZDR option, switch or application method for Workers AI hosted inference — this is \"undisclosed\", not \"a commitment to the contrary\", and must not be read in reverse as not being offered. Scope checked: every page enumerated in the Workers AI documentation site's llms.txt (overview, data-usage, models, limits, pricing, glossary, event-subscriptions, changelog, errors, configuration/*, features/* including prompt-caching, batch-api, fine-tunes, function-calling, json-mode, markdown-conversion, prompting and reject-if-busy, and guides/*, 25 pages in all) was checked page by page, with no ZDR / zero data retention wording found"
text_zh = "官方未披露 Workers AI 托管推理的零保留 / ZDR 选项、开关或申请方式——这是「未披露」，不是「承诺相反」，不得反向解读为不提供。已核范围：Workers AI 文档站 llms.txt 枚举的全部页面（overview、data-usage、models、limits、pricing、glossary、event-subscriptions、changelog、errors、configuration/*、features/*（含 prompt-caching、batch-api、fine-tunes、function-calling、json-mode、markdown-conversion、prompting、reject-if-busy）、guides/*，共 25 页）逐页核过，无 ZDR / zero data retention / 零保留字样"

[[product.zdr.point]]
text = "Of the 226 entries in the unified model catalog, all 90 carrying a \"Zero data retention\" tag are Third-party (external providers reached through AI Gateway), and not one of the 65 Cloudflare-hosted entries (the Workers AI catalog) carries the tag. Cross-entry dependency (important): AI Gateway does have a ZDR switch, but the documentation states plainly that it \"only applies to Unified Billing requests that use Cloudflare-managed credentials\" and that \"ZDR is currently supported for: OpenAI / Anthropic\" — so routing Workers AI requests through AI Gateway (unified billing) still does not obtain ZDR; that switch works only for OpenAI's and Anthropic's third-party models"
text_zh = "统一模型目录 226 条里带「Zero data retention」标签的 90 条全部是 Third-party（经 AI Gateway 接入的外部 provider），65 条 Cloudflare-hosted（即 Workers AI 目录）无一带该标签。跨条目依赖（重要）：AI Gateway 确有 ZDR 开关，但文档明文「only applies to Unified Billing requests that use Cloudflare-managed credentials」且「ZDR is currently supported for: OpenAI / Anthropic」——即把 Workers AI 请求接到 AI Gateway（unified billing）也拿不到 ZDR，该开关只对 OpenAI/Anthropic 的第三方模型成立"

[[product.zdr.point]]
text = "Also \"ZDR does not control AI Gateway logging\": logging has to be switched off separately. Observations pointing the other way (not equivalent to a ZDR commitment): data-usage's \"may be stored ... if you specifically use a storage service\" and the prompt caching description of cached input tensors indicate that the default inference path does not write content to disk, but those are descriptions of conditions and uses."
text_zh = "另「ZDR does not control AI Gateway logging」，日志要单独关。反向观察（不等于 ZDR 承诺）：data-usage 的「may be stored ... if you specifically use a storage service」与 prompt caching 的输入张量缓存说明，说明默认推理路径不落盘正文，但那是条件/用途描述。"

[[product.zdr.point]]
text = "The catalog entry previously bound here is a third-party model's tag (\"Alibaba's HappyHorse 1.0 … - Third-party - Zero data retention\"), i.e. it describes another provider's posture, not Workers AI's, so it is not a statement on this dimension and is no longer bound to this entry. It stays as contrast material in the point above."
text_zh = "原先绑在本条的引文是统一目录里某个第三方模型的标签（「… - Third-party - Zero data retention」），说的是别的 provider 的立场，不构成对 Workers AI 本维度的表述，故不再绑在本条；它作为对照材料仍保留在上一条里。"

[[product.zdr.point]]
text = "Content-isolation fact recorded as circumstantial evidence, not as a ZDR statement and not as this dimension's basis (it says nothing about whether content is retained, for how long, or about a zero-retention option): \"Cloudflare does not make your Customer Content available to any other Cloudflare customer.\" Non-disclosure of a ZDR option for Workers AI hosted inference therefore stands as recorded above, and this dimension stays undisclosed."
text_zh = "内容隔离层的事实，作为旁证记录，不构成 ZDR 表述、也不作为本维度的判定依据（它没有说明内容是否保留、保留多久，也没有说明零保留选项）：「Cloudflare does not make your Customer Content available to any other Cloudflare customer.」Workers AI 托管推理的 ZDR 选项仍属未披露，本维度维持未披露。"
anchor = "wai-data-usage-no-other-customer"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "dpa-retention-annex1"

[[product.retention.point]]
text = "Conclusion: there is no request-level (input/output) retention commitment and the vendor gives no uniform period, hence duration_kind=unspecified. Recorded item by item (with object and context): (1) docs: Customer Content \"may be stored by Cloudflare if you specifically use a storage service (e.g., R2, KV, DO, Vectorize)\" — the condition is that the customer uses a storage service, not a retention period on the inference path"
text_zh = "结论：不存在请求级（输入/输出）保留期承诺，官方也未给出统一期限，故 duration_kind=unspecified。逐条并列（含对象与语境）：(1) docs：Customer Content「may be stored by Cloudflare if you specifically use a storage service (e.g., R2, KV, DO, Vectorize)」——条件是客户自己用存储服务，不是推理路径的保留期"

[[product.retention.point]]
text = "(2) Prompt caching: on by default for some models, storing the input tensors computed in the prefill stage, with no duration or eviction rule disclosed (object = a derived cache of the input tensors)"
text_zh = "(2) Prompt caching：默认对部分模型开启，会存储 prefill 阶段计算的输入张量，未披露时长或清除规则（对象=输入张量的派生缓存）"

[[product.retention.point]]
text = "(3) The retention-period field of DPA Annex 1: \"Until the earliest of (i) expiry/termination of the Main Agreement, or (ii) the date upon which processing is no longer necessary...\" (object = Personal Data, context = within the DPA's scope)"
text_zh = "(3) DPA Annex 1 的保留期栏：「Until the earliest of (i) expiry/termination of the Main Agreement, or (ii) the date upon which processing is no longer necessary...」（对象=Personal Data，语境=DPA 适用范围内）"

[[product.retention.point]]
text = "DPA §3.1(i): deletion or return at the customer's choice after termination"
text_zh = "DPA §3.1(i) 终止后按客户选择删除或返还"

[[product.retention.point]]
text = "(4) ESA §5.2: except for content \"Cloudflare has agreed to store on behalf of Customer\", Cloudflare \"may delete Customer Data at any time after seventy-two (72) hours from the time such Customer Data is captured by Cloudflare\" — that is a right to delete (floor-type wording) and \"must be deleted after 72 hours\" cannot be inferred from it"
text_zh = "(4) ESA §5.2：除「Cloudflare has agreed to store on behalf of Customer」的内容外，Cloudflare 可在 Customer Data 被捕获 72 小时后随时删除——这是删除权利（下限式表述），不能反推「72 小时后必删」"

[[product.retention.point]]
text = "(5) ESA §11.5: for up to 72 hours after termination Cloudflare will still use reasonable efforts to make Customer Logs available"
text_zh = "(5) ESA §11.5：终止后最多 72 小时内仍尽力提供 Customer Logs"

[[product.retention.point]]
text = "ESA §6.2: account information and audit logs may be retained as business and compliance needs require"
text_zh = "ESA §6.2：账户信息与审计日志可按业务与合规需要 retain"

[[product.retention.point]]
text = "(6) EU Data Act Addendum (EU customers) §10.1: after termination the Customer's Data is kept for 30 calendar days for retrieval or erasure, and §10.2: Exportable Data is erased once that period ends"
text_zh = "(6) EU Data Act Addendum（欧盟客户）§10.1 终止后保留 Customer's Data 30 个日历日供取回或擦除、§10.2 期满擦除 Exportable Data"

[[product.retention.point]]
text = "(7) Service-Specific Terms → Cloudflare Developer Platform §9 — object = content uploaded to the Developer Platform, context = after expiry or termination of the trial or subscription, type = upper bound on a retrieval window, with no retention obligation: \"Subject to Section 8 above, you may be permitted to access the Customer Content you uploaded to the Developer Platform for up to thirty (30) days following the expiration or termination of your trial or subscription. You understand that Cloudflare has no obligation to retain the Customer Content you upload to the Developer Platform following the expiration or termination of your trial or subscription.\" Scope matters for procurement: the clause sits in the Developer Platform subsection whose product list (Cloudflare Workers; Cloudflare Pages; Workers KV; D1; Durable Objects; Vectorize; Hyperdrive; Cloudflare Queues; R2; Containers; and Workers for Platforms) does not include Workers AI, so it is a retrieval window for product content uploaded to the Developer Platform, not a retention or deletion period for Workers AI request content. It is a different clause from the other \"30 days\" in EU Data Act Addendum §10.1 (EU customers only, object = Customer's Data)."
text_zh = "(7) Service-Specific Terms → Cloudflare Developer Platform §9——对象=上传到 Developer Platform 的内容，语境=试用或订阅到期/终止后，期限类型=取回窗口上限，且厂商声明无保留义务：「Subject to Section 8 above, you may be permitted to access the Customer Content you uploaded to the Developer Platform for up to thirty (30) days following the expiration or termination of your trial or subscription. You understand that Cloudflare has no obligation to retain the Customer Content you upload to the Developer Platform following the expiration or termination of your trial or subscription.」适用范围对采购很重要：该条位于 Developer Platform 小节，其产品清单（Cloudflare Workers; Cloudflare Pages; Workers KV; D1; Durable Objects; Vectorize; Hyperdrive; Cloudflare Queues; R2; Containers; and Workers for Platforms）不含 Workers AI，故它是上传到 Developer Platform 的产品内容的取回窗口，不是 Workers AI 请求内容的保留或删除期限。它与 EU Data Act Addendum §10.1 的另一处「30 天」（仅欧盟客户，对象=Customer's Data）是两条不同适用范围的条款。"
anchor = "sst-dp-30-days-uploaded-content"

[[product.retention.point]]
text = "The addendum limits Workers AI's Exportable Data to \"LoRA adapters uploaded by Customers\" plus the available audit logs (inference inputs and outputs are not included)"
text_zh = "附录把 Workers AI 的 Exportable Data 限定为「LoRA adapters uploaded by Customers」+ 可用审计日志（未含推理输入输出）"

[[product.retention.point]]
text = "Footnote [2]: \"By default, Cloudflare stores any end user activity logs for seven days\", together with the statement that it \"does not store ... for every product\" — the object is end-user activity logs, not request content"
text_zh = "脚注 [2]「By default, Cloudflare stores any end user activity logs for seven days」，并声明「does not store ... for every product」——对象是终端用户活动日志，非请求正文"

[[product.retention.point]]
text = "(8) Object = network traffic and related logs, nature = a right for Cloudflare to monitor and inspect, with no time limit, context = as necessary to perform the Services or to protect the security or integrity of the network (Self-Serve §2.5.5; the enterprise tier's ESA §5.4 says the same): \"Cloudflare may monitor and inspect the traffic on the Cloudflare network, including any related logs, as necessary to perform the Services or protect the security or integrity of Cloudflare's network.\" This shows that log-type data exists and is reachable by Cloudflare, but it is an inspection right rather than a retention period, and it gives no period for input and output content (duration_kind stays unspecified)."
text_zh = "(8) 对象=网络流量与相关日志，性质=Cloudflare 的监控/检查权（无期限），语境=为提供服务或保护网络安全所必需（Self-Serve §2.5.5，企业档 ESA §5.4 同旨）：「Cloudflare may monitor and inspect the traffic on the Cloudflare network, including any related logs, as necessary to perform the Services or protect the security or integrity of Cloudflare's network.」它说明日志类数据存在且 Cloudflare 可及，但这是检查权、不是保留期限，也不给出输入输出正文的期限（duration_kind 维持 unspecified）。"
anchor = "ss-terms-monitor-traffic"

[[product.retention.point]]
text = "(9) Privacy policy §11 gives only retention criteria (consumer_privacy, not authoritative for this tier). What can therefore be said about retention is: request content is not persisted by default (it is stored only where a storage product is used); log-type data has a 7-day default (not applying to every product); and there are two distinct 30-day retrieval windows — one for content uploaded to the Developer Platform (whose product list excludes Workers AI) and one for EU Data Act customers (Customer's Data). Clauses are split by object and context, and none of them gives a general number of days for input and output content."
text_zh = "(9) 隐私政策 §11 只给保留标准（consumer_privacy，非本档权威）。因此 retention 的可用表述是：默认不持久存储请求正文（仅在使用存储类产品时才会存储）；日志类数据有 7 天默认（不适用于每个产品）；另有两个适用范围不同的 30 日取回窗口——上传到 Developer Platform 的内容（其产品清单不含 Workers AI）与欧盟 Data Act 客户的 Customer's Data。条款分对象、分语境，没有任何一条给出输入输出正文的通用保留天数。"

