[[product.training.point]]
text = "Boundary clause — Feedback is licensed separately from Customer Data. ESA §6.3: \"If Customer chooses to provide feedback, suggestions, or recommendations for improvement to the Services (“Feedback”), Cloudflare may use Feedback without restrictions and without obligations to Customer.\" Feedback is something the customer chooses to send and is not part of Customer Data (§1.7: Customer Data = Customer Account Information + Customer Content + Customer Logs), so it does not change mark=yes. Nor may it be turned into a mark=no: the clause concerns the customer's own suggestions, not the use of Customer Content to train models."
text_zh = "边界条款——Feedback 与 Customer Data 分开授权。ESA §6.3：「If Customer chooses to provide feedback, suggestions, or recommendations for improvement to the Services (“Feedback”), Cloudflare may use Feedback without restrictions and without obligations to Customer.」Feedback 由客户主动提交、不属 Customer Data（§1.7：Customer Data = Customer Account Information + Customer Content + Customer Logs），故不影响 mark=yes；也不得据此判 mark=no——该条讲的是客户自己的建议，不是把 Customer Content 用于训练模型。"
anchor = "ent-terms-6-3-feedback"

[[product.training.point]]
text = "Contract level (strongest): the \"Cloudflare Workers AI; AI Gateway\" subsection of the Developer Platform Service-Specific Terms says \"Unless otherwise agreed, Cloudflare does not use any Customer Content to train generative AI tools.\" — a consent-gated statement (it can be agreed otherwise), not an absolute prohibition. The docs point the same way in different words: \"would not do so unless we received your explicit consent\" (explicit consent required, and covering (2) improve any Cloudflare or third-party services as well)"
text_zh = "合同层（最强）：Developer Platform Service-Specific Terms 的「Cloudflare Workers AI; AI Gateway」小节写「Unless otherwise agreed, Cloudflare does not use any Customer Content to train generative AI tools.」——同意门控式表述（可另行约定），不是绝对禁止。docs 侧同旨但措辞不同：「would not do so unless we received your explicit consent」（需明示同意，且同时覆盖 (2) improve any Cloudflare or third-party services）"

[[product.training.point]]
text = "The Trust Hub puts it as \"without customer consent\". Clauses in tension are recorded alongside and not reconciled: (a) the same subsection's \"Cloudflare does not reference or use any Customer Content except as needed to provide and improve the Services\" — \"improve the Services\" is literally inconsistent with the docs' \"not used to improve any Cloudflare or third-party services\""
text_zh = "Trust Hub 用「without customer consent」。反向张力条款并列记录（不调和）：(a) 同一小节的「Cloudflare does not reference or use any Customer Content except as needed to provide and improve the Services」——「improve the Services」与 docs 的「不用于改进 Cloudflare 或第三方服务」在字面上不一致"

[[product.training.point]]
text = "(b) Self-Serve §2.5.5 and ESA §5.4 allow Network Data (data derived from server, network and traffic data, not customer content) to be used for \"developing and improving its Services\", while ESA §5.3 states that no rights in Customer Data are transferred"
text_zh = "(b) Self-Serve §2.5.5 与 ESA §5.4 允许把 Network Data（由服务端/网络/流量数据衍生的数据，非客户内容）用于 developing and improving its Services，ESA §5.3 同时声明 Customer Data 的权利不发生转移"

[[product.training.point]]
text = "(c) DPA §3.3 commits, for Personal Data within CCPA scope, not to retain, use or disclose it for purposes other than those set out in the DPA and the Main Agreement. Circumstantial support: the responsible-ai page says \"we do not use our customers' content to train any LLMs\" and \"Cloudflare neither trains its own LLMs nor provides its customers with access to GPUs for training their own models\". Note also that the docs count \"training data\" as Customer Content, so training data uploaded by customers is protected by the same clause."
text_zh = "(c) DPA §3.3 对 CCPA 范围内的 Personal Data 承诺不为 DPA 与主协议之外的目的 retain/use/disclose。旁证：responsible-ai 页「we do not use our customers' content to train any LLMs」「Cloudflare neither trains its own LLMs nor provides its customers with access to GPUs for training their own models」。另注：docs 把「训练数据（training data）」也列为 Customer Content，故客户上传的训练数据同样受该条保护。"

