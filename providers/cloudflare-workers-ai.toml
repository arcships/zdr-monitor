note = "EU Data Act Addendum（面向欧盟客户；/legal/terms/ 描述为「regional compliance addendum for customers located in the European Union」）。§10.1 终止后保留 Customer's Data 30 个日历日供取回/擦除、§10.2 期满擦除 Exportable Data；服务附录按产品列出 Exportable Data，其中 Workers AI 一行只列「LoRA adapters uploaded by Customers」与可用审计日志；脚注 [2] 给出默认日志保留 7 天。**抓取通道注意**：Exhibit 1 是一张超宽表格，r.jina.ai 对该页的 markdown 转换稳定止于 §13，Exhibit 1 整段丢失（实测 2026-09-22：带尾斜杠 14291B、无尾斜杠 14290B、/en-gb/ 14309B、/zh-cn/ 14309B，四次均无 Exhibit 1；而页面 HTML 435KB 中该表逐字存在）。因此引用 Exhibit 1 的两条锚点（daa-workers-ai-exportable-data、daa-enduser-logs-7-days-default）会周期性落空——那是抓取通道问题，不是条款消失，不得据此改结论。§1–§13 正文不受影响。"

[[source]]
url = "https://www.cloudflare.com/service-specific-terms-developer-platform/"
channel = "contract"
tier = "core"
note = "Service-Specific Terms → Developer Platform（页面标注 Last updated June 02, 2026），含独立小节「Cloudflare Workers AI; AI Gateway」。该页开头声明「supplement the applicable master agreement(s) located at https://www.cloudflare.com/legal/terms/」，即同时补充自服务档与 ESA 档；本家 training 维度的合同层权威。同一小节既写「Unless otherwise agreed, Cloudflare does not use any Customer Content to train generative AI tools」，又写「does not reference or use any Customer Content except as needed to provide and improve the Services」；另明文规定 AI Gateway 上跑在第三方基础设施的第三方产品不适用 Cloudflare DPA。**抓取通道注意**：r.jina.ai 对 www.cloudflare.com 的本页抓取不稳定——缓存里存的是广告追踪像素壳（Title: https://match.adsrvr.org/track/cmf/...、正文「A 1x1 image, likely be a tacker probe」）。实测 2026-09-22 四种 URL 形式各两次：带尾斜杠两次均返回壳、无尾斜杠与 /zh-cn/ 各首次返回完整正文（30294B/30431B）后次即被同一坏缓存覆盖、/en-gb/ 两次均壳。页面 HTML（435KB）本身逐字完整，故这是 r.jina.ai 侧问题，不是条款消失；不得据此改结论。抓取层已能识别该壳（classify → render_error），坏 baseline 是闸门上线前写入的。"

