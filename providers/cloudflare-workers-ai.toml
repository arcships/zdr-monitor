[[product.processing_region.point]]
text = "The vendor discloses no processing location for Workers AI inference, and there is no switch for choosing an inference region. Four kinds of circumstantial evidence were checked and judged one by one, none of them sufficient to support a conclusion: (1) the documentation and product pages say only that it runs on \"Cloudflare's global network\", and the product page adds \"No cold starts or region complexity\""
text_zh = "官方未披露 Workers AI 推理的处理地，也没有按区域选择推理位置的开关。查过并逐条判定后仍不足以支撑结论的四类旁证：(1) 文档与产品页只说跑在「Cloudflare's global network」，产品页还写「No cold starts or region complexity」"

[[product.processing_region.point]]
text = "(2) Privacy policy §7 \"We primarily store your information in the United States and the European Economic Area\" — consumer_privacy level, its object being information Cloudflare collects itself, and under the task rules it cannot serve as primary evidence for Workers AI"
text_zh = "(2) 隐私政策 §7「We primarily store your information in the United States and the European Economic Area」——consumer_privacy 层、对象是 Cloudflare 自行收集的个人信息，按任务要求不能当 Workers AI 的主证据"

[[product.processing_region.point]]
text = "(3) DPA §6/§7 only lay down lawful cross-border transfer mechanisms (EU SCCs / UK Addendum / EU-U.S. DPF / Global CBPR-PRP) and designate no processing location, their implicit premise being that Personal Data may be transferred to the United States and other countries where Cloudflare operates"
text_zh = "(3) DPA §6/§7 只规定跨境转移的合法机制（EU SCCs / UK Addendum / EU-U.S. DPF / Global CBPR-PRP），不指定处理地，其隐含前提是 Personal Data 可能被转移到美国等 Cloudflare 有运营的国家"

[[product.processing_region.point]]
text = "(4) The Data Localization Suite / Regional Services are paid enterprise add-ons that control where keys are stored, the boundary for traffic metadata and logs, and where HTTPS decryption is performed"
text_zh = "(4) Data Localization Suite / Regional Services 是企业付费附加项，控制密钥存储地、流量元数据/日志边界与 HTTPS 解密处理地"

[[product.processing_region.point]]
text = "The Regional Services list of in-region services includes \"Running Cloudflare Workers scripts\" but does not list Workers AI inference (the list is worded \"among others\", so it cannot be concluded from this that DLS does not cover AI inference). Also: services in China are operated by JD Cloud (SST Other Terms), which has nothing to do with Workers AI. Recorded as not_found under the rules: the absence of public evidence is not the absence of a vendor commitment."
text_zh = "Regional Services 的区域内服务清单列出「Running Cloudflare Workers scripts」，但未列 Workers AI 推理（清单措辞为 among others，不能据此断定 DLS 不覆盖 AI 推理）。另：中国区服务由 JD Cloud 运营（SST Other Terms），与 Workers AI 无关。结论按规则记 not_found：拿不到公开证据 ≠ 厂商没有处理地承诺。"

[[product.processing_region.point]]
text = "The DLS clauses previously bound here (\"Enterprise-only paid add-on\" / \"…enable customers to choose the location where Cloudflare inspects and stores data\") state a purchasable location-control product but do not say that Workers AI inference is covered by it, so they are not statements about this tier's processing location and are no longer bound. They remain as circumstantial evidence in item (4) above."
text_zh = "原先绑在本条的两句 DLS 引文（「Enterprise-only paid add-on」／「…enable customers to choose the location where Cloudflare inspects and stores data」）只说明有一个可购买的定位控制产品，未说明覆盖 Workers AI 推理，不构成对本档处理地的表述，故不再绑在本条；它们作为旁证仍保留在上面第 (4) 条里。"

[[product.processing_region.point]]
text = "Checked and judged insufficient to support a conclusion: EU Data Act Addendum §7.2 discloses only \"The following URL identifies the locations of Cloudflare's infrastructure: cloudflare.com/network.\" — an infrastructure-location pointer (network map), not a disclosure of where a given service's data is processed; and the addendum itself applies only to customers who live or are headquartered in the EU with EU billing addresses, and only to agreements formed or orders placed on or after September 12, 2025."
text_zh = "查过并判定不足以支撑结论：EU Data Act Addendum §7.2 只披露「The following URL identifies the locations of Cloudflare's infrastructure: cloudflare.com/network.」——这是基础设施位置指引（网络地图），不是某服务数据在哪处理的披露；且该附录只适用于居住地或总部在欧盟、账单地址在欧盟的客户，也只适用于 2025 年 9 月 12 日及之后成立或下单的协议。"
anchor = "daa-7-2-infrastructure-location-url"

[product.role]
kind = "processor"
anchor = "dpa-processor-role"

[[product.role.point]]
text = "The contract makes Cloudflare the processor. DPA §2.3: \"the Customer is the Controller (or a Processor processing Personal Data on behalf of a third-party Controller), and Cloudflare is a Processor (or sub-Processor, as applicable)\""
text_zh = "合同层明确为受托处理方（processor）。DPA §2.3：「the Customer is the Controller (or a Processor processing Personal Data on behalf of a third-party Controller), and Cloudflare is a Processor (or sub-Processor, as applicable)」"

[[product.role.point]]
text = "The DPA opens by limiting itself to cases \"where Cloudflare processes Personal Data as a Processor ... on behalf of Customer to provide the Services\", and the definition of Services in §1.1(o) includes \"any software, software development kits and application programming interfaces (APIs)\", which covers Workers AI. Self-Serve §6.1 and ESA §5.3 say the same (the latter: \"To the extent that Cloudflare processes Customer Data ... that includes Personal Data, Cloudflare will handle such Personal Data in compliance with the DPA\"). The privacy policy reinforces it: Cloudflare designates itself data controller only for information it collects itself, and immediately afterwards designates itself data processor for \"content provided by Customers and End Users through the Services that transits, or in some cases, is stored on, the Cloudflare network\". Two layers of exception are recorded alongside: (a) the Service-Specific Terms classify \"machine learning models made available by Cloudflare\" as Third-Party Products, so the licence and use terms run between the customer and the model licensor, with Cloudflare neither controlling nor indemnifying"
text_zh = "DPA 开篇限定其适用于「where Cloudflare processes Personal Data as a Processor ... on behalf of Customer to provide the Services」，而 §1.1(o) 的 Services 定义含「any software, software development kits and application programming interfaces (APIs)」，覆盖 Workers AI。Self-Serve §6.1 与 ESA §5.3 同旨（后者：To the extent that Cloudflare processes Customer Data ... that includes Personal Data, Cloudflare will handle such Personal Data in compliance with the DPA）。隐私政策补强：Cloudflare 只对自行收集的信息自认 data controller，紧接着自认对「content provided by Customers and End Users through the Services that transits, or in some cases, is stored on, the Cloudflare network」为 data processor。同时并列记录两层例外：(a) Service-Specific Terms 把「machine learning models made available by Cloudflare」定性为 Third-Party Products，许可与使用条款发生在客户与模型许可方之间，Cloudflare 不控制、不赔偿"

[[product.role.point]]
text = "(b) The same page states plainly that for third-party products running on third-party infrastructure through AI Gateway \"the Cloudflare Data Processing Addendum and Information Security Exhibit do not apply\", and that this is treated as the customer instructing Cloudflare to send Customer Data to them — that third-party model hop is not covered by the DPA (it belongs to the cloudflare-ai-gateway entry). For the Workers AI hosted models (65 of them, including those marked Partner) no clause about handing data to the model's originator was found, so this tier is recorded as processor"
text_zh = "(b) 同一页明文：AI Gateway 上跑在第三方基础设施的第三方产品，「the Cloudflare Data Processing Addendum and Information Security Exhibit do not apply」，且视为客户指示 Cloudflare 向其发送 Customer Data——第三方模型那一跳不受 DPA 保护（属 cloudflare-ai-gateway 条目范围）。对 Workers AI 托管模型（65 个，含标 Partner 者）未发现「数据转交模型原厂」的条款，故本档判 processor"

[[product.role.point]]
text = "\"Models are Third-Party Products\" affects licensing and the allocation of liability; it does not change Cloudflare's position as data processor."
text_zh = "「models 是 Third-Party Products」影响的是许可与责任划分，不改变 Cloudflare 作为数据处理受托方的地位。"

