[[source]]
url = "https://raw.githubusercontent.com/Clarifai/docs/main/docs/product-updates/upcoming-api-changes/secure-data-hosting.md"
channel = "developer_data"
tier = "core"
note = "官方文档仓库的 Secure Data Hosting 公告页（2023-08-15 起随 9.7 版本生效）：用户输入托管在 Amazon S3，SDH 作为 S3 之上的 token 鉴权代理，新输入以私有文件写入 S3、仅经 SDH URL 可访问。未披露 S3 区域/处理地，也未给任何保留期限。"

[[source]]
url = "https://raw.githubusercontent.com/Clarifai/docs/main/docs/resources/privacy-security.md"
channel = "developer_data"
tier = "core"
note = "Clarifai 官方文档仓库 Clarifai/docs 的 Data Privacy and Security 页源码（main 分支；仓库最后 push 2026-05-29，未归档）。原线上页 https://docs.clarifai.com/resources/privacy-security/ 现为 NXDOMAIN，本仓库是该页现存可公开复核的官方一手文本。覆盖 Clarifai SaaS 平台/API 档（Shared SaaS 与 Dedicated SaaS 共用同一平台条款），不覆盖客户自托管部署形态。全文为本家唯一的政策级文本：默认安全存储输入与预测、用户自行控制保留、除主动分享到 Community 外不用于训练。"

[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "training-not-used-for-training"

[[product.training.point]]
text_zh = "同顶层 training：除主动分享到 Community 外，不使用客户私有数据训练自家或平台上其他模型"

[[product.training.point]]
text_zh = "聚合使用模式分析允许，明细日志需 opt-in。"

