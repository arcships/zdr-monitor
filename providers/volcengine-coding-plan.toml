[[product]]
id = "coding-plan-enterprise"
badge = "企业版"
category = "coding_plan"
plan_level = "enterprise"
label = "Coding Plan 企业版 / Agent Plan 企业版"

[product.training]
mark = "yes"
anchor = "volcengine-cp-enterprise-no-optimization-use"
mode = "by_contract"

[[product.training.point]]
text = "§1.4, enterprise edition (Coding Plan Enterprise / Agent Plan Enterprise): \"this service will not collect or use your data for service optimization\" — registered as written, not upgraded into \"no training\""
text_zh = "§1.4 企业版(Coding Plan 企业版/Agent Plan 企业版):「本服务将不会收集和使用您的数据进行服务优化」——原文措辞是「不收集、不用于服务优化」,如实登记,不拔高成「不训练」"
anchor = "volcengine-cp-enterprise-no-optimization-use"

[[product.training.point]]
text = "Model layer: §2.12 requires compliance with the corresponding model service agreement and data processing rules; the Doubao Model Service Agreement §4.1 says \"unless you separately consent, this service will not use the content you submit to the service or output from the service to train, retrain or improve the base model\""
text_zh = "模型层:§2.12 要求「遵守对应模型服务协议和数据处理规则」;豆包模型服务协议 §4.1「除非您单独同意,本服务将不使用您提交给服务或使用服务输出的内容训练、重新训练或改进基础模型」"
anchor = "volcengine-cp-model-rules-2-12"

[[product.training.point]]
text = "Of the two separate-consent cases in Doubao §4.1, 4.1.1 (agreeing to the Data Authorization and Use Agreement) does not apply here: the enterprise edition does not sign that agreement, whose §1.1(5) defines its object as the input and generated content within the Coding Plan / Agent Plan individual monthly subscription quota only"
text_zh = "豆包 §4.1 的单独同意情形之一 4.1.1「同意《数据授权使用协议》」对企业版不适用:企业版不签该协议,其 §1.1(5) 把授权对象限定为【Coding Plan / Agent Plan 个人版 订阅包月套餐】额度内的输入与生成内容"
anchor = "volcengine-cp-personal-data-definition"

[[product.training.point]]
text = "The other separate-consent case, Doubao §4.1.2 (joining the collaboration reward program, including reward resource packs or other rewards and promotions offered from time to time), is open to both tiers and arises only if the user joins on their own — the enterprise edition has no separate-consent case by default"
text_zh = "另一种单独同意情形 4.1.2「参与火山引擎协作奖励计划,包括奖励资源包或不定期为您提供的其他奖励或优惠活动等」两档都可触发,需用户自行参与才成立——企业版默认不存在「单独同意」情形"
anchor = "volcengine-cp-doubao-training-optin"

[[product.training.point]]
text = "Boundary of the \"no service optimization\" promise — Products and Services Agreement §6.7 (incorporated via §1.2): Volcengine may collect or produce technical and operational data (system logs, billing data, customer service conversations, lead information) and may use that operational data to optimize and improve its own products and services. This is a parallel clause about the vendor's own operational data, not an exception to §1.4, whose object is \"your data (the data you exchange with this service)\" — mark=yes / by_contract is unchanged"
text_zh = "射程边界:经 §1.2 并入的《产品和服务协议》§6.7 允许火山引擎利用「运营数据」(系统日志、账单数据、客服对话、留资信息等)优化和改善其产品和服务。该条与 §1.4 并存而非例外——§1.4 的对象是「您的数据(您与本服务交互的数据)」,不改变 mark=yes / by_contract"
anchor = "volcengine-cp-generic-operational-data"

[[product.training.point]]
text = "The plan overview page adds \"does not record user requests or model response data\"; platform terms §3.7.7 points the same way, but that is the pay-as-you-go API tier's authority and counts only as a cross-tier reference"
text_zh = "套餐概览页另有「不记录用户请求与模型返回数据」佐证;平台专用条款 §3.7.7 同向,但那属按量 API 档的档位权威,只能算跨档位旁证"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "volcengine-cp-enterprise-no-retention"

[[product.zdr.point]]
text = "§1.4 is a clause-level zero-retention commitment: \"your data (the data you exchange with this service) will not be retained by this service, please store and back it up yourself\" — stronger than the pay-as-you-go API tier's \"not stored by default plus four listed exception scenarios\", with no application or extra configuration needed: it applies as soon as the enterprise edition is ordered"
text_zh = "§1.4 条款级零留存:「您的数据(您与本服务交互的数据)将不会被本服务留存,请您自行存储和备份」——强于按量 API 档的「默认不存储 + 四类列明场景例外」,无需申请或额外配置,订购企业版即适用"
anchor = "volcengine-cp-enterprise-no-retention"

[[product.zdr.point]]
text = "Scope limit — multi-hop chain, hop 2 (Moonshot; the plan model list includes Kimi-K2.7-Code / K2.8-Preview / K3): the Moonshot Model Service Agreement discloses that after termination it may \"continue to store the information you kept on the Moonshot platform, on the premise of anonymizing your user information\", with no period given. That does not overturn this hop's zero-retention commitment, but the chain as a whole cannot be read as \"nothing is retained at any hop\""
text_zh = "范围限定——多跳链第二跳(月之暗面,套餐模型清单含 Kimi-K2.7-Code / K2.8-Preview / K3):月之暗面模型服务协议披露协议终止后「在匿名化处理您的用户信息的前提下,继续保存您留存于Moonshot平台的各类信息」,且不给期限。它不推翻本跳的零留存承诺,但整条链不能读成「每一跳都不留存」"
anchor = "volcengine-cp-moonshot-post-termination-keep"

[[product.zdr.point]]
text = "Hop 2 (Zhipu; the plan model list includes GLM-5.3 / GLM-5.3-Flash) contracts with the customer directly and makes no vendor-side training or retention commitment; its §1.8 only requires the customer to follow Volcengine's website service terms, privacy policy and Ark platform agreements"
text_zh = "第二跳(智谱,套餐模型清单含 GLM-5.3 / GLM-5.3-Flash)与客户直接签约,全文未作厂商侧训练/保留承诺;§1.8 只反向要求客户遵守火山引擎的网站服务条款、隐私政策及火山方舟大模型服务平台有关的协议"
anchor = "volcengine-cp-zhipu-defers-to-volcengine"

[product.retention]
object = "input_output"
basis = "none"
anchor = "volcengine-cp-enterprise-no-retention"

[[product.retention.point]]
text = "(1) Input/output body and interaction data — §1.4: \"your data (the data you exchange with this service) will not be retained by this service\"; that is non-retention rather than \"kept for N days\", so this tier has no retention-period figure for the body"
text_zh = "分对象登记:(1) 输入输出正文/交互数据——§1.4「您的数据(您与本服务交互的数据)将不会被本服务留存」,是不留存而非「留 N 天」,故本档无正文保留期数字"
anchor = "volcengine-cp-enterprise-no-retention"

[[product.retention.point]]
text = "(2) Client system and device information — §2.11: recorded, and deleted after the service expires (the only expressly stated period in this tier; the object is device information, not request content)"
text_zh = "(2) 客户端系统与设备信息——§2.11 会被记录,「服务到期后删除」(本档唯一明示期限,对象是设备信息不是请求内容)"
anchor = "volcengine-cp-device-info-deleted-after-expiry"

[[product.retention.point]]
text = "(3) Service termination — Products and Services Agreement §12.8 (incorporated via §1.2): all customer data in your Volcengine account is kept for fifteen (15) days (the \"retention period\")"
text_zh = "(3) 服务终止场景——经 §1.2 并入的《产品和服务协议》§12.8:账号内全部客户数据保留十五(15)天(「保留期限」)"
anchor = "volcengine-cp-generic-termination-retention-15d"

[[product.retention.point]]
text = "§12.8 also carries a yield clause — a different period promised in the product-specific terms or service rules prevails — and states that the data is automatically purged once the retention period expires, including all caches and backups"
text_zh = "§12.8 自带让位条款:相关产品和服务专用条款或服务规则承诺期限另有约定的从其约定;保留期限届满后自动清除该等数据,包括所有缓存或备份"
anchor = "volcengine-cp-generic-termination-auto-purge"

[[product.retention.point]]
text = "General deletion commitment (Products and Services Agreement §6.6, incorporated via §1.2, applies to both tiers): \"except as necessary to provide the product and service, or as authorized by you (e.g. for troubleshooting or detection in applicable situations), Volcengine will not use your customer data at will, and will delete your customer data or anonymize it within a reasonable period after providing the service\". Relationship of the three: §1.4 non-retention prevails; the fifteen days in §12.8 is the fallback for the service-termination context and yields to the specific terms; §6.6 is the general reasonable-period deletion/anonymization commitment"
text_zh = "通用删除承诺(经 §1.2 并入的《产品和服务协议》§6.6,两档适用):「除为了提供产品和服务所必须,或经您的授权(如在适用情形下为进行故障排除、检测)外,火山引擎不会对您的客户数据进行任意使用,并在提供服务后的合理期限内删除您的客户数据或进行匿名化处理」。三者关系:§1.4 不留存优先,§12.8 的十五天是服务终止语境的兜底且让位于专用条款,§6.6 是通用的合理期限删除/匿名化承诺"
anchor = "volcengine-cp-generic-delete-reasonable-period"

[[product.retention.point]]
text = "Privacy policy §4.4: the vendor states that \"we have no obligation to store your data or information\" and that the storage location is \"the data centre agreed between you and us\". This does not overturn §1.4 or §12.8; it only shows that storage itself is not a commitment the vendor makes to the customer, and that the location needs to be agreed separately"
text_zh = "隐私政策 §4.4:厂商声明「我们没有义务存储您的数据或信息」,存储地点为「您和我们约定的数据中心」。它不推翻 §1.4 与 §12.8,只说明「存储」不是厂商对客户作出的承诺项、存储地点需另行约定"
anchor = "volcengine-cp-privacy-no-storage-obligation"

