[[product.processing_region.point]]
text = "The personal plan overview, the subscription plan terms, the Data Authorization and Use Agreement (docs and www), the Products and Services Agreement, the platform-specific terms, and the Doubao and third-party model service agreements disclose no storage or processing location for the input and output. The Data Authorization and Use Agreement only requires the customer to warrant the lawfulness of the data source and of the personal information authorization (§2.4/2.5), which is not a regional commitment"
text_zh = "个人版套餐概览、订阅套餐条款、数据授权使用协议(docs/www 两址)、产品和服务协议、平台专用条款、豆包与三方模型服务协议均未披露输入输出内容的存储地/处理地。数据授权协议只要求客户自行保证数据来源与个人信息授权合规(§2.4/2.5),不构成地域承诺"

[[product.processing_region.point]]
text = "Privacy policy 三.1(1) is conditional on choosing the mainland China service and covers \"user personal information\" only — which is exactly why this tier's customer content still has no location commitment, since the Data Authorization and Use Agreement §2.5 asks customers to avoid providing personal information"
text_zh = "隐私政策三.1(1) 以选择中国大陆地区服务为前提,境内存储的对象是「用户个人信息」——这正是本档仍判「未披露」的关键限定:客户内容的处理地确实没有承诺,且《数据授权使用协议》§2.5 要求客户避免向火山引擎提供个人信息"
anchor = "volcengine-cp-privacy-personal-info-location"

[[product.processing_region.point]]
text = "Privacy policy 三.1(2) does take \"customer data\" as its object and offers a selectable service region with a possible transfer out of the mainland, but it is conditional on choosing a service outside mainland China, so it does not apply to this mainland-site subscription"
text_zh = "隐私政策三.1(2) 以「客户数据」为对象,给出可选服务区域与「可能将必要的账号ID、资源配置信息、客户数据传输至境外」,但以选择中国大陆地区以外的服务为前提,对本档不适用"
anchor = "volcengine-cp-privacy-customer-data-region"

[[product.processing_region.point]]
text = "Privacy policy 4.4: \"we have no obligation to store your data or information\", and the storage location is \"the data centre agreed between you and us\""
text_zh = "隐私政策 4.4:「我们没有义务存储您的数据或信息」,存储地点为「您和我们约定的数据中心」"
anchor = "volcengine-cp-privacy-no-storage-obligation"

[[product.processing_region.point]]
text = "The Ark model service security whitepaper and the confidential-computing whitepaper have their body in images and cannot be machine-verified; per docs/judgment.md only the official file and page number are kept and they are not used as formal anchors"
text_zh = "安全白皮书与互信计算白皮书正文为图片、机器不可复核,按 docs/judgment.md 只保留官方原文件与页码、不作正式锚点"

[[product.processing_region.point]]
text = "The personal plan overview's Base URL is ark.cn-beijing.volces.com (cn-beijing), which is a product configuration fact and not a regional verdict"
text_zh = "个人版套餐概览的 Base URL 是 ark.cn-beijing.volces.com(cn-beijing),属产品配置事实,不作地域结论"

[product.role]
kind = "controller"
anchor = "volcengine-cp-personal-authorization-purpose"

[[product.role.point]]
text = "The agreement does not use the terms controller or processor, but §2.1 sets the purpose of the authorization as Volcengine's own machine learning and model optimization, development, use and academic research, and §2.2 grants it the right to transmit, store, use, copy, download, modify or otherwise process AI Coding/Agent data for that purpose, sublicensable to affiliates and third-party outsourcing service providers — for the authorized data Volcengine is the party that determines the processing purpose itself, the opposite of the pay-as-you-go API tier's entrusted processing"
text_zh = "协议未使用 controller/processor 术语,但 §2.1 授权目的为火山引擎自身的机器学习与模型优化/开发/学术研究,§2.2 授权其为该目的传输、存储、使用、复制、修改数据并可分许可给关联方与第三方外包服务商——即就授权数据而言火山引擎是自主决定处理目的的一方,与按量 API 档的委托处理相反"
anchor = "volcengine-cp-personal-authorization-purpose"

[[product.role.point]]
text = "§2.4/2.5 leave the customer to warrant the data rights and the personal information authorization, and §5.3 gives this agreement priority on data authorization matters, ahead of the general \"processes customer data strictly on your instructions\" wording. When the model list includes third-party models there is also a second hop (Zhipu, Moonshot) contracting directly with the customer"
text_zh = "§2.4/2.5 由客户保证数据权利与个人信息授权,§5.3 数据授权事宜优先适用本协议(优先于「严格执行您的指示处理客户数据」的通用表述)。模型清单含三方模型时,链上还有智谱/月之暗面等与客户直接签约的第二跳"
anchor = "volcengine-cp-personal-priority-clause"

