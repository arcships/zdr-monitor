[[product]]
id = "coding-plan-enterprise"
badge = "企业版"
category = "coding_plan"
plan_level = "enterprise"

[product.training]
mark = "yes"
anchor = "volcengine-cp-enterprise-no-optimization-use"
mode = "by_contract"

[[product.training.point]]
text_zh = "§1.4 企业版(Coding Plan 企业版/Agent Plan 企业版):「本服务将不会收集和使用您的数据进行服务优化」——原文措辞是「不收集、不用于服务优化」,如实登记,不拔高成「不训练」。模型层经 §2.12 适用豆包模型服务协议 §4.1「除非单独同意不使用输入输出训练/重新训练/改进基础模型」"

[[product.training.point]]
text_zh = "企业版档不签署《数据授权使用协议》(该协议 §1.1(5) 的对象只写个人版套餐),默认不存在「单独同意」情形,模型层亦为不使用于训练。平台专用条款 §3.7.7 同向。套餐概览页另有「不记录用户请求与模型返回数据」佐证"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "volcengine-cp-enterprise-no-retention"

[[product.zdr.point]]
text_zh = "§1.4 条款级零留存:「您的数据(您与本服务交互的数据)将不会被本服务留存,请您自行存储和备份」——强于按量 API 档的「默认不存储 + 四类列明场景例外」,无需申请或额外配置,订购企业版即适用。范围限定:承诺主体是本服务(火山引擎订阅套餐服务)层,套餐模型清单含 GLM/Kimi/MiniMax/DeepSeek 等三方模型,链上三方模型提供方在套餐场景下的数据处理未见披露(见 notes 多跳段)"

[product.retention]
object = "input_output"
basis = "none"
anchor = "volcengine-cp-enterprise-no-retention"

[[product.retention.point]]
text_zh = "分对象登记:(1) 输入输出正文/交互数据——§1.4「您的数据(您与本服务交互的数据)将不会被本服务留存」,是不留存而非「留 N 天」,故本档无正文保留期数字"

[[product.retention.point]]
text_zh = "(2) 客户端系统与设备信息——§2.11 会被记录,「服务到期后删除」(本档唯一明示期限,对象是设备信息不是请求内容)"

[[product.retention.point]]
text_zh = "(3) 服务终止场景——经 §1.2 并入的《产品和服务协议》§12.8:账号内全部客户数据保留十五(15)天(「保留期限」),届满自动清除含缓存与备份"

