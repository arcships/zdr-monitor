text_zh = "§1.3 个人版(Coding Plan 个人版/Agent Plan 个人版):订购即「同意并授权我们和我们的关联公司存储并使用…输入以及模型输出的内容用于开发机器学习、人工智能相关技术和模型的优化、开发、使用、学术理论研究及发表等目的」——默认授权用于训练/模型开发,与企业版 §1.4 相反。两个退出限制:只能靠停止使用服务终止授权"

[[product.training.point]]
text_zh = "终止不涵盖已授权内容。被引的《数据授权使用协议》§2.1/2.2/2.3 给出同一授权的范围与永久期限,且豆包模型服务协议 §4.1.1 把「同意《数据授权使用协议》」列为「除非单独同意」的单独同意情形——说明个人版授权与模型层条款不矛盾,是同一件事的两层"

[product.zdr]
