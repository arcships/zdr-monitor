text_zh = "分对象登记:(1) 输入输出内容——《数据授权使用协议》§2.3「授权期限为永久」,且一旦被使用「技术上无法撤回」"

[[product.retention.point]]
text_zh = "订阅条款 §1.3 只允许通过停止使用终止后续授权、不追溯已授权内容——本档对输入输出正文无删除期限承诺"

[[product.retention.point]]
text_zh = "(2) 客户端系统与设备信息——订阅条款 §2.11「服务到期后删除」(本档唯一明示期限)"

[[product.retention.point]]
