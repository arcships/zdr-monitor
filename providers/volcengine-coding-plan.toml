[[product.processing_region.point]]
text = "Checked the subscription plan terms, the plan overview, the Data Authorization and Use Agreement, the Products and Services Agreement, the privacy policy, the platform-specific terms, the model service agreements (Doubao, Zhipu, Moonshot), the security whitepaper and the confidential-computing whitepaper: none contains a storage- or processing-location clause for customer content in this tier. §2.2's \"authorization to use this service only within mainland China\" is a use licence; no storage or inference location is inferred from it"
text_zh = "查了订阅套餐条款、套餐概览、数据授权使用协议、产品和服务协议、隐私政策、平台专用条款、豆包/智谱/月之暗面模型服务协议、安全白皮书与互信计算白皮书,均无本档客户内容的存储地/处理地条款。订阅条款 §2.2「仅在中国大陆地区使用本服务的授权」是使用许可,不推定存储或推理地"

[[product.processing_region.point]]
text = "Privacy policy 三.1(1) is conditional on choosing the mainland China service, and its object is \"user personal information\", not customer content"
text_zh = "隐私政策三.1(1) 以选择中国大陆地区服务为前提,境内存储的对象是「用户个人信息」,不是客户内容"
anchor = "volcengine-cp-privacy-personal-info-location"

[[product.processing_region.point]]
text = "Privacy policy 三.1(2) does take \"customer data\" as its object and offers a selectable service region with a possible transfer of the necessary account ID, resource configuration information and customer data out of the mainland — but it is conditional on choosing a service outside mainland China, so it does not apply to this mainland-site subscription"
text_zh = "隐私政策三.1(2) 确实以「客户数据」为对象,给出可选服务区域与「可能将必要的账号ID、资源配置信息、客户数据传输至境外」,但以选择中国大陆地区以外的服务为前提,对本档国内站套餐不适用"
anchor = "volcengine-cp-privacy-customer-data-region"

[[product.processing_region.point]]
text = "Privacy policy 4.4: \"we have no obligation to store your data or information\", and the storage location is \"the data centre agreed between you and us\""
text_zh = "隐私政策 4.4:「我们没有义务存储您的数据或信息」,存储地点为「您和我们约定的数据中心」"
anchor = "volcengine-cp-privacy-no-storage-obligation"

[[product.processing_region.point]]
text = "The Ark model service security whitepaper (p36, \"the relevant data is stored only in mainland China\") has its body in scanned images and cannot be machine-verified; per docs/judgment.md only the official file and page number are kept and it is not used as a formal anchor, so no processing-region verdict is drawn from it"
text_zh = "方舟模型服务安全白皮书(p36「相关数据仅存储于中国大陆」)正文为扫描图、机器不可复核,按 docs/judgment.md 只保留官方原文件与页码、不作正式锚点,故不据它判定本档处理地"

[[product.processing_region.point]]
text = "The enterprise plan overview's Base URL is ark.cn-beijing.volces.com (cn-beijing region), which is a product configuration fact and not a regional commitment"
text_zh = "企业版套餐概览的接入 Base URL 为 ark.cn-beijing.volces.com(cn-beijing 区域)属产品配置事实,不作地域承诺"

[product.role]
kind = "processor"
anchor = "volcengine-cp-generic-neutral-provider"

[[product.role.point]]
text = "The subscription plan terms themselves contain no controller/processor clause"
text_zh = "订阅套餐条款本身无 controller/processor 角色条款"

[[product.role.point]]
text = "Products and Services Agreement §1.3 (incorporated via §1.2): \"Volcengine is a neutral technology service provider, providing you only with various technical products and services\"; §6.6 forbids using customer data at will except as necessary to provide the service or as authorized by you, and requires deletion or anonymization within a reasonable period after the service is provided"
text_zh = "经 §1.2 并入的《产品和服务协议》§1.3「火山引擎是中立的技术服务提供者」+ §6.6「除为了提供产品和服务所必须,或经您的授权外,火山引擎不会对您的客户数据进行任意使用,并在提供服务后的合理期限内删除或匿名化」——构成限定目的、按指示处理的受托/处理方框架"
anchor = "volcengine-cp-generic-delete-reasonable-period"

[[product.role.point]]
text = "Privacy policy §4.1, \"we will process customer data strictly on your instructions\", points the same way, as do the entrusted/instruction semantics of the service terms §2.6"
text_zh = "隐私政策 §4.1「严格执行您的指示处理客户数据」同向,服务条款 §2.6 亦为委托/指示语义"
anchor = "volcengine-cp-privacy-instruction-processing"

[[product.role.point]]
text = "Limit: §6.8 shows that the Data Entrusted Processing Agreement applies only when separately signed, i.e. the standard terms do not claim to be a processor — hence confidence=medium. The enterprise edition does not sign the Data Authorization and Use Agreement, so there is no personal-edition style \"processing for the vendor's own purposes\" authorization here"
text_zh = "限定:§6.8 表明「数据委托处理协议」只在单独签署时适用,即标准条款层未自称受托处理方,故 confidence=medium;企业版不签《数据授权使用协议》,不存在个人版那种「为厂商自身目的处理」的授权"
anchor = "volcengine-cp-generic-separate-dpa"

[[product]]
id = "coding-plan-personal"
badge = "个人版"
category = "coding_plan"
plan_level = "individual"
label = "Coding Plan 个人版 / Agent Plan 个人版"

[product.training]
mark = "no"
anchor = "volcengine-cp-personal-training-authorized"

[[product.training.point]]
text = "§1.3, personal edition (Coding Plan Personal / Agent Plan Personal): ordering the plan is itself consent and authorization to \"store and use the content input when calling models and the content output by the models\" for purposes including developing machine learning and AI related technologies and the optimization, development, use, academic research and publication of models — training is authorized by default, the opposite of §1.4 for the enterprise edition"
text_zh = "§1.3 个人版(Coding Plan 个人版/Agent Plan 个人版):订购即「同意并授权我们和我们的关联公司存储并使用…输入以及模型输出的内容用于开发机器学习、人工智能相关技术和模型的优化、开发、使用、学术理论研究及发表等目的」——默认授权用于训练/模型开发,与企业版 §1.4 相反"
anchor = "volcengine-cp-personal-training-authorized"

[[product.training.point]]
text = "There is no switch that keeps the service usable: the only route is to stop using the Coding Plan / Agent Plan personal edition service to terminate the authorization, and \"the scope of terminating the authorization does not cover the relevant content and data you have already authorized us to use\""
text_zh = "没有可保留服务使用的开关:退出只有一条路——「通过停止使用Coding Plan个人版和/或Agent Plan个人版服务来终止授权」,且「终止授权的范围不涵盖您已授权我们使用的相关内容和数据」"
anchor = "volcengine-cp-personal-termination-no-retroactive"

[[product.training.point]]
text = "The Data Authorization and Use Agreement §2.1/2.2/2.3 gives the purpose, the scope (transmit, store, use, copy, download, modify or otherwise process) and the perpetual term of the same authorization; its §1.1(5) limits the object to the personal edition monthly subscription"
text_zh = "被引的《数据授权使用协议》§2.1/2.2/2.3 给出同一授权的目的、范围(传输、存储、使用、复制、下载、修改或以其他方式处理)与永久期限,其 §1.1(5) 把授权对象限定为个人版订阅包月套餐"
anchor = "volcengine-cp-personal-authorization-scope"

[[product.training.point]]
text = "Doubao Model Service Agreement §4.1.1 lists \"agreeing to Volcengine's Data Authorization and Use Agreement\" as a separate-consent case, so the personal edition authorization and the model-layer clause are two layers of the same thing, not a contradiction"
text_zh = "豆包模型服务协议 §4.1.1 把「同意火山引擎的《数据授权使用协议》」列为「除非您单独同意」的单独同意情形——个人版授权与模型层条款是同一件事的两层,不矛盾"
anchor = "volcengine-cp-doubao-data-authorization-consent"

[[product.training.point]]
text = "Boundary: Products and Services Agreement §6.7 (incorporated via §1.2) lets Volcengine use its own operational data (system logs, billing data, customer service conversations, lead information) to optimize and improve its products and services; §1.3 governs \"the content you input and the models output\" and is unaffected by that clause"
text_zh = "射程边界:经 §1.2 并入的《产品和服务协议》§6.7 允许火山引擎利用「运营数据」(系统日志、账单数据、客服对话、留资信息等)优化和改善其产品和服务;§1.3 的对象是您输入与模型输出的内容,不受该条影响"
anchor = "volcengine-cp-generic-operational-data"

[product.zdr]
mark = "no"
anchor = "volcengine-cp-personal-termination-no-retroactive"

[[product.zdr.point]]
text = "Zero retention is not possible on the personal edition: §1.3 already authorizes storage and use of the input and output, and \"the scope of terminating the authorization does not cover the relevant content and data you have already authorized us to use\""
text_zh = "个人版不存在零保留:§1.3 已授权存储并使用输入输出,且「终止授权的范围不涵盖您已授权我们使用的相关内容和数据」"
anchor = "volcengine-cp-personal-termination-no-retroactive"

[[product.zdr.point]]
text = "Data Authorization and Use Agreement §2.3: the authorization term is perpetual and data already used is technically impossible to withdraw — incompatible with \"not retained after the request is processed\". This verdict must not be mixed with the enterprise edition's §1.4 (the two tiers are opposite)"
text_zh = "授权协议 §2.3 期限永久、已使用数据技术上无法撤回——与「请求处理完成后不保留」语义不相容。本条结论不得与企业版 §1.4 混用(两档相反)"
anchor = "volcengine-cp-personal-irrevocable"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "volcengine-cp-personal-authorization-permanent"

[[product.retention.point]]
text = "By object: (1) input/output content — Data Authorization and Use Agreement §2.3: \"the authorization term is perpetual\". The word \"perpetual\" refers to the authorization term, not to a retention period: this tier makes no deletion-period commitment at all for the input/output body, and data already used is technically impossible to withdraw"
text_zh = "分对象登记:(1) 输入输出内容——《数据授权使用协议》§2.3「授权期限为永久」——原文的「永久」是授权期限,不是保留期限;本档对输入输出正文没有任何删除期限承诺,已使用数据技术上无法撤回"
anchor = "volcengine-cp-personal-authorization-permanent"

[[product.retention.point]]
text = "Subscription plan terms §1.3 allow terminating only future authorization by stopping use of the service, without retroactive effect — no deletion-period commitment for the input/output body"
text_zh = "订阅条款 §1.3 只允许通过停止使用终止后续授权、不追溯已授权内容——本档对输入输出正文无删除期限承诺"
anchor = "volcengine-cp-personal-termination-no-retroactive"

[[product.retention.point]]
text = "(2) Client system and device information — subscription plan terms §2.11: \"deleted after the service expires\" (the only expressly stated period in this tier)"
text_zh = "(2) 客户端系统与设备信息——订阅条款 §2.11「服务到期后删除」(本档唯一明示期限)"
anchor = "volcengine-cp-device-info-deleted-after-expiry"

[[product.retention.point]]
text = "(3) Service termination — Products and Services Agreement §12.8 (incorporated via §1.2): all customer data in the account is kept for fifteen (15) days and automatically purged on expiry including all caches and backups; §12.8 yields to a different period promised in the specific terms, and the perpetual authorization of §1.3 above is a separate matter"
text_zh = "(3) 服务终止场景——经 §1.2 并入的《产品和服务协议》§12.8:账号内全部客户数据保留十五(15)天、届满自动清除含缓存与备份;§12.8 让位于专用条款的另有约定,与上述 §1.3 的永久授权是两件事"
anchor = "volcengine-cp-generic-termination-retention-15d"

[[product.retention.point]]
text = "General deletion commitment (Products and Services Agreement §6.6, incorporated via §1.2, applies to both tiers): except as necessary to provide the product and service or as authorized by you, Volcengine will not use your customer data at will and will delete or anonymize it within a reasonable period after providing the service"
text_zh = "通用删除承诺(经 §1.2 并入的《产品和服务协议》§6.6,两档适用):除为了提供产品和服务所必须,或经您的授权外,火山引擎不会对您的客户数据进行任意使用,并在提供服务后的合理期限内删除您的客户数据或进行匿名化处理"
anchor = "volcengine-cp-generic-delete-reasonable-period"

[[product.retention.point]]
text = "(4) Data Authorization and Use Agreement §2.5 also states that AI Coding/Agent data is strictly encrypted on the Ark platform and processed after anonymization by a security scheme — that is not a non-retention or non-training commitment and is not evidence for ZDR"
text_zh = "(4) 《数据授权使用协议》§2.5 另述 AI Coding/Agent 数据在火山方舟平台严格加密、通过安全方案匿名化后处理——严格加密、匿名化后处理不构成不留存或不训练的承诺,不是零保留依据"
anchor = "volcengine-cp-personal-encryption-anonymization"

[[product.retention.point]]
text = "Privacy policy §4.4: \"we have no obligation to store your data or information\", and the storage location is \"the data centre agreed between you and us\". This does not overturn §1.3, §12.8 or §6.6; it only shows that storage itself is not a commitment the vendor makes to the customer"
text_zh = "隐私政策 §4.4:厂商声明「我们没有义务存储您的数据或信息」,存储地点为「您和我们约定的数据中心」。它不推翻 §1.3、§12.8 与 §6.6,只说明「存储」不是厂商对客户作出的承诺项"
anchor = "volcengine-cp-privacy-no-storage-obligation"

