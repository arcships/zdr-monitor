[[product.zdr.point]]
text = "Scope limit — own endpoints are excluded: \"If you instead configure your own endpoints - LLM gateways, self-hosted models, or generic HTTP APIs - the privacy guarantees are entirely determined by those systems and your agreements with them; Factory does not add additional protections on top.\""
text_zh = "适用范围限定——自建端点被排除：「If you instead configure your own endpoints - LLM gateways, self-hosted models, or generic HTTP APIs - the privacy guarantees are entirely determined by those systems and your agreements with them; Factory does not add additional protections on top.」"
anchor = "byok-own-endpoints-disclaimer"
[product.retention]
object = "mixed"
basis = "fixed_period"
days = 3650
anchor = "retention-archive-10y"
[[product.retention.point]]
text = "Object: account-related personal data in Factory's archives — default, upper bound: \"We will delete your personal data from our archives no later than 10 years from the last time you used Factory or as agreed with you in a separate contract\"; a separate contract may set another term. Not a period for request inputs and outputs."
text_zh = "对象：Factory 档案中的账户相关个人数据——默认、上限：「We will delete your personal data from our archives no later than 10 years from the last time you used Factory or as agreed with you in a separate contract」；可另行合同约定其他期限。不是请求输入输出正文的期限。"
anchor = "retention-archive-10y"
[[product.retention.point]]
text = "Object: Factory-hosted operational logs in cloud-managed mode (authentication and administrative actions, service health and debugging). Public text quantifies nothing but says the period is negotiable — \"Retention and residency for these logs are documented in the Trust Center and can be tuned per customer engagement\"."
text_zh = "对象：云托管模式下 Factory 侧运行日志（认证与管理操作、服务健康与排障）。公开文本未量化，但写明可按客户协商调整——「Retention and residency for these logs are documented in the Trust Center and can be tuned per customer engagement」。"
anchor = "factory-cloud-logs-retention"
[[product.retention.point]]
text = "Object: request inputs and outputs on the default enterprise-endpoint configuration — Factory states it does not keep them: \"In these configurations, Factory routes traffic directly to the provider's official APIs; we do not proxy this traffic through third-party services or store prompts and responses in Factory cloud.\" Scoped to the direct enterprise endpoints; the content still reaches the upstream provider, whose own terms govern its retention."
text_zh = "对象：默认企业级端点配置下的请求输入输出正文——Factory 明说不留：「In these configurations, Factory routes traffic directly to the provider's official APIs; we do not proxy this traffic through third-party services or store prompts and responses in Factory cloud.」只覆盖直连企业级端点；内容仍到达上游厂商，其保留由上游条款决定。"
anchor = "factory-no-store-prompts"
[[product.retention.point]]
text = "Object: request inputs and outputs on BYOK / gateway / self-hosted paths — out of Factory's hands: \"If you instead configure your own endpoints - LLM gateways, self-hosted models, or generic HTTP APIs - the privacy guarantees are entirely determined by those systems and your agreements with them; Factory does not add additional protections on top.\""
text_zh = "对象：BYOK／网关／自建模型路径下的请求输入输出正文——不在 Factory 手里：「If you instead configure your own endpoints - LLM gateways, self-hosted models, or generic HTTP APIs - the privacy guarantees are entirely determined by those systems and your agreements with them; Factory does not add additional protections on top.」"
anchor = "byok-own-endpoints-disclaimer"
[[product.retention.point]]
text = "Object: telemetry, including the optional message-content trace spans — they stay on the customer's side: \"Spans never reach Factory's collector, in any configuration.\" This is a boundary on telemetry, not a commitment about Factory-hosted operational logs in cloud-managed mode (those are covered by the Trust Center sentence above)."
text_zh = "对象：遥测，含可选的消息内容 trace span——只留在客户侧：「Spans never reach Factory's collector, in any configuration.」这是遥测侧的边界，不是对云托管模式 Factory 侧运行日志的承诺（后者见上一条 Trust Center 句）。"
anchor = "spans-never-reach-factory"
[[product.retention.point]]
text = "Object: fully airgapped deployments — no Factory-side retention at all, the customer decides: \"In fully airgapped environments, Factory never receives any runtime data; you are responsible for all retention and residency decisions.\""
text_zh = "对象：全隔离部署——Factory 侧不保留，由客户决定：「In fully airgapped environments, Factory never receives any runtime data; you are responsible for all retention and residency decisions.」"
anchor = "airgapped-runtime-retention"
[[product.retention.point]]
text = "Object: prompt cache. On BYOK and custom-model paths caching is not governed by Factory — \"Caching behavior follows each provider's implementation and requirements.\""
text_zh = "对象：prompt 缓存。BYOK 与自定义模型路径下缓存不受 Factory 控制——「Caching behavior follows each provider's implementation and requirements.」"
anchor = "byok-caching-upstream"
[product.processing_region]
codes = ["US", "selected"]
anchor = "org-enterprise-residency"
[[product.processing_region.point]]
text = "Default processing is in the United States — the consumer privacy policy states \"We process all data in the United States and in any data processing facilities operated by the third parties identified below\", with data primarily stored in AWS US West."
text_zh = "默认处理地在美国——消费级隐私政策写「We process all data in the United States and in any data processing facilities operated by the third parties identified below」，数据主要存于 AWS US West。"
anchor = "factory-us-processing"
[[product.processing_region.point]]
text = "Enterprise is the tier that can change the region, per the developer_data source: \"Choose Enterprise when you need unlimited seats, dedicated compute, partitioned inference, on-premise deployment, sub-organizations, data residency, or priority support commitments.\" Hence codes US + customer-selected rather than US alone."
text_zh = "能改变处理地的是 Enterprise 档，依据 developer_data 来源：「Choose Enterprise when you need unlimited seats, dedicated compute, partitioned inference, on-premise deployment, sub-organizations, data residency, or priority support commitments.」故记 US + 可选地域，而不是单一的 US。"
anchor = "org-enterprise-residency"
[[product.processing_region.point]]
text = "Deployment patterns that move or remove the region: hybrid — \"LLM and OTEL traffic terminate in your network\"; fully airgapped — \"no traffic leaves the environment\" and \"In fully airgapped environments, Factory never receives any runtime data; you are responsible for all retention and residency decisions.\""
text_zh = "会改变或移除处理地的部署形态：混合部署——「LLM and OTEL traffic terminate in your network」；全隔离部署——「no traffic leaves the environment」以及「In fully airgapped environments, Factory never receives any runtime data; you are responsible for all retention and residency decisions.」"
anchor = "airgapped-no-traffic"
[[product.processing_region.point]]
text = "Hybrid deployments keep the LLM and telemetry traffic inside the customer's network: \"LLM and OTEL traffic terminate in your network\"; Factory cloud may only see minimal metadata if the customer enables it."
text_zh = "混合部署下 LLM 与遥测流量终止在客户网络内：「LLM and OTEL traffic terminate in your network」；只有客户主动开启时 Factory 云才可能看到最少的元数据。"
anchor = "hybrid-traffic-terminates"
[product.role]
kind = "unknown"
searched = ["https://docs.factory.ai/pricing/organizations.md", "https://docs.factory.ai/enterprise/privacy-and-data-flows.md", "https://factory.ai/privacy-policy"]
[[product.role.point]]
text = "No role is stated for this tier. organizations.md describes the Enterprise plan and its controls but names no controller/processor role; privacy-and-data-flows covers deployment and data flow, not a role; the consumer privacy policy is a notice to individuals and its preamble defines the scope of the notice, not the role. No DPA or contract text is registered as a source in this file, so the role has to be confirmed from the signed agreement before procurement."
text_zh = "本档没有角色表述。organizations.md 讲的是 Enterprise 档的套餐与控制能力，没有给 controller/processor 角色；privacy-and-data-flows 讲部署与数据流，不涉及角色；消费级隐私政策是面向个人的通知，其前言界定的是通知适用范围而非角色。本文件没有登记任何 DPA 或合同文本来源，采购前需从签署的协议确认角色。"
anchor = "org-data-controls-row"

