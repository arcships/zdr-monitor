[[product]]
id = "individual-hosted"
badge = "个人托管模型"
category = "coding_plan"
plan_level = "individual"
label = "Pro / Plus / Max，Factory 管理或云模型"
[product.training]
mark = "no"
anchor = "factory-improve-services"
[[product.training.point]]
text_zh = "通用隐私政策允许为改善服务处理数据，未明确排除模型训练，按口径 training=no。"
[[product.training.point]]
text = "Context, not a reversal: the same processing-purpose paragraph keeps a consent gate open for other purposes — \"We may also process your information for other purposes with your consent.\" The training verdict still follows the improvement clause."
text_zh = "语境补充、不改变结论：同段处理目的还留了经同意开启其他用途的开口——「We may also process your information for other purposes with your consent.」training 结论仍按改善服务条款取保守值。"
anchor = "training-consent-other-purposes"
[product.zdr]
mark = "unknown"
searched = ["https://docs.factory.ai/enterprise/privacy-and-data-flows.md", "https://factory.ai/privacy-policy", "https://docs.factory.ai/pricing/individuals.md"]
[[product.zdr.point]]
text = "Why unknown, with the zero-retention wording that does exist in this source set kept visible: it is tied to enterprise-grade endpoints and to contracts — \"By default, Droid can target enterprise-grade endpoints for providers like Azure OpenAI, AWS Bedrock, Google Vertex AI, OpenAI, Anthropic, and Gemini, using contracts that support zero data retention and enterprise privacy controls.\" Neither individuals.md nor the privacy policy offers a ZDR arrangement for the individual tiers."
text_zh = "维持 unknown 的理由，并标出本来源集里确实存在的零保留表述：它绑定企业级端点与合同——「By default, Droid can target enterprise-grade endpoints for providers like Azure OpenAI, AWS Bedrock, Google Vertex AI, OpenAI, Anthropic, and Gemini, using contracts that support zero data retention and enterprise privacy controls.」individuals.md 与隐私政策都没有给个人档 ZDR 安排。"
anchor = "enterprise-endpoints-zdr"
[product.retention]
object = "mixed"
basis = "fixed_period"
days = 3650
anchor = "retention-archive-10y"
[[product.retention.point]]
text = "Object: account-related personal data in Factory's archives — default, upper bound: \"We will delete your personal data from our archives no later than 10 years from the last time you used Factory or as agreed with you in a separate contract\"; the same section archives PII for the duration of the account, and a separate contract may set another term. This is the only quantified retention period in this source set, and it is not a period for request inputs and outputs."
text_zh = "对象：Factory 档案中的账户相关个人数据——默认、上限：「We will delete your personal data from our archives no later than 10 years from the last time you used Factory or as agreed with you in a separate contract」；同节写明 PII 在账户存续期间归档使用，可另行合同约定其他期限。这是本快照集里唯一量化的保留期限，不是请求输入输出正文的期限。"
anchor = "retention-archive-10y"
[[product.retention.point]]
text = "Object: Factory-hosted operational logs in cloud-managed mode (authentication and administrative actions, service health and debugging). The public text quantifies nothing — \"Retention and residency for these logs are documented in the Trust Center and can be tuned per customer engagement\" — which is an unquantified public text, not a statement that nothing is kept."
text_zh = "对象：云托管模式下 Factory 侧运行日志（认证与管理操作、服务健康与排障）。公开文本未量化——「Retention and residency for these logs are documented in the Trust Center and can be tuned per customer engagement」——属公开文本未量化，不等于厂商未表态。"
anchor = "factory-cloud-logs-retention"
[[product.retention.point]]
text = "Object: request inputs and outputs. Neither individuals.md nor the privacy policy gives a retention period for prompt or response content."
text_zh = "对象：请求输入输出正文。individuals.md 与隐私政策都没有给出 prompt/response 内容的保留期限。"
[[product.retention.point]]
text = "Object: prompt cache. On BYOK and custom-model paths caching is not governed by Factory — \"Caching behavior follows each provider's implementation and requirements.\""
text_zh = "对象：prompt 缓存。BYOK 与自定义模型路径下缓存不受 Factory 控制——「Caching behavior follows each provider's implementation and requirements.」"
anchor = "byok-caching-upstream"
[product.processing_region]
codes = ["US"]
anchor = "factory-us-processing"
[product.role]
kind = "controller"
anchor = "privacy-legitimate-interests"
[[product.role.point]]
text = "No sentence in this source set calls Factory a controller or a processor. The nearest identity evidence is that Factory processes on its own legal bases for its own purposes — \"Processing your data is necessary for our legitimate interests or the legitimate interests of a third party, provided those interests are not outweighed by your rights and interests.\" — the controller stance of a consumer notice. No DPA or contract source is registered in this file."
text_zh = "本来源集里没有一句把 Factory 写成 controller 或 processor。最接近身份判断的是它以自身合法利益、为自身目的处理数据——「Processing your data is necessary for our legitimate interests or the legitimate interests of a third party, provided those interests are not outweighed by your rights and interests.」——即消费级通知的控制者口径。本文件没有登记任何 DPA 或合同来源。"
anchor = "privacy-legitimate-interests"

