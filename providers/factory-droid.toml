[[product]]
id = "business-hosted"
badge = "Business"
category = "coding_plan"
plan_level = "team"
label = "Business 组织档，Factory 托管链路；ZDR 等数据控制能力随合同开通"
[product.training]
mark = "no"
anchor = "factory-improve-services"
[[product.training.point]]
text_zh = "通用隐私政策允许为改善服务处理数据，未明确排除模型训练，按口径 training=no；organizations.md 未给 Business 档单独的训练条款。"
[[product.training.point]]
text = "Context, not a reversal: the same processing-purpose paragraph keeps a consent gate open for other purposes — \"We may also process your information for other purposes with your consent.\" The training verdict still follows the improvement clause."
text_zh = "语境补充、不改变结论：同段处理目的还留了经同意开启其他用途的开口——「We may also process your information for other purposes with your consent.」training 结论仍按改善服务条款取保守值。"
anchor = "training-consent-other-purposes"
[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "org-business-zdr"
[[product.zdr.point]]
text = "Business lists ZDR as a plan capability, alongside identity and audit controls — \"SSO, SAML/SCIM provisioning, and ZDR\" in the Business card and the Data controls row \"| Data controls | — | ZDR, audit logging and activity trails | ZDR, audit logging, data residency |\". It is a capability of a custom-priced plan sold through sales (the same card reads \"Business · Custom pricing\" / \"Contact Sales\"), not a self-serve switch, hence by_agreement rather than a default."
text_zh = "Business 把 ZDR 列为套餐能力，与身份和审计控制并列——Business 卡片条目「SSO, SAML/SCIM provisioning, and ZDR」，对照表 Data controls 行「| Data controls | — | ZDR, audit logging and activity trails | ZDR, audit logging, data residency |」。它属于按需报价、经销售开通的套餐能力（同一卡片写「Business · Custom pricing」「Contact Sales」），不是自助开关，故记 by_agreement 而非默认。"
anchor = "org-data-controls-row"
[[product.zdr.point]]
text = "What the ZDR is attached to, and on what conditions: \"By default, Droid can target enterprise-grade endpoints for providers like Azure OpenAI, AWS Bedrock, Google Vertex AI, OpenAI, Anthropic, and Gemini, using contracts that support zero data retention and enterprise privacy controls. In these configurations, Factory routes traffic directly to the provider's official APIs; we do not proxy this traffic through third-party services or store prompts and responses in Factory cloud.\" In high-security settings the docs add: \"Prefer the direct enterprise endpoints described above to get first-party zero-retention guarantees.\" The guarantee therefore covers the direct enterprise-endpoint configuration; it does not cover gateways or self-hosted models (see the next point)."
text_zh = "这条 ZDR 挂在什么上、什么条件下：文档「By default, Droid can target enterprise-grade endpoints for providers like Azure OpenAI, AWS Bedrock, Google Vertex AI, OpenAI, Anthropic, and Gemini, using contracts that support zero data retention and enterprise privacy controls. In these configurations, Factory routes traffic directly to the provider's official APIs; we do not proxy this traffic through third-party services or store prompts and responses in Factory cloud.」高安全场景另写「Prefer the direct enterprise endpoints described above to get first-party zero-retention guarantees.」即承诺覆盖直连企业级端点的配置，不覆盖网关或自建模型（见下一条）。"
anchor = "factory-no-store-prompts"
[[product.zdr.point]]
text = "Scope limit — own endpoints are excluded: \"If you instead configure your own endpoints - LLM gateways, self-hosted models, or generic HTTP APIs - the privacy guarantees are entirely determined by those systems and your agreements with them; Factory does not add additional protections on top.\" On those paths retention, training and ZDR are decided by the upstream hop."
text_zh = "适用范围限定——自建端点被排除：「If you instead configure your own endpoints - LLM gateways, self-hosted models, or generic HTTP APIs - the privacy guarantees are entirely determined by those systems and your agreements with them; Factory does not add additional protections on top.」走这些路径时保留、训练与 ZDR 都由上游那一跳决定。"
anchor = "byok-own-endpoints-disclaimer"
[product.retention]
object = "mixed"
basis = "fixed_period"
days = 3650
anchor = "retention-archive-10y"
[[product.retention.point]]
text = "Object: account-related personal data in Factory's archives — default, upper bound: \"We will delete your personal data from our archives no later than 10 years from the last time you used Factory or as agreed with you in a separate contract\"; a separate contract may set another term. Not a period for request inputs and outputs."
text_zh = "对象：Factory 档案中的账户相关个人数据——默认、上限：「We will delete your personal data from our archives no later than 10 years from the last time you used Factory or as agreed with you in a separate contract」；可另行合同约定其他期限。不是请求输入输出正文的期限。"
anchor = "retention-archive-10y"
[[product.retention.point]]
text = "Object: Factory-hosted operational logs in cloud-managed mode (authentication and administrative actions, service health and debugging). The public text quantifies nothing — \"Retention and residency for these logs are documented in the Trust Center and can be tuned per customer engagement\" — which is an unquantified public text, not a statement that nothing is kept."
text_zh = "对象：云托管模式下 Factory 侧运行日志（认证与管理操作、服务健康与排障）。公开文本未量化——「Retention and residency for these logs are documented in the Trust Center and can be tuned per customer engagement」——属公开文本未量化，不等于厂商未表态。"
anchor = "factory-cloud-logs-retention"
[[product.retention.point]]
text = "Object: request inputs and outputs on the default enterprise-endpoint configuration — Factory states it does not keep them: \"In these configurations, Factory routes traffic directly to the provider's official APIs; we do not proxy this traffic through third-party services or store prompts and responses in Factory cloud.\" This is scoped to the direct enterprise endpoints; the prompt/response content still reaches the upstream provider, whose own retention terms apply, and organizations.md gives no period of its own."
text_zh = "对象：默认企业级端点配置下的请求输入输出正文——Factory 明说不留：「In these configurations, Factory routes traffic directly to the provider's official APIs; we do not proxy this traffic through third-party services or store prompts and responses in Factory cloud.」这条只覆盖直连企业级端点；prompt/response 仍到达上游厂商，其保留条款另算，organizations.md 自身没有给出期限。"
anchor = "factory-no-store-prompts"
[[product.retention.point]]
text = "Object: request inputs and outputs on BYOK / gateway / self-hosted paths — out of Factory's hands: \"If you instead configure your own endpoints - LLM gateways, self-hosted models, or generic HTTP APIs - the privacy guarantees are entirely determined by those systems and your agreements with them; Factory does not add additional protections on top.\""
text_zh = "对象：BYOK／网关／自建模型路径下的请求输入输出正文——不在 Factory 手里：「If you instead configure your own endpoints - LLM gateways, self-hosted models, or generic HTTP APIs - the privacy guarantees are entirely determined by those systems and your agreements with them; Factory does not add additional protections on top.」"
anchor = "byok-own-endpoints-disclaimer"
[[product.retention.point]]
text = "Object: telemetry, including the optional message-content trace spans — they stay on the customer's side: \"Spans never reach Factory's collector, in any configuration.\" This is a boundary on telemetry, not a commitment about Factory-hosted operational logs in cloud-managed mode (those are covered by the Trust Center sentence above)."
text_zh = "对象：遥测，含可选的消息内容 trace span——只留在客户侧：「Spans never reach Factory's collector, in any configuration.」这是遥测侧的边界，不是对云托管模式 Factory 侧运行日志的承诺（后者见上一条 Trust Center 句）。"
anchor = "spans-never-reach-factory"
[[product.retention.point]]
text = "Object: prompt cache. On BYOK and custom-model paths caching is not governed by Factory — \"Caching behavior follows each provider's implementation and requirements.\""
text_zh = "对象：prompt 缓存。BYOK 与自定义模型路径下缓存不受 Factory 控制——「Caching behavior follows each provider's implementation and requirements.」"
anchor = "byok-caching-upstream"
[product.processing_region]
codes = ["US"]
anchor = "factory-us-processing"
[[product.processing_region.point]]
text = "Scope note: data residency is not listed for Business. In the same Data controls row, Business is \"ZDR, audit logging and activity trails\" while Enterprise is \"ZDR, audit logging, data residency\"."
text_zh = "适用范围说明：Business 未列 data residency。同一 Data controls 行里 Business 是「ZDR, audit logging and activity trails」，Enterprise 才是「ZDR, audit logging, data residency」。"
anchor = "org-data-controls-row"
[product.role]
kind = "unknown"
searched = ["https://docs.factory.ai/pricing/organizations.md", "https://docs.factory.ai/enterprise/privacy-and-data-flows.md", "https://factory.ai/privacy-policy"]
[[product.role.point]]
text = "No role is stated for this tier. organizations.md describes the Business plan, its controls and its contract-based pricing but names no controller/processor role; privacy-and-data-flows describes deployment and data flow, not a role; the consumer privacy policy is a notice to individuals and its preamble defines the scope of the notice, not the role. No DPA or contract text is registered as a source in this file, so the role has to be confirmed from the signed agreement before procurement."
text_zh = "本档没有角色表述。organizations.md 讲的是 Business 档的套餐、控制能力与按合同的定价，没有给 controller/processor 角色；privacy-and-data-flows 讲部署与数据流，不涉及角色；消费级隐私政策是面向个人的通知，其前言界定的是通知适用范围而非角色。本文件没有登记任何 DPA 或合同文本来源，采购前需从签署的协议确认角色。"
anchor = "org-data-controls-row"

