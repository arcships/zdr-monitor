[[source]]
url = "https://docs.oracle.com/en-us/iaas/Content/generative-ai-agents/data-handling.htm"
channel = "developer_data"
tier = "core"
note = "『Data Handling in Generative AI Agents』（Updated 2024-09-25）。**这是独立的 OCI Generative AI Agents 服务**（docs.oracle.com/en-us/iaas/Content/generative-ai-agents/，与 Generative AI 服务不同），有独立的保留条款：聊天数据不留存到会话之后、查询与检索上下文仅会话期内保留、不用客户知识库与聊天数据训练、托管知识库隔离存储不跨客户混合。"

[[source]]
url = "https://docs.oracle.com/en-us/iaas/Content/generative-ai/ai-cluster.htm"
channel = "developer_data"
tier = "core"
note = "『Managing Dedicated AI Clusters』（Updated 2025-11-13）。Dedicated AI Cluster 档的产品定义与隔离声明：集群专用于你的模型、不与其他 tenancy 的用户共享；用于微调自定义模型或托管预训练/自定义/导入模型的端点。"

[[source]]
url = "https://docs.oracle.com/en-us/iaas/Content/generative-ai/create-project.htm"
channel = "developer_data"
tier = "core"
note = "『Creating a Project』（Updated 2026-05-01）。给出 agentic 档保留的**上限量化值**：response retention 与 conversation retention 分别配置，超过后自动删除，最大 720 小时（30 天）。"

[[source]]
url = "https://docs.oracle.com/en-us/iaas/Content/generative-ai/data-handling.htm"
channel = "developer_data"
tier = "core"
note = "『Data Handling in Generative AI』（页面标注 Updated 2025-10-21；导航已改为 Enterprise AI Models / Enterprise AI Agents）。FAQ 体例，覆盖 OCI Generative AI 推理档与微调档：推理输入不保留、输入输出均不存储在 OCI Generative AI 内；微调训练数据由客户自持、作业结束后不留存、作业完成即从微调集群删除、不用于改进通用场景；不与 Cohere/Meta/xAI/Google Vertex AI 等第三方模型提供商共享 prompts/responses/微调数据。**全文无 ZDR 字样、无处理地域、无角色条款**。旧记录引用的原句仍逐字在位。"

[[source]]
url = "https://docs.oracle.com/en-us/iaas/Content/generative-ai/projects.htm"
channel = "developer_data"
tier = "core"
note = "『Projects』（Updated 2026-04-17）。OCI Generative AI 的 agentic 档（Responses/Conversations API + Files/Vector Stores/Containers）以 project 为边界：project 内可设置 responses 与 conversations 的保留时长、长期记忆、短期记忆压缩；project 相互隔离；删除 project 连带删除其下全部 artifacts。与 data-handling 页的『推理输入输出不存储』并存，是保留维度分对象记录的依据。"

[[source]]
url = "https://docs.oracle.com/en-us/iaas/Content/generative-ai/regions.htm"
channel = "developer_data"
tier = "core"
note = "『Generative AI Regions』（Updated 2026-05-06）。列出 OCI Generative AI 可用的商业/政府/主权 Region，并说明该服务并未覆盖所有 OCI 商业 Region：调用 Region 与目标 Region 不一致时会发生跨 Region 调用（EU 的 AMS/MRS/LIN/ARN/CDG/MAD/ZRH/FRA 一律落到 FRA）。"

[[source]]
url = "https://docs.oracle.com/en-us/iaas/Content/generative-ai/responses-api.htm"
channel = "developer_data"
tier = "core"
note = "『OCI Responses API』（Updated 2026-08-08）。agentic 档主 API。关键两点：(1) 后台执行模式即使请求里 `store` 设为 false 也必须做临时响应存储，响应数据留在 OCI；(2) 与 OpenAI Responses API 的对照表写明『Data retention: Data remains in OCI』、『Endpoint model: Regional endpoints』。"

[[source]]
url = "https://www.oracle.com/contracts/docs/cloud_csa_online_v062223_us_eng.pdf"
channel = "contract"
tier = "core"
note = "《Oracle Cloud Services Agreement》(CSA, Online, v062223, US_ENG, Oracle America, Inc.)，OCI 主合同。§5.2 把 DPA 并入本合同（且 DPA 与 Service Specifications/隐私政策冲突时 DPA 优先）；§9.5 服务期结束后的取回期与删除；§11.1 监控工具不收集/存储 Your Content（除必要）；§11.2 Service Analyses（聚合数据用于研发）；§13.2 客户自行负责跨地域传输。全文无『不用于训练』条款，也无 ZDR 条款。"

[[source]]
url = "https://www.oracle.com/contracts/docs/data-processing-agreement-oracle-services-081425.pdf"
channel = "contract"
tier = "core"
note = "《Data Processing Agreement for Oracle Services》Version 14 August, 2025（PDF 8 页，经 r.jina.ai 渲染）。DPA §1 自述适用于『Oracle's Processing of Personal Information on Your behalf as a Processor』，并规定与 Services Agreement（含 Service Descriptions/Service Specifications）冲突时 DPA 优先。覆盖 OCI 全产品线（含 OCI Generative AI / Enterprise AI）：§2.1 角色定性、§6.1 存储地域、§6.2 全球访问、§10.1 终止后删除、§5.1 分包处理者。注意对象是『Personal Information』，不含非个人信息的客户内容；后者走 CSA/HDP。"

[[source]]
url = "https://www.oracle.com/contracts/docs/ocloud_hosting_delivery_policies_3089853.pdf"
channel = "contract"
tier = "core"
note = "《Oracle Cloud Hosting and Delivery Policies》Effective Date May 2026, Version 3.12（19 页 PDF）。CSA §5.1 与 DPA §7.1 指定它为 Cloud Services 的安全与交付政策。量化期限：§1.14 安全日志在线保留至少 1 年；§2.2 备份通常在线/离线保留至少 60 天；§4.1.2 数据中心迁移限于同一 Data Center Region（提前 30 天通知）；§6.1 服务期结束后 60 天取回期、试用/试点 30 天、取回期届满删除 Your Content。注意 §2.2 已被 PaaS/IaaS Pillar Document §2.1 取代，§4.1.2 对试用/免费档被 Pillar §2.2 取代。"

[[source]]
url = "https://www.oracle.com/legal/privacy/privacy-policy.html"
channel = "consumer_privacy"
tier = "core"
note = "《Oracle Privacy Policy》（Oracle 集团网站与账户侧个人信息）。§3 自认对政策所述个人信息负责（这一层是独立控制者，与 DPA 的受托层分开记）；§4 把『analyze, develop, improve and optimize … including for quality assurance and training purposes』列为处理目的；§7 给出账户/联系信息保留口径（Oracle Cloud 账户信息随账户存续保留、注销后保留最小账户信息）。**不覆盖 API 内容**：API 内容由 CSA + DPA 管辖（CSA §5.2 指向隐私政策与 DPA，且 DPA 冲突时优先）。"

[[source]]
url = "https://www.oracle.com/middleeast/contracts/docs/paas_iaas_pub_cld_srvs_pillar_4021422.pdf"
channel = "contract"
tier = "core"
note = "《Oracle PaaS and IaaS Public Cloud Services Pillar Document》September 2026（150 页 PDF；Oracle 中东区路径下的同一份文档，US 版由 oracle.com/contracts/cloud-services 入口分发）。两处直接改写 HDP 对 PaaS/IaaS（含 OCI Generative AI，见 §3.6.38/§3.6.39 SKU 表）的适用：§2.1 备份责任改由客户承担（取代 HDP §2.2 的『Oracle 定期备份、至少 60 天』）；§2.2 仅对试用/Free Tier/Always Free 档允许跨 Region 迁移（取代 HDP §4.1.2）。另含 EUSC 主权条款。SKU 表确认 xAI 系模型按 Input/Output/Cached Input Tokens 计费，但未披露缓存 TTL 或保留期限。"

[[source]]
