[[product.retention.point]]
text_zh = "②长期记忆启用时官方建议把两项保留都设为最大值 720 小时，说明记忆也受该配置约束"

[[product.retention.point]]
text_zh = "③删除 project 连带删除其下 responses/conversations/files/containers（projects 页）"

[[product.retention.point]]
text_zh = "④后台执行模式即使 `store=false` 也必须做临时响应存储，响应数据留在 OCI（responses-api 页）——本档存在**不可关闭的临时保留**。上限清晰（30 天），下限/默认值未披露。"

