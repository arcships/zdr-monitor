text = "Structured conclusion: the cited clause states affirmatively that response data is stored regardless of the store flag (\"This temporary storage is required even when the request sets `store` to `false`.\"), and the tier retains responses/conversations up to 30 days with no option to set retention to 0. The tier is therefore recorded as mark=no (terms state retention), not as undisclosed."
text_zh = "结构化结论：原引句正面写明即使把 `store` 设为 `false` 仍必须临时存储，且本档 responses/conversations 最长保留 30 天、无把保留设为 0 的选项。据此记 mark=no（条款明示会留存），而不是「未披露」。"

[[product.zdr.point]]
text_zh = "本档**按设计保留内容**（responses/conversations 最长 30 天、长期记忆持久化、后台模式必须临时存储），Oracle 未披露任何把保留设为 0 的选项，也未把该档纳入『zero data retention endpoints』的表述范围（该表述出现在模型访问侧）。"

[[product.zdr.point]]
text_zh = "这不等于厂商拒绝提供，但按公开材料本档与零保留相斥。"

