[[product.processing_region.point]]
text = "The hosting sentence is qualified by its source: \"xAI Grok models are hosted on the xAI platform with data processed on zero data retention endpoints, offering an extra layer of protection.\" appears only in the 2026-01-13 classified-cloud post, whose subject is the general availability of OCI Generative AI in Oracle's US Top Secret classified cloud regions (see this provider's source note). It is a statement about that deployment, not about the commercial tier, so it is not used here as a fact about where commercial-tier requests are processed."
text_zh = "托管说法受来源限定：『xAI Grok models are hosted on the xAI platform with data processed on zero data retention endpoints, offering an extra layer of protection.』只出现在 2026-01-13 的分类云博客，该篇主题是 OCI Generative AI 在美国 Top Secret 分类云 Region 的 GA（本 provider 的 source note 也把对象限定为该篇所述部署）。它说的是那次部署，不是商业档，故不作为「商业档请求在何处处理」的事实。"

[[product.processing_region.point]]
anchor = "oci-blog-grok41-in-region"
text = "The commercial-tier wording does not settle it either: the 2026-01-21 post says \"**In-region data processing**, supporting data residency and regulatory requirements\", without saying whether in-region means the OCI Region or a region on the xAI side; the 2025-06-17 press release only says data sent to Grok models is processed on zero data retention endpoints and does not state where the models are hosted; the documentation site (xai-models.htm) does not discuss hosting at all. The two wordings are kept side by side rather than resolved."
text_zh = "商业档口径同样不能定性：2026-01-21 博客只写『**In-region data processing**, supporting data residency and regulatory requirements』，未说明 in-region 指 OCI Region 还是 xAI 侧 Region；2025-06-17 新闻稿只说送到 Grok 模型的数据经零保留端点处理，未说模型托管在哪；文档站（xai-models.htm）完全不提托管位置。两条口径并列保留，不选边。"

[[product.processing_region.point]]
anchor = "oci-blog-classified-xai-hosted-on-xai"
text_zh = "同一段内部张力同样并列保留：该篇既写『xAI Grok models are hosted on the xAI platform…』，又写『all data sent to the OCI Generative AI service is secure and private, remaining within the customer's tenancy』。"

[[product.processing_region.point]]
anchor = "oci-pillar-3-3-third-party-llm"
text = "Contract layer, narrow scope: for Cloud Services that use third-party LLMs, the EUSC sovereign terms (Appendix A §3.3) say the data \"may be processed outside of the selected EUSC data center region(s) and may be subject to additional terms from the applicable third-party LLM provider(s)\" — the same clause appears for UKSC (Appendix B §3.3). This sits in the sovereign-region annexes and must not be extrapolated to all commercial tiers; for the commercial tiers no contract clause on third-party LLM processing location has been located."
text_zh = "合同层（适用范围窄）：对使用第三方 LLM 的 Cloud Services，EUSC 主权条款（Appendix A §3.3）写数据『may be processed outside of the selected EUSC data center region(s) and may be subject to additional terms from the applicable third-party LLM provider(s)』；UKSC 有同旨表述（Appendix B §3.3）。该条位于主权 Region 附加条款，不能外推为全部商业档事实；商业档未找到关于第三方 LLM 处理地的合同条款。"

[[product.processing_region.point]]
anchor = "oci-pillar-uksc-3-3-third-party-llm"
text_zh = "同一条款在 UKSC 侧（Appendix B §3.3）：『…Your data may be processed outside of the selected UKSC data center region(s) and may be subject to additional terms from the applicable third-party LLM provider(s).』——与 EUSC 并列，适用范围同样限于该主权 Region 附加条款。"

[[product.processing_region.point]]
text_zh = "结论维持未披露（basis=undisclosed）：分类云部署的托管表述不能当商业档事实，商业档的『in-region』未说明是哪一侧的 Region，xAI 侧的 Region 也未披露。查阅范围见 searched。"

