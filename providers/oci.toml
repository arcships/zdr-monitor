text = "Scope of the anchor: the clause \"This training data is not used to improve the general use cases for OCI Generative AI.\" is about fine-tuning training data (the same paragraph says \"This training data is solely used for building a custom model for this customer\"). Per the ai-cluster page this tier is used both to fine-tune custom models and \"to host endpoints for the pretrained base models, custom models, and imported models\" — the hosting/inference path is not covered by that clause, and the data-handling page says of inference only \"doesn't retain customer inputs\" / \"Both input and output are not stored inside OCI Generative AI\", which is a retention statement."
text_zh = "锚点适用范围：原句『This training data is not used to improve the general use cases for OCI Generative AI.』的对象是微调训练数据（同段写 This training data is solely used for building a custom model for this customer）。按 ai-cluster 页，本档既用于微调自定义模型，也用于『host endpoints for the pretrained base models, custom models, and imported models』——托管/推理这条路径不在该句覆盖范围内，data-handling 页对推理只有『doesn't retain customer inputs』『Both input and output are not stored inside OCI Generative AI』，属保留表述。"

[[product.training.point]]
