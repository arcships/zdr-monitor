[[product.role.point]]
anchor = "oci-pillar-3-3-third-party-llm"
text = "Contract layer, narrow scope: the EUSC sovereign terms (Appendix A §3.3, same wording for UKSC in Appendix B §3.3) state that where a Cloud Service uses third-party LLMs, the data may be processed outside the selected sovereign data center region(s) and may be subject to additional terms from the applicable third-party LLM provider(s). That is the only clause in the public material that ties third-party LLMs to processing location and to extra third-party terms; it is confined to the EUSC/UKSC annexes and does not by itself settle the controller/processor chain for this tier."
text_zh = "合同层（适用范围窄）：EUSC 主权条款（Appendix A §3.3，UKSC 同旨见 Appendix B §3.3）写明使用第三方 LLM 的 Cloud Services，数据可能被处理在所选主权 Region 之外，并可能适用第三方 LLM 提供方的额外条款。这是公开材料里唯一把「第三方 LLM」与处理地、第三方条款写在一起的条款；它限于 EUSC/UKSC 附加条款，本身仍不闭合本档的 controller/processor 链。"

[[product.role.point]]
