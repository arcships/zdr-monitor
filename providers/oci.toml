[product.training]
mark = "yes"
mode = "default"
anchor = "oci-genai-dh-finetune-not-improve-general"

[[product.training.point]]
text = "Scope of the anchor: the clause \"This training data is not used to improve the general use cases for OCI Generative AI.\" is about customer-submitted fine-tuning training data — the same paragraph says \"This training data is solely used for building a custom model for this customer\". It is not a statement about inference inputs. The inference path on this tier is covered by the data-handling page only as \"No, OCI Generative AI doesn't retain customer inputs\" and \"Both input and output are not stored inside OCI Generative AI\" — a retention statement, not a training statement."
text_zh = "锚点适用范围：原句『This training data is not used to improve the general use cases for OCI Generative AI.』的对象是客户提交的**微调训练数据**（同段写 This training data is solely used for building a custom model for this customer），不是推理输入。本档推理路径在 data-handling 页只有『No, OCI Generative AI doesn't retain customer inputs』『Both input and output are not stored inside OCI Generative AI』——那是保留表述，不是训练表述。"

[[product.training.point]]
text = "The service-wide \"not used to train foundation models\" wording that this ledger previously cited comes from an Oracle blog post on the Cohere models (oci-generative-ai-adds-cohere-command-a-models). That URL is not registered in [[source]] and has no snapshot in this repo, so per AGENTS (\"a quote only counts if it appears in a snapshot\") it cannot carry this tier's verdict. Until the fetch bot brings it back, the yes on this tier rests on the fine-tuning clause and covers fine-tuning training data only."
text_zh = "台账此前引用的整服务口径『Data is not used to train foundation models』出自 Cohere 博客（oci-generative-ai-adds-cohere-command-a-models），该 URL 未登记在 [[source]]、仓库无快照，按 AGENTS「引文只有出现在快照里才算数」不能支撑本档结论。在该来源被 bot 抓回快照之前，本档的 yes 只覆盖微调训练数据这一条路径。"

[[product.training.point]]
anchor = "oci-privacy-training-purpose"
text = "Reverse evidence in the same provider, recorded alongside rather than resolved: the consumer Privacy Policy §4 says \"We may process personal information in order to analyze, develop, improve and optimize the use, function and performance of our sites and products and services, including for quality assurance and training purposes, as well as for marketing and sales campaigns.\" Its object is website/account-side personal information — §2 excludes personal information Oracle processes to provide Cloud, Technical Support or Consulting services to customers — so it does not reach API content. It is the only place in this provider's library where the words \"training purposes\" appear, and it must not be read as covering API inputs."
text_zh = "同一家的反面表述（并列保留，不选边）：消费侧《Oracle Privacy Policy》§4『We may process personal information in order to analyze, develop, improve and optimize the use, function and performance of our sites and products and services, including for quality assurance and training purposes, as well as for marketing and sales campaigns.』——对象是网站/账户侧个人信息，该政策 §2 明确把 Oracle 为提供 Cloud/技术支持/咨询等服务而处理的个人信息排除在外，故不覆盖 API 内容。这是本 provider 在库材料里唯一逐字出现 training purposes 的表述，不能读成覆盖 API 输入。"

[[product.training.point]]
anchor = "oci-dpa-2-2-purpose-limitation"
text = "Contract layer: there is no verbatim \"not used for training\" clause (CSA §11.2 keeps data from the Services in aggregated form for research and development). What the contract layer does contain is a purpose limitation in DPA §2.2 — Oracle Processes Personal Information solely for the purpose of providing the Services — whose object is Personal Information and therefore does not cover non-personal customer content."
text_zh = "合同层：没有逐字的『不用于训练』条款（CSA §11.2 保留以聚合形式使用服务数据用于研发）；但合同层有一条目的限制——DPA §2.2『Oracle will Process Personal Information during the term of the Services Agreement solely for the purpose of providing the Services in accordance with the Services Agreement and this Data Processing Agreement.』。对象是 Personal Information，不含非个人信息的客户内容。"

[[product.training.point]]
anchor = "oci-hdp-7-ai-terms"
text = "Uncovered contract-layer document, recorded as a gap and not used as evidence: HDP §7 says \"The Oracle Artificial Intelligence Terms available online at http://oracle.com/contracts apply to Artificial Intelligence Functionality (as defined in such terms) in Your ordered Cloud Services.\" Those AI Terms are not in [[source]] and have no snapshot in this repo, so whether they carry their own training or retention clauses cannot be judged from this ledger today."
text_zh = "未覆盖的合同层文档（记为缺口，不作依据）：HDP §7『The Oracle Artificial Intelligence Terms available online at http://oracle.com/contracts apply to Artificial Intelligence Functionality (as defined in such terms) in Your ordered Cloud Services.』该《Oracle Artificial Intelligence Terms》不在 [[source]]、仓库无快照，是否另有训练/保留条款目前无从判断，按「缺什么就记缺什么」记缺。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "oci-genai-dh-no-store-io"

[[product.zdr.point]]
text_zh = "同顶层 zdr：默认不落盘"

[[product.zdr.point]]
text_zh = "营销页称『zero data retention endpoints』"

[[product.zdr.point]]
text_zh = "无合同层 ZDR 条款与开通流程。"

[[product.zdr.point]]
anchor = "oci-dpa-2-2-purpose-limitation"
text = "Contract-layer cross-reference: DPA §2.2 limits the Processing of Personal Information to providing the Services, but it is a purpose limitation, not a zero-retention clause, and its object is Personal Information rather than non-personal customer content."
text_zh = "合同层对照：DPA §2.2 把 Personal Information 的处理限定在「为提供服务」这一目的，但它是目的限制条款、不是零保留条款，对象也是 Personal Information 而非非个人信息的客户内容。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "oci-genai-dh-no-store-io"

[[product.retention.point]]
text = "Field-level scope: object = input_output, basis = none covers the inference path only — \"No, OCI Generative AI doesn't retain customer inputs\" and \"Both input and output are not stored inside OCI Generative AI\". Retention on this tier has to be listed object by object; the remaining objects are in the points below."
text_zh = "字段层适用范围：object=input_output、basis=none 只覆盖推理路径——『No, OCI Generative AI doesn't retain customer inputs』『Both input and output are not stored inside OCI Generative AI』。本档 retention 按对象分列，其余对象见下列各条。"

[[product.retention.point]]
anchor = "oci-genai-dh-finetune-deleted-from-cluster"
text_zh = "①微调训练数据：『OCI Generative AI doesn't retain this training data beyond the duration of this training job.』『The training data is deleted from the fine-tuning cluster as soon as the training job is completed.』——作业结束即删，不是固定天数。"

[[product.retention.point]]
anchor = "oci-hdp-retrieval-60-days"
text_zh = "②Your Content：服务期结束后 60 天取回期（HDP §6.1『For a period of 60 days after the end of the Services Period…』），取回期届满删除（oci-hdp-delete-after-retrieval）。"

[[product.retention.point]]
anchor = "oci-hdp-security-logs-1-year"
text_zh = "③安全日志：『Security logs are retained online for a minimum of 1 year.』——这是 **下限**，对象是 Oracle 内部安全运营日志（同段『These logs are retained and used by Oracle for our internal security operations』），不是请求内容的保留期。台账此前把这条下限记成整档 days=365 / basis=fixed_period，等于反推「内容留 1 年」，已删除。"

[[product.retention.point]]
anchor = "oci-hdp-backup-60-days"
text_zh = "④HDP §2.2 的 60 天备份下限已被 Pillar §2.1 取代（客户自行备份）。"

[product.processing_region]
codes = ["selected"]
anchor = "oci-dpa-6-1-stored-in-data-center-region"

[[product.processing_region.point]]
text_zh = "DPA §6.1（合同层）：『For Cloud Services, Personal Information will be stored in the data center region specified in Your order for such Services or, if applicable, the Cloud region that You have selected when activating the production instance of such Services.』——存储地是订单指定或开通生产实例时选定的 Cloud region，即**客户选定地域**，不是全球。字段层 codes=selected 对应这一条；此前记 GLOBAL（渲染「全球」）与本档 point 自述方向相反，已改。"

[[product.processing_region.point]]
anchor = "oci-dpa-6-2-global-access"
text_zh = "限定一：DPA §6.2『Oracle may access Personal Information globally as necessary to perform the Services, such as for support, incident management or data recovery purposes.』——这是**支持访问**，不是处理地，支撑不了「全球处理」。"

[[product.processing_region.point]]
anchor = "oci-hdp-replicate-within-dc-region"
text_zh = "限定二：HDP『Your Content will be stored in the Data Center Region applicable to such Services. Oracle may replicate Your Content to other locations within the identified Data Center Region in support of data redundancy.』——复制限于同一 Data Center Region 内，仍属「选定 region」。"

[[product.processing_region.point]]
anchor = "oci-regions-cross-region-call"
text_zh = "限定三：服务并未覆盖所有商业 Region，『if the Calling Region and Destination Region are not the same, then a cross-region call will be made』——跨 Region 调用是对「选定 region」的限定，不是全球处理。"

