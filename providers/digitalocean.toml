[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
anchor = "do-hosted-no-training"
mode = "default"

[[product.training.point]]
text = "DigitalOcean-hosted models: \"DigitalOcean does not use this data to train, retrain, or fine-tune any model, and does not share it with any third parties for training or fine-tuning.\" and \"Customer data submitted to the model is never sent back to the original model creator, so the creator cannot use it for training.\" At the contract layer there is only a narrow no-training commitment (Service Terms §7.2.2 covers Evaluation Datasets and Evaluation Outputs only), with no clause covering all inference content — recorded as such."
text_zh = "DO 自托管模型:「DigitalOcean does not use this data to train, retrain, or fine-tune any model, and does not share it with any third parties for training or fine-tuning.」且「Customer data submitted to the model is never sent back to the original model creator」。合同层只有窄口径不训练承诺(Service Terms §7.2.2 仅覆盖 Evaluation Datasets/Outputs),无覆盖全部推理内容的合同条款 —— 已如实标注。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "do-infra-no-store-inputs-outputs"

[[product.zdr.point]]
text = "DigitalOcean has no ZDR program, application path or contractual commitment. The source text uses the term ZDR only in an exclusion context (the Files API \"does not qualify for Zero Data Retention (ZDR) frameworks\"). What is verifiable is architectural: \"We do not store inputs or outputs on DigitalOcean infrastructure for any models.\" plus, for third-party models, \"We do not store agent input or output when using third-party model providers.\", overlaid with the cache, Batch and Files exceptions. It is therefore recorded as \"inputs and outputs are not stored on the DigitalOcean side by default\", which is not a ZDR service that can be applied for"
text_zh = "DO 没有 ZDR 计划/申请入口/合同承诺。原文只在排除语境使用 ZDR 术语(Files API「does not qualify for Zero Data Retention (ZDR) frameworks」)。可核实的表述是架构性的「We do not store inputs or outputs on DigitalOcean infrastructure for any models.」+ 第三方模型「We do not store agent input or output when using third-party model providers.」,再叠加缓存/Batch/Files 例外。因此记为「DO 侧默认不存输入输出」,不等于可申请的 ZDR 服务"

[[product.zdr.point]]
text = "The earlier record of zdr=available/default is downgraded accordingly."
text_zh = "旧记录 zdr=available/default 的口径据此下调。"

[product.retention]
days = 30
object = "mixed"
basis = "fixed_period"
anchor = "do-batch-output-29-30d"

[[product.retention.point]]
text = "Object × period: (1) default — \"We do not store inputs or outputs on DigitalOcean infrastructure for any models.\" (an architectural statement)"
text_zh = "对象×期限:①默认——DO 自有基础设施不存输入输出(架构性表述)"

[[product.retention.point]]
text = "(2) prefix / KV cache — for OpenAI models prompt_cache_retention is in_memory or 24h, for Anthropic models ttl is 5m (default) or 1h, and caches are isolated per customer account"
text_zh = "②前缀/KV 缓存——OpenAI 模型 24h 或内存内,Anthropic 模型 5m(默认)/1h,缓存按账户隔离"

[[product.retention.point]]
text = "(3) Batch — output and error result files 29-30 days from job completion (the how-to says up to 30 days), prompts and request content \"Not stored for training or any purpose beyond the current batch job\", policy-violating content kept as evidence for up to 1 year"
text_zh = "③Batch——输出与错误文件 29-30 天(how-to 写 up to 30 days),prompts/请求内容仅为当前批次任务不存储,违规内容证据最多 1 年"

[[product.retention.point]]
text = "(4) Files API (/v1/files) — retained statefully across requests until an explicit, authenticated DELETE request is executed"
text_zh = "④Files API(/v1/files)——跨请求持久保存至显式 DELETE"

[[product.retention.point]]
text = "(5) Claude Fable 5/5.1 — access requires a mandatory 30-day data retention of prompts and completions"
text_zh = "⑤Claude Fable 5/5.1——强制 30 天保留 prompts/completions"

[[product.retention.point]]
text = "(6) contract layer — Service Terms §4.5.2 permits retaining relevant content and associated metadata as reasonably necessary to investigate violations"
text_zh = "⑥合同层——Service Terms §4.5.2 允许为违规调查保留相关内容与元数据"

[[product.retention.point]]
text = "DPA §7.6: all Personal Data is deleted no later than 30 days following the date of de-activation."
text_zh = "DPA §7.6 账户停用后 30 天内删除 Personal Data。"

[product.processing_region]
codes = ["selected"]
anchor = "do-processing-location"

[[product.processing_region.point]]
text = "The rule: \"The processing location is the customer’s selected region (when available as an option), the service provider’s location listed below and/or the location of the customer’s end users\". The AI-related subprocessor row reads \"LLM Models ... AI services ... Various, based on supplier\". Serverless Inference does not appear in the regional availability table and its specific processing location is not disclosed"
text_zh = "规则:「The processing location is the customer's selected region (when available as an option), the service provider's location listed below and/or the location of the customer's end users」。AI 相关子处理者写「LLM Models … AI services … Various, based on supplier」。Serverless Inference 不在区域可用性表内,其具体处理地未披露"

[[product.processing_region.point]]
text = "Dedicated Inference/BYOM is limited to NYC2/TOR1/ATL1/RIC1. SCC governing law: the member state where the EU customer is located, or the Netherlands (DPA Schedule 2/3)."
text_zh = "Dedicated Inference/BYOM 仅 NYC2/TOR1/ATL1/RIC1。SCC 管辖:欧盟客户所在成员国/荷兰(DPA Schedule 2/3)。"

[product.role]
kind = "processor"
anchor = "do-dpa-schedule1-do-is-processor"

[[product.role.point]]
text = "DPA §7.1: \"DigitalOcean will have the obligations set forth in this Section 7 if it Processes Personal Data in its capacity as Customer’s Processor or Service Provider\", and they do not apply when it acts as a Controller, Business or Third party"
text_zh = "DPA §7.1:仅当 DO 以 Customer's Processor/Service Provider 身份处理 Personal Data 时才承担 §7 义务,作为 Controller/Business/Third party 时不适用"

[[product.role.point]]
text = "Schedule 1 lists the scenarios one by one: \"Customer stores end-user data on DigitalOcean Services. → DigitalOcean is a Processor. Customer is a Controller or processor to a controller.\" §7.2.1 processes Personal Data only in accordance with the customer's instructions. Note: DigitalOcean is itself a Controller for account, billing and telemetry data (the first three rows of Schedule 1), so the role cannot be recorded as processor across the board."
text_zh = "Schedule 1 逐场景列明「Customer stores end-user data on DigitalOcean Services. → DigitalOcean is a Processor. Customer is a Controller or processor to a controller.」§7.2.1 仅按客户指示处理。注意:DO 对账户/账单/遥测数据自身是 Controller(Schedule 1 前三行),不能一律记成 processor。"

[[product]]
id = "agent-platform"
badge = "Agent 平台"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
anchor = "do-hosted-no-training"
mode = "default"

[[product.training.point]]
text = "The same AI data privacy page covers the agent scenario (including \"We do not store agent input or output when using third-party model providers.\"), and the no-training statement applies equally"
text_zh = "同一份 AI 数据隐私页覆盖 agent 场景(含「We do not store agent input or output when using third-party model providers.」),不训练表述同样适用"

[[product.training.point]]
text = "There is no separate contract-layer no-training clause on the knowledge base or agent side."
text_zh = "知识库/agent 侧无单独的合同层不训练条款。"

[product.zdr]
mark = "unknown"

[[product.zdr.point]]
text = "DigitalOcean expressly excludes only the Files API from ZDR eligibility and takes no position on whether ZDR applies to the knowledge base or to agent session storage. The knowledge base is cross-request persistent storage (the same shape as the Files API), but the vendor makes no corresponding statement, so this is recorded with low confidence and marked undisclosed rather than concluded on the vendor's behalf."
text_zh = "DO 只明确排除 Files API 的 ZDR 资格,对知识库/agent 会话存储是否适用 ZDR 未表态。知识库属跨请求持久化存储(与 Files API 同类形态),但厂商未作对应声明,故记低置信并标注未披露,不代替厂商下结论。"

[[product.zdr.point]]
text = "The clause previously bound here (\"We do not store agent input or output when using third-party model providers.\") covers only third-party-model-provider agent traffic, while this product's knowledge base is cross-request persistent storage that the vendor leaves unaddressed (and whose shape matches the Files API it does exclude from ZDR), so the clause is not a statement covering this tier and is no longer bound. The clause itself is still cited in this product's training points, whose verdict carries a different anchor."
text_zh = "原先绑在本条的引文（「We do not store agent input or output when using third-party model providers.」）只覆盖走第三方模型 provider 的 agent 流量，而本产品的知识库属跨请求持久化存储、厂商未表态（其形态与厂商已排除 ZDR 资格的 Files API 同类），不构成覆盖本档的表述，故不再绑在本条；该引文在本档 training 条目的 point 里仍被引用（那条的 anchor 是另一个）。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "do-kb-destroy-irreversible"

[[product.retention.point]]
text = "Knowledge base: data sources are immediately indexed into vector embeddings and stored persistently in the customer's own Managed OpenSearch database until an explicit destroy, when all of it is \"irreversibly and permanently deleted\""
text_zh = "知识库:数据源即刻向量化并持久存入客户自己的 Managed OpenSearch 数据库,直至显式 destroy(「irreversibly and permanently deleted」)"

[[product.retention.point]]
text = "Only the 15 most recent indexing job logs are kept"
text_zh = "索引任务日志只留最近 15 条"

[[product.retention.point]]
text = "Agent conversation context is read by the agent from browser storage (data privacy page). The retention period for agent run logs and traces is not disclosed — nothing is inferred in reverse."
text_zh = "agent 对话上下文由 agent 从浏览器存储读取(数据隐私页)。agent 运行日志与 traces 的保留期限未披露 —— 不反推。"

[product.processing_region]
codes = ["US", "CA"]
anchor = "do-availability-agent-platform-regions"

[[product.processing_region.point]]
text = "Regional availability table: Agent Platform is limited to TOR1 (Toronto), ATL1 (Atlanta) and RIC1 (Richmond)"
text_zh = "区域可用性表:Agent Platform 仅 TOR1(多伦多)、ATL1(亚特兰大)、RIC1(里士满)"

[[product.processing_region.point]]
text = "Dedicated Inference/BYOM additionally includes NYC2."
text_zh = "Dedicated Inference/BYOM 另含 NYC2。"

[product.role]
kind = "processor"
anchor = "do-dpa-schedule1-do-is-processor"

[[product.role.point]]
text = "Same as the API tier: when the customer stores end-user data, DigitalOcean is a Processor (DPA Schedule 1)."
text_zh = "同 API 档:客户存 end-user 数据时 DO 为 Processor(DPA Schedule 1)。"

[[product]]
id = "gpu-droplets"
badge = "GPU 云"
category = "api"
plan_level = "any"

[product.training]
mark = "unknown"

[[product.training.point]]
text = "GPU Droplets, Bare Metal and 1-Click Models are customer-managed infrastructure, and no model training takes place on the DigitalOcean side"
text_zh = "GPU Droplets/Bare Metal/1-Click Models 是客户自管基础设施,不存在 DO 侧模型训练行为"

[[product.training.point]]
text = "DigitalOcean writes no dedicated AI training clause for this tier — that is undisclosed, and must not be read in reverse as a commitment."
text_zh = "DO 未就该档作专门的 AI 训练条款 —— 属未披露,不得反向解读为承诺。"

[[product.training.point]]
text = "The TOS §4.1 clause previously bound here (\"we will store, host, or otherwise process … information that you provide\") defines what DigitalOcean may do with Services Content, not what it does with model training, so it is not a statement on this dimension and is no longer bound."
text_zh = "原先绑在本条的 TOS §4.1 引文（「we will store, host, or otherwise process … information that you provide」）界定的是 DO 对 Services Content 的处置范围，不涉及模型训练，不构成对本维度的表述，故不再绑在本条。"

[product.zdr]
mark = "unknown"
searched = [
  "https://docs.digitalocean.com/products/gpu-droplets/index.html.md",
  "https://docs.digitalocean.com/products/droplets/details/gpu-availability/index.html.md",
  "https://www.digitalocean.com/legal/terms-of-service-agreement",
  "https://www.digitalocean.com/legal/data-processing-agreement",
  "https://www.digitalocean.com/legal/third-party-ai-models",
]

[[product.zdr.point]]
text = "DigitalOcean's ZDR wording appears only in the Inference product documentation (in the Files API exclusion context). On the customer-managed GPU tier there is no retention on the DigitalOcean side, but the vendor does not use the ZDR term and gives no ZDR commitment — this is undisclosed, not a vendor commitment to the contrary."
text_zh = "DO 的 ZDR 相关表述仅出现在 Inference 产品文档(Files API 排除语境)。客户自管 GPU 档不存在 DO 侧留存,但厂商未使用 ZDR 术语、未提供 ZDR 承诺 —— 官方未披露,不是厂商承诺相反。"

[[product.zdr.point]]
text = "The clause previously bound here (\"They also come with two different kinds of storage: a boot disk for persistent data and a scratch disk for non-persistent data.\") describes the disks attached to a customer-managed GPU Droplet, not a zero-retention option from DigitalOcean, so it is not a statement on this dimension and is no longer bound."
text_zh = "原先绑在本条的引文（「They also come with two different kinds of storage: a boot disk for persistent data and a scratch disk for non-persistent data.」）说的是客户自管 GPU Droplet 自带的磁盘类型，不是 DO 提供的零保留选项，不构成对本维度的表述，故不再绑在本条。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "do-gpu-droplet-disks"

[[product.retention.point]]
text = "Content retention is controlled by the customer: a GPU Droplet comes with a boot disk for persistent data and a scratch disk for non-persistent data"
text_zh = "内容保留由客户控制:GPU Droplet 自带 boot disk(持久)与 scratch disk(非持久)"

[[product.retention.point]]
text = "At the contract layer DigitalOcean \"does not promise to retain any preservations or backups of your Services Content\" (TOS §4.6), and Personal Data is deleted no later than 30 days following de-activation (DPA §7.6)."
text_zh = "合同层 DO 不承诺保留任何备份或留存(TOS §4.6),账户停用后 30 天内删除 Personal Data(DPA §7.6)。"

[product.processing_region]
codes = ["selected"]
anchor = "do-gpu-availability-by-datacenter"

[[product.processing_region.point]]
text = "GPU Droplets and Bare Metal GPUs are offered by datacenter and the customer selects the datacenter (for example ATL1/AMS3/NYC2/TOR1/RIC1/MEM1)"
text_zh = "GPU Droplets/Bare Metal GPU 按机房提供,客户自选机房(如 ATL1/AMS3/NYC2/TOR1/RIC1/MEM1 等)"

[[product.processing_region.point]]
text = "See the platform regional table for the datacenter list."
text_zh = "机房清单见平台区域表。"

[product.role]
kind = "processor"
anchor = "do-dpa-schedule1-do-is-processor"

[[product.role.point]]
text = "Same as the API tier: when the customer stores end-user data on its GPU Droplet, DigitalOcean is a Processor (DPA Schedule 1)"
text_zh = "同 API 档:客户在其 GPU Droplet 上存 end-user 数据时 DO 为 Processor(DPA Schedule 1)"

[[product.role.point]]
text = "For a customer-self-hosted model, control over the data rests with the customer."
text_zh = "客户自托管模型的数据控制权在客户。"

