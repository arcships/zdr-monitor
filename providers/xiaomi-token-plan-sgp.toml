[product.training]
mark = "yes"
mode = "default"
anchor = "training-no-content-use-zh"

[[product.training.point]]
text = "Overseas-tier privacy terms §3.1 (privacy.mi.com zh text, the only overseas-tier source with a live snapshot on this dimension): the commitment is unconditional - '小米不会将您提供的内容用于模型训练或任何其他目的'."
text_zh = "境外档隐私条款 §3.1（privacy.mi.com 中文版，本维度唯一有快照的境外档来源）：无条件不将您提供的内容用于模型训练或任何其他目的。"

[[product.training.point]]
text = "Mainland version (《Xiaomi MiMo 隐私政策》v20260806, what the mimo.mi.com/docs privacy-policy URL now serves) words the same commitment conditionally and covers text content only: '未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途'. The two wordings are kept side by side and must not be merged into one sentence."
text_zh = "大陆版（《Xiaomi MiMo 隐私政策》v20260806，即 mimo.mi.com/docs 隐私政策 URL 的现行快照）是条件式表述且对象只写「文本内容」：「未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途」。两个来源口径不同，并列保留，不得混成一句。"
anchor = "mainland-pp-training-conditional"

[[product.training.point]]
text = "The Token Plan clause itself (current service agreement §3.13) does not address training or data use - it only covers reading the subscription page's descriptions, non-refundability/non-cancellability and activity-rule changes."
text_zh = "Token Plan 条款本身（现行服务协议 §3.13）对训练不表态，只涉及阅读订阅页说明、不退款/不取消与活动规则调整。"
anchor = "sa-3-13-token-plan"

[[product.training.point]]
text = "Online Search is the only third-party opening on this dimension: your query and IP address are provided to Google."
text_zh = "在线搜索会把查询内容与 IP 地址交给谷歌，是本维度唯一的第三方口子。"
anchor = "query-to-google-zh"

