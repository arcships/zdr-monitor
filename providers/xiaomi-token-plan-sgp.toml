[[source]]
url = "https://mimo.mi.com/docs/en-US/quick-start/terms/user-agreement"
channel = "contract"
tier = "core"
note = "《Xiaomi MiMo Service Agreement》英文版（正文自述 updated on July 7, 2026），覆盖中国大陆以外区域的国际站服务，含 API 与 Token Plan 订阅档：§1.1 明确「This Agreement applies to your use of the services outside the territory of the People's Republic of China (PRC)」且运营主体为 Xiaomi Technologies Singapore Pte. Ltd.；§3.13 明文点名 Token Plan（内容仅为不退款/不取消/小米可调整活动规则，不涉数据用途）；第 4 节 Data Protection Terms 是专门面向中国大陆以外区域的委托处理附录（4.1 定义与角色、4.2 目的与使用、4.3 权利义务、4.4 Data Storage、4.5 Security Measures）。本档最重要的两条：§4.1「Xiaomi acts as a Processor…you are the Data Controller」与 §4.4「When providing services outside the Chinese Mainland, Xiaomi will store the relevant data on servers located in Europe and Singapore」。全文无内容使用授权条款（唯一 train 命中是 §4.5 的人员培训），无零保留/ZDR 表述，无量化保留期。"

[[source]]
url = "https://mimo.mi.com/docs/quick-start/terms/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "《Xiaomi MiMo Privacy Policy》英文国际版（页内载明 Our Privacy Policy was updated on June 25, 2026），由 Xiaomi Technology Netherlands B.V.、Xiaomi Technologies Singapore Pte. Ltd. 及其关联公司提供——即服务协议 §4 所称的「Xiaomi MiMo Privacy Policy」，是 Token Plan sgp 档五维度的核心来源。§3.1「Xiaomi MiMo Services」同时点名 API 服务与 MiMo Code，并给出训练维度的绝对表述；§10 按居住地分区给出数据控制者与存储地：EEA/UK/CH 用户由荷兰实体担任控制者、数据存荷兰数据中心（可传新加坡），**EEA/UK/CH 以外用户（sgp 档的目标人群）由 Xiaomi Technologies Singapore Pte. Ltd. 担任控制者，运营中收集和生成的个人信息存储在新加坡的数据中心，并可能为支持服务而传输到荷兰**；§4 共享清单含「Online Search：we will provide your query and IP address to Google」与充值退款服务商 Waffo Hong Kong Limited；§6 为保留期限条款（未量化）；§8 承认备份系统无法立即删除。全文无 ZDR/零保留字样、无量化保留天数、无 DPA 下载入口。注意：本文件是英文版，与中文版 §10 的详略不同（见本档 privacy.mi.com 中文源的 scope_note）。"

[[source]]
url = "https://privacy.mi.com/XiaomiMiMoPlatformos/zh_CN/"
channel = "consumer_privacy"
tier = "core"
note = "同一份《Xiaomi MiMo 平台隐私条款》的中文版（页内载明 2026 年 6 月 25 日更新）。取 privacy.mi.com 静态官方页而非 mimo.mi.com/docs 的 zh-CN 路径：后者是纯客户端渲染的 SPA，同一 URL 在抓取路径下只回空壳（Title: Xiaomi MiMo Home，Markdown Content 为空，判 render_error），静态页完整可抓（实测 19191B 正文，本档 8 条中文锚点全部逐字命中）。两个 URL 是同一文档（ams 档实测去掉 URL 头后正文 diff=0），source_id 由 URL 派生，故与 xiaomi-token-plan-ams 的同源条目共享同一份快照。§3.1 应用程序接口服务给出训练维度的中文原句「小米不会将您提供的内容用于模型训练或任何其他目的」，并写明「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」；§6 保留期限未量化；§10「您的个人信息如何在全球范围内传输？」只写到「小米通过全球运营和控制基础设施处理并备份个人信息。目前，小米在荷兰和新加坡设有数据中心……我们还可能将您的个人信息传输给第三方服务提供商和业务合作伙伴，因此您的数据也可能被传输到其他国家或地区」，**没有英文版 §10 里「非 EEA 用户由新加坡实体担任控制者、数据存储在新加坡数据中心」那一层分区表述**。中英两版同为现行、更新日期相同，详略不一致属同一文档的两个语言版本差异，本轮并列记录，处理地结论以信息更完整的英文版为主证据、中文版为并列证据。"

