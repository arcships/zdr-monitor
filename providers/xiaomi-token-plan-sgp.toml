anchor = "backup-delay-zh"

[[product.zdr.point]]
text = "No zero-retention option - neither default nor on request - appears in any document listed in searched[]; mark=no is the conservative assumption (no commitment found), not a vendor refusal."
text_zh = "searched[] 范围内的公开文件均无零保留承诺或申请方式；zdr=no 是保守假设（未见承诺），不是厂商明确拒绝——备份删除延迟不是「厂商拒绝 ZDR」的依据。"

[[product.zdr.point]]
text = "What can be negotiated is the data storage region (service agreement §1.1: 'If you wish to select data storage regions ... you may contact us via the Platform'), which is about where the data is stored, not request-level zero retention. The clause is now in the overseas-tier contract snapshot and is still not a ZDR mechanism."
text_zh = "可商谈的是「数据存储区域」（服务协议 §1.1：可通过平台联系选择存储区域），管的是数据存在哪，不是请求级零保留；该条款现行快照属境外档合同，但仍不构成 ZDR 机制。"
anchor = "sa-1-1-storage-region-select"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "retention-purpose-zh"

[[product.retention.point]]
text = "Overseas-tier privacy terms §6: object = inputs/outputs, context = default, period type = as long as needed for the purposes described (not quantified); retention stops and data is deleted or anonymised once the purpose is fulfilled, a deletion request is confirmed, or the service is terminated."
text_zh = "境外档隐私条款 §6：对象=输入输出正文，语境=默认，期限类型=目的所需（未量化）；目的达成、确认删除请求或终止服务后停止保留并删除或匿名化。"
anchor = "retention-purpose-zh"

[[product.retention.point]]
text = "Deletion from the backup system may be delayed (§8)."
text_zh = "备份系统删除有延迟（§8）。"
anchor = "backup-delay-zh"

[[product.retention.point]]
text = "Contract layer (§4.4): upon service expiry, completion of the agreed purpose or your request, Xiaomi ceases processing or permanently deletes the personal information within a reasonable period - a deletion commitment, but the period itself is still unquantified."
text_zh = "合同层 §4.4：服务到期、目的达成或你提出要求时，小米停止处理或在合理期限内永久删除个人信息——有删除承诺，但期限仍未量化。"
anchor = "sa-4-4-deletion"

[[product.retention.point]]
text = "The Token Plan subscription page and the Token Plan FAQ carry no retention clause."
text_zh = "本档订阅说明与 FAQ 均无保留条款。"

[product.processing_region]
codes = ["SG", "NL"]
anchor = "region-datacenters-nl-sg-zh"

[[product.processing_region.point]]
text = "Overseas-tier privacy terms §10: Xiaomi states it has data centres in the Netherlands and Singapore; your information may be transferred to these data centres, and may also be transferred to other countries or regions through third-party service providers and business partners."
text_zh = "境外档隐私条款 §10：小米自述在荷兰和新加坡设有数据中心，个人信息可能传输到这些数据中心，还可能经第三方服务提供商和业务合作伙伴传输到其他国家或地区。"
anchor = "region-datacenters-nl-sg-zh"

[[product.processing_region.point]]
text = "Contract layer (§4.4): for services provided outside the Chinese Mainland, Xiaomi stores the relevant data on servers located in Europe and Singapore - the tier's own contract confirms the Europe/Singapore location independently of the privacy terms."
text_zh = "合同层 §4.4：在中国大陆境外提供服务时，小米将相关数据存储在位于欧洲和新加坡的服务器上——本档合同独立于隐私条款确认了欧/新两地。"
anchor = "sa-4-4-storage-europe-singapore"

[[product.processing_region.point]]
text = "The mainland privacy policy (v20260806) points the same way: in-PRC use means data stored in the PRC, and services used outside the PRC are governed by a separate privacy policy."
text_zh = "大陆版隐私政策（v20260806）同向：境内使用 → 信息保存至中华人民共和国境内，境外使用另适用一份隐私政策条款。"
anchor = "mainland-pp-stored-in-prc"

[[product.processing_region.point]]
text = "The former per-residence split (which entity is controller, which data centre) has no text left in any live snapshot, so codes=[SG, NL] rest on the data-centre disclosure above, not on a storage commitment by place of residence."
text_zh = "原先按居住地分区（谁担任控制者、数据存哪个数据中心）那一层在所有现行快照里都已无原文，故 codes=[SG, NL] 只依据上面「数据中心所在地」的披露，不构成按居住地的存储承诺。"

[[product.processing_region.point]]
text = "The cluster endpoint token-plan-sgp.xiaomimimo.com is a Singapore cluster; an endpoint is not a processing-location commitment."
text_zh = "本档端点为 token-plan-sgp.xiaomimimo.com（新加坡集群），端点不等于处理地承诺。"

[product.role]
kind = "processor"
anchor = "role-entrusted-zh"

[[product.role.point]]
text = "Overseas-tier privacy terms §3.1: '您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务' - the entrusted processing covers the information you upload."
text_zh = "境外档隐私条款 §3.1：您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务——受托处理针对的是用户上传的信息。"
anchor = "role-entrusted-zh"

[[product.role.point]]
text = "Same source §10: for EEA/UK/CH users Xiaomi Technology Netherlands B.V. acts as the data controller, so the controller wording for the platform's own operations is kept side by side with the entrusted-processing wording."
text_zh = "同来源 §10：对 EEA/UK/CH 用户由 Xiaomi Technology Netherlands B.V. 担任数据控制者；平台自身运营活动的控制者表述与受托处理表述并列保留。"
anchor = "eea-controller-nl-zh"

[[product.role.point]]
text = "Contract layer: the registered service-agreement URL now serves the overseas version, whose §1.1 says it applies to services outside the PRC and points to separate in-PRC terms published on the Open Platform; the same clause also lets you ask to select a data storage region."
text_zh = "合同层：登记的服务协议 URL 现行快照是境外版，§1.1 自认适用于中国大陆境外服务、境内服务另适用开放平台上的境内条款；同节还允许你联系厂商选择数据存储区域。"
anchor = "sa-1-1-scope-outside-prc"

[[product.role.point]]
text = "The appendix now reads 'Xiaomi acts as a Processor in data processing activities, and you are the Data Controller.' - same direction (Xiaomi as processor), wording differs from the previous mainland snapshot."
text_zh = "该附录现行措辞为「Xiaomi acts as a Processor in data processing activities, and you are the Data Controller.」——方向仍是小米受托，措辞与上一版大陆快照不同。"
anchor = "sa-4-1-processor"

[[product.role.point]]
text = "The same appendix states its own scope: 'These Data Protection Terms apply to regions outside the Chinese Mainland.' - i.e. it is overseas-tier evidence, and must not be read as covering in-PRC services."
text_zh = "同一附录自认范围：「These Data Protection Terms apply to regions outside the Chinese Mainland.」——即属境外档证据，不得读作覆盖境内服务。"
anchor = "sa-dpa-scope-outside-mainland"

[[product.role.point]]
text = "The current snapshot's governing law is Singapore law (§8.1) with SIAC arbitration, matching the overseas entity; the PRC-law clause from the previous mainland snapshot is not in this text and must not be carried over."
text_zh = "现行快照 §8.1 适用新加坡法并约定 SIAC 仲裁，与境外主体一致；上一版大陆快照中的中国法条款不在本正文内，不得沿用。"
anchor = "sa-8-1-law-singapore"

[[product.role.point]]
text = "The entity statement of the overseas privacy terms (§1: Xiaomi Technology Netherlands B.V. / Xiaomi Technologies Singapore Pte. Ltd.) is the live entity evidence for this tier."
text_zh = "境外档主体表述（境外隐私条款 §1：Xiaomi Technology Netherlands B.V. / Xiaomi Technologies Singapore Pte. Ltd.）是本档现行主体证据。"
anchor = "intl-entities-scope-zh"

