[[source]]
url = "https://mimo.mi.com/docs/en-US/quick-start/terms/user-agreement"
fetch = "browser"
channel = "contract"
tier = "core"
note = "**登记的这个 URL 现行快照是《Xiaomi MiMo Service Agreement》的境外/国际版英文正文**（updated July 7, 2026；主体表述为 Xiaomi Technology Netherlands B.V.、Xiaomi Technologies Singapore Pte. Ltd. 及其关联公司，§1.1 写明由 Xiaomi Technologies Singapore Pte. Ltd. 运营）。境外版自认范围：§1.1「This Agreement applies to your use of the services outside the territory of the People's Republic of China (PRC)」，境内服务另适用开放平台上的境内条款；同节允许你选择数据存储区域（select data storage regions … you may contact us via the Platform），但须合规且可能另收费。§4 数据处理条款自认「These Data Protection Terms apply to regions outside the Chinese Mainland.」；§4.1「Xiaomi acts as a Processor in data processing activities, and you are the Data Controller.」；§4.2 处理的个人信息类别为 registration information、usage information 等；§4.4 服务到期/目的达成/你提出要求时「Xiaomi will cease processing or permanently delete the personal information within a reasonable period」，且「When providing services outside the Chinese Mainland, Xiaomi will store the relevant data on servers located in Europe and Singapore.」；§3.13 为 Token Plan 条款（仅订阅页说明、不退款/不取消、活动规则调整，不涉数据用途与保留）；§8.1 适用新加坡法并约定 SIAC 仲裁。上一版快照曾是该协议的大陆版英译（§1.1 限境内、§4 附录限中国大陆、§3.16 Token Plan、§8.1 中国法），本轮快照回到境外版，正文措辞也与旧版不同。**境外版是本档（境外 sgp）自己的合同，故本档合同层锚点重建在这一份上**；大陆版条款已不在本快照内，不得再引用，也不必据此改写结论。这是来源页在两个地区版本之间切换，不是厂商撤销承诺。"

[[source]]
url = "https://mimo.mi.com/docs/quick-start/terms/privacy-policy"
fetch = "browser"
channel = "consumer_privacy"
tier = "core"
note = "**登记的这个 URL 现行快照已不是英文国际版，而是《Xiaomi MiMo 隐私政策》中文大陆版**（版本号 v20260806，引言自述由北京小米移动软件有限公司及其关联公司提供）。大陆版口径：§一（一）2 API 服务为条件式训练表述「未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途」（对象只写「文本内容」）；§三（三）保留政策「本协议适用于您在中华人民共和国境内使用Xiaomi MiMo服务，为此您的信息将会保存至中华人民共和国境内。如果您在中华人民共和国境外使用服务，则您知悉并同意双方将适用发布在Xiaomi MiMo开放平台上适用于中华人民共和国境外服务的相关隐私政策条款。」；§四（二）备份删除延迟。旧英文国际版的 §3.1 无条件不训练、§10 按居住地分区（非 EEA 用户由新加坡实体担任控制者、数据存新加坡）已不在快照内。本档的境外档证据改以 privacy.mi.com 中文来源为主；挂在这里的锚点只记录大陆版原文与「境外服务另适用一份隐私政策条款」的指引，不作境外档主证据。"

[[source]]
url = "https://privacy.mi.com/XiaomiMiMoPlatformos/zh_CN/"
channel = "consumer_privacy"
tier = "core"
note = "同一份《Xiaomi MiMo 平台隐私条款》的中文版（页内载明 2026 年 6 月 25 日更新），主体为 Xiaomi Technology Netherlands B.V.、Xiaomi Technologies Singapore Pte. Ltd. 和/或其关联公司，即本档（境外 sgp）的官方中文文本。取 privacy.mi.com 静态官方页而非 mimo.mi.com/docs 的 zh-CN 路径：后者是纯客户端渲染的 SPA，同一 URL 在抓取路径下只回空壳（Title: Xiaomi MiMo Home，Markdown Content 为空，判 render_error），静态页完整可抓（实测 19191B 正文，本档中文锚点全部逐字命中）。两个 URL 是同一文档（ams 档实测去掉 URL 头后正文 diff=0），source_id 由 URL 派生，故与 xiaomi-token-plan-ams 的同源条目共享同一份快照。**本档五个维度的主锚点都绑在这一份上**：§3.1 训练维度无条件原句「小米不会将您提供的内容用于模型训练或任何其他目的」，并写明「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」；§4 在线搜索向谷歌提供查询内容和 IP 地址；§6 保留期限未量化；§8 备份删除延迟；§10 荷兰/新加坡数据中心、可能传输到其他国家或地区，以及对 EEA/UK/CH 用户的控制者安排。**本来源是境外档隐私政策层面的唯一可用证据**：mimo.mi.com/docs 隐私政策 URL 的现行快照仍是大陆版正文，境外档英文版隐私政策目前没有可用快照，故本档隐私政策层面的结论只以本来源为准；服务协议 URL 的现行快照已是境外版（见本档第一条 source 的 note），但那属合同层，不替代本隐私条款。"

