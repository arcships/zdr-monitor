[[product.zdr.point]]
text = "No zero-retention option - neither default nor on request - appears in any document listed in searched[]; mark=no is the conservative assumption (no commitment found), not a vendor refusal."
text_zh = "searched[] 范围内的公开文件均无零保留承诺或申请方式；zdr=no 是保守假设（未见承诺），不是厂商明确拒绝——备份删除延迟不是「厂商拒绝 ZDR」的依据。"

[[product.zdr.point]]
text = "What can be negotiated is the data storage region (service agreement §1.1), which is not request-level zero retention; that clause is currently only retrievable in the mainland version and is not overseas-tier evidence."
text_zh = "可商谈的是「数据存储区域」（服务协议 §1.1），不是零保留；该条款现行快照只在大陆版里可查，不作境外档证据。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "retention-purpose-zh"

[[product.retention.point]]
text = "Overseas-tier privacy terms §6: object = inputs/outputs, context = default, period type = as long as needed for the purposes described (not quantified); retention stops and data is deleted or anonymised once the purpose is fulfilled, a deletion request is confirmed, or the service is terminated."
text_zh = "境外档隐私条款 §6：对象=输入输出正文，语境=默认，期限类型=目的所需（未量化）；目的达成、确认删除请求或终止服务后停止保留并删除或匿名化。"
anchor = "retention-purpose-zh"

[[product.retention.point]]
text = "Deletion from the backup system may be delayed (§8)."
text_zh = "备份系统删除有延迟（§8）。"
anchor = "backup-delay-zh"

[[product.retention.point]]
text = "The current contract snapshot is the mainland version: its §4.4 deletion clause and retention policy are mainland-scope and must not be used as overseas-tier evidence."
text_zh = "现行合同快照为中国大陆版：其 §4.4 删除条款与保留政策只覆盖中国大陆，不得当境外档主证据。"
anchor = "mainland-sa-4-4-deletion"

[[product.retention.point]]
text = "The Token Plan subscription page and the Token Plan FAQ carry no retention clause."
text_zh = "本档订阅说明与 FAQ 均无保留条款。"

[product.processing_region]
codes = ["SG", "NL"]
anchor = "region-datacenters-nl-sg-zh"

[[product.processing_region.point]]
text = "Overseas-tier privacy terms §10: Xiaomi states it has data centres in the Netherlands and Singapore; your information may be transferred to these data centres, and may also be transferred to other countries or regions through third-party service providers and business partners."
text_zh = "境外档隐私条款 §10：小米自述在荷兰和新加坡设有数据中心，个人信息可能传输到这些数据中心，还可能经第三方服务提供商和业务合作伙伴传输到其他国家或地区。"
anchor = "region-datacenters-nl-sg-zh"

[[product.processing_region.point]]
text = "The reverse fact is kept side by side: the current contract snapshot (mainland version §4.4) says data for services within the Chinese mainland is stored on servers inside the mainland and not transferred abroad - that reflects a version change of the registered URL, not a tightening of the vendor's overseas commitments."
text_zh = "须并列保留反向事实：现行合同快照（大陆版 §4.4）写「在中国大陆提供服务时存储于中国大陆境内服务器、不向境外传输」——这是登记 URL 换了版本，不是厂商收紧了境外档承诺。"
anchor = "mainland-sa-4-4-storage-mainland"

[[product.processing_region.point]]
text = "The mainland privacy policy (v20260806) points the same way: in-PRC use means data stored in the PRC, and services used outside the PRC are governed by a separate privacy policy."
text_zh = "大陆版隐私政策（v20260806）同向：境内使用 → 信息保存至中华人民共和国境内，境外使用另适用一份隐私政策条款。"
anchor = "mainland-pp-stored-in-prc"

[[product.processing_region.point]]
text = "The former per-residence split (which entity is controller, which data centre) has no text left in any live snapshot, so codes=[SG, NL] rest on the data-centre disclosure above, not on a storage commitment by place of residence."
text_zh = "原先按居住地分区（谁担任控制者、数据存哪个数据中心）那一层在所有现行快照里都已无原文，故 codes=[SG, NL] 只依据上面「数据中心所在地」的披露，不构成按居住地的存储承诺。"

[[product.processing_region.point]]
text = "The cluster endpoint token-plan-sgp.xiaomimimo.com is a Singapore cluster; an endpoint is not a processing-location commitment."
text_zh = "本档端点为 token-plan-sgp.xiaomimimo.com（新加坡集群），端点不等于处理地承诺。"

[product.role]
kind = "processor"
anchor = "role-entrusted-zh"

[[product.role.point]]
text = "Overseas-tier privacy terms §3.1: '您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务' - the entrusted processing covers the information you upload."
text_zh = "境外档隐私条款 §3.1：您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务——受托处理针对的是用户上传的信息。"
anchor = "role-entrusted-zh"

[[product.role.point]]
text = "Same source §10: for EEA/UK/CH users Xiaomi Technology Netherlands B.V. acts as the data controller, so the controller wording for the platform's own operations is kept side by side with the entrusted-processing wording."
text_zh = "同来源 §10：对 EEA/UK/CH 用户由 Xiaomi Technology Netherlands B.V. 担任数据控制者；平台自身运营活动的控制者表述与受托处理表述并列保留。"
anchor = "eea-controller-nl-zh"

[[product.role.point]]
text = "Contract layer: the registered service-agreement URL now serves the mainland version, whose §1.1 says it applies only within the PRC and points to separate terms for services outside it."
text_zh = "合同层：登记的服务协议 URL 现行快照是大陆版，§1.1 自认只管中国大陆境内、境外服务另适用一份条款页。"
anchor = "mainland-sa-scope-prc"

[[product.role.point]]
text = "That mainland appendix now reads 'you shall act as the Personal Information Controller, and Xiaomi shall act as the Personal Information Processor' - same direction, different wording."
text_zh = "该大陆版附录现行措辞为「you shall act as the Personal Information Controller, and Xiaomi shall act as the Personal Information Processor」——方向仍是小米受托，措辞与旧版不同。"
anchor = "mainland-sa-4-1-processor"

[[product.role.point]]
text = "The same appendix states its own scope: 'The scope of the Data Protection Provisions is limited to the Chinese mainland.' It must no longer be used as overseas-tier evidence."
text_zh = "同一附录自认范围：「The scope of the Data Protection Provisions is limited to the Chinese mainland.」不得再当作境外档证据。"
anchor = "mainland-sa-dpa-scope-limited"

[[product.role.point]]
text = "The current snapshot's governing law is PRC law (§8.1), further confirming the mainland version; the former Singapore-law clause is gone from every live snapshot and must not be replaced by an inference."
text_zh = "现行快照 §8.1 适用中国法，进一步说明这是大陆版；原新加坡法条款在所有现行快照里都已不存在，不得据此推出境外档适用中国法。"
anchor = "mainland-sa-8-1-law-prc"

[[product.role.point]]
text = "The entity statement of the overseas privacy terms (§1: Xiaomi Technology Netherlands B.V. / Xiaomi Technologies Singapore Pte. Ltd.) is the live entity evidence for this tier."
text_zh = "境外档主体表述（境外隐私条款 §1：Xiaomi Technology Netherlands B.V. / Xiaomi Technologies Singapore Pte. Ltd.）是本档现行主体证据。"
anchor = "intl-entities-scope-zh"

