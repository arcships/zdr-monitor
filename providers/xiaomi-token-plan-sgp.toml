[[source]]
url = "https://mimo.mi.com/docs/en-US/quick-start/terms/user-agreement"
fetch = "browser"
channel = "contract"
tier = "core"
note = "**登记的这个 URL 现行快照已不是国际版服务协议，而是大陆版《Xiaomi MiMo Service Agreement》的英译正文**（生效日期 2026 年 7 月 7 日，运营主体 Beijing Xiaomi Mobile Software Co., Ltd.）。大陆版自认范围：§1.1「This Agreement applies to your use of Xiaomi MiMo services within the territory of the People's Republic of China. If you use our services outside the People's Republic of China…shall govern.」；§4 委托处理附录「The scope of the Data Protection Provisions is limited to the Chinese mainland.」；§4.1「you shall act as the Personal Information Controller, and Xiaomi shall act as the Personal Information Processor」；§4.4「When providing services within the Chinese mainland, Xiaomi shall store the relevant data on servers located within the Chinese mainland and shall not transfer such information outside of this jurisdiction.」；§8.1 适用中国法。旧版（国际版）的 §1.1 outside PRC、§4.1 Processor/Data Controller、§4.4 Europe and Singapore、§8.1 Singapore law 均已不在快照内——这是来源页换了版本，不是厂商撤销承诺。因此本档（境外 sgp）的合同类来源目前为空：挂在它上面的锚点只用于记录「现行快照为中国大陆版」这一事实与档位边界，一律不作境外档证据；待境外版服务协议的现行官方 URL 抓到快照后再重建合同锚点。§3.16 是现行 Token Plan 条款（内容仅限不退款/不取消/活动规则调整，不涉数据用途与保留）。"

[[source]]
url = "https://mimo.mi.com/docs/quick-start/terms/privacy-policy"
fetch = "browser"
channel = "consumer_privacy"
tier = "core"
note = "**登记的这个 URL 现行快照已不是英文国际版，而是《Xiaomi MiMo 隐私政策》中文大陆版**（版本号 v20260806，引言自述由北京小米移动软件有限公司及其关联公司提供）。大陆版口径：§一（一）2 API 服务为条件式训练表述「未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途」（对象只写「文本内容」）；§三（三）保留政策「本协议适用于您在中华人民共和国境内使用Xiaomi MiMo服务，为此您的信息将会保存至中华人民共和国境内。如果您在中华人民共和国境外使用服务，则您知悉并同意双方将适用发布在Xiaomi MiMo开放平台上适用于中华人民共和国境外服务的相关隐私政策条款。」；§四（二）备份删除延迟。旧英文国际版的 §3.1 无条件不训练、§10 按居住地分区（非 EEA 用户由新加坡实体担任控制者、数据存新加坡）已不在快照内。本档的境外档证据改以 privacy.mi.com 中文来源为主；挂在这里的锚点只记录大陆版原文与「境外服务另适用一份隐私政策条款」的指引，不作境外档主证据。"

[[source]]
url = "https://privacy.mi.com/XiaomiMiMoPlatformos/zh_CN/"
channel = "consumer_privacy"
tier = "core"
note = "同一份《Xiaomi MiMo 平台隐私条款》的中文版（页内载明 2026 年 6 月 25 日更新），主体为 Xiaomi Technology Netherlands B.V.、Xiaomi Technologies Singapore Pte. Ltd. 和/或其关联公司，即本档（境外 sgp）的官方中文文本。取 privacy.mi.com 静态官方页而非 mimo.mi.com/docs 的 zh-CN 路径：后者是纯客户端渲染的 SPA，同一 URL 在抓取路径下只回空壳（Title: Xiaomi MiMo Home，Markdown Content 为空，判 render_error），静态页完整可抓（实测 19191B 正文，本档中文锚点全部逐字命中）。两个 URL 是同一文档（ams 档实测去掉 URL 头后正文 diff=0），source_id 由 URL 派生，故与 xiaomi-token-plan-ams 的同源条目共享同一份快照。**本档五个维度的主锚点都绑在这一份上**：§3.1 训练维度无条件原句「小米不会将您提供的内容用于模型训练或任何其他目的」，并写明「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」；§4 在线搜索向谷歌提供查询内容和 IP 地址；§6 保留期限未量化；§8 备份删除延迟；§10 荷兰/新加坡数据中心、可能传输到其他国家或地区，以及对 EEA/UK/CH 用户的控制者安排。**原「英文国际版为主证据、中文版为并列」的口径已作废**：mimo.mi.com/docs 两个 URL 的现行快照都变成了大陆版正文，境外档英文版目前没有可用快照，本档结论只以本来源为准。"

