[[product.processing_region.point]]
text_zh = "US DPA §11「Customer will select the location where Content Data will be stored.」并明确「Content Data may be transferred and accessed from around the world, including to and from the location in which Content Data is maintained」——即 US 档有全球访问/传输条款，且客户选择的是数据中心位置而非排他性处理地。可用区域见 us.ovhcloud.com/public-cloud/regions-availability/（Canada/USA 区块 AI Deploy / AI Training / AI Notebooks 有 ✓）。"

[product.role]
