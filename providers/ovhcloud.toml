[[product.retention.point]]
text_zh = "本档保留期在合同层逐条量化（与 AI Endpoints「不含存储」正相反，本档服务本身包含客户可见的存储）：①临时本地存储——附录 7 §2.4.2 的删除句「As soon as the Tool is “completed”, “stopped” or “deleted” by the Client (as applicable) or in the event of a malfunction, the contents of the temporary storage space will be deleted.」**待复核，本维度不据此下判断**：当前快照（26bda2a9662b5416.md:1425-1426）在「…the contents」处断行，缺「of the temporary storage space will be deleted.」，锚点 sc-a7-temporary-local-storage-deleted 已按快照现有文本收窄（引文止于「…in the event of a malfunction, the contents」），故不再是 missing，但它只能证明该段落在「…the contents」处断行，删除句本身仍待重抓恢复后复核。这是抓取丢行（同段 §2.4.3 也丢了字，见该来源 note），不是厂商改条款，不得据此写成「未披露」，也不改绑到措辞不同、法律实体不同的 US SST §9.3.2；该句随重抓恢复前只作待复核记录。该段当前可机器复核的只有「The local and temporary storage space is not synchronised or backed up by OVHcloud.」——临时本地存储不受 OVHcloud 的同步或备份"
anchor = "sc-a7-temporary-local-storage-not-backed-up"

[[product.retention.point]]
text_zh = "②AI Notebooks Workspace——§2.4.3「It is permanently deleted thirty (30) days after the Client deletes a Notebook, unless the Client decides otherwise.」（Workspace 备份到 Object Storage 容器，Notebook 停止时由 OVHcloud 备份）。同段紧接着还有一句「Content of the Workspace is deleted on the Notebook deletion date.」——两句并列保留、不选边：30 天句给的是 Workspace 被 permanently deleted 的期限，第二句给的是内容删除的触发点＝Notebook 删除当日；原文没有说明两句如何衔接（可能分别针对 Workspace 备份与 Workspace 内容），按厂商自己说法冲突的处理口径两条事实都记。本档 days=30 只取前句，不替厂商解释两句的关系。"
anchor = "sc-a7-workspace-content-deleted-on-notebook-date"

[[product.retention.point]]
text_zh = "③服务结束——§2.5「OVHcloud will delete the Resources used.」，客户自建的 Object Storage 容器/Private Registry 等附带资源由客户自行删除，不删按官网价收运营费"

[[product.retention.point]]
text_zh = "④执行时长上限——§3 Job/Notebook 执行最长 7 个连续日，超期自动取消"

[[product.retention.point]]
text_zh = "⑤平台通用层——SC 通用条款「OVHcloud does not carry out any specific backups of the Content stored on the Resources.」、EU DPA §10.1 服务到期后删除全部 Content。本档不存在请求级（0 天 / 30 天）保留承诺，因为推理不在 OVHcloud 侧运行，数据在客户自管实例与容器内。"

[product.processing_region]
codes = ["EU"]
anchor = "sc-a7-location-selected-by-client"

[[product.processing_region.point]]
text_zh = "AI Tools 档的处理地由客户在创建时选择：附录 7 §2.3「The location of the Service Resources is selected by the Client at the time of their creation from among the available Datacenters.」"

[[product.processing_region.point]]
text_zh = "EU DPA §6.1 同旨（允许客户存储 Content 的服务，可用 Datacenter 位置在官网/控制台标明，OVHcloud 未经客户事先同意不得变更），§6.2 允许关联方为安全与运维目的远程处理。即本档没有「固定在某地」的承诺，处理地＝客户所选区域"

[[product.processing_region.point]]
text_zh = "OVHcloud 及关联方的远程运维是例外路径。对照：AI Endpoints 档无区域选择、固定 Gravelines。"

[product.role]
kind = "processor"
anchor = "eudpa-1-1-processor-under-instruction"

[[product.role.point]]
text_zh = "与 API 档同源：EU/IE DPA 的 Processor 定性 + GTS 实体 OVH Hosting Limited + Annex Sub-processors。AI Tools 附录 7 本身同样不写角色条款（不同于附录 4/8 的逐字 sub-processor 表述），故 role 依据仍是通用 DPA。本档的差别在介入面：客户数据（训练数据、Notebook 内容、容器镜像）位于客户自管实例，OVHcloud 主要做资源编排与运维——附录 7 §2.2 逐字「The Resources are dedicated to the Client. They are hosted, managed and maintained in operational condition by OVHcloud for the entire duration of the use of the Service.」边界说明（与 API 档同源）：DPA 目的条款之后逐字接「excluding the personal data processing activities performed by OVHcloud as a controller. The conditions into which OVHcloud processes, as a Controller, Personal Data relating to the Client (including the Client's agents), are defined in the OVHcloud Data Usage Policy.」——role=processor 只覆盖「作为服务一部分」的客户内容处理，OVHcloud 以 controller 身份处理客户（含其代理人）个人数据的条件由 OVHcloud Data Usage Policy 管辖；该政策尚未纳入本文件 [[source]]，机器不可复核，只作发现线索。"

