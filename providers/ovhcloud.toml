[product.training]
mark = "yes"
anchor = "sc-a10-no-knowledge-no-reuse-no-backup"
mode = "default"

[[product.training.point]]
text_zh = "API 档结论：不用于训练——但合同层与营销层的措辞强度不同，必须并列。①合同层（最高优先级文件，附录 10 §5）逐字：「OVHcloud has no knowledge of Inputs and Outputs, and OVHcloud does not reuse them in any way. OVHcloud does not carry out any backups of Inputs or Outputs.」条款说的是「no knowledge / does not reuse」，不是逐字「不训练」。②逐字「不训练」只在官方产品页（official_blog 层）：「Your data will never be used to train or improve our AI models; one of our many security guarantees.」③文档层：getting-started「we do not store user data」、capabilities「Data is not stored or shared during or after model use」。三点限定：(a) Batch API 是 §5 明文例外（「This does not apply for the AI Endpoint Batch API Service.」），条款未说明该临时存储能否被用于训练或改进模型"

[[product.training.point]]
text_zh = "(b) 附录 10 §2 把模型定性为第三方产品并指向第三方条款 URL（endpoints.ai.cloud.ovh.net/licences），该 URL 现 302 到产品目录页、第三方条款不可公开复核，故上游模型提供方对 Inputs/Outputs 的使用约定在公开渠道无答案——这是本维度最大不确定性"

[[product.training.point]]
text_zh = "(c) Billing 文档的「We continuously monitor the usage of each model on our platform」是聚合用量监控（下线决策用），不含请求内容，不构成训练用途。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "sc-a10-no-backup-or-storage"

[[product.zdr.point]]
text_zh = "API 档结论：默认即零保留，无需申请或开通，但两个口径必须写清。①合同层：附录 10 §2「does not include backup or storage, even if it is temporary」+ §5「no knowledge…does not reuse…does not carry out any backups」，零保留是本产品的结构性属性（服务不含存储），不是可选开关、也不需要补充协议——与需要单独申请 ZDR 计划的厂商在制度上不同。②例外：Batch API 明文不在零保留范围内（§2 括注、§5 末句「This does not apply for the AI Endpoint Batch API Service.」），其输出/错误文件在平台保留 15 天。③旁证：产品页「Zero data retention: We keep only the data required for billing purposes.」（全库唯一逐字出现 Zero data retention 之处，属营销层）"

[[product.zdr.point]]
text_zh = "docs capabilities/getting-started 同旨"

[[product.zdr.point]]
text_zh = "Responses API 页说明平台未实现服务端状态管理、建议始终 store:false（实现层说明，不构成保留承诺）。④未复核项：附录 10 §2 引用的第三方模型条款已不可公开获取，故「上游模型提供方是否另有保留」无公开答案"

[[product.zdr.point]]
text_zh = "docs 提到的 Files API retention policy 也没有公开页面。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "sc-a10-no-backup-or-storage"

[[product.retention.point]]
text_zh = "按对象分开读，条款层不给天数：①输入输出正文（同步推理）——附录 10 §2「The AI Endpoints Service does not include backup or storage, even if it is temporary」+ §5「does not carry out any backups of Inputs or Outputs」，即合同上服务不含任何（哪怕临时的）存储与备份，故不存在可量化保留期；结构化字段据此记 basis=none（输入输出不留存），不写天数——本档唯一被量化的期限（15 天）属于下条的 Batch 例外，不能读成「输入输出保留 15 天」"

[[product.retention.point]]
text_zh = "条款也没有逐字「处理后立即删除」，文档层用「Data is not stored or shared during or after model use」补足。②Batch API——唯一明文例外（§2 括注「temporarily stores incoming and outgoing data for the Service」，§5 末句「This does not apply for the AI Endpoint Batch API Service.」），量化期限只在文档层：输出与错误文件「automatically deleted after 15 days」，同页另称受「Files API retention policy」约束，而该政策在文档站无公开页面（llms.txt 索引核过），故该 15 天之外的期限不可复核。**适用范围**：15 天只覆盖 Batch 的输出与错误文件这一项（上限，起算点为 batch 完成），既不是本档请求内容的保留期，也不覆盖 Batch 的入参文件"
anchor = "batch-output-error-files-15-days"

[[product.retention.point]]
text_zh = "入参文件的期限未披露。③计费数据——产品页「Zero data retention: We keep only the data required for billing purposes.」，条款与文档都没有对象清单与期限。④平台级——SC 通用条款「OVHcloud does not carry out any specific backups of the Content stored on the Resources.」"

[[product.retention.point]]
text_zh = "EU DPA §10.1 服务到期后按合同删除全部 Content。⑤本家是欧盟实体+GDPR，「网络日志不少于六个月」这类国内站下限条款不适用，公开文件无对应表述"

[[product.retention.point]]
text_zh = "OVHcloud 作为 controller 的量化保留期（如会计凭证 10 年）针对账号/账单数据，不是请求内容；这部分由 OVHcloud Data Usage Policy 管辖（见 role 维度的边界说明），该政策尚未纳入本文件 [[source]]，机器不可复核。本维度结构化字段只描述请求内容：同步推理＝不含存储（basis=none），Batch 输出/错误文件的 15 天上限见前条 point。"

[product.processing_region]
codes = ["FR"]
anchor = "caps-gravelines-france-infrastructure"

[[product.processing_region.point]]
text_zh = "API 档结论：文档与营销层一致指向法国 Gravelines，但条款层没有 AI Endpoints 专用地点条款，故 confidence=medium。①文档层（主权威）：capabilities「Our infrastructure, located in Gravelines, France, adheres to European data protection regulations.」"

[[product.processing_region.point]]
text_zh = "产品页「Hosted by OVHcloud, a leading European provider of sovereign cloud services since 1999.」"

[[product.processing_region.point]]
text_zh = "官方新闻稿（2025-04-29）「It is available now in APAC, Canada and Europe and deployed from the Gravelines datacenter.」——商业可用范围（APAC/加拿大/欧洲）与部署地（法国）是两件事。②条款层：附录 10 全文无地点条款"

[[product.processing_region.point]]
text_zh = "AI Endpoints 是 serverless，文档示例只有单一全局端点 oai.endpoints.kepler.ai.cloud.ovh.net，客户无法选择处理地（与 AI Tools 档「地点由客户创建时选择」正相反）。EU DPA §6.1 的「客户选择 Datacenter」以「Service allows the Client to store Content」为前提，§6.2 反而允许 OVHcloud 及其子处理者为安全与运维目的远程处理 Content，§6.3/6.4 规定非充分性国家数据中心与关联方传输的适用条件。③子处理者清单（IE 版）中 OVH Hebergement Inc.（Canada）对「All Services, regardless of their location, except SecNumCloud and Trusted Cloud」承担处理——AI Endpoints 既非 SecNumCloud 也非 Trusted Cloud，故加拿大关联方在清单范围内可远程介入"

[[product.processing_region.point]]
text_zh = "平台页 data sovereignty 称只有 EU 实体或充分性认定国家（特别是加拿大）实体可介入欧洲客户服务，两处方向一致，但都不构成对请求内容处理地的量化承诺。④EU 站区域可用性表在 FRANCE 区块给 AI Endpoints 一个 ✓，Canada/USA 区块无 ✓（markdown 表格列被压平，列位不作强断言）。"

[product.role]
kind = "processor"
anchor = "eudpa-processor-purpose"

[[product.role.point]]
text_zh = "API 档结论：OVHcloud 在协议上自认 processor（受托处理方）——但依据来自通用 DPA 与 GTS，不来自 AI Endpoints 自己的产品条款。附录 10 内没有任何 data processing / 角色条款，这一点可与同一份 SC 的其他附录对照：附录 4（DBaaS）与附录 8（Managed Rancher）逐字写「OVHcloud carries out processing of personal data as a sub-processor on the instructions of the Client」，附录 6（Quantum）反而写「In order to provide the Service, OVHcloud does not process personal data as a processor or access the Client Content」，附录 10 两者皆无，只有 §5「The Client is responsible for Inputs and Outputs.」与「OVHcloud has no knowledge of Inputs and Outputs」。依据链：①EU/IE 版 DPA（Version dated on 17.10.2025）抬头「entered into between OVH Hosting Ltd. … and the Client」，目的条款「OVHcloud is entitled, as a Processor and as part of the Services defined in the Agreement, to carry out the processing of Personal Data on behalf of, and on instructions from the Client」，§1.1「as a Processor acting under Client's instruction」。边界说明（DPA 目的条款紧接的 carve-out，已并入 eudpa-processor-purpose 的 suffix 一并覆盖）：目的条款之后逐字接「excluding the personal data processing activities performed by OVHcloud as a controller. The conditions into which OVHcloud processes, as a Controller, Personal Data relating to the Client (including the Client's agents), are defined in the OVHcloud Data Usage Policy.」——即 role=processor 只覆盖「作为服务一部分」的请求内容处理；OVHcloud 以 controller 身份处理客户（含其代理人）个人数据（账号/用量一类）的条件由 OVHcloud Data Usage Policy 管辖。该政策尚未纳入本文件 [[source]]，机器不可复核，只能记为发现线索，待 bot 抓回快照后再引；它也不推翻本档的 processor 定性。"

[[product.role.point]]
text_zh = "②GTS（IE 版）签约主体 OVH Hosting Limited（都柏林，注册号 468585），并规定 Contract 文件优先顺序 SC > DPA > GTS > 第三方产品条款 > 订单"

[[product.role.point]]
text = "③GTS §6.2.2「OVHcloud does not exercise prior control over the Content and has no knowledge of it」"

[[product.role.point]]
text_zh = "④Annex「Sub-processors」（IE 版）逐字说明清单依 DPA 而设、用于「carrying out the processing of the Client's data as part of the Service provision」，OVH Hosting Limited 自身亦列于集团内处理者。两层不确定性：(a) 附录 10 §2 把模型定性为第三方产品并指向不可复核的第三方条款 URL，上游模型提供方的角色未披露"

[[product.role.point]]
text_zh = "(b) US 实体（OVH US LLC）是另一份 DPA（见 products 的 ai-tools-us 行），不适用于本档。"

