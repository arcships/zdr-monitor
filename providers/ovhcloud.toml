[[product.role.point]]
text_zh = "US 档结论：OVH US LLC dba OVHcloud®（Reston, VA）作为 Processor（并在 CCPA 语境下作为 service provider）处理 Content Data——US DPA §1.3「OVHcloud will Process Content Data only as a Processor on the Customer's behalf」、§2「Customer is the Controller or the Processor, as applicable, and OVHcloud is the Processor or sub-processor, as applicable」。这是与 EU 档完全不同的法律实体与文件，二者不可互换"

[[product.role.point]]
text_zh = "US 隐私政策也逐字把 controller 与 processor 两种角色分开（本政策只管 controller 部分）。"

