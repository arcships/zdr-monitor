[[product.training.point]]
text_zh = "US 档的 AI Tools 在 US Service-Specific Terms 第 9 节「AI Solutions」下，该节只有服务描述、客户义务、OVHcloud 义务、保留与财务条款，没有任何训练或数据使用条款"

[[product.training.point]]
text_zh = "US DPA 提供的是一般性目的限制：「will not collect, use, retain, access, share, sell, transfer, or otherwise Process Content Data for any purpose not related to providing such Services」。据此记为 not_permitted，但这是目的限制推导而非逐字的「不训练」承诺，故 confidence=medium，并注明 US 侧没有任何 AI 专用的训练条款。"

[product.zdr]
