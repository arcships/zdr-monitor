  "https://us.ovhcloud.com/legal/privacy-policy/",
  "https://us.ovhcloud.com/legal/sla/ai/",
  "https://us.ovhcloud.com/public-cloud/ai-endpoints/",
]

[[product.zdr.point]]
text = "Structured conclusion: the cited US Service-Specific Terms §9.3.3 states an affirmative retention period for this tier's data (\"It is permanently deleted thirty (30) days after the Customer deletes a Notebook, unless the Customer decides otherwise.\"), and the AI Tools Service is designed around persistent storage, with no ZDR option or application path anywhere in §9 or in the US DPA. The tier is therefore recorded as mark=no (terms state retention), in line with the EU tier, rather than as undisclosed — an anchor is bound to this verdict, and a found clause cannot be reported as not_found."
text_zh = "结构化结论：US 条款 §9.3.3 对本档数据正面写明保留期（「It is permanently deleted thirty (30) days after the Customer deletes a Notebook, unless the Customer decides otherwise.」），且该服务按设计包含持久存储，§9 与 US DPA 全文都没有 ZDR 选项或申请入口。据此记 mark=no（条款明示会留存），与 EU 档口径一致；本维度已绑引文，不再记 unknown（引文找到了就不能判未披露）。"

[[product.zdr.point]]
text_zh = "US 档（Canada/US 数据中心的 AI Training / AI Notebooks / AI Deploy）没有任何零保留承诺或选项：US Service-Specific Terms 第 9 节与 US DPA 都没有 ZDR 方案或申请入口，US 站也没有 AI Endpoints 产品页（404）与 AI 专用 SLA 中的数据条款。但 §9.3.3 正面写明了 Workspace 的 30 天保留期（「It is permanently deleted thirty (30) days after the Customer deletes a Notebook…」），故本维度是「条款明示会留存」而不是「未披露」。注意：本档与 EU 档是两个法律实体（OVH US LLC vs OVH Hosting Ltd.），不要用 EU 的结论套用。"

