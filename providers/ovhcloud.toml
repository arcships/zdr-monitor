[product.training]
mark = "yes"
anchor = "sc-a10-no-training-no-backup"
mode = "default"

[[product.training.point]]
text_zh = "API 档结论：不用于训练，且 2026-11 版合同已把「不训练」写成逐字条款，不再只靠产品页。①合同层（最高优先级文件）：附录 10 §5「Inputs and Outputs are not used to train, retrain, or improve a Model, including an OVHcloud Model.」；同附录 §7 再次写「Client Data is not used to train, retrain, evaluate or improve a Model.」；§5 同时禁止为执行服务以外的目的使用 Inputs/Outputs。②官方产品页（official_blog 层）「Your data will never be used to train or improve our AI models; one of our many security guarantees.」与之同向，现仅作旁证。③文档层：getting-started「we do not store user data」、capabilities「Data is not stored or shared during or after model use」。限定：(a) §5 的临时保留例外（Batch API、speech-to-text）只讲保留与删除；§7 的「Client Data」定义覆盖 Batch 上传文件、音频流与 API Logs，并把不训练承诺一并覆盖这些子功能"

[[product.training.point]]
text_zh = "(b) 第三方模型条款仍指向 endpoints.ai.cloud.ovh.net/licences，该 URL 现 302 到产品目录页、第三方条款不可公开复核。但 2026-11 版合同 §7 已披露数据流：除下述例外，Models 在 OVHcloud Resources 上执行、其 publisher 无法访问任何 Client Data；非关联方 Shadow 作为子处理者仅为执行模型在请求期间处理 Inputs/Outputs，不留存，且基础设施在 EU。故上游访问面已由合同框定，剩余不确定性只是第三方条款文本本身不可复核"

[[product.training.point]]
text_zh = "(c) Billing 文档的「We continuously monitor the usage of each model on our platform」是聚合用量监控（下线决策用）；合同 §7 进一步明确 API Logs 只含技术元数据、不含 Inputs/Outputs，其用途包括安全与正常运行、计费，以及以聚合形式统计服务使用情况（「Monitoring of commercial activity」），均不构成训练用途。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "sc-a10-input-outputs-not-retained-beyond-request"

[[product.zdr.point]]
text_zh = "API 档结论：默认即零保留，无需申请或开通。①合同层：附录 10 §2「The AI Endpoints Service does not include any backup of Inputs and Outputs, nor any Snapshot.」；同条另写「Inputs are processed only for the duration necessary for the execution of the Request and are not retained beyond that.」，§5 同旨（不备份）——零保留是本产品的结构性属性（服务不含存储），不是可选开关、也不需要补充协议。"
anchor = "sc-a10-no-backup-or-storage"

[[product.zdr.point]]
text_zh = "②例外（2026-11 版扩为两类）：Batch API 与 real-time audio transcription（speech-to-text）Models；§2 明说这两类仅「retained temporarily, for the durations indicated in the “Data Processing Agreement” article of this Appendix」。具体期限按对象列在 retention 维度，均有 point 级锚点。"
anchor = "sc-a10-temporary-retention-exceptions"

[[product.zdr.point]]
text_zh = "③旁证：产品页「Zero data retention: We keep only the data required for billing purposes.」（全库唯一逐字出现 Zero data retention 之处，属营销层）；docs capabilities/getting-started 同旨。"

[[product.zdr.point]]
text_zh = "Responses API 页说明平台未实现服务端状态管理、建议始终 store:false（实现层说明，不构成保留承诺）。④未复核项：第三方模型条款 URL 仍不可公开获取；但合同 §7 已披露 Models 默认在 OVHcloud Resources 执行、publisher 无访问权，例外仅有非关联子处理者 Shadow（请求期间处理、不留存、EU 基础设施），故「上游另有保留」的公开风险已大幅收窄。⑤边界：API Logs 不属请求内容，合同 §7 明确其不含 Inputs/Outputs，但作为访问日志另有安全与正常运行、计费及聚合商用统计用途的保留期，不能读成「所有数据零保留」"

[[product.zdr.point]]
text_zh = "docs 提到的 Files API retention policy 也没有公开页面；不过 2026-11 版合同 §7 已直接给出 Batch 与 speech-to-text 的期限原文，具体见 retention 维度的 point 级锚点，故这些期限现在可机器复核。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "sc-a10-input-outputs-not-retained-beyond-request"

[[product.retention.point]]
text_zh = "按对象分开读，默认请求正文不留存。①输入输出正文（同步推理）——附录 10 §7「Inputs and Outputs: no storage. Inputs and Outputs are processed for the duration of the Request and are neither stored nor backed up by OVHcloud.」；§2 另写服务不含 Inputs/Outputs 备份或 Snapshot、Inputs 仅在执行 Request 所必需的期间处理，§5 同旨（不备份）。结构化字段据此记 basis=none（输入输出正文默认不留存），不写天数。"
anchor = "sc-a10-input-outputs-no-storage"

[[product.retention.point]]
text_zh = "②Batch API（例外）——附录 10 §7：入参文件「input files are kept temporarily for the purposes of processing and returning results to the Client for a duration configured by the Client within a limit of seventy-two (72) hours, then deleted.」；输出/错误文件「Output files and error files are deleted fifteen (15) days after the end of the processing.」。期限类型：入参为客户可配置、上限 72 小时；输出/错误为处理结束后 15 天删除。合同层已覆盖，文档层 Batch 页同旨（见该来源 note）。"
anchor = "sc-a10-batch-contract-retention"

[[product.retention.point]]
text_zh = "③real-time audio transcription（speech-to-text，例外）——附录 10 §7：「audio streams are kept temporarily, solely for the purposes of processing the Request and returning the Outputs to the Client, then deleted. Transcriptions are kept for ninety (90) days, then deleted.」即音频流随请求处理删除，转写文本 90 天删除。"
anchor = "sc-a10-speech-to-text-retention"

[[product.retention.point]]
text_zh = "④API Logs（技术元数据，不含 Inputs/Outputs）——附录 10 §7 说明 Logs API 含项目标识、API key、模型、时间戳、用量、请求状态与来源 IP，并明确其不含 Inputs/Outputs。安全与正常运行用途：「API logs are kept for one (1) year, then deleted.」同一份日志还用于「Monitoring of commercial activity」（以聚合形式统计服务使用），原文未另给该项期限。"
anchor = "sc-a10-api-logs-retention"

[[product.retention.point]]
text_zh = "⑤API Logs（OVHcloud 作为 controller 的计费用途）——附录 10 §7：「Billing: OVHcloud processes API logs as a data controller, in order to measure the Client's consumption, issue invoices and handle any potential disputes. API logs are kept in detailed form for twenty-four (24) months from the date of the Request, then deleted.」发票上的聚合消费数据按适用法定期间保留。"
anchor = "sc-a10-api-logs-billing-retention"

[[product.retention.point]]
text_zh = "⑥服务结束——附录 10 §7：「At the end of the AI Endpoints Service, whatever the reason for termination, OVHcloud does not retain any Client Data, with the exception of files and data still subject to the retention periods above, which are deleted upon their expiry, and API Logs.」EU DPA §10.1 同旨（服务到期后按合同删除全部 Content）。"
anchor = "sc-a10-end-of-service-no-client-data"

[[product.retention.point]]
text_zh = "⑦平台级——SC 通用条款「OVHcloud does not carry out any specific backups of the Content stored on the Resources.」。本家是欧盟实体+GDPR，「网络日志不少于六个月」这类国内站下限条款不适用，公开文件无对应表述。"
anchor = "sc-art5-no-specific-backups"

[[product.retention.point]]
text_zh = "本维度结构化字段只描述请求内容：同步推理＝不含存储（basis=none），例外子功能与 API Logs 的期限见前条 point；OVHcloud 作为 controller 的账号/账单类政策尚未纳入本文件 [[source]]，机器不可复核。"

[product.processing_region]
codes = ["EU"]
anchor = "sc-a10-models-hosted-eu"

[[product.processing_region.point]]
text_zh = "API 档结论：处理地由合同明文固定为欧盟，客户不能选择。①合同层（主权威）：附录 10 §1「Notwithstanding article 5.5 of these Specific Conditions of Service, the Client does not choose the location of the AI Endpoints Service. The Models provided by OVHcloud are hosted and executed in Datacentres located in the European Union.」；§7「Location」再次写「Models are hosted and executed on Resources located in the European Union.」结构化 codes=EU 直接对应原文「European Union」，不再是宽泛近似。②文档层（佐证）：capabilities「Our infrastructure, hosted in Europe, adheres to European data protection regulations.」——2026-10 快照中该句由「located in Gravelines, France」改为「hosted in Europe」；合同层现已比文档更具体，按 contract > developer_data 以合同为准。"

[[product.processing_region.point]]
text_zh = "②可机器复核的处理地表述现有两处：合同附录 10 §1/§7（EU）与 capabilities 文档（Europe）；产品页与新闻稿仍未纳入本文件 [[source]]，不作为证据。若以后要引用产品页，需先把它加进 [[source]] 并等 bot 抓回快照。"

[[product.processing_region.point]]
text_zh = "③条款层：2026-08 版附录 10 无地点条款，2026-11 版新增 §1 与 §7「Location」，明确欧盟且客户不可选。另，官方新闻稿（2025-04-29）「It is available now in APAC, Canada and Europe and deployed from the Gravelines datacenter.」是发布时点的部署地表述，不能当作现行承诺；商业可用范围（APAC/加拿大/欧洲）与处理地也是两件事。"

[[product.processing_region.point]]
text_zh = "AI Endpoints 是 serverless，文档示例只有单一全局端点 oai.endpoints.kepler.ai.cloud.ovh.net，客户无法选择处理地（与 AI Tools 档「地点由客户创建时选择」正相反）。EU DPA §6.1 的「客户选择 Datacenter」以「Service allows the Client to store Content」为前提，§6.2 反而允许 OVHcloud 及其子处理者为安全与运维目的远程处理 Content，§6.3/6.4 规定非充分性国家数据中心与关联方传输的适用条件。④附录 10 §7 进一步披露：Models 默认在 OVHcloud Resources 执行，publisher 无 Client Data 访问权；非关联子处理者 Shadow 仅为执行模型在请求期间处理 Inputs/Outputs、不留存，基础设施在 EU。但「Who are the sub-processors?」同时指向 Sub-processors 附录，而 IE 版清单中 OVH Hebergement Inc.（Canada）对「All Services, regardless of their location, except SecNumCloud and Trusted Cloud」承担处理——AI Endpoints 既非 SecNumCloud 也非 Trusted Cloud，故加拿大关联方在清单范围内仍可远程介入；这与 §1 的「Models hosted in EU」是处理地承诺与远程运维例外的关系，不矛盾"

[[product.processing_region.point]]
text_zh = "平台页 data sovereignty 称只有 EU 实体或充分性认定国家（特别是加拿大）实体可介入欧洲客户服务，两处方向一致，但都不构成对请求内容处理地的量化承诺。⑤EU 站区域可用性表在 FRANCE 区块给 AI Endpoints 一个 ✓，Canada/USA 区块无 ✓（markdown 表格列被压平，列位不作强断言）。"

[product.role]
kind = "processor"
anchor = "sc-a10-processor"

[[product.role.point]]
text_zh = "API 档结论：OVHcloud 在协议上自认 processor（受托处理方），依据同时来自产品专用条款、通用 DPA 与 GTS。附录 10 §7 现逐字写「As part of the use and security of the AI Endpoints Service, OVHcloud processes personal data as a data processor upon instruction from the Client.」，并说明以 controller 身份处理 API Logs 的条件不受 DPA 覆盖；§7 的「Who are the sub-processors?」还披露非关联方 Shadow 作为子处理者、仅为执行模型在请求期间处理 Inputs/Outputs。与同一份 SC 的其他附录对照：附录 4（Managed Databases，原 DBaaS）与附录 8（Managed Rancher）现在都写「as a data processor upon instruction from the Client」（旧版是 sub-processor on the instructions），附录 6（Quantum）仍写「In order to provide the Service, OVHcloud does not process personal data as a processor or access the Client Content」；附录 10 的客户责任句仍保留（「The Customer is responsible for the use of the AI Endpoints Service...」与「The Client is responsible for the content of the Inputs...」）。依据链：①EU/IE 版 DPA（Version dated on 17.10.2025）抬头「entered into between OVH Hosting Ltd. … and the Client」，目的条款「OVHcloud is entitled, as a Processor and as part of the Services defined in the Agreement, to carry out the processing of Personal Data on behalf of, and on instructions from the Client」，§1.1「as a Processor acting under Client's instruction」。边界说明（DPA 目的条款紧接的 carve-out，已并入通用 DPA 锚点 eudpa-processor-purpose 的 suffix 一并覆盖）：目的条款之后逐字接「excluding the personal data processing activities performed by OVHcloud as a controller. The conditions into which OVHcloud processes, as a Controller, Personal Data relating to the Client (including the Client's agents), are defined in the OVHcloud Data Usage Policy.」——即 role=processor 只覆盖「作为服务一部分」的请求内容处理；OVHcloud 以 controller 身份处理客户（含其代理人）个人数据（账号/用量一类）的条件由 OVHcloud Data Usage Policy 管辖。该政策尚未纳入本文件 [[source]]，机器不可复核，只能记为发现线索，待 bot 抓回快照后再引；它也不推翻本档的 processor 定性。"

[[product.role.point]]
text_zh = "②GTS（IE 版）签约主体 OVH Hosting Limited（都柏林，注册号 468585），并规定 Contract 文件优先顺序 SC > DPA > GTS > 第三方产品条款 > 订单"

[[product.role.point]]
text = "③GTS §6.2.2「OVHcloud does not exercise prior control over the Content and has no knowledge of it」"

[[product.role.point]]
text_zh = "④Annex「Sub-processors」（IE 版）逐字说明清单依 DPA 而设、用于「carrying out the processing of the Client's data as part of the Service provision」，OVH Hosting Limited 自身亦列于集团内处理者。附录 10 §7 另点名 Shadow 为非关联子处理者，并称除该例外 Models publisher 无 Client Data 访问权。剩余不确定性：(a) 第三方模型条款 URL 仍不可公开复核；合同已披露 publisher 无访问、Shadow 仅请求期处理且不留存"

[[product.role.point]]
text_zh = "(b) US 实体（OVH US LLC）是另一份 DPA（见 products 的 ai-tools-us 行），不适用于本档。"

