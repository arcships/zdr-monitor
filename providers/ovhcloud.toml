anchor = "sc-a7-workspace-30-days"

[[product.retention.point]]
text_zh = "本档保留期在合同层逐条量化（与 AI Endpoints「不含存储」正相反，本档服务本身包含客户可见的存储）：①临时本地存储——附录 7 §2.4.2 的删除句「As soon as the Tool is “completed”, “stopped” or “deleted” by the Client (as applicable) or in the event of a malfunction, the contents of the temporary storage space will be deleted.」**待复核，本维度不据此下判断**：当前快照（26bda2a9662b5416.md:1518-1519）在「…the contents」处断行，缺「of the temporary storage space will be deleted.」，锚点 sc-a7-temporary-local-storage-deleted 已按快照现有文本收窄（引文止于「…in the event of a malfunction, the contents」），故不再是 missing，但它只能证明该段落在「…the contents」处断行，删除句本身仍待重抓恢复后复核。这是抓取丢行（§2.4.3 仍缺「(including the maximum storage capacity)…」，见该来源 note），不是厂商改条款，不得据此写成「未披露」，也不改绑到措辞不同、法律实体不同的 US SST §9.3.2；该句随重抓恢复前只作待复核记录。该段当前可机器复核的只有「The local and temporary storage space is not synchronised or backed up by OVHcloud.」——临时本地存储不受 OVHcloud 的同步或备份"
anchor = "sc-a7-temporary-local-storage-not-backed-up"

[[product.retention.point]]
text_zh = "②AI Notebooks Workspace——§2.4.3「It is permanently deleted thirty (30) days after the Client deletes a Notebook, unless the Client decides otherwise.」（Workspace 备份到 Object Storage 容器，Notebook 停止时由 OVHcloud 备份）。同段紧接着还有一句「Workspace Content is deleted on the Notebook deletion date.」（2026-11 版把旧表述「Content of the Workspace…」改成了现在的语序，语义未变）——两句并列保留、不选边：30 天句给的是 Workspace 被 permanently deleted 的期限，第二句给的是内容删除的触发点＝Notebook 删除当日；原文没有说明两句如何衔接（可能分别针对 Workspace 备份与 Workspace 内容），按厂商自己说法冲突的处理口径两条事实都记。本档 days=30 只取前句，不替厂商解释两句的关系。"
anchor = "sc-a7-workspace-content-deleted-on-notebook-date"

[[product.retention.point]]
