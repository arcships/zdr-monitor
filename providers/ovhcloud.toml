[[product.retention.point]]
text = "②Notebook Workspace——§9.3.3「It is permanently deleted thirty (30) days after the Customer deletes a Notebook, unless the Customer decides otherwise.」同段紧接着还有一句「The Content of the Workspace is deleted on the Notebook deletion date.」——两句并列保留、不选边：30 天句给的是 Workspace 被 permanently deleted 的期限，第二句给的是内容删除的触发点＝Notebook 删除当日；原文没有说明两句如何衔接（可能分别针对 Workspace 备份与 Workspace 内容），按厂商自己说法冲突的处理口径两条事实都记，本档 days=30 只取前句。US 版该段完整，EU 附录 7 同段有抓取丢字（见 SC 来源 note），不要读成条款差异。"
anchor = "us-sst-a9-workspace-content-deleted-on-notebook-date"

[[product.retention.point]]
text_zh = "③服务结束——§9.2.7「OVHcloud will delete the Resources used.」"

[[product.retention.point]]
text_zh = "④执行时长上限——§9.5.1 Job/Notebook 最长 7 个连续日"

[[product.retention.point]]
text_zh = "⑤实体层——US DPA §6 服务到期/终止后 15 个日历日内可免费取回 Content Data，之后立即删除（除非法律要求存储），技术上无法删除时封锁后续处理。"

