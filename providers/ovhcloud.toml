[[product.zdr.point]]
text = "Structured conclusion: the cited contract clause states an affirmative retention period for this tier's data (\"It is permanently deleted thirty (30) days after the Client deletes a Notebook, unless the Client decides otherwise.\"), and the service is designed around persistent storage, with no ZDR option or application path anywhere in Annex 7. The tier is therefore recorded as mark=no (terms state retention) rather than as undisclosed."
text_zh = "结构化结论：原引合同条款对本档数据正面写明保留期（「It is permanently deleted thirty (30) days after the Client deletes a Notebook, unless the Client decides otherwise.」），且该服务按设计包含持久存储，附录 7 全文无 ZDR 选项或申请入口。据此记 mark=no（条款明示会留存），而不是「未披露」。"

[[product.zdr.point]]
text_zh = "AI Tools 档没有、在合同层也不可能有零保留承诺：该服务按设计包含持久存储（Notebook Workspace 存于 Object Storage，删除 Notebook 后仍保留 30 天；临时本地存储随 Tool 停止/删除而删除）。附录 7 全文没有「不含存储 / 不备份 / 不保留」表述，也没有任何 ZDR 选项或申请入口"

[[product.zdr.point]]
text_zh = "文档站经 llms.txt 索引核过，没有 AI Tools 的 data-retention / ZDR 页（也没有 AI Tools 的 responsibility-model 页）。按规则记 not_found，并明确这是「官方未披露 ZDR」而非「厂商承诺保留」，不反向解读。"

