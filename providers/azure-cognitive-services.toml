[[source]]
url = "https://learn.microsoft.com/en-us/azure/foundry-classic/how-to/concept-data-privacy"
channel = "developer_data"
tier = "core"
note = "档位 foundry-partner-models(模型目录部署)的权威文档:《Data, privacy, and security for use of models through the model catalog in Microsoft Foundry portal (classic)》。覆盖三种路径:serverless API 部署(Microsoft 托管,含第三方模型)、托管计算(managed compute,客户自管基础设施)、从目录下载模型自部署。逐字给出 role(「Microsoft acts as the data processor for prompts and outputs sent to, and generated by, a model deployed for serverless API deployment.」)、training、retention、processing_region。注意:该文只有 foundry-classic 路径,现行 /azure/foundry/how-to/concept-data-privacy 实测 404(见 dead 条目)。"

[[source]]
url = "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-from-partners"
channel = "developer_data"
tier = "core"
note = "档位 foundry-partner-models:官方《Foundry Models from partners and community》目录页。给出模型目录两大类(Models sold by Azure / Models from partners and community)、第三方模型属 Non-Microsoft Products 受 Product Terms 约束、以及 Global / Data Zone 部署的处理位置逐字条款。"

[[source]]
url = "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/data-privacy"
channel = "developer_data"
tier = "core"
note = "档位 azure-ai-services(Foundry Tools 非模型服务)的逐服务权威文档样例:《Data, privacy, and security for Azure AI Content Safety》。逐字给出不训练、检测期间不存储、数据留在所选区域不外传、abuse monitoring 不适用且不做人工审核、blocklist 数据同区域加密存储且可删。注意:认知服务没有产品线统一的 data-privacy 文档,只有逐服务文档。"

[[source]]
url = "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/language-service/data-privacy"
channel = "developer_data"
tier = "core"
note = "档位 azure-ai-services 逐服务文档:Azure Language。逐字给出同步/异步调用输入最多临时存储 48 小时、可用 LoggingOptOut 关闭该临时存储、不在资源所在区域之外存储或处理客户数据。该页全文没有任何训练用途声明(故 Language 的 training 记未披露)。"

[[source]]
url = "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy"
channel = "developer_data"
tier = "core"
note = "档位 api(Azure OpenAI / Foundry Models sold by Azure)的权威文档《Data, privacy, and security for Foundry Models sold by Azure in Microsoft Foundry》。逐字定义范围:「A 'model sold by Azure' is an AI model designated and deployed as such in Foundry, and includes Azure OpenAI models.」覆盖 Standard / Global / DataZone / Provisioned / Batch / Developer 部署类型。**与 azure.json 的同一份文档**:本 pid 的历史候选(seed source_id fbb65b16dcfbd62d)就是这篇;两个 pid 共用同一权威,本文件据实登记并只在范围说明上分工(azure.json 覆盖 Azure 平台档,本文件另加 Foundry Tools 非模型服务与 Foundry 合作伙伴模型两档)。不覆盖 Foundry 中的 Marketplace 第三方模型,不覆盖 Azure China(21Vianet)。本轮用 r.jina.ai 重抓(--resolve 绕过本机 fake-ip),与缓存逐字一致(仅多一行 Published Time 头)。"

[[source]]
url = "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/speech-service/text-to-speech/data-privacy-security"
channel = "developer_data"
tier = "core"
note = "档位 azure-ai-services 逐服务文档:text to speech / avatar。逐字给出预置声音合成不把输入文本与输出音频存入 Microsoft 日志;实时合成 API 不留存输入文本;客户提交的声音/头像训练数据只用于该客户自己的模型;合成声音与录音 90 天内自动删除;Microsoft 可独立保留定制声音模型副本用于保护服务安全与完整性。"

[[source]]
url = "https://www.microsoft.com/licensing/docs/documents/download/MicrosoftProductandServicesDPA(WW)(English)(May2026)(CR).docx"
channel = "contract"
tier = "core"
note = "合同层正文:Microsoft Products and Services Data Protection Addendum(2026 年 5 月版,英文 WW)。本轮实测该 DOCX 链接 HTTP 200、6,510,568 字节;r.jina.ai 不解析 DOCX,正文由本地解包 word/document.xml 提取(本轮自行解包得 83,324 字符,提取文本存 /tmp/zdr-fetch/azure-cognitive-services/dpa-own-extract.txt,锚点即在该文本上定位)。覆盖全部 Online Services(含 Azure 与认知服务),是 role 与订阅终止后保留/删除的合同层权威。"

[[source]]
url = "https://www.microsoft.com/licensing/terms/product/PrivacyandSecurityTerms/EAEAS"
channel = "contract"
tier = "core"
note = "合同层:Microsoft Product Terms 的 Privacy and Security Terms(EAEAS 版)。Azure Core Online Services 名单逐字包含 Azure Language / Azure Translator / Azure Document Intelligence / Azure AI Immersive Reader / Azure Vision / Content Safety / Azure Custom Vision / Azure Vision - Face / Content Moderator / Azure AI Metrics Advisor / Foundry Models sold by Azure,即本 pid 的整条认知服务产品线;给出客户配置 Geo 后静态 Customer Data 存于该 Geo 的承诺、inactive 配置/自定义模型 90 天可按订阅过期处理,以及「Exceptions to the DPA」中 Azure AI Services 的容器例外。这是整条产品线唯一的产品线级 region/保留合同承诺。"

