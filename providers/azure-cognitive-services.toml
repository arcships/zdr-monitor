]

[[product.training.point]]
text = "Azure AI Content Safety: \"No. We do not use customer data to train, retrain or improve the models in Azure AI Content Safety.\""
text_zh = "Azure AI Content Safety 明确不用客户数据训练、重训或改进其模型"

[[product.training.point]]
text = "Text to speech: a customer's training data is used only to develop that customer's custom voice models and isn't used by Microsoft to train or improve any Microsoft text to speech voice models."
text_zh = "text to speech:客户提交的训练数据只用于开发该客户自己的定制声音模型,Microsoft 不用于训练或改进自己的声音模型"

[[product.training.point]]
text = "Why this tier stays unknown: the two statements above each cover a single service (Content Safety; customer-submitted custom-voice training data for text to speech), not the Foundry Tools line as a whole. The Azure Language page carries no training statement, and the speech-to-text and Vision data-privacy pages have no snapshot yet (a fetch gap, not a vendor silence). A tier-wide ✓ would need a statement covering all services; splitting the tier per service is the way to record the per-service commitments."
text_zh = "本档维持 unknown 的理由：上面两句各自只覆盖一个服务（Content Safety；text to speech 的客户定制声音训练数据），不是整条 Foundry Tools 产品线的表述。Azure Language 页没有任何训练用途表述，speech-to-text 与 Vision 的 data-privacy 页尚无快照（是抓取缺口，不是厂商未表态）。整档给 ✓ 需要覆盖全部服务的表述；要记录单个服务的承诺，应按服务拆档。"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "cs-no-human-review"
searched = [
  "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/data-privacy",
  "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/speech-service/speech-to-text/data-privacy-security",
