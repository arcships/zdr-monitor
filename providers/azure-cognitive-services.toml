  "https://learn.microsoft.com/en-us/azure/ai-services/security-features",
  "https://learn.microsoft.com/en-us/azure/ai-foundry/responsible-ai/openai/limited-access",
  "https://www.microsoft.com/licensing/terms/product/PrivacyandSecurityTerms/EAEAS",
  "https://www.microsoft.com/licensing/docs/documents/download/MicrosoftProductandServicesDPA(WW)(English)(May2026)(CR).docx",
  "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy",
]

[[product.zdr.point]]
text = "Azure AI Content Safety: user input data is not stored and not made available for human review; the Azure OpenAI Abuse Monitoring process does not apply to it. Zero retention holds by default for this service."
text_zh = "Azure AI Content Safety:输入数据不存储、不供人工复核,且 Azure OpenAI Abuse Monitoring 不适用——该服务默认即零保留"

[[product.zdr.point]]
text = "Azure Language: input can be temporarily stored for up to 48 hours by default; the LoggingOptOut query parameter turns that temporary storage off (false by default for Language Detection, Key Phrase Extraction, Sentiment Analysis and Named Entity Recognition endpoints; true by default for the PII and health endpoints)."
text_zh = "Azure Language:输入默认最多临时存储 48 小时,LoggingOptOut 可关闭该临时存储(四个端点默认 false、即默认开启;PII 与 health 端点默认 true)"
anchor = "lang-temp-48h-loggingoptout"

[[product.zdr.point]]
text = "Text to speech (real-time synthesis): neither input text nor output audio content is stored in Microsoft logs."
text_zh = "text to speech(实时合成):输入文本与输出音频都不存入 Microsoft 日志"
anchor = "tts-realtime-no-store"

[[product.zdr.point]]
text = "Scope limit: batch synthesis does keep input text and output audio in Azure storage until the customer deletes it, and the speech-to-text and Vision services have no snapshot yet — this verdict does not cover them."
text_zh = "范围限定:批量合成的输入文本与输出音视频会存进 Azure storage 直到客户删除;speech-to-text 与 Vision 尚无快照——本条不覆盖这些情形"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "lang-temp-48h-loggingoptout"

[[product.retention.point]]
text = "Azure AI Content Safety (input): no input texts or images are stored in the model during detection, except for customer-supplied blocklists."
text_zh = "Azure AI Content Safety(输入):检测期间不存储任何输入文本或图像,客户自备 blocklist 除外"
anchor = "cs-retention-no-store"

[[product.retention.point]]
text = "Azure AI Content Safety (blocklists): block item data is stored in Azure Storage in the same region as the resource, encrypted, and can be deleted by the customer via the DELETE API."
text_zh = "Azure AI Content Safety(blocklist):block item 数据加密存于与资源同区域的 Azure Storage,客户可用 DELETE API 删除"
anchor = "cs-blocklist-stored-in-region"

[[product.retention.point]]
text = "Azure Language: synchronous and asynchronous call input may be temporarily stored for up to 48 hours and is purged thereafter; this is on by default (LoggingOptOut is false by default for four endpoints, true by default for the PII and health endpoints)."
text_zh = "Azure Language:同步/异步调用输入最多临时存储 48 小时,之后清除;该临时存储默认开启(四个端点 LoggingOptOut 默认 false,PII 与 health 端点默认 true)"

[[product.retention.point]]
text = "Text to speech (real-time): neither input text nor output audio is retained in Microsoft logs."
text_zh = "text to speech(实时):输入文本与输出音频都不留存于 Microsoft 日志"
anchor = "tts-realtime-no-store"

[[product.retention.point]]
text = "Text to speech (batch / Long Audio and avatar batch): input scripts and output audio or video are stored in Azure storage to process the request, and can be deleted at any time via the delete API — the period is customer-controlled, not a fixed term."
text_zh = "text to speech(批量 / Long Audio 与头像批量):输入脚本与输出音视频存进 Azure storage 以处理请求,可随时用 delete API 删除——期限由客户控制,不是固定期限"
anchor = "tts-batch-stored-in-azure-storage"

[[product.retention.point]]
text = "Text to speech (custom neural voice lite): the synthetic voice and related audio recording are automatically deleted within 90 days unless the customer gains full access and deploys the voice, in which case the customer controls retention."
text_zh = "text to speech(custom neural voice lite):合成声音与相关录音 90 天内自动删除,除非客户获得完全访问并部署该声音,此时保留期由客户控制"
anchor = "tts-synthetic-voice-90d-delete"

[[product.retention.point]]
text = "Text to speech (custom voice models): a different object from input/output — Microsoft may independently retain a copy of custom neural voice models for as long as necessary, for the sole purpose of protecting the security and integrity of Foundry Tools."
text_zh = "text to speech(定制声音模型):与输入输出是不同的对象——Microsoft 可为保护 Foundry Tools 的安全与完整性而独立保留定制声音模型副本,期限按需"
anchor = "tts-microsoft-independent-retention"

[[product.retention.point]]
text = "After expiration or termination of the subscription: Customer Data that remains stored in Online Services is kept in a limited function account for 90 days so the customer may extract it, then deleted within a further 90 days."
text_zh = "订阅到期或终止后:仍存于 Online Services 的 Customer Data 在受限功能账户中保留 90 天供取回,随后 90 天内删除"
anchor = "retention-90d-limited-function-account"

[[product.retention.point]]
text = "Trigger for stateful resources: a service configuration or custom model that has been inactive (90 days without calls, unmodified with no current key, customer not signed in) may at Microsoft's discretion be treated as an Online Service whose subscription has expired."
text_zh = "有状态资源的触发条件:非活跃的服务配置或自定义模型(90 天无调用、未修改且无有效密钥、客户未登录)可被 Microsoft 视为订阅已过期的 Online Service"
anchor = "contract-inactive-config-custom-model"

[[product.retention.point]]
text = "Scope limit: speech-to-text and Vision have no snapshot yet, so their retention terms are not covered here; preview features may employ different privacy practices."
text_zh = "范围限定:speech-to-text 与 Vision 尚无快照,其保留条款不在本条覆盖内;预览功能可能适用不同的隐私做法"

[product.processing_region]
codes = ["selected"]
anchor = "cs-region-in-region"

[[product.processing_region.point]]
text = "Azure AI Content Safety: all customer data sent to it remains within the service and in the region the customer chose, and is not transmitted to other regions."
text_zh = "Azure AI Content Safety:送去的客户数据留在本服务内、留在客户所选区域,不外传到其他区域"

[[product.processing_region.point]]
text = "Azure Language: Language doesn't store or process customer data outside the region where the customer deploys the service instance."
text_zh = "Azure Language:不在客户部署服务实例的区域之外存储或处理客户数据"
anchor = "lang-no-outside-region"

[[product.processing_region.point]]
text = "Contract layer: if the customer configures a service to be deployed within a Geo, Microsoft stores Customer Data at rest within that Geo; the services in scope are the Azure Core Online Services listed in the Privacy and Security Terms."
text_zh = "合同层:客户把服务配置到某个 Geo 后,Microsoft 把 Customer Data 静态存储在该 Geo;适用范围是 Privacy and Security Terms 列出的 Azure Core Online Services"
anchor = "contract-cognitive-services-in-scope"

[[product.processing_region.point]]
text = "Contract exception: certain services may not enable the customer to configure deployment in a particular Geo or outside the United States, and may store backups in other locations."
text_zh = "合同层例外:部分服务不允许客户配置到特定 Geo 或美国以外,且可能把备份存在其他地点"
anchor = "contract-geo-at-rest"

[[product.processing_region.point]]
text = "Container form: the service can also run in containers on customer hardware, where the processing location is the customer's own environment and the DPA does not apply."
text_zh = "容器形态:服务也可跑在客户硬件的容器里,此时处理地是客户自己的环境,且 DPA 不适用"
anchor = "contract-dpa-exceptions-containers"

[[product.processing_region.point]]
text = "Exception: the DPA does not apply to Grounding with Bing Search and/or Grounding with Bing Custom Search through Microsoft Foundry, and Customer Data will flow outside the customer's compliance and Geo boundary."
text_zh = "例外:经 Microsoft Foundry 使用 Grounding with Bing 时不适用 DPA,且 Customer Data 会流出客户的合规与 Geo 边界"
anchor = "contract-grounding-with-bing"

[[product.processing_region.point]]
text = "Scope limit: the Geo storage commitment applies only to the Core Online Services in the table, excluding any Previews."
text_zh = "范围限定:Geo 静态存储承诺只覆盖表内的 Core Online Services,不含任何 Preview"
anchor = "contract-core-online-services-excludes-previews"

[[product.processing_region.point]]
text = "Scope limit: Preview Data may be transferred to, and stored and processed in, the United States or any other country in which Microsoft or its subprocessors operate; Location of Customer Data does not apply to Previews."
text_zh = "范围限定:Preview Data 可传输、存储和处理于美国或 Microsoft 及其次级处理方运营的任意国家,Location of Customer Data 不适用于预览功能"
anchor = "region-preview-data-not-covered"

[product.role]
kind = "processor"
anchor = "role-customer-controller-microsoft-processor"

[[product.role.point]]
text = "Under the DPA the customer is the controller of Personal Data and Microsoft is the processor (subprocessor when the customer itself acts as a processor)."
text_zh = "DPA 约定:客户是 Personal Data 的控制者,Microsoft 是受托处理方(客户自身为处理方时 Microsoft 为次级受托)"

[[product.role.point]]
text = "Scope support: Azure Language, Content Safety, Azure Vision, Content Moderator, Custom Vision, Vision - Face and AI Metrics Advisor are all listed as Azure Core Online Services, so the DPA covers this product line."
text_zh = "范围佐证:Azure Language、Content Safety、Azure Vision、Content Moderator、Custom Vision、Vision - Face、AI Metrics Advisor 都在 Azure Core Online Services 名单内,DPA 覆盖这条产品线"
anchor = "contract-cognitive-services-in-scope"

[[product.role.point]]
text = "Exception: because containers installed on customer hardware are not under Microsoft's control, the terms of the DPA do not apply to those containers (except billing-endpoint Personal Data and Customer Data provided for custom model training before download)."
text_zh = "例外:装在客户硬件上的容器不在 Microsoft 控制范围内,DPA 条款不适用于这些容器(计费端点的 Personal Data 与下载前提交用于定制模型训练的 Customer Data 除外)"
anchor = "contract-dpa-exceptions-containers"

[[product.role.point]]
text = "Exception: the DPA does not apply to Grounding with Bing Search and/or Grounding with Bing Custom Search through Microsoft Foundry; the Microsoft Privacy Statement applies instead."
text_zh = "例外:经 Microsoft Foundry 使用 Grounding with Bing 时不适用 DPA,改由 Microsoft Privacy Statement 管辖"
anchor = "contract-grounding-with-bing"

[[product.role.point]]
text = "Second statement kept alongside: to the extent Microsoft processes Personal Data subject to the GDPR for business operations incident to providing the Products and Services, Microsoft complies with the obligations of an independent data controller."
text_zh = "并列保留的另一说法:在提供产品与服务所附带的业务运营范围内处理受 GDPR 管辖的 Personal Data 时,Microsoft 以独立数据控制者身份承担义务"
anchor = "role-microsoft-independent-controller"

