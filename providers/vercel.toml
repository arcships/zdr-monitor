[[product.training.point]]
text_zh = "ToS §3 第 3 段：Hobby 与 trial Pro 默认授权 Vercel 用 Your Content 训练自己的 AI/ML 模型并与第三方共享"

[[product.training.point]]
text_zh = "付费 Pro 默认关闭、可 opt-in"

[[product.training.point]]
text_zh = "可随时在 Team 设置退出或升级 Enterprise。隐私政策侧另有两条：使用目的表把「Internal product development and improvement, including AI model training」列为正当利益依据"

[[product.training.point]]
text_zh = "对 Hobby 与 Pro 用户，可按 Team 设置把去标识化信息（含去标识化 AI Product Information）披露给 AI 商业伙伴用于其训练与改进。Enterprise 档：AI Product Terms §7.3.1 对 v0 有明文不训练保证，ToS Schedule I 第 4 条把 AI Products and Services 整体指向 AI Product Terms（ToS §10.4 的 System Data 另有「any business purposes」的授权）。本页 jina 快照含 §1–§23 与 Schedule I 全文，§3 这一段在快照内、锚点有效。"

[product.zdr]
mark = "no"
anchor = "vercel-gateway-zdr-availability-pro-enterprise"

[[product.zdr.point]]
text_zh = "结论：部署平台档没有零保留——ZDR 在 Vercel 是 AI Gateway 的档内功能。(a) 范围界定：官方唯一的 ZDR 文档 /docs/ai-gateway/security-and-compliance/zdr 开篇即写「Zero data retention (ZDR) is available for Pro and Enterprise users on AI Gateway.」，限定语是 on AI Gateway"

[[product.zdr.point]]
text_zh = "整页讲的都是网关把请求转给上游模型时的保留策略（上游例外、缓存发生在上游一侧、被判滥用或安全审查的请求按上游政策保留），没有一句把这套机制延伸到部署平台上的构建产物、函数执行或可观测数据。(b) 平台档的实际口径与零保留相反：DPA §12.1「Termination or expiration of the Agreement serves as instruction for Vercel to delete all Customer Data within a commercially reasonable timeframe.」——删除的触发点是协议终止，即客户数据在合同存续期间持续保留"

[[product.zdr.point]]
text_zh = "§12.2 另允许法律要求时继续保留。可观测数据另有固定窗口（界面保留期 Hobby 12 小时 / Pro 1 天 / Enterprise 3 天，Observability Plus 30 天），ToS §10.4 的 System Data（traffic data、telemetry、logs、usage statistics）归 Vercel 所有、合同期内与终止后都可为任何商业目的使用且未设期限。(c) 为什么记 mark=no 而不是 not_found：这不是查不到，而是官方把 ZDR 的可用范围写死在网关档，同时平台档存在明示的持续保留条款，两件事都是正面事实。(d) 边界：这只说明平台档没有公开的零保留方案与申请入口，不等于 Enterprise 合同谈不出单独安排——Enterprise 合同与 DPA 的可协商条款不公开（Enterprise Terms 未登记、本轮未核，不作为依据）。(e) 本轮查过 /docs/ai-gateway/security-and-compliance/zdr、/legal/dpa、/legal/terms、/legal/enterprise-terms、/legal/ai-product-terms 与 security.vercel.com，除网关页外没有第二处出现 zero data retention。"
anchor = "vercel-tos-10-4-system-data-no-term"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "vercel-dpa-12-1-delete-on-termination"

[[product.retention.point]]
text_zh = "平台档没有请求级保留期，只有两类：(a) 客户内容——DPA §12.1 协议终止即视为删除指令，在「商业上合理的时间范围内」删除全部 Customer Data，§12.2 法律要求时可保留"

[[product.retention.point]]
text_zh = "Schedule 1 §3 对 Customer Data 的期限未量化"

[[product.retention.point]]
text = "ToS §18.3 is the only platform-side deletion clause with a concrete number of days: within 14 calendar days of termination each party destroys or returns the other party's Proprietary Information and may keep one archival copy. Its object is confidential Proprietary Information, not Customer Data and not prompt/response content, so it only stands alongside the DPA §12.1 \"commercially reasonable timeframe\" clause."
text_zh = "(b) ToS §18.3 是平台档唯一带具体天数的删除条款：终止后 14 个日历日内销毁或返还对方的 Proprietary Information，允许保留一份存档副本。对象是双方的保密信息，不是 Customer Data、也不是输入输出正文，所以只能作为合同里的删除期限事实与 DPA §12.1 的「商业上合理期限」并列，不能读成「输入输出 14 天内删除」。"
anchor = "vercel-tos-18-3-proprietary-information-14-days"

[[product.retention.point]]
text = "(c) Service-generated data / telemetry: ToS §10.4 puts System Data (traffic data, telemetry, logs, usage statistics) under Vercel's ownership, usable for any business purposes during and after the term, with no period set."
text_zh = "(c) 服务生成数据/遥测：ToS §10.4 的 System Data（traffic data、telemetry、logs、usage statistics）归 Vercel 所有，合同期内与终止后都可为任何商业目的使用，未设期限"
anchor = "vercel-tos-10-4-system-data-no-term"

[[product.retention.point]]
text_zh = "观测数据的界面保留期是 Hobby 12 小时 / Pro 1 天 / Enterprise 3 天，Observability Plus 30 天"

[[product.retention.point]]
text_zh = "隐私政策只有「minimum necessary period」的原则表述。"

[product.processing_region]
codes = ["US"]
anchor = "vercel-dpa-13-1-primary-processing-in-us"

[[product.processing_region.point]]
text_zh = "合同层：DPA §13.1 原文「Customer acknowledges that, as of the Effective Date, Vercel's primary processing facilities are in the United States. Notwithstanding the foregoing, Customer acknowledges that Vercel may in connection with the provision of Services, need to transfer and process Customer Data to and in the United States and anywhere else in the world where Vercel or its Subprocessors maintain data processing operations.」"

[[product.processing_region.point]]
text_zh = "DPA §8.3 的备份条款另说「Backups are globally replicated for resiliency against regional disasters」，基础设施跨 AWS/Azure/GCP 多个可用区。平台档没有区域选择功能（区域 pinning 是 AI Gateway 的能力，见 gateway 行）。"

[product.role]
kind = "processor"
anchor = "vercel-dpa-4-1-vercel-as-processor"

[[product.role.point]]
text_zh = "Pro/Enterprise 档：DPA §4.1 定 Vercel 为 Processor（客户为 Controller/Processor）"

[[product.role.point]]
text = "ToS §10.1 splits the role by data type: Vercel processes personal information in Your Content, Account Information, and System Data as a controller or a processor, per the DPA (incorporated by reference) and the Privacy Policy. Hobby: no DPA, the Privacy Policy says Vercel acts as a data controller for information collected about you and as a data processor for personal information in Customer Data, and that notice does not apply to data processed as a processor. Service-generated data / contact data: controller (DPA §4.b). Observability System Data belongs to Vercel (ToS §10.4)."
text_zh = "ToS §10.1 按数据类型二分角色并把 DPA 与隐私政策并入：Your Content / Account Information / System Data 里的个人信息，Vercel 依 DPA 与隐私政策分别以 controller 或 processor 身份处理。Hobby 档：无 DPA，隐私政策自述「Vercel acts as a data controller for personal information that we collect about you… We act as a data processor on behalf of our Customers for the personal information contained in Customer Data.」且明确本通知不适用于其作为 processor 处理的 Customer Data。服务生成数据/账号联系数据为 controller 身份（DPA §4.b）。观测数据的 System Data 归 Vercel 所有（ToS §10.4）。"
anchor = "vercel-tos-10-1-controller-or-processor-per-data-type"

