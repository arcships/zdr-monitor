[[source]]
url = "https://security.vercel.com"
channel = "contract"
tier = "core"
note = "Vercel Trust Center 首页，含 subprocessor 清单表（公司/职能/所在地三列）。该页是 DPA §7.2 明文指定的 subprocessor 清单落点（「including their functions and locations, is available at https://security.vercel.com」），因此按并入的合同文件对待。27 家里与推理直接相关的有 AWS / Google / Microsoft（均标注 generative AI services）、OpenAI、Fireworks AI、Anthropic、Groq、Cerebras Systems、Baseten Labs、SpaceXAI LLC (fka xAI)、Exa.ai、Invisible Tools (Raindrop.ai)，所在地一律 United States。另含 2026-08-21「Subprocessor Update」公告，说明这些是为「services utilized for our AI products」而新增/更新。"

[[source]]
url = "https://vercel.com/docs/ai-gateway/security-and-compliance/disallow-prompt-training"
channel = "developer_data"
tier = "core"
note = "Disallow Prompt Training 页。Vercel 自己的承诺在「Vercel」小节；上游 provider 是否训练取决于是否开启 disallowPromptTraining（非默认），未知 provider 一律按「会训练」处理；BYOK 请求不受该过滤约束。是 training 维度的开发者文档层主来源。"

[[source]]
url = "https://vercel.com/docs/ai-gateway/security-and-compliance/regional-inference"
channel = "developer_data"
tier = "core"
note = "Regional Inference 页。给出网关档处理地的实际行为：默认 global（不钉区域、可能落在用户司法辖区之外）、可按请求 pin 到 us/eu、网关自身的终止与处理不受 pin 约束、钉不住就失败不回退；并明确上游 provider 的保留期由各家条款决定，以及 abuse/safety 标记请求会绕过所有保留设置。是 processing_region 与 retention（上游跳）的关键来源。"

[[source]]
url = "https://vercel.com/docs/ai-gateway/security-and-compliance/zdr"
channel = "developer_data"
tier = "core"
note = "AI Gateway ZDR 页（旧记录唯一登记的那条来源，本轮复核仍可抓、非渲染壳、是政策正文）。覆盖网关档的 ZDR：可用档位（Pro/Enterprise）、两种开启方式、默认路由行为、未知 provider 的处理、BYOK 排除、provider 白名单表格（23 家），以及两条关键例外（不支持 ZDR 的模型 claude-fable-5；provider 政策可排除某些模型/功能而请求不会失败）。是 zdr 维度的主来源。"

[[source]]
url = "https://vercel.com/legal/ai-product-terms"
channel = "contract"
tier = "core"
note = "《Vercel AI Product Terms》(Last Updated 2026-03-17，Effective 2026-03-31)。这是 AI Gateway 的专用合同：§1.1 把 AI Gateway 明确列入「AI Products and Services」定义（与 v0 并列），§1.3 定义 Customer Content = Input(s) + Output(s)，§1.4 定义 Input 含 prompts。第 8 节整节是 AI Gateway 附加条款，是回答「Vercel 的承诺覆盖到哪一跳」的核心文件：§8.1 把上游 provider 定为 Non-Vercel Services、其数据受第三方条款约束；§8.2.1 Stealth Models 例外；§8.4.1 Enterprise 订阅的「不训练」保证（措辞只覆盖 Vercel 自己的 AI Products and Services，不覆盖上游模型）。第 12 节给出合同层处理地（美国）。生效顺序：正文第 12 行规定 AI Product Terms 与 Terms 冲突时，就 AI Products and Services 与 Customer Content 以 AI Product Terms 为准。"

[[source]]
url = "https://vercel.com/legal/dpa"
channel = "contract"
tier = "core"
note = "《Data Processing Addendum》。适用范围自述为「forms part of Vercel Enterprise Terms and Conditions or other agreement executed between Vercel and Customer for Vercel's provision of Services on an Enterprise plan」，且「applies to Vercel's Processing of Personal Data as a Processor under the Agreement for Customers who are on Enterprise and Pro plans」——即只覆盖 Enterprise 与 Pro 两档。§4.1 定角色（Vercel = Processor）；§4.b 把 Service-Generated Data 与 Contact Data 划为 Vercel 以 controller 身份处理；§7.2 指明 subprocessor 清单（含职能与所在地）落在 security.vercel.com；§12 终止后删除；§13.1 主要处理设施在美国；Schedule 1 §3 是保留期限条款。"

[[source]]
url = "https://vercel.com/legal/terms"
channel = "contract"
tier = "core"
note = "《Vercel Terms of Service》(Last Updated June 1, 2026)。平台层主合同，覆盖包括 AI Gateway 在内的全部 Services。§3「Your Content」第 3 段是按套餐分档的 Model Training 条款：Hobby 与 trial Pro 默认授权 Vercel 用 Your Content 训练自己的模型并与第三方共享；付费 Pro 默认关闭、可 opt-in；可随时在 Team 设置里退出或升级 Enterprise。注意：jina 本次抓回的快照不完整——正文缺 §9 Security and Compliance、§10 Data Protection（含 10.4 System Data）、§14、§16、§17、§18、§20、§22，以及 Schedule I 的 §2–§7（含「4. AI Products and Services」指向 AI Product Terms 那条）。本轮只用本快照内存在的 §3 做锚点；§10 的内容另用 DPA 与 Enterprise Terms 覆盖，不在本页做锚点。"

