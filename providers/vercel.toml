[product.training]
mark = "no"
anchor = "vercel-aipt-6-2-hobby-pro-your-content-license"
mode = "opt_out"

[[product.training.point]]
text_zh = "Hobby 与 trial Pro：网关 Customer Content 按 §6.2 并入 ToS §3 的许可，而 ToS §3 对这两档默认授权训练并与第三方共享 → permitted"

[[product.training.point]]
text_zh = "付费 Pro：ToS §3「Model Training is not enabled by default and you may opt in」→ 默认 not_permitted，可 opt-in"

[[product.training.point]]
text_zh = "Enterprise：§8.4.1 明文保证「shall not use AI Gateway Customer Content to train or improve the AI Products and Services」，但措辞不含上游 provider 的模型。上游跳：§8.1 / §14 归第三方条款，Vercel 默认不过滤（disallowPromptTraining 非默认），未知 provider 按「会训练」处理"

[[product.training.point]]
text_zh = "Stealth Models 例外允许上游训练（§8.2.1）。开发者文档另称「AI Gateway does not use your prompts or responses for training purposes」，与合同的按档许可并存，不取平均。"

[[product.training.point]]
text = "Boundary of disallowPromptTraining: BYOK requests are exempt from the filter, but a failover request that falls back to AI Gateway system credentials is still filtered."
text_zh = "disallowPromptTraining 的边界：BYOK 请求不受该过滤约束，但回落到 AI Gateway 系统凭据的 failover 请求仍遵守该过滤。"
anchor = "vercel-gateway-dpt-byok-failover-still-filtered"

[[product.training.point]]
text = "Scope limit: Input must not contain sensitive personal information, so such content sits outside the assumptions the AI Products and Services make about Customer Content."
text_zh = "适用范围限制：Input 里不得包含敏感个人信息（AIPT §3.4），这类内容不在 AI Products and Services 对 Customer Content 的承诺假设内。"
anchor = "vercel-aipt-3-4-no-sensitive-personal-information"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "vercel-gateway-zdr-availability-pro-enterprise"

[[product.zdr.point]]
text_zh = "仅 Pro 与 Enterprise"

[[product.zdr.point]]
text_zh = "team-wide（$0.10 / 1,000 请求）或 per-request `zeroDataRetention: true`，二者 OR。只对有 ZDR 协议的 24 家 provider 生效"

[[product.zdr.point]]
text_zh = "未知/未签约 provider 在开启 ZDR 时被排除在路由外"

[[product.zdr.point]]
text_zh = "默认不按保留政策路由。BYOK 默认被排除，需手工标记。例外：claude-fable-5 在任何 provider 上都不支持 ZDR"

[[product.zdr.point]]
text_zh = "provider 可排除某些模型/功能且请求不会失败"

[[product.zdr.point]]
text_zh = "provider 级 prompt cache 是否 ZDR 合规取决于 provider。索引页「by default」的表述与本页并列保留。"

[[product.zdr.point]]
text = "Conflict kept as-is: the Meta row of the ZDR table marks No prompt training as \"—\" while ZDR is ✓."
text_zh = "厂商文档自相矛盾，两条并列：表内 Meta 一行的 No prompt training 列为「—」，而 ZDR 列为 ✓。"
anchor = "vercel-gateway-zdr-meta-row-no-prompt-training-blank"

[[product.zdr.point]]
text = "The same page also states that all ZDR-compliant providers disallow prompt training, which is the opposite of the Meta row."
text_zh = "同一页又写「All ZDR-compliant providers also disallow prompt training, since ZDR is a superset of disallowing prompt training」，与 Meta 行相反。两句都保留，不取平均。"
anchor = "vercel-gateway-zdr-all-zdr-providers-disallow-training"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "vercel-gateway-region-provider-terms-govern-retention"

[[product.retention.point]]
text = "This verdict covers the whole chain: Vercel's own gateway hop deletes prompts, outputs, and sensitive data immediately after the request is completed when ZDR is on, while the upstream provider hop is governed by each provider's own terms and carries no retention-period commitment. \"Undisclosed\" refers to the upstream hop, not to Vercel's own deletion promise."
text_zh = "本维度记的是全链：网关跳（Vercel 自己）在开启 ZDR 时于请求完成后立即永久删除 prompts / outputs / sensitive data；上游 provider 跳的保留期由各家条款决定、没有期限承诺——「未公布」指的是上游那一跳，不是 Vercel 自己的删除承诺。"
anchor = "vercel-gateway-zdr-no-retention-of-prompts-outputs"

[[product.retention.point]]
text = "By default AI Gateway does not route based on the data retention policy of providers, so unless ZDR is enabled a request can land on a provider with no retention commitment at all."
text_zh = "默认不按保留政策路由：未开启 ZDR 时请求可能落到没有任何保留承诺的 provider 上。"
anchor = "vercel-gateway-zdr-not-routed-by-policy-by-default"

[[product.retention.point]]
text_zh = "对象一：请求正文。Vercel 网关层声明不保留、请求完成后立即永久删除（这一句只覆盖网关自己那一跳，不覆盖上游）"

[[product.retention.point]]
text_zh = "上游 provider 侧无期限承诺，由各家条款决定，开启 ZDR 时由 provider 在请求后删除。对象二：Vercel 侧日志/追踪，只含元数据不含正文，观测数据保留期 Hobby 12h / Pro 1d / Enterprise 3d（Plus 30 天）。对象三：provider 级 prompt cache，Anthropic 默认 5 分钟、可请求 1 小时。例外：claude-fable-5 保留 30 天"

[[product.retention.point]]
text_zh = "abuse/safety 标记请求按 provider 政策保留且可能不在所钉区域"

[[product.retention.point]]
text_zh = "被 provider 排除的模型/功能开启 ZDR 也不报错。合同层：DPA §12.1 终止后 within a commercially reasonable timeframe 删除，§12.2 法律要求时可保留。"

[[product.retention.point]]
text = "The AI Gateway contract itself only gives permission, not a period: on termination Vercel may destroy Customer Content, subject to applicable law. That is weaker than the DPA §12.1 deletion triggered by termination."
text_zh = "网关档自己的合同层（AIPT §11.3）：终止后 Vercel「may destroy Customer Content」，只给销毁的许可、不给期限，与 DPA §12.1 的「终止触发删除」不是一回事（AIPT 与 Terms 冲突时就 AI Products and Services 以 AIPT 为准）。"
anchor = "vercel-aipt-11-3-termination-may-destroy"

[[product.retention.point]]
text = "Scope limit: Input must not contain sensitive personal information, so such content sits outside the assumptions the AI Products and Services make about Customer Content."
text_zh = "适用范围限制：Input 里不得包含敏感个人信息（AIPT §3.4），这类内容不在 AI Products and Services 对 Customer Content 的承诺假设内。"
anchor = "vercel-aipt-3-4-no-sensitive-personal-information"

[product.processing_region]
codes = ["GLOBAL", "US", "EU"]
anchor = "vercel-gateway-region-not-pinned-at-gateway"

[[product.processing_region.point]]
text_zh = "默认 global，不钉区域，可能落在用户司法辖区之外"

[[product.processing_region.point]]
text_zh = "可按请求 pin 到 us 或 eu（仅这两个），钉不住则 400 失败、不回退"

[[product.processing_region.point]]
text_zh = "BYOK 同样受 inferenceRegion 约束。网关自身的终止与处理不受 pin 约束（可在任意 Vercel 区域）。合同层声明 AI Products and Services 在美国控制与运营（AI Product Terms §12），DPA §13.1 主要处理设施在美国但允许全球转移"

[[product.processing_region.point]]
text = "DPA §7.2 points the subprocessor list (with functions and locations) at the trust center. The 2026-08-21 update there adds SpaceXAI LLC (fka xAI) and updates Fireworks AI / Baseten Labs Inc / Cerebras Systems Inc / Groq LLC to \"Generative AI services and AI model inference services\". This round's snapshot has only the \"## Subprocessors\" heading with no table, so locations are not re-verified here."
text_zh = "DPA §7.2 把 subprocessor 清单（含职能与所在地）指向 trust center；2026-08-21 更新新增 SpaceXAI LLC (fka xAI)、并把 Fireworks AI / Baseten Labs Inc / Cerebras Systems Inc / Groq LLC 的职能更新为 generative AI 与 model inference 服务。本轮快照只有「## Subprocessors」标题、表格内容缺失，所在地未复核（该锚点只证明职能，不证明所在地）。"
anchor = "vercel-trust-subprocessor-fireworks-function"

[product.role]
kind = "processor"
anchor = "vercel-dpa-4-1-vercel-as-processor"

[[product.role.point]]
text_zh = "Pro/Enterprise：Vercel 对客户内容为 processor（DPA §4.1）"

[[product.role.point]]
text_zh = "Hobby 无 DPA，Vercel 依隐私政策以 controller 身份处理。服务生成数据/日志为 controller 身份（DPA §4.b）。上游跳：§8.1 / §14 把数据交换归第三方条款、Vercel 不负责，同时 trust center 又把上游列为自己 subprocessor——两层并列，不调和。"

