[[source]]
url = "https://security.vercel.com"
fetch = "jina"
channel = "contract"
tier = "core"
note = "Vercel Trust Center 首页，该页是 DPA §7.2 明文指定的 subprocessor 清单落点（「including their functions and locations, is available at https://security.vercel.com」），因此按并入的合同文件对待。该页的 Subprocessors 区已改成客户端渲染的搜索式 UI：页面上只剩「Search by subprocessor name or information」一句，公司/职能/所在地三列按需在浏览器里加载；jina 抓回的正文本轮只剩「## Subprocessors」标题、没有表格行，所以 subprocessor 所在地本轮不可复核（2026-09-27 的上一轮快照曾抓到该三列表格：AI 服务行与云/托管行所在地均记 United States，非美国条目只有 Tinybird（Spain，analytics）与 Plain（United Kingdom，customer support））。要让清单重新进入快照，需要重新校准 fetch（该页客户端渲染，可能得改用 browser）。快照内本轮可逐字引用的是 2026-08-21「Subprocessor Update」公告：新增 SpaceXAI LLC (fka xAI)「to provide Generative AI services」；Baseten Labs Inc / Cerebras Systems Inc / Fireworks AI / Groq LLC 更新描述为「to provide Generative AI services and AI model inference services」；另有 v0 侧新增 Cerebras Systems Inc. / Baseten Labs Inc. / Invisible Tools Inc. (dba Raindrop.ai) 与 Groq, Inc.。"

[[source]]
url = "https://vercel.com/docs/ai-gateway/security-and-compliance/disallow-prompt-training"
channel = "developer_data"
tier = "core"
note = "Disallow Prompt Training 页。Vercel 自己的承诺在「Vercel」小节；上游 provider 是否训练取决于是否开启 disallowPromptTraining（默认关闭）。开启方式有两条：team-wide（Pro/Enterprise 团队及已购买 AI Gateway credits 的团队，在 Dashboard 打开）或 per-request（providerOptions），两者 OR，都免费。未知 provider 一律按「会训练」处理并在开启过滤时被排除；BYOK 请求不受该过滤约束，但回落到 Vercel 自己的 provider keys 的 failover 请求仍遵守该过滤。页面明确 disallow prompt training 与 ZDR 是两个独立控制（不再声称 ZDR 蕴含不训练）。是 training 维度的开发者文档层主来源。"

[[source]]
url = "https://vercel.com/docs/ai-gateway/security-and-compliance/regional-inference"
channel = "developer_data"
tier = "core"
note = "Regional Inference 页。给出网关档处理地的实际行为：默认 global（不钉区域、可能落在用户司法辖区之外）、可按请求或 team-wide 钉到 us/eu/au/jp、钉不住就 400 失败不回退；regional hosting（beta）另可把 EU/US 的区域端点作为网关接收与解密请求的位置，与 inferenceRegion 分离。gateway 自身运行的 search/fetch 工具不受区域 pin 约束；abuse/safety 标记请求可能落在所钉区域之外。并明确上游 provider 的保留期由各家条款决定。是 processing_region 与 retention（上游跳）的关键来源。"

[[source]]
url = "https://vercel.com/docs/ai-gateway/security-and-compliance/zdr"
channel = "developer_data"
tier = "core"
note = "AI Gateway ZDR 页。覆盖网关档的 ZDR：可用档位（Pro/Enterprise 团队，以及已购买 AI Gateway credits 的团队；Hobby 与 Pro 试用需先买 credits；Token Pass 有效期内可用 per-request ZDR）、team-wide 与 per-request 两种开启方式、默认路由行为、未知 provider 的处理、BYOK 排除与标记、provider 白名单与 Notes 列（当前含 Anthropic/OpenAI/Meta/xAI 等逐家排除项，Meta 行 No prompt training 与 ZDR 均为 ✓）。关键口径：ZDR 与 disallow prompt training 是两个独立控制；ZDR 按 model/provider 生效，被排除的模型会让请求跳过或失败、batch/异步视频在提交时拒绝、provider 自己运行的工具不受 ZDR 覆盖、provider 级 prompt cache 最长 24 小时且 Vercel 不计为保留；Claude Fable 系列在任何 provider 上都不支持 ZDR，Anthropic 保留 prompts/completions 30 天用于滥用审查、不用于训练。是 zdr 维度的主来源。"

[[source]]
url = "https://vercel.com/legal/ai-product-terms"
channel = "contract"
tier = "core"
note = "《Vercel AI Product Terms》(Last Updated 2026-03-17，Effective 2026-03-31)。这是 AI Gateway 的专用合同：§1.1 把 AI Gateway 明确列入「AI Products and Services」定义（与 v0 并列），§1.3 定义 Customer Content = Input(s) + Output(s)，§1.4 定义 Input 含 prompts。第 8 节整节是 AI Gateway 附加条款，是回答「Vercel 的承诺覆盖到哪一跳」的核心文件：§8.1 把上游 provider 定为 Non-Vercel Services、其数据受第三方条款约束；§8.2.1 Stealth Models 例外；§8.4.1 Enterprise 订阅的「不训练」保证（措辞只覆盖 Vercel 自己的 AI Products and Services，不覆盖上游模型）。第 12 节给出合同层处理地（美国）。生效顺序：正文第 12 行规定 AI Product Terms 与 Terms 冲突时，就 AI Products and Services 与 Customer Content 以 AI Product Terms 为准。"

[[source]]
url = "https://vercel.com/legal/dpa"
channel = "contract"
tier = "core"
note = "《Data Processing Addendum》。适用范围自述为「forms part of Vercel Enterprise Terms and Conditions or other agreement executed between Vercel and Customer for Vercel's provision of Services on an Enterprise plan」，且「applies to Vercel's Processing of Personal Data as a Processor under the Agreement for Customers who are on Enterprise and Pro plans」——即只覆盖 Enterprise 与 Pro 两档。§4.1 定角色（Vercel = Processor）；§4.b 把 Service-Generated Data 与 Contact Data 划为 Vercel 以 controller 身份处理；§7.2 指明 subprocessor 清单（含职能与所在地）落在 security.vercel.com；§12 终止后删除；§13.1 主要处理设施在美国；Schedule 1 §3 是保留期限条款。"

[[source]]
url = "https://vercel.com/legal/terms"
channel = "contract"
tier = "core"
note = "《Vercel Terms of Service》(Last Updated October 19, 2026)。平台层主合同，覆盖包括 AI Gateway 在内的全部 Services。§3「Your Content」第 3 段是按套餐分档的 Model Training 条款：Hobby 与 trial Pro 默认授权 Vercel 用 Your Content 训练自己的模型并与第三方共享；付费 Pro 默认关闭、可 opt-in；可随时在 Team 设置里退出或升级 Enterprise。平台档证据现在位于 §11.1（角色：按数据类型二分 controller/processor，并并入 DPA 与隐私政策）、§11.4（System Data 归 Vercel 所有、可用于任何商业目的、未设期限）与 §19.3（Effect of Termination：终止后 14 个日历日内销毁/返还 Proprietary Information）；2026-10-19 版把这几个条款重新编号、§11.1 的 DPA 引用加了 vercel.com/legal/dpa 链接，并删除 Schedule I、改由引言里的 Service Terms 指向额外条款。页面 TOC 与正文标题编号有出入，引用一律按正文标题。Enterprise Terms 未登记、本轮未核，文件里不引它。"

[[product]]
id = "gateway"
badge = "AI Gateway"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "vercel-aipt-6-2-hobby-pro-your-content-license"
mode = "opt_out"

[[product.training.point]]
text_zh = "Hobby 与 trial Pro：网关 Customer Content 按 §6.2 并入 ToS §3 的许可，而 ToS §3 对这两档默认授权训练并与第三方共享 → permitted"

[[product.training.point]]
text_zh = "付费 Pro：ToS §3「Model Training is not enabled by default and you may opt in」→ 默认 not_permitted，可 opt-in"

[[product.training.point]]
text_zh = "Enterprise：§8.4.1 明文保证「shall not use AI Gateway Customer Content to train or improve the AI Products and Services」，但措辞不含上游 provider 的模型。上游跳：§8.1 / §14 归第三方条款，Vercel 默认不过滤（disallowPromptTraining 非默认），未知 provider 按「会训练」处理"

[[product.training.point]]
text_zh = "Stealth Models 例外允许上游训练（§8.2.1）。开发者文档另称「AI Gateway does not use your prompts or responses for training purposes」，与合同的按档许可并存，不取平均。"

[[product.training.point]]
text = "Boundary of disallowPromptTraining: BYOK requests are exempt from the filter, but a failover request that falls back to Vercel's provider keys is still filtered."
text_zh = "disallowPromptTraining 的边界：BYOK 请求不受该过滤约束，但回落到 Vercel 自己的 provider keys 的 failover 请求仍遵守该过滤。"
anchor = "vercel-gateway-dpt-byok-failover-still-filtered"

[[product.training.point]]
text = "No training on prompt data is available to all AI Gateway users at no extra charge; it can be enforced team-wide (Pro and Enterprise teams, or teams that have purchased credits) or per request, and neither method is on by default."
text_zh = "对 prompt 数据不训练的控制对所有 AI Gateway 用户免费开放：可 team-wide（Pro/Enterprise 团队，或已购买 credits 的团队）或 per-request 开启；两种方式默认都不开启，所以上游跳默认仍不过滤。"
anchor = "vercel-gateway-dpt-available-to-all-users"

[[product.training.point]]
text = "ZDR and disallow prompt training are separate controls: enabling one does not enable the other, and ZDR no longer implies that a provider disallows prompt training."
text_zh = "ZDR 与 disallow prompt training 是两个独立控制：开一个不会开另一个；旧版「ZDR 是 disallow prompt training 的超集 / 所有 ZDR provider 都不训练」的说法已从两页删除，不再作为 training 的依据。"
anchor = "vercel-gateway-dpt-separate-from-zdr"

[[product.training.point]]
text = "Default routing ignores the training policy of providers; a provider with no known stance is assumed to train, and is skipped only when disallow prompt training is enabled for the request."
text_zh = "默认路由不看 provider 的训练政策；stance 未知的 provider 一律按「会训练」处理，只有请求开启 disallowPromptTraining 时才排除。"
anchor = "vercel-gateway-dpt-not-routed-by-policy-by-default"

[[product.training.point]]
text = "Scope limit: Input must not contain sensitive personal information, so such content sits outside the assumptions the AI Products and Services make about Customer Content."
text_zh = "适用范围限制：Input 里不得包含敏感个人信息（AIPT §3.4），这类内容不在 AI Products and Services 对 Customer Content 的承诺假设内。"
anchor = "vercel-aipt-3-4-no-sensitive-personal-information"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "vercel-gateway-zdr-availability-paid-teams"

[[product.zdr.point]]
text = "ZDR is available on AI Gateway for Pro and Enterprise teams and for any team that has purchased AI Gateway credits; Hobby teams and Pro trials can use it only after buying credits, and an active Token Pass allows per-request ZDR."
text_zh = "Pro/Enterprise 团队，以及已购买 AI Gateway credits 的团队可用；Hobby 与 Pro 试用需先买 credits（免费 credits 不算）；Token Pass 有效期内可用 per-request ZDR，但 team-wide 仍要求付费档或 credits。"
anchor = "vercel-gateway-zdr-availability-paid-teams"

[[product.zdr.point]]
text_zh = "team-wide（$0.10 / 1,000 请求）或 per-request `zeroDataRetention: true`，二者 OR；只对有 ZDR 协议的 provider 生效"

[[product.zdr.point]]
text_zh = "未知/未签约 provider 在开启 ZDR 时被排除在路由外"

[[product.zdr.point]]
text_zh = "默认不按保留政策路由。BYOK 默认被排除，需手工标记为 ZDR-compliant。"

[[product.zdr.point]]
text = "ZDR applies per model and per provider; a listed provider may exclude specific models, tools, or request types. AI Gateway skips a provider that lacks ZDR for the model, fails when no provider remains or the model retains data everywhere, rejects batch and asynchronous video jobs at submission, and does not block requests that use a provider-run tool or a short-lived prompt cache."
text_zh = "ZDR 按 model/provider 生效：列在表里的 provider 仍可排除某些模型、工具或请求类型。缺少 ZDR 的 provider 被跳过；无 provider 可用或模型在所有 provider 都保留数据时请求失败；batch 与异步视频在提交时拒绝；provider 自己运行的工具与短生命期 prompt cache 不阻断请求。旧版「被 provider 排除的模型/功能开启 ZDR 也不报错」不再成立。"
anchor = "vercel-gateway-zdr-scope-case-table"

[[product.zdr.point]]
text = "ZDR covers which provider serves the model request; it does not extend to tools that the provider runs, such as web search or grounding. A separate service may run those tools and keep the data under its own retention policy."
text_zh = "ZDR 只覆盖由哪个 provider 服务模型请求，不延伸到 provider 自己运行的工具（如 web search / grounding）；这些工具可能由独立服务执行并按自己的保留政策保存数据。"
anchor = "vercel-gateway-zdr-provider-tools-outside"

[[product.zdr.point]]
text = "When prompt caching is used, the provider holds a representation of the prompt for the cache lifetime, which can be up to 24 hours; AI Gateway does not count this short-lived cache as retaining data."
text_zh = "provider 级 prompt cache：为命中缓存，provider 会在缓存生命期内保留 prompt 的表示，最长可达 24 小时；Vercel 不把这段短生命期缓存算作保留数据，若采购方的零保留定义排除缓存，需另看 provider 政策。"
anchor = "vercel-gateway-zdr-prompt-cache-up-to-24-hours"

[[product.zdr.point]]
text = "ZDR and disallow prompt training are separate controls; a ZDR provider is not automatically a no-training provider."
text_zh = "ZDR 与 disallow prompt training 是两个独立控制；ZDR provider 不自动等于不训练 provider。表内当前所有 ZDR provider 的 No prompt training 列也都是 ✓，但这是两列事实，不能互相推导。"
anchor = "vercel-gateway-zdr-separate-from-prompt-training"

[[product.zdr.point]]
text = "Claude Fable models do not support ZDR on any provider; Anthropic retains prompts and completions for 30 days and does not use them to train Claude."
text_zh = "例外：Claude Fable 系列在任何 provider（含 Anthropic、Google Vertex、Amazon Bedrock）上都不支持 ZDR；Anthropic 会保留 prompts/completions 30 天用于跨请求的滥用审查，不用于训练 Claude。"
anchor = "vercel-gateway-zdr-claude-fable-30-day-exception"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "vercel-gateway-region-provider-terms-govern-retention"

[[product.retention.point]]
text = "This verdict covers the whole chain: Vercel's own gateway hop deletes the prompts and responses in a request immediately after the request is completed when ZDR is on, while the upstream provider hop is governed by each provider's own terms and carries no retention-period commitment. \"Undisclosed\" refers to the upstream hop, not to Vercel's own deletion promise."
text_zh = "本维度记的是全链：网关跳（Vercel 自己）在开启 ZDR 时于请求完成后立即永久删除请求里的 prompts / responses；上游 provider 跳的保留期由各家条款决定、没有期限承诺——「未公布」指的是上游那一跳，不是 Vercel 自己的删除承诺。"
anchor = "vercel-gateway-zdr-no-retention-of-prompts-outputs"

[[product.retention.point]]
text = "AI Gateway does record request metadata for billing, observability, and debugging, such as the model, provider, token usage, cost, and duration; this page does not state a retention period for that metadata."
text_zh = "Vercel 侧另记请求元数据用于计费、可观测性与调试（model、provider、token usage、cost、duration），这些元数据不含正文，但本页没有给保留期限。"
anchor = "vercel-gateway-zdr-metadata-recorded"

[[product.retention.point]]
text = "By default AI Gateway does not route based on the data retention policy of providers, so unless ZDR is enabled a request can land on a provider with no retention commitment at all."
text_zh = "默认不按保留政策路由：未开启 ZDR 时请求可能落到没有任何保留承诺的 provider 上。"
anchor = "vercel-gateway-zdr-not-routed-by-policy-by-default"

[[product.retention.point]]
text_zh = "对象一：请求正文。Vercel 网关层声明不保留、请求完成后立即永久删除（这一句只覆盖网关自己那一跳，不覆盖上游）"

[[product.retention.point]]
text_zh = "上游 provider 侧无期限承诺，由各家条款决定，开启 ZDR 时由 provider 在请求后删除；表内 Notes 另给逐家例外，例如 Anthropic 保留 prompts/outputs 30 天、container data 最长 30 天，OpenAI 对标记的 CSAM 图片保留人工审查，Meta 在法律要求或处理滥用时可保留。对象二：Vercel 侧日志/追踪只含元数据不含正文，观测数据保留期 Hobby 12h / Pro 1d / Enterprise 3d（Plus 30 天）。对象三：provider 级 prompt cache，最长 24 小时。例外：Claude Fable 系列保留 30 天"

[[product.retention.point]]
text_zh = "abuse/safety 标记请求按 provider 政策保留且可能不在所钉区域；provider 自己运行的工具（web search / grounding）也按独立服务的条款保留，不受 ZDR 覆盖"

[[product.retention.point]]
text = "ZDR exclusions now change the outcome instead of being silently tolerated: a provider without ZDR for the model is skipped, the request fails when no provider remains or the model retains data everywhere, and batch / asynchronous video jobs are rejected at submission. Batch inputs and results are stored for the lifetime of the batch."
text_zh = "被 provider 排除的模型/功能不再一律「不报错」：缺 ZDR 的 provider 被跳过，无 provider 可用或模型普遍保留时请求失败，batch 与异步视频在提交时拒绝（batch 的输入与结果在 batch 生命周期内由 provider 保存）。合同层：DPA §12.1 终止后 within a commercially reasonable timeframe 删除，§12.2 法律要求时可保留。"
anchor = "vercel-gateway-zdr-scope-exclusions-some-fail"

[[product.retention.point]]
text = "The AI Gateway contract itself only gives permission, not a period: on termination Vercel may destroy Customer Content, subject to applicable law. That is weaker than the DPA §12.1 deletion triggered by termination."
text_zh = "网关档自己的合同层（AIPT §11.3）：终止后 Vercel「may destroy Customer Content」，只给销毁的许可、不给期限，与 DPA §12.1 的「终止触发删除」不是一回事（AIPT 与 Terms 冲突时就 AI Products and Services 以 AIPT 为准）。"
anchor = "vercel-aipt-11-3-termination-may-destroy"

[[product.retention.point]]
text = "Scope limit: Input must not contain sensitive personal information, so such content sits outside the assumptions the AI Products and Services make about Customer Content."
text_zh = "适用范围限制：Input 里不得包含敏感个人信息（AIPT §3.4），这类内容不在 AI Products and Services 对 Customer Content 的承诺假设内。"
anchor = "vercel-aipt-3-4-no-sensitive-personal-information"

[product.processing_region]
codes = ["GLOBAL", "US", "EU", "AU", "JP"]
anchor = "vercel-gateway-region-not-pinned-at-gateway"

[[product.processing_region.point]]
text = "The default (no inferenceRegion) is global, which means AI Gateway picks whichever region can serve the model, based on availability and latency; it can resolve to a different region on each request, and that region may be outside your users' jurisdiction."
text_zh = "默认 global：AI Gateway 按可用性与延迟挑能服务该模型的区域，每次请求可能不同，可能落在用户司法辖区之外。"
anchor = "vercel-gateway-region-default-global"

[[product.processing_region.point]]
text = "Inference can be pinned per request or team-wide to us, eu, au, or jp; a region AI Gateway cannot honor fails with HTTP 400 instead of silently falling back outside the pin."
text_zh = "可按请求或 team-wide 把推理 pin 到 us/eu/au/jp（team-wide 仅 Pro/Enterprise）；钉不住则 400 失败，不回退到 pin 之外。"
anchor = "vercel-gateway-region-options-us-eu-au-jp"

[[product.processing_region.point]]
text = "inferenceRegion pins where the provider runs inference and stores data at rest, not where the request reaches AI Gateway; regional hosting (beta) adds EU and US endpoints that receive and decrypt the request in that region, with AU/JP available for inference pinning only."
text_zh = "inferenceRegion 钉的是 provider 推理与静态存储的位置，不钉请求进入 AI Gateway 的位置；regional hosting（beta）另提供 EU/US 区域端点，在该区域接收并解密请求，AU/JP 只能钉推理。两者是独立设置，可单独或同时使用。"
anchor = "vercel-gateway-region-regional-hosting-eu-us"

[[product.processing_region.point]]
text_zh = "BYOK 同样受 inferenceRegion 约束。合同层声明 AI Products and Services 在美国控制与运营（AI Product Terms §12），DPA §13.1 主要处理设施在美国但允许全球转移"

[[product.processing_region.point]]
text = "Tools that AI Gateway runs are not pinned: search queries built from the prompt can leave the pinned region because the tool vendor's API runs wherever the vendor operates."
text_zh = "AI Gateway 自己运行的工具（Perplexity Search / Exa Search / Parallel Search 等）不受区域 pin 约束，由 prompt 构造的搜索词可能离开所钉区域。"
anchor = "vercel-gateway-region-tools-not-pinned"

[[product.processing_region.point]]
text_zh = "abuse/safety 标记请求按 provider 政策保留且可能不在所钉区域"
anchor = "vercel-gateway-region-abuse-safety-retention"

[[product.processing_region.point]]
text = "DPA §7.2 points the subprocessor list (with functions and locations) at the trust center. The trust center's Subprocessors section is now a client-side search UI: the current snapshot contains only the heading, not the table rows, so this round does not re-verify individual subprocessor locations."
text_zh = "DPA §7.2 把 subprocessor 清单（含职能与所在地）指向 trust center；但该页的 Subprocessors 区已改为客户端渲染的搜索式 UI，本轮快照只剩标题、没有表格行，本轮不重新核对各家 subprocessor 的具体所在地。"
anchor = "vercel-dpa-7-2-subprocessor-list-locations"

[[product.processing_region.point]]
