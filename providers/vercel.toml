text_zh = "同一页 2026-08-21 的「Subprocessor Update」新增 SpaceXAI LLC (fka xAI)，并把 Fireworks AI / Baseten Labs Inc / Cerebras Systems Inc / Groq LLC 的职能更新为 generative AI 与 model inference 服务。"
