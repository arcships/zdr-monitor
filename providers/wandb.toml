[[product.retention.point]]
text = "The same 7-day post-deletion recovery window and DPA retention clauses as the paid SaaS tier"
text_zh = "与付费 SaaS 档相同的删除后 7 天恢复窗口与 DPA 保留条款"

[[product.retention.point]]
text = "The differences are quota and storage location: the Free tier has only shared storage, 5 GB/mo of storage and 1 GB/mo of Weave ingestion (pricing page), beyond which an upgrade or purchase is required. Note the other side: §2(e) permits free/academic data to be used for testing and development, which means such data is retained and used within the contractually permitted purposes, but the vendor gives no separate retention period for that use."
text_zh = "差别在额度与存储位置：Free 档只有共享存储、5 GB/mo 存储与 1 GB/mo Weave 摄入（定价页），超过限额需升级或购买。反向注意：§2(e) 允许 free/academic 数据用于 testing and development，意味着这些数据在合同允许的用途下被留存与使用，但官方未给该用途下的独立保留期。"

[[product.retention.point]]
text = "Same DPA §9 exception as the paid SaaS tier: \"This requirement shall not apply to the extent Company is required by any applicable law to retain some or all of the Personal Data, or to Personal Data it has archived on back-up systems, which Personal Data Company shall securely isolate and protect from any further processing and eventually delete in accordance with Company's deletion policies.\" Personal Data that a law requires Company to keep, and Personal Data in back-up archives, are outside the return/deletion commitment; for backups the promise is only isolation plus eventual deletion, with no period."
text_zh = "与付费 SaaS 档同一条 DPA §9 例外：「This requirement shall not apply to the extent Company is required by any applicable law to retain some or all of the Personal Data, or to Personal Data it has archived on back-up systems, which Personal Data Company shall securely isolate and protect from any further processing and eventually delete in accordance with Company’s deletion policies.」法律要求保留的 Personal Data 与备份归档中的 Personal Data 不在返还/删除承诺范围内；备份项下只承诺隔离保护与「最终删除」，没有期限。"
anchor = "dpa-9-exceptions-law-and-backups"

[[product.retention.point]]
text = "The DPA outlives the Agreement on this tier too: \"This DPA will remain in effect so long as Company Processes Personal Data, notwithstanding the expiration or termination of the Agreement.\""
text_zh = "本档同样适用 DPA 的存续条款：「This DPA will remain in effect so long as Company Processes Personal Data, notwithstanding the expiration or termination of the Agreement.」"
