[[product.zdr.point]]
text = "None of this vendor's documents (MSA, AI Terms, DPA including Schedules 1-4 and the security annex, BAA, the Security page and Subprocessors table, the current privacy policy, the pricing page, the legal-home index, Support Policy, SLA, the inference / hosting / weave pages on docs.wandb.ai, and the site-wide llms.txt index), nor the TOS / DPA / Privacy / Trust Center of CoreWeave in the same group, contains a zero data retention (ZDR) commitment, switch or application method. The closest wording is deletion on request: DPA Annex II \"deletes customer data within 30 days of a customer requesting deletion\", the return or deletion in DPA §9, and deletion after termination under MSA §6(d) — all deletion-triggered, not zero retention by default, and not a ZDR tier that can be enabled. The single hit from the automated scan, \"not retain, use or disclose any personal information...\" (DPA Schedule 4, CCPA), is the boilerplate service-provider purpose limitation, which syntactically even allows retention in order to perform the contract, and cannot serve as ZDR evidence (the old record identified this and this round's re-check keeps it). Observations pointing the other way (not equivalent to the vendor not offering ZDR): (1) the inference prefix cache reuses the KV cache across requests on shared infrastructure by default, with only cache_salt available to isolate it"
text_zh = "全部本家文档（MSA、AI Terms、DPA 含 Schedule 1-4 与安全附录、BAA、Security 页与 Subprocessors 表、现行隐私政策、定价页、legal-home 索引、Support Policy、SLA、docs.wandb.ai 的 inference / hosting / weave 页、llms.txt 全站索引）以及同集团 CoreWeave 的 TOS / DPA / Privacy / Trust Center，均无零保留（ZDR）承诺、开关或申请方式。最接近的表述是「应请求删除」：DPA Annex II「deletes customer data within 30 days of a customer requesting deletion」、DPA §9 的返还或删除、MSA §6(d) 终止后删除——都是删除触发型，不是默认零保留，也不是可开通的 ZDR 档。自动扫描唯一命中的「not retain, use or disclose any personal information...」（DPA Schedule 4 CCPA）是服务提供者用途限制模板句，句法上甚至允许为履约而保留，不能当 ZDR 证据（旧记录已识别此点，本轮复核维持）。反向观察（不等于厂商不提供 ZDR）：(1) 推理前缀缓存默认在共享基础设施上跨请求复用 KV cache，仅 cache_salt 可隔离"

[[product.zdr.point]]
text = "(2) LLM inputs and outputs logged in Weave are expressly counted towards \"long term storage\""
text_zh = "(2) Weave 中记录的 LLM inputs/outputs 被明确计入「long term storage」"

[[product.zdr.point]]
text = "This tier's yes is architectural, hence mode = by_deployment: the data never reaches W&B unless the customer transmits it for technical support with written consent (DPA Annex I), so from the vendor's side there is nothing retained by default. It is not a vendor ZDR option or commitment — no tier has a published ZDR switch or application method (see below) — and what W&B itself still retains on this tier (license verification: the Kubernetes operator connects to deploy.wandb.ai and \"receives updates as long as the license is valid\") has no disclosed retention period."
text_zh = "本档的 ✓ 是架构性的，故 mode = by_deployment：除非客户为技术支持经书面同意把数据传输给 W&B（DPA Annex I），数据根本不会到 W&B，从厂商侧看默认没有可保留的东西。这不是厂商的 ZDR 选项或承诺——没有任何档位公开过 ZDR 开关或申请方式（见下）——而 W&B 自身在本档仍会保留的部分（license 校验：Kubernetes operator 连接 deploy.wandb.ai，且「receives updates as long as the license is valid」）没有已披露的保留期。"
anchor = "dpa-annex1-self-managed-support-only"

[[product.zdr.point]]
text = "(3) The MSA / AI Terms grant W&B broad rights to use Customer Data to improve the products and the AI Features. Recorded as not_found under the rules: not disclosed in the public documents does not mean the vendor does not offer it. Unchecked: the gated portal trust.coreweave.com (a customer account is required) was not checked. Zero retention on the self-hosted tier is controlled by the customer, and the vendor has not written it up as a ZDR commitment or option."
text_zh = "(3) MSA/AI Terms 授予 W&B 使用 Customer Data 改进产品与 AI Features 的宽泛权利。按规则记 not_found：公开文档未披露 ≠ 厂商不提供。未核项：trust.coreweave.com 门禁门户（需客户账号）未核。 自建档的零保留问题由客户自己控制，官方未把它写成 ZDR 承诺或选项。"

