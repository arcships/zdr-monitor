[[product.zdr.point]]
text = "None of this vendor's documents (MSA, AI Terms, DPA including Schedules 1-4 and the security annex, BAA, the Security page and Subprocessors table, the current privacy policy, the pricing page, the legal-home index, Support Policy, SLA, the inference / hosting / weave pages on docs.wandb.ai, and the site-wide llms.txt index), nor the TOS / DPA / Privacy / Trust Center of CoreWeave in the same group, contains a zero data retention (ZDR) commitment, switch or application method. The closest wording is deletion on request: DPA Annex II \"deletes customer data within 30 days of a customer requesting deletion\", the return or deletion in DPA §9, and deletion after termination under MSA §6(d) — all deletion-triggered, not zero retention by default, and not a ZDR tier that can be enabled. The single hit from the automated scan, \"not retain, use or disclose any personal information...\" (DPA Schedule 4, CCPA), is the boilerplate service-provider purpose limitation, which syntactically even allows retention in order to perform the contract, and cannot serve as ZDR evidence (the old record identified this and this round's re-check keeps it). Observations pointing the other way (not equivalent to the vendor not offering ZDR): (1) the inference prefix cache reuses the KV cache across requests on shared infrastructure by default, with only cache_salt available to isolate it"
text_zh = "全部本家文档（MSA、AI Terms、DPA 含 Schedule 1-4 与安全附录、BAA、Security 页与 Subprocessors 表、现行隐私政策、定价页、legal-home 索引、Support Policy、SLA、docs.wandb.ai 的 inference / hosting / weave 页、llms.txt 全站索引）以及同集团 CoreWeave 的 TOS / DPA / Privacy / Trust Center，均无零保留（ZDR）承诺、开关或申请方式。最接近的表述是「应请求删除」：DPA Annex II「deletes customer data within 30 days of a customer requesting deletion」、DPA §9 的返还或删除、MSA §6(d) 终止后删除——都是删除触发型，不是默认零保留，也不是可开通的 ZDR 档。自动扫描唯一命中的「not retain, use or disclose any personal information...」（DPA Schedule 4 CCPA）是服务提供者用途限制模板句，句法上甚至允许为履约而保留，不能当 ZDR 证据（旧记录已识别此点，本轮复核维持）。反向观察（不等于厂商不提供 ZDR）：(1) 推理前缀缓存默认在共享基础设施上跨请求复用 KV cache，仅 cache_salt 可隔离"

[[product.zdr.point]]
text = "(2) LLM inputs and outputs logged in Weave are expressly counted towards \"long term storage\""
text_zh = "(2) Weave 中记录的 LLM inputs/outputs 被明确计入「long term storage」"

[[product.zdr.point]]
text = "(3) The MSA / AI Terms grant W&B broad rights to use Customer Data to improve the products and the AI Features. Recorded as not_found under the rules: not disclosed in the public documents does not mean the vendor does not offer it. Unchecked: the gated portal trust.coreweave.com (a customer account is required) was not checked."
text_zh = "(3) MSA/AI Terms 授予 W&B 使用 Customer Data 改进产品与 AI Features 的宽泛权利。按规则记 not_found：公开文档未披露 ≠ 厂商不提供。未核项：trust.coreweave.com 门禁门户（需客户账号）未核。"

[product.retention]
days = 7
object = "mixed"
basis = "fixed_period"
anchor = "mtc-retention-7-days-after-deletion"

[[product.retention.point]]
text = "Split by object: (a) Runs and history, non-artifact run files (media/config/log), artifacts and artifact references — kept for 7 days after deletion, recoverable within that window and purged afterwards (Multi-tenant Cloud documentation; the Artifacts documentation says the same). (b) Weave trace data (LLM inputs and outputs included) sits in a shared ClickHouse Cloud cluster and is expressly counted towards long term storage by the pricing FAQ, with no retention period in days; deletion goes through the Call delete API/UI. (c) Personal Data: DPA Annex I for the term of the contract + deletion within 30 days of a request (Annex II) + daily backups under the Backup Policy (not public). (d) Free/Pro data is entirely in shared storage; Enterprise can use BYOB (customer-controlled storage). There is no request-level commitment of the \"request content deleted after X days\" kind."
text_zh = "对象拆开：(a) Runs and history、非 artifact run 文件（media/config/log）、artifacts 与 artifact references —— 删除后保留 7 天、期内可恢复，之后清除（Multi-tenant Cloud 文档；Artifacts 文档同口径）。(b) Weave 的 trace 数据（含 LLM inputs/outputs）存于共享 ClickHouse Cloud 集群，定价 FAQ 明确计入 long term storage，未给保留天数，删除需走 Call delete API/UI。(c) Personal Data：DPA Annex I 合同存续期 + 应请求 30 天内删除（Annex II）+ 每日备份按 Backup Policy（不公开）。(d) Free/Pro 档数据全部在共享存储，Enterprise 可 BYOB（自控存储）。没有「请求内容 X 天后删除」这类请求级承诺。"

[[product.retention.point]]
text = "Exception to the deletion commitment (DPA §9): \"This requirement shall not apply to the extent Company is required by any applicable law to retain some or all of the Personal Data, or to Personal Data it has archived on back-up systems, which Personal Data Company shall securely isolate and protect from any further processing and eventually delete in accordance with Company's deletion policies.\" Personal Data that a law requires Company to keep, and Personal Data in back-up archives, are therefore outside the return/deletion commitment; for backups the promise is only isolation plus eventual deletion, with no period, and the Backup Policy itself is not public."
text_zh = "删除承诺的例外（DPA §9）：「This requirement shall not apply to the extent Company is required by any applicable law to retain some or all of the Personal Data, or to Personal Data it has archived on back-up systems, which Personal Data Company shall securely isolate and protect from any further processing and eventually delete in accordance with Company’s deletion policies.」即法律要求保留的 Personal Data 与备份归档中的 Personal Data 不在返还/删除承诺范围内；备份项下只承诺隔离保护与「最终删除」，没有期限，且 Backup Policy 本身不公开。"
anchor = "dpa-9-exceptions-law-and-backups"

[[product.retention.point]]
text = "The DPA outlives the Agreement: \"This DPA will remain in effect so long as Company Processes Personal Data, notwithstanding the expiration or termination of the Agreement.\" It runs in parallel with the deletion-within-30-days rules — Personal Data still Processed under a legal retention requirement or held in back-up archives keeps the DPA in force."
text_zh = "DPA 不随协议终止而失效：「This DPA will remain in effect so long as Company Processes Personal Data, notwithstanding the expiration or termination of the Agreement.」它与「应请求 30 天内删除」并行——只要 Personal Data 仍被处理（法律要求保留或存于备份归档中），DPA 就继续有效。"
anchor = "dpa-2-duration-notwithstanding-termination"

