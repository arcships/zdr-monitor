text_zh = "全部本家文档（MSA、AI Terms、DPA 含 Schedule 1-4 与安全附录、BAA、Security 页与 Subprocessors 表、现行隐私政策、定价页、legal-home 索引、Support Policy、SLA、docs.wandb.ai 的 inference / hosting / weave 页、llms.txt 全站索引）以及同集团 CoreWeave 的 TOS / DPA / Privacy / Trust Center，均无零保留（ZDR）承诺、开关或申请方式。最接近的表述是「应请求删除」：DPA Annex II「deletes customer data within 30 days of a customer requesting deletion」、DPA §9 的返还或删除、MSA §6(d) 终止后删除——都是删除触发型，不是默认零保留，也不是可开通的 ZDR 档。自动扫描唯一命中的「not retain, use or disclose any personal information...」（DPA Schedule 4 CCPA）是服务提供者用途限制模板句，句法上甚至允许为履约而保留，不能当 ZDR 证据（旧记录已识别此点，本轮复核维持）。反向观察（不等于厂商不提供 ZDR）：(1) 推理前缀缓存默认在共享基础设施上跨请求复用 KV cache，仅 cache_salt 可隔离"

[[product.zdr.point]]
text = "(2) LLM inputs and outputs logged in Weave are expressly counted towards \"long term storage\""
text_zh = "(2) Weave 中记录的 LLM inputs/outputs 被明确计入「long term storage」"

[[product.zdr.point]]
text = "(3) The MSA / AI Terms grant W&B broad rights to use Customer Data to improve the products and the AI Features. Recorded as not_found under the rules: not disclosed in the public documents does not mean the vendor does not offer it. Unchecked: the gated portal trust.coreweave.com (a customer account is required) was not checked."
text_zh = "(3) MSA/AI Terms 授予 W&B 使用 Customer Data 改进产品与 AI Features 的宽泛权利。按规则记 not_found：公开文档未披露 ≠ 厂商不提供。未核项：trust.coreweave.com 门禁门户（需客户账号）未核。"

