[[product.training.point]]
text = "On the self-hosted tier W&B has no access to Customer Data inside the platform: the data sits in the customer's own infrastructure, and W&B touches it only during technical support with written consent (DPA Annex I). The MSA §4(a) grant to use Customer Data to improve the products is still in the contract, but its object is data \"transferred to W&B\""
text_zh = "自建档里 W&B 拿不到平台内的 Customer Data：数据在客户自有基础设施，W&B 仅在技术支持时经书面同意接触（DPA Annex I）。MSA §4(a) 的「使用 Customer Data 改进产品」授权文本仍在合同里，但其对象是「transferred to W&B」的数据"
anchor = "dpa-annex1-self-managed-support-only"

[[product.training.point]]
text = "and the self-hosted tier has no default path for transmitting platform data to W&B. Self-Managed also supports air-gapped deployment (the docs mention an air-gapped Kubernetes deployment path). The official documentation writes no separate \"no training\" commitment for the self-hosted tier — the answer on this dimension is that the data does not leave the customer's environment, not a vendor training commitment — hence mode = by_deployment rather than a default rule."
text_zh = "自建档没有向 W&B 传输平台数据的默认路径。Self-Managed 也支持 air-gapped 部署（docs 提到 air-gapped Kubernetes 部署路径）。官方文档未就自建档单独写「不训练」承诺：本档记 mark=yes 靠的是部署形态（数据不出客户环境，W&B 拿不到内容），不是厂商的训练承诺——故 mode = by_deployment。合同层的 MSA §4(a) 授权（improve / develop new product offerings）文本仍在，但对象是「transferred to W&B」的数据，作为并列事实保留。"
anchor = "msa-4a-customer-data-use-grant"

