[[product.retention.point]]
text = "Express statement on the dedicated cloud tier: by default data is kept for 7 days after deletion (Runs and history / non-artifact run files / artifacts and references), and \"you can change the data retention period for your Dedicated Cloud instance\" (the environment variable GORILLA_DATA_RETENTION_PERIOD or Helm env.dataRetentionPeriod, in hours). This is the vendor's only official statement of a configurable retention period. PHI: under the BAA, PHI must be destroyed or returned on termination. Backups follow the Backup Policy (not public). Note: what is configurable is the post-deletion recovery window, not a retention period for request content."
text_zh = "专属云档明文：默认删除后保留 7 天（Runs and history / 非 artifact run 文件 / artifacts 与 references），且「you can change the data retention period for your Dedicated Cloud instance」（环境变量 GORILLA_DATA_RETENTION_PERIOD 或 Helm env.dataRetentionPeriod，单位小时）。这是本家唯一一处「保留期可配置」的官方表述。PHI：BAA 档终止时 PHI 必须销毁或返还。备份按 Backup Policy（不公开）。注意：可配置的是删除后恢复窗口，不是「请求内容保留期」。"

[[product.retention.point]]
text = "Exception to the deletion commitment (DPA §9): \"This requirement shall not apply to the extent Company is required by any applicable law to retain some or all of the Personal Data, or to Personal Data it has archived on back-up systems, which Personal Data Company shall securely isolate and protect from any further processing and eventually delete in accordance with Company's deletion policies.\" Personal Data that a law requires Company to keep, and Personal Data in back-up archives, are therefore outside the return/deletion commitment; for backups the promise is only isolation plus eventual deletion, with no period, and the Backup Policy itself is not public."
text_zh = "删除承诺的例外（DPA §9）：「This requirement shall not apply to the extent Company is required by any applicable law to retain some or all of the Personal Data, or to Personal Data it has archived on back-up systems, which Personal Data Company shall securely isolate and protect from any further processing and eventually delete in accordance with Company’s deletion policies.」即法律要求保留的 Personal Data 与备份归档中的 Personal Data 不在返还/删除承诺范围内；备份项下只承诺隔离保护与「最终删除」，没有期限，且 Backup Policy 本身不公开。"
anchor = "dpa-9-exceptions-law-and-backups"

[[product.retention.point]]
text = "The DPA outlives the Agreement: \"This DPA will remain in effect so long as Company Processes Personal Data, notwithstanding the expiration or termination of the Agreement.\" It runs in parallel with the BAA duty to destroy or return PHI on termination and with the MSA §6(d) deletion rule — Personal Data still Processed under a legal retention requirement or held in back-up archives keeps the DPA in force."
text_zh = "DPA 不随协议终止而失效：「This DPA will remain in effect so long as Company Processes Personal Data, notwithstanding the expiration or termination of the Agreement.」它与 BAA 的「终止时 PHI 必须销毁或返还」以及 MSA §6(d) 的删除规则并行——只要 Personal Data 仍被处理（法律要求保留或存于备份归档中），DPA 就继续有效。"
anchor = "dpa-2-duration-notwithstanding-termination"

