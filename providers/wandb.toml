[product.training]
mark = "no"
anchor = "ai-terms-customer-data-use-grant"

[[product.training.point]]
text = "API tier (Serverless Inference): the contract grants a product-improvement license and never excludes model training, so under the house rule (a \"service improvement / quality\" grant counts as training) this is mark=no. Item by item: AI Terms §4 \"Customer grants W&B the right to use Customer Data to (i) provide and support the W&B Assets (including the AI Features), (ii) develop new product offerings, and (iii) improve the W&B Assets (including the AI Features), subject to any Customer configured settings, if applicable.\""
text_zh = "API 档（Serverless Inference）：合同层给的是「产品改进授权」，且全文没有把模型训练排除在外，按本仓口径（「改进服务/提高质量」类授权算训练）记 mark=no（会训练）。逐条依据：AI Terms §4「Customer grants W&B the right to use Customer Data to (i) provide and support the W&B Assets (including the AI Features), (ii) develop new product offerings, and (iii) improve the W&B Assets (including the AI Features), subject to any Customer configured settings, if applicable.」"

[[product.training.point]]
text = "The AI Terms expressly prevail over the MSA (\"In the event of a conflict between the AI Terms and the Agreement, the AI Terms will control\"). MSA §4(a) is a parallel platform-level grant (\"provide and improve the W&B Assets / develop new product offerings / providing and improving AI Features\"). Point of uncertainty about applicability: whether Serverless Inference falls within the \"AI Features\" as defined in the AI Terms (a definition covering \"third-party or open source artificial intelligence technologies\") is not stated by name in the public documentation"
text_zh = "AI Terms 明文优先于 MSA（「In the event of a conflict between the AI Terms and the Agreement, the AI Terms will control」）。MSA §4(a) 是并行的平台层授权（「provide and improve the W&B Assets / develop new product offerings / providing and improving AI Features」）。适用性不确定处：Serverless Inference 是否属于 AI Terms 定义的「AI Features」（该定义覆盖「third-party or open source artificial intelligence technologies」），公开文档未明确点名"

[[product.training.point]]
text = "If it does not, only MSA §4(a) applies and the conclusion points the same way. One further hard fact: MSA §2(e) \"W&B may use Customer Data from free and academic customers for testing and development purposes\" — data from Free and Academic customers may additionally be used for testing and development, a clause the paid tiers do not have. Upstream hop: AI Terms §1 states that Third-Party AI is not a W&B Asset and that its conduct is not governed by W&B"
text_zh = "若不属，则只有 MSA §4(a) 适用，结论方向相同。另一条硬事实：MSA §2(e)「W&B may use Customer Data from free and academic customers for testing and development purposes」——Free 与 Academic 档客户的数据可另用于 testing and development，付费档无此条。上游跳：AI Terms §1 声明 Third-Party AI 不是 W&B Assets、其行为不受 W&B 约束"

[[product.training.point]]
text = "Second improvement-use grant, independent of §4(a): MSA §4(b) \"Notwithstanding anything else to the contrary in this Agreement, W&B may collect and analyze Usage Data to develop, improve and support the W&B Assets.\" §1 defines Usage Data as \"data and other information relating to the provision, use and performance of the Software and Service\", and the same clause allows disclosure of Usage Data to affiliates, subprocessors and service providers. Whether Usage Data covers the Input/Output content of a request is not stated: the definition turns on the provision, use and performance of the service and does not exclude request content on its face."
text_zh = "独立于 §4(a) 的第二条改进用途授权：MSA §4(b)「Notwithstanding anything else to the contrary in this Agreement, W&B may collect and analyze Usage Data to develop, improve and support the W&B Assets.」§1 把 Usage Data 定义为「data and other information relating to the provision, use and performance of the Software and Service」，同条还允许向关联方、子处理者与服务提供者披露 Usage Data。Usage Data 是否包含请求的 Input/Output 正文未明说：定义落在「服务的提供、使用与性能」上，从文本看并未把请求内容排除在外。"
anchor = "msa-4b-usage-data-improvement-grant"

[[product.training.point]]
text = "The subprocessor table on the Security page lists Anthropic/OpenAI as \"Generative AI services\" subprocessors, but whether those subprocessors sit on the open-source model inference path of Serverless Inference is not explained in the public documentation (the product page says inference \"runs directly on CoreWeave infrastructure\")."
text_zh = "Security 页子处理者表把 Anthropic/OpenAI 列为「Generative AI services」子处理者，但这些子处理者是否在 Serverless Inference 的开源模型推理链上，公开文档未说明（产品页称推理「runs directly on CoreWeave infrastructure」）。"

