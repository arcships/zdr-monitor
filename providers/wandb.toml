[[product.retention.point]]
text = "DPA Schedule 2 Annex I is explicit about the self-hosted tier: \"only with processor's prior written consent and when controller transmits personal data to processor during the provision of technical Support\" — by default there is no continuous processing on this tier, only support scenarios. Pricing FAQ: \"In self-hosted mode, you're responsible for managing your data... you'll need to manage your data storage and backup.\" The 7-day post-deletion recovery window appears only in the Multi-tenant / Dedicated Cloud documentation and does not apply to the self-hosted tier. What W&B itself retains (license verification, pulling the spec from deploy.wandb.ai) is outside the retention disclosures in the public documentation."
text_zh = "DPA Schedule 2 Annex I 对自建档写得很清楚：「only with processor’s prior written consent and when controller transmits personal data to processor during the provision of technical Support」——即自建档默认没有持续处理，只有支持场景。定价 FAQ：「In self-hosted mode, you’re responsible for managing your data... you’ll need to manage your data storage and backup.」删除后 7 天恢复窗口那条只写在 Multi-tenant / Dedicated Cloud 文档里，不适用于自建档。W&B 自身保留的部分（如 license 校验、deploy.wandb.ai 拉 spec）不在公开文档的保留期披露范围内。"

