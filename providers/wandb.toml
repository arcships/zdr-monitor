[[product.retention.point]]
text = "Object and context have to be written separately; MSA §9(c) \"Input and Output are deemed to be Customer Data\" must not be read straight off as \"inference inputs and outputs are kept long term\". (1) Inference inputs and outputs (prompt/response): the vendor discloses no retention period and makes no \"deleted once processed\" commitment"
text_zh = "对象与语境必须分开写，别把 MSA §9(c)「Input and Output are deemed to be Customer Data」直接读成「推理输入输出被长期保存」。(1) 推理输入输出（prompt/response）：官方未披露任何保留期，也没有「处理完即删」承诺"

[[product.retention.point]]
text = "All that can be cited is the classification — MSA §9(c) / AI Terms §2 treat Input and Output as Customer Data. (2) Personal Data (the part of Customer Data that is personal data): DPA Schedule 2 Annex I \"The period for which the personal data will be retained... For the term of the Agreement\", i.e. the life of the contract"
text_zh = "能被引用的只有定性——MSA §9(c)/AI Terms §2 把 Input/Output 视为 Customer Data。(2) Personal Data（Customer Data 中构成个人数据的部分）：DPA Schedule 2 Annex I「The period for which the personal data will be retained... ‍For the term of the Agreement」，即合同存续期"

[[product.retention.point]]
text = "Deleted or returned on termination or on the customer's written request (DPA §9)"
text_zh = "终止或应客户书面请求时删除或返还（DPA §9）"

[[product.retention.point]]
text = "DPA Annex II「Weights and Biases, LLC deletes customer data within 30 days of a customer requesting deletion」"

[[product.retention.point]]
text = "MSA §6(d) deletion after termination, \"W&B will initiate deletion within 30 days of receipt\". (3) Backups: DPA Annex II \"performs backups daily and retains them in accordance with a predefined schedule in the Backup Policy\" — the Backup Policy itself is not public, so backup retention cannot be quantified. (4) Platform objects (run data / artifacts / logs): kept for 7 days after deletion and recoverable within that window (the Multi-tenant Cloud and Dedicated Cloud documentation and the Artifacts documentation all say the same), adjustable on Dedicated Cloud through GORILLA_DATA_RETENTION_PERIOD"
text_zh = "MSA §6(d) 终止后删除、「W&B will initiate deletion within 30 days of receipt」。(3) 备份：DPA Annex II「performs backups daily and retains them in accordance with a predefined schedule in the Backup Policy」——Backup Policy 本身不公开，故备份保留期无法量化。(4) 平台对象（run 数据 / artifacts / 日志）：删除后保留 7 天可恢复（Multi-tenant Cloud 与 Dedicated Cloud 文档、Artifacts 文档同口径），Dedicated Cloud 可用 GORILLA_DATA_RETENTION_PERIOD 调整"

[[product.retention.point]]
text = "That is a post-deletion recovery window, not a retention period for request content. (5) Weave side: the pricing FAQ defines ingested bytes as including LLM inputs and outputs and counts them towards long term storage, but gives no number of days. Conclusion type: no quantified uniform period (unspecified), deletion-triggered plus retention for the term of the contract."
text_zh = "这是「删除后恢复窗口」，不是「请求内容保留期」。(5) Weave 侧：定价 FAQ 明确定义 ingested bytes 含 LLM inputs/outputs 且计入 long term storage，但未给天数。结论类型：无量化统一期限（unspecified），删除触发型 + 合同期保留。"

[[product.retention.point]]
text = "Exception to the deletion commitment (DPA §9): \"This requirement shall not apply to the extent Company is required by any applicable law to retain some or all of the Personal Data, or to Personal Data it has archived on back-up systems, which Personal Data Company shall securely isolate and protect from any further processing and eventually delete in accordance with Company's deletion policies.\" Personal Data that a law requires Company to keep, and Personal Data in back-up archives, are therefore outside the return/deletion commitment; for backups the promise is only isolation plus eventual deletion, with no period, and the Backup Policy itself is not public."
text_zh = "删除承诺的例外（DPA §9）：「This requirement shall not apply to the extent Company is required by any applicable law to retain some or all of the Personal Data, or to Personal Data it has archived on back-up systems, which Personal Data Company shall securely isolate and protect from any further processing and eventually delete in accordance with Company’s deletion policies.」即法律要求保留的 Personal Data 与备份归档中的 Personal Data 不在返还/删除承诺范围内；备份项下只承诺隔离保护与「最终删除」，没有期限，且 Backup Policy 本身不公开。"
anchor = "dpa-9-exceptions-law-and-backups"

[[product.retention.point]]
text = "The DPA outlives the Agreement: \"This DPA will remain in effect so long as Company Processes Personal Data, notwithstanding the expiration or termination of the Agreement.\" It runs in parallel with the MSA §6(d) deletion-within-30-days rule — Personal Data still Processed under a legal retention requirement or held in back-up archives keeps the DPA in force."
text_zh = "DPA 不随协议终止而失效：「This DPA will remain in effect so long as Company Processes Personal Data, notwithstanding the expiration or termination of the Agreement.」它与 MSA §6(d) 的「终止后 30 天内发起删除」并行——只要 Personal Data 仍被处理（法律要求保留或存于备份归档中），DPA 就继续有效。"
anchor = "dpa-2-duration-notwithstanding-termination"

