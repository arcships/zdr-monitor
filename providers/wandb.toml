[[product.processing_region.point]]
anchor = "security-subprocessors-cloud-hosting-locations"
text = "Weave multi-tenant data sits in a shared ClickHouse Cloud cluster. The inference request itself has no separate regional disclosure: the docs say only that Inference is accessible from supported geographic locations (usage-limits §Geographic restrictions) and point to the geographic restrictions in the CoreWeave Terms of Use for detail — that section is in fact a statement about the availability of site content outside the United States, not a data residency rule or an eligibility list, so the pointer is broken (a documentation error on the same page). Subprocessor locations (Security page table): AWS/Azure/GCP/ClickHouse \"United States or as chosen by Customer\", Datadog/Hex United States, Anthropic/OpenAI \"United States and other countries where X operates\", Modal Labs the same. \"As chosen by Customer\" corresponds to the region choice on the dedicated cloud tier and is not an option on multi-tenant SaaS. By contrast: Dedicated Cloud supports multiple AWS/GCP/Azure regions (Europe and Asia-Pacific included)"
text_zh = "Weave 多租户档数据存在共享 ClickHouse Cloud 集群。推理请求本身没有独立的区域披露：docs 只写 Inference 仅可从受支持地理位置访问（usage-limits §Geographic restrictions），并把细节指向 CoreWeave Terms of Use 的 geographic restrictions——该节实际是「网站内容在美国境外可访问性」声明，不是数据驻留或资格清单，这条指路是坏的（同页文档错误）。子处理者所在地（Security 页表）：AWS/Azure/GCP/ClickHouse「United States or as chosen by Customer」、Datadog/Hex 美国、Anthropic/OpenAI「United States and other countries where X operates」、Modal Labs 同。「as chosen by Customer」对应专属云档的区域可选，不是多租户 SaaS 的可选项。对照：Dedicated Cloud 支持 AWS/GCP/Azure 多区域（含欧洲与亚太）"

[[product.processing_region.point]]
text = "CoreWeave appears in the same table as \"| Coreweave (Affiliate) | United States | Cloud infrastructure administration |\" — machine-checkable evidence that the affiliate running cloud infrastructure for W&B is located in the United States, and together with the platform deployment location in Google Cloud North America it is what the US code rests on. It does not say which operator's facility serves a given Serverless Inference request: the product page's \"runs directly on CoreWeave infrastructure\" has no snapshot and is not anchorable, so the siting of the inference path itself stays undisclosed."
text_zh = "同一张表里 CoreWeave 记为「| Coreweave (Affiliate) | United States | Cloud infrastructure administration |」——这是「替 W&B 跑云基础设施的关联方位于美国」这条可机器复核的证据，它与平台部署地在 Google Cloud 北美一起构成 US 这个码的依据。它没有说明某次 Serverless Inference 请求落在谁的机房：产品页的「runs directly on CoreWeave infrastructure」没有快照、无法作锚点，故推理链路本身的落点仍未披露。"
anchor = "security-subprocessors-coreweave-affiliate-us"

[[product.processing_region.point]]
text = "Generative AI services are listed as subprocessors too: Anthropic and OpenAI are \"United States and other countries where X operates\", Modal Labs the same — recorded as the multi-hop tail of AI Features, not as evidence for the siting of a plain inference request."
text_zh = "生成式 AI 服务也列在子处理者表里：Anthropic 与 OpenAI 为「United States and other countries where X operates」、Modal Labs 同——这是 AI Features 的多跳尾段，不作为普通推理请求落点的证据。"
anchor = "security-subprocessors-ai-vendors"

[[product.processing_region.point]]
text = "Self-Managed runs entirely in the customer's infrastructure. Unchecked: the siting of CoreWeave's own data centers (coreweave.com/trust claims the United States and Europe) is not a processing-location commitment for W&B SaaS and is recorded alongside only."
text_zh = "Self-Managed 完全在客户基础设施。未核项：CoreWeave 自有数据中心选址（coreweave.com/trust 称美国与欧洲）不是 W&B SaaS 的处理地承诺，仅并列记录。"

[product.role]
kind = "processor"
anchor = "dpa-6-customer-controller-company-processor"

[[product.role.point]]
text = "Verbatim contract clause (the one the old record lacked): DPA §6 \"Customer is the controller (or is acting on behalf of the controller) and Company is the processor\""
text_zh = "合同层逐字条款（这是旧记录缺的）：DPA §6「Customer is the controller (or is acting on behalf of the controller) and Company is the processor」"

[[product.role.point]]
text = "DPA Schedule 2 Annex I「Role: Processor (or Subprocessor as the case may be)」"

[[product.role.point]]
text = "DPA §8(a): the customer authorizes W&B to appoint subprocessors, with the subprocessor list on the Subprocessor Site (= the subprocessor table at wandb.ai/site/security/). Supplementary side: (a) the current privacy policy (CoreWeave) designates itself controller for personal data outside the platform — \"CoreWeave is the controller of personal data collected directly through the Sites or outside of Customer Data\""
text_zh = "DPA §8(a) 客户授权 W&B 指定子处理者，子处理者清单在 Subprocessor Site（= wandb.ai/site/security/ 的子处理者表）。补充面：(a) 现行隐私政策（CoreWeave）在平台外的个人数据上自认 controller——「CoreWeave is the controller of personal data collected directly through the Sites or outside of Customer Data」"

[[product.role.point]]
text = "For data the customer uploads, \"you are the controller ... and CoreWeave is the processor\". (b) In the BAA, W&B says of itself that \"Business Associate generally cannot view Customer Data\" (Dedicated Cloud BYOB tier only). (c) A support article acknowledges that W&B staff can access logged values with permission, and that isolation requires Self-Managed. Multi-hop: the Third-Party AI behind AI Features are subprocessors rather than W&B itself (Anthropic/OpenAI are listed as Generative AI services), their processing is governed by their own terms, and W&B's processor commitment does not automatically cover them."
text_zh = "对客户上传的数据则「you are the controller ... and CoreWeave is the processor」。(b) BAA 里 W&B 自述「Business Associate generally cannot view Customer Data」（仅 Dedicated Cloud BYOB 档）。(c) 支持文章承认 W&B 员工经许可可访问 logged values，隔离需 Self-Managed。多跳：AI Features 的 Third-Party AI 是子处理者而非 W&B 自身（Anthropic/OpenAI 列为 Generative AI services），其处理受各自条款约束，W&B 的 processor 承诺不自动覆盖它们。"

[[product.role.point]]
text = "Precedence conflict, recorded without adjudicating: MSA §14(d) ranks the documents \"(a) Order Form; (b) Agreement; (c) DPA; and (d) BAA (if applicable)\", while DPA §10 states \"In the event of any conflict or inconsistency between this DPA and the other terms of the Agreement, this DPA will govern.\" The controller/processor allocation lives in the DPA (§6 and Annex I) while the deletion duties are split across both instruments, so which document controls on a given point is left unresolved by the published texts; the DPA §6 allocation is subject to both rules at once, with the scope of application still to be clarified."
text_zh = "优先级冲突，并列记录、不选边：MSA §14(d) 把文件排序为「(a) Order Form; (b) Agreement; (c) DPA; and (d) BAA (if applicable)」，而 DPA §10 写「In the event of any conflict or inconsistency between this DPA and the other terms of the Agreement, this DPA will govern.」角色（controller/processor）分配写在 DPA（§6 与 Annex I），删除义务则分散在两份文件里，冲突时以哪份为准，公开文本本身并未解决；DPA §6 的角色分配同时受这两条相反规则约束，适用范围待澄清。"
anchor = "msa-14d-order-of-precedence"

