channel = "developer_data"
tier = "core"
note = "Kimi 开放平台(platform.kimi.ai,按量 API / 企业客户)文档《What is Zero Data Retention (ZDR)?》全文。ZDR 面向开放平台企业客户按申请开通;开通后请求内容仅在生成响应期间存在、返回即删(法律要求除外);范围不含图片/视频直传、安全日志与计费记录等运营数据、第三方模型与插件;内容安全审核对全部流量照常生效。本档(Kimi Code 订阅)不适用,收录作档位对照,authoritative_for 为空。"

[[source]]
url = "https://www.kimi.ai/help/kimi-api/api-data-security"
channel = "developer_data"
tier = "contradiction"
note = "与 https://platform.kimi.ai/docs/agreement/modeluse（core，本条目 training 权威来源）就同一档位（api：Kimi 国际开放平台，本条目唯一档位，按量计费 + 企业方案）的 training 维度表述不一致。本文件原句：「No. User data submitted through the API (including input content and model output) is not used to train or improve Kimi's models. Your data is used solely to fulfill the current API request and is not persistently stored for training purposes.」，另有表格行「Not Used for Training / API data is not used for model training」；core 合同原句：「We may use Content to provide, maintain, develop, support, and improve the Services, comply with applicable law, enforce our terms and policies, and keep the Services safe and secure.」＋「Customer who requires restrictions on the use of Customer Content for training or improving Moonshot AI models may contact Moonshot AI to discuss available enterprise arrangements or separate written agreements. Unless otherwise expressly agreed in writing, Customer Content may be used for the foregoing purposes.」（后者把 training or improving Moonshot AI models 明列为可能的用途，并称限制需企业安排或书面协议，即默认不设限）。各自范围：本文件是 www.kimi.ai 帮助中心「Kimi API」分类下的《Data processing & security》FAQ——同分类 api-overview 页给出 Platform URL = platform.kimi.ai，并写明开放平台 uses pay-as-you-go billing with no subscription plan，与 Kimi Membership / Kimi Code 明确区分，本页文件删除示例为 DELETE https://api.moonshot.ai/v1/files/{file_id}；正文主语逐字是 User data submitted through the API (including input content and model output) 与 API data，指向国际开放平台 API。core 是同一平台（platform.kimi.ai）的《Kimi OpenPlatform Terms of Service》，签约主体 Moonshot AI PTE. LTD.（新加坡），首段声明该 ToS 与 Kimi OpenPlatform Privacy Policy、Order Form 共同构成 Agreement。四种解释的排除依据：（1）适用范围——ToS §4 首句即给出定义：「You and End Users may submit prompts, texts, audios or other content or materials (input) to the Services and the Services generate corresponding content as a response (output). Both input and output are collectively referred to as content.」，即 Content 逐字包含 API 提交的输入与模型输出，与 FAQ 的 input content and model output 是同一数据对象，故「ToS 的 Content 不含 API 请求数据」这条化解不成立；FAQ 第二条锚点（retention 主题，is not persistently stored for training purposes）自带 for training purposes 限定，不否认账户存续期的一般保留，与 retention 权威来源（隐私政策 §6 retained while your account is active）不构成矛盾，保留该锚点仅作同一份文档的另一半证据。（2）档位——本家只有 api 一档（帮助中心 api-overview 明示开放平台无订阅套餐，订阅档归 kimi-code-plan-global 等条目）；FAQ 的否认句无任何档位限定（同页只把 higher security requirements 指向销售团队，企业内容另有 Kimi Business 分类），ToS §4 的许可句与限制句同样不限档位，且「限制需企业安排或书面协议」意味着按量档默认也不设限，故档位不解释差异。（3）站点——两份文档的标的是同一产品：FAQ 所在帮助中心的 kimi-api 分类即开放平台文档（Platform URL = platform.kimi.ai、文件接口 api.moonshot.ai/v1），ToS 就是该平台的协议，同属国际线（Moonshot AI PTE. LTD.）；国内线对应页为 www.kimi.com/help/kimi-api/api-data-security 与 platform.moonshot.cn（本条目已登记 rejected，另立 moonshotai-cn 条目），不构成国内站/国际站之分。注：同一英文 FAQ 文本另有 www.kimi.com/en 镜像（本条目别名，drop），说明按域名判实体不可靠；但两份文档同指国际开放平台 API 这一点由正文自证。（4）时效——本文件无生效/更新日期（帮助中心页与直连 HTML 快照均无日期行），故不作日期比对，改以「无版本取代证据」排除旧版解释：本页 2026-09-21 抓取有效（HTTP 200、2060B，两条锚点逐字命中），仍在帮助中心在列（分类页索引到该页），文件删除指引与现行文件接口一致；同一不训练表述在现行文档站 ZDR 页（platform.kimi.ai/docs/guide/zero-data-retention：By default, the Kimi Open Platform does not use enterprise customer data to train models.）上仍然存在（该页限企业客户子档，不能解释本页无限定的否认句，仅证差异非单一过期页）；而较新的合同文本（ToS Last Updated: July 30th, 2026）保留了上述许可条款，未采纳 FAQ 口径。需要厂商书面澄清：按量（非企业方案）API 下，API 输入输出是否默认用于训练/改进模型？帮助中心 FAQ 的 not used to train or improve Kimi's models 是无条件承诺（即合同 §4 的许可在实践中不对 API 内容行使），还是仅面向企业客户？若为前者，应把该承诺写入 ToS/隐私政策或修改 §4；若为后者，应在 FAQ 上明确档位限定。"

