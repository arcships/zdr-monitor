channel = "developer_data"
tier = "core"
note = "Kimi 开放平台《Privacy Policy》(platform.kimi.ai 文档站,Last Update: April 30, 2025)。主体 MOONSHOT AI PTE. LTD.(新加坡),服务器位于新加坡,账号/输入/支付信息在账号存续期间保留,违规信息保留至违规解决。这是与本档 NOVASCENT 不同的另一个新加坡主体、另一条产品线,故 authoritative_for 为空,仅用于证明「开放平台的 Singapore 处理地披露不能套到本档」。"

