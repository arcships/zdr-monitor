text_zh = "同顶层 retention：请求正文仅处理所需时长（ToS ZDR）"

[[product.retention.point]]
text = "AI inference information is \"retained for up to one (1) day after the organizations and projects had been deleted\" (Privacy §8)"
text_zh = "AI inference information 组织/项目删除后最多 1 天（Privacy §8）"

[[product.retention.point]]
text = "After the contract ends, Personal Data is deleted within 90 days, and backup archives no later than 90 days after the date the data was backed up (DPA §11)"
text_zh = "合同终止后 Personal Data 90 天内删除、备份不超过备份日 +90 天（DPA §11）"

[[product.retention.point]]
text = "Usage Data has no period (ToS §10(e))."
text_zh = "Usage Data 无期限（ToS §10(e)）。"

