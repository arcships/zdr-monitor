[product.training]
mark = "no"
anchor = "friendli-tos-ex1-1-1-c-free-services-training"

[[product.training.point]]
text = "Exhibit 1 §1.1(c): for services provided free of charge, the Customer Materials the customer submits may be used for \"improving, developing, enhancing, and providing FriendliAI's and its Affiliates' products and services\". This stands head-on against the unconditional \"never used for training\" in docs/guides/data-handling, and under the rules both are kept side by side: the documentation page does not distinguish free from paid, while the tier-specific exception in the ToS has higher authority."
text_zh = "Exhibit 1 §1.1(c)：对免费提供的服务，客户提交的 Customer Materials 可用于「improving, developing, enhancing, and providing FriendliAI’s and its Affiliates’ products and services」。与 docs/guides/data-handling 的无条件「never used for training」正面对立，按规则两条并列保留：文档页未区分免费/付费，ToS 的分档例外效力更高。"

