[[source]]
url = "https://friendli.ai/docs/guides/suite/enterprise-plan"
channel = "developer_data"
tier = "core"
note = "企业档说明页。给出企业档是「contract-based framework」，可合同启用的能力含 Custom region deployments、VPC deployments、On-prem deployment options 与 Custom commercial terms——即处理地/部署形态在企业档是按合同谈的，公开条款不含具体承诺。仅用于 products[] 的 enterprise 行，不作为 processing_region 顶层的权威。"

[[source]]
url = "https://friendli.ai/dpa"
channel = "contract"
tier = "core"
note = "《Data Processing Agreement》(Last Modified: September 21, 2026)，由 ToS Exhibit 1 §1.7 并入合同，并在其 §15 规定与主协议冲突时以 DPA 为准。覆盖全部 Friendli Services（含 Model APIs 与 Dedicated Endpoints）。role 维度的权威：§2 双角色（Processor/Sub-Processor + 自有业务数据的 independent Controller）；retention 维度的权威：§11 服务终止后 90 天内删除 Personal Data、备份归档不超过备份日起 90 天，以及 Schedule 3 (Annex I) B.7 的保留期定义；processing_region 的旁证：§5 为 EEA/UK 出境预设 EU SCCs Module 2/3 与 UK Addendum。Schedule 5 把 sub-processors 列表指向 friendli.ai/subprocessors；Schedule 4 把技术与组织措施指向 trust.friendli.ai/controls；Schedule 6 是韩国 PIPA 第 26 条下的受托处理附录。注意：DPA 未写明具体签约实体（只说 the applicable FriendliAI entity）。"

[[source]]
url = "https://friendli.ai/privacypolicy"
channel = "consumer_privacy"
tier = "core"
note = "《Privacy Policy》(Effective Date: Sep 11, 2025)，消费者/访客口径的隐私政策，覆盖 Site 与 Services。本档用途：retention 维度给出唯一的量化口径（§8 AI inference information: 组织与项目删除后最多 1 天；韩国居民 Annex 1 的法定保留期表）；§3 把「对推理服务器的请求与模型响应」列入向 Clients 收集的个人信息，是把 §8 保留期连到输入输出的关键一环；processing_region 维度的主要条款来源是 §11（服务器位于美国）。全篇未出现「train」，也没有任何零保留承诺；§5 的「For Improvement of Our Site or Services」只写 maintain/improve/analyze our Site or Services，未提模型训练。韩文版不存在：/ko/privacypolicy 307 跳回本页。"

[[source]]
url = "https://friendli.ai/product/bring-your-own-gpu-byog"
channel = "official_blog"
tier = "core"
note = "BYOG 产品页（营销页，最低权威档）。含数据句「Your data, credentials, and inference stack never leave your cloud environment.」与「data residency」。只适用于 BYOG/自管部署这一档：推理栈跑在客户自有云 GPU 上，请求内容不进入 FriendliAI 的托管环境。不能用于 Model APIs / Dedicated Endpoints 档的处理地结论。"

[[source]]
url = "https://friendli.ai/terms-of-service"
channel = "contract"
tier = "core"
note = "《Friendli Terms of Service》(页面标 Last Updated: September 21, 2026)，FriendliAI Corp. 与 Customer 之间的主合同，覆盖 Friendli Suite 全部服务。本档关键位置：§10(e) Usage Data（日志/元数据可作任何业务用途，但不含 Customer Materials）、§15(a)(ii)(5) 终止后按 standard data retention policies 删除 Customer Materials；Exhibit 1（Service Specific Terms）§1 只适用于 Friendli Endpoints Services，而定义 §1(t) 明确 Friendli Endpoints Services = Friendli Serverless Endpoints Service（网页上称 Model API）+ Friendli Dedicated Endpoint Service —— 即 ZDR 与训练许可条款对 serverless 与 dedicated 两档同文适用，两档在数据条款上不分离（差异只在 §1.2 的 SLA）。Exhibit 1 §1.1 是训练与 ZDR 两个维度的合同层权威：(a) 提供服务所必需的许可、(b) 开源/公开的客户 checkpoint、(c) provided free of charge 的服务、(d) 排除 Customer Inputs/Outputs 的推理技术改进许可；紧随其后的 Zero Data Retention (ZDR) 段。Exhibit 1 §1.7 把 DPA 并入合同，§1.8(x) 把 friendli.ai/providers 上展示的第三方服务条款纳入合同。"

