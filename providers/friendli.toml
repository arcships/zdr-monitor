anchor = "friendli-tos-ex1-1-1-zdr"

[[product.zdr.point]]
text = "The first sentence of the ZDR paragraph carves out §1.1(c) — the free tier does not get zero retention by default. This is the \"express denial\" kind: there is a clause behind it, so it is not \"undisclosed\"."
text_zh = "ZDR 段第一句即以 §1.1(c) 为例外——免费档不享受默认零保留。这是「明确否定」类：有条款依据，不是「未披露」。"

