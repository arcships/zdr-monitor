[[product.training.point]]
text = "Same as the top-level training entry: Exhibit 1 §1.1(d) excludes Inputs and Outputs from the license to improve inference technology, and §10(a) limits use to \"only … to provide the Friendli Services\""
text_zh = "同顶层 training：Exhibit 1 §1.1(d) 把 Inputs/Outputs 排除在推理技术改进许可外，§10(a) 限定「only … to provide the Friendli Services」"

[[product.training.point]]
text = "The documentation page says unconditionally that they are \"never used for training\". Exception: services provided free of charge (§1.1(c)), see the trial row."
text_zh = "文档页无条件写「never used for training」。例外：免费提供的服务（§1.1(c)）另见 trial 行。"

