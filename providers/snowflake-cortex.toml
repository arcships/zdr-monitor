]

[[product.training.point]]
text_zh = "BYO 档结论：AI Features 的「不用于训练对外提供的模型」承诺**不适用于客户自带模型**——官方 FAQ「Any models (including third-party models) that you bring into your Service account (for example, using Snowpark Container Services) in accordance with the Documentation are treated as Customer Data and are not considered part of the Service.」模型本身被当作 Customer Data，适用客户数据的一般权利义务（ToS §2.1 的有限处理授权、DPA §3.1 的 processor 角色），而不是 AI Terms 的 AI Features 条款。Snowflake 是否可能读到这些模型的内容，取决于客户数据侧的通用条款与支持访问政策，不是本档的 AI 专属承诺。"

[[product.training.point]]
text = "Relation to the AI Trust FAQ's no-training answer: that page is about Snowflake AI Features throughout (the bullet list sits under 'USE OF YOUR DATA FOR SNOWFLAKE AI FEATURES'), and the FAQ answer's subject is 'your Usage Data or Customer Data', while the same page treats models the customer brings in as Customer Data and 'not considered part of the Service'. The commitment therefore attaches to data processed by Snowflake AI Features; a BYO model and its own inputs/outputs are outside that scope. So the mark stays unknown and is not flipped either way: the sentence is not read as a no-training commitment for this tier (the scope does not match), and its existence is not read as 'training happens'. Should it be used to flip the mark later, it must be anchored and labelled enterprise_privacy_faq (below AI Terms)."
text_zh = "与 AI Trust FAQ 那句「不训练对外提供的模型」的关系：该页通篇讲 Snowflake AI Features（不训练那组 bullet 挂在「USE OF YOUR DATA FOR SNOWFLAKE AI FEATURES」小节下），FAQ 回答的主语是「your Usage Data or Customer Data」，而同一页又把客户自带模型界定为 Customer Data、且「not considered part of the Service」——即该承诺挂在 Snowflake AI Features 处理的数据上，自带模型本身与其输入输出不在其列。故本档仍记 unknown，两个方向都不据此改判：既不把该句当作本档的不训练承诺（范围对不上），也不因它存在就记成「会训练」。若日后据此改判，须绑该 FAQ 锚点并注明来源层级为 enterprise_privacy_faq（低于 AI Terms）。"

