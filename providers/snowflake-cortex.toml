text_zh = "BYO 档结论：AI Features 的「不用于训练对外提供的模型」承诺**不适用于客户自带模型**——官方 FAQ「Any models (including third-party models) that you bring into your Service account (for example, using Snowpark Container Services) in accordance with the Documentation are treated as Customer Data and are not considered part of the Service.」模型本身被当作 Customer Data，适用客户数据的一般权利义务（ToS §2.1 的有限处理授权、DPA §3.1 的 processor 角色），而不是 AI Terms 的 AI Features 条款。Snowflake 是否可能读到这些模型的内容，取决于客户数据侧的通用条款与支持访问政策，不是本档的 AI 专属承诺。"

[product.zdr]
mark = "unknown"
searched = [
  "https://www.snowflake.com/en/legal/compliance/snowflake-ai-trust-and-safety/",
  "https://www.snowflake.com/en/legal/addenda/data-processing-addendum/",
  "https://docs.snowflake.com/en/developer-guide/snowpark-container-services/overview",
]

[[product.zdr.point]]
text_zh = "官方未就 BYO 档披露任何 ZDR 选项"

[[product.zdr.point]]
text_zh = "该档被界定为 Customer Data，因此「能否零保留」在公开文本里没有答案（客户数据侧的保留由客户配置决定，但这不等于零保留承诺）。按规则记 not_found。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "dpa-3-5-e-retention-period-set-by-customer"

[[product.retention.point]]
text_zh = "BYO 档结论：按**客户数据**的通用保留规则处理（DPA §3.5(e) 保留期由客户配置决定；ToS §7.3 终止后 30 天取回期；Security Addendum §8.2 之后及时删除），不适用 Cortex AI Features 的任何专门说明（跨区推理载荷不落盘、Threads 保留等都不适用于该档）。客户在 Snowpark Container Services 里自己控制的存储与日志，保留期由客户自己的实现决定。"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "dpa-7-1-hosting-region-no-outside-processing"

[[product.processing_region.point]]
text_zh = "BYO 档结论：按 Customer Data 适用 DPA §7.1 的 Hosting Region 承诺（只在客户选定区域托管，区外处理的例外为提供所购 Offering 所必需或法律要求）。注意 Snowpark Container Services 本身的跨区部署/复制能力不在本次核实的公开条款范围内，未核。"

[product.role]
kind = "processor"
anchor = "aits-byo-models-are-customer-data"

[[product.role.point]]
text_zh = "BYO 档结论：Snowflake 对客户自带的模型（作为 Customer Data）仍是受托处理方（DPA §3.1 processor），客户是该模型的控制者"

[[product.role.point]]
text_zh = "同时官方明确该模型「not considered part of the Service」，即 Snowflake 不对模型本身承担 AI Features 的专门承诺。与 api 档的差别在于：模型不是 Snowflake 提供的，Snowflake 对其运行方式、输入输出保留行为不作 AI 专属承诺。"

