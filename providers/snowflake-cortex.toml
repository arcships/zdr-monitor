[[product.training.point]]
text = "Why these clauses do not flip the mark: AI Terms §1.4 provides that in the event of any conflict between the AI Terms and the Customer Agreement, the AI Terms control with respect to the subject matter herein, so for Covered AI Features §3.2 governs over §3.1 and over ToS §4.2. §3.1 is limited to AI Data aggregated and anonymized past identifiability, §4.2 to Usage Data for product development, while §3.2 is a direct prohibition on training models made available to other parties — which is why the conclusion is scoped to those models rather than read as a blanket commitment."
text_zh = "为何这两条不翻转 mark：AI Terms §1.4 规定 AI Terms 与 Customer Agreement 冲突时以 AI Terms 为准，故对 Covered AI Features，§3.2 优先于 §3.1 与 ToS §4.2。§3.1 限于聚合匿名化到不可识别之后的 AI Data，§4.2 限于 Usage Data 的产品开发用途，而 §3.2 是对「训练对外提供给其他方使用的模型」的直接禁止——故结论限定到这一范围，而不是读成总承诺。"
anchor = "ai-terms-1-4-ai-terms-control-conflicts"

[[product.training.point]]
text = "Plainest wording of the same commitment, one authority layer lower (enterprise_privacy_faq, below AI Terms): \"No, we do not use your Usage Data or Customer Data (in each case, including any Inputs or Outputs of Snowflake AI Features) to train any Model to be made available for use by other customers.\" Same scope — models made available to other customers."
text_zh = "同一承诺在最直白的一处表述，来源层级为 enterprise_privacy_faq（低于 AI Terms）：「No, we do not use your Usage Data or Customer Data (in each case, including any Inputs or Outputs of Snowflake AI Features) to train any Model to be made available for use by other customers.」范围相同——对外提供给其他方使用的模型。"
anchor = "aits-faq-no-training-on-usage-or-customer-data"

