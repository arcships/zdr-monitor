[product.training]
mark = "yes"
anchor = "ai-terms-3-2-no-train-models-for-others"
mode = "by_contract"

[[product.training.point]]
text = "Scope of the mark: the contract-layer prohibition covers training of any Model that Snowflake makes available for use by other parties — it is not a blanket no-training commitment for every use Snowflake may make of the data."
text_zh = "本档 mark=yes 的范围：AI Terms §3.2 的合同层禁止只覆盖「Snowflake 对外提供给其他方使用的模型」，不是「Snowflake 对数据的任何用途都不训练」的总承诺。"
anchor = "ai-terms-3-2-no-train-models-for-others"

[[product.training.point]]
text = "Clause pointing the other way in the same contract layer: Snowflake will only use AI Data that has been aggregated and anonymized, such that neither Customer nor its Users can be identified, to develop or improve Snowflake's products and services. Under docs/judgment.md ('using data to improve the service counts as training') this is a relevant counter-direction clause, not an irrelevant one."
text_zh = "同属合同层的反向条款：AI Terms §3.1 授权用 AI Data（仅限已聚合、匿名化到无法识别客户与其用户）develop or improve Snowflake 的产品与服务。按 docs/judgment.md「用来改进服务算训练」的口径，这是与本档结论方向相反的相关条款。"
anchor = "ai-terms-3-1-aggregated-anonymized-improvement"

[[product.training.point]]
text = "Second counter-direction clause, Customer Agreement layer: Snowflake may collect and use Usage Data to develop, improve, support, and operate its products and services."
text_zh = "第二条反向条款，Customer Agreement 层：ToS §4.2 允许 Snowflake 收集并使用 Usage Data 做其产品与服务的 develop/improve/support/operate。"
anchor = "tos-4-2-usage-data-develop-improve"

[[product.training.point]]
text = "The docs Legal notices table classifies the Input of Cortex AI Functions as Usage Data and the Output as Customer Data, so the §4.2 authorization reaches request content, not just telemetry."
text_zh = "docs 侧 Legal notices 表把 Cortex AI Functions 的 Input 归为 Usage Data、Output 归为 Customer Data，故 §4.2 的授权落在请求内容上，而不只是遥测。"
anchor = "aisql-input-usage-data-output-customer-data"

[[product.training.point]]
text = "Why these clauses do not flip the mark: AI Terms §1.4 provides that in the event of any conflict between the AI Terms and the Customer Agreement, the AI Terms control with respect to the subject matter herein, so for Covered AI Features §3.2 governs over §3.1 and over ToS §4.2. §3.1 is limited to AI Data aggregated and anonymized past identifiability, §4.2 to Usage Data for product development, while §3.2 is a direct prohibition on training models made available to other parties — which is why the conclusion is scoped to those models rather than read as a blanket commitment."
text_zh = "为何这两条不翻转 mark：AI Terms §1.4 规定 AI Terms 与 Customer Agreement 冲突时以 AI Terms 为准，故对 Covered AI Features，§3.2 优先于 §3.1 与 ToS §4.2。§3.1 限于聚合匿名化到不可识别之后的 AI Data，§4.2 限于 Usage Data 的产品开发用途，而 §3.2 是对「训练对外提供给其他方使用的模型」的直接禁止——故结论限定到这一范围，而不是读成总承诺。"
anchor = "ai-terms-1-4-ai-terms-control-conflicts"

[[product.training.point]]
text = "Plainest wording of the same commitment, one authority layer lower (enterprise_privacy_faq, below AI Terms): \"No, we do not use your Usage Data or Customer Data (in each case, including any Inputs or Outputs of Snowflake AI Features) to train any Model to be made available for use by other customers.\" Same scope — models made available to other customers."
text_zh = "同一承诺在最直白的一处表述，来源层级为 enterprise_privacy_faq（低于 AI Terms）：「No, we do not use your Usage Data or Customer Data (in each case, including any Inputs or Outputs of Snowflake AI Features) to train any Model to be made available for use by other customers.」范围相同——对外提供给其他方使用的模型。"
anchor = "aits-faq-no-training-on-usage-or-customer-data"

