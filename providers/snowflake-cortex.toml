[[product.zdr.point]]
text_zh = "同顶层 zdr：合同层与 docs 站均无 ZDR 选项/承诺/申请方式"

[[product.zdr.point]]
text_zh = "原绑的跨区文档「处理区域不落盘」讲的是区域级传输行为，既不构成零保留方案、也不构成「明示留存」，故本维度不绑锚点，按 searched 记未披露。曾提到的 Cortex Agents web search 上游（Brave）ZDR 表述出自本文件未声明、仓库也没有快照的页面，本轮已撤下（见 cortex-agents 档）。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "dpa-3-5-e-retention-period-set-by-customer"

[[product.retention.point]]
text_zh = "见顶层 retention：合同层保留期由客户配置决定（DPA §3.5(e)），终止后 30 天取回期（ToS §7.3）后及时删除（Security Addendum §8.2）"

[[product.retention.point]]
text_zh = "跨区推理载荷在处理区域不落盘（docs）"

[[product.retention.point]]
text_zh = "账户侧 inputs/outputs/logs 加密落盘（blog）"

[[product.retention.point]]
text_zh = "无任何请求级通用期限。"

[[product.retention.point]]
text = "Quantified floor on a different object: Cloud Environment infrastructure logs (host-based intrusion detection and similar monitoring tools) are securely stored to prevent tampering for at least one year. Object = infrastructure logs, not inputs/outputs; type = floor. The same section separately describes Account user logs, which Snowflake makes available to Customer for the Customer's own preservation, so the two objects must not be merged."
text_zh = "另一对象的量化下限：Cloud Environment 基础设施日志（主机入侵检测等监控工具）「securely stored to prevent tampering for at least one year」。对象 = 基础设施日志，不是输入输出正文；期限类型 = 下限。同页 §4.6.2 另述 Account 用户日志（Snowflake 捕获后交由客户自行保存），两者对象不同，不可合并。"
anchor = "sec-4-6-1-infrastructure-logs-one-year"

[[product.retention.point]]
text = "Second quantified floor, again a different object: any logs Snowflake determines to be relevant to a Security Incident shall be preserved for at least one year. Object = security-incident-related logs; context = when a Security Incident occurs; type = floor. It does not change the conclusion that inputs/outputs are retained as needed, and it cannot be read backwards as 'everything is deleted after one year'."
text_zh = "第二条量化下限，对象又不同：Snowflake 认定与安全事件相关的日志至少保留一年。对象 = 安全事件相关日志；语境 = 发生安全事件时；期限类型 = 下限。它不改变「输入输出按需保留」的结论，也不能反推成「一年后删除全部内容」。"
anchor = "sec-7-2-incident-logs-preserved-one-year"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "cri-default-any-region-new-orgs-2026-03-09"

[[product.processing_region.point]]
text = "Why GLOBAL: for new accounts created in new organizations within commercial regions after March 9, 2026, ANY_REGION is the default value of CORTEX_ENABLED_CROSS_REGION, so inference requests can be processed in any Snowflake-supported region, across any cloud provider."
text_zh = "为何记 GLOBAL：2026-03-09 之后在新组织、商业区域创建的账户，CORTEX_ENABLED_CROSS_REGION 默认 ANY_REGION，推理请求可在任意 Snowflake 支持的跨云区域处理。"
anchor = "cri-default-any-region-new-orgs-2026-03-09"

[[product.processing_region.point]]
text = "Storage stays put while processing moves: your customer data remains stored only in the region where your account is located. codes=GLOBAL therefore describes the processing location of the inference payload, not the storage location of account data."
text_zh = "存储不动、处理可动：客户数据只存在账户所在区域。因此 codes=GLOBAL 描述的是推理载荷的处理地，不是账户数据的存储地。"
anchor = "cri-customer-data-stored-only-in-account-region"

[[product.processing_region.point]]
text = "What actually crosses the boundary: during cross-region inference the inference payload — the input prompt you send and the output response you receive — is transmitted transiently to the processing region for the duration of processing, and no customer data is persisted in the processing region."
text_zh = "真正跨区的是推理载荷：处理期间只有输入提示与输出响应临时传输到处理区域，处理区域不持久化客户数据。"
anchor = "cri-payload-transmitted-transiently-not-persisted"

[[product.processing_region.point]]
text = "Contract-layer limit kept alongside the above: once Customer has selected a Hosting Region, Snowflake will not Process Customer Personal Data from outside the Hosting Region except as reasonably necessary to provide the Snowflake Offerings procured by Customer, or as necessary to comply with the law or binding order of a governmental body. Cross-region inference falls under the 'reasonably necessary to provide the procured Offerings' exception."
text_zh = "与上述事实并列保留的合同层限定：DPA §7.1 规定客户选定 Hosting Region 后不在区外处理 Customer Personal Data，例外为「为提供所购 Offering 所合理必需」或法律/政府强制令；跨区推理落在该例外之内。"
anchor = "dpa-7-1-hosting-region-no-outside-processing"

[[product.processing_region.point]]
text = "Upstream hop when frontier models are called: Claude (Anthropic on AWS Bedrock), GPT (Azure OpenAI) and Gemini (GCP) are served at the CSP-hosted frontier model endpoint instead of a Snowflake GPU cluster. Source level is official_blog — a discovery lead only; that hop's own ZDR has to be applied for separately and does not come together with Snowflake's."
text_zh = "调用 frontier 模型时的上游跳：Claude（Anthropic on AWS Bedrock）、GPT（Azure OpenAI）、Gemini（GCP）在 CSP 托管端点上完成，而不是 Snowflake GPU 集群。来源层级为 official_blog，仅作发现线索；该跳的 ZDR 需各自申请，不自动与 Snowflake 同开。"
anchor = "blog-frontier-models-run-on-csp-endpoints"

[product.role]
kind = "processor"
anchor = "dpa-3-1-snowflake-only-data-processor"

[[product.role.point]]
text_zh = "见顶层 role：DPA §3.1 自认 processor/子处理方（CCPA service provider），Usage Data 构成个人信息时 Snowflake 自认控制者"

[[product.role.point]]
text_zh = "账户/账单侧控制者身份来自隐私政策，属另一层。"

[[product.role.point]]
text = "Upstream hop that the role chain does not cover: when frontier models are called, inference terminates at the CSP-hosted frontier model endpoint (Claude on AWS Bedrock, GPT on Azure OpenAI, Gemini on GCP) rather than a Snowflake GPU cluster. The public text does not describe the role arrangement between Snowflake and those providers for that hop, so it is not read as a role determination here; source level is official_blog."
text_zh = "角色链未覆盖的上游跳：调用 frontier 模型时推理在 CSP 托管端点完成（Claude on AWS Bedrock、GPT on Azure OpenAI、Gemini on GCP），而不是 Snowflake GPU 集群。公开文本未说明该跳上 Snowflake 与这些厂商的角色安排，故不据此作角色认定；来源层级为 official_blog。"

