[[source]]
url = "https://docs.snowflake.com/en/user-guide/snowflake-cortex/ai-observability"
channel = "developer_data"
tier = "core"
note = "Cortex AI Observability 文档。列出会写入 SNOWFLAKE.LOCAL.AI_OBSERVABILITY_EVENTS 的内容：Cortex Agents 自动记录会话线程、轮次与执行跨度；Cortex Analyst 把请求与响应遥测写入单独的 CORTEX_ANALYST_REQUESTS_RAW 表；Cortex Search 在开启 REQUEST_LOGGING 时每请求写一行；CoCo 每次提示写 span。是「会话内容与请求内容在账户内落表」的官方依据，也是 retention 的对象区分依据。"

[[source]]
url = "https://docs.snowflake.com/en/user-guide/snowflake-cortex/aisql"
channel = "developer_data"
tier = "core"
note = "Cortex AI Functions（含 LLM functions）文档（docs llms.txt 里 /aisql 与 /llm-functions 渲染同一页，标题均为「Snowflake Cortex AI Functions (including LLM functions)」）。两句关键：「All the LLMs that Snowflake provides access to via our Snowflake AI Features are deployed within the Snowflake Service perimeter」；页末 Legal notices 表把 AI Functions 的 Input 归为 **Usage Data**、Output 归为 **Customer Data**，并区分 GA（Covered AI Features）与 Preview（Preview AI Features）。"

[[source]]
url = "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-threads"
channel = "developer_data"
tier = "core"
note = "Cortex Agents Threads（会话线程）使用文档。可证 Threads 的消息是**持久化**的（「the persisted user message ID」「the persisted assistant message ID」），并且长会话会被压缩成 compaction 摘要消息存储。文档本身未写保留时长（时长只在官方 blog 里出现），故 retention 时长以 blog 为线索、以 DPA 为合同层依据。"

[[source]]
url = "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cross-region-inference"
channel = "developer_data"
tier = "core"
note = "Cortex 跨区推理官方文档。给出 processing_region 的完整操作口径：客户数据只存在账户所在区域；跨区推理时「推理载荷（输入提示与输出响应）在处理期间 transiently 传输到处理区域，客户数据不在处理区域持久化」；四种路由选项（ANY_REGION / 云限定 / 区域限定 / DISABLED）；2026-03-09 后新商业区域组织默认 ANY_REGION，其他商业账户继承同云地理值；跨 CSP 走公网 mTLS。是「处理区不落盘」这一 retention 关键事实的官方出处。"

[[source]]
url = "https://www.snowflake.com/en/blog/engineering/cross-region-ai-inference-data-sovereignty/"
channel = "official_blog"
tier = "core"
note = "官方工程博客《Cross-Region AI Inference, Data Residency and Sovereignty》(2026-07-10)。按权威规则只算 official_blog（最低层），**不能单独支撑结论**，但它是三件事的唯一公开出处：(1)「Customer inputs, outputs and logs are stored encrypted at rest」（账户侧落盘）；(2) Cortex Threads「configurable retention (default 180 days, reducible via account parameter)」；(3) frontier 模型（Claude on AWS Bedrock / GPT on Azure OpenAI / Gemini on GCP）跑在 CSP 托管端点、经同一代理流程。旧记录把 retention 结论挂在本页，本轮降为补充证据。"

[[source]]
url = "https://www.snowflake.com/en/legal/addenda/data-processing-addendum/"
channel = "contract"
tier = "core"
note = "《Snowflake Data Processing Addendum》(Last Updated 2026-01-11)，主协议附属的数据处理附录。§3.1 是 role 维度的权威（processor / CCPA service provider，并单独处理 Usage Data 的控制者例外）；§3.5(e) 是 retention 的合同层权威（保留期由客户通过服务使用与配置决定，终止后删除）；§7.1 是 processing_region 的合同层权威（Hosting Region，例外为「为提供所购 Offering 所合理必需」或法律强制）。无 ZDR 条款。"

[[source]]
url = "https://www.snowflake.com/en/legal/addenda/security-addendum/"
channel = "contract"
tier = "core"
note = "《Snowflake Security Addendum》，经 ToS §3 与 DPA §5.1 纳入。§7.2 给出少见的量化下限：「与安全事件相关的日志至少保留一年」；§8 规定删除：§8.1 客户自助删除、§8.2 协议终止（含取回期）后 Snowflake 及时删除剩余 Customer Data。作为 retention 的量化与删除触发条款来源。"

[[source]]
url = "https://www.snowflake.com/en/legal/compliance/snowflake-ai-trust-and-safety/"
channel = "enterprise_privacy_faq"
tier = "core"
note = "《Snowflake AI Trust and Safety》(Last Updated 2026-01-01)，官方合规 FAQ 页，明确其覆盖「Snowflake AI Features」并逐一点名 Cortex AI Functions、Copilot、Cortex Fine-tuning、Cortex Search、Cortex Analyst、Cortex Agents、Snowflake Intelligence。给出「不用于训练对外提供的模型」「不向其他客户开放」「留在 Snowflake Security Boundary」三条承诺，并单独回答客户自带模型（如 Snowpark Container Services）的处理方式。是 training 与 BYO 档的官方说明来源；FAQ 层级低于 AI Terms，不作合同层权威。"

[[source]]
url = "https://www.snowflake.com/en/legal/optional-offerings/offering-specific-terms/ai-features/ai-terms/"
channel = "contract"
tier = "core"
note = "《Snowflake AI Terms》(Last Updated 2025-12-20)，Optional Offering 专用条款，§1.1 起即「amend and form part of the Customer Agreement」，§1.4 与主协议冲突时以 AI Terms 为准。覆盖所有 Generally Available 的 Covered AI Features（§6.4 指文档中列明的 GA「Snowflake AI Features」，含 Cortex AI Functions、Cortex Agents、Cortex Analyst、Cortex Search、Cortex Fine-tuning、Copilot、Snowflake Intelligence）。§3.2 是训练维度的合同层权威；§3.1 给出聚合匿名化改进例外；§5.2 明确 Preview AI Features 不在 AI Terms 范围内。全文无保留期限、无 ZDR、无处理地域条款。"

[[source]]
url = "https://www.snowflake.com/en/legal/optional-offerings/offering-specific-terms/preview-terms-of-service/"
channel = "contract"
tier = "core"
note = "《Preview Terms of Service》(Last Updated 2020-11-24)，与 AI Terms §5.2 配套，覆盖 Preview AI Features。三处关键：Preview「are excluded from Snowflake's security, compliance and privacy commitments」；Snowflake「may use information about Customer's use and evaluation of Previews for Snowflake's product improvement and development」；「Customers shall not use Previews to process personal data」。这是与 GA 档方向相反的独立档位。"

[[source]]
url = "https://www.snowflake.com/en/legal/terms-of-service/"
channel = "contract"
tier = "core"
note = "《Snowflake Terms of Service》（Customer Agreement 层）。§2.1 客户数据授权仅限「为提供 Snowflake Offerings 所必需」；§4.2 允许 Snowflake 收集并使用 Usage Data 来 develop/improve/support/operate 产品与服务；定义章给出 Usage Data 的定义（含 query logs and metadata）。§7.3 终止后 30 个日历日的取回期，之后 Snowflake「promptly delete」。是 training 维度「产品改进用途」与 retention 终止后删除的关键对照来源。"

