mark = "no"
searched = [
  "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-manage",
  "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-threads",
  "https://docs.snowflake.com/en/user-guide/snowflake-cortex/ai-observability",
  "https://www.snowflake.com/en/legal/optional-offerings/offering-specific-terms/ai-features/ai-terms/",
  "https://www.snowflake.com/en/legal/addenda/data-processing-addendum/",
]
anchor = "obs-agent-threads-logged-into-event-table"

[[product.zdr.point]]
text = "No zero-retention option or commitment is disclosed for this tier, and the tier states the opposite for conversation content: Cortex Agents deployed through the Agent API or Snowflake CoWork log conversation threads, turns, and execution spans automatically into SNOWFLAKE.LOCAL.AI_OBSERVABILITY_EVENTS."
text_zh = "本档没有任何「会话/提示/输出可零保留」的选项或承诺，方向相反的公开事实明示落表：经 Agent API 或 Snowflake CoWork 部署的 Cortex Agents 会把会话线程、轮次与执行跨度自动写入 SNOWFLAKE.LOCAL.AI_OBSERVABILITY_EVENTS。"
anchor = "obs-agent-threads-logged-into-event-table"

[[product.zdr.point]]
text = "The thread messages themselves are persisted rather than transient — the Threads documentation refers to the persisted user message ID and the persisted assistant message ID, and long conversations are compacted into a summary message."
text_zh = "会话线程消息本身是持久化的，不是临时对象：Threads 文档称消息为「persisted」（user 与 assistant 消息各有持久化 id），长会话还会写入 compaction 摘要。"
anchor = "threads-messages-are-persisted"

[[product.zdr.point]]
text_zh = "结论范围：会话线程与观测数据明示落表、本档无 ZDR 选项或申请方式（合同层与 docs 站均未披露）。"

[[product.zdr.point]]
text_zh = "撤下：原依据里「web search 的查询与结果离开 Snowflake 边界」与「唯一 ZDR 字样在 Brave 上游」两句出自本文件未声明、仓库也没有快照的页面，本轮无法复核，故不作为本维度依据；要引用须先补 [[source]] 并由 bot 抓回快照。"

[product.retention]
object = "mixed"
basis = "fixed_period"
days = 180
anchor = "blog-threads-default-180-days-retention"
searched = [
  "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-manage",
  "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-threads",
  "https://docs.snowflake.com/en/user-guide/snowflake-cortex/ai-observability",
  "https://www.snowflake.com/en/legal/optional-offerings/offering-specific-terms/ai-features/ai-terms/",
  "https://www.snowflake.com/en/legal/addenda/data-processing-addendum/",
]

[[product.retention.point]]
text = "Object: the Cortex Threads conversation content itself — default 180 days, reducible via account parameter; a default value, not a ceiling. Authority note: this figure appears only in the official engineering blog, i.e. the official_blog layer, the lowest in this ledger, so it is recorded as a lead rather than as a contract-layer period; the developer docs only confirm that the messages are persisted and state no duration. The contract layer (DPA §3.5(e)) is what makes the period customer-configurable."
text_zh = "对象：Cortex Threads 的会话内容本身——默认 180 天，可用账户参数调低；是默认值不是上限。权威层级说明：该天数只出现在官方工程博客，即 official_blog（本台账最低层），按线索记录而不作合同层期限；developer docs 只证消息是 persisted 的，未写时长。合同层 DPA §3.5(e) 才是「期限由客户配置决定」的权威。"
anchor = "blog-threads-default-180-days-retention"

[[product.retention.point]]
text = "Object: the observability tables. Cortex Agents deployed through the Agent API or Snowflake CoWork log conversation threads, turns, and execution spans automatically into SNOWFLAKE.LOCAL.AI_OBSERVABILITY_EVENTS; no retention period is stated for those tables."
text_zh = "对象：观测表。经 Agent API 或 Snowflake CoWork 部署的 Cortex Agents 会把会话线程、轮次与执行跨度自动写入 SNOWFLAKE.LOCAL.AI_OBSERVABILITY_EVENTS；这些表没有公布保留期限。"
anchor = "obs-agent-threads-logged-into-event-table"

[[product.retention.point]]
text = "Object: Cortex Analyst request and response telemetry, stored in SNOWFLAKE.LOCAL.CORTEX_ANALYST_REQUESTS_RAW rather than in the shared event table; no retention period is stated for it either."
text_zh = "对象：Cortex Analyst 的请求与响应遥测，写在 SNOWFLAKE.LOCAL.CORTEX_ANALYST_REQUESTS_RAW 而不是共享事件表；同样没有公布保留期限。"
anchor = "obs-analyst-raw-request-response-table"

[[product.retention.point]]
text = "Contract layer, object = Customer Personal Data: the period for which Customer Personal Data will be retained and the criteria used to determine that period is determined by Customer via use and configuration of the Service (DPA §3.5(e)); after termination there is a 30-day retrieval window (ToS §7.3), and then remaining Customer Data is promptly deleted (Security Addendum §8.2)."
text_zh = "合同层，对象 = Customer Personal Data：保留期与判定标准由客户通过服务使用与配置决定（DPA §3.5(e)）；终止后 30 天取回期（ToS §7.3），之后及时删除剩余 Customer Data（Security Addendum §8.2）。"
anchor = "dpa-3-5-e-retention-period-set-by-customer"

[[product.retention.point]]
text = "Object: the inference payload (input prompt and output response). Not persisted in the processing region — it is transmitted transiently for the duration of processing only."
text_zh = "对象：推理载荷（输入提示与输出响应）。处理区域不落盘，只在处理期间临时传输。"
anchor = "cri-payload-transmitted-transiently-not-persisted"

[[product.retention.point]]
text = "Quantified floor on a different object: Cloud Environment infrastructure logs (host-based intrusion detection and similar monitoring tools) are securely stored to prevent tampering for at least one year. Object = infrastructure logs, not inputs/outputs; type = floor. The same section separately describes Account user logs, which Snowflake makes available to Customer for the Customer's own preservation, so the two objects must not be merged."
text_zh = "另一对象的量化下限：Cloud Environment 基础设施日志（主机入侵检测等监控工具）「securely stored to prevent tampering for at least one year」。对象 = 基础设施日志，不是输入输出正文；期限类型 = 下限。同页 §4.6.2 另述 Account 用户日志（Snowflake 捕获后交由客户自行保存），两者对象不同，不可合并。"
anchor = "sec-4-6-1-infrastructure-logs-one-year"

[[product.retention.point]]
text = "Second quantified floor, again a different object: any logs Snowflake determines to be relevant to a Security Incident shall be preserved for at least one year. Object = security-incident-related logs; context = when a Security Incident occurs; type = floor. It does not change the conclusion that inputs/outputs are retained as needed, and it cannot be read backwards as 'everything is deleted after one year'."
text_zh = "第二条量化下限，对象又不同：Snowflake 认定与安全事件相关的日志至少保留一年。对象 = 安全事件相关日志；语境 = 发生安全事件时；期限类型 = 下限。它不改变「输入输出按需保留」的结论，也不能反推成「一年后删除全部内容」。"
anchor = "sec-7-2-incident-logs-preserved-one-year"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "cri-default-any-region-new-orgs-2026-03-09"

[[product.processing_region.point]]
text = "Why GLOBAL: for new accounts created in new organizations within commercial regions after March 9, 2026, ANY_REGION is the default value of CORTEX_ENABLED_CROSS_REGION, so inference requests can be processed in any Snowflake-supported region, across any cloud provider."
text_zh = "为何记 GLOBAL：2026-03-09 之后在新组织、商业区域创建的账户，CORTEX_ENABLED_CROSS_REGION 默认 ANY_REGION，推理请求可在任意 Snowflake 支持的跨云区域处理。"
anchor = "cri-default-any-region-new-orgs-2026-03-09"

[[product.processing_region.point]]
text = "Storage stays put while processing moves: your customer data remains stored only in the region where your account is located. codes=GLOBAL therefore describes the processing location of the inference payload, not the storage location of account data."
text_zh = "存储不动、处理可动：客户数据只存在账户所在区域。因此 codes=GLOBAL 描述的是推理载荷的处理地，不是账户数据的存储地。"
anchor = "cri-customer-data-stored-only-in-account-region"

[[product.processing_region.point]]
text = "What actually crosses the boundary: during cross-region inference the inference payload — the input prompt you send and the output response you receive — is transmitted transiently to the processing region for the duration of processing, and no customer data is persisted in the processing region."
text_zh = "真正跨区的是推理载荷：处理期间只有输入提示与输出响应临时传输到处理区域，处理区域不持久化客户数据。"
anchor = "cri-payload-transmitted-transiently-not-persisted"

[[product.processing_region.point]]
text = "Contract-layer limit kept alongside the above: once Customer has selected a Hosting Region, Snowflake will not Process Customer Personal Data from outside the Hosting Region except as reasonably necessary to provide the Snowflake Offerings procured by Customer, or as necessary to comply with the law or binding order of a governmental body. Cross-region inference falls under the 'reasonably necessary to provide the procured Offerings' exception."
text_zh = "与上述事实并列保留的合同层限定：DPA §7.1 规定客户选定 Hosting Region 后不在区外处理 Customer Personal Data，例外为「为提供所购 Offering 所合理必需」或法律/政府强制令；跨区推理落在该例外之内。"
anchor = "dpa-7-1-hosting-region-no-outside-processing"

[[product.processing_region.point]]
text = "Upstream hop when frontier models are called: Claude (Anthropic on AWS Bedrock), GPT (Azure OpenAI) and Gemini (GCP) are served at the CSP-hosted frontier model endpoint instead of a Snowflake GPU cluster. Source level is official_blog — a discovery lead only; that hop's own ZDR has to be applied for separately and does not come together with Snowflake's."
text_zh = "调用 frontier 模型时的上游跳：Claude（Anthropic on AWS Bedrock）、GPT（Azure OpenAI）、Gemini（GCP）在 CSP 托管端点上完成，而不是 Snowflake GPU 集群。来源层级为 official_blog，仅作发现线索；该跳的 ZDR 需各自申请，不自动与 Snowflake 同开。"
anchor = "blog-frontier-models-run-on-csp-endpoints"

[[product.processing_region.point]]
text_zh = "撤下：原 point 里「web search 的查询与结果离开 Snowflake 走公网」与「Cortex Agents 页面同标 PRC 不可用」两条出自本文件未声明、仓库也没有快照的页面，本轮无法复核，故不作为本维度依据；要引用须先补 [[source]] 并由 bot 抓回快照。"

[product.role]
kind = "processor"
anchor = "dpa-3-1-snowflake-only-data-processor"

[[product.role.point]]
text_zh = "主体角色同 api 档（processor，Usage Data 例外为控制者）。本档的不确定性在**上游跳**：Cortex Agents 的工具链会调用第三方服务（web search 等），公开文本未说明 Snowflake 与这些第三方之间的角色安排，故不据此推下游角色。"

[[product.role.point]]
text_zh = "AI Terms §5.1 规定第三方 Pass-Through Terms 不改变 Snowflake 在 AI Terms 下的义务，但该条只说明 Pass-Through Terms 的效力，不回答工具链上第三方的角色。故对「agent 工具链上的第三方」角色，公开文本无答案。"

[[product.role.point]]
text = "Upstream hop the role chain does not cover: when frontier models are called, inference terminates at the CSP-hosted frontier model endpoint (Claude on AWS Bedrock, GPT on Azure OpenAI, Gemini on GCP) rather than a Snowflake GPU cluster. The public text does not describe the role arrangement between Snowflake and those providers for that hop, so it is not read as a role determination here; source level is official_blog."
text_zh = "角色链未覆盖的上游跳：调用 frontier 模型时推理在 CSP 托管端点完成（Claude on AWS Bedrock、GPT on Azure OpenAI、Gemini on GCP），而不是 Snowflake GPU 集群。公开文本未说明该跳上 Snowflake 与这些厂商的角色安排，故不据此作角色认定；来源层级为 official_blog。"

[[product.role.point]]
text_zh = "撤下：原依据里「web search 使用 Brave Web Search API」「查询与结果离开 Snowflake 边界」「Brave 不在 Pass-Through Terms 名单内」等表述出自本文件未声明、仓库也没有快照的页面，本轮无法复核，故不作为本维度依据；要引用须先补 [[source]] 并由 bot 抓回快照。"

