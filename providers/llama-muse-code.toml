[[product.role.point]]
anchor = "llama-tos-5-1-processor-standard"
text = "The only role wording in the ToS is §5.1: under Standard Services, \"Meta will collect, use, process, and share such data as a “Service Provider” or “Processor” (each as defined in the MGPT)\". It sits under §5, so it holds when a Standard model is selected; §6 contains no Service Provider or Processor wording at all."
text_zh = "ToS 里唯一的角色表述在 §5.1：Standard Services 项下『Meta will collect, use, process, and share such data as a “Service Provider” or “Processor” (each as defined in the MGPT)』。该句挂在 §5 项下，选 Standard 模型时成立；§6 全文没有任何 Service Provider / Processor 表述。"

[[product.role.point]]
anchor = "llama-tos-13-4-subscription-model-determines"
text = "The subscription tier produces no role clause of its own: per §13.4 which section applies depends on the model selected. Whether a Coding Harness Subscription defaults to a Standard model, and which models it may select, cannot be verified from any source registered in this file, so an unconditional processor determination is not supportable and the role is recorded as not specified — the same treatment as the api-contributor tier, whose section carries no processor statement."
text_zh = "订阅档本身不产生独立的角色条款：按 §13.4，适用哪一节取决于所选模型。订阅是否默认给 Standard 模型、可选哪些模型，在本文件已登记的来源里无法核实，因此无法作无条件的 processor 判定，角色记未约定——与 api-contributor 档(其所属章节无 processor 声明)同一口径。"

