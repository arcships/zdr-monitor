[[product.role.point]]
text = "The subscription tier produces no separate role clause of its own: depending on the model selected it falls under §5 (processor) or §6 (no processor statement)."
text_zh = "订阅档本身不产生独立的角色条款：随所选模型落到 §5(processor)或 §6(无 processor 声明)。"

