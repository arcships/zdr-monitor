[[product.processing_region.point]]
text = "No processing-location or data-residency wording covers this tier: §5.1 only authorizes subprocessors \"included in the list located here\", and §20 is the general section (assignment, notices, contracting-entity addresses, sanctions). The subprocessor list we checked — the current Meta Horizon Managed Solutions list, previously published at forwork.meta.com/legal/mfw-subprocessor-list/ — is branded for a different product line and discloses only where the subprocessors themselves are located; it says nothing about where inference runs for this tier and gives no residency commitment, so it is not read as a statement about this tier's processing region. Recorded as not found."
text_zh = "本档没有任何处理地或数据驻留表述：§5.1 只授权使用『included in the list located here』所列的子处理者，§20 是总则(转让、通知、签约实体地址、制裁)。我们查阅的子处理者清单——现行 Meta Horizon Managed Solutions 清单，旧地址为 forwork.meta.com/legal/mfw-subprocessor-list/——冠名另一条产品线，只披露子处理者自身的所在地，没有说明本档的推理在哪里发生，也没有驻留承诺，故不读作对本档处理地的表述。记 not_found。"

