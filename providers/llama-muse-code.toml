[[product.role.point]]
anchor = "llama-tos-5-1-processor-standard"
text = "The only role wording in the ToS is §5.1: under Standard Services, \"Meta will collect, use, process, and share such data as a “Service Provider” or “Processor” (each as defined in the MGPT)\". It sits under §5, so it holds only once the Account setting is changed to Standard Services (§3.3); §6 contains no Service Provider or Processor wording at all."
text_zh = "ToS 里唯一的角色表述在 §5.1：Standard Services 项下『Meta will collect, use, process, and share such data as a “Service Provider” or “Processor” (each as defined in the MGPT)』。该句挂在 §5 项下，只有在 Account 设置改成 Standard Services 之后才成立(§3.3)；§6 全文没有任何 Service Provider / Processor 表述。"

[[product.role.point]]
anchor = "llama-tos-13-4-subscription-account-setting-determines"
text = "The subscription tier produces no role clause of its own: per §13.4 which section applies depends on the Account setting, and §3.3 makes the default the Contributor Services — the section with no processor wording. A processor determination therefore holds only for a subscription that has been switched to Standard Services; for the default (Contributor) case the role is not specified, the same treatment as the api-contributor tier."
text_zh = "订阅档本身不产生独立的角色条款：按 §13.4，适用哪一节取决于 Account 设置，而 §3.3 让默认即 Contributor Services——这一节没有任何 processor 表述。因此 processor 定性只对已切到 Standard Services 的订阅成立；默认(Contributor)情形下属未约定角色，与 api-contributor 档同一口径。"

