]

[[product.zdr.point]]
text = "The ZDR help page says only that it is for qualified Meta Model API accounts and that \"support may vary by model\", without stating whether Muse Code subscription credentials can enable ZDR. The subscription uses the same API credentials, but Meta has taken no position, so this is recorded as not_found."
text_zh = "ZDR 帮助页只说面向 qualified Meta Model API accounts、且『support may vary by model』，未说明 Muse Code 订阅凭据能否启用 ZDR。订阅用的是同一 API 凭据，但官方未表态，记 not_found。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "llama-tos-4-4-retention-purposes"

[[product.retention.point]]
text = "Consistent with the underlying tiers (§4.4, retained as needed, no quantified period). One open item to note: every Muse Code run writes an append-only session event log (model calls, tool calls and their results, approval decisions), kept by default and disabled with --no-session-log"
text_zh = "与底层档位一致(§4.4 按需保留、无量化期限)。另需注意一个未定项：Muse Code 每次运行都会写 append-only 会话事件日志(含模型调用、工具调用与结果、审批决定)，默认保留，--no-session-log 可关闭"

[[product.retention.point]]
text = "The docs do not say whether that log lives in the local workspace or on the server, so it is not counted in the retention conclusion."
text_zh = "文档没有说明该日志存在本地工作区还是服务端，故未计入 retention 结论。"

[[product.retention.point]]
anchor = "llama-tos-4-2-usage-data"
text = "Content not being used for training is not the same as technical logs not being used for improvement: §4.2 defines Usage Data (tool call sequences, API request metadata, error or other logs, timestamps, token counts, latency measurements, operational metrics and telemetry) and lets Meta use it \"to test, support, develop, evaluate, and improve the Meta Model API and other technologies, products and services\" — \"Subject to restrictions in Section 5.1\", and that restriction only keeps Content out of training. Object = technical logs, not Inputs/Outputs; it applies under both tiers."
text_zh = "Content 不训练 ≠ 技术日志不用于改进：§4.2 定义 Usage Data(工具调用序列、API 请求元数据、错误或其他日志、时间戳、token 计数、延迟测量、运营指标)并允许 Meta 将其用于『test, support, develop, evaluate, and improve the Meta Model API and other technologies, products and services』，且注明『Subject to restrictions in Section 5.1』——而 §5.1 的限制只把 Content 挡在训练之外。对象是技术日志而非输入输出正文，两档都适用。"

[[product.retention.point]]
anchor = "llama-tos-4-1-instruct-retain-aup"
text = "Separate from §4.4, §4.1 has the customer instruct Meta \"to retain and process Content as necessary to detect, prevent, and respond to violations of our Model API AUP (defined below) or these Terms and to develop, evaluate, and improve systems for the safety and the security of Meta products and services.\" It applies to both tiers and sits on the training/retention boundary: an instruction to retain and process Content, not a licence to train models — so \"Content is not used for training\" must not be read as \"no data is ever used to improve anything\"."
text_zh = "§4.1 在 §4.4 之外另有一条：客户指示 Meta『to retain and process Content as necessary to detect, prevent, and respond to violations of our Model API AUP (defined below) or these Terms and to develop, evaluate, and improve systems for the safety and the security of Meta products and services』。该句对两档都适用，压在 training 与 retention 的边界上——是保留与处理 Content 的指示，不是训练模型的授权，因此『Content 不训练』不能读成『任何数据都不用于改进』。"

[[product.retention.point]]
anchor = "llama-tos-6-1-retain-contributor"
text = "The subscription now sits under §6 by default (§3.3), so this retention ground applies by default rather than only when a Contributor model is chosen: §6.1 permits Meta to retain and process Content \"(i) to the extent necessary for compliance with applicable laws; (ii) in connection with the exercise of Meta's rights to use your Content under this Section 6; and (iii) when our systems flag data for a potential policy violation\" — the training use itself is a ground for retention, on top of the five purposes in §4.4. §6.1 also adds that Content previously submitted to the Standard Services becomes Content submitted to the Contributor Services if it is included in any request to the Contributor Services, so the §6 grounds can reach earlier Standard Content."
text_zh = "订阅现在默认落在 §6(§3.3)，因此这条保留依据默认适用，而不只是选到 Contributor 模型时才适用：§6.1 允许 Meta 保留并处理 Content『(i) to the extent necessary for compliance with applicable laws; (ii) in connection with the exercise of Meta's rights to use your Content under this Section 6; and (iii) when our systems flag data for a potential policy violation』——即训练用途本身构成保留理由，叠加在 §4.4 五项目的外。§6.1 还新增一句：此前提交给 Standard Services 的 Content 一旦随请求进入 Contributor Services 即视为提交给 Contributor Services，故 §6 的保留依据可以覆盖更早的 Standard 内容。"

[[product.retention.point]]
anchor = "llama-tos-6-2-no-confidential-to-contributor"
text = "Also on the default Contributor tier: §6.2 states \"You must not submit sensitive, confidential, or personal information to the Contributor Services\", and that anyone who needs information such as software code kept confidential must not submit it there. This is a condition on using the Contributor tier, not a retention commitment, and it does not apply to runs on Standard Services."
text_zh = "同在默认的 Contributor 档：§6.2 写明『You must not submit sensitive, confidential, or personal information to the Contributor Services』，且需要将软件代码等信息保密者不得将其提交到该档。这是使用 Contributor 档的条件，不是保留承诺，也不适用于走 Standard Services 的调用。"

[[product.retention.point]]
anchor = "llama-tos-12-confidentiality-not-limiting-retention"
text = "Confidentiality does not cut down the data terms: §12 states that \"Your Content constitutes your Confidential Information; however, Meta's rights to use, process, and retain Content as described in Sections 4, 5, and 6 are not restricted by this Section 12.\" Procurement can misread §12 as protective deletion of confidential content; it is not."
text_zh = "保密条款不削减数据条款：§12 写明『Your Content constitutes your Confidential Information; however, Meta's rights to use, process, and retain Content as described in Sections 4, 5, and 6 are not restricted by this Section 12.』采购容易把 §12 读成机密内容会被保护性删除，实际不是。"

[[product.retention.point]]
anchor = "llama-tos-15-4-data-sections-survive-termination"
text = "And the data sections survive termination: §15.4(iii) lists the sections that survive, including 4, 5, 6 and 12. The public terms therefore carry no \"deleted on termination\" commitment — what survives is the clauses' force and Meta's rights, which is not a commitment to keep the content."
text_zh = "且数据条款在协议终止后存续：§15.4(iii) 列出的存续条款包含 4、5、6、12。公开条款因此没有『终止即删除』的承诺——存续的是条款效力与 Meta 的权利，不等于厂商承诺保留内容。"

