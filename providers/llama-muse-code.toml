[[source]]
url = "https://dev.meta.ai/legal/terms-of-service"
fetch = "jina"
channel = "contract"
tier = "core"
note = "《Meta Model API Terms of Service》(Last updated: October 9, 2026)。签约主体是 Meta Platforms, Inc. 或 Meta Platforms Ireland Limited(欧洲区)。本文件覆盖 Meta Model API 的两个档位，两档数据条款方向相反：Standard Services(§5，§5.1 明确 Meta 以 Service Provider/Processor 身份处理、且不用 Standard Services 的 Content 训练 Meta Models)与 Contributor Services(§6，§6.1 明确 Meta 可用 Content 训练自有 AI 模型)。本版把旧版的 Discounted Services 改名为 Contributor Services。关键变化是新增 §3.3：Coding Harness Subscription 默认即 Contributor Services、适用 §6；用户须改 Account 设置才能切到 Standard、适用 §5，且该切换只向将来生效。§13.4 相应由『由所选模型决定』改为『由 Account 设置决定』。§4.2 单独定义 Usage Data 并允许用于改进(与 Content 训练是两件事)；§4.4 是保留条款；§12 与 §15.4 说明数据条款在协议终止后仍存续。§2 以引用方式并入 MGPT、Supplemental Managed Accounts Terms、Data Security Terms。本文件是 training / retention / role 三个维度的权威来源。"

[[source]]
url = "https://dev.meta.ai/legal/geographic-use-policy"
fetch = "jina"
channel = "contract"
tier = "core"
note = "《Meta Model API Model Designation and Geographic Use Policy》(Last updated: September 18, 2026)，ToS 的组成部分。§1 列出 Standard Models(Muse Image、Muse Spark 1.1/1.2/1.3、Muse Voice Transcribe、SAM 3.1)与 Discounted Models(Muse Spark 1.2 Contributor、Muse Spark 1.3 Contributor)，用于界定『Standard 模型』具体指哪些模型。注：ToS 在 2026-10-09 版把该档改称 Contributor Models，本政策仍写 Discounted Models，两者是同一组模型，政策本文未变。§2/§3 是服务访问地域限制(Restricted Territories)，不是处理地或驻留披露，故本文件只把它当作模型档位归属的证据。"

[[product]]
id = "muse-code-subscription"
badge = "Muse Code 订阅"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "llama-tos-3-3-subscription-default-contributor"

[[product.training.point]]
anchor = "llama-tos-3-3-subscription-default-contributor"
text = "This subscription is on the training tier by default. §3.3, added in the October 9, 2026 version, states: \"you are considered to be using the Contributor Services by default regardless of which Meta Model you select, and Section 6 applies to that access and use\"; the no-training Standard Services path applies only \"from the time that election takes effect\" after the Account setting is changed."
text_zh = "本订阅默认落在会训练的那一档。§3.3(2026 年 10 月 9 日版新增)写明：『you are considered to be using the Contributor Services by default regardless of which Meta Model you select, and Section 6 applies to that access and use』；不训练的 Standard Services 路径只在改过 Account 设置、『from the time that election takes effect』之后才适用。"

[[product.training.point]]
anchor = "llama-tos-6-1-train-contributor"
text = "On the default Contributor tier §6.1 authorizes training: Meta may use your Content \"to train, develop, evaluate, and improve Meta's artificial intelligence models, products, and services.\" §6.2 adds that the Contributor Services do not offer a mechanism to exclude specific traffic from training, so traffic that must not be trained has to move to the Standard Services."
text_zh = "在默认的 Contributor 档上，§6.1 授权训练：Meta 可用你的 Content『to train, develop, evaluate, and improve Meta's artificial intelligence models, products, and services』。§6.2 另写明 Contributor Services 没有按流量排除训练的机制，不能被训练的流量只能改用 Standard Services。"

[[product.training.point]]
anchor = "llama-tos-5-1-no-train-standard"
text = "The no-training promise now turns on a setting rather than on the model selected: §5.1 says Meta \"will not use Content submitted in a request to the Standard Services to train Meta Models.\" Under §3.3 a subscription reaches Standard Services only after the Account setting is changed, and the change is prospective only — Content previously submitted to the Contributor Services stays subject to §6."
text_zh = "不训练承诺现在取决于设置而不是所选模型：§5.1 写明 Meta『will not use Content submitted in a request to the Standard Services to train Meta Models』。按 §3.3，订阅只有在改了 Account 设置之后才走到 Standard Services，且切换只向将来生效——此前提交给 Contributor Services 的 Content 仍受 §6 约束。"

[[product.training.point]]
anchor = "llama-tos-6-2-no-confidential-to-contributor"
text = "On the default Contributor tier §6.2 makes this a condition of use: \"You must not submit sensitive, confidential, or personal information to the Contributor Services\", and anyone who needs information such as software code kept confidential must not submit it there. It is a condition on the Contributor tier, not on the Standard tier."
text_zh = "在默认的 Contributor 档上，§6.2 把这一点写成使用条件：『You must not submit sensitive, confidential, or personal information to the Contributor Services』，需要将软件代码等信息保密者不得将其提交到该档。这是 Contributor 档的使用条件，不是 Standard 档的。"

[[product.training.point]]
anchor = "llama-tos-13-4-subscription-account-setting-determines"
text = "§13.4 now ties the applicable data terms to the Account setting, not to the model: \"When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.\" This supersedes the previous version's \"The Models you select determine how Meta may use your Content\", and with it the old inference that a subscription might select a Contributor (then \"Discounted\") model and the open question about its default model."
text_zh = "§13.4 现在把适用哪套数据条款挂在 Account 设置上，而不是所选模型：『When using the Coding Harness Subscription, the Account setting you select determines how Meta may use your Content, as described in Sections 3.3, 5 and 6.』这取代了旧版『The Models you select determine how Meta may use your Content』的措辞，也取代了旧版『订阅下可能选到 Contributor(当时叫 Discounted)模型』的推断与默认模型这一悬置问题。"

[[product.training.point]]
anchor = "llama-model-designation-standard"
text = "Which models are \"Standard\" is fixed by §1 of the Model Designation and Geographic Use Policy: Muse Spark 1.2 and Muse Spark 1.3 are Standard Models, and Muse Spark 1.2 Contributor and Muse Spark 1.3 Contributor are the Contributor Models (that policy, still dated September 18, 2026, labels the latter \"Discounted Models\"; the ToS's \"Contributor\" and the policy's \"Discounted\" are the same set). Under §3.3 the subscription's designation no longer follows the model selected, so the default is Contributor whichever model it may use; which models a Coding Harness Subscription may select is still not verifiable from any source registered in this file — that gap is ours, not a Meta statement."
text_zh = "『Standard』具体指哪些模型由《Model Designation and Geographic Use Policy》§1 界定：Muse Spark 1.2、Muse Spark 1.3 为 Standard Models，Muse Spark 1.2/1.3 Contributor 为 Contributor Models(该政策仍标注 September 18, 2026，把后者写成『Discounted Models』；ToS 的『Contributor』与政策的『Discounted』是同一组模型)。按 §3.3，订阅档位不再随所选模型变，默认即 Contributor；但订阅可选哪些模型在本文件已登记的来源里仍无法核实——这是我方证据缺口、不是 Meta 的表态。"

