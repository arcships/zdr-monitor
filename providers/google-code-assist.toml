note = "Gemini CLI 官方文档(google-gemini GitHub 组织 Pages 站)「Terms of Service and Privacy Notice」,逐档列明认证方式对应的条款与训练归属。对 api 档 Paid/Unpaid 的表述与 Additional Terms 一致,作辅助;其关于 Gemini Code Assist for individuals 的表述已随该档 2026-06-18 停服而过时,且其链接的 individuals 隐私声明 URL 已变为停用公告页。"

[[source]]
url = "https://policies.google.com/terms?hl=en-US"
channel = "contract"
tier = "core"
note = "Google 消费者服务条款(合同相对方 Google LLC)。只用于消费档(code-assist-personal 停服前条款体系、antigravity-consumer)的 role;不适用于 Gemini Developer API(后者由 Google APIs ToS + Gemini API Additional Terms 管辖)。"

[[source]]
url = "https://cloud.google.com/gemini/docs/codeassist/security-privacy-compliance"
channel = "enterprise_privacy_faq"
tier = "core"
note = "Gemini Code Assist Standard/Enterprise 官方隐私说明(Security, privacy, and compliance for Gemini Code Assist Standard and Enterprise,即 CLI 页逐档指定的 Gemini Code Assist Privacy Notices for Standard and Enterprise)。本产品线 Standard/Enterprise 两档留存(第 65 行 stateless/不存储)、处理地(第 82 行全球 Google Edge Network)、角色(第 88 行对全部 Customer Data 为 data processor)三条产品级正面表述的主证据;个人档(已停服)仅作查阅范围。"

[[source]]
url = "https://policies.google.com/privacy?hl=en&gl=ie"
channel = "consumer_privacy"
tier = "core"
note = "Google 消费者隐私政策(EEA/瑞士版,渲染出 Data controller 段)。只用于 code-assist-personal 停服前条款体系的 role(控制者按所在地指定);其 Data transfers 段的「服务器遍布全球」是通用政策表述,不构成本产品线各档的处理地承诺。"

[[product]]
id = "code-assist-personal"
badge = "Code Assist"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
searched = [
  "https://developers.google.com/gemini-code-assist/resources/privacy-notice-gemini-code-assist-individuals",
  "https://developers.google.com/gemini-code-assist/resources/privacy-notices",
