tier = "core"
note = "Gemini CLI 官方文档(google-gemini GitHub 组织 Pages 站)「Terms of Service and Privacy Notice」,逐档列明认证方式对应的条款与训练归属。对 api 档 Paid/Unpaid 的表述与 Additional Terms 一致,作辅助;其关于 Gemini Code Assist for individuals 的表述已随该档 2026-06-18 停服而过时,且其链接的 individuals 隐私声明 URL 已变为停用公告页。"

[[source]]
url = "https://policies.google.com/terms?hl=en-US"
