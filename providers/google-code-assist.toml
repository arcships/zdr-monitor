  "https://developers.google.com/gemini-code-assist/docs/privacy-notice-individuals (HTTP 404)",
  "https://developers.google.com/gemini-code-assist/resources/privacy-notice-individuals (HTTP 404)",
  "https://developers.google.com/gemini-code-assist/resources/tos-privacy (HTTP 404)",
]
mode = "opt_out"
anchor = "training-gca-individuals-collected"

[[product.training.point]]
text_zh = "仍在线的官方 Gemini CLI 文档逐档写明:个人 Google 账号登录 Gemini Code Assist for individuals 时「prompts, answers, and related code are collected and may be used to improve Google's products, including for model training」,且其链接指向的 individuals 隐私声明 URL 现已变成停用公告页。旧记录据快照记的「默认收集并可用于训练 + 可 opt out」无法用现行原文复核。"

[[product.training.point]]
text = "Contract layer (the consumer Google Terms of Service that governed this tier before it shut down): the content licence is granted for the limited purpose of operating and improving the services. Under this ledger rule, using content to improve the service counts as training, so this is an independent line of evidence pointing the same way as the CLI page."
text_zh = "合同层(本档停服前适用的 Google 消费者服务条款):用户内容的许可目的之一是「operating and improving the services」——按本台账口径「用于改进服务」即算训练,是个人档 training=no 的独立同向依据,与 CLI 页第 43 行的表述并列。口径优先级 contract > developer_data;该条款只适用本档,不得外推到 Standard/Enterprise 档。"
anchor = "training-google-tos-license-operating-improving"

[[product.training.point]]
text = "The same licence also covers developing new technologies and services for Google, again at the contract layer and not limited to operating this service."
text_zh = "同一许可还覆盖为 Google「developing new technologies and services」,同属合同层,且不限于本服务自身的运营与改进。"
anchor = "training-google-tos-license-new-technologies"

[product.zdr]
mark = "unknown"
searched = [
  "https://developers.google.com/gemini-code-assist/resources/privacy-notice-gemini-code-assist-individuals",
  "https://ai.google.dev/gemini-api/docs/zdr",
  "https://ai.google.dev/gemini-api/terms",
  "https://google-gemini.github.io/gemini-cli/docs/tos-privacy.html",
  "https://policies.google.com/privacy?hl=en&gl=ie",
]

