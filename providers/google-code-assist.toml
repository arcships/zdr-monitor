text_zh = "仍在线的官方 Gemini CLI 文档逐档写明:个人 Google 账号登录 Gemini Code Assist for individuals 时「prompts, answers, and related code are collected and may be used to improve Google's products, including for model training」,且其链接指向的 individuals 隐私声明 URL 现已变成停用公告页。旧记录据快照记的「默认收集并可用于训练 + 可 opt out」无法用现行原文复核。"

