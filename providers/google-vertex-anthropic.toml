[[source]]
url = "https://platform.claude.com/docs/en/manage-claude/api-and-data-retention"
channel = "developer_data"
tier = "contradiction"
note = "与 core 文档 https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data(下称 7996866,api 档 retention 维度的依据)就同一档位(商业/API 档的默认保留)表述不一致。①本文件原句(『How Anthropic approaches data retention』承诺列表第 2 条):「Only what is technically necessary for the feature to work is retained. Conversation content (your prompts and Claude's outputs) is not retained by default; the exception is [Covered Models](https://platform.claude.com/docs/en/manage-claude/api-and-data-retention#model-specific-data-retention-requirements), which require 30-day retention.」——默认档下 API 的 prompt/output 不保留;②7996866 原句(『Standard Retention Timeframe』):「For Anthropic API users, we automatically delete inputs and outputs on our backend within 30 days of receipt or generation, except:」——默认档下 prompt/output 会落到后端、最迟 30 天删除。两句对象相同(API 档的输入输出)、问题相同(默认是否保留),答案相反。各自范围:本文件页首自述覆盖 Claude API(api.anthropic.com)、Claude Platform on AWS、Claude in Microsoft Foundry 且 Anthropic 为 data processor,并在『What ZDR does not cover』明列 Claude Free/Pro/Max 不在覆盖内;7996866 文首自述讲商业档(Claude for Work / Anthropic API),且本文件第 3 段把 7996866 指为「the commercial data retention policy」(即本文件自己承认标准保留口径以 7996866 为准)。四种解释逐条排除:①适用范围——两份都逐字指向 API 档(主语分别是「Anthropic API users」与 Claude API/Claude Platform on AWS/Foundry),不属「一份管 API、一份管消费产品」;消费档另有 10023548,本文件亦正面排除 Free/Pro/Max。②档位——同为商业/API 档;本文件对企业/Team 界面只作 ZDR 排除,未给出与 API 不同的保留期限,不存在企业版 vs 个人版之分。③站点——同为 Anthropic 官方域名(privacy.claude.com 与 platform.claude.com),同一法律实体,无国内站/国际站之分。④时效——均为现行版本:7996866 的原始 HTML 抓取标注「Updated over 2 months ago」(抓取日 2026-09-21,约 2026-07 更新),本文件为 platform.claude.com 现行页(页面数据时间戳 2026-09-21,正文引用 Fable 5.1 / Mythos 5.1 / Claude Managed Agents 等当期功能),不存在新版覆盖旧版。旁证(同方向,均官方):code.claude.com/docs/en/data-usage 在「Commercial users (Team, Enterprise, and API)」下列「Standard: 30-day retention period」并把 ZDR 列为额外选项,同页另写「Enable Zero Data Retention for no server-side persistence」(反推不启用 ZDR 时存在服务端持久化);privacy 8956058 称 ZDR 安排「distinct from Anthropic’s default approach to data retention」并链接 7996866。已考虑但未采纳的调和解释:本句位于「功能是否需要落盘」的承诺段落,可读作「功能层不落盘」而非「默认档整体不保留」;但该句自身的例外从句用的是保留口径(「Covered Models, which require 30-day retention」,与 7996866「for Covered Models, we require limited data retention and review」描述的是同一现象),且本页 ZDR 段落以「不启用 ZDR 时存在服务端存储」为前提(「Where a feature does not require storage … it may be eligible for ZDR」),故「功能层」读法无法消解字面冲突,只能靠厂商澄清。需厂商书面澄清:①默认(未开通 ZDR)档下 API 的 prompt/output 是否写入后端存储;②若写入,是否适用 7996866 的 30 天自动删除窗口;③「is not retained by default」的准确含义是功能层(功能不需要落盘)还是安排层(默认档整体不保留)。澄清前 api 档 retention 以 7996866 为 core,本页仅作矛盾的另一半证据保留全部锚点、每天抓;本页其余内容(ZDR/HIPAA 安排、功能资格表、processor 声明)未见与任何 core 文档冲突。"

