[[product.zdr.point]]
text = "Anthropic's Covered Models policy says it plainly: zero data retention is not available in workspaces, Claude Enterprise organizations, or third-party platforms where Covered Models can be accessed — Google Cloud Agent Platform is one of those platforms."
text_zh = "Anthropic 的 Covered Models 政策写明：在可访问 Covered Models 的工作区、Claude Enterprise 组织或第三方平台上不提供零数据保留——Google Cloud Agent Platform 正是这类平台。"
anchor = "cm-zdr-not-available-where-covered-models"

[[product.zdr.point]]
text = "Counter-statement kept side by side rather than reconciled: eligible customers are offered the option to use ZDR with Fable 5 and Fable 5.1 for their own internal business applications, for a limited time, as a transition to Enterprise Frontier Safeguards. The contract layer still supersedes modified retention commitments such as ZDR."
text_zh = "并列保留、不调和的反向表述：符合条件的客户可限时获得对 Fable 5 / Fable 5.1 使用 ZDR 的选项（仅限自有内部业务应用，作为向 Enterprise Frontier Safeguards 的过渡）。合同层仍然明确优先于 ZDR 等修改后的保留承诺。"
anchor = "cm-limited-time-zdr-transition"

[product.retention]
days = 30
object = "input_output"
basis = "fixed_period"
anchor = "cm-30d-minimum-retention"

[[product.retention.point]]
text = "Anthropic's 30 days is a floor, not a ceiling: prompts and model completions are retained for at least 30 days and then automatically deleted, unless they are subject to a safety investigation or Anthropic is legally required to maintain them."
text_zh = "Anthropic 的 30 天是下限而非上限：prompt 与模型输出至少保留 30 天后再自动删除，除非处于安全调查中或法律要求继续保留。"
anchor = "cm-30d-at-least-with-exceptions"

[[product.retention.point]]
text = "Google's side gives the same 30 days as an upper bound and adds an enablement duty: for Anthropic Claude Fable 5 on Google Cloud and Mythos 5, prompts and responses are retained for up to 30 days, and using those models requires enabling sharing of that data with Anthropic. The two figures describe different things and are kept side by side."
text_zh = "Google 一侧给出的是同一段 30 天的上限，并附加一项开启义务：Claude Fable 5 on Google Cloud 与 Mythos 5 的 prompt 与 response 最多保留 30 天，且使用这些模型必须开启与 Anthropic 的数据共享。两个数字说的不是同一件事，并列保留。"
anchor = "abuse-claude-fable-mythos-30d"

[[product.retention.point]]
text = "The Fable 5 model page repeats the Google-side figure: all prompts and responses are stored for up to 30 days for the sole purpose of monitoring for potential abuse of relevant terms of service."
text_zh = "Fable 5 型号页重复了 Google 一侧的口径：所有 prompt 与 response 最多存储 30 天，且仅用于监控是否滥用相关服务条款。"
anchor = "fable5-advanced-ai-30d"

[[product.retention.point]]
text = "These policies follow the model and apply wherever Covered Models are offered, including third-party cloud platforms."
text_zh = "这些政策随模型走，适用于所有提供 Covered Models 的地方，包括第三方云平台。"
anchor = "cm-policies-follow-model-all-platforms"

[[product.retention.point]]
text = "Anthropic's API documentation states the same requirement for third-party platforms: the 30-day data retention requirement applies wherever Covered Models are offered."
text_zh = "Anthropic 的 API 文档对第三方平台给出同一条要求：该 30 天保留要求适用于所有提供 Covered Models 的地方。"
anchor = "anth-doc-covered-models-30d-anywhere"

[[product.retention.point]]
text = "Where that retained data sits on this platform: on Google Cloud's Agent Platform retained data stays within the cloud provider's environment."
text_zh = "这些留存数据在云平台上的位置：在 Google Cloud Agent Platform 上，留存数据留在云厂商环境内。"
anchor = "anth-doc-retained-data-in-cloud-provider-env"

[product.processing_region]
codes = ["selected", "global"]
anchor = "dr-doc-ml-processing-by-endpoint"

[[product.processing_region.point]]
text = "Processing location is set by the choice of endpoint, and global endpoints route and process data anywhere globally with no residency guarantee."
text_zh = "处理地由所选的端点决定；global 端点在全球任意位置路由和处理数据，不提供驻留保证。"
anchor = "dr-doc-global-endpoint-no-guarantee"

[[product.processing_region.point]]
text = "The Fable 5 model page lists Global / global endpoint among the model's available regions, so a global endpoint is a documented option for this row — that is why the codes here include global."
text_zh = "Fable 5 型号页把 Global / global endpoint 列在该型号的可用区域里，因此经 global 端点调用是本行有据可依的选项——本行 codes 因此含 global。"
anchor = "fable5-model-availability-global"

[[product.processing_region.point]]
text = "But the same page's ML processing row lists only United States / Europe multi-region and Asia Pacific asia-southeast1, so what applies is per-model regional support rather than a blanket any-region."
text_zh = "但同一页的 ML processing 列只列 United States / Europe multi-region 与 Asia Pacific asia-southeast1，因此适用的是逐型号的区域支持，而非「任意区域皆可」。"
anchor = "fable5-ml-processing-regions"

[[product.processing_region.point]]
text = "Contract layer (CDPA §10.1): subject to Google's data location commitments under the Service Specific Terms and its data transfer commitments, Customer Data may be processed in any country where Google or its Subprocessors maintain facilities."
text_zh = "合同层（CDPA §10.1）：在 Google 于 Service Specific Terms 下的数据位置承诺与数据传输承诺约束下，Customer Data 可能在 Google 或其 Subprocessor 设有设施的任何国家处理。"
anchor = "cdpa-10-1-processing-locations"

[[product.processing_region.point]]
text = "SST §16 lets the customer configure both at-rest storage and machine learning processing of Customer Data into a specific Multi-Region, and Google will perform both only in that Multi-Region."
text_zh = "SST §16 允许客户把 Customer Data 的 at-rest 存储与 ML processing 一并配置到某个 Multi-Region，Google 只在那个 Multi-Region 内执行这两件事。"
anchor = "sst-16-ai-ml-data-location"

[product.role]
kind = "processor"
anchor = "cdpa-4-1-google-processor"

[[product.role.point]]
text = "Default on Cloud Platforms: the technology Anthropic provides to enable access to the Hosted Services does not give Anthropic access to any Customer instance within the Cloud Platforms, including the Inputs or Outputs they contain — subject to Section F.2 below."
text_zh = "云平台上的默认安排：Anthropic 为提供 Hosted Services 访问而提供的技术，不让 Anthropic 接触云平台上任何客户实例的内容（含其中的 Inputs/Outputs）——但受 §F.2 约束。"
anchor = "anth-sst-d-no-access-on-vertex"

[[product.role.point]]
text = "Covered Models change that: the Fable 5 model page requires prompt-response sharing with Anthropic for each model location, as required by Section F of Anthropic's Service Specific Terms."
text_zh = "Covered Models 改变了这一点：Fable 5 型号页要求为每个 model location 开启与 Anthropic 的 prompt-response 共享（Anthropic Service Specific Terms §F 的要求）。"
anchor = "fable5-required-anthropic-sharing"

[[product.role.point]]
text = "But the role itself does not change: for data regarding the customer's use of Covered Models via a Cloud Platform, Anthropic processes such data on the customer's behalf in accordance with the Anthropic Data Processing Agreement."
text_zh = "但角色本身不变：经云平台使用 Covered Models 所产生的数据，Anthropic 依 Anthropic DPA 以客户受托方身份处理。"
anchor = "anth-sst-f-2-cloud-platform-processor"

