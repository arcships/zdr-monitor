[[product]]
id = "codex-business"
badge = "Codex Business"
category = "coding_plan"
plan_level = "team"

[product.training]
mark = "yes"
mode = "default"
anchor = "openai-codex-business-no-training"

[product.zdr]
mark = "unknown"
searched = ["https://help.openai.com/en/articles/11369540-using-codex-with-your-chatgpt-plan", "https://developers.openai.com/codex/pricing", "https://openai.com/enterprise-privacy/", "https://developers.openai.com/api/docs/guides/your-data"]

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "openai-consumer-retention-chats"

[[product.retention.point]]
text = "Regular and archived chats remain saved until the user deletes them or an applicable workspace retention policy removes them — a published mechanism with no fixed number of days (object: inputs and outputs; context: default; period type: until user deletion or removal by the workspace retention policy). The page also covers workspace contexts: its overview says retention depends on \"any workspace retention policy that applies\""
text_zh = "对象=输入输出正文；语境=默认；期限类型=保存至用户删除或工作区留存策略移除，无固定天数。与消费档同源同读，不再记为「未公布期限」：留存页概述写明留存取决于「any workspace retention policy that applies」，工作区留存策略是页面已披露的移除机制"
anchor = "openai-consumer-retention-chats"

[[product.retention.point]]
text = "Codex usage, including local clients such as the CLI and IDE extension as well as web or cloud-delegated usage, is available in the Compliance API — a log surface separate from cloud-task-specific endpoints (object: usage logs / access surface; context: admin audit). The Codex pricing matrix lists the Compliance API and audit logs for Enterprise only, so availability on Business is not confirmed"
text_zh = "另有一条独立的日志面：Codex 用量（含 CLI、IDE 扩展等本地客户端与云委派用量）可在 Compliance API 中取得，独立于云任务专用端点（对象=用量日志/访问面；语境=管理方审计）。价格矩阵把 Compliance API 与审计日志只列在 Enterprise 行，Business 档是否可用未经确认"
anchor = "openai-codex-compliance-api-log-surface"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "openai-codex-business-no-residency-controls"

[[product.processing_region.point]]
text = "Tier-matching basis: in the Codex pricing matrix the row \"Enterprise retention and residency controls\" is marked \"—\" in the Business column (it is listed for Enterprise/Edu only), i.e. this tier is not listed with any residency control, so no selected region can be recorded"
text_zh = "档位匹配的依据是 Codex 价格矩阵：「Enterprise retention and residency controls」行在 Business 列为「—」（只有 Enterprise/Edu 有），即本档未列任何驻留控制，故不记 selected"
anchor = "openai-codex-business-no-residency-controls"

[[product.processing_region.point]]
text = "Background only, not primary evidence: \"Content is stored on OpenAI systems and our trusted service providers' systems in the US and around the world\" comes from the consumer-services FAQ, which itself says OpenAI handles business and managed-workspace data differently from data in personal consumer accounts, so its applicability to a Business workspace is not confirmed by OpenAI"
text_zh = "背景说明（不作主证据）：「Content is stored on OpenAI systems and our trusted service providers’ systems in the US and around the world」出自消费服务 FAQ，该页第 15 行自述 business 与 managed-workspace 数据同个人消费账号的处理方式不同，故这句对 Business 工作区的适用性未经官方确认"
anchor = "openai-consumer-region-storage"

