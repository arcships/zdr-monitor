[[product]]
id = "codex-free"
badge = "Codex Free"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "openai-consumer-training-may-train"

[[product.training.point]]
text_zh = "ChatGPT 个人账号的数据控制适用于 Codex；默认可能用于训练，可关闭 Improve the model for everyone。Codex 全环境另有独立开关。"

[[product.training.point]]
text = "Even after opting out of training, feedback the user proactively submits (for example thumbs up or thumbs down on a model response) can still be used: the entire conversation associated with that feedback may be used to train the models (context: after opting out)"
text_zh = "退出训练之后的例外：即使已退出，主动提交反馈（例如对模型回答点赞或点踩）时，与该反馈关联的整段对话仍可能被用于训练（语境=退出训练之后，不是默认路径）"
anchor = "openai-codex-consumer-training-feedback-exception"

[[product.training.point]]
text = "Codex has a separate \"Include environments\" setting in Codex settings for allowing training on full environments; changing the ChatGPT or Privacy Portal settings does not change it, so opting out of training does not cover it"
text_zh = "Codex 全环境（full environments）训练是 Codex 设置里的独立开关「Include environments」：改 ChatGPT 或 Privacy Portal 的设置不影响它，退出训练不覆盖这一项"
anchor = "openai-codex-training-include-environments"

[product.zdr]
mark = "unknown"
searched = ["https://help.openai.com/en/articles/11369540-using-codex-with-your-chatgpt-plan", "https://developers.openai.com/codex/pricing", "https://help.openai.com/en/articles/7730893-data-controls-faq", "https://help.openai.com/en/articles/8983778-how-are-files-vs-chats-retained"]

[[product.zdr.point]]
text_zh = "未找到 Codex Free 的 ZDR 承诺；API 的申请制 ZDR 不适用于 ChatGPT 登录路径。"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "openai-consumer-retention-chats"

[[product.retention.point]]
text_zh = "Codex 沿用 ChatGPT 数据控制；常规/归档对话保存至用户删除，删除后通常 30 天内永久删除。官方未单独披露本地仓库索引、云端环境或服务端缓存的固定期限。"

[[product.retention.point]]
text = "Temporary chats are a separate track from chats saved until deletion: they do not appear in chat history unless saved, and OpenAI may keep a copy for up to 30 days for safety purposes (object: temporary chat content; context: temporary chat; period type: upper bound)"
text_zh = "临时对话不属于「保存至用户删除」那一轨：不保存则不进入历史，OpenAI 可为安全目的最多保留 30 天（对象=临时对话正文；语境=临时对话；期限类型=上限）"
anchor = "openai-codex-consumer-temporary-chat-30d"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "openai-consumer-region-storage"

[[product.processing_region.point]]
text_zh = "ChatGPT 个人档内容存储于美国及世界各地；未提供 Codex Free 区域驻留。"

[product.role]
kind = "controller"
anchor = "openai-consumer-role-controller-row"

[[product.role.point]]
text_zh = "个人 ChatGPT 登录路径由 OpenAI 作为 controller；本地工作流在设备运行，云任务在 OpenAI 托管环境运行。"

[[product.role.point]]
text = "A limited number of authorized OpenAI personnel, and trusted service providers under confidentiality and security obligations, may access user content only as needed for abuse or security investigations, support, legal matters, or improving model performance (unless the user has opted out) — the content is not machine-only processing; this is an access-surface limitation and does not change the verdict"
text_zh = "内容不是纯机器处理：授权人员与受保密义务约束的服务商可按需访问用户内容，理由限于滥用/安全事件调查、支持、法律事务，以及改进模型（已退出训练者除外）。这是访问面的语境限定，不改变本档结论"
anchor = "openai-consumer-authorized-human-access"

