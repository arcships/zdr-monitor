anchor = "openai-api-role-dpa-processor"

[[product]]
id = "codex-enterprise"
badge = "Codex Enterprise / Edu"
category = "coding_plan"
plan_level = "enterprise"

[product.training]
mark = "yes"
mode = "default"
anchor = "openai-codex-business-no-training"

[product.zdr]
mark = "unknown"
searched = ["https://help.openai.com/en/articles/11369540-using-codex-with-your-chatgpt-plan", "https://developers.openai.com/codex/pricing", "https://openai.com/enterprise-privacy/", "https://developers.openai.com/api/docs/guides/your-data"]

[[product.zdr.point]]
text_zh = "价格矩阵仅声明企业留存与驻留控制；API 组织的 ZDR 不能外推为 ChatGPT Enterprise 的 Codex 云任务 ZDR。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "openai-codex-enterprise-controls"

[[product.retention.point]]
text = "The pricing matrix only shows that Enterprise/Edu have retention controls; the row itself carries no period, and no fixed period is published for Codex cloud-task content"
text_zh = "Enterprise/Edu 提供留存控制，但该矩阵未给固定期限；代码索引、云端环境及服务端缓存期限未披露"
anchor = "openai-codex-enterprise-controls"

[[product.retention.point]]
text = "Disclosed mechanism for this tier: for Enterprise, Edu and Healthcare workspaces, Library files follow the workspace retention policy — the period is set by the customer's own policy rather than a vendor default (object: Library files; context: default; period type: customer-configured)"
text_zh = "本档已披露的机制：Enterprise、Edu、Healthcare 工作区的 Library 文件保留期由工作区留存策略决定，即期限由客户策略设定而非厂商默认值（对象=Library 文件；语境=默认；期限类型=由客户策略决定）"
anchor = "openai-codex-enterprise-workspace-retention"

[[product.retention.point]]
text = "Quantified period (upper bound, exception context): in Enterprise workspaces some transient files that are not saved to Library can expire after 48 hours unless another retention period applies"
text_zh = "已量化期限之一：Enterprise 工作区中未存入 Library 的临时文件可 48 小时后过期，除非另有保留期适用（对象=临时文件；语境=例外；期限类型=上限）"
anchor = "openai-codex-enterprise-transient-48h"

[[product.retention.point]]
text = "Quantified period after deletion (upper bound): after a Library file is deleted, expires under the workspace retention policy or otherwise becomes inactive, OpenAI backups may retain it for up to 30 additional days unless OpenAI must retain it longer for security or legal obligations"
text_zh = "已量化期限之二：Library 文件被删除、按工作区留存策略过期或失效后，OpenAI 备份最多可再保留 30 天，除非出于安全或法律义务需要更久（对象=Library 文件与备份；语境=删除后残留；期限类型=上限）"
anchor = "openai-codex-enterprise-backup-30d"

[[product.retention.point]]
text = "Scope note: these three file and backup periods cover Library files, transient files and backups — not the body of Codex cloud-task content — so object stays input_output"
text_zh = "范围说明：以上三条的对象是 Library 文件、临时文件与备份，不是 Codex 云任务正文，故 object 维持 input_output"

[[product.retention.point]]
text = "Codex usage, including local clients such as the CLI and IDE extension as well as web or cloud-delegated usage, is available in the Compliance API — a log surface separate from cloud-task-specific endpoints (object: usage logs / access surface; context: admin audit)"
text_zh = "另有一条独立的日志面：Codex 用量（含 CLI、IDE 扩展等本地客户端与云委派用量）可在 Compliance API 中取得，独立于云任务专用端点（对象=用量日志/访问面；语境=管理方审计）"
anchor = "openai-codex-compliance-api-log-surface"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "openai-codex-enterprise-controls"

[[product.processing_region.point]]
text = "The matrix row \"Enterprise retention and residency controls\" only proves that this tier has residency controls; it does not state the default processing location, and the public page does not list the regions available"
text_zh = "价格矩阵行「Enterprise retention and residency controls」只证明本档有驻留控制，不证明默认处理地；公开页未列出可选区域清单"
anchor = "openai-codex-enterprise-controls"

[[product.processing_region.point]]
text = "DPA §4.1 gives the transfer mechanism only: where OpenAI Ireland Limited transfers EEA and Swiss Data to other OpenAI Affiliates or third parties outside the EEA or Switzerland to provide the Services, it relies on SCCs or an adequacy decision — the contract does not confine processing to the customer's region, and the specific region depends on the customer's configuration or agreement"
text_zh = "DPA §4.1 只给出跨境传输机制：OpenAI Ireland Limited 为提供服务把 EEA/瑞士数据传给境外关联方或第三方时，依托 SCC 或充分性决定——协议未把数据限定在客户所在区域处理，具体区域以客户配置/协议为准"
anchor = "openai-dpa-cross-border-transfers"

[product.role]
kind = "processor"
anchor = "openai-api-role-dpa-processor"

