text_zh = "Data Lab 页实际给出的是对象清单：「Inference logs - inputs and outputs (unless you enable Zero Data Retention)」、上传/筛选数据集、批量推理输出、微调结果；对其中任何一类都没有给保留期限，该页唯一像期限的表述是处理地(EU-North1)，记在 processing_region，不记在本维度。"
