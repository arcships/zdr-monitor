[[product.retention.point]]
text = "Contract-layer statement covering this tier, DPA Annex 3: \"Nebius retains Customer Personal Data only for as long as necessary to provide the applicable Services or meet applicable legal obligations\" — no quantified period for datasets, batch outputs or fine-tuning artefacts. Object: Customer Personal Data (incl. datasets, outputs, artefacts); context: default; type: not quantified."
text_zh = "覆盖本档的合同层表述，DPA Annex 3：「Nebius retains Customer Personal Data only for as long as necessary to provide the applicable Services or meet applicable legal obligations」——对数据集、批量输出与微调产物都没有量化期限。对象＝Customer Personal Data(含数据集/输出/产物)；语境＝默认；期限类型＝未量化。"
