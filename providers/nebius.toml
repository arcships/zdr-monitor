[product.training]
mark = "no"
anchor = "tf-suppl-5-1-train-speculative-decoding"
mode = "opt_out"

[[product.training.point]]
text_zh = "默认模式下合同文本明文授权「train smaller Models used for Speculative Decoding」(Supplemental Terms §5.1(b)，旧 TOS §7 同旨)，且该 draft 模型归 Nebius 所有(§3.2)"
anchor = "tf-suppl-5-1-train-speculative-decoding"

[[product.training.point]]
text_zh = "但 DPA Annex 3 与 Quick Guide 说 Token Factory 不 train/fine-tune/improve 任何模型。两条官方文本冲突，并列保留，不取平均"
anchor = "dpa-annex3-tf-no-training"

[[product.training.point]]
text_zh = "实务读法：默认模式下 I/O 会被用于训练 Nebius 自有的 draft 模型，用于服务客户请求，不用于训练通用模型。"

[[product.training.point]]
text = "Context clause, Agreement §10.1.3 (top-level use restriction): Nebius shall \"use the Customer Data uploaded on the resources of the Platform and any related Customer AI Content solely to perform, or as otherwise set forth in, this Agreement including any applicable Service-Specific Terms (such as the Token Factory Supplemental Terms), any applicable Order Form, the Documentation, and the DPA\". It is background to the conflict, not a tie-breaker: the same sentence folds the Service-Specific Terms into the permitted purposes, so it does not by itself forbid the training that Supplemental Terms §5.1 authorizes."
text_zh = "冲突面的第三份合同文本，Agreement §10.1.3(总协议层使用限制)：Nebius 只能把平台资源上的 Customer Data 及相关 Customer AI Content 用于履行本协议(含适用的 Service-Specific Terms，如 Token Factory Supplemental Terms)、Order Form、Documentation 与 DPA。它是冲突的背景文本而非裁决条款——同一句把服务专用条款纳入「as otherwise set forth in」的范围，故不能据此认为总协议已禁止训练。"
anchor = "agreement-10-1-3-customer-data-use"

[[product.training.point]]
text = "Order of precedence, Agreement §20.12: \"In the event of a conflict among the components of this Agreement, the following order of precedence shall apply, unless expressly stated otherwise: (a) the DPA, solely with respect to the processing of Personal Data\". This is the contract basis for reading DPA Annex 3 ahead of Supplemental Terms §5.1, and it matches §5.1's own opening \"Subject to the terms of the DPA\"; its scope is limited to the processing of Personal Data, so per docs/judgment.md both facts stay recorded side by side rather than one being dropped."
text_zh = "Agreement §20.12 给出协议各组件的优先次序：「(a) the DPA, solely with respect to the processing of Personal Data」，是判断 DPA Annex 3 不训练句与 Supplemental Terms §5.1 训练授权孰先的合同依据，也与 §5.1 自身「Subject to the terms of the DPA」相互印证。其限定是只就 Personal Data 的处理而言；按 docs/judgment.md 仍并列保留两条事实，不因这条次序条款删掉任一条。"
anchor = "agreement-20-12-order-of-precedence"

