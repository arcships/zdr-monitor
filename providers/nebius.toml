]
anchor = "dpa-annex3-tf-zdr-no-retention"

[[product.zdr.point]]
text = "ZDR is a self-serve organization-level switch: Quick Guide §4.1 \"ZDR applies at the organization level and covers all projects and endpoints within your organization\", and §10 recommends \"enabling Zero Data Retention and using a dedicated endpoint in your preferred region\" — dedicated endpoints fall inside ZDR's scope."
text_zh = "ZDR 是组织级自助开关：Quick Guide §4.1「ZDR applies at the organization level and covers all projects and endpoints within your organization」，§10 又建议「enabling Zero Data Retention and using a dedicated endpoint in your preferred region」——dedicated endpoint 在 ZDR 覆盖范围内，故本档与 Token Factory 按量档同记 mark=yes + mode=opt_in。"

[[product.zdr.point]]
text = "Scope limit from DPA Annex 3: ZDR covers \"supported chat-completion request and response content\"; request metadata and observability data are not covered. Whether non-chat-completion payloads (e.g. embeddings) are covered is not disclosed."
text_zh = "DPA Annex 3 的范围限定：ZDR 只覆盖「supported chat-completion request and response content」，request metadata 与 observability 数据不在覆盖内；非 chat-completion 负载（如 embeddings）是否在覆盖内未披露。"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "dpa-7-return-deletion-on-termination"

[[product.retention.point]]
text_zh = "服务终止/到期时由客户选择删除或返还(DPA §7)"

[[product.retention.point]]
text = "Platform-side deletion window, Agreement §16.11: \"In case of termination of the Agreement the Customer Data uploaded on the resources of the Platform is marked and deleted along with resources of the Platform used by the Customer within 72 hours after termination of the Agreement unless applicable law stipulates any other storage period.\" Object: Customer Data on Platform resources; context: after termination of the Agreement; type: upper-bound window (statutory storage periods excepted)."
text_zh = "平台侧删除窗口，Agreement §16.11：「In case of termination of the Agreement the Customer Data uploaded on the resources of the Platform is marked and deleted along with resources of the Platform used by the Customer within 72 hours after termination of the Agreement unless applicable law stipulates any other storage period.」对象＝平台资源上的 Customer Data；语境＝协议终止后；期限类型＝上限式窗口(适用法律另有存储期规定者除外)。"
anchor = "agreement-16-11-deletion-72-hours"

[[product.retention.point]]
text = "Suspension window, Agreement §16.10.1: Nebius stores the Customer Data uploaded on Platform resources \"within sixty (60) calendar days from when access to the Services is suspended due to the Customer’s failure to comply with the terms of payment for the Services and/or the Trial Period runs out\". Object: Customer Data on Platform resources; context: access suspended for non-payment or after the Trial Period; type: upper-bound storage period."
text_zh = "暂停情形，Agreement §16.10.1：因客户未按付款条款履约或试用期届满而暂停服务访问时，平台资源上的 Customer Data 存储期为自暂停起 60 个日历日内。对象＝平台资源上的 Customer Data；语境＝欠费/试用期届满导致访问暂停；期限类型＝上限式存储期。"
anchor = "agreement-16-10-1-suspension-60-days"

[[product.retention.point]]
text_zh = "运行期内的请求内容保留规则官方未按端点类型说明。不确定性较高。"

[product.processing_region]
codes = ["selected"]
anchor = "dpa-6-1-dedicated-endpoint-region"

[[product.processing_region.point]]
text = "DPA §6.1: \"For dedicated endpoints, Customer Content is processed in the region selected by Customer, subject to any limited Processing outside that region necessary for the operation, maintenance, security or support of the Services as described in the applicable Sub-processor List\". The customer-selected region is the disclosed processing location; limited cross-border Processing for operation, maintenance, security or support is the stated exception."
text_zh = "DPA §6.1：「For dedicated endpoints, Customer Content is processed in the region selected by Customer, subject to any limited Processing outside that region necessary for the operation, maintenance, security or support of the Services as described in the applicable Sub-processor List」。客户选定的 region 即已披露的处理地；例外是为服务运营、维护、安全或支持所必需的有限跨境处理(依适用的 Sub-processor List)。"
anchor = "dpa-6-1-dedicated-endpoint-region"

[[product.processing_region.point]]
text = "Quick Guide §5.2 turns that into a commitment: \"for dedicated endpoints the data-center region is fixed as part of the endpoint configuration – and it is a contractual commitment\", with no multi-region routing, load balancing or automatic overflow/failover — inference runs only in the chosen region."
text_zh = "Quick Guide §5.2 把这一点写成承诺：「for dedicated endpoints the data-center region is fixed as part of the endpoint configuration – and it is a contractual commitment」，且不做多区路由、负载均衡或自动溢出/故障转移——推理只在客户选择的 region 内运行。"
anchor = "qg-5-2-dedicated-endpoint-region-commitment"

[product.role]
kind = "processor"
anchor = "dpa-2-1-roles-processor"

[[product.role.point]]
text_zh = "同 Token Factory 整体：DPA 下为 processor。"

