[[source]]
url = "https://docs.nebius.com/legal/agreement"
channel = "contract"
tier = "core"
note = "《Nebius Services Agreement》(Publication 2026-09-15 / Effective 2026-09-28)，平台总协议。§11.2 把 Nebius 定为受托处理者(processor)并引入 DPA，§11.3 保留其作为控制者的自有目的处理，LINKED DOCUMENTS 一节列出 Token Factory Supplemental Terms 与三份按客户注册地分流的 DPA(非 US/IL、IL、US)。role 维度的合同层依据。"

[[source]]
url = "https://docs.nebius.com/legal/dpa"
channel = "contract"
tier = "core"
note = "《Nebius Data Processing Agreement》(Publication/Effective 2026-09-15)，随 Nebius Services Agreement 一并纳入(Agreement §11.2 引为 incorporated by reference)。一份 DPA 同时覆盖 Nebius AI Cloud(Annex 1A)与 Nebius Token Factory(Annex 1B)，Annex 3 的共通基线另附 Token Factory 限定条款。这是本家唯一同时给出「不训练」「ZDR 不保留」「处理地」三层合同语言的文档，因此是 training/retention/zdr/processing_region/role 五个维度的主依据。"

[[source]]
url = "https://docs.nebius.com/legal/specific-terms/ai-features"
channel = "contract"
tier = "core"
note = "《Nebius AI Features Terms》(Publication 2026-09-15 / Effective 2026-09-28)，覆盖 Nebius 平台内的 AI 功能(如 Echo AI Assistant)，§5.1 承诺不用于训练 Nebius Models，§5.3 给会话历史 6 个月删除。**适用范围必须写清：Token Factory Supplemental Terms 首段明确「any Nebius AI Features Terms shall not apply to the Token Factory Service」，所以本文件对 Token Factory 档不适用**，只用于 products[] 里的 AI Features 档与「同一家不同产品线政策不同」的对照。"

[[source]]
url = "https://docs.nebius.com/legal/terms-of-use"
channel = "contract"
tier = "core"
note = "《Terms of Use of the Nebius Platform》(AI Cloud 平台使用条款)。§2.7.3「Service Data Use」授权 Nebius 以统计、聚合、不可识别形式收集处理 Service Data 用于平台测试/开发/改进，是 AI Cloud 档(非 Token Factory)在 training 方向上的对照条款。"

[[source]]
url = "https://docs.nebius.com/legal/token-factory"
channel = "contract"
tier = "core"
note = "《Nebius Token Factory Supplemental Terms》(Effective 2026-09-15)，经 Agreement 的 LINKED DOCUMENTS 一节纳入，是 2026-09-28 起新法律框架下 Token Factory 的服务专用条款(Service-Specific Terms)。§5.1 明文授权用 Input/Output 训练 speculative-decoding 用的 smaller Models，与 DPA Annex 3 的「不训练」表述冲突，两条并列保留。首段明确「AI Features Terms 不适用于 Token Factory」。"

[[source]]
url = "https://docs.tokenfactory.nebius.com/data-lab/data-processing"
channel = "developer_data"
tier = "core"
note = "Token Factory 文档站《Data Lab → Data Processing》页，明确 Data Lab(推理日志、数据集、批量输出、微调产物)全部只在 EU-North1(芬兰)处理，且「Nebius Token Factory acts as a Data Processor under the terms of our DPA」。processing_region 与 role 的产品层依据。"

[[source]]
url = "https://docs.tokenfactory.nebius.com/legal/legal-quick-guide"
channel = "developer_data"
tier = "core"
note = "《Legal Quick Guide》(Token Factory 文档站 /legal/ 下的官方说明页，页面未标 publication/effective 日期)，是唯一把 ZDR 开关、公开端点无区域承诺、speculative decoding 保留物存芬兰这三件事写成完整叙述的官方页面。第 1 节自述「this guide is a summary for your convenience. It does not amend or replace our Terms of Service, DPA or Privacy Policy; in case of any inconsistency, those documents prevail」，故按 channel 记 developer_data(低于 contract)，ZDR 与处理地的合同层依据以 DPA 为准、本页作展开说明。"

[[source]]
url = "https://docs.tokenfactory.nebius.com/legal/terms-of-service"
channel = "contract"
tier = "core"
note = "旧记录唯一候选的 URL，仍存活(HTTP 200，正文完整)，但已转为过渡文档：页面顶部 HTML 里有 IMPORTANT NOTICE——「These Terms of Service apply exclusively to Nebius Token Factory customers who have an active reserve as of September 15, 2026... If you are not a customer with an active reserve... as of September 28, 2026, your use of the Service is governed by the updated Terms of Service available at https://docs.nebius.com/legal/agreement」。该通知**未被 r.jina.ai 渲染进快照**，因此只能写进 scope_note，不能作为锚点。§7 是 training/zdr 的历史条款来源(2026-08-20 生效)。"

