text = "Broader dataset authorization, Supplemental Terms §2.11 (Professional Services): \"Subject to the terms of the DPA, Nebius has a right to use Customer's Datasets (provided hereunder) for the purpose of providing Professional Services\", and the same clause says those services \"may include but are not limited to … model training services (such as fine-tuning, distillation, and training of custom models to improve latency and quality)\". Context: Professional Services provided at Customer's written request or under an Order Form; object: Customer's Datasets. Recorded separately from §2.10's fine-tuning/distillation licence."
text_zh = "更宽的数据集使用授权，Supplemental Terms §2.11(专业服务)：「Subject to the terms of the DPA, Nebius has a right to use Customer's Datasets (provided hereunder) for the purpose of providing Professional Services」，同节另写明专业服务「may include but are not limited to … model training services (such as fine-tuning, distillation, and training of custom models to improve latency and quality)」。语境＝客户书面请求或 Order Form 下由 Nebius 提供专业服务；对象＝客户 Datasets。与 §2.10 的微调/蒸馏授权分列。"
