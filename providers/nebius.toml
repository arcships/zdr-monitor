[product.training]
mark = "no"
anchor = "tf-suppl-5-1-train-speculative-decoding"
mode = "opt_out"

[[product.training.point]]
text = "Supplemental Terms §2.3 puts Dedicated Endpoints inside the Token Factory Service (\"The Token Factory Service provides Customer with Dedicated Endpoints to deploy supported Models with dedicated capacity\"), and §5.1(b) authorizes Nebius to process Input and Output in order to \"train smaller Models used for Speculative Decoding\". Neither clause distinguishes endpoint type, so the authorization reaches this tier; Nebius has never made a dedicated-endpoint-specific statement about training."
text_zh = "Supplemental Terms §2.3 把 Dedicated Endpoints 写进 Token Factory Service 的范围，而 §5.1(b) 明文授权用 Input/Output「train smaller Models used for Speculative Decoding」。两条都不区分端点类型，故该授权同样覆盖本档；官方从未就 dedicated endpoint 单独表态。"
anchor = "tf-suppl-5-1-train-speculative-decoding"

[[product.training.point]]
text = "The opposite text, DPA Annex 3: \"Nebius Token Factory does not use Customer Content to train, fine-tune or improve models for Nebius or any third party, except as directed by the Customer to perform a Customer-requested fine-tuning or post-training operation\" — also written by product name, also without an endpoint-type distinction. The two conflicting texts therefore both apply to this tier; they are recorded in parallel, not averaged."
text_zh = "相反的一条，DPA Annex 3：「Nebius Token Factory does not use Customer Content to train, fine-tune or improve models for Nebius or any third party…」，同样只按产品名写、未按端点类型区分。两条冲突因此同时适用于本档；并列保留，不取平均。"
anchor = "dpa-annex3-tf-no-training"

[[product.training.point]]
text = "Verdict rationale: this tier rests on the same evidence as the Token Factory pay-as-you-go tier and Nebius has published no dedicated-endpoint-specific position, so it is kept aligned with that tier (mark=no, mode=opt_out) instead of reading the DPA sentence as controlling for dedicated endpoints only. Customer-side exit is the Supplemental Terms §5.4 opt-out and the organization-level ZDR switch."
text_zh = "判定理由：本档与 Token Factory 按量档用的是同一批证据，官方也未就 dedicated endpoint 单独表态，故与按量档取齐(mark=no、mode=opt_out)，不单方面把 DPA 的不训练句读成只对本档起决定作用。客户侧的退出通道是 Supplemental Terms §5.4 的 opt-out 与组织级 ZDR 开关。"

[product.zdr]
mark = "yes"
mode = "opt_in"
searched = [
  "https://docs.nebius.com/legal/dpa",
