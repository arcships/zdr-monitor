[[product.zdr.point]]
text = "Removed anchor: the DPA clause cited here is expressly limited to \"Nebius Token Factory\" (\"Zero Data Retention is configured at the Nebius Token Factory organization level\"), so it is not a statement about ZDR on AI Cloud. Search scope is recorded in searched."
text_zh = "已撤锚：原引条款自我限定在「Nebius Token Factory」（「Zero Data Retention is configured at the Nebius Token Factory organization level」），不构成对 AI Cloud 档 zdr 的表述。查阅范围见 searched。"

[[product.zdr.point]]
text_zh = "ZDR 在全部官方文档中只被定义为 Token Factory 的隐私配置(DPA Annex 3 的 Token Factory 限定段、HIPAA 指南 §2 定义)。AI Cloud 侧没有任何零保留承诺或开关"

[[product.zdr.point]]
text_zh = "DPA Annex 3 的共通基线里出现过「configuring Zero Data Retention and other available security or privacy features」一句，但紧随其后的产品限定把它限定在 Token Factory。按规则记 not_found(未披露)，不写成「不提供」。"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "dpa-7-return-deletion-on-termination"

[[product.retention.point]]
text = "Contract layer, DPA Annex 1A.2 (AI Cloud details of processing): \"The duration of the processing will be for the term of the Terms of Service\". Object: Customer Personal Data processed as Customer Content; context: default; type: bounded by the contract term, not a fixed number of days."
text_zh = "合同层，DPA Annex 1A.2(AI Cloud 处理详情)：「The duration of the processing will be for the term of the Terms of Service」。对象＝作为 Customer Content 处理的 Customer Personal Data；语境＝默认；期限类型＝以合同存续期为界，不是固定天数。"
anchor = "dpa-annex1a2-processing-duration"

[[product.retention.point]]
text = "Same DPA, SCC Annex 2: \"The period for which the personal data will be retained is for the duration of the Agreement, unless agreed otherwise in the Agreement and/or the DPA.\" This sits in the Standard Contractual Clauses annex, so it is the contract-layer retention term; it does not replace AI Cloud's own \"documented retention schedules\", which are still not published in the monitored documents."
text_zh = "同一份 DPA 的 SCC Annex 2：「The period for which the personal data will be retained is for the duration of the Agreement, unless agreed otherwise in the Agreement and/or the DPA.」该句位于 Standard Contractual Clauses 附件中，属合同层的存续期口径；它不能替代 AI Cloud 自己的「documented retention schedules」——后者仍未在被监控的文档里公布。"
anchor = "dpa-scc-annex2-retention-duration"

[[product.retention.point]]
text = "Post-termination deletion window, Agreement §16.11: \"In case of termination of the Agreement the Customer Data uploaded on the resources of the Platform is marked and deleted along with resources of the Platform used by the Customer within 72 hours after termination of the Agreement unless applicable law stipulates any other storage period.\" Object: Customer Data on Platform resources; context: termination; type: upper-bound window."
text_zh = "终止后删除窗口，Agreement §16.11：「In case of termination of the Agreement the Customer Data uploaded on the resources of the Platform is marked and deleted along with resources of the Platform used by the Customer within 72 hours after termination of the Agreement unless applicable law stipulates any other storage period.」对象＝平台资源上的 Customer Data；语境＝协议终止后；期限类型＝上限式窗口。"
anchor = "agreement-16-11-deletion-72-hours"

[[product.retention.point]]
text = "Suspension window, Agreement §16.10.1: Customer Data uploaded on Platform resources is stored \"within sixty (60) calendar days from when access to the Services is suspended due to the Customer’s failure to comply with the terms of payment for the Services and/or the Trial Period runs out\". Object: Customer Data on Platform resources; context: access suspended for non-payment or after the Trial Period; type: upper-bound storage period."
text_zh = "暂停情形，Agreement §16.10.1：因客户未按付款条款履约或试用期届满而暂停访问时，平台资源上的 Customer Data 存储期为自暂停起 60 个日历日内。对象＝平台资源上的 Customer Data；语境＝欠费/试用期届满导致访问暂停；期限类型＝上限式存储期。"
anchor = "agreement-16-10-1-suspension-60-days"

[[product.retention.point]]
text = "What is not published: DPA Annex 3 says \"Nebius retains Customer Personal Data only for as long as necessary to provide the applicable Services or meet applicable legal obligations\" and, for AI Cloud, \"Nebius applies documented retention schedules, and Customers can delete Customer-controlled resources\" — but the running-period periods in those schedules are not given in the monitored documents. \"No published default period\" is not the same as \"no bound after termination\": the term is bounded by Annex 1A.2 / SCC Annex 2 and by the §16.11 / §16.10.1 windows above."
text_zh = "未公布的部分：DPA Annex 3 写「Nebius retains Customer Personal Data only for as long as necessary to provide the applicable Services or meet applicable legal obligations」，对 AI Cloud 另写「Nebius applies documented retention schedules, and Customers can delete Customer-controlled resources」，但那些 schedule 里的运行期期限并未出现在被监控文档中。「运行期默认期限未公布」不等于「终止后无期限」——存续期由 Annex 1A.2 / SCC Annex 2 限定，终止/暂停后另有 §16.11 与 §16.10.1 的窗口。"
anchor = "dpa-annex3-retention-necessary-only"

[[product.retention.point]]
text_zh = "终止/到期时按 DPA §7 由客户选择删除或返还。"

[product.processing_region]
codes = ["selected"]
anchor = "dpa-6-1-ai-cloud-region"

[[product.processing_region.point]]
text = "DPA §6.1, AI Cloud sentence: \"For Nebius AI Cloud, Customer Content is hosted and processed in the region selected by Customer, subject to any limited Processing outside that region necessary for the operation, maintenance, security or support of the Services as described in the applicable Sub-processor List\". The disclosed processing location is the customer-selected region; the only carve-out is limited Processing outside it for operation, maintenance, security or support, per the applicable Sub-processor List."
text_zh = "DPA §6.1 的 AI Cloud 句：「For Nebius AI Cloud, Customer Content is hosted and processed in the region selected by Customer, subject to any limited Processing outside that region necessary for the operation, maintenance, security or support of the Services as described in the applicable Sub-processor List」。已披露的处理地即客户选定的 region；唯一例外是为服务运营、维护、安全或支持所必需的有限跨境处理(依适用的 Sub-processor List)。故本档处理地是「可选地域」，不是未披露。"

[[product.processing_region.point]]
text = "The evidence for this tier is the AI Cloud sentence of DPA §6.1 itself. The Token Factory sentence in the same clause (which an earlier revision bound here) governs the Token Factory tiers and is not a statement about AI Cloud's processing location."
text_zh = "本档依据是 DPA §6.1 的 AI Cloud 句本身。同一条里的 Token Factory 句(此前被绑在本档)管辖 Token Factory 各档，不构成对 AI Cloud 处理地的表述。"

