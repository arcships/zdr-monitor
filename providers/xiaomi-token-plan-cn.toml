note = "《Xiaomi MiMo 服务协议》中文境内版（mimo.xiaomi.com 的 legal 开放目录），签约主体写明「北京小米移动软件有限公司（运营主体）及其关联公司」，§1.1「本协议适用于您在中华人民共和国境内使用 Xiaomi MiMo 服务」，§9.1 适用中华人民共和国法律、北京小米移动软件有限公司住所地法院管辖。本家另有一份同样按境内口径书写、且自述覆盖开放平台（API）并点名 Token Plan 的服务协议（mimo.mi.com/docs/terms/user-agreement，本文件已单列来源）。本份的限制：§1.1 把服务描述为「Xiaomi MiMo 桌面版软件及服务」，全文未出现 Token Plan / 订阅 / 套餐字样；§五「数据保护条款」只有一句把个人信息处理指向《Xiaomi MiMo 隐私政策》，没有角色（处理者/受托人）声明，也没有存储地域条款。全文未出现「训练」字样。与 sgp/ams 档的关系：该文件不覆盖境外（境外版见 /docs/quick-start/terms/user-agreement），故 cn 与 sgp/ams 用的不是同一份服务协议。"

