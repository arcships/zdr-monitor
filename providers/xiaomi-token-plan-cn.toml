note = "《Xiaomi MiMo 服务协议》（页面自述「版本生效日期：2026年7月7日」），官方域名 mimo.mi.com 上的境内中文版：首部运营主体「北京小米移动软件有限公司（运营主体）及其关联公司」，§1.1 自述为「为您提供的 API 开放平台服务及Xiaomi MiMo Code 等工具」并写「本协议适用于您在中华人民共和国境内使用 Xiaomi MiMo 服务」，§4 开篇「本部分数据保护条款所覆盖的地域为中国大陆」，§4.1「小米在数据处理活动中是个人信息处理受托人，您是个人信息处理者」，§4.4「在向中国大陆提供服务时，小米会将相关数据存储在中国大陆的服务器上，不会将此类信息传输至境外」，§3.16/§3.17 点名 Token Plan 与自动订阅，§8.1 适用中华人民共和国法律、北京小米移动软件有限公司住所地法院管辖。这是本档合同层角色与处理地结论的决定性来源：它自述覆盖开放平台（API）并点名 Token Plan，而 mimo.xiaomi.com/legal/service-agreement-zh.html 那份自述覆盖「桌面版」。全文未出现「训练」「ZDR」「零保留」字样，也没有量化保留期限。同一 URL 亦被 providers/xiaomi.toml 声明，抓取按 URL 去重。"

