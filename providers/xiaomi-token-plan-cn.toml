note = "《小米隐私政策》（privacy.mi.com 中文总政策，MiMo 各分政策的上位文件，MiMo 分政策自身声明「本隐私政策未约定的，以《小米隐私政策》为准」）。§4.4 保留政策给出保留期限的判断因素与「具体保留时长可参见特定服务或相关产品页面」；§4.5 存储与跨境一节给出境内数据中心存储的兜底表述；「内部目的」一节点出去标识化后用于机器学习/模型算法训练的一般性做法。作为 cn 档 processing_region / retention 的补充依据（consumer_privacy 级），不作为 training 的主依据——该训练表述属于总政策的一般性说明，不针对 MiMo API/Token Plan 输入内容。"

