[product.training]
mark = "yes"
anchor = "mimo-cn-privacy-api-no-training-without-consent"
mode = "default"

[[product.training.point]]
text = "This tier has no dedicated data clauses (see the directory enumeration in scope_note), so the platform's general policies apply and it shares the source and conclusion of the top-level training entry. Authoritative sentence: the Xiaomi MiMo Privacy Policy (Chinese page on privacy.mi.com, entity Beijing Xiaomi Mobile Software Co., Ltd.), Section 1(1)2 \"API services\" — \"Without your prior consent, Xiaomi will not use the text content you provide for model training or for any other purpose.\" No training by default, but the commitment is conditioned on \"prior consent\", and its object is written as \"text content\", not every input type. The contrary side that must be recorded alongside: (a) the overseas privacy policy on the documentation site is unconditional — \"Xiaomi will not use the content you provide for model training or any other purpose\" — stronger than the domestic version, but the overseas tier limits itself to outside mainland China and does not apply here, so the cn tier is governed by the weaker one"
text_zh = "本档无专用数据条款（依据见 scope_note 的目录枚举），适用平台通用政策，故与顶层 training 同源同结论。权威句：《Xiaomi MiMo 隐私政策》（privacy.mi.com 中文页，主体北京小米移动软件有限公司）一（一）2「API服务」一节——「未经您的事先同意，小米不会将您提供的文本内容用于模型训练或者其他用途。」默认不训练，但承诺带「事先同意」前提，且对象写的是「文本内容」，不是全部输入类型。必须并列的相反面向：(a) 文档站境外版隐私政策是无条件句「小米不会将您提供的内容用于模型训练或任何其他目的」，比境内版更强，但境外档自限适用于中国大陆以外，本档不适用，即 cn 档适用的是较弱的那一份"

[[product.training.point]]
text = "(b) The desktop privacy policy (mimo.xiaomi.com/legal/privacy-policy-zh.html) separately says \"after strict de-identification ... we will use the content you input (text, image, video and audio information) and the model output content data for analysis and model optimization\", together with a Settings - General - Privacy - Experience Improvement Program switch; it states that it covers the desktop client and is not a basis for this tier, but it shows that \"Xiaomi never uses inputs for training in China\" cannot be treated as a conclusion across product lines"
text_zh = "(b) 桌面版隐私政策（mimo.xiaomi.com/legal/privacy-policy-zh.html）另有「经严格去标识化…我们将使用您输入的内容（文本、图片、视频、音频信息）及模型输出内容数据进行分析和模型优化」与【设置-常规-隐私-体验优化计划】开关，自称覆盖桌面版，不作为本档依据，但证明不能把「小米境内一律不拿输入去训练」当作跨产品线结论"

[[product.training.point]]
text = "(c) The word \"training\" does not appear anywhere in the domestic service agreement, which neither authorizes nor prohibits it. Uncertainty: \"Token Plan is governed by the Open Platform privacy policy\" is inferred from product attribution (the platform.xiaomimimo.com console plus the tp- prefixed API key), not stated directly in the terms"
text_zh = "(c) 境内服务协议全文未出现「训练」二字，既未授权也未禁止。不确定性：「Token Plan 适用开放平台隐私政策」是按产品归属（platform.xiaomimimo.com 控制台 + tp- 前缀 API Key）作的推断，不是条款原文的直接规定"

[[product.training.point]]
text = "How \"prior consent\" is obtained, whether it can be withdrawn, and whether a switch exists are all undisclosed. The searched[] list on the top-level training entry records every URL checked in this round."
text_zh = "「事先同意」以什么形式取得、能否撤回、有无开关，均无公开说明。顶层 training 的 searched[] 列出了本轮查过的全部 URL。"

[product.zdr]
mark = "no"
anchor = "mimo-cn-privacy-backup-deletion-delay"

[[product.zdr.point]]
text = "This tier has no dedicated data clauses; the platform's general policies apply, sharing the source and conclusion of the top-level zdr entry: zero retention is not supported. The whole chain of evidence sits in the same domestic privacy policy, which identifies the object itself: (1) Object — Section 1(1)2 lists \"the text, image, video and audio information you provide\", collected \"in order to provide the Xiaomi MiMo API and Xiaomi MiMo Code services\", as personal information"
text_zh = "本档无专用数据条款，适用平台通用政策，与顶层 zdr 同源同结论：不支持零保留。依据链全部落在同一份境内隐私政策，对象由该政策自证：(1) 对象——一（一）2 把「为了提供 Xiaomi MiMo API 及 Xiaomi MiMo Code 服务」收集的「您提供的文本、图片、视频、音频信息」列为个人信息"

[[product.zdr.point]]
text = "(2) Storage — Section 3(1): \"All of your personal information is stored on secure servers and protected in controlled facilities.\" That states expressly that request input content is stored on their servers"
text_zh = "(2) 存储——三（一）「您的个人信息全都被储存在安全的服务器上，并在受控设施中受到保护。」即明示请求输入内容会被存储在其服务器上"

[[product.zdr.point]]
text = "(3) Period — Section 3(3) retains information for the period necessary for the purpose, an unquantified retention rule rather than \"discarded once processing completes\""
text_zh = "(3) 期限——三（三）按目的必需期间保留，是未量化的保留规则，不是「处理完成即弃」"

[[product.zdr.point]]
text = "(4) Retention after deletion — Section 4(2): \"Because of applicable law and security technology, we may not be able to delete the corresponding information from backup systems immediately; we will store your personal information securely and isolate it from any further processing until the backup can be cleared or anonymized.\" That is directly incompatible with \"nothing retained once processing completes\", and is the anchor for this dimension. So this tier is not \"undisclosed\" but has express storage and retention provisions. Five kinds of entry point were checked (content license clauses, API data-processing sections, logging and caching documentation, DPA, FAQ) and none contains a ZDR / zero-retention / no-persistence / discard-after-processing commitment, switch or application path"
text_zh = "(4) 删除后仍留存——四（二）「因为适用的法律和安全技术，我们可能无法立即从备份系统中删除相应的信息，我们将安全地存储您的个人信息并将其与任何进一步处理隔离，直到备份可以清除或实现匿名。」与「处理完即不保留」直接相斥，本条为本维度锚点。因此本档不是「未披露」，而是有明示的存储与保留依据。已核五类入口（内容授权条款、API 数据处理章节、日志与缓存说明、DPA、FAQ）均无 ZDR / 零保留 / 不落盘 / 处理完即弃的承诺、开关或申请入口"

[[product.zdr.point]]
text = "There is no data processing agreement for API customers on the official domains. Boundary: this finding says the default tier has express storage and retention provisions, not that Xiaomi refuses to sign a zero-retention arrangement — whether ZDR can be negotiated in an enterprise contract is not answered by the public texts. The searched[] list on the top-level zdr entry records the 28 URLs checked in this round."
text_zh = "官方域名上没有面向 API 客户的数据处理协议。边界：本判定说的是默认档有明示的存储与保留依据，不等于小米拒绝签署零保留安排——企业合同能否谈 ZDR，公开文本无答案。顶层 zdr 的 searched[] 列出了本轮查过的 28 个 URL。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "mimo-cn-privacy-retention-policy"

[[product.retention.point]]
text = "This tier has no dedicated data clauses; the platform's general policies apply, sharing the source and conclusion of the top-level retention entry: no quantified retention period at all, only a principle-level \"necessary for the purpose + required by law\" statement, which does not separate input/output content, cache and access logs. (1) Object — Xiaomi MiMo Privacy Policy Section 1(1)2 lists \"the text, image, video and audio information you provide\", collected \"in order to provide the Xiaomi MiMo API and Xiaomi MiMo Code services\", as personal information, so API request inputs fall within the scope of the retention rules, not just account data. (2) Period — the retention policy in Section 3(3): \"We retain personal information for the period necessary for the purposes of collection described in this privacy policy, or to comply with applicable legal requirements. Once the purpose of collection has been achieved, or after we confirm your deletion or account cancellation request, or after we discontinue the relevant product or service, we will stop retaining it and will delete or anonymize it.\" — a ceiling-style statement (retention stops once the purpose is fulfilled), with no number of days. (3) Exceptions — the same paragraph allows continued retention for public interest, scientific or historical research, or statistical purposes"
text_zh = "本档无专用数据条款，适用平台通用政策，与顶层 retention 同源同结论：没有任何量化保留期限，只有「目的必需 + 法律要求」的原则性表述，且区分不出输入输出正文、缓存与访问日志。(1) 对象——《Xiaomi MiMo 隐私政策》一（一）2 把「为了提供 Xiaomi MiMo API 及 Xiaomi MiMo Code 服务」而收集的「您提供的文本、图片、视频、音频信息」列为个人信息，故 API 请求的输入内容落在保留规则的对象范围内，不是只有账号资料。(2) 期限——三（三）保留政策「我们基于本隐私政策中所述的信息收集的目的所必需的期间，或者遵守适用的相关法律要求保留个人信息。个人信息在完成收集目的，或在我们确认您的删除或注销申请后，或我们终止运营相应产品或服务后，我们将停止保留，并做删除或匿名化处理。」——上限式表述（目的完成即停），没有天数。(3) 例外——同段的公众利益/科学/历史研究/统计目的可继续保留"

[[product.retention.point]]
text = "Section 4(2) acknowledges the backup delay on deletion: \"we may not be able to delete the corresponding information from backup systems immediately ... until the backup can be cleared or anonymized\". (4) Higher-level supplement — the Xiaomi Privacy Policy §4.4 says \"for specific retention periods, see the particular service or the relevant product page\", yet a page-by-page grep of the four kinds of Token Plan product page (subscription description, integration guide, pricing page, FAQ) for \"retain / retention / data\" returned zero hits this round, i.e. the product pages do not pick up that pointer. (5) What is absent — none of the official documents captured for the cn tier contains a Cybersecurity Law style floor such as \"network logs kept for no less than six months\", so no minimum can be inferred"
text_zh = "四（二）承认删除的备份延迟「我们可能无法立即从备份系统中删除相应的信息……直到备份可以清除或实现匿名」。(4) 上位补充——《小米隐私政策》4.4 自认「具体保留时长可参见特定服务或相关产品页面」，而 Token Plan 的订阅说明、接入指引、定价页与 FAQ 四类产品页本轮逐页 grep「保留/留存/数据」零命中，即产品页并没有承接这句指引。(5) 未出现的东西——cn 档所有已抓官方文件里都没有「网络日志不少于六个月」这类《网络安全法》式下限条款，不能反推下限"

[[product.retention.point]]
text = "The cache hit/miss on the pricing page is a billing concept; no TTL or eviction rule for Prompt Cache entries is disclosed. (6) Not interchangeable — the overseas service agreement §4.4 (\"processing stops or data is permanently deleted when the service expires, the purpose is achieved, or you so request\") limits itself to outside mainland China and cannot serve as a basis for this tier."
text_zh = "定价页出现的 cache hit/miss 是计费口径，官方未披露 Prompt Cache 条目的 TTL 或清除规则。(6) 不可混用——境外版服务协议 §4.4 的「服务到期、目的达成或您要求时停止处理或永久删除」自限适用于中国大陆以外，不能当本档依据。"

[product.processing_region]
codes = ["CN"]
anchor = "mimo-cn-privacy-storage-in-cn"

[[product.processing_region.point]]
text = "This tier has no dedicated data clauses; the platform's general policies apply, sharing the source and conclusion of the top-level processing_region entry: within China. (a) Xiaomi MiMo Privacy Policy, final paragraph of Section 3(3): \"This agreement applies to your use of Xiaomi MiMo services within the People's Republic of China, and your information will accordingly be stored within the People's Republic of China. If you use the services outside the People's Republic of China, you acknowledge and agree that the parties will apply the privacy policy terms published on the Xiaomi MiMo open platform for services outside the People's Republic of China.\" — the vendor itself splits domestic and overseas policies, and this tier is the domestic one. (b) Xiaomi Privacy Policy: \"Personal information collected and generated in the course of operations within mainland China is stored in data centers in mainland China, except where cross-border transfer is permitted under applicable law.\" (c) Integration side: the Token Plan subscription documentation gives three cluster endpoints, the China cluster being https://token-plan-cn.xiaomimimo.com/v1. (d) The contrary side that must be recorded alongside (all overseas-tier, not interchangeable): service agreement §4.4 on the documentation site states that data for overseas services is stored in Europe and Singapore, and §4 limits itself to outside mainland China"
text_zh = "本档无专用数据条款，适用平台通用政策，与顶层 processing_region 同源同结论：境内。(a)《Xiaomi MiMo 隐私政策》三（三）末段「本协议适用于您在中华人民共和国境内使用Xiaomi MiMo服务，为此您的信息将会保存至中华人民共和国境内。如果您在中华人民共和国境外使用服务，则您知悉并同意双方将适用发布在Xiaomi MiMo开放平台上适用于中华人民共和国境外服务的相关隐私政策条款。」——官方用境内/境外两套政策划分，本档属境内档。(b)《小米隐私政策》「我们将在中华人民共和国大陆境内运营中收集和产生的个人信息，均在中国大陆地区的数据中心存储，但根据适用法律的规定允许跨境传输的除外。」(c) 接入侧：Token Plan 订阅说明给出三集群入口，中国集群为 https://token-plan-cn.xiaomimimo.com/v1。(d) 必须并列的相反面向（都是境外档，不能混用）：文档站服务协议 §4.4 写境外服务的数据存于欧洲和新加坡，且 §4 自限只覆盖中国大陆以外"

[[product.processing_region.point]]
text = "The entities there are Xiaomi Technology (Netherlands) B.V. and Xiaomi Technology (Singapore) Pte. Ltd., under different governing law. (e) Uncertainty: the three-cluster description appears only in the integration configuration of the product documentation; no clause explains whether inference and storage for the \"China cluster\" both take place in mainland China"
text_zh = "主体是小米科技（荷兰）B.V. 与小米技术（新加坡）私人有限公司，适用法也不同。(e) 不确定性：三集群说明只出现在产品文档的接入配置里，没有任何条款解释「中国集群」的推理与存储是否都在中国大陆"

[[product.processing_region.point]]
text = "The cross-border exception in the Xiaomi Privacy Policy (\"except where cross-border transfer is permitted under applicable law\") leaves an opening for transfers abroad, with no scenarios disclosed. The domestic Xiaomi MiMo Open Platform Service Agreement §4.4 hosted by a third party (market.aliyun.com) is firmer (\"such information will not be transferred outside the territory\"), but under the rules it cannot be used as primary evidence."
text_zh = "《小米隐私政策》的跨境例外（「根据适用法律的规定允许跨境传输的除外」）为出境留了口子，未披露具体场景。第三方托管（market.aliyun.com）的境内版《Xiaomi MiMo开放平台服务协议》4.4 写得更硬（「不会将此类信息传输至境外」），按规则不能当主证据。"

[product.role]
kind = "processor"
anchor = "mimo-cn-sa-zh-neutral-tech-provider"

[[product.role.point]]
text = "This tier has no dedicated data clauses; the platform's general policies apply, sharing the source and conclusion of the top-level role entry: leaning to entrusted processor, but with far weaker support in the public terms than the overseas tier, confidence low. (a) The only service agreement written for the domestic setting on an official domain (mimo.xiaomi.com/legal/service-agreement-zh.html, entity Beijing Xiaomi Mobile Software Co., Ltd.) says only, in §3.4, that \"Xiaomi MiMo acts solely as a neutral technical service provider, providing you with technical products and services as agreed\""
text_zh = "本档无专用数据条款，适用平台通用政策，与顶层 role 同源同结论：倾向受托处理方（processor），但公开条款的支撑比境外档弱得多，置信度 low。(a) 官方域名上唯一按境内口径写的服务协议（mimo.xiaomi.com/legal/service-agreement-zh.html，主体北京小米移动软件有限公司）§3.4 只写「Xiaomi MiMo 仅作为中立的技术服务提供者，依约向您提供各类技术产品和服务」"

[[product.role.point]]
text = "Section 5 \"Data protection clauses\" is a single sentence — \"Xiaomi will collect, use and process your personal information in accordance with the Xiaomi MiMo Privacy Policy\" — with no role-definition table and no statement that \"Xiaomi is the entrusted party / processor\". (b) The sentence in the domestic privacy policy closest to a processor self-designation comes from the voice-cloning section: \"You authorize Xiaomi MiMo to carry out entrusted processing based on the information you upload in order to provide the service; Xiaomi MiMo needs no further authorization\" — but it covers only that scenario and is not a general role provision for the API / Token Plan. (c) By comparison: both overseas service agreements state plainly \"Xiaomi acts as a Processor ... you are the Data Controller\" / \"Xiaomi acts as processor in data processing activities and you are the data controller\", but limit themselves to outside mainland China. (d) Key gap: the Xiaomi MiMo Open Platform Service Agreement hosted on Alibaba Cloud Marketplace states in §4.1 that \"in data processing activities Xiaomi is the entrusted party for personal information processing and you are the personal information handler\", and covers mainland China — exactly the sentence the cn tier lacks, but the hosting domain is third-party, so under the repository rules it counts only as a lead"
text_zh = "§五「数据保护条款」仅一句「小米将按照《Xiaomi MiMo 隐私政策》收集、使用、处理您的个人信息」，没有角色定义表，也没有「小米是受托人/处理者」的声明。(b) 境内隐私政策里最接近 processor 自认的一句出自音色模仿一节——「您授权 Xiaomi MiMo 基于您上传的信息进行受托处理以提供服务，Xiaomi MiMo 无需再另行获得其他授权。」——但只针对该场景，不是面向 API/Token Plan 的一般性角色约定。(c) 对照：境外档两份服务协议都明确写「Xiaomi acts as a Processor…you are the Data Controller」/「小米在数据处理活动中作为处理者，您是数据控制者」，但自限适用于中国大陆以外。(d) 关键缺口：阿里云市场托管的《Xiaomi MiMo开放平台服务协议》4.1 明写「小米在数据处理活动中是个人信息处理受托人，您是个人信息处理者」并覆盖中国大陆——这正是 cn 档缺的那句话，但承载域名是第三方托管，按仓库规则只能当发现线索"

[[product.role.point]]
text = "A full-text search of the official domains for that sentence found no official version this round. (e) Upstream chain: the domestic tier's third-party sharing list names only Jiefu Ruitong (payment real-name verification) and Shanghai Xiaosu Technology (web-search keywords), and lists no inference compute or model service provider, so \"who can access request content\" is not answered in the public documents."
