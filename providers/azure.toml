channel = "developer_data"
tier = "core"
note = "部署类型文档(Standard / Global / DataZone / Regional Provisioned / Batch / Developer),覆盖档位 api。逐类给出推理处理位置与静态存储位置,是 processing_region 的细化佐证;处理位置权威源仍为 data-privacy 页。"

[[source]]
url = "https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/abuse-monitoring"
channel = "developer_data"
tier = "core"
note = "滥用监测机制细节页(覆盖档位 api)。给出:自动审核所用模型不存储提示与补全、也不用于训练;获批 modified abuse monitoring 后人工审核不再进行;并给出申请资格线索(需满足 Limited Access 附加条件,部分高级模型条件更严)。支撑 retention / zdr 的机制细节,主结论仍绑 data-privacy 页。本轮重抓与缓存逐字一致。"

[[source]]
url = "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy"
channel = "developer_data"
tier = "core"
note = "档位 api(Azure OpenAI / Foundry Models sold by Azure)的权威文档《Data, privacy, and security for Foundry Models sold by Azure in Microsoft Foundry》。逐字定义范围:「A 'model sold by Azure' is an AI model designated and deployed as such in Foundry, and includes Azure OpenAI models.」覆盖 Standard / Global / DataZone / Provisioned / Batch / Developer 部署类型。**与 azure.json 的同一份文档**:本 pid 的历史候选(seed source_id fbb65b16dcfbd62d)就是这篇;两个 pid 共用同一权威,本文件据实登记并只在范围说明上分工(azure.json 覆盖 Azure 平台档,本文件另加 Foundry Tools 非模型服务与 Foundry 合作伙伴模型两档)。不覆盖 Foundry 中的 Marketplace 第三方模型,不覆盖 Azure China(21Vianet)。本轮用 r.jina.ai 重抓(--resolve 绕过本机 fake-ip),与缓存逐字一致(仅多一行 Published Time 头)。"

[[source]]
url = "https://learn.microsoft.com/en-us/compliance/regulatory/gdpr-dpia-azure"
channel = "enterprise_privacy_faq"
tier = "core"
note = "本轮新发现并验证通过。微软官方《DPIA Azure for the GDPR》,Azure 专属的数据保护影响评估指引(企业在线服务层)。明确写出『As specified by the Product Terms and Products and Services Data Protection Addendum (DPA), Microsoft, as a data processor, processes Customer Data to provide Customer the Online Services in accordance with Customer's documented instructions.』并给出订阅终止后 90 天受限功能账户保留、以及静态数据可放在指定地理区域的说明。是 role 维度的权威源(Azure 范围比通用 GDPR FAQ 更贴),同时佐证 retention 与 processing_region。"

[[source]]
url = "https://www.microsoft.com/licensing/terms/product/PrivacyandSecurityTerms/all"
channel = "contract"
tier = "core"
note = "合同层(覆盖档位 api,但为产品级通用条款,非 Azure OpenAI 提示词专属):产品条款中的 Privacy and Security Terms。确认 DPA 管辖 Customer Data / Personal Data 的处理与安全且冲突时 DPA 优先;Azure Core Services 由客户配置部署 Geo 时静态 Customer Data 存于该 Geo;另有一条与有状态资源保留相关的条款——服务配置/自定义模型若 90 天无调用、未修改且客户未登录,可被视为订阅已过期(进而适用 DPA 的保留与删除口径)。作为 role / retention / processing_region 的合同层佐证,未单独充当某一维度的权威源(DPA 正文本身不可抓)。"

[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "training-no-foundation-model-training"

[[product.training.point]]
text = "Prompts, completions, embeddings and training data are not available to other customers or to OpenAI and other providers of Models sold by Azure, are not used by those providers to improve their models or services, and are not used to train any generative AI foundation models without your permission or instruction"
text_zh = "提示、补全、嵌入与训练数据不对其他客户开放,也不对 OpenAI 等模型提供方开放,不被这些提供方用于改进其模型或服务,未经你的许可或指示不用于训练任何生成式 AI 基础模型"

[[product.training.point]]
text = "Scope: Azure Preview features, including Models sold by Azure in preview, may employ different privacy practices, including with respect to abuse monitoring — the no-training commitment above is stated for generally available features"
text_zh = "范围限定:Azure 预览功能(含 preview 状态的 Models sold by Azure)可能适用不同的隐私做法,包括滥用监测方面——上述「不用于训练」承诺是针对正式发布功能写的"
anchor = "dp-preview-different-privacy-practices"

[[product.training.point]]
text = "Scope note, not a counter-example: the Azure DPIA (enterprise privacy FAQ layer) says Microsoft Azure processes personal data for purposes compatible with providing the online services, such as personalization, security, fraud and malware prevention, issue resolution and improvement. \"Improvement\" sits close to a training use under this ledger's criteria, but the DPIA ranks below the developer_data data-privacy page and speaks of Personal Data in Microsoft's own business operations, so it neither covers nor overturns training = yes"
text_zh = "范围说明而非反证:Azure DPIA(enterprise_privacy_faq 层)写明 Azure 处理个人数据的目的包括与服务提供相容的用途,如个性化、安全、欺诈与恶意软件防护、问题解决与改进。按本仓库口径「改进」接近训练用途,但 DPIA 的权威层级低于 developer_data 的 data-privacy 页,且讲的是微软自身业务运营中的 Personal Data,既不能覆盖也不能推翻 training=yes"
anchor = "dpia-azure-purpose-of-processing"

[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "zdr-modified-abuse-monitoring"

[[product.zdr.point]]
text = "Not open to everyone: \"Microsoft allows customers who meet additional Limited Access eligibility criteria to apply to modify abuse monitoring by completing this form\", and \"Some advanced Models sold by Azure may have more stringent criteria for turning off abuse monitoring\""
text_zh = "不是谁都能申请:须满足额外的 Limited Access 资格条件才能提交表单申请修改滥用监测,且部分高级模型关闭滥用监测的条件更严"
anchor = "am-limited-access-eligibility-criteria"

[[product.zdr.point]]
text = "Approved modified abuse monitoring stops the storage and human review described above, but automated review of prompts and completions may still be conducted at request time"
text_zh = "获批 modified abuse monitoring 后不再进行上述数据存储与人工复核,但请求时的自动审核仍可能进行"

[[product.zdr.point]]
text = "Preview features may employ different privacy practices, including with respect to abuse monitoring, so this option is not guaranteed to cover models in preview"
text_zh = "预览功能可能适用不同的隐私做法(含滥用监测),故该选项不保证覆盖 preview 状态的模型"
anchor = "dp-preview-different-privacy-practices"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "retention-abuse-monitoring-store"

[[product.retention.point]]
text = "Default: flagged prompts and completions are stored in the abuse monitoring data store for human review, logically separated by customer resource, and can be accessed by authorized Microsoft employees via point wise queries using request IDs"
text_zh = "默认:被标记的提示与补全进入滥用监测数据存储等待人工复核,按客户资源逻辑隔离,经授权的微软员工可用请求 ID 逐条查询访问"
anchor = "retention-abuse-monitoring-store"

[[product.retention.point]]
text = "That store holds only data already flagged by the abuse monitoring system or part of a potentially abusive pattern of use; prompts and completions that go through automated review are not stored by the abuse monitoring system and are not used to train the AI model or other systems"
text_zh = "该存储只收已被滥用监测系统标记、或属于潜在滥用模式的数据;走自动审核的提示与补全不被滥用监测系统存储,也不用于训练 AI 模型或其他系统"
anchor = "am-automated-review-no-store"

[[product.retention.point]]
text = "Approved modified abuse monitoring: the data storage and human review process described above is not performed, so no abuse-monitoring retention applies in that mode"
text_zh = "获批 modified abuse monitoring 后,上述数据存储与人工复核不进行,该模式下没有滥用监测留存"
anchor = "zdr-modified-abuse-monitoring"

[[product.retention.point]]
text = "Stateful features (Responses API, the Threads feature of the Assistants API, Stored completions) and customer uploads via the Files API or vector store are persisted in the service"
text_zh = "有状态功能(Responses API、Assistants 的 Threads、Stored completions)与经 Files API/向量存储上传的数据会持久化在服务内"
anchor = "retention-stateful-features-stored-in-service"

[[product.retention.point]]
text = "Data stored for those features sits at rest in the Foundry resource in the customer's Azure tenant, within the same geography as the resource, and can be deleted by the customer at any time — this is customer-requested persistence, a different object from the vendor's abuse-monitoring store"
text_zh = "这类数据静态存放在客户 Azure 租户内的 Foundry 资源中、与资源同 geography,客户可随时删除——这是客户自己要求持久化的数据,与厂商为滥用监测留存的数据是两回事"
anchor = "retention-stateful-features-customer-deletable"

[[product.retention.point]]
text = "After expiration or termination of the subscription, Microsoft retains Customer Data stored in the Online Service in a limited function account for 90 days so the customer can extract it, then disables the account and deletes the data. This is an upper bound on data already stored in the service, not the default retention period for request bodies"
text_zh = "订阅到期或终止后,已存储在 Online Service 内的 Customer Data 在受限功能账户保留 90 天供客户导出,之后禁用账户并删除。这是服务内已存数据的保留上限,不是请求正文的默认保留期"
anchor = "retention-azure-90d-limited-function-account"

[[product.retention.point]]
text = "Deletion trigger for stateful resources: a Services configuration or custom model that has been inactive for 90 days (no calls, not modified and no current key, customer not signed in) may at Microsoft's discretion be treated as an Online Service whose subscription has expired, which pulls in the DPA retention and deletion terms above. It governs the lifecycle of configurations and custom models, not how long request bodies are kept"
text_zh = "有状态资源的删除触发条件:服务配置或自定义模型 90 天无调用、未修改且无当前密钥、客户未登录时,微软可自行决定将其视为订阅已过期的 Online Service,从而适用上述 DPA 的保留与删除口径。它管的是配置与自定义模型的生命周期,不是请求正文的保留期"
anchor = "contract-inactive-config-custom-model-90d"

[[product.retention.point]]
text = "Supplement, not the basis: \"The models are stateless: no prompts or completions are stored in the model\" describes the model itself, not the service layer, so it does not by itself mean the service retains nothing"
text_zh = "补充说明而非依据:『模型本身无状态、不在模型中存储提示或补全』讲的是模型内部,不等于服务层不留存"
anchor = "training-retention-stateless-no-retrain"

[[product.retention.point]]
text = "Scope: preview features may employ different privacy practices, including with respect to abuse monitoring, so the retention picture above is stated for generally available features"
text_zh = "范围限定:预览功能可能适用不同的隐私做法(含滥用监测),上述保留图景是针对正式发布功能"
anchor = "dp-preview-different-privacy-practices"

[product.processing_region]
codes = ["selected"]
anchor = "region-processing-in-customer-geography"

[[product.processing_region.point]]
text = "Standard and Regional Provisioned: prompts and responses are processed within the customer-specified Azure geography, and might be processed between regions within that geography for operational purposes"
text_zh = "Standard / Regional Provisioned:提示与响应在客户指定的 Azure geography 内处理,运维需要时可在该 geography 内跨区域"
anchor = "deployment-region-standard"

[[product.processing_region.point]]
text = "Data Zone: the service processes data only within the Microsoft-specified data zone (US, EU, or Asia Pacific (APAC))"
text_zh = "Data Zone:只在微软指定的 data zone(US / EU / APAC)内处理"
anchor = "deployment-region-data-zone"

[[product.processing_region.point]]
text = "Global: may be processed in any Azure region — and Global Standard is the deployment type Microsoft recommends starting with for most workloads, so the most common configuration carries no processing-region limit"
text_zh = "Global:可在任意 Azure 区域处理——而 Global Standard 正是微软建议大多数工作负载的起点,即最常见的配置没有处理地限制"
anchor = "deployment-region-global"

[[product.processing_region.point]]
text = "Location of processing is separate from location of storage: for all deployment types data stored at rest remains in the designated Azure geography"
text_zh = "处理地与静态存储地是两件事:所有部署类型的静态数据都留在指定的 Azure geography"
anchor = "deployment-at-rest-geography"

[[product.processing_region.point]]
text = "For Global and DataZone deployment types the abuse monitoring data store created for them is stored in the customer-designated geography, and only the location of processing is affected"
text_zh = "Global 与 DataZone 部署产生的滥用监测数据存储也存在客户指定的 geography,使用这两类部署时改变的只是处理地"
anchor = "region-global-datazone-at-rest"

[[product.processing_region.point]]
text = "Contract layer for storage: if the customer configures a service to be deployed within a Geo, Microsoft will store Customer Data at rest within that specified Geo"
text_zh = "合同层的存储承诺:客户把服务配置在某个 Geo 内部署,微软就把 Customer Data 静态存储在该 Geo 内"
anchor = "contract-azure-core-services-geo"

[[product.processing_region.point]]
text = "Contract-layer limit on that storage commitment: \"Certain services may not enable Customer to configure deployment in a particular Geo or outside the United States and may store backups in other locations\" — it qualifies the at-rest commitment only and does not change the Global/DataZone processing-location findings above"
text_zh = "合同层对静态存储承诺的限定:部分服务不允许客户配置 Geo 或美国以外部署,且可能在别处存备份——它只限定静态存储承诺,不改变上面 Global/DataZone 的处理地结论"
anchor = "contract-certain-services-no-geo-config-backups"

[[product.processing_region.point]]
text = "Developer deployment type (one of this product line's types): no data residency guarantees and a fixed 24-hour lifetime"
text_zh = "Developer 部署类型(本产品线的类型之一):没有数据驻留保证,固定 24 小时生命周期"
anchor = "deployment-region-developer"

[[product.processing_region.point]]
text = "Exception inside this product line: when Grounding with Bing Search and/or Grounding with Bing Custom Search is used through Microsoft Foundry (including via Foundry Agent service, Responses API in Foundry Models, and/or Web Knowledge Source), the DPA does not apply, the Microsoft Privacy Statement applies instead, and Customer Data will flow outside the customer's compliance and Geo boundary. The exception comes from the contract layer (Product Terms, Privacy & Security Terms), not from the Foundry Models data-privacy page"
text_zh = "本产品线内的例外:通过 Microsoft Foundry 使用 Grounding with Bing Search 或 Grounding with Bing Custom Search 时(含 Foundry Agent service、Foundry Models 的 Responses API、Web Knowledge Source),DPA 不适用,改由 Microsoft 隐私声明管辖,Customer Data 会流出客户的合规与 Geo 边界。该例外出自合同层(产品条款 Privacy & Security Terms),不是 Foundry Models 的 data-privacy 页"
anchor = "contract-grounding-bing-dpa-exception"

[product.role]
kind = "processor"
anchor = "role-microsoft-processor-azure"

[[product.role.point]]
text = "Customer request data: Microsoft, as a data processor, processes Customer Data to provide Customer the Online Services in accordance with Customer's documented instructions"
text_zh = "面向客户的请求数据:微软作为受托处理方,依客户书面指示为提供在线服务处理 Customer Data"

[[product.role.point]]
text = "Controller scope: \"Microsoft also uses Personal Data to support a limited set of business operations\" and \"Microsoft is controller of the processing of personal data to support these specific business operations\". This limited controller role for Microsoft's own business operations does not change the processor finding for customer request data"
text_zh = "独立控制者范围:微软也会为有限的自有业务运营使用 Personal Data,并在这些场景下是 controller。这一有限控制者身份不改变本档位对客户请求数据的 processor 判定"
anchor = "dpia-microsoft-controller-business-operations"

[[product.role.point]]
text = "Limit attached to that controller role: \"Microsoft won't use Customer Data or information derived from it for profiling or for advertising or similar commercial purposes\""
text_zh = "对该控制者角色的限制:微软不会把 Customer Data 或其衍生信息用于画像、广告或类似商业目的"
anchor = "dpia-no-profiling-advertising"

[[product.role.point]]
text = "Exception inside this product line: when Grounding with Bing Search and/or Grounding with Bing Custom Search is used through Microsoft Foundry, the DPA does not apply, the Microsoft Privacy Statement applies instead, and Customer Data will flow outside the customer's compliance and Geo boundary"
text_zh = "本产品线内的例外:通过 Microsoft Foundry 使用 Grounding with Bing 搜索时 DPA 不适用,改由 Microsoft 隐私声明管辖,Customer Data 流出客户的合规与 Geo 边界"
anchor = "contract-grounding-bing-dpa-exception"

