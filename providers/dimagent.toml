anchor = "dim-privacy-logs-collected"

[[product.retention.point]]
text_zh = "期限类型：§五.2 的两类例外——遵从法律法规的信息留存要求（例如《网络安全法》规定网络日志不少于 6 个月，这是下限，不能反推「到期即删全部内容」）；以及出于财务、审计、争议解决等目的需要合理延长的期限（仅限所列目的）。"
anchor = "dim-privacy-retention-legal-floor-extension"

[[product.retention.point]]
