[[source]]
url = "https://dimagent.cn/privacy"
channel = "consumer_privacy"
tier = "core"
note = "《DimAgent 隐私政策》（2026-08-06 生效）。第七节「关于数据训练的特别说明」按模型来源分成两类，两类的训练与上传结论相反：法至自托管模型在境内自有基础设施处理、不外发、不训练、对话记录只存本地；法至采购的第三方 API 模型则由上游按自己的条款决定是否训练。第五节给存储地点（境内、目前不跨境）与存储期限。第四节列委托处理方。"

[[source]]
url = "https://dimagent.cn/terms"
channel = "contract"
tier = "core"
note = "《DimAgent 用户协议》（2026-08-06 生效）。§1 定义输入内容/输出内容/Dim 账号/BYOK/BYOA/积分，以及企业用户与个人用户；§7.2「数据训练」与隐私政策第七节同向：法至自身不拿输入输出训练模型，第三方 API 模型由上游条款决定。"

[[product]]
id = "self-hosted-models"
badge = "法至自营模型"
category = "coding_plan"
plan_level = "any"
label = "模型是法至自己部署运行的第三方开源模型，机器在自建 IDC 或 UCloud 云服务环境（官方文档称这一档为「法至自托管模型」，此处改称自营，以免和本台账「自托管＝客户自己跑」那一类混淆）。BYOK 自配模型那条链路按收录范围不收——输入内容由本地设备直接发给你选的模型方，不经过法至服务器"

[product.training]
mark = "yes"
mode = "default"
anchor = "dim-privacy-7-1-no-own-training"

[[product.training.point]]
text_zh = "自托管模型这一档另有一句更强的：输入内容在法至控制的境内基础设施中处理，不发送至外部第三方，也不用于训练——即不存在「上游可能拿去训练」的问题。"
anchor = "dim-privacy-self-hosted-no-external"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "dim-privacy-self-hosted-local-only"

[[product.zdr.point]]
text_zh = "公开文本承诺的是对话记录不上传、只留在你的设备上。要注意它承诺的边界：这一档的模型跑在法至自己的 IDC 与 UCloud 上，推理请求必然进入法至的基础设施，而「推理请求本身不落盘」这句公开文本没有单独写。判 ✓ 依据的是「不上传对话记录」这条明文，不是更强的那个意思。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "dim-privacy-self-hosted-local-only"

[[product.retention.point]]
text_zh = "「不留存」说的是对话记录不上传法至服务器这一条。账号、订单、日志这类个人信息另按第五节「最短必要期限」保留，并受《网络安全法》网络日志不少于 6 个月的法定要求约束；这与推理内容是两件事。"
anchor = "dim-privacy-retention-minimum-necessary"

[[product.retention.point]]
text_zh = "期限类型：§五.2 的两类例外同样适用于本档——遵从法律法规的信息留存要求（例如《网络安全法》规定网络日志不少于 6 个月，这是下限，不能反推「到期即删全部内容」）；以及出于财务、审计、争议解决等目的需要合理延长的期限（仅限所列目的）。"
anchor = "dim-privacy-retention-legal-floor-extension"

[[product.retention.point]]
text_zh = "删除不是即时的：§七.2 写明删除相关信息后，因安全技术限制可能无法立即从备份系统中删除，备份清除或实现匿名化前继续安全存储并限制进一步处理。"
anchor = "dim-privacy-deletion-backup-delay"

[[product.retention.point]]
text_zh = "语境=停止运营：§五.3 写明本服务停止运营时，将以公告等形式通知，并在法律法规要求的期限内删除服务器中留存的个人信息。"
anchor = "dim-privacy-stop-operation-delete"

[[product.retention.point]]
text_zh = "语境=终止后/卸载后：用户协议 §14.3.2 写明协议终止后法至仍有权在法律允许的最小必要范围内保存您的信息，存在违法行为时依法保存记录；§3.3.2 写明卸载后按法律法规要求处理相关信息。对象是账号/记录类信息，不改变输入输出不留存的结论。"
anchor = "dim-terms-14-3-2-retention-after-termination"

[product.processing_region]
codes = ["CN"]
anchor = "dim-privacy-storage-in-china"

[product.role]
kind = "controller"
anchor = "dim-privacy-handler-self"

[[product.role.point]]
text_zh = "隐私政策通篇以「我们会如何收集、使用、存储、共享您的个人信息」的口吻写，是《个人信息保护法》下个人信息处理者的位置，不是受你委托、按你指示处理的受托方。两份公开文档里没有任何一处把法至定为受托方。"

[[product.role.point]]
text_zh = "政策里点名的委托处理方是基础设施层面的：UCloud 云服务与自建 IDC，按原话「仅提供基础设施服务，不接触用户输入输出内容」。这和法至对你是什么角色是两件事。"
anchor = "dim-privacy-entrusted-processors"

[[product.role.point]]
text_zh = "用户协议区分了企业用户与个人用户，但没有配套的数据处理协议把企业场景下的受托关系写下来；企业客户要按受托处理签，得另行约定。"

[[product]]
id = "third-party-api-models"
badge = "第三方 API 模型"
category = "coding_plan"
plan_level = "any"
label = "法至采购、在产品界面里可选的第三方模型。接入哪几家官方说明会随业务调整，以产品界面展示为准。链路可能不止一跳：隐私政策 SDK 表写明 AI Provider SDK「含 AIHubMix 中转」，实际链路可能是「法至 → AIHubMix 中转 → 模型方」，但官方未说明哪些模型经此中转，中转方的条款与处理地均未公开"

[product.training]
mark = "no"
anchor = "dim-privacy-third-party-may-train"

[[product.training.point]]
text_zh = "公开文本对本档上游只有反向表述：服务商「可能会根据其自身的隐私政策和服务条款」把输入内容用于模型训练或服务优化（§二.2 第三方 API 圆点、§7.2 第二圆点；用户协议 §7.2.2 同句）。按判定口径「可能会用于训练/服务优化」计为训练，本行据此判 ✗。"

[[product.training.point]]
text_zh = "法至称已与当前接入的全部第三方模型 API 服务商签署约定：不得将输入输出用于模型训练或服务优化，默认对所有用户生效。该约定尚未写进公开的隐私政策或用户协议，本轮追不到官方原文，因此只作待核实声明记录，不承担本行结论；该约定写进公开文本并由 bot 重抓快照后，才谈得上改判。"

[[product.training.point]]
text_zh = "法至自身不拿输入输出训练模型这一条是有公开依据的（§7.1），与上游那一跳是两件事。"
anchor = "dim-privacy-7-1-no-own-training"

[[product.training.point]]
text_zh = "厂商自己承认第三方服务商可能拿内容去训练，并给出换档建议：§7.3 标题即「如您不希望第三方服务商使用您的内容进行训练，请您：」——优先选择法至自托管模型；或通过 BYOK 选择明确不用于训练的模型服务；或按产品界面展示的模型来源自行选择。"
anchor = "dim-privacy-7-3-avoid-third-party-training"

[[product.training.point]]
text_zh = "合同层同向，且权威性高于隐私政策：用户协议 §7.2.3 要求使用前查看产品界面中的模型来源说明并阅读相应服务商的隐私政策，「如您不同意第三方服务商的数据处理方式，请优先选择法至自托管模型，或通过 BYOK 方式选择您信任的模型服务。」合同里同样没有第三方档不训练的承诺，规避方式是换档。"
anchor = "dim-terms-7-2-3-choose-self-hosted"

[[product.training.point]]
text_zh = "链路还可能多一跳：SDK 表写「AI Provider SDK（含 AIHubMix 中转）」，使用目的是「连接模型服务、发送输入内容并接收输出」，涉及个人信息为输入内容、输出内容。官方未说明哪些模型经此中转，中转方是否训练未公开，不据此推断。"
anchor = "dim-privacy-sdk-aihubmix-transit"

[product.zdr]
mark = "no"
anchor = "dim-privacy-third-party-may-train"

[[product.zdr.point]]
text_zh = "上游那一跳：公开文本没有任何零保留表述，唯一相关的一句是服务商「可能会…用于模型训练或服务优化」，与「不留存」不相容。按「任一跳明确为否，则全链为否」，本档不能给 ✓。"

[[product.zdr.point]]
text_zh = "法至称已与当前接入的全部第三方模型 API 服务商签署零数据保留约定，默认生效、无需另行开通。该约定尚未写进公开文本，本轮追不到官方原文，只作待核实声明记录，不承担本行结论。"

[[product.zdr.point]]
text_zh = "法至自己这一侧有公开依据：对话记录仅保存在您的本地设备，不上传至法至服务器。这一条只覆盖法至侧，不覆盖输入内容发送给上游之后的留存。"
anchor = "dim-privacy-third-party-local-record"

[[product.zdr.point]]
text_zh = "链路还可能多一跳：SDK 表写 AI Provider SDK「含 AIHubMix 中转」，中转方是否留存输入内容、在何处处理均未公开。"
anchor = "dim-privacy-sdk-aihubmix-transit"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "dim-privacy-third-party-local-record"

[[product.retention.point]]
