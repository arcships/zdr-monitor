[[product.processing_region.point]]
text = "The subprocessor list incorporated by §5.1 now lives at https://www.meta.com/legal/meta-for-work/subprocessor-list/ (the two older addresses recorded earlier are stale). It gives the Processing Location of each subprocessor entity and Meta affiliate — United States, Denmark, Sweden, Ireland, Singapore, Philippines and others — that is, where those companies sit, not where the Services process or store data. It is an authorization list under §5.1 (Standard Services) only, so it is not a statement on this dimension and no anchor is bound to it."
text_zh = "§5.1 并入的子处理者清单现址为 https://www.meta.com/legal/meta-for-work/subprocessor-list/（先前记的两个旧地址已失效）。它列的是各子处理者实体与 Meta 关联公司的 Processing Location——United States、Denmark、Sweden、Ireland、Singapore、Philippines 等——即这些公司所在地，不是本服务处理或存储数据的地点。该清单是 §5.1（Standard Services）项下的授权清单，不构成本维度的表述，故不为其绑锚点。"

[[product.processing_region.point]]
text = "The Geographic Use Policy's Restricted Territories govern where you may access the Services and deploy your Integrated Products (the page's own scope note says it describes where you may use the Services and where you may deploy your Integrated Products), not where data is processed, so it is not evidence on this dimension either."
text_zh = "Geographic Use Policy 的 Restricted Territories 管的是你能在哪些地域访问服务、部署 Integrated Products（该页自述描述的是 where you may use the Services and where you may deploy your Integrated Products），不是数据处理地，同样不构成本维度的证据。"

[product.role]
kind = "processor"
anchor = "llama-tos-5-1-processor-standard"

[[product.role.point]]
text = "§5.1 states that Meta will collect, use, process, and share such data as a \"Service Provider\" or \"Processor\", and requires compliance with the MGPT"
text_zh = "§5.1 明确 Service Provider / Processor，并遵守 MGPT"

[[product.role.point]]
text = "§2 incorporates the MGPT into these Terms."
text_zh = "§2 把 MGPT 并入本 ToS。"

[[product]]
id = "api-contributor"
badge = "Contributor 档"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "llama-tos-6-1-train-discounted"

[[product.training.point]]
text = "§6.1 states that \"Meta may use your Content to train, develop, evaluate, and improve Meta’s artificial intelligence models, products, and services\""
text_zh = "§6.1 明确可用于训练/开发/评估/改进 Meta 的 AI 模型"

[[product.training.point]]
text = "Content is disassociated from the account and the API key before training, but that step may be skipped for evaluation, safety, abuse, quality and policy review, and there is no guarantee that model output will not resemble your Content. §6.2: \"You must not submit sensitive, confidential, or personal information to the Discounted Services.\" (use Standard to process personal information)"
text_zh = "训练前会做与账户及 API key 的 disassociate 步骤，但评估/安全/滥用/质量/政策审查可跳过该步骤，且不保证模型输出不与你的 Content 相似。§6.2：不得提交敏感、机密、个人信息(要处理个人信息请用 Standard)"

[[product.training.point]]
text = "This tier has no mechanism for excluding particular traffic from training"
text_zh = "该档没有按流量排除训练的机制"

[[product.training.point]]
text = "The only way to avoid training is to use the Standard Services instead (the Data Commitments give the same route)."
text_zh = "不想被训练只能改用 Standard Services(Data Commitments 给出同样路径)。"

[[product.training.point]]
text = "Which policy applies is decided by the model: \"The designation of the Services as Discounted Services or Standard Services is determined solely by the designation of the Model you select, regardless of any other Meta Model it invokes\" (§1), and §13.4 says the same (\"The Models you select determine how Meta may use your Content, as described in Sections 5 and 6\")."
text_zh = "适用哪套政策由所选模型决定：§1『The designation of the Services as Discounted Services or Standard Services is determined solely by the designation of the Model you select, regardless of any other Meta Model it invokes』；§13.4 同旨（『The Models you select determine how Meta may use your Content, as described in Sections 5 and 6』）。"
anchor = "llama-tos-1-tier-by-model"

[[product.training.point]]
text = "Beyond Content, §4.2 lets Meta use Usage Data (technical data such as tool call sequences, API request metadata, error or other logs, timestamps, token counts and latency measurements) to \"test, support, develop, evaluate, and improve the Meta Model API and other technologies, products and services\", subject to the restrictions in §5.1. That is a separate use from Content training, and §5.1 is a Standard Services clause, so the text does not state how it applies to the Discounted tier."
text_zh = "除 Content 外，§4.2 还允许 Meta 把 Usage Data（tool call sequences、API request metadata、error 或其他日志、时间戳、token 计数、延迟测量等技术数据）用于 test/support/develop/evaluate/improve Meta Model API 等，但受 §5.1 限制。这与 Content 训练是两件事，且 §5.1 是 Standard Services 的条款，原文未写明它对本档如何适用。"
anchor = "llama-tos-4-2-usage-data"

[product.zdr]
mark = "unknown"
searched = [
  "https://dev.meta.ai/help/policies-and-privacy/zero-data-retention",
  "https://dev.meta.ai/legal/terms-of-service",
  "https://dev.meta.ai/legal/commitments",
  "https://dev.meta.ai/help/policies-and-privacy/contributor-tier",
]

[[product.zdr.point]]
text = "The ZDR help page does not distinguish tiers and says only \"ZDR support may vary by model\", without stating whether the Contributor/Discounted tier can enable ZDR. This tier exists on the premise that Meta may use Content for training, which is contractually incompatible with request-level zero retention, but Meta has taken no position, so it is recorded faithfully as not_found and must not be read in reverse as the vendor declining to offer it."
text_zh = "ZDR 帮助页不区分档位，只说『ZDR support may vary by model』，没有说明 Contributor/Discounted 档能否启用 ZDR。该档的存在前提是 Meta 可用 Content 训练，与请求级零保留在条款上相斥，但官方未表态，故如实记 not_found，不得反推为厂商拒绝提供。"

[[product.zdr.point]]
text = "The same page sets ZDR's boundaries without distinguishing tiers: features that rely on storing prompts, attachments or responses are turned off (stateful requests, background/asynchronous requests, file uploads, web search, Playground chat history), and even with ZDR Meta still retains a few categories (AUP-violation inputs and outputs for up to 2 years, usage statistics, account and team data, operational metadata, support feedback; data processed by third-party integrations is not covered). None of this states whether the Discounted tier can enable ZDR."
text_zh = "同一页在不区分档位的前提下给出了 ZDR 的边界：依赖存储提示词、附件或回复的功能会被关闭（有状态请求、后台/异步请求、文件上传、web search、Playground 历史）；且即使开了 ZDR，Meta 仍保留少数类别（AUP 违规的输入输出最长 2 年、使用统计、账户与团队数据、运维元数据、支持反馈；第三方集成处理的数据不受覆盖）。这些都没有说明本档能否启用 ZDR。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "llama-tos-6-1-retain-discounted"

[[product.retention.point]]
text = "Beyond the five purposes in §4.4, §6.1 also permits retaining Content in order to exercise Meta's rights to use Content under that section (that is, the training use is itself a ground for retention)"
text_zh = "§6.1 除 §4.4 的五项目的外，另允许为『行使 Meta 在本节下的内容使用权』而保留 Content(即训练用途本身构成保留理由)"

[[product.retention.point]]
text = "§6.1 also points to Meta's consumer Privacy Policy, whose wording is case-by-case as needed with no fixed period. No quantified period."
text_zh = "§6.1 同时指向 Meta 消费者隐私政策，该政策的口径是按需个案判断、无固定期限。无量化期限。"

[[product.retention.point]]
text = "Objects: §4.4 retains \"your Content and Usage Data\" — the input/output text and Usage Data are separate objects. §4.2 defines Usage Data as technical data such as tool call sequences, API request metadata, error or other logs, timestamps, token counts and latency measurements."
text_zh = "保留对象：§4.4 保留的是『your Content and Usage Data』——输入输出正文与 Usage Data 是两个对象。§4.2 把 Usage Data 定义为 tool call sequences、API request metadata、error 或其他日志、时间戳、token 计数、延迟测量等技术数据。"
anchor = "llama-tos-4-2-usage-data"

[[product.retention.point]]
text = "§4.1 is another retention ground, and it applies to Content regardless of tier: \"You instruct Meta to retain and process Content as necessary to detect, prevent, and respond to violations of our Model API AUP (defined below) or these Terms and to develop, evaluate, and improve systems for the safety and the security of Meta products and services.\""
text_zh = "§4.1 是另一条保留依据，且不因档位而不同：『You instruct Meta to retain and process Content as necessary to detect, prevent, and respond to violations of our Model API AUP (defined below) or these Terms and to develop, evaluate, and improve systems for the safety and the security of Meta products and services.』"
anchor = "llama-tos-4-1-instruct-retain-aup"

[[product.retention.point]]
text = "Confidentiality does not limit retention, and the data sections survive termination: \"Your Content constitutes your Confidential Information; however, Meta's rights to use, process, and retain Content as described in Sections 4, 5, and 6 are not restricted by this Section 12\", and §15.4 lists Sections 4, 5 and 6 among those that survive — so \"termination\" is not a deletion point here either."
text_zh = "保密义务不限制保留，且数据条款在终止后存续：『Your Content constitutes your Confidential Information; however, Meta's rights to use, process, and retain Content as described in Sections 4, 5, and 6 are not restricted by this Section 12』，§15.4 的存续清单含 §4/§5/§6——「终止」在本档也不是删除时点。"
anchor = "llama-tos-12-confidentiality-not-limiting-retention"

[[product.retention.point]]
text = "Meta keeps a monitoring right over Content: \"Meta may (i) monitor, including through automated or manual (human) review, your use of the Services to assess compliance with these Terms and applicable laws; and (ii) remove, without notice to you, any Content that Meta determines to be in violation of these Terms.\" Content can therefore be seen by humans, in step with the §4.1 AUP retention instruction."
text_zh = "Meta 保留含人工审阅在内的监控权：『Meta may (i) monitor, including through automated or manual (human) review, your use of the Services to assess compliance with these Terms and applicable laws; and (ii) remove, without notice to you, any Content that Meta determines to be in violation of these Terms.』即 Content 会被人看到，与 §4.1 的 AUP 保留指示配套。"
anchor = "llama-tos-10-3-right-to-monitor"

