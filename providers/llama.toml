[[product.role.point]]
text = "Section 6 contains no Service Provider or Processor wording at all (the opposite of §5.1), and Content is used by Meta to train Meta's own models, i.e. used for Meta's own purposes, which is not an entrusted processor. This is a determination that \"this section makes no processor statement\", and the anchor can only land on the own-purpose use clause in §6.1."
text_zh = "§6 全文没有 Service Provider / Processor 表述(与 §5.1 相反)，Content 被 Meta 用于训练自己的模型，即为自身目的使用，不属于受托处理方。此项是『该节未作 processor 声明』的判断，锚点只能落在 §6.1 的自身目的使用条款上。"

