[[product.processing_region.point]]
text = "The subprocessor list incorporated by §5.1 now lives at https://www.meta.com/legal/meta-for-work/subprocessor-list/ (the two older addresses recorded earlier are stale). It gives the Processing Location of each subprocessor entity and Meta affiliate — United States, Denmark, Sweden, Ireland, Singapore, Philippines and others — that is, where those companies sit, not where the Services process or store data. It is an authorization list under §5.1 (Standard Services) only and §6 sets no corresponding subprocessor clause for this tier, so it is not a statement on this dimension and no anchor is bound to it."
text_zh = "§5.1 并入的子处理者清单现址为 https://www.meta.com/legal/meta-for-work/subprocessor-list/（先前记的两个旧地址已失效）。它列的是各子处理者实体与 Meta 关联公司的 Processing Location——United States、Denmark、Sweden、Ireland、Singapore、Philippines 等——即这些公司所在地，不是本服务处理或存储数据的地点。该清单只是 §5.1（Standard Services）项下的授权清单，§6 对本档没有对应的子处理者条款，故不构成本维度的表述，不为其绑锚点。"

[[product.processing_region.point]]
text = "The Geographic Use Policy's Restricted Territories govern where you may access the Services and deploy your Integrated Products, not where data is processed, so it is not evidence on this dimension either."
text_zh = "Geographic Use Policy 的 Restricted Territories 管的是你能在哪些地域访问服务、部署 Integrated Products，不是数据处理地，同样不构成本维度的证据。"

[[product.processing_region.point]]
text = "The Discounted tier sets no separate processing-location clause."
text_zh = "Discounted 档未另设处理地条款。"

[product.role]
kind = "unknown"
