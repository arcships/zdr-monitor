note = "官方帮助中心政策页《Does Model API support Zero Data Retention (ZDR)?》。覆盖 Meta Model API 本身(含 Muse Code 所用的同一 API 凭据)，是 zdr 维度的唯一权威来源，同时给出 retention 维度里 ZDR 档的例外期限(AUP 违规输入输出最长 2 年)。页面不区分 Standard/Discounted 档，只说『ZDR support may vary by model』。"

[[source]]
url = "https://dev.meta.ai/legal/terms-of-service"
fetch = "jina"
channel = "contract"
tier = "core"
note = "《Meta Model API Terms of Service》(Last updated: September 18, 2026；页首自述 These Terms govern your access to and use of the Services for a limited preview period)。签约主体是 Meta Platforms, Inc. 或 Meta Platforms Ireland Limited(欧洲区)。本文件覆盖 Meta Model API 的两个档位，且两档数据条款方向相反：Standard Services(§5，§5.1 明确 Meta 以 Service Provider/Processor 身份处理、且不用 Standard Services 的 Content 训练 Meta Models)与 Discounted Services(§6，§6.1 明确 Meta 可用 Content 训练自有 AI 模型)。§1 规定档位『由你所选的模型决定，与它内部是否调用别的 Meta 模型无关』。§3.2 与 §13.4 把 Muse Code 的 Coding Harness Subscription(订阅档)也纳入本 ToS，并说明订阅档的数据处理同样由所选模型决定适用 §5 还是 §6。§4.2 单独定义 Usage Data 并允许用于改进(与 Content 训练是两件事)；§4.4 是保留条款；§12 与 §15.4 说明数据条款在协议终止后仍存续。§2 以引用方式并入 MGPT、Supplemental Managed Accounts Terms、Data Security Terms。本文件是 training / retention / role 三个维度的权威来源。"

[[source]]
url = "https://dev.meta.ai/legal/commitments"
fetch = "jina"
channel = "enterprise_privacy_faq"
tier = "core"
note = "Meta Model API Data Commitments（法律中心文档；与 meta.toml / meta-muse-code.toml 登记的同一 URL、同一快照）。本家唯一逐档写明训练政策的页面：Standard Services 不用 Content 训练 Meta Models；Discounted Services 可用 Content（含 Inputs/Outputs）训练、开发、评估、改进（训练前做去关联，评估/安全/质量/政策审查不去关联）；Customer Data 一律不用于训练。用途清单里的『To improve and maintain the Meta Model API』两档通用，按从严口径属改进用途；模型训练项则明写『Discounted Services Content only』。另含 Data Retention 小节（保留方式以 Terms 与 Privacy Policy 为准）。作 api 档 training/retention 的佐证。"

[[product]]
id = "api-standard"
badge = "标准 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
anchor = "llama-tos-5-1-no-train-standard"
mode = "by_tier"

[[product.training.point]]
text = "§5.1『will not use Content from Standard Services to train Meta Models』"

[[product.training.point]]
text = "Supporting: the same sentence in the Data Commitments and the developer docs, \"Every version is offered on the Standard tier (standard pricing; your data is never used for training)\". But under §4.2 Meta may use Usage Data (technical logs and request metadata) to \"test, support, develop, evaluate, and improve the Meta Model API and other technologies, products and services\" — Content not being used for training is not the same as technical logs not being used for improvement."
text_zh = "佐证见 Data Commitments 同句与开发者文档『Every version is offered on the Standard tier (standard pricing; your data is never used for training)』。但 Usage Data(技术日志/请求元数据)按 §4.2 可用于 test/support/develop/evaluate/improve Meta Model API——Content 不训练 ≠ 技术日志不用于改进。"

[[product.training.point]]
text = "Which policy applies is decided by the model, not by the endpoint: \"The designation of the Services as Discounted Services or Standard Services is determined solely by the designation of the Model you select, regardless of any other Meta Model it invokes\" (§1), and §13.4 is to the same effect: \"The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.\""
text_zh = "适用哪套政策由所选模型决定，不由接入方式决定：§1『The designation of the Services as Discounted Services or Standard Services is determined solely by the designation of the Model you select, regardless of any other Meta Model it invokes』；§13.4 同旨『The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.』"
anchor = "llama-tos-1-tier-by-model"

[[product.training.point]]
text = "The Data Commitments page — the only page of this vendor that states the training policy tier by tier — lists \"To improve and maintain the Meta Model API\" among the uses of Content and Customer Data, and that item is not tier-limited; read strictly (improving the service counts as training), it is an improvement use. The same page confines model training to the Discounted tier (\"To train and improve Meta's AI models (Discounted Services Content only, as described above)\"), so it does not contradict §5.1."
text_zh = "Data Commitments 页是本家唯一逐档写明训练政策的页面，其用途清单把『To improve and maintain the Meta Model API』列为 Content 与 Customer Data 的用途且未限定档位；按从严口径（改进服务算训练）属改进用途。同页把模型训练限定在 Discounted 档（『To train and improve Meta's AI models (Discounted Services Content only, as described above)』），故与 §5.1 不冲突。"
anchor = "llama-commitments-improve-maintain"

[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "llama-zdr-available-not-default"

[[product.zdr.point]]
text = "Organization level, enabled separately by Meta, and \"ZDR support may vary by model\""
text_zh = "组织级、需 Meta 单独启用、按模型支持程度可能不同"

[[product.zdr.point]]
text = "\"ZDR applies only to calls made directly to Meta Model API.\" See top-level zdr."
text_zh = "只覆盖直连调用。见顶层 zdr。"

[[product.zdr.point]]
text = "ZDR is not \"nothing is kept\": the same page lists the categories Meta still retains under ZDR — inputs and outputs of requests flagged for an AUP violation (up to 2 years), usage statistics (counts only), account and team data, operational metadata, support feedback, and data handled by third-party tools or external integrations, which ZDR does not cover."
text_zh = "开了 ZDR 不等于完全不留：同页列出仍保留的类别——AUP 违规请求的输入输出（最长 2 年）、使用统计（只有计数）、账户与团队数据、运维元数据、支持反馈，以及第三方工具/外部集成处理的数据（不受 ZDR 覆盖）。"
anchor = "llama-zdr-still-retained-metadata"

[[product.zdr.point]]
text = "The only quantified period in this provider's evidence is an exception and an upper bound: \"Meta may retain the associated inputs and outputs for up to 2 years for abuse detection, integrity and content-safety enforcement, and to meet legal obligations.\" The object is the inputs and outputs of a request flagged for an AUP violation, not all traffic."
text_zh = "整套证据里唯一的量化期限是 ZDR 的例外，且为上限：『Meta may retain the associated inputs and outputs for up to 2 years for abuse detection, integrity and content-safety enforcement, and to meet legal obligations.』对象是被标记为 AUP 违规的那次请求的输入输出，不是全部流量。"
anchor = "llama-zdr-policy-violation-2y"

[[product.zdr.point]]
text = "Availability boundary: \"Because your content isn't stored under ZDR, features that rely on storing your prompts, attachments, or responses are turned off, and requests that use them are rejected\" — stateful requests that reference an earlier response, background (asynchronous) requests, file uploads, web search and Playground chat history are unavailable."
text_zh = "可用性边界：『Because your content isn't stored under ZDR, features that rely on storing your prompts, attachments, or responses are turned off, and requests that use them are rejected』——有状态请求、后台（异步）请求、文件上传、web search、Playground 历史都不可用。"
anchor = "llama-zdr-features-disabled"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "llama-tos-4-4-retention-purposes"

[[product.retention.point]]
text = "Same as top-level retention: §4.4 retains Content and Usage Data for five listed purposes, with no uniform period"
text_zh = "同顶层 retention：§4.4 按五项目的保留、无统一期限"

[[product.retention.point]]
text = "Files uploaded through the Files API do not expire by default (an expiry of 1 hour to 30 days can be set)"
text_zh = "Files API 上传文件默认不过期(可设 1 小时–30 天)"

[[product.retention.point]]
text = "Prefix caching is in memory by default, and up to 24 hours can be requested (a hint only)"
text_zh = "前缀缓存默认内存中、可请求最长 24 小时(仅 hint)"

[[product.retention.point]]
text = "Sections 4, 5 and 6 survive termination, and the public terms carry no \"deleted on termination\" commitment."
text_zh = "终止后 §4/§5/§6 存续，公开条款无『终止即删除』承诺。"

[[product.retention.point]]
text = "Objects: §4.4 retains \"your Content and Usage Data\" — the input/output text and Usage Data are separate objects. §4.2 defines Usage Data as technical data such as tool call sequences, API request metadata, error or other logs, timestamps, token counts and latency measurements, and lets Meta use it to \"test, support, develop, evaluate, and improve the Meta Model API and other technologies, products and services\", subject to the restrictions in §5.1."
text_zh = "保留对象：§4.4 保留的是『your Content and Usage Data』——输入输出正文与 Usage Data 是两个对象。§4.2 把 Usage Data 定义为 tool call sequences、API request metadata、error 或其他日志、时间戳、token 计数、延迟测量等技术数据，并允许 Meta 用它 test/support/develop/evaluate/improve Meta Model API 等，但受 §5.1 限制。"
anchor = "llama-tos-4-2-usage-data"

[[product.retention.point]]
text = "§4.1 is a second retention ground beyond §4.4: \"You instruct Meta to retain and process Content as necessary to detect, prevent, and respond to violations of our Model API AUP (defined below) or these Terms and to develop, evaluate, and improve systems for the safety and the security of Meta products and services.\" The same sentence also authorizes using Content to develop, evaluate and improve safety and security systems — a use distinct from the §4.2 Usage Data purpose."
text_zh = "§4.4 之外的另一条保留依据是 §4.1：『You instruct Meta to retain and process Content as necessary to detect, prevent, and respond to violations of our Model API AUP (defined below) or these Terms and to develop, evaluate, and improve systems for the safety and the security of Meta products and services.』同一句还授权把 Content 用于 develop/evaluate/improve 安全与安保系统——与 §4.2 的 Usage Data 用途分开。"
anchor = "llama-tos-4-1-instruct-retain-aup"

[[product.retention.point]]
text = "Confidentiality does not limit retention: \"Your Content constitutes your Confidential Information; however, Meta's rights to use, process, and retain Content as described in Sections 4, 5, and 6 are not restricted by this Section 12.\" Together with §15.4 (Sections 4, 5 and 6 survive termination), \"termination\" is not a deletion point."
text_zh = "保密义务不限制保留与使用：『Your Content constitutes your Confidential Information; however, Meta's rights to use, process, and retain Content as described in Sections 4, 5, and 6 are not restricted by this Section 12.』配合 §15.4（§4/§5/§6 终止后存续），「终止」不是删除时点。"
anchor = "llama-tos-12-confidentiality-not-limiting-retention"

[[product.retention.point]]
text = "Exception context: with ZDR on, the inputs and outputs of a request flagged for an AUP violation may be retained for up to 2 years (an upper bound) — the only quantified period in this provider's evidence."
text_zh = "例外语境：开启 ZDR 后，被标记为 AUP 违规的请求，其输入输出最长可保留 2 年（上限），是本家证据里唯一的量化期限。"
anchor = "llama-zdr-policy-violation-2y"

[[product.retention.point]]
text = "Meta keeps a monitoring right over Content: \"Meta may (i) monitor, including through automated or manual (human) review, your use of the Services to assess compliance with these Terms and applicable laws; and (ii) remove, without notice to you, any Content that Meta determines to be in violation of these Terms.\" Content can therefore be seen by humans, in step with the §4.1 AUP retention instruction."
text_zh = "Meta 保留含人工审阅在内的监控权：『Meta may (i) monitor, including through automated or manual (human) review, your use of the Services to assess compliance with these Terms and applicable laws; and (ii) remove, without notice to you, any Content that Meta determines to be in violation of these Terms.』即 Content 会被人看到，与 §4.1 的 AUP 保留指示配套。"
anchor = "llama-tos-10-3-right-to-monitor"

