[product.role]
kind = "processor"
anchor = "llama-tos-5-1-processor-standard"

[[product.role.point]]
text = "§5.1 states that Meta will collect, use, process, and share such data as a \"Service Provider\" or \"Processor\", and requires compliance with the MGPT"
text_zh = "§5.1 明确 Service Provider / Processor，并遵守 MGPT"

[[product.role.point]]
text = "§2 incorporates the MGPT into these Terms."
text_zh = "§2 把 MGPT 并入本 ToS。"

[[product]]
id = "api-contributor"
badge = "Contributor 档"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "llama-tos-6-1-train-discounted"

[[product.training.point]]
text = "§6.1 states that \"Meta may use your Content to train, develop, evaluate, and improve Meta’s artificial intelligence models, products, and services\""
text_zh = "§6.1 明确可用于训练/开发/评估/改进 Meta 的 AI 模型"

[[product.training.point]]
text = "Content is disassociated from the account and the API key before training, but that step may be skipped for evaluation, safety, abuse, quality and policy review, and there is no guarantee that model output will not resemble your Content. §6.2: \"You must not submit sensitive, confidential, or personal information to the Discounted Services.\" (use Standard to process personal information)"
text_zh = "训练前会做与账户及 API key 的 disassociate 步骤，但评估/安全/滥用/质量/政策审查可跳过该步骤，且不保证模型输出不与你的 Content 相似。§6.2：不得提交敏感、机密、个人信息(要处理个人信息请用 Standard)"

[[product.training.point]]
text = "This tier has no mechanism for excluding particular traffic from training"
text_zh = "该档没有按流量排除训练的机制"

[[product.training.point]]
text = "The only way to avoid training is to use the Standard Services instead (the Data Commitments give the same route)."
text_zh = "不想被训练只能改用 Standard Services(Data Commitments 给出同样路径)。"

[product.zdr]
mark = "unknown"
searched = [
  "https://dev.meta.ai/help/policies-and-privacy/zero-data-retention",
  "https://dev.meta.ai/legal/terms-of-service",
  "https://dev.meta.ai/legal/commitments",
  "https://dev.meta.ai/help/policies-and-privacy/contributor-tier",
]

[[product.zdr.point]]
text = "The ZDR help page does not distinguish tiers and says only \"ZDR support may vary by model\", without stating whether the Contributor/Discounted tier can enable ZDR. This tier exists on the premise that Meta may use Content for training, which is contractually incompatible with request-level zero retention, but Meta has taken no position, so it is recorded faithfully as not_found and must not be read in reverse as the vendor declining to offer it."
text_zh = "ZDR 帮助页不区分档位，只说『ZDR support may vary by model』，没有说明 Contributor/Discounted 档能否启用 ZDR。该档的存在前提是 Meta 可用 Content 训练，与请求级零保留在条款上相斥，但官方未表态，故如实记 not_found，不得反推为厂商拒绝提供。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "llama-tos-6-1-retain-discounted"

[[product.retention.point]]
text = "Beyond the five purposes in §4.4, §6.1 also permits retaining Content in order to exercise Meta's rights to use Content under that section (that is, the training use is itself a ground for retention)"
text_zh = "§6.1 除 §4.4 的五项目的外，另允许为『行使 Meta 在本节下的内容使用权』而保留 Content(即训练用途本身构成保留理由)"

[[product.retention.point]]
text = "§6.1 also points to Meta's consumer Privacy Policy, whose wording is case-by-case as needed with no fixed period. No quantified period."
text_zh = "§6.1 同时指向 Meta 消费者隐私政策，该政策的口径是按需个案判断、无固定期限。无量化期限。"

