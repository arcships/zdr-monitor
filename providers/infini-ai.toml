[[product.training.point]]
text = "Conclusion: not_disclosed — the public terms contain neither an authorization that data \"may be used for training\" nor a commitment that it is \"not used for training\"; neither direction can be found. Evidence base: across all 33 documents fetched this round (9 legal texts + the FAQ aggregate and single pages + product and operations documentation + the Chinese and English website policies), the word \"training\" appears exactly once, in User Service Agreement §1.3.6(3)②: \"where we, as the platform operator and technology provider, discover or receive a report of unlawful content, we will promptly take disposal measures such as stopping generation, stopping transmission and removal, carry out rectification through measures such as model optimization training, and report to the competent authorities\" — this is the unlawful-content rectification context required by the Interim Measures for the Administration of Generative AI Services, not an authorization to use customer data for training. Pointing the other way (also not a commitment): the \"special note\" opening the platform privacy policy states that the platform \"does not directly collect or process any business data or personnel data that you or the enterprise customer you represent provides or generates in the course of use. We only: on the mandate of the enterprise customer you belong to or represent, process and store your ... business data\", and §2 again characterizes it as \"processing the relevant data on an entrusted basis\""
text_zh = "结论：not_disclosed——公开条款既没有「可用于训练」的授权，也没有「不用于训练」的承诺，两向都查不到。证据面：本轮抓下的全部 33 份文档（legal 9 篇 + FAQ 聚合与单页 + 产品与运维文档 + 官网中英文政策）中，「训练」二字只在《用户服务协议》§1.3.6(3)② 出现一次：「我们作为平台运营方/技术提供方发现或收到举报存在违法内容的，将及时采取停止生成、停止传输、消除等处置措施，采取模型优化训练等措施进行整改，并向有关主管部门报告」——这是《生成式人工智能服务管理暂行办法》要求的违法内容整改语境，不是把客户数据用于训练客户模型的授权。相反面向（同样不构成承诺）：平台隐私政策开篇「特别说明」自认平台「并不直接收集或处理您或您代表的企业客户在使用过程中所提供或产生的任何业务数据或人员数据。我们仅：受您所属/所代表的企业客户委托，对您……业务数据……进行处理及存储」，§二 再次以「受托处理相关数据」定性"

[[product.training.point]]
text = "Under the Personal Information Protection Law, entrusted processing means processing on the mandating party's instructions without using the data beyond that scope, which structurally works against the platform using customer content for training, but not a word of the terms says so — that is inference, not disclosure. Also note: User Service Agreement §6.5 authorizes only \"the use of your name, trademarks and logos in sales, marketing and other publicity and promotional materials and activities\", and does not touch content. Uncertainties: (1) the \"preset models\" on the Agentic MaaS platform include third-party closed-source models (User Service Agreement §1.3.1 lists the filing entities for Wuqiong AI Assistant / Onetake / GenStudio, which deploy open-source models such as GLM-5, Moonshot, Kling-V3-omni, seedance-2.0 and deepseek), and Privacy Policy §2.2 also says \"if you and your enterprise have a need to use third-party closed-source models, you may raise it with us and we will coordinate on your behalf\" — if a request is forwarded to the original vendor of a third-party closed-source model, whether that vendor uses the input for training is not covered anywhere in this provider's documents"
text_zh = "受托处理在《个人信息保护法》下意味着按委托方指示处理、不得超范围使用，这在结构上不利于平台拿客户内容去训练，但条款本身没有一个字这么说，属推断而非披露。另可注意：《用户服务协议》§6.5 只授权「在销售、营销等宣传、推广材料和活动中使用您的名称、商标、标识」，未触及内容。不确定性：①Agentic MaaS 平台上「预置模型」含第三方闭源模型（用户协议 §1.3.1 列出无穹 AI 助手/Onetake/GenStudio 分别部署了 GLM-5、Moonshot、Kling-V3-omni、seedance-2.0、deepseek 等开源模型的备案主体），隐私政策 §2.2 也说「如您及所属企业有第三方闭源模型使用需求，亦可向我们提出，我们将为您协调」——若请求被转给第三方闭源模型原厂，那些原厂是否用输入训练，本家的文档完全没有覆盖"

[[product.training.point]]
text = "(2) throughput content is sent to Alibaba Cloud and NetEase Yidun for content safety review (Privacy Policy §2.2 and §5.1.5); their retention and use rules are in their own policies, and this provider makes no binding statement about them"
text_zh = "②吞吐内容会送阿里云与网易易盾做内容安全审核（隐私政策 §2.2 与 §5.1.5），这两家的留存/使用规则见其各自政策，本家未作约束性声明"

[[product.training.point]]
text = "(3) the earlier record saying \"the privacy policy has no training-related clause\" is correct, but it also wrote the conclusion as \"maintain not_stated\"; this round uses not_disclosed uniformly for the same meaning."
text_zh = "③旧记录说「隐私政策无训练相关条款」是对的，但它同时把结论写成「维持 not_stated」，本轮统一用 not_disclosed 表达同一含义。"

[[product.training.point]]
text = "(4) The one clause inside the searched set that does put customer-submitted material to \"improving the service\" use, and therefore has to be handled explicitly under docs/judgment.md (\"used to improve the service / raise quality\" counts as training), is platform Privacy Policy §2.5 (extended business function — troubleshooting service). The sentence, quoted verbatim from the snapshot: \"我们将记录、分析这些信息以便及时响应您的请求，并用于改进服务。\" Object boundary: what §2.5 collects is the troubleshooting record the customer submits — \"您提交的故障描述、问题证明截图\" — i.e. support material about a fault, not the input/output content of API requests. Because the object is support material rather than request content, this clause neither supplies a training commitment nor overturns the not_disclosed verdict for this tier; it is recorded so that the tier is not read as if the platform puts nothing at all to service-improvement use. It is quoted in this point rather than bound as an anchor, because a bound quote on a mark=unknown dimension would assert a conclusion this tier does not carry (docs/judgment.md)."
text_zh = "④查阅范围内确有一条把客户提交的材料用于「改进服务」的表述，按 docs/judgment.md「用来改进服务/提高质量」算训练的口径必须显式处理：平台隐私政策 §2.5（扩展业务功能-故障排查服务）。原句逐字引自快照：「我们将记录、分析这些信息以便及时响应您的请求，并用于改进服务。」对象边界：§2.5 收集的是客户提交的故障记录——「您提交的故障描述、问题证明截图」，即围绕故障的支持材料，不是 API 请求的输入/输出正文。正因对象是排障材料而非请求正文，这条既不是本档的训练承诺，也不推翻本档的 not_disclosed；写在这里是为了不把本档读成「平台完全不把任何东西用于服务改进」。它只在本条 point 正文里引述、不设锚点——在 mark=unknown 的维度上绑引文等于断言本档并不承载的结论（docs/judgment.md）。"

[[product.training.point]]
text = "(5) The second \"improvement\" wording sits in the same document's §3 (use of Cookies and similar technologies), also quoted verbatim from the snapshot: \"通过Cookie和同类技术可以帮助您省去重复填写账号信息、输入搜索内容的步骤和流程，还可以帮助我们改进服务效率、提升登录和响应速度。\" Object = Cookie and similar-technology data (account information, search records, login state), again not API input/output content; same treatment and same reason for not binding an anchor as §2.5 above. The same document adds that information collected through Cookies or similar technologies is not used for any purpose other than those described in the policy."
text_zh = "⑤第二处「改进」表述在同一份文档的 §三（对 Cookie 和同类技术的使用），同样逐字引自快照：「通过Cookie和同类技术可以帮助您省去重复填写账号信息、输入搜索内容的步骤和流程，还可以帮助我们改进服务效率、提升登录和响应速度。」对象=Cookie 与同类技术数据（账号信息、搜索记录、登录状态），同样不是 API 输入/输出正文；处理方式与不设锚点的理由同上面 §2.5。同一份文档另写明通过 Cookie 或同类技术收集的信息不用于本政策所述目的之外的任何其他用途。"

[[product.training.point]]
text = "(6) Anchor bookkeeping for this dimension: three anchors in this file have \"training\" among their topics, and none of them is bound to this dimension — infini-tos-training-only-remediation (topics: training) is bound to no dimension at all; infini-tos-scope-modules (topics: retention, role, training) is bound to the compute tier's retention evidence, where the §1.3 scope limit does real work; infini-privacy-special-notice-not-collector (topics: role, training) is bound to api/role and compute/role. The §1.3.6(3)② wording is quoted in the point text above instead of being anchored; a bound quote on a mark=unknown dimension would assert a conclusion this tier does not carry (docs/judgment.md)."
text_zh = "⑥本维度的锚点记账：本文件里 topics 含 training 的锚点共三个，都不绑在本维度——infini-tos-training-only-remediation（topics: training）未绑任何维度；infini-tos-scope-modules（topics: retention, role, training）绑在算力档的 retention 依据上，那里 §1.3 的范围限制才起作用；infini-privacy-special-notice-not-collector（topics: role, training）绑在 api/role 与 compute/role 上。§1.3.6(3)② 那句只在上面 point 正文里引述、不设锚点；在 mark=unknown 的维度上绑引文等于断言本档并不承载的结论（docs/judgment.md）。"

