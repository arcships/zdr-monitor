text = "The website tier has no ZDR-related wording"
text_zh = "官网档无 ZDR 相关表述"

[[product.zdr.point]]
text = "The website itself carries no inference requests, so the ZDR concept does not apply to the website tier."
text_zh = "官网本身也不承载推理请求，ZDR 概念在官网档不适用。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "infini-web-privacy-shortest-period"

[[product.retention.point]]
text = "Website tier conclusion: the shortest necessary period, not quantified, with enquiry-form information given as an example, kept \"for a certain period during business exchange and cooperation\""
text_zh = "官网档结论：最短必需期限，未量化，举例说明咨询表单信息「在业务交流合作的一定时间段内」持续保存"

[[product.retention.point]]
text = "Deleted or anonymized once that period is exceeded. The English version has the same sentence (shortest period necessary to fulfill the stated service purposes). There is also one limit on deletion: a deletion request excludes \"data that laws and regulations require to be retained\", and after deletion the data may not be purged from backups immediately, being stored in isolation until the backup can be purged or anonymized. Note that these periods hold only for website form information and cannot be extrapolated to API request content."
text_zh = "超期删除或匿名化。英文版同句（shortest period necessary to fulfill the stated service purposes）。另有一条删除限制：删除请求「法律法规要求必须保留的数据除外」，且删除后可能无法立即从备份中清除，会隔离存储至备份可清除或匿名化。注意这些期限只对官网表单信息成立，不能外推到 API 请求内容。"

[[product.retention.point]]
text = "Period type — the other half of §7.3 is a statutory floor: \"此外，我们会对您的相关信息保存至相关法律所规定的必要期限。\" It is a lower bound set by law, not a cap, so it cannot be read as \"deleted once the period expires\" or as an upper bound; it stands alongside the shortest-necessary period and the deletion / anonymisation after that period. It is quoted from the current website version of the document (infinigence-ai.com/privacy-policy.html, published/effective/last updated 2026-08-04, §七.3), the version this tier's anchors are bound to; the earlier docs-site copy of the same policy (2026-07-21, §七.3) carries the same sentence and can be cross-checked."
text_zh = "期限类型——§七.3 还有另外一半，是法定下限：「此外，我们会对您的相关信息保存至相关法律所规定的必要期限。」这是法律规定的下限而非上限，不能反推为「到期即删」，也不能当作上限；它与「最短必需期间」及超期删除/匿名化并列。该句引自官网档现行发布版（infinigence-ai.com/privacy-policy.html，发布/生效/最近更新日期均为 2026-08-04，§七.3），也就是本档各维度锚点所绑定的那一版；同一政策更早的文档站副本（2026-07-21，§七.3）同句，可互校。"
anchor = "infini-web-privacy-statutory-floor"

[product.processing_region]
codes = ["CN"]
anchor = "infini-web-privacy-cn-storage-only"

[[product.processing_region.point]]
text = "Website tier conclusion: stored within China only. In Chinese, \"in accordance with laws and regulations, we will store the personal information collected about you only within the territory of the People's Republic of China\"; the English international site has the same sentence, as does the privacy policy summary. Cross-border transfer requires separate notice and consent. Note that the international site (infinigence-ai.com) and its English version carry the same commitment, showing that the international site does not place data outside China."
text_zh = "官网档结论：仅境内存储。中文「我们依照法律法规的规定，仅会将收集到的有关您的个人信息存储于中华人民共和国境内」，英文国际站同句，隐私政策摘要同。跨境需单独告知并取得授权同意。注意国际站（infinigence-ai.com）与其英文版也是同一承诺，说明国际站没有把数据放到境外。"

[product.role]
kind = "controller"
anchor = "infini-web-privacy-joint-controller"

[[product.role.point]]
text = "Website tier conclusion: joint handlers (joint controllers) — the introduction, \"Shanghai Infinigence Intelligent Technology Co., Ltd. and Beijing Infinigence Technology Co., Ltd. ... jointly operate the website as joint handlers of the data\"; the same sentence stands in both the current website version (2026-08-04) and the earlier docs-site copy (2026-07-21), so it can be re-checked stably."
text_zh = "官网档结论：共同处理者（joint controller）——引言「上海无问芯穹智能科技股份有限公司、北京无问芯穹科技有限公司……作为数据的共同处理者共同运营的官网」；该句在官网现行版（2026-08-04）与文档站更早的副本（2026-07-21）里都在，可稳定复核。"

[[product.role.point]]
text = "And \"at present, this platform does not share your (or your organization's) information with any third party, nor does it integrate software development kits (SDKs) provided by third parties ...\". Against the platform tier (an entrusted processor for customer business data, integrating SDKs such as Alibaba Cloud and NetEase Yidun), these are two roles and two sets of facts. This sentence is kept as parallel evidence for the website-vs-platform contrast; it answers the third-party sharing and SDK question, not the controller / processor question, so the role verdict above is anchored to the joint-handler sentence instead."
text_zh = "且「目前，本平台并不存在与第三方共享您（或您的组织）信息的情况，亦不存在会接入由第三方提供的软件开发包(SDK)……的情况」。与平台档（对客户业务数据为受托处理方、并接入阿里云与网易易盾等 SDK）是两种角色、两套事实。本句作为「官网档 vs 平台档」对比的并列证据保留：它回答的是第三方共享与 SDK 接入，不是受托/控制方的问题，故上面的 role 结论锚定在共同处理者那句上。"
anchor = "infini-web-privacy-no-share-no-sdk"

