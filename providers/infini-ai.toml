[[product.retention.point]]
text = "No public document contains any retention clause for compute instances (containers, images, mounted volumes, job logs). The only usable adjacent evidence is that operation audit events \"only support operation records from 2024-10-31 onwards\" (which applies equally to operation events such as creating, starting and stopping compute instances), and User Agreement §2.4.2, which on deregistration for violations \"purges the data you have uploaded to and stored in this platform and the services\" — neither is a retention commitment for compute instance data. Recorded as not_found; §4.2 of the model service tier is not used as a substitute. User Agreement §1.3 is why the platform-tier retention clauses cannot simply be carried over: it defines \"本平台\" as the Agentic MaaS modules (GenStudio / AgentWorks / ComfyStack) plus the Onetake module, so those clauses do not reach compute instances."
text_zh = "公开文件中没有任何针对算力实例（容器、镜像、挂载卷、任务日志）的保留期限条款。唯一可用的相邻证据是操作审计事件「仅支持 2024-10-31 至今的操作记录」（对算力实例的创建/启停等操作事件同样适用），以及用户协议 §2.4.2 违规注销时「清空您所上传和存储在本平台及服务中的数据」——都不是算力实例数据的保留承诺。按 not_found 记，不拿模型服务档的 §四.2 去顶替。平台档的保留条款之所以不能直接搬过来，依据是用户协议 §1.3：它把「本平台」界定为 Agentic MaaS 服务模块（GenStudio / AgentWorks / ComfyStack）加 Onetake 功能模块，这些条款够不到算力实例。"
