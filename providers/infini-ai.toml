text_zh = "官网档三份文档（问卷隐私政策中文/英文、隐私政策摘要、个人信息收集清单）全文均无「训练」或 training 相关表述。官网收集的只有咨询表单信息，用途限于「与您取得联系并针对性解决您的问题、达成进一步合作」。"

[[product.training.point]]
text = "One wording in this tier's own document puts Cookie data to \"improving service quality\" use and has to be processed explicitly under docs/judgment.md (\"used to improve the service / raise quality\" counts as training): website enquiry-form Privacy Policy §2.1 — \"我们使用该信息判断注册用户是否已经登录，提升服务质量及优化用户体验。我们不会将 Cookie 用于前述目的之外的任何用途。\" The same sentence stands in both the current website version (infinigence-ai.com/privacy-policy.html §二.1, 2026-08-04) and the earlier docs-site copy (2026-07-21 §二.1). Object = Cookie / similar-technology data, neither the enquiry-form information this tier collects nor API input/output content, so it does not move the undisclosed verdict for this tier; it is recorded so that the tier is not read as if no improvement wording exists in it at all. It is quoted in this point rather than bound as an anchor, because a bound quote on a mark=unknown dimension would assert a conclusion this tier does not carry (docs/judgment.md). The platform-tier documents carry their own two improvement wordings (platform Privacy Policy §2.5 troubleshooting records and §3 Cookies), recorded under the api tier; this tier's own document has no troubleshooting-service clause, and the Cookie sentence above is the only improvement wording in it."
text_zh = "本档自己的文档里有一处把 Cookie 数据用于「提升服务质量」的表述，按 docs/judgment.md（「用来改进服务/提高质量」算训练）必须显式处理：官网问卷隐私政策 §二.1「我们使用该信息判断注册用户是否已经登录，提升服务质量及优化用户体验。我们不会将 Cookie 用于前述目的之外的任何用途。」该句在官网现行版（infinigence-ai.com/privacy-policy.html §二.1，2026-08-04）与文档站更早的副本（2026-07-21 §二.1）里都在。对象=Cookie 与同类技术数据，既不是本档收集的咨询表单信息，也不是 API 输入/输出正文，故不改变本档的未披露结论；写在这里是为了不把本档读成不存在任何「改进」类表述。它只在本条 point 正文里引述、不设锚点——在 mark=unknown 的维度上绑引文等于断言本档并不承载的结论（docs/judgment.md）。平台档另有两处「改进」表述（平台隐私政策 §2.5 故障记录与 §三 Cookie），记在 api 档下；官网档自己的文档里没有故障排查服务一节，全文「改进/提升」类表述只有上面这句 Cookie 条款。"

