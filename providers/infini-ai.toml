[[product.retention.point]]
text = "Conclusion: no quantified uniform period; retained for \"the period necessary for the purpose\""
text_zh = "结论：无量化统一期限，按「目的所必需」保留"

[[product.retention.point]]
text = "Object and context have to be written separately, because this provider has two sentences pointing in different directions about the same object. (1) Object = input/output content (API and the experience center): platform Privacy Policy §2.2, \"for the input and output content of you and the customer you belong to, this platform applies full encryption and isolated storage; only when you or the customer you belong to requests that we carry out program debugging will we look up the corresponding log by request ID and apply to you and your customer for authorization to decrypt the throughput content\" — that is, input and output content is stored, and the controls are encryption plus isolation plus an application requirement for decryption, not \"not retained\". Set against it is the developer FAQ (the aggregate page and the single page /support/faq/027-chat-history.html are word for word identical): \"whether in the experience center or in the API service, we do not store the conversation history between users and large language models.\" The reconciling reading: the FAQ addresses only the product concept \"conversation history\" (multi-turn conversation history the user can retrieve), while Privacy Policy §2.2 addresses \"input/output content\" as an object of data processing"
text_zh = "对象与语境必须分开写，因为本家同一对象有两句方向不同的话。①对象=输入/输出正文（API 与体验中心）：平台隐私政策 §2.2「对于您及您所属客户输入/输出内容，本平台已进行了全量加密并隔离存储，仅在您及您所属客户请求我们开展程序调试（debug）时，我们将根据相关请求ID查看对应日志并向您及您所属客户申请对吞吐内容进行授权解密」——即输入输出正文是被存储的，控制手段是加密 + 隔离 + 解密需申请，不是「不保留」。与之并列的是开发者 FAQ（聚合页与单页 /support/faq/027-chat-history.html 逐字相同）：「无论是体验中心还是 API 服务，我们均不会存储用户与大语言模型的会话历史记录。」两句的调和读法：FAQ 只针对「会话历史记录」这一产品概念（用户侧可检索的多轮对话历史），隐私政策 §2.2 针对「输入/输出内容」这一数据处理对象"

[[product.retention.point]]
text = "But on their face the two sentences do pull against each other, and no sentence in the legal documents marks the boundary between them, so confidence is recorded as medium rather than high. (2) Object = personal information (account, real-name, refund, logs): §4.2.1, \"we will retain your personal information only for the period necessary for the purpose of providing this platform and related services\", listing three criteria (the time needed for the business purpose / a longer period the user consents to / legal and contractual requirements), with no day count"
text_zh = "但两句字面上确实互相拉扯，而法律文件里没有任何一句说明二者的边界，故置信度记 medium 而非 high。②对象=个人信息（账号、实名、退费、日志）：§四.2.1「我们将仅在为提供本平台及相关服务之目的所必需的期间内保留您的个人信息」，并列出三条确定标准（业务目的所需时间/用户同意的更长期限/法律与合同要求），未给天数"

[[product.retention.point]]
text = "§4.2.2: deleted or anonymized once the period expires (except where laws and regulations provide otherwise). Suspended-service users are an express exception: §1.1, \"we will continue to keep the mobile number, account and password such suspended-service users submitted when creating the account, in order to provide them with account login, until the suspended-service user deregisters the account or our statutory storage period expires\". (3) Object = access and operation logs: §1.3(3) discloses the network log fields as \"customer APIKey, request time, request processing result (success/failure, whether finished)\", with no period"
text_zh = "§四.2.2 超期删除或匿名化（法律法规另有规定除外）。停服用户是明确的例外：§1.1「该等停服用户创建账户时提交的手机号码、账号、密码，我们将会继续保存，以为其提供账号登录服务，直至停服用户注销其账号，或我们法定的存储时间届满」。③对象=访问/操作日志：§1.3(3) 披露网络日志字段为「客户APIKey、请求时间、请求处理结果（成功/失败、是否结束）」，无期限"

[[product.retention.point]]
text = "User Service Agreement §1.3.5(2), in the context of implicit labelling of generated synthetic content, says \"as the service provider we will retain the relevant log information in accordance with laws, administrative regulations and relevant national provisions\" — a statutory floor, which cannot be read in reverse as \"deleted when it expires\""
text_zh = "《用户服务协议》§1.3.5(2) 在生成合成内容隐式标识语境下写「我们作为服务提供方将依照法律、行政法规和国家有关规定保存相关日志信息」——这是法定下限口径，不能反推「到期即删」"

[[product.retention.point]]
text = "The feature documentation gives the only observable floor: the \"query operation audit events\" page states that event queries \"only support operation records from 2024-10-31 onwards\", i.e. operation audit events have been retained continuously since at least 2024-10-31 (about 23 months); note that this is a query-range limit, not a deletion commitment, and that the 30-day single-query window is a query limit, not a retention period. (4) Object = agent memory and Trace: the AgentWorks memory doc states that \"retention period, automatic deduplication, recall threshold and end-user self-service deletion need to be managed through the organization's data processes or external systems\", and the security doc states that \"URL expiry only means the URL can no longer be used for access; it does not mean every copy has been deleted\", adding \"please confirm the retention and deletion policies for Traces, logs and other copies with the platform provider and the owner of the external system\" — i.e. the platform discloses no period for these two objects. (5) Object = portrait material uploaded to Onetake: the \"ONEtake Platform Important Notice\" confirms it will be \"collected, edited, previewed, stored and processed\", with no period. (6) Object = data the customer uploads to the platform: User Agreement §2.4.2 only \"purges\" it on deregistration for violations"
text_zh = "功能文档给了唯一可观测的下限：「查询操作审计事件」页面写明事件查询「仅支持 2024-10-31 至今的操作记录」，即操作审计事件至少自 2024-10-31 起持续留存（约 23 个月），注意那是查询范围限制，不是删除承诺，且 30 天的单次查询窗口是查询限制不是保留期。④对象=智能体记忆与 Trace：AgentWorks 记忆文档写明「保留期限、自动去重、召回阈值和最终用户自助删除需要通过组织的数据流程或外部系统管理」，安全文档写明「URL 过期只表示不能再通过该 URL 访问，不代表所有副本已经删除」，并「请向平台提供方和外部系统负责人确认 Trace、日志及其他副本的保留和删除策略」——即平台不披露这两个对象的期限。⑤对象=Onetake 上传的人像素材：《ONEtake 平台重要提示》确认会被「收集、编辑、预览、存储并处理」，无期限。⑥对象=客户主动上传到平台的数据：用户协议 §2.4.2 只在违规注销时「清空」"

[[product.retention.point]]
text = "§3.5 places security and backup responsibility wholly on the customer. (7) A general exception to deletion: §7.1, \"because you use this platform's services on an enterprise's mandate or as an employee of an enterprise customer, business data in the corresponding account, such as business operations and service usage records, cannot be deleted or anonymized except on the instruction or request of your enterprise\" — the end user cannot delete business data themselves. (8) Third-party leg: throughput content is reviewed by Alibaba Cloud and NetEase Yidun (§2.2 and §5.1.5 state that NetEase Yidun receives \"the user's request content\" and \"the service's response content\"), and this provider does not constrain their retention. Period type: all of the \"needed for the purpose / statutory floor\" kind, with no cap and no typical range"
text_zh = "§3.5 把安全与备份责任整体压给客户。⑦删除的普遍例外：§七.1「因您是受企业委托/作为企业客户员工使用本平台服务，除受您所在企业指示或要求，对应账号中与业务开展、服务使用记录等业务数据无法进行删除或匿名化处理」——最终用户本人无法删除业务数据。⑧第三方环节：吞吐内容经阿里云与网易易盾审核（§2.2、§5.1.5 列明网易易盾共享「用户的请求内容」与「服务的响应内容」），其保留期本家未约束。期限类型：全部为「目的所需/法定下限」型，无任何上限或典型区间"

[[product.retention.point]]
text = "This provider discloses no request-level deletion period."
text_zh = "本家未披露任何请求级删除期限。"

[[product.retention.point]]
text = "(9) Service termination: platform Privacy Policy §7.5 — \"如我们停止运营，我们将停止收集您的个人信息，并将停止运营的通知以公告等商业上可行的形式通知您，并对我们所持有的您的个人信息进行删除或匿名化处理。\" Object = the personal information we hold; context = the platform stops operating. It is a deletion / anonymisation commitment, not a period for input/output content."
text_zh = "⑨服务终止：平台隐私政策 §七.5「如我们停止运营，我们将停止收集您的个人信息，并将停止运营的通知以公告等商业上可行的形式通知您，并对我们所持有的您的个人信息进行删除或匿名化处理。」对象=我们持有的个人信息，语境=平台停止运营。这是一条删除/匿名化承诺，不是输入输出正文的期限。"
anchor = "infini-privacy-stop-operation-deletion"

[[product.retention.point]]
text = "(10) Exception context — violation handling: User Service Agreement §1.3.4 — \"我们作为平台运营方/技术提供方有权依法依约采取警示、限制功能、暂停或终止向您提供服务等处置措施，保存有关记录，并向有关主管部门报告。\" No period is given. §1.3.6(3)③ repeats the same undertaking in synonymous wording (\"将依法依约\"), and §7.1 adds the same \"保存有关记录\" for investigations. This is wider than, and sits alongside, the §1.3.5(2) statutory log floor, so this tier must not be read as having only that one implicit-labelling retention clause."
text_zh = "⑩例外语境——违规处置：用户服务协议 §1.3.4「我们作为平台运营方/技术提供方有权依法依约采取警示、限制功能、暂停或终止向您提供服务等处置措施，保存有关记录，并向有关主管部门报告。」未定期限。§1.3.6(3)③ 是同义句（「将依法依约」），§7.1 另就调查写明同样的「保存有关记录」。它比 §1.3.5(2) 的法定日志下限更宽，与之并列，故不能把本档读成只有隐式标识那一处法定留存。"
anchor = "infini-tos-violation-records-retained"

[[product.retention.point]]
text = "(11) Account-level deregistration trigger: User Service Agreement §2.4.3 — \"如您连续12个月未通过您的账号登录本平台，且您的账号下不存在任何可用服务，我们有权自主决定注销您的账号。\" This is an inactivity trigger at account level; §2.4.1(3) says only that \"该账号记录、功能等将无法恢复或提供\", i.e. it promises no deletion of data, so this is not a content retention period and does not narrow the periods above."
text_zh = "⑪账号层面的注销触发条件：用户服务协议 §2.4.3「如您连续12个月未通过您的账号登录本平台，且您的账号下不存在任何可用服务，我们有权自主决定注销您的账号。」这是账号层面的不活跃注销触发；§2.4.1(3) 只说「该账号记录、功能等将无法恢复或提供」，未承诺删除数据，故不是内容保留期限，也不缩短上面各条的期限。"
anchor = "infini-tos-inactive-account-deregistration"

