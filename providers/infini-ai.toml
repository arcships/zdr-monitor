note = "《官网问卷隐私政策》在 infinigence-ai.com 上的中文发布页，页面自带发布日期/生效日期/最近更新日期均为 2026-08-04，是官网档的现行发布版。本文件官网档各维度锚点（role 的共同处理者句、retention 的最短期间句与法定下限句、processing_region 的仅境内存储句）都绑在本来源，官网档结论以本版为准。文档站副本（docs.infini-ai.com/legal/questionnaire-privacy-policy.html）标 2026-07-21，是同一政策更早的一版，两版正文有实质差异：文档站版 §一(一) 有「我们与上海模速空间、武汉算力公共服务平台合作运营『模速』『武汉算力』平台……我们另外向您提供《个人信息共享授权书》」整段，本页没有；咨询表单的功能名与字段写法不同（本页为「立即咨询」/「联系我们」，文档站版为「咨询我们」且字段含「提交平台（无问、模速、武汉算力）」）；本页页尾多一处 Cookie 同意弹窗。因此两页不是同一份文档的等同副本，不能按同一份文档等同处理。其 §三(一)3 的「目前，本平台并不存在与第三方共享您（或您的组织）信息的情况，亦不存在会接入由第三方提供的软件开发包(SDK)以实现相关功能的情况」是官网档独有的表述。"

