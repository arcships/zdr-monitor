[[product.processing_region.point]]
text = "Recorded as undisclosed for this tier — the region code is unknown, not CN. The in-China storage commitment in platform Privacy Policy §4.1 (\"除非另有约定或法律另有规定，我们在中华人民共和国境内收集和产生的个人信息将储存在中华人民共和国境内\") has \"本平台\" as its scope, and §1.3/§2 define this platform as Agentic MaaS plus Onetake, without naming compute instances. The FAQ separately carries Q&As such as \"the compute cloud platform uses a strict multi-tenant architecture that ensures data isolation between tenants\" and \"where are the compute resources\", but neither is a storage-location commitment. The compute tier is very likely processed within China as the platform tier is (the same tenancy system, the same privacy policy framework), but the public terms do not name compute instances, so the earlier CN code is withdrawn and the §4.1 sentence is kept here as adjacent evidence only, not as this tier's region. If the enterprise customer signs a separate compute service contract (the \"Product Service Agreement\" mentioned on the console login page), the region follows that contract; its text is not published and has no snapshot."
text_zh = "本档按未披露记，不再断言任何地域码。平台隐私政策 §四.1 的境内存储承诺（「除非另有约定或法律另有规定，我们在中华人民共和国境内收集和产生的个人信息将储存在中华人民共和国境内」）范围是「本平台」，而 §1.3/§二 把本平台界定为 Agentic MaaS + Onetake，算力实例未被点名。FAQ 另有「智算云平台采用严格的多租户架构，确保租户间的数据隔离」与「算力资源在哪里」类问答，但都不构成存储地域承诺。算力档很可能与平台档同为境内处理（同一套租户体系、同一份隐私政策框架），但公开条款没有点名算力实例，故撤掉原先的 CN 码，§四.1 那句只作为相邻证据保留，不作为本档的处理地结论。若企业客户另签算力服务合同（控制台登录页提及的《产品服务协议》），处理地以该合同为准；其正文未公开、无快照。"
