[[product.role.point]]
text = "Recorded as undisclosed / governed by the delivery contract: the compute tier has no role clause of its own. The platform privacy policy's admission of entrusted processing (\"我们并不直接收集或处理您或您代表的企业客户在使用过程中所提供或产生的任何业务数据或人员数据。我们仅：受您所属/所代表的企业客户委托，对您或您所属/代表的企业客户在使用过程中所主动提供或服务运营产生的业务数据……进行处理及存储\") is textually scoped to \"本平台\", which User Agreement §1.3 defines as Agentic MaaS plus Onetake; compute instances are not named. Customer data inside a compute instance is a kind of \"business data\", but without a clause naming this tier the platform-tier processor determination is not carried over as this tier's kind. If the enterprise customer signs a separate compute service contract (the \"Product Service Agreement\" mentioned on the console login page), the role follows that contract; its text is not published and has no snapshot."
text_zh = "本档按未披露记／以交付合同为准：算力档没有独立的角色条款。平台隐私政策的受托处理自认（「我们并不直接收集或处理您或您代表的企业客户在使用过程中所提供或产生的任何业务数据或人员数据。我们仅：受您所属/所代表的企业客户委托，对您或您所属/代表的企业客户在使用过程中所主动提供或服务运营产生的业务数据……进行处理及存储」）在文本上的范围是「本平台」，而用户协议 §1.3 把本平台界定为 Agentic MaaS + Onetake，算力实例未被点名。算力实例中的客户数据虽属「业务数据」的一种，但在没有点名本档的条款时，不把平台档的 processor 认定搬来当本档的 kind。若企业客户另签算力服务合同（控制台登录页提及的《产品服务协议》），角色以该合同为准；其正文未公开、无快照。"
