channel = "consumer_privacy"
tier = "core"
note = "《Infini-AI 平台隐私政策》，发布日期与生效日期均为 2026-07-23，主体同上两家公司「共同处理」。适用范围是面向企业用户的 infini-ai 平台（Agentic MaaS 的 GenStudio/AgentWorks/ComfyStack 三块 + Onetake），并明确「不向个人用户提供注册登录」。这是模型服务档最重要的一份：开篇「特别说明」自认平台「并不直接收集或处理」客户业务数据、仅「受企业客户委托」处理与存储；§2.2 大模型服务一段直接写明输入/输出内容「已进行了全量加密并隔离存储」，仅在客户主动请求 debug 时按请求 ID 查看日志并申请授权解密，并写明吞吐内容会经阿里云与网易易盾的内容安全审核后回传；§1.3(3) 披露网络日志字段（客户 APIKey、请求时间、请求处理结果）；§四.1 境内存储（「除非另有约定或法律另有规定」为例外）；§四.2 存储期限为「目的所必需的期间」，未量化，并列出三条确定标准；§七.1 明确最终用户对其账号下的业务数据「无法进行删除或匿名化处理」。全文无「训练」二字，也无「零保留/ZDR」表述。注意：本文件在《第三方共享信息清单》里被链接为《上海无问芯穹智能科技股份有限公司官网隐私政策》，与官网（infinigence-ai.com / infini-ai.com）那份问卷隐私政策是两份不同的文档，见 notes。"

[[source]]
url = "https://docs.infini-ai.com/legal/questionnaire-privacy-policy.html"
channel = "consumer_privacy"
tier = "core"
note = "《官网问卷隐私政策》，发布/生效/最近更新日期均为 2026-07-21。适用范围写明是「上海无问芯穹智能科技股份有限公司、北京无问芯穹科技有限公司作为数据的共同处理者共同运营的官网（链接：infinigence-ai.com、infini-ai.com）」——即官网档，基本业务功能只有公司介绍、产品展示、新闻动态、潜在业务机会收集，与平台/模型服务档是两份文档、两种角色（官网是共同处理者）。§七 存储地点为境内、存储期限为「满足产品/服务目的所必需且最短的期间」（举例：咨询我们表单在业务交流合作的一定时间段内持续保存）。全文无「训练」。本文件是文档站的离线副本（页尾自述「本文档是在线文档的离线版本……可能未能反映最新信息」），日期 2026-07-21，早于官网现行版 www.infinigence-ai.com/privacy-policy.html（2026-08-04）；两版正文有实质差异：本版 §一(一) 有「我们与上海模速空间、武汉算力公共服务平台合作运营『模速』『武汉算力』平台……我们另外向您提供《个人信息共享授权书》」整段，官网现行版没有；咨询表单的功能名与字段写法不同（本版为「咨询我们」且字段含「提交平台（无问、模速、武汉算力）」，官网现行版为「立即咨询」/「联系我们」）。故不能把两版当成同一份文档的等同副本；官网档结论以官网现行版为准（本文件官网档各维度锚点均绑在该来源），本版只作早期版本的并列证据，其 §七 两句与现行版同句、可互校。英文版见 infinigence-ai.com/en/privacy-policy.html，日期标为 2026-06-23，与中文两版（2026-07-21、2026-08-04）均不一致。"

[[source]]
url = "https://docs.infini-ai.com/legal/terms-of-service.html"
channel = "contract"
tier = "core"
note = "《用户服务协议》，发布日期与生效日期均为 2026-08-31，签约主体为上海无问芯穹智能科技股份有限公司与北京无问芯穹科技有限公司（「共同运营」）。§1.3 把「本平台」定义为 infini-ai 平台，业务包含 (1) Agentic MaaS 服务模块（大模型服务平台 GenStudio、智能体服务平台 AgentWorks、ComfyUI 工作流平台 ComfyStack）与 (2) Onetake 功能模块；因此本协议覆盖的是「模型服务/平台服务」档，不含独立的算力实例协议。数据处理层面：§1.3.5(2) 是唯一与保留有关的句子（隐式标识语境下「保存相关日志信息」）；§3.5 把用户数据的安全与备份责任整体压给用户；§3.6 允许安排关联公司/第三方提供服务并开通信息访问权限；§2.4.2 违规注销时「清空」用户上传与存储的数据。全文仅一处出现「训练」——§1.3.6(3)② 违法内容整改语境，不是用客户数据训练客户模型。全文未出现「零保留」「ZDR」「不用于训练」，也没有任何量化保留期限。§1.1 要求用户同时接受《infini-ai 平台隐私政策》与《重要提示》；§1.2 提到《无问芯穹官网隐私政策》（指销售联系信息的收集，见 notes 的名称歧义）。"

[[source]]
url = "https://docs.infini-ai.com/support/faq/027-chat-history.html"
channel = "developer_data"
tier = "core"
note = "「我可以检索会话的聊天历史记录吗？」的单页规范 URL（聚合页 faq.html 中同一问答的独立页面，正文逐字相同；单页正文只有这一句，前后无任何限定条件、例外或期限）。【批次 B 重查 2026-09-21：tier 由 conflict 改判为 core】本句与《infini-ai 平台隐私政策》§2.2「对于您及您所属客户输入/输出内容，本平台已进行了全量加密并隔离存储，仅在您及您所属客户请求我们开展程序调试（debug）时，我们将根据相关请求ID查看对应日志并向您及您所属客户申请对吞吐内容进行授权解密」不是同一对象的表述：本句的对象是产品功能层面的「会话历史记录」——问答问的是「我可以检索会话的聊天历史记录吗？」，即用户侧能否翻到多轮对话历史，答句用「不存储」解释该检索能力不存在；隐私政策 §2.2 的对象是数据层的「输入/输出内容」——全量加密 + 隔离存储，并给出访问控制（仅客户主动请求 debug 时按请求 ID 查看日志、需客户授权解密），讲的是存储与解密机制，不是保留期限。两者属「说的不是一回事」，各自是各自对象范围内的结论依据：§2.2 是 retention 维度「输入/输出正文被存储」这一结论的 core（dimensions.retention.anchor_id = infini-privacy-io-encrypted-isolated-storage），本句是 GenStudio 大语言模型两个使用面（体验中心 + API 服务）上「不保留用户可检索的会话历史」这一对象唯一一句官方表述，故保留为 core 并保留锚点；它的权威性不覆盖整个 retention 维度（authoritative_for 仍为空，维度权威仍是隐私政策 §2.2，本句只在该对象的范围内补充）。四种解释逐条排查：①适用范围——本句自述「无论是体验中心还是 API 服务」，即 GenStudio 的 LLM 网页体验面与 API 面；隐私政策 §2.2(1) 把「体验中心」（「我们为您及所属企业客户提供『体验中心』服务」）与 API 形态部署写在同一节，两者覆盖面相重叠，不是「一份管 API、一份管消费产品」的分野，故适用范围解释不能把本句推给另一个档；②档位——两者同属平台档（只面向企业客户，平台不向个人提供注册登录），不存在企业版/个人版、按量/订阅套餐之分；③站点——同为 docs.infini-ai.com 官方文档站、同一主体（上海无问芯穹智能科技股份有限公司 + 北京无问芯穹科技有限公司），无国内站/国际站之分；④时效——本页与聚合 FAQ 页正文都没有任何更新日期/生效日期，既不能证明本句是旧版残留，也不能证明它是现行表述，时效解释无法排除。判 core 而不判 contradiction 的决定性理由是对象不同（产品功能层的可检索历史 vs 数据层的输入输出正文），而「说的不是一回事」不在四种解释之内；同时三份法律文本（隐私政策、用户服务协议、官网问卷隐私政策）都没有一句定义这两个对象的边界，所以也不能反过来断言它们必然是同一个对象。需要厂商书面澄清：①平台是否把「会话历史记录」与「输入/输出内容」当两个对象——即请求/响应正文经加密隔离存储（可凭请求 ID 定位日志、经授权解密）但产品侧不提供任何用户可检索的会话历史（体验中心不留对话、API 无会话列表接口），还是本句就是对输入输出正文不落盘的整体承诺；②若是前者，请给出加密存储正文的保留期限与删除触发条件（现行文本只有「目的所必需的期间」，无量化期限）；③本句所在问答位于开发者文档而非法律文件，其承诺是否受隐私政策与用户协议的例外（debug 授权解密、法定留存、内容安全审核第三方回传）约束。监测价值：该句是「会话历史记录」这一对象唯一的官方表述载体，保留锚点以逐日跟踪其是否被改写或删除（聚合页 faq.html 上逐字相同的同一句已随该源 drop，不再单独监测）。"

