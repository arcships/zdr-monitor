[[product.processing_region.point]]
text = "Conclusion: stored within China (CN). Platform Privacy Policy §4.1, \"unless otherwise agreed or otherwise provided by law, personal information we collect and generate within the territory of the People's Republic of China will be stored within the territory of the People's Republic of China. For personal information collected and generated outside the territory of the People's Republic of China, we will store it in accordance with laws, regulations, international rules or international practice recognized as effective by the People's Republic of China\" — note the second half: personal information collected or generated abroad is stored under internationally recognized rules, which leaves an unclear opening"
text_zh = "结论：境内（CN）存储。平台隐私政策 §四.1「除非另有约定或法律另有规定，我们在中华人民共和国境内收集和产生的个人信息将储存在中华人民共和国境内。对在中华人民共和国境外收集和产生的个人信息，我们将按照中华人民共和国认可效力的法律、法规、国际规则或国际惯例予以存储」——注意后半句：境外收集/产生的个人信息按中国认可的国际规则存储，等于留了一个不明确的出口"

[[product.processing_region.point]]
text = "The first half also carries the exception \"unless otherwise agreed or otherwise provided by law\". The website tier says the same and more strongly: website enquiry-form Privacy Policy §7.1, \"in accordance with laws and regulations, we will store the personal information collected about you only within the territory of the People's Republic of China\" (the English version has the same sentence: will be stored within the territory of the People’s Republic of China), and the privacy policy summary matches. So the Chinese and English sites, and the platform and website tiers alike, are consistent on storage location: within China. Inconsistent or uncovered points, recorded faithfully alongside: (a) User Agreement §3.6 permits \"arranging for Infini-AI affiliates or other third parties to provide all or part of the services to you, and where necessary granting them the access to service information they require\" — without limiting where those affiliates or third parties are located"
text_zh = "前半句也带「除非另有约定或法律另有规定」的例外。官网档同向且更强：官网问卷隐私政策 §七.1「我们依照法律法规的规定，仅会将收集到的有关您的个人信息存储于中华人民共和国境内」（英文版同句：will be stored within the territory of the People’s Republic of China），隐私政策摘要亦同。因此中英文两站、平台与官网两档在存储地点上口径一致，均为境内。不一致/未覆盖的点如实并列：(a) 用户协议 §3.6 允许「安排无问芯穹关联公司、其他第三方为您提供全部或部分服务，必要时为其开通必需的服务信息访问权限」——未限定这些关联公司/第三方的所在地"

[[product.processing_region.point]]
text = "(b) platform Privacy Policy §2.2 and §5.1.5 show that throughput content is sent to Alibaba Cloud and NetEase Yidun for content safety review; both are domestic entities (Alibaba Cloud Computing Co., Ltd. and Hangzhou NetEase Zhiqi Technology Co., Ltd.), which is compatible with the in-China storage commitment, but whether they in turn sub-entrust is not disclosed"
text_zh = "(b) 平台隐私政策 §2.2 与 §5.1.5 显示吞吐内容会送阿里云与网易易盾做内容安全审核，两家均为境内主体（阿里云计算有限公司、杭州网易智企科技有限公司），与境内存储承诺相容，但其自身是否再转委托未披露"

[[product.processing_region.point]]
text = "(c) the AgentWorks documentation notes that private deployment is a separate delivery scope, in which case the processing location is determined by the delivery environment and the public documentation does not cover it. No \"data export\" commitment and no statement of a completed cross-border transfer assessment was found, nor any overseas compute or overseas inference node."
text_zh = "(c) AgentWorks 文档提到私有部署属单独交付范围，私有部署时的处理地由交付环境决定，公开文档未覆盖。未发现任何「数据出境」承诺或已通过出境评估的表述，也未发现境外算力/境外推理节点。"

[product.role]
kind = "processor"
anchor = "infini-privacy-special-notice-not-collector"

[[product.role.point]]
text = "Conclusion: for customer business data (including API request and response content) the provider identifies itself as an entrusted processor"
text_zh = "结论：对客户业务数据（含 API 请求与响应内容）自认为受托处理方（processor）"

[[product.role.point]]
text = "For personal information it collects itself, such as account and real-name information, it is the handler"
text_zh = "对账号/实名等自身收集的个人信息是处理者"

[[product.role.point]]
text = "On the website tier it identifies itself as a joint handler. The three tiers differ and are recorded one by one. (1) Platform tier (model services / platform services): the \"special note\" opening the privacy policy — \"the infini-ai platform is a platform through which we provide services to enterprise users; we do not directly collect or process any business data or personnel data that you or the enterprise customer you represent provides or generates in the course of use. We only: on the mandate of the enterprise customer you belong to or represent, process and store the business data that you or that enterprise customer actively provides or that the operation of the service generates (including but not limited to the account management information you fill in and service log data)\""
text_zh = "官网档则自认为共同处理者。三档不同，逐档记录。①平台档（模型服务/平台服务）：隐私政策开篇「特别说明」——「infini-ai平台是由我们向企业用户提供服务的平台，我们并不直接收集或处理您或您代表的企业客户在使用过程中所提供或产生的任何业务数据或人员数据。我们仅：受您所属/所代表的企业客户委托，对您或您所属/代表的企业客户在使用过程中所主动提供或服务运营产生的业务数据（包括但不限于您主动填写的账号管理信息、服务日志数据）进行处理及存储」"

[[product.role.point]]
text = "§2 characterizes it again: \"this part describes only the technical support services we provide to you on the mandate of your enterprise and the entrusted processing of the relevant data in that course.\" This is an express admission of entrusted processing. §5.1.2 also states that \"for scenarios where the processing of personal information is entrusted out, we will sign the relevant processing agreements with the entrusted partner as required by law and supervise its use of personal information\" — showing that the provider itself also contracts downstream as an entrusting party. (2) The counterweight on the platform tier: User Agreement §1.3.2/§1.3.3 repeatedly calls itself \"platform operator / technology provider\", §3.5 places the security, backup and lawfulness of user data wholly on the enterprise customer, and the §8 disclaimers assign availability risk to force majeure and third parties"
text_zh = "§二 再次定性「本部分仅介绍，我们受您所属企业委托为您提供的技术支持服务情况及该等过程中受托处理相关数据的情况」。这是明确的受托处理自认。§5.1.2 还写明「对于委托处理个人信息的场景，我们会与受托合作方根据法律规定签署相关处理协议，并对其个人信息使用活动进行监督」——说明本家自己也作为委托方向下游受托方签约。②平台档的对照面：用户协议 §1.3.2/§1.3.3 反复自称「平台运营方/技术提供方」，§3.5 把用户数据的安全、备份、合法性责任整体压给企业客户，§8 免责条款把可用性风险归给不可抗力与第三方"

[[product.role.point]]
text = "Privacy Policy §7.1 states that an end user \"cannot delete or anonymize\" the business data under their account, and §7.2 states that \"except on the instruction or request of your enterprise, we cannot provide you personally with account deregistration\" — both typical behaviours of an entrusted party (answerable only to the mandating party), consistent with the processor characterization. (3) Website tier: the introduction to the website enquiry-form privacy policy says \"Shanghai Infinigence Intelligent Technology Co., Ltd. and Beijing Infinigence Technology Co., Ltd. ... jointly operate the website as joint handlers of the data (links: infinigence-ai.com, infini-ai.com)\" — joint handlers (joint controllers); and the website tier expressly states \"at present, this platform does not share your (or your organization's) information with any third party, nor does it integrate software development kits (SDKs) provided by third parties ...\", in contrast with the platform tier, which lists four third-party SDKs. (4) Contracting entities: both the user agreement and the platform privacy policy name \"Shanghai Infinigence Intelligent Technology Co., Ltd. and Beijing Infinigence Technology Co., Ltd.\" as joint operators / joint handlers, and no public document explains how responsibility is divided between them. Uncertainties: (1) there is a naming conflict within the docs site — the \"Third-Party Information Sharing List and Third-Party SDK Catalogue\" links \"Shanghai Infinigence Intelligent Technology Co., Ltd. Website Privacy Policy\" to the platform-tier privacy.html, while the \"Privacy Policy Summary\" uses the same name for the website-tier document"
text_zh = "隐私政策 §七.1 明确最终用户对其账号下业务数据「无法进行删除或匿名化处理」、§七.2 明确「除受您所在企业指示或要求，我们无法为您个人提供账号注销的服务」——这些都是受托方行为的典型特征（只对委托方负责），与 processor 定性一致。③官网档：官网问卷隐私政策引言写「上海无问芯穹智能科技股份有限公司、北京无问芯穹科技有限公司……作为数据的共同处理者共同运营的官网（链接：infinigence-ai.com、infini-ai.com）」——共同处理者（joint controller），且官网档明确「目前，本平台并不存在与第三方共享您（或您的组织）信息的情况，亦不存在会接入由第三方提供的软件开发包(SDK)……的情况」，与平台档列出四个第三方 SDK 形成对比。④签约主体：用户协议与平台隐私政策均写「上海无问芯穹智能科技股份有限公司、北京无问芯穹科技有限公司」两家共同运营/共同处理，公开文件中未见两家之间责任划分的说明。不确定性：①文档站内存在名称冲突——《第三方共享信息清单和第三方 SDK 目录》把「《上海无问芯穹智能科技股份有限公司官网隐私政策》」链到平台档 privacy.html，而《隐私政策摘要》用同一名称指官网档文档"

[[product.role.point]]
text = "User Agreement §1.2 cites the \"Infini-AI Website Privacy Policy\" for collecting sales contact information (pointing to the website tier). The naming conflict itself does not affect the processor determination (which rests on the platform-tier text), but it shows that this provider's cross-references are not rigorous. (2) The AgentWorks documentation uses wording such as \"platform provider\" and \"target deployment\" and notes that private deployment is a separate delivery scope; if the actual delivery form is a private deployment, the role determination must follow the delivery contract, which the public documentation cannot cover. (3) This provider publishes no DPA or data processing addendum (there is none among the 9 documents in the legal directory) and no subprocessor list in text (the third-party sharing list page is dynamically rendered and its body is empty)."
text_zh = "用户协议 §1.2 引用《无问芯穹官网隐私政策》收销售联系信息（指向官网档）。名称冲突本身不影响 processor 的认定（认定依据是平台档正文），但说明本家文档的引用关系不严谨。②AgentWorks 文档中出现「平台提供方」「目标部署」等措辞，且提到私有部署属单独交付范围，若实际交付形态是私有化部署，角色认定需以交付合同为准，公开文档不能覆盖。③本家没有任何公开 DPA/数据处理附录（legal 目录 9 篇中无 DPA），也没有子处理者清单的正文（第三方共享清单页面动态渲染，正文为空）。"

