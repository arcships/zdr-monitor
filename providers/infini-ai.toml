[[product.zdr.point]]
text = "Conclusion: no ZDR / zero-retention / no-persistence commitment, switch, application path or enterprise data processing addendum can be found, recorded as not_found (no public evidence obtained is not the same as the vendor not offering it). This round fetched all 9 documents in the docs-site legal directory, the support FAQs (including the conversation history single page), the AgentWorks security and memory docs, the Chinese and English website privacy policies and the whole compute cloud website; full-text searches for \"zero retention / zero data retention / not retained / not kept / immediate deletion / delete immediately / DPA / data processing agreement / subprocessor\" returned no hit"
text_zh = "结论：查不到任何 ZDR / 零保留 / 不落盘 的承诺、开关、申请方式或企业级数据处理附录，记 not_found（拿不到公开证据 ≠ 厂商不提供）。本轮把文档站 legal 目录 9 篇 + 支持类 FAQ（含会话历史单页）+ AgentWorks 安全与记忆文档 + 官网中英文隐私政策 + 智算云平台官网全部抓了一遍，全文检索「零保留 / 零数据保留 / 不保留 / 不留存 / 即刻删除 / 立即删除 / DPA / 数据处理协议 / 子处理者」均无命中"

[[product.zdr.point]]
text = "The docs site also has no DPA and no trust/security white paper page (the legal directory holds only 9 documents, none a DPA; /legal/legal-notice.html is a 404). The earlier record treated the FAQ sentence \"we do not store the conversation history between users and large language models\" as ZDR evidence \"stronger than a standard no-retention statement\"; this round disagrees, for three reasons: (1) the Q&A containing that sentence is \"Can I retrieve the chat history of a conversation?\", which asks about the user's ability to retrieve history, and the sentence commits only to not storing \"conversation history\" — it says nothing about request-level non-retention, nothing about deletion once processing completes, and gives no period or application path"
text_zh = "文档站也不存在 DPA 或 trust/security 白皮书页（legal 目录只有 9 篇，没有 DPA；/legal/legal-notice.html 是 404）。旧记录把 FAQ 那句「我们均不会存储用户与大语言模型的会话历史记录」当成「强于标准不保留表述」的 ZDR 证据，本轮不同意，理由三条：①该句所在问答是「我可以检索会话的聊天历史记录吗？」，问的是用户侧的历史检索能力，句子本身只承诺不存储「会话历史记录」，没有说请求级不保留、没有说处理完成后即删、没有给任何期限或可申请口径"

[[product.zdr.point]]
text = "(2) it is not about the same object as platform Privacy Policy §2.2 — the privacy policy states that \"for the input and output content of you and the customer you belong to, this platform applies full encryption and isolated storage\", i.e. input and output content is stored (encryption + tenant isolation + decryption only on application by request ID during debugging), while this sentence commits only to not retaining \"user-retrievable conversation history\"; the two do not conflict (on re-checking on 2026-09-21 that source was reclassified from conflict to core, for the reasons in its scope_note)"
text_zh = "②它与平台隐私政策 §2.2 讲的不是同一个对象——隐私政策写明「对于您及您所属客户输入/输出内容，本平台已进行了全量加密并隔离存储」，即输入输出正文是被存储的（加密 + 租户隔离 + 仅 debug 时按请求 ID 申请授权解密），而本句只承诺不保留「用户可检索的会话历史」，两者不构成冲突（该源 2026-09-21 重查后由 conflict 改判 core，理由见其 scope_note）"

[[product.zdr.point]]
text = "(3) it appears in the developer documentation FAQ rather than in a legal document, and none of the three legal texts — the platform privacy policy, the user agreement and the website privacy policy — carries a corresponding statement. Three observations in the other direction (which do not amount to the vendor not offering ZDR): (a) the platform privacy policy opens by stating that it \"does not directly collect or process\" customer business data and processes only \"on the mandate of the enterprise customer\", and the entrusted role is contractually incompatible with \"using content for its own purposes\", but that is not a zero-retention commitment"
text_zh = "③它出现在开发者文档 FAQ 而非法律文件，且隐私政策、用户协议、官网隐私政策三份法律文本中都没有对应表述。反向观察三点（不等于厂商不提供 ZDR）：(a) 平台隐私政策开篇自认「并不直接收集或处理」客户业务数据、仅「受企业客户委托」处理，受托角色在条款上与「把内容用于自身目的」相斥，但这不是零保留承诺"

[[product.zdr.point]]
text = "(b) throughput content is returned after content safety review by Alibaba Cloud and NetEase Yidun, and retention at that third-party leg is not disclosed"
text_zh = "(b) 吞吐内容会经阿里云与网易易盾内容安全审核后回传，第三方环节的保留未披露"

[[product.zdr.point]]
text = "(c) the AgentWorks documentation states that the retention and deletion policies for Traces and logs must be \"confirmed with the platform provider and the owner of the external system\", i.e. the platform side does not disclose them."
text_zh = "(c) AgentWorks 文档明确 Trace 与日志的保留/删除策略需「向平台提供方和外部系统负责人确认」，即平台侧不披露。"

