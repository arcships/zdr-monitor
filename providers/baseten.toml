mode = "default"
anchor = "baseten-security-practices-dedicated-inference-zdr"

[[product.zdr.point]]
text = "This product is named as operating under a ZDR posture"
text_zh = "该产品被点名持 ZDR 姿态"

[[product.zdr.point]]
text = "ZDR is the default configuration."
text_zh = "ZDR 是默认配置。"

[[product.zdr.point]]
text = "Scope limit on the ZDR commitment: Baseten is not in breach of these Security Practices (including the ZDR commitments) where logging, retention, storage, access, use or disclosure of Customer Content arises from (a) configurations, settings or deployment choices made by a customer or its authorized users; (b) model runtime code, packages, dependencies or other software provided or selected by a customer, including any vulnerability or compromise latent in a Customer Model or its supply chain; (c) a customer's election to enable logging, retention, abuse monitoring or any Third-Party Product; or (d) actions taken at a customer's written direction. This is an exception defining the scope of the commitment, not a withdrawal of it; mark stays yes."
text_zh = "ZDR 承诺的适用边界（例外，非撤销）：若 Customer Content 的 logging、retention、storage、access、use 或 disclosure 源于 (a) 客户或其授权用户所作的配置、设置或部署选择；(b) 客户提供或选用的 model runtime code、packages、dependencies 等软件（含 Customer Model 或其供应链中的潜在漏洞）；(c) 客户自行开启 logging、retention、abuse monitoring 或任何 Third-Party Product；或 (d) 按客户书面指示采取的行动，则不构成 Baseten 违反 Security Practices（含 ZDR 承诺）。mark 仍为 yes。"
anchor = "baseten-security-practices-customer-controlled-factors"

[[product.zdr.point]]
text = "ZDR configuration is changeable at the customer's request: customers may request changes to the applicable ZDR configuration for their workloads by written notice, and Baseten will promptly implement requested changes whenever technically supported for the applicable Service; where it cannot, it must promptly notify the customer with an explanation. This is what mode=default means here — a default the customer can have changed — and it does not mean Baseten may rewrite the default on its own."
text_zh = "ZDR 配置可依客户书面请求变更：客户可书面请求变更其负载适用的 ZDR 配置，Baseten 在适用服务技术上支持时即迅速实现，不可实现时须迅速通知并说明原因。这解释了本档 mode=default 的成色——默认值可由客户请求改写——不等于厂商可自行变更默认值。"
anchor = "baseten-security-practices-zdr-config-changes"

[product.retention]
object = "input_output"
basis = "none"
anchor = "baseten-security-practices-dedicated-inference-zdr"

[[product.retention.point]]
text = "Security Practices \"Dedicated Inference\": a Zero Data Retention posture for Customer Model inputs and outputs, with no persistent copy made"
text_zh = "Security Practices「Dedicated Inference」：对 Customer Model 输入输出持 ZDR、不做持久副本"

[[product.retention.point]]
text = "\"Dedicated Inference (non-input/output data)\": for thirty (30) days after the end of the subscription term the customer may retrieve remaining Customer Content (such as Customer Models), which is deleted once that period ends"
text_zh = "「Dedicated Inference (non-input/output data)」：订阅期结束后 30 天内可取回剩余 Customer Content（如 Customer Models），期满即删除"

[[product.retention.point]]
text = "\"Customer Model Weights\": weights are loaded dynamically into GPU memory and are not persisted to storage by default; where weight caching is enabled, cached weights can be permanently deleted on request"
text_zh = "「Customer Model Weights」：权重动态载入 GPU 内存、默认不持久化，开启 weight caching 后可要求永久删除"

[[product.retention.point]]
text = "The KV cache lives only in GPU memory and is not written to disk (docs/observability/security)."
text_zh = "KV cache 只在 GPU 内存、不落盘（docs/observability/security）。"

[[product.retention.point]]
text = "Async exception on this tier, from the \"Asynchronous Inference\" entry of the Security Practices (listed there as a product entry alongside Model APIs and Dedicated Inference): if the customer elects to enable asynchronous inference, model inputs get temporarily stored and queued for the duration of the request, can stay in queue for up to 72 hours before being processed and then deleted, and Model Outputs are not stored. It applies only where the customer turns asynchronous inference on; 72 hours is an upper bound, and the inputs are deleted once processed."
text_zh = "本档的异步例外，出自 Security Practices「Asynchronous Inference」条（该页把它与 Model APIs、Dedicated Inference 并列为产品条）：客户启用异步推理时，模型输入在请求期间被暂存排队，最多 72 小时后处理并删除，且不存 Model Outputs。仅在客户主动启用异步推理时适用；72 小时是上限，处理完即删除。"
anchor = "baseten-security-practices-async-72h"

[[product.retention.point]]
text = "A different object inside this dimension: Baseten's access and authentication-related security logs (access and actions taken by Baseten personnel, plus customer authentication events such as device type, IP addresses and abnormality detection) are stored for up to 4 years and cannot be deleted or modified, even by an administrator. That is an upper bound for that log class, not the retention rule for Customer Model inputs and outputs, which are covered by the ZDR posture above."
text_zh = "本维度内的另一类对象：Baseten 的访问与认证类安全日志（Baseten 人员的访问与操作，以及客户认证相关事件，如 device type、IP addresses、abnormality detection）最多留存 4 年，且不可删除或修改。这是该类日志的上限，不等于 Customer Model 输入输出的保留口径——输入输出适用上面的 ZDR 姿态。"
anchor = "baseten-security-practices-audit-logs-4-years"

[product.processing_region]
codes = ["selected"]
anchor = "baseten-docs-regional-deployments-available-regions"

[[product.processing_region.point]]
text = "This is the only product whose region can be chosen: a regional deployment supports `us` / `eu`, and with no selection it is Global (any region with available compute)"
text_zh = "本档是唯一可自选区域的产品：regional deployment 支持 `us`/`eu`，不选则 Global（可在任何有算力的区域）"

[[product.processing_region.point]]
text = "An organization compliance policy can restrict placement further and cannot be overridden"
text_zh = "组织合规策略可进一步限制且不可被覆盖"

[[product.processing_region.point]]
text = "There are also regional environments configured on Baseten's side that confine the models and Chains of an entire environment to a specified region."
text_zh = "另有 Baseten 侧配置的 regional environments 把整个 environment 的模型与 Chain 限制在指定区域。"

