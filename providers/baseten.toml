anchor = "baseten-docs-self-hosted-payload-retention"

[[product.zdr.point]]
text = "On this tier \"no retention\" is guaranteed by the architecture (payloads never leave the customer's environment), not by a commitment alone"
text_zh = "本档的「不保留」由架构保证（payload 不出客户环境）而非仅靠承诺"

[[product.zdr.point]]
text = "The ZDR posture in the Security Practices, being \"across all inference products\", covers this tier too."
text_zh = "Security Practices 的 ZDR 姿态对 all inference products 同样覆盖本档。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "baseten-docs-self-hosted-payload-retention"

[[product.retention.point]]
text = "docs/hosting-options/self-hosted「Payload retention」：Baseten doesn't store synchronous inference inputs or outputs"

[[product.retention.point]]
text = "Async inputs queue inside the customer's own infrastructure until the request is executed (the queue ceiling is the 72-hour parameter in the async documentation). Note that some platform data still passes through Baseten on this tier: model code and container images travel through the control plane, metrics and billing data are sent back, and logs and metrics stay in the customer's cluster but are queried remotely by Baseten — the page gives no retention period for that platform data, so duration_kind is recorded as unspecified."
text_zh = "异步输入在客户自己的基础设施内排队直到请求执行（排队上限见 async 文档的 72 小时参数）。注意本档部分平台数据仍会经过 Baseten：model code 与 container image 经 control plane，metrics 与 billing 数据回传，logs 与 metrics 留在客户集群但 Baseten 远程查询——该页未给出这些平台数据的保留期限，故 duration_kind 记 unspecified。"

[product.processing_region]
codes = ["selected"]
anchor = "baseten-docs-self-hosted-never-leave"

[[product.processing_region.point]]
text = "Inference payloads never leave your environment"

[[product.processing_region.point]]
text = "The workload plane runs in the customer's VPC, deployed in a single provider region (AWS/GCP/OCI, with several workload planes possible across regions and clouds). Security Practices \"Deployment Options\" says the same: \"No Customer Content leaves the customer's environment.\" The processing location is therefore chosen by the customer and not designated by Baseten."
text_zh = "workload plane 在客户 VPC、按单一 provider region 部署（AWS/GCP/OCI，可跨区域跨云部署多个 workload plane）。Security Practices「Deployment Options」同旨：No Customer Content leaves the customer's environment。即处理地由客户选择，Baseten 不指定。"

[product.role]
kind = "processor"
anchor = "baseten-dpa-3-1-processor"

[[product.role.point]]
text = "Same as the top level: the DPA role for personal data remains Processor. On this tier Baseten touches inference payloads even less (the workload plane sits on the customer's side), but the control plane still processes some platform data, so the role determination is unchanged."
text_zh = "同顶层：DPA 对个人数据的角色仍为 Processor。本档中 Baseten 对推理 payload 实际接触更少（workload plane 在客户侧），但控制面仍处理部分平台数据，故角色判定不变。"

