[[product.retention.point]]
text = "Security Practices \"Dedicated Inference\": a Zero Data Retention posture for Customer Model inputs and outputs, with no persistent copy made"
text_zh = "Security Practices「Dedicated Inference」：对 Customer Model 输入输出持 ZDR、不做持久副本"

[[product.retention.point]]
text = "\"Dedicated Inference (non-input/output data)\": for thirty (30) days after the end of the subscription term the customer may retrieve remaining Customer Content (such as Customer Models), which is deleted once that period ends"
text_zh = "「Dedicated Inference (non-input/output data)」：订阅期结束后 30 天内可取回剩余 Customer Content（如 Customer Models），期满即删除"

[[product.retention.point]]
text = "\"Customer Model Weights\": weights are loaded dynamically into GPU memory and are not persisted to storage by default; where weight caching is enabled, cached weights can be permanently deleted on request"
text_zh = "「Customer Model Weights」：权重动态载入 GPU 内存、默认不持久化，开启 weight caching 后可要求永久删除"

[[product.retention.point]]
text = "The KV cache lives only in GPU memory and is not written to disk (docs/observability/security)."
text_zh = "KV cache 只在 GPU 内存、不落盘（docs/observability/security）。"

