text_zh = "本档是唯一可自选区域的产品：regional deployment 支持 `us`/`eu`，不选则 Global（可在任何有算力的区域）"

[[product.processing_region.point]]
text = "An organization compliance policy can restrict placement further and cannot be overridden"
text_zh = "组织合规策略可进一步限制且不可被覆盖"

[[product.processing_region.point]]
text = "There are also regional environments configured on Baseten's side that confine the models and Chains of an entire environment to a specified region."
text_zh = "另有 Baseten 侧配置的 regional environments 把整个 environment 的模型与 Chain 限制在指定区域。"

