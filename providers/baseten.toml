text_zh = "docs/deployment/regional-deployments 明说 regional selection 只适用于 model deployments，「Chains and training jobs can't select a region」——训练作业没有区域选择能力，也未披露默认区域，故记未披露（不得反向解读为承诺在某一区域）。"

