[[product.zdr.point]]
text = "On this tier \"no retention\" is guaranteed by the architecture (payloads never leave the customer's environment), not by a commitment alone"
text_zh = "本档的「不保留」由架构保证（payload 不出客户环境）而非仅靠承诺"

[[product.zdr.point]]
text = "The ZDR posture in the Security Practices, being \"across all inference products\", covers this tier too."
text_zh = "Security Practices 的 ZDR 姿态对 all inference products 同样覆盖本档。"

[[product.zdr.point]]
text = "Scope limit on the ZDR commitment (the Security Practices clause is worded generally and covers this tier as well): Baseten is not in breach of these Security Practices (including the ZDR commitments) where logging, retention, storage, access, use or disclosure of Customer Content arises from (a) configurations, settings or deployment choices made by a customer or its authorized users; (b) model runtime code, packages, dependencies or other software provided or selected by a customer, including any vulnerability or compromise latent in a Customer Model or its supply chain; (c) a customer's election to enable logging, retention, abuse monitoring or any Third-Party Product; or (d) actions taken at a customer's written direction. This is an exception defining the scope of the commitment, not a withdrawal of it; mark stays yes."
text_zh = "ZDR 承诺的适用边界（该条措辞是一般性的，同样覆盖本档；属例外而非撤销）：若 Customer Content 的 logging、retention、storage、access、use 或 disclosure 源于 (a) 客户或其授权用户所作的配置、设置或部署选择；(b) 客户提供或选用的 model runtime code、packages、dependencies 等软件（含 Customer Model 或其供应链中的潜在漏洞）；(c) 客户自行开启 logging、retention、abuse monitoring 或任何 Third-Party Product；或 (d) 按客户书面指示采取的行动，则不构成 Baseten 违反 Security Practices（含 ZDR 承诺）。mark 仍为 yes。"
anchor = "baseten-security-practices-customer-controlled-factors"

[product.retention]
object = "input_output"
basis = "none"
anchor = "baseten-docs-self-hosted-payload-retention"

[[product.retention.point]]
text = "docs/hosting-options/self-hosted「Payload retention」：Baseten doesn't store synchronous inference inputs or outputs"

[[product.retention.point]]
text = "Async inputs queue inside the customer's own infrastructure until the request is executed. The 72-hour queue ceiling quoted for asynchronous inference comes from the \"Asynchronous Inference\" entry of the Security Practices; on this tier the queueing itself happens inside the customer's own infrastructure rather than in Baseten's, so that entry is recorded here only as the source of the ceiling, not as a second registration of the same exception. Note that some platform data still passes through Baseten on this tier: model code and container images travel through the control plane, metrics and billing data are sent back, and logs and metrics stay in the customer's cluster but are queried remotely by Baseten — the page gives no retention period for that platform data, so its duration is recorded as unspecified."
text_zh = "异步输入在客户自己的基础设施内排队直到请求执行。异步推理的 72 小时排队上限出自 Security Practices「Asynchronous Inference」条；本档的排队发生在客户自己的基础设施内而非 Baseten 侧，故这里只把该条记为上限的出处，不重复登记为同一例外。注意本档部分平台数据仍会经过 Baseten：model code 与 container image 经 control plane，metrics 与 billing 数据回传，logs 与 metrics 留在客户集群但 Baseten 远程查询——该页未给出这些平台数据的保留期限，故其期限记 unspecified。"

[[product.retention.point]]
text = "A different object inside this dimension: Baseten's access and authentication-related security logs (access and actions taken by Baseten personnel, plus customer authentication events such as device type, IP addresses and abnormality detection) are stored for up to 4 years and cannot be deleted or modified, even by an administrator. That is an upper bound for that log class, not the retention rule for inference payloads on this tier, which are covered by the self-hosted payload retention point above."
text_zh = "本维度内的另一类对象：Baseten 的访问与认证类安全日志（Baseten 人员的访问与操作，以及客户认证相关事件，如 device type、IP addresses、abnormality detection）最多留存 4 年，且不可删除或修改。这是该类日志的上限，不等于本档推理 payload 的保留口径——payload 适用上面的自托管保留条款。"
anchor = "baseten-security-practices-audit-logs-4-years"

[product.processing_region]
codes = ["selected"]
anchor = "baseten-docs-self-hosted-never-leave"

[[product.processing_region.point]]
text = "Inference payloads never leave your environment"

[[product.processing_region.point]]
text = "The workload plane runs in the customer's VPC, deployed in a single provider region (AWS/GCP/OCI, with several workload planes possible across regions and clouds). Security Practices \"Deployment Options\" says the same: \"No Customer Content leaves the customer's environment.\" The processing location is therefore chosen by the customer and not designated by Baseten."
text_zh = "workload plane 在客户 VPC、按单一 provider region 部署（AWS/GCP/OCI，可跨区域跨云部署多个 workload plane）。Security Practices「Deployment Options」同旨：No Customer Content leaves the customer's environment。即处理地由客户选择，Baseten 不指定。"

[product.role]
kind = "processor"
anchor = "baseten-dpa-3-1-processor"

[[product.role.point]]
text = "Same as the top level: the DPA role for personal data remains Processor. On this tier Baseten touches inference payloads even less (the workload plane sits on the customer's side), but the control plane still processes some platform data, so the role determination is unchanged."
text_zh = "同顶层：DPA 对个人数据的角色仍为 Processor。本档中 Baseten 对推理 payload 实际接触更少（workload plane 在客户侧），但控制面仍处理部分平台数据，故角色判定不变。"

