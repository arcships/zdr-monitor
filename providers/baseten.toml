days = 30
object = "mixed"
basis = "fixed_period"
anchor = "baseten-security-practices-post-term-30-days"

[[product.retention.point]]
text = "Security Practices \"DATA RETENTION FOR OTHER PRODUCTS / Training\": \"For thirty (30) days after the end of a customer's subscription term, Baseten will provide the customer access to the Services to allow retrieval of Customer Content. After such thirty (30) day period, Baseten will promptly delete all remaining Customer Content in its possession.\" — the object is Customer Content (training data and checkpoints included)"
text_zh = "Security Practices「DATA RETENTION FOR OTHER PRODUCTS / Training」：For thirty (30) days after the end of a customer's subscription term, Baseten will provide the customer access to the Services to allow retrieval of Customer Content. After such thirty (30) day period, Baseten will promptly delete all remaining Customer Content in its possession. —— 对象是 Customer Content（含训练数据与 checkpoint）"

[[product.retention.point]]
text = "Residual backup copies are separately covered by a \"limited period\" (not quantified)."
text_zh = "备份残余另有「有限期间」（未量化）。"

