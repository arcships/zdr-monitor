[[product.training.point]]
text = "Same as the top level. The definition of Customer Model expressly includes associated weights, checkpoints, adapters and configurations, so weights are within the scope of §6.3 as well."
text_zh = "同顶层。Customer Model 定义明确包含 associated weights、checkpoints、adapters、configurations，故权重也在 §6.3 覆盖范围内。"

[[product.training.point]]
text = "Boundary of the no-training commitment: \"Usage Information\" is technical and operational telemetry about the use and performance of the Services (latency, throughput, error rates, utilization, feature usage data), and §1 defines Customer Content to exclude it — so it is not Customer Model inputs, outputs or weights. Baseten may use it to operate, maintain, secure and improve the Services; beyond the direct operation of the customer's workloads, analytics, benchmarking and product development are allowed only in aggregated or de-identified form that cannot reasonably be used to identify Customer or to reveal Customer Content."
text_zh = "「不用于训练」的边界：Usage Information 是服务使用与性能的技术/运营遥测（latency、throughput、error rates、utilization、feature usage data），§1 的 Customer Content 定义明确把它排除在外，故它不是 Customer Model 的输入、输出或权重。Baseten 可用它运营、维护、保障与改进服务；超出客户负载直接运营之外的分析、基准测试与产品开发，只能用无法合理识别客户或暴露 Customer Content 的聚合或去标识形式。"
anchor = "baseten-tos-6-4-usage-information-telemetry"

[[product.training.point]]
text = "Hard limit on that telemetry: in no event may Baseten collect or use Usage Information for the purpose of reproducing the customer's model weights or training datasets, or of developing products that replicate customer-specific deployments. Neither point changes mark=yes — they bound telemetry, not the customer's own models and data."
text_zh = "该类遥测的硬性限制：Baseten 绝不得为复制客户模型权重或训练集、或为开发复刻客户专属部署的产品而收集或使用 Usage Information。两条 point 都不改变 mark=yes——它们约束的是遥测，不是客户自己的模型与数据。"
anchor = "baseten-tos-6-4-usage-information-limit"

