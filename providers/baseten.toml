[[product.training.point]]
text = "On Baseten's side, Terms §6.3 / DPA §9 still bar the use of Customer Content to train Baseten's own models. docs/loops/train-on-your-data and docs/training/your-own-data are how-to guides (classified not_policy) and cannot support or rebut this dimension."
text_zh = "Baseten 侧仍受 Terms §6.3 / DPA §9 约束不得用 Customer Content 训练自己的模型。docs/loops/train-on-your-data 与 docs/training/your-own-data 是使用教程（判 not_policy），不能用来支撑或反驳本维度。"

[product.zdr]
mark = "no"
anchor = "baseten-security-practices-post-term-30-days"

[[product.zdr.point]]
text = "The scope of the ZDR posture in the Security Practices is worded as \"across all inference products\"; training data and checkpoints are storage-type data (retrievable until 30 days after the end of the subscription term) and fall outside zero retention of inference inputs and outputs. Request-level ZDR therefore does not apply to this tier — only the 30-day post-term retrieval window and the deletion commitment do."
text_zh = "ZDR 姿态的适用范围是 all inference products；训练数据与 checkpoint 属存储型数据（订阅期结束后 30 天内可取回），不在推理输入输出的请求级零保留范围内。即本档不适用请求级 ZDR，只有终止后 30 天取回期与删除承诺。"
anchor = "baseten-security-practices-zdr-products"

