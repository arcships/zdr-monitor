[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "baseten-tos-6-3-no-training"

[[product.training.point]]
text = "Same as the top level: Terms §6.3 covers Customer Content, \"including Customer Models, Model Outputs, or inference logs\""
text_zh = "同顶层：Terms §6.3 覆盖 Customer Content（含 Customer Models、Model Outputs、inference logs）"

[[product.training.point]]
text = "The \"Model APIs\" entry in the Security Practices states in the same paragraph that a ZDR posture applies to all Customer Content. For the third-party model tier the vendor's supplemental Model Labs terms (SML) are cited as saying that customer content, prompts and request-level logs included, is not forwarded to the Model Lab — that document is not declared as a [[source]] in this file and has no snapshot, so it is recorded here as a sourcing gap and not as an anchor."
text_zh = "Security Practices「Model APIs」条目同段即声明对 all Customer Content 持 ZDR。第三方模型档另有厂商的 Model Labs 补充条款（SML）：不向 Model Lab 转发客户内容（含 prompt 与请求级日志）；该文档尚未在本文件登记为 [[source]]、也没有快照，故记为溯源缺口，不作为锚点。"

[[product.training.point]]
text = "Boundary of the no-training commitment: \"Usage Information\" is technical and operational telemetry about the use and performance of the Services (latency, throughput, error rates, utilization, feature usage data), and §1 defines Customer Content to exclude it — so it is not the customer's inference inputs or outputs. Baseten may use it to operate, maintain, secure and improve the Services; beyond the direct operation of the customer's workloads, analytics, benchmarking and product development are allowed only in aggregated or de-identified form that cannot reasonably be used to identify Customer or to reveal Customer Content."
text_zh = "「不用于训练」的边界：Usage Information 是服务使用与性能的技术/运营遥测（latency、throughput、error rates、utilization、feature usage data），§1 的 Customer Content 定义明确把它排除在外，故它不是客户的推理输入输出。Baseten 可用它运营、维护、保障与改进服务；超出客户负载直接运营之外的分析、基准测试与产品开发，只能用无法合理识别客户或暴露 Customer Content 的聚合或去标识形式。"
anchor = "baseten-tos-6-4-usage-information-telemetry"

[[product.training.point]]
text = "Hard limit on that telemetry: in no event may Baseten collect or use Usage Information for the purpose of reproducing the customer's model weights or training datasets, or of developing products that replicate customer-specific deployments. Neither point changes mark=yes — they bound telemetry, not inference inputs and outputs."
text_zh = "该类遥测的硬性限制：Baseten 绝不得为复制客户模型权重或训练集、或为开发复刻客户专属部署的产品而收集或使用 Usage Information。两条 point 都不改变 mark=yes——它们约束的是遥测，不是推理输入输出。"
anchor = "baseten-tos-6-4-usage-information-limit"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "baseten-security-practices-model-apis-zdr"

[[product.zdr.point]]
text = "This product is named in the Security Practices as operating under a ZDR posture, and ZDR is the default configuration (no application required)."
text_zh = "该产品被 Security Practices 点名为 ZDR 姿态，且 ZDR 是默认配置（无需申请）。"

[[product.zdr.point]]
text = "Scope limit on the ZDR commitment: Baseten is not in breach of these Security Practices (including the ZDR commitments) where logging, retention, storage, access, use or disclosure of Customer Content arises from (a) configurations, settings or deployment choices made by a customer or its authorized users; (b) model runtime code, packages, dependencies or other software provided or selected by a customer, including any vulnerability or compromise latent in a Customer Model or its supply chain; (c) a customer's election to enable logging, retention, abuse monitoring or any Third-Party Product; or (d) actions taken at a customer's written direction. This is an exception defining the scope of the commitment, not a withdrawal of it; mark stays yes."
text_zh = "ZDR 承诺的适用边界（例外，非撤销）：若 Customer Content 的 logging、retention、storage、access、use 或 disclosure 源于 (a) 客户或其授权用户所作的配置、设置或部署选择；(b) 客户提供或选用的 model runtime code、packages、dependencies 等软件（含 Customer Model 或其供应链中的潜在漏洞）；(c) 客户自行开启 logging、retention、abuse monitoring 或任何 Third-Party Product；或 (d) 按客户书面指示采取的行动，则不构成 Baseten 违反 Security Practices（含 ZDR 承诺）。mark 仍为 yes。"
anchor = "baseten-security-practices-customer-controlled-factors"

[[product.zdr.point]]
text = "ZDR configuration is changeable at the customer's request: customers may request changes to the applicable ZDR configuration for their workloads by written notice, and Baseten will promptly implement requested changes whenever technically supported for the applicable Service; where it cannot, it must promptly notify the customer with an explanation. This is what mode=default means here — a default the customer can have changed — and it does not mean Baseten may rewrite the default on its own."
text_zh = "ZDR 配置可依客户书面请求变更：客户可书面请求变更其负载适用的 ZDR 配置，Baseten 在适用服务技术上支持时即迅速实现，不可实现时须迅速通知并说明原因。这解释了本档 mode=default 的成色——默认值可由客户请求改写——不等于厂商可自行变更默认值。"
anchor = "baseten-security-practices-zdr-config-changes"

[product.retention]
object = "input_output"
basis = "none"
anchor = "baseten-security-practices-model-apis-zdr"

[[product.retention.point]]
text = "Security Practices「Model APIs」：Baseten will not store, retain, or otherwise make a persistent copy of model inputs or outputs during a customer's use of the Model APIs"

[[product.retention.point]]
text = "The same section defines ZDR as (a) not logging, recording or saving Customer Content, and (b) not saving Customer Content to persistent storage (hard disk, SSD, cloud storage, database) after real-time processing."
text_zh = "同节把 ZDR 定义为 (a) 不 log/record/store 客户内容、(b) 不在实时处理之后把客户内容保存到持久存储（硬盘、SSD、云存储、数据库）。"

[[product.retention.point]]
text = "Async exception, from the \"Asynchronous Inference\" entry of the Security Practices (the page lists it as a product entry alongside Model APIs and Dedicated Inference): where the customer elects to enable asynchronous inference, model inputs get temporarily stored and queued for the duration of the request, can stay in queue for up to 72 hours before being processed and then deleted, and Model Outputs are not stored. It applies only where the customer turns async on, and the 72 hours is an upper bound."
text_zh = "异步例外，出自 Security Practices「Asynchronous Inference」条（该页把它与 Model APIs、Dedicated Inference 并列为产品条）：客户启用异步推理时，模型输入在请求期间被暂存排队，最多 72 小时后处理并删除，且不存 Model Outputs。仅在客户开启 async 时适用，72 小时是上限。"
anchor = "baseten-security-practices-async-72h"

[[product.retention.point]]
text = "Multi-hop caveat on this tier: Baseten Model APIs is where Third-Party Products are made available through managed API endpoints, and if a customer connects or enables Third-Party Products for use with the Services, the providers of those products may have access to Customer Content in connection with the interoperation, and Baseten will not be responsible for any use, disclosure, modification or deletion of Customer Content by them (Terms §4.4). The retention position above therefore covers only Baseten's own hop."
text_zh = "本档的多跳提示：Baseten Model APIs 正是通过托管 API 端点提供 Third-Party Products 的入口；客户接入或启用第三方产品时，其提供方可能因互操作而接触 Customer Content，Baseten 不负责其对 Customer Content 的使用、披露、修改或删除（Terms §4.4）。故上面的保留结论只覆盖 Baseten 自己这一跳。"
anchor = "baseten-tos-4-4-third-party-products-content-access"

[[product.retention.point]]
text = "A different object inside this dimension: Baseten's access and authentication-related security logs (access and actions taken by Baseten personnel, plus customer authentication events such as device type, IP addresses and abnormality detection) are stored for up to 4 years and cannot be deleted or modified, even by an administrator. That is an upper bound for that log class, not the retention rule for model inputs and outputs, which are covered by the ZDR posture above."
text_zh = "本维度内的另一类对象：Baseten 的访问与认证类安全日志（Baseten 人员的访问与操作，以及客户认证相关事件，如 device type、IP addresses、abnormality detection）最多留存 4 年，且不可删除或修改。这是该类日志的上限，不等于模型输入输出的保留口径——输入输出适用上面的 ZDR 姿态。"
anchor = "baseten-security-practices-audit-logs-4-years"

[product.processing_region]
basis = "undisclosed"
anchor = "baseten-docs-regional-deployments-global-default"

[[product.processing_region.point]]
text = "The public documentation does not say which region Model APIs (platform-hosted models) run in: the available-regions table on the regional deployments page covers only customer-deployed models (GPU instances) and states expressly that region selection applies to model deployments"
text_zh = "公开文档未说明 Model APIs（平台托管模型）运行在哪个区域：regional deployments 页的可用区域表只针对客户自部署模型（GPU 实例），且明说区域选择适用于 model deployments"

[[product.processing_region.point]]
text = "There is no corresponding region-selection documentation for Model APIs. Inferring from the default Global rule would overreach, so this is recorded as undisclosed rather than as a commitment."
text_zh = "Model APIs 没有对应的区域选择说明。按默认 Global 规则推断会越界，故记未披露而非承诺。"

[product.role]
kind = "processor"
anchor = "baseten-dpa-3-1-processor"

[[product.role.point]]
text = "Same as the top level. On the third-party model tier, Model Lab is not a sub-processor of the customer and Baseten does not forward customer content (SML §6) — SML has no snapshot in this file yet, so this is a sourcing gap rather than an anchor."
text_zh = "同顶层。第三方模型档下 Model Lab 不是客户 sub-processor，Baseten 不转发客户内容（SML §6）——SML 在本文件尚无快照，故这是溯源缺口而非锚点。"

