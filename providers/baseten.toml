text = "The same contractual provisions as at top level (Terms §6.3 / DPA §9 / Security Practices \"Infrastructure-Only Processing\") apply to this tier."
text_zh = "同顶层合同（Terms §6.3 / DPA §9 / Security Practices「Infrastructure-Only Processing」）对本档同样适用。"

[product.zdr]
