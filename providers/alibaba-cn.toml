[product.training]
mark = "yes"
anchor = "training-api-no-train-without-authorization"
mode = "by_tier"

[[product.training.point]]
text_zh = "§6.2.5 后半句「我们不会在未获您授权的情况下使用您的对话数据训练我们的模型」，配合 §6.2.4「除执行您的服务要求外，我们不会进行任何未获授权的使用及披露」。适用范围由产品简介 FAQ 限定为「按量付费 API 和 Token Plan 团队版」"

[[product.training.point]]
text_zh = "Token Plan 个人版/Coding Plan 反过来授权存储并使用输入输出做服务改进与模型优化（§5.2.2），属另两个 provider 档位，本档不适用。隐私说明另有平台级「绝不会将您的数据用于模型训练」。"

[product.zdr]
mark = "no"
anchor = "zdr-cmas-no-plaintext-recorded"

[[product.zdr.point]]
text_zh = "默认按量付费 API 档没有零保留选项：隐私说明与常见问题都写「阿里云百炼将存储模型与应用调用时产生的数据」，协议只承诺「最短必要时间」，全文无任何 ZDR/不落盘/不留存开关"

[[product.zdr.point]]
text_zh = "搜索官网与帮助中心也未找到按量 API 的零保留承诺。唯一条款级的零明文路径是独立产品「阿里云百炼机密推理服务（CMaaS）」：其《特别规则》第 2 条「为您提供本服务的过程中，我们不会记录明文提示词和模型输出内容以及对应的加密密钥」，第 3 条密钥与内容由客户掌握"

[[product.zdr.point]]
text_zh = "但该档为定向邀请开通、需单独签署特别规则、当前仅华北 2（北京）地域，不覆盖默认按量 API。故 zdr 记 medium：有零保留路径，但绑定在一个邀请制子产品上，不能等同于本档默认能力。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "retention-api-min-necessary"

[[product.retention.point]]
text_zh = "对象与语境分层：①输入输出正文——§6.2.5「仅在提供服务所必需的最短时间内保留您的对话数据」，无量化天数，也无「N 天后删除」"

[[product.retention.point]]
text_zh = "同时平台明确会存储调用数据（隐私说明/FAQ「将存储模型与应用调用时产生的数据」，法规要求）。②删除路径——§6.2.7/§3.2.11 服务期届满、提前终止或欠费后「一定的缓冲期」内继续存储，缓冲期届满删除所有客户业务数据含所有缓存或备份副本"

[[product.retention.point]]
text_zh = "缓冲期时长「以专有条款、产品文档、服务说明所载明的时限为准」，本档产品文档未载明具体天数"

[[product.retention.point]]
text_zh = "§6.2.4 承认备份可能无法立即删除。③访问/审计日志——平台侧审计日志默认存储且不含 Prompt/Response，控制台查询窗口默认 7 天、最长 30 天（是查询窗口不是删除期限）"

[[product.retention.point]]
text_zh = "含完整 Prompt/Response 的推理日志默认关闭，需手动开启并投递到客户自有 SLS。④内容安全过滤记录——触发 AI 安全护栏的文本内容留在护栏控制台检测结果中，期限未披露。⑤控制台体验中心历史对话最多展示 100 条、不设时间限制，是 UI 展示对象，与 API 数据保留不是同一对象。⑥本档文档中未出现《网络安全法》式的「网络日志不少于六个月」下限条款。"

[product.processing_region]
codes = ["selected"]
anchor = "processing-region-api-selected-region"

[[product.processing_region.point]]
text_zh = "§6.2.8：根据协商一致，阿里云在「您选定的阿里云百炼服务及模型服务所在国家或地区」处理客户业务数据"

[[product.processing_region.point]]
text_zh = "选择境外处理可能构成数据出境，客户作为完全控制方自负出境合规义务。地域文档给出落地机制：地域决定接入点和数据存储位置，请求数据存于该地域、推理结果回到接入地域存储、用户静态数据始终存于所选地域"

[[product.processing_region.point]]
text_zh = "但「服务部署范围」决定推理执行位置，可选特定地理边界（欧盟/日本/中国香港/美国）或全球池——即存储地=所选地域，推理计算可能落在该范围之外，有合规需求必须选特定边界。境内可选华北 2（北京），境外另有新加坡、法兰克福、东京、中国香港、美国（弗吉尼亚）。平台级同向：隐私权政策 §4.1.3「在您选定的数据中心存储用户业务数据」。注意 §6.2.9：走云市场三方模型 API 时部署模式（服务接入地、推理地）随三方协议。"

