[[product.processing_region.point]]
text_zh = "国际站 TokenHub ToS 也没有处理地条款。中国站文档 129852 §2.13 虽提到「国际站服务的数据处理地点为新加坡或…」，但该条款属中国站文档体系，本轮不作为国际站档位的权威依据。"

[[product.processing_region.point]]
anchor = "region-intl-general-servers-outside-country"
text = "The general Tencent Cloud International privacy policy (301/17345) says in its summary: \"Our servers may be located outside of the country you are located, for example in Mainland China.\" The same page adds that transfers outside the EEA/UK for processing rely on the standard contractual clauses and may go to Mainland China. But that statement covers every Service on the site; it is neither a region list for the Personal Token Plan nor a commitment about where this tier's data is stored or processed, so this tier stays undisclosed rather than being given region codes."
text_zh = "国际站通用《隐私政策》(301/17345) 概要「Where do we process the collected personal information?」写「Our servers may be located outside of the country you are located, for example in Mainland China.」(anchor region-intl-general-servers-outside-country)；同页另有 EEA/UK 数据出境依赖标准合同条款、可传至中国大陆的说明(anchor region-intl-general-eu-uk-scc)。但这句覆盖全站所有服务，既不是 Personal Token Plan 的地域清单，也不是本档的存储/处理地承诺，故本档仍记 undisclosed，不据此填 codes —— 原 searched 里「未规定处理地」的记法已按此修正。"

