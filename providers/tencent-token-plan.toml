[[product.zdr.point]]
text_zh = "中国站侧不可得 ZDR：个人版隐私政策、企业版隐私政策、《TokenHub 服务条款》、《第三方部署模型服务特别说明》、套餐概览/企业版概述全文都没有 ZDR/零保留字样或选项，中国站「政策与规范」目录也没有国际站那样的 DPSA 模块(见 searched)。唯一含 ZDR 条款的官方文件是国际站 DPSA 模块 1300/78953，其第 1 节限定适用「腾讯大模型服务平台 TokenHub 和 Token Plan 企业版」且属国际站文档体系。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "retention-2-14-necessary-period"

[[product.retention.point]]
text_zh = "合同层 §2.14：除法律法规、监管要求、第三方协议、产品规则、另行约定或为提供本服务所必需的情形外，腾讯云将仅在为提供本服务之目的所必需的期间内保留您的数据"

[[product.retention.point]]
text_zh = "期限结束后停止不必要的数据使用或按指示返还/删除，法律不允许删除时降级为仅存储与法定义务处理。同档隐私政策 §2.1 同为「为实现目的所必需的最短时间」，两者都没有公布天数。另有法定留存义务(对象不同)：§2.9 生成合成内容标识场景「腾讯云将依法留存提供对象信息等相关日志不少于六个月」是下限(anchor retention-2-9-log-6-months)，§2.8 违规内容可保存必要记录，均不等于输入输出正文的保留期限。第三方部署模型场景的留存适用第三方协议(§2.14 末句)。"

[product.processing_region]
codes = ["CN"]
anchor = "region-2-13-cn-domestic-intl-sg"

[[product.processing_region.point]]
text_zh = "§2.13：腾讯云自身进行的数据处理地点以服务版本与所选服务地域为准 —— 中国站服务一般为中华人民共和国境内，国际站服务为新加坡或届时展示的其他地点。佐证：个人版隐私政策 §2.2「将中华人民共和国境内收集的用户个人信息存储于中华人民共和国境内，目前我们暂时不存在向境外提供您的个人信息的场景」"

[[product.processing_region.point]]
text_zh = "个人版端点只有中国站地址 api.lkeap.cloud.tencent.com/plan/v3(130119)。范围限制：第三方部署模型场景的实际处理地点、保存期限与跨境安排由第三方协议或其实际服务部署决定(§2.13 末句)。"

[product.role]
kind = "processor"
anchor = "role-2-11-on-your-instruction"

[[product.role.point]]
text_zh = "§2.11：腾讯云基于您的委托、指令和需求并以向您提供本服务为目的处理您的输入内容，数据处理活动不能超出您的指示范围，您有权监督"

[[product.role.point]]
text_zh = "指示违法时可拒绝/暂停执行 —— 即腾讯云在本档为受托处理方(processor)。个人版隐私政策 §4.1 亦为「委托处理」框架(企业版同名条款见 role-enterprise-4-1-entrusted-processing)。置信度 medium 的原因：条款用「委托/指示」表述，没有出现控制方/处理方字面标签，且 §2.18 显示腾讯云也会为内容安全审核、计费、运维、服务优化等自身合规目的处理数据(有限例外)。"

[[product.role.point]]
anchor = "role-personal-4-2-no-active-sharing"
text = "The tier-specific privacy policy states in §4.2 (Sharing): \"目前，我们不会主动与任何第三方共享您的个人信息。\" It sits next to §4.1 (Entrusted Processing), which already acknowledges cooperation with third parties under strict restrictions — under PIPL these are two different acts, not a contradiction between the vendor's own statements. But §4.2 must not be read as \"no third party is involved in this tier\": the models supplied directly by third parties (DeepSeek-V4 series) receive the input, context, files, parameters and output content and process them under their own terms (TokenHub ToS §2.12(2); Third-Party Deployed Model Notice §3.5)."
text_zh = "档位专属隐私政策 §4.2「目前，我们不会主动与任何第三方共享您的个人信息」(anchor role-personal-4-2-no-active-sharing)。它与 §4.1 委托处理框架并列(anchor role-personal-4-1-entrusted-processing)：PIPL 语境下「委托处理」与「共享」是两类行为，§4.1 已承认与第三方合作并对第三方作严格限制，故这不是厂商自相矛盾；但 §4.2 也不能读成「本档没有第三方参与」—— 套餐内 DeepSeek-V4 系列等第三方部署模型会把输入内容、上下文、文件、参数、输出内容提交给相应第三方并按第三方协议处理(合同层 §2.12(2) anchor thirdparty-2-12-2-transfer；《第三方部署模型服务特别说明》§3.5 anchor training-thirdparty-model-terms-prevail)。"

