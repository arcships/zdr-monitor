text_zh = "合同层 §2.13 同个人版(中国站一般境内)。企业版档位特有：企业版专业套餐按地域开通，可选「广州(中国大陆)」或「新加坡(全球)」两套接入地址(tokenhub.tencentmaas.com / tokenhub-intl.tencentmaas.com)，且「不支持跨地域、跨站点调用服务」(anchor region-enterprise-guangzhou-singapore，developer_data 级)。企业版隐私政策 §2.2 仍写「将中华人民共和国境内收集的用户个人信息存储于中华人民共和国境内，目前我们暂时不存在向境外提供您的个人信息的场景」，与可选新加坡资源地域并存，故置信度 medium 而非 high。"

[product.role]
