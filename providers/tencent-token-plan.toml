text_zh = "§2.11 委托/指示框架(processor)，同个人版。企业版隐私政策 §4.1「委托处理」：与第三方合作过程中按最小必要原则处理相关数据，对数据处理涉及的第三方严格限制、要求其遵守数据隐私保护措施 —— 方向一致。企业版套餐本身面向企业客户、支持多 Key 配额分配，但条款未出现控制方/处理方字面标签，故 medium。"

