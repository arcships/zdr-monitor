[product.training]
mark = "no"
anchor = "training-personal-1-1-2-optimize-model"
mode = "opt_out"

[[product.training.point]]
text_zh = "档位专属《Token Plan 个人版隐私政策》§1.1.2：为持续提升用户体验，采取加密和脱敏处理技术，在避免识别到特定个人的前提下「使用输入、输出内容来优化模型」，不希望参与可随时提交工单或按政策联系方式关闭，关闭后不再用输入输出优化模型 —— 即默认开启的优化用途。合同层《TokenHub 服务条款》§2.17 承诺腾讯云不会把输入内容用于开发、训练、微调或改进自身算法/模型/服务(anchor training-2-17-tencent-no-train)，但同一份条款 §2.18(4) 又允许在合理必要范围内为「系统运维和服务优化」处理相关数据或其衍生信息(anchor training-2-18-service-optimization)。两份现行官方文件口径冲突且合同内部也有张力，故以更具体、直接约束本订阅的档位隐私政策作 training 来源，置信度 medium 反映冲突未消解。范围限制：套餐内 DeepSeek-V4 系列为第三方原厂直供，其是否用于训练按第三方协议(《第三方部署模型服务特别说明》301/136530 §3.5)"

[[product.training.point]]
text_zh = "智能路由模式下腾讯云不把数据发送至第三方部署模型。"

