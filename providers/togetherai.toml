[[product.training.point]]
text = "Together does not train on your data without your explicit consent, whether or not ZDR is enabled."
text_zh = "训练是独立的组织级 opt-in 且默认关闭；这句是无条件表述，未把上传的微调数据排除在「your data」之外。"
anchor = "togetherai-zdr-doc-training-optin"

[[product.training.point]]
text = "**Allow organization’s data for training**: off by default. Opt in to using your organization’s data for training models released by Together AI and partners."
text_zh = "训练 opt-in 开关的对象是「your organization’s data」用于「models released by Together AI and partners」，语义上覆盖客户上传的数据。即：默认不用于训练，opt-in 后可用于训练 Together 及合作方发布的模型。公开文档没有说 Together 会用客户上传的微调数据去训练自家的基础模型；此处 confidence 记 medium，因为「上传的微调数据在 opt-in 后的具体用途边界」没有专门条款。"
anchor = "togetherai-privsec-org-toggle-training"

[[product.training.point]]
text = "Unless your organization enables ZDR, Together stores the prompts you send and the responses models return, and may use them for product improvements."
text_zh = "并列保留的反向事实：未开 ZDR 时 prompt/output 默认被存储且可用于产品改进，退出方式是组织级存储开关。"
anchor = "togetherai-zdr-doc-default-storage"

[[product.training.point]]
text = "The Company may monitor your use of the Services to assess compliance with this Agreement and the quality of operations of the Services and to make improvements to the Services."
text_zh = "contract 层（全局优先级最高）ToS §1.4 允许为改进服务监控使用情况，与「不训练模型」并列保留。"
anchor = "togetherai-tos-1-4-monitor-use"

[[product.training.point]]
text = "To provide, maintain, and improve our Services, including to monitor the usage of our Services."
text_zh = "consumer_privacy 层《Privacy Policy》§2.2 用途清单首项同样是「改进服务」，层级低于 contract，属并列事实而非主证据。"
anchor = "togetherai-privacy-2-2-improve-services"

[product.zdr]
mark = "no"
anchor = "togetherai-zdr-doc-uploaded-files"

[[product.zdr.point]]
text_zh = "ZDR 明确只覆盖请求内容，显式上传的微调/batch 文件被单独列为「Together still retains」的对象，故本档拿不到零保留：上传即持久化，直到客户自己删除。"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "togetherai-zdr-doc-uploaded-files"

[[product.retention.point]]
text_zh = "对象＝客户显式上传的训练数据文件（以及 batch API 输入文件）。ZDR 页 What Together retains with ZDR enabled 节：「Files you upload for fine-tuning or the batch API are stored so your jobs can run, and remain stored until you delete them through the API, CLI, or web console.」即即使启用 ZDR 也不删这些文件，保留期无上限、由客户主动删除（《Privacy Policy》§2.7 表 Fine-tuning 两行的删除入口为 CLI 或 Playground 的 Jobs tab）。产出的微调模型（Models created）同理。没有任何自动过期期限。"

