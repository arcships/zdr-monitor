  "https://www.together.ai/privacy",
]

[[product.zdr.point]]
text_zh = "ZDR 页把「dedicated endpoints + VPC」列为满足 data-residency / 合规要求的另一条路径（与 ZDR 开关并列，而非同一机制），未说明二者能否叠加、也未说明 dedicated 部署是否默认不保留请求内容。故 dedicated 档的 ZDR 状态在公开文档里无法判定。"

[product.retention]
object = "input_output"
basis = "undisclosed"
searched = [
  "https://docs.together.ai/docs/zero-data-retention",
  "https://docs.together.ai/docs/dedicated-endpoints/overview",
  "https://www.together.ai/privacy",
]

[[product.retention.point]]
text_zh = "公开文档未就 dedicated endpoints 单独说明输入输出的保留期或是否落盘。ZDR 页的覆盖范围句写的是「Together’s inference services」，措辞可能涵盖 dedicated，但无任何 dedicated 专属条款可引。此处只列已核事实，不推测。"

[product.processing_region]
codes = ["EU"]
anchor = "togetherai-privsec-serverless-no-region"

[[product.processing_region.point]]
text_zh = "本档是 processing_region 唯一有正向披露的档位：EU regions 通过 private networking / VPC-based deployments 与 dedicated endpoints 提供。但具体可选区域清单、以及 EU 部署下子处理方是否也在 EU，文档未列。"

[product.role]
mark = "unknown"
kind = "unknown"
searched = [
  "https://www.together.ai/terms-of-service",
