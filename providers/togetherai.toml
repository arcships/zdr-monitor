  "https://trust.together.ai",
]

[[product.role.point]]
text_zh = "dedicated 档通常伴随企业合同/order form（《ToS》多处提到 order form 与 addendum），角色大概率在 DPA 里约定，但该 DPA 不可公开取得，故仍记 not_found。"

[[product]]
id = "fine_tuning"
badge = "微调"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "togetherai-zdr-doc-uploaded-files"

[[product.training.point]]
text_zh = "公开文档没有说 Together 会用客户上传的微调数据去训练自家的基础模型"

[[product.training.point]]
text_zh = "训练 opt-in 开关的对象是「your organization’s data」用于「models released by Together AI and partners」，语义上覆盖客户上传的数据。即：默认不用于训练，opt-in 后可用于训练 Together 及合作方发布的模型。此处 confidence 记 medium，因为「上传的微调数据在 opt-in 后的具体用途边界」没有专门条款。"

[product.zdr]
mark = "no"
anchor = "togetherai-zdr-doc-uploaded-files"

[[product.zdr.point]]
text_zh = "ZDR 明确只覆盖请求内容，显式上传的微调/batch 文件被单独列为「Together still retains」的对象，故本档拿不到零保留：上传即持久化，直到客户自己删除。"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "togetherai-zdr-doc-uploaded-files"

[[product.retention.point]]
text_zh = "对象＝客户显式上传的训练数据文件（以及 batch API 输入文件）。ZDR 页 What Together retains with ZDR enabled 节：「Files you upload for fine-tuning or the batch API are stored so your jobs can run, and remain stored until you delete them through the API, CLI, or web console.」即即使启用 ZDR 也不删这些文件，保留期无上限、由客户主动删除（《Privacy Policy》§2.7 表 Fine-tuning 两行的删除入口为 CLI 或 Playground 的 Jobs tab）。产出的微调模型（Models created）同理。没有任何自动过期期限。"

