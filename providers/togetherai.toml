name = "Together AI"
line = "togetherai"
site = "global"
entity = "Together Computer, Inc."
endpoint = ""
doc = "https://docs.together.ai/docs/zero-data-retention"

[[source]]
url = "https://docs.together.ai/docs/privacy-and-security"
channel = "developer_data"
tier = "core"
note = "Together 文档站「Privacy and security」页。覆盖 API 档的数据处理全景：默认存储、训练 opt-in 三个组织级开关的默认值、账号级 vs 组织级设置的适用范围、passthrough 第三方上游、企业数据驻留与私有网络、以及「第三方作者模型托管在 Together 自有基础设施、作者无访问权」。本页是 retention 与 processing_region 的主要依据，也是多跳链路的关键披露。"

[[source]]
url = "https://docs.together.ai/docs/zero-data-retention"
channel = "developer_data"
tier = "core"
note = "Together 文档站「Zero data retention」页（页面分类 ADMINISTRATION，无版本号）。覆盖 serverless 推理 API 档：组织级 ZDR 开关、默认存储行为、ZDR 的覆盖范围与不覆盖对象（上传的微调/batch 文件、请求元数据）、passthrough 模型的上游跳、以及 EU/VPC 部署。本页是 zdr 维度的主要依据，也是 training/retention 的开发文档层依据。注意本页对 ZDR 是否覆盖 dedicated endpoints 未作任何说明。"

[[source]]
url = "https://www.together.ai/privacy"
channel = "consumer_privacy"
tier = "core"
note = "Together Computer, Inc.《Privacy Policy》（页面标注 Updated December 17, 2025），§1 适用范围明确含「programmatic APIs and web interfaces that host, use, fine-tune, and train large AI models」。覆盖全部档位，是 Together 自己的文档页所称「the authoritative legal statement of Together's data practices」。§2.4 保留期、§2.5 处理地、§2.6 ZDR、§2.7 逐产品收集/删除表。全文未出现 controller / processor 字样。"

[[source]]
url = "https://www.together.ai/terms-of-service"
channel = "contract"
tier = "core"
note = "Together Computer, Inc.《Terms of Service》（页面标注 Updated May 19, 2026），合同层，覆盖全部 API 与 Professional Support：§3.2 是 ZDR 的合同层定义（比文档页多一句「beyond the time required to process the specific request or transaction」），§7.2 对客户内容只给「solely as necessary to provide the Services」的有限许可（全文无训练授权条款），§1.4 保留监控权，§2.4 第三方模型条款。全文未出现 controller / processor 或受托处理方字样。"

[[product]]
id = "api_serverless"
badge = "Serverless"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "togetherai-zdr-doc-training-optin"

[[product.training.point]]
text_zh = "默认不训练，训练是独立的组织级 opt-in 且默认关闭（ZDR 页 Training 条 + privacy-and-security 页开关默认值）。注意 opt-in 的对象是「models released by Together AI and partners」"
anchor = "togetherai-zdr-doc-training-optin"

[[product.training.point]]
text = "Unless your organization enables ZDR, Together stores the prompts you send and the responses models return, and may use them for product improvements."
text_zh = "并列保留的反向事实：默认档（未开 ZDR）会存储 prompt/output 且可能用于产品改进，退出方式是组织级 Store prompts and model responses 开关。按本仓口径「改进服务」算训练，但在 Together 这里「模型训练」与「产品改进」是明写的两个独立设置——本维度 mark=yes 的依据只是 Training 条那句把模型训练明确挡在同意之外的表述。"
anchor = "togetherai-zdr-doc-default-storage"

[[product.training.point]]
text = "**Store prompts and model responses**: on by default. Stores prompts and outputs for product improvements. Turn it off to enable zero data retention, which also turns off passthrough models because they require prompt storage."
text_zh = "组织级存储开关的默认值是 on：默认即存储 prompt/output 并用于产品改进，关掉它才等于开启 ZDR（同时连带关闭 passthrough 模型）。"
anchor = "togetherai-privsec-store-toggle-default-on"

[[product.training.point]]
text = "The Company may monitor your use of the Services to assess compliance with this Agreement and the quality of operations of the Services and to make improvements to the Services."
text_zh = "contract 层（全局优先级最高）ToS §1.4 允许为改进服务监控使用情况，与「不训练模型」并列保留。"
anchor = "togetherai-tos-1-4-monitor-use"

[[product.training.point]]
text = "To provide, maintain, and improve our Services, including to monitor the usage of our Services."
text_zh = "consumer_privacy 层《Privacy Policy》§2.2 用途清单首项同样是「改进服务」（§2.1 把 Content you submit, including texts, images, or prompts 列为 Personal Data）。层级低于 contract，属并列事实而非主证据。"
anchor = "togetherai-privacy-2-2-improve-services"

[[product.training.point]]
text_zh = "passthrough 模型走上游 provider 政策，见 zdr 与 retention 的 passthrough 锚点。"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "togetherai-zdr-doc-org-level-zdr"

[[product.zdr.point]]
text_zh = "同顶层 zdr。自助开关、默认关闭、覆盖请求内容不覆盖元数据与上传文件"

[[product.zdr.point]]
text = "**Store prompts and model responses**: on by default. Stores prompts and outputs for product improvements. Turn it off to enable zero data retention, which also turns off passthrough models because they require prompt storage."
text_zh = "开关的默认值是 on：默认即存储 prompt/output 并用于产品改进，关掉它才等于开启 ZDR——zdr=opt_in 的「默认非零保留」这一侧。"
anchor = "togetherai-privsec-store-toggle-default-on"

[[product.zdr.point]]
text = "The **account** setting applies only to traffic you send under your personal account when it isn’t attached to an organization. The **organization** setting governs all traffic sent under that organization’s projects and API keys, regardless of which member makes the request."
text_zh = "适用范围：组织级设置管辖该组织项目与 API key 下的全部流量；账号级设置只管未挂组织的个人账号流量。"
anchor = "togetherai-privsec-account-vs-org-scope"

[[product.zdr.point]]
text_zh = "前置条件：Limited 档组织必须先添加支付方式才能修改这些隐私设置。"
anchor = "togetherai-privsec-limited-tier"

[[product.zdr.point]]
text_zh = "开启后 passthrough 模型自动关闭"

[[product.zdr.point]]
text_zh = "不追溯已处理数据。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "togetherai-privsec-default-storage"

[[product.retention.point]]
text_zh = "同顶层 retention：默认存储 prompt/output 且无期限、用户可随时删除"

[[product.retention.point]]
text_zh = "开 ZDR 后不落盘（仅经易失内存与临时缓存）"

[[product.retention.point]]
text_zh = "batch 上传的输入文件保留到用户主动删除"

[[product.retention.point]]
text_zh = "请求元数据保留期未披露。"

[[product.retention.point]]
text = "Usage Data may include information such as system logs, performance metrics, model-usage statistics, metadata, and other operational information but excludes Your Content or any personal information."
text_zh = "另一类对象＝运行/访问日志与运行元数据：contract 层 ToS §7.4 定义的 Usage Data（system logs、performance metrics、model-usage statistics、metadata 等运营信息），明确排除 Your Content 与个人信息。"
anchor = "togetherai-tos-7-4-usage-data-excludes-content"

[[product.retention.point]]
text = "We may use the Usage Data for purposes including improving, maintaining, and securing the Services, developing new features or services, monitoring for abuse, and conducting analytics."
text_zh = "该 Usage Data 的用途＝改进/维护/安全/开发新功能/滥用监测/分析。该句只给用途不给期限，故这类对象的保留期仍记未披露，不据此推期限。"
anchor = "togetherai-tos-7-4-usage-data-purposes"

[product.processing_region]
codes = ["unknown"]
anchor = "togetherai-privsec-serverless-no-region"
searched = [
  "https://docs.together.ai/docs/privacy-and-security",
  "https://docs.together.ai/docs/zero-data-retention",
  "https://www.together.ai/privacy",
  "https://www.together.ai/terms-of-service",
]

[[product.processing_region.point]]
text = "Serverless endpoints do not offer region selection; use a dedicated endpoint or contact us to discuss the right setup for your workload."
text_zh = "本档不提供区域选择：官方只说不提供，既没有点名处理地，也没有给可选区域，故 codes 记未披露（不填 US）。EU 需改用 dedicated endpoint 或 VPC 部署。"
anchor = "togetherai-privsec-serverless-no-region"

[[product.processing_region.point]]
text = "DeepSeek models are hosted in Together’s secure North America data centers."
text_zh = "唯一被点名的处理地是第三方作者模型（DeepSeek 等）所在的北美数据中心（对象是这些模型所在的 Together 自有基础设施，不是本档的默认处理地承诺）。"
anchor = "togetherai-privsec-north-america-dc"

[[product.processing_region.point]]
text = "Your information, including Personal Data, is processed at the Company's operating offices and in any other places where the parties involved in the processing are located."
text_zh = "《Privacy Policy》§2.5 另写明数据在公司的运营办公室及处理各方所在地处理，不限定美国。故官方从未承诺 serverless 默认在美国处理，本维度不据此填 US。"
anchor = "togetherai-privacy-2-5-processing-locations"

[product.role]
mark = "unknown"
kind = "unknown"
searched = [
  "https://www.together.ai/terms-of-service",
  "https://www.together.ai/privacy",
  "https://docs.together.ai/docs/zero-data-retention",
  "https://docs.together.ai/docs/privacy-and-security",
  "https://trust.together.ai",
]

[[product.role.point]]
text_zh = "同顶层 role：无角色声明，DPA 在 Vanta Trust Center 内不可抓取。ToS §7.2 的有限许可（access/host/use/copy solely as necessary to provide the Services）讲的是授权范围而非协议角色，故本维度不绑锚点。"

