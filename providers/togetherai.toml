[product.training]
mark = "yes"
mode = "default"
anchor = "togetherai-zdr-doc-training-optin"

[[product.training.point]]
text_zh = "docs 的「Together does not train on your data without your explicit consent, whether or not ZDR is enabled.」写在 ZDR 页的 Default behavior 节，语境是组织级隐私设置，未把 dedicated endpoints 排除在外"

[[product.training.point]]
text_zh = "但 dedicated 档的公开文档没有独立的数据使用条款，故 confidence 降为 medium。"

[product.zdr]
mark = "unknown"
searched = [
  "https://docs.together.ai/docs/zero-data-retention",
