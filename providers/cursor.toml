text_zh = "官方两份文档对同一对象给出相反说法，并列保留：企业数据治理文档（本档 US 驻留与 Privacy Mode 默认值也出自这一页）称 Cloud Agents 的仓库加密副本「Stored temporarily while the agent runs / Deleted after the agent completes」；Cloud Agent 安全文档的逐对象表则给 VM 快照（含克隆代码）「Rolling 90 days of inactivity … then automatic deletion」，并明说 snapshots can't be deleted on demand——Enterprise 的 retention policy 选项也盖不住 snapshot。两句都是现行官方文本，分歧无法调和，本档按安全文档记 90 天上限，同时保留治理文档的表述。"
