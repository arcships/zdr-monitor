[[product]]
id = "free-privacy-off"
badge = "Free（Privacy Mode 关闭）"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
anchor = "cursor-privacy-off-train"

[[product.training.point]]
text_zh = "Privacy Mode 关闭时，Cursor 明确可存储并使用代码库数据、prompt、编辑器操作、代码片段等来改进 AI 功能并训练自有模型；这不是“未披露”，而是明确否定不训练。"

[[product.training.point]]
text = "The Privacy Policy that governs individual plans states the general rule — Inputs and Suggestions are not used to train our models — together with three exceptions: security review flags, explicit reports (Feedback), and explicit agreement. Turning Privacy Mode off is the act that falls under exception (3), so this tier is recorded as training-permitted on the vendor's own text, not by reading against it."
text_zh = "个人档适用的 Privacy Policy §2 给的是「原则不训练 + 三项例外」：安全审查标记、用户主动上报（如 Feedback）、用户明确同意。关闭 Privacy Mode 正是落入例外 (3) 的那个动作——本档记「会训练」不是对厂商文本的反读，政策原文本身就留了这条口子。"
anchor = "cursor-privacy-training-exceptions"

[[product.training.point]]
text = "The contract layer is the highest authority for this tier, and its only clause authorizing Anysphere to process data to enhance the Service covers Usage Data — technical logs, data, and learnings about your use of the Service — and states that it excludes Content. It therefore neither rebuts nor reinforces the Content-training verdict; a buyer asking whether technical logs and learnings feed model improvement has to read this clause, not the training column."
text_zh = "合同层是本档最高权威。ToS §5.4 是其中唯一授权 Anysphere 为「enhance the Service」处理数据的条款，对象是 Usage Data（技术日志、data、learnings），且该条自己写明 excludes Content——所以它既不推翻也不加码 Content 的训练结论（本维度问的是输入输出是否进模型）。采购若要问「技术日志和 learnings 会不会进模型改进」，看的是这一条，不是 training 列。"
anchor = "cursor-tos-usage-data"

[product.zdr]
mark = "no"
anchor = "cursor-privacy-off-train"

[[product.zdr.point]]
text_zh = "Privacy Mode 关闭时，Cursor 和部分推理提供商可存储输入输出，因此不构成 ZDR；提供商存储仅称使用后删除，未给期限。"

[product.retention]
basis = "undisclosed"
object = "input_output"
searched = ["https://cursor.com/data-use", "https://cursor.com/privacy", "https://cursor.com/terms-of-service"]

[[product.retention.point]]
text_zh = "已查 Data Use、Privacy Policy 与消费档 ToS。前者只说部分推理提供商的数据在使用后删除，Privacy Policy 只说按必要时间保留，ToS 只给终止后的可选删除；三者均未量化代码、prompt、代码片段或输入输出期限。"

[[product.retention.point]]
text = "The consumer contract's only clause touching deletion of Content makes it discretionary: upon termination Anysphere may at our option delete any Content or other data associated with your account. That is a permission, not a deletion commitment, and it sets no period — it neither establishes a retention deadline nor rebuts the undisclosed basis."
text_zh = "消费档合同里唯一涉及 Content 删除的条款是 ToS §9：服务终止时 we may at our option delete any Content or other data associated with your account——删除由厂商自行决定，是许可而非承诺，也不给期限。它不构成保留期限，因此不改变本档 basis；只说明终止后数据去向没有任何保证。"
anchor = "cursor-tos-termination-deletion"

[[product.retention.point]]
text_zh = "遥测/数据分享：Privacy Mode 关闭即允许收集 editor actions、code snippets 等用于改进与训练；用户可用 Privacy Mode 关闭这类训练数据分享。Privacy Policy 仍披露 device/log/usage data 的自动收集，现行官方页未提供关闭全部运行遥测的开关。"

[[product.retention.point]]
text_zh = "代码索引：现行 Instant Grep 在本机建立和查询索引，不上传路径或代码来建索引，也不存代码库 embeddings；只有打开命中的文件时，内容才可能进入模型请求。"
anchor = "cursor-search-local-no-embeddings"

