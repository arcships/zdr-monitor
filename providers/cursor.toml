[[source]]
url = "https://cursor.com/terms-of-service"
channel = "contract"
tier = "core"
note = "《Cursor Terms of Service》(Last updated September 3, 2026)。消费档（Free/Pro）主合同：§1.3 Model Training 是全大写的不训练禁令——除用户明确同意外，Anysphere 不会用内容训练、也不允许第三方训练任何 AI 模型；§5.4 定义 Usage Data 并给出 Anysphere 对技术日志的处置权。是 training 维度的合同层来源，优先级高于开发者文档。"

[[source]]
url = "https://cursor.com/terms/msa"
channel = "contract"
tier = "core"
note = "《Cursor Master Service Agreement》(Last updated August 13, 2026)。商业档（Teams/Enterprise）主协议：§3.3 Ownership of Customer Data; Model Training 含同一句大写禁令，主体从用户换成客户（除客户明确同意外）。是 Teams/Enterprise 档 training 维度的合同层来源。"

[[source]]
url = "https://cursor.com/blog/secure-codebase-indexing"
channel = "official_blog"
tier = "core"
note = "官方 blog《Securely indexing large codebases》(Jan 27, 2026)。唯一描述服务端语义索引的官方文本：新代码库会 uploads every file，变更文件被切成 syntactic chunks 并转成 embeddings 存入服务端索引；同一团队内按 simhash 复用他人索引，并依赖 Merkle tree 内容证明控制可见范围。该索引的保留期限官方未公布。与 docs/agent/tools/search 描述的本地 Instant Grep 是两条并存的数据流，官方未澄清二者关系。"

[[product]]
id = "free-privacy-off"
badge = "Free（Privacy Mode 关闭）"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
anchor = "cursor-privacy-off-train"

[[product.training.point]]
text_zh = "Privacy Mode 关闭时，Cursor 明确可存储并使用代码库数据、prompt、编辑器操作、代码片段等来改进 AI 功能并训练自有模型；这不是“未披露”，而是明确否定不训练。"

[product.zdr]
mark = "no"
anchor = "cursor-privacy-off-train"

[[product.zdr.point]]
text_zh = "Privacy Mode 关闭时，Cursor 和部分推理提供商可存储输入输出，因此不构成 ZDR；提供商存储仅称使用后删除，未给期限。"

[product.retention]
basis = "undisclosed"
object = "input_output"
searched = ["https://cursor.com/data-use", "https://cursor.com/privacy"]

[[product.retention.point]]
text_zh = "已查 Data Use 与 Privacy Policy。前者只说部分推理提供商的数据在使用后删除，后者只说按必要时间保留，均未量化代码、prompt、代码片段或输入输出期限。"

[[product.retention.point]]
text_zh = "遥测/数据分享：Privacy Mode 关闭即允许收集 editor actions、code snippets 等用于改进与训练；用户可用 Privacy Mode 关闭这类训练数据分享。Privacy Policy 仍披露 device/log/usage data 的自动收集，现行官方页未提供关闭全部运行遥测的开关。"

[[product.retention.point]]
text_zh = "代码索引：现行 Instant Grep 在本机建立和查询索引，不上传路径或代码来建索引，也不存代码库 embeddings；只有打开命中的文件时，内容才可能进入模型请求。"
anchor = "cursor-search-local-no-embeddings"

[product.processing_region]
codes = ["US", "global"]
anchor = "cursor-privacy-global-processing"

[product.role]
kind = "controller"
anchor = "cursor-individual-dpa-not-apply"

