badge = "Free/Pro（Privacy Mode）"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "yes"
mode = "opt_out"
anchor = "cursor-privacy-mode-no-training-zdr"

[[product.training.point]]
text_zh = "Privacy Mode 对 Free 和 Pro 均可开启；开启后 Cursor 与模型提供商不使用 Customer Data 训练。滥用检测触发的数据、用户明确反馈及明确同意训练是例外。"

[[product.training.point]]
text_zh = "合同层同向，且优先级高于开发者文档：消费档 ToS §1.3 以全大写写明，除用户明确同意外 Anysphere 不会用内容训练、也不允许第三方训练任何 AI 模型；关闭 Privacy Mode 正是那个「明确同意」的动作。官方从未说明 Free/Pro 档 Privacy Mode 的默认值，因此个人档的保护来自合同禁令加开关，而不是一个有文档依据的默认值。"
anchor = "cursor-tos-model-training-ban"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "cursor-privacy-mode-no-training-zdr"

[[product.zdr.point]]
text_zh = "Cursor 称与所有提供商维持 ZDR 协议；但非 ZDR 模型须标记或管理员 opt-in，滥用分类器命中可按提供商政策留存，BYOK 也适用上游自己的政策。"

[product.retention]
basis = "none"
object = "input_output"
anchor = "cursor-temp-cache"
searched = ["https://cursor.com/data-use", "https://cursor.com/privacy", "https://cursor.com/terms-of-service"]

[[product.retention.point]]
text_zh = "常规模型请求按 ZDR；Cursor 仍会把文件内容加密临时缓存于服务器，密钥只在单次请求期间存在，官方仅承诺不永久保存而未给墙钟期限。滥用调查和非 ZDR 模型是例外。"

[[product.retention.point]]
text_zh = "Privacy Mode 能关闭代码、prompt、编辑动作和代码片段用于训练的数据分享，但官方未称它会关闭所有 device/log/usage telemetry。搜索索引与 embeddings 留在本机；服务端只会在模型请求中接收被打开的文件内容，并另有上述临时缓存。"
anchor = "cursor-search-local-no-embeddings"

[[product.retention.point]]
text_zh = "代码库索引其实有两条并存的数据流，官方从未澄清二者关系：docs 的 Instant Grep 在本机建索引、不上传代码；官方 blog 描述的服务端语义索引则会在新代码库上 uploads every file，把变更文件切成 syntactic chunks 转成 embeddings 存入服务端索引，并可在同团队内复用他人的索引。该服务端索引的保留期限官方未公布。因此「不留存」这个结论只覆盖模型请求路径，不覆盖代码库索引——采购若在意整库上传，必须单独谈这一条。"
anchor = "cursor-index-uploads-every-file"

[[product.retention.point]]
text = "The consumer contract's only clause touching deletion of Content makes it discretionary: upon termination Anysphere may at our option delete any Content or other data associated with your account. That is a permission, not a deletion commitment, and it sets no period — it does not extend or undercut the no-retention basis recorded for model requests, it only shows that post-termination data handling carries no guarantee."
text_zh = "消费档合同里唯一涉及 Content 删除的条款是 ToS §9：服务终止时 we may at our option delete any Content or other data associated with your account——删除由厂商自行决定，是许可而非承诺，也不给期限。它不构成保留期限，既不扩大也不推翻本档 basis；只说明终止后数据去向没有任何保证。"
anchor = "cursor-tos-termination-deletion"

