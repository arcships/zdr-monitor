[[product]]
id = "cloud-agents"
badge = "托管 Cloud Agents（Teams）"
category = "coding_plan"
plan_level = "team"

[product.training]
mark = "yes"
mode = "default"
anchor = "cursor-cloud-agent-no-training"

[[product.training.point]]
text_zh = "官方这句话是有前提的：「With Privacy Mode on, Cursor never trains…」。之所以对 Teams 判默认不训练，是因为 Teams 的 Privacy Mode 默认对全体成员开启、管理员还能强制到成员关不掉——前提本身有文档兜底，不是 Cloud Agent 自带的属性。"
anchor = "cursor-teams-privacy-default"

[product.zdr]
mark = "no"
anchor = "cursor-cloud-agent-retention"

[[product.zdr.point]]
text_zh = "模型提供商多数走 ZDR，但托管 Agent 本身必须把完整仓库放入 Cursor 云 VM，并在 Cursor 后端保存对话状态、元数据与 artifacts，因此端到端不是零保留。"

[product.retention]
days = 90
object = "repository_snapshot"
basis = "fixed_period"
anchor = "cursor-cloud-agent-retention"

[[product.retention.point]]
text_zh = "运行 workspace 在空闲后回收；含克隆代码的 VM snapshots 按不活动滚动 90 日，每次启动/恢复重置；对话状态默认无限期，可按需删除；凭据保留至用户删除。Enterprise 另可设置对话保留策略。"

[[product.retention.point]]
text = "Two official documents disagree about the same object. The Enterprise data governance overview says encrypted copies of repositories that Cloud Agents work on are stored temporarily while the agent runs and deleted after the agent completes; the Cloud Agent security page instead puts VM snapshots (including cloned code) on a rolling 90-day inactivity window and adds that snapshots cannot be deleted on demand. Both texts are current and official — the governance page is an Enterprise-facing overview, the security page a per-object table — and they cannot both hold. The divergence is unresolved, so the 90-day figure is kept as the outer bound and the governance statement is recorded alongside it."
text_zh = "官方两份文档对同一对象给出相反说法，并列保留：企业数据治理文档（面向 Enterprise 的概述）称 Cloud Agents 的仓库加密副本「Stored temporarily while the agent runs / Deleted after the agent completes」；Cloud Agent 安全文档的逐对象表则给 VM 快照（含克隆代码）「Rolling 90 days of inactivity … then automatic deletion」，并明说 snapshots can't be deleted on demand。两句都是现行官方文本，「agent 跑完即删」与「不活动滚动 90 天」不能同时成立。本档按安全文档记 90 天上限，同时保留治理文档的表述。"
anchor = "cursor-governance-cloud-agents-repo-copy"

[product.processing_region]
codes = ["global"]
anchor = "cursor-dpa-third-country"

[[product.processing_region.point]]
text = "Teams is a commercial tier under the MSA, so the DPA governs the region question: it contemplates processing of Personal Data in a Third Country under the Controller to Processor Clauses and makes no residency commitment. US-only data residency is offered to Enterprise teams only, so this tier has no in-region option to point to. The separate-AWS-account sentence on the Cloud Agent security page describes isolation of the execution environment and carries no country or region information."
text_zh = "Teams 属商业档，处理地看 DPA：DPA §13 承认在第三国处理个人数据（按 Controller to Processor Clauses 承担 data importer 义务），未承诺具体处理地；US-only 驻留只对 Enterprise 团队开放，本档没有可指的在境选项。Cloud Agent 安全文档那句独立 AWS account 只是隔离性描述，不含国家或区域信息。"
anchor = "cursor-dpa-third-country"

