mode = "opt_out"
anchor = "cursor-cloud-agent-no-training"

[[product.training.point]]
text_zh = "不训练的前提是 Privacy Mode 开着——官方原句是「With Privacy Mode on, Cursor never trains…」，而不是「跑 Cloud Agent 就一律不训练」。Teams/Enterprise 默认开启、管理员还能强制，Free/Pro 的默认值官方从未公布，所以个人档得自己确认开关状态。"

[[product.training.point]]
text_zh = "关掉 Privacy Mode 就回到「Free/Pro（Privacy Mode 关闭）」那一行：代码库数据、prompt、编辑动作可被用于改进 AI 功能并训练自有模型。"
anchor = "cursor-privacy-off-train"

[product.zdr]
mark = "no"
anchor = "cursor-cloud-agent-retention"

[[product.zdr.point]]
text_zh = "托管 Agent 必须把整个仓库放进 Cursor 云 VM，并在后端保存对话状态、元数据与 artifacts，端到端不是零保留。"

[product.retention]
days = 90
object = "repository_snapshot"
basis = "fixed_period"
anchor = "cursor-cloud-agent-retention"

[[product.retention.point]]
text_zh = "含克隆代码的 VM snapshot 按不活动滚动 90 日，每次启动或恢复都重置；对话状态默认无限期，可用 Delete Agent API 按需删除。个人档没有 Enterprise 那套对话保留策略。"

[[product.retention.point]]
text = "Two official documents disagree about the same object. The Enterprise data governance overview says encrypted copies of repositories that Cloud Agents work on are stored temporarily while the agent runs and deleted after the agent completes; the Cloud Agent security page instead puts VM snapshots (including cloned code) on a rolling 90-day inactivity window and adds that snapshots cannot be deleted on demand. Both texts are current and official — the governance page is an Enterprise-facing overview, the security page a per-object table — and they cannot both hold. The divergence is unresolved, so the 90-day figure is kept as the outer bound and the governance statement is recorded alongside it."
text_zh = "官方两份文档对同一对象给出相反说法，并列保留：企业数据治理文档（面向 Enterprise 的概述）称 Cloud Agents 的仓库加密副本「Stored temporarily while the agent runs / Deleted after the agent completes」；Cloud Agent 安全文档的逐对象表则给 VM 快照（含克隆代码）「Rolling 90 days of inactivity … then automatic deletion」，并明说 snapshots can't be deleted on demand。两句都是现行官方文本，「agent 跑完即删」与「不活动滚动 90 天」不能同时成立。本档按安全文档记 90 天上限（对采购是较保守的一侧），同时保留治理文档的表述。"
anchor = "cursor-governance-cloud-agents-repo-copy"

[product.processing_region]
codes = ["US", "global"]
anchor = "cursor-privacy-global-processing"

[[product.processing_region.point]]
text = "The account-separation sentence on the Cloud Agent security page describes the execution environment only: Cloud Agent VMs run in a separate AWS account from the rest of Cursor's production infrastructure. It carries no country or region information. This tier's region verdict therefore rests on the Privacy Policy that governs individual plans, which discloses processing on servers in various jurisdictions including the United States. US-only residency is offered to Enterprise teams only."
text_zh = "Cloud Agent 安全文档那句「独立 AWS account」是隔离性描述（执行环境与 Cursor 其他生产设施隔开），不含国家或区域信息，不能当处理地证据。个人档适用 Privacy Policy：处理发生在 various jurisdictions, including in the United States 的服务器上；US-only 驻留只对 Enterprise 团队开放，本档不在其中。"
anchor = "cursor-cloud-agent-aws"

