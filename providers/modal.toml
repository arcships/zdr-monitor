[[product.role.point]]
text = "Same as top-level role."
text_zh = "同顶层 role。"

[[product.role.point]]
text = "Kept alongside the processor characterisation: DPA Appendix 1 also incorporates SCC Module 1, \"Transfer controller to controller ... apply where Modal Processes Personal Data as a Controller\". That is a specific situation defined by the SCC annex (Modal and its Affiliates in non-adequacy approved third countries, Customer established in the EEA) and does not displace the processor characterisation for the service processing above."
text_zh = "与 processor 定性并列保留：DPA Appendix 1 同时纳入 SCC Module 1「Transfer controller to controller … apply where Modal Processes Personal Data as a Controller」。这是 SCC 附录界定的特定场景（Modal 及其关联方位于未获充分性认定的第三国、客户设立于 EEA），不取代前述服务处理上的 processor 定性。"
anchor = "modal-tos-dpa-scc-module-1-controller"

