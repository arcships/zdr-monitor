[[source]]
url = "https://modal.com/docs/guide/data-residency"
channel = "developer_data"
tier = "core"
note = "官方《Data residency on Modal》文档，processing_region 维度的主要事实来源：逐产品给出容器/路由区域是否可选（Endpoints Shared 两者都不可选、Dedicated/Functions/Sandboxes/Servers 可选）、日志与持久存储在美国、>2MiB 与异步 payload 在美国、快照在美国、区域锁定是严格的（「neither is ever moved elsewhere」）。第 43 行同时明确 Dedicated/Shared Endpoints 与 Servers 不存储请求与响应 payload（与 security 页的 zdr 条款互相印证）。"

[[source]]
url = "https://modal.com/docs/guide/security"
channel = "developer_data"
tier = "core"
note = "官方安全与隐私文档（docs 站 guide，非合同）。覆盖整平台的三个维度：(a) Data privacy 节给出 Modal 对客户数据的访问/使用承诺（training 的第二层依据）；(b) Data retention 节以表格逐对象给出保留期（Functions 输入输出最多 7 天、Endpoints/Servers 请求响应不落盘、日志按套餐 1/30 天、元数据随账户存续、Volumes/Images 持久、快照 7/30 天、Dicts 7 天、Queues 默认 24h TTL）；(c) Modal Inference endpoints 节给出零数据保留的原文（zdr 的唯一权威依据）。这是旧记录唯一登记的候选 URL，其内容旧记录只用于 zdr。"

[[source]]
url = "https://modal.com/legal/terms"
channel = "contract"
tier = "core"
note = "《Software as a Service Agreement》（Effective May 2026，Modal Labs, Inc.，Delaware），合同层最高权威，第 16 行明确「Customer consents to this Agreement by executing a Service Order or creating an account on the Service」——即自助注册的 Starter/Team 档与企业档同受本协议约束。Exhibit A 内嵌 DPA（与独立的 /legal/dpa 不是同一文本，见 notes）。本档为 training（§5.5.4）、processing_region（§1.9）、role（§1.8/§5.3/DPA §2.1/§2.3.1/SCC Module 2）、retention（§3.3/§5.4/DPA §9.1/Schedule 1/Schedule 2）的权威依据。§1.2 No-Fee Use 提示免费档可能另有「differing terms」，未找到公开的 No-Fee Use Limitations 文本。"

[[product]]
id = "platform"
badge = "计算平台"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
anchor = "modal-tos-5-5-4-no-training-without-consent"
mode = "by_contract"

[[product.training.point]]
text = "Same as top-level training: §5.5.4 bars training any AI model using Customer Data, except with Customer's prior written consent"
text_zh = "同顶层 training：§5.5.4 禁止用 Customer Data 训练 AI 模型（除客户事先书面同意）"

[[product.training.point]]
text = "The Data privacy section of the security page separately commits that Modal will never access or use your source code, the inputs and outputs of your Modal Functions, or any data you store in Images or Volumes. That absolute wording is qualified at the contract layer by §5.3, which requires safeguards preventing access, use, modification or disclosure of Customer Data by Modal personnel \"except: (a) to provide the Service and to prevent or address service or technical problems, or (b) as Customer expressly permits in writing\" — so \"never access or use\" is not an unlimited commitment. A customer running their own training job on this tier is the customer's own act and does not change this conclusion."
text_zh = "security 页 Data privacy 节另承诺不访问/不使用客户源代码、函数输入输出与 Images/Volumes 数据。这一绝对表述在合同层受 §5.3 限定：防止 Modal 人员访问、使用、修改或披露 Customer Data 的措施有例外——「(a) to provide the Service and to prevent or address service or technical problems, or (b) as Customer expressly permits in writing」，故「never access or use」不是无限定的承诺。客户在该档跑自己的训练任务是客户自己的行为，不改变本结论。"
anchor = "modal-tos-5-3-no-personnel-access"

[[product.training.point]]
text = "Tier boundary not verified: this product is plan_level=any and therefore includes the free Starter tier, while §1.2 states that \"No-Fee Use may be subject to certain additional restrictions, limitations and differing terms all as specified in the corresponding No-Fee Use Limitations.\" That No-Fee Use Limitations text was not found publicly, so whether the §5.5.4 no-training promise applies unchanged to the free tier is unverified."
text_zh = "档位边界未经核实：本档为 plan_level=any，因此含免费 Starter 档；而 §1.2 写明「No-Fee Use may be subject to certain additional restrictions, limitations and differing terms all as specified in the corresponding No-Fee Use Limitations.」。该 No-Fee Use Limitations 文本未公开找到，故 §5.5.4 的不训练承诺对免费档是否原样适用，未经核实。"
anchor = "modal-tos-1-2-no-fee-use-differing-terms"

[product.zdr]
mark = "no"
anchor = "modal-security-retention-inputs-outputs-7d"

[[product.zdr.point]]
text = "This tier is internally inconsistent and has to be read in parts: Function inputs and outputs are retained for up to 7 days (the security page table row \"Up to 7 days, then deleted\"), so there is no zero retention for Functions and therefore none for the tier as a whole"
text_zh = "本档内不一致，必须分开看：Functions 的输入输出有上限 7 天的留存（security 页表行「Up to 7 days, then deleted」），故对 Functions 无零保留，整档因此无零保留"
anchor = "modal-security-retention-inputs-outputs-7d"

[[product.zdr.point]]
text = "For Servers, request and response payloads are \"Not stored — proxied directly to your container\", sharing the zero-retention path with Endpoints. Zero retention therefore exists only on the Endpoints/Servers payload path and does not cover Functions. Logs and metadata are not included and are still retained for their own periods."
text_zh = "Servers 的请求与响应 payload「Not stored — proxied directly to your container」，与 Endpoints 同享零保留路径。即零保留只存在于 Endpoints/Servers 的 payload 路径，不含 Functions。日志与元数据不在此列，仍按各自期限留存。"
anchor = "modal-security-retention-endpoint-payloads-not-stored"

[product.retention]
days = 7
object = "input_output"
basis = "fixed_period"
anchor = "modal-security-retention-inputs-outputs-7d"

[[product.retention.point]]
text = "Retention on this tier (object → period): Function input and output content up to 7 days (a maximum TTL)"
text_zh = "本档保留期（对象→期限）：函数输入输出正文 ≤7 天（上限）"

[[product.retention.point]]
text = "Request and response payloads for Servers are not written to disk"
text_zh = "Servers 的请求响应 payload 不落盘"

[[product.retention.point]]
text = "App and container logs are plan-dependent: 1 day on Starter, 30 days on Team, configurable on Enterprise"
text_zh = "应用/容器日志按套餐 1 天（Starter）/30 天（Team）/企业版可配置"

[[product.retention.point]]
text = "Metadata is stored for the lifetime of the account"
text_zh = "元数据随账户存续"

[[product.retention.point]]
text = "Volumes and Images persist until the customer deletes them"
text_zh = "Volumes/Images 持久直到客户删除"

[[product.retention.point]]
text = "Memory snapshots 7 days, filesystem and directory snapshots 30 days (configurable)"
text_zh = "内存快照 7 天、文件系统与目录快照 30 天（可配置）"

[[product.retention.point]]
text = "Dict entries 7 days"
text_zh = "Dicts 条目 7 天"

[[product.retention.point]]
text = "Queue partitions have a default TTL of 24h"
text_zh = "Queues 分区默认 24h TTL"

[[product.retention.point]]
text = "Audit logs are per Enterprise contract. At the contract layer, ToS §5.4, Customer Data \"is expunged promptly following completion of processing\", and §3.3, the account is deleted within 60 days following the termination date."
text_zh = "审计日志按企业合同。合同层 ToS §5.4「expunged promptly following completion of processing」、§3.3 账户终止后 60 天内删除。"

[[product.retention.point]]
text = "The contract layer sets no ceiling on retention: DPA Schedule 2 states \"Modal retains data as long as the Modal has a need for its use, or to meet regulatory or contractual requirements. Once data is no longer needed, it is securely disposed of or archived.\" The object-level periods published on the security page (7 days, 30 days, and so on) are documentation-layer disclosures of particular objects, not a contractual maximum."
text_zh = "合同层不设保留上限：DPA Schedule 2 写明「Modal retains data as long as the Modal has a need for its use, or to meet regulatory or contractual requirements. Once data is no longer needed, it is securely disposed of or archived.」。security 页公布的对象级期限（7 天、30 天等）是文档层对具体对象的披露，不是合同层上限。"
anchor = "modal-tos-dpa-schedule-2-limited-retention"

[[product.retention.point]]
text = "Contract-layer carve-out that also touches training: §1.11 opens with \"Notwithstanding anything to the contrary\" and lets Modal \"collect and use Service Metrics for its own business purposes during the term of this Agreement and thereafter\". Service Metrics are defined as data used in an aggregate and/or permanently anonymized manner that does not identify an individual or Customer, with safeguards prohibiting re-identification, and they are not Customer Data — so the no-training and deletion promises are not absolute at the contract layer, but this carve-out does not reach Customer Data."
text_zh = "同时涉及 training 的合同层例外：§1.11 以「Notwithstanding anything to the contrary」开头，允许 Modal「collect and use Service Metrics for its own business purposes during the term of this Agreement and thereafter」。Service Metrics 定义为以聚合和/或永久匿名方式使用、不识别个人或客户、并有禁止再识别保障的数据，且不含 Customer Data——故合同层的不训练与删除承诺并非绝对，但该例外不及于 Customer Data。"
anchor = "modal-tos-1-11-service-metrics-carve-out"

[product.processing_region]
codes = ["selected", "US"]
anchor = "modal-tos-1-9-processing-locations"

[[product.processing_region.point]]
text = "Same as top-level processing_region: container and routing regions can be specified (region= / routing_region= for Functions, compute_region= for Servers), and region pinning is strict"
text_zh = "同顶层 processing_region：容器与路由区域可指定（Functions 用 region=/routing_region=、Servers 用 compute_region=），区域锁定严格"

[[product.processing_region.point]]
text = "Durable storage and logs are fixed in the United States"
text_zh = "持久存储与日志固定在美国"

[[product.processing_region.point]]
text = "Cross-border transfer is governed by DPA §11.1. Sandboxes have no routing-region concept (the data plane connects directly to the container, while lifecycle requests go through the us-east control plane)."
text_zh = "跨境受 DPA §11.1 约束。Sandboxes 无路由区域概念（数据面直连容器，生命周期请求经 us-east 控制面）。"

[product.role]
kind = "processor"
anchor = "modal-tos-dpa-2-3-1-service-provider"

[[product.role.point]]
text = "Same as top-level role: DPA §2.3.1 states that \"Modal shall act as a Service Provider to Customer\", SCC Modules 2/3 are entered into in the processor capacity, §2.1 sets the purpose limitation, and ToS §1.8 leaves all right, title and interest with the customer, granting Modal only a limited licence. Kept alongside: DPA Appendix 1 also incorporates SCC Module 1, \"Transfer controller to controller ... apply where Modal Processes Personal Data as a Controller\", so there are situations covered by the SCC annex in which Modal acts as a controller."
text_zh = "同顶层 role：DPA §2.3.1 自认 Service Provider、SCC Module 2/3 以 processor 身份签署、§2.1 目的限制、ToS §1.8 客户保留所有权仅给有限许可。并列保留：DPA Appendix 1 同时纳入 SCC Module 1「Transfer controller to controller … apply where Modal Processes Personal Data as a Controller」，即存在 SCC 附录覆盖的、Modal 以控制者身份处理的情形。"
anchor = "modal-tos-dpa-2-3-1-service-provider"

[[product.role.point]]
text = "The controller case is a specific situation defined by the SCC annex, not a reframing of the service: Appendix 1 Module 1 applies where Modal Processes Personal Data as a Controller, Modal and its Affiliates sit in non-adequacy approved third countries and the Customer is established in the EEA. It sits alongside Modules 2 and 3 rather than replacing the processor characterisation for the service processing."
text_zh = "该控制者情形是 SCC 附录界定的特定场景，不是对服务的重新定性：Appendix 1 Module 1 适用于 Modal 以控制者身份处理个人数据、Modal 及其关联方位于未获充分性认定的第三国、且客户设立于 EEA 的场合。它与 Module 2/3 并列，不取代服务处理上的 processor 定性。"
anchor = "modal-tos-dpa-scc-module-1-controller"

[[product]]
id = "endpoints-shared"
badge = "共享端点"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
anchor = "modal-tos-5-5-4-no-training-without-consent"
mode = "by_contract"

[[product.training.point]]
text = "Same as top-level training. §5.5.1 states that the Input and Output of AI Tools are Customer Data, so this tier's prompts and completions fall within the protection of §5.5.4, \"will not train any AI model using Customer Data\""
text_zh = "同顶层 training。§5.5.1 明确 AI Tools 的 Input 与 Output 属 Customer Data，故本档的 prompt 与 completion 落入 §5.5.4「不得用于训练 AI 模型」的保护范围"

[[product.training.point]]
text = "§5.5.3 further states that subcontractors processing Customer Data in order to provide AI Tools are on the subprocessor list. No clause was found that allows Modal to use inference requests to train models."
text_zh = "§5.5.3 另说明为提供 AI Tools 而处理 Customer Data 的分包商在 subprocessor 名单上。未发现任何条款允许 Modal 用推理请求训练模型。"

[[product.training.point]]
text = "Tier boundary not verified: this product is plan_level=any and therefore includes the free Starter tier, while §1.2 states that \"No-Fee Use may be subject to certain additional restrictions, limitations and differing terms all as specified in the corresponding No-Fee Use Limitations.\" That No-Fee Use Limitations text was not found publicly, so whether the §5.5.4 no-training promise applies unchanged to the free tier is unverified."
text_zh = "档位边界未经核实：本档为 plan_level=any，因此含免费 Starter 档；而 §1.2 写明「No-Fee Use may be subject to certain additional restrictions, limitations and differing terms all as specified in the corresponding No-Fee Use Limitations.」。该 No-Fee Use Limitations 文本未公开找到，故 §5.5.4 的不训练承诺对免费档是否原样适用，未经核实。"
anchor = "modal-tos-1-2-no-fee-use-differing-terms"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "modal-security-inference-endpoints-zdr"

[[product.zdr.point]]
text = "The Modal Inference endpoints section of the security page: request and response payloads \"are never written to disk and pass through Modal’s infrastructure only as in-flight network traffic\", in effect by default with no application required. The scope is limited to payloads and excludes logs and metadata."
text_zh = "security 页 Modal Inference endpoints 节：请求与响应 payload「never written to disk and pass through Modal's infrastructure only as in-flight network traffic」，默认生效、无需申请。范围限于 payload，不含日志与元数据。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "modal-data-residency-endpoints-servers-no-payload-storage"

[[product.retention.point]]
text = "Request and response payloads are not stored (\"Dedicated Endpoints, Shared Endpoints, and Servers do not store request and response payloads\"). Logs and metadata for the same products are a different object and are still retained."
text_zh = "请求与响应 payload 不存储（「Dedicated Endpoints, Shared Endpoints, and Servers do not store request and response payloads」）。同产品的日志与元数据属另一类对象，仍然留存。"
anchor = "modal-data-residency-endpoints-servers-no-payload-storage"

[[product.retention.point]]
text = "No single period applies to this tier because it is plan_level=any: the security page row for app and container logs reads \"Plan-dependent: 1 day on Starter, 30 days on Team, configurable on Enterprise\", and that row lists Functions and Sandboxes only — the log period for Endpoints is not published separately. Audit logs are \"Per Enterprise contract\" and metadata is \"Stored for the lifetime of your account\". The 30-day figure is the Team plan's number and is not used as this tier's period."
text_zh = "本档为 plan_level=any，故没有单一期限：security 页的应用/容器日志行写「Plan-dependent: 1 day on Starter, 30 days on Team, configurable on Enterprise」，且该行只列 Functions 与 Sandboxes——Endpoints 的日志期限官方未单列。审计日志「Per Enterprise contract」、元数据「Stored for the lifetime of your account」。30 天是 Team 档的数字，不当作本档期限。"
anchor = "modal-security-retention-logs-plan-dependent"

[[product.retention.point]]
text = "Audit logs are per Enterprise contract. Session affinity reuses the in-container KV prefix cache (endpoints docs), and the lifetime and purge rules of that cache are not disclosed — the unquantified item for retention on this tier."
text_zh = "审计日志按企业合同。会话亲和会复用容器内 KV 前缀缓存（endpoints 文档），该缓存的生命周期与清除规则官方未披露——这是本档 retention 的未量化项。"

[[product.retention.point]]
text = "The contract layer sets no ceiling on retention: DPA Schedule 2 states \"Modal retains data as long as the Modal has a need for its use, or to meet regulatory or contractual requirements. Once data is no longer needed, it is securely disposed of or archived.\" The object-level periods published on the security page are documentation-layer disclosures, not a contractual maximum."
text_zh = "合同层不设保留上限：DPA Schedule 2 写明「Modal retains data as long as the Modal has a need for its use, or to meet regulatory or contractual requirements. Once data is no longer needed, it is securely disposed of or archived.」。security 页公布的对象级期限是文档层披露，不是合同层上限。"
anchor = "modal-tos-dpa-schedule-2-limited-retention"

[[product.retention.point]]
text = "Contract-layer carve-out that also touches training: §1.11 opens with \"Notwithstanding anything to the contrary\" and lets Modal \"collect and use Service Metrics for its own business purposes during the term of this Agreement and thereafter\". Service Metrics are defined as data used in an aggregate and/or permanently anonymized manner that does not identify an individual or Customer, with safeguards prohibiting re-identification, and they are not Customer Data — so the no-training and deletion promises are not absolute at the contract layer, but this carve-out does not reach Customer Data."
text_zh = "同时涉及 training 的合同层例外：§1.11 以「Notwithstanding anything to the contrary」开头，允许 Modal「collect and use Service Metrics for its own business purposes during the term of this Agreement and thereafter」。Service Metrics 定义为以聚合和/或永久匿名方式使用、不识别个人或客户、并有禁止再识别保障的数据，且不含 Customer Data——故合同层的不训练与删除承诺并非绝对，但该例外不及于 Customer Data。"
anchor = "modal-tos-1-11-service-metrics-carve-out"

[product.processing_region]
codes = ["US", "global"]
anchor = "modal-data-residency-shared-endpoints-us-west"

[[product.processing_region.point]]
text = "The data-residency page: for Shared Endpoints, neither the container region nor the routing region is selectable"
text_zh = "data-residency 页：Shared Endpoints 的容器区域与路由区域均不可选"

[[product.processing_region.point]]
text = "Footnote: \"Shared Endpoints route through us-west, and containers are distributed across Modal’s global compute pool\" — routing is fixed to us-west, but the containers that process the workload are spread over Modal's global compute pool, so processing is not confined to the United States. Logs and durable storage (Images, Volumes, Dicts, Queues, Secrets) do stay in the United States."
text_zh = "脚注「Shared Endpoints route through us-west, and containers are distributed across Modal's global compute pool」——路由固定经 us-west，但跑工作负载的容器分布在 Modal 全球算力池，故处理地不限于美国。日志与持久存储（Images/Volumes/Dicts/Queues/Secrets）仍在美国。"

[[product.processing_region.point]]
text = "The shared-endpoints page is to the same effect. So neither the container region nor the routing region is selectable on this tier, and customers with hard data residency requirements must switch to Dedicated Endpoints."
text_zh = "shared-endpoints 页同旨。即本档容器区域与路由区域均不可选，对数据驻留有硬要求的客户须改用 Dedicated Endpoints。"

[product.role]
kind = "processor"
anchor = "modal-tos-dpa-2-3-1-service-provider"

[[product.role.point]]
text = "Same as top-level role. The operator of this tier is Modal itself (Modal hosts the compute pool and Modal bills), with no \"third-party technical support provider\" style resale layer"
text_zh = "同顶层 role。本档的运营主体是 Modal 自己（Modal 托管算力池、Modal 计费），不存在「第三方技术支持商」式的转售层"

[[product.role.point]]
text = "Whether requests are forwarded to the original model vendor is disclosed neither in the documentation nor in the subprocessor list (which holds only cloud hosting providers and logging/monitoring/data-warehouse vendors). This is the unverified item for role on this tier."
text_zh = "请求是否转发给模型原厂，官方文档与 subprocessor 名单中均无披露（名单只有云托管商与日志/监控/数据仓库类）。这是本档 role 的未核项。"

[[product.role.point]]
text = "Kept alongside the processor characterisation: DPA Appendix 1 also incorporates SCC Module 1, \"Transfer controller to controller ... apply where Modal Processes Personal Data as a Controller\". That is a specific situation defined by the SCC annex (Modal and its Affiliates in non-adequacy approved third countries, Customer established in the EEA) and does not displace the processor characterisation for the service processing above."
text_zh = "与 processor 定性并列保留：DPA Appendix 1 同时纳入 SCC Module 1「Transfer controller to controller … apply where Modal Processes Personal Data as a Controller」。这是 SCC 附录界定的特定场景（Modal 及其关联方位于未获充分性认定的第三国、客户设立于 EEA），不取代前述服务处理上的 processor 定性。"
anchor = "modal-tos-dpa-scc-module-1-controller"

