[[product.training.point]]
text = "Same as top-level training."
text_zh = "同顶层 training。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "modal-security-inference-endpoints-zdr"

[[product.zdr.point]]
text = "Same as endpoints-shared: zero retention on the payload path."
text_zh = "同 endpoints-shared：payload 路径零保留。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "modal-data-residency-endpoints-servers-no-payload-storage"

[[product.retention.point]]
text = "Request and response payloads are not stored (\"Dedicated Endpoints, Shared Endpoints, and Servers do not store request and response payloads\"), so the payload path carries no period at all."
text_zh = "请求与响应 payload 不存储（「Dedicated Endpoints, Shared Endpoints, and Servers do not store request and response payloads」），payload 路径本身没有任何期限。"
anchor = "modal-data-residency-endpoints-servers-no-payload-storage"

[[product.retention.point]]
text = "The log periods are the unquantified item here: the security page row gives numbers only for the lower plans (\"1 day on Starter, 30 days on Team\") and says \"configurable on Enterprise\", while audit logs are \"Per Enterprise contract\". This tier is plan_level=enterprise, so the 30-day figure is the Team plan's number and the enterprise log and audit-log periods are set by contract with no public number. Metadata is stored for the lifetime of the account; customer-supplied weights and custom images live in Images and Volumes, which is durable storage (retained until the customer deletes them)."
text_zh = "日志期限是本档的未量化项：security 页该行只给低档数字（「1 day on Starter, 30 days on Team」）并写「configurable on Enterprise」，审计日志为「Per Enterprise contract」。本档 plan_level=enterprise，故 30 天是 Team 档数字，企业档日志与审计日志期限由合同约定、公开文档无数字。元数据随账户存续；客户自带权重与自定义镜像存放在 Images/Volumes，属持久存储（客户删除前保留）。"
anchor = "modal-security-retention-logs-plan-dependent"

[[product.retention.point]]
text = "The contract layer sets no ceiling on retention: DPA Schedule 2 states \"Modal retains data as long as the Modal has a need for its use, or to meet regulatory or contractual requirements. Once data is no longer needed, it is securely disposed of or archived.\" The object-level periods published on the security page are documentation-layer disclosures, not a contractual maximum."
text_zh = "合同层不设保留上限：DPA Schedule 2 写明「Modal retains data as long as the Modal has a need for its use, or to meet regulatory or contractual requirements. Once data is no longer needed, it is securely disposed of or archived.」。security 页公布的对象级期限是文档层披露，不是合同层上限。"
anchor = "modal-tos-dpa-schedule-2-limited-retention"

[[product.retention.point]]
text = "Contract-layer carve-out that also touches training: §1.11 opens with \"Notwithstanding anything to the contrary\" and lets Modal \"collect and use Service Metrics for its own business purposes during the term of this Agreement and thereafter\". Service Metrics are defined as data used in an aggregate and/or permanently anonymized manner that does not identify an individual or Customer, with safeguards prohibiting re-identification, and they are not Customer Data — so the no-training and deletion promises are not absolute at the contract layer, but this carve-out does not reach Customer Data."
text_zh = "同时涉及 training 的合同层例外：§1.11 以「Notwithstanding anything to the contrary」开头，允许 Modal「collect and use Service Metrics for its own business purposes during the term of this Agreement and thereafter」。Service Metrics 定义为以聚合和/或永久匿名方式使用、不识别个人或客户、并有禁止再识别保障的数据，且不含 Customer Data——故合同层的不训练与删除承诺并非绝对，但该例外不及于 Customer Data。"
anchor = "modal-tos-1-11-service-metrics-carve-out"

