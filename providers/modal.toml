text_zh = "同时涉及 training 的合同层例外：§1.11 以「Notwithstanding anything to the contrary」开头，允许 Modal「collect and use Service Metrics for its own business purposes during the term of this Agreement and thereafter」。Service Metrics 定义为以聚合和/或永久匿名方式使用、不识别个人或客户、并有禁止再识别保障的数据，且不含 Customer Data——故合同层的不训练与删除承诺并非绝对，但该例外不及于 Customer Data。"
