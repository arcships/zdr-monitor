id = "endpoints-dedicated"
badge = "专属端点"
category = "api"
plan_level = "enterprise"

[product.training]
mark = "yes"
anchor = "modal-tos-5-5-4-no-training-without-consent"
mode = "by_contract"

[[product.training.point]]
text = "Same as top-level training."
text_zh = "同顶层 training。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "modal-security-inference-endpoints-zdr"

[[product.zdr.point]]
text = "Same as endpoints-shared: zero retention on the payload path."
text_zh = "同 endpoints-shared：payload 路径零保留。"

[product.retention]
days = 30
object = "mixed"
basis = "fixed_period"
anchor = "modal-data-residency-endpoints-servers-no-payload-storage"

[[product.retention.point]]
text = "Same as endpoints-shared: payloads are not stored"
text_zh = "同 endpoints-shared：payload 不存储"

[[product.retention.point]]
text = "Logs are plan-dependent and metadata lasts for the lifetime of the account. Customer-supplied weights and custom images live in Images and Volumes, which is durable storage (retained until the customer deletes them)."
text_zh = "日志按套餐、元数据随账户存续。客户自带权重与自定义镜像存放在 Images/Volumes，属持久存储（客户删除前保留）。"

[product.processing_region]
codes = ["selected"]
anchor = "modal-tos-1-9-processing-locations"

[[product.processing_region.point]]
text = "The data-residency page table: for Endpoints (Dedicated), both container region and routing region are Yes"
text_zh = "data-residency 页表格：Endpoints (Dedicated) 容器区域与路由区域均为 Yes"

[[product.processing_region.point]]
text = "Region pinning is strict. Durable storage and logs remain in the United States (same data-residency page)."
text_zh = "区域锁定严格。持久存储与日志仍在美国（同 data-residency 页）。"

[product.role]
kind = "processor"
anchor = "modal-tos-dpa-2-3-1-service-provider"

[[product.role.point]]
text = "Same as top-level role."
text_zh = "同顶层 role。"

[[product]]
id = "enterprise"
badge = "企业版"
category = "api"
plan_level = "enterprise"

[product.training]
mark = "yes"
anchor = "modal-tos-5-5-4-no-training-without-consent"
mode = "by_contract"

[[product.training.point]]
text = "Same as top-level training. The difference on the enterprise tier is that the §5.5.4 exception, \"Customer's prior written consent\", can be extended through a Service Order or a separate written authorization — that is, an arrangement of the form \"may be used for training with written consent\" is more likely to arise on the enterprise tier, but the public terms disclose no authorization that is on by default."
text_zh = "同顶层 training。企业档的差异在 §5.5.4 的例外「Customer's prior written consent」可通过 Service Order 或单独书面授权扩展——即企业档更容易出现「经书面同意可用于训练」的约定，但公开条款未披露任何默认开启的授权。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "modal-security-inference-endpoints-zdr"

[[product.zdr.point]]
text = "Consistent with the self-serve tiers: the payload path for Endpoints and Servers is zero retention by default, and Functions have no zero retention. No separate ZDR commitment text was found for the enterprise tier."
text_zh = "与自助档一致：Endpoints/Servers 的 payload 路径默认零保留，Functions 无零保留。未发现企业档另有独立的 ZDR 承诺文本。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "modal-security-retention-logs-plan-dependent"

[[product.retention.point]]
text = "On the enterprise tier, app and container log retention is \"configurable on Enterprise\" and audit logs are \"Per Enterprise contract\" — both sit in the contract and the public documentation gives no numbers, so this is recorded as unspecified. The periods for the other objects are the same as on the self-serve tiers (Function inputs and outputs up to 7 days, payloads not written to disk, metadata for the lifetime of the account). In the BAA scenario there are further exclusions: Volumes v1, Images (not including Filesystem and Directory Snapshots), Memory Snapshots and user code fall outside the BAA commitment."
text_zh = "企业档的应用/容器日志保留期「configurable on Enterprise」，审计日志「Per Enterprise contract」——两项都落在合同里，公开文档不给数字，故记 unspecified。其余对象的期限与自助档相同（函数输入输出 ≤7 天、payload 不落盘、元数据随账户存续）。BAA 场景下另有排除项：Volumes v1、Images（不含 Filesystem/Directory Snapshots）、Memory Snapshots 与用户代码不在 BAA 承诺范围内。"

[product.processing_region]
codes = ["selected", "US"]
anchor = "modal-tos-1-9-processing-locations"

[[product.processing_region.point]]
text = "Same as top-level processing_region. The enterprise tier can obtain more granular container region definitions (region-selection page: \"Need access to more granular region definitions? Contact sales@modal.com\"), but the public documentation gives no list."
text_zh = "同顶层 processing_region。企业档可获得更细粒度的容器区域定义（region-selection 页「Need access to more granular region definitions? Contact sales@modal.com」），但公开文档未给清单。"

[product.role]
kind = "processor"
anchor = "modal-tos-dpa-2-3-1-service-provider"

[[product.role.point]]
text = "Same as top-level role. The enterprise tier also has a BAA path (security page: Modal is the business associate where you are processing PHI on Modal, and the BAA is offered on Enterprise), consistent with the processor characterization."
text_zh = "同顶层 role。企业档另有 BAA 路径（security 页：Modal 在 PHI 场景下自认 business associate，BAA 在企业版提供），与 processor 定性一致。"

