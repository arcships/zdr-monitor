mode = "by_contract"

[[product.training.point]]
text = "Same as top-level training. The difference on the enterprise tier is that the §5.5.4 exception, \"Customer's prior written consent\", can be extended through a Service Order or a separate written authorization — that is, an arrangement of the form \"may be used for training with written consent\" is more likely to arise on the enterprise tier, but the public terms disclose no authorization that is on by default."
text_zh = "同顶层 training。企业档的差异在 §5.5.4 的例外「Customer's prior written consent」可通过 Service Order 或单独书面授权扩展——即企业档更容易出现「经书面同意可用于训练」的约定，但公开条款未披露任何默认开启的授权。"

[product.zdr]
mark = "no"
anchor = "modal-security-retention-inputs-outputs-7d"

[[product.zdr.point]]
text = "Zero retention exists only on the Endpoints/Servers payload path and does not cover this tier as a whole: Function inputs and outputs are retained for up to 7 days (the security page table row \"Up to 7 days, then deleted\", and the section below it, \"Both are deleted within a maximum TTL of 7 days\"), and this tier still includes Functions. No separate ZDR commitment text was found for the enterprise tier."
text_zh = "零保留只存在于 Endpoints/Servers 的 payload 路径，不覆盖整档：Functions 的输入输出有上限 7 天的留存（security 页表行「Up to 7 days, then deleted」，同页下一节「Both are deleted within a maximum TTL of 7 days」），而本档仍含 Functions。未发现企业档另有独立的 ZDR 承诺文本。"
anchor = "modal-security-retention-inputs-outputs-7d"

[[product.zdr.point]]
text = "On the payload path the security page is explicit: request and response payloads for Server and Auto Endpoints are \"Not stored — proxied directly to your container\", and the Modal Inference endpoints section says those endpoints are zero data retention. Logs and metadata are not part of that path."
text_zh = "payload 路径上 security 页明确：Server 与 Auto Endpoints 的请求响应 payload「Not stored — proxied directly to your container」，Modal Inference endpoints 节亦称其为零数据保留。日志与元数据不在该路径内。"
anchor = "modal-security-retention-endpoint-payloads-not-stored"

[product.retention]
days = 7
object = "input_output"
basis = "fixed_period"
anchor = "modal-security-retention-inputs-outputs-7d"

[[product.retention.point]]
text = "Input and output content on the enterprise tier keeps the same period as the self-serve tiers: Function inputs and outputs are \"Up to 7 days, then deleted\", with the section below stating they are \"deleted within a maximum TTL of 7 days\"."
text_zh = "企业档的输入输出正文期限与自助档相同：Functions 的输入输出「Up to 7 days, then deleted」，其下小节写明「deleted within a maximum TTL of 7 days」。"
anchor = "modal-security-retention-inputs-outputs-7d"

[[product.retention.point]]
text = "The other objects are documented object by object and are not undisclosed: request and response payloads for Server and Auto Endpoints are \"Not stored — proxied directly to your container\"; app, function and container metadata is \"Stored for the lifetime of your account\"; Volumes and Images are \"Persistent until you delete them\"; memory snapshots 7 days after creation; filesystem and directory snapshots 30 days after creation (configurable); Dict entries 7 days after last read or write; Queue partitions have a configurable per-partition TTL (default 24 hours)."
text_zh = "其余对象在文档里是逐项给了期限的，并非未公布：Server 与 Auto Endpoints 的请求响应 payload「Not stored — proxied directly to your container」；应用/函数/容器元数据「Stored for the lifetime of your account」；Volumes 与 Images「Persistent until you delete them」；内存快照 7 天；文件系统与目录快照 30 天（可配置）；Dict 条目 7 天；Queue 分区 TTL 可配置（默认 24 小时）。"

[[product.retention.point]]
text = "The one genuinely unquantified item on this tier is logs: app and container log retention is \"configurable on Enterprise\" and audit logs are \"Per Enterprise contract\", so both are set by contract with no public number — the security page's \"1 day on Starter, 30 days on Team\" figures belong to the lower plans."
text_zh = "本档真正未量化的只有日志：应用/容器日志保留期「configurable on Enterprise」，审计日志「Per Enterprise contract」，两者都由合同约定、公开文档无数字——security 页的「1 day on Starter, 30 days on Team」是低档数字。"
anchor = "modal-security-retention-logs-plan-dependent"

[[product.retention.point]]
text = "In the BAA scenario there are further exclusions: Volumes v1, Images (not including Filesystem and Directory Snapshots), Memory Snapshots and user code fall outside the BAA commitment."
text_zh = "BAA 场景下另有排除项：Volumes v1、Images（不含 Filesystem/Directory Snapshots）、Memory Snapshots 与用户代码不在 BAA 承诺范围内。"

[[product.retention.point]]
text = "The contract layer sets no ceiling on retention: DPA Schedule 2 states \"Modal retains data as long as the Modal has a need for its use, or to meet regulatory or contractual requirements. Once data is no longer needed, it is securely disposed of or archived.\" The object-level periods published on the security page (7 days, 30 days, and so on) are documentation-layer disclosures, not a contractual maximum."
text_zh = "合同层不设保留上限：DPA Schedule 2 写明「Modal retains data as long as the Modal has a need for its use, or to meet regulatory or contractual requirements. Once data is no longer needed, it is securely disposed of or archived.」。security 页公布的对象级期限（7 天、30 天等）是文档层披露，不是合同层上限。"
anchor = "modal-tos-dpa-schedule-2-limited-retention"

