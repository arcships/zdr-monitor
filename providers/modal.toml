[[product.processing_region.point]]
text = "The data-residency page table: for Endpoints (Dedicated), both container region and routing region are Yes"
text_zh = "data-residency 页表格：Endpoints (Dedicated) 容器区域与路由区域均为 Yes"

[[product.processing_region.point]]
text = "Region pinning is strict. Durable storage and logs remain in the United States (same data-residency page)."
text_zh = "区域锁定严格。持久存储与日志仍在美国（同 data-residency 页）。"

