[[product.zdr.point]]
text = "Same as top-level zdr: zero retention is not supported (no); see the top level for the reasoning chain. All three grounds take the form \"this line says X, therefore Y\": (1) the Prompt Cache doc says X, \"when a request is completely identical to a historical prompt, the system returns the cached result directly\" — the object is request content (the historical prompt), therefore Y, the platform retains request content on the inference side, and \"transparent to the application\" shows this is not a customer-facing switch; the whole page gives no TTL, no purge rule and no way to turn it off"
text_zh = "同顶层 zdr：不支持零保留（no），判断链见顶层。三条依据都是「这条说的是 X，所以 Y」：①Prompt Cache 文档说的是 X「当请求与历史 Prompt 完全一致时，系统会直接返回缓存结果」——对象是请求内容（历史 Prompt），所以 Y 平台在推理侧保留了请求内容，且「对应用透明」说明它不是客户开关，全篇无 TTL/清除规则/关闭方式"

[[product.zdr.point]]
text = "(2) Model Privacy Policy §5.3.3 says X, \"we may not be able to delete the corresponding information from our backup systems immediately\" — an admission that backups exist and that deletion is delayed, therefore Y, the \"no recoverable copy\" requirement of zero retention does not hold"
text_zh = "②《模型隐私政策》§5.3.3 说的是 X「可能无法立即从备份系统中删除相应的信息」——自认存在备份且删除有延迟，所以 Y 零保留要求的「无副本可恢复」不成立"

[[product.zdr.point]]
text = "(3) the Batch Inference doc says X, \"the file will be retained for 15 days\" and \"the result output file will be deleted 30 days after batch inference finishes\" — therefore Y, on the batch tier request content is retained 15 days and output 30 days. For the contrary sentence see docs/model/FAQs (\"a stateless interface ... does not save the full conversation content of each request\"; that source has been judged drop and its anchor cleared): it says the console does not provide full conversation records (the qualifier is \"full\" and the context is \"how to view API call records\"), not \"the platform retains no request content\", which is not enough to overturn (1) and does not contradict (1) on the same proposition. The retention policy of the upstream technical support provider (User Agreement §8.6) is not disclosed; this conclusion covers only the PPIO hop."
text_zh = "③《批量推理》文档说的是 X「该文件将保留 15 天」「结果输出文件将在批量推理结束后 30 天删除」——所以 Y 批量档请求内容保留 15 天、输出 30 天。反向句见 docs/model/FAQs（「无状态接口…不会保存每次请求的完整对话内容」，该源已判 drop、锚点清空）：它说的是控制台不提供完整对话记录（限定词「完整」、语境为「如何查看 API 调用记录」），不是「平台不保留任何请求内容」，不足以推翻①，也不与①构成同一命题的矛盾。上游技术支持商（《用户协议》§8.6）的保留策略未披露，本结论只覆盖 PPIO 这一跳。"

