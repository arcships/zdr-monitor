[[anchor]]
id = "lovable-training-content-optout"
source_id = "f7c0e7c1ff82f9de"
topics = ["training"]
[anchor.selector]
prefix = "**What we use.** "
exact = "We use Customer Content and Usage Data — which may include Personal Data — to train, develop, fine-tune, and improve our AI models and AI-powered features, including models we operate within the Services and models we may make available to customers through Lovable products such as the AI Gateway."
suffix = " Trained members of our team may review this content"
[[anchor]]
id = "lovable-dpa-no-training"
source_id = "3ad4e9e2dbacc3f6"
topics = ["training"]
[anchor.selector]
prefix = ""
exact = "Lovable shall not use any Customer Personal Data for the purpose of training, retraining, fine-tuning, or otherwise developing any Artificial Intelligence (AI) or Machine Learning (ML) models."
suffix = ""
[[anchor]]
id = "lovable-logs-as-needed"
source_id = "f7c0e7c1ff82f9de"
topics = ["retention"]
[anchor.selector]
prefix = ""
exact = "**Operational and security logs** — kept for as long as needed to run and secure the Services, and longer where we are investigating an incident."
suffix = ""
[[anchor]]
id = "lovable-dpa-delete-30d"
source_id = "3ad4e9e2dbacc3f6"
topics = ["retention"]
[anchor.selector]
prefix = ""
exact = "Within thirty (30) calendar days after the termination of the Agreement the Customer may instruct Lovable, in writing, to return or delete all Customer Personal Data then in Lovable's possession or control, unless Applicable Data Protection Laws require storage of the Customer Personal Data."
suffix = ""
[[anchor]]
id = "lovable-region-sweden-us"
