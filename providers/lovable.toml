name = "Lovable"
line = "lovable"
site = "global"
plan_levels = ["free", "individual", "team", "enterprise"]
entity = "Lovable Labs Sweden AB"
endpoint = ""
doc = "https://lovable.dev/privacy"

[[source]]
url = "https://lovable.dev/privacy"
channel = "consumer_privacy"
tier = "core"
note = "现行 Privacy Policy。Free/Pro 默认可训练且可免费 opt-out；Business/Enterprise 排除。项目随服务运行保留，日志按需；处理含美国。Cookie Preferences 只能停止未来 session recording，并非运营 telemetry 总开关。"
[[source]]
url = "https://docs.lovable.dev/features/business/data-opt-out"
channel = "developer_data"
tier = "core"
note = "官方按档说明：Free/Pro 的 prompts、附件、代码、项目文件、输出与 usage data 可用于训练；Business/Enterprise 默认排除。"
[[source]]
url = "https://lovable.dev/data-processing-agreement"
channel = "contract"
tier = "core"
note = "Business/Enterprise 自动适用 DPA；明确 processor、禁止 Customer Personal Data 训练、终止后的 30 天指示窗口。Annex 涵盖 storage/compilation/scanning/indexing，但不量化向量索引或缓存期限。"

[[product]]
id = "free"
badge = "免费版"
category = "coding_plan"
plan_level = "free"
[product.training]
mark = "no"
mode = "opt_out"
anchor = "lovable-training-content-optout"
[[product.training.point]]
text = "The opt-out is prospective only: content is excluded from training data assembled after the opt-out takes effect, and deletion does not retract content from training datasets assembled, or models trained, before the request took effect."
text_zh = "退出只向前生效：只有退出生效后组装的数据不再包含该内容；删除不会撤回退出请求生效前已组装进训练数据集的内容或已训练的模型。"
anchor = "lovable-training-optout-prospective"
[product.zdr]
mark = "unknown"
searched = ["https://lovable.dev/privacy", "https://docs.lovable.dev/features/business/data-opt-out", "https://lovable.dev/data-processing-agreement"]
[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "lovable-retention-account-content"
[[product.retention.point]]
text = "Object: account and Customer Content (project content, inputs and outputs). Context: default. Kept while the account is open, then deleted or de-identified after it closes or after a verified deletion request, unless the law requires a longer period. No quantified number of days."
text_zh = "对象=账号与 Customer Content（项目内容、输入输出）；语境=默认；账号存续期间保留，账户关闭或经核实的删除请求后删除或去标识，法律另有要求除外；无量化天数。"
anchor = "lovable-retention-account-content"
[[product.retention.point]]
text = "Object: operational and security logs. Context: default, and longer where an incident is being investigated. Kept for as long as needed to run and secure the Services — as-needed retention, not a fixed period."
text_zh = "对象=运营与安全日志；语境=默认，调查事件期间更久；按运行与保障服务所需保留——属按需保留，不是固定期限。"
anchor = "lovable-logs-as-needed"
[[product.retention.point]]
text = "Object: analytics identifiers. Context: default. The Policy states no period for this object and points to lovable.dev/cookie-policy."
text_zh = "对象=分析标识符；语境=默认；政策未给该对象的期限，指向 lovable.dev/cookie-policy。"
anchor = "lovable-retention-analytics"
[[product.retention.point]]
text = "Object: billing and tax records. Context: legal obligation. Kept for the periods accounting and tax law require — a period set by law, not a deletion deadline for content."
text_zh = "对象=计费与税务记录；语境=法律义务；按会计与税法要求的期限保留——期限由法律设定，不是内容删除期限。"
anchor = "lovable-retention-billing"
[[product.retention.point]]
text = "Object: records of notices, consents, opt-outs, and account transfers. Context: evidence of compliance. Kept for as long as a claim or regulatory question about them could still arise."
text_zh = "对象=通知、同意、退出与账户转移记录；语境=合规举证；在相关索赔或监管问题仍可能发生的期间内保留。"
anchor = "lovable-retention-notices"
[product.processing_region]
codes = ["SE", "US", "global"]
anchor = "lovable-region-sweden-us"
[product.role]
kind = "controller"
anchor = "lovable-controller"
[[product.role.point]]
text = "Scope exception: if an account registered with an organization's email address is claimed by that organization (Section 10), the organization controls the account (including sign-in and billing) and its agreement governs it; the organization becomes responsible for deciding how the account data is used and Lovable handles that data on the organization's behalf."
text_zh = "适用范围例外：以组织邮箱注册的账户被该组织认领后（§10），由组织控制账户（含登录与计费）、其与 Lovable 的协议管辖；组织负责决定账户数据如何使用，Lovable 代表组织处理这些数据。"
anchor = "lovable-role-domain-claim"
[[product.role.point]]
text = "Brazil (Section 19): Lovable Labs Sweden AB is the controller of Personal Data processed under this Policy, but after a domain-claim transfer (Section 10) the claiming organization is the controller and Lovable is the operator (operadora)."
text_zh = "巴西（§19）：本政策下处理的个人数据由 Lovable Labs Sweden AB 控制；但发生 §10 的域名认领转移后，认领组织是控制者，Lovable 是操作者（operadora）。"
anchor = "lovable-role-brazil-operator"

