topics = ["processing_region"]
[anchor.selector]
prefix = ""
exact = "Our main establishment is in Stockholm, Sweden and Integritetsskyddsmyndigheten (IMY), the Swedish Authority for Privacy Protection, is our lead supervisory authority. We and our service providers process Personal Data in a number of countries, including the United States."
suffix = ""
