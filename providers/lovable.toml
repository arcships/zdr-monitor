[[product]]
id = "business"
badge = "Business"
category = "coding_plan"
plan_level = "team"
[product.training]
mark = "yes"
mode = "default"
anchor = "lovable-dpa-no-training"
[[product.training.point]]
text = "Scope exception: the DPA's no-training promise covers only Customer Personal Data. Service Data — data relating to the use, support and/or operation of the Services, collected directly by Lovable from and/or about users and/or the Customer's use of the Service for Lovable's own purposes, and including Annex 1's Log Data — may be used for training or tuning proprietary machine-learning models used to deliver the Services."
text_zh = "适用范围例外：DPA 的禁训承诺只覆盖 Customer Personal Data。Service Data（与服务的 use/support/operation 相关、由 Lovable 直接从用户或用户使用服务中收集、用于 Lovable 自身目的的数据；Annex 1 另列 Log Data）可用于训练或调优用于交付服务的自有机器学习模型。"
anchor = "lovable-dpa-service-data-training"
[[product.training.point]]
text = "No opt-out from that exception: the Customer has no right to opt out of Lovable's processing of Service Data (including training on it) so long as it remains a customer of the Services; §9.2 states Service Data is not Customer Personal Data and the DPA's obligations do not apply to Lovable's processing of it."
text_zh = "该例外不可退出：只要仍是服务客户，客户无权退出 Lovable 对 Service Data（含用于训练）的处理；§9.2 明确 Service Data 不是 Customer Personal Data，DPA 义务不适用于 Lovable 对它的处理。"
anchor = "lovable-dpa-service-data-no-optout"
[product.zdr]
mark = "unknown"
searched = ["https://lovable.dev/privacy", "https://docs.lovable.dev/features/business/data-opt-out", "https://lovable.dev/data-processing-agreement"]
[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "lovable-dpa-delete-30d"
[[product.retention.point]]
text = "Object: Customer Personal Data. Context: after termination of the Agreement. Within thirty (30) calendar days the Customer may instruct Lovable in writing to return or delete it — a customer instruction right, not a deletion deadline; §11.1 requires processing to stop immediately on termination, with secure storage permitted."
text_zh = "对象=Customer Personal Data；语境=协议终止后；客户可在 30 个日历日内书面指示返还或删除——属客户指示权，不是删除期限；§11.1 要求终止时立即停止处理，允许继续安全存储。"
anchor = "lovable-dpa-delete-30d"
[[product.retention.point]]
text = "Context: no instruction received within thirty (30) calendar days. Lovable may, at its discretion, permanently delete or irreversibly anonymize the Customer Personal Data in accordance with its documented retention schedule — deletion is at Lovable's discretion, not a committed deadline."
text_zh = "语境=30 个日历日内未收到指示：Lovable 可自行决定按书面保留计划永久删除或不可逆匿名化 Customer Personal Data——删除由 Lovable 裁量，不是承诺的期限。"
anchor = "lovable-dpa-discretion-delete"
[[product.retention.point]]
text = "Exception to deletion: deleted data may persist in backups for a limited time before being permanently removed — no quantified period."
text_zh = "删除的例外：已删除数据可在备份中残留一段时间后才被永久移除——无量化期限。"
anchor = "lovable-dpa-backup-residual"
[[product.retention.point]]
text = "Object: Service Data. Retained indefinitely in an anonymized and aggregated form; §9.2 allows Lovable to retain Service Data for as long as it has a legitimate business need. This object is outside the Customer Personal Data covered by this row's deletion commitment."
text_zh = "对象=Service Data：以匿名聚合形式无限期保留；§9.2 允许 Lovable 在具有正当业务需要的期间内保留 Service Data。该对象不属于本行删除承诺覆盖的 Customer Personal Data。"
anchor = "lovable-dpa-service-data-indefinite"
[product.processing_region]
codes = ["SE", "US", "global"]
anchor = "lovable-region-sweden-us"
[product.role]
kind = "processor"
anchor = "lovable-dpa-processor"

