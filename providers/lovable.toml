channel = "consumer_privacy"
tier = "core"
note = "现行 Privacy Policy。Free/Pro 默认可训练且可免费 opt-out；Business/Enterprise 排除。项目随服务运行保留，日志按需；处理含美国。Cookie Preferences 只能停止未来 session recording，并非运营 telemetry 总开关。"
[[source]]
url = "https://docs.lovable.dev/features/business/data-opt-out"
