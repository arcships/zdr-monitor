tier = "core"
note = "官方按档说明：Free/Pro 的 prompts、附件、代码、项目文件、输出与 usage data 可用于训练；Business/Enterprise 默认排除。"
[[source]]
url = "https://lovable.dev/data-processing-agreement"
channel = "contract"
tier = "core"
note = "Business/Enterprise 自动适用 DPA；明确 processor、禁止 Customer Personal Data 训练、终止后的 30 天指示窗口。Annex 涵盖 storage/compilation/scanning/indexing，但不量化向量索引或缓存期限。"

