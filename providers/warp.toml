name = "Warp"
line = "warp"
site = "global"
plan_levels = ["free", "individual", "team", "enterprise"]
entity = "Denver Technologies, Inc."
endpoint = ""
doc = "https://docs.warp.dev/enterprise/security-and-compliance/security-overview.md"

[[source]]
url = "https://www.warp.dev/privacy"
channel = "consumer_privacy"
tier = "core"
note = "Warp 隐私政策。「Improving, Monitoring and Personalizing the Service」一节明写用途包含 training/fine-tuning 支撑 AI 功能的模型——这是消费档训练口径的来源。第 7 行划出角色边界：已签 DPA 的客户数据由 DPA 而非本通知管辖；第 84 行是消费/团队档处理地的来源（美国 + 其他未列举辖区）；第 82 行是按需保留口径的唯一出处。注意别和 enterprise 安全页那句「不持久保存源码、不用于模型训练」混：那句的对象是自托管部署控制平面里的 your source code。"

[[source]]
url = "https://docs.warp.dev/enterprise/security-and-compliance/security-overview.md"
channel = "developer_data"
tier = "core"
note = "Warp 当前安全总览；覆盖各档遥测默认值与采集开关、上游 ZDR（含第 16 行与第 44 行的适用范围分歧）、ZDR 例外、云对话存储、BYOLLM、自托管控制面、账号删除 30 天及遥测无限期。"

[[source]]
url = "https://www.warp.dev/pricing"
channel = "developer_data"
tier = "core"
note = "Free/Build/Business/Enterprise 档位依据（含各档云对话存储量）。页内另有 marketing 口径的 ZDR 表述（第 178 行、第 157 行），与安全页的适用范围分歧并列保留，不作任何维度的主证据。"

[[product]]
id = "free"
badge = "Free"
category = "coding_plan"
plan_level = "free"
[product.training]
mark = "no"
anchor = "warp-privacy-trains-models"

[[product.training.point]]
text = "The Privacy Notice lists training and fine-tuning the models that support Warp's AI features among the purposes for which personal information is used; the consumer tier is in scope. The purpose list itself gives no route to withdraw from that purpose."
text_zh = "隐私政策把「training, fine-tuning 支撑 AI 功能的模型」写进用途清单，消费档适用；用途清单本身没有给退出「用于训练」这一用途的途径。"
anchor = "warp-privacy-trains-models"

[[product.training.point]]
text = "Do not read the enterprise security page's source-code sentence as Warp's own purpose commitment for this tier: its object is your source code in the self-hosted deployment control plane (see the Enterprise row), not how consumer data is used."
text_zh = "别把 enterprise 安全页那句「Warp does not persistently store your source code or use it for model training」当作 Warp 对消费档数据的用途承诺——那句的对象是自托管部署控制平面里的 your source code（见 Enterprise 一行的依据）。"
anchor = "warp-control-plane-no-training"

[[product.training.point]]
text = "Collection switch: for AI features such as Active AI and Agent Mode, the prompts and outputs collected can be controlled at any time in your settings. This switch governs collection, not the training/fine-tuning purpose listed above — no opt-out from that purpose is disclosed."
text_zh = "采集开关：Active AI、Agent Mode 等 AI 功能的输入输出，可在设置里随时控制是否收集。该开关控制的是「采集」，不是上面那条训练/微调用途——针对训练用途没有披露退出途径。"
anchor = "warp-ai-io-collection-control"

[[product.training.point]]
text = "Free tier: individual users can disable data collection in Settings > Privacy. The switch covers telemetry and crash reporting, not the AI training purpose above."
text_zh = "Free 档：个人用户可在 Settings > Privacy 关闭数据收集。该开关针对遥测与崩溃上报，不涉及上面的训练用途。"
anchor = "warp-telemetry-free-tier-toggle"

[product.zdr]
mark = "no"
anchor = "warp-cloud-storage"

[[product.zdr.point]]
text = "Parallel fact from the same page: Warp has Zero Data Retention (ZDR) agreements with its contracted LLM providers (Anthropic, OpenAI, Google, xAI), meaning they do not store or train on your data, and the page says ZDR applies across all Warp plans. The subject is the contracted LLM providers, not Warp's own retention of your data, and line 44 of the same page limits those ZDR agreements to Enterprise teams. Both scopes are kept side by side; no side is picked."
text_zh = "同页并列事实：Warp 与上游 LLM 厂商（Anthropic、OpenAI、Google、xAI）签有 ZDR 协议，they do not store or train on your data，并自称「ZDR applies across all Warp plans」。该句约束的是上游厂商、不是 Warp 自身对数据的保留；同页第 44 行又把 ZDR 协议限定为 Enterprise teams——两种适用范围并列保留，不选边。"
anchor = "warp-zdr-upstream"

[[product.zdr.point]]
text = "ZDR exception: some models carry provider-specific data retention requirements and are therefore not covered by ZDR. By its own wording the clause is stated for Enterprise teams only (off by default; a workspace admin must explicitly enable them in the Admin Panel); this tier is outside that wording and the page says nothing about the exception here."
text_zh = "ZDR 例外：部分模型带厂商特定保留要求、不在 ZDR 覆盖内。按原文该例外只声明适用于 Enterprise teams（默认关闭，需工作区管理员在 Admin Panel 显式开启）；本档不在其表述范围内，原文对本档未表态。"
anchor = "warp-zdr-exception"

[[product.zdr.point]]
text = "Parallel fact from the pricing page (marketing wording, no tier split): Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers: no customer data is retained, stored, or used for training. Kept side by side with the security page's scope divergence; the pricing page ranks below developer_data and consumer_privacy and does not override this row."
text_zh = "价格页并列事实（marketing 表述、未区分档位）：「Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers: no customer data is retained, stored, or used for training.」与安全页第 16/44 行的适用范围分歧一并保留；价格页权威性低于 developer_data 与 consumer_privacy，不覆盖本行结论。"
anchor = "warp-pricing-zdr-marketing"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "warp-privacy-as-needed-retention"

[[product.retention.point]]
text = "Object: personal information generally. Context: default. Duration type: as-needed — the Privacy Notice's Data Retention section decides the period by criteria (how long the information stays relevant; how long records are reasonable to demonstrate fulfilled duties; limitation periods; retention periods prescribed by law or regulators; the contract type; Warp's business interest), not by a fixed period."
text_zh = "对象=个人信息总体；语境=默认；期限类型=按需——隐私政策 Data Retention 节按标准判定期限（信息保持相关的时间、为证明履约需留档的合理时间、索赔时效、法律或监管规定的保留期、合同类型与业务利益），不是固定期限。"
anchor = "warp-privacy-as-needed-retention"

[[product.retention.point]]
text = "Object: telemetry data. Context: when collection is on. Duration type: indefinite — Warp states it retains telemetry data indefinitely for analytics and debugging, with no deletion commitment for this object."
text_zh = "对象=遥测数据；语境=采集开启时；期限类型=无限期——原文写 Warp retains telemetry data indefinitely for analytics and debugging，本对象没有删除承诺。"
anchor = "warp-telemetry-indefinite"

[[product.retention.point]]
text = "Object: cloud conversations and cloud agent runs. Context: features that require storing conversation data to function. Duration type: not quantified — the page states the storage is required and that it is separate from analytics or telemetry collection, but gives no period."
text_zh = "对象=云对话与云 agent run；语境=功能必需（原文 require storing conversation data to function）；期限类型=未量化——只说明必须存储、且与 analytics/telemetry 采集分开，未给期限。"
anchor = "warp-cloud-storage"

[[product.retention.point]]
text = "Object: user account data. Context: a verified deletion request. Duration type: upper bound — deletion requests are processed within 30 days at no cost. This is the only quantified deletion period on the page and it is not a retention period for inputs and outputs."
text_zh = "对象=账号数据；语境=经身份验证的删除请求；期限类型=上限——删除请求 30 天内处理完毕、不收费。这是全文唯一的量化删除期限，不能当作输入输出正文的保留期限。"
anchor = "warp-account-deletion-30d"

[product.processing_region]
codes = ["US", "global"]
searched = ["https://docs.warp.dev/enterprise/security-and-compliance/security-overview.md", "https://www.warp.dev/privacy"]
anchor = "warp-region-us-other-jurisdictions"

[[product.processing_region.point]]
text = "In the context of providing the Service, personal information may be transferred to Warp's affiliates and service providers in the United States and other jurisdictions. The other jurisdictions are not enumerated and no processing region is stated per tier, so this row records US plus the unenumerated remainder."
text_zh = "服务语境下个人信息可能转移至美国的关联方与服务商以及其他司法辖区；其余辖区未逐一举列、原文也未按产品档位声明处理地，故记 US + 其余未列举辖区。"
anchor = "warp-region-us-other-jurisdictions"

[product.role]
kind = "controller"
anchor = "warp-privacy-dpa-exclusion"

[[product.role.point]]
text = "Role boundary: the Privacy Notice does not apply to personal information Warp processes on behalf of customers that have entered into a data processing agreement; in that case the DPA governs. This tier is not in that carve-out, so the notice governs and Warp is the controller of the data it collects for the services it offers on its own behalf."
text_zh = "角色分界：隐私政策不适用于 Warp 按客户 DPA 受托处理的数据（此时由 DPA 管辖）。本档不在该排除范围内，故由本通知管辖，Warp 为自己提供的服务收集使用个人信息，即独立控制者。"
anchor = "warp-privacy-dpa-exclusion"

[[product.role.point]]
text = "Self-description: in this notice Warp means Denver Technologies, Inc. d.b.a. Warp, and Service means all of the services Warp offers on its own behalf."
text_zh = "自述：本通知中的 Warp 指 Denver Technologies, Inc. d.b.a. Warp，Service 指 Warp 为自己提供的全部服务——即以独立控制者身份处理消费档数据。"
anchor = "warp-privacy-controller-self"

