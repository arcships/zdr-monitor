tier = "core"
note = "Warp 隐私政策。「Improving, Monitoring and Personalizing the Service」一节明写用途包含 training/fine-tuning 支撑 AI 功能的模型——这是消费档训练口径的来源。第 7 行划出角色边界：已签 DPA 的客户数据由 DPA 而非本通知管辖；第 84 行是消费/团队档处理地的来源（美国 + 其他未列举辖区）；第 82 行是按需保留口径的唯一出处。2026-11-18 安全页改版删除了原自托管控制平面那句「不持久保存源码、不用于模型训练」，本页不再用于反证该句。"

[[source]]
url = "https://docs.warp.dev/enterprise/security-and-compliance/security-overview.md"
channel = "developer_data"
tier = "core"
note = "Warp 安全总览；2026-11-18 改版后把上游 ZDR、分析采集与产品存储转引到 Privacy and data control，只保留遥测无限期、账号删除 30 天、自托管控制面会话记录持久化、BYOLLM 路由及云推理/存储边界。原按档遥测默认值、上游 ZDR 句、ZDR 例外细节、云对话存储说明、BYOLLM 不存储句、自托管控制面不训练句与 GCP 数据中心句均已删除。"

[[source]]
url = "https://www.warp.dev/pricing"
channel = "developer_data"
tier = "core"
note = "Free/Build/Max/Business/Enterprise 与 Factories Start/Scale/Enterprise 档位依据（含各档云对话存储量）。2026-11-18 改版新增 Pricing FAQ：ZDR 协议覆盖 Anthropic、OpenAI、Google、xAI 与 Fireworks AI；受支持模型不用于训练，提示词与输出须在响应生成后的固定期限内删除；ZDR 只适用于 Warp-provided inference，自有账号请求按厂商条款；任何用户可关闭 Help Improve Warp 启用 full ZDR，Business/Enterprise 管理员可全员强制。FAQ 同时写明 paid plans 的顶级开源模型由 Fireworks AI 在美国托管。原 marketing ZDR 句保留。"

[[source]]
url = "https://docs.warp.dev/support-and-community/privacy-and-security/privacy.md"
channel = "developer_data"
tier = "core"
note = "Warp-wide Privacy and data control 页；安全页把上游 ZDR、分析采集与产品存储指向这里。正文区分 provider ZDR（仅 Warp-managed inference、受支持模型）、Help improve Warp 采集控制与产品存储，并写明采集偏好不改变厂商保留要求、也不关闭产品存储。2026-11-18 新登记，待 bot 抓回快照后再写引文。"

[[source]]
url = "https://docs.warp.dev/agents/inference/model-choice.md"
channel = "developer_data"
tier = "core"
note = "模型清单；列出需厂商保留、不受 ZDR 覆盖的模型，并写明该清单适用于 Warp Terminal 与 factory run 的 Warp-managed inference。2026-11-18 新登记，待 bot 抓回快照后再写引文。"

[[source]]
url = "https://docs.warp.dev/factories/zero-data-retention.md"
channel = "developer_data"
tier = "core"
note = "Factory 推理的 ZDR 指南；写明 Warp 保存 transcripts / prompt attachments / artifacts 供回看、销毁沙箱不删除这些记录，且自托管执行不等同厂商 ZDR 或迁移已保存的运行数据。2026-11-18 新登记，待 bot 抓回快照后再写引文。"

[[source]]
