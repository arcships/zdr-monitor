[[product]]
id = "free"
badge = "Free"
category = "coding_plan"
plan_level = "free"
[product.training]
mark = "no"
anchor = "warp-privacy-trains-models"

[[product.training.point]]
text = "The Privacy Notice lists training and fine-tuning the models that support Warp's AI features among the purposes for which personal information is used; the consumer tier is in scope. The purpose list itself gives no route to withdraw from that purpose."
text_zh = "隐私政策把「training, fine-tuning 支撑 AI 功能的模型」写进用途清单，消费档适用；用途清单本身没有给退出「用于训练」这一用途的途径。"
anchor = "warp-privacy-trains-models"

[[product.training.point]]
text = "Collection switch: for AI features such as Active AI and Agent Mode, the prompts and outputs collected can be controlled at any time in your settings. This switch governs collection, not the training/fine-tuning purpose listed above — no opt-out from that purpose is disclosed."
text_zh = "采集开关：Active AI、Agent Mode 等 AI 功能的输入输出，可在设置里随时控制是否收集。该开关控制的是「采集」，不是上面那条训练/微调用途——针对训练用途没有披露退出途径。"
anchor = "warp-ai-io-collection-control"

[[product.training.point]]
text = "Tier control: the pricing page lists Free's data controls as individually configured, and no registered source says the Free settings control switches off the training/fine-tuning purpose. Collection for service improvement is counted as training by this ledger (docs/judgment.md), so the distinction matters: the Privacy Notice's training purpose remains listed, and the registered sources do not tie this switch to withdrawing it."
text_zh = "档位控制：价格页把 Free 的数据控制列为 individually configured，已登记来源也没有说 Free 的设置开关会关闭 training/fine-tuning 用途。按本台账判定口径，为改进服务而进行的内容采集计入训练，故这一区分很重要：隐私政策的训练用途仍在清单里，已登记来源没有把该开关与撤回该用途对应起来。"
anchor = "warp-pricing-data-controls"

[product.zdr]
mark = "no"
anchor = "warp-product-storage"

[[product.zdr.point]]
text = "Provider ZDR scope: Warp has Zero Data Retention agreements with supported LLM providers, including Anthropic, OpenAI, Google, xAI, and Fireworks AI. The agreements cover supported models when Warp supplies the provider account (Warp-managed inference). This is provider retention, not Warp's own product storage."
text_zh = "上游 ZDR 范围：Warp 与受支持的 LLM 厂商（含 Anthropic、OpenAI、Google、xAI、Fireworks AI）签有零数据保留协议；协议适用于 Warp 提供厂商账号（Warp-managed inference）时的受支持模型。该条约束厂商保留，不是 Warp 自身的产品存储。"
anchor = "warp-provider-zdr-scope"

[[product.zdr.point]]
text = "For supported models, the agreements prevent providers from training on customer-generated data processed through Warp and require prompts and outputs to be deleted after the response is generated within a fixed period of time. The length of that period is not stated."
text_zh = "对受支持模型，协议禁止厂商把经 Warp 处理的客户生成数据用于训练，并要求提示词与输出在响应生成后的固定期限内删除；具体时长未写。"
anchor = "warp-provider-no-training"

[[product.zdr.point]]
text = "ZDR exception: the security overview says provider ZDR concerns what AI providers retain, not what Warp stores, and that Model choice lists the model exceptions. The registered snapshots do not reproduce which models are excepted or what retention they require."
text_zh = "ZDR 例外：安全页说 provider ZDR 管的是 AI 厂商保留什么、不是 Warp 存什么，并指向 Model choice 的例外清单。已登记快照没有复述具体哪些模型例外、要求何种保留。"
anchor = "warp-model-choice-exceptions"

[[product.zdr.point]]
text = "Own-account boundary: ZDR applies to Warp-provided inference only. Requests through your own API key, subscription, custom endpoint, or LLM are sent directly to your provider under your own account and terms."
text_zh = "自有账号边界：ZDR 只适用于 Warp 提供的推理；经你自己的 API key、订阅、自定义端点或 LLM 发出的请求，直接按你与厂商的账号和条款处理。"
anchor = "warp-provider-zdr-boundary"

[[product.zdr.point]]
text = "Warp-side storage remains: the security overview says Transcripts can contain code context and persist as product data independently of provider ZDR. This is why the row stays no even where provider ZDR applies."
text_zh = "Warp 侧仍会存储：安全页写明会话记录可含代码上下文、并作为产品数据独立于上游 ZDR 持久化。因此即使上游 ZDR 成立，本行仍为否。"
anchor = "warp-product-storage"

[[product.zdr.point]]
text = "Pricing-page marketing claim, kept as a parallel fact: Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers: no customer data is retained, stored, or used for training. It does not override the provider/product distinction above."
text_zh = "价格页 marketing 表述并列保留：「Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers: no customer data is retained, stored, or used for training.」该句不覆盖上面的厂商保留 / Warp 产品存储之分。"
anchor = "warp-pricing-zdr-marketing"

[[product.zdr.point]]
text = "Pricing FAQ self-service claim: any user can enable full ZDR for their own account by disabling Help Improve Warp. The security overview frames ZDR as provider retention only, so this does not turn off Warp product storage."
text_zh = "价格页 FAQ 自助说法：任何用户都可关闭 Help Improve Warp，为自己的账号启用 full ZDR。安全页把 ZDR 限定为厂商保留，因此这不会关闭 Warp 的产品存储。"
anchor = "warp-pricing-zdr-self-service"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "warp-privacy-as-needed-retention"

[[product.retention.point]]
text = "Object: personal information generally. Context: default. Duration type: as-needed — the Privacy Notice's Data Retention section decides the period by criteria (how long the information stays relevant; how long records are reasonable to demonstrate fulfilled duties; limitation periods; retention periods prescribed by law or regulators; the contract type; Warp's business interest), not by a fixed period."
text_zh = "对象=个人信息总体；语境=默认；期限类型=按需——隐私政策 Data Retention 节按标准判定期限（信息保持相关的时间、为证明履约需留档的合理时间、索赔时效、法律或监管规定的保留期、合同类型与业务利益），不是固定期限。"
anchor = "warp-privacy-as-needed-retention"

[[product.retention.point]]
text = "Object: telemetry data. Context: when collection is on. Duration type: indefinite — Warp states it retains telemetry data indefinitely for analytics and debugging, with no deletion commitment for this object."
text_zh = "对象=遥测数据；语境=采集开启时；期限类型=无限期——原文写 Warp retains telemetry data indefinitely for analytics and debugging，本对象没有删除承诺。"
anchor = "warp-telemetry-indefinite"

[[product.retention.point]]
text = "Object: cloud conversations. Context: product storage; the pricing table lists 30 cloud-stored conversations on Free. Duration type: not quantified — the source states storage, not a period."
text_zh = "对象=云对话；语境=产品存储，价格表列 Free 为 30 条云存储对话；期限类型=未量化——来源只说会存储，未给期限。"
anchor = "warp-pricing-cloud-conversation-storage"

[[product.retention.point]]
text = "Object: prompts and outputs at the contracted LLM provider. Context: Warp-managed inference covered by provider ZDR. Duration type: fixed period after the response — the pricing FAQ requires deletion after the response within a fixed period, without stating the length."
text_zh = "对象=上游 LLM 厂商处的提示词与响应；语境=受 ZDR 覆盖的 Warp-managed inference；期限类型=响应后固定期限内删除——价格页 FAQ 要求在响应生成后的固定期限内删除，未写具体时长。"
anchor = "warp-provider-no-training"

[[product.retention.point]]
text = "Object: user account data. Context: a verified deletion request. Duration type: upper bound — deletion requests are processed within 30 days at no cost. This is not a retention period for inputs and outputs."
text_zh = "对象=账号数据；语境=经身份验证的删除请求；期限类型=上限——删除请求 30 天内处理完毕、不收费。这不是输入输出正文的保留期限。"
anchor = "warp-account-deletion-30d"

[product.processing_region]
codes = ["US", "global"]
searched = ["https://docs.warp.dev/enterprise/security-and-compliance/security-overview.md", "https://www.warp.dev/privacy"]
anchor = "warp-region-us-other-jurisdictions"

[[product.processing_region.point]]
text = "In the context of providing the Service, personal information may be transferred to Warp's affiliates and service providers in the United States and other jurisdictions. The other jurisdictions are not enumerated and no processing region is stated per tier, so this row records US plus the unenumerated remainder."
text_zh = "服务语境下个人信息可能转移至美国的关联方与服务商以及其他司法辖区；其余辖区未逐一举列、原文也未按产品档位声明处理地，故记 US + 其余未列举辖区。"
anchor = "warp-region-us-other-jurisdictions"

[product.role]
kind = "controller"
anchor = "warp-privacy-dpa-exclusion"

[[product.role.point]]
text = "Role boundary: the Privacy Notice does not apply to personal information Warp processes on behalf of customers that have entered into a data processing agreement; in that case the DPA governs. This tier is not in that carve-out, so the notice governs and Warp is the controller of the data it collects for the services it offers on its own behalf."
text_zh = "角色分界：隐私政策不适用于 Warp 按客户 DPA 受托处理的数据（此时由 DPA 管辖）。本档不在该排除范围内，故由本通知管辖，Warp 为自己提供的服务收集使用个人信息，即独立控制者。"
anchor = "warp-privacy-dpa-exclusion"

[[product.role.point]]
text = "Self-description: in this notice Warp means Denver Technologies, Inc. d.b.a. Warp, and Service means all of the services Warp offers on its own behalf."
text_zh = "自述：本通知中的 Warp 指 Denver Technologies, Inc. d.b.a. Warp，Service 指 Warp 为自己提供的全部服务——即以独立控制者身份处理消费档数据。"
anchor = "warp-privacy-controller-self"

