text = "Parallel fact from the pricing page: paid plans include frontier models from OpenAI, Anthropic, Google, and xAI, plus top open-source models hosted on Fireworks AI in the US. This covers Warp-managed open-source models on paid plans, not data processed under the enterprise DPA, so the row records US alongside the unenumerated remainder."
text_zh = "价格页并列事实：paid plans 含 OpenAI、Anthropic、Google、xAI 的前沿模型，以及由 Fireworks AI 在美国托管的顶级开源模型。该句只覆盖付费档的 Warp-managed 开源模型，不覆盖企业 DPA 下的数据，故本行在未列举部分之外记 US。"
anchor = "warp-pricing-fireworks-us"

[product.role]
kind = "processor"
anchor = "warp-privacy-dpa-exclusion"

[[product.role.point]]
text = "The only role allocation in the registered sources is the Privacy Notice's DPA carve-out: enterprise customers normally enter into a data processing agreement, and personal information processed on their behalf is governed by that agreement rather than by the notice — which puts Warp on the processor side. A positive processor clause would need the enterprise DPA or Trust Center terms registered as a source and snapshotted first; a data-use commitment is not used here as a substitute."
text_zh = "已登记来源中唯一的角色分配是隐私政策的 DPA 排除句：企业档通常签 DPA，受托处理的个人信息由该协议而非本通知管辖——Warp 处于受托侧。要给出正面的受托处理条款，需先把企业 DPA 或信任中心条款登记为 [[source]] 并等快照抓回；本轮不用数据用途承诺代替角色约定。"
anchor = "warp-privacy-dpa-exclusion"

[[product]]
id = "enterprise-byollm"
badge = "Enterprise BYOLLM"
category = "coding_plan"
plan_level = "enterprise"
label = "客户云推理；请求仍经 Warp 代理"
[product.training]
mark = "unknown"
searched = ["https://docs.warp.dev/enterprise/enterprise-features/bring-your-own-llm.md", "https://www.warp.dev/privacy", "https://docs.warp.dev/support-and-community/privacy-and-security/privacy.md", "https://docs.warp.dev/enterprise/security-and-compliance/security-overview.md", "https://www.warp.dev/pricing"]

[[product.training.point]]
text = "Scope note, not a training commitment: the consumer Privacy Notice's training/fine-tuning purpose cannot be read into this tier either way, because the notice expressly does not apply to personal information Warp processes on behalf of customers that have entered into a data processing agreement, and Enterprise BYOLLM is an Enterprise feature normally covered by that arrangement. The DPA carve-out is therefore kept out of the training basis and this row stays unknown."
text_zh = "范围说明，不是训练承诺：消费档隐私政策的 training/fine-tuning 用途不能正反两面地套到本档，因为本通知明写不适用于 Warp 按客户 DPA 受托处理的数据，而 Enterprise BYOLLM 正是通常签 DPA 的企业功能。该 DPA 排除句因此不作为训练依据，本行维持 unknown。"

[[product.training.point]]
text = "Routing note, not a training commitment: BYOLLM requests pass through Warp's servers to the customer's AWS or Google Cloud environment, where inference runs. The current sources do not state whether that hop trains on the content; the provider account's own terms govern it."
text_zh = "路由说明，不是训练承诺：BYOLLM 请求经 Warp 服务器转到客户自己的 AWS 或 Google Cloud 环境执行推理。现行来源没有说明该跳是否用内容训练；该处按客户厂商账号的条款处理。"

[[product.training.point]]
text = "Fetch gap on our side: searched[] includes the BYOLLM documentation page and the Warp-wide privacy page, which are registered as sources but had no snapshot in this repository at review time. Their absence is not evidence that the vendor permits or forbids training, and this row stays unknown rather than being written up as either."
text_zh = "我方抓取缺口：searched[] 含 BYOLLM 文档页与 Warp-wide 隐私页，两者已登记为来源但复核时本仓库尚无快照。没抓到不等于厂商允许或禁止训练；本行维持 unknown，不写成任一方向。"

[product.zdr]
mark = "no"
anchor = "warp-product-storage"

[[product.zdr.point]]
text = "Warp still stores product data for this tier: the security overview says Transcripts can contain code context and persist as product data independently of provider ZDR."
text_zh = "本档 Warp 仍会存产品数据：安全页写明会话记录可含代码上下文、并作为产品数据独立于上游 ZDR 持久化。"
anchor = "warp-product-storage"

[[product.zdr.point]]
text = "Own-account boundary: Warp's ZDR agreements apply to Warp-provided inference only. BYOLLM requests go to the customer's provider account under the customer's terms, so Warp's agreements do not establish ZDR for this hop."
text_zh = "自有账号边界：Warp 的 ZDR 协议只适用于 Warp 提供的推理。BYOLLM 请求按客户账号与条款发往客户厂商，Warp 的协议不为该跳确立 ZDR。"
anchor = "warp-provider-zdr-boundary"

[[product.zdr.point]]
text = "BYOLLM routing: requests pass through Warp's servers to the customer's cloud infrastructure, where inference runs. The amended security overview points to retention for requests through your provider account instead of stating that Warp does not store the content."
text_zh = "BYOLLM 路由：请求经 Warp 服务器到客户云基础设施执行推理。改版后的安全页改为指向「经你厂商账号的请求的保留」，不再声明 Warp 不存请求内容。"
anchor = "warp-byollm-routing"

[[product.zdr.point]]
text = "Pricing-page marketing claim, kept as a parallel fact: Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers: no customer data is retained, stored, or used for training. It is not used to establish ZDR for the customer's own cloud hop."
text_zh = "价格页 marketing 表述并列保留：「Warp is SOC 2 compliant and has Zero Data Retention policies with all contracted LLM providers: no customer data is retained, stored, or used for training.」该句不用于为客户自有云那一跳确立 ZDR。"
anchor = "warp-pricing-zdr-marketing"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "warp-byollm-routing"

[[product.retention.point]]
text = "Object: BYOLLM request content. Context: BYOLLM routing. Duration type: undisclosed — the current security overview says requests pass through Warp's servers and refers to retention for requests through your provider account; the former sentence that Warp does not store the content of these requests is gone, and no replacement period is stated."
text_zh = "对象=BYOLLM 请求正文；语境=走 BYOLLM 路由时；期限类型=未披露——现行安全页只说请求经 Warp 服务器转往客户云，并指向「经你厂商账号的请求的保留」；原「Warp 不存这些请求内容」句已删除，也没有替代期限。"
anchor = "warp-byollm-routing"

[[product.retention.point]]
text = "Object: Terminal cloud conversations and cloud-agent run data. Context: product features store this data independently of provider ZDR and analytics preferences. Duration type: not quantified — no retention period is stated for these objects."
text_zh = "对象=Terminal 云对话与云 agent run 数据；语境=产品功能独立于上游 ZDR 与分析偏好存储这些数据；期限类型=未量化——原文未给这些对象的保留期限。"
anchor = "warp-product-storage"

[[product.retention.point]]
text = "Object: self-hosted execution data. Context: self-hosted cloud agent execution; prompts, transcripts, attachments, and uploaded artifacts can contain code context. Duration type: not quantified — the security overview says inference and run-data storage have separate boundaries but gives no period."
text_zh = "对象=自托管执行数据；语境=自托管云 agent 执行，提示词、会话记录、附件与上传产物可含代码上下文；期限类型=未量化——安全页只说推理与运行数据存储有分开的边界，未给期限。"
anchor = "warp-selfhosted-boundaries"

[[product.retention.point]]
text = "Object: user account data. Context: a verified deletion request. Duration type: upper bound — deletion requests are processed within 30 days at no cost."
text_zh = "对象=账号数据；语境=经身份验证的删除请求；期限类型=上限——删除请求 30 天内处理完毕、不收费。"
anchor = "warp-account-deletion-30d"

[product.processing_region]
codes = ["selected"]
anchor = "warp-byollm-data-locality"

[[product.processing_region.point]]
text = "Disclosed part: interactive agent inference runs in the customer's own AWS account or Google Cloud project, so the region of the inference hop is chosen by the customer."
text_zh = "已披露的部分：交互式 agent 推理在客户自己的 AWS 账号或 Google Cloud 项目里执行，推理那一跳的区域由客户自己选。"
anchor = "warp-byollm-data-locality"

[[product.processing_region.point]]
text = "Undisclosed part: the Warp-hosted hop. The amended security overview only points to Warp-hosted execution for compute, sandbox isolation, networking, and capacity; it no longer states a cloud provider or country, so no country is recorded for that hop."
text_zh = "未披露的部分：经 Warp 代理的那一跳。改版后的安全页只把计算、沙箱隔离、网络与容量指向 Warp-hosted execution，不再声明云厂商或国别，故该跳不记国别。"
anchor = "warp-hosted-execution-pointer"

[product.role]
kind = "processor"
anchor = "warp-privacy-dpa-exclusion"

[[product.role.point]]
text = "Hop 1 (Warp): requests are forwarded by Warp and it keeps cloud conversations and control-plane metadata; the DPA carve-out in the Privacy Notice is the clause that puts Warp on the processor side for data processed on a customer's behalf."
text_zh = "第 1 跳（Warp）：请求经 Warp 转发，且 Warp 持有云对话与控制面元数据；把 Warp 放在受托侧的条款是隐私政策第 7 行的 DPA 排除句（客户 DPA 管辖的数据）。"
anchor = "warp-privacy-dpa-exclusion"

[[product.role.point]]
text = "Hop 2 (customer's own cloud): inference runs inside the customer's AWS account or Google Cloud project, so the role there follows the customer's own agreement with its cloud or model provider. Each hop can be covered by ZDR separately, which does not by itself prove both can be opened in the same configuration."
text_zh = "第 2 跳（客户自有云）：推理在客户自己的 AWS 账号或 Google Cloud 项目内执行，该跳的角色由客户与其云/模型方的合同决定。两跳各自可申请 ZDR，不自动证明能在同一配置下同时开通。"
anchor = "warp-byollm-data-locality"

[[product.role.point]]
text = "Kept as the reason this row is not no_data: inference happens in the customer's cloud, but requests still pass through Warp's servers and Warp may still persist cloud conversations, transcripts, and control-plane metadata as product data."
text_zh = "保留此条说明本行不是 no_data：推理在客户云，但请求仍经 Warp 服务器，Warp 仍可能把云对话、会话记录与控制面元数据作为产品数据持久化。"
anchor = "warp-product-storage"

