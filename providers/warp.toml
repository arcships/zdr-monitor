[[product]]
id = "free"
badge = "Free"
category = "coding_plan"
plan_level = "free"
[product.training]
mark = "no"
anchor = "warp-privacy-trains-models"

[[product.training.point]]
text_zh = "隐私政策把「training, fine-tuning 支撑 AI 功能的模型」写进了用途清单，消费档适用，没有给退出开关。"

[[product.training.point]]
text_zh = "别被 enterprise 安全页那句「Warp does not persistently store your source code or use it for model training」误导——那句讲的是控制平面和 ZDR 下的推理链路（约束的是签了 ZDR 的模型厂商），不是 Warp 自己对消费档数据的用途承诺。企业档另有条款，见 Enterprise 那一行。"
anchor = "warp-control-plane-no-training"
[[product.training.point]]
text_zh = "上游 ZDR 不等于 Warp 自身不训练；Warp FAQ 另保留训练/改善权，安全页只对源码作不训练承诺，因此对全部交互按 no。遥测可由个人关闭。"
[product.zdr]
mark = "no"
anchor = "warp-cloud-storage"
[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "warp-telemetry-indefinite"
[product.processing_region]
codes = ["unknown"]
searched = ["https://docs.warp.dev/enterprise/security-and-compliance/security-overview.md", "https://www.warp.dev/legal/privacy-policy"]
[product.role]
kind = "controller"
anchor = "warp-telemetry-indefinite"

