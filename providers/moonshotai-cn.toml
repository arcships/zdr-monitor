[[product.training.point]]
text = "Model Use Agreement Section VI.3 grants the same license but with no opt-out. The official FAQ (api-data-security) and the ZDR page state that API / enterprise customer data is not used for training, which is the opposite of the contractual grant; under contract > developer_data the contract prevails. Re-checked (2026-09-21): after ruling out the scope, tier and site readings one by one, judged a genuine contradiction (recency could not be ruled out because the page carries no date, but there is no evidence of a superseding version); marked contradiction, see the contradiction_note on api-data-security."
text_zh = "modeluse 六、3 同款授权但无 opt-out。官方 FAQ（api-data-security）与 ZDR 页声明 API/企业客户数据不用于训练，与合同授权相反，按 contract > developer_data 取合同。重查(2026-09-21)：逐条排除范围/档位/站点三种解释后判为真矛盾（时效因该页无日期未能排除，但无版本取代证据），标 contradiction，见 api-data-security 的 contradiction_note。"

