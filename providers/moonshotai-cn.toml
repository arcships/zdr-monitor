[[source]]
url = "https://www.kimi.com/help/kimi-api/api-data-security"
channel = "developer_data"
tier = "contradiction"
note = "与 https://platform.kimi.com/docs/agreement/modeluse（core）及经其首段并入协议包的 https://platform.kimi.com/docs/agreement/userservice（core）就同一档位（国内开放平台按量 API，含企业认证/企业方案）的 training 维度表述不一致：本文件称「通过 API 提交的用户数据（包括输入内容和模型输出）不会被用于训练或改进 Kimi 的模型。你的数据仅用于完成当次 API 请求，处理完成后不会被持久化存储用于训练目的。」，另有「API 数据不会被用于模型训练。」；core 合同称「为了提升您使用本服务的体验，您授予我们一项免费的使用权，以在法律允许的范围内将您输入输出之内容及反馈用于模型服务优化」（modeluse 六、3；userservice 五、3 同款并续接「如您不希望您的内容被用于模型训练，您可以通过本协议所载的联系方式联系我们」，即默认授权 + opt-out）。适用范围：本文件是 www.kimi.com 帮助中心「Kimi API 与企业合作」类下的 API 数据安全 FAQ（京ICP备2023011302号-14），正文主语逐字为「通过 API 提交的用户数据」「API 数据」，指向开放平台 API 而非消费版 Kimi 对话；合同是《Kimi 开放平台服务协议》及其并入的《Kimi 用户服务协议》，管 platform.kimi.com 按量 API 与企业方案。四种解释的排除依据：（1）适用范围——两份都逐字指向开放平台 API，本文件虽挂在国内站消费域名下，但正文主语是 API 数据；（2）档位——本家只有 api 一档，本文件表述不限于企业版；core 侧也不依赖「userservice 是否消费线文本」这一争点，modeluse 自身即开放平台协议且六、3 为同款授权，userservice 则由 modeluse 首段（「本协议是针对开放平台服务所制定的具体协议」＋「共同构成您使用本服务的协议」）并入 API 协议包；（3）站点——两个域名同属国内线同一北京月之暗面主体（帮助中心页脚「北京月之暗面科技有限公司」与协议正文「北京月之暗面科技股份有限公司」为同一国内主体的名称变体，见 notes），国际线 platform.kimi.ai 主体为 Moonshot AI PTE. LTD.，另立条目；（4）时效——本文件无生效/更新日期，合同为 2026-08-31 生效、2026-08-24 更新，缺日期故此项不依据日期比对，而依据无版本取代证据：本页本轮抓取有效（14461B、两条引文逐字命中）仍在帮助中心在列，且同一「不训练」表述在同一文档站的现行 ZDR 页（platform.kimi.com/docs/guide/zero-data-retention）上仍然存在，差异并非单一过期页造成。需要厂商书面澄清。"

