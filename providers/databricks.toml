[[product.zdr.point]]
text_zh = "公开文档中没有针对「客户云账户内算力 + BYOK 外部模型」这一档的零保留承诺或开关说明。反向也不成立：Databricks 控制面仍持有账户与元数据（架构文档：control plane 在 Databricks 账户），且 BYOK 请求经 Databricks 转发。按规则记 not_found（拿不到证据 ≠ 厂商不提供），不得把 FM APIs 档的 30 天保留条款外推到本档。"

[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "secadd-workspace-cancel-30d"

[[product.retention.point]]
text_zh = "客户内容由客户在其云账户/Unity Catalog 内控制，Databricks 提供删除能力（Security Addendum「The Platform Services provide Customer with functionality that permit Customer to delete Customer Content under Databricks' control」）"
anchor = "secadd-customer-delete-controls"

[[product.retention.point]]
text_zh = "删除时限（对象：Customer Workspace 内的 Customer Content；触发条件：workspace 取消）：「Customer Content contained within a Customer Workspace is permanently deleted within thirty (30) days following cancellation of the Workspace」。30 天是取消后的删除上限，不是保留期，故 verdict 不记 days。"
anchor = "secadd-workspace-cancel-30d"

[[product.retention.point]]
text_zh = "另一对象（下限）：Databricks stores audit logs and system tables for at least one year——审计日志与系统表至少 1 年，是下限，不能反推「1 年后删除全部内容」。"
anchor = "secadd-audit-logs-one-year"

[[product.retention.point]]
text_zh = "备份（对象：全部 Customer Content，比 DPA §9.1 只覆盖 Customer Personal Data 更宽）：Databricks does not back up Customer Content, irrespective of where it is stored——不提供备份与恢复，客户须自行备份。"
anchor = "secadd-no-customer-content-backup"

[[product.retention.point]]
text_zh = "DPA Annex 1(B)：Customer Personal Data 的保留期是协议期 + 终止后处理期间。"
anchor = "dpa-retention-term-of-agreement"

[[product.retention.point]]
text_zh = "DPA §9.3：终止后客户书面请求起 30 天内删除 Customer Personal Data（触发条件是客户书面请求）。DPA §9.1 明确服务不含备份与灾备（对象限 Customer Personal Data），备份是客户自己的义务。BYOK 外部模型那一跳的保留由上游 provider 决定，Databricks 文档未承诺。"
anchor = "dpa-no-backup-dr"

[product.processing_region]
codes = ["selected"]
anchor = "arch-classic-compute-plane-aws-account"

[[product.processing_region.point]]
text_zh = "「In the classic compute plane, Databricks compute resources run in your AWS account.」workspace 存储桶也在客户账户"
anchor = "arch-classic-compute-plane-aws-account"

[[product.processing_region.point]]
text_zh = "控制面在 Databricks 账户（「The control plane is located in the Databricks account, not your cloud account.」）。serverless 与 Designated Services 走 Databricks 账户并按 Geo 处理，属另一档。BYOK 外部模型的推理发生在 provider 侧，处理地由 provider 与客户配置决定。"
anchor = "arch-control-plane-not-your-cloud"

[[product.processing_region.point]]
text_zh = "合同层区域承诺：Databricks will not, without Customer's permission, move a Customer Workspace from the region or Geo chosen by Customer（Security Addendum Deployment Region）——未经客户许可不迁移工作区。"
anchor = "secadd-no-workspace-move"

[product.role]
kind = "processor"
anchor = "dpa-role-processor"

[[product.role.point]]
text_zh = "DPA 对 Databricks Services 统一以 Databricks 为 processor，本档不例外"

[[product.role.point]]
text_zh = "但算力与存储在客户云账户内，实际数据控制分层（客户账户 + Databricks 控制面）。BYOK 档里 Databricks 只做凭据保管与路由（external-models 页：「External models are third-party models hosted outside of Databricks」），对上游 provider 而言客户通常是直接签约方。故置信度 medium：合同角色清晰，链路责任分层需人工按实际配置判断。"

