[[product.training.point]]
text = "Databricks shall not use Customer Content, Inputs, or Outputs to train, re-train, or fine-tune GenAI Models that Databricks makes available for use by third parties"
text_zh = "§5(c) 禁止用 Customer Content/Inputs/Outputs 训练 Databricks 提供给第三方使用的 GenAI 模型。本档判 yes 的适用范围限于此句：不训练 Databricks 提供给第三方使用的 GenAI 模型。"
anchor = "sst-training-no-third-party-models"

[[product.training.point]]
text = "For all paid accounts, Model Serving does not use user inputs submitted to the service or outputs from the service to train any models or improve any Databricks services"
text_zh = "强证据（developer_data）：paid accounts 下 Model Serving 不使用提交给服务的输入或服务产出的输出训练任何模型、也不用于改进任何 Databricks 服务。本档按量 API 属付费账户，故「不用于训练」在本档有文档层直接依据，不止于 §5(c) 的第三方模型范围。"
anchor = "serving-training-paid-accounts"

[[product.training.point]]
text = "Subject to any restrictions expressly included in the Documentation, Databricks may collect and use Inputs and Outputs to develop, improve, operate, and support the Databricks Services only to the extent that such use (i) is solely for the benefit of Customer or (ii) does not identify Customer or disclose Customer Confidential Information to third parties"
text_zh = "反向表述并列保留（厂商自己说法冲突，不选边）：§5(b) 明文允许为 develop/improve/operate/support 收集使用 Inputs/Outputs，条件为 (i) 仅为客户利益或 (ii) 不识别客户且不向第三方披露客户机密信息。按 docs/judgment.md「用来改进服务算训练」的口径，这句方向与 §5(c) 相反，故与 §5(c) 并列记录。它不翻转本档 mark：paid accounts 的 Model Serving 那句同时排除了 train any models 与 improve any Databricks services，本档推理走 Model Serving，§5(b) 的两个条件也须同时满足。"
anchor = "sst-training-improve-allowed"

