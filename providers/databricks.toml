[[source]]
url = "https://docs.databricks.com/aws/en/databricks-ai/databricks-ai-trust"
channel = "developer_data"
tier = "core"
note = "Databricks AI assistive features trust and safety 页。范围明确限「these features」（Genie Code、AI-generated comments、AI/BI dashboards 等助手功能）：Databricks 不用其数据训练对第三方开放的生成式基础模型；上游模型伙伴对这些功能不保留数据（含滥用监控），使用伙伴的零保留端点。此页不覆盖 Foundation Model APIs 的按 token 推理，不得外推。"

[[source]]
url = "https://docs.databricks.com/aws/en/getting-started/high-level-architecture"
channel = "developer_data"
tier = "core"
note = "平台架构文档：control plane 在 Databricks 账户（不是客户云账户），serverless compute plane 在 Databricks 账户，classic compute plane 在客户自己的 AWS 账户。用于区分「客户自家云账户里跑的服务」与「Databricks 托管的按 token 计费服务」两档，并说明托管/处理责任分层。"

[[source]]
url = "https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/compliance"
channel = "developer_data"
tier = "core"
note = "Foundation Model APIs compliance and security 页。Data processing and residency 节：提供 FM APIs 时 Databricks 可能在数据来源的 region 与云厂商之外处理数据；非 US/EU 工作区须开启跨 Geo 处理。另有 US-only / EU+US 模型的区域清单（Anthropic、OpenAI、Google 模型）。"

[[source]]
url = "https://docs.databricks.com/aws/en/machine-learning/model-serving/"
channel = "developer_data"
tier = "core"
note = "Model Serving 官方文档（2026-09-11 版）。本家 retention/zdr 最实质的文档层来源：Data retention 节给出容器构建日志 ≤30 天、指标 ≤14 天、FM APIs 输入输出为防滥用可临时处理存储最多 30 天且与工作区同区域；Partner model provider data retention 节说明伙伴 provider 可能为安全目的保留，并分别列出 OpenAI（gpt-5.5 及以后，分类器判定违规的 coding/routing 客户内容）与 Anthropic（Fable 5 及以后 Mythos 类，全部客户）的保留例外；Security 节写明 paid accounts 下 Model Serving 不使用输入输出训练任何模型或改进任何 Databricks 服务；并确认 FM APIs 属 Designated Service。"

[[source]]
url = "https://docs.databricks.com/aws/en/resources/databricks-geos"
channel = "developer_data"
tier = "core"
note = "Databricks Geos: Data residency 文档。默认客户内容仅在工作区所在 Geo 处理（某些 Designated Services 例外）；跨 Geo 处理需账户管理员显式开启；Designated Services（含 AI 负载）由 Databricks 代表客户管理。processing_region 的权威来源。"

[[source]]
url = "https://docs.databricks.com/aws/en/resources/designated-services"
channel = "developer_data"
tier = "core"
note = "Designated Services 文档，含 Pay-per-token / Provisioned throughput Foundation Model APIs 在各 Geo 的可用性表。关键句：开启跨 Geo 处理后「your data is not stored outside of your workspace's Geo regardless of this setting」——处理地与存储地要分开看。"

[[source]]
url = "https://www.databricks.com/legal/databricks-free-edition"
channel = "contract"
tier = "core"
note = "Databricks Free Edition Terms（免费档专用条款，与付费档结论相反）。§3.1 限个人/学术/非营利用途；§4 为免费提供采用多租户与有限数据安全保护，且「Databricks personnel have access to your account and any data used with or exposed to the Free Edition Services…no expectation of privacy」；§6 客户授予永久、不可撤销、全球许可，明确可用于「train and improve AI models」；§9.2 明确不担保 data location、data retention、data security。适用 Databricks, Inc. 与个人用户之间的直接协议。"

[[source]]
url = "https://www.databricks.com/legal/databricks-subprocessors"
channel = "contract"
tier = "core"
note = "Subprocessors 清单（DPA §4.1 引用）。Anthropic, PBC 与 OpenAI, L.L.C. 被列为「AI-backed services」子处理者，处理地写 Customer Selected；脚注﹢说明 Designated Services 按客户所选区域以 Geo 为单位处理。这是「伙伴模型 provider 在链路上是 Databricks 的子处理者」的条款级依据。"

[[source]]
url = "https://www.databricks.com/legal/dpa"
channel = "contract"
tier = "core"
note = "Databricks DPA v3（2023-07-21）全文，由 /legal/dpa 直接渲染（含 Annex A/B 与 SCC 模块）。本家 role 与合同层 retention 的权威来源：§2.1 角色（Databricks 为 processor）、Annex 1(A) data importer 角色 Processor、§2.3 仅按客户指示处理、§9.1 服务不含备份灾备、§9.3 终止后 30 天内删除、§10.1 CCPA 目的限制、Annex 1(B) 保留期=协议期。注意适用范围只到 Customer Personal Data（Customer Content 中的个人信息），不是全部输入输出。同一文档另有同文 URL：https://www.databricks.com/legal/data-protection-addendum 与 https://www.databricks.com/sites/default/files/2026-01/DPA.pdf（GDPR FAQ 指向后者为现行版，内容仍为 v3 2023-07-21）。"

[[source]]
url = "https://www.databricks.com/legal/security-addendum"
channel = "contract"
tier = "core"
note = "Platform Services Security Addendum（DPA §1.9 定义并纳入合同）。给出两处量化保留条款：§Monitoring & Logging / Audit Logs and System Tables「Databricks stores audit logs and system tables for at least one year」（审计日志与系统表，下限）；Deletion 节「Customer Content contained within a Customer Workspace is permanently deleted within thirty (30) days following cancellation of the Workspace」（客户内容，workspace 取消触发，上限）。对象与触发条件不同，不能混为一条保留期。"

[[source]]
url = "https://www.databricks.com/legal/service-specific-terms"
channel = "contract"
tier = "core"
note = "Service Specific Terms（页尾 Last Updated July 14, 2026），Databricks 全服务的 GenAI 通用条款，覆盖包括 Foundation Model APIs 在内的 Databricks Services。§1 定义 GenAI Model / Input / Output；§4(a) 客户定制模型 Databricks 不得访问使用；§4(b) Inputs 与 Outputs 属 Customer Content，所有权归客户；§5(b) 为服务开发改进保留收集使用权（条件：仅为客户利益或不识别客户）；§5(c) 禁止用 Customer Content/Inputs/Outputs 训练 Databricks 提供给第三方使用的 GenAI 模型。全文无保留期、无 ZDR 条款。"

