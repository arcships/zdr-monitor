[[product.training.point]]
text_zh = "model-serving 页的「paid accounts 不使用输入输出训练」表述针对 Model Serving 服务本身。故记 not_found（官方未就这一档表态），不得反向解读为「可用于训练」，也不得把 API 档的禁止条款直接搬过来当本档结论。"

