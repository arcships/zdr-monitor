[[product.role.point]]
text_zh = "§1 与个人用户直接签约（you as an individual）"

[[product.role.point]]
text_zh = "§4 Databricks 人员可访问账户与数据、无隐私期待、多租户有限保护"

[[product.role.point]]
text_zh = "§6 内容许可是 Databricks 为自己业务目的使用（运营改进、开发新技术、训练 AI、市场推广）。条款结构更接近控制者自用而非受托处理，故记独立控制者一侧"

[[product.role.point]]
text_zh = "DPA/processor 定位不适用于本档（DPA 以 Databricks Services 的客户订阅为前提）。"

