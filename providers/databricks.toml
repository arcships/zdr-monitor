[[product.training.point]]
text_zh = "§6「You grant Databricks a royalty-free, perpetual, irrevocable, and worldwide license that covers any use (including relicensing and redistribution) of Your Content…This license allows us to do things such as operate and improve the Free Edition Services and other services, develop new technologies and services, train and improve AI models, market our products and services, and customize the services for you.」——永久、不可撤销、含训练与改进 AI 模型，与付费档 §5(c) 的禁止相反。"

[[product.training.point]]
text_zh = "许可是使用即授予（§6 开头 You grant Databricks a royalty-free, perpetual, irrevocable…），条款里没有 opt-in 开关，故不记 mode：页面按「否，条款允许训练」呈现，而不是「否，需你授权」。"

[product.zdr]
mark = "no"
anchor = "freeedition-no-expectation-of-privacy"

[[product.zdr.point]]
text_zh = "§4「Databricks personnel have access to your account and any data used with or exposed to the Free Edition Services. Therefore, you should have no expectation of privacy regarding Your Content」+ 多租户环境与有限数据安全保护 → 零保留、零访问在条款层面明确不成立。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "freeedition-warranty-disclaim-retention-location"

[[product.retention.point]]
text_zh = "§9.2 明确不担保「data location, data retention, or data security」——本档不提供保留期承诺。"
anchor = "freeedition-warranty-disclaim-retention-location"

[[product.retention.point]]
text = "We may also terminate (or suspend access to) your use of the Free Edition Services or your account (including any associated data) or remove any of Your Content from the Free Edition Services at any time and without prior notice for any reason"
text_zh = "§8 Databricks 可随时、无需通知地移除 Your Content（或终止账户及相关数据）——实际留存可能远短于服务终止。"
anchor = "freeedition-remove-content-anytime"

[[product.retention.point]]
text_zh = "§7 账户终止可能导致内容销毁。即本档不提供任何保留期或删除时限承诺（与付费档 DPA/Security Addendum 的 30 天删除条款相反），故 basis 记 undisclosed，不写「留至服务终止」。"

[product.processing_region]
basis = "undisclosed"
anchor = "freeedition-warranty-disclaim-retention-location"

[[product.processing_region.point]]
text_zh = "§9.2 不担保 data location"

[[product.processing_region.point]]
text_zh = "§5 保留「moving how and where data associated with the Free Edition Services is stored and processed」的权利。即本档无处理地承诺。"

[product.role]
kind = "controller"
