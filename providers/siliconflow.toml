[[product.retention.point]]
text = "No quantified retention period exists anywhere in the three snapshots: the 30 days, 7 days and one year that appear in these documents are the response window for access requests, the notice window for fee disputes and the liability cap — none of them is a retention period."
text_zh = "三份快照里没有任何量化保留期限：出现的 30 天、7 天、一年分别是访问请求答复期、费用争议通知期与责任上限，与保留无关。"

[[product.retention.point]]
text = "Inputs and outputs (Interaction Data): no period at all. ToS §7.4 (\"We are under no obligation to store Interaction Data\") and Privacy Policy §3 (\"we have no obligation to store your Interaction Data\") are disclaimers of a storage duty, not retention commitments — they must not be read as a retention period."
text_zh = "输入输出（交互数据）：完全没有期限。ToS §7.4「We are under no obligation to store Interaction Data」与隐私政策 §3「we have no obligation to store your Interaction Data」是存储义务的免责，不是保留承诺，不能读成保留期限。"
anchor = "intl-tos-7-4-no-obligation-to-store"

[[product.retention.point]]
text = "Personal Data: kept \"as long as it is necessary to fulfil the purpose for which it was collected, or as required or permitted by applicable laws\" — an upper-bound style commitment with no number of days — and deleted or de-identified \"as soon as it is reasonable to assume that such retention no longer serves the purpose\". The object is Personal Data, not Interaction Data."
text_zh = "个人数据：按「为实现收集目的所必需的期间，或适用法律要求或许可的期间」保留（上限式，无天数），并在「合理认为保留不再服务于该目的」时停止保留或去关联。对象是个人数据，不是交互数据。"
anchor = "intl-privacy-7-retain-as-necessary"

[[product.retention.point]]
text = "Access, account and transaction data and communications: no period. ToS §5.11 lets them be \"monitored, captured, recorded and transmitted to the authorities\" in compliance with local legal requirements and without further notice."
text_zh = "访问/账户/交易数据与通信：无期限。ToS §5.11 允许其被「monitored, captured, recorded and transmitted to the authorities」，依当地法律要求且不再另行通知。"
anchor = "intl-tos-5-11-access-data-recorded-to-authorities"

[[product.retention.point]]
text = "Operational data (network logs, usage frequency, crash data, performance data — Privacy Policy §2.2b) and troubleshooting records (§2.2c): collected for service improvement and support, with no retention period stated. The object is operational data, not the body of API inputs and outputs."
text_zh = "运行数据（network log、使用频率、崩溃数据、性能数据——隐私政策 §2.2b）与故障排除记录（§2.2c）：用于服务改进与支持，未披露保留期限。对象是运行数据，不是 API 输入输出正文。"
anchor = "intl-privacy-2-2-b-service-improvement-logs"

[[product.retention.point]]
text = "After termination: deletion is at the vendor's discretion — account content \"including your Interaction Data, may be deleted from SiliconFlow’s database at SiliconFlow’s discretion\" — which is not a commitment to delete, and no deadline is given."
text_zh = "服务终止后：删除为裁量式——账户内容「including your Interaction Data, may be deleted from SiliconFlow’s database at SiliconFlow’s discretion」，不是删除承诺，也没有期限。"
anchor = "intl-tos-13-2-c-deletion-at-discretion"

