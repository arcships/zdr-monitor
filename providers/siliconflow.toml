[[product.processing_region.point]]
text = "No processing or storage location is disclosed for this tier, so no region code is asserted. The contracts contain no storage-location clause: Privacy Policy §5.1 allows Personal Data to be \"disclosed and/or transferred to the following third parties, and used or Processed by such third parties, whether within or outside Singapore\" (affiliates, service providers, and foreign authorities among the recipients), and ToS §15.7f lets SiliconFlow \"delegate or subcontract\" the performance of any of its functions and use any service provider, subcontractor or agent."
text_zh = "本档未披露处理地/存储地，故不记任何地域码。合同里没有存储地域条款：隐私政策 §5.1 允许个人数据「may be disclosed and/or transferred to the following third parties, and used or Processed by such third parties, whether within or outside Singapore」（接收方含关联公司、服务商与境外政府/监管机构），ToS §15.7f 又允许把职能「delegate or subcontract」给任意服务提供者、分包商或代理。"
anchor = "intl-privacy-5-1-transfer-outside-singapore"

[[product.processing_region.point]]
text = "Singapore appears only as the contracting entity, the licensed territory of use and the governing law — ToS §2.1 grants a licence \"to access and use the Platform and Services for in Singapore\", §4.1 sets Singapore Laws as the compliance baseline, §14.1 makes Singapore law governing, and Privacy Policy §1.1 applies the Singapore PDPA. None of these says where data is processed or stored, so SG is not recorded for this dimension."
text_zh = "新加坡只出现在签约主体、许可使用地域与准据法上——ToS §2.1 授予「license to access and use the Platform and Services for in Singapore」，§4.1 以新加坡法律为合规基准，§14.1 以新加坡法为准据法，隐私政策 §1.1 适用新加坡 PDPA。这些都不是数据在何处处理或存储的表述，故本维度不记 SG。"
anchor = "intl-tos-2-1-license-singapore"

[product.role]
kind = "processor"
anchor = "intl-tos-7-4-passive-technical-channel"

[[product.role.point]]
text = "For Interaction Data the vendor positions itself as \"passive technical supporters or channels\" and says its technical services \"will strictly execute your instructions for processing Interaction Data. We will not access your Interaction Data.\""
text_zh = "对交互数据，厂商自认「passive technical supporters or channels」，并称技术服务「will strictly execute your instructions for processing Interaction Data. We will not access your Interaction Data.」。"
anchor = "intl-tos-7-4-passive-technical-channel"

[[product.role.point]]
text = "The \"strictly execute instructions / will not access\" sentence carries three carve-outs: \"Unless otherwise required by law, agreed under specific product rules, or necessary to provide technical assistance for troubleshooting or resolving technical issues at your request\". They attach to that sentence, not to the purpose-limitation sentence in §7.4."
text_zh = "「严格执行指示／不访问」这句带三个口子：「Unless otherwise required by law, agreed under specific product rules, or necessary to provide technical assistance for troubleshooting or resolving technical issues at your request」——除非法律另有要求、依据特定产品规则另行约定、或应客户要求提供故障排除的技术协助。例外挂在这一句上，不在 §7.4 的用途限定句上。"
anchor = "intl-tos-7-4-exceptions-carve-outs"

[[product.role.point]]
text = "\"We will not access\" also has a compliance-review and law-enforcement opening: ToS §3.5 reserves the right to \"monitor your access to or use of the Platform or Services, check, vet and/or control any activity, content or information\", and §5.11 lets access data, account data, transaction data and communications be monitored, captured, recorded and transmitted to the authorities. The object of both is access/account/transaction data and communications, not the body of API inputs and outputs."
text_zh = "「不访问」另带合规审查与执法口子：ToS §3.5 保留监控、检查、审查平台活动的权利，§5.11 允许访问数据、账户数据、交易数据与通信被 monitored, captured, recorded 并送交当局。两条的对象都是访问/账户/交易数据与通信，不是 API 输入输出正文。"
anchor = "intl-tos-3-5-monitor-rights"

[[product.role.point]]
text = "On the account and Personal Data side SiliconFlow is still an independent controller (the \"neutral technology service provider\" wording in Privacy Policy §3 covers Interaction Data only), and no public DPA is available."
text_zh = "账户与个人数据一侧仍是独立控制者（隐私政策 §3 的「中立技术服务提供者」只针对交互数据），且无公开 DPA。"

