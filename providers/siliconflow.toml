[[source]]
url = "https://docs.siliconflow.com/cn/legals/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "国际站《隐私政策》的中文版。**同一份政策的中英两版用了两个不同的实体名**：中文版写「SILICONFLOW TECHNOLOGY PTE.LTD.」，英文版写「SILICONFLOW LABS PTE. LTD.」——都是新加坡 PTE LTD，但名称不一致。本轮如实记录，不裁决哪个是法定名称，也不据此否定该政策的效力；这属于本家的一处文档不一致（见 notes）。其余条款（§3 互动数据、§7 保留）与英文版同义。"

[[source]]
url = "https://docs.siliconflow.com/en/legals/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "《Privacy Policy》（索引标注 Update Date: Sep. 09th, 2026）英文版，国际站隐私政策，主体同为 SILICONFLOW LABS PTE. LTD.，法律框架为新加坡 PDPA（§1.1「PDPA means the Personal Data Protection Act 2012 of Singapore」）。§3「Interaction Data」是 API 输入输出（业务/客户数据）的专节，§7 是保留期条款，§5.1 是共享与跨境传输条款，§8.1 是撤回同意/DPO 联系渠道。**全文无 train/training 字样**（对输入输出只有 §3 的「严格按您的指示处理」），**无保留期天数**，**无 ZDR 选项或申请方式**。注意 §2.2b「Service Improvement」的对象是 network log / 使用频率 / 崩溃数据等运行数据，不是 Interaction Data。"

[[source]]
url = "https://docs.siliconflow.com/en/legals/terms-of-service"
channel = "contract"
tier = "core"
note = "《Terms of Use》（docs 站索引标注 Update Date: Sep. 09th, 2026）英文版，国际站主合同，覆盖国际站全部产品档（未按档位分设数据条款）。签约主体 SILICONFLOW LABS PTE. LTD.（新加坡）；开篇即声明「The Services are not available for users located in the territory of mainland China and users in China may access our services through https://siliconflow.cn/」——**国际站与中国大陆站是两个法律实体、两套条款**。与数据处理直接相关的条款：§2.1 许可「for in Singapore」、§4.1 合规基准为新加坡法律、§7.4 Interaction Data 免责与用途限定、§13.2c 终止后删除、§5.11 访问/账户/交易数据可被记录并送交当局、§15.7f 可分包、§14.1 新加坡法管辖。全文**无 ZDR / zero data retention / 不存储 字样，无任何量化保留期（无 30 天、6 个月等天数），无「不用于训练」的明文**；唯一出现「training」的是 §3.4b，且是对**用户**的禁止（不得把服务提供的内容用于机器学习/AI 训练或开发）。§6.3a 提到可与客户另签「separate contract」，说明存在未公开的线下合同档。"

