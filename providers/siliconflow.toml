[[product.training.point]]
text = "No explicit \"we do not train\" statement exists for this tier, so this dimension is recorded as not stated. The only clause on how API inputs and outputs may be used is ToS §7.4, and it is a purpose limitation — \"we will only use your Interaction Data in compliance with applicable laws and solely for the purpose of providing Services to you\" — that never names model training, and the paragraph sits under the heading \"7.4. Disclaimer\". Judging yes needs wording that explicitly rules model training out; the international site has none (the mainland-China site's \"不会用于任何大模型的预训练、微调或其他商业用途\" belongs to a different entity and site and is not used here)."
text_zh = "本档没有「不用于训练」的明文，故本维度记「未表态」。涉及 API 输入输出用途的只有 ToS §7.4 的用途限定「we will only use your Interaction Data in compliance with applicable laws and solely for the purpose of providing Services to you」：该句未点名模型训练，整段位于「7.4. Disclaimer」标题之下。判 yes 需要明确把模型训练挡在外面的表述，国际站没有这句（国内站那句「不会用于任何大模型的预训练、微调或其他商业用途」属另一法律实体、另一站点，不能替用）。"

[[product.training.point]]
text = "Scope of the §7.4 wording: the carve-outs in the same sentence (\"Unless otherwise required by law, agreed under specific product rules, or necessary to provide technical assistance for troubleshooting or resolving technical issues at your request\") attach to the following sentence about strictly executing instructions and not accessing Interaction Data; they do not modify the purpose-limitation sentence, which starts with \"Additionally\" and carries no carve-out of its own."
text_zh = "§7.4 的适用范围：同句的三个口子（法律另有要求、依据特定产品规则另行约定、或应客户要求提供故障排除的技术协助）挂在紧随其后那句「严格执行指示／不访问交互数据」上，不改变以 Additionally 另起的用途限定句的字面范围。"

[[product.training.point]]
text = "Opposite-facing clause in the same contract, kept side by side without picking a side: ToS §12b gives SiliconFlow the right to \"use and disclose any ideas, know-how, concepts, techniques, or other Intellectual Property Rights contained in such Feedback in any manner and for any purpose\", and §12a assigns those Feedback rights to SiliconFlow; Privacy Policy §3 and ToS §7.1 both list \"feedback\" among the ways Interaction Data comes into being. Scope limit: \"Feedback\" is what the user chooses to propose (ideas, suggestions, recommendations, enhancements, improvements), not the whole of API inputs and outputs."
text_zh = "同一合同内的相反面向，两条并列、不选边：ToS §12b 授权厂商「use and disclose any ideas, know-how, concepts, techniques, or other Intellectual Property Rights contained in such Feedback in any manner and for any purpose」，§12a 更把 Feedback 的相关权利让与厂商；隐私政策 §3 与 ToS §7.1 都把 feedback 列为交互数据的生成方式之一。范围限定：Feedback 指用户主动提交的想法、建议、推荐、改进意见，不等于全部 API 输入输出。"

[[product.training.point]]
text = "\"training\" appears in the ToS only in §3.4b, and there it is a restriction on the user (no machine-learning or AI training or development on content provided through the service), not a vendor commitment about customer data."
text_zh = "ToS 中唯一出现 training 的是 §3.4b，且是对用户的禁止（不得把服务提供的内容用于机器学习/AI 训练或开发），不是厂商对客户数据的承诺。"

[[product.training.point]]
text = "Object boundary: Privacy Policy §2.2b records network log information, usage frequency, crash data, usage scenarios and performance data, used \"to optimize the service experience and improve product quality\" — the object is operational data, not API inputs and outputs, so it neither supports nor overturns the training conclusion for this tier; §2.2c (troubleshooting records) is the same."
text_zh = "对象边界：隐私政策 §2.2b 记录 network log、使用频率、崩溃数据、使用场景与性能数据，用于「optimize the service experience and improve product quality」——对象是运行数据，不是 API 输入输出正文，既撑不起也不推翻本档的训练结论；§2.2c 的故障排除记录同理。"

