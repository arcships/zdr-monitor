[product.training]
mark = "yes"
anchor = "volcengine-api-training-zdr-default"
mode = "default"

[[product.training.point]]
text = "§3.7.7 by default: \"without your separate consent, Volcengine will not store or use your data to train or optimize models\""
text_zh = "§3.7.7 默认『未经单独同意不存储不使用』训练/优化"

[[product.training.point]]
text = "The separate-consent cases are the collaboration reward program (opt-in, through an authorized access point) and Doubao Model Service Agreement §4.1.1/4.1.2 (effective 2026-09-23)"
text_zh = "单独同意情形=协作奖励计划(opt-in,经授权接入点)与(2026-09-23 起生效的)豆包模型服务协议 §4.1.1/4.1.2"

[[product.training.point]]
text = "§3.7.7(1) is one of the listed scenarios that need no separate consent: to meet legal compliance requirements Volcengine may review your use of the service, including automated filtering of what you submit to and receive from the service, and build and improve risk-filtering mechanisms and libraries of unlawful or infringing content features. That is a vendor-side use of customer input and output, but it is aimed at compliance filtering and feature-library building, not at model training, so it is recorded as a limit here rather than as a mark=no."
text_zh = "§3.7.7(1) 是列明的无需单独同意场景之一:为履行法律法规合规要求,火山引擎可审查您使用本服务的行为及信息,包括对您提交给服务或使用服务输出的内容做自动化过滤审核、建立和改进风险过滤机制与违法违规侵权内容特征库。这是对客户输入输出的一项厂商侧使用,但目的是合规过滤与特征库建设,不等于用于模型训练,故只作限定登记,不改本行 mark"
anchor = "volcengine-api-compliance-review-content-use"

[[product.training.point]]
text = "Exception that can override this tier's rule: §3.7.8 — if you use a model service without the high-grade security protection (the security-sandbox mutual-trust scheme, which keeps your data from being handed to the model provider), your data-processing rules follow the model service agreement and rules you accepted. §3.7.2 imposes the same on proprietary model services: you must read and observe the model provider's Model Service Agreement before use. The upstream hop therefore has to be checked model by model, and this tier's own promise does not carry the whole chain."
text_zh = "可能覆盖本档结论的例外:§3.7.8——如您使用不具备高阶安全防护(安全沙箱安全互信方案,保护数据不提供给模型服务商)的模型服务,数据处理规则改由您接受的模型服务协议与规则约定;§3.7.2 对专有模型服务同属一个要求,须先查看并遵守模型服务商的《模型服务协议》。这一跳须逐模型核实,不能由本档承诺推出全链结论"
anchor = "volcengine-api-high-grade-security-exception"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "volcengine-api-cache-storage-authorized"

[[product.zdr.point]]
text = "§3.7.7's default promise is scoped to training: \"without your separate consent, Volcengine will not store or use your data to train or optimize models\" — its object is the training or optimization of models, so on its own it does not establish default zero retention. Storage is confined to four listed scenarios (compliance review, troubleshooting, anomaly alerting, aggregate statistics)."
text_zh = "§3.7.7 的默认承诺对象是训练——『未经您的单独同意,火山引擎不会存储和使用您的数据来训练或优化模型』,单独拿出来不构成『默认零保留』;存储仅限四类列明场景(合规审查/排障/异常告警/聚合统计)"
anchor = "volcengine-api-training-zdr-default"

[[product.zdr.point]]
text = "§3.7.11: using the cache storage, logging, AI app monitoring and debugging, observability platform, tagging or Managed Agents hosting features stores your data in the storage space Ark provides for you, and \"without your authorization, Volcengine will not access or use your data\"."
text_zh = "§3.7.11:使用缓存存储、日志记录、AI 应用监控与调试、可观测性平台、加标识、Managed Agents 托管等功能会把您的数据存入方舟为您提供的存储空间,且『未经您授权,火山引擎不会访问或使用您的数据』"
anchor = "volcengine-api-cache-storage-authorized"

[[product.zdr.point]]
text = "Zero retention here is a self-service configuration, not the default: the Responses API doc states storage is on by default and can be turned off with \"store\": false. The cache path is the same shape — entries are dropped when the idle TTL is exceeded (object-level figures are in the retention row). The store default-on in Responses is exactly why this tier is not default zero retention."
text_zh = "本档零保留是自助配置而非默认:Responses 文档写明『默认开启存储功能』、可设 store: false 关闭;缓存同理,闲置超过 ttl 即被从缓存中删除(具体数字见 retention 行)。Responses 的 store 默认开启正是本档不构成『默认零保留』的原因"
anchor = "volcengine-api-zdr-store-switch"

[[product.zdr.point]]
text = "§3.7.7(1) is one of the listed scenarios that need no separate consent: to meet legal compliance requirements Volcengine may automatically filter and review what you submit to and receive from the service, and build and improve risk-filtering mechanisms and libraries of unlawful or infringing content features — a vendor-side use of customer input and output that sits outside the default no-store/no-use promise."
text_zh = "§3.7.7(1) 是列明的无需单独同意场景之一:为履行合规要求,火山引擎可对您提交与输出的内容做自动化过滤审核,建立和改进风险过滤机制与违法违规侵权内容特征库——这是默认不存储不使用承诺之外的一项厂商侧使用"
anchor = "volcengine-api-compliance-review-content-use"

[[product.zdr.point]]
text = "Exception that can override this tier's rule: §3.7.8 — if you use a model service without the high-grade security protection (the security-sandbox mutual-trust scheme, which keeps your data from being handed to the model provider), your data-processing rules follow the model service agreement and rules you accepted; §3.7.2 likewise requires proprietary model services to observe the model provider's Model Service Agreement. Zero retention therefore has to be verified per upstream hop and is not implied by this tier's own terms."
text_zh = "可能覆盖本档结论的例外:§3.7.8——如您使用不具备高阶安全防护(安全沙箱安全互信方案,保护数据不提供给模型服务商)的模型服务,数据处理规则改由您接受的模型服务协议与规则约定;§3.7.2 同属一个要求,专有模型服务须遵守模型服务商的《模型服务协议》。故零保留须逐跳核实,不能由本档条款推出"
anchor = "volcengine-api-high-grade-security-exception"

[[product.zdr.point]]
text = "Functional zero retention is achievable (store=false, and the cache can be deleted). The \"zero data retention\" commitment in the white paper sits inside an image and cannot be machine-verified, so confidence=medium"
text_zh = "功能性零保留可行(store=false、缓存可删)。白皮书『数据零留存』承诺正文在图片里不可机器复核,故 confidence=medium"

[product.retention]
days = 3
object = "input_output"
basis = "fixed_period"
anchor = "volcengine-api-retention-responses-store"

[[product.retention.point]]
text = "Input and output (Responses API): storage is on by default, a stored response is kept 3 days by default and can be extended via expire_at up to 7 days — a typical value with a 7-day ceiling, not a floor. Input and output fields are stored, the chain of thought is not; store=false turns storage off."
text_zh = "输入输出正文(Responses API):默认开启存储,默认存 3 天、可用 expire_at 自定义最长 7 天——典型值、上限 7 天,不是下限。存 input/output 字段、不存思维链;store=false 可关"
anchor = "volcengine-api-retention-responses-store"

[[product.retention.point]]
text = "Cache: idle TTL is 1 hour to 7 days (3600-604800 s, default 86400 s), timed from creation and reset on each use, and the entry is deleted from the cache once the timer exceeds the TTL. Caveat on the source: the page carrying this figure is the developer doc titled 上下文缓存 API（已下线）(Context Cache API, retired) — a developer_data page, not a current contract commitment, so it is a supporting figure for the cache object only."
text_zh = "缓存:闲置 TTL 1 小时-7 天(3600-604800 秒,默认 86400 秒),创建即开始计时、每次使用重置,计时超过 ttl 即从缓存中删除。来源说明:该数字所在页面为开发者文档,标题已标『上下文缓存 API（已下线）』,属 developer_data 而非现行合同承诺,仅作缓存这一对象的佐证"
anchor = "volcengine-api-context-cache-ttl"

[[product.retention.point]]
text = "After service termination: 15 days is the fallback retention period of Products and Services Agreement §12.8, not an unconditional promise — the same sentence adds \"相关产品和服务专用条款或服务规则承诺期限另有约定的，以其专用条款或服务规则约定为准\", so a product-specific special term or service rule overrides it. This tier's own special terms (Ark platform terms) state no different period, so the 15 days govern here; it is a period for customer data and customer content in the account, not a cap on the retention figures above."
text_zh = "服务终止后:15 天是《产品和服务协议》§12.8 的兜底保留期而非无条件承诺——同句写明『相关产品和服务专用条款或服务规则承诺期限另有约定的，以其专用条款或服务规则约定为准』,专用条款或服务规则另有约定时优先。本档专用条款(方舟平台专用条款)未另设期限,故此处适用 15 天;该期限的对象是账号内的客户数据与客户内容,不是上面各项保留数字的上限"
anchor = "volcengine-generic-termination-retention-15d"

[[product.retention.point]]
text = "General terms §6.6: \"delete your customer data or anonymize it within a reasonable period after providing the service\""
text_zh = "通用条款 §6.6『提供服务后的合理期限内删除或匿名化』"
anchor = "volcengine-generic-delete-reasonable-period"

[[product.retention.point]]
text = "For the troubleshooting scenario it is \"within a reasonable time\", with no fixed period"
text_zh = "排障场景为『合理时间内』无固定期限"

[[product.retention.point]]
text = "Anomaly alerting (§3.7.7(3)): the object is the data that triggers a model anomaly alert, which Volcengine stores and reviews to guard against abnormal calls; once the alert is cleared the platform stops storing and reviewing it — a stated stop condition with no fixed number of days."
text_zh = "异常告警(§3.7.7(3)):对象是触发模型异常告警的数据,火山引擎为防范异常调用对其存储和审查;解除告警后平台不再继续存储和审查——有明确停止条件、无固定天数"
anchor = "volcengine-api-anomaly-alert-storage-stop"

