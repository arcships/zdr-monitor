[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"
label = "火山方舟按量 API(国内站,方舟大模型服务平台)"

[product.training]
mark = "yes"
anchor = "volcengine-api-training-zdr-default"
mode = "default"

[[product.training.point]]
text = "§3.7.7 by default: \"without your separate consent, Volcengine will not store or use your data to train or optimize models\""
text_zh = "§3.7.7 默认『未经单独同意不存储不使用』训练/优化"

[[product.training.point]]
text = "The separate-consent cases are the collaboration reward program (opt-in, through an authorized access point) and Doubao Model Service Agreement §4.1.1/4.1.2 (effective 2026-09-23)"
text_zh = "单独同意情形=协作奖励计划(opt-in,经授权接入点)与(2026-09-23 起生效的)豆包模型服务协议 §4.1.1/4.1.2"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "volcengine-api-training-zdr-default"

[[product.zdr.point]]
text = "Not stored and not used by default, with storage confined to four listed scenarios (compliance review, troubleshooting, anomaly alerting, aggregate statistics); under §3.7.11 storage for features requires authorization, and \"without your authorization, Volcengine will not access or use your data\""
text_zh = "默认不存储不使用,存储仅限四类列明场景(合规审查/排障/异常告警/聚合统计),§3.7.11 功能存储须经授权、未授权不访问"

[[product.zdr.point]]
text = "Functional zero retention is achievable (store=false, and the cache can be deleted). The \"zero data retention\" commitment in the white paper sits inside an image and cannot be machine-verified, so confidence=medium"
text_zh = "功能性零保留可行(store=false、缓存可删)。白皮书『数据零留存』承诺正文在图片里不可机器复核,故 confidence=medium"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "volcengine-api-retention-responses-store"

[[product.retention.point]]
text = "Responses API store defaults to true → stored for 3 days by default, customizable via expire_at up to 7 days; input and output are stored, the chain of thought is not; store=false turns it off"
text_zh = "Responses API store 默认 true→默认存 3 天、expire_at 最长 7 天,存 input/output 不存思维链,store=false 可关"

[[product.retention.point]]
text = "Context cache idle TTL 1 hour to 7 days (reset on each use)"
text_zh = "Context 缓存闲置 TTL 1 小时-7 天(每次使用重置)"

[[product.retention.point]]
text = "15 days after service termination (Products and Services Agreement §12.8)"
text_zh = "服务终止后 15 天(产品协议 §12.8)"

[[product.retention.point]]
text = "General terms §6.6: \"delete your customer data or anonymize it within a reasonable period after providing the service\""
text_zh = "通用条款 §6.6『提供服务后的合理期限内删除或匿名化』"

[[product.retention.point]]
text = "For the troubleshooting scenario it is \"within a reasonable time\", with no fixed period"
text_zh = "排障场景为『合理时间内』无固定期限"

[product.processing_region]
mark = "unknown"
basis = "undisclosed"
searched = [
  "https://docs.volcengine.com/docs/ark/volcengine-ark-model-service-security-whitepaper?lang=zh",
  "https://www.volcengine.com/docs/82379/2123283",
  "https://developer.volcengine.com/resource/7584381573106303012",
  "https://www.volcengine.com/docs/Legalagreements/VolcanoEnginesPrivacyPolicy",
  "https://www.volcengine.com/docs/82379/1104498",
  "https://www.volcengine.com/docs/ark/subscription-package-service-terms-conditions?lang=zh",
  "https://docs.volcengine.com/docs/Legalagreements/Productsandservicesagreement?lang=zh",
  "https://www.volcengine.com/docs/ark/modelark-faq?lang=zh",
  "https://www.volcengine.com/docs/ark/volcengine-ark-confidential-computing-whitepaper?lang=zh",
  "https://www.volcengine.com/product/ark",
  "https://www.volcengine.com/docs/82379/2374452",
]

[[product.processing_region.point]]
text = "Page 36 of the official security white paper (its existence is confirmable on the developer resources page; downloading the PDF requires being signed in), \"data related to the Ark platform is stored only in mainland China\", is a known disclosure, but the online doc page body is an image and r.jina.ai captures only the navigation shell, so it cannot be machine-verified"
text_zh = "官方安全白皮书(developer 资源页可确认存在,PDF 下载需登录态)第 36 页『方舟平台相关数据仅存储于中国大陆』是已知披露,但线上文档页正文为图片、r.jina.ai 只抓到导航壳,不可机器复核"

[[product.processing_region.point]]
text = "The object of the privacy policy's in-China storage clause is only \"users' personal information\""
text_zh = "隐私政策境内存储条款对象仅为『用户个人信息』"

[[product.processing_region.point]]
text = "The \"authorization to use this service only within mainland China\" in Special Terms §3.1 and Subscription Terms §2.2 is a use licence, not a storage location, and nothing is inferred from it"
text_zh = "专用条款 §3.1/订阅条款 §2.2 的『仅在中国大陆地区使用本服务的授权』是使用许可不是存储地,不据此推定"

[product.role]
kind = "processor"
anchor = "volcengine-api-role-delegated"

[[product.role.point]]
text = "Entrusted-processing wording: §3.7.7(2), in the troubleshooting scenario, \"processes your data on your mandate\", and aggregate statistics store and use no raw data"
text_zh = "受托(委托)处理语义:§3.7.7(2) 排障场景『依据您的委托处理您的数据』、聚合统计不存储不使用任何原始数据"

[[product.role.point]]
text = "At the contract layer there is also Products and Services Agreement §1.3, \"Volcengine is a neutral technology service provider\", and §6.6, \"will not use customer data at will except as necessary to provide the service or as authorized\""
text_zh = "合同层另有产品和服务协议 §1.3『中立的技术服务提供者』与 §6.6『除提供服务所必须或经授权外不会对客户数据任意使用』"

[[product.role.point]]
text = "There is no standard DPA; the role is carried by the terms of service"
text_zh = "无标准 DPA,角色载体为服务条款"

