[[product.processing_region.point]]
text = "Page 36 of the official security white paper (its existence is confirmable on the developer resources page; downloading the PDF requires being signed in), \"data related to the Ark platform is stored only in mainland China\", is a known disclosure, but the online doc page body is an image and r.jina.ai captures only the navigation shell, so it cannot be machine-verified"
text_zh = "官方安全白皮书(developer 资源页可确认存在,PDF 下载需登录态)第 36 页『方舟平台相关数据仅存储于中国大陆』是已知披露,但线上文档页正文为图片、r.jina.ai 只抓到导航壳,不可机器复核"

[[product.processing_region.point]]
text = "The object of the privacy policy's in-China storage clause is only \"users' personal information\""
text_zh = "隐私政策境内存储条款对象仅为『用户个人信息』"

[[product.processing_region.point]]
text = "The \"authorization to use this service only within mainland China\" in Special Terms §3.1 and Subscription Terms §2.2 is a use licence, not a storage location, and nothing is inferred from it"
text_zh = "专用条款 §3.1/订阅条款 §2.2 的『仅在中国大陆地区使用本服务的授权』是使用许可不是存储地,不据此推定"

[product.role]
kind = "processor"
anchor = "volcengine-api-role-delegated"

[[product.role.point]]
text = "Entrusted-processing wording: §3.7.7(2), in the troubleshooting scenario, \"processes your data on your mandate\", and aggregate statistics store and use no raw data"
text_zh = "受托(委托)处理语义:§3.7.7(2) 排障场景『依据您的委托处理您的数据』、聚合统计不存储不使用任何原始数据"

[[product.role.point]]
text = "At the contract layer there is also Products and Services Agreement §1.3, \"Volcengine is a neutral technology service provider\", and §6.6, \"will not use customer data at will except as necessary to provide the service or as authorized\""
text_zh = "合同层另有产品和服务协议 §1.3『中立的技术服务提供者』与 §6.6『除提供服务所必须或经授权外不会对客户数据任意使用』"

[[product.role.point]]
text = "There is no standard DPA; the role is carried by the terms of service"
text_zh = "无标准 DPA,角色载体为服务条款"

[[product.role.point]]
text = "Limit on the processor reading: Products and Services Agreement §6.7 lets Volcengine use the \"operating data\" it collects or generates while providing products and services and technical/network support (system logs, billing data, customer-service conversations, lead-capture information) to optimize and improve Volcengine's own products and services. The object is the vendor's own operating data, not customer input/output content, so it is an exception face of the processor reading and does not make the role a controller; it also means the vendor has a self-serving improvement use over that data, which the training row does not cover."
text_zh = "受托口径的例外面向:《产品和服务协议》§6.7 允许火山引擎把在提供产品和服务、技术和网络支持过程中自行收集或产生的『运营数据』(系统日志、账单数据、客服对话、留资信息等)用于优化和改善火山引擎自己的产品和服务。对象是厂商自身的运营数据而非客户的输入输出内容,故它不把 role 变成 controller;同时它表明厂商对这类数据有自主改善用途,不在 training 行的覆盖范围内"
anchor = "volcengine-generic-operating-data-improvement"

