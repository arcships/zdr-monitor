[[product.retention.point]]
text = "Objects and context: the data-collecting free models other than Iceman Free, Tidepool Alpha Free, Seaglass Alpha Free and Flint 40B Free say only that collected data may be used to improve the model (\"Big Pickle: During its free period, collected data may be used to improve the model.\"), and the NVIDIA free endpoints say use is logged for security and product-improvement purposes. Neither gives a period or a deletion commitment. Iceman Free, Tidepool Alpha Free, Seaglass Alpha Free and Flint 40B Free are stated separately below because their bullets add retention language."
text_zh = "对象与语境：除 Iceman Free、Tidepool Alpha Free、Seaglass Alpha Free 与 Flint 40B Free 外的数据收集类免费模型只写收集的数据可能用于改进模型（Big Pickle 等），NVIDIA 免费端点只写使用会被记录（安全与改进 NVIDIA 产品）；这些都没有期限或删除承诺。Iceman Free、Tidepool Alpha Free、Seaglass Alpha Free 与 Flint 40B Free 另叙于下，因为它们的条目额外写了保留相关表述。"
anchor = "opencode-zen-exceptions"

