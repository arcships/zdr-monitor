[[product]]
id = "zen-standard"
badge = "Zen 标准模型"
category = "coding_plan"
plan_level = "individual"
label = "OpenCode Zen 托管网关；如改用本地模型或自带 API key，请求可不经过 Zen，但数据姿态改由所选上游决定"

[product.training]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"

[[product.training.point]]
text = "Scope and unresolved conflict for Crouton Alpha Free, which is listed in this tier's endpoint and pricing tables: the Free models list says \"Crouton Alpha Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.\" Under this ledger's rule that using data to improve the model counts as training, that sentence is a training-use statement. The same page's Privacy exception for the same model says the data is not used for model training (quoted in the next point). These two current first-party statements conflict; both are kept with their own scope and the divergence is not resolved here, so mark=yes / mode=default does not extend to Crouton Alpha Free."
text_zh = "Crouton Alpha Free 列在本档端点表与价目表内，其训练口径存在未裁定的冲突：免费模型列表写「Crouton Alpha Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.」，按本台账「用于改进模型算训练」的口径，这是一句训练用途表述；同一页 Privacy 例外清单又写该数据不用于模型训练（原文见下一条）。两句均为同一页的官方现行表述，各自有适用范围；本轮并列保留、不选边，因此 mark=yes / mode=default 不延伸到 Crouton Alpha Free。"
anchor = "opencode-zen-crouton-free-models"

[[product.training.point]]
text = "The Privacy half of that conflict, in full: \"Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.\" Its scope is the Privacy exception list and data collected during the free period; it says the data is not used for model training, directly contradicting the Free models entry above, so Crouton's training posture is recorded as a conflict rather than resolved in either direction."
text_zh = "上述冲突的 Privacy 一侧原文：「Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.」。其适用范围是 Privacy 例外清单与免费期内收集的数据；它明确说不用于模型训练，与上面的免费模型条目直接冲突，因此 Crouton 的训练口径记为冲突并列，而不是向任何一侧裁定。"
anchor = "opencode-zen-crouton-30-days"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"

[[product.zdr.point]]
text = "Zero retention is the default only for models outside the exception list in the same privacy section: \"OpenAI APIs: Requests are retained for 30 days in accordance with OpenAI’s Data Policies\" and the identical clause for Anthropic APIs. Claude and GPT families are listed in this tier's own endpoint and pricing tables, so mark=yes / mode=default does not hold for that subset."
text_zh = "「默认零保留」只对隐私段例外清单以外的模型成立：走 OpenAI APIs 与 Anthropic APIs 的请求保留 30 天（按各自数据政策）。Claude、GPT 系模型都在本档的端点表与价目表内，因此选择这些模型时本档不是零保留。"
anchor = "opencode-zen-30-days"

[[product.zdr.point]]
text = "Additional data flow: session content is also sent to low-cost models — \"You may notice low-cost models, such as Haiku, Nano, or Flash, in your usage history. OpenCode uses these models to generate session titles.\" Those models are Zen endpoints themselves; the docs give no separate period for the derived title data."
text_zh = "额外数据流：会话内容还会被送往低成本模型生成会话标题——「You may notice low-cost models, such as Haiku, Nano, or Flash, in your usage history. OpenCode uses these models to generate session titles.」。这些模型本身就在 Zen 端点表内；官方未就标题这类派生数据单独给出保留期限。"
anchor = "opencode-zen-session-titles"

[[product.zdr.point]]
text = "A further exception in the same privacy section defers the Mistral models' retention to the provider: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" Mistral Large 4 is listed in this tier's own endpoint and pricing tables, and the docs state no retention period of their own — the period is deferred to a third party's policy."
text_zh = "同一隐私段的另一条例外把 Mistral 模型的保留期限指向上游：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」Mistral Large 4 已列入本档端点表与价目表；官方未自行给出保留期限，而是把期限指向第三方（Mistral）的政策。"
anchor = "opencode-zen-mistral-exception"

[[product.zdr.point]]
text = "A further exception in the same privacy section keeps Beam Free requests for 30 days rather than zero retention: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Beam Free is listed in this tier's own endpoint and pricing tables, so mark=yes / mode=default does not hold for that model."
text_zh = "同一隐私段的另一条例外把 Beam Free 的请求保留 30 天，而不是零保留：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」Beam Free 已列入本档端点表与价目表，因此选择该模型时本档不是零保留。"
anchor = "opencode-zen-beam-30-days"

[[product.zdr.point]]
text = "A further exception in the same privacy section keeps Crouton Alpha Free's collected data for 30 days, so it is not zero-retention: \"Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.\" Crouton Alpha Free is listed in this tier's own endpoint and pricing tables. Its training statement conflicts with the Free models entry (see the training points); that conflict does not affect the fixed 30-day retention, which keeps mark=yes / mode=default from holding for this model's retention posture."
text_zh = "同一隐私段的另一条例外把 Crouton Alpha Free 收集的数据保留 30 天，因此不是零保留：「Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.」。Crouton Alpha Free 已列入本档端点表与价目表。其训练表述与免费模型条目冲突（见 training 依据）；该冲突不影响固定的 30 天保留，故选择该模型时本档的零保留默认不成立。"
anchor = "opencode-zen-crouton-30-days"

[product.retention]
object = "input_output"
basis = "none"
anchor = "opencode-zen-privacy"

[[product.retention.point]]
text_zh = "标准口径为上游零保留；但 OpenAI API 与 Anthropic API 明列请求保留 30 天，因此选择这些模型时本档不是零保留。缓存价目存在 cached read/write，但缓存期限未披露。"
anchor = "opencode-zen-30-days"

[[product.retention.point]]
text = "Mistral exception: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" No period or deletion commitment is stated for Mistral requests — the period is deferred to Mistral's policy — so it is recorded as a carve-out from the upstream zero-retention default, not as a fixed term."
text_zh = "Mistral 例外：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」——Mistral 请求没有给出期限或删除承诺，期限指向 Mistral 的政策，因此记为上游零保留默认之外的 carve-out，而不是任何固定期限。"
anchor = "opencode-zen-mistral-exception"

[[product.retention.point]]
text = "Beam Free exception: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Requests are kept for a fixed 30-day safety period, so this is a carve-out from the upstream zero-retention default rather than a zero-retention model."
text_zh = "Beam Free 例外：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」——请求因安全目的固定保留 30 天，是上游零保留默认之外的一条例外，而不是零保留模型。"
anchor = "opencode-zen-beam-30-days"

[[product.retention.point]]
text = "Crouton Alpha Free exception: \"Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.\" Collected data is kept for a fixed 30-day period during the free period, so this is a carve-out from the upstream zero-retention default rather than a zero-retention model; no further period or post-free-period deletion commitment is stated. Its training statement conflicts with the Free models entry (see the training points); that does not change the fixed 30-day retention."
text_zh = "Crouton Alpha Free 例外：「Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.」——免费期内收集的数据固定保留 30 天，是上游零保留默认之外的一条例外，而不是零保留模型；文档没有给出更长期限，也没有说明免费期结束后是否删除。其训练表述与免费模型条目冲突（见 training 依据），不影响固定的 30 天保留。"
anchor = "opencode-zen-crouton-30-days"

[[product.retention.point]]
text = "Contract layer (higher authority than the Zen docs): \"Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.\" OpenCode itself claims not to retain Content; the sentence is aimed at Third Party Model providers, so it does not settle retention on the Zen-hosted path."
text_zh = "合同层（权威性高于 Zen 文档）：OpenCode 自称不保留你的 Content，同时把保留责任推给第三方模型商——「Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.」。该句针对 Third Party Models（BYOK/直连）路径，不覆盖 Zen 自身托管路径的保留。"
anchor = "opencode-tos-retention"

[product.processing_region]
codes = ["US", "EU"]
anchor = "opencode-zen-privacy"

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://opencode.ai/legal/privacy-policy", "https://opencode.ai/legal/terms-of-service", "https://opencode.ai/docs/zen"]

[[product]]
id = "zen-data-collecting-models"
badge = "Zen 数据收集模型"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
anchor = "opencode-zen-exceptions"

[[product.training.point]]
text = "Contract layer (the highest-authority source in this file): \"In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services.\" Using Content to improve the Services counts as training under this ledger's rules, and this clause covers the free tier's Content independently of the Zen privacy exceptions."
text_zh = "合同层（本文件权威性最高的来源）：厂商明文授权对 unpaid account 用 Content「further develop and improve our Services」。按本台账口径「用于改进服务算训练」，免费档的 Content 直接落在该授权范围内；与 Zen 隐私段的例外清单互相印证。"
anchor = "opencode-tos-unpaid-training"

[[product.training.point]]
text = "Inkling 2 Small Free is a new data-collecting exception in the same privacy section, and its terms expressly reach model training: \"Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training. See Thinking Machines’ Terms of Service and Privacy Notice.\" The Free models list says the same thing in shorter form — \"Its provider retains your data and may use it for model training; see Privacy.\" Under this ledger's rule both are training-use statements, so this is a data-collecting free model, not a no-training one; the bullet defers further detail to Thinking Machines' own terms, which are not used as evidence here."
text_zh = "Inkling 2 Small Free 是同一隐私段新增的数据收集型例外，其条款明文写到模型训练：「Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training. See Thinking Machines’ Terms of Service and Privacy Notice.」。免费模型列表用更短的措辞表达同一件事——「Its provider retains your data and may use it for model training; see Privacy.」。按本台账口径，两者都属训练用途表述，因此这是数据收集型免费模型，而不是不训练模型；该条把细节指向 Thinking Machines 自己的条款，那些条款不作为本台账证据。"
anchor = "opencode-zen-inkling-exception"

[[product.training.point]]
text = "Iceman Free was added in the 2026-11-07 snapshot, and its privacy exception says the collected data is retained and used to improve the model: \"Iceman Free: During its free period, collected data is retained and used to improve the model.\" The Free models list describes the same model as a stealth model whose free period is used \"to collect feedback and improve the model.\" Both statements point the same way, so unlike Crouton Alpha Free there is no conflict: under this ledger's rule this is a data-collecting free model, not a no-training one."
text_zh = "Iceman Free 在 2026-11-07 快照新增，其隐私例外写明收集的数据会被保留并用于改进模型：「Iceman Free: During its free period, collected data is retained and used to improve the model.」免费模型列表对同一模型的描述也是团队利用免费期「to collect feedback and improve the model」。两句方向一致，因此不像 Crouton Alpha Free 那样存在冲突：按本台账口径，这是数据收集型免费模型，而不是不训练模型。"
anchor = "opencode-zen-iceman-exception"

[product.zdr]
mark = "no"
anchor = "opencode-zen-exceptions"

[[product.zdr.point]]
text = "Free NVIDIA endpoints: \"Nemotron 3 Ultra Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.\" The logging is stated with no time limit, so this tier offers no zero-retention option; the same sentence also bars submitting personal or confidential data."
text_zh = "免费 NVIDIA 端点：「Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.」——使用会被记录且未给期限，本档没有零保留方案；同段还禁止提交个人或机密数据，对采购是硬约束。"
anchor = "opencode-zen-nvidia-free"

[[product.zdr.point]]
text = "The same NVIDIA free-endpoint group also includes Nemotron 3.5 Super VL Free, added in the 2026-10-16 snapshot: \"Nemotron 3.5 Super VL Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.\" It carries the same logging/no-zero-retention posture and is a Console free model a workspace can enable."
text_zh = "同一 NVIDIA 免费端点组还包含 2026-10-16 快照新增的 Nemotron 3.5 Super VL Free：「Nemotron 3.5 Super VL Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.」。它与既有 NVIDIA 免费端点同样是记录使用、无零保留，并且是工作区可启用的 Console 免费模型。"
anchor = "opencode-zen-nemotron-super-vl"

[[product.zdr.point]]
text = "Inkling 2 Small Free adds an explicit retention-and-training permission to the same exception list: \"Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training.\" The docs state no zero-retention option for this model, so it reinforces zdr=no for this tier."
text_zh = "Inkling 2 Small Free 在同一例外清单里新增了明确的保留与训练授权：「Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training.」文档没有为该模型提供零保留方案，因此本档 zdr=no 继续成立。"
anchor = "opencode-zen-inkling-exception"

[[product.zdr.point]]
text = "Iceman Free adds another explicit retention-and-use permission to the same exception list: \"Iceman Free: During its free period, collected data is retained and used to improve the model.\" The docs state no zero-retention option for this model, so it reinforces zdr=no for this tier."
text_zh = "Iceman Free 在同一例外清单里新增了又一条明确的保留与使用授权：「Iceman Free: During its free period, collected data is retained and used to improve the model.」文档没有为该模型提供零保留方案，因此本档 zdr=no 继续成立。"
anchor = "opencode-zen-iceman-exception"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "opencode-zen-nvidia-free"
searched = ["https://opencode.ai/docs/zen", "https://opencode.ai/legal/terms-of-service", "https://opencode.ai/legal/privacy-policy"]

[[product.retention.point]]
text = "Objects and context: the data-collecting free models other than Iceman Free, Inkling 2 Small Free and Flint 40B Free say only that collected data may be used to improve the model (\"Big Pickle: During its free period, collected data may be used to improve the model.\"), and the NVIDIA free endpoints say use is logged for security and product-improvement purposes. Neither gives a period or a deletion commitment. Iceman Free, Inkling 2 Small Free and Flint 40B Free are stated separately below because their bullets add retention language."
text_zh = "对象与语境：除 Iceman Free、Inkling 2 Small Free 与 Flint 40B Free 外的数据收集类免费模型只写收集的数据可能用于改进模型（Big Pickle 等），NVIDIA 免费端点只写使用会被记录（安全与改进 NVIDIA 产品）；这些都没有期限或删除承诺。Iceman Free、Inkling 2 Small Free 与 Flint 40B Free 另叙于下，因为它们的条目额外写了保留相关表述。"
anchor = "opencode-zen-exceptions"

[[product.retention.point]]
text = "Inkling 2 Small Free exception: \"Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training.\" The retention permission is scoped to the free period; its length and any post-free-period deletion are not stated, so this is a further carve-out with basis=undisclosed rather than a fixed term."
text_zh = "Inkling 2 Small Free 例外：「Inkling 2 Small Free: During its free period, collected data is retained and may be used to monitor the model’s real-world performance and for model training.」——保留授权以免费期为范围；免费期多长、免费期结束后是否删除均未说明，因此这是又一条 basis=undisclosed 的例外，而非固定期限。"
anchor = "opencode-zen-inkling-exception"

[[product.retention.point]]
text = "Iceman Free exception: \"Iceman Free: During its free period, collected data is retained and used to improve the model.\" The retention permission is scoped to the free period; its length and any post-free-period deletion are not stated, so this is a further carve-out with basis=undisclosed rather than a fixed term."
text_zh = "Iceman Free 例外：「Iceman Free: During its free period, collected data is retained and used to improve the model.」——保留授权以免费期为范围；免费期多长、免费期结束后是否删除均未说明，因此这是又一条 basis=undisclosed 的例外，而非固定期限。"
anchor = "opencode-zen-iceman-exception"

[[product.retention.point]]
text = "Beam Free is not part of this tier: its exception bullet says it is not used for training and is retained for 30 days, and that posture is recorded in the zdr and retention points of zen-standard, zen-team and zen-enterprise, not here."
text_zh = "Beam Free 不属于本档：其例外条目写的是不用于训练、保留 30 天，这一姿态记在 zen-standard、zen-team、zen-enterprise 三档的 zdr 与 retention 依据中，不在这里。"
anchor = "opencode-zen-beam-30-days"

[[product.retention.point]]
text = "Crouton Alpha Free is not assigned to this data-collecting tier: its Free models entry says the team is using the free period to collect feedback and improve the model, while its Privacy exception says collected data is retained for 30 days and is not used for model training. Those two current first-party statements conflict, so its training posture is left unresolved in the training points of zen-standard, zen-team and zen-enterprise rather than being counted as a data-collecting model here or treated as confirmed no-training. Its fixed 30-day retention is recorded in those tiers' zdr and retention points."
text_zh = "Crouton Alpha Free 不归入本档：其免费模型条目写团队会利用免费期收集反馈并改进模型，其 Privacy 例外则写收集的数据保留 30 天且不用于模型训练。两句官方现行表述互相冲突，因此其训练口径在 zen-standard、zen-team、zen-enterprise 的 training 依据中并列保留、未裁定；本档既不把它计为数据收集模型，也不把它当作已确认的不训练模型。其固定 30 天保留记在上述三档的 zdr 与 retention 依据中。"
anchor = "opencode-zen-crouton-30-days"

[[product.retention.point]]
text = "Flint 40B Free adds an explicit period: \"Flint 40B Free: During its free period, collected data may be used to improve the model. Data is retained for 30 days.\" Because the tier groups models with different terms, retention is recorded as object=mixed / basis=undisclosed, with this 30-day carve-out stated separately."
text_zh = "Flint 40B Free 另给出明确期限：「Flint 40B Free: During its free period, collected data may be used to improve the model. Data is retained for 30 days.」。由于本档聚合了期限不同的模型，保留仍记为 object=mixed / basis=undisclosed，并单独列出这条例外。"
anchor = "opencode-zen-flint-30-days"

[[product.retention.point]]
text = "Contract layer: \"Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.\" For this tier the Console privacy exceptions (collected data used for improvement, Flint's 30-day retention, NVIDIA use logged) are the more specific statement."
text_zh = "合同层：OpenCode 自称不保留 Content，但明说控制不了第三方模型商的保留实践——「Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.」。本档更具体的依据是 Console 隐私段的例外清单（收集数据用于改进、Flint 保留 30 天、NVIDIA 端点记录使用）。"
anchor = "opencode-tos-retention"

