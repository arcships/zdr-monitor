[[product]]
id = "zen-team"
badge = "Zen Teams"
category = "coding_plan"
plan_level = "team"
label = "团队工作区使用 OpenCode Zen 托管模型的链路，不含会收集数据的免费模型（这些模型单列「Zen 数据收集模型」档）；不涵盖 BYOK、本地模型或直连其他提供商"
[product.training]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"
[[product.training.point]]
text = "Scope limit: mark=yes / mode=default holds only for models outside the exception list in the same privacy section. The models that collect data or are used for training (Big Pickle, Iceman Free, Flint 40B Free, MiMo-V2.6-Flash Free, Nemotron 3 Ultra Free, Nemotron 3.5 Lightning Free, Nemotron 3.5 Super VL Free, Inkling 2 Small Free) are Console models a team workspace can enable, so their posture is recorded in the separate \"Zen 数据收集模型\" tier, not in this row."
text_zh = "适用范围限定：mark=yes / mode=default 只对隐私段例外清单以外的模型成立。例外清单里会收集数据或用于训练模型的档（Big Pickle、Iceman Free、Flint 40B Free、MiMo-V2.6-Flash Free、Nemotron 3 Ultra Free、Nemotron 3.5 Lightning Free、Nemotron 3.5 Super VL Free、Inkling 2 Small Free）都是团队工作区可启用的 Console 模型，其姿态记在「Zen 数据收集模型」档，不在本行。"
anchor = "opencode-zen-exceptions"
[[product.training.point]]
text = "Crouton Alpha Free is an exception with an unresolved training-position conflict, so it is neither added to the settled data-collecting list above nor treated as covered by the no-training default. The Free models list says \"Crouton Alpha Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.\" — a training-use statement under this ledger's rule — while the Privacy exception says the data \"is not used for model training\" (quoted in the next point). Both current first-party statements are kept with their own scope; mark=yes / mode=default does not extend to Crouton Alpha Free."
text_zh = "Crouton Alpha Free 是训练口径存在未裁定冲突的例外，因此既不加入上面的已确认数据收集模型清单，也不视为落在不训练的默认口径内。免费模型列表写「Crouton Alpha Free is a stealth model that’s free on OpenCode for a limited time. The team is using this time to collect feedback and improve the model.」——按本台账口径属于训练用途表述；Privacy 例外清单则说该数据「is not used for model training」（原文见下一条）。两句官方现行表述各自保留适用范围；mark=yes / mode=default 不延伸到 Crouton Alpha Free。"
anchor = "opencode-zen-crouton-free-models"
[[product.training.point]]
text = "The Privacy half of that conflict: \"Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.\" Its scope is the Privacy exception list and free-period data; it directly contradicts the Free models entry above, so the conflict is left visible rather than resolved by preferring one sentence."
text_zh = "上述冲突的 Privacy 一侧：「Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.」。其适用范围是 Privacy 例外清单与免费期数据；它与上面的免费模型条目直接冲突，因此并列保留冲突，而不是选用其中一句来裁定。"
anchor = "opencode-zen-crouton-30-days"
[[product.training.point]]
text = "The Console docs make the workspace model list an admin choice rather than a fixed list: \"Owners and admins can invite members, choose which models are enabled from the **Models** tab, set budgets, and connect their own providers.\" Data-collecting models can therefore appear in a workspace's enabled set; the docs do not make disabling them the default, so this row's conclusion is stated for a workspace model list excluding those models."
text_zh = "Console 文档把工作区模型清单写成管理员的选择，而不是固定清单：「Owners and admins can invite members, choose which models are enabled from the **Models** tab, set budgets, and connect their own providers.」——会收集数据的模型因此可能出现在工作区启用的模型里；文档没有把关闭它们设为默认，因此本行结论只对不含这些模型的工作区模型清单成立。"
anchor = "opencode-zen-model-access"
[[product.training.point]]
text = "Contract layer, applicability unresolved: the Terms of Use allow using Content to improve the Services for unpaid accounts. The Console docs describe workspace model selection and budgets but no longer state whether a team workspace is free or paid, and no official text defines whether a team workspace is an \"unpaid account\", so this row is not re-judged on that clause — it is recorded as an open question."
text_zh = "合同层适用性待澄清：Terms of Use 授权对 unpaid account 用 Content 改进服务。Console 文档只写工作区模型选择与预算，已不再说明团队工作区是免费还是付费；官方文本也没有界定团队工作区是否算 unpaid account，因此本行不据此改写结论，只记为待澄清项。"
anchor = "opencode-tos-unpaid-training"
[product.zdr]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"
[[product.zdr.point]]
text = "Exceptions in the same privacy section take part of this tier's models out of zero retention: \"OpenAI APIs: Requests are retained for 30 days in accordance with OpenAI’s Data Policies\" (identical for Anthropic APIs), and the data-collecting free models a workspace can enable are collected from and logged. mark=yes / mode=default therefore holds only for models outside that exception list."
text_zh = "隐私段的例外清单把本档部分模型排除在零保留之外：走 OpenAI APIs / Anthropic APIs 的请求保留 30 天；工作区可启用的数据收集类免费模型会被收集数据并记录使用。因此 mark=yes / mode=default 只对例外清单以外的模型成立。"
anchor = "opencode-zen-30-days"

[[product.zdr.point]]
text = "A further exception in the same privacy section defers the Mistral models' retention to the provider: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" Mistral Large 4 is a Zen endpoint a workspace can enable, and the docs state no retention period of their own — the period is deferred to a third party's policy."
text_zh = "同一隐私段的另一条例外把 Mistral 模型的保留期限指向上游：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」Mistral Large 4 是工作区可启用的 Zen 端点；官方未自行给出保留期限，而是把期限指向第三方（Mistral）的政策。"
anchor = "opencode-zen-mistral-exception"

[[product.zdr.point]]
text = "A further exception in the same privacy section keeps Beam Free requests for 30 days rather than zero retention: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Beam Free is a Console free model a workspace can enable, so mark=yes / mode=default does not hold for that model either."
text_zh = "同一隐私段的另一条例外把 Beam Free 的请求保留 30 天，而不是零保留：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」Beam Free 是工作区可启用的 Console 免费模型，因此选择该模型时也不是零保留。"
anchor = "opencode-zen-beam-30-days"

[[product.zdr.point]]
text = "A further exception in the same privacy section keeps Crouton Alpha Free's collected data for 30 days, so it is not zero-retention: \"Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.\" Crouton Alpha Free is a Console free model a workspace can enable. Its training statement conflicts with the Free models entry (see the training points); that conflict does not affect the fixed 30-day retention, which keeps mark=yes / mode=default from holding for this model's retention posture either."
text_zh = "同一隐私段的另一条例外把 Crouton Alpha Free 收集的数据保留 30 天，因此不是零保留：「Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.」。Crouton Alpha Free 是工作区可启用的 Console 免费模型。其训练表述与免费模型条目冲突（见 training 依据）；该冲突不影响固定的 30 天保留，故选择该模型时本档的零保留默认也不成立。"
anchor = "opencode-zen-crouton-30-days"
[product.retention]
object = "input_output"
basis = "none"
anchor = "opencode-zen-privacy"
[[product.retention.point]]
text_zh = "标准口径为上游零保留；但 OpenAI API 与 Anthropic API 明列请求保留 30 天，因此选择这些模型时本档不是零保留。缓存价目存在 cached read/write，但缓存期限未披露。"
anchor = "opencode-zen-30-days"

[[product.retention.point]]
text = "Mistral exception: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" No period or deletion commitment is stated for Mistral requests — the period is deferred to Mistral's policy — so it is recorded as a carve-out from the upstream zero-retention default, not as a fixed term."
text_zh = "Mistral 例外：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」——Mistral 请求没有给出期限或删除承诺，期限指向 Mistral 的政策，因此记为上游零保留默认之外的 carve-out，而不是任何固定期限。"
anchor = "opencode-zen-mistral-exception"

[[product.retention.point]]
text = "Beam Free exception: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Requests are kept for a fixed 30-day safety period, so this is a carve-out from the upstream zero-retention default rather than a zero-retention model."
text_zh = "Beam Free 例外：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」——请求因安全目的固定保留 30 天，是上游零保留默认之外的一条例外，而不是零保留模型。"
anchor = "opencode-zen-beam-30-days"

[[product.retention.point]]
text = "Crouton Alpha Free exception: \"Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.\" Collected data is kept for a fixed 30-day period during the free period, so this is a carve-out from the upstream zero-retention default rather than a zero-retention model; no further period or post-free-period deletion commitment is stated. Its training statement conflicts with the Free models entry (see the training points); that does not change the fixed 30-day retention."
text_zh = "Crouton Alpha Free 例外：「Crouton Alpha Free: During its free period, collected data is retained for 30 days and is not used for model training.」——免费期内收集的数据固定保留 30 天，是上游零保留默认之外的一条例外，而不是零保留模型；文档没有给出更长期限，也没有说明免费期结束后是否删除。其训练表述与免费模型条目冲突（见 training 依据），不影响固定的 30 天保留。"
anchor = "opencode-zen-crouton-30-days"
[[product.retention.point]]
text = "Contract layer (higher authority than the Zen docs): \"Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.\" The sentence is aimed at Third Party Model providers, so it does not settle retention on the Zen-hosted path."
text_zh = "合同层（权威性高于 Zen 文档）：OpenCode 自称不保留你的 Content，同时把保留责任推给第三方模型商——「Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.」。该句针对 Third Party Models（BYOK/直连）路径，不覆盖 Zen 自身托管路径的保留。"
anchor = "opencode-tos-retention"
