[[product]]
id = "zen-standard"
badge = "Zen 标准模型"
category = "coding_plan"
plan_level = "individual"
label = "OpenCode Zen 托管网关；如改用本地模型或自带 API key，请求可不经过 Zen，但数据姿态改由所选上游决定"

[product.training]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"

[[product.zdr.point]]
text = "Zero retention is the default only for models outside the exception list in the same privacy section: \"OpenAI APIs: Requests are retained for 30 days in accordance with OpenAI’s Data Policies\" and the identical clause for Anthropic APIs. Claude and GPT families are listed in this tier's own endpoint and pricing tables, so mark=yes / mode=default does not hold for that subset."
text_zh = "「默认零保留」只对隐私段例外清单以外的模型成立：走 OpenAI APIs 与 Anthropic APIs 的请求保留 30 天（按各自数据政策）。Claude、GPT 系模型都在本档的端点表与价目表内，因此选择这些模型时本档不是零保留。"
anchor = "opencode-zen-30-days"

[[product.zdr.point]]
text = "Additional data flow: session content is also sent to low-cost models — \"You may notice low-cost models, such as Haiku, Nano, or Flash, in your usage history. OpenCode uses these models to generate session titles.\" Those models are Zen endpoints themselves; the docs give no separate period for the derived title data."
text_zh = "额外数据流：会话内容还会被送往低成本模型生成会话标题——「You may notice low-cost models, such as Haiku, Nano, or Flash, in your usage history. OpenCode uses these models to generate session titles.」。这些模型本身就在 Zen 端点表内；官方未就标题这类派生数据单独给出保留期限。"
anchor = "opencode-zen-session-titles"

[product.retention]
object = "input_output"
basis = "none"
anchor = "opencode-zen-privacy"

[[product.retention.point]]
text_zh = "标准口径为上游零保留；但 OpenAI API 与 Anthropic API 明列请求保留 30 天，因此选择这些模型时本档不是零保留。缓存价目存在 cached read/write，但缓存期限未披露。"
anchor = "opencode-zen-30-days"

[[product.retention.point]]
text = "Contract layer (higher authority than the Zen docs): \"Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.\" OpenCode itself claims not to retain Content; the sentence is aimed at Third Party Model providers, so it does not settle retention on the Zen-hosted path."
text_zh = "合同层（权威性高于 Zen 文档）：OpenCode 自称不保留你的 Content，同时把保留责任推给第三方模型商——「Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.」。该句针对 Third Party Models（BYOK/直连）路径，不覆盖 Zen 自身托管路径的保留。"
anchor = "opencode-tos-retention"

[product.processing_region]
codes = ["US"]
anchor = "opencode-zen-privacy"

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://opencode.ai/legal/privacy-policy", "https://opencode.ai/legal/terms-of-service", "https://opencode.ai/docs/zen"]

[[product]]
id = "zen-data-collecting-models"
badge = "Zen 数据收集模型"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
anchor = "opencode-zen-exceptions"

[[product.training.point]]
text = "Contract layer (the highest-authority source in this file): \"In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services.\" Using Content to improve the Services counts as training under this ledger's rules, and this clause covers the free tier's Content independently of the Zen privacy exceptions."
text_zh = "合同层（本文件权威性最高的来源）：厂商明文授权对 unpaid account 用 Content「further develop and improve our Services」。按本台账口径「用于改进服务算训练」，免费档的 Content 直接落在该授权范围内；与 Zen 隐私段的例外清单互相印证。"
anchor = "opencode-tos-unpaid-training"

[product.zdr]
mark = "no"
anchor = "opencode-zen-exceptions"

[[product.zdr.point]]
text = "Free NVIDIA endpoints: \"Nemotron 3 Ultra Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.\" The logging is stated with no time limit, so this tier offers no zero-retention option; the same sentence also bars submitting personal or confidential data."
text_zh = "免费 NVIDIA 端点：「Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.」——使用会被记录且未给期限，本档没有零保留方案；同段还禁止提交个人或机密数据，对采购是硬约束。"
anchor = "opencode-zen-nvidia-free"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "opencode-zen-nvidia-free"
searched = ["https://opencode.ai/docs/zen", "https://opencode.ai/legal/terms-of-service", "https://opencode.ai/legal/privacy-policy"]

[[product.retention.point]]
text = "Objects and context: the data-collecting free models say only that collected data may be used to improve the model (\"Big Pickle: During its free period, collected data may be used to improve the model.\"), and the NVIDIA free endpoints say use is logged for security and product-improvement purposes. Neither gives a period or a deletion commitment, so the duration is recorded as undisclosed rather than as any fixed term."
text_zh = "对象与语境：数据收集类免费模型只写收集的数据可能用于改进模型（Big Pickle 等），NVIDIA 免费端点只写使用会被记录（安全与改进 NVIDIA 产品）。两处都没有期限或删除承诺，因此按「期限未公布」记，而不是任何固定期限；查阅范围见本档 searched。"
anchor = "opencode-zen-exceptions"

[[product.retention.point]]
text = "Contract layer: \"Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.\" For this tier the Zen privacy exceptions (collected data used for improvement, NVIDIA use logged) are the more specific statement."
text_zh = "合同层：OpenCode 自称不保留 Content，但明说控制不了第三方模型商的保留实践——「Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.」。本档更具体的依据是 Zen 隐私段的例外清单（收集数据用于改进、NVIDIA 端点记录使用）。"
anchor = "opencode-tos-retention"

[product.processing_region]
codes = ["US"]
anchor = "opencode-zen-privacy"

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://opencode.ai/legal/privacy-policy", "https://opencode.ai/legal/terms-of-service", "https://opencode.ai/docs/zen"]

[[product]]
id = "zen-team"
badge = "Zen Teams"
category = "coding_plan"
plan_level = "team"
label = "团队工作区使用 OpenCode Zen 托管模型的链路，不含会收集数据的免费模型（这些模型单列「Zen 数据收集模型」档）；不涵盖 BYOK、本地模型或直连其他提供商"
[product.training]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"
[[product.training.point]]
text = "Scope limit: mark=yes / mode=default holds only for models outside the exception list in the same privacy section. The models that collect data or are used for training (Big Pickle, MiMo-V2.6-Flash Free, MiMo-V2.5 Free, Ling 3.0 Flash Fin Free, Nemotron 3 Ultra Free, Nemotron 3.5 Lightning Free, Muse Spark 1.3 Contributor Free) are Zen models a team workspace can enable, so their posture is recorded in the separate \"Zen 数据收集模型\" tier, not in this row."
text_zh = "适用范围限定：mark=yes / mode=default 只对隐私段例外清单以外的模型成立。例外清单里会收集数据或用于训练模型的档（Big Pickle、MiMo-V2.6-Flash Free、MiMo-V2.5 Free、Ling 3.0 Flash Fin Free、Nemotron 3 Ultra Free、Nemotron 3.5 Lightning Free、Muse Spark 1.3 Contributor Free）都是团队工作区可启用的 Zen 模型，其姿态记在「Zen 数据收集模型」档，不在本行。"
anchor = "opencode-zen-exceptions"
[[product.training.point]]
text = "The team docs themselves treat data-collecting models as part of a workspace's model list: \"This is useful for cases where you want to disable the use of a model that collects data.\" Admins can switch them off, but nothing makes that the default, so this row's conclusion is stated for a workspace model list excluding those models."
text_zh = "团队文档自己就把「会收集数据的模型」当成工作区模型清单里可能存在的一项：「This is useful for cases where you want to disable the use of a model that collects data.」——管理员可以关掉，但不是默认关闭；因此本行结论只对不含这些模型的工作区模型清单成立。"
anchor = "opencode-zen-model-access"
[[product.training.point]]
text = "Contract layer, applicability unresolved: the Terms of Use allow using Content to improve the Services for unpaid accounts, and the Zen docs say \"Workspaces are currently free for teams as a part of the beta.\" No official text defines whether a beta-free team workspace is an \"unpaid account\", so this row is not re-judged on that clause — it is recorded as an open question."
text_zh = "合同层适用性待澄清：Terms of Use 授权对 unpaid account 用 Content 改进服务，而 Zen 文档写「Workspaces are currently free for teams as a part of the beta」。beta 期免费的团队工作区是否算 unpaid account，官方文本没有界定，因此本行不据此改写结论，只记为待澄清项。"
anchor = "opencode-tos-unpaid-training"
[product.zdr]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"
[[product.zdr.point]]
text = "Exceptions in the same privacy section take part of this tier's models out of zero retention: \"OpenAI APIs: Requests are retained for 30 days in accordance with OpenAI’s Data Policies\" (identical for Anthropic APIs), and the data-collecting free models a workspace can enable are collected from and logged. mark=yes / mode=default therefore holds only for models outside that exception list."
text_zh = "隐私段的例外清单把本档部分模型排除在零保留之外：走 OpenAI APIs / Anthropic APIs 的请求保留 30 天；工作区可启用的数据收集类免费模型会被收集数据并记录使用。因此 mark=yes / mode=default 只对例外清单以外的模型成立。"
anchor = "opencode-zen-30-days"
[product.retention]
