text = "MiMo-V2.6-Flash Free now falls under the default zero-retention sentence rather than the exception list, so its retention posture is the same as the rest of this tier (object=input_output, basis=none). The Free models bullet only repeats that the team is using the limited-time period to collect feedback and does not add a separate retention carve-out; the operative retention commitment is the default zero-retention sentence."
text_zh = "MiMo-V2.6-Flash Free 现在适用默认的零保留句，而不是例外清单，因此其保留姿态与本档其余模型一致（object=input_output、basis=none）。免费模型条目只重复团队利用这段限时收集反馈，没有另加保留 carve-out；保留承诺来自默认零保留句。"
