[[product]]
id = "zen-data-collecting-models"
badge = "Zen 数据收集模型"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
anchor = "opencode-zen-exceptions"

[[product.training.point]]
text = "Contract layer (the highest-authority source in this file): \"In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services, except Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.\" Using Content to improve the Services counts as training under this ledger's rules. The carve-out was first observed in our 2026-11-26 snapshot; the Privacy Policy it points to is not among this provider's captured sources, so the term \"Connected Service\" is undefined here. We therefore do not assume that prompts submitted directly to these free models fall outside the carve-out. If they did fall inside it, the TOS commitment not to use such Content for improvement would sit against the Zen privacy exceptions saying collected data is retained and used to improve the model; that possible divergence is left open. The training=no mark for this tier rests on the Zen exception bullets themselves, not on resolving the carve-out."
text_zh = "合同层（本文件权威性最高的来源）：厂商明文授权对 unpaid account 用 Content「further develop and improve our Services」，并在 2026-11-26 快照（我们的观察日期）出现例外「except Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.」。按本台账口径「用于改进服务算训练」。该例外所指的 Privacy Policy 不在本 provider 已抓取的来源中，「Connected Service」的范围在本台账里未定义；因此本点不假设用户直接提交给这些免费模型的提示一定在该例外之外。若这些提示落入例外，则 TOS 的不用于改进承诺会与 Zen 隐私例外（收集数据保留并用于改进模型）形成潜在分歧，此处并列保留、不替厂商裁决。本档 training=no 的依据是 Zen 隐私段自身的例外，而不是对 carve-out 范围的判断。"
anchor = "opencode-tos-unpaid-training"

[[product.training.point]]
text = "Tidepool Alpha Free was added to the Privacy exception list in the 2026-11-22 snapshot, and its terms state that the collected data is retained and used to improve the model: \"Tidepool Alpha Free: During its free period, collected data is retained and used to improve the model.\" The Free models list describes the same model as a stealth model whose free period is used \"to collect feedback and improve the model.\" Under this ledger's rule, using data to improve the model counts as training, so this is a data-collecting free model, not a no-training one."
text_zh = "Tidepool Alpha Free 在 2026-11-22 快照加入 Privacy 例外清单，其条款写明收集的数据会被保留并用于改进模型：「Tidepool Alpha Free: During its free period, collected data is retained and used to improve the model.」。免费模型列表把同一模型描述为团队利用免费期「to collect feedback and improve the model」的 stealth 模型。按本台账口径，用于改进模型算训练，因此这是数据收集型免费模型，而不是不训练模型。"
anchor = "opencode-zen-tidepool-exception"

[[product.training.point]]
text = "Iceman Free was added in the 2026-11-07 snapshot, and its privacy exception says the collected data is retained and used to improve the model: \"Iceman Free: During its free period, collected data is retained and used to improve the model.\" The Free models list describes the same model as a stealth model whose free period is used \"to collect feedback and improve the model.\" Both statements point the same way, so there is no conflict: under this ledger's rule this is a data-collecting free model, not a no-training one."
text_zh = "Iceman Free 在 2026-11-07 快照新增，其隐私例外写明收集的数据会被保留并用于改进模型：「Iceman Free: During its free period, collected data is retained and used to improve the model.」免费模型列表对同一模型的描述也是团队利用免费期「to collect feedback and improve the model」。两句方向一致，不存在冲突：按本台账口径，这是数据收集型免费模型，而不是不训练模型。"
anchor = "opencode-zen-iceman-exception"

[[product.training.point]]
text = "Seaglass Alpha Free was added to the Privacy exception list in the 2026-11-26 snapshot: \"Seaglass Alpha Free: During its free period, collected data is retained and used to improve the model.\" The Free models list describes the same model as a stealth model whose free period is used \"to collect feedback and improve the model.\" Under this ledger's rule, using data to improve the model counts as training, so this is another data-collecting free model, not a no-training one."
text_zh = "Seaglass Alpha Free 在 2026-11-26 快照加入 Privacy 例外清单：「Seaglass Alpha Free: During its free period, collected data is retained and used to improve the model.」。免费模型列表把同一模型描述为团队利用免费期「to collect feedback and improve the model」的 stealth 模型。按本台账口径，用于改进模型算训练，因此这又是一个数据收集型免费模型，而不是不训练模型。"
anchor = "opencode-zen-seaglass-exception"

[product.zdr]
mark = "no"
anchor = "opencode-zen-exceptions"

[[product.zdr.point]]
text = "NVIDIA free endpoints still listed in this tier: \"Nemotron 3.5 Lightning Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.\" The logging is stated with no time limit, so this tier offers no zero-retention option; the same sentence also bars submitting personal or confidential data. The bullet also says \"The logged session data for improvement purposes is not linked to your identity or any persistent identifier\" and includes a consent sentence, but states no retention period or zero-retention option. Nemotron 3 Ultra Free carried an identical bullet and was removed from the endpoints table, the pricing table and the Free models list in the 2026-11-18 snapshot."
text_zh = "本档仍在列的 NVIDIA 免费端点：「Nemotron 3.5 Lightning Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.」——使用会被记录且未给期限，本档没有零保留方案；同段还禁止提交个人或机密数据，对采购是硬约束。该条同时写「The logged session data for improvement purposes is not linked to your identity or any persistent identifier」并包含同意条款，但仍未给出保留期限或零保留方案。原 Nemotron 3 Ultra Free 条目文字相同，已在 2026-11-18 快照随该模型从端点表、价目表和免费模型列表一并移除。"
anchor = "opencode-zen-nvidia-free"

[[product.zdr.point]]
text = "The same NVIDIA free-endpoint group also includes Nemotron 3.5 Super VL Free, added in the 2026-10-16 snapshot: \"Nemotron 3.5 Super VL Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.\" It carries the same logging/no-zero-retention posture and is a Console free model a workspace can enable."
text_zh = "同一 NVIDIA 免费端点组还包含 2026-10-16 快照新增的 Nemotron 3.5 Super VL Free：「Nemotron 3.5 Super VL Free (NVIDIA free endpoints): Trial use only — do not submit personal or confidential data. Your use is logged for security purposes and to improve NVIDIA products and services.」。它与既有 NVIDIA 免费端点同样是记录使用、无零保留，并且是工作区可启用的 Console 免费模型。"
anchor = "opencode-zen-nemotron-super-vl"

[[product.zdr.point]]
text = "Tidepool Alpha Free adds an explicit retention-and-improvement permission to the same exception list: \"Tidepool Alpha Free: During its free period, collected data is retained and used to improve the model.\" The docs state no zero-retention option for this model, so it reinforces zdr=no for this tier."
text_zh = "Tidepool Alpha Free 在同一例外清单里新增了明确的保留与改进授权：「Tidepool Alpha Free: During its free period, collected data is retained and used to improve the model.」文档没有为该模型提供零保留方案，因此本档 zdr=no 继续成立。"
anchor = "opencode-zen-tidepool-exception"

