text_zh = "Google 与 xAI 例外：「Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.」与「xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.」——Google 为最长 55 天的上限，xAI 为固定 30 天；期限由 OpenCode 自己写明，同时指向各自上游条款。适用范围是本档列在 `google/v1beta/models/...` 端点上的 Gemini 模型，以及走 xAI 图像端点的 Grok Imagine Image 2.0；不覆盖 System One 端点上的 Gemini Decision 1，也不把 xAI 期限归到列在 OpenAI responses 端点上的 Grok 文本模型。"
anchor = "opencode-zen-google-xai-retention"

