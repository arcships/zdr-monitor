[[product]]
id = "shared-conversations"
badge = "已分享会话"
category = "web"
plan_level = "any"
label = "可选 /share 功能开启后，整段会话同步到 opencode.ai 托管的公开分享页（默认手动分享，也可整体关闭）；未分享的会话不经过这条路径"

[product.training]
mark = "no"
anchor = "opencode-tos-unpaid-training"

[[product.training.point]]
text = "No no-training commitment covers the share pages. The only clause touching how Content is used is the contract layer: \"In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services.\" It is conditional on the account being unpaid and comes with no opt-out, so the conservative reading (mark=no) applies rather than a blanket permission."
text_zh = "分享页没有任何「不用于训练」承诺。唯一涉及 Content 用途的是合同层那句：对 unpaid account 厂商可「use Content to further develop and improve our Services」；它带 unpaid 条件、也没有退出开关，因此按保守口径记 mark=no，不写成整档明文许可。"
anchor = "opencode-tos-unpaid-training"

[product.zdr]
mark = "no"
anchor = "opencode-share-retention"

[[product.zdr.point]]
text = "Shared conversations are kept, not zero-retained: \"Shared conversations remain accessible until you explicitly unshare them.\" The only removal path is the user's /unshare, which \"will remove the share link and delete the data related to the conversation\" — no zero-retention option is offered for this path."
text_zh = "已分享会话是被保留的，不是零保留：「Shared conversations remain accessible until you explicitly unshare them.」唯一的移除路径是用户执行 /unshare，届时删除相关数据；官方没有为这条路径提供零保留方案。"
anchor = "opencode-share-retention"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "opencode-share-retention"

[[product.retention.point]]
text = "Object and context: once the optional /share feature is on (manual by default, or auto-share), the whole conversation is synced to the pages hosted at opencode.ai — \"If a user enables the /share feature, the conversation and the data associated with it are sent to the service we use to host these share pages at opencode.ai.\" The retention rule covers full conversation history, all messages and responses, and session metadata."
text_zh = "对象与语境：开启可选的 /share（默认手动，也可设为 auto-share）后，整段会话被同步到 opencode.ai 托管的分享页——「If a user enables the /share feature, the conversation and the data associated with it are sent to the service we use to host these share pages at opencode.ai.」。保留的对象是完整会话历史、全部消息与回复、会话元数据。"
anchor = "opencode-enterprise-share"

[[product.retention.point]]
text = "Period type: there is no fixed term — retention lasts until the user revokes the share, and the revocation deletes the data: \"This will remove the share link and delete the data related to the conversation.\" until_termination here means until the user unshares, not until the service ends."
text_zh = "期限类型：没有固定期限——保留持续到用户撤销分享，撤销时会删除数据（「This will remove the share link and delete the data related to the conversation.」）。此处的 until_termination 指「到用户 unshare 为止」，不是「到服务终止」。"
anchor = "opencode-share-unshare-delete"

[product.processing_region]
codes = ["global"]
anchor = "opencode-enterprise-share-cdn"

[[product.processing_region.point]]
text = "The region follows the CDN rather than the US-only statement that covers Zen inference: \"The data is currently served through our CDN’s edge network, and is cached on the edge near your users.\" The enterprise docs also offer self-hosting these pages on the customer's own infrastructure."
text_zh = "处理地随 CDN 边缘、不限于 US（各 Zen 档的 US 只覆盖推理路径）：「The data is currently served through our CDN’s edge network, and is cached on the edge near your users.」企业文档另提供把分享页自托管在客户自有基础设施上的选项。"
anchor = "opencode-enterprise-share-cdn"

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://opencode.ai/docs/share", "https://opencode.ai/docs/enterprise/", "https://opencode.ai/legal/terms-of-service"]

