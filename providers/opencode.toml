anchor = "opencode-zen-privacy"
[[product.training.point]]
text = "Scope limit: mark=yes / mode=default holds only for models outside the exception list in the same privacy section. The models that collect data or are used for training (Big Pickle, Flint 40B Free, Exo Free, MiMo-V2.6-Flash Free, MiMo-V2.5 Free, Nemotron 3 Ultra Free, Nemotron 3.5 Lightning Free, Nemotron 3.5 Super VL Free) are Console models a team workspace can enable, so their posture is recorded in the separate \"Zen 数据收集模型\" tier, not in this row."
text_zh = "适用范围限定：mark=yes / mode=default 只对隐私段例外清单以外的模型成立。例外清单里会收集数据或用于训练模型的档（Big Pickle、Flint 40B Free、Exo Free、MiMo-V2.6-Flash Free、MiMo-V2.5 Free、Nemotron 3 Ultra Free、Nemotron 3.5 Lightning Free、Nemotron 3.5 Super VL Free）都是团队工作区可启用的 Console 模型，其姿态记在「Zen 数据收集模型」档，不在本行。"
anchor = "opencode-zen-exceptions"
[[product.training.point]]
text = "The Console docs make the workspace model list an admin choice rather than a fixed list: \"Owners and admins can invite members, choose which models are enabled from the **Models** tab, set budgets, and connect their own providers.\" Data-collecting models can therefore appear in a workspace's enabled set; the docs do not make disabling them the default, so this row's conclusion is stated for a workspace model list excluding those models."
text_zh = "Console 文档把工作区模型清单写成管理员的选择，而不是固定清单：「Owners and admins can invite members, choose which models are enabled from the **Models** tab, set budgets, and connect their own providers.」——会收集数据的模型因此可能出现在工作区启用的模型里；文档没有把关闭它们设为默认，因此本行结论只对不含这些模型的工作区模型清单成立。"
anchor = "opencode-zen-model-access"
[[product.training.point]]
text = "Contract layer, applicability unresolved: the Terms of Use allow using Content to improve the Services for unpaid accounts. The Console docs describe workspace model selection and budgets but no longer state whether a team workspace is free or paid, and no official text defines whether a team workspace is an \"unpaid account\", so this row is not re-judged on that clause — it is recorded as an open question."
text_zh = "合同层适用性待澄清：Terms of Use 授权对 unpaid account 用 Content 改进服务。Console 文档只写工作区模型选择与预算，已不再说明团队工作区是免费还是付费；官方文本也没有界定团队工作区是否算 unpaid account，因此本行不据此改写结论，只记为待澄清项。"
anchor = "opencode-tos-unpaid-training"
