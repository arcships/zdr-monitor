text = "Tidepool Alpha Free exception: \"Tidepool Alpha Free: During its free period, collected data is retained and used to improve the model.\" The retention permission is scoped to the free period; its length and any post-free-period deletion are not stated, so this is a further carve-out with basis=undisclosed rather than a fixed term."
