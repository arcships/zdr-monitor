[[product]]
id = "shared-conversations"
badge = "已分享会话"
category = "web"
plan_level = "any"
label = "可选 /share 功能开启后，整段会话同步到 OpenCode 的公开分享页（opncd.ai/s/ 链接，默认手动分享，也可整体关闭）；未分享的会话不经过这条路径"

[product.training]
mark = "no"
anchor = "opencode-tos-unpaid-training"

[[product.training.point]]
text = "No no-training commitment covers the share pages. The only clause touching how Content is used is the contract layer: \"In addition, if you are using the Services through an unpaid account, we may use Content to further develop and improve our Services, except Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.\" The carve-out first observed in our 2026-11-26 snapshot could cover shared conversations only if they count as Content obtained or derived from a Connected Service; the Privacy Policy definition is not among this provider's captured sources, so that scope is undetermined. If it did apply it could support a no-training reading for that subset, but we cannot verify the scope and there is no separate no-training statement for the share path, so the conservative reading (mark=no) stands."
text_zh = "分享页没有任何「不用于训练」承诺。唯一涉及 Content 用途的是合同层那句：对 unpaid account 厂商可「use Content to further develop and improve our Services」，但 2026-11-26 快照（我们的观察日期）新增例外「except Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.」。该例外所指的 Privacy Policy 不在本 provider 已抓取的来源中：分享的会话是否算 Connected Service 内容无法确定；若算，该例外可支撑这一子集的「不用于训练」解读，但范围无法核实，且这条路径没有单独的「不用于训练」表述，因此按保守口径记 mark=no。"
anchor = "opencode-tos-unpaid-training"

[product.zdr]
mark = "no"
anchor = "opencode-share-retention"

[[product.zdr.point]]
text = "Shared conversations are kept, not zero-retained: \"Shared conversations remain accessible until you explicitly unshare them.\" The only removal path is the user's /unshare, which \"will remove the share link and delete the data related to the conversation\" — no zero-retention option is offered for this path."
text_zh = "已分享会话是被保留的，不是零保留：「Shared conversations remain accessible until you explicitly unshare them.」唯一的移除路径是用户执行 /unshare，届时删除相关数据；官方没有为这条路径提供零保留方案。"
anchor = "opencode-share-retention"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "opencode-share-retention"

[[product.retention.point]]
text = "Object and context: once the optional /share feature is on (manual by default, or auto-share), the whole conversation is synced to OpenCode's servers — \"Syncs your conversation history to our servers\" — and published at a shareable `opncd.ai/s/<share-id>` link. The retention rule covers full conversation history, all messages and responses, and session metadata."
text_zh = "对象与语境：开启可选的 /share（默认手动，也可设为 auto-share）后，整段会话被同步到 OpenCode 的服务器——「Syncs your conversation history to our servers」——并生成 `opncd.ai/s/<share-id>` 公开链接。保留的对象是完整会话历史、全部消息与回复、会话元数据。"
anchor = "opencode-share-sync"

[[product.retention.point]]
text = "Period type: there is no fixed term — retention lasts until the user revokes the share, and the revocation deletes the data: \"This will remove the share link and delete the data related to the conversation.\" until_termination here means until the user unshares, not until the service ends."
text_zh = "期限类型：没有固定期限——保留持续到用户撤销分享，撤销时会删除数据（「This will remove the share link and delete the data related to the conversation.」）。此处的 until_termination 指「到用户 unshare 为止」，不是「到服务终止」。"
anchor = "opencode-share-unshare-delete"

[product.processing_region]
mark = "unknown"
codes = ["unknown"]
searched = ["https://opencode.ai/docs/share", "https://opencode.ai/docs/enterprise/"]

[[product.processing_region.point]]
text = "The share docs say conversations are synced to \"our servers\" and published at `opncd.ai/s/<share-id>`, but give no processing location. The enterprise docs were rewritten in the 2026-11-22 snapshot and no longer mention share pages or self-hosting at all. The region is therefore recorded as undisclosed."
text_zh = "分享文档只写会话同步到「our servers」并生成 `opncd.ai/s/<share-id>` 公开链接，没有给出处理地；企业文档在 2026-11-22 快照被重写后已完全不提分享页或自托管。因此处理地记为未披露。"

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://opencode.ai/docs/share", "https://opencode.ai/docs/enterprise/", "https://opencode.ai/legal/terms-of-service"]

