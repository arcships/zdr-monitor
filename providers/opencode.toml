mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"
[[product.zdr.point]]
text = "Exceptions in the same privacy section take part of this tier's models out of zero retention: \"OpenAI APIs: Requests are retained for 30 days in accordance with OpenAI’s Data Policies\" (identical for Anthropic APIs), and the data-collecting free models a workspace can enable are collected from and logged. mark=yes / mode=default therefore holds only for models outside that exception list."
text_zh = "隐私段的例外清单把本档部分模型排除在零保留之外：走 OpenAI APIs / Anthropic APIs 的请求保留 30 天；工作区可启用的数据收集类免费模型会被收集数据并记录使用。因此 mark=yes / mode=default 只对例外清单以外的模型成立。"
anchor = "opencode-zen-30-days"

[[product.zdr.point]]
text = "A further exception in the same privacy section defers the Mistral models' retention to the provider: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" Mistral Large 4 is a Zen endpoint a workspace can enable, and the docs state no retention period of their own — the period is deferred to a third party's policy."
text_zh = "同一隐私段的另一条例外把 Mistral 模型的保留期限指向上游：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」Mistral Large 4 是工作区可启用的 Zen 端点；官方未自行给出保留期限，而是把期限指向第三方（Mistral）的政策。"
anchor = "opencode-zen-mistral-exception"

[[product.zdr.point]]
text = "A further exception in the same privacy section keeps Beam Free requests for 30 days rather than zero retention: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Beam Free is a Console free model a workspace can enable, so mark=yes / mode=default does not hold for that model either."
text_zh = "同一隐私段的另一条例外把 Beam Free 的请求保留 30 天，而不是零保留：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」Beam Free 是工作区可启用的 Console 免费模型，因此选择该模型时也不是零保留。"
anchor = "opencode-zen-beam-30-days"
[product.retention]
object = "input_output"
basis = "none"
anchor = "opencode-zen-privacy"
[[product.retention.point]]
text_zh = "标准口径为上游零保留；但 OpenAI API 与 Anthropic API 明列请求保留 30 天，因此选择这些模型时本档不是零保留。缓存价目存在 cached read/write，但缓存期限未披露。"
anchor = "opencode-zen-30-days"

[[product.retention.point]]
text = "Mistral exception: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" No period or deletion commitment is stated for Mistral requests — the period is deferred to Mistral's policy — so it is recorded as a carve-out from the upstream zero-retention default, not as a fixed term."
text_zh = "Mistral 例外：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」——Mistral 请求没有给出期限或删除承诺，期限指向 Mistral 的政策，因此记为上游零保留默认之外的 carve-out，而不是任何固定期限。"
anchor = "opencode-zen-mistral-exception"

[[product.retention.point]]
text = "Beam Free exception: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Requests are kept for a fixed 30-day safety period, so this is a carve-out from the upstream zero-retention default rather than a zero-retention model."
text_zh = "Beam Free 例外：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」——请求因安全目的固定保留 30 天，是上游零保留默认之外的一条例外，而不是零保留模型。"
anchor = "opencode-zen-beam-30-days"
[[product.retention.point]]
text = "Contract layer (higher authority than the Zen docs): \"Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.\" The sentence is aimed at Third Party Model providers, so it does not settle retention on the Zen-hosted path."
text_zh = "合同层（权威性高于 Zen 文档）：OpenCode 自称不保留你的 Content，同时把保留责任推给第三方模型商——「Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.」。该句针对 Third Party Models（BYOK/直连）路径，不覆盖 Zen 自身托管路径的保留。"
anchor = "opencode-tos-retention"
