basis = "none"
anchor = "opencode-zen-privacy"
[[product.retention.point]]
text_zh = "标准口径为上游零保留；但 OpenAI API 与 Anthropic API 明列请求保留 30 天，因此选择这些模型时本档不是零保留。缓存价目存在 cached read/write，但缓存期限未披露。"
anchor = "opencode-zen-30-days"
[[product.retention.point]]
text = "Contract layer (higher authority than the Zen docs): \"Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.\" The sentence is aimed at Third Party Model providers, so it does not settle retention on the Zen-hosted path."
text_zh = "合同层（权威性高于 Zen 文档）：OpenCode 自称不保留你的 Content，同时把保留责任推给第三方模型商——「Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.」。该句针对 Third Party Models（BYOK/直连）路径，不覆盖 Zen 自身托管路径的保留。"
anchor = "opencode-tos-retention"
[product.processing_region]
codes = ["US"]
anchor = "opencode-zen-privacy"
[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://opencode.ai/legal/privacy-policy", "https://opencode.ai/legal/terms-of-service", "https://opencode.ai/docs/zen", "https://opencode.ai/docs/enterprise/"]

