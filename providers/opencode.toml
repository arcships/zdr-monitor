[[product.zdr.point]]
text = "The same exception list adds Google and xAI carve-outs: \"Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.\" and \"xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.\" The Google period is an upper bound and covers the Gemini models this tier lists on `google/v1beta/models/...` endpoints; Gemini Decision 1 is listed on the System One endpoint (`systemone/v1/systemone`), not a Google endpoint, so the Google exception does not apply to it. The xAI period is attributed only to the Grok Imagine Image 2.0 image model, the only model in this tier listed on an xAI endpoint; the Grok text models (Grok 4.7, 4.6, 4.5 and Grok Build 0.1) are listed on the OpenAI responses endpoint and the docs do not state which upstream API serves them, so the xAI 30-day period is not attributed to those text models here."
text_zh = "同一例外清单新增 Google 与 xAI carve-out：「Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.」与「xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.」。Google 为最长 55 天的上限，适用于本档列在 `google/v1beta/models/...` 端点上的 Gemini 模型；Gemini Decision 1 列在 System One 端点（`systemone/v1/systemone`），不是 Google 端点，因此不适用该例外。xAI 的 30 天只归到 Grok Imagine Image 2.0 图像模型——它是本档端点表里唯一列在 xAI 端点上的模型；Grok 文本模型（Grok 4.7、4.6、4.5、Grok Build 0.1）列在 OpenAI responses 端点，文档未说明其上游 API，因此这里不把 xAI 30 天期限套到这些文本模型上。"
anchor = "opencode-zen-google-xai-retention"

[[product.zdr.point]]
text = "A further exception in the same privacy section defers the Mistral models' retention to the provider: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" Mistral Large 4 is a Zen endpoint a workspace can enable, and the docs state no retention period of their own — the period is deferred to a third party's policy."
text_zh = "同一隐私段的另一条例外把 Mistral 模型的保留期限指向上游：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」Mistral Large 4 是工作区可启用的 Zen 端点；官方未自行给出保留期限，而是把期限指向第三方（Mistral）的政策。"
anchor = "opencode-zen-mistral-exception"

[[product.zdr.point]]
text = "A further exception in the same privacy section keeps Beam Free requests for 30 days rather than zero retention: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Beam Free is a Console free model a workspace can enable, so mark=yes / mode=default does not hold for that model either."
text_zh = "同一隐私段的另一条例外把 Beam Free 的请求保留 30 天，而不是零保留：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」Beam Free 是工作区可启用的 Console 免费模型，因此选择该模型时也不是零保留。"
anchor = "opencode-zen-beam-30-days"

[product.retention]
object = "input_output"
basis = "none"
anchor = "opencode-zen-privacy"
[[product.retention.point]]
text_zh = "标准口径为上游零保留；但 OpenAI API 与 Anthropic API 明列请求保留 30 天，Google API 最长 55 天、xAI API 30 天（见下条及其适用范围），因此选择这些模型时本档不是零保留。缓存价目存在 cached read/write，但缓存期限未披露。"
anchor = "opencode-zen-30-days"

[[product.retention.point]]
text = "Google and xAI exceptions: \"Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.\" and \"xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.\" Google's is an upper bound (up to 55 days), xAI's is a fixed 30 days; OpenCode states both periods itself while referring to the providers' terms for the underlying processing. They cover the Gemini models this tier lists on `google/v1beta/models/...` endpoints and the Grok Imagine Image 2.0 image model on the xAI images endpoint; they do not cover Gemini Decision 1 on the System One endpoint, and the docs do not attribute the xAI period to the Grok text models listed on the OpenAI responses endpoint."
text_zh = "Google 与 xAI 例外：「Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.」与「xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.」——Google 为最长 55 天的上限，xAI 为固定 30 天；期限由 OpenCode 自己写明，同时指向各自上游条款。适用范围是本档列在 `google/v1beta/models/...` 端点上的 Gemini 模型，以及走 xAI 图像端点的 Grok Imagine Image 2.0；不覆盖 System One 端点上的 Gemini Decision 1，也不把 xAI 期限归到列在 OpenAI responses 端点上的 Grok 文本模型。"
anchor = "opencode-zen-google-xai-retention"

[[product.retention.point]]
text = "MiMo-V2.6-Flash Free now falls under the default zero-retention sentence rather than the exception list, so its retention posture is the same as the rest of this tier (object=input_output, basis=none). The Free models bullet only repeats that the team is using the limited-time period to collect feedback and does not add a separate retention carve-out; the operative retention commitment is the default zero-retention sentence."
text_zh = "MiMo-V2.6-Flash Free 现在适用默认的零保留句，而不是例外清单，因此其保留姿态与本档其余模型一致（object=input_output、basis=none）。免费模型条目只重复团队利用这段限时收集反馈，没有另加保留 carve-out；保留承诺来自默认零保留句。"
anchor = "opencode-zen-mimo-free-feedback"

[[product.retention.point]]
text = "Mistral exception: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" No period or deletion commitment is stated for Mistral requests — the period is deferred to Mistral's policy — so it is recorded as a carve-out from the upstream zero-retention default, not as a fixed term."
text_zh = "Mistral 例外：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」——Mistral 请求没有给出期限或删除承诺，期限指向 Mistral 的政策，因此记为上游零保留默认之外的 carve-out，而不是任何固定期限。"
anchor = "opencode-zen-mistral-exception"

[[product.retention.point]]
text = "Beam Free exception: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Requests are kept for a fixed 30-day safety period, so this is a carve-out from the upstream zero-retention default rather than a zero-retention model."
text_zh = "Beam Free 例外：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」——请求因安全目的固定保留 30 天，是上游零保留默认之外的一条例外，而不是零保留模型。"
anchor = "opencode-zen-beam-30-days"

[[product.retention.point]]
text = "Contract layer (higher authority than the Zen docs): \"Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.\" The sentence is aimed at Third Party Model providers, so it does not settle retention on the Zen-hosted path."
text_zh = "合同层（权威性高于 Zen 文档）：OpenCode 自称不保留你的 Content，同时把保留责任推给第三方模型商——「Although we will not retain your Content, we cannot and do not control the retention practices of Third Party Model providers.」。该句针对 Third Party Models（BYOK/直连）路径，不覆盖 Zen 自身托管路径的保留。"
anchor = "opencode-tos-retention"
