[[product.training.point]]
text = "Scope limit: mark=yes / mode=default holds only for models outside the exception list in the same privacy section. The free models that collect data or are used for training (Big Pickle, Tidepool Alpha Free, Seaglass Alpha Free, Iceman Free, Flint 40B Free, Nemotron 3.5 Lightning Free, Nemotron 3.5 Super VL Free) are Console models a team workspace can enable, so their posture is recorded in the separate \"Zen 数据收集模型\" tier, not in this row."
text_zh = "适用范围限定：mark=yes / mode=default 只对隐私段例外清单以外的模型成立。会收集数据或用于训练模型的免费档（Big Pickle、Tidepool Alpha Free、Seaglass Alpha Free、Iceman Free、Flint 40B Free、Nemotron 3.5 Lightning Free、Nemotron 3.5 Super VL Free）都是团队工作区可启用的 Console 模型，其姿态记在「Zen 数据收集模型」档，不在本行。"
anchor = "opencode-zen-exceptions"

[[product.training.point]]
text = "MiMo-V2.6-Flash Free left the exception list in the 2026-11-18 snapshot; its Free models bullet now reads \"MiMo-V2.6-Flash Free is available on OpenCode for a limited time. The team is using this time to collect feedback.\" and no longer says the data may be used to improve the model. The default sentence therefore covers it, so it is no longer part of the data-collecting set above. Nemotron 3 Ultra Free, which the previous list included, was delisted from the endpoints, pricing and Free models tables in the same snapshot."
text_zh = "MiMo-V2.6-Flash Free 在 2026-11-18 快照离开例外清单；其免费模型条目改为「MiMo-V2.6-Flash Free is available on OpenCode for a limited time. The team is using this time to collect feedback.」，不再写收集数据可能用于改进模型。默认句因此覆盖它，它不再属于上面的数据收集集合。上一版清单里的 Nemotron 3 Ultra Free 也在同一快照从端点表、价目表和免费模型列表下架。"
anchor = "opencode-zen-mimo-free-feedback"
[[product.training.point]]
text = "The Console docs make the workspace model list an admin choice rather than a fixed list: \"Owners and admins can invite members, choose which models are enabled from the **Models** tab, set budgets, and connect their own providers.\" Data-collecting models can therefore appear in a workspace's enabled set; the docs do not make disabling them the default, so this row's conclusion is stated for a workspace model list excluding those models."
text_zh = "Console 文档把工作区模型清单写成管理员的选择，而不是固定清单：「Owners and admins can invite members, choose which models are enabled from the **Models** tab, set budgets, and connect their own providers.」——会收集数据的模型因此可能出现在工作区启用的模型里；文档没有把关闭它们设为默认，因此本行结论只对不含这些模型的工作区模型清单成立。"
anchor = "opencode-zen-model-access"
[[product.training.point]]
text = "Contract layer, applicability unresolved: for unpaid accounts the Terms of Use allow using Content to improve the Services, except \"Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose\" (carve-out first observed in our 2026-11-26 snapshot; the Privacy Policy definition is not among this provider's captured sources, so its scope is undetermined). The Console docs describe workspace model selection and budgets but no longer state whether a team workspace is free or paid, and no official text defines whether a team workspace is an \"unpaid account\", so this row is not re-judged on that clause — it is recorded as an open question."
text_zh = "合同层适用性待澄清：对 unpaid account，Terms of Use 授权用 Content 改进服务，但 2026-11-26 快照（我们的观察日期）新增例外「Content obtained or derived from a Connected Service (as defined in our Privacy Policy), which we never use for that purpose.」；该定义所在的 Privacy Policy 不在本 provider 已抓取的来源中，范围未定。Console 文档只写工作区模型选择与预算，已不再说明团队工作区是免费还是付费；官方文本也没有界定团队工作区是否算 unpaid account，因此本行不据此改写结论，只记为待澄清项。"
anchor = "opencode-tos-unpaid-training"
[product.zdr]
mark = "yes"
mode = "default"
anchor = "opencode-zen-privacy"
[[product.zdr.point]]
text = "Exceptions in the same privacy section take part of this tier's models out of zero retention: \"OpenAI APIs: Requests are retained for 30 days in accordance with OpenAI’s Data Policies\" (identical for Anthropic APIs), and the data-collecting free models a workspace can enable are collected from and logged. mark=yes / mode=default therefore holds only for models outside that exception list."
text_zh = "隐私段的例外清单把本档部分模型排除在零保留之外：走 OpenAI APIs / Anthropic APIs 的请求保留 30 天；工作区可启用的数据收集类免费模型会被收集数据并记录使用。因此 mark=yes / mode=default 只对例外清单以外的模型成立。"
anchor = "opencode-zen-30-days"

[[product.zdr.point]]
text = "The same exception list adds Google and xAI carve-outs: \"Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.\" and \"xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.\" The Google period is an upper bound and covers the Gemini models this tier lists on `google/v1beta/models/...` endpoints; Gemini Decision 1 is listed on the System One endpoint (`systemone/v1/systemone`), not a Google endpoint, so the Google exception does not apply to it. The xAI period is attributed only to the Grok Imagine Image 2.0 image model, the only model in this tier listed on an xAI endpoint; the Grok text models (Grok 4.7, 4.6, 4.5 and Grok Build 0.1) are listed on the OpenAI responses endpoint and the docs do not state which upstream API serves them, so the xAI 30-day period is not attributed to those text models here."
text_zh = "同一例外清单新增 Google 与 xAI carve-out：「Google APIs: Requests are retained for up to 55 days for abuse monitoring in accordance with Google’s Gemini API Terms.」与「xAI APIs: Requests are retained for 30 days in accordance with xAI’s Privacy Policy.」。Google 为最长 55 天的上限，适用于本档列在 `google/v1beta/models/...` 端点上的 Gemini 模型；Gemini Decision 1 列在 System One 端点（`systemone/v1/systemone`），不是 Google 端点，因此不适用该例外。xAI 的 30 天只归到 Grok Imagine Image 2.0 图像模型——它是本档端点表里唯一列在 xAI 端点上的模型；Grok 文本模型（Grok 4.7、4.6、4.5、Grok Build 0.1）列在 OpenAI responses 端点，文档未说明其上游 API，因此这里不把 xAI 30 天期限套到这些文本模型上。"
anchor = "opencode-zen-google-xai-retention"

[[product.zdr.point]]
text = "A further exception in the same privacy section defers the Mistral models' retention to the provider: \"Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.\" Mistral Large 4 is a Zen endpoint a workspace can enable, and the docs state no retention period of their own — the period is deferred to a third party's policy."
text_zh = "同一隐私段的另一条例外把 Mistral 模型的保留期限指向上游：「Mistral APIs: Prompts and other inputs are not used for training. Data is retained in accordance with Mistral’s Data Retention Policy.」Mistral Large 4 是工作区可启用的 Zen 端点；官方未自行给出保留期限，而是把期限指向第三方（Mistral）的政策。"
anchor = "opencode-zen-mistral-exception"

[[product.zdr.point]]
text = "A further exception in the same privacy section keeps Beam Free requests for 30 days rather than zero retention: \"Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.\" Beam Free is a Console free model a workspace can enable, so mark=yes / mode=default does not hold for that model either."
text_zh = "同一隐私段的另一条例外把 Beam Free 的请求保留 30 天，而不是零保留：「Beam Free: Prompts and other inputs are not used for training. Data is retained for 30 days for safety reasons.」Beam Free 是工作区可启用的 Console 免费模型，因此选择该模型时也不是零保留。"
anchor = "opencode-zen-beam-30-days"

