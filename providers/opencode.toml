text_zh = "Seaglass Alpha Free 在同一例外清单里新增了又一条明确的保留与改进授权：「Seaglass Alpha Free: During its free period, collected data is retained and used to improve the model.」文档没有为该模型提供零保留方案，因此本档 zdr=no 继续成立。"
