  "https://huggingface.co/privacy",
  "https://huggingface.co/terms-of-service",
]

[[product.zdr.point]]
text_zh = "Enterprise 档的公开页面只承诺「可提供 GDPR DPA / BAA」与「存储区域可选」,**没有**任何零保留(ZDR)承诺、开关或申请方式的表述。按规则记 not_found:公开材料未披露 ≠ 厂商不提供,不得反向解读。"

[product.retention]
days = 90
object = "mixed"
basis = "fixed_period"
anchor = "huggingface-tos-delete-90-days"

[[product.retention.point]]
text_zh = "结论：本档没有请求级保留期，唯一量化的数字是注销之后的删除上限。对象与语境分三层：(1) **账号信息与自有仓库内容**——《用户协议》§Your Account「Upon cancellation of your Account, we will use commercially reasonable efforts to delete your information and Content of your own Repositories, whether public or private, within 90 days.」：对象含私有仓库内容，语境是注销之后，期限类型是上限，且以「commercially reasonable efforts」为限，不是硬承诺。(2) **例外**——同节紧接「We also reserve the right to retain your information for legal or regulatory compliance, pursuant to standard archiving, recovery, and back-up processes and practices」：法务合规与备份留存不受 90 天约束。(3) **订阅存续期间**——《隐私政策》§4.B「We retain your Information for as long as necessary to deliver the Services, to comply with any applicable legal requirements, to maintain security and prevent incidents and, in general, to pursue our legitimate interests.」：未量化的「目的必需」口径"

[[product.retention.point]]
text_zh = "Hub 本身就是托管产品，内容在订阅期内持续保留是产品前提。边界：不要把推理档的「正文不存、日志 30 天」搬到本行——那两条的限定语分别是「when routing requests through Hugging Face」与「passed to the Inference Endpoint」，对象是推理请求正文，本档的对象是仓库与账号数据。不确定性：Enterprise 可签的 DPA 文本不公开，其中是否约定更短的删除期限或审计权无法核对"

[[product.retention.point]]
text_zh = "本档也没有任何缓存或日志的单独保留窗口说明。"

