[[product.training.point]]
text = "Removed anchor: \"Hugging Face does not store any user data for training purposes.\" covers the Hugging Face routing hop only — the same page hands upstream handling to each provider's own policy. This tier's mark is about the whole chain: routing defaults to :fastest, which can land on Replicate, Baseten or fal.ai, none of which state this commitment, so the clause does not settle the chain and is not a statement on this verdict. It is kept in this file as the anchor for Hugging Face's own commitment. Search scope is recorded in searched."
text_zh = "已撤锚：「Hugging Face does not store any user data for training purposes.」只覆盖 HF 路由这一跳——同页把上游的数据处理推给各家政策。本档判定的是全链：路由默认 :fastest，可能落到 Replicate、Baseten、fal.ai，这些上游均未见该承诺，故该句不足以定论，不构成本判定的表述；它仍保留在文件里，作为「HF 自身这一跳不训练」这条事实的锚点。查阅范围见 searched。"

[[product.training.point]]
text_zh = "同顶层 training。补充链路读法:本档可用的 HF 侧事实**只覆盖 HF 路由这一跳**。上游各跳已核实到的事实(仅作跳级证据,详见 notes 与各来源):Groq 协议 §4.2 明文禁止用 Inputs/Outputs 训练"

[[product.training.point]]
text_zh = "Together、Fireworks、DeepInfra、Cerebras、Novita、Featherless 各自有不用输入输出训练或默认不落盘的官方表述"

[[product.training.point]]
text_zh = "Replicate、Baseten、fal.ai 的隐私政策**未见**该承诺(记为未披露,不得反向解读为会训练)。因为路由默认是 :fastest 自动选 provider(也可 :cheapest/:preferred 或显式指定),同一条链路在不同配置下会落到不同上游,所以「HF 这一跳为是 + 上游某跳未披露」时,全链无法定论——上游是**未披露**而非明确为否,不能替它记「是」;本档按保守假设记未表态(页面 ✗)。"

[[product.training.point]]
text_zh = "并列保留一条方向相反的平台级条款（覆盖全部 Services）：《隐私政策》§2 用途清单「to operate and improve the Services by providing you with more effective customer service … performing research and analysis aimed at improving the Services, or other products and technologies of the Company … diagnosing or fixing problems with the Services,」。按判定口径「用来改进服务」算训练；但该条的对象是 information from Users（账号与使用信息），不是推理请求正文，且 consumer_privacy 的权威性低于本档主依据 developer_data，故只作范围说明，不改 mark。该句的锚点绑在 enterprise 档 training。"

[product.zdr]
mark = "yes"
