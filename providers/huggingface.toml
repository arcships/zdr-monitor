[[product.processing_region.point]]
text_zh = "但同一节紧接着写数据可能在美国以外的任何有设施的国家处理，故记 US + global，而不是只给 US。同页 §10 的第三方服务商清单里地点含 France（OVHCloud、Hugging Face SAS）与 United States/EMEA（Google Cloud Platform）——子处理者所在地不等于请求处理地，只作旁证。"

[[product.processing_region.point]]
text_zh = "本档的处理地仍属**未充分披露**：上面两条都是平台级隐私政策的表述，不是路由档的请求处理地披露。HF 未说明路由请求在哪个区域被处理，也未披露任一上游 provider 的处理地。低置信度。"

[product.role]
kind = "controller"
anchor = "huggingface-privacy-legal-basis"

[[product.role.point]]
text = "Platform-level privacy policy reads as a controller: it states that \"Hugging Face remains under an obligation to notify the Users about the legal basis on which their Personal Information is processed.\" with Consent / Agreement / Legitimate Interests as the grounds, and §1.A reserves the right to access user information without consent for its own legitimate interests."
text_zh = "平台级隐私政策是控制方口径：《隐私政策》§2.B 自认「有义务告知用户其个人信息的处理法律依据」，并逐条列出 Consent / Agreement / Legitimate Interests；§1.A 又保留「The Company also reserves the right to access this information with your consent, or without your consent only for the purposes of pursuing legitimate interests such as maintaining security on its Services or complying with any legal or regulatory obligations.」——HF 为自身正当利益可未经同意访问用户信息。政策适用于全部 Services，私有仓库也不例外：《用户协议》§Your Content 对私有仓库写明「we may access or share your private information pursuant to the terms set forth in our Privacy Policy.」。"
anchor = "huggingface-privacy-access-legitimate-interests"

[[product.role.point]]
text = "Removed: the billing/routing rationale previously quoted here (\"Your request routes through HF to the provider\" / \"Pay-as-you-go on your HF account\" / \"Billed directly by the provider\") cannot be found in any of the seven snapshots this provider declares, and no billing or routing document is registered as a source, so it is no longer used as a basis for this tier's role."
text_zh = "已撤下：原 point 引用的计费/路由文档原文（「Your request routes through HF to the provider」/「Pay-as-you-go on your HF account」/「Billed directly by the provider」）在本 provider 已登记的 7 份快照里查不到，计费与路由文档也未登记为来源，故不再作为本档 role 的依据（要保留须先补登官方来源）。"

[[product.role.point]]
text_zh = "DPA/BAA 只在 Enterprise 档提供且文本不公开。/docs/hub/security 那句「可按 Enterprise Plan 提供 BAA / GDPR DPA」属合同层表述（能不能签受托处理协议），语义偏向受托处理方，不足以支撑「HF 是独立控制方」，故本档 role 不再绑它——它仍是 enterprise 档 role 的锚点。"

