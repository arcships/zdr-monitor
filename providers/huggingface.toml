note = "Inference Providers(路由聚合档)的官方安全与合规页,是 training / retention / zdr 三条在 HF 自身这一跳的权威依据。两句话限定范围:①「Hugging Face does not store any user data for training purposes」;②「We do not store the request body or response when routing requests through Hugging Face」——注意后半句的限定语「when routing requests through Hugging Face」,即只覆盖经 HF 路由的请求,不覆盖上游 provider 收到之后的处理;③日志「up to 30 days」。页面明确把上游的数据处理推给各 provider 自己的政策,且不给链接。"

[[source]]
