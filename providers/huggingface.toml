[[product.training.point]]
text_zh = "结论：本档（Team & Enterprise Hub 订阅）没有「不用你的内容训练」的承诺，公开文本只给出方向相反的两条，故记 not_found。(a) 已核范围：/docs/hub/enterprise（订阅功能与配额对照表）、/enterprise、/pricing、/docs/hub/security、/docs/hub/storage-regions 五页全文均无训练相关表述——这正是本档与两个推理档的差别：推理档各有一页明写不存不训（/docs/inference-providers/security、/docs/inference-endpoints/guides/security），Hub 订阅档没有对应页面。(b) 回落到通用条款后，方向反而在保留权利的一侧：《用户协议》§Intellectual Property「In addition and subject to our Privacy Policy, we may aggregate, anonymize, or otherwise learn from data relating to your use of the Services, and use the foregoing to improve those Services.」——对象是「使用数据」而非仓库内容，但确实是一条「可从中学习以改进服务」的授权。(c) 另一侧的限制：同协议 §Your Content 先写「You own the Content you create! We will not sell your Content, nor will we use it in any other way as permitted under these Terms.」，授出的许可限于「to provide Services and as otherwise permitted under these Terms and our Privacy Policy」——内容的使用被限定在提供服务的范围内，但全文没有把「不用于训练」写成明文承诺，也没有开关或退出机制。(d) 为什么不套用推理档结论：那两条承诺各自带限定语（「when routing requests through Hugging Face」「passed to the Inference Endpoint」），对象是推理请求正文"

[[product.training.point]]
text_zh = "本档的对象是 Hub 上的仓库、数据集与模型。(e) 记 not_found 不等于 HF 会拿企业版仓库内容训练：Enterprise 可签的 DPA/BAA 文本不公开（/docs/hub/security 只写可按 Enterprise Plan 提供），其中是否另有「不训练」约定无法核对。"

[product.zdr]
mark = "unknown"
searched = [
  "https://huggingface.co/enterprise",
  "https://huggingface.co/pricing",
  "https://huggingface.co/docs/hub/enterprise",
