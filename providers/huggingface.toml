anchor = "huggingface-ip-security-no-body-retention"

[[product.zdr.point]]
text_zh = "同顶层 zdr:路由层默认不存 payload,但无名为 ZDR 的方案/开关"

[[product.zdr.point]]
text = "Upstream boundary (same page): \"For more information on how your data is handled, please refer to the Data Security Policies of each provider.\" — no link is given, so this tier's \"no request body\" fact covers the Hugging Face routing hop only."
text_zh = "上游边界（同页）：「For more information on how your data is handled, please refer to the Data Security Policies of each provider.」——未给任何链接。本档「不存请求正文」这一事实只覆盖经 HF 路由的这一跳。"
anchor = "huggingface-ip-security-upstream-data-policies"

[[product.zdr.point]]
text = "The Hub section of the same page also pushes responsibility for external providers onto each provider: \"External providers are responsible for their own security measures, so please refer to their respective security policies for more details.\""
text_zh = "同页 Hub 一节把外部 provider 的安全责任也推给各家：「External providers are responsible for their own security measures, so please refer to their respective security policies for more details.」"
anchor = "huggingface-ip-security-upstream-policies"

[[product.zdr.point]]
text_zh = "上游各自可申请(如 Groq 的 zero data retention setting、Together 的 ZDR 设置),不自动证明能在同一配置下同时开通。"

