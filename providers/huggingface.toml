endpoint = ""
doc = "https://huggingface.co/terms-of-service"

[[source]]
url = "https://raw.githubusercontent.com/huggingface/hub-docs/main/docs/hub/security.md"
channel = "developer_data"
tier = "core"
note = "Hub 安全文档,role 维度依据:HF 自认 GDPR compliant,并写明 DPA / BAA 只能通过 Enterprise Plan 取得。适用于全站(含 Hub 与各档),但只讲「能不能签 DPA」,不讲推理内容的具体处理。**抓取通道**:r.jina.ai 对 huggingface.co 整域匿名封禁(40305 abuse,与页面无关),改绑该页面的官方源文件——HF 官方仓库 huggingface/hub-docs 的同名 Markdown(与渲染页逐字一致)。"

[[source]]
url = "https://raw.githubusercontent.com/huggingface/hub-docs/main/docs/hub/storage-regions.md"
channel = "developer_data"
tier = "core"
note = "Storage Regions 文档,处理地维度的补充依据:非 Team/Enterprise 用户仓库恒在美国;Team/Enterprise 可选 US / EU(APAC、GCC 标注 coming soon),EU 区域覆盖 datasets / models / buckets / inference endpoints。讲的是「仓库与推理端点的存储地」,不是请求路由路径上的处理地。**抓取通道**:huggingface.co 整域被 r.jina.ai 匿名封禁,改绑 HF 官方仓库 huggingface/hub-docs 的同名 Markdown。"

[[source]]
url = "https://raw.githubusercontent.com/huggingface/hf-endpoints-documentation/main/docs/source/guides/security.md"
channel = "developer_data"
tier = "core"
note = "Inference Endpoints(HF 自有托管专用实例档)的安全页,与 Inference Providers 是**不同档位、不同承诺**:不存储「payloads or tokens」、日志存 30 天、GDPR DPA 需 Enterprise Hub 订阅。此页不适用于 Inference Providers 路由档,反之亦然。**抓取通道**:huggingface.co 整域被 r.jina.ai 匿名封禁,改绑 HF 官方仓库 huggingface/hf-endpoints-documentation 的同名 Markdown。"

[[source]]
url = "https://raw.githubusercontent.com/huggingface/hf-endpoints-documentation/main/docs/source/support/faq.md"
channel = "developer_data"
tier = "core"
note = "Inference Endpoints FAQ,处理地维度的权威依据:明确列出可部署区域(AWS us-east-1 / eu-west-1、Azure eastus、GCP us-east4),并说明 Inference Providers 与 Inference Endpoints 的区别。只覆盖 Inference Endpoints 档。**抓取通道**:huggingface.co 整域被 r.jina.ai 匿名封禁,改绑 HF 官方仓库 huggingface/hf-endpoints-documentation 的同名 Markdown。"

[[source]]
url = "https://huggingface.co/docs/inference-providers/security"
channel = "developer_data"
tier = "core"
note = "Inference Providers(路由聚合档)的官方安全与合规页,是 training / retention / zdr 三条在 HF 自身这一跳的权威依据。两句话限定范围:①「Hugging Face does not store any user data for training purposes」;②「We do not store the request body or response when routing requests through Hugging Face」——注意后半句的限定语「when routing requests through Hugging Face」,即只覆盖经 HF 路由的请求,不覆盖上游 provider 收到之后的处理;③日志「up to 30 days」。页面明确把上游的数据处理推给各 provider 自己的政策,且不给链接。"

[[source]]
url = "https://huggingface.co/privacy"
channel = "consumer_privacy"
tier = "core"
note = "Hugging Face 隐私政策(生效日 2023-03-28,页面自述「Effective Date: March 28, 2023」)。平台级隐私政策,覆盖全部 Services。§4.B Data retention(目的所需期限)、§6 LOCATION OF PROCESSING(公司及服务器在美国、可能在美国以外处理)、§10 第三方服务商清单(含地点列)。**注意**:此政策不区分推理请求内容与账号信息,也没有任何请求级保留期限,故 retention 维度的主依据仍是 docs 的 security 页;此页是处理地与 role 的依据。"

[[source]]
url = "https://hf.co/terms-of-service"
channel = "contract"
tier = "core"
note = "Hugging Face 全站用户协议(General Terms,页面无版本日期;定义节把 Inference Providers 明确列为「Services」之一)。平台层合同:§Your Account 的注销删除 90 天上限、§Intellectual Property 的「aggregate / anonymize / learn from 使用数据以改进服务」、§Subcontracting 的分包责任、§Your Content 的内容许可。覆盖 Hub + Inference Providers + Inference Endpoints 全部档位;但条款本身不区分推理请求内容与其他内容,故只作为合同层的通用依据,推理档的具体承诺以 docs 的 security 页为准。**抓取通道**:huggingface.co 整域被 r.jina.ai 匿名封禁(40305 abuse),改绑 HF 官方短域 hf.co 的同一页面(逐字一致,锚点原样命中);若该域日后同样被封,需另寻官方来源。"

[[product]]
id = "api"
badge = "路由聚合"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
anchor = "huggingface-ip-security-no-training"
mode = "default"

[[product.training.point]]
text_zh = "同顶层 training。补充链路读法:本档结论**只覆盖 HF 路由这一跳**。上游各跳已核实到的事实(仅作跳级证据,详见 notes 与各来源):Groq 协议 §4.2 明文禁止用 Inputs/Outputs 训练"

[[product.training.point]]
text_zh = "Together、Fireworks、DeepInfra、Cerebras、Novita、Featherless 各自有不用输入输出训练或默认不落盘的官方表述"

[[product.training.point]]
text_zh = "Replicate、Baseten、fal.ai 的隐私政策**未见**该承诺(记为未披露,不得反向解读为会训练)。因为路由默认是 :fastest 自动选 provider(也可 :cheapest/:preferred 或显式指定),同一条链路在不同配置下会落到不同上游,所以「HF 这一跳为是 + 上游某跳未披露」时,按判定口径**全链为否**(保守假设)。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "huggingface-ip-security-no-body-retention"

[[product.zdr.point]]
text_zh = "同顶层 zdr:路由层默认不存 payload,但无名为 ZDR 的方案/开关"

[[product.zdr.point]]
text_zh = "上游各自可申请(如 Groq 的 zero data retention setting、Together 的 ZDR 设置),不自动证明能在同一配置下同时开通。"

[product.retention]
days = 30
object = "mixed"
basis = "fixed_period"
anchor = "huggingface-ip-security-logs-30d"

[[product.retention.point]]
text_zh = "同顶层 retention。对象:推理输入输出正文(不存)/ 调试日志(上限 30 天)/ HF 账号内容(注销后 90 天内尽力删除,法务与备份例外)。上游保留期不在本档承诺内。"

[product.processing_region]
codes = ["US"]
anchor = "huggingface-privacy-servers-us"

[[product.processing_region.point]]
text_zh = "本档的处理地是**未充分披露**的一项:HF 未说明路由请求在哪个区域被处理,也未披露任一上游 provider 的处理地。只有隐私政策 §6 的平台级表述(美国为主、可能其他国家)。低置信度。"

[product.role]
kind = "controller"
anchor = "huggingface-hub-security-dpa-baa"

[[product.role.point]]
text_zh = "「Routed by Hugging Face」模式下 HF 是签约与收款方(计费文档原文「Your request routes through HF to the provider」/「Pay-as-you-go on your HF account」),「Custom Provider Key」模式下「Billed directly by the provider」,用户与上游直接建立计费关系。HF 在路由页声明外部 provider 自负其安全责任"

[[product.role.point]]
text_zh = "DPA/BAA 只在 Enterprise 档提供且文本不公开。"

