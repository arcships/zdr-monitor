[[product.retention.point]]
text_zh = "结论：本档没有请求级保留期，唯一量化的数字是注销之后的删除上限。对象与语境分三层：(1) **账号信息与自有仓库内容**——《用户协议》§Your Account「Upon cancellation of your Account, we will use commercially reasonable efforts to delete your information and Content of your own Repositories, whether public or private, within 90 days.」：对象含私有仓库内容，语境是注销之后，期限类型是上限，且以「commercially reasonable efforts」为限，不是硬承诺。(2) **例外**——同节紧接「We also reserve the right to retain your information for legal or regulatory compliance, pursuant to standard archiving, recovery, and back-up processes and practices」：法务合规与备份留存不受 90 天约束。(3) **订阅存续期间**——《隐私政策》§4.B「We retain your Information for as long as necessary to deliver the Services, to comply with any applicable legal requirements, to maintain security and prevent incidents and, in general, to pursue our legitimate interests.」：未量化的「目的必需」口径"

[[product.retention.point]]
text_zh = "Hub 本身就是托管产品，内容在订阅期内持续保留是产品前提。边界：不要把推理档的「正文不存、日志 30 天」搬到本行——那两条的限定语分别是「when routing requests through Hugging Face」与「passed to the Inference Endpoint」，对象是推理请求正文，本档的对象是仓库与账号数据。不确定性：Enterprise 可签的 DPA 文本不公开，其中是否约定更短的删除期限或审计权无法核对"

[[product.retention.point]]
text_zh = "本档也没有任何缓存或日志的单独保留窗口说明。"

[[product.retention.point]]
text = "Boundary of the deletion duty (the sentence right after the 90-day one): \"We will not delete the Content that you contributed to other Users' Repositories, or copies made by us or other Users.\" — the 90-day cap covers only the information and Content of your own Repositories; content you contributed to other users' repositories, and copies already made by us or other users, are not deleted. This narrows the coverage of the 90 days, it is not a retention period of its own, so days stays 90."
text_zh = "删除义务的边界（紧接 90 天那句）：「We will not delete the Content that you contributed to other Users' Repositories, or copies made by us or other Users.」——90 天上限覆盖的只是**你自有仓库**的信息与内容；你贡献到他人仓库的内容、以及我们或他人已产生的副本不在删除范围内。它进一步收窄 90 天的覆盖范围，本身不是保留期限，故不改 days=90。"
anchor = "huggingface-tos-no-delete-contributed-content"

[product.processing_region]
codes = ["US", "EU", "selected"]
anchor = "huggingface-storage-regions-eu"

[[product.processing_region.point]]
text_zh = "原句「For EU companies, you can use the Hub for ML development in a GDPR-compliant manner, with datasets, models, buckets and inference endpoints all stored in EU data centers.」"

[[product.processing_region.point]]
text_zh = "APAC 与 GCC(KSA)标注 coming soon。"

[[product.processing_region.point]]
text = "Regions extend to runtime, not just storage: \"Both Spaces's storage and runtime use the chosen region.\" The same page carries a WARNING that this feature is part of the Team & Enterprise plans, and a tip that some advanced compute options for Spaces, such as ZeroGPU, \"may not be available in all regions\" — so advanced compute is an optional limitation on the region choice. This page describes the storage and runtime region of repositories and Spaces, not the processing path of a routed request; it is not a whole-chain processing-location commitment."
text_zh = "区域覆盖到运行期：「Both Spaces's storage and runtime use the chosen region.」——Spaces 的存储与运行时都用所选区域；该页开头的 WARNING 写明这是 Team & Enterprise 功能。同页另提示 Spaces 的高级计算选项（如 ZeroGPU）「may not be available in all regions」，即区域选择对高级计算有可选限制。注意该页讲的是仓库与 Spaces 的存储/运行区域，不等于路由请求的处理路径，不能读成全链处理地承诺。"
anchor = "huggingface-storage-regions-spaces-runtime"

