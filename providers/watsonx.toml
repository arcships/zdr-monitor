[[product.zdr.point]]
text_zh = "API 档：官方文档声明 API 提交的提示与输出默认不被 IBM 记录、不存储（除非用户主动保存），即默认行为上等同零保留"

[[product.zdr.point]]
text_zh = "但全套 IBM 材料里没有 ZDR 这个术语，也没有可申请的 ZDR 计划、开关或合同条款——它不是一项可签约的承诺。证据：SaaS 文档「Nothing that you add to the prompt editor or submit to a model from the Prompt Lab or by using the API is logged by IBM」「Text that you add to or submit in the Prompt Lab or API is not stored unless you save it.」"

[[product.zdr.point]]
text_zh = "边界条件（IBM Cloud 通用条款，不是 watsonx 的保留控制特性）：可用的数据保护特性要客户自己开通——「You, the customer, are responsible to take necessary actions to order, enable, or use available data protection features for a IBM Cloud Service and accept responsibility for use of the IBM Cloud Services if you fail to take such actions, including meeting any data protection or other legal requirements regarding Content.」即任何数据保护特性都需客户自行 order / enable，未启用责任在客户。这句只说明「零保留靠谁保证」的边界，不证明 watsonx 存在任何保留控制或 ZDR 机制。"
anchor = "saas-sec-customer-enables-data-protection-features"

[[product.zdr.point]]
text_zh = "反面对照：服务侧 PII 仍可能存在于服务数据源与备份中最多 30 天（见 retention ④⑤），计量数据按账户统计，CSA/CRA/DPA/Data Sheet 里没有任何「请求处理完成即不保留」的合同条款。按规则记「文档层默认不落盘、无 ZDR 机制」，不等于厂商承诺了可申请的 ZDR。"

[[product.zdr.point]]
text_zh = "边界（不改变「在线推理输入输出默认不落盘」的结论）：客户自行写入的深度学习训练日志文件对 IBM 可访问——SaaS 文档「Personal data must not be written to these training log files as they are accessible to other users within Client’s Enterprise as well as to IBM as necessary to support the Cloud Service.」对象是训练日志文件、语境是客户在训练过程中自行写入，性质是客户责任与访问边界：它不表示 IBM 会留存请求正文，但说明内容存在一条能被 IBM 看到的独立通道。"
anchor = "saas-sec-training-logfiles-accessible-to-ibm"

[[product.zdr.point]]
text_zh = "边界（语境=启用某功能后）：启用 watsonx.governance 的评估与监控后，基础模型输入与输出的请求载荷会存入客户自行管理的 watsonx.governance 数据库（关闭监控或删除被监控资产/部署时清除，见 retention）。存的是客户自管库、由客户控制访问，不削弱「默认不落盘」，但「默认即零保留」这句话不覆盖该语境。"
anchor = "saas-fm-governance-monitoring-stores-request-payloads"

[product.retention]
days = 30
object = "input_output"
basis = "fixed_period"
anchor = "ds-runtime-duration-of-processing-30-days"

[[product.retention.point]]
text_zh = "API 档结论：在线推理的请求内容默认不落盘（文档层声明），服务侧数据以「服务终止后 30 天」为删除窗口，备份无量化期限。分对象记：①输入输出正文（在线推理）：文档声明「Nothing that you add to the prompt editor or submit to a model from the Prompt Lab or by using the API is logged by IBM」「Text that you add to or submit in the Prompt Lab or API is not stored unless you save it.」——属默认不记录/不存储，非合同量化期限。②用户主动保存的资产：SaaS 文档给 prompt session asset「retained for 30 days」（上限式、文档层），prompt template/notebook asset「retained until they are deleted or changed by you」（客户控制，无期限）。③服务终止后 Content：Data Sheet（DPA Exhibit）§3「The duration of Processing Content within this Cloud Service is 30 days after termination or expiration of the Cloud Service.」+ §5「IBM hereby certifies that all Client Personal Data are deleted at the end of the retention period specified in section 3」——这是合同层、可执行的删除窗口（Runtime/Studio/Multicloud 三份 Data Sheet 同值 30 天）。④服务侧 PII（账户/凭据/资产元数据）：文档层「personally identifiable information and data is removed completely from all data sources, including backups, after 30 days」。⑤备份：CRA §4e / CSA §2f「IBM does not archive Content; however, some Content may remain in backup files until expiration of such files as governed by IBM's backup retention practices」——备份保留期未量化，是唯一的开口（该句逐字出自 IBM 交付的 CRA/CSA PDF，IBM Terms 快照只有站点框架、不可机器复核，故未绑锚点）。⑥计量数据：文档另声明按账户度量模型用量（billing/infrastructure planning/model lifecycle management），与内容保留是两件事。未发现任何请求级（0 天）的合同保留期承诺。"

[[product.retention.point]]
text_zh = "分层补充（对象=训练日志文件，语境=客户自行写入）：SaaS 文档「Client’s use of the deep learning training process includes the ability to write to the training log files. Personal data must not be written to these training log files as they are accessible to other users within Client’s Enterprise as well as to IBM as necessary to support the Cloud Service.」——性质是客户责任与访问边界，不是 IBM 的保留期限承诺，也不改变「在线推理输入输出默认不落盘」。"
anchor = "saas-sec-training-logfiles-accessible-to-ibm"

[[product.retention.point]]
text_zh = "分层补充（语境=启用 watsonx.governance 监控后）：请求载荷（基础模型输入与输出）存入客户自行管理的 watsonx.governance 数据库——「If watsonx.governance is provisioned, you can choose to enable evaluation and monitoring of foundation models… When enabled, the request payloads of foundation model input and output are stored in a watsonx.governance database that you administer.」该库由客户管理，不计入 IBM 侧保留（§3 的 30 天删除窗口标的是服务侧 Content / PII）。"
anchor = "saas-fm-governance-monitoring-stores-request-payloads"

[[product.retention.point]]
text_zh = "上一条的清除条件（期限类型=按事件清除，非固定天数）：「Any stored data is purged when monitoring is disabled or when the monitored prompt template asset or model deployment is deleted.」"
anchor = "saas-fm-governance-monitoring-purge-on-disable"

[product.processing_region]
codes = ["AU", "CA", "DE", "GB", "IN", "JP", "PL", "US"]
anchor = "ds-runtime-processing-locations-may-limit"

[[product.processing_region.point]]
text_zh = "API 档结论：托管在 IBM Cloud 或 AWS，处理地随所选区域，且合同允许按请求收窄。①合同层（Data Sheet / DPA Exhibit §6）：Runtime 与 Studio 的处理地为 Australia/Canada/Germany/India/Japan/Poland/United Kingdom/United States（codes 单元格呈现的就是本档 Runtime as a Service 这八地；Multicloud 档只有五地，见 ⑧），各列明处理活动（Hosting/Backup/Customer Support/Monitoring/Operations/Development）"

[[product.processing_region.point]]
text_zh = "「IBM may be able to limit Processing of Content to a subset of these locations, upon request」——即可申请收窄，但非默认。②产品层：SaaS 文档「The foundation models are hosted in IBM Cloud or AWS; your prompts are not sent to third-party platforms.」「Foundation models that you interact with through watsonx are hosted in IBM Cloud.」③区域可用性：IBM Cloud 六区（Dallas/Frankfurt/London/Tokyo/Sydney/Toronto）+ AWS 两区（Mumbai/N. Virginia）。④EU Supported Cloud（IBM Cloud 基础 SD §2.1）另给欧盟支持下的访问限制：必要访问限于 EU 常驻人员。注意 self-managed 档不是这个结论（见 products[software-self-managed]）。"

[[product.processing_region.point]]
text_zh = "⑤Multicloud（AWS 托管）档 Data Sheet §7 的第三方子处理方按快照全列六家：AWS-India、Amazon (AWS)、Red Hat、Salesforce、Segment、Slack（各列 Corporate Headquarters 与 Processing Activities）。清单可能变动，同节末句写明「Additional details for each third-party Subprocessor are available upon request」——详情需向 IBM 索取。"
anchor = "ds-multicloud-slack-subprocessor"

[[product.processing_region.point]]
text_zh = "⑥Runtime as a Service 档（codes 的标的）Data Sheet §7 的第三方子处理方：CloudFlare（Corporate Headquarters: United States；Processing Activities: Operations - Provision, maintenance, or management…）。处理链上除 IBM 与 IBM 关联方外还有第三方子处理方，与 Multicloud 档的六家分开记。"
anchor = "ds-runtime-cloudflare-subprocessor"

[[product.processing_region.point]]
text_zh = "⑦同一份 Runtime Data Sheet §6 对 IBM 自身访问的限定：「IBM generally does not have access to Content. When Content is accessed or moved by IBM, the access or movement is limited to the minimum necessary to provide and maintain the Cloud Service or respond to a Client request, and follows the least privileged access principle that is logged and monitored.」——IBM 访问 Content 是例外而非默认。"
anchor = "ds-runtime-ibm-generally-no-content-access"

[[product.processing_region.point]]
text_zh = "⑧处理地按档分开（codes 单元格的标的是 IBM Cloud 托管的 Runtime as a Service）：Multicloud（AWS 托管）档 Data Sheet §6 的表只列五地——Canada / Germany / India / Poland / United States，各列处理活动，并同样写明「IBM may be able to limit Processing of Content to a subset of these locations, upon request」。同一个 [[product]] 覆盖两档，此处并列保留，不合并成一套处理地。"
anchor = "ds-multicloud-processing-locations-may-limit"

[product.role]
kind = "processor"
anchor = "saas-sec-dpa-and-dpa-exhibits-apply"

[[product.role.point]]
text_zh = "API 档结论：IBM 是处理者（Processor），客户是控制者或其上游处理者。逐字条款：①DPA §1.1「Client is either (a) a Controller of Client Personal Data; or (b) a Processor acting on behalf of other Controllers… Client appoints IBM as Processor to Process Client Personal Data.」§1.3 按客户书面指示处理。（DPA §1.1/§1.3 逐字出自 IBM 交付的 DPA PDF；Z126-7870 站点正文需站内会话 cookie，当前快照 30f78d90874abe55 只有站点框架，exact 机器核对 missing——属抓取失败，不是厂商撤销承诺，故结论保持上一次确认值；这两句不可复核，本轮已撤掉对应锚点，只在 point 里保留引文与出处）"

[[product.role.point]]
text_zh = "定义节「Subprocessor means any other Processor IBM engages to Process Client Personal Data.」②IBM Cloud 基础服务描述 §2：「The DPA and the applicable Data Processing and Protection Data Sheets (referred to as Data Sheets or DPA Exhibits) apply to IBM's processing of personal data on behalf of the Client.」③CRA §4d / CSA §2e 同句。（IBM Cloud 基础服务描述与 CSA（Z126-6304_IBMCIBV）未登记为本文件来源；CRA 所属的 Z126-6548 快照 1f8852264e473974 当前也是站点框架，CRA §4 的引文不可机器复核，本轮已撤掉对应锚点——同为抓取失败）"

[[product.role.point]]
text_zh = "watsonx.ai as a Service Multicloud 服务描述 §2「…in the links below applies to IBM's processing of personal data on behalf of Client.」并给出该档 Data Sheet 的链接（Runtime 服务描述 §2 只写「The following Data Sheet(s) apply to this service:」+ 链接，不含 on behalf 措辞，故 role 的逐字依据取自 DPA 与 CRA/CSA/IBM Cloud 基础 SD）。④Data Sheet 自身声明「This Data Sheet is also considered as the DPA Exhibit…」且「When the DPA is applicable, these IBM affiliates are considered Subprocessors and any changes to these Subprocessors are subject to the DPA.」⑤适用哪份基础协议按账户类型分（IBM Cloud 条款页）：Free/Lite 账户与多数国家的美元 PayGo 信用卡账户走 CSA（Z126-6304_IBMCIBV）。（Multicloud 服务描述 §2 出自 i127-9067，未登记为本文件来源、无快照可核；④的两句有锚点 ds-runtime-is-dpa-exhibit 与 ds-runtime-ibm-affiliates-are-subprocessors，可机器复核）"
anchor = "ds-runtime-is-dpa-exhibit"

[[product.role.point]]
text_zh = "其余走 CRA（Z126-6548）+ Product Attachment for Cloud Services（Z126-6560）。两份协议在 Content and Data Protection 一节同旨。边界：IBM 官网通用隐私声明里的「控制者」是 IBM 处理自己网站/账户信息时的身份，与本维度无关，不能拿来顶替"

[[product.role.point]]
text_zh = "DPA 只在 GDPR 适用时并入（文档层表述为「if and to the extent… GDPR applies」），但 IBM Cloud 条款页与各 SD 均以「on behalf of Client」作为常态表述。"

[[product.role.point]]
text_zh = "现行可机器复核的 role 依据（不改变 kind=processor）：①SaaS 文档「(DPA) and DPA Exhibits apply and are referenced in as part of the Agreement, if and to the extent the European General Data Protection Regulation (EU/2016/679) (GDPR) applies to personal data contained in Content.」+「The applicable Data Sheets for this IBM Cloud Service will serve as the DPA Exhibits.」（锚点 saas-sec-dpa-and-dpa-exhibits-apply，本档 role 的判定锚点）；②同页控制者删除义务：「has the right to obtain from the controller the erasure of that data without undue delay」——数据主体向控制者（客户侧）行使删除权、由控制者负删除义务，方向与「客户为控制者、IBM 为受托处理方」一致。注意 ①②都带 GDPR 适用条件（「if and to the extent… GDPR applies」），不如 DPA §1.1 直接，只作并列依据。"
anchor = "saas-sec-controller-erasure-right"

[[product.role.point]]
text_zh = "Runtime as a Service 的 Data Sheet（合同层、可机器复核）关于处理链的自述：①「When the DPA is applicable, these IBM affiliates are considered Subprocessors and any changes to these Subprocessors are subject to the DPA.」——IBM 关联方在 DPA 适用时按子处理方管理；②§7「Content is Processed by the following third-party Subprocessors below.」，表格列第三方子处理方 CloudFlare（United States）；③同节限定 IBM 自身访问：「IBM generally does not have access to Content. When Content is accessed or moved by IBM, the access or movement is limited to the minimum necessary to provide and maintain the Cloud Service or respond to a Client request, and follows the least privileged access principle that is logged and monitored.」"
anchor = "ds-runtime-ibm-affiliates-are-subprocessors"

[[product.role.point]]
text_zh = "Runtime 档处理链上的第三方子处理方单独记一条：Data Sheet §7 表格列 CloudFlare（Corporate Headquarters: United States；Processing Activities: Operations - Provision, maintenance, or management…），与 Multicloud 档的六家（见 processing_region ⑤）分开，不能只看 IBM 与 IBM 关联方。"
anchor = "ds-runtime-cloudflare-subprocessor"

[[product]]
id = "software-self-managed"
badge = "自托管"
category = "self_host"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "sw-fm-training-not-used-ibm-models"

[[product.training.point]]
text_zh = "自管理档：同一句「IBM does not use the content that you upload to watsonx or the output that is generated by a foundation model to further train or improve any IBM-developed models.」仍适用，且该档另有更强的前提「IBM cannot access your prompts or tuned models.」——客户自持环境，IBM 在架构上拿不到内容"

[[product.training.point]]
text_zh = "模型调优用的训练数据作为 data asset 存在客户项目 bucket。边界：软件许可本身仍受 CRA/Product Attachment for Programs 约束，Content 处理由客户环境决定"

[[product.training.point]]
text_zh = "未逐字核到软件许可合同层针对「训练」的条款。"

[[product.training.point]]
text_zh = "边界：同页「When you access foundation models through the model gateway, the gateway forwards the inference request to the backend model provider.」——经 model gateway 的调用会把推理请求转给后端模型提供方，上面那句只挡 IBM-developed models 的承诺覆盖不到这条路径；后端提供方适用的条款本档文档未说明（条款可能不同），列为待澄清事项，不替厂商推断第三方条款。"
anchor = "sw-fm-model-gateway-forwards-to-backend-provider"

[product.zdr]
mark = "yes"
mode = "by_deployment"
anchor = "sw-fm-hosted-on-premises-cluster"

[[product.zdr.point]]
text_zh = "自管理档：基础模型跑在客户自有的 on-premises 集群（或客户自选环境），数据不发给任何第三方或开源平台，IBM 无法访问提示与调优后的模型——从 IBM 侧看不存在保留问题，但这不等于产品提供了 ZDR 选项，而是部署形态决定的。未发现 IBM 针对该档的 ZDR 术语或条款。"

[[product.zdr.point]]
text_zh = "边界（与「hosted on your private, on-premises cluster. Your data is not sent to any third-party or open source platforms.」并列保留，适用范围待厂商澄清）：同页「When you access foundation models through the model gateway, the gateway forwards the inference request to the backend model provider.」与「When you access foundation models through the model gateway, the response from the backend model provider is not under the model gateway's control.」——经 model gateway 的调用会把推理请求转给后端模型提供方、响应也不在网关控制内，这条路径不在「数据不出客户环境」的覆盖内。"
anchor = "sw-fm-model-gateway-forwards-to-backend-provider"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "sw-fm-session-asset-500-no-window"

[[product.retention.point]]
text_zh = "自管理档：API/Prompt Lab 提交内容同样声明「not logged by IBM」「not stored unless you save it」"

[[product.retention.point]]
text_zh = "保存的资产存在客户自己的项目存储桶，「retained until they are deleted or changed by you」"

[[product.retention.point]]
text_zh = "prompt session asset 最多保存 500 条提交的提示，但**该档文档没有 SaaS 版那句「retained for 30 days」**——同一页两档的保留期表述不一致，这是档位差异的实证（SaaS 版有 30 天窗口，软件版无）。服务终止后 30 天删除的 Data Sheet 条款属于 IBM Cloud 托管服务，自管理档不适用。"

[product.processing_region]
basis = "undisclosed"
anchor = "sw-fm-hosted-on-premises-cluster"

[[product.processing_region.point]]
text_zh = "自管理档：文档写「hosted on your private, on-premises cluster. Your data is not sent to any third-party or open source platforms.」处理地由客户环境决定，IBM 不承诺也不限制。与 SaaS 档的 8 个 IBM 处理地是两个不同结论，不能混用。"

[[product.processing_region.point]]
text_zh = "边界（与上一条并列保留，适用范围待厂商澄清）：同页「When you access foundation models through the model gateway, the response from the backend model provider is not under the model gateway's control.」——经 model gateway 的调用会把推理请求转给后端模型提供方、响应不在网关控制内，处理地不能只按「客户自有集群」理解；后端提供方条款本档文档未说明，不替厂商推断。"
anchor = "sw-fm-model-gateway-response-not-in-control"

[product.role]
mark = "unknown"
kind = "unknown"
searched = [
  "https://www.ibm.com/docs/en/watsonx/w-and-w/2.3.x?topic=watsonx-security-foundation-models",
  "https://www.ibm.com/support/customer/csol/terms/?id=Z126-6548",
  "IBM Terms Z126-6560（Product Attachment for Programs，软件许可适用的产品附件；未登记为本文件来源）",
  "支持场景的 DPA 适用性：DPA Z126-7870 与站点说明句（未核到软件许可下的角色条款）",
]

[[product.role.point]]
text_zh = "自管理档：基础模型与调优后的模型跑在客户自有集群，客户自行运维，推理链路上不存在 IBM 处理客户内容这一环，故 role 维度在推理链路上不适用"

[[product.role.point]]
text_zh = "软件许可合同（CRA / Product Attachment for Programs）中 IBM 的角色是软件许可方，不是内容处理者。confidence=low 的理由：本档文档里最像 role 依据的那句「IBM cannot access your prompts or tuned models」在 SaaS 档同一页也有，并不构成区分两档的条款"

[[product.role.point]]
text_zh = "真正区分两档的是部署形态（on-premises cluster vs IBM Cloud/AWS）。若客户把数据交给 IBM 支持，则回到支持条款与 DPA"

[[product.role.point]]
text_zh = "本轮未核支持场景的 DPA 适用性。"

[[product.role.point]]
text_zh = "本轮把 role 的锚点撤掉、改按 mark=unknown + kind=unknown + searched[] 登记的理由：①原先绑在 role 上的「Foundation models that you interact with through watsonx or tune in Tuning Studio are hosted on your private, on-premises cluster.」说的是部署形态（客户自有 on-premises 集群），不是任何角色条款；用它支撑「协议里没约定角色」这种「没找到表述」型结论，与 docs/judgment.md「绑了引文就不能判 unknown」相抵。②本档文档里最像角色依据的两句——「IBM cannot access your prompts or tuned models.」与「Your prompt text is not accessible or used by IBM or any other person or organization.」——前一句在 SaaS 档同一页（b67d3e7c5c1d4938）也出现，不构成档位区分；两句说的都是「IBM 拿不到内容」这一访问事实，不是协议上的控制者/处理者角色约定，故不作为 role 依据。③软件许可适用的合同（CRA / Product Attachment for Programs）与支持场景的 DPA 适用性见 searched[]，未核到角色条款，因此维持 unknown 而不是给一个依据不足的结论。"

