[product.training]
mark = "yes"
mode = "by_contract"
anchor = "saas-fm-training-not-used-ibm-models"

[[product.training.point]]
text_zh = "API 档（SaaS）合同层结论：默认不用于训练，唯一开口是客户主动提交反馈。①服务描述 §5.1(a)：「Unless separately authorized by Client through a voluntary feedback submission, IBM will not use the Client Content or model Outputs to train the foundation models or embedding models.」（Multicloud 档 i127-9067 §5.1(a) 同文）。同节把「所有模型输入（含推理/提示、微调/提示调优内容）」界定为 Client Content，输出所有权归客户。②基础合同层：CRA §4a「such parties will access, use, provide, store, and otherwise process Content solely for the purpose of providing the Products」，CSA §2b 同旨（这两句逐字出自 IBM 交付的 PDF；Z126-6548 / Z126-6304_IBMCIBV 的 IBM Terms 页面正文需站内会话 cookie，快照只有站点框架，不可机器复核，故未绑锚点）。③文档层：SaaS 文档「IBM does not use the content that you upload to watsonx or the output that is generated by a foundation model to further train or improve any IBM-developed models.」需并列的例外与边界：(a) 自愿反馈提交（voluntary feedback submission）可授权使用，CSA 另写「IBM may use for any purpose」"
anchor = "saas-fm-training-not-used-ibm-models"

[[product.training.point]]
text_zh = "(b) 文档层那句只说 IBM 自研模型（IBM-developed models），第三方模型（Non-IBM Product，如 Mistral 商用模型）另有许可条款，服务描述 §6.1 对 Mistral 微调模型另设「Unless separately authorized by Client, neither IBM nor Mistral will leverage, use…」"

[[product.training.point]]
text_zh = "(c) Technology Preview 不适用该 Data Sheet 与输出赔偿"

[[product.training.point]]
text_zh = "(d) 预览类服务另有「voluntary feedback… which IBM may use for any purpose」。未见任何按账户/按项目的训练开关或退出机制——开口只有主动反馈这一条路径。"

[[product.training.point]]
text_zh = "可复核性与来源登记（不改变 mark=yes / mode=by_contract）：①服务描述 §5.1(a)（含 Multicloud 档 i127-9067 同文）与 §6.1 逐字出自 IBM 交付的服务描述 PDF（i126-6883 v28）；②CRA §4a 出自 CRA PDF（Z126-6548）；③CSA §2b 出自 CSA（Z126-6304_IBMCIBV）。这三处对应的 IBM Terms 页面正文需站内会话 cookie，当前快照只有站点框架（ce9366b63a6d4410 / 1f8852264e473974），exact 机器核对 missing——这是抓取失败（关于我们的事实），不是厂商撤销承诺，故不改结论、也不写成「未披露」，mark/mode 保持上一次确认值。i127-9067 与 Z126-6304_IBMCIBV 本轮未登记为 [[source]]（仓库里没有对应快照），其引文待快照回填后再复核。本档 training 的维度锚点改绑到现行可机器复核的文档层那句（saas-fm-training-not-used-ibm-models，b67d3e7c5c1d4938 第 77 行）：它只覆盖 IBM-developed models，撑不起 by_contract；合同层的三处引文因此不再绑锚点——不可复核的锚点是坏锚点，只作为本 point 的说明保留。"

