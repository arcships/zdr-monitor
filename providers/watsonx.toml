note = "合同层：IBM Cloud Additional Service Description「IBM watsonx.ai Runtime as a Service」v28，2026-08-04 生效。§5.1(a) AI Technology Terms 是本家 training 维度最直接的合同条款（默认不训练，除客户主动反馈外）。§1.2.1 说明 foundation models 含 IBM 自研与第三方（Non-IBM Product，另受第三方许可约束）。IBM Terms 站的文档以 JS 查看器 + PDF 交付（直连 PDF 端点为 /support/customer/csol/terms/api/download/<docid>，需先访问站内页面取得会话 cookie），r.jina.ai 抓不到正文（实测返回 188B 的 missing session JSON），policy-sync 会把它记为抓取失败而非政策变更。锚点逐字取自 IBM 自己交付的 PDF 文本（本机 pypdf 抽取，句内换行按 PDF 排版保留）。本轮复核把其余取正文路径逐一试过，均不通：查看器加 ?cc=us&lc=en 或 ?ref=<docid>-<ver>-<date>-zz-<lang> 永久引用只渲染站点框架（r.jina.ai 分别 10866B / 7473B，无正文）；/api/getdocumentbyid/、/api/download/、/search/documentdetailsByReference/、/details/getDocumentDetails/ 一律 TERMS001 missing session——会话 cookie 只在站内页面 GET 时下发，r.jina.ai 无法复用。同时确认 r.jina.ai 能把 PDF 抽成 text/plain 正文（实测 IBM 的 DPA Exhibit PDF 返回 6260B 可读文本），所以本家一旦出现免会话的官方静态 PDF/HTML 交付即可直接换源；本轮未找到，URL 维持不变，锚点状态保持上一次的值。另需注意：站点框架的正文非空，classify 会判成 fetched 并把框架存成版本，此时锚点会被误报为 gone（documents/ 里 2026-09-22T03:12 的三个版本就是框架，不是条款正文）；真正拦住误报的是 health/ 里的 render_error，抓取层对「非空但无正文」目前没有判据。"

