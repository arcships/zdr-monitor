text_zh = "保存的资产存在客户自己的项目存储桶，「retained until they are deleted or changed by you」"

[[product.retention.point]]
text_zh = "prompt session asset 最多保存 500 条提交的提示，但**该档文档没有 SaaS 版那句「retained for 30 days」**——同一页两档的保留期表述不一致，这是档位差异的实证（SaaS 版有 30 天窗口，软件版无）。服务终止后 30 天删除的 Data Sheet 条款属于 IBM Cloud 托管服务，自管理档不适用。"

[product.processing_region]
basis = "undisclosed"
anchor = "sw-fm-hosted-on-premises-cluster"

[[product.processing_region.point]]
text_zh = "自管理档：文档写「hosted on your private, on-premises cluster. Your data is not sent to any third-party or open source platforms.」处理地由客户环境决定，IBM 不承诺也不限制。与 SaaS 档的 8 个 IBM 处理地是两个不同结论，不能混用。"

[product.role]
kind = "unknown"
anchor = "sw-fm-hosted-on-premises-cluster"

[[product.role.point]]
text_zh = "自管理档：基础模型与调优后的模型跑在客户自有集群，客户自行运维，推理链路上不存在 IBM 处理客户内容这一环，故 role 维度在推理链路上不适用"

[[product.role.point]]
text_zh = "软件许可合同（CRA / Product Attachment for Programs）中 IBM 的角色是软件许可方，不是内容处理者。confidence=low 的理由：本档文档里最像 role 依据的那句「IBM cannot access your prompts or tuned models」在 SaaS 档同一页也有，并不构成区分两档的条款"

[[product.role.point]]
text_zh = "真正区分两档的是部署形态（on-premises cluster vs IBM Cloud/AWS）。若客户把数据交给 IBM 支持，则回到支持条款与 DPA"

[[product.role.point]]
text_zh = "本轮未核支持场景的 DPA 适用性。"

