[product.training]
mark = "yes"
mode = "by_contract"
anchor = "sd-runtime-no-train-unless-voluntary-feedback"

[[product.training.point]]
text_zh = "API 档（SaaS）合同层结论：默认不用于训练，唯一开口是客户主动提交反馈。①服务描述 §5.1(a)：「Unless separately authorized by Client through a voluntary feedback submission, IBM will not use the Client Content or model Outputs to train the foundation models or embedding models.」（Multicloud 档 i127-9067 §5.1(a) 同文）。同节把「所有模型输入（含推理/提示、微调/提示调优内容）」界定为 Client Content，输出所有权归客户。②基础合同层：CRA §4a「such parties will access, use, provide, store, and otherwise process Content solely for the purpose of providing the Products」，CSA §2b 同旨。③文档层：SaaS 文档「IBM does not use the content that you upload to watsonx or the output that is generated by a foundation model to further train or improve any IBM-developed models.」需并列的例外与边界：(a) 自愿反馈提交（voluntary feedback submission）可授权使用，CSA 另写「IBM may use for any purpose」"

[[product.training.point]]
text_zh = "(b) 文档层那句只说 IBM 自研模型（IBM-developed models），第三方模型（Non-IBM Product，如 Mistral 商用模型）另有许可条款，服务描述 §6.1 对 Mistral 微调模型另设「Unless separately authorized by Client, neither IBM nor Mistral will leverage, use…」"

[[product.training.point]]
text_zh = "(c) Technology Preview 不适用该 Data Sheet 与输出赔偿"

[[product.training.point]]
text_zh = "(d) 预览类服务另有「voluntary feedback… which IBM may use for any purpose」。未见任何按账户/按项目的训练开关或退出机制——开口只有主动反馈这一条路径。"

