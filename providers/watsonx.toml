[[product.zdr.point]]
text_zh = "API 档：官方文档声明 API 提交的提示与输出默认不被 IBM 记录、不存储（除非用户主动保存），即默认行为上等同零保留"

[[product.zdr.point]]
text_zh = "但全套 IBM 材料里没有 ZDR 这个术语，也没有可申请的 ZDR 计划、开关或合同条款——它不是一项可签约的承诺。证据：SaaS 文档「Nothing that you add to the prompt editor or submit to a model from the Prompt Lab or by using the API is logged by IBM」「Text that you add to or submit in the Prompt Lab or API is not stored unless you save it.」"

[[product.zdr.point]]
text_zh = "反面对照：服务侧 PII 仍可能存在于服务数据源与备份中最多 30 天（见 retention ④⑤），计量数据按账户统计，CSA/CRA/DPA/Data Sheet 里没有任何「请求处理完成即不保留」的合同条款。按规则记「文档层默认不落盘、无 ZDR 机制」，不等于厂商承诺了可申请的 ZDR。"

[product.retention]
days = 30
object = "input_output"
basis = "fixed_period"
anchor = "ds-runtime-duration-of-processing-30-days"

[[product.retention.point]]
text_zh = "API 档结论：在线推理的请求内容默认不落盘（文档层声明），服务侧数据以「服务终止后 30 天」为删除窗口，备份无量化期限。分对象记：①输入输出正文（在线推理）：文档声明「Nothing that you add to the prompt editor or submit to a model from the Prompt Lab or by using the API is logged by IBM」「Text that you add to or submit in the Prompt Lab or API is not stored unless you save it.」——属默认不记录/不存储，非合同量化期限。②用户主动保存的资产：SaaS 文档给 prompt session asset「retained for 30 days」（上限式、文档层），prompt template/notebook asset「retained until they are deleted or changed by you」（客户控制，无期限）。③服务终止后 Content：Data Sheet（DPA Exhibit）§3「The duration of Processing Content within this Cloud Service is 30 days after termination or expiration of the Cloud Service.」+ §5「IBM hereby certifies that all Client Personal Data are deleted at the end of the retention period specified in section 3」——这是合同层、可执行的删除窗口（Runtime/Studio/Multicloud 三份 Data Sheet 同值 30 天）。④服务侧 PII（账户/凭据/资产元数据）：文档层「personally identifiable information and data is removed completely from all data sources, including backups, after 30 days」。⑤备份：CRA §4e / CSA §2f「IBM does not archive Content; however, some Content may remain in backup files until expiration of such files as governed by IBM's backup retention practices」——备份保留期未量化，是唯一的开口。⑥计量数据：文档另声明按账户度量模型用量（billing/infrastructure planning/model lifecycle management），与内容保留是两件事。未发现任何请求级（0 天）的合同保留期承诺。"

[product.processing_region]
codes = ["AU", "CA", "DE", "GB", "IN", "JP", "PL", "US"]
anchor = "ds-runtime-processing-locations-may-limit"

[[product.processing_region.point]]
text_zh = "API 档结论：托管在 IBM Cloud 或 AWS，处理地随所选区域，且合同允许按请求收窄。①合同层（Data Sheet / DPA Exhibit §6）：Runtime 与 Studio 的处理地为 Australia/Canada/Germany/India/Japan/Poland/United Kingdom/United States，各列明处理活动（Hosting/Backup/Customer Support/Monitoring/Operations/Development）"

[[product.processing_region.point]]
text_zh = "「IBM may be able to limit Processing of Content to a subset of these locations, upon request」——即可申请收窄，但非默认。②产品层：SaaS 文档「The foundation models are hosted in IBM Cloud or AWS; your prompts are not sent to third-party platforms.」「Foundation models that you interact with through watsonx are hosted in IBM Cloud.」③区域可用性：IBM Cloud 六区（Dallas/Frankfurt/London/Tokyo/Sydney/Toronto）+ AWS 两区（Mumbai/N. Virginia）。④Multicloud 档 Data Sheet 列第三方子处理方含 AWS-India、Amazon (AWS)、Red Hat、Salesforce、Segment。⑤EU Supported Cloud（IBM Cloud 基础 SD §2.1）另给欧盟支持下的访问限制：必要访问限于 EU 常驻人员。注意 self-managed 档不是这个结论（见 products[software-self-managed]）。"

[product.role]
kind = "processor"
anchor = "dpa-client-appoints-ibm-as-processor"

[[product.role.point]]
text_zh = "API 档结论：IBM 是处理者（Processor），客户是控制者或其上游处理者。逐字条款：①DPA §1.1「Client is either (a) a Controller of Client Personal Data; or (b) a Processor acting on behalf of other Controllers… Client appoints IBM as Processor to Process Client Personal Data.」§1.3 按客户书面指示处理"

[[product.role.point]]
text_zh = "定义节「Subprocessor means any other Processor IBM engages to Process Client Personal Data.」②IBM Cloud 基础服务描述 §2：「The DPA and the applicable Data Processing and Protection Data Sheets (referred to as Data Sheets or DPA Exhibits) apply to IBM's processing of personal data on behalf of the Client.」③CRA §4d / CSA §2e 同句"

[[product.role.point]]
text_zh = "watsonx.ai as a Service Multicloud 服务描述 §2「…in the links below applies to IBM's processing of personal data on behalf of Client.」并给出该档 Data Sheet 的链接（Runtime 服务描述 §2 只写「The following Data Sheet(s) apply to this service:」+ 链接，不含 on behalf 措辞，故 role 的逐字依据取自 DPA 与 CRA/CSA/IBM Cloud 基础 SD）。④Data Sheet 自身声明「This Data Sheet is also considered as the DPA Exhibit…」且「When the DPA is applicable, these IBM affiliates are considered Subprocessors and any changes to these Subprocessors are subject to the DPA.」⑤适用哪份基础协议按账户类型分（IBM Cloud 条款页）：Free/Lite 账户与多数国家的美元 PayGo 信用卡账户走 CSA（Z126-6304_IBMCIBV）"

[[product.role.point]]
text_zh = "其余走 CRA（Z126-6548）+ Product Attachment for Cloud Services（Z126-6560）。两份协议在 Content and Data Protection 一节同旨。边界：IBM 官网通用隐私声明里的「控制者」是 IBM 处理自己网站/账户信息时的身份，与本维度无关，不能拿来顶替"

[[product.role.point]]
text_zh = "DPA 只在 GDPR 适用时并入（文档层表述为「if and to the extent… GDPR applies」），但 IBM Cloud 条款页与各 SD 均以「on behalf of Client」作为常态表述。"

