[[product.retention.point]]
text_zh = "对象与期限分三层：①个人信息（含账号、输入信息与输出信息）——隐私政策 四.2『仅在为提供本平台相关服务之目的所必需的期间内保留您的个人信息』，注销/主动删除/超期后删除或匿名化，例外为法律法规留存要求与财务审计争议解决延长；另有 六.4 段末一条更硬的例外（见下条），两条合起来意味着删除侧没有固定上限"
anchor = "retention-legal-retention-exception"

[[product.retention.point]]
text = "Harder exception on the deletion side (privacy policy §6.4, closing sentence): \"法律、行政法规规定的保存期限未届满，或者删除个人信息从技术上难以实现的，我们会停止除存储和采取必要的安全保护措施之外的处理\" — even where a deletion request stands, the data may end up in a store-and-isolate state (storage plus necessary security measures only), which is not the same as deleted. This is the exception that fixes the real boundary of the deletion right; its subject is still 您的个人信息, so it must not be extended to API request bodies"
text_zh = "删除侧更硬的一条例外（隐私政策 六.4 段末）：『法律、行政法规规定的保存期限未届满，或者删除个人信息从技术上难以实现的，我们会停止除存储和采取必要的安全保护措施之外的处理』——删除请求成立也不等于数据已消失，可转为「仅存储 + 必要的安全保护措施」的隔离状态。该句主语仍是『您的个人信息』，不得据此扩大到 API 请求正文"
anchor = "retention-deletion-technically-infeasible"

[[product.retention.point]]
text_zh = "未量化天数，属『下限/必要期间』而非上限。②API 输入正文——开发者文档《Prompt 缓存最佳实践》：对话数组（System/User/Assistant）、图片、视频进入缓存系统，按 LRU 淘汰，高峰期更易逐出、低峰期生命周期更长，无期限承诺、无关闭开关"

[[product.retention.point]]
text = "A third class of persistent copy derived from conversation content (privacy policy §1.3 个性化能力): \"我们会根据与您的对话记录，总结并形成对您的相关记忆（如您的工作习惯、偏好），以便模型参考对您的相关记忆，向您输出更适合您、更符合您需求的回答\" — 相关记忆 is summarised from the conversation record and persists, so it stands alongside the cache copy and the 个人信息 necessary-period wording instead of being a sub-item of the cache. Scope: \"本平台中的部分服务\" (the conversational service surface), not a Step Plan API channel mechanism; the same paragraph says the user can view, edit or delete the memory or switch the memory feature off, so this is recorded as an object/context note and must not raise or lower this tier's verdict"
text_zh = "第三类由对话内容派生的持久副本（隐私政策 一.3 个性化能力）：『我们会根据与您的对话记录，总结并形成对您的相关记忆（如您的工作习惯、偏好），以便模型参考对您的相关记忆，向您输出更适合您、更符合您需求的回答』——「相关记忆」由对话记录总结生成并长期存在，与缓存副本、个人信息必要期间并列，不是缓存的一条子项。适用服务范围：『本平台中的部分服务』（对话式服务面），不是 Step Plan API 通道的机制；同段写明用户可查看、编辑、删除记忆或关闭记忆功能，故只作对象/语境补录，不据此加重或减轻本档判定"
anchor = "retention-personalized-memory"

[[product.retention.point]]
text_zh = "该副本不受 四.2『个人信息』期限表述约束。③服务终止后——用户协议 3.6 平台『有权在服务终止后或在我们与您另行约定的保留期限（如有）届满后，删除上述信息』，为权利而非义务，且保留期限『如有』，未量化。日志类：隐私政策 一.8 收集设备与日志信息（IP、操作时间、服务日志等），期限适用 四.2 一般规则，无单独期限。"
anchor = "retention-termination-deletion-right"

[[product.retention.point]]
text = "A second deletion context, triggered by non-payment (userservice §1.1.4): \"未按约定支付相应的服务费用的，我们有权单方面不经通知暂停或终止提供服务，并删除您在本平台上所有的非法律法规要求的全部数据等\" — non-payment alone lets the platform unilaterally and without notice delete 非法律法规要求的全部数据. Trigger and scope both differ from §3.6 (deletion after termination or after an agreed retention period); it is likewise a right, not a duty, so it must not be written as 欠费即删除全部数据"
text_zh = "③-b 另一种删除语境，触发条件是欠费（用户协议 1.1.4）：『未按约定支付相应的服务费用的，我们有权单方面不经通知暂停或终止提供服务，并删除您在本平台上所有的非法律法规要求的全部数据等』——欠费即可被单方、不经通知地删除平台上「非法律法规要求的全部数据」，触发条件与删除口径都不同于 3.6 的服务终止后依约定期限删除；同样是权利而非义务，不得写成「欠费即删除全部数据」"
anchor = "retention-unpaid-data-deletion"

[[product.retention.point]]
text = "An object that 注销后删除 does not cover (userservice §2.2.4): after an account is reclaimed or cancelled the platform 仍有权：1）\"保留相关行为记录，但涉及个人信息的除外\"（如有）— behavioural records may survive deactivation, and the 涉及个人信息的除外 carve-out must be read with the clause or it reads as unlimited retention. The object is account-level behavioural records, not API request bodies; the agreement does not define the scope of 行为记录"
text_zh = "③-c 注销后删除覆盖不到的一类对象（用户协议 2.2.4）：账户被收回或者注销后平台『仍有权：1）保留相关行为记录，但涉及个人信息的除外（如有）』——「注销后删除」不覆盖行为记录，同时「涉及个人信息的除外」这一限定必须一并写出，否则会读成无限保留。对象是账户维度的行为记录，不是 API 请求正文；协议未定义「行为记录」的范围"
anchor = "retention-behavior-records-after-deactivation"

[product.processing_region]
codes = ["CN"]
anchor = "region-storage-prc-personal-info"

[[product.processing_region.point]]
text_zh = "隐私政策 四.1 前段：『我们依照法律法规的规定，将在境内运营过程中收集和产生的您的个人信息存储于中华人民共和国境内』。codes=[CN] 的标的就是这句里的『您的个人信息』——境内运营过程中收集和产生的个人信息，存储地不等于全部 API 输入输出的处理地；条款主语限定为『您的个人信息』，对 API 输入输出等非个人信息数据未作同等地域声明，故置信度 medium。协议族内无多区域/处理地选项；同段后半句另留跨境传输开口（见下条）"

[[product.processing_region.point]]
text = "The same paragraph then leaves cross-border transfer open (privacy policy §4.1): \"目前，我们不会将上述信息传输至境外，如果我们向境外传输，会严格遵守中国的相关法律、监管政策，并会遵循相关国家规定或者征求您的同意\" — 目前不会传输至境外 is a statement of current practice, not an absolute bar. The agreement family states no region for API inputs/outputs and offers no multi-region or processing-location choice, so cross-border transfer remains an opening; the first sentence must not be read as 永不出境"
text_zh = "同段紧接着留了跨境传输的开口（隐私政策 四.1 后段）：『目前，我们不会将上述信息传输至境外，如果我们向境外传输，会严格遵守中国的相关法律、监管政策，并会遵循相关国家规定或者征求您的同意』——「目前不会传输至境外」是现状陈述而非绝对不出境。协议族内未对 API 输入输出作地域声明，也没有多区域/处理地选项，跨境传输留有开口，不得把前段读成「永不出境」"
anchor = "region-cross-border-transfer-opening"

[[product.processing_region.point]]
text_zh = "用户协议 9 条约定适用中国大陆法律、争议提交公司住所地法院，可作境内运营的旁证但不构成处理地承诺。"

