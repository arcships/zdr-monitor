[[product.role.point]]
text = "Layer one — end-user personal information (userservice §6.2): \"您作为最终用户个人信息的处理者应当履行个人信息处理者的相关法定义务\" — for this layer the agreement does allocate a role, and it puts it on the customer/developer, not on the platform"
text_zh = "分层一：对最终用户个人信息——用户协议 6.2『您作为最终用户个人信息的处理者应当履行个人信息处理者的相关法定义务』，即开发者/客户是处理者，这一层协议确实分配了角色，只是分配给了客户一侧"
anchor = "role-developer-processor"

[[product.role.point]]
text = "Same allocation on the consent side (userservice §6.4): \"您使用本服务时，向我们传输的任何信息，如涉及到个人信息和其他数据的，必须充分取得相关主体的明示同意和授权\" — the duty to obtain consent and authorization, plus liability for losses the platform suffers, sits with the customer. A customer-obligation clause with no 受托处理者/processor wording, so it corroborates that the agreement allocates roles without naming the platform's own statutory role"
text_zh = "同一条角色分配链的同意侧（用户协议 6.4）：『您使用本服务时，向我们传输的任何信息，如涉及到个人信息和其他数据的，必须充分取得相关主体的明示同意和授权』，并须确保平台不因处理相关数据和个人信息遭受损失和投诉——取得同意与授权的责任、以及平台的赔偿请求权都在客户一侧。这是客户义务条款，不含平台自身的受托处理者字样，只能作「协议对角色有分配」的佐证，单独不足以定平台角色"
anchor = "role-customer-warrants-consent"

[[product.role.point]]
text_zh = "分层二：对客户自身输入/输出数据——用户协议 5.3/6.5 取得含存储、使用、复制、修订、编辑的许可使用（5.3 目的含『提升大模型服务体验』，6.5 为『为提供、诊断、改善、优化、升级本服务之目的使用、处理』），5.4 约定平台运行过程中产生的一切数据由平台享有合法权利。这三句是知识产权章的许可授予与数据权属条款，说明平台对客户数据有自身目的的处分权，但没有出现处理者/控制者这一法定角色的表述"

[[product.role.point]]
text = "The platform's self-description (userservice §1.2): \"本公司仅作为中立的技术服务提供者\", immediately followed by pushing operational responsibility onto the customer (『您的网站、应用、软件、平台等任何产品、服务及相关内容等，由您自行运营』). This is a statement about how liability is divided, not a statement of the statutory processor/controller role"
text_zh = "平台的自我定位（用户协议 1.2）：『本公司仅作为中立的技术服务提供者』，紧接一句把运营责任推给客户（『您的网站、应用、软件、平台等任何产品、服务及相关内容等，由您自行运营』）。这是责任划分的自述，不是对处理者/受托处理者这一法定角色的表态"
anchor = "role-neutral-provider"

[[product.role.point]]
text = "Direction of privacy policy §3.2 must be read carefully: \"我们可能委托授权合作伙伴处理您的个人信息，以便授权合作伙伴代表我们为您提供某些服务或履行职能\" — the platform is the entrusting party and the authorized partners are the entrusted parties; the platform sets the purposes itself (『我们仅会出于本隐私政策声明的合法、正当、必要、特定、明确的目的委托其处理您的信息』). So this clause places the platform on the entrusting (personal-information-handler) side of the chain; it says nothing about whether the platform is a processor or a controller with respect to customer data"
text_zh = "隐私政策 三.2 的方向要读准：『我们可能委托授权合作伙伴处理您的个人信息，以便授权合作伙伴代表我们为您提供某些服务或履行职能』——平台是委托方，受托方是授权合作伙伴；处理目的由平台自定（『我们仅会出于本隐私政策声明的合法、正当、必要、特定、明确的目的委托其处理您的信息』），同段还写明会与受托合作方签署处理协议并监督其使用活动。该条把平台放在委托方（个人信息处理者一侧）的位置，并不说明平台对客户数据是受托处理者还是独立控制者"
anchor = "role-entrusted-partners"

[[product.role.point]]
text = "Privacy policy §3.1 limits third-party disclosure only: \"一般情况下，我们不会向其他任何公司、组织和个人提供您的个人信息\" — its subject is again 您的个人信息, and it says nothing about the platform's own role"
text_zh = "隐私政策 三.1 只承诺不向第三方提供个人信息：『一般情况下，我们不会向其他任何公司、组织和个人提供您的个人信息』，主语同样是『您的个人信息』，不构成对平台自身角色的表态"
anchor = "role-no-sharing-without-consent"

[[product.role.point]]
text = "Why the verdict stays 未约定角色 (kind=unknown): every sentence above either allocates duties to the customer or describes the entrusting chain; no clause in either snapshot characterises the platform itself as 受托处理者/processor or 独立控制者/controller for customer data, and the CN site has no DPA snapshot to confirm the split (/docs/zh/agreement/dataprocess, /legal/dpa.html, /legal/data-processing.html, /dpa, api.stepfun.com/dpa have no snapshot in snapshots/ and cannot be rechecked this round). Divergence kept side by side, not resolved: the pay-as-you-go API line (providers/stepfun.toml) records kind=controller for the same agreement family (§5.3/§5.4/§6.5/§6.2). The disputed point is whether §6.5 self-use authorization plus §5.4 data ownership plus the platform setting its own purposes in the privacy policy suffice to conclude controller; scope-wise that row covers the platform.stepfun.com pay-as-you-go API tier, this row is the Step Plan subscription tier"
text_zh = "结论仍记「未约定角色」（kind=unknown）的理由：上述句子都在分配客户侧义务或描述委托链条，两份快照里没有一句把平台自身表述为『受托处理者/processor』或『独立控制者/controller』；中国站也没有 DPA 可据以确认角色划分（/docs/zh/agreement/dataprocess、/legal/dpa.html、/legal/data-processing.html、/dpa、api.stepfun.com/dpa 在 snapshots/ 下无快照，本轮无法复核）。分歧并列保留、不选边：同厂按量 API 档（providers/stepfun.toml）对同一协议族（含 5.3/5.4/6.5/6.2）记 kind=controller。分歧点是平台自身对客户数据的角色能否由 6.5 自用授权＋5.4 数据权属＋隐私政策自定处理目的推出 controller；适用范围上那条覆盖 platform.stepfun.com 按量 API 档，本档为 Step Plan 订阅档。国际站同路径 DPA 快照逐字写 Customer is the controller and StepFun is the processor，但那是另一实体（platform.stepfun.ai，Controller 为 STEPFUN TECHNOLOGY (HK) LIMITED）另一站点，按权威性口径只能当发现线索，不能作本档证据"

[[product.role.point]]
text_zh = "查阅范围说明：searched 里 /legal/*.html、/step-plan、/trust、/dpa 等条目本轮在 snapshots/ 下没有快照，无法复核；本档可复核的角色依据只有用户协议与隐私政策两份快照。故不据这些页面下结论，也不以「未披露」收口——缺的是可复核的 DPA，不是厂商的沉默"

