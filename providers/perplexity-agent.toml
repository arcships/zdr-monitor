text_zh = "该页原文「Perplexity maintains a strict **Zero Data Retention Policy** for the Chat Completions API. We do not retain data sent through the Chat Completions API…」。限定语是 Chat Completions API，**不是** Agent API"

[[product.zdr.point]]
