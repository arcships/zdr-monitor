[[product.retention.point]]
text = "Object = data submitted through the API; context = default. The FAQ no longer gives a period and does not distinguish input from output: it now says \"Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default\". The former \"By default, the API has zero day retention of user prompt data\" and \"We do not retain any query data sent through the API\" sentences have been removed, so this source no longer supports a 0-day input period."
text_zh = "对象=经 API 提交的数据；语境=默认。FAQ 不再给期限，也不区分输入与输出：现在写「Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default」。原先的「By default, the API has zero day retention of user prompt data」与「We do not retain any query data sent through the API」两句已被删除，故本来源不再支持输入侧 0 天的说法。"
anchor = "perplexity-agent-faq-retention-varies-zdr-not-default"

[[product.retention.point]]
text = "Object = response content (output); context = default. The rewritten page gives no period: \"Retention, use, and security practices vary by API, model, and account configuration\", and \"If ZDR has not been enabled for your account, do not assume that Perplexity or its model providers apply zero data retention to your requests\". The former \"We do not retain data sent through the Chat Completions API\" sentence is gone, so output is recorded as undisclosed rather than none."
text_zh = "对象=response content（输出）；语境=默认。改版后的页面没有给期限：「Retention, use, and security practices vary by API, model, and account configuration」，且「If ZDR has not been enabled for your account, do not assume that Perplexity or its model providers apply zero data retention to your requests」。旧句「We do not retain data sent through the Chat Completions API」已被删除，故输出记「未公布」而非「不留存」。"
anchor = "perplexity-agent-privacy-security-no-zdr-default"

[[product.retention.point]]
text = "Third-party model exception: \"Some providers require limited retention as a condition of offering their models\". Object = requests routed to those third-party models; context = third-party provider terms; no retention period is stated."
text_zh = "第三方模型例外：「Some providers require limited retention as a condition of offering their models」。对象=路由到这些第三方模型的请求；语境=第三方提供方条款；未给出保留期限。"
anchor = "perplexity-agent-privacy-security-third-party-limited-retention"

[[product.retention.point]]
text = "Usage metadata is collected with no stated period: \"Perplexity collects limited usage metadata—such as request and token counts, model used, timestamps, duration, and API key—to operate and bill the service, along with account information such as name and email address\". The page no longer states that this metadata excludes prompt/response content."
text_zh = "用量元数据被收集但未给期限：「Perplexity collects limited usage metadata—such as request and token counts, model used, timestamps, duration, and API key—to operate and bill the service, along with account information such as name and email address」。页面不再声明该元数据不含请求/响应内容。"
anchor = "perplexity-agent-privacy-security-usage-metadata"

[[product.retention.point]]
text = "Authority: the FAQ and the dedicated Privacy & Security page now agree — both say retention depends on the API/model/account configuration and that ZDR is not the default, and neither gives a period. The row-level label therefore reads \"varies by object, period undisclosed\": input is covered by the DPA's Personal Data rules (which set no period during the term) and output has no retention clause at the contract layer, so the objects remain recorded separately, but no source gives a numeric period for either."
text_zh = "权威性：FAQ 与专门的 Privacy & Security 页现已一致——两者都写保留随 API/模型/账户配置而异、ZDR 非默认，且都不给期限。故行级标签读作「按对象分列未公布期限」：输入受 DPA 的 Personal Data 规则约束(存续期间无期限)，输出在合同层没有保留条款，对象仍分开记录，但两边的来源都没有给出数字期限。"

[product.processing_region]
codes = ["US"]
anchor = "perplexity-agent-faq-aws-na-region"

[[product.processing_region.point]]
text = "Same source and same conclusion as the top level and the api tier: one FAQ sentence, \"Our compute is hosted via Amazon Web Services in North America\", which takes \"our compute\" as its object — a platform-level statement not split by endpoint, so it covers the Chat Completions tier as well. The same answer now defers retention and ZDR to the Privacy & Security page instead of asserting zero-day retention. Perplexity provides no region selection or data residency option, and does not disclose the specific AWS region (only North America). This row is a boundary marker: region and role agreeing across the tiers does not mean the other dimensions agree — on zdr, Sonar has an account-level ZDR path while the Agent API stateful configuration remains unconfirmed; on retention, both this row and the stateful row now record no stated period (this row per the privacy page and the rewritten FAQ; the stateful row per server-side persistence with no period). The tiers are not interchangeable. Uncertainty: the sentence comes from the FAQ (developer_data layer), the contract layer (API ToS and DPA) has no data-location clause, and the DPA's cross-border transfer mechanism is not given in the public text."
text_zh = "与顶层及 api 档同源、同结论：FAQ 一句「Our compute is hosted via Amazon Web Services in North America」，以「our compute」为对象，是平台级表述，不按端点分档，故同样覆盖 Chat Completions 档。同一答案现在把保留与 ZDR 指向 Privacy & Security 页，而不再声称零日保留。官方未提供任何区域选择或数据驻留选项，也没有披露具体 AWS 区域（只说 North America）。本行是边界标注行：region 与 role 两维各档一致，并不意味着其他维度一致——zdr 维 Sonar 有账户级协议路径而 Agent API 有状态配置仍未确认；retention 维本行与有状态行现在都记「未给期限」（本行依据隐私页与改写后的 FAQ；有状态行依据服务端持久化且无期限）。两档不能互换。不确定性：该句出自 FAQ（developer_data 层），合同层（API ToS 与 DPA）没有数据所在地条款，DPA 的跨境传输机制未在公开文本中给出。"

[product.role]
kind = "processor"
anchor = "perplexity-agent-dpa-2-roles-processor"

[[product.role.point]]
text = "Same source and same conclusion as the top level and the api tier: DPA §2, \"Customer is the Controller or Processor or Business and Perplexity is the Service Provider or Processor\""
text_zh = "与顶层及 api 档同源、同结论：DPA §2「Customer is the Controller or Processor or Business and Perplexity is the Service Provider or Processor」"

[[product.role.point]]
text = "API ToS §6.1 incorporates the DPA into the contract by reference, and the scope in ToS §1 expressly covers \"the Sonar by Perplexity and/or Agentic Research application programming interface (“API”) services\" — Sonar's chat completions endpoint is among them, so the processor positioning applies to this tier as well. Why confidence is recorded as medium: DPA §1 carries its own exclusion, \"Certain Services (including but not limited to the Embeddings API and Perplexity Search) may operate under data postures that differ from this DPA\"; the ones named are the Embeddings API and Perplexity Search, and Chat Completions is not among them, but the list is open-ended (including but not limited to) and no complete list of excepted services is given. One hop upstream: ToS §2.6 acknowledges that the Services may use third-party models and DPA §6(c) requires subcontractors to carry obligations no less onerous than Perplexity's own, but the public text does not name one by one which model providers take part in the Chat Completions tier."
text_zh = "API ToS §6.1 以引用方式把 DPA 并入合同，而 ToS §1 的适用范围明写覆盖「the Sonar by Perplexity and/or Agentic Research application programming interface (\"API\") services」——Sonar 的 chat completions 端点正在其中，故本档同样适用 processor 定位。置信度记 medium 的理由：DPA §1 自带排除条款「Certain Services (including but not limited to the Embeddings API and Perplexity Search) may operate under data postures that differ from this DPA」，被点名的是 Embeddings API 与 Perplexity Search，Chat Completions 不在其列，但该清单是开放式的（including but not limited to），官方未给出完整的例外服务清单。上游一跳：ToS §2.6 承认 Services 可能使用第三方模型，DPA §6(c) 要求子处理方承担不低于自身的义务，但公开文本未逐一点名哪些模型提供方参与 Chat Completions 档。"

