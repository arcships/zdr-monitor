[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "perplexity-agent-privacy-security-zdr-not-default"

[[product.zdr.point]]
text = "The former Chat Completions-specific strict ZDR promise was removed. The rewritten page says \"Zero Data Retention is not default: ZDR is available only to eligible customers through an account-level configuration under a written agreement with Perplexity\" and warns that without that configuration one should not assume Perplexity or its model providers apply zero retention. ZDR is therefore available on this tier only by agreement, not by default."
text_zh = "原 Chat Completions 专属的严格 ZDR 承诺已被删除。改版后的页面写「Zero Data Retention is not default: ZDR is available only to eligible customers through an account-level configuration under a written agreement with Perplexity」，并警告未做该配置时不得假设 Perplexity 或其模型提供方零保留。故本档 ZDR 只能按协议开通，不再是默认。"

[[product.zdr.point]]
text = "Model-specific limitation: \"Not every model supports ZDR\"; the same page also warns that \"Some providers require limited retention as a condition of offering their models\". The account-level arrangement therefore does not by itself guarantee ZDR for every model used on this tier."
text_zh = "模型级限制：「Not every model supports ZDR」；同页还警告「Some providers require limited retention as a condition of offering their models」。故账户级安排本身不保证本档使用的每个模型都能 ZDR。"
anchor = "perplexity-agent-privacy-security-model-specific-zdr"

[[product.zdr.point]]
text = "The FAQ now agrees with the dedicated privacy page: \"Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default\". The former conflicting \"By default, the API has zero day retention of user prompt data\" sentence has been removed. The verdict's mode still comes from the Privacy & Security page because that is the dedicated page on API privacy, retention and ZDR — the only one that describes ZDR as a program — and the page itself says it \"should be read together with the API Terms of Service, applicable product-specific terms, the Data Processing Addendum, and any written agreement between you and Perplexity\", with those documents controlling where they differ. The FAQ states only that ZDR is not the default and gives no eligibility/agreement path, so it is recorded as supporting evidence rather than used to set mode."
text_zh = "FAQ 现在与专门的隐私页一致：「Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default」。原先冲突的「By default, the API has zero day retention of user prompt data」一句已被删除。mode 仍取 Privacy & Security 页，因为它是专门讲 API 隐私、保留与 ZDR 的页面，也是唯一把 ZDR 作为一项机制来描述的地方；该页自己写明应「should be read together with the API Terms of Service, applicable product-specific terms, the Data Processing Addendum, and any written agreement between you and Perplexity」，且这些文件不一致时以它们为准。FAQ 只说明 ZDR 非默认，没有给出资格/协议开通路径，故在此仅作辅助证据，不用来决定 mode。"
anchor = "perplexity-agent-faq-retention-varies-zdr-not-default"

