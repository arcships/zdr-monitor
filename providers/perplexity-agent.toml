[[product.processing_region.point]]
text = "Same as top-level processing_region. The storage location of conversation state is not separately disclosed; there is only the platform-level sentence that compute is hosted via AWS in North America."
text_zh = "同顶层 processing_region。会话状态的存储地未单独披露，只有平台级「compute 在 AWS 北美」一句。"

