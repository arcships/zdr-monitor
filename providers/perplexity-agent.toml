[[product.retention.point]]
text = "The body of requests and responses is not retained on this tier: the same page reads \"Perplexity maintains a strict **Zero Data Retention Policy** for the Chat Completions API. We do not retain data sent through the Chat Completions API...\", and the FAQ repeats \"the API has zero day retention of user prompt data\"."
text_zh = "该档的请求/响应正文不留存：同页原文「Perplexity maintains a strict **Zero Data Retention Policy** for the Chat Completions API. We do not retain data sent through the Chat Completions API…」，FAQ 亦写「the API has zero day retention of user prompt data」。"
