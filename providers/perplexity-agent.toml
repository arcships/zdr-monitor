name = "Perplexity Agent"
line = "perplexity-agent"
site = "global"
entity = "Perplexity AI, Inc."
endpoint = ""
doc = "https://perplexity.ai/hub/legal/perplexity-api-terms-of-service"

[[source]]
url = "https://docs.perplexity.ai/docs/agent-api/conversation-state"
channel = "developer_data"
tier = "core"
note = "Agent API 文档「Conversation state」页。这是本档唯一直接描述服务端会话状态处理方式的官方文字：状态服务端持久化、store:false 不关闭持久化、有 ZDR 协议者需先向客户团队确认 stateful 功能。它没有给出任何保留期限、自动过期时间或删除接口说明。旧记录的两条引文都出自本页。"

[[source]]
url = "https://docs.perplexity.ai/docs/resources/faq"
channel = "developer_data"
tier = "core"
note = "文档站《Frequently Asked Questions》的 Data, Privacy & Security 段(共 3 问)。措辞是平台级的「the API」，未限定端点。2026-10-24 快照改版后，原先的「We do not retain any query data sent through the API and do not train on any of your data」与「By default, the API has zero day retention of user prompt data」两句已被删除：训练句改为以合同为依据的「Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models」，保留句改为「Retention depends on the API, model, and account configuration, and Zero Data Retention (ZDR) is not the default」，与 privacy-security 页一致，2026-10-15 记录的两页字面冲突随之消失。本页仍为 processing_region 的 core 依据(AWS 北美)；training 与合同同向；retention 在本页只剩「按 API/model/account 配置而异、ZDR 非默认」的定性表述，不再给任何期限，也不再有「不保留」表述。"

[[source]]
url = "https://docs.perplexity.ai/docs/resources/privacy-security"
channel = "developer_data"
tier = "core"
note = "文档站《Privacy & Security》页（2026-10-15 改版）。旧版把「strict Zero Data Retention Policy」明确限定在 Chat Completions API，并写计费元数据不含请求/响应内容；新版删去这两句，改为平台级表述：ZDR 不是默认，只向合格客户按书面协议做账户级开通；未开通时不得假设 Perplexity 或其模型提供方对请求做零保留；并非所有模型支持 ZDR，第三方模型提供方可能要求有限保留。页面另列收集的用量元数据（请求/token 数、模型、时间戳、时长、API key）与账户信息（姓名、邮箱），不再声明元数据不含内容。页面在模型限制条中直接提到 Agent API 账户，但未确认 ZDR 覆盖 Agent API 的服务端会话状态（conversation-state 页仍要求向客户团队确认）。本页现为 zdr「按协议开通」与「非默认」的平台级依据，**不再支撑任何档位的默认零保留结论**。"

[[source]]
url = "https://perplexity.ai/hub/legal/dpa"
fetch = "browser"
channel = "contract"
tier = "core"
note = "《Perplexity Data Processing Addendum》(Last Updated: August 13, 2026)。第 1 段把「Services」定义为客户协议项下的任何 Perplexity 产品/功能/API，并明文保留例外：Embeddings API、Perplexity Search 等「may operate under data postures that differ from this DPA」，以产品专属条款为准——**Agent API 不在例外名单内**。§2 角色、§5 不得用于训练、§10 与服务结束后 30 天内删除、Annex 1 的 Input 保留规则、§6c/§6d/§6e 第三方模型提供方作为分包方及其义务流下，是本档 retention/role/training 的合同层权威。注意 DPA 只约束「Personal Data」；对非个人的 Input，合同层没有保留期限条款。"

[[source]]
url = "https://perplexity.ai/hub/legal/perplexity-api-terms-of-service"
fetch = "browser"
channel = "contract"
tier = "core"
note = "《Perplexity API Terms of Service》(Last updated: January 23, 2026)。开篇把服务定义为「the Sonar by Perplexity and/or Agentic Research application programming interface (“API”) services (the “Services”)」——即本档(文档站称 Agent API、协议里称 Agentic Research API)与 Sonar/Chat Completions 同受本协议约束；并声明本协议只适用于 API 客户，不适用于 Enterprise Pro、官网等。§2.3.3 是 training 维度的合同层权威；§2.6 把第三方模型及其条款并入合同(本档多跳链路的合同依据)；§6.1 把 DPA 并入本协议(retention/role 的合同层入口)。全文无保留期限条款；§10.5 只规定终止后销毁/返还机密信息，自动备份按标准删除流程处理。经 apex 域抓取(www 域对 jina 匿名访问 403，见 notes)。"

[[product]]
id = "api"
badge = "API 平台"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "perplexity-agent-api-tos-2-3-3-no-training"

[[product.training.point]]
text = "Same as top-level training: API ToS §2.3.3 covers Customer Content and includes \"or authorize third parties to use\""
text_zh = "同顶层 training：API ToS §2.3.3 覆盖 Customer Content 且含「or authorize third parties to use」"

[[product.training.point]]
text = "DPA §5 covers Personal Data, but its (a)–(c) prohibitions are prefixed with \"To the extent required by Privacy Laws\"; the training prohibition at the end of the same paragraph opens with \"For the avoidance of doubt\", so whether that prefix governs it is open to interpretation. This dimension therefore rests on the unconditional API ToS §2.3.3. The conduct of the upstream providers themselves falls outside Perplexity's commitment (§2.6)."
text_zh = "DPA §5 覆盖 Personal Data，但其 (a)–(c) 禁令以「To the extent required by Privacy Laws」为前提；同段末句的训练禁令以「For the avoidance of doubt」起头，是否受该前提约束存在解释空间，故本维度以无条件的 API ToS §2.3.3 为主依据。上游提供方自身行为不在 Perplexity 承诺范围内(§2.6)。"
anchor = "perplexity-agent-dpa-5-privacy-laws-premise"

[[product.training.point]]
text = "Boundary of the commitment (API ToS §3.3): \"Usage Data\" means metadata, analytics, performance metrics and other operational data that \"does not include Customer Content or personal information or is anonymized and/or aggregated\", and Perplexity \"may use Usage Data for any lawful purpose (e.g., to assess the relative popularity of the Services’ features or to improve categorization algorithms) without remuneration to Customer\". Improving the service counts as training under this ledger's rule, but §3.3 sits expressly outside Customer Content, so it does not overturn §2.3.3 — it only marks the edge of the no-training commitment."
text_zh = "承诺的边界(API ToS §3.3)：「Usage Data」指元数据、分析、性能指标等运营数据，且「does not include Customer Content or personal information or is anonymized and/or aggregated」；Perplexity「may use Usage Data for any lawful purpose (e.g., to assess the relative popularity of the Services’ features or to improve categorization algorithms) without remuneration to Customer」。按本台账口径「用来改进服务算训练」，但 §3.3 明文排除 Customer Content，故不推翻 §2.3.3，只标明不训练承诺的边界。"
anchor = "perplexity-agent-api-tos-3-3-usage-data"

[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "perplexity-agent-conversation-state-zdr-agreement"

[[product.zdr.point]]
text = "Same as top-level zdr: ZDR requires an agreement to enable"
text_zh = "同顶层 zdr：ZDR 需协议开通"

[[product.zdr.point]]
text = "The rewritten privacy page states platform-wide that ZDR is not default: \"Zero Data Retention is not default: ZDR is available only to eligible customers through an account-level configuration under a written agreement with Perplexity\". The FAQ now says the same (\"Zero Data Retention (ZDR) is not the default\"), so the literal conflict previously recorded on the api-sonar-chat-completions row no longer exists."
text_zh = "改版后的隐私页已在平台级写明 ZDR 不是默认，只向合格客户按账户级书面协议开通。FAQ 现在与之一致（「Zero Data Retention (ZDR) is not the default」），原先记在 api-sonar-chat-completions 档的两页字面冲突已消失。"
anchor = "perplexity-agent-privacy-security-zdr-not-default"

[product.retention]
days = 30
object = "mixed"
basis = "until_termination"
anchor = "perplexity-agent-dpa-10-deletion-30-days"

[[product.retention.point]]
text = "Object: personal information contained in Input. DPA Annex 1 stores it \"until the earlier of (a) the date it is deleted by Customer through the Services’ interface and (b) the date that is thirty days after Perplexity is no longer providing the Services to Customer\" — a post-termination deletion obligation, not a fixed 30-day retention period; during the term it sets no ceiling at all."
text_zh = "对象：Input 中的个人信息。DPA Annex 1 规定其留存至「客户经界面删除」与「不再向客户提供服务后 30 天」两者较早者——这是终止后的删除义务，不是固定 30 天保留期；服务存续期间它不给任何上限。"
anchor = "perplexity-agent-dpa-annex1-input-retention"

[[product.retention.point]]
text = "Second limb (DPA §10): Perplexity deletes (or returns) all Personal Data \"within thirty days of the end of the provision of the Services to Customer, unless retention of the Personal Data is required by law\", and deletes it once that legal retention obligation expires. The thirty days is therefore an upper bound that starts at the end of the service and carries a statutory-retention exception — days = 30 records that deletion window, not a retention period."
text_zh = "第二层依据(DPA §10)：Perplexity 在「服务结束后 30 天内」删除(或返还)全部 Personal Data，除非法律要求留存，并在该法定留存义务届满后删除。故 30 天是自服务结束时起算的上限，且带法定保留例外——days = 30 记的是这个删除窗口，不是保留期。"
anchor = "perplexity-agent-dpa-10-deletion-30-days"

[[product.retention.point]]
text = "Duration at the contract layer (DPA Annex 1, \"Frequency and duration of the processing\"): processing runs \"for the duration of the term of the Agreement and any post-termination retention period as set out in the Agreement\" — the contract speaks only to Personal Data's processing duration and gives no specific period for Input or Output content beyond that."
text_zh = "合同层的处理持续期(DPA Annex 1「Frequency and duration of the processing」)：处理持续到「the duration of the term of the Agreement and any post-termination retention period as set out in the Agreement」——合同层只界定 Personal Data 的处理持续期，对输入输出正文没有给出具体期限。"
anchor = "perplexity-agent-dpa-annex1-processing-duration"

[[product.retention.point]]
text = "May still survive termination: API ToS §10.5 requires each party to destroy or return all Confidential Information on termination, and §5.1 makes Customer Content Customer's Confidential Information, so that duty covers Input and Output — but \"copies in the Receiving Party’s automated back-up systems\" are carved out and deleted only \"in accordance with the Receiving Party’s standard deletion procedures\", with no period stated. That sits alongside the DPA §10 thirty-day deletion duty."
text_zh = "终止后仍可能留存：API ToS §10.5 要求双方在终止时销毁或返还全部机密信息，§5.1 又把 Customer Content 定性为客户的机密信息，故该义务覆盖输入输出正文；但「copies in the Receiving Party’s automated back-up systems」被明文排除，只按「标准删除流程」删除、未给期限。该条与 DPA §10 的 30 天删除义务并列。"
anchor = "perplexity-agent-api-tos-10-5-backup-exception"

[[product.retention.point]]
text = "Output has no retention clause at the contract layer (the DPA governs Personal Data, and Annex 1's storage rule is written for Input), which is why this row reads \"varies by object\"; the FAQ no longer states \"no retention / zero day retention\" — it now says retention depends on the API, model, and account configuration and that ZDR is not the default, matching the privacy-security page."
text_zh = "Output 在合同层没有保留期限条款(DPA 只约束 Personal Data，Annex 1 的存储规则是为 Input 写的)，本行故记「按对象分列」；FAQ 已不再写「不保留/零日保留」，而改为保留随 API、模型与账户配置而异、ZDR 非默认，与 privacy-security 页一致。"

