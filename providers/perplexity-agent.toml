[product.zdr]
mark = "no"
mode = "not_disclosed"
anchor = "perplexity-agent-conversation-state-zdr-stateful-unconfirmed"
searched = [
  "https://docs.perplexity.ai/docs/agent-api/conversation-state",
  "https://docs.perplexity.ai/docs/resources/privacy-security",
  "https://docs.perplexity.ai/docs/resources/faq",
  "https://perplexity.ai/hub/legal/dpa",
