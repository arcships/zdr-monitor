mark = "yes"
mode = "by_agreement"
anchor = "perplexity-agent-conversation-state-zdr-agreement"

[[product.zdr.point]]
text = "Same as top-level zdr. The key fact on this row: the docs expressly say that if your account has a Zero Data Retention (ZDR) agreement you should check with your account team before relying on stateful features, which amounts to acknowledging an unresolved interaction between ZDR and stateful features"
text_zh = "同顶层 zdr。本行的关键事实：官方明说 stateful 功能要先与客户团队确认 ZDR 是否适用，等于承认 ZDR 与有状态功能存在未解决的交互"

[[product.zdr.point]]
text = "store: false is not a ZDR switch."
text_zh = "store:false 不是 ZDR 开关。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "perplexity-agent-conversation-state-server-side-persistence"

[[product.retention.point]]
text = "The core conflict for retention on this tier: the Agent API persists response and conversation state server-side by default, and setting store: false only hides a response from retrieval — it does not disable persistence"
text_zh = "本档 retention 的核心冲突：Agent API 默认服务端持久化 response 与会话状态，store:false 只隐藏检索、不关闭持久化"

[[product.retention.point]]
text = "**The retention period, automatic expiry and deletion method are all undisclosed**. At the contract layer (DPA Annex 1) there is only one rule, covering Personal Data, \"until the earlier of (a) the date it is deleted by Customer through the Services' interface and (b) the date that is thirty days after Perplexity is no longer providing the Services to Customer\", and it does not address conversation state itself"
text_zh = "**保留期限、自动过期、删除方式均未披露**。合同层(DPA Annex 1)只给 Personal Data 一条「客户删除或服务结束后 30 天」的规则，且不涉及会话状态本身"

[[product.retention.point]]
text = "The \"no retention / zero day retention\" wording in the FAQ and the privacy-security page coexists with that persistence, so both are recorded side by side without picking a side."
text_zh = "FAQ/privacy-security 的「不保留 / 零日保留」与上述持久化并存，故并列保留、不选边。"

[product.processing_region]
codes = ["US"]
anchor = "perplexity-agent-faq-zero-day-retention-and-aws-na"

[[product.processing_region.point]]
text = "Same as top-level processing_region. The storage location of conversation state is not separately disclosed; there is only the platform-level sentence that compute is hosted via AWS in North America."
text_zh = "同顶层 processing_region。会话状态的存储地未单独披露，只有平台级「compute 在 AWS 北美」一句。"

