text_zh = "计费元数据是例外且未给期限：官方收集 token 数、所用模型、请求时间戳与时长、API key 标识，并写明「This billing metadata does not include any content from your prompts, responses, or other user data」——但未说明该元数据留存多久。"
anchor = "perplexity-agent-privacy-security-billing-metadata-only"

