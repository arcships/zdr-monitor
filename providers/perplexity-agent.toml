id = "api-sonar-chat-completions"
badge = "Sonar API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "perplexity-agent-privacy-security-no-training"

[[product.training.point]]
text = "The rewritten privacy page states \"Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models\", then qualifies it: \"Certain APIs may be subject to product-specific terms\". The no-training commitment is therefore contractual rather than an unqualified page-level default."
text_zh = "改版后的隐私页写「Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models」，并补充「Certain APIs may be subject to product-specific terms」。不训练承诺因此是合同层承诺，不再是无限定的页面级默认。"

[[product.training.point]]
text = "The underlying contractual commitment is API ToS §2.3.3: Perplexity shall not use (or authorize third parties to use) Customer Content to train, retrain, fine-tune or otherwise improve any generative AI models."
text_zh = "合同层依据是 API ToS §2.3.3：Perplexity 不得使用（或授权第三方使用）Customer Content 训练、再训练、微调或以其他方式改进任何生成式 AI 模型。"
anchor = "perplexity-agent-api-tos-2-3-3-no-training"

[[product.training.point]]
text = "The FAQ is consistent on training and now expressly rests it on the contract: \"Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models\"."
text_zh = "FAQ 在训练维度同向，且现在明确以合同为依据：「Under the API Terms of Service, Perplexity does not use Customer Content to train generative AI models」。"
