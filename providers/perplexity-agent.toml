]

[[product.zdr.point]]
text = "Not a silence but an unresolved reservation: the docs tell account holders with a Zero Data Retention (ZDR) agreement to \"check with your account team before relying on stateful features\" — the vendor does not confirm that ZDR covers stateful features. The account-level ZDR agreement itself is recorded on the api row; what is unconfirmed is whether it reaches this configuration, hence mark = no with mode = not_disclosed rather than \"we could not find anything\"."
text_zh = "官方有表述、但不是承诺：文档要求持 ZDR 协议的账户在依赖有状态功能前「check with your account team」，即未确认 ZDR 覆盖有状态功能。账户级 ZDR 协议本身记在 api 档，未确认的是它是否及于本配置——故记 mark = no + mode = not_disclosed，不是「我们没查到」。"
anchor = "perplexity-agent-conversation-state-zdr-agreement"

[[product.zdr.point]]
text = "The rewritten privacy-security page now says ZDR can be enabled for an Agent API account (\"Where ZDR is enabled for an Agent API account, only models whose providers support ZDR may be used\"), but it does not say the arrangement covers server-side conversation state. The conversation-state page still requires checking with the account team before relying on stateful features, so the stateful configuration remains unconfirmed."
text_zh = "改版后的 privacy-security 页已写明 Agent API 账户可开通 ZDR（「Where ZDR is enabled for an Agent API account, only models whose providers support ZDR may be used」），但没有说该安排覆盖服务端会话状态。conversation-state 页仍要求依赖有状态功能前向客户团队确认，故本配置仍未确认。"
anchor = "perplexity-agent-privacy-security-agent-zdr-model-limit"

[[product.zdr.point]]
text = "store: false is not a ZDR switch."
text_zh = "store:false 不是 ZDR 开关。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "perplexity-agent-conversation-state-server-side-persistence"

[[product.retention.point]]
text = "The core conflict for retention on this tier: the Agent API persists response and conversation state server-side by default, and setting store: false only hides a response from retrieval — it does not disable persistence"
text_zh = "本档 retention 的核心冲突：Agent API 默认服务端持久化 response 与会话状态，store:false 只隐藏检索、不关闭持久化"

[[product.retention.point]]
text = "**The retention period, automatic expiry and deletion method are all undisclosed**. At the contract layer (DPA Annex 1) there is only one rule, covering Personal Data, \"until the earlier of (a) the date it is deleted by Customer through the Services' interface and (b) the date that is thirty days after Perplexity is no longer providing the Services to Customer\", and it does not address conversation state itself"
text_zh = "**保留期限、自动过期、删除方式均未披露**。合同层(DPA Annex 1)只给 Personal Data 一条「客户删除或服务结束后 30 天」的规则，且不涉及会话状态本身"
anchor = "perplexity-agent-dpa-annex1-input-retention"

[[product.retention.point]]
text = "Contract layer, second limb: API ToS §10.5 requires each party on termination to destroy or return all Confidential Information — Customer Content is Customer's Confidential Information under §5.1, so this covers Input and Output — but \"copies in the Receiving Party’s automated back-up systems\" are excluded and deleted only \"in accordance with the Receiving Party’s standard deletion procedures\", with no period. Content can therefore outlive termination in backups even alongside the DPA §10 thirty-day deletion duty."
text_zh = "合同层另一支：API ToS §10.5 要求双方在终止时销毁或返还全部机密信息——Customer Content 依 §5.1 属客户机密信息，故覆盖输入输出正文——但「copies in the Receiving Party’s automated back-up systems」被排除，只按「标准删除流程」删除、无期限。故即便有 DPA §10 的 30 天删除义务，正文仍可能在备份中留存更久。"
anchor = "perplexity-agent-api-tos-10-5-backup-exception"

[[product.retention.point]]
text = "The FAQ no longer says \"We do not retain any query data sent through the API\" or \"By default, the API has zero day retention of user prompt data\"; it now says retention depends on the API, model, and account configuration and that ZDR is not the default. The former literal contradiction with server-side persistence is therefore gone, but the persistence statement remains the only direct description of conversation-state handling and still gives no period; the rewritten privacy-security page likewise states no retention period."
text_zh = "FAQ 已不再写「We do not retain any query data sent through the API」或「By default, the API has zero day retention of user prompt data」，而改为保留随 API、模型与账户配置而异、ZDR 非默认。原先与「服务端持久化」的字面冲突因此消失，但持久化一句仍是会话状态处理方式的唯一直接描述，且仍未给期限；改版后的 privacy-security 页同样没有给出保留期限。"

