[[product.training.point]]
text_zh = "按量 API 档没有「不用于训练」承诺。用户协议四.10 明文授权:匿名化处理到「数据接收方无法重新识别特定个人且不能复原」后,收集的信息可用于研究、统计分析与预测,含「使用匿名数据进行机器学习或模型算法训练」,且无需另行征得同意"

[[product.training.point]]
text_zh = "隐私政策二(七)4 同文复述。用户协议十.2 另允许「利用您使用大模型平台或平台内模型过程中产生的数据…定位、维护和优化我们的产品和服务」(您与智谱另有约定的除外)"

[[product.training.point]]
text_zh = "十.3 对非个人信息内容授予永久免费许可(含存储、使用、制作派生作品及再许可第三方)。反向线索:同站 Coding Plan 团队套餐档承诺「数据默认不用于模型训练」,恰说明按量 API 档无此承诺。这是条款许可,不等于每个 API 请求实际被用于训练"

[[product.training.point]]
text = "Direction check — this is a customer-side duty, not a vendor no-training promise: under 三.4 (\"您不应以以下方式不当使用大模型开放平台\"), the 11th bullet forbids the customer from using in-platform models, prompts and generated content to develop, train, label, fine-tune, optimize or iterate a new or other model outside the platform. It binds the customer, not the vendor, so it must not be read as the vendor's commitment not to train on customer data."
text_zh = "易读反方向的一条:用户协议三.4「您不应以以下方式不当使用大模型开放平台」项下第 11 条禁止客户把平台内模型、提示词和通过提示生成的内容用于平台外新模型或其他模型的开发、训练、标注、微调、优化、迭代。这是客户侧义务,方向与「厂商是否拿客户数据训练」相反,不构成厂商的「不用于训练」承诺。"
anchor = "zhipu-bigmodel-ua-customer-training-restriction"

[[product.training.point]]
text = "Qualifying condition: privacy policy 二(七)2 says information used for purposes not stated in the policy, or collected for one purpose but used for another, will only be so used with prior consent. The anonymized-training authorization in 二(七)4 is stated in the same policy, so this condition does not block it — the authorization rests on \"purposes already stated\" and the mark is unchanged."
text_zh = "限定条件:隐私政策二(七)2 承诺「本政策未载明的其他用途,或者将基于特定目的收集而来的信息用于其他目的,均会事先获得您的同意」。二(七)4 的匿名化训练授权已在本政策载明,故本条不构成对 training=no 的反证——训练授权以「已载明用途」为前提,不改变 mark。"
anchor = "zhipu-bigmodel-pp-other-purpose-consent"

