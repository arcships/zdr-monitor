[[source]]
url = "https://www.xfyun.cn/doc/policy/privacy.html"
channel = "consumer_privacy"
tier = "core"
note = "《讯飞开放平台隐私政策》，页面标注更新日期 2022 年 10 月 9 日、生效日期 2022 年 10 月 9 日（是本家五份数据类文档里最旧的一份）。同时覆盖两类主体：「访问、注册、登录及使用讯飞开放平台产品与/或服务的访问者和开发者」（§二.1）与「使用调用了讯飞开放平台人工智能API/SDK产品与/或服务的最终用户」（§二.2）。是本家 retention 与 processing_region 的主要条款来源，也是 training 匿名化训练句的来源之一。§二.1.a 系统日志含「产品服务使用记录、搜索查询内容、访问的页面地址、登录IP」；§二.2.b 调用日志「用于调用数量的统计分析」——证明服务端存在日志，但都未写期限。§三(3) 匿名化训练句此处写「语音信息」，与星火专项政策写「信息」不同。§四.1「委托处理」是讯飞作为委托方向外委托第三方（不是讯飞作为受托方）。§五.3/§六.2 给出目的绑定保留与《网络安全法》网络日志≥6 个月、《电子商务法》交易信息≥3 年的下限引用。§六.1 与 §九 给出境内存储与跨境例外。全文无保留天数、无零保留/ZDR、无面向 API 客户的「不用于训练」承诺。"

[[source]]
url = "https://www.xfyun.cn/doc/spark/MaaS/user_instructions.html"
channel = "contract"
tier = "core"
note = "讯飞星辰 MaaS 平台《用户使用须知》，自述是对《讯飞开放平台用户服务协议》及相关协议的「有效补充」，并写明「如您是企业或开发者用户，您还需遵守《讯飞开放平台大语言模型接口服务协议》」——即星辰 MaaS 托管模型、Coding Plan、Token Plan 的数据条款实际落在这里加上接口服务协议。§三「数据处理须知」是内容层优化授权条款，与接口协议 §4.3 同构但去掉了「本协议下」的限定、退出渠道改为通用反馈。§二.3 自认「我们并非深度合成服务提供者、生成式人工智能服务提供者，亦非深度合成技术支持者…仅对在讯飞星辰MaaS平台上托管的第三方模型、代码、技术等提供能力调用服务」。全文无保留期限、无 ZDR、无训练字样。"

