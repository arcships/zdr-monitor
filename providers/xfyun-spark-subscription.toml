anchor = "xfyun-maas-3-data-processing-optimization"

[[product.training.point]]
text_zh = "订阅档内容层依据是《用户使用须知》§三：「您知悉并授权，为了提升您使用本服务的用户体验，在经安全加密技术处理、去标识化或匿名化处理的前提下，我们可能会将本服务所收集的输入内容及对应输出内容，用于本服务的优化。如您拒绝提供前述授权，您可以向我们反馈您的意见或建议」——与接口协议 §4.3 同构，退出渠道改为通用反馈。多跳不确定性：文档自述整合 GLM/Kimi/MiniMax/DeepSeek/Qwen 等第三方模型，未披露是否转发至原厂及其角色。"

[[product.training.point]]
anchor = "xfyun-iface-4-3-optimization-license"
text_zh = "合同层同构条款：《大语言模型接口服务协议》§4.3 同样把「输入内容及对应输出内容」用于「本协议下产品及服务的优化」（主体写「我们及关联公司」，退出渠道为协议 §8.2）。订阅档面向开发者，《用户使用须知》第 52 行把企业/开发者用户拉入本协议，故本档合同层依据不止《用户使用须知》一条。两条都是授权而非禁止，方向一致，不改变 mark=no。"

[[product.training.point]]
anchor = "xfyun-privacy-3-3-anonymized-training"
text_zh = "平台层同向旁证（次要）：平台隐私政策 §三(3) 授权对匿名化/去标识化后的个人信息（此处写「语音信息」）作学术研究或统计分析，含「模型算法的训练」。对象是个人信息而不是本档 API 输入输出正文，不能替代 MaaS 须知 §三 作为本档直接依据，但方向与 mark=no 一致。"

