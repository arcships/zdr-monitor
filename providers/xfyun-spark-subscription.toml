[[product.retention.point]]
text_zh = "订阅档文档与 MaaS 须知都没有保留期限条款，只能沿用平台层《讯飞开放平台隐私政策》§五.3/§六.2 的目的绑定保留与法定下限。置信度 low：无法确认订阅档是否另有控制台内的保留规则。"

[[product.retention.point]]
anchor = "xfyun-privacy-5-3-retention-purpose-bound"
text_zh = "对象=输入输出正文（平台层表述为「您的个人信息」；语境=默认）：平台层只有目的绑定保留、没有量化期限——§五.3「我们只会在达成本政策所述目的所需的期限内保留您的个人信息，除非需要延长保留期或受到法律的允许」。"

[[product.retention.point]]
anchor = "xfyun-privacy-6-2-network-log-six-months"
text_zh = "法定下限（下限≠删除期限）：§六.2 引《网络安全法》「采取监测、记录网络运行状态、网络安全事件的技术措施，并按照规定留存相关的网络日志不少于六个月」，同节引《电子商务法》「商品和服务信息、交易信息保存时间自交易完成之日起不少于三年」。两者都是下限，不能反推出「到期删除全部输入输出」。"

[[product.retention.point]]
anchor = "xfyun-privacy-2-2-b-call-log"
text_zh = "对象=调用日志（语境=默认，期限=未披露）：§二.2.b 面向「使用调用了讯飞开放平台人工智能API/SDK的产品或服务」的最终用户，会收集「设备调用我们API/SDK的调用记录日志，以用于调用数量的统计分析」，未写期限。"

[[product.retention.point]]
anchor = "xfyun-privacy-2-1-a-system-log"
text_zh = "对象=系统日志（语境=默认，期限=未披露）：§二.1.a 的系统日志含「产品服务使用记录、搜索查询内容、访问的页面地址、登录IP」，同样未写期限——日志存在但无期限，也不能由此推出「日志有期限」。"

[[product.retention.point]]
anchor = "xfyun-privacy-6-2-delete-after-period"
text_zh = "最接近「上限」的表述：§六.2「在超过上述期限，或您主动要求删除您的个人信息或注销您的账号后，我们将根据适用法律法规的要求尽快删除您的个人信息」，其后另有五种「更改个人信息的存储时间」的例外（遵守适用的法律法规、法院判决裁定或其他法律程序、相关政府机关或法定授权组织的要求、有理由确信需要遵守法律法规、为执行相关服务协议或本政策及维护公共利益等）。「尽快」无量化期限，且对象是个人信息，不是输入输出正文的删除期限。"

[[product.retention.point]]
anchor = "xfyun-maas-4-privacy-policy-pointer"
text_zh = "跨层引用的依据：《用户使用须知》§四「隐私保护：我们将严格按照《讯飞开放平台隐私政策》及相关隐私协议…处理和保护您的个人信息及数据」——订阅档没有独立的保留期限条款，本档沿用平台层政策凭这一条成立。"

[product.processing_region]
codes = ["CN"]
anchor = "xfyun-privacy-6-1-storage-in-cn"

[[product.processing_region.point]]
text_zh = "订阅档文档未单独写处理地，沿用平台层境内存储承诺——注意是「原则上」而非无条件（三类例外与跨境路径见下两条）。"

[[product.processing_region.point]]
anchor = "xfyun-privacy-6-1-location-and-exceptions"
text_zh = "§六.1「收集的有关您的信息和资料将保存在中华人民共和国境内大陆地区科大讯飞的服务器上」，紧随三类例外：法律法规有明确规定、获得您的明确授权、您通过互联网进行跨境交易等个人主动行为。故 codes 记 CN 是「原则上」境内、不是绝对承诺；该句主语是「您的信息和资料」（个人信息层），订阅档文档未单独披露请求内容本体的推理地。"

[[product.processing_region.point]]
anchor = "xfyun-privacy-9-cross-border-solo-consent"
text_zh = "§九 给出跨境提供的条件与程序：确需向境外提供个人信息时，须告知境外接收方信息，并在「获得您的单独同意和法律法规规定的跨境提供应具备的条件后」才转移。它与 §六.1 的例外共同说明境内是原则、跨境有法定条件与单独同意路径；不读成「绝不跨境」，也不据此推翻 codes 的 CN。"

[[product.processing_region.point]]
anchor = "xfyun-maas-4-privacy-policy-pointer"
text_zh = "跨层引用的依据：《用户使用须知》§四「隐私保护：我们将严格按照《讯飞开放平台隐私政策》及相关隐私协议…处理和保护您的个人信息及数据」——订阅档没有独立的处理地条款，本档沿用平台层政策凭这一条成立。"

[[product.processing_region.point]]
text_zh = "Base URL 的 cn-huabei-1 域名与境内部署一致，但这是命名线索而非条款依据，故置信度 medium。"

[product.role]
kind = "controller"
anchor = "xfyun-privacy-2-processor-declaration"

[[product.role.point]]
anchor = "xfyun-privacy-1-9-processor-definition"
text_zh = "平台隐私政策 §一.9 把「个人信息处理者」定义为「自主决定处理目的、处理方式的组织、个人」（即 PIPL 口径下的独立控制者），与 §二 的处理者自认合起来构成本行结论的主依据。"

[[product.role.point]]
anchor = "xfyun-privacy-2-3-1-automated-decision"
text_zh = "控制者一侧的补充事实：§二.3(1) 讯飞基于自己收集的信息（如设备号、移动应用列表、系统日志）作自动化决策（构建画像）并推送个性化内容与营销，同段还写「我们可能会与讯飞开放平台的关联公司或委托处理的合作方共享设备信息」。对象是平台侧设备信息与系统日志（访问者与开发者场景），不是订阅档请求内容。"

[[product.role.point]]
anchor = "xfyun-privacy-5-2-anonymized-commercial-use"
text_zh = "§五.2 授权讯飞「对整个用户数据库进行技术分析」，只对分析整理后达到匿名化的用户数据「进行商业上的利用」——自为目的的处理事实，用途比 MaaS 须知 §三 的「本服务的优化」更宽；「商业上的利用」不等于模型训练，不作为 training 的直接依据。"

[[product.role.point]]
anchor = "xfyun-maas-2-2-independent-infra-provider"
text_zh = "《用户使用须知》§二.2（§二.1 同构）：「我们作为独立的算力基础设施服务提供者，只允许您将利用我们接入大模型所产生的全部数据交互内容用于您自身的产品或服务中，您不得向任何第三方转售与本服务相同或类似的服务」。「独立的」指独立于第三方模型原厂，本句是责任划分与使用限制（含禁止转售），供多跳判断使用；它不能替代 §二 的处理者声明作为主证据。"

[[product.role.point]]
anchor = "xfyun-maas-3-data-processing-optimization"
text_zh = "内容层仍受 §三 优化授权约束（控制者一侧）。适用范围：本行 kind 只针对客户内容层（订阅档请求的输入输出）；上游第三方模型原厂（GLM/Kimi/MiniMax/DeepSeek/Qwen）的角色与政策未披露，多跳链路末端未核。"

[[product.role.point]]
anchor = "xfyun-maas-2-3-infra-provider-disclaimer"
text_zh = "次要证据（语境受限）：《用户使用须知》§二.3「免责声明」自认「我们并非深度合成服务提供者、生成式人工智能服务提供者，亦非深度合成技术支持者」，只对「在讯飞星辰MaaS平台上托管的第三方模型、代码、技术等提供能力调用服务」。这是生成式人工智能/深度合成监管口径下的身份否认与责任划分，不是 PIPL 意义上的数据角色约定，推不出 controller，故降为次要证据。"

