[[product.role.point]]
text = "Same as the top-level role entry: for business customers AI21 acts as processor and the parties enter into AI21's DPA (text not published)"
text_zh = "同顶层 role：企业客户场景 AI21 为 processor 并需签 DPA（文本未公开）"

[[product.role.point]]
text = "For individual developers using the service for themselves, AI21 acts as controller."
text_zh = "个人开发者自用场景为 controller。"

