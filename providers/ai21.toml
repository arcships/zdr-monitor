[[product.zdr.point]]
text = "In a self-managed deployment request content never enters AI21's environment and the retention period is entirely under the customer's control"
text_zh = "自管部署下请求内容不进 AI21 环境,保留期完全由客户控制"

[[product.zdr.point]]
text = "An AI21-managed private deployment is still within the Services covered by the ToS, so the storage license in §7.2 and the \"may\" delete of §17.4 apply, giving the same contract-level conclusion as the rest of this vendor (no zero-retention commitment). This tier has no policy document of its own; the /deployment/ page carries only marketing wording about deployment shapes and data residency options and cannot serve as an anchor source."
text_zh = "AI21-managed 私有部署仍属 ToS 的 Services 范围,适用 §7.2 的存储许可与 §17.4 的『可』删除,故与本家合同层结论相同(无零保留承诺)。本档没有独立政策文档,官网 /deployment/ 只有部署形态与 data residency options 的营销表述,不能作锚点来源。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "ai21-pp-data-retention-purpose-bound"

[[product.retention.point]]
text = "In a self-managed deployment the retention period is entirely under the customer's own control"
text_zh = "自管部署的保留期完全由客户自己控制"

[[product.retention.point]]
text = "For an AI21-managed private deployment, the public materials contain no clause at all on retention periods, logging or operational-access retention rules — only the general privacy policy's \"as long as necessary to fulfill the purposes\"."
text_zh = "AI21 托管私有部署的保留期、日志与运维访问的保留规则在公开材料中没有任何条款，只有通用隐私政策的「按目的所需」。"

[product.processing_region]
codes = ["selected"]

[[product.processing_region.point]]
text = "The location of a self-managed deployment is decided by the customer"
text_zh = "自管部署位置由客户决定"

[[product.processing_region.point]]
text = "The list of available regions for an AI21-managed private deployment is not published; /deployment/ only gives the data residency options as Single tenant VPC / On-premise, with no regions. There is no policy clause to bind an anchor to here, so no anchor_id is set."
text_zh = "AI21 托管私有部署的可选区域清单未公开，/deployment/ 只写 data residency options 为 Single tenant VPC / On-premise，未给区域。此处无政策条款可绑锚点，故不带 anchor_id。"

[product.role]
kind = "processor"
anchor = "ai21-tos-12-2-processor-and-dpa"

[[product.role.point]]
text = "In an AI21-managed private deployment AI21 remains the processor of the customer's personal data under §12.2"
text_zh = "AI21 托管私有部署下 AI21 仍按 §12.2 作为客户个人数据的 processor"

[[product.role.point]]
text = "In a self-managed deployment AI21 essentially does not process personal data. The DPA is not published."
text_zh = "自管部署下 AI21 基本不处理个人数据。DPA 未公开。"

