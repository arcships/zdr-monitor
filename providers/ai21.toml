[[product.zdr.point]]
text = "Same as the top-level zdr entry: no public zero-retention offering, switch or application path, and at contract level §7.2 expressly licenses AI21 to host / store / reproduce / de-identify request content (Customer Data includes Input) and Output for purposes that include to \"develop, and improve the Services\", while the deletion clause §17.4 says only that AI21 \"may delete Customer Data following a reasonable retrieval period\". The evidence pointing the other way is still the blog post and the \"traceless mode\" page in the Trust Center metadata, which is not a commitment."
text_zh = "同顶层 zdr:无公开零保留方案、开关或申请入口,且合同层 §7.2 明确许可对请求内容(Customer Data 含 Input)与 Output 的 host / store / reproduce / de-identify、目的含 develop 与 improve the Services,§17.4 删除条款仅『可』删除。反向线索仍是博文与 Trust Center meta 的『traceless mode』,不构成承诺。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "ai21-pp-data-retention-purpose-bound"

[[product.retention.point]]
text = "Same as the top-level retention entry: retained as long as necessary for the stated purposes, with no quantified period at the request level"
text_zh = "同顶层 retention：按目的所需保留、无请求级量化期限"

[[product.retention.point]]
anchor = "ai21-tos-17-4-deletion-after-retrieval-period"
text = "After termination, the \"reasonable retrieval period\" in §17.4 is not quantified"
text_zh = "终止后 §17.4「reasonable retrieval period」未量化"

[[product.retention.point]]
anchor = "ai21-data-act-30-day-retrieval-period"
text = "Capped at thirty (30) days in the EU Data Act customer-switching scenario: the Retrieval Period under the Data Act Addendum, which applies only to customers headquartered in the EU that are subject to the Data Act and buy a Data Processing Service listed in Annex A. It is an upper bound on how long Exportable Data may be kept after the transition period, not a general retention period."
text_zh = "EU Data Act 客户切换场景上限 30 天：即 Data Act Addendum 的 Retrieval Period，仅适用于总部在欧盟、受 Data Act 约束且购买 Annex A 所列 Data Processing Service 的客户。它是过渡期后 Exportable Data 可保留时长的上限，不是通用保留期。"

[[product.retention.point]]
anchor = "ai21-tos-5-2-data-act-not-for-evaluation-products"
text = "That thirty-day cap applies to a narrower set than \"EU customers\": the Data Act Addendum does not apply to any Evaluation Products (§5.2), so free trials, betas, pilots and evaluation products have no quantified retention period at all. The ToS expressly cover free, trial, evaluation and self-serve Services as well, so those scenarios fall inside this tier."
text_zh = "该 30 天上限的适用面比「欧盟客户」更窄：Data Act Addendum 不适用于任何 Evaluation Products（§5.2），免费试用、beta、Pilot、评估产品连这唯一的量化期限也不适用。ToS 明文也约束 free / trial / evaluation / self-serve 服务，故这些场景落在本档范围内。"

[[product.retention.point]]
anchor = "ai21-data-act-deletion-within-notice-period"
text = "Second quantified period, same EU Data Act context: a Deletion Request is honoured no later than within the Notice Period (2 months). It is an upper bound on when the deletion must happen, not a promise that every copy is gone."
text_zh = "同一 EU Data Act 语境下的第二个量化期限：删除请求最迟在 Notice Period（2 个月）内完成。这是删除动作的上限，不是「所有副本都已清除」的承诺。"

[[product.retention.point]]
anchor = "ai21-data-act-retrieval-period-reserves-right-to-delete"
text = "After the Retrieval Period expires, AI21 only \"reserves the right to delete\" Exportable Data, subject to its standard deletion practices — a reserved right, not a deletion obligation."
text_zh = "Retrieval Period 到期后，AI21 仅「reserves the right to delete」Exportable Data，且受其标准删除实践约束——属权利保留，不是删除义务。"

[[product.retention.point]]
anchor = "ai21-pp-retention-extended-exceptions"
text = "Exception, privacy policy: Personal Data may be kept longer where required to comply with law, to maintain accurate records of dealings with you in the event of complaints or disputes, where litigation is reasonably anticipated, or in aggregated or de-identified form. These are the contexts in which data can outlive the purpose-bound period."
text_zh = "例外情形（隐私政策）：法律要求、为投诉或争议保留与你往来的准确记录、合理预期诉讼、或以聚合/去标识化形式时，个人数据可保留更久。这些就是可能超出「按目的所需」期限的语境。"

[product.processing_region]
codes = ["global"]
anchor = "ai21-tos-12-2-hosting-locations"

[[product.processing_region.point]]
text = "Same as the top-level processing_region entry: Israel, the United States, the EEA, the UK and other locations worldwide, with no public option to choose a region per request."
text_zh = "同顶层 processing_region：Israel/US/EEA/UK 及全球其他地点，无按请求选区域的公开选项。"

[product.role]
kind = "processor"
anchor = "ai21-tos-12-2-processor-and-dpa"

[[product.role.point]]
text = "Same as the top-level role entry: for business customers AI21 acts as processor and the parties enter into AI21's DPA (text not published)"
text_zh = "同顶层 role：企业客户场景 AI21 为 processor 并需签 DPA（文本未公开）"

[[product.role.point]]
text = "For individual developers using the service for themselves, AI21 acts as controller."
text_zh = "个人开发者自用场景为 controller。"

[[product.role.point]]
anchor = "ai21-tos-13-third-party-service-access"
text = "Enabling a Third-Party Service is a customer-initiated access path: §13 provides that where you enable Third-Party Services, you authorize AI21 to permit the relevant provider to access Customer Data as necessary for the interoperation. It is limited to what the interoperation requires, is not part of AI21's own subprocessor chain, and does not change the processor finding or the global processing-region conclusion."
text_zh = "启用第三方服务是一条由客户主动开启的访问路径：§13 规定启用 Third-Party Services 即授权 AI21 允许相关提供方在互操作必需范围内访问 Customer Data。它限于互操作所需，不属于 AI21 自有的 subprocessor 链，也不改变 processor 判定与 global 处理地结论。"

