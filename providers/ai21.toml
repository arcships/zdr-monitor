text = "Enabling a Third-Party Service is a customer-initiated access path: §13 provides that where you enable Third-Party Services, you authorize AI21 to permit the relevant provider to access Customer Data as necessary for the interoperation. It is limited to what the interoperation requires, is not part of AI21's own subprocessor chain, and does not change the processor finding or the global processing-region conclusion."
