[[product.retention.point]]
text = "Same as the top-level retention entry: retained as long as necessary for the stated purposes, with no quantified period at the request level"
text_zh = "同顶层 retention：按目的所需保留、无请求级量化期限"

[[product.retention.point]]
text = "After termination, the \"reasonable retrieval period\" in §17.4 is not quantified"
text_zh = "终止后 §17.4「reasonable retrieval period」未量化"

[[product.retention.point]]
text = "Capped at thirty (30) days in the EU Data Act customer-switching scenario."
text_zh = "EU Data Act 客户切换场景上限 30 天。"

