[[product.processing_region.point]]
text = "Same as the top-level processing_region entry: Israel, the United States, the EEA, the UK and other locations worldwide, with no public option to choose a region per request."
text_zh = "同顶层 processing_region：Israel/US/EEA/UK 及全球其他地点，无按请求选区域的公开选项。"

