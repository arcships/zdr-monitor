[[source]]
url = "https://www.ai21.com/terms-policies/data-act/"
channel = "contract"
tier = "core"
note = "《Data Act Addendum》(Last Updated: August 2, 2026)，依据 EU Data Act (Regulation (EU) 2023/2854) 第六章，仅适用于总部在欧盟且受 Data Act 约束、购买 Annex A 所列 Data Processing Service 的客户。它不是通用保留期来源，只在「客户请求切换/迁移」语境下给出量化期限（过渡期完成后最多 30 天的 Retrieval Period），对非欧盟客户无效。作为 retention 维度的档位限定补充。"

[[source]]
url = "https://www.ai21.com/terms-policies/privacy-policy/"
channel = "consumer_privacy"
tier = "core"
note = "《Privacy Policy》(Last Updated: August 2, 2026)，AI21 官方隐私政策，适用范围含 API（“application programming interfaces (APIs) … collectively the Services”）。它是 retention / role / processing_region 的补充与细化来源：明文区分 controller 与 processor 两种身份、Data Retention 目的绑定、International Data Transfers 地点清单、Aggregated and De-Identified Information。同时明文声明“This Privacy Policy does not govern Customer Data for which AI21 acts as a Data Processor”，即企业客户的请求内容主要由与客户签的协议/DPA 管辖，而非本政策。"

[[source]]
url = "https://www.ai21.com/terms-policies/terms-of-use/"
channel = "contract"
tier = "core"
note = "《AI21 LABS – TERMS OF SERVICE》(Last Updated: August 2, 2026)，覆盖 AI21 全部 Services 定义内的产品，含 API/AI Systems（§1 定义“AI Systems”即含 APIs、models 与相关产品服务）。这是本家的合同层主依据：§7.2 训练维度的不训练承诺与授权边界、§7.6 非存储服务、§12.2 处理地与 processor/DPA、§17.4 终止后删除。文档开头写明若另有 Separate Agreement（MSA/订单/SOW/企业协议），Separate Agreement 优先且这些 Terms 对其不适用的部分不适用——即企业档结论可由另行签署的文件改写。注意：/terms-policies/ 会 301 跳到本页。"

