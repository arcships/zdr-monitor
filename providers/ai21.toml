anchor = "ai21-pp-data-retention-purpose-bound"

[[product.retention.point]]
text = "In a self-managed deployment the retention period is entirely under the customer's own control; that follows from the deployment shape (the vendor's /deployment/ page, which has no snapshot in this repo) and not from any published clause."
text_zh = "自管部署的保留期完全由客户自己控制；这来自部署形态（官网 /deployment/ 页，本仓库无快照），不是任何已公布条款的规定。"

[[product.retention.point]]
text = "The only retention clause AI21 publishes is the privacy policy's \"as long as necessary\" rule, which governs AI21's own processing of account and usage data (the policy itself states it does not govern Customer Data for which AI21 acts as a processor); for the customer's data in a self-managed deployment no period is published."
text_zh = "AI21 公布的唯一保留条款是隐私政策的「按目的所需」，它管辖 AI21 自己对账户与用量数据的处理（政策自述不管辖 AI21 作为 processor 处理的 Customer Data）；自管部署中客户自有数据的保留期没有公布。"

