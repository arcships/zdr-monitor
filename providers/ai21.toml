[[product.processing_region.point]]
text = "The list of available regions for an AI21-managed private deployment is not published; §12.2 lists Israel, the United States, the EEA, the UK and other locations worldwide, with no customer-selectable region. The /deployment/ page's data residency options (Single tenant VPC / On-premise) are marketing wording with no snapshot in this repo, so they are not used as evidence and the codes stay at the conservative global default."
text_zh = "AI21 托管私有部署的可选区域清单未公开；§12.2 只列 Israel / United States / EEA / UK 及全球其他地点，没有可供客户选择的区域。官网 /deployment/ 的 data residency options（Single tenant VPC / On-premise）是营销表述、本仓库无快照，故不作为依据，区域码保守记为 global。"

