[[product.zdr.point]]
text = "In a self-managed deployment request content never enters AI21's environment, so zero retention is a property of the deployment shape rather than a commitment. The only vendor statement to that effect is on the /deployment/ page, which has no snapshot in this repo, so it cannot be anchored; under the conservative assumption this tier is recorded as no zero-retention option disclosed."
text_zh = "自管部署下请求内容不进 AI21 环境，零保留来自部署形态而非厂商承诺。唯一相关表述在官网 /deployment/ 页，本仓库没有它的快照，无法作锚点；按保守假设本档记为「未公开零保留方案」。"

[[product.zdr.point]]
text = "The published contract contains no zero-retention commitment for this tier either: §7.2 licenses AI21 to host, store and process Customer Data and §17.4 says only that AI21 may delete it, and no switch, option or application path is documented on any page checked (searched[])."
text_zh = "公开合同对本档同样没有零保留承诺：§7.2 许可 AI21 host / store / process Customer Data，§17.4 仅说 AI21 可删除；查阅过的页面（searched[]）中均无开关、选项或申请入口。"

