[[product.zdr.point]]
text = "Same as the top-level zdr entry: no public zero-retention offering, switch or application path, and at contract level §7.2 expressly licenses AI21 to host / store / reproduce / de-identify request content (Customer Data includes Input) and Output for purposes that include to \"develop, and improve the Services\", while the deletion clause §17.4 says only that AI21 \"may delete Customer Data following a reasonable retrieval period\". The evidence pointing the other way is still the blog post and the \"traceless mode\" page in the Trust Center metadata, which is not a commitment."
text_zh = "同顶层 zdr:无公开零保留方案、开关或申请入口,且合同层 §7.2 明确许可对请求内容(Customer Data 含 Input)与 Output 的 host / store / reproduce / de-identify、目的含 develop 与 improve the Services,§17.4 删除条款仅『可』删除。反向线索仍是博文与 Trust Center meta 的『traceless mode』,不构成承诺。"

