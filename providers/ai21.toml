text = "In a self-managed deployment the data never enters AI21's environment, so the no-training commitment in §7.2 holds by itself and holds more strongly"
text_zh = "自管部署时数据不进 AI21 环境，§7.2 的不训练承诺自然成立且更强"

[[product.training.point]]
text = "An AI21-managed private deployment is still within the Services covered by the ToS, so §7.2 applies. The website separately has a Post-Training product line that expressly trains custom models on customer data (the model belongs to the customer), which is a training scenario agreed separately and recorded apart from this tier's default conclusion."
text_zh = "AI21 托管私有部署仍属 ToS 的 Services 范围，适用 §7.2。官网另有 Post-Training 产品线明确用客户数据训练定制模型（模型归客户），属另行约定的训练场景，与本档默认结论分开记。"

