[[product.zdr.point]]
text = "An AI21-managed private deployment is still within the Services covered by the ToS, so the storage license in §7.2 and the \"may\" delete of §17.4 apply, giving the same contract-level conclusion as the rest of this vendor (no zero-retention commitment). This tier has no policy document of its own; the /deployment/ page carries only marketing wording about deployment shapes and data residency options and has no snapshot in this repo, so it cannot serve as an anchor source."
text_zh = "AI21 托管私有部署仍属 ToS 的 Services 范围，适用 §7.2 的存储许可与 §17.4 的『可』删除，故与本家合同层结论相同（无零保留承诺）。本档没有独立政策文档；官网 /deployment/ 只有部署形态与 data residency options 的营销表述，且本仓库没有它的快照，不能作锚点来源。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "ai21-pp-data-retention-purpose-bound"

[[product.retention.point]]
text = "For an AI21-managed private deployment, the public materials contain no clause at all on retention periods, logging or operational-access retention rules — only the general privacy policy's \"as long as necessary to fulfill the purposes\"."
text_zh = "AI21 托管私有部署的保留期、日志与运维访问的保留规则在公开材料中没有任何条款，只有通用隐私政策的「按目的所需」。"

[[product.retention.point]]
anchor = "ai21-tos-17-4-deletion-after-retrieval-period"
text = "Termination is governed by §17.4, which says only that AI21 \"may delete Customer Data following a reasonable retrieval period\" — a permission rather than a deletion commitment, and the period is not quantified anywhere."
text_zh = "终止场景由 §17.4 管辖，仅写 AI21「may delete Customer Data following a reasonable retrieval period」——是许可而非删除承诺，且该期限全文未量化。"

[[product.retention.point]]
anchor = "ai21-pp-retention-extended-exceptions"
text = "Exception, privacy policy: Personal Data may be kept longer where required to comply with law, to maintain accurate records of dealings with you in the event of complaints or disputes, where litigation is reasonably anticipated, or in aggregated or de-identified form. These are the contexts in which data can outlive the purpose-bound period."
text_zh = "例外情形（隐私政策）：法律要求、为投诉或争议保留与你往来的准确记录、合理预期诉讼、或以聚合/去标识化形式时，个人数据可保留更久。这些就是可能超出「按目的所需」期限的语境。"

