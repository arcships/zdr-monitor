text_zh = "境外档结论：**不用于训练**，且措辞比境内档强。原句：境外版《Xiaomi MiMo 平台隐私条款》§3.1「小米不会将您提供的内容用于模型训练或任何其他目的。」——无条件式（没有「未经事先同意」），对象是「您提供的内容」（不限于文本）。佐证：同条款 §12「作为原则，我们不会将您提供的个人信息用于完全自动化的决策过程（包括画像）」。本档训练结论只由隐私条款支撑，未引用合同层。不确定性：该句出自隐私条款而非合同，厂商保留修改隐私条款的权利（§13），且未说明是否有退出/例外机制。"

