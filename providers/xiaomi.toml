[[product.zdr.point]]
text_zh = "同顶层 zdr（本家两档共用同一套检索范围）。本档绑定的原文是海外档隐私条款的备份例外：「我们可能无法立即从备份系统中移除该信息」——删除请求生效后信息仍可能留在备份中，与「做不到零保留」同向；全篇未见任何 ZDR 开关、开通方式或申请途径。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "mimo-intl-pp-retention-general"

[[product.retention.point]]
text = "International tier: unquantified, trigger-based deletion. Privacy terms §6 — retention as a general rule for as long as needed for the purposes described in the privacy terms or as required by applicable law; retention stops and the data is deleted or anonymized once the collection purpose is fulfilled, after a confirmed deletion request, or after termination of the corresponding service."
text_zh = "境外档结论：**未量化**，触发式删除。海外档隐私条款 §6：「作为一般规则，我们在本隐私条款所述之目的所需的期限内保留您的个人信息，或按照适用法律的要求保留。」同段后文：「一旦收集个人信息的目的得以实现，或在我们确认您的删除请求后，或在我们终止运营相应服务后，我们将停止保留并删除个人信息或对其进行匿名化处理。」无天数。"

[[product.retention.point]]
anchor = "mimo-intl-pp-retention-delete"
text_zh = "删除是触发式的：「一旦相应的保留期限届满，此类个人信息将被删除或进行匿名化处理。」——即保留期限一到即删除/匿名化，而非「保存固定年限后删除」。"

[[product.retention.point]]
anchor = "mimo-intl-pp-backup-delay"
text_zh = "例外：§8「由于适用法律（例如，当有必要保留您的个人信息以应对可能因处理该个人信息而产生的或与之相关的潜在索赔时）和/或安全技术限制，我们可能无法立即从备份系统中移除该信息」。对象与语境：以上覆盖「个人信息」，即含 API 提交内容（§3.1 明确收集「您提交的内容（文本、音频、视频、图片）」）"

[[product.retention.point]]
text_zh = "**KV/Prompt 缓存**的保留时长在两份文档里都没有披露（只有定价页显示 Cache Hit/Cache Write 单独计费）"

[[product.retention.point]]
text_zh = "**访问日志/IP** 未给期限。期限类型：无下限、无上限、无典型区间。"

[product.processing_region]
codes = ["NL", "SG"]
anchor = "mimo-intl-pp-data-centers"

[[product.processing_region.point]]
text = "International tier: the disclosed data-center locations are the Netherlands and Singapore. §10 opens with the fact that Xiaomi processes and backs up personal information through globally operated and controlled infrastructure, so the codes read as disclosed data-center locations, not as data being processed only in those two countries."
text_zh = "境外档结论：**已披露的数据中心所在地为荷兰与新加坡**。海外档隐私条款 §10：「小米通过全球运营和控制基础设施处理并备份个人信息。目前，小米在荷兰和新加坡设有数据中心。」——首句是对「处理地」最直接的表述，说明处理本身是全球化的，故 codes 读作「已披露的数据中心所在地（荷兰、新加坡）」，不要读成「数据只在两国处理」。"

[[product.processing_region.point]]
text_zh = "不确定性（重要）：§10 紧接着写「我们还可能将您的个人信息传输给第三方服务提供商和业务合作伙伴，因此您的数据也可能被传输到其他国家或地区」，即「欧洲+新加坡」是**数据中心位置**的披露，不是「数据只留在这些国家」的承诺；备份范围亦未限定。同节 §10 后文把 EEA/UK/CH 归荷兰 B.V.（担任数据控制者）、其他地区归新加坡公司。"

[[product.processing_region.point]]
text_zh = "另：境内版服务协议 §1.1 允许用户联系平台自行选择数据存储区域或选择在某些区域禁止提供服务（可能产生额外费用），但未披露可选区域清单——该条出自境内版合同，本档（国际站）不适用。"

[product.role]
kind = "processor"
anchor = "mimo-intl-pp-entrusted"

[[product.role.point]]
text = "International tier: Processor. Privacy terms §3.1 — you authorize Xiaomi MiMo to process the information you upload as an entrusted processor in order to provide the service, without needing any further authorization from any other party. The single kind value records the data-processing relationship inside the agreement."
text_zh = "境外档结论：**处理者（Processor）**。主证据为海外档隐私条款 §3.1「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务，且 Xiaomi MiMo 无需从任何其他方获得任何额外的授权。」kind 记录的是**协议内部的数据处理关系**，范围是「您上传的信息」。"

[[product.role.point]]
anchor = "mimo-intl-pp-eea-controller"
text_zh = "(b) 例外：§10 写明 EEA/UK/CH 场景下 Xiaomi Technology Netherlands B.V. **担任数据控制者**，Xiaomi Technologies Singapore Pte. Ltd. 负责处理部分个人信息——即小米在部分法域对部分个人信息是控制者。因此单值 kind=processor 不能被读成整体定性：对终端用户而言，小米对外仍是控制者一侧。"

[[product.role.point]]
anchor = "mimo-intl-pp-share-search-google"
text_zh = "(c) 隐私条款 §4 披露向 Waffo Hong Kong Limited（充值与退款）、谷歌（在线搜索，会收到「查询内容和 IP 地址」）提供信息——启用联网搜索时输入内容会流出到第三方，属多跳，本轮只记事实、不推断该跳的保留与训练政策。不确定性：本档角色结论只由隐私条款的「受托处理」表述支撑，未引用合同层；§3.1 的受托处理范围是「您上传的信息」，与 §10 的 EEA/UK/CH 控制者安排并存（见 (b)）。"

