[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "mimo-cn-pp-retention-policy"

[[product.retention.point]]
text_zh = "见顶层 retention 的境内档部分：目的必需期间（未量化）+ 删除/注销/服务终止三种触发 + 备份延迟删除"

[[product.retention.point]]
anchor = "mimo-cn-pp-retention-public-interest"
text = "Retention exception (does not change basis = undisclosed): for public-interest, scientific, historical-research or statistical purposes Xiaomi may continue to retain the data under applicable law even where the further processing is unrelated to the original collection purpose. It sits alongside the necessary-purpose period, so the three triggers (purpose fulfilled / deletion or account-closure request / termination of operations) are not the whole of the retention scope; the period type remains no floor, no ceiling, no typical range."
text_zh = "保留例外：§三（三）末句「如果是出于公众利益、科学、历史研究或统计的目的，我们将基于适用的法律继续保留相关数据，即使进一步的数据处理与原有的收集目的无关。」——它与「目的所必需的期间」并列，说明「完成目的/删除或注销申请/终止运营」三种触发不是保留范围的全部。不改变 basis=undisclosed；期限类型仍是无下限、无上限、无典型区间。"

[[product.retention.point]]
text_zh = "无请求级保留期，无「不少于六个月」类下限。"

[product.processing_region]
codes = ["CN"]
anchor = "mimo-cn-ua-4-4-storage-cn"

[[product.processing_region.point]]
text = "Domestic tier: data stored in the Chinese Mainland, and the contract layer explicitly excludes transfer out of the Mainland."
text_zh = "见顶层 processing_region 的境内档部分：境内使用 → 信息保存至中华人民共和国境内，措辞无「原则上」软化。合同层（境内版服务协议 §4.4）同向且更明确：「在向中国大陆提供服务时，小米会将相关数据存储在中国大陆的服务器上，不会将此类信息传输至境外。」——明确排除出境场景。"

[[product.processing_region.point]]
anchor = "mimo-cn-pp-stored-in-prc"
text_zh = "隐私层同向（境内档隐私政策 §三（三）末段）：「本协议适用于您在中华人民共和国境内使用Xiaomi MiMo服务，为此您的信息将会保存至中华人民共和国境内。」"

[[product.processing_region.point]]
anchor = "mimo-cn-ua-scope-prc"
text_zh = "适用范围（合同层 §1.1）：「本协议适用于您在中华人民共和国境内使用Xiaomi MiMo服务」；在中华人民共和国境外使用本服务，适用另行发布的境外条款——即本档的境内存储结论只覆盖境内使用场景。"

[product.role]
kind = "processor"
anchor = "mimo-cn-ua-processor-controller"

[[product.role.point]]
text = "Contract layer (domestic Service Agreement §4.1): Xiaomi is the entrusted personal-information processor and you are the personal-information processor/controller; the data you upload, store, process, download or distribute through the service is your business data over which you retain full control."
text_zh = "见顶层 role。合同层（境内版服务协议 §4.1）：「小米在数据处理活动中是个人信息处理受托人，您是个人信息处理者。您通过我们提供的服务，上传、存储、加工、下载、分发以及通过其他方式处理的数据，均为您的业务数据，您对此拥有完全的控制权。」"

[[product.role.point]]
anchor = "mimo-cn-ua-dp-terms-region"
text_zh = "适用范围（合同层 §4 开篇）：「本部分数据保护条款所覆盖的地域为中国大陆」——上述受托处理定性只覆盖中国大陆。"

[[product.role.point]]
anchor = "mimo-cn-pp-voice-clone-entrusted"
text_zh = "隐私层辅助证据（适用范围仅「音色模仿等上传场景」）：§一（一）2 音色模仿段「您授权 Xiaomi MiMo 基于您上传的信息进行受托处理以提供服务，Xiaomi MiMo 无需再另行获得其他授权。」"

[[product.role.point]]
text_zh = "账号/实名/发票/交易记录部分小米自主决定目的，属处理者一侧"

[[product.role.point]]
anchor = "mimo-cn-share-list-search-keywords"
text = "Multi-hop fact, only when the user enables the platform's web search: keywords derived from user input leave via API to 上海小宿科技有限公司, for the purpose of providing the web-search function. The disclosed shared data type is keywords generated from user input, not the full input content."
text_zh = "多跳事实（仅当用户启用联网搜索功能时）：《第三方数据共享说明》列上海小宿科技有限公司，共享方式 API、共享目的「用于提供联网搜索功能」、共享数据类型「基于用户输入内容生成的关键词」——流出的是由输入派生的关键词，不扩大成输入正文全量外流。该清单只有捷付睿通（实名认证）与上海小宿两条，未披露任何大模型推理上游/模型原厂。"

[[product.role.point]]
anchor = "mimo-cn-ua-third-party-read"
text = "Scope and risk note (domestic Service Agreement §3.9): when the user calls third-party systems, software or services (including open-source Skills, MCP interfaces and Repos the user installs), the third party may read user data. The subject is the third party invoked by the user; this is a disclaimer and risk warning, not a disclosure of a Xiaomi data flow, and it does not replace the third-party sharing list."
text_zh = "范围与风险提示（境内版服务协议 §3.9）：「您须理解并同意，在使用第三方服务时，第三方可能会对用户数据进行读取，特别提醒您，您需谨慎选择第三方系统、软件或服务，充分评估后进行使用」——主体是您自行调用的第三方系统、软件、MCP、Skills，属免责与风险提示条款、不是小米自身的数据流披露；不据此推断小米会把内容交给第三方，也不替代《第三方数据共享说明》（境内档的实证是上海小宿）。"

