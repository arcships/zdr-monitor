[product.training]
mark = "yes"
mode = "default"
anchor = "mimo-cn-pp-no-training-without-consent"

[[product.training.point]]
text = "Domestic tier: not used for training by default, but the wording is conditional (without your prior consent) and covers only the text content you provide; images, video and audio are unaddressed. The domestic contract layer is obtainable but never mentions training, so it offers no stronger basis."
text_zh = "见顶层 training 的境内档部分：默认不用于训练，措辞条件式（未经事先同意），只覆盖「文本内容」，图片/视频/音频未表态。境内版合同层（服务协议）可得，但全篇无训练条款，不构成更强依据。"

[[product.training.point]]
anchor = "mimo-cn-pp-non-personal-improve-service"
text = "Context only, does not change this tier's verdict: §1(4) says of non-personal / statistical data (device information, daily-active events, page-view events, page-view-duration events, session events, network-monitoring data, app-crash events) that the purpose of collecting it is to improve the services Xiaomi provides. The object is not API-submitted content and is listed separately from §1(1)2's promise for the text you provide, so it is not an authorization to train on inputs."
text_zh = "语境补充（不改变本档判定）：§一（四）对**非个人信息/统计类数据**（设备相关信息、日活事件、页面访问事件、页面访问时长事件、会话事件、网络监控数据、应用崩溃事件）写「收集此类信息的目的在于改善我们向您提供的服务」。对象不是 API 提交内容，与 §一（一）2 对「您提供的文本内容」的承诺分列，不构成对输入内容的训练授权。"

[[product.training.point]]
anchor = "mimo-cn-pp-consent-exemptions"
text = "Context only, does not change this tier's verdict: §1(3) lists 10 statutory situations in which collecting or using personal information needs no consent (for example where necessary to maintain the safe and stable operation of the products and/or services, such as detecting and handling malfunctions). They are the context for the conditional wording without your prior consent, and none of the 10 concerns model training."
text_zh = "语境补充（不改变本档判定）：§一（三）列出 10 项「收集、使用个人信息无需征得您的同意」的法定情形（例如「用于维护所提供的产品与/或服务的安全稳定运行所必需的，例如发现、处置产品与/或服务的故障；」），是「未经您的事先同意」这句条件式措辞的语境条件；10 项均与模型训练无关，不构成反向证据。"

