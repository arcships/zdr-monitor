entity = "Groq LLC / Groq UK Limited / Groq Limited / Groq Public Sector, LLC"
endpoint = ""
doc = "https://console.groq.com/docs/legal/services-agreement"

[[source]]
url = "https://console.groq.com/docs/legal/customer-data-processing-addendum"
channel = "contract"
tier = "core"
note = "《Groq Customer Data Processing Addendum》（Services Agreement 的 URL Terms，§17.11 规定其效力高于协议本体）。覆盖全部 Cloud Services 的 Personal Data 处理：§2.1 角色（Groq 为 Processor / sub-Processor）、§7 子处理者、§8 国际传输、§10 终止后销毁、ANNEX I 传输描述、ANNEX II 安全措施。是 role 与 processing_region 的合同层权威，也是终止后保留期的权威。"

[[source]]
url = "https://console.groq.com/docs/legal/services-agreement"
channel = "contract"
tier = "core"
note = "《Groq Services Agreement》(页面标注 Last Modified: June 22, 2026)。§1 开头写明它 governs「GroqChat, Groq Playground, GroqCloud, and any other service provided by Groq for developers, businesses, or enterprise organizations」，同句又写「Cloud Services and the AI Model Services under this Agreement are not for consumer use」。覆盖 GroqCloud 按量 API 档（inference/batch/fine-tuning/LoRA）与企业档（Order Form/离线协议/地区条款）；§17.11 定冲突时的效力顺序 DPA > BAA > AUP > 本协议 > Order Form > AI Model Terms；§17.15 含沙特地区条款，把 §4.2 整段改写。这是 training / zdr / retention / role 四个维度的合同层权威。"

[[source]]
url = "https://console.groq.com/docs/your-data"
channel = "developer_data"
tier = "core"
note = "《Your Data in GroqCloud》官方文档（Account and Console 目录下）。覆盖 GroqCloud 全部产品面：默认不保留推理请求、需要保留才能工作的功能（Batch / Fine-tuning）、可靠性与滥用监控日志、ZDR 开关、数据所在地（GCP 美国 bucket）。是 retention / zdr / processing_region 的产品行为层权威（合同之外最具体的官方表述）。页面 .md 直连通道（/docs/your-data.md）内容与 jina 抓回正文一致，仅标题层级被 jina 丢掉。"

[[source]]
url = "https://groq.com/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "《Privacy Policy》(effective November 12, 2025)，groq.com 消费/网站侧隐私政策。适用于网站、社区、账号、计费、客服、营销等场景（Groq 在这些场景自认 data controller），并明确排除 Cloud Services 的 Customer Data（GroqCloud / GroqChat / API），后者按 data processor 处理并适用 Services Agreement + DPA。因此它对 API 档不是权威，只作为 role 维度的对照证据。全文的 Data Retention 节只写「period necessary to fulfill the purposes」，无量化期限。"

[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "groq-sa-4-2-no-training"

[[product.training.point]]
text_zh = "见顶层 training。GroqCloud 按量 API（含 inference / batch / fine-tuning / LoRA）适用 Services Agreement §4.2：默认不得用 Inputs/Outputs 训练或微调，除非客户明确授权或指示"

[[product.training.point]]
text_zh = "§8.2 进一步限定客户提供的训练数据仅用于向该客户提供服务。例外与地区变体（§17.15 沙特改写版不再提训练）见顶层 note。"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "groq-yourdata-zdr-all-customers"

[[product.zdr.point]]
text_zh = "见顶层 zdr。开关在 console.groq.com/settings/data-controls，组织管理员可全局或按功能开启"

[[product.zdr.point]]
text_zh = "开启后 Batch / Fine-tuning 等依赖保留的功能被禁用"

[[product.zdr.point]]
text_zh = "合同 §4.2 用「Eligible Customers」表述，与文档「All customers」冲突，两条并列。"

[product.retention]
days = 30
object = "mixed"
basis = "fixed_period"
anchor = "groq-yourdata-default-no-retention-for-inference"

[[product.retention.point]]
text_zh = "见顶层 retention。本档对象：推理输入输出正文（默认不保留）／可靠性滥用日志（≤30 天，可 opt-out）／Batch 文件（30 天）／微调数据（至客户删除）／Prompt Cache（易失内存，2 小时未使用过期）／反馈中的对话片段（≤3 年）／终止后删除（30 天，DPA 路径最长 180 天）。"

[product.processing_region]
codes = ["US", "global"]
anchor = "groq-yourdata-data-location-us-gcp"

[[product.processing_region.point]]
text_zh = "见顶层 processing_region。"

[product.role]
kind = "processor"
anchor = "groq-dpa-2-1-customer-controller-groq-processor"

[[product.role.point]]
text_zh = "见顶层 role。API 档的签约主体按客户所在地为 Groq LLC / Groq UK Limited / Groq Limited / Groq Public Sector, LLC。"

