[[source]]
url = "https://code.claude.com/docs/en/data-usage"
channel = "developer_data"
tier = "core"
note = "Claude Code 数据处理页:分消费档(Free/Pro/Max)与商业档(Team/Enterprise/API/第三方平台/Claude Gov)给训练与保留口径;消费档双轨 5 年/30 天、商业档标准 30 天、/feedback 5 年、会话质量调查 transcript 最多 6 个月、本地会话明文缓存 30 天(Desktop/Cowork 会话默认豁免,该条列在商业档条目下)。会话质量调查的上传仅限用户显式选 Yes,且启用 ZDR、组织禁用产品反馈或设置 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC 的组织看不到该调查。消费档条款不继承给 API 档。"

[[source]]
url = "https://code.claude.com/docs/en/zero-data-retention"
channel = "developer_data"
tier = "core"
note = "Claude Code 的 ZDR:仅合格 Claude for Enterprise 账号,个人账号(Free/Pro/Max)登录的会话明确不在覆盖范围;不覆盖 claude.ai Chat/Cowork,也不覆盖 Bedrock/Google Cloud/Foundry 部署。启用 ZDR 会禁用需要服务端存储的功能(云会话含 Desktop 启动的会话、Claude Tag、Artifacts、/feedback 与 /bug、/share、Remote Control);Covered Models(Fable 5.1/Fable 5)默认要求保留,违规会话输入输出最多仍保留 2 年。"

[[source]]
url = "https://www.anthropic.com/legal/consumer-terms"
channel = "contract"
tier = "core"
note = "消费档(Free/Pro/Max,含这些账号下的 Claude Code)服务条款:默认许可把 Materials 用于训练,可在账号设置退出;退出后 Feedback 与安全审查标记内容仍用于训练。"

[[source]]
url = "https://www.anthropic.com/legal/privacy"
channel = "consumer_privacy"
tier = "core"
note = "Anthropic 隐私政策(消费档个人数据):§9 按居住地指定控制者实体(EEA/UK/瑞士=Anthropic Ireland, Limited;其他=Anthropic PBC);§5 个人数据传输至美国服务器或 EEA/UK 以外国家。Claude Code 消费档经 data-usage 页被指向本政策。文首自述本政策不适用于代表商业客户(如 Enterprise 账号)处理的内容、那部分由客户协议管辖,故 §5/§9 只支撑消费档。"

[[source]]
url = "https://www.anthropic.com/legal/commercial-terms"
channel = "contract"
tier = "core"
note = "商业档(API/Team/Enterprise)Commercial Terms of Service:§B 禁止用 Customer Content 训练、§C 把 DPA 并入条款、并明确『Services under these Terms are not for consumer use』,因此不能外推到 Free/Pro/Max。data-usage 页把 Team/Enterprise/API 的完整条款指向本文件。"

[[source]]
url = "https://www.anthropic.com/legal/data-processing-addendum"
channel = "contract"
tier = "core"
note = "商业档 DPA(经 Commercial Terms §C 并入):§B.1 客户为 controller、Anthropic 为 processor;§I.1 跨境用 SCC Module Two/Three。仅商业档,消费档不适用。"

[[source]]
url = "https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data"
channel = "enterprise_privacy_faq"
tier = "core"
note = "商业档(Claude for Work / Anthropic API)标准保留政策:API 输入输出后端 30 天内自动删除;违规内容最多 2 年、信任安全分类分数最多 7 年;Feedback 5 年。同一篇对可续聊的商业产品(Claude for Work / Claude for Enterprise / Anthropic Console)另说聊天与编码会话『in the product』保留、未给期限,与 data-usage 页『Standard: 30-day retention period』口径有差异。文首把 Free/Pro/Max(含这些账号下的 Claude Code)指向消费档文章。"

[[source]]
url = "https://platform.claude.com/docs/en/manage-claude/api-and-data-retention"
channel = "developer_data"
tier = "contradiction"
note = "本文件只把它当矛盾的另一半证据与补充引用:①『Local session transcripts (from sessions on users' machines, in apps such as Cowork and Claude Code) are stored for 6 years by default』与 data-usage 页『本地明文缓存 30 天(cleanupPeriodDays 可调)』口径不一致(疑为厂商侧保留 vs 客户端本地副本,厂商未澄清),两条并列保留、不选边;②『Conversation content … is not retained by default』与 7996866 的 30 天自动删除冲突(同 providers/anthropic.toml 的同源条目)。本页另有正面排除 Free/Pro/Max、Teams/Enterprise 界面不 ZDR-eligible 等与核心文档同向的表述,可作佐证。"

[[product]]
id = "claude-code"
badge = "Claude Code 订阅"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "training-consumer-optout"

[[product.training.point]]
text = "Consumer tiers use an opt-in setting: \"We will train new models using data from Free, Pro, and Max accounts when this setting is on\" (including Claude Code used under those accounts)"
text_zh = "消费档为 opt-in 开关:开启时用 Free/Pro/Max 账号(含这些账号下的 Claude Code)数据训练新模型"

[[product.training.point]]
text = "The Consumer Terms grant the license by default with the ability to opt out; after opting out, Feedback and safety-flagged content are still used for training."
text_zh = "Consumer Terms 为默认许可+可退出,退出后 Feedback 与安全标记内容仍用于训练。"

[[product.training.point]]
text = "Session quality survey transcripts are excluded from training: \"Your responses to this survey, including session transcripts submitted after the rating prompt, do not impact your data training preferences and cannot be used to train our AI models.\""
text_zh = "会话质量调查的 transcript 明确不用于训练:不影响训练偏好,也不能用于训练模型。"
anchor = "cc-survey-no-training"

[product.zdr]
mark = "no"
anchor = "zdr-cc-personal-not-covered"

[[product.zdr.point]]
text = "No ZDR on consumer tiers: \"Zero Data Retention (ZDR) for Claude Code is available to qualified accounts on Claude for Enterprise.\""
text_zh = "消费档无 ZDR:仅 Claude for Enterprise 合格账号"

[[product.zdr.point]]
text = "Sessions signed in with a personal account (Free/Pro/Max) are expressly out of scope: \"If a developer signs in to Claude Code with a personal account or with an API key from a different organization, those sessions are not covered.\""
text_zh = "个人账号(Free/Pro/Max)登录的会话明确不在覆盖范围"

[[product.zdr.point]]
text = "The API article likewise excludes \"Claude Free, Pro, and Max plans, including when customers on those plans use Claude's web, desktop, or mobile apps or Claude Code.\""
text_zh = "API 页亦正面排除 Free/Pro/Max 及其账号下的 Claude Code。"
anchor = "cc-zdr-api-consumer-excluded"

[product.retention]
days = 1825
object = "input_output"
basis = "fixed_period"
anchor = "cc-retention-5y"

[[product.retention.point]]
text = "The period depends on the model-improvement privacy toggle: \"Users who allow data use for model improvement: 5-year retention period to support model development and safety improvements\" (upper bound of that track)"
text_zh = "保留期限取决于「是否允许用于模型改进」的隐私开关:允许改进的轨道为 5 年(上限)"

[[product.retention.point]]
text = "The other track is 30 days: \"Users who don't allow data use for model improvement: 30-day retention period\". The schema renders a single number, so days=1825 is the upper bound of the track that applies while the toggle is on (the Consumer Terms license training use by default, with an opt-out)."
text_zh = "另一轨为 30 天:不允许用于模型改进=30 天。schema 只能渲染一个数字,故 days=1825 取开关打开那一轨的上限(Consumer Terms 默认授权训练、可退出)。"
anchor = "cc-retention-30d-consumer"

[[product.retention.point]]
text = "Feedback transcripts: \"Transcripts shared via /feedback, or via /bug and /share, which report through the same path, are retained for 5 years.\""
text_zh = "反馈 transcript:经 /feedback、/bug、/share(同一提交路径)提交的内容保留 5 年。"
anchor = "cc-feedback-5y"

[[product.retention.point]]
text = "Deleting a cloud session: \"You can delete individual cloud sessions at any time. Deleting a session permanently removes the session's event data.\""
text_zh = "云会话可随时删除;删除后永久移除该会话的事件数据。"
anchor = "cc-delete-sessions"

[[product.retention.point]]
text = "Session quality survey transcripts, uploaded only if the user explicitly selects Yes, are retained for up to 6 months."
text_zh = "会话质量调查 transcript 仅在用户显式选 Yes 时上传,最多保留 6 个月。"
anchor = "cc-survey-transcript-6m"

[product.processing_region]
codes = ["US", "global"]
anchor = "region-consumer-transfer-us"

[[product.processing_region.point]]
text = "No residency option on consumer tiers: \"your personal data is transferred to our servers in the US\" or to countries outside the EEA/UK. That sentence is generic consumer-product wording (the consumer tier of Claude Code is routed to the Consumer Terms + Privacy Policy by the data-usage page), not a Claude Code specific clause, hence confidence=medium."
text_zh = "消费档无驻留选项:个人数据传输至美国服务器或 EEA/UK 以外国家。该句是消费产品通用表述(Claude Code 消费档经 data-usage 页指向 Consumer Terms + Privacy Policy),不是 Claude Code 专属条款,故 confidence=medium。"

[product.role]
kind = "controller"
anchor = "role-consumer-controller"

[[product.role.point]]
text = "On consumer tiers Anthropic is the controller (§9 designates Anthropic Ireland, Limited or Anthropic PBC according to the user's place of residence)"
text_zh = "消费档 Anthropic 为 controller(§9 按居住地指定 Anthropic Ireland / Anthropic PBC)"

[[product.role.point]]
text = "The Privacy Policy states that it does not apply to content processed on behalf of customers of Anthropic's business offerings, such as Enterprise accounts, and that such use is governed by the customer agreements — confirming from the other side that the consumer tier is controller. No formal agreement-level controller/processor definition appears at the consumer_privacy level, hence medium."
text_zh = "隐私政策说明本政策不适用于代表商业客户(如 Enterprise 账号)处理的内容、那部分由客户协议管辖,反向确认消费档为 controller。consumer_privacy 层未出现 controller/processor 的正式协议定义,故 medium。"
anchor = "cc-role-privacy-business"

[[product]]
id = "claude-code-team"
badge = "Claude Code Team"
category = "coding_plan"
plan_level = "team"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "cc-commercial-no-training"
[[product.training.point]]
text_zh = "商业档默认不使用代码或提示训练生成模型；仅客户主动选择向 Anthropic 提供数据用于模型改进时例外。"

[product.zdr]
mark = "no"
anchor = "cc-zdr-enterprise-only"
[[product.zdr.point]]
text_zh = "Claude Code ZDR 仅向合格 Claude for Enterprise 账号提供，Team 不在覆盖范围。"

[product.retention]
days = 30
object = "input_output"
basis = "fixed_period"
anchor = "cc-commercial-retention-30d"
[[product.retention.point]]
text_zh = "Team、Enterprise 与 API 商业用户标准保留期为 30 天；主动提交的 /feedback、/bug、/share 反馈另保留 5 年。"
[[product.retention.point]]
text = "Different wording in the commercial privacy-center article: there the 30-day automatic deletion is scoped to API users — \"we automatically delete inputs and outputs on our backend within 30 days of receipt or generation\"."
text_zh = "商业档隐私中心文章的另一口径:30 天自动删除只写给 API 用户——收到或生成后 30 天内在后端自动删除输入输出。"
anchor = "cc-api-30d-deletion"
[[product.retention.point]]
text = "The same article says other commercial products that let you save and continue conversations (Claude for Work, Claude for Enterprise, Anthropic Console) keep chats and coding sessions \"in the product\" with no stated period. Both wordings are official; the object boundaries are kept side by side, not averaged."
text_zh = "同一篇对可续聊的其他商业产品(Claude for Work / Claude for Enterprise / Console)另说聊天与编码会话在产品内保留、未给期限。两条口径都官方,并列保留、不取平均。"
anchor = "cc-commercial-in-product-retention"
[[product.retention.point]]
text = "Violation handling on the commercial tier: \"We retain inputs and outputs for up to 2 years and trust and safety classification scores for up to 7 years\" if a chat is flagged by the automated trust and safety systems."
text_zh = "商业档违规处理:被自动信任安全系统标记为违反 Usage Policy 的会话,输入输出最多保留 2 年、信任安全分类分数最多保留 7 年。"
anchor = "cc-commercial-violation-2y7y"
[[product.retention.point]]
text = "Session quality survey transcripts, uploaded only if the user explicitly selects Yes, are retained for up to 6 months (organizations with ZDR, with product feedback disabled by policy, or with CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC never see this follow-up)."
text_zh = "会话质量调查 transcript 仅在用户显式选 Yes 时上传,最多保留 6 个月(启用 ZDR、组织禁用产品反馈或设置 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC 的组织看不到该追问)。"
anchor = "cc-survey-transcript-6m"
[[product.retention.point]]
text = "Local caching, the bullet the data-usage page lists under Commercial users (Team, Enterprise, and API): \"Claude Code clients store session transcripts locally in plaintext under ~/.claude/projects/ for 30 days by default to enable session resumption. Adjust the period with cleanupPeriodDays.\" This is a client-side local copy, not vendor-side retention."
text_zh = "本地缓存(data-usage 页把它列在商业档 Team/Enterprise/API 条目下):客户端默认把会话 transcript 以明文存于 ~/.claude/projects/,保留 30 天以支持会话恢复,可用 cleanupPeriodDays 调整。这是客户端本地副本,不是厂商侧保留。"
anchor = "cc-local-cache-30d"
[[product.retention.point]]
text = "Exception to that local limit: \"Transcripts of sessions started or most recently continued in Claude Desktop or Cowork are exempt from that limit by default.\""
text_zh = "该本地期限的例外:在 Claude Desktop 或 Cowork 中开始或最近继续的会话 transcript 默认不受该期限约束。"
anchor = "cc-local-cache-exempt"
[[product.retention.point]]
text = "Conflicting figure from the platform page (kept side by side, not resolved): \"Local session transcripts (from sessions on users' machines, in apps such as Cowork and Claude Code) are stored for 6 years by default\". Anthropic does not clarify whether that is a vendor-side copy of the same object as the 30-day client-side cache."
text_zh = "平台页给出的另一口径(并列保留、不选边):本地会话 transcript(用户机器上的会话,如 Cowork 与 Claude Code)默认存储 6 年。厂商未澄清它是否就是那 30 天客户端副本的厂商侧对应物。"
anchor = "cc-local-transcripts-6y"

[product.processing_region]
codes = ["unknown"]
searched = ["https://code.claude.com/docs/en/data-usage", "https://code.claude.com/docs/en/zero-data-retention"]
[[product.processing_region.point]]
text_zh = "现有 Claude Code 商业档 data usage 与 ZDR 文档未披露 Team 的处理国家或区域。"

[product.role]
kind = "processor"
anchor = "cc-role-dpa-processor"
searched = ["https://code.claude.com/docs/en/data-usage", "https://code.claude.com/docs/en/zero-data-retention", "https://www.anthropic.com/legal/commercial-terms", "https://www.anthropic.com/legal/data-processing-addendum", "https://www.anthropic.com/legal/privacy"]
[[product.role.point]]
text = "DPA §B.1: \"B.1. With respect to Customer Personal Data, Customer is the controller and Anthropic is Customer's processor.\""
text_zh = "DPA §B.1:就客户个人数据而言,客户为 controller、Anthropic 为 processor。"
anchor = "cc-role-dpa-processor"
[[product.role.point]]
text = "Applicability chain: the data-usage page sends Team/Enterprise/API users to the Commercial Terms for full details, and the Commercial Terms incorporate the DPA by reference (§C)."
text_zh = "适用链:data-usage 页把 Team/Enterprise/API 的完整条款指向 Commercial Terms,后者 §C 又把 DPA 并入条款。"
anchor = "cc-commercial-terms-applies"
[[product.role.point]]
text = "The Commercial Terms state \"Services under these Terms are not for consumer use.\", so the commercial-tier processor role does not extend to Free/Pro/Max."
text_zh = "Commercial Terms 明确「Services under these Terms are not for consumer use」,故商业档的 processor 角色不外推到 Free/Pro/Max。"
anchor = "cc-role-commercial-not-consumer"
[[product.role.point]]
text = "The consumer Privacy Policy excludes business-customer content: \"This Privacy Policy does not apply to content that we process on behalf of customers of our business offerings, such as our Enterprise accounts. Our use of that data is governed by our customer agreements covering access to and use of those offerings.\" — which is why the role for this tier is set by the Commercial Terms/DPA rather than by the consumer policy."
text_zh = "消费档隐私政策排除商业客户内容:本政策不适用于代表商业客户(如 Enterprise 账号)处理的内容,那部分由客户协议管辖——故本档角色由 Commercial Terms/DPA 而非消费档政策决定。"
anchor = "cc-role-privacy-business"

[[product]]
id = "claude-code-enterprise"
badge = "Claude Code Enterprise"
category = "coding_plan"
plan_level = "enterprise"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "cc-commercial-no-training"
[[product.training.point]]
text_zh = "商业档默认不使用代码或提示训练生成模型；仅客户主动选择向 Anthropic 提供数据用于模型改进时例外。"

[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "cc-zdr-enterprise-only"
[[product.zdr.point]]
text_zh = "ZDR 仅适用于合格 Enterprise 账号，不包含在标准 Enterprise 套餐中，须由账号团队确认资格并按组织启用。启用后提示与响应实时处理、响应返回后不存储，但法律与反滥用例外仍适用。"
[[product.zdr.point]]
text = "Enabling ZDR disables features that require storing prompts or completions at the backend level: cloud sessions (including those started from the Desktop app), Claude Tag, Artifacts, /feedback (with /bug and /share on the same path) and Remote Control."
text_zh = "启用 ZDR 会在后端禁用需要存储提示或响应的功能:云会话(含从 Desktop 启动的会话)、Claude Tag、Artifacts、/feedback(与 /bug、/share 同路径)以及 Remote Control。"
anchor = "cc-zdr-disabled-features"
[[product.zdr.point]]
text = "Covered Models are an exception to ZDR: \"Claude Fable 5.1 and Fable 5 are Covered Models that require data retention by default, and whether a ZDR organization or workspace can use them is governed by the Covered Models policies rather than by Claude Code.\" Where they cannot be used they are absent from the /model picker or shown as disabled."
text_zh = "Covered Models 是 ZDR 的例外:Fable 5.1/Fable 5 默认要求保留数据,ZDR 组织或工作区能否使用由 Covered Models 政策而非 Claude Code 决定;不能用时在 /model 选择器里直接缺席或显示为禁用。"
anchor = "cc-zdr-covered-models"
[[product.zdr.point]]
text = "Even with ZDR enabled, flagged sessions are an exception: \"If a session is flagged for a policy violation, Anthropic may retain the associated inputs and outputs for up to 2 years, consistent with Anthropic's standard ZDR policy.\""
text_zh = "即使启用 ZDR,被标记违规的会话仍是例外:该会话的输入输出最多保留 2 年(与标准 ZDR 政策一致)。"
anchor = "cc-zdr-violation-2y"

[product.retention]
days = 30
object = "input_output"
basis = "fixed_period"
anchor = "cc-commercial-retention-30d"
[[product.retention.point]]
text_zh = "标准 Enterprise 的保留期为 30 天；合格且另行启用 ZDR 的组织可降为零保留，法律与反滥用例外除外。"
[[product.retention.point]]
text = "Under ZDR the exception is quantified: if a session is flagged for a policy violation, Anthropic may retain the associated inputs and outputs for up to 2 years (upper bound), distinct from the standard 30-day period."
text_zh = "ZDR 档的例外有量化上限:被标记违规的会话,其输入输出最多保留 2 年,与标准档的 30 天区分。"
anchor = "cc-zdr-violation-2y"
[[product.retention.point]]
text = "Covered Models require data retention by default even for a ZDR organization, so this tier is not uniformly zero retention while they are in use."
text_zh = "即使组织启用了 ZDR,Covered Models 仍默认要求保留数据,故使用这些模型时本档并非一致零保留。"
anchor = "cc-zdr-covered-models"
[[product.retention.point]]
text = "Feedback submission is disabled at the backend level under ZDR, so the 5-year feedback retention of the standard commercial tier does not apply in a ZDR configuration."
text_zh = "ZDR 下反馈提交在后端被禁用,故标准商业档的「反馈另留 5 年」口径在 ZDR 配置下不适用。"
anchor = "cc-zdr-feedback-disabled"
[[product.retention.point]]
text = "Different wording in the commercial privacy-center article: there the 30-day automatic deletion is scoped to API users — \"we automatically delete inputs and outputs on our backend within 30 days of receipt or generation\"."
text_zh = "商业档隐私中心文章的另一口径:30 天自动删除只写给 API 用户——收到或生成后 30 天内在后端自动删除输入输出。"
anchor = "cc-api-30d-deletion"
[[product.retention.point]]
text = "The same article says other commercial products that let you save and continue conversations (Claude for Work, Claude for Enterprise, Anthropic Console) keep chats and coding sessions \"in the product\" with no stated period. Both wordings are official; the object boundaries are kept side by side, not averaged."
text_zh = "同一篇对可续聊的其他商业产品(Claude for Work / Claude for Enterprise / Console)另说聊天与编码会话在产品内保留、未给期限。两条口径都官方,并列保留、不取平均。"
anchor = "cc-commercial-in-product-retention"
[[product.retention.point]]
text = "Violation handling on the commercial tier: \"We retain inputs and outputs for up to 2 years and trust and safety classification scores for up to 7 years\" if a chat is flagged by the automated trust and safety systems."
text_zh = "商业档违规处理:被自动信任安全系统标记为违反 Usage Policy 的会话,输入输出最多保留 2 年、信任安全分类分数最多保留 7 年。"
anchor = "cc-commercial-violation-2y7y"
[[product.retention.point]]
text = "Session quality survey transcripts, uploaded only if the user explicitly selects Yes, are retained for up to 6 months (organizations with ZDR never see this follow-up)."
text_zh = "会话质量调查 transcript 仅在用户显式选 Yes 时上传,最多保留 6 个月(启用 ZDR 的组织看不到该追问)。"
anchor = "cc-survey-transcript-6m"
[[product.retention.point]]
text = "Local caching, the bullet the data-usage page lists under Commercial users (Team, Enterprise, and API): \"Claude Code clients store session transcripts locally in plaintext under ~/.claude/projects/ for 30 days by default to enable session resumption. Adjust the period with cleanupPeriodDays.\" This is a client-side local copy, not vendor-side retention."
text_zh = "本地缓存(data-usage 页把它列在商业档 Team/Enterprise/API 条目下):客户端默认把会话 transcript 以明文存于 ~/.claude/projects/,保留 30 天以支持会话恢复,可用 cleanupPeriodDays 调整。这是客户端本地副本,不是厂商侧保留。"
anchor = "cc-local-cache-30d"
[[product.retention.point]]
text = "Exception to that local limit: \"Transcripts of sessions started or most recently continued in Claude Desktop or Cowork are exempt from that limit by default.\""
text_zh = "该本地期限的例外:在 Claude Desktop 或 Cowork 中开始或最近继续的会话 transcript 默认不受该期限约束。"
anchor = "cc-local-cache-exempt"
[[product.retention.point]]
text = "Conflicting figure from the platform page (kept side by side, not resolved): \"Local session transcripts (from sessions on users' machines, in apps such as Cowork and Claude Code) are stored for 6 years by default\". Anthropic does not clarify whether that is a vendor-side copy of the same object as the 30-day client-side cache."
text_zh = "平台页给出的另一口径(并列保留、不选边):本地会话 transcript(用户机器上的会话,如 Cowork 与 Claude Code)默认存储 6 年。厂商未澄清它是否就是那 30 天客户端副本的厂商侧对应物。"
anchor = "cc-local-transcripts-6y"

[product.processing_region]
codes = ["unknown"]
searched = ["https://code.claude.com/docs/en/data-usage", "https://code.claude.com/docs/en/zero-data-retention"]
[[product.processing_region.point]]
text_zh = "现有 Claude Code 商业档 data usage 与 ZDR 文档未披露 Enterprise 的处理国家或区域。"

[product.role]
kind = "processor"
anchor = "cc-role-dpa-processor"
searched = ["https://code.claude.com/docs/en/data-usage", "https://code.claude.com/docs/en/zero-data-retention", "https://www.anthropic.com/legal/commercial-terms", "https://www.anthropic.com/legal/data-processing-addendum", "https://www.anthropic.com/legal/privacy"]
[[product.role.point]]
text = "DPA §B.1: \"B.1. With respect to Customer Personal Data, Customer is the controller and Anthropic is Customer's processor.\""
text_zh = "DPA §B.1:就客户个人数据而言,客户为 controller、Anthropic 为 processor。"
anchor = "cc-role-dpa-processor"
[[product.role.point]]
text = "Applicability chain: the data-usage page sends Team/Enterprise/API users to the Commercial Terms for full details, and the Commercial Terms incorporate the DPA by reference (§C)."
text_zh = "适用链:data-usage 页把 Team/Enterprise/API 的完整条款指向 Commercial Terms,后者 §C 又把 DPA 并入条款。"
anchor = "cc-commercial-terms-applies"
[[product.role.point]]
text = "The Commercial Terms state \"Services under these Terms are not for consumer use.\", so the commercial-tier processor role does not extend to Free/Pro/Max."
text_zh = "Commercial Terms 明确「Services under these Terms are not for consumer use」,故商业档的 processor 角色不外推到 Free/Pro/Max。"
anchor = "cc-role-commercial-not-consumer"
[[product.role.point]]
text = "The consumer Privacy Policy excludes business-customer content: \"This Privacy Policy does not apply to content that we process on behalf of customers of our business offerings, such as our Enterprise accounts. Our use of that data is governed by our customer agreements covering access to and use of those offerings.\" — which is why the role for this tier is set by the Commercial Terms/DPA rather than by the consumer policy."
text_zh = "消费档隐私政策排除商业客户内容:本政策不适用于代表商业客户(如 Enterprise 账号)处理的内容,那部分由客户协议管辖——故本档角色由 Commercial Terms/DPA 而非消费档政策决定。"
anchor = "cc-role-privacy-business"

