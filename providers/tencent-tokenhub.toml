text_zh = "DPSA §5.1：客户选了 Service Region 的，腾讯在该地域内处理个人数据"

[[product.processing_region.point]]
text_zh = "§5.2 例外——因运营/监管等原因可能移出所选地域，但视为「重大变更」需事先取得客户同意或授权（法律禁止通知的除外）"

[[product.processing_region.point]]
text_zh = "§5.3 可指定关联方/分包处理方在该地域处理。模块 §5 侧另有「新加坡/法兰克福/硅谷」作为 ZDR 可用的资源地域选项。国际站通用 ToS §(c) 同向：User Data 存储在所选地域。实体按注册地分（EEA/英国/瑞士=Tencent Cloud Europe B.V.；北美=Tencent Cloud LLC 等）。"

[[product.processing_region.point]]
anchor = "tokenhub-intl-module-compute-resources-availability"
text = "Scope note: module §4 (sub-processors) has the customer confirm the applicable TokenHub / Token Plan enterprise product documentation, including the provisions on using computing resources in different countries/regions based on resource availability. That sentence is an acknowledgement clause pointing at the product documentation rather than a substantive rule, and it sits alongside the DPSA §5.1/§5.2 material — DPSA §5.1 remains the main evidence for the codes on this row."
text_zh = "适用范围说明：模块 §4（分包处理方）要求用户确认已阅读 TokenHub / Token Plan 企业版产品文档中的条款，包括「基于资源可用性使用不同国家/地区计算资源」的相关规定——即计算资源可能按可用性落在不同国家/地区。该句是引导用户阅读产品文档的确认条款，不是实体规则；本档 codes 仍以 DPSA §5.1 为主证据，跨境移出另见 §5.2 的例外。"

[[product.processing_region.point]]
anchor = "tokenhub-intl-privacy-server-locations"
text = "Scope note for a lower-priority source: the International Site privacy policy states that its servers may be located outside the customer's country/region, e.g. mainland China. That page describes the site-wide services and account/management information, not where TokenHub customer content is processed; under contract > consumer_privacy, DPSA §5.1 and module §5 stay the main evidence and the codes on this row are unchanged."
text_zh = "适用范围说明（低权威来源）：国际站隐私政策写明「我们的服务器可能位于您所在的国家/地区境外，例如中国大陆」——该页讲的是站点通用服务与账户/管理信息的服务器分布，不是 TokenHub 客户内容的处理地。按 contract > consumer_privacy 的优先级，本档处理地仍以 DPSA §5.1 与模块 §5 为准，codes 不改。"

