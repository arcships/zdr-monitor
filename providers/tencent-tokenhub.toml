tier = "core"
note = "国际站《数据处理与安全协议》（DPSA 母协议，英文）。78953 模块被纳入本协议（模块冲突时以模块为准）。§4 直接写明 Organisation=Controller、Tencent=Processor；§5.1 在客户所选 Service Region 内处理、§5.2 跨境需事先同意；§6.1 目的限定与保留（未另行指示时按 §9 各功能模块的保留策略）。覆盖 TokenHub 国际站。"

