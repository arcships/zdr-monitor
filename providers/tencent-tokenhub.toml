[[product.zdr.point]]
text_zh = "②激活零数据保留（ZDR）功能。英文版同句（we will not store such information）。模块适用范围是「腾讯大模型服务平台 TokenHub 和 Token Plan 企业版」，TokenHub 本身未被限定为企业版（不要记成「仅企业版可得」）"

[[product.zdr.point]]
text_zh = "但只约束腾讯侧存储——用户手动选第三方部署模型时，上游第三方仍可能留存（136530 §3.5），有效 ZDR 取链路最弱一跳。"

