[product.training]
mark = "yes"
mode = "default"
anchor = "tokenhub-cn-training-no-train"

[[product.training.point]]
text_zh = "中国站服务条款 §2.17：腾讯云不会将输入内容用于开发/训练/微调/改进腾讯云自身的算法、模型或服务，无开关、无退出机制、无企业版前提。范围限定写在同条后半句——该承诺只及腾讯云自身可控的数据处理活动"

[[product.training.point]]
anchor = "tokenhub-cn-service-optimization-purpose"
text = "Tension inside the same document, kept side by side: §2.17 is a special undertaking about input content, while §2.18 is a general list of processing purposes for “the relevant data or information derived from it”, item (4) covering system operations and service optimisation without excluding input content. Under this ledger's rule that improving the service counts as training, this wider authorisation is recorded alongside §2.17; the mark is not changed by it."
text_zh = "同一份条款内的张力，并列保留：§2.17 是对「输入内容」的特别承诺，§2.18 则是一般处理目的清单——腾讯云在合理必要范围内为计费结算、账单核对、资源用量统计、系统运维和服务优化处理「相关数据或其衍生信息」，未排除输入内容。按本仓库「用来改进服务/提高质量算训练」的口径值得并列保留；§2.17 为特别约定、§2.18 为一般清单，不因此改 mark。"

[[product.training.point]]
text_zh = "用户手动选择第三方部署模型时数据交外部服务商，训练用途以第三方协议为准（§1.9/§2.17 后半句 + 136530 §3.5），见 products[api-third-party-deployed-model]。反向限定：智能路由模式与备用切换都不会把数据发给第三方部署模型（§1.11、§6.4）。产品文档佐证：FAQ 130104 答「不会…更不会用于训练」。"

[product.zdr]
mark = "unknown"
