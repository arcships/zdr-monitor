  "https://cloud.tencent.com/document/product/1823/130104",
  "https://cloud.tencent.com/document/product/301/11470",
]

[[product.zdr.point]]
text_zh = "中国站未披露：129852 全文 0 次出现「ZDR/零数据保留」，TokenHub 隐私政策、FAQ、腾讯云隐私保护声明亦无零保留承诺——查了这几处，厂商没表态，不等于厂商拒绝。中国站不可得 ZDR 的直接依据只有「没有该功能文本」这一条。国际站另有条件式 ZDR（见 products[api-intl] 与 source 78953）"

[[product.zdr.point]]
text = "The only China-site clause naming API input content is the TokenHub Privacy Policy §1.1.3: input collected when calling the API through the model service is used for security-audit purposes. It shows that input content is collected, and therefore retained, but says nothing about any zero-retention arrangement, so it is deliberately not bound to this dimension (it is bound under this tier's retention dimension)."
text_zh = "中国站唯一点名「调用 API 时的输入信息」的官方原句是 TokenHub 隐私政策 §1.1.3（通过 API 使用模型服务时收集输入信息用于安全审计），已绑在本档 retention 维度。该句只证明输入内容会被收集、因而会被留存，未提及任何零保留安排，不构成对本维度的表述，故本维度不绑锚点（按 mark=unknown 的口径记未披露）。"

[[product.zdr.point]]
text_zh = "第三方部署模型层即便腾讯侧零保留，上游第三方仍可能留存（136530 §3.5）。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "tokenhub-cn-retention-necessary"

[[product.retention.point]]
text_zh = "中国站无量化期限，只有原则条款：§2.14 对象=您的数据（输入内容等），腾讯云仅在「为提供本服务之目的所必需的期间」保留，期限结束后停止不必要使用或返还/删除"

[[product.retention.point]]
text_zh = "法规不允许删除时降级为仅存储与留存记录。例外与下限（对象各不同，不可合并）：§2.8 内容审核可「保存必要记录」（无期限）"

[[product.retention.point]]
text_zh = "§2.9 生成合成内容标识相关日志「依法留存…不少于六个月」——这是下限，推不出六个月后删除正文"

[[product.retention.point]]
text_zh = "隐私政策 §2.1 个人信息「为实现目的所必需的最短时间」。第三方部署模型场景的留存适用第三方协议（§2.14 末句）。"

[[product.retention.point]]
anchor = "tokenhub-privacy-api-input-audit"
text = "The only China-site clause that names API input content directly: the TokenHub Privacy Policy §1.1.3 states that input provided when calling the API through the model service is collected for security-audit purposes. It evidences that input content is collected, and hence retained, rather than a retention period itself; it is used together with §2.14's necessity principle and §2.8's retention of necessary records."
text_zh = "中国站唯一直接点名「调用 API 时的输入信息」的收集条款：隐私政策 §1.1.3 写明通过 API 使用模型服务时会收集输入信息用于安全审计功能。该句证明的是输入信息被收集（因而会被留存），不是保留期限本身；与 §2.14 的必要期间原则、§2.8 的保存必要记录合用。"

[product.processing_region]
codes = ["CN"]
anchor = "tokenhub-cn-region-cn-intl"

[[product.processing_region.point]]
text_zh = "§2.13：中国站服务的数据处理地点一般为中华人民共和国境内"

[[product.processing_region.point]]
text_zh = "国际站为新加坡或届时展示的其他地点"

[[product.processing_region.point]]
text_zh = "腾讯云就特定版本/地域另有说明的以该说明为准。隐私政策 §2.2 进一步承诺境内收集的个人信息存储于境内、暂无向境外提供场景（通用《腾讯云隐私保护声明》§6.2 同句，但同节后段披露账号信息 uin/appid 为鉴权/境外资源查询会传给境外关联公司，引用需带上下文）。例外：第三方部署模型的实际处理地点由第三方协议或其服务部署决定（§2.13 末句）。"

[product.role]
kind = "processor"
anchor = "tokenhub-cn-role-processor"

[[product.role.point]]
text_zh = "§2.11：腾讯云基于用户的委托、指令和需求、以向用户提供本服务为目的处理输入内容，处理活动「不能超出您的指示范围」，用户有权监督"

[[product.role.point]]
text_zh = "指示违法时腾讯云可拒绝/暂停执行。即受托处理者（processor），用户为决定处理目的的委托方（§2.7 要求用户保证输入内容的合法基础与个人信息知情同意）。国际站同向且更直白：DPSA §4「Organisation is the Controller and Tencent is the Processor」。第三方部署模型层腾讯只就平台层负责、不构成模型本身的运营者或控制者（136530 §1.3）。"

