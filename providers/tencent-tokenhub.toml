[product.training]
mark = "yes"
mode = "by_contract"
anchor = "tencent-intl-dpsa-purpose-limitation"

[[product.training.point]]
anchor = "tokenhub-intl-purposes-no-training"
text_zh = "国际站无「不用于训练」的正面承诺句。可核的是反向证据：DPSA 模块 §3 把处理目的穷举为「提供我们的功能特性」「故障排除」两项，无训练/改进目的"

[[product.training.point]]
anchor = "tokenhub-intl-purposes-troubleshooting"
text = "Second item of the same exhaustive list: troubleshooting — data including customer content and service-generated content is used to monitor the performance and quality of the features, detect and identify errors, defects or failures, analyse causes and troubleshoot. Neither of the two enumerated purposes is model training or service improvement."
text_zh = "同节穷举的第二项「故障排除」：用包括客户内容和服务生成内容在内的数据监控功能特性的性能与质量、检测和识别错误、程序缺陷或故障、分析原因并排查相关问题。两项目的穷举清单中没有训练或改进目的，这是本维度判 yes 的反向依据。"

[[product.training.point]]
anchor = "tencent-intl-dpsa-purpose-limitation"
text_zh = "母协议 §6.1a 要求腾讯仅按客户书面指示、为履行服务的限定目的处理。国际站 ToS §11.1 把数据处理全部交给 ToS/隐私政策/DPSA，三者均无训练条款。属「未授予训练目的」而非「明确承诺不训练」，故 confidence=medium。中国站另有 §2.17 的正面承诺。"

