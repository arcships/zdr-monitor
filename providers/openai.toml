  "https://developers.openai.com/api/docs/guides/your-data",
]

[[product.zdr.point]]
text = "Removed anchor: the cited clause (\"Currently, these controls are subject to prior approval by OpenAI and acceptance of additional requirements\") describes how the API-side ZDR/MAM controls are obtained. It is a statement about the API tier, not about the consumer tier, so it is not a statement on this verdict's dimension and has been unbound; it remains the anchor for the API tier's zdr. Search scope is recorded in searched."
text_zh = "已撤锚：原引句「Currently, these controls are subject to prior approval by OpenAI and acceptance of additional requirements」说的是 API 侧 ZDR/MAM 控制项的取得方式，是对 API 档的表述，不构成对消费档 zdr 的表述，故撤锚；该句仍是 API 档 zdr 的锚点。查阅范围见 searched。"

[[product.zdr.point]]
text = "No ZDR commitment exists for the consumer tier, and the official texts confine ZDR to the API enterprise side: the ZDR blog post opens with \"Zero Data Retention gives eligible API customers a clear promise\", your-data defines ZDR/MAM as API organization- and project-level controls subject to prior approval by OpenAI, and neither the consumer help center nor the Terms of Use and Privacy Policy contains any zero-retention statement addressed to individual subscriptions. This is \"the vendor provides no commitment for this tier\", not \"no evidence could be obtained\""
text_zh = "消费档不存在 ZDR 承诺,且官方文本把 ZDR 限定在 API 企业侧:ZDR 博客开篇即「Zero Data Retention gives eligible API customers a clear promise」,your-data 把 ZDR/MAM 定义为需 OpenAI 事先批准的 API 组织级/项目级控制项,消费档帮助中心与 ToU/隐私政策全文均无面向个人订阅的零保留表述。属于「厂商未提供该档位承诺」,非「拿不到证据」"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "openai-consumer-retention-chats"

[[product.retention.point]]
text = "No fixed cap: regular and archived chats remain saved to the account until the user deletes them (or until a workspace retention policy applies)"
text_zh = "无固定上限:常规/归档对话保存至用户删除(或工作区留存策略生效)"

[[product.retention.point]]
text = "Once deleted, OpenAI schedules the content for permanent deletion from its systems within 30 days, except where it has been de-identified and disassociated from the account, or where security or legal obligations require keeping it longer"
anchor = "openai-consumer-retention-delete-30d"
text_zh = "删除后 OpenAI 在 30 天内从系统永久删除,例外是已去标识化并脱离账号,或安全/法律需要更久"

[[product.retention.point]]
text = "Temporary chats are not used to improve the models while they remain temporary, and \"may be retained for up to 30 days for safety purposes\" — an upper bound on a safety copy, not a promise that they are deleted on day 30"
anchor = "openai-consumer-temp-chat-30d"
text_zh = "临时对话在保持临时期间不用于改进模型,且「最多保留 30 天(安全目的)」——这是安全副本的上限,不是「第 30 天删除」的承诺"

[[product.retention.point]]
text = "GPT knowledge files are kept until the GPT is deleted and project files until the project or the file is deleted; once deleted they are likewise permanently deleted within 30 days"
text_zh = "GPT 知识文件保留至 GPT 删除,project 文件保留至项目/文件删除,删除后同样 30 天内永久删除"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "openai-consumer-region-storage"

[[product.processing_region.point]]
text = "The consumer tier carries no regional residency commitment; data is processed and stored across multiple jurisdictions and expressly includes the US: \"Content is stored on OpenAI systems and our trusted service providers’ systems in the US and around the world\""
text_zh = "消费档无区域驻留承诺,数据在多法域处理/存储且明确包含美国:「Content is stored on OpenAI systems and our trusted service providers’ systems in the US and around the world」"

[[product.processing_region.point]]
text = "The Privacy Policy says the same (servers located in various jurisdictions, including US facilities and the locations of affiliates, partners and service providers), and cross-border transfers are made only under lawful transfer mechanisms. The determination rests on the wording of the terms, not on the place of incorporation. confidence=medium because this is a help center FAQ rather than a contractual clause"
text_zh = "隐私政策同口径(服务器位于多法域,含美国设施及关联方/合作伙伴/供应商所在地),跨境仅在合法传输机制下进行。判定基于条款表述,非注册地。confidence=medium 是因为这是帮助中心 FAQ 而非合同条款"

[product.role]
kind = "controller"
anchor = "openai-consumer-role-controller-row"

[[product.role.point]]
text = "On the consumer tier OpenAI is the data controller: Privacy Policy §11 designates it by place of residence (EEA/Switzerland = OpenAI Ireland Limited; anywhere else = OpenAI OpCo, LLC), and the contracting party is OpenAI OpCo, LLC (Terms of Use). This is the opposite of the processor role on the API tier, and is recorded faithfully per tier"
text_zh = "消费档 OpenAI 为数据控制者:隐私政策 §11 按居住地指定(EEA/瑞士=OpenAI Ireland Limited;其他=OpenAI OpCo, LLC),缔约主体为 OpenAI OpCo, LLC(ToU)。与 API 档的 processor 角色相反,分档如实记录"

