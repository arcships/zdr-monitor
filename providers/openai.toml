[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
anchor = "openai-api-training-not-used"
mode = "default"

[[product.training.point]]
text = "By default \"data sent to the OpenAI API is not used to train or improve OpenAI models\", unless you explicitly opt in to share data"
text_zh = "默认不用于训练或改进模型,除非显式 opt-in 共享数据"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "openai-api-zdr-approval"

[[product.zdr.point]]
text = "By application: these controls are subject to prior approval by OpenAI and acceptance of additional requirements, are available at organization or project level, and do not apply to some endpoints"
text_zh = "申请制(事先批准+附加要求),组织级/项目级可选,部分端点不适用"

[[product.zdr.point]]
text = "Retention exception that survives ZDR: image and file inputs to /v1/responses, /v1/chat/completions and /v1/images are scanned for CSAM on submission, and if the classifier detects potential CSAM content \"the image will be retained for manual review, even if Zero Data Retention, Modified Abuse Monitoring, or Private Retention with PSP is enabled\". This is a per-input exception, separate from the endpoint-level \"do not apply to some endpoints\" limitation"
anchor = "openai-api-zdr-csam-image-exception"
text_zh = "启用 ZDR 也成立的保留例外:提交到 /v1/responses、/v1/chat/completions、/v1/images 的图片/文件输入会做 CSAM 扫描,分类器命中时图片会被保留以供人工复核,「即使已启用 Zero Data Retention、Modified Abuse Monitoring 或 Private Retention with PSP」。这是按输入的例外,与端点级的「部分端点不适用」分开"

[[product.zdr.point]]
text = "OpenAI keeps the right to withdraw the controls, but not unconditionally: \"we reserve the right to make models ineligible for Zero Data Retention or Modified Abuse Monitoring for specific customers, as notified in advance to the impacted customers in writing\". In that case (Private Retention with PSP, formerly Eyes Off) customer content is retained in encrypted abuse monitoring logs in OpenAI-managed infrastructure, but excluded from human review unless applicable law requires it"
anchor = "openai-api-zdr-ineligible-psp"
text_zh = "OpenAI 保留停用控制项的权利,但不是无条件的:「we reserve the right to make models ineligible for Zero Data Retention or Modified Abuse Monitoring for specific customers, as notified in advance to the impacted customers in writing」。此情形下(Private Retention with PSP,原 Eyes Off)客户内容留在 OpenAI 自管的加密滥用监测日志中,除法律要求外不进入人工复核"

[[product.zdr.point]]
text = "The Safety Retention variant of the same right applies when it is \"reasonably necessary to investigate or prevent severe risk activity\", also with advance written notice; OpenAI may then retain and human review customer content on those models that its classifiers detect as potentially violating the Usage Policies or the agreement, while otherwise retention is not affected"
anchor = "openai-api-zdr-ineligible-safety"
text_zh = "同一权利的 Safety Retention 变体在「reasonably necessary to investigate or prevent severe risk activity」时适用,同样须事先书面通知;此时 OpenAI 可保留并人工复核其分类器判定可能违反使用政策或协议的内容,其余情况下保留不受影响"

[product.retention]
days = 30
object = "logs"
basis = "fixed_period"
anchor = "openai-api-retention-abuse-30d"

[[product.retention.point]]
text = "Abuse monitoring logs are retained for up to 30 days by default"
text_zh = "滥用监测日志默认最多 30 天"

[[product.retention.point]]
text = "Application state follows separate per-endpoint rules rather than one blanket period: audio outputs of /v1/chat/completions store application state for 1 hour, and the prompt cache's encrypted key/value tensors sit in GPU-local storage only until the 24-hour expiration"
text_zh = "应用状态按端点各有规则,而非一个通行期限:`/v1/chat/completions` 的音频输出应用状态存 1 小时,prompt cache 的加密 KV 张量只在 GPU 本地存储至 24 小时过期"
anchor = "openai-api-prompt-cache-24h"

[[product.retention.point]]
text = "The 48-hour application-state figure our earlier points cited belonged to /v1/videos. That API was shut down on September 24, 2026, and the page now records its 48-hour download window and its 30 days of abuse monitoring as periods documented before shutdown that promise nothing afterwards. No other endpoint's retention terms changed in this revision"
text_zh = "我们此前条目引用的 48 小时应用状态期限属于 `/v1/videos`。该 API 已于 2026-09-24 停机,页面现在把它的 48 小时下载窗口与 30 天滥用监测记为停机前的政策,不对停机后作任何承诺。本次修订中其他端点的留存条款未变"
anchor = "openai-api-videos-shutdown-historical"

[[product.retention.point]]
text = "Response bodies carry a lower bound of their own: for /v1/responses the API keeps 30 days of Application State by default, or when `store` is set to `true`, and in those cases \"response data will be stored for at least 30 days\". That is a minimum on the request/response content itself, not a cap, and its object is the content rather than the abuse monitoring logs"
anchor = "openai-api-responses-state-30d"
text_zh = "正文另有下限:/v1/responses 默认(或 store=true 时)保留 30 天应用状态,此时 response data「至少」存储 30 天。这是对请求/响应正文本身的下限而非上限,对象是内容本身而不是滥用监测日志"

[[product.retention.point]]
text = "The per-endpoint table still records /v1/responses Application state retention as \"None, see below for exceptions\", so the 30 days is not a blanket rule for that endpoint: it applies by default or when `store` is true, and other endpoints keep application state on their own terms (None, 24 hours, 30 days, or until deleted)"
anchor = "openai-api-responses-table-state-none"
text_zh = "逐端点表仍把 /v1/responses 的 Application state retention 记为「None, see below for exceptions」,所以 30 天不是该端点的通行规则:默认或 store=true 时才适用;其他端点各有各的规则(None、24 小时、30 天或至删除)"

[[product.retention.point]]
text = "Longest period on this tier: application-state objects of the Assistants family (/v1/assistants, /v1/threads, /v1/vector_stores, and /v1/files, which the table marks \"Until deleted\") are retained indefinitely when they are not deleted via the API or the dashboard, and are removed 30 days after deletion. This is until-deletion/indefinite, not a 30-day cap, and it is a separate object from the abuse monitoring logs"
anchor = "openai-api-assistants-until-deleted"
text_zh = "本档最长的期限:Assistants 系应用状态对象(/v1/assistants、/v1/threads、/v1/vector_stores,以及表中记为「Until deleted」的 /v1/files)若不通过 API 或控制台删除即无限期保留,删除后 30 天移除。属「至删除/无限期」而非 30 天上限,与滥用监测日志是两个对象"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "openai-api-region-storage"

[[product.processing_region.point]]
text = "No residency by default; project-level regional storage can be configured, in which case customer content for that project is stored at rest in the selected region and in some regions inference is performed in the selected region as well; regions outside the US require additional approval"
text_zh = "默认无驻留;可配置项目级区域存储,部分区域支持就地推理;非美国区域需额外审批"

[product.role]
kind = "processor"
anchor = "openai-api-role-dpa-processor"

[[product.role.point]]
text = "DPA §1.1: \"OpenAI acts as a Data Processor on the Customer’s behalf\""
text_zh = "DPA §1.1:OpenAI 为 Data Processor"

[[product]]
id = "consumer"
badge = "消费端"
category = "web"
plan_level = "any"

[product.training]
mark = "no"
anchor = "openai-consumer-training-may-train"
mode = "opt_out"

[[product.training.point]]
text = "May be used for training by default (opt-out structure): \"When you use our services for individuals such as ChatGPT and Codex, we may use your content to train our models\""
text_zh = "默认可用于训练(opt-out 结构):个人服务(ChatGPT 与 Codex)可能用你的内容训练模型"

[[product.training.point]]
text = "To opt out, turn off \"Improve the model for everyone\" in ChatGPT under Settings → Data Controls, or choose \"Do not train on my content\" in the privacy portal; either one is enough, and it applies to both ChatGPT conversations and Codex tasks"
text_zh = "退出方式为 ChatGPT Settings → Data Controls 关掉「Improve the model for everyone」或在隐私门户选「Do not train on my content」,任一即可,对 ChatGPT 对话与 Codex 任务同时生效"

[[product.training.point]]
text = "Codex has a separate \"Include environments\" setting in Codex settings for allowing training on full environments, and changing the ChatGPT or Privacy Portal settings does not change it. Opting out applies to new content only and is not retroactive. Even after opting out, the whole conversation attached to a thumbs-up or thumbs-down you submit may still be used for training"
text_zh = "Codex 全环境(full environments)训练是独立开关「Include environments」,在 Codex settings 里,改 ChatGPT 或隐私门户的设置都不影响它。退出后仅对新内容生效,不回溯。即使退出,主动点赞/点踩所关联的整段对话仍可能被用于训练"

[product.zdr]
mark = "unknown"
searched = [
  "https://help.openai.com/en/articles/5722486-how-your-data-is-used-to-improve-model-performance",
  "https://help.openai.com/en/articles/7730893-data-controls-faq",
  "https://help.openai.com/en/articles/8983778-how-are-files-vs-chats-retained",
