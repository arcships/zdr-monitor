[product.training]
mark = "no"
mode = "opt_out"
anchor = "xfyun-iface-4-3-optimization-license"

[[product.training.point]]
text_zh = "同顶层 training：§4.3 授权「输入内容及对应输出内容…用于本协议下产品及服务的优化」（带加密/去标识化前提与 §8.2 退出渠道）"

[[product.training.point]]
text_zh = "匿名化训练句在隐私政策层，主语是最终用户个人信息。平台层并列条款：《用户服务协议》§五.3 的「广告营销以及技术优化」授权更宽且无退出机制，但该条对象是「您上传至本平台的内容」、属平台层范围，对接口服务范围已由接口协议 §11 与本协议 §三.2(4) 让位于本专门协议（见顶层 training 维度 (2)）。"

[[product.training.point]]
text = "Second content-layer licence, at the MaaS layer and wider than §4.3: the Xingchen MaaS Platform User Instructions §3 authorises use of the input content and the corresponding output content for optimisation of that service, with the same encryption/de-identification preconditions but without the limitation to this agreement, so it is not confined to the interface-service scope. Interface policy §6.2 admits that this service includes third-party models hosted on Xingchen MaaS, so this clause bears on this tier."
text_zh = "第二条内容层授权，在 MaaS 层且比 §4.3 宽：星辰 MaaS《用户使用须知》§三以同样的加密/去标识化为前提，把「本服务所收集的输入内容及对应输出内容」用于「本服务的优化」，但去掉了「本协议下」的限定。接口协议 §6.2 自认本服务含「在星辰 MaaS 平台上托管的第三方模型」，故该条对本档范围有实际意义。"
anchor = "xfyun-maas-3-content-optimization-license"

[[product.training.point]]
text = "The exit channel of that MaaS licence is a generic feedback request rather than a named contract clause: users who refuse the authorisation may send comments or suggestions to the vendor. It differs from §4.3, which points to §8.2."
text_zh = "该 MaaS 授权的退出渠道是通用反馈（「您可以向我们反馈您的意见或建议」），不是像 §4.3 那样指向具体条款（§8.2）。"
anchor = "xfyun-maas-3-optout-channel"

[[product.training.point]]
text = "Multi-hop: this tier covers third-party models hosted on the Xingchen MaaS platform (interface policy §6.2, MaaS instructions §二.3), and interface policy §6.1 admits the service may contain third-party open-source software, products or services. No public document states whether requests are forwarded to the original model vendors or what role those vendors take in the chain, so no end-to-end conclusion is drawn — one hop that is clearly negative would make the whole chain negative."
text_zh = "多跳链路：本档范围含星辰 MaaS 平台上托管的第三方模型（接口协议 §6.2、MaaS 须知 §二.3），接口协议 §6.1 亦自认本服务可能包含第三方（开源）软件、产品或服务。公开文档未披露这些请求是否转发至模型原厂、也未披露原厂在链路中的角色与数据处理政策，故不给全链结论（任一跳明确为否即全链为否）。"
anchor = "xfyun-iface-6-1-third-party-components"

