note = "《SparkDesk 用户协议》，更新日期 2025 年 8 月 25 日，运营主体科大讯飞股份有限公司。开篇即说明「您在使用本服务某一特定功能或服务时…可能会另有单独的协议…例如《讯飞开放平台大语言模型接口服务协议》。本协议与特别协议的内容之间存在冲突的，以特别协议的约定为准」——故本协议是接口服务协议的上位协议，两者冲突时接口协议优先。§4.3 与接口协议 §4.3 同构（「输入及对应输出…用于本协议下产品及服务的优化」，拒绝渠道为 §7.2）。§1.7 注销后仍保留注册数据及行为记录（个人信息除外）。§六 把个人信息处理引向《SparkDesk 隐私政策》。本协议同时是讯飞星火 App/Web 消费端的用户协议。全文无保留期限数字、无零保留表述。"

[[source]]
