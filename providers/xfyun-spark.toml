[[source]]
url = "https://www.xfyun.cn/doc/policy/agreement.html"
channel = "contract"
tier = "core"
note = "《讯飞开放平台用户服务协议》，平台层总协议，页面标注发布日期 2025 年 8 月 25 日、生效日期 2025 年 8 月 31 日。§五.3 是全文最宽的一条：「除非双方之间另有约定，您上传至本平台的内容以及您使用本平台中的能力、产品、技术解决方案生成的内容，权利归您…但您同意，我们可以使用您上传至本平台的内容用于广告营销以及技术优化、故障分析和排除」——无去标识化/加密前提、无退出机制，且用途扩到「广告营销」，比接口协议 §4.3 宽。归位为 core（原判 conflict，2026-09-21 重查）：这不是同范围上的相反表述，而是平台层总协议条款与接口服务专门条款的关系，四条文本依据都指向接口服务范围由接口协议说了算——①本协议 §三.2(4) 自己把星火大模型让位：「星火大模型：直接访问、使用与星火大模型相关的所有技术、能力，就星火大模型的使用和相关内容，以星火大模型的网站（xinghuo.xfyun.cn/spark）中的协议、规则、指引等内容为准」；②§五.3 授权句自带让位语「除非双方之间另有约定」；③接口协议 §11「本协议的约定内容与您和我们之间签署的其他协议相互冲突的，以本协议约定为准」，且接口协议自认是《SparkDesk 用户协议》项下的「特定协议」；④接口协议的母协议《SparkDesk 用户协议》也写「本协议与特别协议的内容之间存在冲突的，以特别协议的约定为准」。故对接口服务（星火大模型 API、星辰 MaaS）范围，§五.3 不是结论依据，其残余范围是平台的非星火专门协议面（控制台、服务市场、数据集与语料上传等）。保留为 core 而非 drop 的理由：§五.3 是本家唯一一条把客户内容用途扩到「广告营销」且无任何前提的现行官方合同条款，且与 API 客户同时成立；它若被改成明确覆盖 API 输入输出，本条目必须第一时间发现，故保留锚点、留在每日队列。残余不确定性（记为不确定性，不判为矛盾）：§一.4 规定平台管理规则与本协议同等效力、「若两者之间的内容产生冲突的，以在后更新的内容为准」——按生效日（2025-08-31）算本协议在后，按更新时间（两份同为 2025-08-25）算同日，这条一般性时间规则与上述三条专门协议优先条款指向相反；且公开文本没有写经 API 上传的音频/图片/文件是否属于「您上传至本平台的内容」。§三 注销后「尽快删除您的个人信息或作匿名化处理」。§八 把个人信息处理引向《讯飞开放平台隐私政策》。全文未出现「训练」二字（只用「技术优化」）。无保留期限数字、无 ZDR。"

[[source]]
url = "https://www.xfyun.cn/doc/policy/personal_privacy.html"
channel = "developer_data"
tier = "core"
note = "《开发者用户个人信息保护合规指引》，更新日期/发布日期 2025.04.21，面向集成讯飞 SDK/API 的开发者，规定开发者对最终用户的告知义务与「受托处理」口径。归位为 core（原判 conflict，2026-09-21 重查）：本指引的数据对象是开发者应用的最终用户个人信息（开发者是控制者、讯飞是受托处理方），接口协议 §7 讲的是开发者自己输入的内容（「我们理解您输入的内容中可能包含他人的个人信息，如包含，请您务必取得他人的合法授权」）——数据对象与主体关系都不同，属适用范围不同，不是同一维度上的相反表述；同时本指引是 processing_region 结论的直接依据（SDK/API 仅面向中国大陆境内开发者 + 境外开发者场景下受托处理的最终用户个人信息传输至中国大陆境内处理），也是 role 维度「受托层」的唯一锚点。两条对本台账有用：①「我们的SDK/API仅面向中华人民共和国大陆境内的开发者提供」；②境外开发者场景下「则我们受托处理的有关您最终用户的个人信息将传输到中国大陆境内处理」——这是本家唯一一处自认「受托处理」的表述。边界（不判为矛盾，理由记录在此）：本指引 §一.2 自己同时用「共享至讯飞」的表述要求开发者向最终用户披露，与平台隐私政策 §一.2(2)、星火专项隐私政策开篇的「共享至科大讯飞」一致；平台隐私政策 §二.3(1)(3) 又把最终用户个人信息的画像/营销推送与匿名化训练写成讯飞自为目的的处理。按 PIPL，同一主体可对同一数据的不同处理活动分别处于受托方与独立控制者位置（受托范围限于「我们受托处理的」那一部分），故这是处理活动与目的不同，不是同范围的口径不一致；role 维度的取值只针对 API 档的内容层。无保留期限、无训练条款、无 ZDR。"

[[source]]
url = "https://www.xfyun.cn/doc/policy/privacy.html"
channel = "consumer_privacy"
tier = "core"
note = "《讯飞开放平台隐私政策》，页面标注更新日期 2022 年 10 月 9 日、生效日期 2022 年 10 月 9 日（是本家五份数据类文档里最旧的一份）。同时覆盖两类主体：「访问、注册、登录及使用讯飞开放平台产品与/或服务的访问者和开发者」（§二.1）与「使用调用了讯飞开放平台人工智能API/SDK产品与/或服务的最终用户」（§二.2）。是本家 retention 与 processing_region 的主要条款来源，也是 training 匿名化训练句的来源之一。§二.1.a 系统日志含「产品服务使用记录、搜索查询内容、访问的页面地址、登录IP」；§二.2.b 调用日志「用于调用数量的统计分析」——证明服务端存在日志，但都未写期限。§三(3) 匿名化训练句此处写「语音信息」，与星火专项政策写「信息」不同。§四.1「委托处理」是讯飞作为委托方向外委托第三方（不是讯飞作为受托方）。§五.3/§六.2 给出目的绑定保留与《网络安全法》网络日志≥6 个月、《电子商务法》交易信息≥3 年的下限引用。§六.1 与 §九 给出境内存储与跨境例外。全文无保留天数、无零保留/ZDR、无面向 API 客户的「不用于训练」承诺。"

[[source]]
url = "https://www.xfyun.cn/doc/policy/SparkInterfacePolicy.html"
channel = "contract"
tier = "core"
note = "《讯飞开放平台大语言模型接口服务协议》，页面标注「更新时间：2025 年 8 月 25 日」，运营主体科大讯飞股份有限公司。适用范围自述为「特别适用于您作为开发者使用本服务提供的应用程序编程接口（API）或其他开发者工具，开发面向组织内部或终端用户的产品及服务使用场景」——即按量 API 与星辰 MaaS 托管模型的开发者合同层；同时自认是《SparkDesk 用户协议》项下的「特定协议」，§11 规定「本协议的约定内容与您和我们之间签署的其他协议相互冲突的，以本协议约定为准」。§4.3 是本家唯一一条就「输入内容及对应输出内容」作出用途授权的合同条款（优化用途 + 三个前提 + §8.2 退出渠道）。全文「训练」二字只出现两处，都不是对客户内容的训练授权：§2.4(4) 禁止客户拿输出训练竞品模型、§3.3(1) 训练数据选择的合规义务。§6.2 对星辰 MaaS 上托管的第三方模型自认「仅提供能力调用服务」。§1.5 注销后仍保留注册数据及行为记录（个人信息除外）。§7 只把个人信息处理引向《讯飞开放平台隐私政策》，未自认受托处理。全文无任何保留期限数字、无零保留/ZDR 表述。"

