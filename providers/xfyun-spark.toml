note = "《讯飞星火隐私政策》（URL 为 xinghuo.xfyun.cn/policy/ 下的百分号编码路径，原始路径名为「讯飞星火隐私政策v2」），更新日期 2026 年 9 月 11 日（发布/生效 2025-12-29），适用讯飞星火 App 与 xinghuo.xfyun.cn 网站，是消费端现行版本，比文档中心那份（2025-10-22）更新。本家唯一一处明确的「不用于训练」表述在这里：§1.14(4)「在未获得您单独明确同意的前提下，您的记忆数据不会被用于模型训练、模型迭代优化。记忆数据不会无限期保存；当您注销账号时，记忆数据将按照法律法规要求同步处理」——只覆盖记忆数据，且以「单独明确同意」为条件。§1.6 问答历史保留、§1.15 安全维护与运营统计（日志用于「运营分析、改进和优化产品交互体验」）。§二(4) 匿名化训练句带拒绝反馈渠道。存储地：境内大陆地区科大讯飞服务器。仅面向中国大陆地区（不含港澳台）。"

