anchor = "cn-privacy-6-2-retention"

[[product.retention.point]]
text = "China-site conclusion: no quantified retention period, only the principle of \"the period necessary for the purpose + deletion or anonymization once exceeded\", with an express acknowledgement of delayed deletion from backups. Objects and context, itemized: **Object** — Privacy Policy §2.3.1 brings \"the text, voice, images and video you input, reply with or generate\" within user content, and the appendix further lists \"conversation content\" as part of \"log information\" (\"including time, user ID, conversation ID, conversation content, as well as IP address, browser type, telecom carrier, language, and date and time of access\"), so on the China site inference interaction content and access logs are covered by the same \"user information / personal information\" regime and the documents do not regulate them separately. **Period** — §6.2 \"we retain your user information only for the period necessary to achieve the purposes stated in this policy, unless permitted by law. Once that retention period is exceeded, we will delete or anonymize your personal information\" (ceiling-type, unquantified, a statement of principle rather than a verifiable number of days). **Exceptions and triggers** — (1) §4.3.3 delayed deletion from backups: \"because of applicable law and security-technology limits, we may not be able to delete the corresponding information from backup systems immediately ... until the backup can be cleared or anonymized\""
text_zh = "中国站结论：没有量化保留期限，只有「目的所需期限 + 超期删除或匿名化」的原则，且明确承认备份延迟删除。对象与语境逐条列清：**对象**——隐私政策 §2.3.1 把「您输入、回复、生成的文字、语音、图片、视频」纳入用户内容，附录又把「对话内容」列为「日志信息」的组成部分（「包括时间、用户ID、对话ID、对话内容，以及IP地址、浏览器类型、电信运营商、使用语言、访问日期和时间」），即推理交互内容与访问日志在中国站是被同一套「用户信息/个人信息」口径覆盖的，文档没有把二者分开规定。**期限**——§6.2「我们只会在达成本政策所述目的所需的期限内保留您的用户信息，除非受到法律的允许。超出上述用户信息保存期限后，我们会对您的个人信息进行删除或匿名化处理」（上限型、未量化；属原则性表述，不是可核对的天数）。**例外与触发点**——(1) §4.3.3 备份延迟删除：「因为适用的法律和安全技术限制，我们可能无法立即从备份系统中删除相应的信息……直到备份可以清除或实现匿名化」"

[[product.retention.point]]
text = "(2) §4.5.2 deletion after account cancellation, \"except where laws, regulations or industry supervisory rules provide otherwise\""
text_zh = "(2) §4.5.2 注销后删除「但法律法规或行业监管规则另有规定的除外」"

[[product.retention.point]]
text = "(3) §6.5 deletion or anonymization of personal information held when operations cease"
text_zh = "(3) §6.5 停止运营时对持有个人信息删除或匿名化"

[[product.retention.point]]
text = "(4) User Agreement §9.2.1 \"once the feature is withdrawn, your right to use this community terminates immediately and any information you have stored in this community may be unrecoverable\" — no retention is promised when a free feature is withdrawn"
text_zh = "(4) 用户协议 §9.2.1「一旦功能取消，您使用本社区的权利立即终止，您在本社区中储存的任何信息可能无法恢复」——免费功能取消不承诺保留"

[[product.retention.point]]
text = "(5) User Agreement §3.4.1(3) legal-preservation permission: where the user fails to comply with statutory obligations (the context is the labelling duty for generated synthetic content), \"we have the right to preserve the relevant records in accordance with the law and report to the Cyberspace Administration and the relevant competent authorities\". It fixes no period, and the object is the records related to the breach — it is a permission to keep, not a retention period and not a floor, so no number of days may be derived from it."
text_zh = "(5) 用户协议 §3.4.1(3) 法定保存许可：用户未遵守相关法定义务时（语境是生成合成内容的标识义务）「我们有权依法保存有关记录，并向网信部门和有关主管部门报告」。它没有期限，对象是违规相关的记录——是保存许可，不是保留期限、也不是下限，不能据此推任何天数。"
anchor = "cn-tos-3-4-1-3-legal-preserve"

[[product.retention.point]]
text = "(6) The corresponding international-site text (which does not apply to the China site) separately says that data stored by the platform \"may be removed or rendered inaccessible from time to time\". **What is absent**: no request-level retention commitment (such as 0 days or 30 days)"
text_zh = "(6) 国际站对应文本（不适用中国站）另说平台存储的数据「may be removed or rendered inaccessible from time to time」。**没有的东西**：没有请求级保留期（如 0 天/30 天）的承诺"

[[product.retention.point]]
text = "No retention rule for a KV cache or prompt cache (the docs site has no documentation for such a feature)"
text_zh = "没有 KV 缓存/Prompt 缓存的保留规则（docs 站没有相关功能文档）"

[[product.retention.point]]
text = "And no \"network logs kept for no less than six months\" floor of the kind common on Chinese sites — that wording appears nowhere in either ModelScope China-site agreement, so the practice of other domestic vendors cannot be carried over. Uncertainty: how long call logs on the free API-Inference tier are actually kept is not disclosed."
text_zh = "也没有国内站常见的「相关网络日志不少于六个月」下限表述——魔搭中国站两份协议全文都没有出现该表述，因此不能按其他国内厂商的口径套用。不确定性：免费档 API-Inference 的调用日志实际保留多久，官方未披露。"

[product.processing_region]
codes = ["CN"]
anchor = "cn-privacy-6-6-storage-cn"

[[product.processing_region.point]]
text = "China-site conclusion: personal information generated by the community service is, in principle, stored within China. Privacy Policy §6.6: \"In principle, personal information generated or collected in the course of our business within the People's Republic of China is stored within the People's Republic of China; unless it is necessary to provide you with a service, in which case we will transfer your personal information abroad only after obtaining your separate consent and taking the other measures required by laws and regulations\""
text_zh = "中国站结论：社区服务产生的个人信息原则上境内存储。隐私政策 §6.6「原则上，我们在中华人民共和国境内开展业务过程中产生或收集的个人信息，将存储在中华人民共和国境内；除非为向您提供某项服务所必需，我们会在获得您单独同意，并采取其他法律法规要求的措施下，方会向境外传输您的个人信息」"

[[product.processing_region.point]]
text = "User Agreement §10.2 adds that \"this community is intended for users in mainland China, and we do not warrant that the service is suitable or available for access or use outside mainland China\". Three pieces of circumstantial support on the compute and account side (same direction, but product-implementation descriptions rather than regional commitments): the API-Inference usage limits document says \"the free inference API is backed by compute provided by Alibaba Cloud\" and requires \"binding an Alibaba Cloud account\" with real-name verification"
text_zh = "用户协议 §10.2 进一步限定「本社区旨在供中华人民共和国内地用户使用，我们不保证该服务适合或可供中国内地以外的地区访问或使用」。算力与账号侧的三条旁证（同一方向，但它们是产品实现描述而非地域承诺）：API-Inference 使用限制文档「免费推理API由阿里云提供算力支持」且强制「绑定阿里云账号」并实名认证"

[[product.processing_region.point]]
text = "The FlexTrain training service: \"ModelScope works with Alibaba Cloud PAI-DLC\", connected over a virtual private cloud"
text_zh = "FlexTrain 训练服务「ModelScope与阿里云PAI-DLC合作」并通过专有网络链接"

[[product.processing_region.point]]
text = "The deployment service \"supports mainstream Alibaba Cloud infrastructure\" (Function Compute FC, PAI-EAS and others). Uncertainties: (a) those three only show that the compute is on Alibaba Cloud (domestic regions), which is not a contractual commitment that \"inference request content does not leave the country\""
text_zh = "部署服务「支持主流阿里云基础设施」（函数计算 FC、PAI-EAS 等）。不确定性：(a) 上述三处只说明算力在阿里云（国内 Region），不等于「推理请求内容不出境」的合同承诺"

[[product.processing_region.point]]
text = "(b) On the API-Provider tier (where the user explicitly selects an external provider such as DashScope or DeepSeek), requests are forwarded to a third party and the processing location is decided by that provider; this vendor's documentation makes no regional commitment at all — that tier is outside this ledger's coverage (Alibaba Cloud Model Studio / DashScope is a separate provider)"
text_zh = "(b) API-Provider 档（用户显式选择 DashScope/DeepSeek 等外部提供方）会把请求转发给第三方，处理地由该提供方决定，本家文档未作任何地域承诺——此档不在本台账覆盖范围（阿里云百炼/DashScope 是另一 provider）"

[[product.processing_region.point]]
text = "(c) Privacy Policy §3.2 permits user information to be shared where it is \"necessary to conclude or perform a contract to which you are a party\" and in similar cases, without limiting where the recipient is located."
text_zh = "(c) 隐私政策 §3.2 允许在「为订立、履行您作为一方当事人的合同所必需」等情形下共享用户信息，未限定接收方地域。"

[product.role]
kind = "controller"
anchor = "cn-privacy-3-1-entrusted-processing"

[[product.role.point]]
text = "China-site conclusion: for the community service the platform designates itself a personal information handler (the independent-controller side), while also calling itself a \"neutral platform\" at the agreement level; both statements are recorded side by side and not reconciled. Supporting the handler side: the privacy policy opens by positioning \"Shanghai ModelScope Technology Co., Ltd. as the operator of the ModelScope community\"; §2.3.2 determines the purpose of collecting user content itself (\"in order to provide you with those services ... and we have the right to display your nickname, avatar and published content\"); §3.1 is an entrusting-party clause for engaging others (\"we may entrust authorized partners (such as technical service providers and authorized partners) to process your personal information ... we will only entrust them to process your information for the lawful, legitimate, necessary, specific and explicit purposes stated in this policy\" — ModelScope is the entrusting party, the partner the entrusted party); and §3.2 makes \"your explicit consent\" the rule for external sharing. Supporting the neutral-platform side: User Agreement §4.1(6) \"as a neutral open-source community service provider\""
text_zh = "中国站结论：平台对社区服务自认个人信息处理者（独立控制者一侧），同时在协议层面自称「中立平台」，两处表述并列记录、不调和。支持处理者一侧：隐私政策开篇以「上海魔搭科技有限公司作为魔搭社区的运营方」自我定位，§2.3.2 自行决定收集用户内容的目的（「为向您提供该等服务……并有权展示您的昵称、头像和发布内容」），§3.1 是委托他人处理时的委托方条款（「我们可能委托授权合作伙伴（如技术服务方、授权合作伙伴等）处理您的个人信息……我们仅会出于本政策声明的合法、正当、必要、特定、明确的目的委托其处理您的信息」——即魔搭是委托方，合作方是受托方），§3.2 对外共享以「获得您明确同意」为原则。支持中立平台一侧：用户协议 §4.1(6)「我们作为中立性开源社区服务提供方」"

[[product.role.point]]
text = "§4.2.1(3) / §4.2.2(3) describe the platform in the Studio scenario as \"merely a technical platform providing free code hosting and limited trial compute resources\", and place deep-synthesis and generative-AI compliance obligations on the Studio creator (§4.2.1(2)). Tension the other way: §3.2.1(2) admits that \"we may access or share your private user content in accordance with what is set out in our privacy policy\", and §4.1(2) reserves the right to review and delete user content and Demo inputs. **Key gap**: who acts as entrusted processor on the API-Inference path is not disclosed anywhere in the public documents — there are only technical statements such as \"bind an Alibaba Cloud account\" and \"compute provided by Alibaba Cloud\", and the China site has no list of third parties information is shared with (PPIO, by contrast, has a dedicated list page), so whether Alibaba Cloud is an entrusted party or an independent handler on the inference path cannot be answered from this vendor's documents. That is also why confidence for this dimension is only medium. The role conclusion differs between the China site and the international site: international terms §9 states expressly that \"any processing of personal data submitted through ModelScope.AI is for your purposes and on your behalf only\" (processor wording), see the intl row under products."
text_zh = "§4.2.1(3)/§4.2.2(3) 在创空间场景自称「仅作为免费提供代码托管、有限的体验试用计算资源等技术平台」，并明确深度合成/生成式 AI 的合规义务由创空间创建者承担（§4.2.1(2)）。反向张力：§3.2.1(2) 承认「我们可能会根据我们的隐私政策中规定的内容访问或分享您的私有用户内容」，§4.1(2) 保留对用户内容与 Demo 输入的审核删除权。**关键缺口**：API-Inference 推理链路上谁是受托处理方，公开文档完全没有披露——只有「绑定阿里云账号」「由阿里云提供算力支持」这类技术表述，且中国站没有第三方信息共享清单（对比 PPIO 有专门的清单页），因此「阿里云在推理链路上是受托方还是独立控制者」在本家文档中无解。这也是本维度置信度只给 medium 的原因。中国站与国际站的 role 结论不同：国际站 terms §9 明文「any processing of personal data submitted through ModelScope.AI is for your purposes and on your behalf only」（受托方口径），见 products 的 intl 行。"

