[[product.processing_region.point]]
text = "International-site conclusion: no specific region is named. The privacy policy has no storage-location clause at all, and the contract touches on the location of processing only negatively — Terms §3.5 has the user \"expressly authorise and consent to us: … (ii) processing and storing such User Content outside of the jurisdiction where you are using ModelScope.AI\", i.e. all that is disclosed is that processing and storage may take place outside the jurisdiction where the user is using ModelScope.AI; no country or region is committed to. The only usable circumstantial evidence is the operating entity and the governing law: the Privacy Policy opens with \"Alibaba Cloud (Singapore) Private Limited and its related corporations\", the DPO's mailing address is at Times Square, Causeway Bay, Hong Kong, and §11 provides that it \"shall be governed by the laws of the Republic of Singapore\""
text_zh = "国际站结论：没有指名任何具体地域。隐私政策没有存储地域条款，合同层只从反面涉及处理地——Terms §3.5 要求用户「expressly authorise and consent to us: … (ii) processing and storing such User Content outside of the jurisdiction where you are using ModelScope.AI」，即厂商只披露处理与存储可能发生在用户所在司法辖区之外，未承诺任何国家或地域。可用的旁证只有运营主体与法律适用：Privacy Policy 开篇主体为「Alibaba Cloud (Singapore) Private Limited and its related corporations」，DPO 通信地址在香港铜锣湾时代广场，§11「shall be governed by the laws of the Republic of Singapore」"

[[product.processing_region.point]]
text = "§4 says expressly that personal data may be provided to \"our related corporations; analytics, search engine providers or other third party service providers …\", \"whether they are located overseas or in Singapore\" — the document only states that disclosure abroad is possible and promises no particular region for the data. Where the entity sits is not where the data is processed, so this is recorded faithfully as not_found rather than filled in as Singapore."
text_zh = "§4 明说个人信息可能提供给「our related corporations; analytics, search engine providers or other third party service providers …」，「whether they are located overseas or in Singapore」——即文档只承诺「可能向境外披露」，不承诺数据留在某一地域。主体所在地 ≠ 数据处理地，故本条如实记 not_found 而不是填新加坡。已撤锚：原绑的 §4 只说明个人信息「可能提供给位于境外或新加坡的接收方」，是披露/接收方所在地条款，不构成对处理地的表述。"

[[product.processing_region.point]]
text = "Removed anchor: Privacy Policy §4 states only that personal data may be provided to recipients \"whether they are located overseas or in Singapore\" — a disclosure/recipient-location clause, not a statement about where processing takes place."
text_zh = "已撤锚：隐私政策 §4 只说明个人信息可能提供给「位于境外或新加坡」的接收方，属披露与接收方所在地条款，不构成对处理地的表述。"

[product.role]
kind = "processor"
anchor = "intl-tos-9-personal-data-processor"

[[product.role.point]]
text = "International-site conclusion: the contract expressly designates the platform a processor. Terms §9: \"You agree that any processing of personal data submitted through ModelScope.AI is for your purposes and on your behalf only, and you remain responsible for complying with all applicable data protection requirements in relation to such personal data\", and it further requires the user to warrant that all consents for uploading personal data have been obtained and the required notices given to the individuals concerned. §9 also provides that the user's consents \"supplement and do not supersede\" the existing privacy policy consents, so the two texts run in parallel. Alongside this, the Privacy Policy still describes collection and use with Alibaba Cloud itself as the subject (§3 purposes, §6 legitimate interests), producing a two-layer structure: processing positioned as on your behalf at the terms-of-service level, with controller-style wording retained at the privacy-policy level. In addition, §6 declares that the IPR in trained/upgraded models and output belongs to the platform, which is in tension with a purely processor position (an ownership clause). The China-site role conclusion differs (see the top-level role)."
text_zh = "国际站结论：合同层明文自认受托处理方（processor）。Terms §9「You agree that any processing of personal data submitted through ModelScope.AI is for your purposes and on your behalf only, and you remain responsible for complying with all applicable data protection requirements in relation to such personal data」，并进一步要求用户保证已取得上传个人数据的全部同意、并已向相关个人提供告知。§9 另规定用户的同意「supplement and do not supersede」既有的隐私政策同意，即两套文本并行。与此并存的是 Privacy Policy 仍以 Alibaba Cloud 自身为主体描述收集使用（§3 目的、§6 合法利益），二者构成「服务条款层面把处理定位为 on your behalf，隐私政策层面仍保留自身控制者表述」的双层结构。另 §6 声明训练/升级模型与 output 的 IPR 归平台所有，与「完全受托」的定位存在张力（成果归属条款）。中国站的 role 结论与此不同（见顶层 role）。"

