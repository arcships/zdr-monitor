[[product.training.point]]
text = "China-site conclusion: no explicit \"not used for training\" commitment exists, and one clause counts the other way — Privacy Policy §2.6.1 states that the support-channel records it collects are used \"to improve the service\", which this ledger's rule (\"used to improve the service / improve quality\" counts as training) records as mark=no with mode=not_disclosed. There is still no admission that \"the platform uses API inputs/outputs to train or optimize models\", and the absence of such an admission must not be read as the presence of a commitment. Checked: the full text of both China-site agreements (User Agreement 2025-08-27, Privacy Policy 2024-06-05) plus every policy-type document on the docs site (content compliance review, AI ethics initiative, the three API-Inference pages, the Magicube credit system, FlexTrain, deployment introduction). The word \"training\" appears in only three places on the China site, none of them about the platform training on user data: (1) User Agreement §4.1(8) \"in order to improve your experience, this community may provide you with a certain amount of free computing resources, which you may use for model training and other related development activities\" — this is **the user training their own model on the platform's free compute** (with a requirement to credit \"this model was trained with technical support from the ModelScope community\"), the opposite direction from \"the platform trains on your data\""
text_zh = "中国站结论：没有「不用于训练」的明确承诺，且有一条反向口径——隐私政策 §2.6.1 把客服渠道收集的记录写明「用于改进服务」，按本台账口径（「用来改进服务/提高质量」算训练）记 mark=no、mode=not_disclosed。仍然没有「平台使用 API 输入/输出训练或优化模型」的自认——不得把「没有承诺」当成「有自认」来解读。原绑的 §3.2.1 授权清单只界定用户内容许可的范围（列举托管、存储、传输、公开展示等，未含模型训练），它既未授权也未排除平台训练，不构成对本维度的表述，已撤锚；查阅范围见 searched。核过中国站两份协议全文（用户协议 2025-08-27、隐私政策 2024-06-05）+ docs 站全部政策类文档（内容合规审查、AI 伦理倡议书、API-Inference 三页、魔粒体系、FlexTrain、部署简介）。「训练」一词在中国站的分布只有三类，全部与平台使用用户数据训练无关：(1) 用户协议 §4.1(8)「为提升您的使用体验，本社区可能为您提供一定额度的免费计算资源，您可将其用于模型训练等相关开发活动」——这是**用户用平台免费算力训练自己的模型**（并要求标注「本模型训练获得魔搭社区技术支持」），方向与「平台拿你的数据训练」相反"

[[product.training.point]]
text = "(2) Privacy Policy §2.4.2 \"to try out online model debugging, training and deployment, you may choose to bind an Alibaba Cloud account\" — a user-side feature entry point"
text_zh = "(2) 隐私政策 §2.4.2「为体验模型在线调试、训练及部署能力，您可选择绑定阿里云账号」——是用户侧功能入口"

[[product.training.point]]
text = "(3) User Agreement §4.2.1(2), the compliance obligation of Studio creators for \"management of training data and generated content\" — the obligation falls on the creator. Two further clauses bearing on this dimension: Privacy Policy §2.3.2, which limits the purpose of collecting \"the text, voice, images and video you input, reply with or generate\" to \"providing you with those services\" and adds that the platform \"has the right to display your nickname, avatar and published content\""
text_zh = "(3) 用户协议 §4.2.1(2) 创空间创建者的「训练数据与生成内容管理」合规义务——义务落在创建者身上。另两条与本维度相关的条款：隐私政策 §2.3.2 把「您输入、回复、生成的文字、语音、图片、视频」收集目的限定为「为向您提供该等服务」并「有权展示您的昵称、头像和发布内容」"

[[product.training.point]]
text = "Privacy Policy §2.6.1 is the only China-site clause that carries a data object and says the information is used \"to improve the service\": \"When you request support or help from us through the customer-service channels we provide, you need to provide us with a description of the problem, and we will also need to collect your enquiry records, fault-report records and the troubleshooting process for your fault (such as **conversation or call recordings**); we will record and analyse this information so as to respond to your help request more promptly, and to improve the service.\" Under this ledger's rule that \"used to improve the service / improve quality\" counts as training, this is the basis for mark=no (mode=not_disclosed): the clause does not name model training, but it does not exclude it either, so a \"not used for training\" reading cannot be maintained. Scope limit to keep in view: the object is support-channel records (enquiry records, fault reports, troubleshooting process, conversation or call recordings) — **not API inference inputs/outputs** — so it does not show that inference request content is used for training; it is also narrower than the international site's Privacy Policy §6, which authorises product improvement over Personal Data generally."
text_zh = "隐私政策 §2.6.1 是中国站唯一一条带数据对象的「用于改进服务」表述：「当您通过我们提供的客服渠道请求我们支持或帮助时，您需要向我们提供问题描述，同时我们会需要收集您的咨询记录、报障记录和针对用户故障的排障过程（如**对话或通话记录**），我们将通过记录、分析这些信息以便更及时响应您的帮助请求，以及用于改进服务。」按本台账口径（「用来改进服务/提高质量」算训练），这是 mark=no（mode=not_disclosed）的依据：该条没有点名模型训练，但也没有把模型训练排除在外，故不能维持「不用于训练」的读法。需保留的限定：对象是客服渠道记录（咨询记录、报障记录、排障过程、对话或通话记录），**不是 API 推理输入/输出**，因此它不证明推理请求内容被用于训练；它也比国际站隐私政策 §6（对 Personal Data 的概括性产品改进授权）更窄。"
anchor = "cn-privacy-2-6-1-support-improve"

[[product.training.point]]
text = "The license list in User Agreement §3.2.1 is to host, store, transmit, publicly display, publicly perform, communicate to the public, reproduce, create derivative works and distribute, and **does not include model training or model optimization**. Two clauses pulling the other way must be recorded alongside: User Agreement §3.2.1(2) says plainly that \"we may access or share your private user content in accordance with what is set out in our privacy policy\", and §4.1(2) reserves the right to review user content (including Demo inputs, see the content compliance review document) by technical or human means. Uncertainties: (a) the privacy policy gives no affirmative \"not used for training without explicit authorization\" commitment of the kind PPIO gives, and no switch for any training purpose"
text_zh = "用户协议 §3.2.1 的授权清单是托管、存储、传输、公开展示、公开表演、向公众传播、复制、创建衍生作品、分发，**不含模型训练/模型优化**。另有两条反向张力的条款须并列：用户协议 §3.2.1(2) 明说「我们可能会根据我们的隐私政策中规定的内容访问或分享您的私有用户内容」，§4.1(2) 保留对用户内容（含 Demo 输入，见内容合规审查文档）的技术或人工审核权。不确定性：(a) 隐私政策没有像 PPIO 那样给出「未经明确授权不用于训练」的正面承诺，也没有给出任何训练用途的选项开关"

[[product.training.point]]
text = "(b) On the API-Inference path, the public documentation says only that \"compute is provided by Alibaba Cloud\", and whether Alibaba Cloud retains or trains on inputs and outputs is not disclosed in this vendor's documents"
text_zh = "(b) API-Inference 的推理链路上，公开文档只写「由阿里云提供算力支持」，阿里云侧对输入输出是否留存/训练未在本家文档披露"

[[product.training.point]]
text = "(c) This conclusion covers the China site only"
text_zh = "(c) 本结论只覆盖中国站"

[[product.training.point]]
text = "The international site has its own separate conclusion."
text_zh = "国际站另有独立结论。"

