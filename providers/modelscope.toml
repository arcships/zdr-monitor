[[product.zdr.point]]
text = "International-site conclusion: neither the Terms nor the Privacy Policy contains a zero data retention / zero retention / not-stored-after-the-request commitment, switch or application method (the keywords zero, retention and retain return zero hits in the Terms, and in the Privacy Policy appear only in an unrelated reservation-of-rights context). The international site has no public DPA and no trust/compliance page. Recorded as not_found under the rules, and not read in reverse as \"the vendor refuses ZDR\"."
text_zh = "国际站结论：Terms 与 Privacy Policy 全文均无 zero data retention / 零保留 / 请求完成后不存储 的承诺、开关或申请方式（关键词 zero、retention、retain 在 Terms 中零命中，Privacy Policy 中仅出现于无关的权利保留语境）。国际站没有公开的 DPA、没有 trust/compliance 页。按规则记 not_found，不反向解读为「厂商拒绝 ZDR」。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "intl-tos-8-data-removal"

[[product.retention.point]]
text = "International-site conclusion: no retention period is laid down at all; the only relevant provision is a disclaimer-style \"data may be removed\". Terms §8: \"Whether or not we make available backup services or tools from time to time (this being at our sole and absolute discretion), it is your sole responsibility to take appropriate measures to backup copies of data that you require. Your use of ModelScope.AI may result in data provided to or stored by us being removed or rendered inaccessible from time to time, even if not marked for deletion or destruction by you\" — backup and data continuity are placed entirely on the user"
text_zh = "国际站结论：没有任何保留期限规定，唯一相关的是一条免责式的「数据可能被移除」。Terms §8「Whether or not we make available backup services or tools from time to time (this being at our sole and absolute discretion), it is your sole responsibility to take appropriate measures to backup copies of data that you require. Your use of ModelScope.AI may result in data provided to or stored by us being removed or rendered inaccessible from time to time, even if not marked for deletion or destruction by you」——把备份与数据存续责任完全推给用户"

[[product.retention.point]]
text = "§7 reserves the right to remove \"any content stored on any systems associated with ModelScope.AI\" at any time. The Privacy Policy has no retention clause at all (only the §7 cookies wording \"we shall retain all rights, title and interest in … analytics data\", a reservation of rights unrelated to retention periods). Recorded as duration_kind=unspecified: neither a ceiling nor a floor. Uncertainty: whether international-site inference request logs are kept, and for how long, is not disclosed."
text_zh = "§7 保留随时移除「any content stored on any systems associated with ModelScope.AI」的权利。Privacy Policy 全文没有 retention/retain 条款（只有 §7 cookies 的「we shall retain all rights, title and interest in … analytics data」这种权利保留表述，与保留期限无关）。结论按 duration_kind=unspecified 记录：既无上限也无下限。不确定性：国际站的推理请求日志是否留存、留存多久，公开文档未披露。"

[[product.retention.point]]
text = "Terms §3.5 also grants an express storage right, but its object is limited and it fixes no period: the user \"expressly authorise[s] and consent[s] to us: (i) using and storing User Content that is not personal data to develop and improve our machine-learning and artificial-intelligence technologies; and (ii) processing and storing such User Content outside of the jurisdiction where you are using ModelScope.AI\". Two limits to keep: the object is User Content **that is not personal data** (so it is not an authorisation to store personal data), and it is a permission to store rather than a retention period — no number of days can be derived from it."
text_zh = "Terms §3.5 另给出一项明示的存储授权，但对象有限、也不含期限：用户「expressly authorise[s] and consent[s] to us: (i) using and storing User Content that is not personal data to develop and improve our machine-learning and artificial-intelligence technologies; and (ii) processing and storing such User Content outside of the jurisdiction where you are using ModelScope.AI」。两点限定要保留：对象是**非个人数据**的 User Content（不构成对个人数据存储的授权），且它是存储许可而非保留期限——不能由此推出任何天数。"
anchor = "intl-tos-3-5-improve-ml-technologies"

