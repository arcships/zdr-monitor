note = "国际站《Privacy Policy》，Last updated March 1, 2025，主体 Alibaba Cloud (Singapore) Private Limited 及其关联公司（开篇），§11 适用新加坡法律，DPO 联系地址在香港铜锣湾。全文没有存储地域条款、没有保留期限条款、没有零保留条款；与数据处理最接近的是 §3.1（为提供服务与履行合同而收集使用）、§3.3 Additional Purposes（营销类）、§4（可向境外与新加坡的关联公司、服务商披露）、§6（基于合法利益「improving our products, services, processes or business」）。对 training 维度而言 §6 是本家最宽的一条自我使用授权，但仍未点名模型训练。"

[[source]]
url = "https://resouces.modelscope.ai/document/docdata/2026-9-1_19-48-INTL_EN/dist/agreements/terms/terms_INTL_EN.md"
channel = "contract"
tier = "core"
note = "国际站（modelscope.ai）《Terms and Conditions》，Last updated August 21, 2025，主体 Alibaba Cloud (Singapore) Pte Ltd（§1 首段）。与中国站是不同法律实体、不同文本，不可混用。§3.1 定义 User Content，§3.2 是用户内容授权条款（许可措辞为 access/use/host/modify/…，未点名 training），§3.11 是免费算力供用户训练自己模型的条款（与中国站 §4.1(8) 同旨），§6 声明训练/升级模型与 output 等 IPR 归平台，§7 保留移除平台上存储内容的权利，§8 明确用户须自行备份、平台存储的数据可能被删除，§9 是个人信息处理角色条款（明文「for your purposes and on your behalf only」）。全文无 retention 期限、无 ZDR；全文没有「平台使用输入训练模型」的自认（字面成立），但 §3.5 的措辞是 develop and improve … machine-learning and artificial-intelligence technologies，未点名 training / model training（§3.11 的 model training 是用户用免费算力训练自己的模型），它明文授权平台「using and storing User Content that is not personal data to develop and improve our machine-learning and artificial-intelligence technologies」（对象限定为非个人数据的 User Content），属合同层对平台自我使用的授权，故不能再说全文没有平台自用的条款。"

