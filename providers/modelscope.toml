  "https://resouces.modelscope.ai/document/docdata/2025-7-22_10:50/dist/User%20Agreement/User%20Agreement%20And%20Privacy%20Policy.md",
  "https://modelscope.ai/protocol/Privacy-Policy",
  "https://modelscope.ai/protocol/Terms-and-Condition",
  "https://modelscope.ai/api/v1/document/main_doc_INTL_EN_prod",
]

[[product.training.point]]
text = "International-site conclusion: the contract itself carries the platform's own-use authorisation, so the \"nothing found\" reading no longer holds. Terms §3.5: \"we may process any User Content to improve our services and/or develop new products and services (including without limitation for our internal business purposes and/or for other customers). You hereby expressly authorise and consent to us: (i) using and storing User Content that is not personal data to develop and improve our machine-learning and artificial-intelligence technologies; and (ii) processing and storing such User Content outside of the jurisdiction where you are using ModelScope.AI\". Two limits must be kept when reading it: the wording is \"develop and improve … machine-learning and artificial-intelligence technologies\", not \"train models\", and the express authorisation in (i) is confined to User Content **that is not personal data**. It is nevertheless contract-level, which outranks the privacy policy in this ledger's order of authority, so it is the primary evidence for this row. The user content license in international Terms §3.2 is worded \"to access, use, host, modify, communicate, reproduce, adapt, make derivative works of, publish, perform, and/or distribute any User Content\" — \"use\" is broad, but training or model training never appears anywhere as a platform purpose"
text_zh = "国际站结论：合同层自带平台自我使用的授权，「全文没有」的读法不再成立。Terms §3.5「we may process any User Content to improve our services and/or develop new products and services (including without limitation for our internal business purposes and/or for other customers). You hereby expressly authorise and consent to us: (i) using and storing User Content that is not personal data to develop and improve our machine-learning and artificial-intelligence technologies; and (ii) processing and storing such User Content outside of the jurisdiction where you are using ModelScope.AI」。读这条要保留两个限定：措辞是「develop and improve … machine-learning and artificial-intelligence technologies」而非「train models」；(i) 的明示授权只限**非个人数据**的 User Content。但它属合同层，在本台账的权威顺序里高于隐私政策，故为本行主证据。国际站 Terms §3.2 的用户内容许可措辞是「to access, use, host, modify, communicate, reproduce, adapt, make derivative works of, publish, perform, and/or distribute any User Content」——「use」很宽泛但全文没有出现 training 或 model training 作为平台用途"
anchor = "intl-tos-3-5-process-user-content"

[[product.training.point]]
text = "§3.11's \"free computing resources for model training\" matches China-site §4.1(8): users training their own models. The privacy-policy counterpart is the legitimate-interest basis in §6, \"for improving our products, services, processes or business, understanding customer preferences and personalising experiences and recommendations\" — a general product-improvement authorization that does not name training and rests on legitimate interests rather than the user's express grant. §6 also carries an IPR clause stating that \"trained/upgraded models, output, analytics results … shall be solely and absolutely owned by us\", which is an ownership clause and not an admission of using inputs for training. Uncertainty: the international site has no separate API terms, and whether model inference request content is used for training is not answered in the public texts."
text_zh = "§3.11 的「free computing resources for model training」与中国站 §4.1(8) 同旨，是用户自己训练模型。隐私政策一侧的对应条款是 §6 基于合法利益的「for improving our products, services, processes or business, understanding customer preferences and personalising experiences and recommendations」——这是「改进产品」的概括授权，未点名训练，且属合法利益基础而非用户明示授权。另有 §6 IPR 条款声明「trained/upgraded models, output, analytics results … shall be solely and absolutely owned by us」，是成果归属条款，不构成「使用输入训练」的自认。不确定性：国际站没有面向 API 的单独条款，模型推理请求内容是否被训练在公开文本中无答案。结构化结论：本档按口径「厂商写『用于提高质量/改进服务』而不提训练即按会训练算」记 mark=no——该句是平台自我使用用户数据的概括授权，未把模型训练排除在外。"
anchor = "intl-privacy-6-legitimate-interests"

[[product.training.point]]
text = "Terms §3.5 also covers usage-side telemetry: \"we may collect performance and usage metrics and data regarding your access and/or use of ModelScope.AI, including model versions, inferences, upload times, as well as processing, diagnostic and other data, and we may use such metrics and data to improve the quality and other aspects of ModelScope.AI and its underlying technologies\". Object limit: these are metrics and data about your access and/or use of ModelScope.AI (model versions, inference records, upload times, processing and diagnostic data) — **not the body of your requests**. It is same-direction support for mark=no (the platform uses data generated by your use to improve itself and its underlying technologies), and it must not be read as direct evidence that request content is retained or used for training."
text_zh = "Terms §3.5 另覆盖使用侧遥测：「we may collect performance and usage metrics and data regarding your access and/or use of ModelScope.AI, including model versions, inferences, upload times, as well as processing, diagnostic and other data, and we may use such metrics and data to improve the quality and other aspects of ModelScope.AI and its underlying technologies」。对象限定：这是关于你访问/使用情况的度量与数据（模型版本、inferences 记录、上传时间、处理与诊断数据），**不是请求正文**。它同向支持 mark=no（平台用你的使用所产生的数据改进自身及其底层技术），但不能读成「请求正文被留存或被用于训练」的直接证据。"
anchor = "intl-tos-3-5-usage-metrics"

