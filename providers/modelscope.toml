note = "中国站《ModelScope 用户协议》，版本生效日期 2025-08-27（页首自述，正文内不含该日期），签约主体上海魔搭科技有限公司（§1.1）。覆盖魔搭社区中国站全部服务：§1.1 界定范围为「魔搭社区Web端、未来可能开发的App、小程序及其他随技术发展出现的新形态载体」，即包含 API-Inference、创空间、模型/数据集托管、模型服务（部署/训练）等，没有按档位拆分的单独条款。本协议是 training/role 维度的合同层主要来源；§3.2.1 是内容授权条款（授权清单为托管/存储/传输/展示/复制/衍生作品/分发，未含模型训练或模型优化）；§4.1(8) 是「免费计算资源供用户自己训练模型」的条款（方向与「平台用你的数据训练」相反，见 training 维度说明）；§9.2.1 与 §10.2 分别支撑 retention 与 processing_region 的边界。全文未出现「零数据保留/ZDR」字样，未出现「API 推理输入输出不用于训练」类承诺，也未出现任何量化保留期限。URL 说明：这是官方前端经 /api/v1/document/main_doc_CN_prod 取得 TargetPrefix（当前为 .../docdata/2026-9-10_15-4-CN）后拼接的构建产物，canonical 稳定入口为 https://modelscope.cn/protocol/用户协议（SPA，r.jina.ai 抓不到正文）。"

