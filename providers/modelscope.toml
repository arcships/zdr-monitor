[[product.zdr.point]]
text = "Removed anchor: §3.2.1(2) \"we will use reasonable and appropriate measures to keep your content confidential ... however, we may access or share your private user content as provided in our privacy policy\" is a confidentiality clause with a carve-out, not a statement about zero retention; it neither promises nor denies ZDR, so it is not a statement on this dimension. Search scope is recorded in searched."
text_zh = "已撤锚：§3.2.1(2)「我们将使用合理和适当的措施来保密您的内容……然而，我们可能会根据我们的隐私政策中规定的内容访问或分享您的私有用户内容」是保密义务条款加例外口子，不是关于零保留的表述——既不承诺也不否认 ZDR，故不构成对本维度的表述。查阅范围见 searched。"

[[product.zdr.point]]
text = "China-site conclusion: no zero data retention (ZDR) commitment, switch or application path exists in any public document. Scope checked: User Agreement, Privacy Policy, content compliance review, AI ethics initiative, API-Inference usage limits / introduction / API-Provider, the Magicube credit system, FlexTrain, deployment introduction, the two stable protocol entry points (SPAs whose body r.jina.ai cannot fetch and whose direct HTML has no embedded body), and the official document version API. The keywords \"zero data retention / zero retention / not stored / not written to disk / not retained / deleted once the request is processed\" return zero hits in the full text of both agreements (and zero hits in the two English international-site documents). Three observations that are incompatible with, or at least do not support, ZDR (not equivalent to \"the vendor refuses ZDR\"): (1) User Agreement §3.2.1 grants an \"irrevocable\" license to host, store and distribute content, and §3.2.1(2) states expressly that private user content may be accessed"
text_zh = "中国站结论：全部公开文档中不存在零数据保留（ZDR）承诺、开关或申请入口。核过的范围：用户协议、隐私政策、内容合规审查、AI 伦理倡议书、API-Inference 使用限制/介绍/API-Provider、魔粒体系、FlexTrain、部署简介、两个 protocol 稳定入口（SPA，r.jina.ai 抓不到正文，直连 HTML 亦无内嵌正文）、官方文档版本 API。关键词「零数据保留 / 零保留 / 不存储 / 不落盘 / 不留存 / 请求处理完成后删除 / zero retention」在两份协议全文零命中（国际站英文两份亦零命中）。三条与 ZDR 相斥或至少不支持的观察（不等价于「厂商拒绝 ZDR」）：(1) 用户协议 §3.2.1 给出「不可撤销」的内容托管/存储/分发授权，§3.2.1(2) 明确可能访问私有用户内容"

[[product.zdr.point]]
text = "(2) Privacy Policy §6.2 sets a \"period necessary for the purpose\", not per-request immediate deletion"
text_zh = "(2) 隐私政策 §6.2 是「目的所需期限」而非请求级即时删除"

[[product.zdr.point]]
text = "(3) The content compliance review document states that the platform reviews \"the input of model Demos\" by technical or human means — review means the input can be accessed on the platform's side. Recorded as not_found under the ledger's rules: the absence of public evidence is not the same as the vendor not offering ZDR"
text_zh = "(3) 内容合规审查文档说明平台会对「模型Demo的输入」做技术或人工审核——审核意味着输入在平台侧可被接触。按台账规则记 not_found：拿不到公开证据 ≠ 厂商不提供 ZDR"

[[product.zdr.point]]
text = "This vendor has no enterprise privacy FAQ, no public DPA and no trust/security compliance page to check (no document of that kind exists in the full enumeration of the docs site index)."
text_zh = "本家没有企业版隐私 FAQ、没有公开 DPA、没有 trust/security 合规页可查（docs 站 index 全量枚举中不存在这类文档）。"

