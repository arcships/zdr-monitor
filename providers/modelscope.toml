note = "中国站《隐私政策》，版本生效日期 2024-06-05（页首自述），运营方上海魔搭科技有限公司（开篇自述「作为魔搭社区的运营方」）。§1.1 适用范围覆盖「魔搭社区通过Web端、未来可能开发的App、小程序……向您提供的各项产品和服务」，§1.2 排除第三方自行提供的服务；§1.1 另规定「若我们及关联公司在社区内向您提供的产品或服务内设有单独隐私政策或类似法律文件，该等单独的文件优先适用」——实测中国站不存在 API-Inference 或模型服务档的单独隐私文件（见 dist/index.json 全文枚举）。本政策是 retention / processing_region / role 维度的主要来源：§2.3.1 把「您输入、回复、生成的文字、语音、图片、视频」纳入用户内容，§6.2 为保留期限条款，§6.6 为存储地域条款，§3.1 为委托处理条款，附录把「对话内容」列为日志信息的组成部分。全文未出现「零数据保留/ZDR/不存储请求内容」类表述，未出现量化保留天数，也未出现「平台使用 API 输入输出训练模型」的自认。"

