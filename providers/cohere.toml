[[source]]
url = "https://cohere.com/enterprise-data-commitments"
channel = "enterprise_privacy_faq"
tier = "core"
note = "覆盖 Cohere SaaS Platform 的付费企业档(api 档的主来源),页脚 Last Update: December 5, 2025。开篇即限定:私有部署与第三方云 AI/ML 平台上 Cohere 不接收任何 prompts/generations;FAQ 首条把适用范围限定为「有信用卡在账的付费客户」,并明确试用 API key 的数据走 Terms of Use + Privacy Policy。训练开关、30 天保留、ZDR、DPA 四类条款都在本页。"

[[source]]
url = "https://cohere.com/privacy"
channel = "consumer_privacy"
tier = "core"
note = "Cohere 隐私政策(个人数据口径)。第1节界定适用范围:不适用于企业协议下 Enterprise Users 的 Customer Data(输入输出,由企业协议 + DPA 管辖),也不适用于私有/第三方部署;第2.3节按 Trial User/Researcher 与 Enterprise User 分别说明训练相关处理;第4节给出 Platform 输入输出对 Enterprise Users 一般保留 30 天。"

[[source]]
url = "https://cohere.com/saas-agreement"
channel = "contract"
tier = "contradiction"
note = "与 core 文档 https://cohere.com/enterprise-data-commitments 对 api 档(SaaS Platform 付费 API 客户)的 training(以及 retention)表述方向相反。本文件(Last updated: April 8, 2025)§3(a)(iii) 原句:『CUSTOMER GRANTS TO COHERE A NONEXCLUSIVE, WORLDWIDE, ROYALTY-FREE, IRREVOCABLE, SUBLICENSABLE, AND FULLY PAID-UP RIGHT TO ACCESS, COLLECT, USE, PROCESS, STORE, DISCLOSE AND TRANSMIT CUSTOMER DATA TO: … (III) IMPROVE AND ENHANCE THE SERVICES AND COHERE’S OTHER OFFERINGS AND BENCHMARK THE FOREGOING, INCLUDING BY SHARING API DATA AND FINETUNING DATA WITH THIRD PARTIES WHO MAY USE THE FINETUNING DATA AND API DATA TO PROVIDE SERVICES TO COHERE AND FOR OTHER PURPOSES PERMITTED UNDER THEIR TERMS AND CONDITIONS』,§13(4) 另称『Cohere will have no obligation to delete or otherwise render inaccessible any API Data or Finetuning Data submitted by Customer to Cohere in accordance with Section 3(a)(iii)』;core 文档原句:『You can opt out from your prompts and generations being used to train Cohere models in your dashboard settings at any time.』『If you are opted out, prompts and generations will not be used to train Cohere models.』『We automatically delete logged prompts and generations after 30 days』。差异实质:合同层明确排除可撤销性(IRREVOCABLE)、允许把 API Data/Finetuning Data 交第三方按第三方条款使用、终止后对该许可项下数据无删除义务;政策层却让客户以为可随时退出、退出即不训练、记录 30 天删除。四种解释逐一排除——①范围:两份都覆盖 Cohere SaaS Platform 的付费 API 客户(本文件首段『the customer accessing, downloading, installing or otherwise using … the Cohere API SaaS Services』并以首次使用为生效点;EDC 首条 FAQ『Our Enterprise Data Commitments apply to enterprise data of our commercial, paying customers. For the SaaS Platform, this means customers who have a credit card on file in their account』),不是 API 与消费产品/网页对话之分,且 EDC 已把 trial API key 档明确划给 Terms of Use + Privacy Policy,两者重叠的只剩付费档;②档位:同为付费 API 档,非企业版/个人版或按量/订阅套餐之分;③站点:同一法律实体 Cohere Inc.(本文件首段『Cohere Inc. … 171 John Street, Suite 200, Toronto』)与同一官方域名 cohere.com,非国内站/国际站之分;④时效:两份均为现行且并非同一文档的新旧版本(本文件 Last updated: April 8, 2025;EDC Last Update: December 5, 2025),EDC 更新更晚但未声明取代或修改本协议,本文件 §14(j) 反而主张 entire agreement、§14(k) 允许 Cohere 单方修订(修订须更新 Last updated,现仍为 2025-04-08,即未被修订),故不能按『旧版被新版取代』处理。需厂商澄清:dashboard 的 opt-out 开关是否构成对 §3(a)(iii) 不可撤销许可的合同性限缩。"

[[source]]
url = "https://cohere.com/terms-of-use"
channel = "contract"
tier = "core"
note = "Website Terms of Use。按 EDC 的界定,它连同 Privacy Policy 一起治理「用 trial API key 访问 SaaS Platform」的数据,即 api 档内的试用/自助子档;§4(a) 给 Cohere 使用 Customer Data(含 API Data、Finetuning Data)改进和增强 Cohere Solution 的许可,并可向第三方分享 Finetuning/API Data。原文此处有厂商笔误「OFFERINfGS」,锚点按原样保留。"

[[source]]
url = "https://trustcenter.cohere.com/"
channel = "enterprise_privacy_faq"
tier = "core"
note = "Cohere Trust Center(secureframetrust 托管、官方域名,页内 FAQ)。可引条款集中在 FAQ 段:托管中心与处理地、DPA 是否可得与其承诺要点(SCC / Annex B 安全措施 / 政府调取通知)、TIA、子处理者、HIPAA 边界。页面主体是认证徽章与资源清单,classify() 命中行数在阈值下限(3 行),已人工确认 FAQ 段落含可定位的「主体×动作」条款,判 policy。"

[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "training-optout-enterprise"

[[product.training.point]]
text = "The only training clause in the public material is an opt-out: \"You can opt out from your prompts and generations being used to train Cohere models in your dashboard settings at any time.\" Prompts and generations are therefore used to train Cohere models unless the customer switches it off — recorded as mark=no with mode=opt_out, not as undisclosed."
text_zh = "公开材料里唯一的训练条款是 opt-out：「You can opt out from your prompts and generations being used to train Cohere models in your dashboard settings at any time.」即默认会用于训练 Cohere 模型、客户可随时在控制台关闭，故记 mark=no + mode=opt_out，不是「未披露」。"

[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "zdr-definition"

[product.retention]
days = 30
object = "input_output"
basis = "fixed_period"
anchor = "retention-30d-logged-prompts"

[product.processing_region]
codes = ["US"]
anchor = "region-gcp-us-central"

[product.role]
kind = "processor"
anchor = "role-dpa-on-behalf"

