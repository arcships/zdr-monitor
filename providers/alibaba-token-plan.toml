[[product]]
id = "token-plan-personal"
badge = "国际站个人版"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "yes"
mode = "default"
anchor = "training-model-studio-no-dev-improve"

[[product.training.point]]
text_zh = "例外是你自己另行授权：条款写的是 unless you separately provide your consent——没单独同意就不会拿去开发或改进 Model Studio 的模型。"

[[product.training.point]]
text = "Contract level, same direction: Membership Agreement §4.1 \"We will not access or use your Member Content except as necessary to maintain or provide the Services or as necessary to comply with applicable laws or regulations.\" Member Content includes Input and Output (Product ToS §4.48.1(b)), so this is a contract-level limit on the use of request content, training use included."
text_zh = "合同级、与 §4.48.1(e) 同向：会员协议 §4.1「We will not access or use your Member Content except as necessary to maintain or provide the Services or as necessary to comply with applicable laws or regulations.」——Member Content 含 Input 与 Output（Product ToS §4.48.1(b)），是对请求内容使用（含训练用途）的合同级限制。"
anchor = "retention-use-limited-to-service"

[[product.training.point]]
text = "Scope limit: the no-training commitment is Alibaba Cloud's own commitment about Member Content. For an AI model, application or service provided by a third party and listed on Model Studio (\"Third-party Service\"), Product ToS §4.48.1(f) requires the customer to review, accept and abide by the third-party terms before use, and states that \"Alibaba Cloud does not control or develop the Third-party Services\" — so the extent to which the no-training commitment covers third-party branded models inside a tier is not disclosed at tier level. Both tier pages list third-party branded models (e.g. DeepSeek)."
text_zh = "适用限定：不训练承诺是 Alibaba Cloud 自身对 Member Content 的使用承诺。对列在 Model Studio 上、由第三方提供的 AI 模型/应用/服务（「Third-party Service」），Product ToS §4.48.1(f) 要求客户先审阅并接受第三方条款，并写明「Alibaba Cloud does not control or develop the Third-party Services」——该不训练承诺对档内第三方品牌模型的覆盖范围没有档位级披露。两档档位页都列有第三方品牌模型（如 DeepSeek）。"
anchor = "scope-third-party-service-own-terms"

[[product.training.point]]
text = "The telemetry page notes \"Inference logs can be recycled into training datasets\" (Log backflow). This is not the default behaviour: inference logs must be enabled manually and are written to the customer's own SLS Logstore, and the page does not say whose training datasets they are recycled into."
text_zh = "监控页另有「Inference logs can be recycled into training datasets」（Log backflow）。这不是默认行为：推理日志必须手动开启，且写入客户自己的 SLS Logstore；该页没有说明是回收进谁的数据集。"
anchor = "training-inference-logs-log-backflow"

[product.zdr]
mark = "no"
anchor = "zdr-stores-call-data"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "retention-delete-on-termination"

[[product.retention.point]]
text = "Contract level: DPA Appendix 1, the row \"The period for which the personal data will be retained, or, if that is not possible, the criteria used to determine that period:\" is answered with \"Data will be processed and transferred for the duration of the Agreement.\" — object is Data/personal data, term is the duration of the Agreement. Scope: the DPA applies only where Data Protection Legislation (GDPR/UK GDPR etc.) requires it, and this is an SCC appendix entry, so it is not a request-level retention period; basis stays undisclosed."
text_zh = "合同级：DPA 附件一「The period for which the personal data will be retained, or, if that is not possible, the criteria used to determine that period:」一栏的答案是「Data will be processed and transferred for the duration of the Agreement.」——对象是 Data/个人数据，期限＝协议存续期。适用范围：DPA 仅在数据保护法（GDPR/UK GDPR 等）要求时适用，且该栏属 SCC 附件填写，不是请求级保留期限，basis 维持 undisclosed。"
anchor = "retention-duration-of-agreement"

[[product.retention.point]]
text = "Contract level: DPA §4(g) — at the customer's choice Alibaba Cloud deletes or returns all Data following termination of the Agreement, except where it is required or permitted by law to retain some or all Data, or Data archived on back-up systems (which it must isolate from further processing). Closer to a deletion commitment than Appendix 1, but still not a request-level quantified retention period."
text_zh = "合同级：DPA §4(g)——协议终止后由客户选择删除或返还全部 Data；法律要求或许可保留、以及备份归档的数据除外（须隔离、不再处理）。比附件一更接近删除承诺，但仍不是请求级的量化保留期限。"
anchor = "retention-dpa-delete-or-return-on-termination"

[[product.retention.point]]
text = "Retention objects must be split: by default Model Studio stores monitoring metrics and audit logs on the platform with no retention period disclosed, and audit logs capture the request information of each model call (Request ID, time, model, token usage, latency, status) but not the Prompt or Response content."
text_zh = "保留对象要分开：默认情况下 Model Studio 在平台侧存储监控指标与审计日志，未披露保留期限；审计日志记录每次模型调用的请求信息（Request ID、时间、模型、token 用量、时延、状态），不含 Prompt/Response 正文。"
anchor = "retention-metrics-logs-stored-by-default"

[[product.retention.point]]
text = "Inference logs, the only logs that record the complete Prompt and Response, are not on by default — they must be enabled manually and rely on log delivery to write logs to the customer's own Simple Log Service (SLS) Logstore."
text_zh = "记录完整 Prompt/Response 的推理日志默认不开启——必须手动开启，并依赖日志投递写入客户自己的 Simple Log Service (SLS) Logstore。"
anchor = "retention-inference-logs-own-logstore"

[[product.retention.point]]
text = "The \"Last 7 days by default; supports querying logs for up to 30 days\" on the same page is the console query window, not a retention period."
text_zh = "同页「Last 7 days by default; supports querying logs for up to 30 days」是控制台查询窗口，不是保留期。"
anchor = "retention-log-query-window-30d"

[product.processing_region]
codes = ["SG", "global"]
anchor = "region-personal-global-inference"

[product.role]
kind = "processor"
anchor = "role-appoint-alibaba-cloud-as-processor"

[[product.role.point]]
text = "Exception, contract level: Product ToS §4.48.2(c) — model inference services offered by Third Party Vendors of Alibaba Cloud Marketplace (\"Third-party Model Service\") are also listed and made available on Model Studio, and \"Alibaba Cloud does not perform the role of data processor or controller with respect to any personal data processed by such Third-party Model Service\". So where a Marketplace third-party model service is used, that part of the personal data falls outside the processor/controller role. Both tier pages list third-party branded models (the Team page says \"integrates Qwen and third-party models\"), but whether the models in a given tier are the same set as Third-party Model Service has no tier-level basis — the exception is scoped to Marketplace third-party model services."
text_zh = "例外（合同级）：Product ToS §4.48.2(c)——Alibaba Cloud Marketplace 第三方供应商提供的模型推理服务（「Third-party Model Service」）也列在 Model Studio 上并提供给客户，「Alibaba Cloud does not perform the role of data processor or controller with respect to any personal data processed by such Third-party Model Service」。即使用 Marketplace 第三方模型服务时，该部分个人数据不适用 processor/controller 角色。两档档位页都列有第三方品牌模型（团队版页写「integrates Qwen and third-party models」），但档内模型是否与 Third-party Model Service 是同一集合没有档位级依据，此例外仅限 Marketplace 第三方模型服务。"
anchor = "scope-third-party-model-service-not-processor"

