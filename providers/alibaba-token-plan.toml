channel = "contract"
tier = "core"
note = "国际站 Membership Agreement（2026-09-10 更新）。4.1 除维护/提供服务或遵守法律所必需外不访问、不使用 Member Content；8.5(b) 协议终止后删除 Member Content（法律要求保留除外）；文末『DATA PROCESSING ADDENDUM TO ALIBABA CLOUD MEMBERSHIP AGREEMENT』段明确在数据保护法适用时，我方就 Member Content 中的个人数据以 processor 身份处理。"

[[source]]
url = "https://www.alibabacloud.com/help/en/legal/latest/alibaba-cloud-international-website-product-terms-of-service-v-3-8-0"
channel = "contract"
tier = "core"
note = "国际站《Alibaba Cloud International Website Product Terms of Service》v3.8.0（2026-08-28 更新）第 4.48 节 Alibaba Cloud Model Studio。1.2 条确立 Additional Agreement 优先规则；4.48.1(b) 处理角色=为你的目的、代表你；4.48.1(e) 默认不用于开发或改进 Model Studio 上的模型，除非你另行同意；4.48.1(f) 第三方模型服务适用第三方条款；4.48.1(viii) 处理地=Alibaba Cloud 及其关联方/分包商设施所在国。本轮直连全文（198114 字）复核：**全篇 Coding Plan / Token Plan 命中 0 次**，即国际站 Product Terms 没有订阅档专属数据条款。"

[[source]]
url = "https://www.alibabacloud.com/help/en/legal/latest/fe2cxg"
channel = "contract"
tier = "core"
note = "国际站 Data Processing Addendum（/help/en/legal/latest/fe2cxg，Last Updated 2023-11-29；/help/zh/…/fe2cxg 为同文英文正文）。仅在 Data Protection Legislation（GDPR/UK GDPR 等）要求时适用。第 3 条：用户（controller 或 processor）委任 Alibaba Cloud 为其 processor，仅为向用户提供服务；4(a) 仅按书面指示处理；4(g) 终止后按用户选择删除或返还 Data（法律要求或备份归档除外）。role/retention 的合同级佐证。"

[[source]]
url = "https://www.alibabacloud.com/help/en/model-studio/model-telemetry"
channel = "developer_data"
tier = "core"
note = "国际站 Model Studio「Model monitoring」(2026-09-11 更新)。提供 retention 维度的官方分层证据:平台默认存储 monitoring metrics 与 audit logs(无期限披露);控制台日志查询窗口默认 7 天、最长 30 天;inference logs 默认关闭、开启后存到客户自己的 SLS Logstore。注意区分:查询窗口 ≠ 保留期。"

[[source]]
url = "https://www.alibabacloud.com/help/en/model-studio/privacy-notice"
channel = "enterprise_privacy_faq"
tier = "core"
note = "国际站英文『Security certifications and privacy』（合规资质与隐私说明，更新时间 2026-09-20）。两句话同页并存：①『will never use your data for model training』（无 Coding Plan 例外）②『In compliance with relevant laws and regulations, Alibaba Cloud Model Studio stores data generated from model and application calls.』后者是 zdr 维度的直接依据（与零保留直接冲突）。"

[[source]]
url = "https://www.alibabacloud.com/help/en/model-studio/related-agreements"
channel = "developer_data"
tier = "core"
note = "国际站 Model Studio「Related agreements」(2026-09-20 更新),逐条列出适用于国际站 Model Studio 的协议共 6 条:国际站 Product Terms、Model Inference SLA、Membership Agreement、International Website Privacy Policy、Open Source Model License Terms、第三方供应商条款。中国站《阿里云百炼服务协议》不在其中——这是判定「中国站协议不能作本档证据」的直接依据。"

[[source]]
url = "https://www.alibabacloud.com/help/en/model-studio/token-plan-overview"
channel = "developer_data"
tier = "core"
note = "国际站 Token Plan 总览档位文档,覆盖 Personal(Lite/Essential/Standard/Pro/Extra Bundle)+ Team(Standard/Pro/Max seat + Shared quota pack)两版。数据相关只有两句:Team 段「guarantees that your data will not be used for model training」与「仅新加坡地域」;Personal 段无任何数据条款。training 主证据仍用 Product Terms §4.48.1(e)。"

[[source]]
url = "https://www.alibabacloud.com/help/en/model-studio/token-plan-personal-overview"
channel = "developer_data"
tier = "core"
note = "国际站 Token Plan 个人版档位文档(Personal Lite/Essential/Standard/Pro + Extra Bundle)。逐段核对(计费、额度、模型清单、订阅管理、订阅前须知):全篇无 training / retention / zdr / role 任何表述,只有「Region and data transfer」一条地域与跨境传输说明。这是「Personal 档没有档位级训练承诺」的正面证据(不是厂商承诺不训练,而是该页根本不谈数据用途,只能回到合同层 §4.48.1(e))。"

[[source]]
url = "https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview"
channel = "developer_data"
tier = "core"
note = "国际站 Token Plan 团队版档位文档(Team Standard/Pro/Max seat + Shared quota pack)。两处明文「对话数据不用于模型训练」,是 Team 档的档位级佐证;另有「integrates Qwen and third-party models」一句,说明档内模型含第三方品牌。无留存/ZDR/角色条款。"

