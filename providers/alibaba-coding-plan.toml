[product.training]
mark = "no"
mode = "opt_out"
anchor = "agr-training-codingplan-authorization"

[[product.training.point]]
text_zh = "本档结论：Coding Plan 的模型输入与模型输出被授权用于「服务改进与模型优化」（即训练/优化用途），value=yes。两层证据各自独立成立：(1) **国际站自有文档层**——国际站中文与繁体产品简介页在「我的数据安全吗？阿里云百炼会用我的数据进行训练吗？」问答下，把按量付费 API 与 Token Plan 团队版的不训练承诺与 Coding Plan 明确切开，写明『使用 Coding Plan 期间，模型输入及模型生成的内容将用于服务改进与模型优化』，并直链《阿里云百炼服务协议》第 5.2 条"

[[product.training.point]]
text_zh = "这一层不依赖该协议本身是否列入 related-agreements。(2) **合同层**——该协议 5.2.2 原文『您同意并授权我们和我们的关联公司存储并使用您使用Token Plan个人版（不包括Token Plan团队版）和/或Coding Plan服务期间因调用模型而输入以及模型输出的内容以实现我们的服务改进与模型优化』，且终止授权不涵盖已授权数据（5.2.2 后半句）。国际站 Product Terms 4.48.1(e) 的默认『不用于 develop 或 improve』由 1.2 条的「Additional Agreement 优先」规则处理：若百炼协议构成 Additional Agreement，则 4.48.1(e) 让位于 5.2.2"

[[product.training.point]]
text_zh = "订阅 Coding Plan 即构成 4.48.1(e) 所称的『另行同意』。反向证据（不掩盖）：①国际站英文、日文、印尼文、葡文产品简介页均只有无例外的『never use your data for model training』，例外只存在于 zh 与 tc"

[[product.training.point]]
text_zh = "②国际站 Coding Plan 概述与 FAQ（中英文）都没有『数据使用授权』条目，该条目只在国内站页面"

[[product.training.point]]
text_zh = "③国际站 related-agreements 清单（2026-09-20 更新）不含百炼服务协议，而该协议第 12.1 条适用中国大陆法律、签约主体为通义云启（杭州）。故 confidence=medium：结论方向明确（该档输入输出被授权用于改进与优化），但「哪一份文件在国际站正式管辖该档」未被国际站协议清单确认，英文口径亦未确认。"

