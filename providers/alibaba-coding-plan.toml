[[product.zdr.point]]
text_zh = "本档无 provider 级（顶层）zdr 判定块，证据即本档该锚点所指页面：国际站英文隐私说明页（Security certifications and privacy，锚点 pn-intl-en-zdr-stores-call-data）明示存储模型与应用调用数据，未见任何零保留模式表述。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "ma-retention-delete-on-termination"

[[product.retention.point]]
text_zh = "国际站合同层无请求级量化期限：Membership Agreement 8.5(b) 终止后删除 Member Content（法律要求保留除外）"

[[product.retention.point]]
text_zh = "DPA 4(g) 终止后按选择删除或返还"

[[product.retention.point]]
text = "**Boundary of §8.5(b)**: the next sentence in the same clause, §8.5(c), reads \"the licence granted by you to us to use your Member Content described in Clause 4.1 shall continue notwithstanding such suspension or termination\". Clause 4.1 is itself a no-access/no-use clause (\"We will not access or use your Member Content except as necessary to maintain or provide the Services or as necessary to comply with applicable laws or regulations.\"), so (c) is a boundary on the scope of the licence you grant us, not a statement that content is kept after termination. basis is unchanged"
text_zh = "**§8.5(b) 的边界**：同节下一句 §8.5(c)「the licence granted by you to us to use your Member Content described in Clause 4.1 shall continue notwithstanding such suspension or termination」——你授予我们的 Member Content 使用许可在终止后继续有效。它援引的 Clause 4.1 本身是「除维护/提供服务或守法所必需外不访问、不使用」条款，故 (c) 只能读成使用权范围的边界，不能读成「终止后仍会保留内容」，不改 basis。"
anchor = "ma-retention-licence-survives-termination"

[[product.retention.point]]
text = "**Boundary** (Product ToS §4.48.1(g)(iv)): \"Your use of Model Studio may result in data provided to or stored by Alibaba Cloud being removed or rendered inaccessible from time to time, even if not marked for deletion or destruction by you.\" There is no durability guarantee on Alibaba Cloud's side and customers must keep their own redundancy. This is a durability disclaimer, not a retention-period statement — object/basis are unchanged"
text_zh = "**边界**（国际站 Product Terms §4.48.1(g)(iv)）：「Your use of Model Studio may result in data provided to or stored by Alibaba Cloud being removed or rendered inaccessible from time to time, even if not marked for deletion or destruction by you.」——阿里云侧不保证数据存续（即便你未标记删除也可能被移除或不可访问），客户须自备冗余。它是存续性免责，不是保留期限表述，不改 object/basis。"
anchor = "pt-retention-data-removed-inaccessible"

[[product.retention.point]]
text_zh = "国际站隐私政策 F 节按目的所需/法定期限保留。国际站英文隐私说明页另有『stores data generated from model and application calls』的存储声明（见 zdr）。"

[product.processing_region]
codes = ["selected"]
anchor = "regions-request-data-stored-in-region"

[[product.processing_region.point]]
text = "developer_data (high): the Regions documentation — \"Regions determine the **access point and data storage location**\", \"Request data is stored in that region.\", \"Your static data always remains in the selected region.\" — the storage location and access point are set by the selected region, which is what codes=[\"selected\"] records"
text_zh = "产品文档层（developer_data，高）：地域文档「Regions determine the access point and data storage location」「Request data is stored in that region.」「Your static data always remains in the selected region.」（锚点 regions-static-data-in-region）——数据存放地与接入点由所选 region 决定，这才是 codes=[\"selected\"] 的原文依据。本档无 provider 级（顶层）processing_region 判定块，机制描述即本档该锚点所指页面。"
anchor = "regions-static-data-in-region"

[[product.processing_region.point]]
text = "contract (high): DPA §6.1 — \"You decide where to store Data (**“Selected Region”**).\" The customer picks the region where Data is stored; that is the contract-level source text behind codes=[\"selected\"]"
text_zh = "合同层（国际站 DPA §6.1）：「You decide where to store Data (**“Selected Region”**).」——存储地由客户选定，这是 codes=[\"selected\"] 的合同级依据"
anchor = "dpa-region-selected-region"

[[product.processing_region.point]]
text = "**Boundary** (Product ToS §4.48.1(g)(viii)): Member Content \"will be transferred to, stored, and processed in the country where Alibaba Cloud, its affiliates, or its sub-contractors maintain facilities for Model Studio Service. This may be a jurisdiction different from your location\" — processing location = wherever Alibaba Cloud, its affiliates or sub-contractors keep facilities, and it may cross jurisdictions. This is a different statement from §6.1/codes=[\"selected\"] and must not be merged with it: it describes the facilities-country rule, not residence in the customer's chosen region"
text_zh = "**边界**（国际站 Product Terms §4.48.1(g)(viii)）：Member Content「will be transferred to, stored, and processed in the country where Alibaba Cloud, its affiliates, or its sub-contractors maintain facilities for Model Studio Service. This may be a jurisdiction different from your location」——处理地＝阿里云及其关联方/分包商设施所在国，可跨辖区。它与 DPA §6.1「存储地由客户选定」不是同一件事，分开记录：本条讲设施所在国规则，不承诺驻留在客户所选地域。"
anchor = "pt-region-facilities-country"

[[product.processing_region.point]]
text = "**Boundary**: the storage location and the inference execution location are two different variables. Regions doc — \"Service deployment scope: Determines the **inference execution location**. If you have data compliance requirements, select a scope with specific geographic boundaries. Otherwise, select the Global scope for a larger inference resource pool\" — with the Global scope selected, inference nodes may execute across geographic boundaries, so \"data stays in the selected region\" holds for storage and static data, not for inference execution"
text_zh = "**边界**：存储地与推理执行地是两个变量。地域文档「Service deployment scope: Determines the inference execution location. If you have data compliance requirements, select a scope with specific geographic boundaries. Otherwise, select the Global scope for a larger inference resource pool」——选 Global scope 时推理可跨地理边界执行，故「数据留在所选 region」只对存储与静态数据成立，对推理执行不成立（Global 不是存储地，本档不把它写成 code）。"
anchor = "regions-deployment-scope-inference"

[product.role]
kind = "processor"
anchor = "dpa-role-processor-appointment"

[[product.role.point]]
text_zh = "按量 API 档没有 5.2.2 式的自身目的使用授权，role 为纯 processor（客户为 controller）。"

[[product.role.point]]
text = "**Boundary (kind unchanged)**: Product ToS §4.48.2(c) — for a Third-party Model Service (third-party vendor models listed on Model Studio / Alibaba Cloud Marketplace), \"Alibaba Cloud does not perform the role of data processor or controller with respect to any personal data processed by such Third-party Model Service\". On that path Alibaba Cloud is not the processor of the chain; the role is taken up by the vendor's own terms. kind=processor does not extend to the marketplace third-party model path"
text_zh = "**边界（不改 kind）**：Product Terms §4.48.2(c)——走 Model Studio 上的云市场三方模型服务（Third-party Model Service）时「Alibaba Cloud does not perform the role of data processor or controller with respect to any personal data processed by such Third-party Model Service」，阿里云不是该链路的 processor/controller，角色由三方服务商条款承接。故本行 kind=processor 的适用范围不含云市场三方模型路径，多跳链判定须逐跳看。"
anchor = "pt-thirdparty-model-not-processor"

[[product]]
id = "coding-plan-personal"
badge = "Coding Plan 国际站"
category = "coding_plan"
plan_level = "individual"
label = "国际站 Model Studio Coding Plan 订阅档（Lite 已停止新购/续费，现行 Pro；面向个人订阅，国际站无企业版/团队版 Coding Plan）"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "agr-training-codingplan-authorization"

[[product.training.point]]
text_zh = "本档结论：Coding Plan 的模型输入与模型输出被授权用于「服务改进与模型优化」（即训练/优化用途），value=yes。两层证据各自独立成立：(1) **国际站自有文档层**——国际站中文与繁体产品简介页在「我的数据安全吗？阿里云百炼会用我的数据进行训练吗？」问答下，把按量付费 API 与 Token Plan 团队版的不训练承诺与 Coding Plan 明确切开，写明『使用 Coding Plan 期间，模型输入及模型生成的内容将用于服务改进与模型优化』，并直链《阿里云百炼服务协议》第 5.2 条"

[[product.training.point]]
text_zh = "这一层不依赖该协议本身是否列入 related-agreements。(2) **合同层**——该协议 5.2.2 原文『您同意并授权我们和我们的关联公司存储并使用您使用Token Plan个人版（不包括Token Plan团队版）和/或Coding Plan服务期间因调用模型而输入以及模型输出的内容以实现我们的服务改进与模型优化』，且终止授权不涵盖已授权数据（5.2.2 后半句）。国际站 Product Terms 4.48.1(e) 的默认『不用于 develop 或 improve』由 1.2 条的「Additional Agreement 优先」规则处理：若百炼协议构成 Additional Agreement，则 4.48.1(e) 让位于 5.2.2"

[[product.training.point]]
text_zh = "订阅 Coding Plan 即构成 4.48.1(e) 所称的『另行同意』。反向证据（不掩盖）：①国际站英文、日文、印尼文、葡文产品简介页均只有无例外的『never use your data for model training』，例外只存在于 zh 与 tc"

[[product.training.point]]
text_zh = "②国际站 Coding Plan 概述与 FAQ（中英文）都没有『数据使用授权』条目，该条目只在国内站页面"

[[product.training.point]]
