[[source]]
url = "https://www.alibabacloud.com/help/en/model-studio/what-is-model-studio"
channel = "developer_data"
tier = "contradiction"
note = "与 core 文档《国际站中文产品简介》(https://www.alibabacloud.com/help/zh/model-studio/what-is-model-studio) 及《阿里云百炼服务协议》5.2.2(https://terms.alicdn.com/legal-agreement/terms/common_platform_service/20230728213935489/20230728213935489.html) 在**同一档位（国际站 Coding Plan 个人版）× training** 上表述相反。本文件（英文页）同一问答答『Alibaba Cloud protects data privacy and will never use your data for model training.』，全页无 Token Plan 字样、无 Coding Plan 例外；中文同页同问答答『阿里云严格保护数据隐私，使用百炼按量付费 API 和 Token Plan 团队版时，不会将您的数据用于模型训练』，并以『重要』段补明『Token Plan 个人版和 Coding Plan 的数据使用条款与上述承诺不同。使用 Coding Plan 期间，模型输入及模型生成的内容将用于服务改进与模型优化……《阿里云百炼服务协议》第 5.2 条』，该协议 5.2.2 逐字授权『存储并使用您使用Token Plan个人版（不包括Token Plan团队版）和/或Coding Plan服务期间因调用模型而输入以及模型输出的内容以实现我们的服务改进与模型优化』。四种解释逐条排除：①范围——两份是**同一文档的两个语系**（同一 URL 路径 /help/{en,zh}/model-studio/what-is-model-studio），且英文页自身在计费段与 FAQ 段直链 Coding Plan 概述与控制台订阅页(modelstudio.console.alibabacloud.com/ap-southeast-1/subscription/coding-plan)，其覆盖范围包含 Coding Plan，不能读成「英文页只管按量 API、中文页管订阅档」；②档位——国际站 Coding Plan 只有个人版（无企业版/团队版），两份针对同一档；③站点——同一站点同一文档，非国内站/国际站之分；④时效——两份均为现行版本且更新日期相同（英文页 Last Updated: Sep 16, 2026；中文页 更新时间：2026-09-16；繁体页 2026-09-09，本轮直连原始 HTML 复核），排除「英文页是旧版未更新」。ja/id/pt-BR 三语系同为无例外口径（上一轮直连 HTML 复核 Token Plan 命中 0），说明不是单页笔误。需厂商澄清英文口径是否遗漏该例外。"

