[[product.zdr.point]]
text_zh = "判定为「有依据的否定」，不是「未披露」：国际站英文隐私说明页明示『In compliance with relevant laws and regulations, Alibaba Cloud Model Studio stores data generated from model and application calls.』，本档另有 5.2.2 对输入输出的『存储并使用』授权，与「请求处理完成后不保留」直接冲突。公开文档中不存在任何零保留模式、开关、申请途径或 ZDR 档位表述（searched 逐条列出本轮实核的 URL：国际站 Product Terms / Membership Agreement / DPA / 隐私政策 / Model Inference SLA、国际站与国内站的 Coding Plan 概述与 FAQ、产品简介四个语系、模型页、第三方模型条款、购买页）。国内站同名页与 FAQ 有同义的存储声明（作为同厂同口径佐证）。注意两点保留：①国际站中文隐私说明页**没有**这句存储声明（中英同页不一致）"

[[product.zdr.point]]
text_zh = "②「厂商未提供 ZDR」与「厂商明文声明不提供 ZDR」不同，后者未出现，故 confidence=medium。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "agr-retention-shortest-necessary"

[[product.retention.point]]
text_zh = "对象与期限类型要分开写：①**输入输出正文（对话数据）**——协议 6.2.5『我们承诺仅在提供服务所必需的最短时间内保留您的对话数据』，是**上限式表述但未量化**（无天数）"

[[product.retention.point]]
text_zh = "本档另有 5.2.2 的『存储并使用』授权，授权不因停止使用而回溯（agr-training-termination-scope），即训练用副本的存续期未被 6.2.5 约束。②**客户业务数据整体**——服务期届满/提前终止/欠费时，6.2.7 在『一定的缓冲期（以专有条款、产品文档、服务说明所载明的时限为准）』内继续存储，缓冲期届满删除全部含缓存与备份副本"

[[product.retention.point]]
text_zh = "本档产品文档**未载明**该缓冲期天数，故期限类型为「下限不明的缓冲期 + 届满删除」。③**客户信息（注册类）**——6.1.5 达成目的所需期限内保留，超期删除，但承认备份可能无法立即删除。④国际站合同层——Membership Agreement 8.5(b) 终止后删除 Member Content（法律要求保留除外）"

[[product.retention.point]]
text_zh = "DPA 4(g) 终止后按用户选择删除或返还 Data（法律要求或备份归档除外）"

[[product.retention.point]]
text_zh = "国际站隐私政策 F 节按目的所需/法定期限保留、无必要即删除或匿名化。⑤未发现任何请求级量化保留期（如 0 天 / 7 天 / 30 天）的公开承诺"

[[product.retention.point]]
text_zh = "国际站与国内站均无。"

[product.processing_region]
codes = ["SG", "global"]
anchor = "regions-deployment-scope-inference"

[[product.processing_region.point]]
text_zh = "分三层：①**合同层（国际站）**——Product Terms 4.48.1(viii)『the Member Content you provide to Alibaba Cloud will be transferred to, stored, and processed in the country where Alibaba Cloud, its affiliates, or its sub-contractors maintain facilities for Model Studio Service』，处理地即阿里云及其关联方/分包商设施所在国，不承诺驻留。②**产品文档层（国际站）**——地域决定接入点与数据存储位置，请求数据存储在所选地域，『Your static data always remains in the selected region』"

[[product.processing_region.point]]
text_zh = "但同页明确『Service deployment scope: Determines the inference execution location… Otherwise, select the Global scope for a larger inference resource pool』——即**存储地与推理执行地不是同一个变量**，选 Global scope 时推理可跨地域执行，这是本轮新增的关键限定（上一轮只记了「请求数据存储在所选地域」）。③**本档具体化**——Coding Plan 控制台订阅页固定 ap-southeast-1（国际站产品简介页链接 modelstudio.console.alibabacloud.com/ap-southeast-1/subscription/coding-plan），专属 base URL 为 coding-intl.dashscope.aliyuncs.com（工作区域端点 {WorkspaceId}.ap-southeast-1.maas.aliyuncs.com），故判存储在新加坡。国内站协议 6.2.8 另有「在您选定的服务及模型服务所在国家或地区处理客户业务数据」的同旨表述（国内站协议，适用性同 training 的 caveat）。置信度 medium 的原因：结论由「产品文档接入点 + 地域机制 + 合同层表述」合成，且推理执行地本身可变。"

[product.role]
kind = "processor"
anchor = "pt-role-on-your-behalf"

[[product.role.point]]
text_zh = "主判定 processor（受托处理方）：国际站 Product Terms 4.48.1(b)『Any processing of Member Content… is for your purposes and on your behalf』"

[[product.role.point]]
text_zh = "DPA 第 3 条『You (the controller or processor) appoint Alibaba Cloud as Your processor… solely for the purpose of providing the Alibaba Cloud Services to You』、4(a) 仅按书面指示处理"

[[product.role.point]]
text_zh = "Membership Agreement 文末 DPA 段『we process as a processor personal data contained in or generated in relation to your Member Content』"

[[product.role.point]]
text_zh = "国内站协议 6.2.3(1)『按照本协议及您可能不时做出的任何进一步有文件记录的指示且不为其自身目的处理相关数据』、6.2.1 客户对业务数据拥有完全控制权。例外（本档特有）：5.2.2 对 Coding Plan 输入输出另设『服务改进与模型优化』的存储使用授权，就这部分属于超出客户指示的自身目的使用，与 6.2.3(1)『不为其自身目的』存在文本张力，协议未设 5.2 优先条款，故 value 记为 processor_with_5.2.2_carveout。另有一层未决：档位支持的 GLM / Kimi / MiniMax 中，国际站第三方模型条款称 GLM 由 Hong Kong Xiangtai Ruifeng、KIMI 由 Moonshot AI PTE. LTD.『出售』（其 DPA 处理地为新加坡与美国），而模型页称推理服务供应商为 Alibaba Cloud Model Studio——公开文件无法确定第三方品牌模型的请求是否经上游模型商处理，见 notes。"

