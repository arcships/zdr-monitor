[[product.zdr.point]]
text_zh = "判定为「有依据的否定」，不是「未披露」：国际站英文隐私说明页明示『In compliance with relevant laws and regulations, Alibaba Cloud Model Studio stores data generated from model and application calls.』，本档另有 5.2.2 对输入输出的『存储并使用』授权，与「请求处理完成后不保留」直接冲突。公开文档中不存在任何零保留模式、开关、申请途径或 ZDR 档位表述（searched 逐条列出本轮实核的 URL：国际站 Product Terms / Membership Agreement / DPA / 隐私政策 / Model Inference SLA、国际站与国内站的 Coding Plan 概述与 FAQ、产品简介四个语系、模型页、第三方模型条款、购买页）。国内站同名页与 FAQ 有同义的存储声明（作为同厂同口径佐证）。注意两点保留：①国际站中文隐私说明页**没有**这句存储声明（中英同页不一致）"

[[product.zdr.point]]
text_zh = "②「厂商未提供 ZDR」与「厂商明文声明不提供 ZDR」不同，后者未出现，故 confidence=medium。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "agr-retention-shortest-necessary"

[[product.retention.point]]
text_zh = "对象与期限类型要分开写：①**输入输出正文（对话数据）**——协议 6.2.5『我们承诺仅在提供服务所必需的最短时间内保留您的对话数据』，是**上限式表述但未量化**（无天数）"

[[product.retention.point]]
text = "**Scope of this value**: basis=as_needed records only the conversation data that does not fall under the §5.2.2 authorization, i.e. the §6.2.5 commitment \"我们承诺仅在提供服务所必需的最短时间内保留您的对话数据。\" (a cap-style statement, not quantified: no number of days). §6.2.5 does not name Coding Plan; the agreement is hosted on the China-site domain, its contracting entity is 通义云启（杭州）信息技术有限公司 and §12.1 applies mainland-China law, and the international-site related-agreements list does not include it — so the applicability of §6.2 to this international tier remains unresolved (same caveat as the training dimension)"
text_zh = "**本值的适用范围**：basis=as_needed 只覆盖未落入 §5.2.2 授权的对话数据，即协议 6.2.5「我们承诺仅在提供服务所必需的最短时间内保留您的对话数据。」（上限式表述、未量化天数）。该句不点名 Coding Plan；该协议托管于国内站域名、签约主体为通义云启（杭州）、§12.1 适用中国大陆法律，且国际站相关协议清单不含它——故 §6.2 对本国际站档的适用性仍属未消解存疑（同 training 的 caveat）。"
anchor = "agr-retention-shortest-necessary"

[[product.retention.point]]
text = "**The §5.2.2-authorized copies sit outside §6.2.5**: §5.2.2 authorizes us to store and use the model input and output for service improvement and model optimization, and the authorization is not recalled on termination (\"终止授权的范围不涵盖您已授权我们使用的相关内容和数据\"). For those copies no retention period is published, so the shortest-necessary cap of §6.2.5 does not bound them — the as_needed value shown here does not cover them"
text_zh = "**因 §5.2.2 授权被存储使用的副本不受 6.2.5 约束**：5.2.2 授权我们「存储并使用」模型输入输出以实现服务改进与模型优化，且授权不因停止使用而回溯（「终止授权的范围不涵盖您已授权我们使用的相关内容和数据」，锚点 agr-training-termination-scope）。这部分副本的期限未公布，6.2.5 的「最短必要时间」不覆盖它——页面上的 as_needed 不含这部分。"
anchor = "agr-training-codingplan-authorization"

[[product.retention.point]]
text_zh = "②**客户业务数据整体**——服务期届满/提前终止/欠费时，6.2.7 在『一定的缓冲期（以专有条款、产品文档、服务说明所载明的时限为准）』内继续存储，缓冲期届满删除全部含缓存与备份副本（5.2.2 授权副本不受 6.2.5 约束，见上一条）"

[[product.retention.point]]
text_zh = "本档产品文档**未载明**该缓冲期天数，故期限类型为「下限不明的缓冲期 + 届满删除」。③**客户信息（注册类）**——6.1.5 达成目的所需期限内保留，超期删除，但承认备份可能无法立即删除。④国际站合同层——Membership Agreement 8.5(b) 终止后删除 Member Content（法律要求保留除外）"

[[product.retention.point]]
text_zh = "DPA 4(g) 终止后按用户选择删除或返还 Data（法律要求或备份归档除外）"

[[product.retention.point]]
text = "**Boundary of §8.5(b)**: §8.5(c) — \"the licence granted by you to us to use your Member Content described in Clause 4.1 shall continue notwithstanding such suspension or termination\". Clause 4.1 is itself a no-access/no-use clause, so this is a boundary on the scope of the licence you grant us, not a statement that content is kept after termination. basis unchanged"
text_zh = "**§8.5(b) 的边界**：§8.5(c)「the licence granted by you to us to use your Member Content described in Clause 4.1 shall continue notwithstanding such suspension or termination」——你授予我们的 Member Content 使用许可在终止后继续有效；它援引的 Clause 4.1 本身是「除维护/提供服务或守法所必需外不访问、不使用」条款，故只算使用权范围的边界，不能读成「终止后仍会保留内容」，不改 basis。"
anchor = "ma-retention-licence-survives-termination"

[[product.retention.point]]
text = "**Boundary** (Product ToS §4.48.1(g)(iv)): \"Your use of Model Studio may result in data provided to or stored by Alibaba Cloud being removed or rendered inaccessible from time to time, even if not marked for deletion or destruction by you.\" No durability guarantee on Alibaba Cloud's side; customers must keep their own redundancy. This is a durability disclaimer, not a retention-period statement — object/basis unchanged"
text_zh = "**边界**（国际站 Product Terms §4.48.1(g)(iv)）：「Your use of Model Studio may result in data provided to or stored by Alibaba Cloud being removed or rendered inaccessible from time to time, even if not marked for deletion or destruction by you.」——阿里云侧不保证数据存续（即便你未标记删除也可能被移除或不可访问），客户须自备冗余。它是存续性免责，不是保留期限表述，不改 object/basis。"
anchor = "pt-retention-data-removed-inaccessible"

[[product.retention.point]]
text_zh = "国际站隐私政策 F 节按目的所需/法定期限保留、无必要即删除或匿名化。⑤未发现任何请求级量化保留期（如 0 天 / 7 天 / 30 天）的公开承诺"

[[product.retention.point]]
text_zh = "国际站与国内站均无。"

[product.processing_region]
codes = ["selected"]
anchor = "regions-request-data-stored-in-region"

[[product.processing_region.point]]
text = "developer_data (high): the Regions documentation — \"Regions determine the **access point and data storage location**\", \"Request data is stored in that region.\", \"Your static data always remains in the selected region.\" — the storage location is the region the customer selects, which is what codes=[\"selected\"] records"
text_zh = "①**产品文档层（国际站）**——地域文档「Regions determine the access point and data storage location」「Request data is stored in that region.」「Your static data always remains in the selected region.」（锚点 regions-static-data-in-region）：接入点与数据存储位置由所选 region 决定，请求数据存储在所选地域。codes=[\"selected\"] 的原文依据就是这一组，不是下面 4.48.1(viii)。"
anchor = "regions-static-data-in-region"

[[product.processing_region.point]]
text = "contract (high): DPA §6.1 — \"You decide where to store Data (**“Selected Region”**).\" The customer picks the storage region; this is the contract-level source text for codes=[\"selected\"]"
text_zh = "②**合同层（国际站）**——DPA §6.1「You decide where to store Data (**“Selected Region”**).」——存储地由客户选定，是 codes=[\"selected\"] 的合同级依据"
anchor = "dpa-region-selected-region"

[[product.processing_region.point]]
text = "**Boundary — Global scope is an inference variable, not a storage region**: \"Service deployment scope: Determines the **inference execution location**. If you have data compliance requirements, select a scope with specific geographic boundaries. Otherwise, select the Global scope for a larger inference resource pool\" — storage location and inference execution location are two different variables, and with the Global scope selected inference may cross geographic boundaries. Global is therefore not written into codes"
text_zh = "③**边界——Global 是推理变量，不是存储地**：「Service deployment scope: Determines the inference execution location. If you have data compliance requirements, select a scope with specific geographic boundaries. Otherwise, select the Global scope for a larger inference resource pool」（锚点 regions-deployment-scope-inference）——存储地与推理执行地是两个变量，选 Global scope 时推理可跨地理边界执行，故 Global 不写进 codes。"
anchor = "regions-deployment-scope-inference"

[[product.processing_region.point]]
text = "**Boundary** (Product ToS §4.48.1(g)(viii)): Member Content \"will be transferred to, stored, and processed in the country where Alibaba Cloud, its affiliates, or its sub-contractors maintain facilities for Model Studio Service. This may be a jurisdiction different from your location\" — processing location = the facilities country, possibly a different jurisdiction; it does not promise residence in the selected region and is kept separate from ①/②"
text_zh = "④**边界**（国际站 Product Terms 4.48.1(viii)）：「the Member Content you provide to Alibaba Cloud will be transferred to, stored, and processed in the country where Alibaba Cloud, its affiliates, or its sub-contractors maintain facilities for Model Studio Service」，处理地即阿里云及其关联方/分包商设施所在国，可能与你所在辖区不同，不承诺驻留；与 ①/② 分开记录，不合成一句。"
anchor = "pt-region-facilities-country"

[[product.processing_region.point]]
text = "**Observation without a snapshot (not written into codes)**: the international-site Coding Plan console subscription page is reported to be pinned to ap-southeast-1 (modelstudio.console.alibabacloud.com/ap-southeast-1/subscription/coding-plan, linked from the zh product-intro page) and the tier's base URL is reported as coding-intl.dashscope.aliyuncs.com / {WorkspaceId}.ap-southeast-1.maas.aliyuncs.com — but no snapshot in this ledger covers a Coding Plan page (the Regions snapshot contains no \"Coding Plan\" string and binds ap-southeast-1 only in generic endpoint examples), so \"this tier actually lands in Singapore\" is recorded here as an unverified observation, not as a code"
text_zh = "⑤**未取到快照的观察（不写进 codes）**：据国际站产品简介页链接，Coding Plan 控制台订阅页为 modelstudio.console.alibabacloud.com/ap-southeast-1/subscription/coding-plan，专属 base URL 据称是 coding-intl.dashscope.aliyuncs.com（工作区域端点 {WorkspaceId}.ap-southeast-1.maas.aliyuncs.com）——但本台账没有任何 Coding Plan 页面的快照（regions 快照全篇无「Coding Plan」字样，ap-southeast-1 只出现在通用端点示例与地域表中），故「本档实际落新加坡」只能作为未取到快照的观察记在这里，不能写成 SG code。要写进 codes 须先把国际站 Coding Plan 概述页或控制台订阅页加入 [[source]]、等 bot 抓回快照。"

[[product.processing_region.point]]
text = "China-site agreement §6.2.8 says the same thing in its own words: \"阿里云将在您选定的阿里云百炼服务及模型服务所在国家或地区处理客户业务数据\" (China-site agreement; applicability caveat as in the training dimension)"
text_zh = "⑥国内站协议 6.2.8 另有「阿里云将在您选定的阿里云百炼服务及模型服务所在国家或地区处理客户业务数据」的同旨表述（国内站协议，适用性同 training 的 caveat，见 ② 的存疑）。置信度 medium：本档地域判定由产品文档（接入点与存储位置机制）+ 合同层（DPA §6.1）合成，且推理执行地本身可变、本档具体 region 无快照。"
anchor = "agr-region-chosen-country-or-region"

[product.role]
kind = "processor"
anchor = "pt-role-on-your-behalf"

[[product.role.point]]
text_zh = "主判定 processor（受托处理方）：国际站 Product Terms 4.48.1(b)『Any processing of Member Content… is for your purposes and on your behalf』"

[[product.role.point]]
text_zh = "DPA 第 3 条『You (the controller or processor) appoint Alibaba Cloud as Your processor… solely for the purpose of providing the Alibaba Cloud Services to You』、4(a) 仅按书面指示处理"

[[product.role.point]]
text_zh = "Membership Agreement 文末 DPA 段『we process as a processor personal data contained in or generated in relation to your Member Content』"

[[product.role.point]]
text_zh = "国内站协议 6.2.3(1)『按照本协议及您可能不时做出的任何进一步有文件记录的指示且不为其自身目的处理相关数据』、6.2.1 客户对业务数据拥有完全控制权。例外（本档特有）：5.2.2 对 Coding Plan 输入输出另设『服务改进与模型优化』的存储使用授权，就这部分属于超出客户指示的自身目的使用，与 6.2.3(1)『不为其自身目的』存在文本张力，协议未设 5.2 优先条款，故 value 记为 processor_with_5.2.2_carveout。另有一层未决（**未取到快照的观察，不作为结论依据**）：国际站第三方模型条款称 GLM 由 Hong Kong Xiangtai Ruifeng、KIMI 由 Moonshot AI PTE. LTD.『出售』（其 DPA 处理地为新加坡与美国），而模型页称推理服务供应商为 Alibaba Cloud Model Studio——这些模型页与第三方条款页在本台账只有 searched[]、没有 [[source]]，故公开文件无法确定第三方品牌模型的请求是否经上游模型商处理，见 notes。"

[[product.role.point]]
text = "**Boundary (kind unchanged)**: Product ToS §4.48.2(c) — for a Third-party Model Service (third-party vendor models listed on Model Studio / Alibaba Cloud Marketplace), \"Alibaba Cloud does not perform the role of data processor or controller with respect to any personal data processed by such Third-party Model Service\". Alibaba Cloud is therefore not the processor of that chain; the role is taken up by that vendor's own terms, and kind=processor does not extend to that path"
text_zh = "**边界（不改 kind）**：Product Terms §4.48.2(c)——走 Model Studio 上的云市场三方模型服务（Third-party Model Service）时「Alibaba Cloud does not perform the role of data processor or controller with respect to any personal data processed by such Third-party Model Service」，阿里云不就该服务处理的个人数据承担 processor/controller 角色，角色由该服务商条款承接。故本行 kind=processor 的适用范围不含云市场三方模型路径，多跳链判定须逐跳看。"
anchor = "pt-thirdparty-model-not-processor"

