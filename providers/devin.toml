[anchor.selector]
prefix = ""
exact = "Notwithstanding anything to the contrary in this DPA, the parties acknowledge and agree that Licensor may process Account Data as a Data Controller solely to (a) manage and administer its relationship with Customer, including business user access management and account provisioning; (b) detect, prevent, or investigate security incidents, fraud, and other abuse or misuse of the Services; and (c) comply with applicable legal or regulatory obligations."
