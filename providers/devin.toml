[[anchor]]
id = "devin-default-training"
source_id = "3a442cc9dea8a53d"
topics = ["training", "zdr"]
[anchor.selector]
prefix = ""
exact = "By default, we may use your data for model training purposes to improve and enhance the Services. If you’re on a paid plan, you can opt out at any time on the Data Controls settings page. After you opt out, your data will not be used for training and Zero Data Retention will be enabled with our model providers."
suffix = ""
[[anchor]]
id = "devin-enterprise-no-train"
source_id = "3a442cc9dea8a53d"
topics = ["training"]
[anchor.selector]
prefix = ""
exact = "If you are an Enterprise customer, we will never train on your data without your express prior written consent."
suffix = ""
[[anchor]]
id = "devin-relationship-retention"
source_id = "3a442cc9dea8a53d"
topics = ["retention"]
[anchor.selector]
prefix = ""
exact = "Cognition only retains data processed through Devin for the duration of the relationship with a given Customer, unless otherwise specified by the Customers."
suffix = ""
[[anchor]]
id = "devin-processor"
source_id = "c7345437a9dd5fa6"
topics = ["role", "processing_region"]
[anchor.selector]
prefix = ""
exact = "Customer is the entity that determines the purposes and means for which Customer Data is processed (“Data Controller”), and Licensor processes Customer Data on the Data Controller’s behalf and in accordance with the Data Controller’s written instructions (“Data Processor”)."
suffix = ""
