[[anchor]]
id = "devin-purpose-limitation"
source_id = "c7345437a9dd5fa6"
topics = ["training", "retention"]
[anchor.selector]
prefix = ""
exact = "For clarity, as Data Processor, Licensor will not sell or share Customer Data, nor will Licensor use, disclose, retain, or otherwise process Customer Data (i) for a purpose other than the specific purpose of providing the Services; (ii) outside of the direct business relationship between Licensor and Customer and the written instructions received from Customer; and (iii) in a manner inconsistent with applicable Data Protection Laws."
