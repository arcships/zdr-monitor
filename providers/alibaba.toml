[product.training]
mark = "yes"
mode = "by_contract"
anchor = "alibaba-tos-training-not-used"

[[product.training.point]]
text = "Contract level: International Product ToS v3.8.0 §4.48.1(e), final sentence: \"Alibaba Cloud will not use your Member Content to develop or improve the models on Model Studio, unless you separately provide your consent.\" — Member Content includes Input and Output (§4.48.1(b)), so pay-as-you-go API inputs and outputs are not used to develop or improve models on Model Studio unless the customer separately consents. Three layers of support: (1) Membership Agreement §4.1 \"We will not access or use your Member Content except as necessary to maintain or provide the Services…\""
text_zh = "合同级(contract):国际站 Product ToS v3.8.0 §4.48.1(e) 末句「Alibaba Cloud will not use your Member Content to develop or improve the models on Model Studio, unless you separately provide your consent.」——Member Content 含 Input 与 Output(§4.48.1(b)),即按量 API 的输入输出不用于开发或改进百炼上的模型,除非客户另行单独同意。佐证三层:①会员协议 §4.1「We will not access or use your Member Content except as necessary to maintain or provide the Services…」"

[[product.training.point]]
text = "(2) The international Model Studio privacy notice and product introduction page: \"will never use your data for model training\" (enterprise_privacy_faq / developer_data)"
text_zh = "②国际站 Model Studio 隐私说明与产品介绍页「will never use your data for model training」(enterprise_privacy_faq / developer_data)"

[[product.training.point]]
text = "(3) The Training data summary, \"Customer data policy\" section: \"does not use customer business data to develop or improve models without explicit consent\". **Tier boundary (hard)**: the Chinese-language product page of the international site limits the no-training commitment by name to \"the pay-as-you-go API and the Token Plan team edition\", and the \"Important\" box on the same page states that the data-use terms differ for the Token Plan individual edition and Coding Plan (input and generated content while using Coding Plan will be used for service improvement and model optimization); those two tiers are outside this provider's scope. **Customer-side exception**: once inference logs are enabled, Log backflow can recycle logs into the customer's own training dataset (telemetry/backflow anchors) — that is the customer's own action, not the vendor training on the data. **Third-party model exception**: when a third-party model on Model Studio is used (DeepSeek/Kimi/GLM and others), data processing is provided directly by that vendor under that vendor's terms (§4.48.2), so this \"no training\" commitment covers only Alibaba Cloud's own model path"
text_zh = "③Training data summary「Customer data policy」段「does not use customer business data to develop or improve models without explicit consent」。**档位边界(硬)**:国际站中文产品页把不训练承诺点名限定为「按量付费 API 和 Token Plan 团队版」,同页「重要」框写明 Token Plan 个人版与 Coding Plan 的数据使用条款不同(使用 Coding Plan 期间输入与生成内容将用于服务改进与模型优化),那两档不在本 provider 范围。**客户侧例外**:开启推理日志后可用 Log backflow 把日志回流入自己的训练数据集(telemetry/backflow 锚点),这是客户主动行为,不是厂商拿数据训练。**三方模型例外**:走 Model Studio 三方模型(DeepSeek/Kimi/GLM 等)时,数据处理由厂商直接提供并适用厂商条款(§4.48.2),本条的「不训练」承诺只覆盖阿里云自有模型链路"

