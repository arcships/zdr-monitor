[[product.zdr.point]]
text = "After exhausting the international-site channels there is **no** zero-retention (ZDR) commitment, switch or application process: ZDR appears nowhere in Product ToS §4.48"
text_zh = "国际站渠道穷尽后**没有**任何零保留(ZDR)承诺、开关或申请流程:Product ToS §4.48 全文无 ZDR"

[[product.zdr.point]]
text = "The DPA has no \"no retention\" clause (it has the opposite: deletion or return on termination, plus retention where required by law)"
text_zh = "DPA 无「不保留」条款(反而有终止时删除/返还 + 法律要求可保留)"

[[product.zdr.point]]
text = "The Membership Agreement only commits to not accessing or using Member Content except as necessary, and to deletion on termination"
text_zh = "会员协议只承诺「非必要不访问/使用」与终止时删除"

[[product.zdr.point]]
text = "The privacy notice says the opposite in plain terms: Model Studio \"stores data generated from model and application calls\""
text_zh = "隐私说明反而明说会存储调用产生的数据"

[[product.zdr.point]]
text = "model-telemetry offers logging switches (audit logs on by default, inference logs off by default), not \"discarded once processed\""
text_zh = "model-telemetry 提供的是日志开关(审计日志默认开、推理日志默认关),不是「处理完即弃」"

[[product.zdr.point]]
text = "The related-agreements list and the Security and Compliance directory (4 sub-pages) were checked page by page with no ZDR found"
text_zh = "相关协议清单与 Security and Compliance 目录(4 个子页)逐页核查无 ZDR"

[[product.zdr.point]]
text = "The commitment on the Chinese-language product page of the international site goes no further than \"not used for training\". A distinction to keep: inference logs off by default plus delivery to the customer's own SLS only means the customer can keep content-bearing logs from being retained on Alibaba Cloud's side, which is not zero data retention (the request still has to be processed, and audit logs and monitoring metrics stay on the platform by default). Recorded as mark=no (express denial): the privacy notice states that call-generated data is stored, i.e. no zero retention is offered at terms level — this is not \"undisclosed\". The searched scope is kept in full"
text_zh = "国际站中文产品页的承诺也只到「不用于训练」。注意区分:推理日志默认关闭 + 客户自有 SLS 只是「客户可不让阿里云侧留存含内容的日志」,不等于零数据保留(请求仍需处理,审计日志与监控指标默认留在平台侧)。结论记 mark=no(明确否定类):隐私说明明示会存储调用产生的数据,即条款层不提供零保留,不是「未披露」;searched 范围仍列全"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "alibaba-dpa-delete-or-return"

[[product.retention.point]]
text = "Recorded by object, not merged: (1) **Input and output content**: the international Model Studio privacy notice states plainly that Model Studio \"stores data generated from model and application calls\", but no uniform retention period in days is published anywhere on the site"
text_zh = "分对象记,不要合并:(1) **输入输出正文**:国际站 Model Studio 隐私说明明说「stores data generated from model and application calls」,但全站未公布统一保留天数"

[[product.retention.point]]
text = "DPA §4(g) commits, following termination of the Agreement, to \"at Your choice, delete or return all Data in Alibaba Cloud's possession or control\", and DPA Appendix 1 (used to fill in Annex I of the EU SCCs) records the retention period as \"Data will be processed and transferred for the duration of the Agreement\" (period type = duration of the agreement, not a fixed number of days)"
text_zh = "DPA §4(g) 承诺协议终止时按客户选择删除或返还 Data,DPA Appendix 1(用于填 EU SCC 的 Annex I)载明保留期为「Data will be processed and transferred for the duration of the Agreement」(期限类型=协议存续期,不是固定天数)"

[[product.retention.point]]
text = "The termination clause of the Membership Agreement instead says \"we will delete such Member Content at our sole discretion unless retention is required under applicable law\" — deletion after termination is **discretionary**, and data may be kept where the law requires it. (2) **Audit logs (metadata, no Prompt/Response)**: on by default, stored on the platform"
text_zh = "会员协议终止条款则写「we will delete such Member Content at our sole discretion unless retention is required under applicable law」——即终止后删除是**裁量性**的,且法律要求可保留。(2) **审计日志(元数据,不含 Prompt/Response)**:默认开启、平台侧存储"

[[product.retention.point]]
text = "The query window is \"Last 7 days by default; supports querying logs for up to 30 days\" (this is a **query window, not a deletion deadline**; no deletion after 30 days can be inferred from it). (3) **Inference logs (full Prompt/Response, truncated at 128KB)**: off by default, must be enabled manually and delivered to the customer's own SLS Logstore, and can be recycled into training datasets. (4) **Task data and result URLs of the asynchronous media APIs**: expressly \"available for 24 hours and is then automatically deleted\" (the only object with an explicit period). (5) **Account-level personal data**: under §F of the international-site privacy policy, kept as long as there is an ongoing legitimate business need, until the account is closed. (6) Product ToS §4.48.1(g)(iv) points the other way: data provided to or stored by Alibaba Cloud may be removed or rendered inaccessible from time to time, and customers must keep their own redundancy. Confidence medium: at contract level there is only \"delete or return on termination\" and \"the duration of the Agreement\", no default retention period, and the DPA applies only where data protection legislation requires it"
text_zh = "查询窗口默认 7 天、最长 30 天(这是**查询窗口,不是删除期限**,不能反推 30 天后删除)。(3) **推理日志(含完整 Prompt/Response,128KB 截断)**:默认关闭、需手动开启并投递到客户自有 SLS Logstore,可回流入训练数据集。(4) **异步媒体 API 的任务数据与结果 URL**:明确「available for 24 hours and is then automatically deleted」(唯一给出明确期限的对象)。(5) **账号类个人数据**:国际站隐私政策 §F 按持续正当业务需要,账号注销为止。(6) Product ToS §4.48.1(g)(iv) 反向提示:阿里云侧数据可能被移除或不可访问,客户须自备冗余。置信度 medium:合同层只有「终止时删除/返还」与「协议存续期」,没有默认保留期限,且 DPA 仅在数据保护法要求时适用"

[[product.retention.point]]
text = "**Monitoring metrics after delivery — delivery copies, it does not move data off the platform** (same object group as (2), audit logs and monitoring metrics): after delivery is enabled, monitoring data is stored on both the platform side and the user side. Enabling monitoring delivery therefore does not reduce platform-side retention; it is a copy, not an export. **Boundary**: that sentence covers model monitoring delivery (metrics) only — it does not cover log delivery or inference logs, which go to the customer's own SLS Logstore, and log delivery is a separate section of the same document."
text_zh = "**监控指标开启投递后——投递是复制,不是把数据搬出平台**(与 (2) 审计日志/监控指标同属一个对象组):开启投递后,监控数据在平台侧与用户侧各存一份。故开启监控投递并不减少平台侧留存,投递=复制而非导出。**边界**:该句只覆盖 model monitoring delivery(监控数据),不覆盖日志投递与推理日志——推理日志存到客户自有 SLS Logstore,日志投递是同文档的独立小节。"
anchor = "alibaba-telemetry-monitoring-delivery-both-sides"

[[product.retention.point]]
text = "**Licence survives termination**: Membership Agreement §8.5(c) — the licence granted by you to us to use your Member Content described in Clause 4.1 shall continue notwithstanding such suspension or termination. Read together with §8.5(b), termination does not end every right to use Member Content: deletion is discretionary and the §4.1 licence is stated to continue. **Cross-reference inconsistency, flagged rather than filled in by us**: in this snapshot §4.1 grants no such licence — it says that you retain any rights you may have in any Member Content and that the Agreement does not grant either party any rights to the other’s content except as set forth otherwise in this Agreement — and the only other licence reference in the text is the definition item §4.2(b). The sentence therefore stands as written, but the licence it points to is undefined in the current text: needs human confirmation, and must not be read as proof of a broad surviving use licence."
text_zh = "**许可存续**:会员协议 §8.5(c)——the licence granted by you to us to use your Member Content described in Clause 4.1 shall continue notwithstanding such suspension or termination。与 §8.5(b) 并读:终止不等于使用权终止——删除是裁量性的,而 §4.1 项下的许可据本条继续存在。**交叉引用不一致,只标注不补全**:本快照 §4.1 并未授予该许可(§4.1 写的是你保留 Member Content 中的权利,且明确本协议不向任何一方授予对方内容的权利,除非本协议另有约定),全文另一处 licence 是 §4.2(b) 的定义项。故该句按原文成立,但其所指的许可在现行文本中未定义:需人工确认,不能读成一条概括的存续使用许可。"
anchor = "alibaba-ma-licence-survives-termination"

[[product.retention.point]]
text = "**Exception to termination deletion (DPA §4(g), second half)**: the delete-or-return duty shall not apply to the extent that Alibaba Cloud is required or permitted by applicable law to retain some or all of the Data, **or Data archived on back-up systems**, in which event Alibaba Cloud shall securely isolate and protect such Data from any further processing except: (i) to the extent required by such law until deletion is possible; or (ii) where such Data ceases to contain personal data. So back-up copies may keep the Data past termination, isolated and no longer processed, until deletion becomes possible or the data no longer contains personal data. **Boundary**: this DPA applies only where Data Protection Legislation requires it — a contractual carve-out, not a default long-term retention commitment by the platform."
text_zh = "**终止删除义务的例外(DPA §4(g) 后半句)**:删除或返还义务不适用于「阿里云被适用法律要求或许可保留部分或全部 Data,或备份系统中归档的 Data」的情形;此时阿里云须安全隔离并保护该 Data、停止任何进一步处理,直到 (i) 法律允许删除,或 (ii) 该 Data 不再含个人信息。即备份归档中的 Data 可在终止后继续留存,但须隔离保护、停止进一步处理。**边界**:该 DPA 仅在数据保护法要求时适用——这是合同层的例外条款,不是平台默认的长期保留承诺。"
anchor = "alibaba-dpa-termination-backup-exception"

[product.processing_region]
codes = ["selected"]
anchor = "alibaba-regions-access-and-storage-location"

[[product.processing_region.point]]
text = "developer_data (high): the Regions documentation — \"Regions determine the access point and data storage location\", \"Request data is stored in that region.\", \"Your static data always remains in the selected region.\" — the storage location and access point are set by the selected region"
text_zh = "developer_data(高):地域文档「Regions determine the access point and data storage location」「Request data is stored in that region.」「Your static data always remains in the selected region.」——数据存放地与接入点由所选 region 决定"

[[product.processing_region.point]]
text = "Where inference runs is set by the service deployment scope (Global or a geographic-boundary scope, one or the other; Singapore has only International, China (Beijing) has only mainland China). Contractual support: Product ToS §4.48.1(g)(viii) \"Member Content … will be transferred to, stored, and processed in the country where Alibaba Cloud, its affiliates, or its sub-contractors maintain facilities for Model Studio Service\", plus the customer's designation"
text_zh = "推理执行地由 service deployment scope 决定(Global 与地理边界 scope 二选一,Singapore 只有 International、China (Beijing) 只有中国大陆)。合同佐证:Product ToS §4.48.1(g)(viii)「Member Content … will be transferred to, stored, and processed in the country where Alibaba Cloud, its affiliates, or its sub-contractors maintain facilities for Model Studio Service」+ 客户指定"

[[product.processing_region.point]]
text = "DPA §6.1「You decide where to store Data (Selected Region)」"

[[product.processing_region.point]]
text = "Trust Center FAQ 4.2: \"only stores and processes each customer's content in the Alibaba Cloud Region(s) that is chosen by the customer\". **Boundary**: with the Global scope selected, inference nodes may cross geographic boundaries (stated in the docs), so \"data does not leave the selected region\" holds for storage and static data but not for inference execution"
text_zh = "Trust Center FAQ 4.2「only stores and processes each customer's content in the Alibaba Cloud Region(s) that is chosen by the customer」。**边界**:选 Global scope 时推理节点可跨地理边界(文档明示),故「数据不离开所选 region」只对存储与静态数据成立,对推理执行不成立"

[[product.processing_region.point]]
text = "The China site (Beijing region, dashscope.aliyuncs.com) and the Hong Kong region both sit in the alibabacloud.com region list, but the China site has a different account system and contracting entity and must be kept separate from alibaba-cn"
text_zh = "中国站(Beijing region, dashscope.aliyuncs.com)与香港 region 同在 alibabacloud.com 的 region 列表内,但中国站账号体系与协议主体不同,须与 alibaba-cn 分开"

[product.role]
kind = "processor"
anchor = "alibaba-dpa-processor-appointment"

[[product.role.point]]
text = "contract (high): DPA §3 \"You (the controller or processor) appoint Alibaba Cloud as Your processor to process the Data, for the duration of the Agreement, solely for the purpose of providing the Alibaba Cloud Services to You\", plus Appendix 1 for the data importer: \"Role (controller/processor): Processor\""
text_zh = "contract(高):DPA §3「You (the controller or processor) appoint Alibaba Cloud as Your processor to process the Data, for the duration of the Agreement, solely for the purpose of providing the Alibaba Cloud Services to You」+ Appendix 1 数据进口方「Role (controller/processor):Processor」"

[[product.role.point]]
text = "Product ToS §4.48.1(b)「Any processing of Member Content … is for your purposes and on your behalf」"

[[product.role.point]]
text = "The DPA is incorporated into the Membership Agreement as an annex (annex list: \"Data Processing Addendum to Alibaba Cloud Membership Agreement Applicable to all users\"). **Two exceptions that must be stated plainly**: (1) under §1 the DPA applies only where Data Protection Legislation requires it, and only to \"personal data contained in or generated in relation to Your Member Content\" processed as a processor — personal data collected for Alibaba Cloud's own purposes, such as account registration, is still controller data (the international-site privacy policy carries the dual-role wording \"In cases where we act as a processor…\")"
text_zh = "DPA 附件形式并入会员协议(会员协议附件清单「Data Processing Addendum to Alibaba Cloud Membership Agreement Applicable to all users」)。**两个必须写清的例外**:①DPA 按 §1 仅在数据保护法要求时适用,且只覆盖「以 processor 身份处理的 Member Content 个人信息」——账号注册等以阿里云自身目的收集的个人数据仍是 controller(国际站隐私政策有「In cases where we act as a processor…」的双角色表述)"

[[product.role.point]]
text = "(2) When a third-party model API on Model Studio is used, Product ToS §4.48.2(c) states plainly that \"Alibaba Cloud does not perform the role of data processor or controller with respect to any personal data processed by such Third-party Model Service\"; the Marketplace Supplemental says the same, and the third-party model terms add that the Marketplace platform side \"have no access to …; will not process …\" End User Data — in that path Alibaba Cloud is not the processor of that chain, and the role is taken up by the vendor's EULA / vendor DPA (the vendor being Processor or sub-Processor). **Entity**: the default contracting entity on the international site is Alibaba Cloud (Singapore) Private Limited (with separate entities for the EEA/UK, the United States and Malaysia), not the same entity as Tongyi Yunqi (Hangzhou) on the China site"
text_zh = "②走 Model Studio 三方模型 API 时,Product ToS §4.48.2(c) 明确「Alibaba Cloud does not perform the role of data processor or controller with respect to any personal data processed by such Third-party Model Service」,Marketplace Supplemental 同义,三方模型条款进一步写明 Marketplace 平台方对 End User Data「have no access to …; will not process …」——此时阿里云不是该链路的 processor,角色由厂商 EULA/厂商 DPA 承接(厂商为 Processor/sub-Processor)。**主体**:国际站默认签约主体 Alibaba Cloud (Singapore) Private Limited(EEA/UK/美国/马来西亚另有主体),与中国站通义云启(杭州)不是同一实体"

[[product.role.point]]
text = "Membership Agreement §5.2 (Investigation and Enforcement) is a second and broader exception alongside §4.1: to comply with applicable law, legal process or lawful government requests, or in respect of any claims or potential claims brought against us, or our shareholders, subsidiaries or affiliates, we shall have the right to access, disclose and/or remove any content you published on or submitted to us (including any Member Content). Object = content including Member Content (i.e. Input and Output where those are Member Content); no time limit is stated. **Boundary**: it is an access, disclosure and removal right — not a training licence and not a retention period — and it must not be merged with §4.1 into one general authorisation."
text_zh = "会员协议 §5.2(Investigation and Enforcement)是 §4.1 之外的第二类、更宽的例外:为遵守适用法律、法律程序或合法政府请求,或为应对针对阿里云及其股东/子公司/关联方的索赔或潜在索赔,阿里云有权访问、披露和/或删除你发布或提交的任何内容(含 Member Content)。对象=内容(含 Member Content,即属于 Member Content 的输入输出);未设期限。**边界**:这是访问、披露与删除权,不是训练授权、也不是保留期限,不能与 §4.1 合并读成一条概括授权。"
anchor = "alibaba-ma-enforcement-access-disclosure"

[[product.role.point]]
text = "Membership Agreement §8.5(c): the licence granted by the customer to use Member Content described in Clause 4.1 continues notwithstanding suspension or termination — the vendor's permission to use Member Content does not automatically end with the contract. **Flag**: §4.1 in this snapshot grants no such licence, so this is a cross-reference inconsistency to confirm with the vendor rather than a settled usage right."
text_zh = "会员协议 §8.5(c):客户就 Clause 4.1 所指 Member Content 授予的使用许可,在暂停或终止后继续存在——厂商对 Member Content 的使用权不随合同自动终止。**标注**:本快照 §4.1 并未授予该许可,属条款交叉引用不一致,需人工确认,不宜当作已确定的使用权。"
anchor = "alibaba-ma-licence-survives-termination"

