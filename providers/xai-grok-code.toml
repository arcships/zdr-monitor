[[product.role.point]]
text = "This tier shares the consumer documents with the individual subscription tier and has no role clause of its own: the Consumer FAQ and the Privacy Policy never use controller or processor for SpaceXAI's own position, and the reverse delimitation 『This Privacy Policy does not apply to data that we process on behalf of customers of our business offerings, such as the SpaceXAI API』 keeps the on-behalf-of-customer path out of this relationship. Recorded as controller on that scope reading, not on a self-designation."
text_zh = "本档与个人订阅档共用消费档文档、没有自己的角色条款：消费 FAQ 与隐私政策都没有用 controller / processor 描述 SpaceXAI 自身，反向界定『This Privacy Policy does not apply to data that we process on behalf of customers of our business offerings, such as the SpaceXAI API』把代客处理路径排除在本关系之外。据此按范围推断记独立控制方，而非厂商自我定性。"
anchor = "xai-consumer-own-purpose-training"

