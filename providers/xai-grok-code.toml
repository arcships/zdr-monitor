[[product]]
id = "supergrok"
badge = "SuperGrok"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "grok-build-retain-improve"

[[product.training.point]]
text_zh = "SuperGrok 账号登录的 Grok Build CLI 会显示是否允许保留数据以改进产品和模型的选择，并可之后修改；未排除模型训练，因此按 training=no。Grok.com Build 在 Improve the model 开启时也可能用于产品与模型改进。"

[product.zdr]
mark = "unknown"
searched = ["https://docs.x.ai/developers/faq/security.md", "https://docs.x.ai/build/overview.md", "https://x.ai/legal/faq", "https://x.ai/legal/privacy-policy"]

[[product.zdr.point]]
text_zh = "订阅账号登录路径未承诺 ZDR。文档中的 ZDR 是 API team 级能力；如改用 XAI_API_KEY，则属于 xAI API 档，而非 SuperGrok 订阅链路。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "grok-build-code-retention-toggle"

[[product.retention.point]]
text_zh = "非 ZDR 的 CLI 可在 /privacy 或 /settings 关闭代码数据留存，但官方未披露开关默认值及关闭前/开启时的期限。Grok.com Build 为跨会话功能保留 chats/build sessions，且当前不可用 Private Chat；代码索引与服务端缓存期限同样未披露。"

[product.processing_region]
codes = ["GLOBAL"]
anchor = "xai-consumer-us-company"

[[product.processing_region.point]]
text_zh = "消费订阅路径只披露 SpaceXAI 是美国公司，未承诺处理区域或数据驻留；API 的 US endpoint 保证不可外推。"

[product.role]
kind = "controller"
anchor = "xai-consumer-us-company"

[[product.role.point]]
text_zh = "消费 FAQ 将 SuperGrok/Grok.com 定义为面向个人用户的服务，由 SpaceXAI LLC 提供；未见将 SpaceXAI 定义为受托 processor 的条款，按消费端 controller 记录。"

