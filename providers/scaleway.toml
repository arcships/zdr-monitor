name = "Scaleway"
line = "scaleway"
site = "global"
entity = "Scaleway, S.A.S. / Scaleway Italia S.R.L."
endpoint = ""
doc = "https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/"

[[source]]
url = "https://www-uploads.scaleway.com/Conditions_Generales_de_Services_v2026_a0028de41c.pdf"
channel = "contract"
tier = "core"
note = "Scaleway《General Terms of Services》英法双语合订本，正文标注 Version of 07/04/2026（/en/contracts/ 页面把它标为「General Terms of Services (v.09/06/26)」，页面标签与文档内版本号不一致，见 notes）。§13.3 是合同层的删除承诺：服务终止后不超过十天，客户未自行删除的 Content 自动永久删除，且「Scaleway undertakes not to retain any copy of said Content」；§17 区分缔约/账户数据的控制者身份；§23 规定签约实体按账单地址确定（法国 Scaleway S.A.S. / 意大利 Scaleway Italia S.R.L.）。"

[[source]]
url = "https://www-uploads.scaleway.com/DPA_2024_ENG_b0abb5cc26.pdf"
channel = "contract"
tier = "core"
note = "Scaleway《Data Processing Agreement》Version of June 1st, 2024（/en/contracts/ 当前挂的 DPA，English）。role 维度主证据：正文自述「the Client acts as Data Controller or Data Processor and Scaleway acts as Data Processor or Sub-processor」，§11.1 服务默认位于欧盟，§13.1 合同结束即停止处理并删除数据及副本。抓取通道说明：r.jina.ai 对该 PDF 稳定返回 422/403（PDF 处理器拒绝），正文由本地 pypdf 抽取 PDF 文本层后按空白归一化提取锚点（锚点匹配本身忽略所有非字母数字字符，故与文本层逐字一致）。"

[[source]]
url = "https://www-uploads.scaleway.com/Specific_Conditions_AI_Services_275907180f.pdf"
channel = "contract"
tier = "core"
note = "《Specific Conditions Applicable to AI Services》Version of 07/04/2026（合同层，/en/contracts/ 页面当前挂的 AI Services 专用条款，176 ko）。适用范围由 §1 定义：Generative API（serverless）与 Managed Inference（即现在的 Dedicated Deployment）两档。§4.4 是本家 zdr/training 的最强依据：「Scaleway does not retain any requests or generated Content after processing」+ 四条否定式清单；§2.1.2 是 Dedicated Deployment 的处理位置条款；§4.4 末段给 Batch 输入 24 小时。锚点取自 r.jina.ai 对该 PDF 的 markdown 渲染（19,407B），与 PDF 文本层逐字一致。"

[[source]]
url = "https://www.scaleway.com/en/docs/cockpit/concepts/"
channel = "developer_data"
tier = "core"
note = "Scaleway Cockpit 概念页的 Retention 表。Generative APIs 的用量指标存放在 Cockpit（见 security-and-reliability 页），本页给出数据源级保留期：Scaleway metrics 最小 31 天、默认 31 天、上限 1825 天；Scaleway logs 默认 7 天、最小 1 天。用于把「用量指标」这一对象的保留期写成可核对区间。"

[[source]]
url = "https://www.scaleway.com/en/docs/generative-apis/faq/"
channel = "developer_data"
tier = "core"
note = "Generative APIs 官方 FAQ。两处关键：①Serverless 全部模型托管在巴黎（OPCORE 数据中心），Dedicated Deployment 由客户选区域、Scaleway 建议用它保证单区域处理；②「How does token caching work?」披露 Serverless 平台会按请求频次自动持久化 token 缓存、缓存按 Project 隔离，但未披露缓存保留期。后者与 data-privacy 页「不 collect/read/reuse/analyze 输入内容」并存，是本家 zdr/retention 最需要人工确认的一处张力。"

[[source]]
url = "https://www.scaleway.com/en/docs/generative-apis/how-to/create-deployment/"
channel = "developer_data"
tier = "core"
note = "Dedicated Deployment 部署步骤页（.md validation: 2026-04-16）。唯一作用是证明 dedicated-deployment 档的部署区域由客户在控制台下拉选择（与 Serverless 固定巴黎不同）。"

[[source]]
url = "https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/"
channel = "developer_data"
tier = "core"
note = "Generative APIs 官方数据隐私政策（文档站，页面标注 Reviewed on October 03, 2025，.md 版本 validation: 2025-10-03）。覆盖 api（Serverless）与 dedicated-deployment 两档的公共条款，是 zdr 主结论与 processing_region 的文档层来源；文首自述「supplements the General Privacy Policy and the AI Services Specific Conditions (PDF)」，即合同层优先。"

[[product]]
id = "api"
badge = "Serverless"
category = "api"
plan_level = "free"
label = "Generative APIs - Serverless（按 token 计费，含 Batch Processing 与 Free Tier）"

[product.training]
mark = "yes"
anchor = "contract-not-used-to-train"
mode = "default"

[[product.training.point]]
text = "See top-level training. Contract §4.4 covers this tier"
text_zh = "见顶层 training。合同 §4.4 覆盖本档"

[[product.training.point]]
text = "The docs site data-privacy §3 and the product page state alike that Scaleway does not collect, read, reuse, or analyze the content of your inputs, prompts, or outputs generated by the API. The Free Tier discloses no different data-use terms."
text_zh = "文档站 data-privacy §3 与产品页同样声明不收集/读取/复用/分析输入内容。Free Tier 未披露任何不同的数据使用条款。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "contract-no-retention-after-processing"

[[product.zdr.point]]
text = "See top-level zdr: \"By default we apply a Zero Data Retention Policy\", with no application required"
text_zh = "见顶层 zdr：默认适用，无需申请"

[[product.zdr.point]]
text = "The exceptions are temporary retention for abuse investigation (up to 2 weeks), storage for the duration of Batch processing (up to 24 hours), and the token cache, whose retention period is not disclosed."
text_zh = "例外为滥用临时留存（≤2 周）、Batch 处理期间存储（≤24 小时）、未披露保留期的 token 缓存。"

[product.retention]
object = "mixed"
basis = "none"
anchor = "contract-no-retention-after-processing"

[[product.retention.point]]
text = "See top-level retention: for standard synchronous processing, \"Scaleway does not retain any requests or generated Content after processing\""
text_zh = "见顶层 retention：标准同步处理不落数据"

[[product.retention.point]]
text = "Under the abuse exception Scaleway may temporarily store and access the full content of HTTP requests (the docs site gives a cap of two weeks)"
text_zh = "滥用例外可临时留存完整 HTTP 请求内容（文档站给上限两周）"

[[product.retention.point]]
text = "Batch inputs are stored only for the duration of processing, i.e. twenty-four (24) hours"
text_zh = "Batch 输入仅存处理期间（≤24 小时）"

[[product.retention.point]]
text = "For usage metrics see data-privacy §4, \"Aggregated and anonymized data is stored for up to 6 months\", and Cockpit, where Scaleway metrics have a minimum and default retention of 31 days and a cap of 1825 days"
text_zh = "用量指标见 data-privacy §4「up to 6 months」与 Cockpit「Scaleway metrics 最小/默认 31 天、上限 1825 天」"

[[product.retention.point]]
text = "Account data is handled under the general privacy policy"
text_zh = "账户数据按通用隐私政策"

[[product.retention.point]]
text = "After service termination, GTC §13.3 provides for deletion within ten days, with Scaleway undertaking not to retain any copy. The token cache retention period is not disclosed."
text_zh = "服务终止后 GTC §13.3 十天内删除且不留副本。token 缓存保留期未披露。"

[product.processing_region]
codes = ["FR"]
anchor = "dpa-services-in-eu"

[[product.processing_region.point]]
text = "See top-level processing_region (1) and (2)."
text_zh = "见顶层 processing_region ①②。"

[product.role]
kind = "processor"
anchor = "dpa-processor-subprocessor"

[[product.role.point]]
text = "See top-level role: for service content, \"Scaleway acts as Data Processor or Sub-processor, within the meaning of the GDPR\""
text_zh = "见顶层 role：对服务内容 Scaleway 是 Data Processor / Sub-processor"

[[product.role.point]]
text = "The controller layer in GTC §17 covers only contracting and account data."
text_zh = "GTC §17 的 controller 层只覆盖缔约与账户数据。"

[[product]]
id = "dedicated-deployment"
badge = "专属部署"
category = "api"
plan_level = "enterprise"
label = "Generative APIs - Dedicated Deployment（前 Managed Inference，按小时/月计费，专属隔离环境）"

[product.training]
mark = "yes"
anchor = "contract-not-used-to-train"
mode = "default"

[[product.training.point]]
text = "Same Contract §4.4 (§1 already lists Managed Inference under AI Services). The FAQ adds that fine-tuning or retraining requires a separate training environment on GPU Instances, i.e. this tier itself does no training."
text_zh = "同合同 §4.4（§1 已把 Managed Inference 列入 AI Services）。FAQ 另说明若要 fine-tune/retrain 需另用 GPU Instances 训练环境，即本档本身不做训练。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "contract-no-retention-after-processing"

[[product.zdr.point]]
text = "Same Contract §4.4"
text_zh = "同合同 §4.4"

[[product.zdr.point]]
text = "Processing on this tier takes place on the customer's dedicated, isolated resources (§2.1.2, \"The processing of Inputs and the generation of Outputs take place on private resources\"), but there is no separately disclosed cache retention statement for this tier."
text_zh = "本档处理发生在客户专属隔离资源上（§2.1.2「The processing of Inputs and the generation of Outputs take place on private resources」），但没有单独披露的、针对本档的缓存保留期说明。"

[product.retention]
object = "mixed"
basis = "none"
anchor = "contract-no-retention-after-processing"

[[product.retention.point]]
text = "The general clause of Contract §4.4 (no retention of requests or generated Content, no logging, exception for incidents) applies to this tier"
text_zh = "合同 §4.4 的通用条（不保留请求与生成内容、不留日志、异常例外）适用于本档"

[[product.retention.point]]
text = "§5.2「The deletion of a deployment is an irreversible action that erases all associated data and resources」"

[[product.retention.point]]
text = "The last paragraph of §4.4 makes the Client solely responsible for the lifecycle of its own data (backup, retention, deletion, archiving). Note: the Batch 24-hour clause is qualified by \"In the context of the Generative API Service\" and does not apply to Dedicated Deployment."
text_zh = "§4.4 末段明确客户对自身数据生命周期（备份、保留、删除、归档）负全责。注意：Batch 24 小时那条限定语是「In the context of the Generative API Service」，不适用于 Dedicated Deployment。"

[product.processing_region]
codes = ["EU"]
anchor = "cd-select-region"

[[product.processing_region.point]]
text = "See top-level processing_region (2). The region on this tier is a customer-selectable option, so it cannot be written on one line with Serverless's \"Paris\"."
text_zh = "见顶层 processing_region ②。本档区域是客户可选项，因此不能与 Serverless 的「巴黎」写成一行。"

[product.role]
kind = "processor"
anchor = "dpa-processor-subprocessor"

[[product.role.point]]
text = "Same as top-level role: the DPA covers \"the Services covered by the Contract\" and does not differentiate the role by tier."
text_zh = "同顶层 role：DPA 覆盖「the Services covered by the Contract」，未按档位区分角色。"

