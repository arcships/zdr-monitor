[product.training]
mark = "no"
anchor = "training-input-output-develop-improve"

[[product.training.point]]
text = "ToS IP §3 keeps the vendor's right to use input and generated content to develop and improve the Services — \"We may use the input and generated content to provide, maintain, develop, and improve our Services, comply with applicable law, enforce our terms and policies, and keep our Services safe.\" Neither the ToS nor the API Privacy Policy excludes model training, so under the house rule that \"improve the service\" counts as training the verdict stays no."
text_zh = "ToS IP §3 明文保留厂商把输入与生成内容用于 develop/improve 的权利——「We may use the input and generated content to provide, maintain, develop, and improve our Services…」。ToS 与 API 隐私政策都没有排除模型训练的表述，按「用于改进服务算训练」口径维持 no。"
anchor = "training-input-output-develop-improve"

[[product.training.point]]
text = "Same direction, contract side: ToS confidentiality §8 — \"Our use or disclosure of Confidential Information for the purpose of improving algorithms or enhancing services does not constitute a breach of confidentiality obligations.\""
text_zh = "同向依据（合同侧）：ToS 保密 §8——「Our use or disclosure of Confidential Information for the purpose of improving algorithms or enhancing services does not constitute a breach of confidentiality obligations.」"
anchor = "training-confidentiality-improving-algorithms"

[[product.training.point]]
text = "The only sentence in the whole privacy policy whose subject is training is a negative one, and it is narrower than it looks: \"Please note that we do not use your input personal data to infer characteristics about an individual, nor use personal data for training to profile or target consumers.\" It rules out training for profiling / targeting consumers only; it does not rule out model training, so it is not a basis for yes."
text_zh = "全份隐私政策里唯一以 training 为主语的句子是否定句，但范围比看上去窄：「Please note that we do not use your input personal data to infer characteristics about an individual, nor use personal data for training to profile or target consumers.」它只排除为画像/定向消费者而训练，没有排除模型训练本身，不构成 yes 的依据。"
anchor = "training-no-profiling-only"

[[product.training.point]]
text = "Consent boundary as written, not as a protection: the policy's listed purposes already include service improvement and research — \"Legal basis: Legitimate interests, for the purpose of research and development.\" — plus commercial utilization of de-identified or anonymized data. Only purposes not listed in the policy need separate prior explicit consent: \"when we plan to use your Personal Information for other purposes not specified in this Privacy Policy, we will obtain your explicit consent in advance separately.\" The listed purposes therefore need no further consent; this clause is not a limit on training."
text_zh = "同意边界按原文写、不写成保护条款：政策已列用途本身就含服务改进与研发——「Legal basis: Legitimate interests, for the purpose of research and development.」——以及去标识化/匿名化后的商业利用。只有政策未列出的新用途才需事先另行取得明示同意：「when we plan to use your Personal Information for other purposes not specified in this Privacy Policy, we will obtain your explicit consent in advance separately.」已列用途无需另行同意，这句不构成对训练的限制。"
anchor = "training-commercial-utilization-rd"

