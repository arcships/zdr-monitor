[[product.zdr.point]]
text = "Why this dimension is unknown rather than no: there is no ZDR or DPA page anywhere on the site (9 paths re-tested, all 404) and the agreements contain no zero-retention clause whose object is request content — the search scope is listed in searched[]. No document states that the platform retains request content for a period and offers no way out, so the conservative ✗ is recorded as \"no option disclosed\", not as \"terms state retention\". The cache documents cited below describe caching behaviour; they are not statements about a zero-retention option."
text_zh = "本维度记 unknown 而非 no 的理由：全站无 ZDR/DPA 页（9 条路径复测 404），协议正文无以请求内容为标的的零保留条款，查阅范围见 searched[]。没有任何文档写「平台保留请求内容且无退出方式」，所以保守的 ✗ 记成「厂商未公开方案」而不是「条款明示会留存」。下面引的缓存文档说的是缓存行为，不是关于零保留方案的表述。"

[[product.zdr.point]]
text = "The fact behind the verdict: caching is on by default — \"Passive caching that automatically identifies repeated context content without changing API call methods\" — so repeated request content is held on the server side without the customer changing the call. Neither this page nor the pages in searched[] states a way to turn passive caching off."
text_zh = "判定所依据的事实：缓存默认生效——「Passive caching that automatically identifies repeated context content without changing API call methods」——重复的请求内容会被留在服务端，客户无需改动调用方式。该页与 searched[] 所列页面都没有写关闭被动缓存的方式。"
anchor = "minimax-zdr-prompt-cache-passive-automatic-default"

[[product.zdr.point]]
text = "Scope of that default cache: \"Caching applies to API calls with 512 or more input tokens\"."
text_zh = "该默认缓存的适用范围：「Caching applies to API calls with 512 or more input tokens」。"
anchor = "minimax-zdr-prompt-cache-passive-512-token-threshold"

[[product.zdr.point]]
text = "The explicit (Anthropic-compatible) cache is time-boxed — \"Cached content has a lifetime of 5 minutes. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.\""
text_zh = "显式（Anthropic 兼容）缓存有明确期限——「Cached content has a lifetime of 5 minutes. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.」"
anchor = "minimax-zdr-prompt-cache-content-lifetime-5min"

[[product.zdr.point]]
text = "The default passive cache has no fixed period: \"Expiration time automatically adjusted based on system load\"."
text_zh = "默认走的被动缓存没有固定期限：「Expiration time automatically adjusted based on system load」。"
anchor = "minimax-zdr-prompt-cache-passive-expiration-load-dependent"

[[product.zdr.point]]
text = "What the cache holds: content blocks in the tools / system / messages.content arrays, for both user and assistant turns — \"Text messages: Content blocks in the `messages.content` array, for both user and assistant turns\"."
text_zh = "缓存里装的是什么：tools / system / messages.content 数组里的内容块，user 与 assistant 两向都算——「Text messages: Content blocks in the `messages.content` array, for both user and assistant turns」。"
anchor = "minimax-zdr-prompt-cache-what-can-be-cached"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "retention-necessary-or-permitted"

[[product.retention.point]]
text = "Object: request input and output. The policy quantifies nothing — \"We may retain and use your personal data for as long as it is necessary or permitted by law or to fulfil the purpose for which it was collected.\" — and determines the storage duration by listed criteria, one of which is \"Your agreement to a longer storage duration\". Basis is therefore as-needed, not a fixed period."
text_zh = "对象：请求输入输出。政策没有量化期限——「We may retain and use your personal data for as long as it is necessary or permitted by law or to fulfil the purpose for which it was collected.」——并按所列标准决定存储期限，其中一条是「Your agreement to a longer storage duration」。故 basis=as_needed，不是固定期限。"
anchor = "retention-necessary-or-permitted"

[[product.retention.point]]
text = "Deletion promise at the end of the period: \"After the storage duration expires, we will delete your personal information or anonymize your Personal Information in accordance with the applicable laws.\""
text_zh = "到期后的删除承诺：「After the storage duration expires, we will delete your personal information or anonymize your Personal Information in accordance with the applicable laws.」"
anchor = "retention-delete-after-expiry"

[[product.retention.point]]
text = "Exception under the EEA/UK/Switzerland addendum §2 — the deletion promise is not absolute: \"If applicable law requires us to retain copies of your updated, modified, or deleted information, copies of that information will be retained on our systems.\""
text_zh = "EEA/UK/瑞士附则 §2 的例外——删除承诺不是绝对的：「If applicable law requires us to retain copies of your updated, modified, or deleted information, copies of that information will be retained on our systems.」"
anchor = "retention-eu-copies-kept"

[[product.retention.point]]
text = "Object level, explicit prompt cache (opened by the customer via cache_control): \"Cached content has a lifetime of 5 minutes. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.\" This is a fixed period for cache entries, not a period for the request body as such."
text_zh = "对象级、显式提示缓存（客户用 cache_control 主动开启）：「Cached content has a lifetime of 5 minutes. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.」这是缓存条目的固定期限，不是请求正文本身的期限。"
anchor = "minimax-zdr-prompt-cache-content-lifetime-5min"

[[product.retention.point]]
text = "Object level, default passive prompt cache: no fixed period — \"Expiration time automatically adjusted based on system load\"."
text_zh = "对象级、默认走的被动提示缓存：无固定期限——「Expiration time automatically adjusted based on system load」。"
anchor = "minimax-zdr-prompt-cache-passive-expiration-load-dependent"

[[product.retention.point]]
text = "Object level, what the cache holds: content blocks in the tools / system / messages.content arrays, for both user and assistant turns — \"Text messages: Content blocks in the `messages.content` array, for both user and assistant turns\"."
text_zh = "对象级、缓存里装的是什么：tools / system / messages.content 数组里的内容块，user 与 assistant 两向都算——「Text messages: Content blocks in the `messages.content` array, for both user and assistant turns」。"
anchor = "minimax-zdr-prompt-cache-what-can-be-cached"

[[product.retention.point]]
text = "Context of the cache: \"Caching applies to API calls with 512 or more input tokens\"."
text_zh = "缓存的适用语境：「Caching applies to API calls with 512 or more input tokens」。"
anchor = "minimax-zdr-prompt-cache-passive-512-token-threshold"

[[product.retention.point]]
text = "Boundary, contract side: ToS §15's retain-then-delete promise covers only a storage function the customer purchased — \"If the specific service you purchased includes a storage function, upon expiration or termination of the service, we will retain any data or information you stored in the service for a specified period as outlined in the service rules.\""
text_zh = "边界（合同侧）：ToS §15 的「保留一段期限后删除」只覆盖客户自购的存储功能——「If the specific service you purchased includes a storage function, upon expiration or termination of the service, we will retain any data or information you stored in the service for a specified period as outlined in the service rules.」"
anchor = "retention-purchased-storage-feature-only"

[[product.retention.point]]
text = "Boundary after termination, as written — the two obligations run on different clocks: \"(a) You shall pay outstanding fees or other amounts under the order within 30 days of termination or expiration\" and \"(b) You shall delete the software and remove any applications and Client Data associated with the order from the services\"; the 30 days attach to (a) only, (b) carries no stated period. And \"Unless otherwise expressly agreed in writing, we are not obligated to provide you with Client Data associated with a terminated order.\""
text_zh = "终止后的边界，按原文写——两项义务的时钟不同：「(a) You shall pay outstanding fees or other amounts under the order within 30 days of termination or expiration」与「(b) You shall delete the software and remove any applications and Client Data associated with the order from the services」；30 天只挂在 (a) 上，(b) 没有期限。且「Unless otherwise expressly agreed in writing, we are not obligated to provide you with Client Data associated with a terminated order.」"
anchor = "retention-terminated-order-client-data"

[product.processing_region]
codes = ["US"]
anchor = "processing-region-us-data-center"

[[product.processing_region.point]]
text = "§9 of the API Privacy Policy is the sentence the codes=[US] verdict rests on, and it is main text rather than an addendum: \"Your personal data described in this Policy are stored in the data center located in the United States and processed by us or third-party vendors in accordance with the requirements of relevant laws and regulations, including the GDPR.\""
text_zh = "codes=[US] 以 API 隐私政策 §9 这句为准，它是政策正文、不是附则：「Your personal data described in this Policy are stored in the data center located in the United States and processed by us or third-party vendors in accordance with the requirements of relevant laws and regulations, including the GDPR.」"
anchor = "processing-region-us-data-center"

[[product.processing_region.point]]
text = "Conflicting wording kept as two facts, no side taken: the Singapore addendum §3(a) says the opposite direction for Singapore users — \"While we generally do not transfer your personal data to countries outside Singapore, if we need to transfer your personal data to our affiliates and/or third parties outside Singapore, please be assured that we will take reasonable steps to ensure that your personal data is accorded a standard of protection comparable at least to the protection under the Personal Data Protection Act 2012, or as may be modified from time to time (the “PDPA”).\" So: no transfer out of Singapore for Singapore users vs a US data center for users generally; the vendor offers no explanation for the divergence."
text_zh = "冲突并列保留、不选边：新加坡附则 §3(a) 对新加坡用户说的是相反方向——「While we generally do not transfer your personal data to countries outside Singapore…」。即：对新加坡用户「一般不向境外传输」vs 对全体用户「存放于美国数据中心」，官方未作解释。"
anchor = "processing-region-singapore-tension"

[[product.processing_region.point]]
text = "Same direction as §9, from a second addendum: the Malaysia addendum states \"In relation to Users in Malaysia, our servers are located in the United States and you consent to the transfer of your data outside of your country.\""
text_zh = "与 §9 同向的第二处附则：马来西亚附则「In relation to Users in Malaysia, our servers are located in the United States and you consent to the transfer of your data outside of your country.」"
anchor = "processing-region-malaysia-servers-us"

[[product.processing_region.point]]
text = "The service region is a selectable configuration, but the vendor publishes no list of selectable regions: ToS \"User Rights and Obligations\" item 8 opens with \"If you select the United States as the service region, you and any affiliates, employees, service providers, or any third parties under your control may not:\", and the export-control section's item 3(c) lists \"designating the service region for any of the above actions\". No region list is inferred from this."
text_zh = "服务区域是可配置项，但官方未公布可选区域清单：ToS『User Rights and Obligations』第 8 项以「If you select the United States as the service region…」开头，出口管制节第 3 项 (c) 另列「designating the service region for any of the above actions」。不据此推断区域列表。"
anchor = "region-us-service-region"

