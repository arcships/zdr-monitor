[[product.zdr.point]]
text = "The cited lines are \"Passive caching that automatically identifies repeated context content without changing API call methods\" plus \"Caching applies to API calls with 512 or more input tokens\", so the platform keeps request content in a server-side cache by default and the customer has no way to turn it off"
text_zh = "这条说的是「Passive caching that automatically identifies repeated context content without changing API call methods」+「Caching applies to API calls with 512 or more input tokens」，所以平台默认就把请求内容留在服务端缓存里、客户无从关闭"

[[product.zdr.point]]
text = "A sibling document separately states \"Cached content has a lifetime of 5 minutes. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.\" and what is cached is content blocks in system / messages.content / tools. There is no ZDR or DPA page anywhere on the site (9 paths re-tested, all 404), and the agreements contain no zero-retention clause whose object is request content. See dimensions.zdr."
text_zh = "同族文档另写「Cached content has a lifetime of 5 minutes. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.」且缓存对象是 system / messages.content / tools 的内容块。全站无 ZDR/DPA 页（9 条路径复测 404），协议正文无以请求内容为标的的零保留条款。详见 dimensions.zdr。"

