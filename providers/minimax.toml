[[source]]
url = "https://platform.minimax.io/docs/api-reference/anthropic-api-compatible-cache"
channel = "developer_data"
tier = "core"
note = "《Explicit Prompt Caching (Anthropic API)》API 文档（docs 站渲染通道抓取）。给出缓存条目的期限与缓存对象定义：「Cached content has a **lifetime of 5 minutes**. Each time the cached content is hit, the cache lifetime is automatically refreshed at no additional cost.」，What Can Be Cached 明列 system / messages.content（user 与 assistant 两向）/ tools 的内容块。只支撑 zdr：文档未说明缓存在内存还是落盘、未说明缓存条目是原始正文还是中间状态（KV），也未提供删除或退出缓存的方式。"

[[source]]
url = "https://platform.minimax.io/docs/api-reference/text-prompt-caching"
channel = "developer_data"
tier = "core"
note = "API 参考文档(Prompt Caching),非隐私政策正文(classify 自动判定为 not_policy)。人工判读后保留:它是本档 retention 维度的**对象级**证据——显式提示缓存(Anthropic 兼容)『5-minute expiration, automatically renewed with continued use』,被动缓存『Expiration time automatically adjusted based on system load』。不单独承载维度权威,只补充「缓存对象保留多久」。抓取通道:r.jina.ai 渲染版(3602B);同页的 .md 直连版(10052B)含相同表格行。"

[[source]]
url = "https://platform.minimax.io/protocol/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "国际站《MiniMax API Privacy Policy》(updated/effective March 30, 2026,控制者 Nanonoble Pte. Ltd.)。不分档:未区分按量 API 与 Token Plan,正文把 'Services Input & Output' 一并纳入处理范围,故同时覆盖本档。retention / processing_region / role 三个维度的权威来源,并为 training 提供反向限定句与商业利用依据。channel 判为 consumer_privacy：该文是平台自有隐私政策正文；platform.minimax.io 不存在企业隐私 FAQ 页，本轮实测 /protocol/enterprise-privacy-policy、/enterprise、/trust、/security、/dpa 均 404。"

[[source]]
url = "https://platform.minimax.io/protocol/terms-of-service"
channel = "contract"
tier = "core"
note = "国际站《MiniMax Terms of Service》(Effective Date: March 30, 2026,提供方 Nanonoble Pte Ltd.,新加坡)。覆盖 platform.minimax.io 全部付费形态,本档(Token Plan 订阅)亦受其约束:付费协议 §1.1 明示 Paid Services 含 'Token Plan subscriptions'。本档训练维度与实体/角色维度的权威来源;亦提供 retention 的边界条款(§15 仅针对自购存储功能)与 processing_region 的服务区域线索(§8 'If you select the United States as the service region')。本轮以 r.jina.ai 重抓,md5 与上一轮缓存逐字节一致(004e66e8370f846f585b820e06881d14)。"

