note = "NVIDIA API Trial Terms of Service（文末版本标注 v. September 19, 2025；HTTP 头 last-modified: Fri, 18 Sep 2026 14:20:12 GMT，214700 字节 PDF）——build.nvidia.com / NVIDIA API Catalog（integrate.api.nvidia.com）唯一公开的 NVIDIA 自有 API 条款，覆盖 API 试用档（免费 Credits 档）。本轮独立通读 9 页正文：§1.1 定义 API Catalog / User Content / Generated Content；§1.2「limited trial purposes only ... without use ... in production」；§1.4 生产使用须另购 Subscription（NVIDIA 或第三方 Service Provider），且「Subscription 的条款管辖你的生产使用」→ 生产/订阅档无公开 NVIDIA 条款。管辖关系由 build.nvidia.com 页面的 License and Governing Terms 段确认（见下条）。四步验证通过：非空、无 Something went wrong / Try again 壳、含大量「主体×动作」条款句（classify=policy，12 行）、旧引文 3 条归一化全部命中。全文检索：无 controller/processor 字样、无 data residency / 处理地披露、无 ZDR 术语或开通机制。"

