anchor = "processing-region-data-location-s1b"

[[product.processing_region.point]]
text = """Default when no region is selected, or when the service is not on the data-residency list (DPA §10.1, contract layer): "Customer Data may be processed in any country where Google or its Subprocessors maintain facilities", subject to Google's data location commitments under the Service Specific Terms and the data transfer commitments under Appendix 3. codes = ["selected"] therefore holds only where the service is listed at the data-residency page (Service Specific Terms §1.b) and the customer actually configures a Region or Multi-Region (or the AI/ML Multi-Region under §16); otherwise this default applies."""
text_zh = """未选地域、或所用服务不在 data-residency 列表内时的默认口径（DPA §10.1，合同层）：原文「Customer Data may be processed in any country where Google or its Subprocessors maintain facilities」，并受 Service Specific Terms 的数据位置承诺与附录 3 的数据传输承诺约束。因此 codes = ["selected"] 只在服务列入 data-residency 页（SST §1.b）、且客户实际配置了 Region/Multi-Region（AI/ML 场景见 §16）时成立；否则回落本句的默认。"""
