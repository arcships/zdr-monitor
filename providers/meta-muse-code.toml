[[product.training.point]]
text_zh = "订阅档走哪一套数据条款，取决于你选了哪个模型：§13.4『The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.』订阅默认给的是 Standard 模型，对应 §5.1——不拿 Standard Services 的 Content 训练 Meta 模型。"
anchor = "coding-harness-model-determines-use-13-4"

[[product.training.point]]
text_zh = "反过来也要看清：选到 Discounted（Contributor）模型就落到 §6.1，Meta 明确可以拿 Content 去训练、开发、评估和改进自己的模型。订阅帮助页只写『Access to the latest Muse models』，没枚举订阅能选哪些模型，也没说订阅用户能不能选 Discounted 档——这一层没核清。"
anchor = "training-discounted-6-1"

