  "https://dev.meta.ai/legal/commitments",
  "https://dev.meta.ai/help/subscriptions/what-is-a-muse-code-subscription",
]

[[product.zdr.point]]
text = "No ZDR wording covers this tier: the ToS never mentions ZDR or Zero Data Retention. The ZDR help page (declared as a source in this file) scopes ZDR to 『qualified Meta Model API accounts』, enables it 『at the organization level』 and 『requires separate enablement by Meta』, notes 『ZDR support may vary by model』, and adds that 『Requests made with a personal account, or with a key from a different organization, aren't covered』 while ZDR 『applies only to calls made directly to Meta Model API』. Whether a Coding Harness Subscription credential belongs to a qualified / ZDR-enabled organization is not stated anywhere, so this stays unknown — a gap in our evidence, not a Meta statement. The subscription help page is not declared as a source here and has no snapshot, so nothing in this verdict rests on it."
text_zh = "本档没有任何零保留表述：ToS 全文没有出现 ZDR / Zero Data Retention。ZDR 帮助页(已登记为本文件来源)把 ZDR 限定为面向『qualified Meta Model API accounts』，在『at the organization level』开通且『requires separate enablement by Meta』，并注明『ZDR support may vary by model』；同时写明『Requests made with a personal account, or with a key from a different organization, aren't covered』、ZDR『applies only to calls made directly to Meta Model API』。订阅凭据是否属于 qualified / ZDR-enabled 组织，官方没有表态，故维持 unknown——这是我方证据缺口，不是 Meta 的声明。订阅帮助页未登记为本文件来源、也没有快照，本判定不依赖它。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "retention-4-4"

[[product.retention.point]]
anchor = "retention-4-1-instruct-retain"
text = "On top of §4.4, §4.1 carries a separate standing instruction to retain and process Content: 『You instruct Meta to retain and process Content as necessary to detect, prevent, and respond to violations of our Model API AUP (defined below) or these Terms and to develop, evaluate, and improve systems for the safety and the security of Meta products and services.』 It sits in the general §4, so it applies to both tiers, and it states no period — the as-needed basis is not narrowed by it."
text_zh = "在 §4.4 之外，§4.1 另有一条长期有效的保留与处理指示：『You instruct Meta to retain and process Content as necessary to detect, prevent, and respond to violations of our Model API AUP (defined below) or these Terms and to develop, evaluate, and improve systems for the safety and the security of Meta products and services.』该条位于通用 §4，两档都适用，且未给期限——不缩小『按需保留』的口径。"

[[product.retention.point]]
anchor = "retention-6-1-discounted-retain"
text = "If the subscription selects a Discounted model (see §13.4), that tier adds its own retention grounds: §6.1 lets Meta 『also retain and process your Content: (i) to the extent necessary for compliance with applicable laws; (ii) in connection with the exercise of Meta’s rights to use your Content under this Section 6; and (iii) when our systems flag data for a potential policy violation』 — the training use itself is a ground for retention, on top of the purposes in §4.4. No period is given here either."
text_zh = "若订阅选到 Discounted 模型(见 §13.4)，该档另有保留依据：§6.1 允许 Meta『also retain and process your Content: (i) to the extent necessary for compliance with applicable laws; (ii) in connection with the exercise of Meta’s rights to use your Content under this Section 6; and (iii) when our systems flag data for a potential policy violation』——训练用途本身构成保留理由，叠加在 §4.4 的目的之外，同样不含期限。"

[[product.retention.point]]
anchor = "retention-12-confidentiality-not-limiting"
text = "Confidentiality does not cut the data terms down: §12 — 『Your Content constitutes your Confidential Information; however, Meta's rights to use, process, and retain Content as described in Sections 4, 5, and 6 are not restricted by this Section 12.』 §12 must not be read as protective deletion of confidential content."
text_zh = "保密条款不削减数据条款：§12 写明『Your Content constitutes your Confidential Information; however, Meta's rights to use, process, and retain Content as described in Sections 4, 5, and 6 are not restricted by this Section 12.』不应把 §12 读成机密内容会被保护性删除。"

[[product.retention.point]]
anchor = "retention-15-4-survive-termination"
text = "Termination is not deletion: §15.4(iii) lists the sections that survive, including 4, 5, 6 and 12, so the public terms carry no 『deleted on termination』 commitment — what survives is the clauses' force and Meta's rights, not a promise to keep the content. On the Discounted path the §6.1 training authorization survives with them."
text_zh = "终止不等于删除：§15.4(iii) 列出的存续条款包含 4、5、6、12，公开条款因此没有『终止即删除』的承诺——存续的是条款效力与 Meta 的权利，不等于承诺保留内容。在 Discounted 路径下 §6.1 的训练授权也随之存续。"

[[product.retention.point]]
anchor = "retention-zdr-aup-2y"
text = "The only quantified period we found is an upper bound and sits in the ZDR context rather than on the default path: the ZDR help page says 『If a request is flagged for an Acceptable Use Policy violation, Meta may retain the associated inputs and outputs for up to 2 years』 for abuse detection, integrity and content-safety enforcement and to meet legal obligations. Object = inputs and outputs; context = exception (AUP violation); type = upper bound. The default path still carries no quantified period."
text_zh = "我们找到的唯一量化期限是上限，且属 ZDR 语境、不在默认路径上：ZDR 帮助页写明『If a request is flagged for an Acceptable Use Policy violation, Meta may retain the associated inputs and outputs for up to 2 years』，用于滥用检测、完整性与内容安全执法及法律义务。对象是输入输出，语境是例外(AUP 违规)，类型是上限。默认路径仍无量化期限。"

[[product.retention.point]]
anchor = "retention-commitments-data-retention"
text = "Corroboration from the Data Commitments page (lower authority than the ToS): 『Meta will retain your Content as described in the Terms and Privacy Policy. You can view and delete your Content through your Account.』 That is a user-facing delete path, not a retention period."
text_zh = "Data Commitments 页的旁证(权威层级低于 ToS)：『Meta will retain your Content as described in the Terms and Privacy Policy. You can view and delete your Content through your Account.』这是用户侧删除入口，不是保留期限。"

[[product.retention.point]]
anchor = "subscription-relationship-3-2"
text = "Coverage gap, not a vendor statement: §3.2 says 『Your purchase of a Coding Harness Subscription, and the subscription relationship it creates, are governed by the Meta Subscription Terms of Service.』 That document is not declared as a source in this file and has no snapshot in the repository (our research notes record its URL as https://www.facebook.com/legal/meta_subs_terms), so any data-handling or retention terms it contains are not visible in these five dimensions. Bringing it in requires the fetch bot to return a snapshot first."
text_zh = "这是我方覆盖缺口、不是厂商的表态：§3.2 写明『Your purchase of a Coding Harness Subscription, and the subscription relationship it creates, are governed by the Meta Subscription Terms of Service.』该文件尚未登记为本文件来源、仓库也没有它的快照(调研记录里的地址是 https://www.facebook.com/legal/meta_subs_terms)，因此其中若有数据处理或保留约定，现有五个维度看不到。要把它纳入来源，需先由抓取 bot 取回快照。"

