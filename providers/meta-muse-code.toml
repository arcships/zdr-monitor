[product.role]
kind = "processor"
anchor = "role-processor-5-1"

[[product.role.point]]
anchor = "role-processor-5-1"
text = "The only role wording in the ToS is §5.1, and it sits under §5 (Standard Services): 『Meta will collect, use, process, and share such data as a “Service Provider” or “Processor” (each as defined in the MGPT) to you in relation to your use of the Services.』 §6 (both §6.1 and §6.2) contains no Service Provider or Processor wording at all, so the processor determination holds only when a Standard model is selected."
text_zh = "ToS 里唯一的角色表述在 §5.1，且挂在 §5(Standard Services)项下：『Meta will collect, use, process, and share such data as a “Service Provider” or “Processor” (each as defined in the MGPT) to you in relation to your use of the Services.』§6(§6.1、§6.2)全文没有任何 Service Provider / Processor 表述，因此 processor 定性只在你选到 Standard 模型时成立。"

[[product.role.point]]
anchor = "coding-harness-model-determines-use-13-4"
text = "The subscription tier produces no role clause of its own: per §13.4 which section applies depends on the model selected. Whether a Coding Harness Subscription defaults to a Standard model, and which models it may select, cannot be verified from any source registered in this file, so the processor determination recorded here is conditional."
text_zh = "订阅档本身不产生独立的角色条款：按 §13.4，适用哪一节取决于所选模型。订阅是否默认给 Standard 模型、可选哪些模型，在本文件已登记的来源里无法核实，因此此处记的 processor 定性是有条件的。"

[[product.role.point]]
anchor = "subscription-coding-harness-3-2"
text = "Scope anchor rather than role evidence: §3.2 defines the Coding Harness Subscription, states that access and use under it are governed by these Terms (which prevail over the Meta Subscription Terms of Service on conflict), and limits the key to that harness. It names no controller, processor or Service Provider."
text_zh = "这是范围锚点、不是角色证据：§3.2 定义 Coding Harness Subscription，写明其访问与使用同样受本 ToS 管辖(冲突时以本 ToS 为准)，并把凭据限定在该 harness 内使用。该节没有出现 controller / processor / Service Provider。"

