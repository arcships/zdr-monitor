[product.training]
mark = "yes"
mode = "by_tier"
anchor = "coding-harness-model-determines-use-13-4"

[[product.training.point]]
anchor = "coding-harness-model-determines-use-13-4"
text = "Which data terms a Coding Harness Subscription gets is determined by the model selected, not by the subscription itself: §13.4 『The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.』 With a Standard model, §5.1 applies and Meta 『will not use Content from Standard Services to train Meta Models』. The same §13.4 sentence says a Coding Harness Subscription 『does not provide any discount, fee reduction, or increased per-period allowance based on the Models you select, including Discounted Models』, from which we infer — our inference, not Meta's wording — that Discounted models are selectable under a subscription. Which models a subscription may select, and whether it defaults to a Standard model, cannot be verified from any source registered in this file: the subscription help page is not declared as a source here and has no snapshot, so no default model is asserted."
text_zh = "订阅档适用哪一套数据条款，由所选模型决定，而不是由订阅产品本身决定：§13.4『The Models you select determine how Meta may use your Content, as described in Sections 5 and 6.』选到 Standard 模型时适用 §5.1，Meta『will not use Content from Standard Services to train Meta Models』。同一句 §13.4 还写明订阅『does not provide any discount, fee reduction, or increased per-period allowance based on the Models you select, including Discounted Models』，由此推断(我们的推论、不是原文措辞)订阅下可选 Discounted 模型。订阅可选哪些模型、是否默认给 Standard 模型，在本文件已登记的来源里无法核实：订阅帮助页未登记为本文件来源、也没有快照，故此处不写默认模型。"

[[product.training.point]]
anchor = "training-standard-5-1"
text = "Where the no-training commitment comes from: §5.1 sits under §5, whose heading reads 『**5. Standard Services.** When you use Standard Services, the following terms apply:』, so it binds only when a Standard model is selected."
text_zh = "不训练承诺的出处：§5.1 挂在 §5 项下，该节标题写明『**5. Standard Services.** When you use Standard Services, the following terms apply:』，因此只在你选到 Standard 模型时成立。"

[[product.training.point]]
anchor = "training-discounted-6-1"
text = "The other side of the same fork: select a Contributor (Discounted) model and §6.1 applies — 『Meta may use your Content to train, develop, evaluate, and improve Meta’s artificial intelligence models, products, and services.』 §13.4's 『including Discounted Models』 wording means that path is reachable from a Coding Harness Subscription."
text_zh = "同一个分叉的另一边：选到 Contributor(Discounted)模型就落到 §6.1，Meta 明确『may use your Content to train, develop, evaluate, and improve Meta’s artificial intelligence models, products, and services』。§13.4 的『including Discounted Models』表明这条路径在订阅档下可达。"

[[product.training.point]]
anchor = "retention-4-1-instruct-retain"
text = "One boundary worth keeping: §4.1's instruction to retain and process Content covers detecting violations and 『develop, evaluate, and improve systems for the safety and the security of Meta products and services』 — safety and security systems, not Meta Models training. It does not undercut §5.1, but it does mean 『Content is not used for training』 must not be read as 『no Content is ever used to improve anything』."
text_zh = "一条值得写明的边界：§4.1 的保留与处理指示覆盖违规检测与『develop, evaluate, and improve systems for the safety and the security of Meta products and services』——对象是安全与滥用防护系统，不是 Meta Models 训练。它不推翻 §5.1，但意味着『Content 不训练』不能读成『任何数据都不用于改进』。"

[[product.training.point]]
anchor = "retention-15-4-survive-termination"
text = "The data sections survive termination: §15.4(iii) keeps §§4, 5, 6 and 12 in force after the Term ends, so on the Discounted path the §6.1 training authorization does not lapse with the agreement."
text_zh = "数据条款在协议终止后存续：§15.4(iii) 使第 4、5、6、12 节在协议终止后继续有效，因此在 Discounted 路径下 §6.1 的训练授权不随协议结束而失效。"

[[product.training.point]]
anchor = "training-upgrade-to-standard"
text = "Corroboration from the Data Commitments page (authority below the ToS, so not the main evidence): that page splits the policy by tier and adds 『If you do not want Content used for training, you may upgrade to Standard Services.』 The tier follows the model selected — it is not a property of the subscription."
text_zh = "Data Commitments 页的佐证(权威层级低于 ToS，不作主证据)：该页按档位分写政策，并写明『If you do not want Content used for training, you may upgrade to Standard Services.』档位随所选模型而定，不是订阅产品自带的属性。"

