[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "retention-necessary-or-permitted"

[[product.retention.point]]
text = "Same as top level: no quantified period (necessary / permitted by law / needed to fulfil the purpose for which it was collected), deleted or anonymized after the storage duration expires"
text_zh = "同顶层:无量化期限(必要/法律允许/实现收集目的所需),到期删除或匿名化"

[[product.retention.point]]
text = "Object level, explicit path: prompt cache entries expire after 5 minutes and the lifetime is automatically renewed with continued use (Anthropic-compatible explicit caching only)."
text_zh = "对象级、显式路径:提示缓存 5 分钟到期,持续使用自动续期(仅 Anthropic 兼容显式缓存)。"
anchor = "retention-cache-expiration"

[[product.retention.point]]
text = "Object level, default path: caching is on by default (\"Passive caching that automatically identifies repeated context content without changing API call methods\", applied to API calls with 512 or more input tokens) and its \"Expiration time automatically adjusted based on system load\" — request content left in that server-side cache has no fixed period."
text_zh = "对象级、默认路径:缓存默认开启(「Passive caching that automatically identifies repeated context content without changing API call methods」,适用于 512 及以上输入 token 的 API 调用),其「Expiration time automatically adjusted based on system load」——留在该服务端缓存里的请求内容没有固定期限。"
anchor = "retention-cache-expiration-passive"

[[product.retention.point]]
text = "Object level, uploads: Files API video_understanding video files are retained for up to 7 days and video_generation_input materials are valid for 7 days; the other upload purposes (voice_clone / prompt_audio / t2a_async_input) are given no period."
text_zh = "对象级、上传物:Files API 的 video_understanding 视频文件最长 7 天、video_generation_input 材料 7 天内有效;其余上传用途(voice_clone / prompt_audio / t2a_async_input)未给期限。"
anchor = "retention-uploaded-file-7-days"

[[product.retention.point]]
text = "Exception, EEA/UK/Switzerland addendum only: \"If applicable law requires us to retain copies of your updated, modified, or deleted information, copies of that information will be retained on our systems.\" This is a statutory carve-out from the deletion promise (\"in accordance with the applicable laws\"), not a contradicting commitment; retention lasts as long as applicable law requires."
text_zh = "例外,仅 EEA/UK/瑞士附则:「If applicable law requires us to retain copies of your updated, modified, or deleted information, copies of that information will be retained on our systems.」这是上述删除承诺(「in accordance with the applicable laws」)的法定例外,不是相反的承诺;保留期限为法律要求的期间。"
anchor = "retention-eu-copies-kept"

[[product.retention.point]]
text = "Paid Services Agreement §8.3(c): MiniMax may retain information after termination."
text_zh = "付费协议 §8.3(c) 终止后可保留。"

[product.processing_region]
codes = ["US"]
anchor = "processing-region-us-data-center"

[[product.processing_region.point]]
text = "Same as top level: personal data is stored in the data center located in the United States, and the EEA addendum says it is stored cross-border in Cloud's US data center in a manner certified under the EU-US Privacy Framework"
text_zh = "同顶层:个人信息存放于美国数据中心,EEA 附则称 Cloud 美国数据中心并走 EU-US Privacy Framework"

[[product.processing_region.point]]
text = "See also the selectable service region clause in ToS §8."
text_zh = "ToS §8 另见可选服务区域条款。"
anchor = "region-us-service-region"

[[product.processing_region.point]]
text = "Conflicting official wording in the same Privacy Policy, kept side by side: §9 says personal data \"are stored in the data center located in the United States\", while the Singapore addendum §3(a) says \"While we generally do not transfer your personal data to countries outside Singapore, if we need to transfer your personal data to our affiliates and/or third parties outside Singapore...\" and §3(b) makes providing personal data consent to such a transfer. Scope: the addendum speaks to users in Singapore, §9 is the main body; codes stay [\"US\"] on the strength of §9, and MiniMax gives no explanation of the divergence."
text_zh = "同一份隐私政策里两条官方表述并列保留:§9 称个人信息「are stored in the data center located in the United States」,新加坡附则 §3(a) 则称「While we generally do not transfer your personal data to countries outside Singapore, if we need to transfer your personal data to our affiliates and/or third parties outside Singapore...」,§3(b) 另规定提供个人信息即视为同意该等传输。适用范围:附则针对新加坡用户,§9 是正文;codes 依 §9 取 US,官方未解释这处分歧。"
anchor = "processing-region-singapore-tension"

[product.role]
kind = "controller"
anchor = "role-controller-nanonoble-eea"

[[product.role.point]]
text = "Same as top level: MiniMax identifies itself as the controller of the user's personal data (Nanonoble Pte. Ltd.)"
text_zh = "同顶层:对用户个人信息自认 controller(Nanonoble Pte. Ltd.)"

[[product.role.point]]
text = "The Client Data scenario does not state a processor role."
text_zh = "Client Data 场景未明示 processor。"

