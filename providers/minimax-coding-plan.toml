[[product]]
id = "coding-plan-personal"
badge = "Token Plan 个人版"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
anchor = "training-input-output-develop-improve"

[[product.training.point]]
text = "The individual Token Plan tiers (Plus / Max / Ultra, \"designed for individual, interactive developer use\" in the official docs) share one set of ToS + API Privacy Policy + Paid Services Agreement with the pay-as-you-go API and carry no tier-specific data clause → there is no \"not used for training\" commitment, and ToS IP §3 expressly allows input and generated content to be used to \"provide, maintain, develop, and improve our Services\"."
text_zh = "Token Plan 个人档(Plus / Max / Ultra,官方文档『designed for individual, interactive developer use』)与按量 API 共用同一份 ToS + API Privacy Policy + 付费协议,无档位专属数据条款 → 无『不用于训练』承诺,且 ToS IP §3 明文允许将输入与生成内容用于 develop/improve。"

[[product.training.point]]
text = "Scope limit: the only training-subject sentence in the API Privacy Policy negates something narrower — \"Please note that we do not use your input personal data to infer characteristics about an individual, nor use personal data for training to profile or target consumers.\" (in the same \"What information we collect from you\" section as the \"Services Input & Output\" item). It rules out training for profiling / targeting consumers only and does not exclude model training itself, so it bounds the scope of mark=no instead of reversing it."
text_zh = "范围限定:API 隐私政策里唯一以 training 为主语的句子否定的是更窄的一件事——「Please note that we do not use your input personal data to infer characteristics about an individual, nor use personal data for training to profile or target consumers.」(与「Services Input & Output」条目同属「What information we collect from you」章节)。它只排除「为画像/定向消费者而训练」,不排除模型训练本身,因此是限定 mark=no 的范围,而非翻转它。"
anchor = "training-no-profiling-only"

[[product.training.point]]
text = "Same direction (ToS §8 confidentiality): \"Our use or disclosure of Confidential Information for the purpose of improving algorithms or enhancing services does not constitute a breach of confidentiality obligations.\""
text_zh = "同向(ToS §8 保密条款):「Our use or disclosure of Confidential Information for the purpose of improving algorithms or enhancing services does not constitute a breach of confidentiality obligations.」"
anchor = "training-confidentiality-improving-algorithms"

[[product.training.point]]
text = "Same direction (API Privacy Policy, \"Commercial utilization\"): \"Legal basis: Legitimate interests, for the purpose of research and development.\""
text_zh = "同向(API 隐私政策「Commercial utilization」):「Legal basis: Legitimate interests, for the purpose of research and development.」"
anchor = "training-commercial-utilization-rd"

