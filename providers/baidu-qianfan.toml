[[product.zdr.point]]
text_zh = "同顶层 dimensions.zdr：官方文件中无 ZDR/零保留条款或开通方式；条款层明示的是存储授权，故记 mark=no（明确否定）而非「未披露」"

[[product.zdr.point]]
text_zh = "协议授权存储 + 平台可审查输入输出 → 默认非零保留。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "qf-sp-2-3-storage-auth"

[[product.retention.point]]
text = "Inputs and uploaded material: the Qianfan service-specific agreement §2.3 has you agree that Baidu may store and use the information content you provide/upload/input/publish for the purpose of providing this service, to the extent the law allows — no period, no deletion trigger, no default/exception split. §1.4 of the same page defines \"输出\" separately, so this clause covers inputs and uploads only, not model outputs."
text_zh = "输入与上传内容：千帆专项约定 2.3 约定您同意百度智能云为实现本服务目的，对您提供/上传/输入/发布的信息内容在法律允许的范围内进行存储及使用——无期限、无删除触发、不分默认与例外。同页 1.4 单独定义「输出」，故该条只覆盖输入与上传，不含模型输出。"
anchor = "qf-sp-2-3-storage-auth"

[[product.retention.point]]
text = "User business data: when the service term expires, the service is terminated early (including by agreement, or for any other reason) or the account is in arrears, Baidu keeps the data only during a buffer period whose length is set by the service-specific terms, product documentation or service description applicable to the service you ordered (not quantified in this document); when the buffer period expires Baidu deletes all user business data, including all cached or backup copies, and keeps none of it."
text_zh = "用户业务数据：服务期届满、服务提前终止（含协商一致提前终止或其他原因导致的提前终止）或您欠费时，仅在缓冲期内继续存储，缓冲期时限以您所订购的服务适用的专有条款、产品文档、服务说明所载明的时限为准（本文档未量化）；缓冲期届满删除所有用户业务数据，包括所有缓存或者备份的副本，不再保留。"
anchor = "bce-retention-buffer-delete"

[[product.retention.point]]
text = "Deletion on your instruction: if you release the service or delete data yourself, Baidu deletes your online data and, as instructed, keeps none of it."
text_zh = "按指令删除：您自行释放服务或删除数据的，百度智能云删除您的在线数据，按照您的指令不再保留该等数据。"
anchor = "bce-retention-user-delete-per-instruction"

[[product.retention.point]]
text = "Exception context: the Qianfan agreement §9 states that you must not provide confidential information, that Baidu has no confidentiality obligation over any of your content, and that Baidu may disclose your content to comply with laws, perform the agreement, prevent fraud or fix security or technical problems."
text_zh = "例外语境：千帆用户协议 §9 约定您不得向本服务提供保密信息、百度对您的任何内容没有任何保密义务，并可为遵守法律法规、履行本协议、防止欺诈、修复安全或技术问题而披露您的内容。"
anchor = "qf-disclosure-window-9"

[product.processing_region]
codes = ["selected"]
anchor = "bce-region-designate-storage"

[[product.processing_region.point]]
text = "Storage region is customer-selected: you can designate the region where your content is stored, and Baidu will not migrate your content out of the region you chose without your consent — except (a) migration required to comply with applicable laws or a binding order of a government authority, (b) migration on your instruction (you must ensure the necessary government permits and user authorisations), (c) to provide billing, management or technical services, or to investigate security incidents or breaches of this agreement."
text_zh = "存储区域由客户指定：您可以指定内容所存储的区域，未经您的同意不会从您选择的区域迁移——例外为 (a) 为遵守适用的法律法规或政府机关的约束性命令；(b) 依您的委托（您须确保已获得必要的政府许可及用户授权）；(c) 为提供账单、管理、技术服务，或因调查安全事件、调查违反本协议的行为。"

[[product.processing_region.point]]
text = "Processing location is not delimited: Baidu may process some data in the data centre region you use, and may also process data in the regions where its maintenance, operations, support and investigation systems and teams are located. The agreement does not state that storage or processing takes place in mainland China, and it publishes no list of available regions, so this file records customer-selected rather than CN."
text_zh = "处理地未限定：百度智能云可能会在您使用服务的数据中心区域处理一些数据，也可能会在其维护运营、支持和调查系统及团队的区域处理这些数据。协议未说明存储或处理发生在中国境内，也未公布可选地域清单，故本文件记 customer-selected 而非 CN。"
anchor = "bce-region-processing-areas"

[[product.processing_region.point]]
text = "The data centre is agreed case by case: Baidu stores user business data in the data centre you select, as agreed between you and Baidu. No regional endpoint is documented for the Qianfan API (this file records a single global endpoint)."
text_zh = "数据中心逐案约定：百度智能云在您选定的数据中心存储用户业务数据（经您与百度智能云协商一致）。千帆 API 无地域化 endpoint 文档（本文件只记录一个全局 endpoint）。"
anchor = "bce-region-datacenter-storage"

