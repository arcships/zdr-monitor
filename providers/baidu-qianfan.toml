[[product.role.point]]
text = "Limit on the processor characterisation, from the Qianfan product-level agreement §9 (which applies alongside the platform-level agreement): you must not provide confidential information, you acknowledge and agree that Baidu has no confidentiality obligation over any of your content, and Baidu may disclose your content to comply with laws, perform the agreement, prevent fraud or fix security or technical problems. Kept alongside the platform-level clause that Baidu does not make unauthorised use or disclosure of user business data beyond executing your service request; it does not change kind=processor."
text_zh = "受托处理的限制（来自千帆产品层协议 §9，与平台层协议并行适用）：您不得向本服务提供保密信息，您明确承认并同意百度对您的任何内容没有任何保密义务，且百度可为遵守法律法规、履行本协议、防止欺诈、修复安全或技术问题而披露您的内容。与平台层「就用户业务数据除执行您的服务要求外不进行任何未获授权的使用及披露」并列保留，不据此改判 kind。"
anchor = "qf-no-confidentiality-9"

[[product.role.point]]
text_zh = "隐私政策 §8 自认中立技术服务提供者、严格执行客户委托与指示。"

