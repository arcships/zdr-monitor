[product.training]
mark = "yes"
mode = "default"
anchor = "qf-training-5-1-6"

[[product.training.point]]
text_zh = "千帆自营模型 API(按量)：5.1(6) 不使用输入、模型输出、知识文档、数据集训练，数据集不与第三方共享。第三方模型/组件(模型广场)适用其自身协议(用户协议 §12)，不在本结论内。"

[[product.training.point]]
text = "Opposite-direction clause in the same agreement: §13.2 has the customer authorise Baidu to apply \"本服务相关数据\" (service-related data, not delimited to inference inputs and outputs) to \"服务性能优化、系统故障排查及风险控制管理\" — service performance optimisation, fault diagnosis and risk control. Under this ledger's rule that \"used to improve the service\" counts as training, that clause points the other way from §5.1(6). Both facts are kept side by side and are not adjudicated. Their scope differs and neither overrides the other: §5.1(6) covers inference inputs and outputs and uploaded knowledge documents/datasets, §13.2 covers undelimited service-related data."
text_zh = "同一协议里的相反方向条款：§13.2 由您授权百度智能云在合规处理的前提下，将「本服务相关数据」（未限定为推理输入输出）应用于「服务性能优化、系统故障排查及风险控制管理等」。按台账口径「用来改进服务算训练」，它与 §5.1(6) 方向相反，两条事实并列保留、不裁决。两者适用范围不同且互不覆盖：§5.1(6) 的对象是推理输入输出与上传的知识文档/数据集，§13.2 的对象是未限定的「本服务相关数据」。"
anchor = "qf-data-use-13-2-optimization"

