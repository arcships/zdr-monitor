[[product.zdr.point]]
text = "The gateway tier offers no zero-retention option, switch or application path"
text_zh = "网关档没有任何零保留选项、开关或申请方式"

[[product.zdr.point]]
text = "None of the 590 URLs on the docs site is a ZDR or DPA page. Multi-hop note: the upstream is a third-party commercial API, and whether ZDR can be applied for separately on each hop is not disclosed; this ledger does not infer from that that the hops can be combined into an enabled ZDR."
text_zh = "文档站 590 条 URL 无 ZDR/DPA 页。多跳提示：上游为第三方商业 API，各跳能否单独申请 ZDR 官方未披露，本台账不据此推定可组合开通。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "opencsg-aigateway-logs-include-prompts-retention-by-config"

[[product.retention.point]]
text = "The clearest official statement for this tier is that there is no uniform period: for gateway request records (input prompts, tool calls, output content), \"how logs are obtained, which fields they contain and the retention scope are determined by the deployment configuration\""
text_zh = "本档最明确的官方口径就是「没有统一期限」：网关请求记录（输入 Prompt、工具调用、输出内容）的「日志获取方式、字段与保留范围由部署配置决定」"

[[product.retention.point]]
text = "On caching, the docs speak of \"viewing how the upstream reuses the cache of the input context\", and billing includes input cache hits (cached_price_per_million), but cache retention and purge rules are not disclosed. Note also: this wording sits in the configuration context of Kubernetes/Helm self-deployment, and the corresponding values on the SaaS side are not disclosed item by item — it cannot be taken as the SaaS retention parameter, nor read in reverse as \"the SaaS side retains nothing\"."
text_zh = "缓存方面「查看上游对输入上下文的缓存复用情况」，且计费含输入缓存命中（cached_price_per_million），但缓存保留/清除规则未披露。另注意：该口径写在面向 Kubernetes/Helm 自部署的配置语境里，SaaS 侧对应取值官方未逐项披露——不能把它当成 SaaS 的保留期参数，也不能反推「SaaS 不保留」。"

[product.processing_region]
basis = "undisclosed"
anchor = "opencsg-aigateway-request-content-goes-to-upstream"

[[product.processing_region.point]]
text = "Gateway tier conclusion: request content is sent to the upstream model service selected by routing (including the fallback upstream), the processing location is determined by the upstream and the routing configuration, and the platform does not disclose its list of upstreams"
text_zh = "网关档结论：请求正文发往路由选中的上游（含备用上游），处理地由上游与路由配置决定，平台未披露上游清单"

[[product.processing_region.point]]
text = "The platform does commit to storing \"the user information it collects\" within China (Privacy Policy §3(1)), but that commitment does not cover the upstream's processing of request bodies. The public model list corroborates that the upstreams include third-party commercial APIs (llm_type=external_llm)."
text_zh = "平台自身对「收集的用户信息」有境内存储承诺（隐私政策 §三（一）），但该承诺不覆盖上游对请求正文的处理。公开模型列表可佐证上游含第三方商业 API（llm_type=external_llm）。"

[product.role]
kind = "controller"
anchor = "opencsg-aigateway-request-content-goes-to-upstream"

[[product.role.point]]
text = "Gateway tier role: the platform is a gateway and forwarder, User Agreement §1.1 places third-party services outside the scope of the agreement, the platform makes no commitment to act as the customer's entrusted processor, and it does not disclose the upstream entities"
text_zh = "网关档角色：平台是网关/转发方，用户协议 §一1 把第三方服务排除在协议范围外，平台未承诺作为客户的受托处理者，也未披露各上游主体"

[[product.role.point]]
text = "docs/model_access states that for commercial APIs the administrator configures the upstream endpoint and the provider credentials, i.e. the upstream relationship is configured on the customer side."
text_zh = "docs/model_access 说明商业 API 由管理员配置上游 Endpoint 与供应商凭据，即上游关系由客户侧配置。"

