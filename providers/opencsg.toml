[[product.zdr.point]]
text = "Same as top-level zdr: neither the policy document nor the site-wide resource bundle contains any zero-retention or no-storage statement, and there is no DPA entry point (/dpa, /trust, /security and /compliance all 302 → /errors/not-found → 404)."
text_zh = "同顶层 zdr：整份政策载体与全站资源包无零保留/不存储表述，无 DPA 入口（/dpa /trust /security /compliance 均 302→/errors/not-found→404）。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "opencsg-privacy-retention-purpose-bound"

[[product.retention.point]]
text = "Object = user information, default context: kept only for the period needed to achieve the purposes stated in this policy (an unquantified ceiling, purpose-bound), and beyond that period deleted or anonymized."
text_zh = "对象=用户信息，默认语境：只在达成本政策所述目的所需的期限内保留（未量化的上限，目的绑定），超出后删除或匿名化。"
anchor = "opencsg-privacy-retention-purpose-bound"

[[product.retention.point]]
text = "Object = information you provided or generated while using the service, context = after you delete your user information or close the account: the platform stops serving you, but that information still has to be kept for the time required by regulators — a floor, and a direct denial of \"deleted on termination\"."
text_zh = "对象=您在使用服务期间提供或产生的信息，语境=主动删除/注销之后：平台停止为您提供服务，但这些信息仍需按监管要求的时间保存——这是下限，直接否定「终止即删除」。"
anchor = "opencsg-privacy-retention-after-account-deletion"

[[product.retention.point]]
text = "Object = user information, context = the platform ceases operation: reasonable measures to protect it, including stopping further collection and deleting or anonymizing the personal information held."
text_zh = "对象=用户信息，语境=平台停止运营：采取合理措施保护，包括停止继续收集、对所持有的个人信息进行删除或匿名化处理。"
anchor = "opencsg-privacy-ceases-operation-deletion"

[[product.retention.point]]
text = "Object = information you have \"stored in this product\", context = the feature is cancelled: your rights in the product end immediately and that information may not be recoverable — this is not a retention period but the absence of any guarantee after termination."
text_zh = "对象=您在本产品中「储存的信息」，语境=功能取消：权益即刻终止，信息可能无法找回——这不是保留期限，是终止后不保证。"
anchor = "opencsg-user-agreement-termination-data-loss"

[[product.retention.point]]
text = "Object = records of unlawful content, context = reporting as required by law: such records are preserved and reported to the cyberspace authorities and competent departments."
text_zh = "对象=违法内容相关记录，语境=依法报告：我们会依法保存有关记录，并向网信部门和有关主管部门报告。"
anchor = "opencsg-user-agreement-illegal-content-records-preserved"

[[product.retention.point]]
text = "Deletion is on request, not automatic: in the situations listed in the policy you may ask us to delete your user information. A deletion request is a user-initiated right — it is not expiry on a schedule, and it is not a training opt-out switch either."
text_zh = "删除是「可申请」而非自动到期：在政策列举的情形中您可以提出删除用户信息的请求。删除请求权是用户主动行使的权利——不等于到期自动删除，也不构成训练退出开关。"
anchor = "opencsg-privacy-deletion-request-rights"

[product.processing_region]
codes = ["CN"]
anchor = "opencsg-privacy-storage-in-china"

[[product.processing_region.point]]
text = "See top-level processing_region: user information collected by the platform is in principle stored within the territory of the People's Republic of China, and any cross-border transfer requires separate consent and notification."
text_zh = "见顶层 processing_region：平台收集的用户信息原则上境内存储，出境需单独同意并告知。"

[product.role]
kind = "controller"
anchor = "opencsg-privacy-scope-platform-products"

[[product.role.point]]
text = "The platform speaks of itself as the party that collects, uses, shares, stores and protects your personal information, i.e. it stands on the controller side. This quote is only the policy's opening statement of purpose and scope, though: the public text never uses controller / processor / entrusted-party terminology, so the role is read off the structure of the policy rather than designated in it."
text_zh = "平台以「我们/本平台」为收集、使用、共享、存储和保护您个人信息的主体，即站在控制者一侧。但该句只是隐私政策开篇的目的与范围陈述：公开原文通篇没有出现控制者/受托方这类角色指定用语，角色是从政策结构推出的，不是原文指定的。"
anchor = "opencsg-privacy-scope-platform-products"

[[product.role.point]]
text = "Privacy Policy §2(1)3: the platform may entrust trusted partners to provide services and may share certain user information with them, and those partners have no right to use the shared information for any other purpose — the entrustment runs platform → partner, not customer → platform."
text_zh = "隐私政策 §二（一）3：平台可能委托受信赖的合作伙伴来提供服务并与伙伴共享某些用户信息，且合作伙伴无权将共享信息用于任何其他用途——委托方向是「平台委托、伙伴受托」，不是「平台是客户的受托方」。"
anchor = "opencsg-privacy-partner-sharing-scope"

[[product.role.point]]
text = "User Agreement §5.2: for content generated by deep-processing with the product's models, \"ownership and related rights belong to us and the lawful rights holders\", and the platform calls itself the technology provider and lawful rights holder — a rights-holder stance, which is incompatible with acting merely as a processor."
text_zh = "用户协议 §五2：对用户利用本产品模型深度加工生成的内容，「其所有权和相关权益均由我们和法定权利人所有」，平台自认技术提供者和法定权利人——这是权利人立场，与「仅为受托处理者」不相容。"
anchor = "opencsg-user-agreement-generated-content-ownership"

[[product.role.point]]
text = "User Agreement §1.1 draws the agreement's own boundary: it covers only data/model upload and download, app-space experience and competitions in this product, and does not include services provided to you by third parties."
text_zh = "用户协议 §一1 自设协议边界：仅针对本产品之数据、模型上传与下载、应用空间体验以及参与竞赛等活动，不包括第三方向您提供的服务。"
anchor = "opencsg-user-agreement-scope-excludes-third-party"

[[product.role.point]]
text = "No commitment to act as the customer's entrusted processor, and no DPA to sign."
text_zh = "无受托处理者承诺，无 DPA 可签。"

[[product]]
id = "api-gateway"
badge = "网关 API"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "opencsg-privacy-anonymized-ml-training"

[[product.training.point]]
text = "The gateway pages do not themselves disclose a training use. What they say is that gateway request records may include prompts, tool calls and streamed output and may be used for \"troubleshooting, auditing or follow-up analysis\", and that \"before call records are used for fine-tuning or retraining, complete authorization confirmation under the enterprise's data management process\" — the object of that authorization step is the enterprise's own data-management process, not a statement of the vendor's training use; the vendor makes no \"not used for training by default\" commitment and gives the customer no switch."
text_zh = "网关页本身没有披露训练用途：它只说请求记录可含 Prompt、工具调用及流式输出，用于排障、审计或后续分析，以及「将调用记录用于微调或再训练前，按企业的数据管理流程完成授权确认」——这一步的宾语是企业自己的数据管理流程，不是厂商训练用途的披露；官方也没有承诺「默认不用于训练」，没有给客户开关。"
anchor = "opencsg-aigateway-request-logs-and-retention-by-config"

[[product.training.point]]
text = "The determination therefore rests on the Privacy Policy that also covers this platform service (community tier §1(5)3): information collected, once de-identified or anonymized, may be used for machine learning or model algorithm training without further notice or consent, so value is permitted and this tier points the same way as the community tier. Confidence only reaches medium: that wording sits in a Kubernetes/Helm self-deployment context and the SaaS-side values are not disclosed item by item, and the upstream is a third-party commercial API whose own training use of request bodies is outside the coverage of OpenCSG's documents (a multi-hop chain, where a no on any hop makes the whole chain no)."
text_zh = "故本档判定依据的是同样覆盖本平台服务的《传神社区隐私政策》§一（五）3：去标识化/匿名化后的收集信息可用于机器学习或模型算法训练，无需另行通知与同意，value 取 permitted，方向与社区档一致。置信度只能到 medium：该口径写在面向 Kubernetes/Helm 自部署的语境里、SaaS 侧取值官方未逐项披露，且上游是第三方商业 API，上游对请求正文的训练用途不在 OpenCSG 文件覆盖范围内（多跳链路，任一跳为否即全链为否）。"
anchor = "opencsg-privacy-anonymized-ml-training"

[[product.training.point]]
text = "A processing step disclosed on the same page: AI Gateway can run content checks on model inputs and outputs — enterprise editions can configure a sensitive-word check chain, an optional LLM content-safety guard and plugin-based security scanning services — so request and response content may be inspected and may pass through a moderation model service; where the deployment supports it, explicitly configured trusted requests skip detection. The configuration items (aigateway.moderation.*) are written for self-deployment and the SaaS-side values are not disclosed, so this is the platform's stated capability rather than an SaaS parameter. It does not change the mark."
text_zh = "同页披露的处理环节：AI Gateway 可对模型输入与输出执行内容检测——企业版可配置敏感词检测链、可选的 LLM 内容安全守卫与插件接入的安全扫描服务——即请求与响应正文可能被检测、并可能经过审核模型服务；部署支持时，明确配置的可信请求可跳过检测。配置项（aigateway.moderation.*）面向自部署、SaaS 侧取值未披露，故这只是平台口径而非 SaaS 参数。不改变 mark。"
anchor = "opencsg-aigateway-input-output-moderation"

[product.zdr]
mark = "unknown"
searched = [
  "https://www.opencsg.com/docs/csghub/101/function/aigateway/security",
  "https://www.opencsg.com/docs/csghub/101/function/aigateway/observability",
  "https://www.opencsg.com/docs/csghub/101/function/aigateway/model_access",
  "https://www.opencsg.com/docs/sitemap.xml",
  "https://opencsg.com/policy",
  "https://opencsg.com/assets/zhHant-C0PgeVPf.js",
]

[[product.zdr.point]]
text = "The gateway tier offers no zero-retention option, switch or application path"
text_zh = "网关档没有任何零保留选项、开关或申请方式"

[[product.zdr.point]]
text = "None of the 590 URLs on the docs site is a ZDR or DPA page. Multi-hop note: the upstream is a third-party commercial API, and whether ZDR can be applied for separately on each hop is not disclosed; this ledger does not infer from that that the hops can be combined into an enabled ZDR."
text_zh = "文档站 590 条 URL 无 ZDR/DPA 页。多跳提示：上游为第三方商业 API，各跳能否单独申请 ZDR 官方未披露，本台账不据此推定可组合开通。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "opencsg-aigateway-logs-include-prompts-retention-by-config"

[[product.retention.point]]
text = "The clearest official statement for this tier is that there is no uniform period: for gateway request records (input prompts, tool calls, output content), \"how logs are obtained, which fields they contain and the retention scope are determined by the deployment configuration\""
text_zh = "本档最明确的官方口径就是「没有统一期限」：网关请求记录（输入 Prompt、工具调用、输出内容）的「日志获取方式、字段与保留范围由部署配置决定」"
anchor = "opencsg-aigateway-logs-include-prompts-retention-by-config"

[[product.retention.point]]
text = "Request records are also meant to be exported and handled by people: the troubleshooting page asks that real credentials be removed before submitting logs and that the call content be handled under enterprise rules — the records are taken out of the platform and looked at, which is exactly why credentials must be stripped first."
text_zh = "请求记录还会被导出并由人工处理：排障页要求「提交日志前移除真实凭据，并按企业规则处理调用正文」——记录本就是要拿出来看的，所以先要求剥离真实凭据。"
anchor = "opencsg-aigateway-log-submission-human-handling"

[[product.retention.point]]
text = "On caching, the docs speak of \"viewing how the upstream reuses the cache of the input context\", and billing includes input cache hits (cached_price_per_million), but cache retention and purge rules are not disclosed anywhere in these pages. Note also: this wording sits in the configuration context of Kubernetes/Helm self-deployment, and the corresponding values on the SaaS side are not disclosed item by item — it cannot be taken as the SaaS retention parameter, nor read in reverse as \"the SaaS side retains nothing\"."
text_zh = "缓存方面「查看上游对输入上下文的缓存复用情况」，且计费含输入缓存命中（cached_price_per_million），但缓存条目的保留时长与清除规则全文未披露。另注意：该口径写在面向 Kubernetes/Helm 自部署的配置语境里，SaaS 侧对应取值官方未逐项披露——不能把它当成 SaaS 的保留期参数，也不能反推「SaaS 不保留」。"
anchor = "opencsg-aigateway-prompt-cache-upstream"

[product.processing_region]
basis = "undisclosed"
anchor = "opencsg-aigateway-request-content-goes-to-upstream"

[[product.processing_region.point]]
text = "Gateway tier conclusion: request content is sent to the upstream model service selected by routing (including the fallback upstream), the processing location is determined by the upstream and the routing configuration, and the platform does not disclose its list of upstreams"
text_zh = "网关档结论：请求正文发往路由选中的上游（含备用上游），处理地由上游与路由配置决定，平台未披露上游清单"

[[product.processing_region.point]]
text = "The platform does commit to storing \"the user information it collects\" within China (Privacy Policy §3(1)), but that commitment does not cover the upstream's processing of request bodies. The public model list corroborates that the upstreams include third-party commercial APIs (llm_type=external_llm)."
text_zh = "平台自身对「收集的用户信息」有境内存储承诺（隐私政策 §三（一）），但该承诺不覆盖上游对请求正文的处理。公开模型列表可佐证上游含第三方商业 API（llm_type=external_llm）。"

[product.role]
kind = "controller"
anchor = "opencsg-user-agreement-scope-excludes-third-party"

[[product.role.point]]
text = "The role determination rests on the contract layer, not on the request-routing sentence: User Agreement §1.1 places third-party services outside the agreement's own scope (it covers only data/model upload and download, app-space experience and competitions in this product, and \"does not include services provided to you by third parties\"), and the platform makes no commitment to act as the customer's entrusted processor. The public text contains no controller/processor terminology, so this is a position read off the agreement's boundaries rather than a designated role."
text_zh = "角色判定落在合同层，不在「请求正文发往上游」那句上：用户协议 §一1 把第三方服务排除在协议范围外（仅针对数据、模型上传下载、应用空间体验与竞赛等活动，「不包括第三方向您提供的服务」），平台未承诺作为客户的受托处理者。公开原文没有出现控制者/受托方用语，故这是从协议边界推出的立场，不是原文指定的角色。"
anchor = "opencsg-user-agreement-scope-excludes-third-party"

[[product.role.point]]
text = "User Agreement §6.3: disputes arising from third-party software or technology used by this product are to be settled by the third party, and \"we bear no relevant liability\" — the platform does not take on the upstream's responsibility."
text_zh = "用户协议 §六3：本产品所使用的第三方软件或技术所引发的任何纠纷应由相关第三方负责解决，「我方不承担相关责任」——平台不与上游同责。"
anchor = "opencsg-user-agreement-third-party-tech-disclaimer"

[[product.role.point]]
text = "Gateway tier: the platform is a gateway and forwarder and does not disclose the upstream entities. (Background only — docs/model_access is not registered as a source in this file and has no snapshot — is that for commercial APIs the administrator configures the upstream endpoint and the provider credentials, i.e. the upstream relationship is configured on the customer side.)"
text_zh = "网关档：平台是网关/转发方，未披露各上游主体。（仅为背景——docs/model_access 在本文件里未登记为来源、没有快照——说明商业 API 由管理员配置上游 Endpoint 与供应商凭据，即上游关系由客户侧配置。）"

