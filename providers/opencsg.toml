anchor = "opencsg-privacy-anonymized-ml-training"
mode = "opt_out"

[[product.training.point]]
text = "See top-level training: collected information, once de-identified or anonymized, may be used for machine learning or model algorithm training, and such use requires no separate notification to or consent from you"
text_zh = "见顶层 training：去标识化/匿名化后的收集信息可用于机器学习或模型算法训练，且无需另行通知与同意"

[[product.training.point]]
text = "The parallel clauses on this tier are the User Agreement's right to review your input data and synthesized results, and the perpetual, irrevocable licence over \"contributed content\" (whose object is uploaded models and datasets, not API request bodies)."
text_zh = "同档并列条款为用户协议对输入与合成结果的审核权，以及对「贡献内容」的永久不可撤销许可（对象是上传的模型/数据集，不是 API 正文）。"

[product.zdr]
mark = "unknown"
searched = [
  "https://opencsg.com/policy",
  "https://opencsg.com/assets/zhHant-C0PgeVPf.js",
  "https://opencsg.com/academy/privacy",
  "https://opencsg.com/academy/terms",
  "https://opencsg.com/dpa",
  "https://opencsg.com/trust",
  "https://opencsg.com/security",
  "https://opencsg.com/compliance",
]

[[product.zdr.point]]
text = "Same as top-level zdr: neither the policy document nor the site-wide resource bundle contains any zero-retention or no-storage statement, and there is no DPA entry point (/dpa, /trust, /security and /compliance all 302 → /errors/not-found → 404)."
text_zh = "同顶层 zdr：整份政策载体与全站资源包无零保留/不存储表述，无 DPA 入口（/dpa /trust /security /compliance 均 302→/errors/not-found→404）。"

[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "opencsg-privacy-retention-purpose-bound"

[[product.retention.point]]
text = "See top-level retention points 1-5: retained for the period needed to achieve the purposes stated in the policy (no quantified cap) + after account deletion, retained for the time required by regulators (a floor) + deleted or anonymized if the platform ceases operation + records of unlawful content preserved as required by law"
text_zh = "见顶层 retention 第 1-5 点：目的所需期限（未量化上限）+ 注销后按监管要求保存（下限）+ 停止运营时删除/匿名化 + 违法记录依法保存"

[[product.retention.point]]
text = "Information \"stored in this product\" is not guaranteed to be recoverable once the feature is cancelled."
text_zh = "平台「储存的信息」在功能取消后不保证可找回。"

[product.processing_region]
codes = ["CN"]
anchor = "opencsg-privacy-storage-in-china"

[[product.processing_region.point]]
text = "See top-level processing_region: user information collected by the platform is in principle stored within the territory of the People's Republic of China, and any cross-border transfer requires separate consent and notification."
text_zh = "见顶层 processing_region：平台收集的用户信息原则上境内存储，出境需单独同意并告知。"

[product.role]
kind = "controller"
anchor = "opencsg-privacy-scope-platform-products"

[[product.role.point]]
text = "See top-level role (a)(d)(e): the platform identifies itself as the party collecting and using the information, claims rights in generated content, and imposes entrustment obligations on downstream partners"
text_zh = "见顶层 role (a)(d)(e)：平台自认收集使用主体、主张对生成内容享有权益、对下游合作伙伴作委托约束"

[[product.role.point]]
text = "No entrusted-processor commitment, and no DPA."
text_zh = "无受托处理者承诺，无 DPA。"

[[product]]
id = "api-gateway"
badge = "网关 API"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "opencsg-aigateway-request-logs-and-retention-by-config"
mode = "opt_out"

[[product.training.point]]
text = "Two statements govern the gateway tier: gateway request records may include prompts, tool calls and streamed output, and may be used for \"auditing, performance analysis and authorized data analysis\""
text_zh = "网关档的两条口径：请求记录可含 Prompt/工具调用/流式输出，可用于「审计、效果分析以及经授权的数据分析」"

[[product.training.point]]
text = "\"Before call records are used for fine-tuning or retraining, complete authorization confirmation under the enterprise's data management process\" — retraining is written as an action that requires authorization confirmation, but the vendor makes no \"not used for training by default\" commitment and gives the customer no switch. Combined with the de-identified training authorization in community-tier Privacy Policy §1(5)3 (the same policy also covers this platform service), the training determination for this tier points the same way as the community tier, so value is permitted, but confidence can only reach medium: the upstream is a third-party commercial API, and the upstream's training use of request bodies falls outside the coverage of OpenCSG's own documents (a multi-hop chain, where a no on any hop makes the whole chain no, and the upstream policy for this hop is not given in this provider's file)."
text_zh = "「将调用记录用于微调或再训练前，按企业的数据管理流程完成授权确认」——即再训练被写成需要授权确认的动作，但官方没有承诺「默认不用于训练」，也没有给客户开关。叠加社区档隐私政策 §一（五）3 的去标识化训练授权（同一份政策也覆盖本平台服务），本档训练判定与社区档同向，故 value 取 permitted，但置信度只能到 medium：上游是第三方商业 API，上游对请求正文的训练用途不在 OpenCSG 文件覆盖范围内（多跳链路，任一跳为否即全链为否，而本跳的上游政策本台账不在本家文件里给出）。"

