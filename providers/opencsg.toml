[[source]]
url = "https://opencsg.com/assets/zhHant-C0PgeVPf.js"
fetch = "jina"
channel = "contract"
tier = "core"
note = "这是 opencsg.com（传神社区 SaaS）自己的前端 i18n 资源包，不是政策页；但它是本轮唯一可机读的官方政策正文载体，站上 /policy 的三份协议全部逐字存在这个文件里。资源包内含三份同一法律文档的完整中文原文：《开放传神用户协议》（policy.protocal.line1-144，contract 层）、《传神社区隐私政策》（policy.policy.line1-141，生效日期 2023-10-20，consumer_privacy 层）、《充值服务协议》（policy.recharge.line1-39，仅计费）。此外同一文件还含这两份文档的繁体中文与英文全文（英文签约主体写作 Beijing OpenTrans Technology Co., Ltd.，与中文「北京开放传神科技有限公司」对应）。为什么必须用这个 URL：官方政策页 https://opencsg.com/policy 是 Vue SPA 路由（服务端 HTML 里只有 <privacy-page> 占位），r.jina.ai 渲染后正文为空（183B，见本文件 sources 里 /policy 的 render_error 条目），四步验证第 1-3 步都过不去；政策文字在该 SPA 里唯一的存在形式就是本资源包里的 policy.* 字符串字面量，而 r.jina.ai 对这个 .js URL 返回原样文本（1,226,963B，classify=fetched）。已知代价与风险，如实记录：(1) 该文件是构建产物，文件名带内容哈希 zhHant-C0PgeVPf，下一次前端发版 URL 本身会变（旧 URL 失效），需要 runner 侧配合重新发现；(2) 文件含全站 UI 文案，任何一次前端发版都会造成整份文档 version_id 变化，因此监控价值实际落在锚点上，不在文档哈希上；(3) 锚点的 prefix/suffix 有时取自 JS 结构（例如 \",line59:\"），因为条款是资源包里的字符串字面量，那是该载体的真实上下文，不是编造。全站关键词实测：整份资源包中「零保留/不保留/不存储/ZDR/zero data retention」0 命中；「个人信息处理者」「个人信息处理受托方」「控制者」0 命中；「委托处理」2 命中且都出现在知识产权举报流程里，与数据处理角色无关。"

[[source]]
url = "https://www.opencsg.com/docs/csghub/101/function/aigateway/observability"
channel = "developer_data"
tier = "core"
note = "传神社区文档中心《监控、日志与排障》（AI Gateway 专章）。补充 retention 语境：请求记录包含输入 Prompt、工具调用与输出内容，用途写为「审计、效果分析以及经授权的数据分析」，而「日志获取方式、字段与保留范围由部署配置决定」（与 security 页同旨，互相印证，无任何量化期限）。同时给出网关指标表，其中「Prompt 缓存率｜查看上游对输入上下文的缓存复用情况」证实上游侧存在输入上下文缓存，但全文未披露缓存条目的保留时长或清除规则。"

[[source]]
url = "https://www.opencsg.com/docs/csghub/101/function/aigateway/security"
channel = "developer_data"
tier = "core"
note = "传神社区文档中心《内容安全与数据处理》（AI Gateway 专章，页面标题即「内容安全与数据处理」）。这是本家唯一一页正面写「请求正文怎么被处理」的官方文档，覆盖 AI Gateway 档（平台托管推理、专属实例、第三方商业 API 三类上游都在此网关上路由）。三条对本台账有用的原文：(1)「网关的请求记录可包含 Prompt、工具调用及流式输出，用于排障、审计或后续分析。使用日志时需要明确部署中的收集范围、存储位置、访问权限与保留规则；这些规则由实际配置和企业数据要求共同决定」——保留期限在官方口径里是「由部署配置决定」，即不承诺任何统一期限；(2)「将调用记录用于微调或再训练前，按企业的数据管理流程完成授权确认，并选择符合使用范围的数据」——把「调用记录能否用于再训练」写成客户侧授权流程问题；(3)「请求内容会发送到路由选中的上游模型服务。需要将数据保留在企业内部时，请同时检查主用和备用上游」——多跳链路的官方自述。注意该文档的配置示例面向 Kubernetes/Helm 自部署（aigateway.moderation.* 配置项），同一套能力在 SaaS 上如何取值官方未逐项披露，因此这三条对 SaaS 档只能当「平台口径」，不能当「SaaS 参数」。"

[[product]]
id = "community-saas"
badge = "社区平台"
category = "web"
plan_level = "free"

[product.training]
mark = "no"
anchor = "opencsg-privacy-anonymized-ml-training"

[[product.training.point]]
text = "Privacy Policy §1(5)3: collected information, once de-identified or anonymized, may be used for machine learning or model algorithm training, and such use requires no separate notification to you or consent from you — the clause itself rules your choice out, and the same resource bundle describes no in-product training opt-out, so no mode is recorded (mark=no with no mode reads as \"permitted by the terms\")."
text_zh = "隐私政策 §一（五）3：去标识化/匿名化后的收集信息可用于机器学习或模型算法训练，且此类使用无需另行通知并征得您的同意——条款本身把用户选择排除在外，整份资源包里也没有任何产品内训练退出开关，故不记 mode（mark=no 无 mode 读作「条款允许训练」）。"
anchor = "opencsg-privacy-anonymized-ml-training"

[[product.training.point]]
text = "The parallel clauses on this tier are the User Agreement's right to review your input data and synthesized results by technical or manual means — manual review means input content may be seen by people — and the perpetual, irrevocable licence over \"contributed content\" (whose object is uploaded models and datasets, not API request bodies)."
text_zh = "同档并列条款为用户协议对输入与合成结果的技术或人工审核权（人工审核意味着输入内容可能被人接触），以及对「贡献内容」的永久不可撤销许可（对象是上传的模型/数据集，不是 API 正文）。"
anchor = "opencsg-user-agreement-input-moderation"

