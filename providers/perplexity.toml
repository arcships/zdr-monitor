[[source]]
url = "https://docs.perplexity.ai/docs/agent-api/conversation-state"
channel = "developer_data"
tier = "core"
note = "Agent API 文档「Conversation state」页。这是本档唯一直接描述服务端会话状态处理方式的官方文字：状态服务端持久化、store:false 不关闭持久化、有 ZDR 协议者需先向客户团队确认 stateful 功能。它没有给出任何保留期限、自动过期时间或删除接口说明。旧记录的两条引文都出自本页。"

[[source]]
url = "https://docs.perplexity.ai/docs/resources/faq"
channel = "developer_data"
tier = "core"
note = "文档站《Frequently Asked Questions》的 Data, Privacy & Security 段(共 3 问)。措辞是平台级的「the API」，未限定端点：不保留 query data、不训练、默认零日保留 prompt 数据，并给出计算托管地(AWS 北美)。与 privacy-security 的 Chat Completions 限定并存，范围待澄清——两句都保留。"

[[source]]
url = "https://docs.perplexity.ai/docs/resources/privacy-security"
channel = "developer_data"
tier = "core"
note = "文档站《Privacy & Security》页。它把 ZDR 承诺明确限定在 **Chat Completions API**，并列出仅收集计费元数据。该页不覆盖 Agent API：Agent API 走 responses 语义(/v1/agent)，且其文档明说会服务端持久化会话状态。因此本页在本档只作「Chat Completions 档」的依据与对照来源，**不能支撑 Agent API 的 zdr 结论**。"

[[source]]
url = "https://perplexity.ai/hub/legal/dpa"
fetch = "browser"
channel = "contract"
tier = "core"
note = "《Perplexity Data Processing Addendum》(Last Updated: August 13, 2026)。第 1 段把「Services」定义为客户协议项下的任何 Perplexity 产品/功能/API，并明文保留例外：Embeddings API、Perplexity Search 等「may operate under data postures that differ from this DPA」，以产品专属条款为准——**Agent API 不在例外名单内**。§2 角色、§5 不得用于训练、§10 与服务结束后 30 天内删除、Annex 1 的 Input 保留规则、§6c/§6d/§6e 第三方模型提供方作为分包方及其义务流下，是本档 retention/role/training 的合同层权威。注意 DPA 只约束「Personal Data」；对非个人的 Input，合同层没有保留期限条款。"

[[source]]
url = "https://perplexity.ai/hub/legal/enterprise-terms-of-service"
fetch = "browser"
channel = "contract"
tier = "core"
note = "Perplexity Enterprise Terms and Conditions，覆盖 Enterprise Pro 档（与 API 档并列的独立合同）。§1.3.3 不训练；§5.1 DPA 以 processor 身份适用、营销数据处理以独立控制者身份且不受 DPA 约束；§5.4 Marketing Services 的独立控制者定位。企业档结论单独成行，不并入 API 档。"

[[source]]
url = "https://perplexity.ai/hub/legal/perplexity-api-terms-of-service"
fetch = "browser"
channel = "contract"
tier = "core"
note = "《Perplexity API Terms of Service》(Last updated: January 23, 2026)。开篇把服务定义为「the Sonar by Perplexity and/or Agentic Research application programming interface (“API”) services (the “Services”)」——即本档(文档站称 Agent API、协议里称 Agentic Research API)与 Sonar/Chat Completions 同受本协议约束；并声明本协议只适用于 API 客户，不适用于 Enterprise Pro、官网等。§2.3.3 是 training 维度的合同层权威；§2.6 把第三方模型及其条款并入合同(本档多跳链路的合同依据)；§6.1 把 DPA 并入本协议(retention/role 的合同层入口)。全文无保留期限条款；§10.5 只规定终止后销毁/返还机密信息，自动备份按标准删除流程处理。经 apex 域抓取(www 域对 jina 匿名访问 403，见 notes)。"

[[source]]
url = "https://perplexity.ai/hub/legal/perplexity-api-terms-of-service-search"
fetch = "browser"
channel = "contract"
tier = "core"
note = "Perplexity Search Addendum (Last updated: September 22, 2025)，只覆盖 Schedule 1 列出的 Search Services（当前仅 /search 端点，且该端点不使用大模型生成）。§1.2.2 明文把「零数据保留义务」等排除在 Search Services 之外，§2.2 授权 Perplexity 保留、复制、分发 Search Data，§2.3 禁止客户提交个人信息。与 Sonar/Chat Completions 档姿态相反，必须分行。"

[[source]]
url = "https://perplexity.ai/hub/legal/privacy-notice"
fetch = "browser"
channel = "consumer_privacy"
tier = "core"
note = "消费者隐私声明（覆盖网站、Comet 浏览器、App）。明文排除 Enterprise 与 API 档，并自认对这两档「act as a service provider or processor」；消费者档保留期为「必要期限」。用作档位切分与 role 的旁证，不作 API 档任一维度的权威。"

[[source]]
url = "https://trust.perplexity.ai/subprocessors"
fetch = "browser"
channel = "enterprise_privacy_faq"
tier = "core"
note = "Trust Center 子处理者清单（23 家，DPA §6(a)/Annex 2 的授权依据）。全部标注 US；含模型提供方（OpenAI、Anthropic、Google Cloud、xAI、Amazon Bedrock、Microsoft Azure）与数据存储分析类（Snowflake、ClickHouse、Datadog）以及支付（Stripe、Metronome）。是处理地与多跳链路的官方清单来源。"

[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "perplexity-api-tos-2-3-3-training"

[[product.training.point]]
text = "See the top-level training entry: §2.3.3 bars Perplexity and third parties alike from using Customer Content for training"
text_zh = "见顶层 training：§2.3.3 同时禁止 Perplexity 与第三方用 Customer Content 训练"

[[product.training.point]]
text = "DPA §5 points the same way. Usage Data (§3.3) is outside that restriction."
text_zh = "DPA §5 同向。Usage Data（§3.3）不在此限。"
anchor = "perplexity-dpa-5-training"

[[product.training.point]]
text = "Multi-hop chain: the Services may utilize Third-Party Models provided by Third-Party Providers, and their terms are folded into the contract by §2.6; if Customer disagrees with any Third-Party Terms, its sole recourse is to cease all use of the relevant model. The trust-center subprocessor list names the model-provider hops (OpenAI, Anthropic, Google Cloud, xAI, Amazon Bedrock, Microsoft Azure)."
text_zh = "多跳链路：服务可能调用第三方提供方（Third-Party Providers）的第三方模型，§2.6 把其条款并入合同；客户不同意 Third-Party Terms 的唯一救济是停用对应模型。trust center 子处理者清单列出的模型提供方跳为 OpenAI、Anthropic、Google Cloud、xAI、Amazon Bedrock、Microsoft Azure。"
anchor = "perplexity-api-tos-2-6-third-party-models-training"

[[product.training.point]]
text = "Obligations are flowed down rather than erased: DPA §6c–e treats Model Providers as subcontractors, requires written agreements no less onerous than the DPA, and keeps Perplexity liable to Customer for their performance. This describes the chain only — it must not be read as proof that any hop can access content, nor that each hop's ZDR can be enabled in the same configuration."
text_zh = "义务是流下而非消失：DPA §6c–e 把 Model Provider 作为分包方，要求其书面义务不低于 DPA，并保留 Perplexity 对其履约的责任。此处只描述链路——不得据此推断某一跳能否访问内容，也不得推断各跳 ZDR 可在同一配置下同时开通。"
anchor = "perplexity-dpa-6c-role"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "perplexity-docs-privacy-security-zdr"

[[product.zdr.point]]
text = "Structured conclusion: zero retention by default, and the cited sentence is limited to the Chat Completions API. The same page adds that the only data collected through that API is billable metadata (\"This billing metadata does not include any content from your prompts, responses, or other user data.\")."
text_zh = "结构化结论：默认零保留，且所引句子限定 Chat Completions API。同页说明该 API 只收集计费元数据（「This billing metadata does not include any content from your prompts, responses, or other user data.」）。"
anchor = "perplexity-docs-privacy-security-retention"

[[product.zdr.point]]
text = "The platform-level FAQ says the same without naming an endpoint (\"By default, the API has zero day retention of user prompt data, which is never used for AI training.\"). Both wordings are kept side by side; the vendor does not clarify the scope difference."
text_zh = "平台级 FAQ 同向但未点名端点（「By default, the API has zero day retention of user prompt data, which is never used for AI training.」）。两种措辞并列保留，范围差异厂商未澄清。"
anchor = "perplexity-docs-faq-zdr"

[[product.zdr.point]]
text = "Scope note: this row records the Sonar / Chat Completions pay-as-you-go endpoints, so this zdr verdict is not a statement about the Agent API. The Agent API is a separate product line in this ledger (Perplexity Agent), where its server-side conversation state and the ZDR-by-agreement wording are recorded; the source note in this file also says that page cannot support an Agent API zdr verdict."
text_zh = "范围说明：本行记 Sonar / Chat Completions 按量端点，故本行 zdr 结论不涉及 Agent API。Agent API 在台账里是独立产品线（Perplexity Agent），服务端会话状态与「ZDR 需协议」的措辞记在那里；本文件的来源注亦声明该页不能支撑 Agent API 的 zdr 结论。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "perplexity-docs-faq-training"

[[product.retention.point]]
text = "Structured conclusion: the FAQ states that the API does not retain query data (\"We do not retain any query data sent through the API and do not train on any of your data.\"), so Input/Output is recorded as not retained. The FAQ does not name an endpoint; the privacy-security page limits the same commitment to the Chat Completions API."
text_zh = "结构化结论：FAQ 明说 API 不保留 query data（「We do not retain any query data sent through the API and do not train on any of your data.」），故输入输出记不留存。FAQ 未点名端点，privacy-security 页把同一承诺限定在 Chat Completions API。"

[[product.retention.point]]
text = "Personal Data contained in Input is a different object and is not covered by that sentence: DPA Annex 1 stores it until the earlier of (a) the date it is deleted by Customer through the Services' interface and (b) the date that is thirty days after Perplexity is no longer providing the Services to Customer — a termination-anchored rule, not a retention period for non-personal Input/Output."
text_zh = "Input 中的个人信息是另一个对象，不在该句覆盖范围内：DPA Annex 1 保留至「客户通过服务界面删除」与「Perplexity 停止提供服务后 30 天」两者较早者——以终止为锚点，不是非个人输入输出的保留期限。"
anchor = "perplexity-dpa-annex1-retention"

[[product.retention.point]]
text = "DPA §10 adds the post-termination deadline: all Personal Data is deleted (or, at Customer's option, returned) within thirty days of the end of the provision of the Services. It is not a retention period, and it covers Personal Data only."
text_zh = "DPA §10 补充终止后期限：服务结束后 30 天内删除（或按客户选择返还）全部 Personal Data。这不是保留期限，且只覆盖个人信息。"
anchor = "perplexity-dpa-10-retention"

[[product.retention.point]]
text = "At contract level no retention period is given for non-personal Input/Output; the only post-termination rule in the API ToS is §10.5 — destroy or return Confidential Information, with copies in automated back-up systems deleted under the receiving party's standard deletion procedures."
text_zh = "合同层未给非个人输入输出的保留期限；API ToS 里唯一的终止后规则是 §10.5——销毁或返还保密信息，自动备份中的副本按接收方标准删除流程删除。"
anchor = "perplexity-api-tos-10-5-retention"

[product.processing_region]
codes = ["US"]
anchor = "perplexity-docs-faq-processing-region"

[[product.processing_region.point]]
text = "See the top-level processing_region entry: no processing-location clause at contract level; it rests on the documentation site and the trust center."
text_zh = "见顶层 processing_region：合同层无处理地条款，靠文档站与 trust center。"

[product.role]
kind = "processor"
anchor = "perplexity-dpa-2-role"

[[product.role.point]]
text = "See the top-level role entry: DPA §2 processor"
text_zh = "见顶层 role：DPA §2 processor"

[[product.role.point]]
text = "Usage Data and Search Data are the exceptions."
text_zh = "Usage Data 与 Search Data 属例外。"

[[product]]
id = "api-search"
badge = "Search API"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "perplexity-search-addendum-2-2-retention"

[[product.training.point]]
text = "Structured conclusion: §2.2 authorizes Perplexity to use Search Data for its lawful business purposes \"including the improvement and development of products and services\", and the Addendum gives no no-training commitment. Under the rule that service-improvement wording which does not exclude model training counts as training, this tier is recorded as mark=no."
text_zh = "结构化结论：§2.2 授权 Perplexity 为「lawful business purposes, including the improvement and development of products and services」使用 Search Data，且 Addendum 未给不训练承诺。按口径「写『用于服务改进』而不排除模型训练即按会训练算」，本档记 mark=no。"

[[product.training.point]]
text = "The Addendum gives no no-training commitment"
text_zh = "Addendum 未给不训练承诺"

[[product.training.point]]
text = "§2.2 instead authorizes Perplexity to retain, copy and distribute Search Data \"for its lawful business purposes, including the improvement and development of products and services\". Whether the no-training commitment in API ToS §2.3.3 still applies to Search Data is not stated — §1.2.2 names only obligations such as \"update, upgrade and/or zero data retention obligations\" as excluded, and does not name §2.3.3. This uncertainty has to be flagged in the ledger and must not be resolved on the vendor's behalf."
text_zh = "§2.2 反而授权 Perplexity 为「lawful business purposes, including the improvement and development of products and services」保留、复制、分发 Search Data。API ToS §2.3.3 的不训练承诺是否仍适用于 Search Data，文档未明说——§1.2.2 只点名排除了「update, upgrade and/or zero data retention obligations」这类义务，未点名 §2.3.3。此不确定性必须在台账上标明，不得替厂商推定。"

[[product.training.point]]
text = "Third-party model hops do not arise on this tier as currently configured: Schedule 1 states that the /search endpoint \"does not generate Output through the use of artificial intelligence, including large language models\". Whether API ToS §2.6 (Third-Party Models) otherwise applies to the Search Services is not stated, and §1.2.2 is not read in either direction here."
text_zh = "按当前配置，本档不涉及第三方模型跳：Schedule 1 明说 /search 端点「does not generate Output through the use of artificial intelligence, including large language models」。API ToS §2.6（Third-Party Models）是否另行适用于 Search Services，文档未说明，§1.2.2 在此不作任何方向的推定。"
anchor = "perplexity-search-addendum-schedule1-no-llm-training"

[product.zdr]
mark = "no"
anchor = "perplexity-search-addendum-1-2-2-zdr"

[[product.zdr.point]]
text = "§1.2.2：「any Perplexity obligations in the Agreement applicable to its other products and services (e.g., update, upgrade and/or zero data retention obligations) do not apply to the Search Services」"

[[product.zdr.point]]
text = "§4.1 likewise states that the security and service-level commitments for other products (the Sonar APIs included) do not apply to the Search Services. This is an express denial, not a non-disclosure."
text_zh = "§4.1 亦声明其他产品（含 Sonar APIs）的安全/服务水平承诺不适用于 Search Services。这是明确否定，不是未披露。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "perplexity-search-addendum-2-2-retention"

[[product.retention.point]]
text = "§2.2 authorizes retention, copying and distribution of Search Data (Search Data = Input + Output, §1.1.1), with no period given"
text_zh = "§2.2 授权保留/复制/分发 Search Data（Search Data = Input + Output，§1.1.1），未给期限"

[[product.retention.point]]
text = "§1.2.2 states expressly that the zero-retention obligations for other products do not apply. §2.3 prohibits the customer from submitting personal information (unless authorized in writing), so the question of personal information retention largely does not arise on this tier."
text_zh = "§1.2.2 明确其他产品的零保留义务不适用。§2.3 禁止客户提交个人信息（除非书面授权），因此本档的个人信息保留问题主要不适用。"

[product.processing_region]
mark = "unknown"
basis = "undisclosed"
searched = [
  "https://perplexity.ai/hub/legal/perplexity-api-terms-of-service-search",
  "https://perplexity.ai/hub/legal/perplexity-api-terms-of-service",
  "https://perplexity.ai/hub/legal/dpa",
  "https://trust.perplexity.ai/subprocessors",
]

[[product.processing_region.point]]
text = "Neither the Search Addendum nor the API ToS has a processing-location clause"
text_zh = "Search Addendum 与 API ToS 均无处理地条款"

[[product.processing_region.point]]
text = "Removed anchor: the cited subprocessor-list row (\"Amazon Web Services / Cloud infrastructure and security / Cloud provider / US\") records where the subprocessor company sits, not where data is processed. The snapshot has no column header saying the US column is a processing location, so it cannot support a region code. The consumer tier is judged on the same reasoning, keeping the two tiers consistent. Search scope is recorded in searched."
text_zh = "已撤锚：原引子处理者清单条目（「Amazon Web Services / Cloud infrastructure and security / Cloud provider / US」）记的是该子处理者公司所在地，不是数据处理地；快照里没有表头说明 US 列是处理地，故不能支撑区域码。消费者档按同一理由判定，两档口径一致。查阅范围见 searched。"

[product.role]
kind = "processor"
anchor = "perplexity-dpa-2-role"

[[product.role.point]]
text = "The role clause is inherited rather than restated in the Addendum: §1.2.1 keeps the Agreement in force for the Search Services, API ToS §6.1 incorporates the DPA, and DPA §2 makes Perplexity the Service Provider or Processor."
text_zh = "角色条款是继承来的，Addendum 未重述：§1.2.1 让 Agreement 对 Search Services 继续适用，API ToS §6.1 并入 DPA，DPA §2 自认 Service Provider or Processor。"

[[product.role.point]]
text = "The clause previously cited here is a customer obligation, not a statement of Perplexity's role: \"Customer shall not submit Personal Data (as defined in the DPA) to the Search Services unless explicitly authorized by Perplexity in writing\"."
text_zh = "此处原先引用的条款是对客户的义务，不是对 Perplexity 角色的表述：「Customer shall not submit Personal Data (as defined in the DPA) to the Search Services unless explicitly authorized by Perplexity in writing」。"
anchor = "perplexity-search-addendum-2-3-role"

[[product.role.point]]
text = "But §2.2 states expressly that \"Search Data is not Customer's Confidential Information\" and authorizes Perplexity to retain, copy, distribute and otherwise use Search Data for its lawful business purposes, the opposite of API ToS §5.1, which makes Customer Content the customer's confidential information. The processor relationship is weaker on this tier than on the Sonar tier; both statements are kept side by side."
text_zh = "但 §2.2 明文「Search Data is not Customer's Confidential Information」，并授权 Perplexity 为 lawful business purposes 保留、复制、分发、使用 Search Data，与 API ToS §5.1 把 Customer Content 定为客户保密信息相反。本档受托关系比 Sonar 档弱；两句并列保留。"

