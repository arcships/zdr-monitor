[[product]]
id = "consumer"
badge = "消费端"
category = "web"
plan_level = "any"

[product.training]
mark = "no"
anchor = "perplexity-privacy-notice-ai-models-training"

[[product.training.point]]
text = "Structured conclusion: the purposes list in the consumer privacy notice includes \"Improve or create services and products, including our AI models.\" Service-improvement wording that does not exclude model training counts as training, and this sentence names AI models outright, so the tier is recorded as mark=no."
text_zh = "结构化结论：消费者隐私声明的处理目的清单含「Improve or create services and products, including our AI models.」。按「写『用于服务改进』而不排除模型训练即按会训练算」，且该句直接点名 AI 模型，本档记 mark=no。"

[[product.training.point]]
text = "The other purposes listed alongside it (\"develop services\", \"conduct internal research\", \"improve our websites\") likewise do not exclude model training."
text_zh = "与之并列的其他目的（「develop services」「conduct internal research」「improve our websites」）同样未排除模型训练。"

[[product.training.point]]
text = "Feature-level exception, not the tier's commitment: \"We do not use the content of emails to create, train, improve, or fine-tune AI models.\" covers Email Assistant data only. In-product switches such as AI Data Retention (help center, not fetched this round) are retention settings, not training statements."
text_zh = "功能级例外，不构成本档承诺：「We do not use the content of emails to create, train, improve, or fine-tune AI models.」只覆盖 Email Assistant 的数据。AI Data Retention 之类的产品内开关（帮助中心，本轮未取）属保留设置，不是训练表态。"

[product.zdr]
mark = "no"
anchor = "perplexity-privacy-notice-retention"
searched = [
  "https://perplexity.ai/hub/legal/privacy-notice",
  "https://perplexity.ai/hub/legal/terms-of-service",
  "https://perplexity.ai/hub/legal",
]

[[product.zdr.point]]
text = "Structured conclusion: the cited clause states affirmatively that personal data is kept for as long as necessary (\"We keep your personal data for only as long as necessary…\"), and the consumer tier offers no zero-retention mechanism. The tier is therefore recorded as mark=no (terms state retention)."
text_zh = "结构化结论：原引句正面写明个人数据会被保留（「We keep your personal data for only as long as necessary…」），消费档也没有任何零保留机制。据此记 mark=no（条款明示会留存）。"

[[product.zdr.point]]
text = "No zero-retention commitment on the consumer tier. Only feature-level mechanisms exist, and no official policy document explains their effect: the in-product AI Data Retention switch (help center, not fetched this round) and Incognito — \"Incognito increases your privacy by not saving your search activity across use sessions.\""
text_zh = "消费者档无零保留承诺。只有功能级机制，且未见官方政策文档说明其效果：产品内的 AI Data Retention 开关（帮助中心，本轮未取）与 Incognito——「Incognito increases your privacy by not saving your search activity across use sessions.」。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "perplexity-privacy-notice-retention"

[[product.retention.point]]
text = "\"We keep your personal data for only as long as necessary to fulfil the purposes in this Notice unless a longer retention period is required or permitted by law.\" — a purpose-necessity period, not quantified"
text_zh = "「We keep your personal data for only as long as necessary to fulfil the purposes in this Notice unless a longer retention period is required or permitted by law.」——目的必要期限，未量化"

[[product.retention.point]]
text = "The deletion-rights clause separately states that \"in many cases we must keep your personal data to comply with legal obligations...\"."
text_zh = "另有删除权条款说明「in many cases we must keep your personal data to comply with legal obligations...」。"

[product.processing_region]
mark = "unknown"
basis = "undisclosed"
anchor = "perplexity-privacy-notice-cross-border-processing-region"
searched = [
  "https://perplexity.ai/hub/legal/privacy-notice",
  "https://trust.perplexity.ai/subprocessors",
]

[[product.processing_region.point]]
text = "Removed anchor: the cited subprocessor-list row (\"Amazon Web Services / Cloud infrastructure and security / Cloud provider / US\") records where the subprocessor company sits, not where data is processed. Entity location is not processing location, so it is not a statement on this dimension. Search scope is recorded in searched."
text_zh = "已撤锚：原引子处理者清单条目（「Amazon Web Services / Cloud infrastructure and security / Cloud provider / US」）记的是该子处理者公司所在地，不是数据处理地。主体所在地 ≠ 数据处理地，故不构成本维度的表述。查阅范围见 searched。"

[[product.processing_region.point]]
text = "The notice discloses cross-border transfer only: \"By submitting your personal data to us you agree to the transfer, storage, and processing of your data in a country other than your country of residence including, but not limited to, the United States.\" It commits to no residency location, and the enumeration is open-ended, so no single region code can be assigned."
text_zh = "声明只披露跨境传输：「By submitting your personal data to us you agree to the transfer, storage, and processing of your data in a country other than your country of residence including, but not limited to, the United States.」未承诺驻留地，且列举是开放的，故不能给出单一区域码。"

[[product.processing_region.point]]
text = "Only the DPF (EU-U.S. / UK Extension) and the all-US subprocessor list are available as indirect clues."
text_zh = "只有 DPF（EU-U.S./UK Extension）与子处理者清单全 US 可作间接线索。"

[product.role]
kind = "controller"
anchor = "perplexity-privacy-notice-scope-role"

[[product.role.point]]
text = "The privacy notice merely excludes the Enterprise and API tiers, describing Perplexity as service provider or processor for those two, from which it follows that the consumer tier is processed by Perplexity as an independent controller in its own right"
text_zh = "隐私声明只把 Enterprise 与 API 档排除在外并自认那两档为 service provider/processor，反推消费者档是自有的独立控制者处理"

[[product.role.point]]
text = "The notice is written throughout in \"we collect\" terms, with no processor wording."
text_zh = "声明全篇以「we collect」口径书写，未见受托表述。"

[[product]]
id = "enterprise"
badge = "企业版"
category = "api"
plan_level = "enterprise"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "perplexity-enterprise-tos-1-3-3-training"

[[product.training.point]]
text = "Enterprise ToS §1.3.3 is word for word the same as API ToS §2.3.3: \"Perplexity shall not use (or authorize third parties to use) Customer Content to train, retrain, fine-tune or otherwise improve any generative artificial intelligence models.\""
text_zh = "Enterprise ToS §1.3.3 与 API ToS §2.3.3 同文：「Perplexity shall not use (or authorize third parties to use) Customer Content to train, retrain, fine-tune or otherwise improve any generative artificial intelligence models.」"

[[product.training.point]]
text = "Exception that the §1.3.3 commitment does not cover: Usage Data is defined outside Customer Content and personal information, and §2.3 authorizes Perplexity to use it for any lawful purpose (e.g., to assess the relative popularity of the Services' features or to improve categorization algorithms). The same layer is recorded on the API tier."
text_zh = "§1.3.3 承诺覆盖不到的例外：Usage Data 的定义排除 Customer Content 与个人信息，§2.3 授权 Perplexity 为 any lawful purpose（例如评估各功能的受欢迎程度、改进分类算法）使用它。API 档记有同一层。"
anchor = "perplexity-enterprise-tos-2-3-usage-data-training"

[product.zdr]
mark = "unknown"
searched = [
  "https://perplexity.ai/hub/legal/enterprise-terms-of-service",
  "https://perplexity.ai/hub/legal/dpa",
  "https://perplexity.ai/enterprise/security",
