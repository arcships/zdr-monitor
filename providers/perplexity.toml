[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "perplexity-dpa-preamble-retention"

[[product.retention.point]]
text = "DPA preamble: \"Certain Services (including but not limited to the Embeddings API and Perplexity Search) may operate under data postures that differ from this DPA... the applicable product-specific terms shall govern and control over this DPA.\" — so the DPA's retention clauses may not apply to this tier, and no product-specific terms are public. This is \"undisclosed\" rather than a denial."
text_zh = "DPA 序言：「Certain Services (including but not limited to the Embeddings API and Perplexity Search) may operate under data postures that differ from this DPA... the applicable product-specific terms shall govern and control over this DPA.」即 DPA 的保留条款对本档可能不适用，而专属条款未见公开。这是「未披露」而非否定。"

