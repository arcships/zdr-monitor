]

[[product.zdr.point]]
text = "Removed anchor: the cited clause (\"If your account has a Zero Data Retention (ZDR) agreement with Perplexity, check with your account team…\") is a conditional reference in the Agent API docs. It confirms ZDR agreements exist but does not state that this tier has one, so it is not a statement on this verdict's dimension. Search scope is recorded in searched."
text_zh = "已撤锚：原引句「If your account has a Zero Data Retention (ZDR) agreement with Perplexity, check with your account team…」是 Agent API 文档里的条件式提示，只说明存在 ZDR 协议这种安排，并未说明本档是否覆盖，故不构成本判定的表述。查阅范围见 searched。"

[[product.zdr.point]]
text = "Neither the Enterprise ToS nor the DPA contains a zero-retention commitment"
text_zh = "Enterprise ToS 与 DPA 均无零保留承诺"

[[product.zdr.point]]
text = "ZDR is mentioned in the API documentation in the form of an \"agreement\", and whether it covers the Enterprise tier is not published."
text_zh = "ZDR 在 API 文档里以「agreement」形式被提及，是否覆盖 Enterprise 档未公开。"

[product.retention]
object = "input_output"
basis = "until_termination"
anchor = "perplexity-dpa-annex1-retention"

[[product.retention.point]]
text = "Structured conclusion: Enterprise ToS §5.1 incorporates the DPA, and no retention period is given for Input/Output during the term. The only rule that states both object and context is DPA Annex 1: personal information contained in Input is stored until the earlier of (a) the date it is deleted by Customer through the Services' interface and (b) the date that is thirty days after Perplexity is no longer providing the Services to Customer — hence basis=until_termination."
text_zh = "结构化结论：Enterprise ToS §5.1 并入 DPA，服务期内未给输入输出的保留期限。唯一写明对象与语境的规则是 DPA Annex 1：Input 中的个人信息保留至「客户通过服务界面删除」与「Perplexity 停止提供服务后 30 天」两者较早者——故记 until_termination。"

[[product.retention.point]]
text = "DPA §10 is a post-termination deletion deadline, not a retention period: Perplexity deletes (or, at Customer's option, returns) all Personal Data within thirty days of the end of the provision of the Services. It covers Personal Data only, so non-personal Input/Output has no contract-level period."
text_zh = "DPA §10 是终止后的删除期限，不是保留期限：服务结束后 30 天内删除（或按客户选择返还）全部 Personal Data；且只覆盖个人信息，非个人的输入输出在合同层没有期限条款。"
anchor = "perplexity-dpa-10-retention"

[[product.retention.point]]
text = "The enterprise contract's own post-termination clause: each party destroys or returns the other party's Confidential Information and all copies thereof, except copies in automated back-up systems, which remain subject to §4 while maintained and are deleted in accordance with the receiving party's standard deletion procedures. Customer Content is the customer's Confidential Information under §4.1."
text_zh = "企业合同自身的终止后条款：各方销毁或返还对方保密信息及其所有副本，自动备份中的副本除外——该副本在保存期间仍受 §4 约束，并按接收方的标准删除流程删除。§4.1 下 Customer Content 属客户保密信息。"
anchor = "perplexity-enterprise-tos-9-6-retention"

[[product.retention.point]]
text = "There are also enterprise settings such as \"Configuring Data Retention\" inside the product (that page was not fetched this round)."
text_zh = "产品内另有「Configuring Data Retention」类企业设置（本轮未取该页）。"

[product.processing_region]
mark = "unknown"
basis = "undisclosed"
searched = [
  "https://perplexity.ai/hub/legal/enterprise-terms-of-service",
  "https://perplexity.ai/hub/legal/dpa",
  "https://perplexity.ai/enterprise/security",
  "https://trust.perplexity.ai/subprocessors",
]

[[product.processing_region.point]]
text = "No region code can be assigned: DPA §11 is the only transfer clause and it commits only to a transfer compliance mechanism (EU SCCs / UK Addendum, data importer obligations), naming no country or region. The only places \"US\" appears in the DPA are the definition of US Privacy Laws (including CCPA), which is a legal definition rather than a processing location."
text_zh = "无法给出区域码：DPA §11 是唯一的传输条款，只承诺传输合规机制（EU SCCs / UK Addendum、data importer 义务），未出现任何国家或区域。DPA 里出现「US」的地方只有 US Privacy Laws（含 CCPA）的法定定义，不是处理地。"
anchor = "perplexity-dpa-11-processing-region"

[[product.processing_region.point]]
text = "The subprocessor list marks every vendor US, but that column is the vendor company's location, not the processing location — the consumer tier is judged on the same reasoning, keeping the two tiers consistent."
text_zh = "子处理者清单全标 US，但那是厂商公司所在地，不是处理地——消费者档按同一理由判定，两档口径一致。"

[[product.processing_region.point]]
text = "The enterprise security page likewise has no regional clause."
text_zh = "企业安全页亦无地域条款。"

[product.role]
kind = "processor"
anchor = "perplexity-enterprise-tos-5-1-role"

[[product.role.point]]
text = "§5.1「The DPA governs Perplexity's processing of personal data as a processor on Customer's behalf」"

[[product.role.point]]
text = "But that clause and §5.4 make clear that for personal data processed for the Marketing Services \"Perplexity acts as an independent controller, and the DPA does not apply\". So processor as the main position and independent controller for marketing data, recorded side by side."
text_zh = "但同条与 §5.4 明确：为客户人员信息做营销（Marketing Services）时「Perplexity acts as an independent controller, and the DPA does not apply」。即受托为主、营销数据为独立控制者，两层并列。"

