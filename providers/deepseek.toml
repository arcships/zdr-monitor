note = "《DeepSeek 开放平台服务协议》(更新日期 2026-04-22 / 生效日期 2026-04-29)，本家唯一直接约束 API 的专门合同，覆盖 API 档。首部明文自认是《DeepSeek 用户协议》项下所指的「具体协议及其组成部分，特别适用于…使用本平台提供的应用程序编程接口（API）或其他开发者工具」的开发活动 → 用户协议条款对 API 档一并生效。全文(§1 服务内容、§3 服务管理、§4 输入与输出、§5 知识产权)无输入输出的训练/保留/处理地条款；§3.5 为角色条款，§5.5 把开发者自身个人信息的处理引向隐私政策。"

[[source]]
url = "https://cdn.deepseek.com/policies/zh-CN/deepseek-terms-of-use.html"
channel = "contract"
tier = "core"
note = "《DeepSeek 用户协议》(更新日期 2025-09-05)，覆盖 API 档的合同层：§1.1 把「供第三方网站和应用程序使用软件开发工具包（SDK）、应用程序编程接口（API）」明确写入「本服务」定义，§4.3 是训练条款。经开放平台服务协议首部纳入条款后，§4.3 构成本家 API 档训练维度的合同层依据（该协议与开放平台协议冲突时以具体协议为准，而开放平台协议未另设训练条款，故无冲突）。"

