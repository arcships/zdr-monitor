[[product.processing_region.point]]
text = "Processing location is undisclosed, and no region code is asserted for this tier. The two contracts that cover it contain no processing-location or cross-border clause: the Open Platform Terms of Service §9.1 only states that the agreement is governed by the law of mainland China (choice of law and jurisdiction, not a processing location), and the Terms of Use contain no processing-location or cross-border-transfer clause at all. The \"stored within China\" sentence cited elsewhere comes from the DeepSeek Privacy Policy, which is not registered as a source in this file and has no snapshot in this repository, so it cannot be re-checked — and its object is personal information, not the processing location of API business content."
text_zh = "处理地未披露，本档不记任何地域码。覆盖本档的两份合同都没有处理地／跨境条款：开放平台服务协议 §9.1 只写本协议的订立、执行和解释及争议的解决均适用中华人民共和国大陆地区法律（法律适用与管辖，不是处理地），用户协议全文没有处理地／跨境条款。别处引用的「境内存储」句出自《DeepSeek 隐私政策》——该页未登记为本文件的来源、仓库内没有快照，无法复核，且其对象是个人信息、不是 API 业务内容的处理地。故记未披露，不等于认定在中国处理。"

[product.role]
kind = "processor"
anchor = "deepseek-role-3-5-entrusted-processing"

[[product.role.point]]
text_zh = "同顶层 dimensions.role：§3.5 受托处理链位 + §5.5 责任划分。"

[[product.role.point]]
text = "The role is layered, and kind=processor describes the end-user-data chain position only. For end-user data the developer is the processor and DeepSeek the entrusted party: §3.5 puts the duty on the developer to inform end users and to obtain consent for collecting/processing personal information and for entrusting DeepSeek to process it. For the developer's own personal information DeepSeek collects and processes it itself under the DeepSeek Privacy Policy (§5.5), i.e. on the controller side, and §5.5 also places end users' personal information outside that policy and puts the disclosure duty on the developer. kind=processor is therefore not an all-scenario \"processor\" role: §4.3 shows inputs and outputs may be used for DeepSeek's own model training and service optimisation."
text_zh = "角色是分层的，kind=processor 只描述终端用户数据这一链位。终端用户数据：开发者是处理者、DeepSeek 是受托方——§3.5 把告知终端用户、就收集处理个人信息以及委托深度求索处理个人信息取得同意的义务放在开发者一侧。开发者自身的个人信息：由深度求索依《DeepSeek 隐私政策》自行收集、处理（§5.5），即独立控制方一侧；§5.5 同时把终端用户的个人信息排除在该隐私政策说明范围外，并把披露义务放在开发者一侧。故 kind=processor 不等于全场景受托：§4.3 显示输入输出可能被用于深度求索自身的模型训练与服务优化。"
anchor = "deepseek-role-open-platform-5-5-developer-personal-info"

