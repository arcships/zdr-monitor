[[product.zdr.point]]
text_zh = "同顶层 dimensions.zdr：用户协议 §4.3 明示 API 档输入输出可能被用于模型训练与服务优化（对 API 生效路径见 training），故请求内容会被留存到训练时点，判「不支持零保留」"

[[product.zdr.point]]
text_zh = "佐证为《模型原理与训练方法说明》§二.2 与 kv_cache 的默认硬盘落盘（详见顶层 note）。官方无任何 ZDR 表述、开关或开通方式，第三方路由商的 ZDR 承诺已 rejected。"

[[product.zdr.point]]
text = "Operational access path (circumstantial): the Terms of Use §3.4 gives DeepSeek the right to review user behaviour and information in order to meet statutory duties, expressly including reviewing inputs and outputs, building risk-filtering mechanisms and building a database of illegal-content characteristics. Request content is therefore visible to and processed by the vendor on the service side and may enter an illegal-content feature database — this points the same way as \"no zero retention\". It is support only and sets no retention period."
text_zh = "运营性访问路径（佐证）：用户协议 §3.4 为履行法定义务赋予深度求索对用户使用本服务的行为及信息进行审查的权利，明文包括对输入和输出进行审查、建立风险过滤机制、建立违法内容特征库。请求内容因此在服务侧对厂商可见、会被厂商侧处理，并可能进入违法内容特征库，与「不支持零保留」同向。仅作佐证，不构成任何保留期限。"
anchor = "deepseek-zdr-tos-use-3-4-content-review"

