[[product.retention.point]]
text_zh = "同顶层 dimensions.retention：API 请求内容保留期无官方条款，相近材料（网络日志 6 个月、kv_cache 数小时至数天、Files API 文件有效期、国际站 input Personal Data 保留至账号存续）scope 或性质不符，不凑数。"

[[product.retention.point]]
text = "Legal-obligation exception, not a retention period: the Open Platform Terms of Service §7.2 states that records relating to suspected breaches of law or suspected criminal conduct will be kept and reported to the competent authorities, and the Terms of Use §2.5(1) keeps DeepSeek's right, after an account is cancelled, to retain the user's registration data and previous behaviour records as required by laws and regulations. Both are exception contexts only: the object is account data and behaviour records, not input/output content, and no period is given, so object=input_output / basis=undisclosed stand and no retention period for request content can be inferred from them."
text_zh = "法定义务例外，不是保留期限：开放平台服务协议 §7.2 写明对涉嫌违反法律法规、涉嫌违法犯罪的行为将保存有关记录，并依法向有关主管部门报告、配合有关主管部门调查；用户协议 §2.5(1) 保留深度求索在用户注销账号后按照法律法规的要求保留该用户的注册数据及以前的行为记录的权利。两条都只构成例外语境：对象是账号数据与行为记录、不是输入输出正文，且期限未定，故本档 object=input_output / basis=undisclosed 不变，也不能据此推出请求内容的保留期。"
anchor = "deepseek-retention-open-platform-7-2-legal-duty-records"

