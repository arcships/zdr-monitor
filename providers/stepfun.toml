codes = ["CN"]
anchor = "stepfun-region-storage-in-china"

[[product.processing_region.point]]
text_zh = "个人信息存储于中华人民共和国境内，目前不跨境传输"

[[product.processing_region.point]]
text_zh = "未披露推理处理地域。"

[[product.processing_region.point]]
text = "Location of the entrusted partners is undisclosed: privacy policy §3.2 lists the entrusted tasks (server deployment and database storage for product code and data, SMS sending, content-safety review) but names neither the partners nor their locations, while the §4.1 in-China storage wording is limited to \"您的个人信息\". So the processing region of that entrusted hop is not disclosed"
text_zh = "受托方所在地未披露：隐私政策 §三.2 只列委托事项（产品代码和数据的服务器部署、数据库存储、短信发送、内容安全审核），未写受托方名称与所在地；§四.1 的境内存储表述主语限于「您的个人信息」，故受托这一跳的处理地无公开披露"
anchor = "stepfun-role-entrusted-partners"

[product.role]
kind = "controller"
anchor = "stepfun-role-self-use-authorization"

[[product.role.point]]
text_zh = "§6.5 自用授权 + §5.4 数据权属 + 隐私政策以自身为个人信息处理者 → independent controller"

[[product.role.point]]
text_zh = "客户对最终用户个人信息另负处理者义务（§6.2）。"

[[product.role.point]]
text = "Entrusted-processing chain (privacy policy §3.2): \"我们将必要信息委托给支持我们业务的合作伙伴处理，这些支持包括受我们委托提供的产品代码和数据的服务器部署以及数据库存储服务、短信发送服务、内容安全审核服务\" — the platform is the entrusting party and hands necessary information to partners; content-safety review is among the listed tasks, so request content may be processed by third parties. The sentence is a list of entrusted tasks, not a statement that third parties necessarily read request bodies, so the hedge 可能 must be kept"
text_zh = "委托链条（隐私政策 §三.2）：『我们将必要信息委托给支持我们业务的合作伙伴处理，这些支持包括受我们委托提供的产品代码和数据的服务器部署以及数据库存储服务、短信发送服务、内容安全审核服务』——平台是委托方，把必要信息交给合作伙伴处理；列举项含内容安全审核，故正文可能被第三方处理。该句是委托事项清单，不能据此写成「确定有第三方读取正文」，引用时保留「可能」这一 hedge。平台在此链条中仍是委托方（个人信息处理者一侧），与上面 §6.5/§5.4 的自身处理者结论并列"
anchor = "stepfun-role-entrusted-partners"

