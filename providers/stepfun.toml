[[product.zdr.point]]
text_zh = "不支持零保留（value=no，复核轮重写判断链）：①决定性＝官方 API 文档《Prompt 缓存最佳实践》——平台缓存「每次请求过程中的输入」，「完整的对话数组…System Prompt、User Message 以及 Assistant Message」进入缓存系统（图片、视频、工具调用及其结果同列）"

[[product.zdr.point]]
text_zh = "请求 >256 Token 自动启用、LRU 淘汰、生命周期随系统高低峰浮动、「目前不提供手动清除缓存的能力」，唯一规避手段是改 Prompt，全页无 TTL、无豁免、无开关 → 客户无法把请求正文做成零保留"

[[product.zdr.point]]
text_zh = "②佐证＝用户协议 §5.3 内容许可（标的是用户发布/上传/传输的内容，按 §2.1.3 含 API 请求正文、不含输出；性质是许可条款而非平台实际存储的披露）"

[[product.zdr.point]]
text_zh = "③删除侧＝隐私政策 §四.2 必要期间保留＋§六.4 删除权、用户协议 §3.6 服务终止后/约定保留期届满后的删除权 → 无请求级删除，零保留不是默认档。排除项：隐私政策 §一.4（API 密钥与调用时间，元数据）、§一.8（设备与日志字段清单无正文字段）、§一.2 的 AI Studio 素材句（作用域仅 AI Studio，但同节首句已覆盖「模型和API能力」）。已核对页面无 ZDR 档位/开关/申请入口。"

