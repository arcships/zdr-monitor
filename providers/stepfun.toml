[[product.zdr.point]]
text_zh = "不支持零保留（value=no，复核轮重写判断链）：①决定性＝官方 API 文档《Prompt 缓存最佳实践》——平台缓存「每次请求过程中的输入」，「完整的对话数组…System Prompt、User Message 以及 Assistant Message」进入缓存系统（图片、视频、工具调用及其结果同列）"

[[product.zdr.point]]
text_zh = "请求 >256 Token 自动启用、LRU 淘汰、生命周期随系统高低峰浮动、「目前不提供手动清除缓存的能力」，唯一规避手段是改 Prompt，全页无 TTL、无豁免、无开关 → 客户无法把请求正文做成零保留"

[[product.zdr.point]]
text_zh = "②佐证＝用户协议 §5.3 内容许可（标的是用户发布/上传/传输的内容，按 §2.1.3 含 API 请求正文、不含输出；性质是许可条款而非平台实际存储的披露）"

[[product.zdr.point]]
text_zh = "③删除侧＝隐私政策 §四.2 必要期间保留＋§六.4 删除权、用户协议 §3.6 服务终止后/约定保留期届满后的删除权 → 无请求级删除，零保留不是默认档。排除项：隐私政策 §一.4（API 密钥与调用时间，元数据）、§一.8（设备与日志字段清单无正文字段）、§一.2 的 AI Studio 素材句（作用域仅 AI Studio，但同节首句已覆盖「模型和API能力」）。已核对页面无 ZDR 档位/开关/申请入口。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "stepfun-retention-necessary-period"

[[product.retention.point]]
text_zh = "个人信息按提供服务必需期间保留，注销/超期后删除或匿名化"

[[product.retention.point]]
text_zh = "无固定天数，API 内容靠 §一.2 纳入个人信息范围。"

[[product.retention.point]]
text = "Exception to that deletion commitment (privacy policy §4.2): the sentence on deletion or anonymisation after cancellation, voluntary deletion or expiry of the necessary period is followed verbatim by \"但以下情况除外\" — (1) \"遵从法律法规有关信息留存的要求\" and (2) \"出于财务、审计、争议解决等目的需要合理延长期限的\". Neither exception is quantified, so the deletion side has no fixed upper bound"
text_zh = "§四.2 删除承诺的例外：『如果您注销账户、主动删除个人信息或超出必要的期限后，我们将对您的个人信息进行删除或匿名化处理，但以下情况除外』——(1)『遵从法律法规有关信息留存的要求』、(2)『出于财务、审计、争议解决等目的需要合理延长期限的』。两条例外均未量化期限，删除侧因此没有固定上限，读者不得据 §四.2 推出「超期必删」"
anchor = "stepfun-retention-legal-retention-exception"

[[product.retention.point]]
text = "Even where a deletion request stands, §6.4 closes with a fallback: \"法律、行政法规规定的保存期限未届满，或者删除个人信息从技术上难以实现的，我们会停止除存储和采取必要的安全保护措施之外的处理\" — the data may end up in a store-and-isolate state (storage plus necessary security measures only). This is not the same as deleted"
text_zh = "§六.4 段末兜底：删除请求成立也不等于数据已消失——『法律、行政法规规定的保存期限未届满，或者删除个人信息从技术上难以实现的，我们会停止除存储和采取必要的安全保护措施之外的处理』，即数据可转为「仅存储 + 必要的安全保护措施」的隔离状态，不得读成「已删除」"
anchor = "stepfun-retention-deletion-technically-infeasible"

[[product.retention.point]]
text = "Contract-layer deletion trigger (userservice §1.1.4): \"未按约定支付相应的服务费用的，我们有权单方面不经通知暂停或终止提供服务，并删除您在本平台上所有的非法律法规要求的全部数据等\" — on non-payment the platform has a right, not a duty, to delete data other than what laws and regulations require, without notice"
text_zh = "合同层删除触发（用户协议 §1.1.4）：『未按约定支付相应的服务费用的，我们有权单方面不经通知暂停或终止提供服务，并删除您在本平台上所有的非法律法规要求的全部数据等』。措辞是「平台有权」而非删除义务，且范围限于「非法律法规要求的」数据，不得写成「欠费即删除全部数据」"
anchor = "stepfun-retention-unpaid-data-deletion"

[[product.retention.point]]
text = "Object-level clause running parallel to the §4.2 deletion commitment (userservice §2.3.4): after an account is reclaimed or cancelled the platform still \"仍有权：1）保留相关行为记录，但涉及个人信息的除外（如有）\" — behavioural records may be retained, personal information excepted. The agreement does not define what counts as 行为记录"
text_zh = "与 §四.2 删除承诺并列的对象层条款（用户协议 §2.3.4）：账户被收回或者注销后平台『仍有权：1）保留相关行为记录，但涉及个人信息的除外（如有）』——行为记录仍可保留，个人信息除外。协议未定义「行为记录」的范围"
anchor = "stepfun-retention-behavior-records-after-deactivation"

[[product.retention.point]]
text = "Object: a cache copy of the request body. 《Prompt 缓存最佳实践》 — \"完整的对话数组会进入到缓存系统当中，其中包含 System Prompt、User Message 以及 Assistant Message\" (images, videos, tool-call information and results are listed alongside); caching is automatic above 256 tokens. This copy sits outside the §4.2 \"necessary period for your personal information\" wording"
text_zh = "对象：请求正文的缓存副本。《Prompt 缓存最佳实践》逐字『完整的对话数组会进入到缓存系统当中，其中包含 System Prompt、User Message 以及 Assistant Message』（图片、视频、工具调用信息及其结果同列），请求超 256 Token 自动进入。该副本不受 §四.2「为提供本平台相关服务之目的所必需的期间」表述约束"
anchor = "stepfun-prompt-cache-conversation-array-stored"

[[product.retention.point]]
text = "Term type for that copy: unquantified and with no upper bound. The only time clue on the page is \"缓存淘汰采用最近最少使用（LRU）策略，在系统请求高峰期，不使用的缓存会更容易被逐出；在系统请求低峰期，缓存则会拥有更长的生命周期\" — eviction floats with system load; there is no TTL, so no number of days may be written from it"
text_zh = "该副本的期限类型：无量化、无上限。唯一期限线索是『缓存淘汰采用最近最少使用（LRU）策略，在系统请求高峰期，不使用的缓存会更容易被逐出；在系统请求低峰期，缓存则会拥有更长的生命周期』——淘汰随系统负载浮动，全页无 TTL，不得据此写天数"
anchor = "stepfun-retention-prompt-cache-lru"

[[product.retention.point]]
text = "Customer-side control over that copy: \"目前不提供手动清除缓存的能力\" — no purge API and no switch; the only way to avoid the cache is to change the Prompt. Server-side LRU eviction still applies, so this must not be written as \"kept forever\""
text_zh = "客户侧对缓存副本无控制手段：『目前不提供手动清除缓存的能力』，没有清除接口也没有关闭开关，唯一规避方式是修改 Prompt；服务端仍有 LRU 淘汰，故也不得写成「永久保留」"
anchor = "stepfun-prompt-cache-no-manual-purge"

