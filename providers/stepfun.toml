[[source]]
url = "https://platform.stepfun.com/docs/zh/guides/developer/prompt-cache"
channel = "developer_data"
tier = "core"
note = "开发者文档《Prompt 缓存最佳实践》（本轮经 URL+.md 纯文本直连通道抓取，与 HTML 页同源）。界定 retention 的对象：对话数组（System Prompt/User Message/Assistant Message）、图片、视频会进入缓存系统；淘汰为 LRU，高峰期更易被逐出、低峰期生命周期更长，未量化期限、未提供关闭开关。用于说明 API 输入正文在『个人信息必要期间』之外另有缓存副本。 档位适用范围（本轮补充）：本页为通用开发者文档（guides/developer 下，无档位限定），缓存按模型自动启用，所列 step-5-preview、step-3.7-flash、step-3.5-flash、step-3.5-flash-2603 均属本档支持模型；Chat Completions API 参考页在请求地址 Note 中明示『Step Plan 场景请使用 POST https://api.stepfun.com/step_plan/v1/chat/completions』，即本档与普通 API 是同一接口的同一缓存面（仅路径前缀不同）。官方无 Step Plan 通道专属缓存表述，故 zdr 结论置信度记 medium。"

