[[product.zdr.point]]
text = "This round of re-review (2026-09-21) keeps the direction \"zero retention not supported\", but lowers confidence from medium to low — the evidence can only be written in weak form, not as a direct vendor statement about retaining or deleting request content. (1) Primary basis, 129852 §2.14 (anchor retention-necessary-period): \"Except where laws and regulations, regulatory requirements, third-party agreements, product rules, a separate agreement between you and Tencent Cloud, or the provision of this service so require, Tencent Cloud will retain your data only for the period necessary for the purpose of providing this service.\" This line says that Tencent Cloud retains your data under this service with the period limited to what is necessary to provide the service; it states an upper bound on duration, not a quantified retention commitment"
text_zh = "本轮重审(2026-09-21)维持方向『不支持零保留』,但 confidence 由 medium 降为 low——依据只能写成弱形式,不能写成厂商对请求内容的直陈保留/删除表态。①主依据 129852 §2.14(anchor retention-necessary-period):『除法律法规、监管要求、第三方协议、产品规则、您与腾讯云另行约定或为提供本服务所必需的情形外，腾讯云将仅在为提供本服务之目的所必需的期间内保留您的数据。』这条说的是『腾讯云会保留本服务项下的您的数据,期限限定在为提供本服务之目的所必需』,是期限上限声明,不是量化保留承诺"

[[product.zdr.point]]
text = "The second sentence, \"after the data processing period ends Tencent Cloud will stop unnecessary use of the data, or return or delete the relevant data on your lawful and valid instructions\", shows that deletion is not automatic"
text_zh = "第二句『数据处理期限结束后停止不必要的数据使用行为,或者根据您的合法有效指示将相关数据返还给您或删除』表明删除并非自动"

[[product.zdr.point]]
text = "The third sentence, \"if laws and regulations do not permit Tencent Cloud to delete such data, or deleting such data is technically difficult to achieve, Tencent Cloud will cease all processing other than storage, keeping records, performing statutory obligations and taking necessary security protection measures\", expressly lists \"storage\" as one form of \"processing\". (2) Object chain (readable only from the surrounding clauses, not from a keyword hit): \"your data\" is nowhere defined in 129852 (§1.1 defines only \"input content\" and \"output content\"). Reading backwards — §2.11, \"Tencent Cloud processes your input content on your mandate, instructions and requirements and for the purpose of providing this service to you\""
text_zh = "第三句『如果法律法规不允许腾讯云删除此类数据,或删除此类数据从技术上难以实现,腾讯云将停止除存储、留存记录、履行法定义务和采取必要安全保护措施之外的处理』把『存储』明确列为『处理』的一种。②对象链(只能靠读同节上下文,非关键词命中):『您的数据』在 129852 全文无定义(§1.1 只定义『输入内容』『输出内容』)。往前读——§2.11『腾讯云基于您的委托、指令和需求并以向您提供本服务为目的处理您的输入内容』"

[[product.zdr.point]]
text = "The opening of §2.12, \"Tencent Cloud will process your input content accordingly depending on the model, feature, deployment or manner of use\", whose item (1) lists the objects of processing as \"your input content, output content, call parameters, call time, model name, model version, account information, resource usage, error information, log information, network information and other necessary data\""
text_zh = "§2.12 开头『腾讯云将根据不同模型、功能、部署或使用方式对您的输入内容进行相应处理』,其(1)项把处理对象列为『您的输入内容、输出内容、调用参数、调用时间、模型名称、模型版本、账号信息、资源用量、错误信息、日志信息、网络信息及其他必要数据』"

[[product.zdr.point]]
text = "The last sentence of §2.14, \"in the third-party-deployed model scenario, the rules for retention, deletion, return, anonymization or other processing of data\", echoes the list of objects for the third-party scenario in §2.12(2). So \"your data\" in §2.14 = the objects of processing under this service listed in §2.12 (including input and output bodies), not boilerplate about account personal information. (3) Scenario check: the models available on this tier (1823/130092: GLM-5, and Auto \"tc-code-latest\") are not \"third-party-deployed models\" as defined in 129852 §1.5 (\"currently includes the DeepSeek series of models\"), so they fall under §2.12(1), the \"Tencent Cloud first-party model and Tencent Cloud self-deployed model scenarios\""
text_zh = "§2.14 末句『第三方部署模型场景下对数据的留存、删除、返还、匿名化或其他处理规则』与 §2.12(2) 第三方场景的对象列举呼应。故 §2.14 的『您的数据』= §2.12 列举的本服务处理对象(含输入/输出正文),不是账户个人信息套话。③场景确认:本档可用模型(1823/130092:GLM-5、Auto『tc-code-latest』)不属 129852 §1.5 定义的『第三方部署模型』(『目前包括 DeepSeek 系列模型』),故落入 §2.12(1)『腾讯云自有模型和腾讯云自部署模型场景』"

[[product.zdr.point]]
text = "§1.11 and §6.4 further commit that intelligent routing and fallback switching will not send your data to third-party-deployed models. Contract-layer documents applicable to this tier: item 2 of the China-site \"related agreements\" list 1823/130105, the \"LLM Service Platform TokenHub Terms of Service\", points through documentation-center entry page 1823/130106 to 301/129852 (that entry page carries only a title plus \"for details, see ...\"). (4) §2.16 repositioned (misjudged last round, removed from anchors[] this round): §2.16 is about security obligations — \"bears the corresponding security obligations for your business data within Tencent Cloud's control\", \"takes necessary protective measures for your data across use, storage, transmission, access, disclosure, security and other aspects\", \"without your consent, Tencent Cloud will not make any unauthorized access to, use of or disclosure of your business data\". Within it, \"data you upload, submit, transmit or store in Tencent Cloud data centers through this service\" is a qualifier on the protected data, and \"storage\" appears in the list of stages covered by the protective measures; neither is a statement that \"we will store your request content\" — taking it as zdr evidence last round was a word hit with a different meaning. (5) Reverse search (by reading, not by matching): the full text of 129852, the full tier privacy policy f49e, 130092, 130103, 130104 and 131410 contain no statement of the kind \"does not store\", \"not retained after processing completes\" or \"will not keep input and output\". The three closest passages all fail to apply to this tier: (a) CodeBuddy statement 284d §2.7, custom-model scenario, \"except where necessary to complete the user's request, effect necessary transmission, conduct security audit, troubleshoot faults or retain data as required by law and where separately notified, we will not read or store your input or the output content of your custom model during this process\" — the context is client-side direct forwarding with the user's own third-party model key, not platform-side inference on this tier"
text_zh = "§1.11、§6.4 另承诺智能路由与备用切换不会把数据送往第三方部署模型。合同层为本档适用文档:中国站『相关协议』清单 1823/130105 第 2 条『大模型服务平台 TokenHub 服务条款』经文档中心条目页 1823/130106 指向 301/129852(该条目页正文只有标题+『详细信息,请参见…』)。④§2.16 重新定位(上一轮判错,本轮已从 anchors[] 删除):§2.16 讲的是安全保障义务——『对腾讯云控制范围内的您的业务数据承担相应的安全保障义务』『从使用、存储、传输、访问、披露、安全等多方面对您的数据采取必要保护措施』『未经您同意,腾讯云不会对您的业务数据进行任何未获授权的访问、使用和披露』。其中『您通过本服务上传、提交、传输或存储在腾讯云数据中心的数据』是受保护数据的定语,『存储』出现在保护措施覆盖的环节列表里,二者都不是『我们会存储您的请求内容』的声明——上一轮拿它当 zdr 依据属于词命中、义不同。⑤反向检索(读,非匹):129852 全文、档位隐私政策 f49e 全文、130092、130103、130104、131410 均无『不存储』『处理完成后不保留』『不会留存输入输出』类表述。最接近的三处均不适用本档:(a) CodeBuddy 声明 284d §2.7 自定义模型场景『除为完成用户请求、实现必要传输、安全审计、故障排查或依法留存所必需且已另行告知的情形外,此过程中我们不会读取、存储您的输入、自定义模型输出内容』——语境是用户自带第三方模型 key 的客户端直连转发,不是本档平台侧推理"

[[product.zdr.point]]
text = "(b) the same file's §2.7.3, \"other than the use scenarios and purposes listed in this agreement, we will not store your code\" — the object is code information inside the CodeBuddy software, a different tier"
text_zh = "(b) 同文件 §2.7.3『除本协议列举的使用场景及目的外,我们不会存储您的代码』——对象是 CodeBuddy 软件中的代码信息,档位不同"

[[product.zdr.point]]
text = "(c) the codebuddy.ai security and privacy page, \"sensitive data will not be stored permanently\" — \"not stored permanently\" is not \"not stored\", and \"sensitive data\" is left undefined. Separately, §2.9, \"Tencent Cloud will retain logs such as information about the party served for no less than six months as required by law\", governs logs in the generated-synthetic-content labelling scenario (a statutory floor) and cannot be read in reverse as a retention period for input and output bodies. (6) No ZDR option: the tier-specific policy f49e, the full text of 129852, the 7 items in the China-site \"related agreements\" list 130105 (no DPA/DPSA entry), the tier FAQ 130103, the Coding Plan overview 130092, the model list 130051, the platform FAQ 130104 and the TokenHub API docs 130078/132280 contain no occurrence of ZDR or zero data retention"
text_zh = "(c) codebuddy.ai 安全隐私页『敏感数据不会被永久存储』——『不永久存储』≠不存储,且未定义『敏感数据』。另 §2.9『腾讯云将依法留存提供对象信息等相关日志不少于六个月』管的是生成合成内容标识场景的日志(法定下限),不能反推输入输出正文的保留期。⑥无 ZDR 选项:档位专属政策 f49e、129852 全文、中国站『相关协议』清单 130105 的 7 条(无 DPA/DPSA 条目)、档位 FAQ 130103、Coding Plan 概述 130092、模型列表 130051、平台 FAQ 130104、TokenHub API 文档 130078/132280 均无 ZDR/零数据保留字样"

[[product.zdr.point]]
text = "The China-site DPSA path 301/17347 returns HTTP 404 when tested. The international-site DPSA module 1300/78953 does carry ZDR, but says it applies only to the international-site TokenHub and the enterprise Token Plan, is bound to the Singapore / Frankfurt / Silicon Valley resource regions, does not apply to this tier and must not be mixed in. (7) Why only low: \"your data\" is undefined within this tier's contract, and the object chain has to be derived from §2.11 → §2.12 → §2.14 within the same section"
text_zh = "中国站 DPSA 路径 301/17347 实测 HTTP 404。国际站 DPSA 模块 1300/78953 确有 ZDR,但自述只适用于国际站 TokenHub 与 Token Plan 企业版,且绑定新加坡/法兰克福/硅谷资源地域,不适用本档,不得混入。⑦为什么只给 low:『您的数据』在本档合同内无定义,对象链必须靠 §2.11→§2.12→§2.14 同节推导"

[[product.zdr.point]]
text = "The sentence form of §2.14 is an upper bound on duration, not a direct statement that \"we will store input and output\". So this point can only be written in weak form: \"the contract acknowledges that data under this service is retained for the necessary period, with no quantified cap, deletion is not automatic, and no zero-retention option appears anywhere on this tier\". If what the ledger requires is a direct vendor statement on retaining or deleting request content, this tier should be treated as not_found. Residual uncertainty: the tier-specific privacy policy f49e does not cite the TokenHub Terms of Service, and no written document states how the Coding Plan and the platform terms connect (it can only be inferred from the 130105 list and the document attribution of 130092)."
text_zh = "§2.14 句式为期限上限、非『我们会存储输入输出』的直陈。故本条只能写成弱形式:『合同承认本服务项下数据会被保留至必要期间、无量化上限、删除非自动,且全档未见零保留选项』。若台账要求的是厂商对请求内容的直陈保留/删除表态,本档应视同 not_found。残余不确定性:档位专属隐私政策 f49e 未引用 TokenHub 服务条款,Coding Plan 与平台条款的适用衔接未见书面文件明示(仅 130105 清单与 130092 的文档归属可推)。"

