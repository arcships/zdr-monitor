anchor = "retention-necessary-period"

[[product.retention.point]]
text = "This tier gives no fixed number of days. (1) Object = \"your data\", including input and output content: 129852 §2.14, \"Except where laws and regulations, regulatory requirements, third-party agreements, product rules, a separate agreement between you and Tencent Cloud, or the provision of this service so require, Tencent Cloud will retain your data only for the period necessary for the purpose of providing this service\", after which it stops unnecessary use of the data, or returns or deletes it on your instructions"
text_zh = "本档无固定天数。①对象=输入/输出内容等『您的数据』:129852 §2.14『除法律法规、监管要求、第三方协议、产品规则、您与腾讯云另行约定或为提供本服务所必需的情形外，腾讯云将仅在为提供本服务之目的所必需的期间内保留您的数据』,期满停止不必要的数据使用行为,或按指示返还/删除"

[[product.retention.point]]
text = "Where the law does not permit deletion or deletion is technically difficult to achieve, this degrades to \"ceasing all processing other than storage, keeping records, performing statutory obligations and taking necessary security protection measures\". (2) Object = personal information: the tier privacy policy §2.1, \"we generally retain your personal information only for the shortest time necessary to achieve the purpose\" (the same wording as platform tier 91d5fd §2.1 and enterprise tier 5429d0 §2.1). (3) Exception (a floor, not a cap): §2.9, \"Tencent Cloud will retain logs such as information about the party served for no less than six months as required by law\", applies only to the explicit/implicit labelling scenario for generated synthetic content (the statutory retention of logs such as information about the party served), and cannot be read in reverse as \"all content is deleted after six months\""
text_zh = "法律不允许删除或技术难以实现时,降级为『停止除存储、留存记录、履行法定义务和必要安全保护措施之外的处理』。②对象=个人信息:档位隐私政策 §2.1『仅在为实现目的所必需的最短时间内保留您的个人信息』(与平台档 91d5fd §2.1、企业档 5429d0 §2.1 同口径)。③例外(下限而非上限):§2.9『腾讯云将依法留存提供对象信息等相关日志不少于六个月』仅适用生成合成内容显式/隐式标识场景(提供对象信息等日志的法定留存),不能反推『六个月后删除全部内容』"

[[product.retention.point]]
text = "§2.12(1) permits processing of input, output and logs within a reasonably necessary scope in the first-party and self-deployed model scenarios, for purposes such as inference, content safety review, service operations, troubleshooting, compliance auditing and billing settlement. (4) In the third-party-deployed model scenario, retention may be governed by the third party's own agreement (last sentence of §2.14, and §3.5)"
text_zh = "§2.12(1) 允许在自有/自部署模型场景为推理、内容安全审核、服务运维、故障排查、合规审计、计费结算等目的在合理必要范围内处理输入输出与日志。④第三方部署模型场景的留存可能适用第三方协议(§2.14 末句、§3.5)"

[product.processing_region]
codes = ["CN"]
anchor = "region-cn-processing"

[[product.processing_region.point]]
text = "§2.13: \"The location at which Tencent Cloud itself processes data under this service is determined by the service edition you use and the service region you select: the data processing location for China-site services is generally within the territory of the People's Republic of China\" — note the wording is \"generally\", not an absolute commitment. Supporting: the tier privacy policy §2.2, \"in accordance with laws and regulations we store user personal information collected within the territory of the People's Republic of China within the territory of the People's Republic of China. At present there is no scenario in which we provide your personal information outside the territory\""
text_zh = "§2.13:『腾讯云在本服务项下由腾讯云自身进行的数据处理地点，以您所使用的服务版本及所选择的服务地域为准：中国站服务的数据处理地点一般为中华人民共和国境内』——注意措辞是『一般』,非绝对承诺。佐证:档位隐私政策 §2.2『将中华人民共和国境内收集的用户个人信息存储于中华人民共和国境内。目前我们暂时不存在向境外提供您的个人信息的场景』"

[[product.processing_region.point]]
text = "The parent platform statement 11470 §6.2 says the same. Exception: in the third-party-deployed model scenario, the third party's actual processing location, processing method, retention period and cross-border transfer arrangements may be determined by that third party's agreement, service rules or actual service deployment (second half of §2.13, and §3.5) — whether this tier's models count as third-party-deployed models is not labelled, so whether that exception lands on this tier is in doubt (see notes)"
text_zh = "平台母声明 11470 §6.2 同口径。例外:第三方部署模型场景下,相关第三方对数据的实际处理地点、处理方式、保存期限和跨境传输安排可能由该第三方协议、服务规则或其实际服务部署决定(§2.13 后半、§3.5)——本档模型是否属第三方部署模型未标注,故该例外能否落到本档存疑(见 notes)"

[product.role]
kind = "processor"
anchor = "role-entrusted-processor"

[[product.role.point]]
text = "§2.11: \"Tencent Cloud processes your input content on your mandate, instructions and requirements and for the purpose of providing this service to you ... Tencent Cloud's data processing activities under this service may not exceed the scope of your instructions, and you have the right to supervise Tencent Cloud's data processing\" — the user is the one who decides and Tencent Cloud is the entrusted processor. Supporting: the parent platform statement §5.2, \"we process your personal information only on the mandate and instructions of the entrusting party\""
text_zh = "§2.11:『腾讯云基于您的委托、指令和需求并以向您提供本服务为目的处理您的输入内容…腾讯云在本服务项下的数据处理活动不能超出您的指示范围，您有权对腾讯云的数据处理行为进行监督』——用户为决定者、腾讯云为受托处理方(processor)。佐证:平台母声明 §5.2『我们仅按照委托者的委托和指示处理您的个人信息』"

[[product.role.point]]
text = "The tier privacy policy §4.1 only describes its own constraints, as the entrusting party, on downstream third parties. Why not high: (1) 129852 §2.6 also describes the compliance capacity as \"technical supporter, service provider or such other capacity as laws and regulations provide\""
text_zh = "档位隐私政策 §4.1 只描述其自己作为委托方对下游第三方的约束。不给 high 的原因:①129852 §2.6 又以『技术支持者、服务提供者或法律法规规定的其他身份』描述合规身份"

[[product.role.point]]
text = "(2) the tier privacy policy reads throughout in the voice of a personal information handler (\"in accordance with laws and regulations we will store ... within the territory\")"
text_zh = "②档位隐私政策通篇是个人信息处理者口吻(『我们会按照法律法规规定，将…存储于境内』)"

[[product.role.point]]
text = "(3) the CodeBuddy statement §2.15 calls itself an entrusted processor in the enterprise-user scenario, and the personal tier has no corresponding wording"
text_zh = "③CodeBuddy 声明 §2.15 在企业用户场景自称受托处理者,个人档无对应表述"

