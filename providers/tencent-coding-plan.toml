[product.training]
mark = "no"
anchor = "training-model-optimize"
mode = "opt_out"

[[product.training.point]]
text = "The tier-specific Tencent Cloud LLM Coding Plan Privacy Policy §1.1.2: \"To keep improving your user experience, we will use encryption and de-identification techniques and, on the premise of avoiding identification of any specific individual, use input and output content to optimize models\" — input and output are used to optimize models by default (that is, a model-improvement purpose), this can be turned off by submitting a ticket, and after it is turned off they are no longer used. Valuation rule = record the conservative case, \"will be used for model optimization/training (on by default, opt-out by ticket)\". Pointing the other way: TokenHub Terms of Service §2.17 (effective 2026-09-14), \"Tencent Cloud will not use the content you input while using this service to develop, train, fine-tune or improve Tencent Cloud's own algorithms, models or services\", with the TokenHub FAQ (130104) and TokenHub Privacy Policy §1.1.3 pointing the same way. Grounds for taking the tier-specific document: (1) the preamble of 129852 itself says \"for specific models, plug-ins, tools, third-party services or specific features, the more specific provisions in the corresponding specific rules, third-party agreements or model list shall prevail\" (anchor priority-specific-rule)"
text_zh = "档位专属《腾讯云大模型 Coding Plan 隐私政策》§1.1.2:『为持续提升您的用户体验，我们会采取加密和脱敏处理技术，在避免识别到特定个人的前提下，使用输入、输出内容来优化模型』——默认使用输入/输出优化模型(即属于模型改进用途),可提交工单关闭,关闭后不再使用。取值口径=按保守情形记『会被用于模型优化/训练(默认开启,可工单退出)』。与之相反:TokenHub 服务条款 §2.17(2026-09-14 生效)『腾讯云不会将您在使用本服务过程中的输入内容用于开发、训练、微调或改进腾讯云自身的算法、模型或服务』,TokenHub 常见问题(130104)与 TokenHub 隐私政策 §1.1.3 同向。取档位专属文件的依据:①129852 前言自认『就特定模型、插件、工具、第三方服务、或特定功能事项，以相应特定规则、第三方协议或模型清单中更具体的约定为准』(anchor priority-specific-rule)"

[[product.training.point]]
text = "(2) this tier's privacy policy is registered directly as item 6 of the official China-site \"related agreements\" list 1823/130105, making it a rule specific to this tier"
text_zh = "②该档位隐私政策由中国站官方『相关协议』清单 1823/130105 第 6 条直接登记,是本档专属规则"

[[product.training.point]]
text = "(3) the same policy line recurs in the adjacent personal subscription tier (Token Plan personal §1.1.2, word for word) and in the CodeBuddy client statement (284d...), while the enterprise tier (Token Plan enterprise §1.1.2) and the platform tier (91d5fd §1.1.3) carry no such clause — a written tier difference rather than an isolated leftover. The vendor gives no order of precedence between the two sets of documents, so confidence=medium"
text_zh = "③同一政策线在相邻个人订阅档(Token Plan 个人版 §1.1.2 逐字相同)与 CodeBuddy 客户端声明(284d…)中重复出现,而企业档(Token Plan 企业版 §1.1.2)与平台档(91d5fd §1.1.3)均无此条款——是成文的档位差异而非孤立遗留。厂商未就两派文件给出优先级,故 confidence=medium"

[[product.training.point]]
text = "If the contract clauses were taken as controlling, the conclusion would flip to \"not used for training\""
text_zh = "若以合同条款为准则结论反转为『不用于训练』"

