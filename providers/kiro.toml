[[product]]
id = "free"
badge = "免费版"
category = "coding_plan"
plan_level = "free"
[product.training]
mark = "no"
mode = "opt_out"
anchor = "kiro-individual-training"
[[product.training.point]]
text = "Contract layer, the strongest basis for this tier's mark=no: §50.3 names \"Kiro Free Tier\" among the services for which AWS may \"use and store AI Content ... to develop and improve the applicable AI Service and its underlying technologies\", and may use AI Content that is not personal data to develop and improve AWS and affiliate machine-learning and artificial-intelligence technologies. The product-page sentence (kiro-individual-training) is the same finding from the lower-authority source."
text_zh = "合同层依据（本档 mark=no 的最强来源）：§50.3 点名「Kiro Free Tier」，AWS 可「use and store AI Content ... to develop and improve the applicable AI Service and its underlying technologies」，非个人数据还可用于开发改进 AWS 及关联方的机器学习/人工智能技术。产品页那句（kiro-individual-training）是同向的低层级证据。"
anchor = "aws-kiro-50-3"
[product.zdr]
mark = "no"
anchor = "kiro-free-60"
[[product.zdr.point]]
text = "Page-level statement, not tier-specific: Kiro may store your questions, responses and additional context such as code and metadata about your requests. The storage scope therefore covers inputs and outputs, not inputs alone."
text_zh = "页面级、不分档的通用存储陈述：Kiro 可能存储你的问题、响应以及代码和请求元数据等附加上下文。存储范围因此是输入＋输出，不只是输入。"
anchor = "kiro-general-storage"
[[product.zdr.point]]
text = "No zero-retention option is disclosed for this tier. Opting out of service improvement does not stop abuse-detection storage: for Free Tier the 60-day input retention still applies after opt-out."
text_zh = "本档未披露任何零保留方案。退出服务改进不停止滥用检测留存：Free 档退出后，输入 60 天的留存仍然适用。"
anchor = "kiro-optout-no-effect"
[[product.zdr.point]]
text = "Contract layer: §50.14.2 states that Bedrock abuse detection mechanisms apply to Kiro use, including retention and potential human review of inputs and outputs when certain models are selected, and repeats the Free Tier 60-day input retention."
text_zh = "合同层：§50.14.2 写明 Bedrock 滥用检测机制适用于 Kiro，含选择特定模型时对输入输出的留存与可能的人工审查，并重申 Free 档输入最多 60 天的留存。"
anchor = "aws-kiro-50-14-2"
[product.retention]
days = 60
object = "mixed"
basis = "fixed_period"
anchor = "kiro-free-60"
[[product.retention.point]]
text = "Object: the disclosed 60 days covers inputs only (\"we may store your inputs\"); responses fall under the page-level storage statement but no deletion period is published for them. Context: this is Free Tier's additional abuse-detection mechanism, not this tier's general content retention — Free Tier content used for service improvement (opt-out available) carries no published deletion period. Period type: an upper bound, with the clause's own carve-out \"unless otherwise required by law\"."
text_zh = "对象：已披露的 60 天只覆盖输入（原文 we may store your inputs）；响应在页面级存储陈述范围内，但没有任何删除期限。语境：这是 Free 档专属的额外滥用检测机制，不是本档的一般内容留存——用于服务改进的内容（可退出）未给删除期限。期限类型：上限，并带原文例外「unless otherwise required by law」。"
anchor = "kiro-free-60"
[[product.retention.point]]
text = "Model-level abuse detection on top of the above: for OpenAI GPT models, classifier-flagged traffic is retained up to 30 days for automated offline abuse detection."
text_zh = "其上叠加的模型级滥用检测：OpenAI GPT 被分类器标记的流量为自动化离线滥用检测最多保留 30 天。"
anchor = "kiro-model-abuse"
[[product.retention.point]]
text = "Second model-level case: for Anthropic Claude Fable 5.1 (Preview) all traffic — not only classifier-flagged traffic — is retained up to 30 days, and classifier-flagged traffic is subject to potential human review performed by AWS."
text_zh = "模型级的第二种情形：Anthropic Claude Fable 5.1 (Preview) 是全量流量（不只是被标记流量）最多 30 天，且被标记流量可能由 AWS 人工审查。"
anchor = "kiro-fable-abuse"
[[product.retention.point]]
text = "Opting out of service improvement does not affect abuse-detection storage: the Free Tier 60-day input retention still applies after opt-out."
text_zh = "退出服务改进不影响滥用检测留存：Free 档退出服务改进后，输入 60 天的留存仍然适用。"
anchor = "kiro-optout-no-effect"
[[product.retention.point]]
text = "Contract layer for every tier: §50.14.2 applies Bedrock abuse detection to Kiro use, including retention and potential human review of inputs and outputs when certain models are selected, and repeats the Free Tier 60-day input retention."
text_zh = "合同层（不限档位）：§50.14.2 让 Bedrock 滥用检测适用于 Kiro，含选择特定模型时对输入输出的留存与可能的人工审查，并重申 Free 档输入最多 60 天的留存。"
anchor = "aws-kiro-50-14-2"
[[product.retention.point]]
text = "Code index and cache periods are not disclosed."
text_zh = "代码索引与缓存期限未披露。"
[product.processing_region]
codes = ["US"]
anchor = "kiro-individual-region"
[[product.processing_region.point]]
text = "Default for this tier: content is stored in US East (N. Virginia), and the models page adds that Free Tier users and individual subscribers are always served from the US."
text_zh = "本档默认：内容存储在 US East (N. Virginia)；models 页补充 Free Tier 与 individual 订阅者一律从美国服务。"
anchor = "kiro-models-us-default"
[[product.processing_region.point]]
text = "Exception that follows the model, not the tier: global cross-region inference applies only to models explicitly designated as experimental; their inference requests may be processed in multiple AWS Regions worldwide, including Regions outside the one associated with the Kiro profile, while the storage Region is unaffected."
text_zh = "按模型而非按档位的例外：全球跨区推理只适用于明确标注 experimental 的模型，其推理请求可能在多个 AWS Region 处理，包括与 Kiro profile 无关的 Region；存储地不受影响。"
anchor = "kiro-experimental-global"
[[product.processing_region.point]]
text = "Contract-layer tension to read alongside codes=[\"US\"]: §50.3(c) allows AWS to store AI Content processed by Kiro Free Tier in an AWS region outside of the AWS region where the AI Service is used, solely in connection with the development and improvement in §50.3(a)-(b)."
text_zh = "与 codes=[\"US\"] 并列阅读的合同层张力：§50.3(c) 允许 AWS 把 Kiro Free Tier 的 AI Content 存到使用地以外的 AWS Region，但仅限于 §50.3(a)-(b) 所述的开发与改进目的。"
anchor = "aws-kiro-50-3"
[product.role]
mark = "unknown"
searched = ["https://kiro.dev/docs/privacy-and-security/data-protection/", "https://aws.amazon.com/service-terms/"]

