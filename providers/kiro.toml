text = "Contract layer, not tier-specific: §50.14.2 applies Bedrock abuse detection to Kiro use, including retention and potential human review of inputs and outputs when certain models are selected."
text_zh = "合同层（不限档位）：§50.14.2 让 Bedrock 滥用检测适用于 Kiro，含选择特定模型时对输入输出的留存与可能的人工审查。"
anchor = "aws-kiro-50-14-2"
[product.processing_region]
codes = ["selected", "global"]
anchor = "kiro-bedrock"
[[product.processing_region.point]]
text = "Which geography serves a request depends on the model and the profile region: GPT-5.6 models are served from the US regardless of profile region, Claude Fable 5.1 (Preview) only in US East (N. Virginia), and every other model from the geography that matches the profile."
text_zh = "由哪个 geography 服务取决于模型与 profile region：GPT-5.6 一律从美国服务（与 profile region 无关），Claude Fable 5.1 (Preview) 仅 US East (N. Virginia)，其余模型按 profile 所在的 geography。"
anchor = "kiro-models-geography"
[[product.processing_region.point]]
text = "Exception that follows the model, not the tier: global cross-region inference applies only to models explicitly designated as experimental; their inference requests may be processed in multiple AWS Regions worldwide, including Regions outside the one associated with the Kiro profile, while the storage Region is unaffected."
text_zh = "按模型而非按档位的例外：全球跨区推理只适用于明确标注 experimental 的模型，其推理请求可能在多个 AWS Region 处理，包括与 Kiro profile 无关的 Region；存储地不受影响。"
anchor = "kiro-experimental-global"
[[product.processing_region.point]]
text = "Models page states the same exception: experimental models may be processed in commercial AWS Regions worldwide, including outside the profile's geography, and cross-region inference does not change where data is stored."
text_zh = "models 页同旨：experimental 模型可能在全球商业 AWS Regions 处理，包括 profile geography 之外；跨区推理不改变数据存储地。"
anchor = "kiro-models-experimental-global"
[[product.processing_region.point]]
text = "Downstream constraint: model availability varies by country or region, and Kiro's model offerings align with each provider's usage and geographic requirements (OpenAI, Anthropic, MiniMax, Zhipu AI, DeepSeek, Qwen)."
text_zh = "下游约束：模型可用性因国家/地区而异，Kiro 的模型供给对齐各家提供方（OpenAI、Anthropic、MiniMax、Zhipu AI、DeepSeek、Qwen）的使用与地域要求。"
anchor = "kiro-models-availability"
[product.role]
kind = "unknown"
searched = ["https://kiro.dev/docs/privacy-and-security/data-protection/", "https://kiro.dev/docs/models", "https://aws.amazon.com/service-terms/"]
[[product.role.point]]
text = "No official text assigns a role to this hop: the Bedrock sentence describes the inference path only (cross-region inference within a geography) and does not characterise Kiro or its model suppliers as processor, controller or subprocessor."
text_zh = "没有官方原文给这一跳定性：Bedrock 那句只讲推理路径（geography 内的跨区推理），没有把 Kiro 或其模型供给方写成 processor、controller 或 subprocessor。"
anchor = "kiro-bedrock"
[[product.role.point]]
text = "Third-party model providers are a separate, separately contracted hop: §50.12.1 supplies third-party models as \"Third-Party Content\", applies Section 20 (AWS Marketplace) to models sold by third parties, and makes Amazon Web Services, Inc. the invoicing party — independent contracting rather than a sub-processor relationship."
text_zh = "第三方模型提供方是独立的一跳、各自缔约：§50.12.1 把第三方模型作为「Third-Party Content」提供，第三方销售的模型适用 §20（AWS Marketplace），并由 Amazon Web Services, Inc. 开票——更像各自缔约，而不是次级受托关系。"
anchor = "aws-kiro-third-party-models"
[[product.role.point]]
text = "Scope of that hop: §50.12.5 says information shared with a third-party model provider does not include Your Content. The models page lists the downstream providers (OpenAI, Anthropic, MiniMax, Zhipu AI, DeepSeek, Qwen) without any role characterisation."
text_zh = "这一跳的范围：§50.12.5 明确与第三方模型提供方共享的信息不含 Your Content；models 页列出下游提供方（OpenAI、Anthropic、MiniMax、Zhipu AI、DeepSeek、Qwen），但没有任何角色表述。"
anchor = "aws-kiro-third-party-no-content"
[[product.role.point]]
text = "Official chain is Kiro → Amazon Bedrock hosted models only. No BYOK, custom OpenAI-compatible endpoint or local model capability was found, so there is no separately documented BYOK or local-inference data hop, and running the agent on your own machine is not local inference."
text_zh = "官方链路只有 Kiro→Amazon Bedrock 托管模型。未发现 BYOK、自定义 OpenAI-compatible endpoint 或本地模型能力；因此没有可单列的 BYOK/本地数据链，不能把本机 agent 执行误写成本地推理。"

