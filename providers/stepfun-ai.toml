[product.training]
mark = "no"
anchor = "training-license-for-avoidance"

[[product.training.point]]
text_zh = "ToS §4.1(ii) 与 §1.4 的明示训练授权以参与 StepFun Startup Program / Early Access 等项目为前提(§4.4 亦称 in certain programs)"

[[product.training.point]]
text_zh = "§8.1 免责声明另载明服务「MAY BE IMPROVED THROUGH THE USE OF USAGE DATA FOR MODEL TRAINING AND FINE-TUNING」,未限定项目。隐私政策 §1.3 同向:特定项目下 API 的 Prompts/Outputs/API call logs 可被保留并用于训练、微调,此时 StepFun 自认 controller"

[[product.training.point]]
text = "ToS §4.1(iv) applies to every platform customer and is not conditioned on any program: “We may also use Content to provide, maintain, develop and improve our Services, comply with applicable laws, enforce our Terms, and ensure the security of our Services.” Content is defined in §4 as Prompts, Outputs and Feedback, so this is an unconditional statement that inputs and outputs may be used to develop and improve the Services — training under the “improving the service counts as training” rule, and a side indication for zdr that StepFun keeps the power to use Content."
text_zh = "ToS §4.1(iv)（不限定项目、适用于全部平台客户）：「We may also use Content to provide, maintain, develop and improve our Services, comply with applicable laws, enforce our Terms, and ensure the security of our Services.」§4 定义 Content 含 Prompts、Outputs 与 Feedback，故这是「用输入输出开发与改进服务」的无条件表述；按 judgment.md「用来改进服务算训练」，它是本档 mark=no 最直接的无条件依据，同时也是厂商保留 use Content 权能（zdr 旁证）。"
anchor = "training-content-improve-services"

[[product.training.point]]
text = "The only route the ToS offers out of the §4.4 training authorisation is not to take part: “If you do not consent to the use of your Usage Data for AI training purposes, you should not participate in that program or should contact us to discuss alternative arrangements.” There is no self-serve opt-out in this tier — the authorisation travels with program participation."
text_zh = "§4.4 末句给出训练条款附带的唯一退路：「If you do not consent to the use of your Usage Data for AI training purposes, you should not participate in that program or should contact us to discuss alternative arrangements.」——不接受训练就不要参加该项目，或联系厂商另议。档内没有自助 opt-out，训练授权随项目参与绑定。"
anchor = "training-no-consent-do-not-participate"

[[product.training.point]]
text = "Privacy Policy §2 lists as a general purpose “To evaluate and improve our models, products, and services, where permitted by applicable law.” — a purpose statement that is not tied to any program, on the controller side where StepFun sets the purposes."
text_zh = "隐私政策 §2 的一般用途清单载明「To evaluate and improve our models, products, and services, where permitted by applicable law.」——不以参与任何项目为前提，属 StepFun 自任控制者一侧的用途声明。"
anchor = "training-privacy-improve-models"

[[product.training.point]]
text = "The §12 legal basis table maps that purpose to the object “End Users’ Interaction Information” with the basis “Consent & Legitimate interests”, and §1.3(b) defines End Users’ Interaction Information to include API input data (text, images, voice messages). It sits in tension with the scope statement at the top of the same Policy (§1.3: in the processor scenario the commercial customer is the controller), so both facts are kept side by side."
text_zh = "同一政策 §12 法律依据表把该目的的对象写作 End Users’ Interaction Information、依据写作 Consent & Legitimate interests，而 §1.3(b) 说明该信息含 API 输入（文本、图片、语音）。它与政策开头的范围声明存在内在张力（§1.3：受托场景下由商业客户担任 controller），故两条事实并列保留。"
anchor = "training-privacy-legal-basis-table"

