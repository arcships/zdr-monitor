[[product.zdr.point]]
text_zh = "不支持零保留:ToS §4.1(ii) 明文授权「store … all Output, Prompts and associated API call logs」,§4.1(iii) 可随时访问/审查 Content"

[[product.zdr.point]]
text_zh = "开发者文档《Prompt cache best practices》写默认开启的上下文缓存保存「the full array, including system prompt, user messages, and assistant messages」且不支持用户手动清缓存"
anchor = "zdr-cache-full-conversation-array"

[[product.zdr.point]]
text_zh = "DPA 的 Customer Data 定义覆盖经服务提交的数据,删除只发生在协议终止后 30 天内。全部官方材料无 ZDR 表述、开关或申请渠道。【本轮重审(读,不要匹)逐条一句话依据】§4.1(ii)——用户授予 StepFun 对 all Output, Prompts and associated API call logs(段内定义为 Usage Data)的永久不可撤销许可、明文含 store/access,且不以参与任何项目为条件,所以合同层没有「处理完即不保留」的约束"

[[product.zdr.point]]
text_zh = "§4.1(iii)——厂商保留随时访问/审查/编辑/删除 your Content(§4 定义含 Prompts/Outputs)的权利,预设 Content 在响应后仍可被访问(旁证)"

[[product.zdr.point]]
text_zh = "prompt-cache——each request's input is cached、可缓存内容为完整对话数组(system prompt+用户消息+助手消息)、超过 256 token 自动开启,所以请求正文进入服务端缓存,且 Manual cache clearing is not supported 即用户无清除途径(适用模型 step-5-preview / step-3.7-flash / step-3.5-flash / step-3.5-flash-2603)"
anchor = "zdr-cache-not-user-clearable"

[[product.zdr.point]]
text_zh = "DPA——Customer Data=all data or other information submitted through the Services,删除义务只在协议终止/到期后 30 天内触发,无请求级删除。反向检索:三份协议 + 74 页文档 + /legal 页均无「不存储 / 处理完删除」表述"

[[product.zdr.point]]
text_zh = "API 无 store 参数"

[[product.zdr.point]]
text_zh = "无 opt-out 或隐私设置页。维持 medium:厂商从未就 ZDR 表态,结论由多处合成,且缓存页未说明保存原文还是 KV 派生状态、未给 TTL。"

[product.retention]
days = 30
object = "mixed"
basis = "until_termination"
anchor = "retention-30-days"

[[product.retention.point]]
text = "DPA §7 — object: all Customer Data, including Customer Personal Data; context: termination or expiration of the Agreement; the 30 days bounds the return/deletion step, it is not a retention period inside the service term, and deletion is not deferred to day 30 (the Customer may request a return or use self-service deletion within that window)."
text_zh = "DPA §7:对象＝全部 Customer Data（含 Customer Personal Data）；语境＝协议终止或到期后；「30 天内」是返还/删除这一履行动作的上限，不是服务期内的保留期限，也不是「第 30 天才删」（客户可在该窗口内要求返还或自助删除）。"
anchor = "retention-30-days"

[[product.retention.point]]
text = "The same §7 deletion obligation carries three exceptions: storage required by applicable law or regulatory requirements, retention necessary to resolve a dispute between the parties, and retention necessary to combat harmful use of the Services."
text_zh = "同一删除义务带三类例外：适用法或监管要求要求存储、解决当事方之间的争议所必需、打击服务的有害使用所必需。"
anchor = "retention-deletion-exceptions"

[[product.retention.point]]
text = "The contract layer gives no number of days inside the service term. Schedule 1 Part B records “Duration and frequency of processing: continuous for the duration of the Agreement, as determined by Customer’s configuration of the Services” — processing, and therefore retention, lasts at least as long as the Agreement."
text_zh = "合同层没有服务期内的保留天数:Schedule 1 Part B 记「Duration and frequency of processing: continuous for the duration of the Agreement, as determined by Customer’s configuration of the Services」——处理（因而保留）至少持续整个协议期。"
anchor = "retention-duration-of-processing"

[[product.retention.point]]
text = "Schedule 1 Part B “Storage limitation: compliance with legal retention requirements under applicable law” — the storage limitation points only to statutory retention requirements and sets no service-term day count. The DPA therefore cannot be read as “inputs/outputs, cache and logs are kept for 30 days”."
text_zh = "Schedule 1 Part B「Storage limitation: compliance with legal retention requirements under applicable law」——存储限制只指向适用法下的法定保留要求,未给服务期内的天数。故本档不能读成「输入输出/缓存/日志保留 30 天」。"
anchor = "retention-storage-limitation"

[[product.retention.point]]
text_zh = "§2 另禁止将 Customer Personal Data 用于业务目的之外的保留。隐私政策 §7 为通用最小化原则（电话号码持续保留、IP 3 年、注销即删除或匿名化）。"
anchor = "retention-not-longer"

[[product.retention.point]]
text = "Deletion on account closure is not absolute: the Privacy Policy §7 rule “If you deactivate your account, delete personal information, or the retention period is expired, we will delete or anonymize your personal information, except in the following cases:” is followed by two exceptions — compliance with legal retention requirements, and extension of the period for financial, audit, dispute resolution, or other legitimate purposes. Together with the three DPA §7 exceptions there is no absolute “delete at expiry” commitment in this tier."
text_zh = "注销/到期即删不是绝对承诺：隐私政策 §7 的「If you deactivate your account, delete personal information, or the retention period is expired, we will delete or anonymize your personal information, except in the following cases:」后接两条例外——适用法下的法定保留要求、为财务/审计/争议解决或其他正当目的延长保留期。与 DPA §7 的三类例外叠加后，本档没有任何「到期必删」的绝对承诺。"
anchor = "retention-account-deletion-exceptions"

[[product.retention.point]]
text = "Cache object: the prompt-cache page says caching activates automatically above 256 tokens, publishes no TTL, and lets eviction float with load — “Eviction uses LRU: during peak traffic, unused cache entries are evicted more aggressively; off-peak they live longer.”"
text_zh = "缓存对象:prompt-cache 页说明请求超过 256 token 自动开启缓存、未公布 TTL、淘汰随负载浮动——「Eviction uses LRU: during peak traffic, unused cache entries are evicted more aggressively; off-peak they live longer.」"
anchor = "retention-cache-eviction-lru"

[[product.retention.point]]
text = "The only hint at a cache lifetime is the troubleshooting item “Verify calls are not spaced so far apart that the cache expires.” No number of days is given, and the page does not say whether the cached content is the original request text or a derived state."
text_zh = "缓存期限的唯一暗示是排障清单的「Verify calls are not spaced so far apart that the cache expires.」——仍未给天数，也未说明缓存保存的是请求原文还是 KV 派生状态。"
anchor = "retention-cache-expiry-hint"

