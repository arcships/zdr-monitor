[[source]]
url = "https://platform.stepfun.ai/docs/en/agreement/dataprocess"
channel = "contract"
tier = "core"
note = "Data Processing Agreement（生效 2025-11-28），由 ToS §4.2 并入条款体系，适用于 Customer Data（经服务提交的全部数据，含 Customer Personal Data）。§2 定性协议角色（Customer=controller，StepFun=processor）并禁止业务目的外的 retain/use/disclose；§7 终止后 30 天内返还/删除及三类例外；Schedule 1 Part B 的 Storage limitation 仅指向「适用法下的法定保留要求」；§8 + Schedule 2 载 EU SCC Module 2/3 与 UK/Swiss 附录。本档（Step Plan 订阅）的付费协议并入平台 ToS，故 DPA 同样适用。role 与 retention 的 contract 级来源。"

[[source]]
url = "https://platform.stepfun.ai/docs/en/agreement/userprivacy"
channel = "enterprise_privacy_faq"
tier = "core"
note = "User Privacy（平台隐私政策，生效 2026-08-07，主体 STEPFUN TECHNOLOGY (HK) LIMITED）。§1.3 专门覆盖商业客户经 API 提交的数据（StepFun 为 processor），并载明「参与 Startup Program / early access 项目并共享 API 数据」时 StepFun 就该数据自任 controller 的例外；§5 服务器所在地与跨境机制；§7 个人信息保留期限（IP 3 年、手机号持续保留、注销或到期即删除/匿名化）。channel 取 enterprise_privacy_faq，与同源条目 stepfun-ai 保持一致。"

[[source]]
url = "https://platform.stepfun.ai/docs/en/agreement/userservice"
channel = "contract"
tier = "core"
note = "StepFun Open Platform 服务条款（Terms of Service，生效 2026-08-07，主体 STEPFUN TECHNOLOGY (HK) LIMITED）。本档付费协议（SPARKLING AI PTE. LTD.）把平台 ToS 与隐私政策并入自身，故本 ToS 是本档的 contract 级训练条款来源。§1.4 定义 Early Access（Startup Program / Builder Program / 其他合作项目），§4.1(ii) 第二段的训练/微调明示授权以参与上述项目为前提，§4.4「AI Training in Certain Programs」同向；§4.1(ii) 第一段则是未提训练、但含 store/exploit/for any purpose 的宽泛许可；§8.1 免责声明另有一句未限定项目的「MAY BE IMPROVED THROUGH THE USE OF USAGE DATA FOR MODEL TRAINING AND FINE-TUNING」。§4.2 把 DPA 并入条款体系（role/retention 的 contract 来源入口）。"

[[source]]
url = "https://platform.stepfun.ai/docs/en/guides/developer/prompt-cache"
channel = "developer_data"
tier = "core"
note = "国际站开发者文档《Prompt cache best practices》——本轮新发现的页:它不在文档站 llms.txt 索引(74 页)也不在 /docs/sitemap.xml(75 页)里,只能从模型页/定价页的正文链接进入,故上一轮「74 页全量 0 命中」的枚举漏掉了它。抓取通道:r.jina.ai 渲染版 4429B 与官方 markdown 直连 /docs/en/guides/developer/prompt-cache.md(5033B)正文一致,锚点句逐字相同。内容是产品行为层证据(上下文缓存保存完整对话数组),不是政策文本,故 classify 的政策检测返回 not_policy,但页面为官方正文、verbatim 抓取,判 ok。适用性(本轮补充):本页属平台 API 文档档,缓存对 step-5-preview / step-3.7-flash / step-3.5-flash / step-3.5-flash-2603 生效,请求超过 256 token 自动开启且无开关(There is no separate paid cache feature to enable);Step Plan 订阅档是否同样适用,官方文档未说明。"

[[product]]
id = "api"
badge = "国际站 API"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "training-license-for-avoidance"

[[product.training.point]]
text_zh = "ToS §4.1(ii) 与 §1.4 的明示训练授权以参与 StepFun Startup Program / Early Access 等项目为前提(§4.4 亦称 in certain programs)"

[[product.training.point]]
text_zh = "§8.1 免责声明另载明服务「MAY BE IMPROVED THROUGH THE USE OF USAGE DATA FOR MODEL TRAINING AND FINE-TUNING」,未限定项目。隐私政策 §1.3 同向:特定项目下 API 的 Prompts/Outputs/API call logs 可被保留并用于训练、微调,此时 StepFun 自认 controller"

[product.zdr]
mark = "no"
searched = [
  "https://platform.stepfun.ai/docs/llms-full.txt",
  "https://platform.stepfun.ai/docs/llms.txt",
  "https://platform.stepfun.ai/docs/en/agreement/userservice",
  "https://platform.stepfun.ai/docs/en/agreement/userprivacy",
  "https://platform.stepfun.ai/docs/en/agreement/dataprocess",
  "https://platform.stepfun.ai/docs/en/guides/developer/prompt-cache",
  "https://platform.stepfun.ai/docs/en/faq/common-questions.md",
  "https://platform.stepfun.ai/docs/sitemap.xml",
]
anchor = "zdr-usage-data-store-license"

[[product.zdr.point]]
text_zh = "不支持零保留:ToS §4.1(ii) 明文授权「store … all Output, Prompts and associated API call logs」,§4.1(iii) 可随时访问/审查 Content"

[[product.zdr.point]]
text_zh = "开发者文档《Prompt cache best practices》写默认开启的上下文缓存保存「the full array, including system prompt, user messages, and assistant messages」且不支持用户手动清缓存"

[[product.zdr.point]]
text_zh = "DPA 的 Customer Data 定义覆盖经服务提交的数据,删除只发生在协议终止后 30 天内。全部官方材料无 ZDR 表述、开关或申请渠道。【本轮重审(读,不要匹)逐条一句话依据】§4.1(ii)——用户授予 StepFun 对 all Output, Prompts and associated API call logs(段内定义为 Usage Data)的永久不可撤销许可、明文含 store/access,且不以参与任何项目为条件,所以合同层没有「处理完即不保留」的约束"

[[product.zdr.point]]
text_zh = "§4.1(iii)——厂商保留随时访问/审查/编辑/删除 your Content(§4 定义含 Prompts/Outputs)的权利,预设 Content 在响应后仍可被访问(旁证)"

[[product.zdr.point]]
text_zh = "prompt-cache——each request's input is cached、可缓存内容为完整对话数组(system prompt+用户消息+助手消息)、超过 256 token 自动开启,所以请求正文进入服务端缓存,且 Manual cache clearing is not supported 即用户无清除途径(适用模型 step-5-preview / step-3.7-flash / step-3.5-flash / step-3.5-flash-2603)"

[[product.zdr.point]]
text_zh = "DPA——Customer Data=all data or other information submitted through the Services,删除义务只在协议终止/到期后 30 天内触发,无请求级删除。反向检索:三份协议 + 74 页文档 + /legal 页均无「不存储 / 处理完删除」表述"

[[product.zdr.point]]
text_zh = "API 无 store 参数"

[[product.zdr.point]]
text_zh = "无 opt-out 或隐私设置页。维持 medium:厂商从未就 ZDR 表态,结论由多处合成,且缓存页未说明保存原文还是 KV 派生状态、未给 TTL。"

[product.retention]
days = 30
object = "mixed"
basis = "fixed_period"
anchor = "retention-30-days"

[[product.retention.point]]
text_zh = "DPA §7:协议终止/到期后 30 天内应要求返还或删除全部 Customer Data(法律要求、争议解决、反滥用除外)"

[[product.retention.point]]
text_zh = "§2 另禁止将 Customer Personal Data 用于业务目的之外的保留。隐私政策 §7 为通用最小化原则(电话号码持续保留、IP 3 年、注销即删除或匿名化)"

[product.processing_region]
codes = ["US"]
anchor = "processing-region-us"

[[product.processing_region.point]]
text = "§5「Our servers are located in the United States.」"

[[product.processing_region.point]]
text_zh = "跨境传输依 SCC 或合规数据传输协议。DPA §8 亦以 SCC Module 2/3 + UK/Swiss 附录为转移机制"

[product.role]
kind = "processor"
anchor = "role-controller-processor"

[[product.role.point]]
text_zh = "DPA §2「Customer is the controller and StepFun is the processor」,且 StepFun 仅按 Customer 书面指示处理"

[[product.role.point]]
text_zh = "隐私政策 §1.3 为同一关系,并载明例外——商业客户参与特定项目共享 API 数据时,StepFun 就该数据自认 controller"

