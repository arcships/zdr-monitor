[[product.processing_region.point]]
text = "§6 sets no subprocessor or processing-location clause, and the §5.1 authorization for the subprocessor list is a Standard Services clause, so the list does not speak for this tier. No inference location, data residency option or selectable region is disclosed for the Discounted Services."
text_zh = "§6 未设子处理者或处理地条款，而 §5.1 对子处理者清单的授权属 Standard Services 条款，故该清单对本档不构成表述。Discounted Services 未披露推理发生地、数据驻留选项或可选区域。"

[product.role]
kind = "unknown"
anchor = "training-discounted-6-1"

[[product.role.point]]
text = "Section 6 contains no Service Provider or Processor wording at all — the opposite of §5.1 — and §6.1 has Meta using Content to train its own models, i.e. for Meta's own purposes rather than on your instruction. This is a determination that the section makes no processor statement, and the anchor can only land on the own-purpose use clause."
text_zh = "§6 全文没有 Service Provider / Processor 表述（与 §5.1 相反），且 §6.1 是 Meta 拿 Content 训练自己的模型，即为自身目的使用，而非按你的指示处理。此项是『该节未作 processor 声明』的判断，锚点只能落在 §6.1 的自身用途条款上。"
anchor = "training-discounted-6-1"

[[product.role.point]]
text = "The MGPT's processor duties are conditioned on the Applicable Terms specifying Meta as a Service Provider or Processor — MGPT §2.1 reads \"To the extent the Applicable Terms specifies Meta as a Service Provider or Processor\" — and §5.1 makes that specification for the Standard Services only, so those duties are not triggered on this tier."
text_zh = "MGPT 的受托义务以 Applicable Terms 指定 Meta 为 Service Provider 或 Processor 为前提——MGPT §2.1 原文『To the extent the Applicable Terms specifies Meta as a Service Provider or Processor』；§5.1 只为 Standard Services 作了这一指定，故本档不触发这些义务。"
anchor = "role-process-on-instruction"

