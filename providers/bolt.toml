name = "Bolt.new"
line = "bolt"
site = "global"
plan_levels = ["free", "individual", "team", "enterprise"]
entity = "StackBlitz, Inc."
endpoint = ""
doc = "https://stackblitz.com/privacy-policy"

[[source]]
url = "https://stackblitz.com/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "Bolt/StackBlitz Privacy Policy。明确 AI Input/Output、代码、项目文件及 interaction data 的训练/数据集许可默认值与免费 opt-out；EEA/UK/CH 排除；组织托管账户默认排除但留了「管理员已开启」的口子；训练用途对既有账户 2026-10-07 起生效，且只覆盖该日及之后创建/生成的内容。保留口径：活跃期保留 + §11 首段 as long as necessary（按需保留），主动关户为 reasonable period（无量化），非过错终止/暂停后 30 天内容导出窗口（不是删除期限），备份/日志残留未量化；跨境至美国。§16 自认企业客户数据处理由 DPA 管辖、非仅由本政策管辖；DPA 与 trust.bolt.new 尚未纳管，拿到前组织档位维持 unknown。未披露向量索引、prompt cache 的独立期限，也未提供运营遥测总开关。"

[[source]]
url = "https://stackblitz.com/terms-of-service"
channel = "contract"
tier = "core"
note = "StackBlitz Terms of Service。定义 Bolt Model Development Content 并规定训练许可；Bolt Forge 另有以内容使用为条件的特殊模式。§3.5(h)(ii) 把组织托管账户（含 Teams 与 Enterprise 工作区）无条件排除在该节之外，与隐私政策 §5.C 留的「管理员开启」例外口径不同。"

[[source]]
url = "https://bolt.new/platform/security"
channel = "enterprise_privacy_faq"
tier = "core"
note = "Bolt 官方安全页，明确受 MSA/DPA 管辖的 Team 与 Enterprise 客户不参与模型训练和数据共享。"

[[product]]
id = "free"
badge = "免费版"
category = "coding_plan"
plan_level = "free"
[product.training]
mark = "no"
mode = "opt_out"
anchor = "bolt-training-default-opt-out"
[[product.training.point]]
text = "By default, and unless you opt out, Bolt Model Development Content that is eligible under the prospective-application rules may be used to train, fine-tune, evaluate, benchmark and improve models and to prepare datasets licensed to third parties; opt-out is free of charge, implemented within fifteen (15) days, and does not unwind models already trained or datasets already delivered."
text_zh = "默认（除非退出）可将符合「Prospective Application」条件的 Bolt Model Development Content（AI Input、AI Output、代码、项目文件、错误/fix traces、tool invocations、edit histories）用于训练、微调、评测、基准测试并制作许可数据集；可免费退出，最长 15 天内实施，且不回溯已训练模型或已交付数据集。"
anchor = "bolt-training-default-opt-out"
[[product.training.point]]
text = "Not applied before October 7, 2026 or before the Terms take effect for the account; only content created or generated on or after the later of those two dates is eligible, and earlier content is not eligible even if it remains stored in the account or project (earlier content re-submitted to Bolt AI Features on or after the applicable date becomes eligible). Forge Content is eligible from September 14, 2026 if covered by a Forge consent that has not been withdrawn."
text_zh = "对既有账户 2026-10-07（或条款对该账户生效日）起才适用；只有在该日及之后创建或生成的内容 eligible，更早的内容即使仍存在账户或项目里也不 eligible（在该日之后重新提交给 Bolt AI Features 的部分除外）。Forge Content 自 2026-09-14 起需有未撤回的 Forge 同意。"
anchor = "bolt-training-prospective-application"
[[product.training.point]]
text = "Accounts determined to be located in the EEA, the United Kingdom, or Switzerland are excluded: no model development and no dataset licensing, and no reliance on legitimate interests or consent for those purposes; an account whose location cannot be determined is treated as located there."
text_zh = "EEA/UK/CH 账户默认排除：不用于模型开发或数据集许可，厂商也不依赖合法利益或同意；定位无法确定的账户按位于这些地区处理。"
anchor = "bolt-training-eea-exclusion"
[[product.training.point]]
text = "Bolt Forge is offered on the condition that Forge Content (AI Input, AI Output and related interaction data such as error-and-fix traces generated while Forge is enabled, plus the project files processed by Forge) may be used to train models and to prepare de-identified datasets licensed to third-party AI developers, including for compensation; enabling Forge requires an affirmative consent action."
text_zh = "Bolt Forge 以内容使用为条件：启用 Forge 期间产生的 AI Input、AI Output 与交互数据（含 error-and-fix traces）连同经 Forge 处理的项目文件（Forge Content）可用于训练模型并制作去标识化数据集对外许可（含付费许可）；启用需以肯定动作明示同意。"
anchor = "bolt-forge-training-condition"
[[product.training.point]]
text = "While Forge is enabled, the opt-out does not apply to Forge Content; stopping use of Forge ends collection of new Forge Content but does not by itself withdraw consent; after withdrawal the content is no longer selected for new model-training runs or newly prepared or licensed datasets, but processing already completed, models already trained and datasets already delivered are not unwound."
text_zh = "Forge 启用期间 opt-out 不适用于 Forge Content；停止使用 Forge 只终止新内容的收集，不等于撤回同意；撤回后不再把 Forge Content 选入新的训练运行或新数据集，但不回溯已完成的处理、已训练模型与已交付数据集。"
anchor = "bolt-forge-optout-and-withdrawal"
[product.zdr]
mark = "unknown"
searched = ["https://stackblitz.com/privacy-policy", "https://stackblitz.com/terms-of-service", "https://bolt.new/platform/security"]
[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "bolt-retention-active-accounts"
[[product.retention.point]]
text = "Object: personal information and user content. Context: default (while the account remains active). Duration type: no quantified period."
text_zh = "对象=个人信息与用户内容；语境=默认（账户活跃期）；期限类型=无量化期限——账户活跃期间保留。"
anchor = "bolt-retention-active-accounts"
[[product.retention.point]]
text = "Section 11 opening standard: retained for as long as necessary to provide the Services, support active accounts, comply with legal obligations, resolve disputes, and enforce agreements — as-needed retention, neither a fixed period nor bounded by service termination."
text_zh = "§11 首段总标准：为提供服务、支持活跃账户、履行法律义务、解决争议与执行协议所必需即保留——属按需保留，既不是固定期限，也不是以服务终止为界。"
anchor = "bolt-retention-as-long-as-necessary"
[[product.retention.point]]
text = "Context: voluntary account closure. The account and associated data enter an inactive or expired state, and StackBlitz will delete or anonymize such data within a reasonable period following closure, subject to backup retention, legal obligations and security requirements — no quantified period (the text contains no thirty-day figure)."
text_zh = "语境=主动关户：账户及关联数据进入 inactive/expired 状态，厂商在关户后「合理期间」内删除或匿名化，并受备份保留、法律义务与安全要求限制——无量化期限（原文没有 30 天这个数）。"
anchor = "bolt-retention-voluntary-closure"
[[product.retention.point]]
text = "Context: termination or suspension other than for cause. A reasonable means to retrieve or export content is made available for thirty (30) days following the effective date, after which StackBlitz may delete it — this is an export availability window, not a deletion deadline."
text_zh = "语境=非过错终止或暂停：厂商在生效日起 30 天内提供检索/导出内容的合理途径，之后「may delete」——这是导出可用期，不是删除期限。"
anchor = "bolt-retention-termination-export"
[[product.retention.point]]
text = "Context: termination for abuse or policy violations. The account may be permanently disabled and associated data deleted, with no export window, subject to applicable legal requirements."
text_zh = "语境=违规终止（滥用服务或违反条款）：可永久停用账户并删除关联数据，无导出窗口，仍受适用法律要求约束。"
anchor = "bolt-retention-abuse-violation"
[[product.retention.point]]
text = "Context: after deletion or termination. Residual copies may persist in backups, logs, or archival systems for a limited period (unquantified), and are not used for active processing except as necessary for security, fraud prevention, or legal compliance."
text_zh = "语境=删除或终止之后：备份、日志、归档系统中的残留副本可能再保留有限期间（未量化），且不得用于主动处理（安全、反欺诈、法律合规除外）。"
anchor = "bolt-retention-backups-residual"
[[product.retention.point]]
text = "Object: relevant portions of files you explicitly attach to an AI prompt. Context: AI requests sent to third-party AI service providers. Duration type: limited but unquantified — those providers do not receive ongoing or independent access to your files."
text_zh = "对象=显式附加到 AI prompt 的文件的相关部分；语境=经第三方 AI 服务商的 AI 请求；期限类型=有限期间但未量化——这些服务商不获得对文件的持续或独立访问。"
anchor = "bolt-retention-third-party-ai-inputs"
[product.processing_region]
codes = ["US", "global"]
anchor = "bolt-region-us-global"
[product.role]
mark = "unknown"
searched = ["https://stackblitz.com/privacy-policy", "https://stackblitz.com/terms-of-service"]

