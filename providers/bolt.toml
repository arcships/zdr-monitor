endpoint = ""
doc = "https://stackblitz.com/privacy-policy"

[[source]]
url = "https://stackblitz.com/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "Bolt/StackBlitz Privacy Policy。明确 AI Input/Output、代码、项目文件及 interaction data 的训练/数据集许可默认值与免费 opt-out；EEA/UK/CH 排除；活跃账户保留与关户 30 天删除；跨境至美国。未披露向量索引、prompt cache 的独立期限，也未提供运营遥测总开关。"

[[source]]
url = "https://stackblitz.com/terms-of-service"
channel = "contract"
tier = "core"
note = "StackBlitz Terms of Service。定义 Bolt Model Development Content 并规定训练许可；Bolt Forge 另有以内容使用为条件的特殊模式。"

[[source]]
url = "https://bolt.new/platform/security"
channel = "enterprise_privacy_faq"
tier = "core"
note = "Bolt 官方安全页，明确受 MSA/DPA 管辖的 Team 与 Enterprise 客户不参与模型训练和数据共享。"

[[product]]
id = "free"
badge = "免费版"
category = "coding_plan"
plan_level = "free"
[product.training]
mark = "no"
mode = "opt_out"
anchor = "bolt-training-default-opt-out"
[[product.training.point]]
text_zh = "默认可将 prompts、outputs、代码、项目文件、错误/fix traces、tool invocations 与 edit histories 用于训练/微调/评测并制作许可数据集；可免费退出，最长 15 天实施且不追溯已训练模型或已交付数据集。EEA/UK/CH 账户默认排除。Bolt Forge 启用时另受其内容使用条件约束。"
[product.zdr]
mark = "unknown"
searched = ["https://stackblitz.com/privacy-policy", "https://stackblitz.com/terms-of-service", "https://bolt.new/platform/security"]
[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "bolt-retention-active-account-30d"
[[product.retention.point]]
text_zh = "账户及项目内容在账户活跃期间保留；主动关户后不超过 30 天删除或匿名化，但备份、法律与安全例外未量化。向量索引与 prompt/cache 未单列期限。"
[product.processing_region]
codes = ["US", "global"]
anchor = "bolt-region-us-global"
[product.role]
mark = "unknown"
searched = ["https://stackblitz.com/privacy-policy", "https://stackblitz.com/terms-of-service"]

