anchor = "bolt-region-us-global"
[product.role]
mark = "unknown"
searched = ["https://stackblitz.com/privacy-policy", "https://stackblitz.com/terms-of-service"]
[[product.role.point]]
text = "Scope limitation, not a role statement: §2 of the Policy excludes personal data processed by customers within applications they build or deploy, which is governed by customer agreements and DPAs."
text_zh = "适用范围限制（不构成角色表述）：政策 §2 把客户在其自建/部署的应用内处理的个人数据排除在政策之外，这部分由客户协议与 DPA 管辖。"
anchor = "bolt-scope-customer-apps-excluded"
[[product.role.point]]
text = "The Policy itself says enterprise customer data processing is governed by applicable DPAs rather than solely by this Privacy Policy; the DPA text is not collected yet, so this dimension stays unknown (pending sources: the DPA and trust.bolt.new)."
text_zh = "隐私政策 §16 自认企业客户数据处理由适用 DPA 管辖、并非仅由本政策管辖；DPA 原文尚未纳管，故本档 role 维持 unknown（待纳管来源：DPA、trust.bolt.new）。"
anchor = "bolt-enterprise-dpa-governs"

[[product]]
id = "enterprise"
badge = "Enterprise"
category = "coding_plan"
plan_level = "enterprise"
[product.training]
mark = "yes"
mode = "by_contract"
anchor = "bolt-team-enterprise-no-training"
[[product.training.point]]
text = "Enterprise and Team customers under an MSA or DPA are excluded from model training and data sharing."
text_zh = "官方安全页：受 MSA 或 DPA 管辖的 Enterprise 与 Team 客户被排除在模型训练与数据共享之外。"
anchor = "bolt-team-enterprise-no-training"
[[product.training.point]]
text = "Privacy Policy §5.C: the model-development and dataset-licensing practices do not apply to accounts governed by a separate written agreement with StackBlitz that addresses these uses, or to organization-managed accounts except to the extent the organization's administrator has enabled such uses and any notice and choices required by applicable law have been provided."
text_zh = "隐私政策 §5.C：这些训练/数据集许可实践不适用于受单独书面协议（MSA/DPA）管辖的账户，也不适用于组织托管账户——除非组织管理员已开启这些用途，且厂商已提供适用法律要求的通知与选择。"
anchor = "bolt-training-excluded-accounts"
[[product.training.point]]
text = "Terms §3.5(h)(ii): that section does not apply to organization-managed accounts, including Teams and Enterprise workspaces — an unconditional exclusion with no administrator exception. Both official versions are kept side by side: the Terms exclude these accounts outright, while the Privacy Policy leaves an administrator-enabled exception; the vendor does not explain the difference."
text_zh = "ToS §3.5(h)(ii)：该节不适用于组织托管账户（含 Teams 与 Enterprise 工作区）——无条件排除，没有管理员例外。两条官方口径并列保留：ToS 无条件排除，隐私政策留了「管理员已开启」的口子，官方未解释差异。"
anchor = "bolt-training-org-accounts-tos"
[product.zdr]
mark = "unknown"
searched = ["https://stackblitz.com/privacy-policy", "https://stackblitz.com/terms-of-service", "https://bolt.new/platform/security"]
[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "bolt-retention-active-accounts"
[[product.retention.point]]
text = "Object: personal information and user content. Context: default (while the account remains active). Duration type: no quantified period."
text_zh = "对象=个人信息与用户内容；语境=默认（账户活跃期）；期限类型=无量化期限——账户活跃期间保留。"
anchor = "bolt-retention-active-accounts"
[[product.retention.point]]
text = "Section 11 opening standard: retained for as long as necessary to provide the Services, support active accounts, comply with legal obligations, resolve disputes, and enforce agreements — as-needed retention, neither a fixed period nor bounded by service termination."
text_zh = "§11 首段总标准：为提供服务、支持活跃账户、履行法律义务、解决争议与执行协议所必需即保留——属按需保留，既不是固定期限，也不是以服务终止为界。"
anchor = "bolt-retention-as-long-as-necessary"
[[product.retention.point]]
text = "Context: voluntary account closure. The account and associated data enter an inactive or expired state, and StackBlitz will delete or anonymize such data within a reasonable period following closure, subject to backup retention, legal obligations and security requirements — no quantified period (the text contains no thirty-day figure)."
text_zh = "语境=主动关户：账户及关联数据进入 inactive/expired 状态，厂商在关户后「合理期间」内删除或匿名化，并受备份保留、法律义务与安全要求限制——无量化期限（原文没有 30 天这个数）。"
anchor = "bolt-retention-voluntary-closure"
[[product.retention.point]]
text = "Context: termination or suspension other than for cause. A reasonable means to retrieve or export content is made available for thirty (30) days following the effective date, after which StackBlitz may delete it — this is an export availability window, not a deletion deadline."
text_zh = "语境=非过错终止或暂停：厂商在生效日起 30 天内提供检索/导出内容的合理途径，之后「may delete」——这是导出可用期，不是删除期限。"
anchor = "bolt-retention-termination-export"
[[product.retention.point]]
text = "Context: termination for abuse or policy violations. The account may be permanently disabled and associated data deleted, with no export window, subject to applicable legal requirements."
text_zh = "语境=违规终止（滥用服务或违反条款）：可永久停用账户并删除关联数据，无导出窗口，仍受适用法律要求约束。"
anchor = "bolt-retention-abuse-violation"
[[product.retention.point]]
text = "Context: after deletion or termination. Residual copies may persist in backups, logs, or archival systems for a limited period (unquantified), and are not used for active processing except as necessary for security, fraud prevention, or legal compliance."
text_zh = "语境=删除或终止之后：备份、日志、归档系统中的残留副本可能再保留有限期间（未量化），且不得用于主动处理（安全、反欺诈、法律合规除外）。"
anchor = "bolt-retention-backups-residual"
[[product.retention.point]]
text = "Object: relevant portions of files you explicitly attach to an AI prompt. Context: AI requests sent to third-party AI service providers. Duration type: limited but unquantified — those providers do not receive ongoing or independent access to your files."
text_zh = "对象=显式附加到 AI prompt 的文件的相关部分；语境=经第三方 AI 服务商的 AI 请求；期限类型=有限期间但未量化——这些服务商不获得对文件的持续或独立访问。"
anchor = "bolt-retention-third-party-ai-inputs"
[[product.retention.point]]
text = "Scope: this conclusion covers the Privacy Policy only. The Policy itself states that enterprise customer data processing is governed by applicable DPAs rather than solely by this Privacy Policy (§16) and excludes data processed by customers within their own applications (§2), so retention for organization tiers may be set by the MSA/DPA; the DPA text and trust.bolt.new are not collected yet."
text_zh = "适用范围：本结论只覆盖隐私政策口径。隐私政策 §16 自认企业客户数据处理由适用 DPA 管辖、并非仅由本政策管辖（§2 另把客户自建/部署应用内的数据处理排除在政策之外），组织档位的保留期限可能由 MSA/DPA 另行约定；DPA 原文与 trust.bolt.new 尚未纳管。"
anchor = "bolt-enterprise-dpa-governs"
[product.processing_region]
codes = ["US", "global"]
anchor = "bolt-region-us-global"
[[product.processing_region.point]]
text = "Deployment topology, not a region commitment: the security page states that BYOK deployment lets you run Bolt inside your own AWS or Azure tenant with full infrastructure isolation and no shared compute. It does not state which regions can be selected or where data is stored, and the statement comes from the marketing/security page only (no trust-centre or contract text collected yet)."
text_zh = "部署拓扑而非区域承诺：安全页称 BYOK 部署可把 Bolt 跑在客户自己的 AWS/Azure 租户内、完全基础设施隔离、无共享算力。该页未声明可选处理区域或数据驻留地，且仅有营销/安全页口径（信任中心与合同文本尚未纳管），故 codes 不变。"
anchor = "bolt-region-byok-deployment"
