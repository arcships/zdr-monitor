text = "Scope: this conclusion covers the Privacy Policy only. The Policy itself states that enterprise customer data processing is governed by applicable DPAs rather than solely by this Privacy Policy (§16) and excludes data processed by customers within their own applications (§2), so retention for organization tiers may be set by the MSA/DPA; the DPA text and trust.bolt.new are not collected yet."
