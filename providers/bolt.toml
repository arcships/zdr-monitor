[[anchor]]
id = "bolt-training-default-opt-out"
source_id = "4b9a66c9075791b6"
topics = ["training"]
[anchor.selector]
prefix = "AI Model Development. "
exact = "Unless you opt out and subject to the regional and consent rules below, we may use Bolt Model Development Content that is eligible under “Prospective Application” below to train, fine-tune, evaluate, benchmark, and improve artificial-intelligence models developed by or for StackBlitz."
suffix = " This processing is separate from the operational and safety uses described above"

[[anchor]]
id = "bolt-training-prospective-application"
source_id = "4b9a66c9075791b6"
topics = ["training"]
[anchor.selector]
prefix = "Timing and Prospective Application. "
exact = "We will not use Bolt Model Development Content for model development or dataset licensing before October 7, 2026 or before the Terms take effect for your account. Bolt Model Development Content is eligible for those purposes only if it is created or generated on or after the later of October 7, 2026 and the date the Terms take effect for your account, except that Forge Content created or generated on or after September 14, 2026 is eligible if it is covered by a Forge consent that you have not withdrawn."
suffix = " Content created or generated before the applicable date is not eligible, even if it remains stored in your account or project."

[[anchor]]
id = "bolt-training-excluded-accounts"
source_id = "4b9a66c9075791b6"
topics = ["training"]
[anchor.selector]
prefix = "Excluded Accounts. "
exact = "These model-development and dataset-licensing practices do not apply to Bolt Model Development Content in accounts governed by a separate written agreement with us that addresses these uses, or to organization-managed accounts except to the extent the organization’s administrator has enabled such uses and we have provided any notice and choices required by applicable law."
suffix = " These practices also do not apply to accounts located in the European Economic Area"

[[anchor]]
id = "bolt-training-eea-exclusion"
source_id = "4b9a66c9075791b6"
topics = ["training"]
[anchor.selector]
prefix = "Accounts in the EEA, United Kingdom, and Switzerland. "
exact = "We do not use Bolt Model Development Content, including Forge Content, associated with an account we determine to be located in the European Economic Area, the United Kingdom, or Switzerland for AI model development or for preparing datasets for licensing, and we do not rely on legitimate interests or consent for those purposes for such accounts."
suffix = " We determine an account’s location from billing address"

[[anchor]]
id = "bolt-forge-training-condition"
source_id = "4b9a66c9075791b6"
topics = ["training"]
[anchor.selector]
prefix = "Forge Content is subject to the timing and eligibility limitations above, in addition to the affirmative-consent requirements in this paragraph. "
exact = "Forge is offered on the condition that we may use the AI Input, AI Output, and related interaction data (such as error-and-fix traces) generated while Forge is enabled, together with the project files processed by Forge (“Forge Content”), to train AI models and to prepare de-identified datasets that we license to third-party AI developers, including for compensation, for AI model development, training, and evaluation."
suffix = " You enable Forge only by taking an affirmative action"

[[anchor]]
id = "bolt-forge-optout-and-withdrawal"
source_id = "4b9a66c9075791b6"
topics = ["training"]
[anchor.selector]
prefix = "If your account is located in the European Economic Area, the United Kingdom, or Switzerland, we do not ask for this consent and Forge Content from your account is not used for these purposes. "
exact = "While Forge is enabled, the opt-out described above does not apply to Forge Content. You can stop using Forge at any time: on a plan that includes other AI modes, by switching to another agent or mode; on a plan in which Forge is the only AI mode, by changing your plan (including to a free plan). Stopping use of Forge ends the collection of new Forge Content but does not by itself withdraw your consent, and we may continue to use Forge Content collected while Forge was enabled for the purposes described in this paragraph until you withdraw that consent. You can withdraw your consent at any time, free of charge, by contacting privacy@stackblitz.com or, once available, in your account settings; we implement a withdrawal in the same manner as an opt-out under “Opting Out and Withdrawing Consent” above, and after withdrawal we will not select your Forge Content for new model-training runs or newly prepared or licensed datasets. Neither stopping use of Forge nor withdrawing consent unwinds processing completed before that time, models already trained, or datasets already delivered to licensees, except as required by applicable law."
suffix = " Your deletion, access, and other rights described in this Privacy Policy continue to apply."

[[anchor]]
id = "bolt-training-org-accounts-tos"
source_id = "f9a1769fbe2834f0"
topics = ["training"]
[anchor.selector]
prefix = "(h) Excluded Accounts. "
exact = "This Section 3.5 does not apply to: (i) Bolt Model Development Content in accounts governed by a separate written agreement with Stackblitz that addresses the uses described in this Section, in which case that agreement controls; (ii) organization-managed accounts, including Teams and Enterprise workspaces; or (iii) Restricted Region Accounts, as provided in Section 3.5(e)."
suffix = ""

