  "https://handbook.gitlab.com/handbook/legal/testing-agreement/",
  "https://docs.gitlab.com/user/gitlab_duo/data_usage/",
  "https://about.gitlab.com/privacy/",
  "https://about.gitlab.com/ai-transparency-center/",
]

[[product.zdr.point]]
text = "The beta/experimental tier has no ZDR arrangement of its own"
text_zh = "beta/experimental 档没有单独的 ZDR 安排"

[[product.zdr.point]]
text = "Whether the Duo-level Fireworks ZDR covers beta features is not stated in the public material."
text_zh = "Duo 层的 Fireworks ZDR 是否覆盖 beta 功能在公开材料中未说明。"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "gl-testing-agreement-2-3-personal-data"

[[product.retention.point]]
text = "The Testing Agreement sets no retention period and says only that Input and Output constitute Customer Content"
text_zh = "《Testing Agreement》未规定保留期，只说 Input/Output 构成 Customer Content"

[[product.retention.point]]
text = "There is no separate clause for data retention on beta features."
text_zh = "beta 功能的数据保留没有单独条款。"

[product.processing_region]
codes = ["US", "global"]
anchor = "gl-ai-gateway-not-residency"

[[product.processing_region.point]]
text = "Beta features also go through the AI Gateway, so the processing-location clauses are the same as the SaaS tier"
text_zh = "beta 功能同样经 AI Gateway，处理地条款同 SaaS 档"

[[product.processing_region.point]]
text = "The Testing Agreement does not address processing location."
text_zh = "《Testing Agreement》不涉及处理地。"

[product.role]
kind = "processor"
anchor = "gl-testing-agreement-2-3-personal-data"

[[product.role.point]]
text = "Testing Agreement §2.3: \"GitLab will process Customer’s Personal Data on the basis of performing this Agreement with Customer. Any sub-processors used to provide a Testing Feature will be listed at https://about.gitlab.com/privacy/subprocessors/\" — i.e. GitLab processes in the capacity of a party performing the agreement, and subprocessors are disclosed on the subprocessor page"
text_zh = "《Testing Agreement》§2.3：「GitLab will process Customer's Personal Data on the basis of performing this Agreement with Customer. Any sub-processors used to provide a Testing Feature will be listed at https://about.gitlab.com/privacy/subprocessors/」，即 GitLab 以履约方身份处理、子处理商按子处理商页披露"

[[product.role.point]]
text = "That agreement does not use the word processor explicitly the way the DPA does."
text_zh = "该协议未像 DPA 那样显式写 processor 字样。"

[[product]]
id = "self_managed_self_hosted_models"
badge = "自托管自选模型"
category = "self_host"
plan_level = "any"

[product.training]
mark = "yes"
mode = "by_deployment"
anchor = "gl-self-hosted-no-leave-network"

[[product.training.point]]
text = "There is no GitLab training clause to cite on this tier: whether training happens depends on the configuration and terms of the model the customer builds or chooses. The only certain fact about the path is \"Prompts, code inputs, and model responses do not leave your network.\" (Self-hosted page), i.e. GitLab never receives the content to train on"
text_zh = "本档没有 GitLab 的训练条款可引：训练与否取决于客户自建/自选模型的配置与条款。可确定的只有链路事实「Prompts, code inputs, and model responses do not leave your network.」（Self-hosted 页），即 GitLab 拿不到内容做训练"

[[product.training.point]]
text = "GitLab itself still states \"GitLab does not train generative AI models.\" (data_usage page)."
text_zh = "GitLab 自身仍声明「GitLab does not train generative AI models.」（data_usage 页）。"

[product.zdr]
mark = "yes"
mode = "by_deployment"
anchor = "gl-self-hosted-keep-data-in-env"

[[product.zdr.point]]
text = "Zero retention of content on this tier is architectural (the data never leaves the customer's environment), not a vendor ZDR commitment"
text_zh = "本档的内容零保留是架构性的（数据不离开客户环境），不是厂商的 ZDR 承诺"

[[product.zdr.point]]
text = "\"Use a self-hosted AI Gateway to keep all request and response data in your own environment\" — retention and deletion are controlled by the customer."
text_zh = "「Use a self-hosted AI Gateway to keep all request and response data in your own environment」——保留与删除由客户自己控制。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "gl-self-hosted-no-leave-network"

[[product.retention.point]]
text = "Object = prompts, code inputs and model responses: they do not leave the customer's network (so no GitLab-side retention period applies)"
text_zh = "对象=prompt/代码/模型响应：不出客户网络（故 GitLab 侧保留期不适用）"

[[product.retention.point]]
text = "Object = billing metadata (Instance ID, User ID, Call count, Timestamp): sent to GitLab, with no retention period given. Also: the same documentation page states, for the self-managed MCP server scenario, that \"GitLab does not transmit, store, retain, or process any data when the GitLab MCP server is used.\" (data_usage page), corroborating evidence on the same tier."
text_zh = "对象=计费元数据（Instance ID、User ID、Call count、Timestamp）：发给 GitLab，未给保留期。另：同一文档页对 self-managed 的 MCP server 场景写明「GitLab does not transmit, store, retain, or process any data when the GitLab MCP server is used.」（data_usage 页），属同一档位的旁证。"

[product.processing_region]
codes = ["selected"]
anchor = "gl-self-hosted-no-leave-network"

[[product.processing_region.point]]
text = "Processing location = the customer's own environment"
text_zh = "处理地=客户自建环境"

[[product.processing_region.point]]
text = "The Gov tier expressly requires installation in AWS GovCloud (US-West) (gov_dedicated page). Only billing metadata flows to GitLab."
text_zh = "Gov 档明确要求装在 AWS GovCloud (US-West)（gov_dedicated 页）。仅计费元数据流向 GitLab。"

[product.role]
kind = "unknown"
anchor = "gl-duo-ai-terms-1-5-gitlab-models"

[[product.role.point]]
text = "The models on this tier are not GitLab Models (§1.5 defines those as models hosted by GitLab or by a third party listed as a GitLab sub-processor) but Customer Models (§1.3)"
text_zh = "本档的模型不是 GitLab Models（§1.5 定义：由 GitLab 或 GitLab 子处理商托管的才是），而是 Customer Models（§1.3）"

[[product.role.point]]
text = "§2.2 expressly excludes GitLab's indemnity for functionality powered by Customer Models, so GitLab does not take a processor role on that hop."
text_zh = "§2.2 明文排除 GitLab 对 Customer Models 驱动功能的赔偿责任，故 GitLab 不就该跳承担 processor 角色。"

