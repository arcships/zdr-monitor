[[source]]
url = "https://about.gitlab.com/ai-transparency-center/"
channel = "official_blog"
tier = "contradiction"
note = "与 https://docs.gitlab.com/user/gitlab_duo/data_usage/（core，training 维度的来源）就同一档位、同一问题（GitLab Duo 的输入输出是否被用于训练模型）的 training 表述不一致。本页 FAQ「Will my data be used to train models?」答句为「GitLab does not currently train its own models. No inputs to or outputs from GitLab Duo features are currently used to train any GitLab models.」（两处均带时间限定 currently，即只承诺「目前」不训练）；core 文档 §Model training 为绝对表述「GitLab does not train generative AI models.」并紧接「All GitLab AI model sub-processors are restricted from using model input and output to train models.」。各自范围：本页是 about.gitlab.com/ai-transparency-center/（GitLab Inc.，官方博客/FAQ 层），答句主语逐字为「GitLab Duo features」与「GitLab models」，覆盖 GitLab Duo 各档；core 是 docs.gitlab.com/user/gitlab_duo/data_usage/（同一实体 GitLab Inc.），其 scope_note 记明覆盖 Duo 全部 AI-native 功能、SaaS 与 self-managed 均适用。四种解释的排除依据：（1）适用范围——两份都逐字指向 GitLab Duo 的输入输出与 GitLab 自家模型，不存在「一份管 API、一份管消费产品」的分野，FAQ 与 core 文档回答的是同一个问题，故本页不是「另一个范围」的 core；（2）档位——两份都不按档位切分：core 文档覆盖 SaaS 与 self-managed（含 Dedicated）用 GitLab 管理模型的全部档，FAQ 答句亦不限定档位（同页只把 Duo AI Terms 与 Testing Agreement 列为适用文件），故不是企业版 vs 个人版式的档位差；（3）站点——about.gitlab.com 与 docs.gitlab.com 同属 GitLab Inc.，notes 已记 GitLab 只有单一国际站、无国内/国际法律实体之分，故不适用站点解释；（4）时效——两份都是现行版本：本轮 2026-09-21 抓取两份 verdict 均为 ok，锚点原句在现行正文中逐字命中（notes 记 35 个锚点全部通过），未见任一页被新版取代或下线的证据；record 里两份文档都没有页面级 Last modified 日期可引（本文件只有抓取日期 2026-09-21），故本项不依据日期比对、而依据「无版本取代证据」排除——FAQ 的 currently 是承诺强度的时间限定语，不是过期版本的残留。需要厂商书面澄清：FAQ 的「does not currently train」是否表示 GitLab 保留将来改变训练做法的权利，以及 core 文档「GitLab does not train generative AI models.」的绝对承诺是否同样受该时间限定；两者并存时无法判断哪一个才是 GitLab 当前的正式承诺（本页虽属权威性最低的官方博客层，但仍是 GitLab 官方表述且直接回答同一问题）。"

