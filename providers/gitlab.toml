text_zh = "本档的关键差异：AI Gateway 部署区域由 GitLab 选、客户不能选，且「This service is not a data residency solution.」"

[[product.processing_region.point]]
text = "All a Dedicated customer can choose is the instance hosting location (Subscription Agreement appendix, \"Customer may choose its primary and secondary Hosting Locations for its GitLab Dedicated servers\"), which is not a residency guarantee for the Duo inference location."
text_zh = "Dedicated 客户能选的只是实例托管地（Subscription Agreement 附录「Customer may choose its primary and secondary Hosting Locations for its GitLab Dedicated servers」），不构成 Duo 推理地的驻留保证。"

