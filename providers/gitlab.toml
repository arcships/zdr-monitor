[[product.processing_region.point]]
text = "Conclusion: primarily the United States, deployed across multiple regions, with data residency expressly not promised (us_primary_no_residency_guarantee). (1) Routing: \"Because GitLab.com is single-homed in `us-east1`, requests to the AI Gateway are routed to `us-east4` in almost all cases.\""
text_zh = "结论：以美国为主、多区域部署但明确不承诺数据驻留（us_primary_no_residency_guarantee）。①路由：「Because GitLab.com is single-homed in `us-east1`, requests to the AI Gateway are routed to `us-east4` in almost all cases.」"

[[product.processing_region.point]]
text = "(2) AI Gateway deployment regions: North America (`us-east4`), Europe (`europe-west2`/`europe-west3`/`europe-west9`) and Asia Pacific (`asia-northeast1`/`asia-northeast3`)"
text_zh = "②AI Gateway 部署区域：North America（`us-east4`）、Europe（`europe-west2`/`europe-west3`/`europe-west9`）、Asia Pacific（`asia-northeast1`/`asia-northeast3`）"

[[product.processing_region.point]]
text = "(3) No residency: \"The multi-region AI Gateway deployment does not enforce strict data sovereignty. Requests are not guaranteed to go to or remain in a particular region. This service is not a data residency solution.\" and \"You cannot directly trace your AI requests to specific regions.\""
text_zh = "③不驻留：「The multi-region AI Gateway deployment does not enforce strict data sovereignty. Requests are not guaranteed to go to or remain in a particular region. This service is not a data residency solution.」且「You cannot directly trace your AI requests to specific regions.」"

[[product.processing_region.point]]
text = "(4) The model hop: \"The exact location of the LLM models used by the AI Gateway is determined by third-party model providers. The models are not guaranteed to reside in the same geographical regions as the AI Gateway deployments. Data might flow to other regions where the model provider operates.\""
text_zh = "④模型那一跳：「The exact location of the LLM models used by the AI Gateway is determined by third-party model providers. The models are not guaranteed to reside in the same geographical regions as the AI Gateway deployments. Data might flow to other regions where the model provider operates.」"

[[product.processing_region.point]]
text = "(5) Privacy Statement layer: \"Our Services are hosted in the United States and information we collect will be stored and processed on our servers in the United States.\" (6) Subprocessor location table: Anthropic, PBC = United States"
text_zh = "⑤Privacy Statement 层：「Our Services are hosted in the United States and information we collect will be stored and processed on our servers in the United States.」⑥子处理商位置表：Anthropic, PBC = United States"

[[product.processing_region.point]]
text = "OpenAI, LLC = United States"

[[product.processing_region.point]]
text = "Google LLC = United States"

[[product.processing_region.point]]
text = "Fireworks.ai, Inc. = United States and European Union. The opposing side, recorded alongside (not a covering clause, but it has to be on the same page): the hosting location of a GitLab Dedicated instance is chosen by the customer — the Subscription Agreement appendix, \"Customer may choose its primary and secondary Hosting Locations for its GitLab Dedicated servers\""
text_zh = "Fireworks.ai, Inc. = United States and European Union。并列的相反面向（不算覆盖条款，但必须同页记录）：GitLab Dedicated 的实例托管地是客户可选的——Subscription Agreement 附录「Customer may choose its primary and secondary Hosting Locations for its GitLab Dedicated servers」"

[[product.processing_region.point]]
text = "For self-managed/Dedicated using GitLab-managed models, the AI Gateway region is decided by GitLab (\"GitLab manages region selection. You cannot choose the deployment region of the AI Gateway.\"), so the choice of Dedicated hosting location does not imply the Duo inference location. Self-managed with self-hosted models is a different matter: requests never leave the customer's network"
text_zh = "self-managed/Dedicated 用 GitLab 管理模型时 AI Gateway 区域由 GitLab 决定（「GitLab manages region selection. You cannot choose the deployment region of the AI Gateway.」），所以 Dedicated 的托管地选择不推出 Duo 推理地。self-managed + 自托管模型档是另一回事：请求不出客户网络"

[[product.processing_region.point]]
text = "The Gov tier can only run self-hosted, with the AI Gateway installed in AWS GovCloud (US-West). Uncertainty: GitLab does not disclose the actual processing location of an individual request and the customer cannot trace it; only GitLab Support can look it up in the logs (Cloudflare headers plus the instance UUID)."
text_zh = "Gov 档只能走 self-hosted，AI Gateway 装在 AWS GovCloud (US-West)。不确定性：GitLab 不披露单次请求的实际处理地，客户也无法自行追踪，只能靠 GitLab Support 查日志（Cloudflare 头 + 实例 UUID）。"

