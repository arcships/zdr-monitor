[product.training]
mark = "yes"
mode = "default"
anchor = "gl-duo-data-usage-training-gitlab"

[[product.training.point]]
text = "Conclusion: there is an express commitment not to use data for training (not_permitted). Both hops are covered at the contract/documentation layer: (1) GitLab itself — the data_usage page §Model training reads \"GitLab does not train generative AI models.\""
text_zh = "结论：有明确承诺，不用于训练（not_permitted）。合同/文档层两跳都覆盖：①GitLab 自己 —— data_usage 页 §Model training 原句「GitLab does not train generative AI models.」"

[[product.training.point]]
text = "(2) the upstream model subprocessor hop — the same section: \"All GitLab AI model sub-processors are restricted from using model input and output to train models. These sub-processors are under data protection agreements with GitLab that prohibit the use of customer content for their own purposes, except to perform their independent legal obligations.\" Scope: the opening sentence of that page covers all AI-native GitLab Duo features"
text_zh = "②上游模型子处理商那一跳 —— 同节「All GitLab AI model sub-processors are restricted from using model input and output to train models. These sub-processors are under data protection agreements with GitLab that prohibit the use of customer content for their own purposes, except to perform their independent legal obligations.」适用范围：该页首句覆盖 GitLab Duo 全部 AI-native 功能"

[[product.training.point]]
text = "The same section of the Privacy Statement states expressly \"This data may be collected in both the SaaS and Self-managed products where AI-features are enabled\", so it applies to SaaS and to self-managed (including Dedicated) wherever GitLab-managed models are used"
text_zh = "Privacy Statement 同节明文「This data may be collected in both the SaaS and Self-managed products where AI-features are enabled」，故 SaaS / self-managed（含 Dedicated）用 GitLab 管理模型的场景都适用"

[[product.training.point]]
text = "Self-managed with bring-your-own models (Customer Models) falls outside GitLab's commitment. The conflicting side (no side taken; recorded alongside): (a) the AI section of the Privacy Statement uses conditional wording, \"However, we will not use your AI-inputs to train any language models without your instruction or prior consent\", and the same paragraph also says GitLab will \"collect AI prompts and output to debug and troubleshoot the services\" and collects \"de-identified prompts ... for the purposes of identifying and developing product improvements\" — i.e. \"not trained on by default\" rather than \"never trained on\", and the debugging collection of prompts and output is a separate purpose"
text_zh = "self-managed 自带模型（Customer Models）不在 GitLab 承诺范围内。冲突面（不选边，并列保留）：(a) Privacy Statement AI 节用的是条件式表述「However, we will not use your AI-inputs to train any language models without your instruction or prior consent」，同段还写明 GitLab 会「collect AI prompts and output to debug and troubleshoot the services」并收集「de-identified prompts ... for the purposes of identifying and developing product improvements」——即「默认不训练」而非「绝对不训练」，且 prompt/output 的调试收集是独立用途"

[[product.training.point]]
text = "(b) the AI Transparency Center's wording carries a time qualifier, \"GitLab does not currently train its own models. No inputs to or outputs from GitLab Duo features are currently used to train any GitLab models.\" (official blog layer, the lowest authority)"
text_zh = "(b) AI Transparency Center 的措辞带时间保留「GitLab does not currently train its own models. No inputs to or outputs from GitLab Duo features are currently used to train any GitLab models.」（官方博客层，权威性最低）"

[[product.training.point]]
text = "(c) Subscription Agreement §8.4 reserves over Customer Content \"a limited license to GitLab necessary for GitLab's provision of the Software and its development and improvement\" — whether \"development and improvement\" includes model training is not defined in the public terms. Uncertainty: GitLab does not disclose the retention period for de-identified prompts or the safeguards against re-identification"
text_zh = "(c) Subscription Agreement §8.4 对 Customer Content 保留「a limited license to GitLab necessary for GitLab's provision of the Software and its development and improvement」——「development and improvement」是否包含模型训练，公开条款未定义。不确定性：GitLab 未披露 de-identified prompts 的保存期与再识别防护"

[[product.training.point]]
text = "Nor does it state the no-training commitment separately for beta/experimental features (the Testing Agreement contains no training clause at all — neither a commitment nor an authorization to the contrary)."
text_zh = "也未把「不训练」承诺按 beta/experimental 功能单列（《Testing Agreement》通篇不含训练条款，既无承诺也无相反授权）。"

[product.zdr]
mark = "no"
anchor = "gl-duo-data-usage-retention-prompt-cache"

[[product.zdr.point]]
text_zh = "链上只有一跳有明确零保留承诺：GitLab 对 Fireworks AI 那一跳。端到端不成立，卡在这条例外上。"
anchor = "gl-duo-data-usage-zdr-fireworks"

[[product.zdr.point]]
text = "Conclusion: not zero retention across the whole chain (partial). The public material contains one express ZDR statement only, covering a single hop: \"For GitLab Duo requests, GitLab has a zero data retention policy with Fireworks AI. Fireworks AI discards model input and output data immediately after the output is provided and does not store input and output data for abuse monitoring.\" The exceptions that immediately follow it: (1) \"The exception to this policy is when prompt caching is turned on for GitLab Duo Code Suggestions and GitLab Duo Agentic Chat. For OpenAI models, you cannot turn off prompt caching.\""
text_zh = "结论：不是全链零保留（partial）。公开材料只有一条 ZDR 明文，且只覆盖一个跳：「For GitLab Duo requests, GitLab has a zero data retention policy with Fireworks AI. Fireworks AI discards model input and output data immediately after the output is provided and does not store input and output data for abuse monitoring.」该句紧接的例外：①「The exception to this policy is when prompt caching is turned on for GitLab Duo Code Suggestions and GitLab Duo Agentic Chat. For OpenAI models, you cannot turn off prompt caching.」"

[[product.zdr.point]]
text = "(2) \"Certain Anthropic and OpenAI models, including when hosted on Amazon Bedrock and Gemini Enterprise Agent Platform, are subject to limited vendor-side data retention.\" — these models expressly do have vendor-side retention, so that hop is not zero retention. On the GitLab side there are two further retentions decoupled from ZDR: \"On GitLab.com, GitLab retains chat and workflow history for anti-abuse purposes.\" and \"Logging information related to AI features is separate from any zero data retention policy with GitLab AI model sub-processors.\" Under the multi-hop rule \"a clear no on any hop makes the whole chain a no\": the Fireworks tier can be called zero retention, while the Anthropic/OpenAI tier (including when hosted on Bedrock or the Gemini Enterprise Agent Platform) is not"
text_zh = "②「Certain Anthropic and OpenAI models, including when hosted on Amazon Bedrock and Gemini Enterprise Agent Platform, are subject to limited vendor-side data retention.」——这些模型在 vendor 侧明确有保留，即该跳不是零保留。GitLab 侧另有两条与 ZDR 脱钩的保留：「On GitLab.com, GitLab retains chat and workflow history for anti-abuse purposes.」与「Logging information related to AI features is separate from any zero data retention policy with GitLab AI model sub-processors.」按多跳规则「任一跳明确为否，则全链为否」：Fireworks 档可称零保留，Anthropic/OpenAI（含 Bedrock / Gemini Enterprise Agent Platform 托管）档不是零保留"

[[product.zdr.point]]
text = "And the public material offers no unified ZDR switch or application path (on the contrary, retaining inputs and outputs is what requires the customer's written consent through a support ticket). Uncertainty: GitLab does not disclose how to tell, per model or per feature, whether the current configuration falls within ZDR coverage, and provides no verifiable ZDR attestation document."
text_zh = "且公开材料没有统一的 ZDR 开关或申请入口（保留输入输出反而是「客户经 support ticket 书面同意」才发生）。不确定性：GitLab 未披露如何按模型/功能判断当前配置是否处于 ZDR 覆盖范围，也未提供可核验的 ZDR 声明文件。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "gl-duo-data-usage-retention-no-other"

[[product.retention.point]]
text = "Conclusion: there is no uniform period"
text_zh = "结论：没有统一期限"

[[product.retention.point]]
text = "All that can be given is the one upper-bound commitment that GitLab does not retain inputs and outputs by default; every other object is unquantified (duration_kind=unspecified). By object: (1) [input and output content · GitLab side · default] \"GitLab does not otherwise retain input and output data unless customers provide consent through a GitLab Support ticket\" — not retained by default, and retention requires customer consent through a support ticket"
text_zh = "能给的只有「GitLab 侧默认不保留输入输出」这一条上限型承诺，其余对象均未量化（duration_kind=unspecified）。分对象：①【输入输出正文 · GitLab 侧 · 默认】「GitLab does not otherwise retain input and output data unless customers provide consent through a [GitLab Support ticket](...)」——默认不保留，保留需客户经 support ticket 同意"

[[product.retention.point]]
text = "(2) [chat / workflow history] \"GitLab Duo Chat and GitLab Duo Agent Platform retain chat and workflow history to help you return quickly to previously discussed topics. You can delete chats in the GitLab Duo Chat interface.\" (3) [GitLab.com anti-abuse exception] \"On GitLab.com, GitLab retains chat and workflow history for anti-abuse purposes.\" — no period given, and only on GitLab.com"
text_zh = "②【chat / workflow history】「GitLab Duo Chat and GitLab Duo Agent Platform retain chat and workflow history to help you return quickly to previously discussed topics. You can delete chats in the GitLab Duo Chat interface.」③【GitLab.com 反滥用例外】「On GitLab.com, GitLab retains chat and workflow history for anti-abuse purposes.」——未给期限，且仅 GitLab.com"

[[product.retention.point]]
text = "(4) [trace data] \"When you enable expanded logging for GitLab Duo Agent Platform, GitLab retains trace data. Logging information related to AI features is separate from any zero data retention policy with GitLab AI model sub-processors.\" — no period given, and expressly decoupled from the subprocessors' ZDR policy"
text_zh = "④【trace data】「When you enable expanded logging for GitLab Duo Agent Platform, GitLab retains trace data. Logging information related to AI features is separate from any zero data retention policy with GitLab AI model sub-processors.」——未给期限，且明文与子处理商 ZDR 政策脱钩"

[[product.retention.point]]
text = "(5) [once usage data collection is turned on] \"Full prompt and response text from interactions with GitLab Duo.\" and similar is recorded, for \"service improvement and debugging, and not for training AI models\" only, with no period given"
text_zh = "⑤【usage data collection 打开后】「Full prompt and response text from interactions with GitLab Duo.」等被记录，用途限「service improvement and debugging, and not for training AI models」，未给期限"

[[product.retention.point]]
text = "(6) [KV / prompt cache] \"When you turn on prompt caching, the model vendor temporarily stores prompt data in memory. The cached data is never logged to any persistent storage.\" — on by default and can be turned off, except for OpenAI models, where it cannot"
text_zh = "⑥【KV/提示缓存】「When you turn on prompt caching, the model vendor temporarily stores prompt data in memory. The cached data is never logged to any persistent storage.」——默认开启、可关，OpenAI 模型不可关"

[[product.retention.point]]
text = "(7) [the model subprocessor hop] Fireworks AI discards the data immediately after the output is provided"
text_zh = "⑦【模型子处理商那一跳】Fireworks AI 输出返回后立即丢弃"

[[product.retention.point]]
text = "\"Certain Anthropic and OpenAI models, including when hosted on Amazon Bedrock and Gemini Enterprise Agent Platform, are subject to limited vendor-side data retention.\" — GitLab does not quantify how long that \"limited\" is; it only points to a footnote on the model_selection page"
text_zh = "「Certain Anthropic and OpenAI models, including when hosted on Amazon Bedrock and Gemini Enterprise Agent Platform, are subject to limited vendor-side data retention.」——GitLab 未量化该「limited」是多久，只指向 model_selection 页脚注"

[[product.retention.point]]
text = "(8) [personal information generally] Privacy Statement §Data Retention, \"GitLab will only retain your Personal Data for as long as your account is active or as needed to perform our contractual obligations, provide you the Services, comply with legal obligations, resolve disputes, preserve legal rights, or enforce our agreements.\" — unquantified. Period type: not one clause here gives a retention period in days or months, so it is recorded as unspecified"
text_zh = "⑧【通用个人信息】Privacy Statement §Data Retention「GitLab will only retain your Personal Data for as long as your account is active or as needed to perform our contractual obligations, provide you the Services, comply with legal obligations, resolve disputes, preserve legal rights, or enforce our agreements.」——未量化。期限类型：本家没有任何一条给出具体天数/月数的保留期，故记 unspecified"

[[product.retention.point]]
text = "(1) is of the upper-bound type (zero by default) but carries the four exceptions (2)(3)(4)(5), so it cannot be read in reverse as \"no input or output is retained at all\". The self-managed + self-hosted model tier has an independent fact of its own: only billing metadata is sent to GitLab, and \"Prompts, code inputs, and model responses do not leave your network.\""
text_zh = "①是上限型（默认 0）但带②③④⑤四条例外，不能反推「所有输入输出都不留」。self-managed + 自托管模型档另有一条独立事实：只向 GitLab 发送计费元数据，「Prompts, code inputs, and model responses do not leave your network.」"

[product.processing_region]
codes = ["US", "global"]
anchor = "gl-ai-gateway-not-residency"

[[product.processing_region.point]]
text = "Conclusion: primarily the United States, deployed across multiple regions, with data residency expressly not promised (us_primary_no_residency_guarantee). (1) Routing: \"Because GitLab.com is single-homed in `us-east1`, requests to the AI Gateway are routed to `us-east4` in almost all cases.\""
text_zh = "结论：以美国为主、多区域部署但明确不承诺数据驻留（us_primary_no_residency_guarantee）。①路由：「Because GitLab.com is single-homed in `us-east1`, requests to the AI Gateway are routed to `us-east4` in almost all cases.」"

[[product.processing_region.point]]
text = "(2) AI Gateway deployment regions: North America (`us-east4`), Europe (`europe-west2`/`europe-west3`/`europe-west9`) and Asia Pacific (`asia-northeast1`/`asia-northeast3`)"
text_zh = "②AI Gateway 部署区域：North America（`us-east4`）、Europe（`europe-west2`/`europe-west3`/`europe-west9`）、Asia Pacific（`asia-northeast1`/`asia-northeast3`）"

[[product.processing_region.point]]
text = "(3) No residency: \"The multi-region AI Gateway deployment does not enforce strict data sovereignty. Requests are not guaranteed to go to or remain in a particular region. This service is not a data residency solution.\" and \"You cannot directly trace your AI requests to specific regions.\""
text_zh = "③不驻留：「The multi-region AI Gateway deployment does not enforce strict data sovereignty. Requests are not guaranteed to go to or remain in a particular region. This service is not a data residency solution.」且「You cannot directly trace your AI requests to specific regions.」"

[[product.processing_region.point]]
text = "(4) The model hop: \"The exact location of the LLM models used by the AI Gateway is determined by third-party model providers. The models are not guaranteed to reside in the same geographical regions as the AI Gateway deployments. Data might flow to other regions where the model provider operates.\""
text_zh = "④模型那一跳：「The exact location of the LLM models used by the AI Gateway is determined by third-party model providers. The models are not guaranteed to reside in the same geographical regions as the AI Gateway deployments. Data might flow to other regions where the model provider operates.」"

[[product.processing_region.point]]
text = "(5) Privacy Statement layer: \"Our Services are hosted in the United States and information we collect will be stored and processed on our servers in the United States.\" (6) Subprocessor location table: Anthropic, PBC = United States"
text_zh = "⑤Privacy Statement 层：「Our Services are hosted in the United States and information we collect will be stored and processed on our servers in the United States.」⑥子处理商位置表：Anthropic, PBC = United States"

[[product.processing_region.point]]
text = "OpenAI, LLC = United States"

[[product.processing_region.point]]
text = "Google LLC = United States"

[[product.processing_region.point]]
text = "Fireworks.ai, Inc. = United States and European Union. The opposing side, recorded alongside (not a covering clause, but it has to be on the same page): the hosting location of a GitLab Dedicated instance is chosen by the customer — the Subscription Agreement appendix, \"Customer may choose its primary and secondary Hosting Locations for its GitLab Dedicated servers\""
text_zh = "Fireworks.ai, Inc. = United States and European Union。并列的相反面向（不算覆盖条款，但必须同页记录）：GitLab Dedicated 的实例托管地是客户可选的——Subscription Agreement 附录「Customer may choose its primary and secondary Hosting Locations for its GitLab Dedicated servers」"

[[product.processing_region.point]]
text = "For self-managed/Dedicated using GitLab-managed models, the AI Gateway region is decided by GitLab (\"GitLab manages region selection. You cannot choose the deployment region of the AI Gateway.\"), so the choice of Dedicated hosting location does not imply the Duo inference location. Self-managed with self-hosted models is a different matter: requests never leave the customer's network"
text_zh = "self-managed/Dedicated 用 GitLab 管理模型时 AI Gateway 区域由 GitLab 决定（「GitLab manages region selection. You cannot choose the deployment region of the AI Gateway.」），所以 Dedicated 的托管地选择不推出 Duo 推理地。self-managed + 自托管模型档是另一回事：请求不出客户网络"

[[product.processing_region.point]]
text = "The Gov tier can only run self-hosted, with the AI Gateway installed in AWS GovCloud (US-West). Uncertainty: GitLab does not disclose the actual processing location of an individual request and the customer cannot trace it; only GitLab Support can look it up in the logs (Cloudflare headers plus the instance UUID)."
text_zh = "Gov 档只能走 self-hosted，AI Gateway 装在 AWS GovCloud (US-West)。不确定性：GitLab 不披露单次请求的实际处理地，客户也无法自行追踪，只能靠 GitLab Support 查日志（Cloudflare 头 + 实例 UUID）。"

[product.role]
kind = "processor"
anchor = "gl-duo-ai-terms-2-3-role-controller"

[[product.role.point]]
text = "Conclusion: on the enterprise/paid tiers GitLab positions itself as processor (the customer is controller)"
text_zh = "结论：企业/付费档 GitLab 自认 processor（客户为 controller）"

[[product.role.point]]
text = "On the free/self-serve tiers GitLab appears as controller (processor_for_enterprise_customer_controller_for_self_serve). Contract layer: (1) GitLab Duo AI Terms §2.3, \"To the extent Customer's use of AI Functionality powered by GitLab Models involves the processing of Personal Data, Customer's obligations as a Controller under the DPA will apply. Any sub-processors used to provide AI Functionality powered by GitLab Models will be listed at https://about.gitlab.com/privacy/subprocessors/ and all notifications of updates to that list will be done in accordance with Section 14 of the DPA.\" — it places the DPA's controller obligations on the customer, which puts GitLab in the processor position"
text_zh = "免费/自助档 GitLab 以 controller 身份出现（processor_for_enterprise_customer_controller_for_self_serve）。合同层：①《GitLab Duo AI Terms》§2.3「To the extent Customer's use of AI Functionality powered by GitLab Models involves the processing of Personal Data, Customer's obligations as a Controller under the DPA will apply. Any sub-processors used to provide AI Functionality powered by GitLab Models will be listed at https://about.gitlab.com/privacy/subprocessors/ and all notifications of updates to that list will be done in accordance with Section 14 of the DPA.」——把 DPA 的 controller 义务加在客户身上，即 GitLab 站 processor 位"

[[product.role.point]]
text = "§2.1 also states that \"these Terms, along with the Agreement and the DPA, govern Customer's access to and use of AI Functionality and GitLab Models\". (2) Subscription Agreement §14.2, \"If this Agreement is entered into on behalf of an Enterprise, the terms of the data processing addendum at ... (“DPA”) are hereby incorporated by reference and shall apply to the extent Customer Content includes Personal Data\""
text_zh = "§2.1 同时明确「these Terms, along with the Agreement and the DPA, govern Customer's access to and use of AI Functionality and GitLab Models」。②《Subscription Agreement》§14.2「If this Agreement is entered into on behalf of an Enterprise, the terms of the data processing addendum at ... (“DPA”) are hereby incorporated by reference and shall apply to the extent Customer Content includes Personal Data」"

[[product.role.point]]
text = "§14.4 also carries a PIPL cross-border clause requiring the customer, as \"personal information processor\", to give notice and obtain separate consent itself. (3) The subprocessor page opens with \"When acting as a processor for Customer, Gitlab may engage the following entities to carry out specific processing activities\". (4) The Privacy Statement, \"For Enterprise Users or accounts that are members of a paid namespace, the enterprise that provisioned your account or invited you to its paid namespace is the Controller of your data. GitLab is a Processor in this scenario\" — the same paragraph also confirms that in free/self-serve scenarios GitLab is itself the controller (the privacy statement is written throughout in a controller's voice: we collect / we use). (5) Bring-your-own models (Customer Models) and third-party products are excluded from GitLab's commitments and liability by AI Terms §1.3/§1.9/§2.2, and the role relationship on that hop is set between the customer and its own model vendor. Uncertainty: the body of the DPA (the handbook page only links to an external document, and the PDF text was not obtained this round) could not be checked clause by clause"
text_zh = "§14.4 另有 PIPL 出境条款，要求客户作为「personal information processor」自行完成告知与单独同意。③子处理商页开头「When acting as a processor for Customer, Gitlab may engage the following entities to carry out specific processing activities」。④《Privacy Statement》「For Enterprise Users or accounts that are members of a paid namespace, the enterprise that provisioned your account or invited you to its paid namespace is the Controller of your data. GitLab is a Processor in this scenario」——同一段也确认免费/自助场景下 GitLab 自任 controller（隐私声明通篇以 controller 口吻写 we collect / we use）。⑤自带模型（Customer Models）与第三方产品被 AI Terms §1.3/§1.9/§2.2 排除在 GitLab 承诺与责任之外，那一跳的角色关系由客户与其模型供应商自定。不确定性：DPA 正文（handbook 页只给外部文档链接，本轮未取到 PDF 正文）未能逐条核对"

[[product.role.point]]
text = "The Dedicated tier states no role of its own; under Subscription Agreement §14.2 it is presumed to follow the enterprise tier."
text_zh = "Dedicated 档未单独表述角色，按 Subscription Agreement §14.2 推定同企业档。"

