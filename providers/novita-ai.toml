[[product.retention.point]]
text = "Managed-model path, object = API input and output content, context = default, type = upper bound with no fixed day count: API inputs and outputs are \"Processed transiently for inference only. Not retained beyond the time required to generate and deliver Output, except where required by applicable law\" (FAQ item 3), and TOS §10.2 caps Content retention at \"the time it takes to generate Output and deliver that Output to you\". Since 2026-11-27 that clause is expressly limited to Novita AI's own handling in connection with Novita-Managed Models. The only quantified figure the FAQ gives for API-side data is technical metadata — \"Technical metadata (request timestamps, error codes, usage metrics): Retained for 6 months for the purposes of billing, debugging, and security auditing.\" — which is metadata, not request content."
text_zh = "托管模型路径：对象＝API 输入输出正文，语境＝默认，期限类型＝上限且无固定天数：API 输入输出「Processed transiently for inference only. Not retained beyond the time required to generate and deliver Output, except where required by applicable law」（FAQ 第 3 条），TOS §10.2 也把 Content 的保留限制在「the time it takes to generate Output and deliver that Output to you」。自 2026-11-27 起该条明示只覆盖 Novita 自身对 Content 的处理、且限 Novita-Managed Models。FAQ 对 API 侧数据唯一量化的数字是技术元数据——「Technical metadata (request timestamps, error codes, usage metrics): Retained for 6 months for the purposes of billing, debugging, and security auditing.」——那是元数据，不是请求正文。"
anchor = "novita-trustfaq-retention-by-category"

[[product.retention.point]]
text = "Third-party path, object = API inputs and outputs sent to a Third-Party API, context = default, type = undisclosed: §6.4 says those Inputs and Outputs are processed by the applicable Model Provider on its own infrastructure under the applicable Model Terms, that Novita's Section 10 commitments do not extend to any Model Provider, and that a Model Provider \"may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" No period is published on Novita's side. This is why the row carries basis=undisclosed rather than a fixed period: the no-retention cap now covers only part of the tier's content path."
text_zh = "第三方路径：对象＝提交给 Third-Party API 的 API 输入输出，语境＝默认，期限类型＝未披露。§6.4 写明这些 Inputs/Outputs 由相应 Model Provider 在其自有基础设施上按适用 Model Terms 处理，Novita 的 Section 10 承诺不延伸至任何 Model Provider，且 Model Provider「may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」Novita 侧未公布任何期限。故本行取 basis=undisclosed 而非固定期限：不留存的上限现在只覆盖本档内容路径的一部分。"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.retention.point]]
text = "Why this tier carries a third-party retention path: §6.1 of the same TOS defines the Services as providing access to both \"Novita-Managed Models\" and \"Third-Party APIs\"; requests sent to the latter are routed by §6.4 to the Model Provider's own terms, for which Novita publishes no retention period. The enterprise DPA is not public and cannot be read as closing that gap."
text_zh = "本档为什么存在第三方保留路径：同一份 TOS 的 §6.1 把 Services 定义为同时提供「Novita-Managed Models」与「Third-Party APIs」；提交给后者的请求按 §6.4 交给 Model Provider 自己的条款，Novita 未公布其保留期限。企业 DPA 不公开，不能据此认定该缺口已被补齐。"
anchor = "novita-tos-6-1-model-categories"

[[product.retention.point]]
text = "The scope sentence that draws the line, added 2026-11-27 at the end of §10.2: \"For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.\""
text_zh = "划界的范围句，2026-11-27 加在 §10.2 末尾：「For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.」"
anchor = "novita-tos-10-2-zdr-scope-managed-models"

[[product.retention.point]]
text = "FAQ item 3 says technical metadata is handled \"as described in our Privacy Policy and applicable Data Processing Agreement\", so the periods above are the default tier's; the specific periods for the enterprise tier are set by the DPA, which the public documentation does not carry."
text_zh = "FAQ 第 3 条称技术元数据的处理「as described in our Privacy Policy and applicable Data Processing Agreement」，即上面这些期限是默认档口径；企业档的具体期限按 DPA 约定，公开文档未载。"

[[product.retention.point]]
text = "A different kind of period, object = Personal Information: aggregated or de-identified information may be used indefinitely — \"We may also anonymize or de-identify your Personal Information (so that it can no longer be associated with you) for research or statistical purposes, as described above, in which case we may use this information indefinitely without further notice to you.\" It does not fall on API inputs and outputs."
text_zh = "另一类期限，对象=个人信息：去标识化/聚合信息可无限期使用——「We may also anonymize or de-identify your Personal Information (so that it can no longer be associated with you) for research or statistical purposes, as described above, in which case we may use this information indefinitely without further notice to you.」该口径不落在 API 输入输出正文上。"
anchor = "novita-privacy-deidentified-indefinite"

[[product.retention.point]]
text = "Privacy-layer fixed periods by category: account information = account lifetime plus 7 years, transaction history = 7 years, communication information = 3 years from last communication, technical information = 2 years (Privacy Policy, \"Specific Retention Periods\"). These cover personal information, not request content — do not read 2 or 7 years as the retention period of prompts and outputs."
text_zh = "隐私层的分类固定期限：账户信息=账户存续期加 7 年、交易记录 7 年、通讯信息自最后一次通讯起 3 年、技术信息 2 年（隐私政策「Specific Retention Periods」）。覆盖的是个人信息，不是请求正文——不要把 2 年或 7 年读成 prompt 与输出的保留期。"
anchor = "novita-privacy-retention-specific-periods"

[[product.retention.point]]
text = "Privacy-layer general rule: \"We retain your Personal Information for only as long as we need in order to provide our Service to you, or for other legitimate business purposes…\" The policy does not say how long it takes to determine those factors."
text_zh = "隐私层通则：「We retain your Personal Information for only as long as we need in order to provide our Service to you, or for other legitimate business purposes…」政策未写明这些因素的判定周期。"
