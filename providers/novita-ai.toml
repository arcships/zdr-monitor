[product.training]
mark = "no"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.training.point]]
text = "Novita AI's own promise, unchanged in the same clause: TOS §10.2 says \"By Default, Novita AI will not use your Content to train our own models or to improve the Services.\" Read together with the 2026-11-27 scope sentence, it covers Novita AI's own handling of Content in connection with Novita-Managed Models, not the Model Provider hop."
text_zh = "厂商自身承诺在同一节未变：TOS §10.2「By Default, Novita AI will not use your Content to train our own models or to improve the Services.」与 2026-11-27 新增的范围句合读，它只覆盖 Novita 自身对 Content 的处理、且限于 Novita-Managed Models，不覆盖 Model Provider 那一跳。"
anchor = "novita-tos-10-2-no-training"

[[product.training.point]]
text = "The carve-out, added 2026-11-27: TOS §6.4 states that Novita AI's data handling commitments under Section 10 \"apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider\", and that \"A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" Upstream training is therefore expressly permitted rather than undisclosed."
text_zh = "2026-11-27 新增的除外条款：TOS §6.4 写明 Section 10 的数据处理承诺「apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider」，且「A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」——上游训练属明文许可，不再是「未披露」。"
anchor = "novita-tos-6-4-no-extension-to-model-provider"

[[product.training.point]]
text = "Why §6.4 reaches this tier: §6.1 of the same TOS defines the Services as providing access to both \"Novita-Managed Models\" and \"Third-Party APIs\", and §6.4 routes every Input and Output sent to a Third-Party API to that Model Provider's own infrastructure and terms. The API tier therefore contains a path the contract expressly allows to train on inputs and outputs. Under the multi-hop rule (any hop that is clearly negative makes the whole chain negative), the tier mark records the weakest hop; requests served only by Novita-Managed Models still get the §10.2 no-training promise."
text_zh = "§6.4 为什么落到本档：同一份 TOS 的 §6.1 把 Services 定义为同时提供「Novita-Managed Models」与「Third-Party APIs」，§6.4 又把提交给 Third-Party API 的输入输出交给相应 Model Provider 的自有基础设施与条款。因此按量 API 档包含一条合同明文允许用输入输出训练模型的路径。按多跳口径（任一跳明确为否，则全链为否），本档 mark 记录最弱一跳；仅由 Novita-Managed Models 服务的请求仍受 §10.2 不训练承诺保护。"
anchor = "novita-tos-6-1-model-categories"

[[product.training.point]]
text = "Conflict kept visible: FAQ item 1 still says \"No. By default, we do not use any data submitted through our API — including prompts, inputs, outputs, or conversation histories — to train or improve our models. This commitment is contractually binding under our Terms of Service, and is further documented in our Privacy Policy.\" The FAQ is lower authority than the TOS, and the TOS now limits Section 10 to Novita AI's own handling and Novita-Managed Models while expressly permitting a Model Provider to train on Third-Party API inputs and outputs. Both statements are kept; the contract governs."
text_zh = "冲突并列保留：FAQ 第 1 条仍称「No. By default, we do not use any data submitted through our API — including prompts, inputs, outputs, or conversation histories — to train or improve our models. This commitment is contractually binding under our Terms of Service, and is further documented in our Privacy Policy.」FAQ 权威性低于 TOS，而 TOS 现在把 Section 10 限制在 Novita 自身处理与 Novita-Managed Models，并明文允许 Model Provider 用 Third-Party API 的输入输出训练。两条表述均保留，以合同为准。"
anchor = "novita-trustfaq-no-training-on-api-data"

[[product.training.point]]
text = "Policy layer (Privacy Policy, object = Personal Information): \"The Personal Information will not be used for model training\" sits in the same paragraph as the purpose \"To improve our Services and conduct research\", and the business-purposes list adds \"Research and Development: To conduct research and analysis to improve our Services and develop new products and features.\" Under the house rule that improving the service counts as training, both halves are kept side by side; the object is account and website personal information, not API inputs and outputs (those are governed by TOS §10.2)."
text_zh = "政策层（隐私政策，对象=Personal Information）：「The Personal Information will not be used for model training」与同段的用途「To improve our Services and conduct research」并存，Business Purposes 还列有「Research and Development: To conduct research and analysis to improve our Services and develop new products and features.」。按「改进服务算训练」的口径，两半并列保留；其对象是账户与网站类个人信息，不是 API 输入输出（后者适用 TOS §10.2）。"
anchor = "novita-privacy-no-model-training"

[product.zdr]
mark = "no"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.zdr.point]]
text = "Managed-model path, unchanged: TOS §10.2 still says Novita AI \"will not, unless otherwise required by applicable law (or as necessary to provide the Services or technical support to you): (i) log your Content for human review; or (ii) retain your Content beyond the time it takes to generate Output and deliver that Output to you.\" This is the zero-retention promise for Novita AI's own handling."
text_zh = "托管模型路径未变：TOS §10.2 仍写 Novita AI「will not, unless otherwise required by applicable law (or as necessary to provide the Services or technical support to you): (i) log your Content for human review; or (ii) retain your Content beyond the time it takes to generate Output and deliver that Output to you.」这是针对 Novita 自身处理的零保留承诺。"
anchor = "novita-tos-10-2-zero-data-retention"

[[product.zdr.point]]
text = "The new scope sentence, added 2026-11-27 at the end of §10.2: \"For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.\" The ZDR promise is now expressly bounded by model category."
text_zh = "2026-11-27 在 §10.2 末尾新增的范围句：「For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.」——ZDR 承诺现在明示以模型类别为界。"
anchor = "novita-tos-10-2-zdr-scope-managed-models"

[[product.zdr.point]]
text = "The contract carve-out and its consequence: §6.4 states that Section 10 commitments, \"including the Zero Data Retention policy set out in Section 10.2, apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider\", and that \"A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" Retention on that hop is therefore expressly possible, not merely undisclosed."
text_zh = "合同层的除外及其后果：§6.4 写明 Section 10 的承诺「including the Zero Data Retention policy set out in Section 10.2, apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider」，且「A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」——该跳的保留属明文可能，而不只是「未披露」。"
anchor = "novita-tos-6-4-no-extension-to-model-provider"

[[product.zdr.point]]
text = "The exception list and the open-ended \"as necessary to provide the Services or technical support\" clause remain undefined; they qualify the managed-model path, not the reason for this tier's mark."
text_zh = "例外清单与「as necessary to provide the Services or technical support」开口条款仍未界定；它们限定的是托管模型路径，不是本档判 no 的理由。"
anchor = "novita-tos-10-2-zero-data-retention"

[[product.zdr.point]]
text = "Contract layer keeps a second, coexisting clause (§25 USER DATA): \"We will maintain certain data that you transmit to the Site for the purpose of managing the performance of the Marketplace Offerings… Although we perform regular routine backups of data…\" Routine backups are the classic exception to zero retention; the vendor does not quantify how long backup residue is kept, and §25 neither narrows nor widens §10.2 — the two clauses stand side by side."
text_zh = "合同层另有一条并存条款（§25 USER DATA）：「We will maintain certain data that you transmit to the Site for the purpose of managing the performance of the Marketplace Offerings… Although we perform regular routine backups of data…」例行备份是零保留最经典的例外；官方未量化备份残余的期限，§25 也不缩小或扩大 §10.2 的范围——两条并列。"
anchor = "novita-tos-25-user-data-maintained"

[[product.zdr.point]]
text = "Conflict kept visible: FAQ item 3 still says \"Zero Data Retention is the default for all endpoints, including serverless API calls\", and the FAQ's no-retention sentence says it applies \"across all endpoints\". That is enterprise-FAQ language and now conflicts with the contract's model-category limit; under the authority order contract > enterprise_privacy_faq, the narrower contract text governs this row, while both statements remain on record."
text_zh = "冲突并列保留：FAQ 第 3 条仍称「Zero Data Retention is the default for all endpoints, including serverless API calls」，且 FAQ 的不保留句声称适用于「across all endpoints」。这是企业 FAQ 口径，现与合同层的模型类别限定冲突；按 contract > enterprise_privacy_faq 的权威顺序，本行以更窄的合同文本为准，但两条表述都保留在案。"
anchor = "novita-trustfaq-retention-by-category"

[[product.zdr.point]]
text = "Why the tier is marked no: §6.1 defines the Services as covering both Novita-Managed Models and Third-Party APIs, and §6.4 excludes the Model Provider hop from Novita's ZDR while expressly allowing it to log, retain, review, or use Inputs and Outputs. The chain therefore contains a hop that the contract excludes from ZDR; under the multi-hop rule (any hop that is clearly negative makes the whole chain negative), zero retention is not established for this tier, only for requests served by Novita-Managed Models."
text_zh = "判 no 的理由：§6.1 把 Services 定义为同时覆盖 Novita-Managed Models 与 Third-Party APIs，§6.4 又把 Model Provider 那一跳排除在 Novita 的 ZDR 之外，并明文允许其记录、保留、审查或使用输入输出。整条链因此包含一个被合同排除在 ZDR 之外的跳；按多跳口径（任一跳明确为否，则全链为否），本档不成立零保留，零保留只对由 Novita-Managed Models 服务的请求成立。"
anchor = "novita-tos-6-1-model-categories"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.retention.point]]
text = "Managed-model path, object = API input and output content, context = default, type = upper bound with no fixed day count: API inputs and outputs are \"Processed transiently for inference only. Not retained beyond the time required to generate and deliver Output, except where required by applicable law\" (FAQ item 3), and TOS §10.2 caps Content retention at \"the time it takes to generate Output and deliver that Output to you\". Since 2026-11-27 that clause is expressly limited to Novita AI's own handling in connection with Novita-Managed Models. The only quantified figure the FAQ gives for API-side data is technical metadata — \"Technical metadata (request timestamps, error codes, usage metrics): Retained for 6 months for the purposes of billing, debugging, and security auditing.\" — which is metadata, not request content."
text_zh = "托管模型路径：对象＝API 输入输出正文，语境＝默认，期限类型＝上限且无固定天数：API 输入输出「Processed transiently for inference only. Not retained beyond the time required to generate and deliver Output, except where required by applicable law」（FAQ 第 3 条），TOS §10.2 也把 Content 的保留限制在「the time it takes to generate Output and deliver that Output to you」。自 2026-11-27 起该条明示只覆盖 Novita 自身对 Content 的处理、且限 Novita-Managed Models。FAQ 对 API 侧数据唯一量化的数字是技术元数据——「Technical metadata (request timestamps, error codes, usage metrics): Retained for 6 months for the purposes of billing, debugging, and security auditing.」——那是元数据，不是请求正文。"
anchor = "novita-trustfaq-retention-by-category"

[[product.retention.point]]
text = "Third-party path, object = API inputs and outputs sent to a Third-Party API, context = default, type = undisclosed: §6.4 says those Inputs and Outputs are processed by the applicable Model Provider on its own infrastructure under the applicable Model Terms, that Novita's Section 10 commitments do not extend to any Model Provider, and that a Model Provider \"may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" No period is published on Novita's side. This is why the row carries basis=undisclosed rather than a fixed period: the no-retention cap now covers only part of the tier's content path."
text_zh = "第三方路径：对象＝提交给 Third-Party API 的 API 输入输出，语境＝默认，期限类型＝未披露。§6.4 写明这些 Inputs/Outputs 由相应 Model Provider 在其自有基础设施上按适用 Model Terms 处理，Novita 的 Section 10 承诺不延伸至任何 Model Provider，且 Model Provider「may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」Novita 侧未公布任何期限。故本行取 basis=undisclosed 而非固定期限：不留存的上限现在只覆盖本档内容路径的一部分。"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.retention.point]]
text = "Why this tier carries a third-party retention path: §6.1 of the same TOS defines the Services as providing access to both \"Novita-Managed Models\" and \"Third-Party APIs\"; requests sent to the latter are routed by §6.4 to the Model Provider's own terms, for which Novita publishes no retention period."
text_zh = "本档为什么存在第三方保留路径：同一份 TOS 的 §6.1 把 Services 定义为同时提供「Novita-Managed Models」与「Third-Party APIs」；提交给后者的请求按 §6.4 交给 Model Provider 自己的条款，Novita 未公布其保留期限。"
anchor = "novita-tos-6-1-model-categories"

[[product.retention.point]]
text = "The scope sentence that draws the line, added 2026-11-27 at the end of §10.2: \"For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.\""
text_zh = "划界的范围句，2026-11-27 加在 §10.2 末尾：「For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.」"
anchor = "novita-tos-10-2-zdr-scope-managed-models"

[[product.retention.point]]
text = "§25 USER DATA coexists with §10.2: \"We will maintain certain data that you transmit to the Site… Although we perform regular routine backups of data…\" Backup residue is the classic zero-retention exception and the vendor does not quantify its period; read it as a residual copy, not as long-term retention of request content."
text_zh = "§25 USER DATA 与 §10.2 并存：「We will maintain certain data that you transmit to the Site… Although we perform regular routine backups of data…」备份残余是零保留的经典例外，官方未量化其期限；按残余副本理解，不读成对请求正文的长期留存。"
anchor = "novita-tos-25-user-data-maintained"

[[product.retention.point]]
text = "A different kind of period, object = Personal Information: aggregated or de-identified information may be used indefinitely — \"We may also anonymize or de-identify your Personal Information (so that it can no longer be associated with you) for research or statistical purposes, as described above, in which case we may use this information indefinitely without further notice to you.\" It does not fall on API inputs and outputs."
text_zh = "另一类期限，对象=个人信息：去标识化/聚合信息可无限期使用——「We may also anonymize or de-identify your Personal Information (so that it can no longer be associated with you) for research or statistical purposes, as described above, in which case we may use this information indefinitely without further notice to you.」该口径不落在 API 输入输出正文上。"
anchor = "novita-privacy-deidentified-indefinite"

[[product.retention.point]]
text = "Privacy-layer fixed periods by category: account information = account lifetime plus 7 years, transaction history = 7 years, communication information = 3 years from last communication, technical information = 2 years (Privacy Policy, \"Specific Retention Periods\"). These cover personal information, not request content — do not read 2 or 7 years as the retention period of prompts and outputs."
text_zh = "隐私层的分类固定期限：账户信息=账户存续期加 7 年、交易记录 7 年、通讯信息自最后一次通讯起 3 年、技术信息 2 年（隐私政策「Specific Retention Periods」）。覆盖的是个人信息，不是请求正文——不要把 2 年或 7 年读成 prompt 与输出的保留期。"
anchor = "novita-privacy-retention-specific-periods"

[[product.retention.point]]
text = "Privacy-layer general rule: \"We retain your Personal Information for only as long as we need in order to provide our Service to you, or for other legitimate business purposes…\" The policy does not say how long it takes to determine those factors."
text_zh = "隐私层通则：「We retain your Personal Information for only as long as we need in order to provide our Service to you, or for other legitimate business purposes…」政策未写明这些因素的判定周期。"
anchor = "novita-privacy-retention-general"

[[product.retention.point]]
text = "None of the sources registered for this file mentions Prompt Cache, so no retention period for it is recorded here — that is absence of evidence on our side, not a vendor statement that cache is retained."
text_zh = "本文件登记的来源均未提到 Prompt Cache，故这里不记录其保留期——这是「我们没有证据」，不是厂商声明会留存缓存。"

