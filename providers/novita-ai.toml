text_zh = "2026-11-27 新增的 TOS §6.4 称提交给 Third-Party API 的输入输出「are processed by the applicable Model Provider on that Model Provider's own infrastructure」，但未点名国家或区域；因此也无法据此确定该路径的处理地。"
