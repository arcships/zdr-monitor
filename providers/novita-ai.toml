[[product.role.point]]
text = "See top-level role. Customer content that \"we process on behalf of customers\" is governed by the customer agreements"
text_zh = "见顶层 role。客户内容「we process on behalf of customers」由客户协议约束"
anchor = "novita-privacy-scope-customer-content"

[[product.role.point]]
text = "The enterprise tier offers a GDPR Article 28 DPA and SCC Module 2. FAQ item 12 lists \"Model provider\" as a sub-processor category that processes API inputs and outputs, without naming the entity. Since 2026-11-27 §6.4 states that for a Third-Party API the Inputs and Outputs are processed by the applicable Model Provider on its own infrastructure under the applicable Model Terms, and that Novita AI's Section 10 commitments do not extend to any Model Provider; the TOS does not state Novita's role on that hop, so kind=processor describes Novita AI's own handling of Content only and the upstream hop's role is set by the applicable Model Terms. The TOS still names no upstream entity."
text_zh = "企业档提供 GDPR Art.28 DPA 与 SCC Module 2。FAQ 第 12 条把「Model provider」列为处理 API 输入输出的子处理者类别，未给出主体名。自 2026-11-27 起 §6.4 写明走 Third-Party API 时输入输出由相应 Model Provider 在其自有基础设施上按适用 Model Terms 处理，且 Novita 的 Section 10 承诺不延伸至任何 Model Provider；TOS 未声明 Novita 在该跳的角色，故 kind=processor 只描述 Novita 自身对 Content 的处理，上游一跳的角色由适用 Model Terms 决定。TOS 仍未点名上游主体。"
anchor = "novita-tos-6-4-no-extension-to-model-provider"

[[product.role.point]]
text = "The same policy also carries a controller-side stance for the Personal Information Novita collects itself: \"We may share personal information with third parties for purposes such as analytics and advertising, which may be considered a \"sale\" under CCPA.\" Its object is account and website information, not content processed on behalf of customers, so it does not overturn the processor reading above — the two are kept side by side with their own scopes."
text_zh = "同一份政策对 Novita 自身收集的个人信息还有一条控制者侧口径：「We may share personal information with third parties for purposes such as analytics and advertising, which may be considered a \"sale\" under CCPA.」其对象是账户与网站信息，不是代表客户处理的内容，故不推翻上面的 processor 判定——两条各自带适用范围并列。"
anchor = "novita-privacy-ccpa-sale-sharing"

