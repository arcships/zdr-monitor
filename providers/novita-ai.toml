text = "See top-level retention. API input and output content is not retained beyond the time required to generate and deliver Output (exceptions: where required by applicable law, as necessary to provide the Services or technical support, and automated safety screening)"
text_zh = "见顶层 retention。API 输入输出正文不为交付之外保留（例外：法律要求/为提供服务或技术支持所必需/自动安全筛查）"

[[product.retention.point]]
text = "Technical metadata retained for 6 months (FAQ item 3)"
text_zh = "技术元数据 6 个月（FAQ 第 3 条）"

[[product.retention.point]]
text = "Batch inputs deleted after 15 days, results after 30 days"
text_zh = "Batch 输入 15 天、结果 30 天删除"

[[product.retention.point]]
text = "The Prompt Cache retention period is not disclosed."
text_zh = "Prompt Cache 缓存保留期未披露。"

[product.processing_region]
