anchor = "novita-privacy-international-transfers"

[[product.processing_region.point]]
text = "See top-level processing_region. The Privacy Policy expressly states \"We may transfer Personal Information to countries outside your country or region, including the United States.\""
text_zh = "见顶层 processing_region。PP 明示可传输至美国等境外"

[[product.processing_region.point]]
text = "FAQ item 6 says the service is \"Hosted on AWS data centers\" (no region given)"
text_zh = "FAQ 第 6 条称托管在 AWS 数据中心（未给区域）"

[[product.processing_region.point]]
text = "FAQ item 8 gives the cross-border mechanism as SCC Module 2 plus the UK IDTA. There is no data residency commitment and no region selection option."
text_zh = "FAQ 第 8 条跨境机制为 SCC Module 2 + UK IDTA。无数据驻留承诺或区域选择项。"

[product.role]
