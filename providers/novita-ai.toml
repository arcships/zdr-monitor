[[source]]
url = "https://novita.ai/legal/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "《Novita AI Privacy Policy》(Effective date 2026-05-13，Last updated 2026-05-13)。开头即声明「This Privacy Policy does not apply to content that we process on behalf of customers while providing services」——即 API 输入输出正文不适用本政策，而适用客户协议；本政策自身覆盖账户信息、交易记录、通讯信息、网站技术信息。是唯一给出分类保留期限的官方文档（账户 +7 年 / 交易 7 年 / 通讯 3 年 / 技术信息 2 年），也是唯一明示「Personal Information 不用于模型训练」的隐私层文档，并给出跨境传输（含美国）表述。"

[[source]]
url = "https://novita.ai/legal/terms-of-service"
channel = "contract"
tier = "core"
note = "《Novita AI Terms of Service》(Policy date 2024-10-12，Updated 2026-11-27)，合同层最高权威，覆盖全部 Marketplace Offerings：§1 把「AI-powered cloud services, including: AI inference APIs (text generation, image generation, speech, video, and multimodal models), storage, and related software products」定义为 Marketplace Offerings，即 Model API、GPU 实例、Agent Sandbox 共用同一份 TOS；§6（2026-11-27 由「Model Availability」整节改写为「Models and Model Terms」§6.1–§6.10）区分 Novita-Managed Models 与 Third-Party APIs，§6.4 明确 Third-Party API 的 Inputs/Outputs 由 Model Provider 在其自有基础设施上按 Model Terms 处理、Novita 的 Section 10 承诺（含 §10.2 ZDR）不延伸至任何 Model Provider，且 Model Provider 可在 Model Terms 允许范围内记录、保留、审查或使用输入输出（包括用于模型训练）；§10 仍是训练/保留/ZDR 的合同层条款（§10.2 末尾新增 ZDR 仅覆盖 Novita-Managed Models 的范围句）；§20 适用法为 Delaware。全文没有量化保留期限，也没有任何 DPA/ZDR 申请表入口。"

[[source]]
url = "https://trust.novita.ai/faq"
fetch = "browser"
channel = "enterprise_privacy_faq"
tier = "core"
note = "Novita AI Trust Center FAQ（Vanta 托管的官方信任中心，17 条问答）。本轮最重要的新来源：是唯一把保留期限量化到对象级的文档（API 输入输出「transiently, not retained beyond the time required to generate and deliver Output」；技术元数据 6 个月；账户与鉴权数据为账户存续期加法定期间），也是唯一写明「Zero Data Retention is the default for all endpoints, including serverless API calls」、唯一披露子处理者类别中「Model provider」处理 API inputs and outputs、唯一说明基础设施托管在 AWS 数据中心、并提供 DPA（GDPR Art.28）与 SCC Module 2 的文档。属企业侧 FAQ，权威性低于合同层；2026-11-27 起 TOS §10.2 把 ZDR 限定在 Novita-Managed Models，FAQ 的「all endpoints」口径与合同冲突，两条并列保留、以合同为准。"

