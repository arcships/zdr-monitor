[[product.processing_region.point]]
text = "TOS §6.4, added 2026-11-27, says Inputs and Outputs sent to a Third-Party API are processed \"by the applicable Model Provider on that Model Provider's own infrastructure\", but names no country or region; it therefore does not establish a processing location for that path either."
text_zh = "2026-11-27 新增的 TOS §6.4 称提交给 Third-Party API 的输入输出「are processed by the applicable Model Provider on that Model Provider's own infrastructure」，但未点名国家或区域；因此也无法据此确定该路径的处理地。"
anchor = "novita-tos-6-4-third-party-data-handling"

[[product.processing_region.point]]
text = "No specific region is disclosed and there is no residency option."
text_zh = "未披露具体区域，也无驻留选项。"

[product.role]
kind = "processor"
anchor = "novita-trustfaq-dpa-art28-processor"

[[product.role.point]]
text = "FAQ item 9, \"We offer a DPA for enterprise customers. Our DPA covers the required elements under GDPR Article 28, including: ... Controller's obligations and processor's obligations ...\", together with item 8's SCC Module 2 (Controller-to-Processor) — at the agreement layer the enterprise tier is expressly a processor."
text_zh = "FAQ 第 9 条「We offer a DPA for enterprise customers. Our DPA covers the required elements under GDPR Article 28, including: ... Controller's obligations and processor's obligations ...」，第 8 条 SCC Module 2 Controller-to-Processor——企业档在协议层明确为 processor。"

[[product.role.point]]
text = "Boundary (kind unchanged): §6.4 says that for a Third-Party API the Inputs and Outputs are processed by the applicable Model Provider on its own infrastructure under the applicable Model Terms, and that Novita AI's Section 10 commitments do not extend to any Model Provider. The TOS does not state Novita's role on that hop, so kind=processor describes Novita AI's own handling of Content only; the upstream hop's role is set by the applicable Model Terms."
text_zh = "边界（不改 kind）：§6.4 写明走 Third-Party API 时，输入输出由相应 Model Provider 在其自有基础设施上按适用 Model Terms 处理，且 Novita 的 Section 10 承诺不延伸至任何 Model Provider。TOS 未声明 Novita 在该跳的角色，故 kind=processor 只描述 Novita 自身对 Content 的处理；上游一跳的角色由适用 Model Terms 决定。"
anchor = "novita-tos-6-4-no-extension-to-model-provider"

