id = "enterprise"
badge = "企业版"
category = "api"
plan_level = "enterprise"

[product.training]
mark = "no"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.training.point]]
text = "The carve-out, added 2026-11-27: TOS §6.4 states that Novita AI's data handling commitments under Section 10 \"apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider\", and that \"A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" Upstream training is therefore expressly permitted rather than undisclosed."
text_zh = "2026-11-27 新增的除外条款：TOS §6.4 写明 Section 10 的数据处理承诺「apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider」，且「A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」——上游训练属明文许可，不再是「未披露」。"
anchor = "novita-tos-6-4-no-extension-to-model-provider"

[[product.training.point]]
text = "Why §6.4 reaches this tier: §6.1 of the same TOS defines the Services as providing access to both \"Novita-Managed Models\" and \"Third-Party APIs\", and §6.4 routes every Input and Output sent to a Third-Party API to that Model Provider. The enterprise custom terms and DPA are not public, so they cannot be read as excluding that path. Under the multi-hop rule (any hop that is clearly negative makes the whole chain negative), the tier mark records the weakest hop."
text_zh = "§6.4 为什么落到本档：同一份 TOS 的 §6.1 把 Services 定义为同时提供「Novita-Managed Models」与「Third-Party APIs」，§6.4 又把提交给 Third-Party API 的输入输出交给相应 Model Provider。企业自定义条款与 DPA 不公开，不能据此认定该路径被排除。按多跳口径（任一跳明确为否，则全链为否），本档 mark 记录最弱一跳。"
anchor = "novita-tos-6-1-model-categories"

[[product.training.point]]
text = "Conflict kept visible: FAQ item 1 still says the no-training commitment is \"contractually binding under our Terms of Service\", and the enterprise tier has a DPA that can reinforce it. The TOS now limits Section 10 to Novita AI's own handling and Novita-Managed Models while expressly permitting a Model Provider to train on Third-Party API inputs and outputs. The FAQ is lower authority than the TOS; both statements are kept, and the contract governs."
text_zh = "冲突并列保留：FAQ 第 1 条仍称该不训练承诺「contractually binding under our Terms of Service」，企业档另有 DPA 可加固。TOS 现在把 Section 10 限制在 Novita 自身处理与 Novita-Managed Models，并明文允许 Model Provider 用 Third-Party API 的输入输出训练。FAQ 权威性低于 TOS；两条表述均保留，以合同为准。"
anchor = "novita-trustfaq-no-training-on-api-data"

[[product.training.point]]
text = "The enterprise custom terms themselves are not public, so whether they contain exceptions or add stronger protections cannot be checked."
text_zh = "企业自定义条款本身不公开，无法核对是否含例外或更强的保护。"

[[product.training.point]]
text = "Policy layer (Privacy Policy, object = Personal Information): \"The Personal Information will not be used for model training\" sits in the same paragraph as the purpose \"To improve our Services and conduct research\", and the business-purposes list adds \"Research and Development: To conduct research and analysis to improve our Services and develop new products and features.\" Under the house rule that improving the service counts as training, both halves are kept side by side; the object is account and website personal information, not API inputs and outputs (those are governed by TOS §10.2)."
text_zh = "政策层（隐私政策，对象=Personal Information）：「The Personal Information will not be used for model training」与同段的用途「To improve our Services and conduct research」并存，Business Purposes 还列有「Research and Development: To conduct research and analysis to improve our Services and develop new products and features.」。按「改进服务算训练」的口径，两半并列保留；其对象是账户与网站类个人信息，不是 API 输入输出（后者适用 TOS §10.2）。"
anchor = "novita-privacy-no-model-training"

[product.zdr]
mark = "no"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.zdr.point]]
text = "Managed-model path: TOS §10.2 still says Novita AI \"will not, unless otherwise required by applicable law (or as necessary to provide the Services or technical support to you): (i) log your Content for human review; or (ii) retain your Content beyond the time it takes to generate Output and deliver that Output to you.\" Since 2026-11-27 the new scope sentence limits this to Novita AI's own handling in connection with Novita-Managed Models."
text_zh = "托管模型路径：TOS §10.2 仍写 Novita AI「will not, unless otherwise required by applicable law (or as necessary to provide the Services or technical support to you): (i) log your Content for human review; or (ii) retain your Content beyond the time it takes to generate Output and deliver that Output to you.」自 2026-11-27 起，新增范围句把它限制在 Novita 自身对 Content 的处理、且限 Novita-Managed Models。"
anchor = "novita-tos-10-2-zero-data-retention"

[[product.zdr.point]]
text = "The new scope sentence, added 2026-11-27 at the end of §10.2: \"For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.\" The ZDR promise is now expressly bounded by model category."
text_zh = "2026-11-27 在 §10.2 末尾新增的范围句：「For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.」——ZDR 承诺现在明示以模型类别为界。"
anchor = "novita-tos-10-2-zdr-scope-managed-models"

[[product.zdr.point]]
text = "The contract carve-out and its consequence: §6.4 states that Section 10 commitments, \"including the Zero Data Retention policy set out in Section 10.2, apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider\", and that \"A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" Retention on that hop is therefore expressly possible, not merely undisclosed."
text_zh = "合同层的除外及其后果：§6.4 写明 Section 10 的承诺「including the Zero Data Retention policy set out in Section 10.2, apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider」，且「A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」——该跳的保留属明文可能，而不只是「未披露」。"
anchor = "novita-tos-6-4-no-extension-to-model-provider"

[[product.zdr.point]]
text = "The enterprise tier additionally has a DPA/SCC and written confirmation (FAQ item 1) as contractual reinforcement, but the DPA template is not public, and nothing in the public text excludes Third-Party APIs from §6.4. Conflict kept visible: FAQ item 3 still calls zero retention the default for \"all endpoints\"; under the authority order contract > enterprise_privacy_faq, the narrower contract text governs this row."
text_zh = "企业档另有 DPA/SCC 与书面确认（FAQ 第 1 条）可作合同加固，但 DPA 模板不公开，公开文本也没有把 Third-Party APIs 排除出 §6.4。冲突并列保留：FAQ 第 3 条仍称零保留是「all endpoints」的默认；按 contract > enterprise_privacy_faq 的权威顺序，本行以更窄的合同文本为准。"
anchor = "novita-trustfaq-retention-by-category"

[[product.zdr.point]]
text = "Why the tier is marked no: §6.1 defines the Services as covering both Novita-Managed Models and Third-Party APIs, and §6.4 excludes the Model Provider hop from Novita's ZDR while expressly allowing it to log, retain, review, or use Inputs and Outputs. Under the multi-hop rule (any hop that is clearly negative makes the whole chain negative), zero retention is not established for this tier, only for requests served by Novita-Managed Models."
text_zh = "判 no 的理由：§6.1 把 Services 定义为同时覆盖 Novita-Managed Models 与 Third-Party APIs，§6.4 又把 Model Provider 那一跳排除在 Novita 的 ZDR 之外，并明文允许其记录、保留、审查或使用输入输出。按多跳口径（任一跳明确为否，则全链为否），本档不成立零保留，零保留只对由 Novita-Managed Models 服务的请求成立。"
anchor = "novita-tos-6-1-model-categories"

