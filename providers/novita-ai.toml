text_zh = "见顶层 training。合同 §10.2「By Default, Novita AI will not use your Content to train our own models or to improve the Services.」+ FAQ 第 1 条「No... to train or improve our models」。未披露任何允许训练的可选档"

[[product.training.point]]
text = "It does not cover the upstream model provider's training policy for that provider's own models."
text_zh = "未覆盖上游 model provider 对自有模型的训练政策。"

[product.zdr]
mark = "yes"
mode = "default"
