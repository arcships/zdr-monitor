[[product]]
id = "gpu-cloud"
badge = "GPU 云"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "novita-tos-10-2-no-training"

[[product.training.point]]
text = "TOS §10.2 takes Content (user inputs and outputs) as its object and makes no separate provision for files inside an instance"
text_zh = "TOS §10.2 以 Content（用户输入与输出）为对象，未对实例内文件另作规定"

[[product.training.point]]
text = "There is no evidence that the vendor uses instance data for training and no tier-specific commitment, so it is recorded as no training under the general contract clause, with medium confidence."
text_zh = "无证据显示厂商会用实例数据训练，也无档位专用承诺，按合同层通用条款记为不训练，置信度 medium。"

[product.zdr]
mark = "unknown"
searched = [
  "https://trust.novita.ai/faq",
  "https://trust.novita.ai/controls",
  "https://novita.ai/legal/terms-of-service",
  "https://novita.ai/legal/privacy-policy",
  "https://novita.ai/docs/guides/faq.md",
  "https://novita.ai/docs/guides/gpu-instance-faq.md",
  "https://trust.novita.ai/subprocessors",
]

[[product.zdr.point]]
text = "The object of the zero-retention commitment in the Trust Center FAQ and TOS §10.2 is \"API inputs and outputs\" / \"Content\", and the stated scope is API endpoints"
text_zh = "Trust Center FAQ 与 TOS §10.2 的零保留承诺对象是「API inputs and outputs / Content」，明示范围是 API endpoint"

[[product.zdr.point]]
text = "There is no zero-retention or no-persistence statement for GPU instance disks, network volumes, images or Serverless GPU endpoint content. Recorded as not_found per the rules: the vendor discloses nothing for this product line, and **this must not be read in reverse as the vendor retaining data**."
text_zh = "GPU 实例磁盘、网络卷、镜像、Serverless GPU 端点内容均无零保留或不落盘的表述。按规则记 not_found：官方未就该产品线披露，**不得反向解读为厂商会留存**。"

[product.retention]
days = 7
object = "mixed"
basis = "fixed_period"
anchor = "novita-gpufaq-instance-data-7-days"

[[product.retention.point]]
text = "The object is instance-local data: \"Data from stopped instances is retained for 7 days\", with storage fees of $0.005/GB/day during that period, after which \"data is automatically and permanently deleted with no recovery option\""
text_zh = "对象是实例本地数据：停止的实例数据保留 7 天（期间按 $0.005/GB/day 计存储费），7 天后自动永久删除、不可恢复"

[[product.retention.point]]
text = "Network volume data is independent of the instance lifecycle (it survives instance deletion); container disk data is kept only when an image is saved, and volume disk data is not kept with the image. The vendor gives no deletion period for network volumes — that is customer-managed storage."
text_zh = "网络卷数据独立于实例生命周期（实例删除后仍在），容器盘数据仅在保存镜像时保留、卷盘不随镜像保留。厂商未对网络卷给出删除期限——那是客户自管存储。"

[product.processing_region]
basis = "undisclosed"
anchor = "novita-trustfaq-infra-aws"

[[product.processing_region.point]]
text = "Only broad wording such as \"Hosted on AWS data centers\" (and in the source it sits inside a security Q&A); no region selection and no residency commitment; low confidence."
text_zh = "只有「Hosted on AWS data centers」这类笼统表述（且原文置于安全问答中），无区域选择、无驻留承诺；低置信度。"

[product.role]
kind = "processor"
anchor = "novita-privacy-scope-customer-content"

[[product.role.point]]
text = "There is no role clause specific to this product line"
text_zh = "无该产品线的专用角色条款"

[[product.role.point]]
text = "The Privacy Policy's \"process on behalf of customers\" positioning and the TOS's service-provider positioning can be applied by analogy, but the documentation does not name GPU Cloud; low confidence."
text_zh = "PP 的「代表客户处理」定位与 TOS 的服务提供者定位可类推，但文档未点名 GPU 云，低置信度。"

