text_zh = "见顶层 zdr。TOS §10.2 定义 + FAQ 第 3 条「Zero Data Retention is the default for all endpoints, including serverless API calls.」，无需申请"

[[product.zdr.point]]
text = "The exceptions and the open-ended \"as necessary to provide the Services or technical support\" clause are left undefined."
text_zh = "例外与「as necessary to provide the Services or technical support」开口条款未界定。"

[product.retention]
days = 180
object = "mixed"
basis = "fixed_period"
