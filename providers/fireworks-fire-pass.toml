name = "Fireworks Fire Pass"
name_en = "Fireworks Fire Pass"
company = "fireworks-ai"
company_name = "Fireworks AI"
line = "fire-pass"
site = "global"
entity = "Fireworks.ai, Inc."
doc = "https://docs.fireworks.ai/accounts/data-residency"
plan_levels = ["individual"]

[[source]]
url = "https://docs.fireworks.ai/accounts/data-residency"
channel = "developer_data"
tier = "core"
note = "《Data residency》企业功能页：默认 None（不限制区域），可把账号锁定到 US 单一区域；列出 residency 开启后被拒的功能（训练、FireRouter、BYOC）。既是处理地维度的主要来源，也是 FireRouter/BYOC 多跳与自管档的官方披露点。"

[[source]]
url = "https://docs.fireworks.ai/guides/security_compliance/data_handling"
channel = "developer_data"
tier = "core"
note = "文档站 Security & Compliance 下的《Zero Data Retention》页（页面标题即 Zero Data Retention），覆盖推理档的默认保留策略与 Response API 例外。旧记录唯一一条候选，本轮四步验证通过（HTTP 200 / 12820B / 有主体×动作条款 / 可定位原句）。"

[[source]]
url = "https://fireworks.ai/dpa"
channel = "contract"
tier = "core"
note = "《Data Processing Addendum (v3.2)》，jina 抓回的是 22 页 PDF/DOCX 渲染（页面 URL 为 fireworks.ai/dpa，由 ToS §2.4 并入）。这是 role / retention / training / processing_region 的合同层权威：§3 角色、§4.3(f) 禁止训练、§4.5 请求生命周期保留、§11 终止后删除、Schedule 2「limited data retention」、Schedule 4 授权子处理者及其处理地。适用对象是「business customer」签署的 Agreement（含自服务条款）。"

[[source]]
url = "https://fireworks.ai/terms-of-service"
channel = "contract"
tier = "core"
note = "Fireworks.ai, Inc. 的通用服务条款（正文含 §3 Content、§3.6 Zero Data Retention、§10.1 Privacy）。覆盖平台全部付费/免费服务档：serverless 推理、专用部署、训练与微调、Response API、agent 功能。§3.1 定义 Input/Output/Content，§2.4 把 www.fireworks.ai/dpa 并入本条款，§3.6 是 zdr / training / retention 三个维度的合同层最高权威，§10.1 是处理地维度的合同层依据。本文件未出现 controller/processor 字样，角色维度以 DPA 为准。"

[[product]]
id = "subscription"
badge = "Fire Pass 订阅"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "yes"
mode = "default"
anchor = "fireworks-tos-3-6-no-training"

[[product.training.point]]
text_zh = "无独立条款，沿用 ToS §3.6 的无条件「不训练自有模型」承诺。置信度 medium：Fire Pass 页面自称「an experimental product. Features, availability, and pricing are subject to change.」，且明确只对 open weight models 生效，而文档层的不记录承诺本来就限定在 open models 上，两者恰好重合。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "fireworks-tos-3-6-zdr-policy"

[[product.zdr.point]]
text_zh = "主证据改用 contract 层的 ToS §3.6（本文件最高权威）：「We have adopted a “Zero Data Retention” policy」——不记录 Content 供人工审阅、不留存超过生成并交付 Output 所需时间，且不附加 open models 限定。因此本档不必再依赖「Fire Pass 只跑 open weight 模型」这一步推断。"
anchor = "fireworks-tos-3-6-zdr-policy"

[[product.zdr.point]]
text_zh = "同一段的适用范围限定：ZDR 只覆盖 inference，明文不适用于按设计需要保留或进一步处理数据的功能，点名 Response API 与 training / fine-tuning / agent 功能。本档是个人 agentic coding 订阅，是否落在 §3.6 所称 agent features 内、以及本档实际可用的模型范围，本文件四个快照里都没有出处（Fire Pass 产品页未登记为来源、也没有快照），在人工确认前不要读成无条件零保留。"
anchor = "fireworks-tos-3-6-inference-scope"

[[product.zdr.point]]
text_zh = "文档层（developer_data）同口径但把范围写死为「for any open models, without explicit user opt-in」；权威性低于 contract 层，作为细节保留。原先用来做档位适配的 Fire Pass 产品页说法（「only works for open weight models」）没有来源登记也没有快照，本轮不作为证据。"
anchor = "fireworks-datahandling-open-models-scope"

[product.retention]
object = "mixed"
basis = "none"
anchor = "fireworks-tos-3-6-zdr-policy"

[[product.retention.point]]
text_zh = "主证据用 contract 层 ToS §3.6 的 ZDR 政策：不记录 Content 供人工审阅，也不把 Content 留存到生成并交付 Output 所需时间之外。期限类型是上限式定性（「不超过必要时间」），没有天数；对象与语境分列于下。"
anchor = "fireworks-tos-3-6-zdr-policy"

[[product.retention.point]]
text_zh = "文档层细节补充（developer_data）：「Fireworks has Zero Data Retention by default.」同页写明 prompt/generation 数据只在请求期间存在于易失内存、不写入任何持久存储。"
anchor = "fireworks-datahandling-zdr-default"

[[product.retention.point]]
text_zh = "对象=输入输出正文（默认推理路径）：prompt and generation data exist only in volatile memory for the duration of the request。语境=例外：prompt caching 生效时，部分 prompt 数据与关联 KV 缓存可在内存中驻留数分钟，期间仍不落盘。"
anchor = "fireworks-datahandling-volatile-memory"

[[product.retention.point]]
text_zh = "对象=对话数据（语境=启用 Response API 后）：store=True（默认）时完整对话数据落盘，30 天后自动删除；可用 store=False 关闭，或按 response_id 立即删除。"
anchor = "fireworks-datahandling-response-api-30-days"

[[product.retention.point]]
text_zh = "对象=元数据日志（语境=默认）：Fireworks 记录投递服务所需的元数据（如请求 token 数），官方未给期限。"
anchor = "fireworks-datahandling-metadata-logs"

[[product.retention.point]]
text_zh = "对象=输入输出正文（语境=显式 opt-in 后）：用户显式 opt-in 时，某些高级功能（如 FireOptimizer）会记录 prompt 与 generation 数据；本档是否提供这类功能，文档未明示。"
anchor = "fireworks-datahandling-optin-logging"

[[product.retention.point]]
text_zh = "条件性（contract 层，DPA §4.5）：「不超请求生命周期」不是无条件承诺——它以 Customer 按 Company 当期 ZDR 配置与使用文档使用服务为前提，配置与当期文档保持一致由 Customer 负责；且 DPA 的适用对象是 business customer，本档个人订阅是否适用待确认。"
anchor = "fireworks-dpa-4-5-request-lifecycle"

[[product.retention.point]]
text_zh = "DPA §4.5 同段另列两类例外：未配置 store=false 的 Response API、prompt caching——启用这些功能时输入输出数据可按功能所需时长保留。"
anchor = "fireworks-dpa-4-5-feature-exceptions"

[[product.retention.point]]
text_zh = "适用范围限定（contract 层）：ToS §3.6 的 ZDR 只覆盖 inference，明文排除 Response API 与 training / fine-tuning / agent 功能；本档是个人 agentic coding 订阅，是否落在 agent features 这一排除项内尚无快照可证，须在使用前确认。"
anchor = "fireworks-tos-3-6-inference-scope"

[product.processing_region]
codes = ["global"]
anchor = "fireworks-dataresidency-none-default"
searched = ["https://docs.fireworks.ai/accounts/data-residency", "https://fireworks.ai/terms-of-service"]

[[product.processing_region.point]]
text_zh = "无独立条款，沿用账号级设置：residency 默认 None（不限制区域，serverless 可跨区域），可把账号锁到 US 单一区域；且 residency 是账号级（Residency applies account-wide）。"
anchor = "fireworks-dataresidency-none-default"

[[product.processing_region.point]]
text_zh = "该页整页是 Enterprise 功能页：「**Enterprise feature.** Data residency is available on Enterprise accounts.」本档 plan_level=individual，个人订阅能否拿到这个账号级开关，文档未明示——codes=[\"global\"] 只说明默认不限定区域，不等于本档可以自选区域。"
anchor = "fireworks-dataresidency-enterprise-only"

[[product.processing_region.point]]
text_zh = "contract 层补充，对象限于个人信息：ToS §10.1「your personal information may be transferred to, and/or processed in, the United States」。它说的是个人信息可能被传输到/在美处理，不等于请求内容的处理地，也不构成区域选择承诺，与 residency 页「默认 None（多区域）」并列保留、互不否定。"
anchor = "fireworks-tos-10-1-us-processing"

[product.role]
kind = "processor"
anchor = "fireworks-dpa-3-a-processor"

[[product.role.point]]
text_zh = "口径一：DPA §3(a) 写 Company acts as a processor or service provider in the performance of its obligations under the Agreement and this DPA。"
anchor = "fireworks-dpa-3-a-processor"

[[product.role.point]]
text_zh = "适用范围存疑：同一份 DPA 开篇把自己限定在 Company 与 business customer 之间的 Agreement 内，而本档是个人订阅（面向消费者式使用）；个人用户是否构成 DPA 意义上的 Customer，四个快照里都没有依据，需人工澄清。"
anchor = "fireworks-dpa-scope-business-customer"

[[product.role.point]]
text_zh = "支持按 processor 记的依据：ToS §2.4 把 www.fireworks.ai/dpa 并入适用于全体用户的 Terms，个人订阅同样受这份 DPA 约束。"
anchor = "fireworks-tos-2-4-dpa-incorporated"

