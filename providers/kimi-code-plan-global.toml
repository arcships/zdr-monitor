[[product]]
id = "api"
badge = "国际站 API"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "optos-default-train"

[[product.training.point]]
anchor = "optos-default-train"
text = "Contract side: ToS §4 lets Moonshot AI use Customer Content to provide, maintain, develop, support, and improve the Services; customers who need restrictions on the use of Customer Content for training or improving Moonshot AI models must contact Moonshot AI to discuss enterprise arrangements or a separate written agreement, and unless otherwise expressly agreed in writing Customer Content may be used for the foregoing purposes — i.e. training/improvement is permitted by default."
text_zh = "合同侧:ToS §4 允许厂商用 Customer Content 提供、维护、开发、支持与改进服务;需限制「用 Customer Content 训练或改进 Moonshot AI 模型」的客户须另洽企业安排或书面协议,且除非另有书面约定,Customer Content 可用于前述用途——即默认可用于训练/改进。"

[[product.training.point]]
anchor = "help-api-no-train"
text = "Contradiction side, kept side by side (no picking a side): the same vendor's help-center FAQ in the same kimi-api category denies it without any tier qualifier — user data submitted through the API, including input content and model output, is not used to train or improve Kimi's models and is not persistently stored for training purposes. A help-center FAQ is lower authority than the contract and does not override §4; the divergence stays visible pending written clarification from the vendor."
text_zh = "冲突侧,并列保留(不选边):同一厂商帮助中心 kimi-api 分类的 FAQ 无档位限定地否认——通过 API 提交的用户数据(含输入内容与模型输出)不用于训练或改进 Kimi 的模型,也不为训练目的持久存储。帮助中心 FAQ 权威性低于合同,不覆盖 §4;分歧在页面上并列可见,待厂商书面澄清。"

[product.zdr]
mark = "yes"
mode = "by_agreement"
anchor = "zdr-enterprise-scope"

[[product.zdr.point]]
anchor = "zdr-content-deleted"
text = "Object and context: ZDR covers request content (prompts and model responses) only. When ZDR is enabled, request content is processed only while the response is being generated and is deleted as soon as the response is returned; the only stated exception is where retention is required by applicable laws and regulations."
text_zh = "对象与语境:ZDR 只覆盖请求内容(提示与模型响应)。开通后请求内容仅在生成响应期间被处理、响应返回即删除;唯一明示例外是适用法律法规要求保留。"

[[product.zdr.point]]
anchor = "zdr-safety-review-applies"
text = "ZDR is not \"nobody touches the content\": it changes only how content is retained, not the platform's usage policies; automated safeguards, including content safety reviews, continue to apply to all traffic, and abusive behavior may lead to action under the usage policies, including terminating ZDR service."
text_zh = "ZDR ≠「无人接触内容」:它只改变内容的保留方式、不改变平台的使用政策;内容安全审核等自动保障对全部流量照常生效,发现滥用行为可依使用政策处理,包括终止 ZDR 服务。"

[[product.zdr.point]]
anchor = "zdr-upload-exclusion"
text = "Scope exclusion (1 of 3): ZDR cannot be guaranteed for images or videos submitted through direct file uploads."
text_zh = "范围除外(三类之一):通过文件直传提交的图片或视频不能保证 ZDR。"

[[product.zdr.point]]
anchor = "zdr-operational-out-of-scope"
text = "Scope exclusion (2 of 3): operational data, such as security logs and billing records, is outside the scope of zero data retention."
text_zh = "范围除外(三类之二):安全日志与计费记录等运营数据不在零数据保留范围内。"

[[product.zdr.point]]
anchor = "zdr-thirdparty-exclusion"
text = "Scope exclusion (3 of 3): third-party models, connectors, and plugins are not covered by this policy."
text_zh = "范围除外(三类之三):第三方模型、连接器与插件不在本政策覆盖范围内。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "oppriv-retention-necessary"

[[product.retention.point]]
anchor = "oppriv-retention-account-active"
text = "Object = input plus account and payment information; context = default, for as long as the account is active (violation-related information is retained until the violation is resolved); period type = no quantified number of days."
text_zh = "对象=输入,以及账户与支付信息;语境=默认、账号存续期间(违规相关信息保留至违规解决);期限类型=无量化天数。"

[[product.retention.point]]
anchor = "optos-delete-after-termination"
text = "The Open Platform's only deletion commitment: after your service is terminated, we will delete your content and data in accordance with the requirements of applicable laws and regulations. Object = content and data; context = after service termination; period type = tied to applicable law, no quantified number of days."
text_zh = "开放平台唯一的删除承诺:服务终止后,厂商按适用法律法规的要求删除你的内容与数据。对象=内容与数据;语境=服务终止后;期限类型=依适用法律,无量化天数。"

