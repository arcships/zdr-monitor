id = "coding-plan-personal"
badge = "国际站会员订阅"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
anchor = "tos-training-license"
mode = "opt_out"

[[product.training.point]]
anchor = "tos-training-optout"
text = "The opt-out channel is email: you can opt out of allowing your Content to be used to train the Services by contacting us at the membership address shown on the page (the fetched snapshot renders the address obfuscated as \"[email protected]\", whose mailto link points to membership@moonshot.ai)."
text_zh = "退出渠道是邮件:ToS v2 §3「You can opt out of allowing your Content to be used to train the Services by contacting us at」页面所示会员邮箱(抓回的快照把该地址混淆成「[email protected]」,其 mailto 链接指向 membership@moonshot.ai)。"

[[product.training.point]]
anchor = "tos-optout-prospective"
text = "Opt-out applies prospectively only and does not require us to delete or remove Content already used in prior training cycles — opting out does not remove historical data already used for training."
text_zh = "退出仅向将来生效,厂商不承担删除或移除已用于先前训练周期内容的义务——退出不能追溯清除已用于训练的历史数据。"

