[[product.zdr.point]]
text = "This tier (the Kimi Code membership subscription) contains no zero-data-retention statement anywhere: neither ToS v2 nor Privacy Policy v2, the texts that govern this tier, uses the words ZDR or zero data retention"
text_zh = "本档(Kimi Code 会员订阅)全文无任何零数据保留表述:适用本档的 ToS v2 与隐私政策 v2 通篇无 ZDR/zero data retention 字样"

[[product.zdr.point]]
text = "The only ZDR item is platform.kimi.ai/docs/guide/zero-data-retention, which says on that same page that it is \"available to enterprise customers on the Kimi Open Platform\", while the comparison page product-plans states that the Open Platform \"is different from products such as Kimi Membership and Kimi Code\" and that \"the Kimi Code API is independent from the API service on this platform\", so it is not a commitment covering this tier. No evidence obtained is not the same as no vendor commitment: this tier may simply have an undisclosed ZDR channel (enterprise sales may have separate arrangements), and confirming with sales may still be required."
text_zh = "唯一 ZDR 项目是 platform.kimi.ai/docs/guide/zero-data-retention,同页自述「available to enterprise customers on the Kimi Open Platform」,而对照页 product-plans 明示开放平台与 Kimi Membership / Kimi Code 是不同产品线、Kimi Code API 独立于该平台 API,故不构成本档承诺。拿不到证据 ≠ 厂商无承诺:本档可能只是未披露 ZDR 通道(企业销售渠道可能另有安排),不排除需联系销售确认。"

