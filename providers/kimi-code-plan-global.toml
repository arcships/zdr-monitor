[[product.zdr.point]]
text = "This tier (the Kimi Code membership subscription) contains no zero-data-retention statement anywhere: neither ToS v2 nor Privacy Policy v2, the texts that govern this tier, uses the words ZDR or zero data retention. What the governing texts do have is purpose-limited retention only — Privacy Policy v2 §7: \"We retain your personal information only for as long as necessary to fulfill the purposes outlined in this Privacy Policy, including to:\" — with no zero-retention option offered."
text_zh = "本档(Kimi Code 会员订阅)全文无任何零数据保留表述:适用本档的 ToS v2 与隐私政策 v2 通篇无 ZDR/zero data retention 字样。本档文本只有目的限定式保留——隐私政策 v2 §7「We retain your personal information only for as long as necessary to fulfill the purposes outlined in this Privacy Policy, including to:」——未提供任何零保留选项。"

[[product.zdr.point]]
anchor = "pp-different-line"
text = "The only ZDR item is platform.kimi.ai/docs/guide/zero-data-retention, which says on that same page that it is \"available to enterprise customers on the Kimi Open Platform\", while the comparison page product-plans states that the Open Platform \"is different from products such as Kimi Membership and Kimi Code\", so it is not a commitment covering this tier. No evidence obtained is not the same as no vendor commitment: this tier may simply have an undisclosed ZDR channel (enterprise sales may have separate arrangements), and confirming with sales may still be required."
text_zh = "唯一 ZDR 项目是 platform.kimi.ai/docs/guide/zero-data-retention,同页自述「available to enterprise customers on the Kimi Open Platform」,而对照页 product-plans 明示开放平台与 Kimi Membership / Kimi Code 是不同产品线,故不构成本档承诺。拿不到证据 ≠ 厂商无承诺:本档可能只是未披露 ZDR 通道(企业销售渠道可能另有安排),不排除需联系销售确认。"

[[product.zdr.point]]
anchor = "pp-kimi-code-independent"
text = "The same comparison page adds that \"the Kimi Code API is independent from the API service on this platform\", which keeps the Open Platform's ZDR channel and this tier's channel separate."
text_zh = "同一对照页另写明「the Kimi Code API is independent from the API service on this platform」,开放平台的 ZDR 通道与本档通道相互独立。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "privacy-retention-purpose"

[[product.retention.point]]
text = "Object = personal information, which per §1 includes User Content (prompts, audio, images, files); context = default; period type = not quantified, no upper bound in days. Privacy Policy v2 §7 gives purposes, not periods, and adds that retention periods may vary depending on the nature of the information, its sensitivity, and applicable legal or contractual requirements."
text_zh = "对象=个人信息(§1 定义含 User Content:prompts/audio/images/files);语境=默认;期限类型=未量化、无天数上限。隐私政策 v2 §7 只给目的不给期限,并说明期限视信息性质、敏感度与法律或合同要求而定。"

[[product.retention.point]]
anchor = "privacy-voiceprint-3years"
text = "The only fixed period in Privacy Policy v2 §7 is voiceprint data (destroyed when the initial purpose is satisfied or within 3 years of your last interaction, whichever comes first) — a different object from prompt/output content, and must not be read as a period for input/output."
text_zh = "隐私政策 v2 §7 中唯一有固定期限的是语音声纹(初始目的达成或最后一次交互后 3 年内,以先到者为准销毁)——对象与输入输出正文不同,不能读成输入输出的保留期限。"

[[product.retention.point]]
anchor = "privacy-retention-deletion"
text = "On account deletion, Privacy Policy v2 §7 promises to delete or anonymize your personal information unless retention is required to comply with legal obligations or to resolve disputes."
text_zh = "注销场景:隐私政策 v2 §7 承诺删除或匿名化个人信息,法律义务或解决争议所需者除外。"

[[product.retention.point]]
anchor = "tos-retention-legal"
text = "Contract layer (ToS v2 §11, the only retention statement there): following termination of your account you may lose access to your Content and other information associated with your account, and we may retain information as required or permitted by applicable law. Context = after account termination; period type = as required or permitted by law, no quantified number of days. Account termination therefore does not mean immediate deletion of everything."
text_zh = "合同层(ToS v2 §11,该层唯一的留存表述):账户终止后你可能失去对 Content 及相关信息的访问,厂商「may retain information as required or permitted by applicable law」。语境=账户终止后;期限类型=法律要求或许可范围内,无量化天数。注销不等于立即全删。"

[[product.retention.point]]
anchor = "chat-logs-retained"
text = "Statutory floor for a different object: as required by the Cybersecurity Law and other applicable laws and regulations, the platform must retain certain network logs (such as operation timestamps and account identifiers) for a specified period, used solely for security compliance and regulatory audits — no number of days given, and the object is network/access logs, not prompt or output content, so it cannot be read as a retention period for input/output. Note on source applicability: this help-center page sits on the global site (kimi.ai) yet cites Chinese statutes (Cybersecurity Law and others), so its applicability to this tier is not clear."
text_zh = "另一对象的法定义务下限:按《网络安全法》等适用法律法规,平台须将某些网络日志(如操作时间戳、账号标识)保留「for a specified period」,仅用于安全合规与监管审计——未给天数,且对象是网络/访问日志而非输入输出正文,不能反推输入输出的保留期限。来源适用性提示:该帮助页挂在国际站 kimi.ai 域名下,却以《网络安全法》等中国法规为据,对本档的适用性待澄清。"

[[product.retention.point]]
anchor = "accdel-statutory-minimum"
text = "The account-deletion help page repeats the same statutory floor: certain information must be retained for the minimum statutory period, and is used solely for statutory purposes such as law-enforcement verification."
text_zh = "注销帮助页重申同一法定下限:某些信息须保留至法定最短期限,仅用于执法核查等法定用途。"

[[product.retention.point]]
anchor = "accdel-minimum-extent"
text = "After manually deleted conversations, the same page says the system retains data only to the minimum extent required by applicable laws for storage and security purposes, with no viewing or recovery access."
text_zh = "手动删除会话后,同一页面称系统仅在适用法律为存储与安全目的所要求的最小范围内保留数据,且不提供查看或恢复访问。"

