note = "kimi.ai 国际站《Privacy Policy》v2(Last Updated: August 13, 2026;主体 NOVASCENT PRIVATE LIMITED)。覆盖本档:§1 收集范围(User Content 含 prompts/audio/images/files)、§2 使用目的(含训练与改进 AI 模型)、§7 Retention、§4 Retention of Transaction Information、§11 Language Versions(英文版为准)。首段另写「The relevant provisions of this Policy shall also apply to the Kimi Open Platform products, unless the Privacy Policy of such products provides otherwise」——开放平台另有自己的隐私政策,故档位隔离仍成立。"

