[[source]]
url = "https://platform.kimi.ai/docs/guide/zero-data-retention"
channel = "developer_data"
tier = "core"
note = "Kimi 开放平台(platform.kimi.ai,按量 API / 企业客户)文档《What is Zero Data Retention (ZDR)?》全文。ZDR 面向开放平台企业客户按申请开通;开通后请求内容仅在生成响应期间存在、返回即删(法律要求除外);范围不含图片/视频直传、安全日志与计费记录等运营数据、第三方模型与插件;内容安全审核对全部流量照常生效。本档(Kimi Code 订阅)不适用,收录作档位对照,authoritative_for 为空。"

[[source]]
url = "https://www.kimi.ai/help/kimi-api/api-data-security"
fetch = "browser"
channel = "developer_data"
tier = "contradiction"
note = "与 https://platform.kimi.ai/docs/agreement/modeluse(core,本文件 api 档 training 的权威来源)就同一档位(国际开放平台 API)的 training 表述相反。本页:「No. User data submitted through the API (including input content and model output) is not used to train or improve Kimi's models. Your data is used solely to fulfill the current API request and is not persistently stored for training purposes.」,另有表格行「Not Used for Training / API data is not used for model training」;合同 §4:「Customer who requires restrictions on the use of Customer Content for training or improving Moonshot AI models may contact Moonshot AI to discuss available enterprise arrangements or separate written agreements. Unless otherwise expressly agreed in writing, Customer Content may be used for the foregoing purposes.」——把 training or improving Moonshot AI models 明列为可能用途、限制须另洽企业安排,即默认不设限。适用范围:本页在 www.kimi.ai 帮助中心 kimi-api 分类(同分类 api-overview 给出 Platform URL = platform.kimi.ai,文件删除示例为 api.moonshot.ai/v1/files),与合同同指国际开放平台 API;档位、站点、时效三种化解的排除依据逐条写在 providers/moonshotai.toml 同一 URL 来源的 note 里。要点:合同 §4 首句把 Content 定义为 input(提交的 prompts/texts/audios 等)+ output(模型响应),逐字涵盖本页说的 input content and model output,故「ToS 的 Content 不含 API 请求数据」不成立;本页无生效日期,以「无版本取代证据」排除「旧版页」解释(现行 ZDR 页仍保留同一不训练口径,但该页限企业客户子档)。本页是帮助中心 FAQ,权威性低于合同,不覆盖 §4 的结论,仅按 docs/judgment.md「不选边、并列保留」并列记录;分歧待厂商书面澄清。"

[[source]]
url = "https://www.kimi.ai/help/others/account-deletion"
channel = "consumer_privacy"
tier = "core"
note = "kimi.ai 帮助中心《Account deletion & data removal》(消费端 FAQ,与 Kimi 会员同账号体系)。给 retention 的消费端口径:注销后对话历史/上传文件/Memory Space 进入删除流程;「法定最短期限」保留某些信息(下限,非上限)。注意该页把依据写成《网络安全法》《个人信息保护法》,是带中国法规色彩的表述(见 notes)。"

[[source]]
