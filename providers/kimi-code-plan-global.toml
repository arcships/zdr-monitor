[[product.processing_region.point]]
text = "This tier discloses no specific processing location or data residency. Only two relevant sentences appear in the texts that govern it: (1) the closing paragraph of Privacy Policy v2 §7, \"Your information may be transferred to and stored on servers located outside of your country of residence\" — which states only that cross-border transfer and storage may happen, with no location given"
text_zh = "本档没有任何具体处理地/数据驻留披露。适用本档文本里唯一相关的两句:(1) 隐私政策 v2 §7 末段「Your information may be transferred to and stored on servers located outside of your country of residence」——只说明可能跨境转移与存储,未给地点"

[[product.processing_region.point]]
text = "(2) ToS v2 §12 provides for Singapore governing law, SIAC arbitration and Singapore as the seat of arbitration — that is governing law and dispute-resolution venue, not the data processing location, and cannot stand as a processing-region conclusion. The Data locations page on the Kimi Code docs site only covers CLI local data held on the user's machine under ~/.kimi-code/, which is likewise not a server-side processing location. The Open Platform privacy policy does say \"servers located in Singapore\", but that is a disclosure for the platform.kimi.ai line (MOONSHOT AI PTE. LTD.) and must not be applied to this tier (the NOVASCENT PRIVATE LIMITED subscription line)."
text_zh = "(2) ToS v2 §12 约定新加坡法管辖、SIAC 仲裁、仲裁地新加坡——这是法律管辖与争议解决地,不等于数据处理地,不能当处理地结论。Kimi Code 文档站的 Data locations 页只讲 CLI 本地数据在用户机器 ~/.kimi-code/,也不是服务端处理地。开放平台隐私政策明写「servers located in Singapore」,但那是 platform.kimi.ai 线的披露(MOONSHOT AI PTE. LTD.),不得套用到本档(NOVASCENT PRIVATE LIMITED 订阅线)。"

