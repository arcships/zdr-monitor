[[source]]
url = "https://platform.kimi.ai/docs/agreement/userprivacy"
channel = "developer_data"
tier = "core"
note = "Kimi 开放平台《Privacy Policy》(platform.kimi.ai 文档站,Last Update: April 30, 2025)。主体 MOONSHOT AI PTE. LTD.(新加坡),服务器位于新加坡,账号/输入/支付信息在账号存续期间保留,违规信息保留至违规解决。这是与本档 NOVASCENT 不同的另一个新加坡主体、另一条产品线,故 authoritative_for 为空,仅用于证明「开放平台的 Singapore 处理地披露不能套到本档」。"

[[source]]
url = "https://platform.kimi.ai/docs/guide/product-plans"
channel = "developer_data"
tier = "core"
note = "开放平台文档《Compare with Other Kimi Products》(非政策正文,档位对照页):开放平台按量计费、无订阅方案,「It is different from products such as Kimi Membership and Kimi Code」;并明示 Kimi Membership 含 Kimi Code 权益、Kimi Code API 与本平台 API 相互独立。是判「开放平台 ZDR/不训练声明不覆盖本档」的关键证据。"

[[source]]
url = "https://platform.kimi.ai/docs/guide/zero-data-retention"
channel = "developer_data"
tier = "core"
note = "Kimi 开放平台(platform.kimi.ai,按量 API / 企业客户)文档《What is Zero Data Retention (ZDR)?》全文。ZDR 面向开放平台企业客户按申请开通;开通后请求内容仅在生成响应期间存在、返回即删(法律要求除外);范围不含图片/视频直传、安全日志与计费记录等运营数据、第三方模型与插件;内容安全审核对全部流量照常生效。本档(Kimi Code 订阅)不适用,收录作档位对照,authoritative_for 为空。"

[[source]]
url = "https://www.kimi.ai/help/others/account-deletion"
channel = "consumer_privacy"
tier = "core"
note = "kimi.ai 帮助中心《Account deletion & data removal》(消费端 FAQ,与 Kimi 会员同账号体系)。给 retention 的消费端口径:注销后对话历史/上传文件/Memory Space 进入删除流程;「法定最短期限」保留某些信息(下限,非上限)。注意该页把依据写成《网络安全法》《个人信息保护法》,是带中国法规色彩的表述(见 notes)。"

[[source]]
url = "https://www.kimi.ai/help/others/chat-issues"
channel = "consumer_privacy"
tier = "core"
note = "kimi.ai 帮助中心《Chat issues》(消费端 FAQ)。两条可用证据:(1) 删除单条会话后数据按《Kimi Privacy Policy》第 5 节处理——页面内链接直指 kimi.ai/user/agreement/userPrivacy?version=v2,佐证消费端与本档 v2 协议同线;(2) 网络日志(操作时间戳、账号标识)按《网络安全法》等「for a specified period」保留,未给天数,属法定义务下限。"

[[source]]
url = "https://www.kimi.ai/user/agreement/modelUse?version=v2"
channel = "contract"
tier = "core"
note = "kimi.ai 国际站《Terms of Service》v2(Effective Date: August 13, 2026;签约主体 NOVASCENT PRIVATE LIMITED,新加坡)。覆盖本 provider 的订阅档(Kimi Membership 含 Kimi Code 权益):§3 Content(内容许可 + 训练 opt-out)、§4 Subscriptions(订阅条款)、§11 Termination(留存泛述)、§12 新加坡法管辖与 SIAC 仲裁。本轮经 r.jina.ai 重抓(34,279B),并与直连 HTML→文本版(33,647B)逐条对照,条款文字一致。"

