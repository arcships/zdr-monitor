  "https://www.sensecore.cn/help/docs/model-as-a-service/nova/end/offline",
]

[[product.zdr.point]]
text = "No ZDR commitment, switch or application method, and no public DPA"
text_zh = "无 ZDR 承诺/开关/申请方式，无公开 DPA"

[[product.zdr.point]]
text = "The on-device offline SDK is a deployment shape, not a zero-retention commitment."
text_zh = "端侧离线 SDK 是部署形态而非零保留承诺。"

[product.retention]
object = "mixed"
basis = "until_termination"
anchor = "sensecore-tos-5-1-buffer-period-then-delete-all-user-data"

[[product.retention.point]]
text = "Object: user data. After service expiry, early termination (including termination by agreement) or non-payment, SenseTime keeps storing your user data only during a buffer period; when the buffer period ends it deletes all user data, including all cached or backup copies. The length of the buffer period is the one stated in the service-specific terms, product documentation or service description for the service you purchased — no number of days is published."
text_zh = "对象：用户数据。服务期届满、提前终止（含双方协商一致）或欠费后，仅在缓冲期内继续存储用户数据；缓冲期届满即删除全部用户数据，包括所有缓存或备份副本。缓冲期时长以所订购服务适用的专有条款、产品文档、服务说明所载明的时限为准，目前未公开天数。"
anchor = "sensecore-tos-5-1-buffer-period-then-delete-all-user-data"

[[product.retention.point]]
text = "Object: personal information. Stored only for the minimum period required by laws and regulations — a different period type from the until-termination basis recorded on this row, so the minimum period must not be read as until termination."
text_zh = "对象：个人信息。仅在法律法规要求的最低时限内存储——与结论行记的「留至服务终止」不是同一种期限类型，不能把最低时限读成留至服务终止。"
anchor = "sensecore-pps-5-retention-minimum-legal-period"

[[product.retention.point]]
text = "Object: account data. After account cancellation SenseTime may no longer collect, store or use your personal information and data, except where laws and regulations require otherwise (invoices kept for tax compliance, transaction and billing records kept under the E-Commerce Law, account information kept for verification)."
text_zh = "对象：账号数据。注销后无权继续收集、存储和使用您的个人信息和数据，但法律法规另有要求的情形除外（税务合规保留发票信息、电子商务法保留交易/账单信息、校验保留账号信息等）。"
anchor = "sensecore-deletion-3-2-1-post-deletion-statutory-retention"

[[product.retention.point]]
text = "Object: usage records. Service-usage behaviour and unsafe-feature data are detected, browsed and logged as \"user support data\"; the same clause says user support data does not include user business data or user account information. No retention period is given for this category."
text_zh = "对象：使用行为记录。服务使用行为、数据不安全特征等作为「用户支持数据」被检测、浏览、记录；同条注明用户支持数据不含用户业务数据与账号信息。该类记录未给保留期限。"
anchor = "sensecore-tos-5-3-user-support-data-logged"

[[product.retention.point]]
text = "Object: personal information, trigger: the user's deletion request. The Nova official-website policy answers within 15 working days and says that after the data is deleted from the servers it may not be removed from backup systems immediately but is deleted when the backup is refreshed — from the platform.sensenova.cn context, not the SenseCore API terms."
text_zh = "对象：个人信息，触发：用户删除请求。Nova 官网政策称 15 个工作日内答复，并称从服务器删除后可能不会立即从备份系统删除相应数据、而是在备份更新时删除——出自 platform.sensenova.cn 语境，不是大装置 API 条款。"
anchor = "nova-privacy-8-2-backup-deletion-delay"

[[product.retention.point]]
text = "No request-level retention period, and no network-log floor wording."
text_zh = "无请求级保留期、无网络日志下限表述。"

[product.processing_region]
codes = ["CN"]
anchor = "sensecore-pps-5-storage-in-cn"

[[product.processing_region.point]]
text = "Personal information is stored within China"
text_zh = "个人信息境内存储"
anchor = "sensecore-pps-5-storage-in-cn"

[[product.processing_region.point]]
text = "The region list contains only one region, Shanghai, China"
text_zh = "地区清单只有中国上海一区"

[[product.processing_region.point]]
text = "The service territory is limited to mainland China and Hong Kong"
text_zh = "服务地域限中国大陆及香港"

[[product.processing_region.point]]
text = "But the object of these clauses is personal information; nothing is stated about where API request bodies are processed."
text_zh = "但条款宾语是个人信息，未对 API 请求体处理地作陈述。"

[[product.processing_region.point]]
text = "Cross-border transfer is possible where genuinely necessary, but only in compliance with the mandatory rules of China and other relevant jurisdictions — including China's outbound personal-information security assessment, security certification and/or signed data transfer agreements. That clause covers personal information SenseTime collects directly or indirectly through a customer while the customer serves its end users, which is the typical data path of this API tier."
text_zh = "如确有必要可跨境移转，但须在符合中国及其他相关司法辖区强制性规则的前提下——包括中国境内个人信息出境安全评估、经过安全认证和/或签署数据传输协议。该条覆盖「客户在向终端用户提供服务过程中商汤科技直接或间接通过客户收集的个人信息」，正是本 API 档的典型数据来源。"
anchor = "sensecore-personal-7-1-storage-in-cn-cross-border-conditions"

[product.role]
kind = "processor"
anchor = "sensecore-personal-3-2-accepts-customer-entrustment"

[[product.role.point]]
text = "Scope of this verdict: for user personal information processed as entrusted by a customer, SenseTime is the entrusted party — \"we accept customers' entrustment to process users' personal information\" (Personal Information Protection Policy §III.2)"
text_zh = "本结论的适用范围：按客户委托处理用户个人信息时商汤是受托方——「我们接受客户的委托处理用户的个人信息」（《SenseCore 商汤大装置个人信息保护政策》三、2）"
anchor = "sensecore-personal-3-2-accepts-customer-entrustment"

[[product.role.point]]
text = "In the other direction: it designates itself controller where it collects and uses users' personal information directly (the contact section of the SenseCore Personal Information Protection Policy) — the two statements have different objects, not a contradiction."
text_zh = "反方向：直接收集和使用用户个人信息时自认控制者（《SenseCore 商汤大装置个人信息保护政策》「如何联系我们」一节）——两句适用对象不同，不构成矛盾。"
anchor = "sensecore-personal-13-controller-when-collecting-directly"

[[product.role.point]]
text = "The help-centre Privacy Protection Policy likewise names Shanghai SenseTime as the operating entity of the official website and the controller of your personal information."
text_zh = "帮助中心版《商汤大装置隐私保护政策》同样自认官方网站运营主体并是您个人信息的控制者。"
anchor = "sensecore-pps-11-operator-is-controller"

[[product.role.point]]
text = "The contract does not accept joint-handler status and requires that input contain no personal information. The entity is Shanghai SenseTime Technology Development Co., Ltd."
text_zh = "合同不认共同处理者，且要求输入不含个人信息。主体是上海商汤科技开发有限公司。"

[[product.role.point]]
text = "Layering possible: specific services may be provided by affiliates or other legal entities under separately agreed terms (§VI.3), and the agreement's rights and obligations may be transferred in whole or in part to affiliates (§VI.2), so the contracting and processing entity can change with the service purchased."
text_zh = "可能分层委托：具体服务可能由关联公司或其他法律主体提供并另订条款（六、3），协议权利义务也可能整体或部分转移给关联公司（六、2），签约与处理主体可能随所购服务变化。"
anchor = "nova-terms-6-3-may-entrust-affiliates"

