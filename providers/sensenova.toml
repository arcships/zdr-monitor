channel = "consumer_privacy"
tier = "core"
note = "《SenseNova 商汤日日新大模型官方网站个人信息保护政策》（生效 2023-06-30），运营主体上海商汤科技开发有限公司，适用范围是 platform.sensenova.cn 官方网站（含「申请试用我们的产品和服务」场景）。这是本家唯一把「试用」语境写进条款的文档（第二章第 5 节：试用过程中收集日日新平台的对话内容、匿名化后用于算法研究和优化）；第五章给出境内存储与「本政策所属目的的所必须期间和法律法规要求的时限内」存储；第十一章自认「亦是您个人信息的控制者」。全文无 ZDR/零保留、无量化保留期、无请求级删除承诺。"

[[source]]
url = "https://www.sensecore.cn/help/docs/model-as-a-service/nova/legaldoc/service"
channel = "contract"
tier = "core"
note = "《SenseNova 商汤日日新大模型附加服务条款》（生效 2023-06-30，更新 2024-10-30），运营主体「上海商汤科技开发有限公司及其关联方」，是《SenseCore商汤大装置用户服务协议》的补充条款，前言规定二者不一致时优先适用本条款。覆盖档位：商汤大装置（sensecore.cn）内的日日新大模型 API/服务（自然语言对话、模型微调、知识库构建、多模态生成），即本家的企业/平台 API 档，不覆盖 sensenova.cn 的 TokenPlan 订阅档。与 training 直接相关的只有第二章「知识产权」第 7 条（授权用输入内容优化模型和相关服务）；全文未出现「训练」二字，未出现任何保留期限、零保留、ZDR 字样；第四章「个人信息保护与数据安全」只有 3 句，均指向另订的《个人信息保护政策》，不含处理地或保留期条款。"

[[source]]
url = "https://www.sensecore.cn/help/docs/support/ls/DeletionAgreement"
channel = "contract"
tier = "core"
note = "《商汤大装置账号注销协议》（帮助中心，主体上海商汤科技开发有限公司）。§二给出注销条件与静默期（后付费产品 1 个自然日）；§三.2.1 是本家唯一写明「删除后仍有法定留存例外」的条款：账号注销后我方无权继续收集、存储和使用您的个人信息和数据，但法律法规另有要求的情形除外（税务合规保留发票信息、电子商务法保留交易/账单信息、校验保留账号信息等）；§三.2.2 要求保障已注销账号数据在业务系统中不可被检索、访问。无量化期限、无 ZDR。"

[[source]]
url = "https://www.sensecore.cn/help/docs/support/ls/pps"
channel = "consumer_privacy"
tier = "core"
note = "《商汤大装置隐私保护政策》（帮助中心版，生效 2024-11-30），运营主体上海商汤科技开发有限公司，是 sensecore.cn 官网的个人信息保护政策，也是本家最新（2024-11-30）的隐私文本。§五给出境内存储 + 「仅在法律法规要求的最低时限内存储」；§二10「安全审计」明确会收集使用账号信息、设备信息、网络日志；§十一自认「亦是您个人信息的控制者」。全文无量化保留期、无 ZDR、无跨境传输承诺以外的处理地条款；也未出现「网络日志不少于六个月」类下限表述。"

[[source]]
url = "https://www.sensecore.cn/help/docs/support/ls/userservice"
channel = "contract"
tier = "core"
note = "《商汤大装置用户服务协议》（帮助中心 HTML 版，更新日期 2024-11-30），平台层合同，主体上海商汤科技开发有限公司，覆盖大装置全部服务（算力、存储、AI 模型生产平台、万象 ModelStudio、日日新大模型）。与五维度直接相关的条款集中在（四）用户使用规范、（五）平台服务规范、（九）个人信息保护、（十四）其他：§（五）1 是终止/欠费后「缓冲期内继续存储—缓冲期届满删除全部用户数据（含所有缓存或备份副本）」；§（四）1 是服务期届满时用户应在保留期内清理迁移数据；§（四）6 声明协议签署不使商汤成为用户上传/存储/使用数据的共同行为人；§（四）8 要求用户承诺输入不含个人信息；§（五）3 定义并记录「用户支持数据」；§（十四）3 限定服务地域为中国大陆及香港。全文无量化保留天数、无 ZDR/零保留字样、无「网络日志不少于六个月」类法定下限表述。"

[[source]]
url = "https://www.sensecore.cn/personal"
channel = "consumer_privacy"
tier = "core"
note = "《SenseCore 商汤大装置个人信息保护政策》（官网 /personal 页，无更新日期），主体上海商汤科技开发有限公司，是面向「客户及客户的用户」的集团式政策，明确覆盖「客户在向终端用户提供服务过程中商汤科技直接或间接通过客户收集的个人信息」。§三2 是 role 维度的关键条款（商汤接受客户委托处理用户个人信息）；§七（一）境内存储 + 出境条件；§七（二）存储期限判断标准（以时间较长者为准）；§十三自认「在直接收集和使用用户的个人信息时是用户个人信息的控制者」。全文无量化期限、无 ZDR。"

[[product]]
