[product.training]
mark = "no"
anchor = "nova-terms-2-7-optimize-model-license"

[[product.training.point]]
text = "§II.7 of the Additional Service Terms grants the company and its affiliates a free, worldwide, perpetual, sub-licensable licence to use the information content provided to the AI models to \"optimize the models and the related services\""
text_zh = "《附加服务条款》§二7 授权本公司及关联方使用您提供给模型的信息内容「优化模型和相关服务」"
anchor = "nova-terms-2-7-optimize-model-license"

[[product.training.point]]
text = "For the trial context, Nova Privacy Policy §II.5 separately covers anonymized conversations used for algorithm research and optimization. The word \"training\" appears nowhere in the texts, and there is no \"not used for training\" commitment."
text_zh = "试用语境另有 Nova 隐私政策 §二5（匿名化对话用于算法研究和优化）。全文无「训练」字样，也无「不用于训练」承诺。"
anchor = "nova-privacy-2-5-trial-conversations-anonymized-for-optimization"

[product.zdr]
