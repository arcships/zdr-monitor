[product.training]
mark = "no"
anchor = "novita-coding-plan-models"

[[product.training.point]]
text = "Novita AI's own promise, unchanged in the same clause: TOS §10.2 \"By Default, Novita AI will not use your Content to train our own models or to improve the Services.\" Read together with the 2026-11-27 scope sentence, it covers Novita AI's own handling of Content in connection with Novita-Managed Models, not the Model Provider hop."
text_zh = "厂商自身承诺在同一节未变：TOS §10.2「By Default, Novita AI will not use your Content to train our own models or to improve the Services.」与 2026-11-27 新增的范围句合读，它只覆盖 Novita 自身对 Content 的处理、且限于 Novita-Managed Models，不覆盖 Model Provider 那一跳。"
anchor = "novita-tos-10-2-no-training"

[[product.training.point]]
text = "The carve-out, added 2026-11-27: TOS §6.4 states that Novita AI's data handling commitments under Section 10 \"apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider\", and that \"A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" Upstream training is therefore expressly permitted rather than undisclosed."
text_zh = "2026-11-27 新增的除外条款：TOS §6.4 写明 Section 10 的数据处理承诺「apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider」，且「A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」——上游训练属明文许可，不再是「未披露」。"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.training.point]]
text = "Why §6.4 reaches this tier: the official Coding Plan page lists this plan's models as \"GLM 5 ; Kimi K2.5 ; GLM 4.7 ; minimax/minimax-m2.5 ; qwen/qwen3.5-397b-a17b ; minimax/minimax-m2.7 ; DeepSeek V4 Pro ;\", and the official model catalog labels the GLM 5 card \"Third-Party API\". The subscription's model set therefore contains a Third-Party API model, so the carve-out is not hypothetical for this product."
text_zh = "§6.4 为什么落到本档：Coding Plan 官方产品页把本档模型列为「GLM 5 ; Kimi K2.5 ; GLM 4.7 ; minimax/minimax-m2.5 ; qwen/qwen3.5-397b-a17b ; minimax/minimax-m2.7 ; DeepSeek V4 Pro ;」，官方模型目录又把 GLM 5 模型卡标为「Third-Party API」。本档模型集因此确实包含 Third-Party API 模型，§6.4 的除外条款对本产品不是假设。"
anchor = "novita-models-glm5-third-party"

[[product.training.point]]
text = "Conflict kept visible: the Trust Center FAQ still says \"No. By default, we do not use any data submitted through our API — including prompts, inputs, outputs, or conversation histories — to train or improve our models. This commitment is contractually binding under our Terms of Service, and is further documented in our Privacy Policy.\" The FAQ is lower authority than the TOS, and the TOS now limits Section 10 to Novita AI's own handling and Novita-Managed Models while expressly permitting a Model Provider to train on Third-Party API inputs and outputs. Both statements are kept; the contract governs."
text_zh = "冲突并列保留：Trust Center FAQ 仍称「No. By default, we do not use any data submitted through our API — including prompts, inputs, outputs, or conversation histories — to train or improve our models. This commitment is contractually binding under our Terms of Service, and is further documented in our Privacy Policy.」FAQ 权威性低于 TOS，而 TOS 现在把 Section 10 限制在 Novita 自身处理与 Novita-Managed Models，并明文允许 Model Provider 用 Third-Party API 的输入输出训练。两条表述均保留，以合同为准。"
anchor = "novita-trustfaq-no-training-api-inputs"

[[product.training.point]]
text = "Why the tier is marked no: the plan's own model list contains Third-Party API models (GLM 5 and Kimi K2.5), and §6.4 expressly permits the applicable Model Provider to use those Inputs and Outputs for model training to the extent its Model Terms allow. Under the multi-hop rule (any hop that is clearly negative makes the whole chain negative), the product-level mark records the weakest hop. Requests served only by Novita-Managed Models still get the §10.2 no-training promise."
text_zh = "判 no 的理由：本档自己的模型列表包含 Third-Party API 模型（GLM 5、Kimi K2.5），而 §6.4 明文允许相应 Model Provider 在其 Model Terms 允许范围内把这些输入输出用于模型训练。按多跳口径（任一跳明确为否，则全链为否），产品级 mark 记录最弱一跳。仅由 Novita-Managed Models 服务的请求仍受 §10.2 不训练承诺保护。"
anchor = "novita-coding-plan-models"

[product.zdr]
mark = "no"
anchor = "novita-coding-plan-models"

[[product.zdr.point]]
text = "Managed-model path, unchanged: TOS §10.2 still says Novita AI \"will not, unless otherwise required by applicable law (or as necessary to provide the Services or technical support to you): (i) log your Content for human review; or (ii) retain your Content beyond the time it takes to generate Output and deliver that Output to you.\" This is the zero-retention promise for Novita AI's own handling."
text_zh = "托管模型路径未变：TOS §10.2 仍写 Novita AI「will not, unless otherwise required by applicable law (or as necessary to provide the Services or technical support to you): (i) log your Content for human review; or (ii) retain your Content beyond the time it takes to generate Output and deliver that Output to you.」这是针对 Novita 自身处理的零保留承诺。"
anchor = "novita-tos-10-2-zero-data-retention"

[[product.zdr.point]]
text = "The new scope sentence, added 2026-11-27 at the end of §10.2: \"For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.\" The ZDR promise is now expressly bounded by model category."
text_zh = "2026-11-27 在 §10.2 末尾新增的范围句：「For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.」——ZDR 承诺现在明示以模型类别为界。"
anchor = "novita-tos-10-2-zdr-scope-managed-models"

[[product.zdr.point]]
text = "The contract carve-out and its consequence: §6.4 states that Section 10 commitments, \"including the Zero Data Retention policy set out in Section 10.2, apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider\", and that \"A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" Retention on that hop is therefore expressly possible, not merely undisclosed."
text_zh = "合同层的除外及其后果：§6.4 写明 Section 10 的承诺「including the Zero Data Retention policy set out in Section 10.2, apply solely to Novita AI's own handling of your Content and do not extend to any Model Provider」，且「A Model Provider may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」——该跳的保留属明文可能，而不只是「未披露」。"
anchor = "novita-tos-6-4-no-extension-to-model-provider"

[[product.zdr.point]]
text = "The promise is also bounded by the clause that states it: TOS §10.2 excludes the two behaviours \"unless otherwise required by applicable law (or as necessary to provide the Services or technical support to you)\", and the sentence immediately after adds that automated safety screening \"does not constitute retention of your Content for any other purpose\". Those are qualifications of the managed-model commitment, not the reason for the tier's mark."
text_zh = "该承诺还被它自己那句限定：TOS §10.2 的两项排除以「unless otherwise required by applicable law (or as necessary to provide the Services or technical support to you)」为前提，紧随其后的一句又写明自动化安全筛查「does not constitute retention of your Content for any other purpose」。这些是托管模型路径的限定条件，不是本档判 no 的理由。"
anchor = "novita-tos-10-2-safety-screening"

[[product.zdr.point]]
text = "Conflict kept visible: FAQ item 3 still says \"Zero Data Retention is the default for all endpoints, including serverless API calls\", and the FAQ's no-retention sentence says it applies \"across all endpoints\". That is enterprise-FAQ language and now conflicts with the contract's model-category limit; under the authority order contract > enterprise_privacy_faq, the narrower contract text governs this row, while both statements remain on record."
text_zh = "冲突并列保留：FAQ 第 3 条仍称「Zero Data Retention is the default for all endpoints, including serverless API calls」，且 FAQ 的不保留句声称适用于「across all endpoints」。这是企业 FAQ 口径，现与合同层的模型类别限定冲突；按 contract > enterprise_privacy_faq 的权威顺序，本行以更窄的合同文本为准，但两条表述都保留在案。"
anchor = "novita-trustfaq-retention-by-category"

[[product.zdr.point]]
text = "Why the tier is marked no: the Coding Plan page lists GLM 5 and Kimi K2.5 among this plan's models, and the model catalog labels the GLM 5 card \"Third-Party API\". The chain therefore contains a hop that the contract excludes from ZDR and expressly allows to retain. Under the multi-hop rule (any hop that is clearly negative makes the whole chain negative), zero retention is not established for this tier; it is established only for requests served by Novita-Managed Models."
text_zh = "判 no 的理由：Coding Plan 页把 GLM 5 与 Kimi K2.5 列为本档模型，模型目录又把 GLM 5 模型卡标为「Third-Party API」。整条链因此包含一个被合同排除在 ZDR 之外、且明文允许保留的跳。按多跳口径（任一跳明确为否，则全链为否），本档不成立零保留；零保留只对由 Novita-Managed Models 服务的请求成立。"
anchor = "novita-models-glm5-third-party"

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "novita-coding-plan-models"

[[product.retention.point]]
text = "Managed-model path, object = API input and output content, context = default, type = upper bound with no fixed number of days: no retention \"beyond the time it takes to generate Output and deliver that Output to you\" (TOS §10.2). Since 2026-11-27 that clause is expressly limited to Novita AI's own handling in connection with Novita-Managed Models. The TOS quantifies no retention period for Content: the only six-month figure it contains is the liability look-back window in §23 (SIX (6) MONTH PERIOD), which is not a retention period."
text_zh = "托管模型路径：对象＝API 输入输出正文，语境＝默认，期限类型＝上限且无固定天数，合同层表述为：不保留「beyond the time it takes to generate Output and deliver that Output to you」（TOS §10.2）。自 2026-11-27 起该条明示只覆盖 Novita 自身对 Content 的处理、且限 Novita-Managed Models。TOS 没有量化任何针对 Content 的保留期限：全文唯一的六个月数字是 §23 责任限额的回溯窗口（SIX (6) MONTH PERIOD），它不是保留期限。"
anchor = "novita-tos-10-2-zero-data-retention"

[[product.retention.point]]
text = "Third-party path, object = API inputs and outputs sent to a Third-Party API, context = default, type = undisclosed: §6.4 says those Inputs and Outputs are processed by the applicable Model Provider on its own infrastructure under the applicable Model Terms, that Novita's Section 10 commitments do not extend to any Model Provider, and that a Model Provider \"may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.\" No period is published on Novita's side. This is why the row carries basis=undisclosed rather than basis=none: the no-retention cap now covers only part of the tier's content path."
text_zh = "第三方路径：对象＝提交给 Third-Party API 的 API 输入输出，语境＝默认，期限类型＝未披露。§6.4 写明这些 Inputs/Outputs 由相应 Model Provider 在其自有基础设施上按适用 Model Terms 处理，Novita 的 Section 10 承诺不延伸至任何 Model Provider，且 Model Provider「may log, retain, review, or use your Inputs and Outputs, including for model training, to the extent permitted by the applicable Model Terms.」Novita 侧未公布任何期限。故本行取 basis=undisclosed 而非 basis=none：不留存的上限现在只覆盖本档内容路径的一部分。"
anchor = "novita-tos-6-4-model-provider-may-train"

[[product.retention.point]]
text = "The scope sentence that draws the line, added 2026-11-27 at the end of §10.2: \"For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.\""
text_zh = "划界的范围句，2026-11-27 加在 §10.2 末尾：「For clarity, Novita AI's Zero Data Retention commitment applies solely to Novita AI's own handling of your Content in connection with Novita-Managed Models. It does not extend to Third-Party APIs, which are governed by Section 6.4 and the applicable Model Terms.」"
anchor = "novita-tos-10-2-zdr-scope-managed-models"

[[product.retention.point]]
text = "Why this tier carries a third-party retention path: the Coding Plan page lists GLM 5 and Kimi K2.5 among this plan's models, and the model catalog labels the GLM 5 card \"Third-Party API\". Those requests are routed by §6.4 to the Model Provider's own terms, for which Novita publishes no retention period."
text_zh = "本档为什么存在第三方保留路径：Coding Plan 页把 GLM 5 与 Kimi K2.5 列为本档模型，模型目录又把 GLM 5 模型卡标为「Third-Party API」。这些请求按 §6.4 交给 Model Provider 自己的条款，Novita 未公布其保留期限。"
anchor = "novita-models-glm5-third-party"

[[product.retention.point]]
text = "The quantified, object-by-object statement lives in FAQ item 3: \"Not retained beyond the time required to generate and deliver Output, except where required by applicable law\" for API inputs and outputs, 6 months for technical metadata, and the duration of the account plus any statutory retention periods for account and authentication data. The FAQ also claims that commitment applies \"across all endpoints\"; it is lower authority than the contract and now conflicts with §10.2/§6.4 on third-party APIs. Both statements are kept on record, and the contract text governs this row."
text_zh = "量化且分对象的表述在 FAQ 第 3 条：API 输入输出「Not retained beyond the time required to generate and deliver Output, except where required by applicable law」、技术元数据 6 个月、账户与鉴权数据为账户存续期加法定期间。FAQ 还声称该承诺适用于「across all endpoints」；其权威性低于合同，现与 §10.2/§6.4 在第三方 API 上冲突。两条表述均保留在案，本行以合同文本为准。"
anchor = "novita-trustfaq-retention-by-category"

[[product.retention.point]]
text = "Object = technical metadata (request timestamps, error codes, usage metrics), context = default, type = fixed period of 6 months, for billing, debugging and security auditing (FAQ item 3)."
text_zh = "对象＝技术元数据（请求时间戳、错误码、用量指标），语境＝默认，期限类型＝固定 6 个月，用于计费、调试与安全审计（FAQ 第 3 条）。"
anchor = "novita-trustfaq-retention-by-category"

[[product.retention.point]]
text = "Conflicting periods for an overlapping object, both kept on record without picking a side: the Privacy Policy's Specific Retention Periods give Technical Information 2 years for security and analytics, while FAQ item 3 gives technical metadata 6 months; the overlap is usage and request metadata. FAQ item 3's closing sentence defers to the Privacy Policy and the applicable DPA — \"Technical metadata for operational purposes (e.g., request timestamps, error codes, usage metrics) is handled as described in our Privacy Policy and applicable Data Processing Agreement\" — so the vendor's own framing is FAQ as overview, Privacy Policy as detail."
text_zh = "同一对象上的两个冲突期限，并列保留、不选边：PP 的 Specific Retention Periods 给 Technical Information 2 年（security and analytics），FAQ 第 3 条给技术元数据 6 个月，重叠部分是用量与请求元数据。FAQ 第 3 条末句自认以 PP 与 DPA 为准——「Technical metadata for operational purposes (e.g., request timestamps, error codes, usage metrics) is handled as described in our Privacy Policy and applicable Data Processing Agreement」——即厂商口径是 FAQ 概览、PP 细则。"
anchor = "novita-privacy-retention-specific-periods"

[[product.retention.point]]
text = "Object = account-side data, where the Privacy Policy gives per-category periods rather than one number: account information for as long as the account is active plus 7 years for legal and tax purposes (a duration-of-account lower bound plus a fixed period), transaction history 7 years for accounting and tax compliance, communication information 3 years from last communication, technical information 2 years for security and analytics. The Privacy Policy itself does not apply to content processed on behalf of customers."
text_zh = "对象＝账户侧数据，PP 给的是分类期限而非一个数字：账户信息为账户存续期加 7 年（存续期下限＋固定年数）、交易记录 7 年（会计与税务合规）、通讯信息自最后一次沟通起 3 年、技术信息 2 年。PP 自身不适用于代客户处理的内容。"
anchor = "novita-privacy-retention-specific-periods"

[[product.retention.point]]
text = "A separate retention path disclosed at the contract layer, object = data you transmit to the Site for managing the performance of the Marketplace Offerings plus data relating to your use of them: \"We will maintain certain data that you transmit to the Site for the purpose of managing the performance of the Marketplace Offerings, as well as data relating to your use of the Marketplace Offerings. Although we perform regular routine backups of data, you are solely responsible for all data that you transmit...\" (TOS §25). This is an account/operations-side path and the clause does not state that it applies to API input and output content, so it is recorded as another retention path and does not change the managed-model no-retention conclusion for content."
text_zh = "合同层披露的另一条留存路径，对象＝你传输到 Site 的、用于管理 Marketplace Offerings 运行的数据以及与你使用相关的数据：「We will maintain certain data that you transmit to the Site for the purpose of managing the performance of the Marketplace Offerings, as well as data relating to your use of the Marketplace Offerings. Although we perform regular routine backups of data, you are solely responsible for all data that you transmit...」（TOS §25）。属账户/运营侧路径，条款未声明适用于 API 输入输出正文；故作为「其他留存路径」列出，不改变托管模型路径下正文不留存的结论。"
anchor = "novita-tos-25-user-data-maintained"

[[product.retention.point]]
text = "Exception qualifying the managed-model no-retention promise, sitting in the same clause: automated safety screening applied to Content \"does not constitute retention of your Content for any other purpose\" (TOS §10.2)."
text_zh = "托管模型路径不留存承诺的限定条件：对 Content 施加的自动化安全筛查「does not constitute retention of your Content for any other purpose」（TOS §10.2）。"
anchor = "novita-tos-10-2-safety-screening"

