[[product.processing_region.point]]
text = "The only sentence naming a geographic destination is the Privacy Policy's cross-border disclosure, and it states no processing location: \"We may transfer Personal Information to countries outside your country or region, including the United States.\" It names a transfer destination (and not only the United States), so codes=[\"US\"] cannot be derived from it; the same policy also says it \"does not apply to content that we process on behalf of customers\", which excludes API input and output content."
text_zh = "唯一点名地理去向的是 PP 的跨境传输披露，它并未声明处理地：「We may transfer Personal Information to countries outside your country or region, including the United States.」说的是传输去向（且不只美国），推不出 codes=[\"US\"]；同一份政策还自述「does not apply to content that we process on behalf of customers」，即 API 输入输出正文不在其适用范围内。"
anchor = "novita-privacy-international-transfers"

[[product.processing_region.point]]
text = "The contract now has one processing-location-relevant sentence for the third-party path, added 2026-11-27: inputs and outputs sent to a Third-Party API \"are processed by the applicable Model Provider on that Model Provider's own infrastructure and in accordance with the applicable Model Terms.\" It says whose infrastructure carries out the processing but names no country or region, so it does not support any codes value."
text_zh = "合同层现在有一条与处理地相关的第三方路径表述，2026-11-27 新增：提交给 Third-Party API 的输入输出「are processed by the applicable Model Provider on that Model Provider's own infrastructure and in accordance with the applicable Model Terms.」它说明处理发生在 Model Provider 自有基础设施上，但未给出国家或区域，推不出任何 codes 值。"
anchor = "novita-tos-6-4-third-party-data-handling"

[[product.processing_region.point]]
text = "The only named hosting detail remains FAQ item 6's \"Infrastructure: Hosted on AWS data centers\", which gives no region. The TOS names no region or country; §22 mentions only \"our secure servers\", and §6.4 says third-party APIs run on the Model Provider's own infrastructure without a location. The Coding Plan and model catalog pages add model names and categories, not a processing location. Recorded as undisclosed: the vendor has not stated where processing happens, and that is not the same as a statement that processing happens in the United States."
text_zh = "唯一点名的基础设施表述仍是 FAQ 第 6 条的「Infrastructure: Hosted on AWS data centers」，未给区域。TOS 未点名任何区域或国家：§22 只说「our secure servers」，§6.4 只说第三方 API 跑在 Model Provider 自有基础设施上、未给地点。Coding Plan 与模型目录页只增加模型名称和类别，没有处理地。按未披露记录：厂商没有说明处理地，这也不等于厂商声明在美国处理。"
anchor = "novita-trustfaq-infra-aws"

[[product.processing_region.point]]
text = "No tier-specific wording: no region statement in the source set names the Coding Plan tier."
text_zh = "无档位专用表述：来源集中的任何区域声明都未点名 Coding Plan 这一档。"

