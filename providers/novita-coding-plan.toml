[[product.role.point]]
text = "Boundary (kind unchanged): the 2026-11-27 §6.4 says that for a Third-Party API the inputs and outputs are processed by the applicable Model Provider on its own infrastructure under the applicable Model Terms, and that Novita AI's Section 10 commitments do not extend to any Model Provider. The TOS does not state Novita's role on that hop, so kind=processor describes Novita AI's own handling of Content only; the upstream hop's role is set by the applicable Model Terms."
text_zh = "边界（不改 kind）：2026-11-27 的 §6.4 写明走 Third-Party API 时，输入输出由相应 Model Provider 在其自有基础设施上按适用 Model Terms 处理，且 Novita 的 Section 10 承诺不延伸至任何 Model Provider。TOS 未声明 Novita 在该跳的角色，故 kind=processor 只描述 Novita 自身对 Content 的处理；上游一跳的角色由适用 Model Terms 决定。"
anchor = "novita-tos-6-4-no-extension-to-model-provider"

