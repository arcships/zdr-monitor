[[source]]
url = "https://novita.ai/legal/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "《Novita AI Privacy Policy》(Effective date 2026-05-13，Last updated 2026-05-13)。开头即声明「This Privacy Policy does not apply to content that we process on behalf of customers while providing services」——即 API 输入输出正文不适用本政策，而适用客户协议；本政策自身覆盖账户信息、交易记录、通讯信息、网站技术信息。是唯一给出分类保留期限的官方文档（账户 +7 年 / 交易 7 年 / 通讯 3 年 / 技术信息 2 年），也是唯一明示「Personal Information 不用于模型训练」的隐私层文档，并给出跨境传输（含美国）表述。"

[[source]]
url = "https://novita.ai/legal/terms-of-service"
channel = "contract"
tier = "core"
note = "《Novita AI Terms of Service》(Policy date 2024-10-12，Updated 2026-11-27)，合同层最高权威，覆盖全部 Marketplace Offerings：§1 把「AI-powered cloud services, including: AI inference APIs (text generation, image generation, speech, video, and multimodal models), storage, and related software products」定义为 Marketplace Offerings，即 Model API、GPU 实例、Agent Sandbox 共用同一份 TOS。2026-11-27 起 §6 由「Model Availability」扩为「Models and Model Terms」：§6.1 区分 Novita-Managed Models 与 Third-Party APIs，§6.4 Data Handling for Third-Party APIs 明示 Section 10 的承诺（含 §10.2 ZDR）只覆盖 Novita 自身处理、不延伸至任何 Model Provider，且 Model Provider 可在 Model Terms 允许范围内 log/retain/review/use 输入输出，包括用于模型训练。§10.2 主句（不训练、不超期保留）逐字未变，末尾同时新增「For clarity…」句重申该范围。§20 适用法为 Delaware。全文没有量化保留期限，也没有任何 DPA/ZDR 申请表入口。"

[[source]]
url = "https://novita.ai/coding-plan"
channel = "developer_data"
tier = "core"
note = "Novita Coding Plan 官方产品页。该页「Multi-Model Ecosystem」列出本档可用模型：「Models: GLM 5 ; Kimi K2.5 ; GLM 4.7 ; minimax/minimax-m2.5 ; qwen/qwen3.5-397b-a17b ; minimax/minimax-m2.7 ; DeepSeek V4 Pro ;」。用于确认本档模型集不只有 Novita-Managed Models：其中 GLM 5 与 Kimi K2.5 在 https://novita.ai/models 的模型卡上被标为「Third-Party API」。页面为 Next.js 服务端直出，模型列表在初始 HTML 中。"

[[source]]
url = "https://novita.ai/models"
channel = "developer_data"
tier = "core"
note = "Novita AI 官方模型目录。每张模型卡标注归属类别：GLM 5 与 Kimi K2.5 为「Third-Party API」，GLM 4.7 为「Novita-Managed」，DeepSeek V4 Pro 为「Hybrid」。TOS §6.1 也写明 Third-Party API 清单维护在 novita.ai/models。用于把 Coding Plan 页列出的模型对应到 TOS §6.4 的 Third-Party API 数据路径。目录随模型上下架和价格变动，锚点绑定具体模型卡的名称、价格、上下文与类别字段。"

[[source]]
url = "https://trust.novita.ai/faq"
fetch = "browser"
channel = "enterprise_privacy_faq"
tier = "core"
note = "Novita AI Trust Center FAQ（Vanta 托管的官方信任中心，17 条问答）。本轮最重要的新来源：是唯一把保留期限量化到对象级的文档（API 输入输出「transiently, not retained beyond the time required to generate and deliver Output」；技术元数据 6 个月；账户与鉴权数据为账户存续期加法定期间），也是唯一写明「Zero Data Retention is the default for all endpoints, including serverless API calls」、唯一披露子处理者类别中「Model provider」处理 API inputs and outputs、唯一说明基础设施托管在 AWS 数据中心、并提供 DPA（GDPR Art.28）与 SCC Module 2 的文档。属企业侧 FAQ，权威性低于合同层。2026-11-27 后其「all endpoints / across all endpoints」的零保留表述与 TOS §6.4/§10.2 的模型类别限定冲突：合同只覆盖 Novita 自身处理与 Novita-Managed Models，第三方 API 交由适用 Model Terms；两条并列保留。"

[[product]]
id = "coding-plan"
