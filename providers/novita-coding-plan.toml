anchor = "novita-privacy-international-transfers"

[[product.processing_region.point]]
text = "No tier-specific wording; only the Privacy Policy's cross-border disclosure carries over; low confidence."
text_zh = "无档位专用表述，仅沿用 PP 的跨境披露；低置信度。"

[product.role]
