[[product]]
id = "free"
badge = "免费版"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
mode = "default"
anchor = "windsurf-platform-training-default"

[[product.training.point]]
text_zh = "现行平台条款允许 Cognition 将 Customer Data 用于模型训练及服务改进；免费档没有条款提供的 Opt-Out，故 training=no。"

[[product.training.point]]
text = "Consumer-layer corroboration: the privacy policy lists “using User Content to train, fine tune and improve the models that power our Services” as a processing purpose, qualified by “depending on the terms that apply to your use of the Services”. It points the same way as the contract layer and does not override it."
text_zh = "消费者层印证：隐私政策把「using User Content to train, fine tune and improve the models that power our Services」列为处理目的，并带「取决于适用于你的条款」的分档限定。方向与合同层一致，不覆盖合同层的结论。"
anchor = "windsurf-privacy-training-user-content"

[[product.training.point]]
text = "DPA §4 constrains the subprocessor layer — subprocessors must be contractually or technically prevented from using Customer Data for model training — and its first sentence applies the same level of restriction as the Agreement. The DPA is incorporated into the self-serve tiers by Platform Terms §4.2, so the two statements cover different layers (subprocessor handling vs the Agreement's own use rights) rather than being an unexplained conflict."
text_zh = "DPA §4 约束的是子处理者层——子处理者须受合同或技术配置约束、不得用 Customer Data 做模型训练，首句还把限制水平回指协议本身；DPA 经平台条款 §4.2 并入自助档。两条约束的是不同层面（子处理者的处理 vs 协议授予的自身使用权），属适用范围差异，不是未说明的冲突。"
anchor = "windsurf-dpa-subprocessor-no-training"

[product.zdr]
mark = "no"
mode = "not_disclosed"
anchor = "windsurf-platform-optout-paid-only"
searched = ["https://cognition.com/legal/platform-terms-of-service", "https://cognition.com/legal/privacy-policy", "https://cognition.com/legal/data-processing-statement"]

[[product.zdr.point]]
text = "The Platform Terms place the Opt-Out — and the Zero Data Retention it enables with our model providers — behind a paid Service Tier, so the Free tier has no ZDR channel. That is a disclosed qualification of the free tier, not a silence, hence mark=no rather than unknown."
text_zh = "平台条款把 Opt-Out（以及随之对模型提供商启用的 ZDR）限定在付费 Service Tier，免费档没有 ZDR 通道。这是厂商对免费档的资格限定、不是未表态，故按明确否定记 mark=no，而不是 unknown。"
anchor = "windsurf-platform-paid-optout"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "windsurf-privacy-retention"
searched = ["https://cognition.com/legal/platform-terms-of-service", "https://cognition.com/legal/privacy-policy", "https://docs.windsurf.com/context-awareness/windsurf-overview.md"]

[[product.retention.point]]
text = "No quantified period for request inputs and outputs: the privacy policy retains personal information as needed to provide the Service, comply with legal obligations, or protect ours or others interests, and states no fixed term."
text_zh = "请求输入输出没有量化期限：隐私政策按「提供服务所需、法律义务、保护我们或他人的利益」保留个人信息，未给固定期限。整个本地代码库会建立索引，但官方未披露本地索引期限。"
anchor = "windsurf-privacy-retention"

[[product.retention.point]]
text = "On termination of the Terms or the subscription, §7.2 only says Cognition “may at our option delete any Customer Data” — discretionary deletion, not a retention commitment, and not the same as the DPA's 30-day deletion for the enterprise tier."
text_zh = "平台条款 §7.2：协议或订阅终止后只写 Cognition「may at our option」自行决定删除 Customer Data——是裁量删除，不是保留承诺，与 DPA 企业档的 30 天删除不是一回事。"
anchor = "windsurf-platform-termination-deletion"

[product.processing_region]
codes = ["global", "US"]
anchor = "windsurf-privacy-global-processing"

[product.role]
kind = "processor"
anchor = "windsurf-dpa-processor-role"

[[product.role.point]]
text_zh = "平台条款 §4.2 将个人数据处理纳入 Cognition DPA；Customer Data 上用户/客户是 controller、Cognition 是 processor。账户管理、安全与合规所需 Account Data 则由 Cognition 独立控制。"

[[product]]
