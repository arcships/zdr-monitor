[[product.training.point]]
text = "Consumer-layer corroboration: the privacy policy lists “using User Content to train, fine tune and improve the models that power our Services” as a processing purpose, qualified by “depending on the terms that apply to your use of the Services”. It points the same way as the contract layer and does not override it."
text_zh = "消费者层印证：隐私政策把「using User Content to train, fine tune and improve the models that power our Services」列为处理目的，并带「取决于适用于你的条款」的分档限定。方向与合同层一致，不覆盖合同层的结论。"
anchor = "windsurf-privacy-training-user-content"

[[product.training.point]]
text = "DPA §4 constrains the subprocessor layer — subprocessors must be contractually or technically prevented from using Customer Data for model training — and its first sentence applies the same level of restriction as the Agreement. The DPA is incorporated into the self-serve tiers by Platform Terms §4.2, so the two statements cover different layers (subprocessor handling vs the Agreement's own use rights) rather than being an unexplained conflict."
text_zh = "DPA §4 约束的是子处理者层——子处理者须受合同或技术配置约束、不得用 Customer Data 做模型训练，首句还把限制水平回指协议本身；DPA 经平台条款 §4.2 并入自助档。两条约束的是不同层面（子处理者的处理 vs 协议授予的自身使用权），属适用范围差异，不是未说明的冲突。"
