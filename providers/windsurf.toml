text = "Contract layer: Appendix C of the DPA lists core processing, logs and indices in the United States and adds one India entry (Agumbe, Cognition India) for support workflow, so both the US code and the India entry come from the subprocessor table."
text_zh = "合同层：DPA Appendix C 把核心处理、日志与索引列在美国，另有一条印度条目（Agumbe, Cognition India）承担支持工作流，US 与印度两处都出自子处理者表。"
anchor = "windsurf-dpa-subprocessor-india"

[[product.processing_region.point]]
text = "The global code rests on a lower-authority layer: the privacy policy (consumer_privacy) states that Cognition, its third-party partners and service providers may transfer, store and process personal information throughout the world, including the EU, UK and the US. No current public contract offers a region-selection commitment."
text_zh = "global 一码依据的是较低权威层：隐私政策（consumer_privacy）声明 Cognition、其第三方伙伴与服务提供商可在全球（包括 EU、UK、US）传输、存储和处理个人信息。未见当前公开合同提供区域选择承诺。"
