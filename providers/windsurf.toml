[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "windsurf-platform-paid-optout"

[[product.zdr.point]]
text_zh = "付费用户执行同一个 Opt-Out 后，条款承诺对模型提供商启用 ZDR。ZDR 定义为 Customer Data 不落盘/不持久保留，并在生成输出后删除；但安全、AUP 与法律流程例外可保留。"

[[product.zdr.point]]
text = "§3.3.3 qualifies the ZDR obtained above: ZDR does not preclude retention or disclosure of Customer Data flagged on automated safety and abuse-detection classifiers, retained to perform safety, security and AUP compliance review, or as compelled by applicable law or legal process."
text_zh = "§3.3.3 限定了上面取得的 ZDR：ZDR 不排除对安全与滥用检测分类器标记的 Customer Data 的留存或披露、为安全/安保/AUP 合规审查而留存，以及法律或法律程序强制要求的情形。"
anchor = "windsurf-platform-zdr-exceptions"

[product.retention]
object = "input_output"
basis = "none"
anchor = "windsurf-platform-paid-optout"

[[product.retention.point]]
text = "This verdict covers only the request path after an Opt-Out election: §3.3.1(B) enables ZDR with our model providers and §1.8 defines ZDR as not saved to disk and deleted upon generation of the Output. The default path's retention period is undisclosed, and §3.3.3 carves out safety, AUP and legal-process retention."
text_zh = "本结论只覆盖执行 Opt-Out 后的请求路径：§3.3.1(B) 对模型提供商启用 ZDR，§1.8 把 ZDR 定义为不落盘、输出生成后删除。默认路径的期限未披露；§3.3.3 的安全/AUP/法律流程留存属例外。prompt cache 是否存在及期限也未见现行官方披露。"
anchor = "windsurf-platform-paid-optout"

[[product.retention.point]]
text = "On termination of the Terms or the subscription, §7.2 only says Cognition “may at our option delete any Customer Data” — discretionary deletion, not a retention commitment, and not the same as the DPA's 30-day deletion for the enterprise tier."
text_zh = "平台条款 §7.2：协议或订阅终止后只写 Cognition「may at our option」自行决定删除 Customer Data——是裁量删除，不是保留承诺，与 DPA 企业档的 30 天删除不是一回事。"
anchor = "windsurf-platform-termination-deletion"

