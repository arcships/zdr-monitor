[[product]]
id = "free"
badge = "免费版"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
mode = "default"
anchor = "windsurf-platform-training-default"

[[product.training.point]]
text_zh = "现行平台条款允许 Cognition 将 Customer Data 用于模型训练及服务改进；免费档没有条款提供的 Opt-Out，故 training=no。"

[product.zdr]
mark = "unknown"
searched = ["https://cognition.com/legal/platform-terms-of-service", "https://cognition.com/legal/privacy-policy", "https://cognition.com/legal/data-processing-statement"]

[[product.zdr.point]]
text_zh = "只查到付费档退出训练后对模型提供商启用 ZDR；免费档没有 ZDR/Privacy Mode 开关承诺。"

[product.retention]
mark = "unknown"
searched = ["https://cognition.com/legal/platform-terms-of-service", "https://cognition.com/legal/privacy-policy", "https://docs.windsurf.com/context-awareness/windsurf-overview.md"]

[[product.retention.point]]
text_zh = "请求输入输出没有量化期限。隐私政策只按提供服务、法律义务、安全等目的所需保留。整个本地代码库会建立索引，但官方未披露本地索引期限。"

[product.processing_region]
codes = ["global", "US"]
anchor = "windsurf-privacy-global-processing"

[product.role]
kind = "processor"
anchor = "windsurf-dpa-processor-role"

[[product.role.point]]
text_zh = "平台条款 §4.2 将个人数据处理纳入 Cognition DPA；Customer Data 上用户/客户是 controller、Cognition 是 processor。账户管理、安全与合规所需 Account Data 则由 Cognition 独立控制。"

[[product]]
id = "individual-paid"
badge = "个人付费版（Pro / Max）"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "windsurf-platform-paid-optout"

[[product.training.point]]
text_zh = "默认可用于训练和服务改进；付费档可退出，退出后 Customer Data 不再用于其他目的（包括训练语言模型）。“服务改进”未排除训练，因此默认姿态仍为 training=no。"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "windsurf-platform-paid-optout"

[[product.zdr.point]]
text_zh = "付费用户执行同一个 Opt-Out 后，条款承诺对模型提供商启用 ZDR。ZDR 定义为 Customer Data 不落盘/不持久保留，并在生成输出后删除；但安全、AUP 与法律流程例外可保留。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "windsurf-platform-zdr-definition"

[[product.retention.point]]
text_zh = "仅在用户退出训练并启用 ZDR 后为不持久保存、输出生成后删除；默认状态的输入输出期限未披露。prompt cache 是否存在及期限也未见现行官方披露。"

[product.processing_region]
codes = ["global", "US"]
anchor = "windsurf-privacy-global-processing"

[product.role]
kind = "processor"
anchor = "windsurf-dpa-processor-role"

[[product]]
id = "teams"
badge = "Teams"
category = "coding_plan"
plan_level = "team"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "windsurf-platform-paid-optout"

[[product.training.point]]
text_zh = "现行平台条款不再沿用旧 Codeium 文档的“团队默认不训练”姿态：默认允许训练/改进；只有 Teams 管理员可执行 Opt-Out。"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "windsurf-platform-paid-optout"

[[product.zdr.point]]
text_zh = "由 Teams 管理员退出后，对模型提供商启用 ZDR；安全、AUP 和法律流程除外。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "windsurf-platform-zdr-definition"

[[product.retention.point]]
text_zh = "管理员退出后的请求路径不持久保存并在输出生成后删除；默认路径期限未披露。"

[[product.retention.point]]
text_zh = "远程索引由服务端单租户执行；Store Snippets 未勾选时 embeddings 完成后删除代码/片段，只持久保存不可反推原代码的 embeddings。embeddings 的删除期限未披露。"
anchor = "windsurf-remote-index-retention"

[product.processing_region]
codes = ["global", "US"]
anchor = "windsurf-privacy-global-processing"

[product.role]
kind = "processor"
anchor = "windsurf-dpa-processor-role"

[[product]]
id = "enterprise"
badge = "Enterprise"
category = "coding_plan"
plan_level = "enterprise"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "windsurf-enterprise-no-training"

[[product.training.point]]
text_zh = "Enterprise MSA 禁止 Cognition 或第三方在未经客户事先书面同意时以 Customer Data 训练任何 AI 模型。Usage Data 可用于内部分析与一般性能/功能改进，但其合同定义排除 Customer Data、客户机密和可识别用户的信息。"

[product.zdr]
mark = "unknown"
searched = ["https://cognition.com/legal/enterprise-terms-of-service", "https://cognition.com/legal/data-processing-statement", "https://cognition.com/legal/platform-terms-of-service"]

[[product.zdr.point]]
text_zh = "现行 Enterprise MSA 和 DPA 没有企业默认 ZDR 承诺；旧 Codeium security 页的默认 ZDR 口径已重定向为 Cognition/Devin 页面，未作为现行证据。订单可能另有约定。"

[product.retention]
days = 30
object = "customer_data"
basis = "until_termination"
anchor = "windsurf-dpa-delete-30d"

[[product.retention.point]]
text_zh = "DPA 口径为协议期内处理，终止后各子处理者须在 30 天内删除 Customer Data；法律/监管保留例外须隔离保护并在义务结束后尽快删除。这不是请求级 30 天上限。"

[[product.retention.point]]
text_zh = "远程索引在 Store Snippets 关闭时完成 embeddings 后删除代码和片段，但 embeddings 自身持久保存且未披露期限；开启 Store Snippets 的代码片段期限也未披露。"
anchor = "windsurf-remote-index-retention"

[product.processing_region]
codes = ["US", "global"]
anchor = "windsurf-dpa-subprocessor-locations"

[[product.processing_region.point]]
text_zh = "DPA 子处理者表将核心处理、日志和索引主要列在美国，并列印度支持工作流；隐私政策还声明可在全球（包括 EU、UK、US）传输、存储和处理。未见当前公开合同提供区域选择承诺。"

[product.role]
kind = "processor"
anchor = "windsurf-dpa-processor-role"

[[product.role.point]]
text_zh = "Customer Data 上客户为 controller、Cognition 为 processor；Account Data 的账户管理、安全和法遵用途由 Cognition 独立 controller。"

