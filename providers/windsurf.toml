text_zh = "Enterprise MSA 禁止 Cognition 或第三方在未经客户事先书面同意时以 Customer Data 训练任何 AI 模型。Usage Data 可用于内部分析与一般性能/功能改进，但其合同定义排除 Customer Data、客户机密和可识别用户的信息。"

[[product.training.point]]
text = "The consent path in the MSA has a matching product capability: the official product docs state that Devin Desktop offers full fine-tuning for enterprises. This is a product-documentation fact, not a policy commitment, so it does not by itself change the training verdict — it only shows the consent route is a real option."
text_zh = "企业档的同意路径有对应的产品能力：官方产品文档写明 Devin Desktop 为企业提供全量微调。该页是产品文档而非政策承诺，不能据此判 training，只说明同意路径是真实存在的选项。"
anchor = "windsurf-enterprise-finetuning"

