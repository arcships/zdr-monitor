[[product.role.point]]
text = "Multi-hop: if you select a third party or open source model as your main agent model, you become subject to that model's own terms (for Anthropic the terms point at its commercial terms), so that configuration adds a hop which Google's terms do not cover. This row's conclusions describe the Google hop only; the upstream hop must be assessed separately (see the anthropic entry)."
text_zh = "多跳链路:把第三方/开源模型设为主模型时,适用的是该模型提供方自己的条款(Anthropic 明文指向其 commercial terms),该配置下链路多一跳,Google 的条款不覆盖这一跳。本档结论只描述 Google 这一跳;上游那一跳须另行组合评估(见本仓库 anthropic 条目)。"
