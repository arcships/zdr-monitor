text = "Why ✗: the abuse-monitoring rules apply to the Gemini API and AI Studio without a paid/unpaid distinction and keep prompts, contextual information and output for fifty-five (55) days, so what this tier submits is retained and the user has no control over it."
text_zh = "判 ✗ 的理由:滥用监控规则适用于 Gemini API 与 AI Studio、不区分付费/免费档,prompts/上下文/输出保留 55 天,本档提交的内容会被留存,且用户侧没有控制手段。"
