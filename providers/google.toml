[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "training-paid-no-improve"

[[product.training.point]]
text_zh = "Paid Services(经绑定有效 Cloud Billing 的 Cloud Project 访问 API,或企业 Workspace 账号的 AI Studio)明确不用于改进产品"

[[product.training.point]]
text_zh = "Unpaid Services(AI Studio 直连、API 免费额度)明确用于 provide/improve/develop 产品与 ML 技术,且人工审阅者可读取/标注输入输出"

[[product.training.point]]
text_zh = "EEA/瑞士/UK 一律按 Paid 条款。付费档唯一例外=用户主动 opt-in 分享日志 dataset(docs/logs-policy),该路径按 Unpaid 条款可用于训练。"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "zdr-requires-actions"

[[product.zdr.point]]
text_zh = "付费档可达成零保留但须逐项规避:Interactions API 显式 store=false、不配 SessionResumptionConfig、手动删 File API 文件、不用 cached_content、避开 Grounding(30 天且不可关闭)"

[[product.zdr.point]]
text_zh = "保证式 ZDR/企业 DPA 需改用 Vertex AI(Gemini Enterprise Agent Platform)。免费档不适用(训练排除仅覆盖 Paid Services)。"

[product.retention]
days = 55
object = "logs"
basis = "fixed_period"
anchor = "retention-abuse-logs-55-days"

[[product.retention.point]]
text_zh = "滥用监控日志(prompts/上下文/输出)55 天"

[[product.retention.point]]
text_zh = "合同层只写 a limited period of time。付费档 opt-in 日志默认最长 55 天、可调 7/14/28/55(docs/logs-policy)"

[[product.retention.point]]
text_zh = "Grounding with Google Search/Maps 30 天且不可关闭(terms)"

[[product.retention.point]]
text_zh = "Live API 会话态最长 24h、File API 存至删除或过期、显式缓存按用户 ttl、调优内容随模型保留(docs/zdr)"

[[product.retention.point]]
text_zh = "隐式内存缓存 24h TTL。"

[product.processing_region]
codes = ["global"]
anchor = "region-any-country"

[[product.processing_region.point]]
text_zh = "无驻留承诺:付费档滥用监控日志 may be stored transiently or cached in any country in which Google or its agents maintain facilities。/docs/available-regions 只讲服务可用国家,不是处理地域承诺。"

[product.role]
kind = "processor"
anchor = "role-paid-processor-dpa"

[[product.role.point]]
text_zh = "Paid Services 为 processor:prompts/responses 按 Data Processing Addendum for Products Where Google is a Data Processor 处理,且 business.safety.google/services/ 的服务清单明列「Gemini API Paid Services」。Unpaid Services 不在该清单内(非 processor 角色)。其他数据(账号/计费/遥测)仍按 Controller-Controller DPA + Google Privacy Policy。"

[[product]]
id = "antigravity-consumer"
badge = "Antigravity 消费端"
category = "web"
plan_level = "any"

[product.training]
mark = "no"
mode = "opt_out"
