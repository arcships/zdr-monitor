[[product]]
id = "api-paid"
badge = "按量 API 付费档"
category = "api"
plan_level = "enterprise"
label = "Gemini API 的 Paid Services:经绑定有效 Cloud Billing 的 Cloud Project 访问 Gemini API,或以企业 Workspace 账号访问 AI Studio(Additional Terms 的定义);EEA/瑞士/UK 的免费额度也按本档条款处理。Google Cloud/Vertex 由另一套条款管辖,见 google-vertex。"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "training-paid-no-improve"

[[product.training.point]]
text = "Scope of this row: \"Your access to Gemini API is a 'Paid Service' only when accessing the API through a Cloud Project associated with an active billing account\"; on the AI Studio side an active Cloud Billing account or a Workspace enterprise account is enough. Everything below is scoped to Paid Services."
text_zh = "本行适用范围:经绑定有效 Cloud Billing 的 Cloud Project 访问 Gemini API,或以企业 Workspace 账号访问 AI Studio,才算 Paid Services。以下各条都限定在 Paid Services。"
anchor = "scope-paid-definition-api"

[[product.training.point]]
text = "EEA/Switzerland/UK carve-out: for users there the terms under \"How Google uses Your Data\" in \"Paid Services\" apply to all Services, including Google AI Studio and the unpaid quota in the Gemini API, even though they are offered free of charge — so this row's conclusion also covers the free quota in those countries."
text_zh = "EEA/瑞士/UK 例外:当地的免费额度也适用 Paid Services 的数据条款(含 AI Studio 与 Gemini API 免费额度),故本行结论同样覆盖这些国家的免费额度——当地不存在「免费档授权训练」这一档。"
anchor = "training-eea-ch-uk-paid-applies"

[[product.training.point]]
text = "Opt-in path 1 (logs contributed as datasets): with logging enabled, logs (requests, responses, metadata) put into a dataset and shared with Google are processed under the Unpaid Services data-use terms and \"may be used to improve model quality, and inform the training and evaluation of future models and services\" (docs/logs-policy). Logging is only available for billing-enabled projects, i.e. this tier."
text_zh = "opt-in 路径一(日志放进 dataset 分享给 Google):开启日志后,在 AI Studio 的 Logs and Datasets 里把日志(请求/响应/元数据)放进 dataset 并分享给 Google,该数据按 Unpaid Services 的数据使用条款处理,「may be used to improve model quality, and inform the training and evaluation of future models and services」(docs/logs-policy)。日志功能只对付费项目开放,故这条路径属本档。"
anchor = "training-optin-dataset"

[[product.training.point]]
text = "On the same path, human reviewers may read, annotate and process the API inputs and outputs you share, after the data is disconnected from your Google Account, API key and Cloud project (docs/logs-policy)."
text_zh = "同一路径上,人工审阅者可读取、标注、处理你分享的 API 输入输出(审阅前会与账号、API key、Cloud 项目断开)(docs/logs-policy)。"
anchor = "training-optin-human-review"

[[product.training.point]]
text = "Opt-in path 2 (AI Studio Inline Preference Voting): \"We record all prompts and responses, including any uploaded content, in the conversation you submitted feedback about\", and that feedback is used to provide, improve and develop Google products and services and machine learning technologies (docs/feedback-policies). The vote can be skipped when it appears, but that page does not distinguish Paid from Unpaid AI Studio — so the disclosed opt-in paths are two, not one."
text_zh = "opt-in 路径二(AI Studio 的 Inline Preference Voting):「We record all prompts and responses, including any uploaded content, in the conversation you submitted feedback about」,该反馈用于 provide/improve/develop Google 产品、服务与 ML 技术(docs/feedback-policies)。投票出现时可跳过,但该页未按 Paid/Unpaid 区分 AI Studio——故已披露的 opt-in 路径有两条,不是一条。"
anchor = "training-feedback-records"

[product.zdr]
mark = "yes"
mode = "opt_in"
anchor = "zdr-requires-actions"

[[product.zdr.point]]
text_zh = "付费档可达成零保留但须逐项规避:Interactions API 显式 store=false、不配 SessionResumptionConfig、手动删 File API 文件、不用 cached_content、避开 Grounding(30 天且不可关闭)"

[[product.zdr.point]]
text = "For guaranteed zero data retention or enterprise data processing agreements the docs point to Vertex AI (Gemini Enterprise Agent Platform) rather than the Gemini Developer API. The free quota has none of the mechanisms above; see api-unpaid."
text_zh = "保证式 ZDR/企业 DPA 需改用 Vertex AI(Gemini Enterprise Agent Platform),不是 Gemini Developer API。本行=付费档;免费额度档没有这套机制,见 api-unpaid。"
anchor = "zdr-guaranteed-needs-vertex"

[product.retention]
days = 55
object = "logs"
basis = "fixed_period"
anchor = "retention-abuse-logs-55-days"

[[product.retention.point]]
text = "Abuse-monitoring logs (prompts, contextual information, output) are kept for fifty-five (55) days; the same page's Scope says these guidelines apply to the use of the Gemini API and AI Studio, i.e. both tiers. That page publishes no deletion mechanism for these logs."
text_zh = "滥用监控日志(prompts/上下文/输出)保留 55 天(usage-policies;Scope 明确适用于 Gemini API 与 AI Studio);该页没有写这些日志的删除机制。"
anchor = "scope-gemini-api-and-ai-studio"

[[product.retention.point]]
text = "Do not read the \"automatically marked for deletion\" mechanism into these abuse-monitoring logs: that wording describes the AI Studio opt-in logs on docs/logs-policy, which the same page says are \"separate from any logs held solely for abuse monitoring purposes\"."
text_zh = "不要把「自动标记删除」这一机制套到滥用监控日志上:该措辞讲的是 docs/logs-policy 里 AI Studio 的 opt-in 日志,而该页明说两套日志是分开的:「separate from any logs held solely for abuse monitoring purposes」。"
anchor = "retention-logs-separate-from-abuse"

[[product.retention.point]]
text = "Content flagged by abuse detection can be assessed by authorized Google employees through an internal governance assessment and review management platform — this is how paid-tier request content can be seen by humans."
text_zh = "滥用监控中被标记的内容可由授权 Google 员工通过内部治理评估与复核管理平台查看与评估——付费档请求内容可能被人看到的路径,与免费档的人工审阅(见 api-unpaid)分开记。"
anchor = "retention-abuse-human-review"

[[product.retention.point]]
text = "That logged data is used solely for policy enforcement and is not used to train or fine-tune any AI/ML models besides those used specifically for policy enforcement."
text_zh = "该滥用监控日志仅用于政策执行与防违规,不用于训练或微调任何 AI/ML 模型(政策执行模型除外)。"
anchor = "training-abuse-logs-not-for-training"

[[product.retention.point]]
text = "Contract layer gives no number: \"For Paid Services, Google logs prompts and responses for a limited period of time, solely for detecting and preventing violations of the Prohibited Use Policy\" (terms, Paid Services section)."
text_zh = "合同层只写 a limited period of time(terms,Paid Services 一节),没有数字。"
anchor = "retention-paid-limited-period"

[[product.retention.point]]
text = "Opt-in logs (AI Studio Logs & Datasets) are retained for a default maximum of 55 days, after which they are automatically marked for deletion."
text_zh = "付费档 opt-in 日志(AI Studio Logs & Datasets)默认最长 55 天,之后自动标记删除(docs/logs-policy)"
anchor = "retention-logs-default-55"

[[product.retention.point]]
text = "That window can be updated in AI Studio to mark logs for deletion after 7, 14, 28 or 55 days."
text_zh = "该保留窗口可在 AI Studio 调整为 7/14/28/55 天(docs/logs-policy)"
anchor = "retention-logs-configurable"

[[product.retention.point]]
text = "Logs moved into a dataset leave the 55-day rule altogether: \"Logs stored in datasets don't have set retention periods.\" Once the dataset path is used, the period type is not a 55-day upper bound but no set period at all."
text_zh = "日志一旦放进 dataset 就没有设定保留期:「Logs stored in datasets don't have set retention periods.」(docs/logs-policy)——期限类型因此不是「上限 55 天」而是「无期限」。它与默认 55 天上限、可调 7/14/28/55 是同一份 docs/logs-policy 里的三件事,且这条 dataset 路径正是 training 里可用于训练的 opt-in 路径。"
anchor = "retention-datasets-no-period"

[[product.retention.point]]
text = "Grounding with Google Search stores prompts, contextual information and output for thirty (30) days and cannot be disabled; Grounding with Google Maps has its own thirty-day storage clause on the same page."
text_zh = "Grounding with Google Search 存 prompts/上下文/输出 30 天且不可关闭(terms);Grounding with Google Maps 同页另有 30 天存储条款。"
anchor = "retention-grounding-30-days"

[[product.retention.point]]
text_zh = "Live API 会话态最长 24h、File API 存至删除或过期、显式缓存按用户 ttl、调优内容随模型保留(docs/zdr)"

[[product.retention.point]]
text_zh = "隐式内存缓存 24h TTL。"

[product.processing_region]
codes = ["global"]
anchor = "region-any-country"

[[product.processing_region.point]]
text_zh = "无驻留承诺:付费档滥用监控日志 may be stored transiently or cached in any country in which Google or its agents maintain facilities。/docs/available-regions 只讲服务可用国家,不是处理地域承诺。"

[product.role]
kind = "processor"
anchor = "role-paid-processor-dpa"

[[product.role.point]]
text_zh = "Paid Services 为 processor:prompts/responses 按 Data Processing Addendum for Products Where Google is a Data Processor 处理,且 business.safety.google/services/ 的服务清单明列「Gemini API Paid Services」。其他数据(账号/计费/遥测)仍按 Controller-Controller DPA + Google Privacy Policy。免费额度档不在该清单内,见 api-unpaid。"

