[[product.processing_region.point]]
text = "Consumer-layer statement, not a residency option: the Antigravity Terms make the Google Privacy Policy part of the Agreement, and that policy says \"We maintain servers around the world and your information may be processed on servers located outside of the country where you live\" — the same kind of no-residency wording as the api tier's any-country clause. Its object is your information generally, not the request content specifically. antigravity.google/privacy is not declared as a source in this file and has no snapshot, so it is not used as evidence here."
text_zh = "消费者层的表述,不是可选驻留区域:Antigravity 条款把 Google 隐私政策列为 Agreement 的组成部分,该政策写「We maintain servers around the world and your information may be processed on servers located outside of the country where you live」——与 api 档 any-country 条款同性质的「无驻留承诺」;该句对象是「your information」整体,不区分账号数据与请求内容。antigravity.google/privacy 未在本文件登记、仓库内无快照,故不作为依据。"

