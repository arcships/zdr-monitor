text_zh = "条款只写会记录并存储 user data / interaction data / metadata / feedback,未给任何具体期限"

[[product.retention.point]]
text_zh = "用户可自行删除 Interactions 或发邮件请求删除,「unless and until you request deletion」即默认持续保留。"

[product.processing_region]
