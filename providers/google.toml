text_zh = "「To help with quality and improve our products, human reviewers may read, annotate, and process your API input and output」——审阅前会与账号、API key、Cloud 项目断开;条款因此明文要求不要向免费档提交敏感、机密或个人信息。"
anchor = "training-unpaid-human-review"

[[product.training.point]]
