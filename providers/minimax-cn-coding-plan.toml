[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "retention-shortest-necessary"

[[product.retention.point]]
text = "The Team tier publishes no separate retention clause; it shares the Open Platform Privacy Policy and the MiniMax Code Privacy Policy with the individual tier (Paid Services Agreement §5.1 puts Team in the same Token Plan product line), so the per-object picture below is the same as the individual tier."
text_zh = "团队版未公布独立保留条款，与个人档共用同一份开放平台隐私政策与 MiniMax Code 隐私政策（付费协议 5.1 把团队版列入同一 Token Plan 产品线），故下面的按对象图景与个人档相同。"
anchor = "scope-team-plan-line-5.1"

[[product.retention.point]]
text = "Personal information: retained only for the shortest time necessary to achieve the purpose, deleted or anonymized after expiry and after termination of the service; no quantified number of days. The collection table lists the data submitted in an API request as personal information, so request content falls inside this statement rather than having no period at all."
text_zh = "个人信息：仅为实现目的所必需的最短时间保留，超期后与终止服务后删除或匿名化，无量化天数。收集表把 API 场景提交的处理数据列为个人信息，故请求内容落在这条口径内，而非完全没有期限。"
anchor = "retention-shortest-necessary"

[[product.retention.point]]
text = "Request content itself: no separate quantified period is committed for the request body."
text_zh = "请求内容本体：未对请求正文单独承诺量化期限。"
anchor = "retention-necessary-period"

[[product.retention.point]]
text = "Uploaded media files: video_understanding video files retained for a maximum of 7 days."
text_zh = "上传媒体文件：video_understanding 视频文件最长保存 7 天。"
anchor = "retention-video-understanding-7d"

[[product.retention.point]]
text = "video_generation_input material valid for 7 days (after expiry a generation request returns file expired and the file must be re-uploaded)."
text_zh = "video_generation_input 素材有效期 7 天（过期后发起生成返回 file expired，需重新上传）。"
anchor = "retention-video-gen-input-7d"

[[product.retention.point]]
text = "Exception branch on the same row: a file that fails the specification check on upload returns 400 and is not retained."
text_zh = "同一行的例外分支：上传校验不合格返回 400 且不留存。"
anchor = "retention-upload-reject-400"

[[product.retention.point]]
text = "Still unquantified on the same page: no period is given for the voice_clone, prompt_audio or t2a_async_input purposes."
text_zh = "同页仍未量化：voice_clone、prompt_audio、t2a_async_input 三类 purpose 未给出期限。"
anchor = "retention-no-period-purposes"

[[product.retention.point]]
text = "Context / KV cache: the passive cache's expiry is adjusted automatically according to system load."
text_zh = "上下文/KV 缓存：被动缓存过期时间根据系统负载自动调整。"
anchor = "retention-cache-expiry"

[[product.retention.point]]
text = "Once anonymized there is no retention limit: personal information that has been anonymized may be used and circulated, and its storage and use need no further notice to or consent from the user."
text_zh = "匿名化后不受限：个人信息经匿名化处理后将可以使用及流通，其保存及使用无需另行通知和征得同意。"
anchor = "anonymized-free-reuse"

[[product.retention.point]]
text = "Exception (law enforcement): the User Agreement reserves the right to keep the relevant records and report to the competent authorities for conduct suspected of violating laws or of being illegal or criminal."
text_zh = "例外（执法）：用户协议保留对涉嫌违反法律法规、涉嫌违法犯罪的行为保存有关记录并依法向有关主管部门报告的权利。"
anchor = "retention-law-enforcement-records"

[[product.retention.point]]
text = "Exception (unpaid fees / breach): Open Platform User Agreement §4.3 lets the company delete some or all of the information and data the user stored or generated through use of the services; the Paid Services Agreement §8.3(3) only says the company has the right but not the obligation to retain user data."
text_zh = "例外（欠费/违约）：开放平台用户协议 4.3 允许公司在用户未及时足额付费时删除用户存储或产生的部分或全部信息和数据；付费协议 8.3(3) 只说公司对用户数据『有权利但无义务』保留。"
anchor = "retention-unpaid-deletion-4.3"

[[product.retention.point]]
text = "Disclaimer rather than a retention term: Open Platform User Agreement §9.4(3) does not warrant that customer data will not be lost or damaged."
text_zh = "免责声明而非保留条款：开放平台用户协议 9.4(3) 不保证『客户数据不会丢失或受损』。"
anchor = "retention-no-warranty-9.4"

