text_zh = "档位适用范围：付费协议 5.2——Token Plan 订阅的部分权益可在公司及其关联公司、公司合作伙伴运营的产品（如MiniMax Code）中使用；合作伙伴运营的产品未必沿用同一套数据规则，故只作范围线索。"
