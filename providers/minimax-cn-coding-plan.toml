searched = ["https://platform.minimax.cn/protocol/user-agreement", "https://platform.minimax.cn/protocol/privacy-policy", "https://platform.minimax.cn/protocol/paid-agreement", "https://agent.minimaxi.com/doc/zh/terms-of-service.html", "https://agent.minimaxi.com/doc/zh/privacy-policy.html", "https://platform.minimax.cn/docs/token-plan/intro", "https://platform.minimax.cn/docs/token-plan/faq", "https://platform.minimax.cn/subscribe/token-plan"]

[[product.zdr.point]]
