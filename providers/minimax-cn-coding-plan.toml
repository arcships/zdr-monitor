[[product.training.point]]
text = "MiniMax Code Privacy Policy (the official index page minimaxi.com/privacy-policy-v2-cn.html points the \"MiniMax Code Privacy Policy\" entry at code.minimaxi.com/doc/zh/privacy-policy.html, which 302-redirects to this page), §1.7.2 verbatim: \"Provided that the data has been processed with secure encryption technology, de-identified and cannot be used to re-identify a specific individual, we may analyse input content, output content and behavioural information and use them for model training, so as to continuously tune and improve model performance and the product experience.\" — after de-identification the data \"may\" be used for model training, with no off switch. The API side points the same way: Open Platform User Agreement §5.4 \"we will access and process customer data in accordance with this agreement for the purposes of providing MiniMax Open Platform services and improving algorithmic services\", and §6.3 \"provided the data is de-identified and cannot be used to re-identify a specific individual ... we may use the inputs collected by the service and the corresponding outputs for optimizing the services under this agreement and for statistical analysis, troubleshooting and security risk control\". Both are conditional (de-identified) grants, and none of the three China-site Open Platform agreements contains a \"not used for training\" commitment to the contrary. Value recorded on the conservative reading: \"may be used for model training / service optimization after de-identification\"."
text_zh = "MiniMax Code 隐私政策（官方索引页 minimaxi.com/privacy-policy-v2-cn.html 把『MiniMax Code 隐私政策』入口指定为 code.minimaxi.com/doc/zh/privacy-policy.html，302 到本页）1.7.2 逐字写：『在经安全加密技术处理、去标识化且无法重新识别特定个人的前提下，我们可能会将输入内容、输出内容、行为信息进行分析和用于模型训练，以不断调整优化模型效果和产品体验。』——去标识化后『可能』用于模型训练，无关闭开关。API 侧同向：开放平台用户协议 5.4『为提供MiniMax开放平台服务和提升算法服务之目的…访问和处理客户数据』、6.3『去标识化且无法重新识别特定个人的前提下…输入及对应输出，用于本协议下服务的优化以及统计分析、问题排查、安全风控』。两处均为有条件（去标识化）授权，且中国站三份开放平台协议全文无『不用于训练』的反向承诺。取值口径=按保守情形记『去标识化后可能用于模型训练/服务优化』。"

