[product.training]
mark = "no"
anchor = "training-model-training"

[[product.training.point]]
text = "MiniMax Code Privacy Policy (the official index page minimaxi.com/privacy-policy-v2-cn.html points the \"MiniMax Code Privacy Policy\" entry at code.minimaxi.com/doc/zh/privacy-policy.html, which 302-redirects to this page), §1.7.2 verbatim: \"Provided that the data has been processed with secure encryption technology, de-identified and cannot be used to re-identify a specific individual, we may analyse input content, output content and behavioural information and use them for model training, so as to continuously tune and improve model performance and the product experience.\" — after de-identification the data \"may\" be used for model training, with no off switch. The API side points the same way: Open Platform User Agreement §5.4 \"we will access and process customer data in accordance with this agreement for the purposes of providing MiniMax Open Platform services and improving algorithmic services\", and §6.3 \"provided the data is de-identified and cannot be used to re-identify a specific individual ... we may use the inputs collected by the service and the corresponding outputs for optimizing the services under this agreement and for statistical analysis, troubleshooting and security risk control\". Both are conditional (de-identified) grants, and none of the three China-site Open Platform agreements contains a \"not used for training\" commitment to the contrary. Value recorded on the conservative reading: \"may be used for model training / service optimization after de-identification\"."
text_zh = "MiniMax Code 隐私政策（官方索引页 minimaxi.com/privacy-policy-v2-cn.html 把『MiniMax Code 隐私政策』入口指定为 code.minimaxi.com/doc/zh/privacy-policy.html，302 到本页）1.7.2 逐字写：『在经安全加密技术处理、去标识化且无法重新识别特定个人的前提下，我们可能会将输入内容、输出内容、行为信息进行分析和用于模型训练，以不断调整优化模型效果和产品体验。』——去标识化后『可能』用于模型训练，无关闭开关。API 侧同向：开放平台用户协议 5.4『为提供MiniMax开放平台服务和提升算法服务之目的…访问和处理客户数据』、6.3『去标识化且无法重新识别特定个人的前提下…输入及对应输出，用于本协议下服务的优化以及统计分析、问题排查、安全风控』。两处均为有条件（去标识化）授权，且中国站三份开放平台协议全文无『不用于训练』的反向承诺。取值口径=按保守情形记『去标识化后可能用于模型训练/服务优化』。"

[[product.training.point]]
text = "Contract layer, which outranks the consumer privacy policy: MiniMax User Agreement Article 5(4) — for input content and for output content the user holds IP rights in, the user \"agrees to grant us and/or our affiliates a free, worldwide right of use that does not require attributing you, to use such content to the extent permitted by law, e.g. for improving and optimising products and services, and for brand promotion\". The object is input content, and under the house rule that \"used to improve the service\" counts as training this is same-direction evidence for training = no."
text_zh = "合同层，权威性高于消费隐私政策：《MiniMax用户协议》第五条 4——对于输入内容和您享有知识产权等权益的输出内容，您同意授予我们和/或关联方一项免费的、无需标注您个人身份的、全球范围内的使用权，在法律允许的范围内使用该等内容，例如用于产品和服务的提升和优化、品牌推广和宣传。对象是输入内容，按『用于改进服务算训练』的口径，构成 training=no 的同向证据。"
anchor = "training-ip-grant-5.4"

[[product.training.point]]
text = "Opposite-direction wording on the same page, kept side by side and not reconciled: Article 5(5) — \"in order to protect your personal information, we will not ask you to authorise us, nor ask you to authorise us to use for other purposes, any content that is your personal information\". Two limits: the subject is content that is the user's personal information, and the sentence only says no further authorisation is sought; it does not carve model training out, so it must not be read as a \"not used for training\" commitment."
text_zh = "同一页的反向表述，并列保留、不调和：第五条 5『为了保护您的个人信息，属于您个人信息的相关内容我们都将不要求您对我们进行授权或要求您授权我们用于其他用途』。两个限定：主语是『属于您个人信息的相关内容』；句子说的是不另行索取授权，并未对模型训练作豁免，不能读成『不用于训练』的承诺。"
anchor = "conflict-personal-info-not-licensed"

[[product.training.point]]
text = "Condition attached to the API-side clause: Open Platform User Agreement §5.4 last sentence — \"except where needed for Party A's use of the MiniMax Open Platform services and where laws and regulations provide otherwise, without Party A's consent Party B will not access or use Party A's data\". It restricts access to and use of Party A's data and is conditional on Party A's consent; it is not a \"not used for training\" commitment."
text_zh = "API 侧同段的条件：开放平台用户协议 5.4 末句『除因甲方使用MiniMax开放平台服务所需及法律法规另有规定外，未经甲方同意，乙方不会接触或使用甲方数据』。它限制的是对『甲方数据』的接触与使用、且以甲方同意为条件，不构成『不用于训练』的承诺。"
anchor = "training-restriction-without-consent-5.4"

[[product.training.point]]
text = "De-identified data may be put to commercial use, with no off switch: Open Platform Privacy Policy §1(5)1 — \"we have the right to use information that has been de-identified; without disclosing your personal information, we have the right to analyse the user database and make commercial use of it\". Broader than the §6.3 \"service optimisation\" wording, and like §6.3 and User Agreement §5.4 it is conditional on de-identification. The same policy §3(2)4 adds (anchor anonymized-free-reuse) that anonymized personal information \"may be used and circulated\", with no further notice to or consent from the user needed for its storage and use — one of the bases for training = no here."
text_zh = "去标识化信息可商业化利用，无关闭开关：开放平台隐私政策一(五)1『我们有权使用已经去标识化的信息；在不透露您个人信息的前提下，我们有权对用户数据库进行分析并予以商业化的利用』。比用户协议 6.3 的『服务优化』更宽；与 6.3、5.4 一样以去标识化为条件。同一政策三(二)4 另规定（锚点 anonymized-free-reuse）匿名化后的个人信息『可以使用及流通』，其保存及使用无需另行通知和征得同意——这是本档 training=no 的一层依据。"
anchor = "anonymized-commercial-use"

