[[product.zdr.point]]
text = "None of the current China-site agreements contains a zero-retention commitment of the \"prompts/responses are not stored once the request has been processed\" kind, and there is no application path for zero retention. The two closest passages are not ZDR: the Open Platform Privacy Policy says \"we will not bind or create any association between your conversations and the personal information you gave when registering for or applying to the Open Platform ... conversation content that may be your personal information is filtered, deleted and not stored\" — the subject is personal information, not request content as a whole"
text_zh = "中国站现行协议全文均无『请求处理完成后不存储 prompt/response』式零保留承诺，也无零保留申请入口。最接近的两处都不是 ZDR：开放平台隐私政策『我们不会将您的对话和您注册、申请开放平台时的个人信息进行绑定或建立任何关联…对可能是您的个人信息…过滤、删除并不予保存』——主语是个人信息，不是请求内容整体"

[[product.zdr.point]]
text = "MiniMax Code Privacy Policy §3.1.2: \"we retain your personal information only for the period necessary for the purpose of providing the service\" — retention for a necessary period, which is retention rather than zero retention. Scope searched: the China-site sitemap.xml registers only 4 agreement pages (user-agreement / privacy-policy / paid-agreement / auto-renewal); probes of /protocol/token-plan-terms and /protocol/terms both returned HTTP 404"
text_zh = "MiniMax Code 隐私政策 3.1.2『仅在为提供服务之目的所必需的期间内保留您的个人信息』——必要期间保留，属保留而非零保留。穷尽范围：中国站 sitemap.xml 登记的协议页只有 4 个（user-agreement / privacy-policy / paid-agreement / auto-renewal），另探测 /protocol/token-plan-terms、/protocol/terms 均为 HTTP 404"

[[product.zdr.point]]
text = "The documentation site has no dedicated data-security page (404)."
text_zh = "文档站无 data-security 专题页（404）。"

[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "retention-shortest-necessary"

[[product.retention.point]]
text = "Recorded separately by object. (1) Personal information — Open Platform Privacy Policy §3(2)2: \"we retain your personal information only for the shortest time necessary to achieve the purpose\" (ceiling-style, no quantified number of days). The same policy's collection table (§1(2)) lists, for the \"API call\" scenario, \"the data submitted in that request\" as the personal information collected (see the role table anchor role-api-processor), so on the vendor's own wording request content falls inside the object of this retention statement: the request body sits on an unquantified necessary-period basis, not on \"no period at all\"."
text_zh = "按对象分开记。①个人信息——开放平台隐私政策三(二)2『我们仅为实现目的所必需的最短时间保留您的个人信息』（上限口径，无量化天数）。同一政策一(二)收集表把『调用API』场景收集的『该次提交的处理数据』列入个人信息（见角色表锚点 role-api-processor），即请求内容在厂商自己的口径里落在这条保留承诺的对象范围内——请求正文是未量化的必要期间口径，不是『完全没有期限』。"
anchor = "retention-shortest-necessary"

[[product.retention.point]]
text = "Once that period is exceeded: \"once your personal information exceeds the storage period we have, we will delete or anonymize your personal information\"."
text_zh = "超出该期限后：『当您的个人信息超出我们所保存的期限后，我们会对您的个人信息进行删除或匿名化处理』。"
anchor = "retention-delete-anonymize"

[[product.retention.point]]
text = "On termination of the service: \"if we terminate the service or operations, we will notify you at least 30 days in advance and delete or anonymize your personal information after the termination\"."
text_zh = "服务终止时：『如果我们终止服务或运营，我们会至少提前三十天通知您，并在终止服务或运营后对您的个人信息进行删除或匿名化处理』。"
anchor = "retention-termination-service"

[[product.retention.point]]
text = "MiniMax Code Privacy Policy §3.1.2 says the same (retention for the necessary period; deletion, destruction or anonymization on account cancellation, expiry of the period, or when no longer needed) — ceiling-style, no quantified number of days. (2) Request content itself (inputs and outputs) — the agreements commit no separate quantified period for the request body; the period-bearing statements are the necessary-period wording above and the object-level periods below."
text_zh = "MiniMax Code 隐私政策 3.1.2 同口径（必要期间保留；注销/期限届满/不再需要时删除、销毁或匿名化），上限口径、无量化天数。②请求内容本体（输入输出）——协议未对请求正文单独给出量化期限；带期限的表述只有上面的必要期间口径与下面按对象列出的期限。"
anchor = "retention-necessary-period"

[[product.retention.point]]
text = "User Agreement §3.13 only provides that for \"services that include a storage function\", data is kept for the period set by that service's rules after the service expires or terminates and is deleted when the period ends"
text_zh = "用户协议 3.13 仅规定『含存储功能的服务』到期或终止后按服务规则保留相应期限、届满删除"
anchor = "retention-storage-service-3.13"

[[product.retention.point]]
text = "(3) Uploaded media files, quantified: the Files API docs give video_understanding video files a \"maximum storage time of 7 days\"."
text_zh = "(3)上传媒体文件，有量化期限：Files API 文档给出 video_understanding 视频文件『最长保存时间为 7 天』。"
anchor = "retention-video-understanding-7d"

[[product.retention.point]]
text = "video_generation_input material is \"valid for 7 days (after expiry a generation request returns file expired and the file must be re-uploaded)\"."
text_zh = "video_generation_input 素材『有效期 7 天（过期后发起生成返回 file expired，需重新上传）』。"
anchor = "retention-video-gen-input-7d"

[[product.retention.point]]
text = "Exception branch on the same row: the file \"is validated against the specification on upload; if it fails the check the API returns 400 and the file is not retained\" — the 7-day period only covers files that pass validation."
text_zh = "同一行的例外分支：『上传即校验规格，不合格返回 400 且不留存』——7 天期限只覆盖通过校验的文件。"
anchor = "retention-upload-reject-400"

[[product.retention.point]]
text = "Still unquantified on the same page: no period is given for the voice_clone, prompt_audio or t2a_async_input purposes."
text_zh = "同页仍未量化：voice_clone、prompt_audio、t2a_async_input 三类 purpose 未给出期限。"
anchor = "retention-no-period-purposes"

[[product.retention.point]]
text = "(4) Context / KV cache: the passive (automatic) cache's expiry is \"adjusted automatically according to system load\"."
text_zh = "(4)上下文/KV 缓存：被动（自动）缓存过期时间『根据系统负载自动调整』。"
anchor = "retention-cache-expiry"

[[product.retention.point]]
text = "The Anthropic-style explicit cache has a \"5 min expiry, automatically renewed with continued use\"."
text_zh = "Anthropic 主动缓存『5min过期时间，持续使用会自动续期』。"
anchor = "retention-anthropic-cache-5min"

[[product.retention.point]]
text = "Once anonymized there is no retention limit: Open Platform Privacy Policy §3(2)4 — \"your personal information, once anonymized, may be used and circulated, and we need no further notice to you or consent from you for the storage and use of such anonymized information\"."
text_zh = "匿名化后不受限：开放平台隐私政策三(二)4『您的个人信息经匿名化处理后将可以使用及流通，我们对此类匿名化处理后的信息的保存及使用无需另行通知和征得您的同意』。"
anchor = "anonymized-free-reuse"

[[product.retention.point]]
text = "Exception (law enforcement): MiniMax User Agreement Article 6(2) — \"for conduct suspected of violating laws or regulations or suspected of being illegal or criminal, we will keep the relevant records and have the right to report to the competent authorities in accordance with law, cooperate with their investigations, and report the case to the public security authorities\". It concerns keeping records for law-enforcement purposes, not a period commitment for request or response content."
text_zh = "例外（执法）：《MiniMax用户协议》第六条 2『对涉嫌违反法律法规、涉嫌违法犯罪的行为，我们将保存有关记录，并有权依法向有关主管部门报告、配合有关主管部门调查、向公安机关报案等』。这是为执法目的保存有关记录，不是对输入输出正文的期限承诺。"
anchor = "retention-law-enforcement-records"

[[product.retention.point]]
text = "Exception (unpaid fees / breach): Open Platform User Agreement §4.3 — where the user fails to pay in time and in full, the company may \"delete some or all of the information and data the user stored or generated through use of the MiniMax Open Platform services\"."
text_zh = "例外（欠费/违约）：开放平台用户协议 4.3——用户未及时足额支付费用的，公司可『删除用户基于使用MiniMax开放平台服务而存储或产生的部分或全部信息和数据』。"
anchor = "retention-unpaid-deletion-4.3"

[[product.retention.point]]
text = "Paid Services Agreement §8.3(3): after termination of the service the company \"has the right but not the obligation\" to retain user data, which is not a commitment. Read together with §4.3 above, the tier gives no guarantee that data survives non-payment or termination."
text_zh = "付费协议 8.3(3)：服务终止后公司对用户数据『有权利但无义务』保留，不是承诺。与上面的用户协议 4.3 并列读，本档在欠费或终止情形下对数据存续无保障。"
anchor = "retention-termination-8.3"

[[product.retention.point]]
text = "Disclaimer rather than a retention term: Open Platform User Agreement §9.4(3) lists among the things the company does not warrant that \"customer data will not be lost or damaged\" — a data-durability disclaimer, recorded here because it borders on the retention story and must not be read as a period statement."
text_zh = "免责声明而非保留条款：开放平台用户协议 9.4(3) 在不作保证的清单中列有『客户数据不会丢失或受损』——数据存续免责声明，因与保留叙事相邻而并列记录，不能读成期限口径。"
anchor = "retention-no-warranty-9.4"

[product.processing_region]
codes = ["CN"]
anchor = "region-in-china"

[[product.processing_region.point]]
text = "Open Platform Privacy Policy: \"we store personal information collected within the People's Republic of China inside the People's Republic of China\""
text_zh = "开放平台隐私政策『我们将在中华人民共和国境内收集的个人信息存储在中华人民共和国境内』"

[[product.processing_region.point]]
text = "MiniMax Code Privacy Policy §3.1.1: \"your personal information collected and generated in the course of domestic operations is stored within the People's Republic of China\""
text_zh = "MiniMax Code 隐私政策 3.1.1『将在境内运营过程中收集和产生的您的个人信息存储于中华人民共和国境内』"

[[product.processing_region.point]]
text = "User Agreement §3.16 requires users to \"use the services within mainland China (for the purposes of this agreement, excluding Hong Kong, Macao and the Taiwan region)\" — all three point the same way. But each is limited to \"personal information\" as its subject; there is no separate statement about the processing region of API request content itself"
text_zh = "用户协议 3.16 要求用户『在中国境内（不含香港、澳门、中国台湾地区）使用服务』——三处同向。但主语均限定为『个人信息』，未见针对 API 请求内容本体处理地域的独立声明"

[[product.processing_region.point]]
text = "The privacy policy separately discloses that \"your conversation content is transmitted to our cloud servers and processed by our cloud service provider\" (the provider's jurisdiction is not named), hence confidence=medium."
text_zh = "隐私政策另披露『将您的对话内容传输至我们的云服务器由我们的云服务供应商进行计算处理』（未指明该供应商所在法域），故 confidence=medium。"

[product.role]
kind = "processor"
anchor = "dpa-role-entrusted"

[[product.role.point]]
text = "Recorded separately by mode of use, both with source text. (1) When the subscription quota is used inside the official Agent product MiniMax Code — the \"Data Processing\" clause (DPA) in Article 7 of the MiniMax User Agreement: \"You confirm and agree that, as between you and us, you are the data handler and the entrusting party, and we, as the entrusted party you have engaged, assist you in processing data according to your instructions and purposes\", and the entrusted party \"may process data only according to your instructions and purposes\", with this agreement and the service rules constituting the \"complete instructions\" — MiniMax is the entrusted party. Scope of this half: the DPA governs \"task data\" arising from your use of the Agent, so the processor framing holds only on the Agent-product path. (2) When the subscription key (sk-cp) calls the Open Platform API directly, the Open Platform agreements govern, and the role table in the Open Platform Privacy Policy marks the \"API call\" scenario as \"personal information handler\" — the opposite direction (see the points below)."
text_zh = "按使用方式分开记，两者都有原文。①在官方 Agent 应用 MiniMax Code 中使用订阅额度时——《MiniMax用户协议》第七条『数据处理』(DPA)：『在您与我们之间，您是数据处理者和委托方，根据您的指示和目的，我们作为接受您委托的受托方，协助您处理数据』，且受托方『只能依照您的指示和目的处理数据』，本协议与服务规则构成『完整的指示』——MiniMax 为受托方。这半边的适用范围：该条约束的是『您使用Agent所产生的任务数据』，受托方定位只在 Agent 产品这条路径上成立。②订阅 Key（sk-cp）直接调用开放平台 API 时，适用开放平台协议体系，其隐私政策角色表把『调用API』场景标注为『个人信息处理者』，方向相反（见下列各条）。"
anchor = "dpa-role-entrusted"

[[product.role.point]]
text = "Scope of the entrusted-party framing: the DPA in Article 7 defines \"task data\" as the data you input, upload or provide to the Agent in order to assign tasks, plus the data processed by the Agent while you use or run its deliverables — i.e. it applies to use of the Agent, not to direct API calls made with the subscription key."
text_zh = "受托方定位的适用范围：第七条 DPA 把『任务数据』定义为『您为向Agent下达任务而输入、上传、提供给Agent的所有数据，以及您对Agent的交付成果进行使用、运行（如涉及）期间经由Agent处理的所有数据』——即适用于 Agent 使用场景，不适用于订阅 Key 直连 API。"
anchor = "dpa-task-data-def"

[[product.role.point]]
text = "Opposite direction on the API path: the collection and role table in the Open Platform Privacy Policy marks the \"API call\" scenario as \"personal information handler\" — the company treats itself as the handler there, not as the entrusted party."
text_zh = "API 路径上的相反事实：开放平台隐私政策收集与角色表把『调用API』场景标注为『个人信息处理者』——该路径上公司自认处理者，而非受托方。"
anchor = "role-api-processor"

[[product.role.point]]
text = "Same table, the other row: only \"integrating our SDK in other application scenarios\" (enterprise SDK integration) is marked \"entrusted party for personal information processing\"."
text_zh = "同表另一行：只有『在其他应用场景下接入我们的SDK』（企业 SDK 接入）一行的角色是『个人信息处理受托方』。"
anchor = "role-sdk-entrusted"

[[product.role.point]]
text = "Scenario limit: for user-created spaces, MiniMax User Agreement Article 4(6)(1) — \"the company acts only as a platform service provider, is not the operator of any space, nor the publisher of any content, data or materials you upload, publish or display in your space; as the space owner you are the independent provider and controller of the space and all its content\". This applies only to the user-created space feature and is not extended to Agent sessions or API calls."
text_zh = "场景限定：用户创建的空间——《MiniMax用户协议》第四条 6(1)『公司仅作为平台服务提供商，并非任何空间的运营方，亦非您空间内上传、发布或展示的任何内容、数据和资料…的发布方。作为空间所有者，您是该空间及其所有内容的独立提供者和控制者』。只适用于『用户创建的空间』这一功能，不外推到 Agent 会话或 API 调用。"
anchor = "role-space-controller-4.6"

[[product.role.point]]
text = "Open Platform User Agreement §5.1/§5.2 require the customer to obtain the end user's authorization before transmitting data to MiniMax for processing. The same company assigns itself different roles in different scenarios; recorded separately as written, without reconciling them."
text_zh = "开放平台用户协议 5.1/5.2 要求客户自行取得终端用户授权后再把数据传输给 MiniMax 处理。同一家在不同场景自认角色不同，如实分记不调和。"
anchor = "role-consent-5.2"

[[product.role.point]]
text = "Scope of the tier: Paid Services Agreement §5.2 — \"some of the entitlements relating to your Token Plan subscription may be used in products operated by the company, its affiliates or the company's partners (such as MiniMax Code)\". Where an entitlement is delivered by a partner-operated product, its data-processing rules need not be identical to MiniMax's own terms; this is recorded as a scope clue only, and no conclusion is inferred from it for any hop."
text_zh = "档位适用范围：付费协议 5.2『您通过TokenPlan订阅的相关权益，部分权益可在公司及其关联公司、公司合作伙伴运营的产品（如MiniMax Code）中使用』。若某能力由合作伙伴运营的产品承载，其数据处理规则未必等同 MiniMax 自家条款；此处只作范围线索记录，不据此推断任何一跳的结论。"
anchor = "scope-token-plan-partner-products"

[[product]]
id = "coding-plan-team"
badge = "Token Plan 团队版"
category = "coding_plan"
plan_level = "team"
label = "MiniMax Token Plan 中国站团队版"

[product.training]
mark = "no"
anchor = "training-model-training"

[[product.training.point]]
text = "The Team tier shares one set of documents with the individual tier: Paid Services Agreement §5.1 lists \"Plus, Max, Ultra, Team and others\" in the same Token Plan product line and sets no team-specific data clause, so the same de-identified training grant applies."
text_zh = "《MiniMax开放平台付费协议》5.1 将团队版与 Plus/Max/Ultra 并列为同一 Token Plan 产品线，未规定团队版数据例外；适用同一协议与隐私政策，去标识化后的输入、输出和行为信息可能用于模型训练。"
anchor = "scope-team-plan-line-5.1"

[[product.training.point]]
text = "Contract layer, same as the individual tier: MiniMax User Agreement Article 5(4) grants the company and/or its affiliates a free, worldwide right to use input content and output content the user holds rights in, \"e.g. for improving and optimising products and services, and for brand promotion\" — same-direction evidence for training = no."
text_zh = "合同层，同个人档：《MiniMax用户协议》第五条 4 授予我们和/或关联方对输入内容与输出内容的使用权，例如『用于产品和服务的提升和优化、品牌推广和宣传』——training=no 的同向证据。"
anchor = "training-ip-grant-5.4"

[[product.training.point]]
text = "Opposite-direction wording on the same page (kept side by side, not reconciled): Article 5(5) says the company will not ask the user to authorise content that is the user's personal information for other purposes — it does not carve model training out."
text_zh = "同一页的反向表述（并列保留，不调和）：第五条 5 称对『属于您个人信息的相关内容』不要求授权用于其他用途——并未对模型训练作豁免。"
anchor = "conflict-personal-info-not-licensed"

[[product.training.point]]
text = "Condition attached to the API-side clause: Open Platform User Agreement §5.4 last sentence — without Party A's consent Party B will not access or use Party A's data, except where needed for Party A's use of the services or where law provides otherwise; a condition, not a \"not used for training\" commitment."
text_zh = "API 侧同段的条件：开放平台用户协议 5.4 末句『未经甲方同意，乙方不会接触或使用甲方数据』（除因甲方使用服务所需及法律法规另有规定外）——是条件限制，不是『不用于训练』的承诺。"
anchor = "training-restriction-without-consent-5.4"

[[product.training.point]]
text = "De-identified data may be put to commercial use: Open Platform Privacy Policy §1(5)1 — the company has the right to use de-identified information and to analyse the user database and make commercial use of it without disclosing personal information; §3(2)4 adds (anchor anonymized-free-reuse) that anonymized personal information may be used and circulated with no further notice or consent."
text_zh = "去标识化信息可商业化利用：开放平台隐私政策一(五)1『我们有权使用已经去标识化的信息；在不透露您个人信息的前提下，我们有权对用户数据库进行分析并予以商业化的利用』；三(二)4 另规定（锚点 anonymized-free-reuse）匿名化后的个人信息可以使用及流通、其保存及使用无需另行通知和征得同意。"
anchor = "anonymized-commercial-use"

