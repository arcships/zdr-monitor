[[product.zdr.point]]
text = "None of the current China-site agreements contains a zero-retention commitment of the \"prompts/responses are not stored once the request has been processed\" kind, and there is no application path for zero retention. The two closest passages are not ZDR: the Open Platform Privacy Policy says \"we will not bind or create any association between your conversations and the personal information you gave when registering for or applying to the Open Platform ... conversation content that may be your personal information is filtered, deleted and not stored\" — the subject is personal information, not request content as a whole"
text_zh = "中国站现行协议全文均无『请求处理完成后不存储 prompt/response』式零保留承诺，也无零保留申请入口。最接近的两处都不是 ZDR：开放平台隐私政策『我们不会将您的对话和您注册、申请开放平台时的个人信息进行绑定或建立任何关联…对可能是您的个人信息…过滤、删除并不予保存』——主语是个人信息，不是请求内容整体"

[[product.zdr.point]]
text = "MiniMax Code Privacy Policy §3.1.2: \"we retain your personal information only for the period necessary for the purpose of providing the service\" — retention for a necessary period, which is retention rather than zero retention. Scope searched: the China-site sitemap.xml registers only 4 agreement pages (user-agreement / privacy-policy / paid-agreement / auto-renewal); probes of /protocol/token-plan-terms and /protocol/terms both returned HTTP 404"
text_zh = "MiniMax Code 隐私政策 3.1.2『仅在为提供服务之目的所必需的期间内保留您的个人信息』——必要期间保留，属保留而非零保留。穷尽范围：中国站 sitemap.xml 登记的协议页只有 4 个（user-agreement / privacy-policy / paid-agreement / auto-renewal），另探测 /protocol/token-plan-terms、/protocol/terms 均为 HTTP 404"

[[product.zdr.point]]
text = "The documentation site has no dedicated data-security page (404)."
text_zh = "文档站无 data-security 专题页（404）。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "retention-shortest-necessary"

[[product.retention.point]]
text = "Recorded separately by object: (1) Personal information — Open Platform Privacy Policy \"we retain your personal information only for the shortest time necessary to achieve the purpose\", deleted or anonymized once that period is exceeded, and deleted or anonymized after the service is terminated"
text_zh = "按对象分开记：①个人信息——开放平台隐私政策『我们仅为实现目的所必需的最短时间保留您的个人信息』，超期后删除或匿名化，终止服务后删除或匿名化"

[[product.retention.point]]
text = "MiniMax Code Privacy Policy §3.1.2 says the same (retention for the necessary period; deletion, destruction or anonymization on account cancellation, expiry of the period, or when no longer needed). Both are ceiling-style statements with no quantified number of days. (2) Request content itself (inputs and outputs) — no retention period committed"
text_zh = "MiniMax Code 隐私政策 3.1.2 同口径（必要期间保留，注销/期限届满/不再需要时删除、销毁或匿名化）。均为上限口径，无量化天数。②请求内容本体（输入输出）——无保留期限承诺"

[[product.retention.point]]
text = "User Agreement §3.13 only provides that for \"services that include a storage function\", data is kept for the period set by that service's rules after the service expires or terminates and is deleted when the period ends"
text_zh = "用户协议 3.13 仅规定『含存储功能的服务』到期或终止后按服务规则保留相应期限、届满删除"

[[product.retention.point]]
text = "Paid Services Agreement §8.3(3): after termination of the service the company \"has the right but not the obligation\" to retain user data, which is not a commitment. (3) Uploaded media files — the Files API docs give quantified periods: video_understanding video files have a \"maximum storage time of 7 days\", and video_generation_input is \"valid for 7 days (after expiry a generation request returns file expired and the file must be re-uploaded)\". (4) Context / KV cache — the passive cache's expiry is \"adjusted automatically according to system load\", and the Anthropic-style explicit cache has a \"5 min expiry, automatically renewed with continued use\"."
text_zh = "付费协议 8.3(3) 服务终止后对用户数据『有权利但无义务』保留，不是承诺。③上传媒体文件——Files API 文档给出量化期限：video_understanding 视频文件『最长保存时间为 7 天』，video_generation_input『有效期 7 天（过期后发起生成返回 file expired，需重新上传）』。④上下文/KV 缓存——被动缓存过期时间『根据系统负载自动调整』，Anthropic 主动缓存『5min过期时间，持续使用会自动续期』。"

[product.processing_region]
codes = ["CN"]
anchor = "region-in-china"

[[product.processing_region.point]]
text = "Open Platform Privacy Policy: \"we store personal information collected within the People's Republic of China inside the People's Republic of China\""
text_zh = "开放平台隐私政策『我们将在中华人民共和国境内收集的个人信息存储在中华人民共和国境内』"

[[product.processing_region.point]]
text = "MiniMax Code Privacy Policy §3.1.1: \"your personal information collected and generated in the course of domestic operations is stored within the People's Republic of China\""
text_zh = "MiniMax Code 隐私政策 3.1.1『将在境内运营过程中收集和产生的您的个人信息存储于中华人民共和国境内』"

[[product.processing_region.point]]
text = "User Agreement §3.16 requires users to \"use the services within mainland China (for the purposes of this agreement, excluding Hong Kong, Macao and the Taiwan region)\" — all three point the same way. But each is limited to \"personal information\" as its subject; there is no separate statement about the processing region of API request content itself"
text_zh = "用户协议 3.16 要求用户『在中国境内（不含香港、澳门、中国台湾地区）使用服务』——三处同向。但主语均限定为『个人信息』，未见针对 API 请求内容本体处理地域的独立声明"

[[product.processing_region.point]]
text = "The privacy policy separately discloses that \"your conversation content is transmitted to our cloud servers and processed by our cloud service provider\" (the provider's jurisdiction is not named), hence confidence=medium."
text_zh = "隐私政策另披露『将您的对话内容传输至我们的云服务器由我们的云服务供应商进行计算处理』（未指明该供应商所在法域），故 confidence=medium。"

[product.role]
kind = "processor"
anchor = "dpa-role-entrusted"

[[product.role.point]]
text = "Recorded separately by mode of use, both with source text: (1) When the subscription quota is used inside the official Agent product MiniMax Code — the \"Data Processing\" clause (DPA) in Article 7 of the MiniMax User Agreement: \"You confirm and agree that, as between you and us, you are the data handler and the entrusting party, and we, as the entrusted party you have engaged, assist you in processing data according to your instructions and purposes\", and the entrusted party \"may process data only according to your instructions and purposes\", with this agreement and the service rules constituting the \"complete instructions\" — MiniMax is the entrusted party. (2) When the subscription key (sk-cp) calls the Open Platform API directly — the role table in the Open Platform Privacy Policy labels the \"API call\" scenario \"personal information handler\" and the \"enterprise SDK integration\" scenario \"entrusted party for personal information processing\""
text_zh = "按使用方式分开记，两者都有原文：①在官方 Agent 应用 MiniMax Code 中使用订阅额度时——《MiniMax用户协议》第七条『数据处理』(DPA)：『在您与我们之间，您是数据处理者和委托方，根据您的指示和目的，我们作为接受您委托的受托方，协助您处理数据』，且受托方『只能依照您的指示和目的处理数据』，本协议与服务规则构成『完整的指示』——MiniMax 为受托方。②订阅 Key（sk-cp）直接调用开放平台 API 时——开放平台隐私政策角色表把『调用API』场景标注为『个人信息处理者』、『企业 SDK 接入』场景标注为『个人信息处理受托方』"

[[product.role.point]]
text = "Open Platform User Agreement §5.1/§5.2 require the customer to obtain the end user's authorization before transmitting data to MiniMax for processing. The same company assigns itself different roles in different scenarios; recorded separately as written, without reconciling them."
text_zh = "开放平台用户协议 5.1/5.2 要求客户自行取得终端用户授权后再把数据传输给 MiniMax 处理。同一家在不同场景自认角色不同，如实分记不调和。"

