name = "GitHub Copilot"
line = "github-copilot"
site = "global"
entity = "GitHub, Inc."
endpoint = ""
doc = "https://github.com/customer-terms/github-generative-ai-services-terms"
plan_levels = ["free", "individual", "team", "enterprise"]

[[source]]
url = "https://copilot.github.trust.page/faq"
fetch = "browser"
channel = "enterprise_privacy_faq"
tier = "core"
note = "GitHub Copilot Trust Center FAQ(页面标题「github.com Trust Center」，站点为 GitHub 官方 trust.page 域，导航含 Overview/Resources/FAQ/Updates/Media)。主体是面向 Copilot Business / Enterprise 客户的问答，同时含个人订阅档的专门段落(如「In addition,for Individual subscribers only:GitHub may use Copilot interaction data…」)。本家唯一给出量化保留期限的官方页：IDE 路径输入输出默认不留存、其他访问路径默认最多 28 天、User Engagement Data 两年、Copilot Vision 图片 48 小时(被标记 30 天)、Coding Agent 会话日志随账户存续。也是 role(「GitHub acts primarily as a data processor」)与上游模型商(Anthropic/Google 不训练不留存)的官方依据。注意该页「Does GitHub use Copilot Individual data to train AI models?」一条的答案文本被渲染成商业档答案(与个人档段落自相矛盾)，属页面自身缺陷，见 notes。"

[[source]]
url = "https://docs.github.com/en/copilot/reference/ai-models/model-hosting"
channel = "developer_data"
tier = "core"
note = "GitHub Docs 参考页《Hosting of models for GitHub Copilot》。逐模型族说明由谁托管、数据流向谁、ZDR 覆盖与例外，是本家 zdr 与 processing_region 的主来源，也是「个人档 vs 商业档」分档表述最直接的官方页(同一段里先写「GitHub does not use Copilot Business or Copilot Enterprise customer data to train AI models」，紧接着写个人订阅档「GitHub may use Copilot interaction data…to train and improve AI models」，并给出退出开关的文档入口)。覆盖 OpenAI / Anthropic / Google / xAI / Microsoft(MAI) / 开源权重(Kimi) 六类托管，含 Azure、AWS、GCP、xAI、Fireworks AI 等上游。"

[[source]]
url = "https://docs.github.com/en/copilot/using-github-copilot/asking-github-copilot-questions-in-github"
channel = "developer_data"
tier = "core"
note = "GitHub Docs 使用页《Asking GitHub Copilot questions in GitHub》。§Conversation history and retention 给出 github.com 上 Copilot Chat 对话历史的量化保留：最多保留 100 个最近对话，单条对话内的消息保留 28 天后永久删除。对象是「对话历史/Chat 消息」，不是推理请求正文的保留期，不能当作请求级保留承诺。"

[[source]]
url = "https://docs.github.com/en/site-policy/github-terms/github-terms-of-service"
channel = "contract"
tier = "core"
note = "《GitHub Terms of Service》(含 Section J: AI Features, Training, and Your Data)。覆盖个人许可档(Copilot Free / Pro / Pro+ / Max 及未签 GCA/volume licensing 的使用者)：§J.1 明确「The training and data-use provisions in Section J.3 apply only to individual licenses」；§J.3 是个人档训练维度的合同层依据(默认授权训练 + 账户设置可退出 + 退出仅向将来生效)；§J.3 第三段明确该许可不允许把 Input/Output 交给第三方模型商做其自身训练；正文 E.2(Private Repositories §2 Confidentiality of Private Repositories，私有仓库内容作为 Input 时的训练使用)与账户注销后 90 天删除亦在本文件内。"

[[source]]
url = "https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"
channel = "consumer_privacy"
tier = "core"
note = "《GitHub General Privacy Statement》(页内 Effective date: April 27, 2026)，GitHub 作为 Data Controller 处理个人数据的平台级隐私声明，适用于所有显示该声明的服务(含 GitHub Copilot)。对个人账户，它是处理地与角色的主要依据；对组织提供的账户，声明自身写明组织成为 Data Controller、GitHub 以 Data Processor 身份行事并受 DPA 约束(§End User Notice: Organization-Provided GitHub Accounts)。它是 2026-04 隐私声明更新的本体之一，含「training models」的产品改进目的条款。"

[[source]]
url = "https://github.com/customer-terms/github-data-protection-agreement"
channel = "contract"
tier = "core"
note = "《GitHub Data Protection Agreement》(DPA)，GitHub Customer Agreement 的模块之一，覆盖 GitHub 以 Processor 身份处理 Customer Personal Data 的全部云服务(含 Copilot Business / Enterprise)。§3.A 划定角色(客户是 Controller、GitHub 是 Processor，例外见 3.A.i/ii 与 §3.C 的独立控制者目的)；§7 数据转移与位置(美国及 GitHub/子处理者运营的任何国家，含无充分性认定的第三国，靠 SCCs)；§8 保留与删除(服务结束后删除或返还)；§9 子处理者。DPA 本身不写 Copilot 请求级保留期，量化期限在产品文档与 Trust Center FAQ。"

[[source]]
url = "https://github.com/customer-terms/github-generative-ai-services-terms"
channel = "contract"
tier = "core"
note = "《GitHub Generative AI Services Terms》(版本 March 2026，取代 2026-03-05 之前生效的 Product Specific Terms)。适用对象由 §1 划定：§1.A 适用于「直接从 GitHub、按 volume licensing agreement 购买的 Generative AI Services」(即 Copilot Business / Enterprise)；§1.B 明确「If you do not purchase GitHub under a volume licensing agreement, this document does not apply to you」，个人客户改由 GitHub Terms of Service(含 Terms for Additional Products and Features)管辖；§1.C 规定经 Microsoft 购买者改由 Microsoft Product Terms 管辖。§3 是商业档训练维度的合同层依据，§6 是保留维度的合同层条款(把量化期限下放到产品文档)。这是本家权威性最高的来源。"

[[product]]
id = "consumer"
badge = "个人版"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "ghcopilot-tos-j3-license-to-train"

[[product.training.point]]
text_zh = "默认 permitted。§J.3 给 GitHub 及关联方「collect and use your Inputs and Outputs to develop, train and improve artificial intelligence and machine learning models」，退出条件为「(a) you opt out through your account settings, or (b) your use of the Service is governed by a GitHub Customer Agreement or volume licensing agreement」"

[[product.training.point]]
text_zh = "退出只向将来生效。开关实体在 manage-policies 页：「Allow GitHub to use my data for AI model training」设为 Disabled，生效日 2026-04-24(model-hosting 页与 Trust Center FAQ 同旨，前者还写明个人档数据可用于「prompts (inputs), suggestions (outputs), and code snippets」)。未覆盖范围：§J.3 末段说明退出权不适用于 D.4-D.8 的一般内容许可，公开仓库内容不在其中"

[[product.training.point]]
text_zh = "私有仓库内容一旦作为 AI Feature 的 Input 提交，E.2 允许用于开发、训练与改进服务。上游一跳另有约束：§J.3「This license does not, however, permit GitHub or its Affiliates to share your Inputs or Outputs with third-party AI model providers for their own independent model training purposes.」"

[[product.training.point]]
text = "Official limit on the scope of that licence: 「We do not train on the contents from any paid organization’s repos, regardless of whether a user is working in that repo with a Copilot Free, Pro, Pro+ or Max subscription.」 If a user’s GitHub ID is a member of, or an outside collaborator with, a paid organization, GitHub excludes their interaction data from model training. This is the case procurement cares about most — an employee opening an employer’s repository while on a personal subscription — and it is an official qualification of what Section J.3 authorises. It does not change this tier’s mark=no."
text_zh = "§J.3 授权范围的官方限定：付费组织仓库的内容不参与训练，即使用户是以 Copilot Free/Pro/Pro+/Max 个人订阅在该仓库里工作；若用户 GitHub ID 是付费组织的成员或 outside collaborator，其交互数据被排除在模型训练之外。这条恰好覆盖采购最关心的场景(员工用个人订阅打开公司仓库)，不改变本档 mark=no 的值。"
anchor = "ghcopilot-trust-paid-org-repo-no-training"

[[product.training.point]]
text = "Platform-level layer, recorded alongside: 「Personal Data may be shared with GitHub affiliates, including Microsoft, to facilitate … product development and improvement (including training and improving artificial intelligence and machine learning technologies) …」. The same statement lists code, inputs and AI outputs as Personal Data, and its 「Product Development and Improvement」 purpose likewise covers 「… and training models」. How this platform-level sharing sits with the account-setting opt-out in Section J.3 is not clarified by GitHub; both statements are kept side by side."
text_zh = "平台级声明另有一层口径：个人数据(该声明把 code、inputs、AI outputs 明列为 Personal Data)可共享给含 Microsoft 的关联方，用于含训练 AI/ML 技术的产品开发与改进；同旨还有 §Product Development and Improvement 的「…and training models」。它与 ToS §J.3 的账户设置退出开关如何叠加，GitHub 未说明，两条并列保留。"
anchor = "ghcopilot-privacy-affiliates-training-share"

[product.zdr]
mark = "unknown"

[[product.zdr.point]]
text_zh = "同顶层 zdr：ZDR 由 GitHub 与上游托管方的协议决定(OpenAI / Anthropic GA 功能 / xAI / Kimi 托管方)，不是个人账户可开关的选项"

[[product.zdr.point]]
text_zh = "官方未按档位区分这些协议的适用性，也未说明个人档可申请 ZDR。例外：启用 Claude Fable 5 / Fable 5.1 时 Anthropic 默认保留数据，限时 ZDR 豁免只面向通过审批并配置的企业。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "ghcopilot-privacy-retention-account-active"

[[product.retention.point]]
text = "The only quantified retention figure available on the individual tier has a different object: on github.com, 「Copilot Chat stores up to 100 of your most recent conversations. Messages within each conversation are kept for 28 days before being permanently deleted.」 That object is Copilot Chat conversation history / messages, not the request body (inputs and outputs) of an inference call, so it cannot be carried over as a request-level retention commitment."
text_zh = "个人档唯一可量化的保留口径对象不是请求正文：github.com 上 Copilot Chat 最多保留 100 个最近对话，单条对话内消息保留 28 天后永久删除(上限)。对象是「对话历史/Chat 消息」，不是推理请求正文(输入输出)，不能当作请求级保留承诺。"
anchor = "ghcopilot-ask-questions-chat-history-28-days"

[[product.retention.point]]
text = "For request bodies (inputs and outputs) the individual tier discloses no period at all: the platform-level statement only says 「We’ll retain your Personal Data as long as your account is active and as needed to fulfill contractual obligations, comply with legal requirements, resolve disputes, and enforce agreements.」 (unquantified), and the Terms of Service only add that repository content is deleted 「within 90 days of cancellation or termination (though some information may remain in encrypted backups)」."
text_zh = "请求正文(输入输出)的保留期在个人档没有任何官方量化承诺：平台级口径是《GitHub General Privacy Statement》「We’ll retain your Personal Data as long as your account is active…」(未量化)；ToS 只补了注销后 90 天内删除仓库内容(仍可能留在加密备份)。"
anchor = "ghcopilot-privacy-retention-account-active"

[[product.retention.point]]
text = "Exception, unquantified: 「As part of its enforcement and security operations, and acting as an independent data controller under the GitHub Data Protection Agreement, GitHub may enable targeted logging of input and output data associated with confirmed policy-violating accounts for a limited period.」 Object = inputs and outputs; context = confirmed policy-violating accounts; period = not quantified."
text_zh = "例外：GitHub 在执法与安全运营中，以 DPA 下的独立控制者身份，可对已确认违规账号的输入输出开启定向记录。对象=输入输出，语境=已确认违规账号，期限未量化。"
anchor = "ghcopilot-trust-independent-controller-targeted-logging"

[[product.retention.point]]
text_zh = "对照：同一家商业档有明确量化(IDE 路径默认不留存 / 其他访问路径最多 28 天，且该量化写在 Trust Center FAQ 的「The default settings for Copilot Business and Enterprise Customers are as follows」之下)，个人档没有对应条款，不能把商业档的 28 天外推到个人档。"
anchor = "ghcopilot-trust-other-access-28-days"

[product.processing_region]
codes = ["US", "global"]
anchor = "ghcopilot-privacy-processing-locations"

[[product.processing_region.point]]
text_zh = "个人账户无区域选择权，处理地是「本地区域 + 美国 + 其他运营地」，EU/UK/CH 出境靠 SCCs。数据驻留(Data Residency)是 GitHub Enterprise Cloud 的能力，个人档不适用。"

[product.role]
kind = "controller"
anchor = "ghcopilot-privacy-data-controller-scope"

[[product.role.point]]
text = "Individual accounts: 「It applies to the Personal Data that GitHub, Inc. or GitHub B.V., processes as the “Data Controller” when you interact with websites, applications, and services that display this Statement」 — the opening scope clause of the statement is the basis for the controller role here."
text_zh = "个人账户：GitHub 以 Data Controller 身份处理个人数据，依据是声明开篇的适用范围句(「…processes as the “Data Controller” when you interact with websites, applications, and services that display this Statement」)。"
anchor = "ghcopilot-privacy-data-controller-scope"

[[product.role.point]]
text = "Role flip when the account is organization-provided: 「When a school or employer supplies your GitHub account, they assume the role of Data Controller for most Personal Data used in our Services」 and 「the organization becomes the Data Controller … GitHub functions as a Data Processor, adhering to the Data Controller’s instructions」. In that scenario GitHub acts as controller 「solely for specific processing activities」 defined in the DPA with the organization."
text_zh = "组织提供账号时角色翻转：学校或雇主承担 Data Controller，组织成为控制者、GitHub 以 Data Processor 身份按控制者指示处理并受 DPA 约束；此时 GitHub 仅在 DPA 明确约定的特定处理活动上自认控制者(§End User Notice: Organization-Provided GitHub Accounts)。"
anchor = "ghcopilot-privacy-data-processor-org-accounts"

[[product.role.point]]
text = "Separate independent-controller track: 「acting as an independent data controller under the GitHub Data Protection Agreement, GitHub may enable targeted logging of input and output data associated with confirmed policy-violating accounts for a limited period.」"
text_zh = "另一条独立控制者口径：GitHub 在执法与安全运营中，以 DPA 下的独立控制者身份，可对已确认违规账号的输入输出开启定向记录(期限未量化)。"
anchor = "ghcopilot-trust-independent-controller-targeted-logging"

[[product.role.point]]
text_zh = "上游模型商是 GitHub 的子处理者，个人客户与其无合同关系(「The model-providers’ terms do not flow down to our customers」)。"
anchor = "ghcopilot-trust-subprocessors"

