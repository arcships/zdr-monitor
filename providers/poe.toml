[product.training]
mark = "yes"
anchor = "poe-api-terms-4c-no-training-on-bot-content"
mode = "by_contract"

[[product.training.point]]
text_zh = "Poe 对开发者的明确承诺（本家唯一一处明确「不会用于训练」的合同条款）：API Terms §4c「We will not (i) use any content provided by Your Bot to train a large language model, or (ii) provide any content provided by Your Bot to a third-party service unless we have a contractual agreement in place with such service restricting their use of such content.」"

[[product.training.point]]
text_zh = "Creator FAQ 第 2 问复述并指向 §4.c。适用范围要写清：对象是「content provided by Your Bot」（bot 的响应/内容），不含 Poe 用户与 bot 的对话输入"

[[product.training.point]]
text_zh = "承诺方是 Poe，不含上游模型厂商。因此本条**不能**用来支撑 API 网关档或消费档的 training 结论。"

[product.zdr]
mark = "no"
anchor = "poe-privacy-developer-bots-train-on-chats"

[[product.zdr.point]]
text_zh = "开发者档链路里，用户对话会被交给 bot 开发者并可由其保存：Poe Privacy Policy 逐字写「Developers that create bots and apps on Poe using APIs may view and store your chats on their servers to train their models.」——标的 = 用户对话正文，动作 = store，主体 = 开发者（本档的接收跳）。API Terms 没有保留期或零保留条款：§4c 的限制句标的写作「any content provided by Your Bot」（creator FAQ 第 2 问复述为「the responses from your bot」），即**开发者 bot 的输出**，不是用户请求正文——它是不训练 / 不无合同约束转第三方的使用限制，不是保留承诺"

[[product.zdr.point]]
text_zh = "§5 只要求开发者在用户或 Poe 要求时删除用户个人数据，反推默认可以持有。故本档不构成零保留。锚点取自 Privacy Policy 的开发者句（该句写在消费档语境），此处按「同一数据流的接收跳」引用，未外推具体天数。"

