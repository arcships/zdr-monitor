note = "《隐私政策》(发布时间/生效时间均为 2023-09-25，页内自带「历史版本」入口)，平台侧文档，标题只写「隐私政策」，但 §引言把本平台定义为「为访问者和开发者…提供的通过API方式调用的生成类人工智能技术服务」、§特别说明把适用对象写为「访问、注册、登录本平台并使用本服务的访问者和开发者及其最终用户」、§11 关键词定义把「百川大模型开放平台」定义为「用户可通过API调用的生成类人工智能类技术付费服务」——三处一致表明本政策覆盖开放平台 API 档，是本档 training/retention/processing_region/role 四维的主要来源。§1.1.3 是 API 交互输入的使用目的条款；§1.2.2 记录「设备调用我们API的调用记录日志」的收集；§1.4 是匿名化后研究/统计的模板段（与主站消费档政策逐字相同，含「会写」括号与「提高会服务的智能性」笔误）；§5 给出境内存储与「最短必要时间」两条；§4.2 承认备份延迟删除；§3.1 声明「目前，百川不存在向第三方共享您的个人信息的情况」。全文「训练」「train」0 命中；无 ZDR/零保留字样；无 DPA 或受托处理者自述。"

[[source]]
url = "https://www.baichuan-ai.com/article/privacy-agreement"
channel = "consumer_privacy"
tier = "core"
note = "《百川隐私政策》(发布时间/生效时间 2023-08-31)，主站消费档(百川大模型/百小应)政策。与平台档政策的关系：两份是同一模板的两个版本，§1.4 那段匿名化研究/统计的文字逐字相同；但差异对判定很关键——本档 §1.1.2/§1.1.3 写的是「您与百川进行交互」(单人)，平台档写的是「您与您的最终用户」(开发者+终端用户)；本档 §1.1.3「问答历史」有「为履行网络信息安全义务，我们会在法律规定的时间内保留您的问答历史及对话主题」的留存条款，平台档没有；本档 §5 多一句「在本政策下所收集及处理的个人信息不存在出境的情况」，平台档没有。因此两份不可互相引用。本档用于给 products[consumer_app] 行定结论，并作为「§1.4 的『会写』括号是跨档复制的模板噪声」的对照证据。"

[[source]]
url = "https://www.baichuan-ai.com/article/user-agreement"
channel = "contract"
tier = "core"
note = "《百川用户协议》(发布时间/生效时间 2025-09-28，主站现行版)，本档的合同层来源。之所以把它算进 API 档：平台文档站的每一页页脚都把「用户协议」指向本 URL（见 sources 中 https://platform.baichuan-ai.com/docs-v2/api 的 anchor baichuan-docs-footer-governing-documents），平台自站的《使用、分享与传播指引》也把《用户协议》链到本 URL。要点：§四.5 是唯一出现「训练」字样的授权条款，但对象限定为「您…公开发布、传播、分享」的内容（第(4)项「使用该内容训练模型和改进相关服务的权利」），API 请求正文不属于公开发布，故该条不直接覆盖 API 档；§六.1 另有一条覆盖「您在使用本产品过程中产生的所有数据、信息或内容」的全球免费可转许可，措辞是「任何形式地使用」，未点名训练；§五.1 自称「作为中立的网络服务提供者」（针对搜索链接）；§四.10 保留按监管机关要求查询个人信息与限制账户的义务；§十二.4 把使用地限为中国大陆。全文无「不用于训练」承诺、无 ZDR、无 DPA。注意本协议 §四.1 仍写「仅限于以非商业性目的使用本产品」，与开放平台 API 的商业使用场景相冲突——即百川没有一个为 API 档定制的合同文本。"

