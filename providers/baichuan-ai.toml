[product.training]
mark = "no"
anchor = "baichuan-tos-4-5-4-training-license"

[[product.training.point]]
text = "Conclusion for the consumer tier: there is an explicit training license for content that is \"publicly published, disseminated or shared\", while ordinary conversation input is covered only by service-improvement wording. Basis: Baichuan User Agreement (2025-09-28) §4.5: \"your act of publicly publishing, disseminating or sharing content in any form — images, text, audio, digital works, livestreams, video and so on — through this product represents that you have the right to grant, and agree to grant, the Company a worldwide, free … (4) right to use that content to train models and improve the related services…\" — the licensed object is publicly published content, and the license is obtained through conduct (\"the act represents the grant\") rather than per-instance consent"
text_zh = "消费档结论：对「公开发布、传播、分享」的内容有明确的训练授权，对普通对话输入只有服务改进口径。依据：《百川用户协议》(2025-09-28) §四.5「您使用本产品将图片、文字、音频、数字作品、直播或视频等各种形式的内容…公开发布、传播、分享的行为代表了您有权许可且同意许可本公司在全世界范围内，免费…（4）使用该内容训练模型和改进相关服务的权利…」——授权对象是公开发布的内容，且以「行为代表许可」的方式取得，非逐次同意"

[[product.training.point]]
text = "§6.1 separately grants a worldwide, free, sublicensable license covering \"all data, information or content generated in the course of your use of this product\", worded as \"use in any form\". On the conversation-input side: main-site privacy policy §1.1.2 \"your text conversation information will also be used to improve Baichuan's response speed and quality\", and §1.4 uses anonymized information for academic research or statistical analysis in order to \"continuously improve the algorithmic models\". Evidence to the contrary: User Agreement §5.5 only prohibits users from using Baichuan data to train \"other\" AI products"
text_zh = "§六.1 另授予覆盖「您在使用本产品过程中产生的所有数据、信息或内容」的全球免费可转许可，措辞「任何形式地使用」。对话输入侧：主站隐私政策 §1.1.2「您的文本对话信息还会被用来提高百川的响应速度和质量」，§1.4 匿名化后用于学术研究/统计分析以「不断改进算法模型」。反向证据：用户协议 §五.5 只禁止用户用百川数据训练「其他」AI 产品"

[[product.training.point]]
text = "There is no \"not used for training\" commitment and no description of an opt-out switch. Uncertainty: whether \"improving response speed and quality\" amounts to training has not been clarified by the vendor."
text_zh = "无「不用于训练」承诺、无退出开关说明。不确定性：「提高响应速度和质量」是否等同训练，厂商未澄清。"

[product.zdr]
mark = "no"
anchor = "baichuan-consumer-privacy-1-1-3-qa-history-retention"
searched = [
  "https://www.baichuan-ai.com/article/privacy-agreement",
  "https://www.baichuan-ai.com/article/user-agreement",
  "https://www.baichuan-ai.com/",
]

[[product.zdr.point]]
text = "The consumer tier has no ZDR wording and no application path; what the terms do state is retention (see below), hence mark=no rather than undisclosed"
text_zh = "消费档无 ZDR 术语、也无申请入口；条款明示的是留存（见下条），故记 mark=no 而非「未披露」"

[[product.zdr.point]]
text = "The retention of Q&A history in main-site privacy policy §1.1.3 and the service-improvement use in §1.1.2 are incompatible with \"zero retention\". The main site has no sitemap.xml (404), so exhaustive enumeration through a site map is not possible and the searched list is limited to the documents actually fetched this round."
text_zh = "主站隐私政策 §1.1.3 的问答历史留存与 §1.1.2 的服务改进使用与「零保留」相斥。主站无 sitemap.xml（404），无法用站点地图做穷尽枚举，故 searched 列表以本轮实际抓取到的文档为限。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "baichuan-consumer-privacy-1-1-3-qa-history-retention"

[[product.retention.point]]
text = "Consumer-tier retention has to be split by object: (1) Q&A history (input text conversation information and conversation topics) — main-site privacy policy §1.1.3: \"in order to perform network information security obligations, we will retain your Q&A history and conversation topics for the period prescribed by law\", which is a **floor**-type statement (retained as long as the law requires) and cannot be read backwards as \"deleted when the period ends\""
text_zh = "消费档 retention 要分对象：(1) 问答历史（输入文本对话信息与对话主题）——主站隐私政策 §1.1.3「为履行网络信息安全义务，我们会在法律规定的时间内保留您的问答历史及对话主题」，这是**下限**型口径（法律要求留多久就留多久），不能反推「到期即删除」"

[[product.retention.point]]
text = "The same sentence also says \"you can find and manage the Q&A history that has not yet been deleted\", showing that history is retained by default and managed by the user. (2) Personal information overall — §5: \"unless laws and regulations require otherwise, we will store your personal information only for the shortest time necessary to achieve the purpose you authorized\". (3) Deleted or anonymized once a deletion request is acted on, with delayed deletion from backups (§4.2)"
text_zh = "同一句还写「您可以查找并管理尚未删除的问答历史」，说明历史默认留存、由用户自行管理。(2) 个人信息总体——§5「除非法律法规另有要求，我们对您的个人信息的存储时间将限于实现您授权使用的目的所必需的最短时间」。(3) 删除请求响应后删除或匿名化，备份延迟删除（§4.2）"

[[product.retention.point]]
text = "Deleted or anonymized promptly after account cancellation (§4.4)"
text_zh = "注销后及时删除或匿名化（§4.4）"

[[product.retention.point]]
text = "Deleted or anonymized if operations cease (§5). No quantified number of days anywhere. Note that the platform-tier policy has no Q&A history retention sentence; the two are not interchangeable."
text_zh = "停止运营时删除或匿名化（§5）。无任何量化天数。注意平台档政策没有问答历史留存句，两份不可互换。"

[product.processing_region]
codes = ["CN"]
anchor = "baichuan-consumer-privacy-5-no-cross-border"

[[product.processing_region.point]]
text = "Main-site privacy policy §5: \"we store personal information collected and generated in operations within China inside China. The personal information collected and processed under this policy is not transferred outside the territory.\" — one sentence more than the platform tier (\"not transferred outside the territory\"). Supporting: User Agreement §12.4 limits use to mainland China. The subject is still \"personal information\"; where the compute sits is not disclosed."
text_zh = "主站隐私政策 §5「我们会将在中国境内运营所收集和产生的个人信息存储在中国境内。在本政策下所收集及处理的个人信息不存在出境的情况。」——比平台档多一句「不存在出境的情况」。辅助：用户协议 §十二.4 使用地限中国大陆。对象仍是「个人信息」，未披露算力所在地。"

[product.role]
kind = "controller"
anchor = "baichuan-consumer-privacy-5-no-cross-border"

[[product.role.point]]
text = "On the consumer tier Baichuan provides the service directly to individual users and collects their personal information for its own purposes (§1.1.1 account, §1.1.2 human-machine conversation, §1.2.1 logs), which makes it an independent controller. The User Agreement §5.1 description of itself as \"a neutral network service provider\" only disclaims liability for third-party content behind search links and is not a PIPL role self-designation. No DPA and no entrusted-processing scenario. Confidence low: this tier has no role clause of any kind, the classification is inferred from the processing structure, and this row is not the provider's main tier."
text_zh = "消费档由百川直接向个人用户提供服务并收集其个人信息用于自身目的（§1.1.1 账户、§1.1.2 人机交互对话、§1.2.1 日志），属独立控制者。用户协议 §五.1 自称「作为中立的网络服务提供者」仅针对搜索链接的第三方内容免责，不是 PIPL 角色自认。无 DPA、无受托场景。置信度 low：本档无任何角色自认条款，纯属按处理结构推定，且本行不是本 provider 的主档。"

