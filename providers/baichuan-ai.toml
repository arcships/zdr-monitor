[[product.training.point]]
text = "§1.4 permits anonymized information to be used to improve algorithmic models (the parenthetical example is the consumer-side \"Huixie\" writing feature)"
text_zh = "§1.4 允许匿名化后用于改进算法模型（括号举例是消费端「会写」）"

[[product.training.point]]
text = "The only grant at contract level containing the word \"training\" (www User Agreement §4.5(4)) is triggered by \"publicly publishing, disseminating or sharing\" content and does not cover API request content"
text_zh = "合同层唯一含「训练」的授权（www 用户协议 §四.5(4)）以「公开发布、传播、分享」为触发条件，不覆盖 API 请求正文"

[[product.training.point]]
text = "The \"use in any form\" in §6.1 is a broad catch-all. There is no training authorization as such, but there is no prohibition either — and §1.1.3 does state that API input is used to improve response speed and quality, which under the house rule (\"used to improve service/quality\" counts as training unless model training is expressly excluded) is recorded as mark=no"
text_zh = "§六.1 的「任何形式地使用」是宽泛兜底。没有点名「训练」的授权，也没有禁止训练的表述——但 §1.1.3 明示输入会被用于提高响应速度和质量，按判定口径（未排除模型训练就不能替厂商排除）记 mark=no"

