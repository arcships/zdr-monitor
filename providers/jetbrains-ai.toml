category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "jb-tos-no-train-c"

[[product.training.point]]
text_zh = "AI Assistant 那份「把你和模型的完整对话（含代码片段）交上去」的详细数据采集是 opt-in，默认不开；但它管的是采集，不是训练口径——不训练这条来自服务条款 §c 的承诺本身。"
anchor = "jb-detailed-data-opt-in"
[[product.training.point]]
text_zh = "完整提示词、回复和代码片段仅在明确选择加入后收集；默认关闭。加入后可用于产品改进和训练，保留 1 年。匿名遥测、运营元数据和事件数据不含源码/提示词且不训练生成模型。"

