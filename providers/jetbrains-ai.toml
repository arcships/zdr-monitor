tier = "core"
note = "《JetBrains AI Service Terms》。§c 是训练口径的权威条款：明确承诺不拿 Inputs/Data/Outputs/Suggestions 训练任何语言模型；§i 另外单独允许用匿名化行为数据做产品改进——两者是两件事，别混。"

[[source]]
