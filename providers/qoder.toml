text_zh = "Teams 档——主体那句话为什么不算角色依据：「BRIGHT ZENITH PRIVATE LIMITED, a Singapore registered entity (“BRIGHT ZENITH”), collect, use, disclose, and protect your personal data.」这是政策的适用范围自述，没有指定 controller 或 processor；保留它只为记录签约主体。"
