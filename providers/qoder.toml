[[product.role.point]]
text = "Teams tier — reading, not a vendor self-designation: the policy never calls Qoder a controller or a processor; its stance is that of a party setting its own purposes — \"We use, process, and/or disclose your personal data for the following purposes:\" — and the operating entity is BRIGHT ZENITH PRIVATE LIMITED (Singapore). The only controller/sub-processor wording sits elsewhere (a cookie-table row naming Google as the data controller for Google Analytics, and the sub-processor chain described for service providers). No DPA or subscription terms are registered in this file, so the value below is our reading of the privacy policy alone."
text_zh = "Teams 档——这是解读而非厂商自述：政策没有把 Qoder 称作 controller 或 processor；其口径是由自己设定处理目的——「We use, process, and/or disclose your personal data for the following purposes:」——签约主体为 BRIGHT ZENITH PRIVATE LIMITED（新加坡）。仅有的 controller/sub-processor 字样在别处（cookie 表把 Google 列为 Google Analytics 的数据控制者；服务商链条提到其子处理者）。本文件未登记 DPA 或订阅条款，故下列取值只是我们对隐私政策的解读。"
anchor = "qoder-role-purposes"

[[product.role.point]]
text = "Teams tier — tier-specific, and why this tier's role is the least settled: \"If you are a member of an Organization under an Enterprise or Team Plan, we may share your personal data with your Organization, Administrators of your Organization, and/or other users (if applicable) in your Organization.\" The Organization side can reach member data, so who is controller for what would normally come from subscription terms or a DPA — none is registered in this file, and the value below is the consumer-policy reading."
text_zh = "Teams 档——本档特有，也是本档角色最不确定的原因：「If you are a member of an Organization under an Enterprise or Team Plan, we may share your personal data with your Organization, Administrators of your Organization, and/or other users (if applicable) in your Organization.」组织侧可以拿到成员数据，因此「谁是控制者」通常由订阅条款或 DPA 约定——本文件都没有登记，下列取值只是消费级政策下的解读。"
anchor = "qoder-org-visibility"

[[product.role.point]]
text = "Teams tier — several processing entities behind one facing entity: \"Certain entities within our corporate group (\"Corporate Group\") receive and process personal data to support the provision of the Services. These entities process Information Provided By You, Automatically Collected Information, and Information From Other Sources for us …\" — they act \"for us\", which leaves the facing role with BRIGHT ZENITH while the intra-group allocation stays undescribed."
text_zh = "Teams 档——一个对外实体背后有多个处理实体：原文「Certain entities within our corporate group (“Corporate Group”) receive and process personal data to support the provision of the Services. These entities process Information Provided By You, Automatically Collected Information, and Information From Other Sources for us …」——它们「for us」处理，对外角色仍落在 BRIGHT ZENITH 身上，集团内部分配未作说明。"
