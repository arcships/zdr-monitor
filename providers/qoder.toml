[[product.zdr.point]]
text = "Enterprise tier — scope note on the chain, not evidence of a zero-retention option (no ZDR wording exists in the policy): Outputs may be produced with third-party LLMs (\"such as Alibaba’s Qwen, MoonShoot’s Kimi\"), each hop carrying its own stance; the vendor only commits that such providers are \"contractually required to maintain data protection standards equal to or exceeding those required by applicable laws and regulations\". No upstream option is evidenced here, and no upstream policy is registered as a source yet."
text_zh = "Enterprise 档——链路适用范围说明，不构成零保留方案的证据（政策中没有任何 ZDR 措辞）：Outputs 可能由第三方 LLM 生成（原文「such as Alibaba’s Qwen, MoonShoot’s Kimi」），各跳各有口径；厂商只承诺这些服务商「contractually required to maintain data protection standards equal to or exceeding those required by applicable laws and regulations」。本文件没有上游零保留方案的证据，上游政策亦未登记为来源。"
anchor = "qoder-service-providers-llm"

[[product.zdr.point]]
text = "Enterprise tier — scope condition, BYOK: a scope note, not a ZDR statement. With BYOK on, \"the processing of such data shall be governed by the privacy policies of the respective third-party service providers\", so a zero-retention question on that path belongs to the upstream. The default path is unaffected."
text_zh = "Enterprise 档——适用范围条件（BYOK）：范围说明，不是零保留表态。启用 BYOK 后「the processing of such data shall be governed by the privacy policies of the respective third-party service providers」，该路径的零保留问题归上游；默认路径不受影响。"
anchor = "qoder-byok"
[product.retention]
object = "mixed"
basis = "as_needed"
anchor = "qoder-retention-general"

[[product.retention.point]]
text = "Enterprise tier — the only quantified period, and what it covers: the purpose-table row \"To research, develop and improve our Services | - User Content in a de-identified format. | Up to five years from the date of collection\" — object = de-identified User Content; context = the research/development/improvement purpose; type = an upper bound, not a fixed deletion date for inputs and outputs."
text_zh = "Enterprise 档——唯一量化的期限及其覆盖面：用途表那一行「To research, develop and improve our Services | - User Content in a de-identified format. | Up to five years from the date of collection」——对象=去标识化后的 User Content；语境=研发与改进用途；期限类型=上限，不是输入输出正文的固定删除期。"
anchor = "qoder-improvement-five-years"

[[product.retention.point]]
text = "Enterprise tier — periods differ by object and purpose: \"The retention periods will be different depending on the type of information and the purposes for which we use the information. For example, we retain your Account Information for as long as you have an account.\" The same paragraph adds that a Terms violation lets the vendor remove access immediately while retaining the information to investigate."
text_zh = "Enterprise 档——期限按对象与目的而异：「The retention periods will be different depending on the type of information and the purposes for which we use the information. For example, we retain your Account Information for as long as you have an account.」同段另写：违反服务条款时可立即停止访问，但按调查需要继续保留信息。"
anchor = "qoder-retention-varies"

[[product.retention.point]]
text = "Enterprise tier — tier-specific retention context: \"If you are a member of an Organization under an Enterprise or Team Plan, we may share your personal data with your Organization, Administrators of your Organization, and/or other users (if applicable) in your Organization.\" Member data reaches the Organization and its Administrators, so retention here is not the individual's alone to control. What the public consumer policy says is this tier's default; an enterprise subscription or a DPA would govern if it says otherwise, and no contract-layer source is registered in this file — so these figures are the public-policy default, not the contractual one."
text_zh = "Enterprise 档——本档特有的保留语境：「If you are a member of an Organization under an Enterprise or Team Plan, we may share your personal data with your Organization, Administrators of your Organization, and/or other users (if applicable) in your Organization.」成员数据会到达组织及其管理员，本档留存不由个人单独控制。公开消费级政策所述是本档默认值；企业订阅条款或 DPA 另有约定者从其约定，而本文件没有登记合同层来源——故这些数字是公开政策下的默认值，不是合同值。"
anchor = "qoder-org-visibility"

[[product.retention.point]]
text = "Enterprise tier — conditional deletion/de-identification commitment: \"When we have no further legitimate need or legal reason to retain your personal data, we will either delete it in a secure manner or deidentify it such that can no longer be associated with you.\" Conditional on no need or legal reason remaining — not scheduled deletion, and not a basis of \"none\"."
text_zh = "Enterprise 档——条件式的删除/去标识化承诺：「When we have no further legitimate need or legal reason to retain your personal data, we will either delete it in a secure manner or deidentify it such that can no longer be associated with you.」前提是已无正当需要或法律理由——不是按期删除，也不能读成「不留存」。"
anchor = "qoder-retention-delete-deidentify"

[[product.retention.point]]
text = "Enterprise tier — exception context for deletion requests: \"We may be unable to comply with your request if we are required to retain your information due to legal or regulatory obligations, such as when the information is necessary to complete a transaction, when fulfilling the request would compromise the privacy of others, or when it would be impractical to do so.\" A limit on the right, not a period."
text_zh = "Enterprise 档——删除请求的例外语境：「We may be unable to comply with your request if we are required to retain your information due to legal or regulatory obligations, such as when the information is necessary to complete a transaction, when fulfilling the request would compromise the privacy of others, or when it would be impractical to do so.」这是权利行使的限制，不是期限。"
anchor = "qoder-retention-rights-exception"

[[product.retention.point]]
text = "Enterprise tier — data already processed for improvement keeps its own life: \"Any data already processed for the above purposes prior to disabling this setting may continue to be retained and used in accordance with this section.\" Switching off Share & Improve does not shorten retention of what was processed before."
text_zh = "Enterprise 档——此前已用于改进的数据另有存续口径：「Any data already processed for the above purposes prior to disabling this setting may continue to be retained and used in accordance with this section.」关闭 Share & Improve 不会缩短此前已处理数据的保留。"
anchor = "qoder-share-improve-no-retroactive"

[[product.retention.point]]
text = "Enterprise tier — chain: the same question has an upstream hop. Outputs are generated with third-party LLMs (\"such as Alibaba’s Qwen, MoonShoot’s Kimi\") and the only commitment about them is that they are \"contractually required to maintain data protection standards equal to or exceeding those required by applicable laws and regulations\"; their own policies govern their copies and are not registered as sources here."
text_zh = "Enterprise 档——链路：同一问题还有上游一跳。Outputs 由第三方 LLM 参与生成（原文「such as Alibaba’s Qwen, MoonShoot’s Kimi」），厂商对它们的唯一承诺是「contractually required to maintain data protection standards equal to or exceeding those required by applicable laws and regulations」；上游按自身政策留存其副本，这些政策尚未登记为来源。"
anchor = "qoder-service-providers-llm"

[[product.retention.point]]
text = "Enterprise tier — scope condition, BYOK: with BYOK on, \"the processing of such data shall be governed by the privacy policies of the respective third-party service providers\" — retention on that path is the designated provider's, not Qoder's. The default path is not covered by this exception."
text_zh = "Enterprise 档——适用范围条件（BYOK）：启用 BYOK 后「the processing of such data shall be governed by the privacy policies of the respective third-party service providers」——该路径的留存由用户指定的服务商决定，不是 Qoder 的承诺。默认路径不适用该例外。"
anchor = "qoder-byok"
[product.processing_region]
codes = ["US", "SG", "JP"]
anchor = "qoder-regions"

[[product.processing_region.point]]
text = "Enterprise tier — the three countries are the main server locations, not every entity that may process: \"Certain entities within our corporate group (\"Corporate Group\") receive and process personal data to support the provision of the Services. These entities process Information Provided By You, Automatically Collected Information, and Information From Other Sources for us, as necessary to provide functions such as storage, operation and maintenance of Service, security, research and development, analytics, online payments, customer and technical support.\" Group entities and the §4 third parties may process outside US/SG/JP."
text_zh = "Enterprise 档——三国是主要服务器所在地，不等于全部可能处理数据的实体：原文「Certain entities within our corporate group (“Corporate Group”) receive and process personal data to support the provision of the Services. These entities process Information Provided By You, Automatically Collected Information, and Information From Other Sources for us, as necessary to provide functions such as storage, operation and maintenance of Service, security, research and development, analytics, online payments, customer and technical support.」集团内实体与 §4 的第三方都可能在美国/新加坡/日本之外处理。"
anchor = "qoder-corporate-group"

[[product.processing_region.point]]
text = "Enterprise tier — the policy itself says processing entities may sit elsewhere: \"Your personal data will be stored in Singapore. Your personal data may however be transferred to or accessed by our officers, employees, support staff, agents, Third Party Service Providers (and their sub-processors, if any), and our affiliate companies (and their designated Service Providers and the latter’s sub-processors, if any), which may be located in several other jurisdictions.\" (Philippines Addendum.)"
text_zh = "Enterprise 档——政策自己写明处理实体可能位于别处：「Your personal data will be stored in Singapore. Your personal data may however be transferred to or accessed by our officers, employees, support staff, agents, Third Party Service Providers (and their sub-processors, if any), and our affiliate companies (and their designated Service Providers and the latter’s sub-processors, if any), which may be located in several other jurisdictions.」（菲律宾附则。）"
anchor = "qoder-affiliates-jurisdictions"

[product.role]
kind = "controller"
anchor = "qoder-role-purposes"

[[product.role.point]]
text = "Enterprise tier — reading, not a vendor self-designation: the policy never calls Qoder a controller or a processor; its stance is that of a party setting its own purposes — \"We use, process, and/or disclose your personal data for the following purposes:\" — and the operating entity is BRIGHT ZENITH PRIVATE LIMITED (Singapore). The only controller/sub-processor wording sits elsewhere (a cookie-table row naming Google as the data controller for Google Analytics, and the sub-processor chain described for service providers). No DPA or subscription terms are registered in this file, so the value below is our reading of the privacy policy alone."
text_zh = "Enterprise 档——这是解读而非厂商自述：政策没有把 Qoder 称作 controller 或 processor；其口径是由自己设定处理目的——「We use, process, and/or disclose your personal data for the following purposes:」——签约主体为 BRIGHT ZENITH PRIVATE LIMITED（新加坡）。仅有的 controller/sub-processor 字样在别处（cookie 表把 Google 列为 Google Analytics 的数据控制者；服务商链条提到其子处理者）。本文件未登记 DPA 或订阅条款，故下列取值只是我们对隐私政策的解读。"
anchor = "qoder-role-purposes"

[[product.role.point]]
text = "Enterprise tier — tier-specific, and why this tier's role is the least settled: \"If you are a member of an Organization under an Enterprise or Team Plan, we may share your personal data with your Organization, Administrators of your Organization, and/or other users (if applicable) in your Organization.\" The Organization side can reach member data, so who is controller for what would normally come from subscription terms or a DPA — none is registered in this file, and the value below is the consumer-policy reading."
text_zh = "Enterprise 档——本档特有，也是本档角色最不确定的原因：「If you are a member of an Organization under an Enterprise or Team Plan, we may share your personal data with your Organization, Administrators of your Organization, and/or other users (if applicable) in your Organization.」组织侧可以拿到成员数据，因此「谁是控制者」通常由订阅条款或 DPA 约定——本文件都没有登记，下列取值只是消费级政策下的解读。"
anchor = "qoder-org-visibility"

[[product.role.point]]
text = "Enterprise tier — several processing entities behind one facing entity: \"Certain entities within our corporate group (\"Corporate Group\") receive and process personal data to support the provision of the Services. These entities process Information Provided By You, Automatically Collected Information, and Information From Other Sources for us …\" — they act \"for us\", which leaves the facing role with BRIGHT ZENITH while the intra-group allocation stays undescribed."
text_zh = "Enterprise 档——一个对外实体背后有多个处理实体：原文「Certain entities within our corporate group (“Corporate Group”) receive and process personal data to support the provision of the Services. These entities process Information Provided By You, Automatically Collected Information, and Information From Other Sources for us …」——它们「for us」处理，对外角色仍落在 BRIGHT ZENITH 身上，集团内部分配未作说明。"
anchor = "qoder-corporate-group"

[[product.role.point]]
text = "Enterprise tier — why the entity sentence is not role evidence: \"BRIGHT ZENITH PRIVATE LIMITED, a Singapore registered entity (“BRIGHT ZENITH”), collect, use, disclose, and protect your personal data.\" It is the policy's scope self-description and designates no controller or processor; it is kept here for the operating-entity fact."
text_zh = "Enterprise 档——主体那句话为什么不算角色依据：「BRIGHT ZENITH PRIVATE LIMITED, a Singapore registered entity (“BRIGHT ZENITH”), collect, use, disclose, and protect your personal data.」这是政策的适用范围自述，没有指定 controller 或 processor；保留它只为记录签约主体。"
anchor = "qoder-entity"

