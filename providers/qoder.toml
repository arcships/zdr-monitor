text_zh = "Teams 档——政策自己写明处理实体可能位于别处：「Your personal data will be stored in Singapore. Your personal data may however be transferred to or accessed by our officers, employees, support staff, agents, Third Party Service Providers (and their sub-processors, if any), and our affiliate companies (and their designated Service Providers and the latter’s sub-processors, if any), which may be located in several other jurisdictions.」（菲律宾附则。）"
