topics = ["training"]

[anchor.selector]
prefix = "If you purchase an Enterprise subscription, or another subscription plan that is entitled to opt out of training, to v0, the following terms apply regardless of any conflicting terms in these AI Product Terms:"
exact = "Vercel represents and warrants that it will not use v0 Customer Content to train its or its third-party AI providers' models or to improve the AI Products and Services, except with your consent."
suffix = ""

[[anchor]]
id = "vercel-aipt-6-2-hobby-pro-your-content-license"
source_id = "4fedf854545826cd"
topics = ["training", "role"]

[anchor.selector]
prefix = "You grant Vercel a license to use Customer Content as necessary to provide the AI Products and Services, publish and display Customer Content within the AI Products and Services, to provide support for and improve the AI Products and Services, enforce Vercel's or its licensors' policies, prevent fraud, comply with applicable law, and maintain the safety and security of the AI Products and Services. "
exact = "If you use the AI Products and Services under a Hobby or Pro plan, your Customer Content forms part of Your Content, as defined in Section 3 of the Terms of Service and is subject to the license granted to Vercel under Section 3."
suffix = " Subject to your plan level and account settings, Your Content may be used by Vercel and shared with third parties in accordance with Section 3 of the Terms of Service."

[[anchor]]
id = "vercel-aipt-11-3-termination-may-destroy"
source_id = "4fedf854545826cd"
topics = ["retention"]

[anchor.selector]
prefix = "3.   **Effect of Termination**. Sections 5, 6, 9, 11, 15, and any other provision that by its nature is intended to survive, will survive termination of these AI Product Terms. "
exact = "On termination of these AI Product Terms, you and each of your Authorized Users must cease using the AI Products and Services and Vercel may destroy Customer Content, subject to applicable law."
suffix = " Without limiting the foregoing, you may continue to use Output following termination as contemplated by these AI Product Terms."

