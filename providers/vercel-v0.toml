anchor = "vercel-dpa-12-1-delete-on-termination"

[[product.retention.point]]
text = "Object one — Customer Data (the Personal Data in Your Content): termination or expiration of the Agreement serves as instruction to delete all Customer Data within a commercially reasonable timeframe (DPA §12.1; Schedule 2 §15 restates it and adds unless required by law)."
text_zh = "对象一 Customer Data（Your Content 中的个人数据）：终止或到期即视为指示，在商业合理期限内删除全部 Customer Data（DPA §12.1；Schedule 2 §15 重申并附「unless required by law」）。"
anchor = "vercel-dpa-schedule2-15-limited-retention"

[[product.retention.point]]
text = "Exception to that deletion: Vercel may retain Customer Data if required by law (DPA §12.2)."
text_zh = "删除承诺的明文例外：法律要求时 Vercel 可继续保留 Customer Data（DPA §12.2）。"
anchor = "vercel-dpa-12-2-retain-if-required-by-law"

[[product.retention.point]]
text = "Object two — Service-Generated Data and Contact Data: upon termination Vercel may still retain, use and disclose them for the purposes in Schedule 1 §2.b, and anonymizes or deletes them only when it no longer requires them — no period stated (Schedule 1 §3.b)."
text_zh = "对象二 Service-Generated Data 与 Contact Data：终止后 Vercel 仍可保留、使用与披露（用途见 Schedule 1 §2.b），仅在「不再需要」时才匿名化或删除，未给期限（Schedule 1 §3.b）。"
anchor = "vercel-dpa-schedule1-3-b-service-generated-post-termination"

