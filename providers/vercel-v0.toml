kind = "processor"
anchor = "vercel-dpa-4-1-vercel-as-processor"

[[product.role.point]]
text = "Object one — Customer Data: for Customers on Enterprise or Pro plans, Customer acts as a Controller (or Processor) and Vercel is a Processor (DPA §4.1)."
text_zh = "对象一 Customer Data：Enterprise 或 Pro 档下，客户为 Controller（或 Processor）、Vercel 为 Processor（DPA §4.1）。"
anchor = "vercel-dpa-4-1-vercel-as-processor"

[[product.role.point]]
text = "Object two — Service-Generated Data and Contact Data: Vercel is the Controller for such data and processes it under its Privacy Notice (DPA §4.2, restated in Schedule 1 §1.b)."
text_zh = "对象二 Service-Generated Data 与 Contact Data：Vercel 就该数据为 Controller，按其隐私声明处理（DPA §4.2，Schedule 1 §1.b 重申）。"
anchor = "vercel-dpa-4-2-vercel-as-controller"

