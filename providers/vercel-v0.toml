By submitting Your Content on or through the Services, you grant Vercel a worldwide, non-exclusive, royalty-free, fully paid, sublicensable and transferable license to use, copy, modify, adapt, reproduce, distribute, display, publish, store, perform, and create derivatives of Your Content to provide and improve the Services, develop new products and services, secure and protect the Services and third parties from fraud, abuse, malware, malicious files or content, viruses and the like.

In addition, """
exact = "if you are on a Hobby plan or trial Pro plan, you agree that we may use Your Content to train our artificial intelligence (\"**AI**\") and machine learning models, and we may share Your Content with third parties for the purpose of developing and improving their products, including training and improving their AI and machine learning models (collectively, \"**Model Training**\"). If you are on a paid Pro plan, Model Training is not enabled by default and you may opt in to Model Training."
suffix = " You may opt-out of Model Training at any time by adjusting your Team account settings or by upgrading to an Enterprise plan."

