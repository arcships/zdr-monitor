[[product.role.point]]
text = "ToS §10.1 is the only clause in the Terms of Service that speaks to the processing role, and it states a disjunction: Vercel processes the personal information in Your Content, Account Information and System Data as a data controller or data processor in accordance with the DPA and the Privacy Policy."
text_zh = "ToS §10.1 是 ToS 里唯一直谈处理角色的条款，且是二选一表述：Vercel 就 Your Content、Account Information 与 System Data 中的个人信息「as a data controller or data processor」，以 DPA 与隐私政策为准。"

[[product.role.point]]
text = "No snapshot maps v0 Premium to a Vercel plan tier. The DPA's processor designation (DPA §4.1) covers only Enterprise or Pro plans; if this tier is one of them, Vercel would be a processor and the direction would flip. Both readings are kept, and the tier is recorded as controller for now."
text_zh = "快照没有 v0 Premium 与 Vercel 档位的对应关系。DPA §4.1 的 processor 定位只覆盖 Enterprise 与 Pro 档；若本档属于其中，Vercel 即为 processor，方向相反。两种读法并列保留，本档暂按控制方记。"
