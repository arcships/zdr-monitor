[[source]]
url = "https://vercel.com/legal/ai-product-terms"
channel = "contract"
tier = "core"
note = "《Vercel AI Product Terms》(Last Updated 2026-03-17，Effective 2026-03-31)。§1.1 明确把 v0 纳入 AI Products and Services；§6.2 规定 Hobby/Pro 的 Customer Content 受 ToS §3 许可约束；v0 专属条款规定有资格档位的不训练承诺；§11.3、§12 分别支撑终止后数据处理与美国运营地结论。"

[[source]]
url = "https://vercel.com/legal/terms"
channel = "contract"
tier = "core"
note = "《Vercel Terms of Service》(Last Updated June 1, 2026)。§3 按套餐区分 Model Training：Hobby 与 trial Pro 默认参与，付费 Pro 默认关闭并可 opt-in，用户可在 Team 设置退出或升级 Enterprise；§10.1 是快照里唯一直谈处理角色的条款（controller 或 processor，以 DPA 为准）；§10.4 定义 System Data 并允许协议期内与期后用于任意商业目的；§17.1 把免费 hobby 档与付费自助订阅档分列；§18.1 账户终止时 Your Content 可被永久删除。"

[[source]]
url = "https://vercel.com/legal/dpa"
channel = "contract"
tier = "core"
note = "《Data Processing Addendum》。§4.1 的 Processor 定位只覆盖 Enterprise 与 Pro 客户，§4.2 就 Service-Generated Data 与 Contact Data 定义 Vercel 为 Controller；§12.1 规定终止后删除、§12.2 保留法律要求例外；§13.1 说明主要处理设施位于美国并可能全球处理；Schedule 1 §3.b 与 Schedule 2 §15 是保留期限条款。"

[[product]]
id = "v0-free"
badge = "v0 Free"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "vercel-tos-3-model-training-by-plan"

[[product.training.point]]
text_zh = "v0 由 AI Product Terms 明确纳入；v0 Free 使用 Vercel Hobby 账户，默认参与模型训练，可在 Team Settings → Data Preferences 退出。范围含代码、v0 prompts、build/deployment telemetry、build errors 与 aggregate traffic stats。非模型训练的服务改进对 Hobby/Pro 不可退出，因此按 training=no。"

[product.zdr]
mark = "unknown"
searched = ["https://vercel.com/legal/ai-product-terms", "https://vercel.com/legal/terms", "https://vercel.com/legal/dpa"]

[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "vercel-aipt-11-3-termination-may-destroy"

[[product.retention.point]]
text = "Only a permissive statement at termination: Vercel may destroy Customer Content (AIPT §11.3). No quantified period for project code, vector indexes, caches, prompt history or telemetry."
text_zh = "仅有终止时 Vercel 可销毁 Customer Content（AIPT §11.3 的 may 是授权式表述，不是删除承诺）；项目代码、向量索引、缓存、prompt history 与遥测均无量化期限。"

[[product.retention.point]]
text = "Neighbouring clause for the same tier: All of Your Content on the Services (if any) may be permanently deleted by Vercel upon any termination of your account (ToS §18.1) — also permissive (may), not a deletion commitment."
text_zh = "同一档的相邻条款：账户终止时全部 Your Content「may be permanently deleted」（ToS §18.1）——同样是「可」而非「必须」删除，不构成删除承诺。"
anchor = "vercel-tos-18-1-your-content-permanently-deleted"

[[product.retention.point]]
text = "Logs and telemetry: ToS §10.4 defines System Data as including traffic data, telemetry, logs generated from the Services and usage statistics, and lets Vercel use it for any business purposes in its sole discretion during and after the term, with no retention period stated."
text_zh = "日志与遥测：ToS §10.4 把 traffic data、telemetry、logs、usage statistics 列为 System Data，并允许 Vercel 在协议期内与期后「for any business purposes in its sole discretion」，未给任何保留期限。"
anchor = "vercel-tos-10-4-system-data"

[product.processing_region]
codes = ["US"]
anchor = "vercel-aipt-12-controlled-operated-from-us"

[product.role]
kind = "controller"
anchor = "vercel-tos-10-1-vercel-role"

[[product.role.point]]
text = "ToS §10.1 is the only clause in the Terms of Service that speaks to the processing role, and it states a disjunction: Vercel processes the personal information in Your Content, Account Information and System Data as a data controller or data processor in accordance with the DPA and the Privacy Policy."
text_zh = "ToS §10.1 是 ToS 里唯一直谈处理角色的条款，且是二选一表述：Vercel 就 Your Content、Account Information 与 System Data 中的个人信息「as a data controller or data processor」，以 DPA 与隐私政策为准。"

[[product.role.point]]
text = "The DPA's processor designation (DPA §4.1) covers only Customers on Enterprise or Pro plans, so it does not reach this tier; with no processor designation in the contract, this tier is recorded as controller."
text_zh = "DPA §4.1 的 processor 定位只覆盖 Enterprise 与 Pro 档，不及于本档；合同中没有把本档定为 processor，故按控制方记。"
anchor = "vercel-dpa-4-1-vercel-as-processor"

[[product]]
id = "v0-premium"
badge = "v0 Premium"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "no"
mode = "not_disclosed"
anchor = "vercel-tos-3-model-training-by-plan"

[[product.training.point]]
text = "ToS §3 enables Model Training by default only for the Hobby plan and trial Pro plans, and turns it off by default for paid Pro plans. It does not name v0 Premium, and no snapshot in this file maps v0 Premium to a Vercel plan tier (ToS §17.1 separates the free hobby plan from paid self-service subscription plans), so a default-training permission is not established for this tier."
text_zh = "ToS §3 的默认训练只点名 Hobby 与 trial Pro，付费 Pro 则默认关闭；条款没有点名 v0 Premium，本文件的快照也没有 v0 Premium 与 Vercel 档位的对应关系（ToS §17.1 把免费 hobby 档与付费自助订阅档分列），故本档的默认训练授权不成立。"

[[product.training.point]]
text = "AIPT §7.3 gives a no-training warranty to an Enterprise subscription or another subscription plan that is entitled to opt out of training; whether v0 Premium falls in that set is not stated in any snapshot, so the direction cannot be settled from the documents. Recorded as no + not_disclosed: the vendor has text on the question, but no commitment for this tier."
text_zh = "AIPT §7.3 对 Enterprise 订阅「或其他有资格退出训练的订阅档」给出不训练保证；v0 Premium 是否落入该集合在快照里没有依据，方向无法从文档定论。故记 mark=no + not_disclosed：官方有表述，但本档没有承诺。"
anchor = "vercel-aipt-v0-no-training-entitled-plan"

