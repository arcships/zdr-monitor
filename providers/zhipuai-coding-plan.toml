anchor = "cpt-team-retention-grace-180d"

[[product.retention.point]]
text = "Read the 180 days together with its scope, which the structured fields alone cannot carry: it is a deletion window that opens on one termination path only — the service expiring without renewal — and it is an upper bound on when data gets deleted, not a request-level retention period. On this tier the request-level period stays undisclosed."
text_zh = "适用范围先写死(结构化字段承载不了):180 天只出现在「服务到期未续费→宽限期届满」这一条终止路径(七.1.b),性质是「到期/终止后的删除窗口(上限)」,不是请求内容保留期;本档请求级仍无天数。故 days=180 不得读成该档统一保留期"
anchor = "cpt-team-retention-grace-180d"

[[product.retention.point]]
text_zh = "保留侧(七.1.a):服务到期后未及时续费,您将无法调用 API、访问专属资源及使用套餐内功能,但您的账户信息、配置数据和应用元数据将被保留(保留多久未披露)"
anchor = "cpt-team-retention-account-kept"

[[product.retention.point]]
text_zh = "删除侧(七.1.b):宽限期 180 个自然日届满后,智谱有权终止服务并删除「您在服务期间产生的所有用户业务数据(包括但不限于对话历史、Fine-tuning 模型、应用配置等)」且不可恢复"
anchor = "cpt-team-retention-grace-180d"

[[product.retention.point]]
text = "The four early-termination events in 七.2 — mutual written agreement; your material breach; force majeure, large-scale or virus attacks, legal-policy change or other events beyond Zhipu's control; and Zhipu's own operational needs (business model, core cost, equity or business scope changes) — are stated with no data-deletion period at all. On those paths the deletion timing is undisclosed, which is why the 180-day window cannot be read as this tier's retention ceiling."
text_zh = "七.2 的四类提前终止情形(双方协商一致书面同意;您严重违约;不可抗力、大规模攻击、病毒攻击、法律政策变更等智谱无法控制的事由;智谱按运营需要提前通知)均未规定任何数据删除期限,这些路径下删除时点未披露。故 180 天不能当成本档保留上限"
anchor = "cpt-team-termination-other-paths"

[[product.retention.point]]
text_zh = "按对象分列落点:①用户业务数据(对话历史等输入输出正文、Fine-tuning 模型、应用配置)只在「到期未续费」路径上有 180 天删除窗口;②账户信息、配置数据、应用元数据在到期未续费后被保留,无期限披露;③缓存与备份副本、访问日志无团队专属条款,适用平台通用表述(用户协议三.10(3) 缓冲期、隐私政策五(二) 最短必要期限)"
anchor = "cpt-team-retention-account-kept"

[[product.retention.point]]
