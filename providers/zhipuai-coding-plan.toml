[product.training]
mark = "no"
anchor = "cpp-ua-training-anonymized"

[[product.training.point]]
text_zh = "本 provider(订阅档)自身没有按量 API 档"

[[product.training.point]]
text_zh = "按统一 products[] 结构保留 api 行,内容与 zhipu-bigmodel 同源同结论(同一法律主体、同一份《用户协议》《隐私政策》《服务协议》)。按量档同样无「不用于训练」承诺:四.10 匿名化训练授权、十.2 产品优化授权、十.3 永久免费许可。此行只用于说明订阅档与按量档共用平台通用条款,不重复主张按量档的档位归属"

[[product.training.point]]
text = "Reverse clue, deliberately left without an anchor: the 11th bullet under user agreement 三.4 forbids the customer from using the platform's models, prompts, generated content or exported data to develop, train, label, fine-tune, optimize or iterate any model outside the platform, and from using them to build algorithms or models competing with Zhipu. It binds the customer, not the vendor, so it says nothing about what Zhipu does with API input; read the other way round it would look like a no-training promise from the vendor, which it is not. No anchor is attached on purpose — an anchor here would make a customer-side duty look like vendor-side evidence."
text_zh = "反向线索(刻意不配锚点,防止误读):用户协议三.4 第 11 条约束的是客户——不得将平台内模型、提示词、生成内容及导出数据用于平台外模型或其他模型的开发、训练、标注、微调、优化、迭代,不得用于与智谱存在竞争关系的算法、模型。它是客户侧义务,不是厂商对 API 输入的处理,方向恰好相反,不能读成智谱的「不训练」承诺;因此不绑锚点"

