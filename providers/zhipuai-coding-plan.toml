[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "cpp-ua-retention-buffer-delete"

[[product.retention.point]]
text_zh = "同个人档:无量化请求级期限,只有「缓冲期届满删除含缓存与备份副本」「最小必要范围存储」「最短必要期限」三层定性表述。按对象分列落点:①用户上传数据(输入/输出正文、上传的文件)在自行删除、服务期限届满或服务提前终止后继续存储至「一定缓冲期(时限以相关产品文档所载明的时限为准)」届满,再删除所有相关数据含全部缓存与备份副本;②缓存与备份副本随①同删;③账户内个人信息按隐私政策五(二)最短必要期限保留、注销后按注销协议删除或匿名化"
anchor = "cpp-ua-retention-buffer-delete"

[[product.retention.point]]
text = "The only quantified period found on this tier is scoped to Batch job files, and it is recorded as a scoped exception so that basis=undisclosed reads as \"no period is disclosed for ordinary requests\" rather than \"no period exists anywhere on the platform\": the Batch guide states that the system keeps your data for 30 days only and deletes the files automatically after that."
text_zh = "本档唯一量化期限只覆盖 Batch 任务文件,登记为有范围的例外:Batch 数据指南原文「系统只保留您的数据 30 天…过期后文件将自动删除,无法恢复」。对象是 Batch 任务文件,不能外推到普通请求;写在这里是为了说明 basis=undisclosed 指「普通请求无量化期限披露」,不是「全站任何对象都没有期限」"
anchor = "cpp-batch-retention-30d"

[[product.retention.point]]
text = "Counter-direction clause in the same contract: user agreement 五.3① keeps, after the agreement ends, the platform's right to continue storing the information you left on it provided your user information is anonymized first. It sits beside 三.10(3) (delete all related data, caches and backups included, once the buffer period ends); the two are kept side by side and not averaged."
text_zh = "相反方向条款(同一份《用户协议》):五.3① 规定本协议终止后,平台「在匿名化处理您的用户信息的前提下,继续保存您留存于大模型开放平台的各类信息」。与三.10(3)「缓冲期届满删除所有相关数据含缓存与备份副本」并列保留,不取平均"
anchor = "cpp-ua-retention-anonymized-continue-keep"

[[product.retention.point]]
text = "Exception of a different kind — a statutory floor, not a period the vendor set: privacy policy 五(二)3 states that where the laws and regulations listed above impose a mandatory retention requirement, the platform cannot delete or anonymize your personal information even if you close the account or ask for deletion, and will do so once the statutory retention period ends."
text_zh = "法定留存例外(期限类型是法定下限,非厂商自设期限):隐私政策五(二)3「在前述法律法规有强制留存要求的情况下,即使您注销您的账户或要求删除您的个人信息,我们亦无法删除或匿名化处理您的个人信息」,法定保存期限届满后才删除或匿名化。注销协议三.2 为同向表述。适用性:隐私政策一(二)1 直接覆盖平台产品与服务(锚点 cpp-pp-scope-platform-services),本档无需经订阅协议搭桥"
anchor = "cpp-pp-legal-retention-exception"

[[product.retention.point]]
text_zh = "口径说明(本台账记账,不是厂商表述):同一句原文(用户协议三.10(3))在本文件记 object=mixed/basis=undisclosed——原文只写「一定缓冲期」且明言时限「以相关产品文档所载明的时限为准」,未披露任何天数,且与五.3① 的终止后继续保存权并存,故不记 until_termination。zhipu-bigmodel.toml 对同一句记 object=mixed/basis=until_termination,两行经 company 归并会同现于一个详情页,口径应对齐为 undisclosed;该文件的改动不在本文件范围内"

