anchor = "cpt-team-role-customer-data"

[[product.role.point]]
text = "Same-direction support inside the team-specific document (not a role determination): team agreement 十.3 — the copyright in anything you input stays with you or the original author, and \"智谱开放平台不主张对模型根据您的输入而生成的代码、文本等内容的所有权\" (the platform claims no ownership of the code or text the model generates from your input). Not claiming ownership of outputs points the same way as \"does not self-use, does not take possession of user data\", so it strengthens the processor reading without raising the strength of kind, which still rests on the platform-wide clauses."
text_zh = "同向补强(团队专属文件内,不构成角色定性):十.3「您使用本服务输入的任何内容的版权均归您或原作者所有,智谱开放平台不主张对模型根据您的输入而生成的代码、文本等内容的所有权」——平台不主张生成物所有权,方向上支持「不自用、不占有用户数据」,故只作补强,不上调 kind 强度"
