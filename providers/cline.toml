name = "Cline"
line = "cline"
site = "global"
plan_levels = ["individual", "enterprise"]
entity = "Cline Bot Inc."
endpoint = ""
doc = "https://docs.cline.bot/enterprise-solutions/overview.md"

[[source]]
url = "https://docs.cline.bot/enterprise-solutions/overview.md"
channel = "developer_data"
tier = "core"
note = "Cline Enterprise 官方架构页。只适用于企业自带推理（BYO）档：agent 与工具在客户选择的环境执行、推理走客户自有云合同，prompt 与代码上下文发往客户配置的模型提供方。2026-10 改版删去了「Your code never leaves your environment…no uploads, no indexing, no training on your data」及 Client-side execution / No data exfiltration / No model training 三张卡片，故本页只剩「在客户选择的环境运行 + 正文发往客户配置的 provider」这一架构事实，不得再由本页读出「正文不出客户环境」。该档与 cline-managed（使用 Cline 提供的 API key）方向不同，不得用于 cline-managed 的任何维度；上游模型条款仍由客户所选 provider 决定。"

[[source]]
url = "https://docs.cline.bot/more-info/telemetry"
channel = "developer_data"
tier = "core"
note = "扩展遥测页：用户可即时关闭；不含代码、路径、命令参数、对话、个人信息或密钥。企业另有可选 Prompt Storage，可备份会话到客户的 S3/R2，未披露统一期限。"

[[source]]
url = "https://cline.bot/privacy"
channel = "consumer_privacy"
tier = "core"
note = "Cline Privacy Notice。区分 BYOK（内容直接给第三方、Cline 不收集）与 Cline 提供 API key（Cline 收集并转发）；明确上游隐私和训练条款仍适用，并写明部分上游在用户未选择退出时可能用内容训练。"

[[product]]
id = "cline-managed"
badge = "Cline 托管推理"
category = "coding_plan"
plan_level = "individual"
label = "使用 Cline 提供的 API key：Cline 收集输入并代你转发给上游模型提供方。BYOK 时 Cline 不收集内容；企业自带推理档另见 enterprise-byo"

[product.training]
mark = "no"
searched = ["https://cline.bot/privacy", "https://docs.cline.bot/getting-started/authorizing-with-cline"]

[[product.training.point]]
text = "Multi-hop: Cline transmits the request to the upstream AI model provider on the user's behalf, and the notice says some AI model providers may use content for training unless the user has explicitly opted out where such an option is offered by that AI model provider. One hop is explicitly a no, so the whole chain is no."
text_zh = "多跳口径：本档请求由 Cline 代用户转给上游模型提供方，而隐私通知写明部分上游「may use content for training unless you have explicitly opted out where such an option is offered by that AI model provider」。任一跳明确为否则全链为否，故本档记 mark=no。对象=输入输出正文；语境=仅使用 Cline 提供的 API key 时（BYOK 时 Cline 不收集内容）；退出开关由上游决定、只在提供该选项的模型上存在，Cline 侧没有统一退出路径，因此不写 mode。"
anchor = "cline-managed-upstream-training"

[[product.training.point]]
text = "Secondary basis: Cline also uses the personal data it collects, which on this tier includes User Content, to administer, improve and personalize its own products and services. Service or product improvement counts as training under our judgment rules."
text_zh = "辅助依据：Cline 对自行收集的个人数据（本档包含 User Content）写明用于「Administer, improve, and personalize our products and services」。按判定口径「用来改进服务/提高质量算训练」，这也是训练维度的反向依据；主依据仍是上游跳那句。"
anchor = "cline-managed-additional-uses"

[[product.training.point]]
text = "Scope note: the no-training result on docs.cline.bot/enterprise-solutions/overview.md belongs to the enterprise BYO tier and is architectural, not a hosted commitment — on that tier the agent runs in the environment the customer chooses and prompts go to the customer's own configured provider. The same page scopes Cline's telemetry exclusion with 'except for requests to the Cline and ClinePass providers', i.e. this managed tier is exactly what the enterprise page's statements carve out, so nothing on that page may be cited for this tier."
text_zh = "适用范围：docs.cline.bot/enterprise-solutions/overview.md 的不训练结论属企业自带推理（BYO）档，且是架构性的、不是托管承诺——该档 agent 在客户选择的环境运行、prompt 发往客户自配的 provider。同页把 Cline 遥测不含代码/file contents/prompt 的例外限定为「except for requests to the Cline and ClinePass providers」，即本托管档正是该页表述被排除的那一种，不得引用该页任何表述。"
anchor = "cline-enterprise-scoped-telemetry"

[product.zdr]
mark = "unknown"
searched = ["https://cline.bot/privacy", "https://docs.cline.bot/getting-started/authorizing-with-cline"]

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "cline-managed-collects"
searched = ["https://cline.bot/privacy", "https://docs.cline.bot/more-info/telemetry"]

[[product.retention.point]]
text = "Object = input and output content; context = only when using API keys provided by Cline (BYOK does not apply, Cline does not collect it); period type = undisclosed, as the notice sets no quantified period and no deletion point for request content. This anchor only shows that the tier does collect the content; it is not evidence of a period."
text_zh = "对象=输入输出正文；语境=仅使用 Cline 提供的 API key 时（BYOK 时 Cline 不收集，不适用）；期限类型=未披露——通知对正文既没有量化期限也没有删除承诺。本锚点只证明该档位确实收集正文，不含期限或删除时点，不能当作期限证据。"
anchor = "cline-managed-collects"

[[product.retention.point]]
text = "The only quantified period in the notice is the cookie consent preference of 12 months; its object is cookie preferences, not request content, so it is not evidence of a content retention period."
text_zh = "通知里唯一的量化期限是 cookie 同意偏好 12 个月，对象是 cookie 偏好而非输入输出正文，不构成正文保留期限的依据。"
anchor = "cline-cookie-consent-12-months"

[product.processing_region]
codes = ["unknown"]
searched = ["https://cline.bot/privacy", "https://docs.cline.bot/getting-started/authorizing-with-cline"]

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://cline.bot/privacy", "https://docs.cline.bot/more-info/telemetry"]

[[product.role.point]]
text = "No role is designated in the public text: the notice states that it is not a contract and does not create any legal rights or obligations not otherwise provided by law, and controller or processor appears nowhere in the snapshot."
text_zh = "公开文本未指定角色：通知明写自身「is not a contract and does not create any legal rights or obligations not otherwise provided by law」，快照全文没有 controller / processor 的角色指定。"
anchor = "cline-privacy-not-a-contract"

[[product.role.point]]
text = "Controller posture is only an inference from the structure of the notice: Cline decides purposes for the personal data it collects, including administering, improving and personalizing its own products and services. That is not a designated role, and an enterprise DPA has to be obtained separately."
text_zh = "独立控制者姿态只是从通知结构推断：Cline 为自身目的（管理、改进与个性化自家产品与服务）决定所收集个人数据的处理方式，不是原文的角色指定；企业 DPA 需另行索取。"
anchor = "cline-managed-additional-uses"

[[product]]
id = "enterprise-byo"
badge = "企业版自带模型"
category = "self_host"
plan_level = "enterprise"
label = "Cline Enterprise：agent 与工具在客户选择的环境执行、推理走客户自有云合同（BYO），prompt 与代码上下文发往客户配置的模型提供方；Cline 不在内容链路上，不涵盖使用 Cline 提供 API key 的托管档（见 cline-managed）"

[product.training]
mark = "yes"
mode = "by_deployment"
anchor = "cline-privacy-byok-not-collected"

[[product.training.point]]
text = "The no-training result is architectural, not a vendor commitment: on this tier the customer brings its own inference (its existing cloud contracts and negotiated rates), the agent and its tools run in the environment the customer chooses, and prompts and code context go to the model provider the customer configures. The privacy notice adds that where you use your own API keys the user content goes directly to the third-party provider and Cline does not collect it — Cline holds nothing it could train on."
text_zh = "不训练来自部署形态、不是厂商承诺：本档客户自带推理（用自己的既有云合同与议定价），agent 与工具在客户选择的环境运行，prompt 与代码上下文发往客户配置的模型提供方。隐私通知补充：使用自有 API key 时 User Content 直接给第三方提供方、Cline 不收集——Cline 手里没有可以用来训练的内容。"
anchor = "cline-enterprise-prompts-to-provider"

[[product.training.point]]
text = "Basis narrowed by the 2026-10 rewrite: the page deleted 'Your code never leaves your environment. Cline processes everything locally - no uploads, no indexing, no training on your data.' and the 'No model training' card ('Your code and prompts aren't used for training'), so those sentences may no longer be quoted. What survives on the page (Cline runs in the environment you choose, prompts and code context go to the provider you configure, Cline connects directly to your providers) still shows Cline is not in the content path, which is where the by_deployment result comes from."
text_zh = "依据收窄（2026-10 改版）：页面删去了「Your code never leaves your environment. Cline processes everything locally - no uploads, no indexing, no training on your data.」与 No model training 卡片（「Your code and prompts aren't used for training」），这两句从此不得引用。页面存留的表述（Cline runs in the environment you choose、prompts and code context go to the provider you configure、Cline connects directly to your providers）仍表明 Cline 不在内容链路上，by_deployment 的结论即来自这一点。"

[[product.training.point]]
text = "Upstream hop: inference runs on the customer's own cloud contracts and negotiated rates, so whether the chosen provider trains on the content is governed by that provider's terms; Cline makes no commitment about it."
text_zh = "上游跳：推理走客户自有的云合同与议定价格，内容是否被训练取决于客户所选 provider 的条款，Cline 对此不作承诺。"
anchor = "cline-enterprise-byo"

[product.zdr]
mark = "yes"
mode = "by_deployment"
anchor = "cline-privacy-byok-not-collected"

[[product.zdr.point]]
text = "Zero retention on Cline's side is architectural, not a vendor ZDR commitment: where customers use their own API keys the privacy notice says the content goes directly to the third-party provider and Cline does not collect it, and the overview page says prompts and code context go to the model provider the customer configures."
text_zh = "Cline 侧的零保留是架构性的，不是厂商 ZDR 承诺：隐私通知写明客户使用自有 API key 时正文直接给第三方提供方、Cline 不收集；概览页写明 prompt 与代码上下文发往客户配置的模型提供方。"
anchor = "cline-enterprise-prompts-to-provider"

[[product.zdr.point]]
text = "Scope limit: this no longer means the content stays inside the customer's environment. The 2026-10 rewrite removed 'Your code never leaves your environment' and 'Code and context never transmitted externally', and the surviving text sends the content to the customer's configured provider. Whether that upstream hop retains anything follows the chosen provider's terms and is not a Cline ZDR commitment; Cline's own telemetry still excludes code, file contents and prompts, except for requests to the Cline and ClinePass providers."
text_zh = "适用边界：这已不等于「正文不出客户环境」。2026-10 改版删去「Your code never leaves your environment」与「Code and context never transmitted externally」，存留表述把正文发往客户配置的 provider。该上游跳是否保留取决于客户所选 provider 的条款，不是 Cline 的 ZDR 承诺；Cline 自家遥测仍不含代码、文件内容与 prompt（requests to the Cline and ClinePass providers 除外）。"
anchor = "cline-enterprise-scoped-telemetry"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "cline-enterprise-prompts-to-provider"

[[product.retention.point]]
text = "Object = input and output content (code, prompts and context); context = this BYO tier. The page states these go to the model provider the customer configures, and the privacy notice states Cline does not collect them where the customer uses its own API keys, so no Cline-side period applies; neither document sets a Cline-side period or deletion point, and retention on the upstream hop is not addressed here. This anchor only shows that the tier transmits the content to the customer's provider; it is not evidence of a period."
text_zh = "对象=输入输出正文（代码、prompt 与上下文）；语境=本 BYO 档。页面写明正文发往客户配置的模型提供方，隐私通知写明客户使用自有 API key 时 Cline 不收集，故 Cline 侧无保留期可言；两份文档都没有 Cline 侧的期限或删除时点，上游跳的保留也不在此列。本锚点只证明该档位把正文发往客户所选 provider，不含期限或删除时点。"
anchor = "cline-enterprise-prompts-to-provider"

[[product.retention.point]]
text = "Object = conversation history when the enterprise Prompt Storage feature is enabled: backed up to AWS S3 or Cloudflare R2, with ownership and period not stated in the snapshot, so no period can be given for this tier."
text_zh = "对象=启用企业档 Prompt Storage 后的会话历史：备份到 AWS S3 或 Cloudflare R2，快照未说明归属与期限，故本档不给期限。"
anchor = "cline-prompt-storage"

[product.processing_region]
codes = ["selected"]
anchor = "cline-enterprise-runs-where-you-choose"

[[product.processing_region.point]]
text = "Processing location = the environment the customer chooses: the page says Cline runs in the environment you choose, on developers' computers or on remote hosts they connect it to, and gives no region list of its own."
text_zh = "处理地=客户选择的环境：页面写明 Cline runs in the environment you choose，是开发者的电脑或客户自行连接的远端主机，未给自家的区域清单，故记「可选地域」。"
anchor = "cline-enterprise-runs-where-you-choose"

[[product.processing_region.point]]
text = "The inference hop is likewise the customer's own: the page says the customer brings its own inference on its existing cloud contracts and negotiated rates and that Cline connects directly to the customer's providers, so that hop's region is set by the customer's own provider account."
text_zh = "推理那一跳同样是客户自己的：页面写明客户自带推理、用自己的既有云合同与议定价，且 Cline 直连客户自己的 provider，故该跳区域由客户自己的 provider 账号决定。"
anchor = "cline-enterprise-byo"

[product.role]
mark = "unknown"
kind = "unknown"
searched = ["https://docs.cline.bot/enterprise-solutions/overview.md", "https://cline.bot/privacy"]

[[product.role.point]]
text = "Neither the enterprise page nor the privacy notice designates Cline as controller or processor for this tier; the notice states it is not a contract, and on this tier Cline is not in the content path at all, so the role has to be settled in the customer's own agreement with Cline."
text_zh = "企业页与隐私通知都没有指定本档的 controller / processor 角色；通知明示自身不是合同，而本档 Cline 不在内容链路上，角色只能在客户与 Cline 的合同里确认。"
anchor = "cline-privacy-not-a-contract"

