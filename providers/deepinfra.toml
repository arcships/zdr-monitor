channel = "consumer_privacy"
tier = "core"
note = "《DeepInfra Privacy Policy》(Last modified: August 15th 2026)，主体 DeepInfra, Inc.，适用范围含 Website 与 APIs。是 processing_region 的权威来源（唯一写明「specifically in the United States」的官方文件）；§Data submitted to and returned by our inference Service 是 training/retention 的并列来源；§Disclosure 的「shared with the relevant API endpoints」是 Google/Anthropic 多跳链路的第二处官方依据；§Data Retention 给出账号 PII 的 30 天期限。该政策本身被合同 §5(a) 以引用方式纳入，但合同同时声明 ZDR 条款优先于它。"

[[source]]
url = "https://deepinfra.com/terms"
channel = "contract"
tier = "core"
note = "《DeepInfra Terms of Service》(Last modified: August 17th, 2026)，签约主体 Deep Infra Inc.（Delaware）。形式上是 Order Form 制企业合同（§1「Provider has no obligation to provide any Services until a Service Order is executed」），但开头写明「By executing a Service Order that references these Terms, or by accessing or using the Services, Customer agrees to these Terms」，故自助注册使用 API 同样受约束——本台账按 contract 通道、覆盖 API 档全部档位。§7(b) 是 training 与 zdr 的权威条款（含术语「Zero Data Retention」）；§5(a) 是优先性声明（ZDR 优先于隐私政策及任何网页/文档）；§5(a)/§5(b)/§6(a) 是 role 的依据；§7(b)(i) 是 retention 的支持工单例外；§18 是第三方模型子集的依据。全文无 DPA 正文、无 controller/processor 字样、无处理地条款。"

[[source]]
url = "https://docs.deepinfra.com/account/data-privacy"
channel = "developer_data"
tier = "core"
note = "文档站《Data Privacy》页，标题即「How DeepInfra handles your data during inference — what's stored, what's not」，是 retention 维度的权威来源，也是全站唯一点名 Google / Anthropic 上游存储与训练政策例外、批量推理落盘、图片生成输出存储、以及日志只记元数据、不记请求正文的地方。隐私政策 §Data submitted... 直接以链接指向本页。该页的四项例外在合同 §7(b) 的例外清单中都没有对应文字，构成本家最大的冲突面。同时抓了 .md 直连通道（https://docs.deepinfra.com/account/data-privacy.md），正文与渲染版一致（仅「deleted from memory.The same applies」等处空格差异），锚点以渲染版为准。"

[[source]]
url = "https://docs.deepinfra.com/gpu-instances/overview.md"
channel = "developer_data"
tier = "core"
note = "文档站《GPU Instances》总览页（专属部署档里 GPU 实例租用这一半）。本轮为补 private-models-and-gpu-instances 档的 retention 维度而抓取：全页唯一与数据处置有关的一句是容器销毁即永久丢失全部容器数据，没有任何请求级保留期、训练或区域表述。"

[[source]]
url = "https://docs.deepinfra.com/private-models/overview.md"
channel = "developer_data"
tier = "core"
note = "文档站《Deploy Private Models》总览页（专属部署档里私有模型部署这一半）。全页唯一与数据处置有关的一句是隔离性表述——数据留在专属基础设施、不与其他用户共享，讲的是隔离而不是期限；没有保留期限、训练政策或区域说明，这是本档 training / zdr 记 not_found 的文档层依据之一。"

[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "deepinfra-tos-7b-no-training"

[[product.training.point]]
text_zh = "同顶层 training：合同 §7(b) 不用于训练，例外为「as necessary to provide the Services (e.g., fine-tuning a model for Customer's use)」"

[[product.training.point]]
text = "The Privacy Policy makes the same promise conditionally: 'We will not store, sell, or train using this data unless we have your explicit consent' — i.e. with explicit consent DeepInfra may store, sell, or train on API inputs and outputs. The docs page states the rule without that condition and names only the Google/Anthropic exceptions."
text_zh = "隐私政策 §Data submitted to and returned by our inference Service 是条件式承诺：「We will not store, sell, or train using this data unless we have your explicit consent」——即获得你的明确同意后即可存储、出售或训练。docs /account/data-privacy 页没有这一条件，只有 Google/Anthropic 例外，两者措辞不同、并列保留。无退出/申请机制说明。"
anchor = "deepinfra-privacy-inference-data-no-store-sell-train"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "deepinfra-tos-7b-zdr-commitment"

[[product.zdr.point]]
text_zh = "同顶层 zdr：合同 §7(b) 的「Zero Data Retention」为默认承诺，§5(a) 声明其优先于隐私政策及任何网页/文档"

[[product.zdr.point]]
text_zh = "例外 (i)(ii)(iii)"

[[product.zdr.point]]
text_zh = "与 docs 页的四项例外冲突，两条并列。"

[product.retention]
object = "input_output"
basis = "none"
anchor = "deepinfra-tos-7b-zdr-commitment"

[[product.retention.point]]
text = "Context: default online inference. The Section 7(b) Zero Data Retention commitment says Customer Data is not retained, stored, or logged beyond the period strictly necessary to process and return the request, after which it is deleted from Provider's systems; the docs page says the same for inference APIs."
text_zh = "语境=默认在线推理。主证据用合同 §7(b) 的 Zero Data Retention 句：Customer Data 不留存超过「处理并返回该请求所严格必需的期间」，之后从系统删除；docs /account/data-privacy 同旨（输入不落盘、只在推理期留内存、完成即从内存删除，输出同理）。期限类型=不保留／处理完即删除。"
anchor = "deepinfra-docs-dataprivacy-input-not-stored-on-disk"

[[product.retention.point]]
text = "Exception 1 — outputs of image generation models are stored for a short period of time to allow easy access; no length is quantified."
text_zh = "例外①图片生成输出：「Outputs of image generation models are stored for a short period of time to allow easy access」——短期存储，具体期限未量化。"
anchor = "deepinfra-docs-dataprivacy-image-outputs-stored"

[[product.retention.point]]
text = "Exception 2 — bulk inference (several requests in one call): data may be stored for a longer period, potentially on disk in encrypted form, and is deleted from disk and memory after a short retention period once results are returned."
text_zh = "例外②批量推理：可能「store data for a longer period, potentially on disk in encrypted form」，结果返回后「deleted from disk and memory after a short retention period」——加密落盘 + 短期，期限未量化。"
anchor = "deepinfra-docs-dataprivacy-bulk-inference-disk-storage"

[[product.retention.point]]
text = "Logs: DeepInfra does not log the content of requests and logs only metadata useful for debugging (request ID, cost, sampling parameters). Object: access logs, not request content. The page no longer reserves the right to log a small portion of requests for debugging or security, so this is no longer an exception to the retention commitment."
text_zh = "日志口径：「We do not log the content of your requests. We log only metadata useful for debugging: request ID、cost、sampling parameters」——对象是访问日志、不是输入输出正文。原先的例外表述「We reserve the right to log a small portion of requests when necessary for debugging or security purposes」已从现行页面删除，本档例外因此只剩四项。"
anchor = "deepinfra-docs-dataprivacy-logs-metadata-debug-exception"

[[product.retention.point]]
text = "Exception 3 — Google / Anthropic models: the output is stored by the receiving company under its own policy, and DeepInfra quantifies no period."
text_zh = "例外③上游一跳（Google/Anthropic 模型）：输出由上游存储，期限适用上游政策，DeepInfra 未量化。"
anchor = "deepinfra-docs-dataprivacy-google-stores-output"

[[product.retention.point]]
text = "Exception 4 — Google models: Google logs prompts and responses for a limited period solely to detect violations of its Prohibited Use Policy, so the input side is recorded upstream as well."
text_zh = "例外④上游记录输入侧（Google 模型）：「Google logs prompts and responses for a limited period solely to detect violations of their Prohibited Use Policy」。"
anchor = "deepinfra-docs-dataprivacy-google-logs-prompts-and-responses"

[[product.retention.point]]
text = "The Privacy Policy keeps a conditional promise about the same object: inputs and outputs will not be stored, sold, or trained on unless DeepInfra has your explicit consent. It does not match the unconditional docs page wording; both are kept."
text_zh = "隐私政策对同一对象是条件式承诺：「We will not store, sell, or train using this data unless we have your explicit consent」——与 docs 页的无条件「不落盘、完成即删」措辞不同，两条并列保留。"
anchor = "deepinfra-privacy-inference-data-no-store-sell-train"

[[product.retention.point]]
text = "Object: account-level Personal Information, not request content. Retained while you use the services, as required by law, or as otherwise communicated to you; after an account is deleted it is removed after 30 days. The sentence says 'as specified in our terms', but the current Terms contain no such 30-day account-deletion clause (the 30 days in Section 7(b)(i) is a support-ticket exception)."
text_zh = "对象=账号层 PII（不是输入输出正文）：语境=默认，期限类型=开放式保留（「for as long as you use our services, as required by law, or as otherwise communicated to you」）＋删号后 30 天。该句自称「as specified in our terms」，但现行 ToS 通篇没有账号删除 30 天的条款（§7(b)(i) 的 30 天是支持工单例外），属原文内部引用链断裂。"
anchor = "deepinfra-privacy-account-deletion-30-days"

[product.processing_region]
codes = ["US"]
anchor = "deepinfra-privacy-processing-in-united-states"

[[product.processing_region.point]]
text_zh = "同顶层 processing_region：隐私政策「specifically in the United States」；基础设施子处理方为 AWS / GCP；无区域选择。"

[product.role]
kind = "processor"
anchor = "deepinfra-tos-5a-processes-on-behalf-of-customer"

[[product.role.point]]
text_zh = "同顶层 role：合同 §5(a)「on behalf of Customer」+ §5(b) 客户合法性基础义务 + §6(a) 子处理方受托，构成 processor 定位"

[[product.role.point]]
text_zh = "隐私政策部分对象为自身网站/账号数据，属独立控制方，两层对象不同。"

[[product]]
id = "api-third-party-hosted-models"
badge = "第三方模型"
category = "api"
plan_level = "any"

[product.training]
mark = "no"
anchor = "deepinfra-docs-dataprivacy-no-training-except-google-anthropic"

[[product.training.point]]
text_zh = "docs /account/data-privacy §No training：「We do not use data you submit to our APIs for training models, except when using Google or Anthropic models, where the receiving company's training policy applies」——本档正是被该例外点名的子集，DeepInfra 侧的不训练承诺不覆盖它，训练政策由上游决定。按判定口径（未排除模型训练就不能替厂商排除）记 mark=no。合同 §7(b) 的「不用于训练」未点名此例外，两条并列。置信度 medium：DeepInfra 侧只说「适用上游政策」，未说明上游具体条款。"

[product.zdr]
mark = "no"
anchor = "deepinfra-docs-dataprivacy-google-stores-output"

[[product.zdr.point]]
text = "Requests of this subset have to be transferred to the upstream endpoints to be fulfilled, and the docs page discloses that the upstream hop retains: Google stores the output of Google models and Anthropic the output of Anthropic models, and Google additionally logs prompts and responses for a limited period. Under the ledger's multi-hop rule — one hop that clearly does not retain zero makes the whole chain non-ZDR — this subset has no end-to-end zero retention."
text_zh = "本档请求必须转到上游端点才能完成，而 docs /account/data-privacy 明示上游一跳会留存：Google 模型下「Google will store the output as outlined in their Privacy Notice」，Anthropic 模型下同理；且 Google 还会为检测其禁用政策违规记录 prompts 与 responses 一段时间。按多跳口径「任一跳明确为否，则全链为否」记 mark=no。"
anchor = "deepinfra-docs-dataprivacy-google-stores-output"

[[product.zdr.point]]
text = "The contract points the other way and is kept alongside: Section 5(a) says the Section 7(b) Zero Data Retention commitment controls over the Privacy Policy and any other Provider policy, webpage, or documentation and applies to all Customer Data, and the Section 7(b) exception list does not name Google or Anthropic. The docs page's upstream exceptions have no counterpart in the contract, so the conflict is unresolved in the public documents."
text_zh = "合同方向相反，两条并列保留：§5(a) 称 §7(b) 的 Zero Data Retention 承诺优先于隐私政策及任何 Provider 政策/网页/文档，且「applies to all Customer Data」，§7(b) 的例外清单 (i)(ii)(iii) 也未点名 Google / Anthropic；docs 页的上游存储例外在合同层没有对应文字。冲突在公开文件中未解，本维度按全链最弱一跳记。置信度 medium。"
anchor = "deepinfra-tos-5a-zdr-applies-to-all-customer-data"

[[product.zdr.point]]
text_zh = "§18 那句「第三方内容受第三方许可、使用条款与隐私政策专属管辖」是风险与准据法分配条款，没有说上游这一跳能否零保留，不构成对 zdr 维度的表述，故不再绑在本条；该 anchor 定义仍保留在本文件中（现无维度引用它）。它也未指名 Google / Anthropic，也未把它们列为子处理方（docs /account/subprocessors 同样未列）。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "deepinfra-docs-dataprivacy-google-stores-output"

[[product.retention.point]]
text = "Output side: the docs page says Google stores the output of Google models under its Privacy Notice, and Anthropic stores the output of Anthropic models under its Trust Center — the output is stored upstream, period set by the upstream policy. The contract's ZDR text has no such exception and Section 5(a) says ZDR controls over any other Provider policy, webpage, or documentation; both are kept."
text_zh = "输出侧：docs /account/data-privacy 明示「If you opt to use a Google model, Google will store the output as outlined in their Privacy Notice」——输出由上游存储，期限适用上游政策。合同 §7(b) 的 ZDR 文本没有这一例外，且 §5(a) 称 ZDR 优先于「any other Provider policy, webpage, or documentation」，两条并列。"
anchor = "deepinfra-docs-dataprivacy-google-stores-output"

[[product.retention.point]]
text = "Anthropic models: the same storage statement, referring to Anthropic's Trust Center."
text_zh = "Anthropic 模型同义句：「If you opt to use an Anthropic model, Anthropic will store the output as outlined in their Trust Center」。"
anchor = "deepinfra-docs-dataprivacy-anthropic-stores-output"

[[product.retention.point]]
text = "Input side: for Google models, Google logs prompts and responses for a limited period solely to detect violations of its Prohibited Use Policy, so the input side is retained upstream too and the period is set by the upstream policy."
text_zh = "输入侧（原文缺失的一层）：Google 模型下「Google logs prompts and responses for a limited period solely to detect violations of their Prohibited Use Policy」——上游不仅存输出，还记录输入侧的 prompts，期限由上游政策定。"
anchor = "deepinfra-docs-dataprivacy-google-logs-prompts-and-responses"

[product.processing_region]
basis = "undisclosed"
anchor = "deepinfra-docs-dataprivacy-transfer-to-third-party-endpoints"

[[product.processing_region.point]]
text = "The only official sentence about where this subset's data goes: DeepInfra does not share API data with third parties except when using Google or Anthropic models, where it is required to transfer data to those endpoints to fulfil the request. The sentence proves a receiving hop exists; it says nothing about that hop's identity or processing location."
text_zh = "该子集数据去向的唯一直接官方句：「We do not share data you submit to our APIs with any third party, except when using Google or Anthropic models, where we are required to transfer data to those endpoints to fulfill the request」——只证明存在一跳接收方，未说明其身份与处理地。"
anchor = "deepinfra-docs-dataprivacy-transfer-to-third-party-endpoints"

[[product.processing_region.point]]
text_zh = "该子集的请求被转到上游端点处理，但 DeepInfra 未披露上游端点的处理地；隐私政策的「specifically in the United States」是否覆盖上游一跳未说明。置信度 low。"

[product.role]
kind = "unknown"
anchor = "deepinfra-privacy-shared-with-relevant-api-endpoints"

[[product.role.point]]
text = "There is at least one more hop that can reach the content of this subset: data has to be transferred to those upstream endpoints to fulfil the request."
text_zh = "该子集存在另一跳能拿到内容：docs §No sharing「we are required to transfer data to those endpoints to fulfill the request」。该句只证明存在一跳接收方，未说明其身份与处理地。"
anchor = "deepinfra-docs-dataprivacy-transfer-to-third-party-endpoints"

[[product.role.point]]
text_zh = "隐私政策只说数据「will be shared with the relevant API endpoints, as specified at the time of use」，合同 §18 说受第三方条款约束。上游是 DeepInfra 的子处理方还是独立控制方、主体是谁，均未披露。置信度 low。"

