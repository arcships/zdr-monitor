[product.retention]
object = "mixed"
basis = "undisclosed"
anchor = "deepinfra-docs-gpu-instances-container-data-lost-on-terminate"

[[product.retention.point]]
text_zh = "结论：本档没有请求级的量化保留期，官方只给出一条容器级的事实。(a) GPU 实例租用这一半：docs /gpu-instances/overview「All container data is permanently lost when terminated. Save your work before stopping.」——对象是客户自己写进容器的数据（经 SSH 上传的权重、数据集、训练产物、容器内日志），语境是默认，期限类型是事件触发：容器存续期间数据一直留在 DeepInfra 的机器上，销毁时永久丢失，何时销毁由客户决定，官方不另设期限。(b) 私有模型部署这一半：docs /private-models/overview 全页只有一句隔离性表述「data stays on dedicated infrastructure, not shared with other users」，讲的是不与其他租户共享，不是期限"

[[product.retention.point]]
text_zh = "该页没有任何保留期表述。(c) 合同层为什么补不上：§7(b) 的「not retain, store, or log ... beyond the period strictly necessary」与 Zero Data Retention 承诺，对象都是 Customer Data，而 §7(b) 把 Customer Data 定义为「data, content, materials, or requests into the Provider-run models as part of the Services」——客户自管模型与自租 GPU 上的数据是否属「Provider-run models」在公开条款中无解，与本档 training / zdr 两维记 not_found 同因。(d) 推理请求正文：docs /account/data-privacy 的「不落盘、推理完成即从内存删除」以「the data you submit to our APIs」为限定语，本档私有部署自带的 OpenAI 兼容端点是否算在内，官方未表态。(e) 本轮查过 https://deepinfra.com/terms、https://deepinfra.com/privacy、https://docs.deepinfra.com/account/data-privacy、https://docs.deepinfra.com/llms.txt、https://docs.deepinfra.com/gpu-instances/overview.md、https://docs.deepinfra.com/private-models/overview.md，未找到任何针对本档的天数、区间或日志保留窗口。"

[product.processing_region]
codes = ["US"]
anchor = "deepinfra-privacy-processing-in-united-states"

[[product.processing_region.point]]
text_zh = "结论：美国，未披露任何可选区域。(a) 依据与 api 档同源，适用性靠公司级口径承接：隐私政策「Your data may be transferred, stored, and processed outside of your jurisdiction, specifically in the United States」——该句写在 Deep Infra Inc.（Delaware）的公司级隐私政策里，对象是「your data」，没有按产品档位设限"

[[product.processing_region.point]]
text_zh = "合同 §5(a) 又把数据处理整体指向这份隐私政策（「such processing is governed by Provider's privacy policy ... incorporated by reference」），故本档落在其中。(b) 本档自身文档没有区域信息：/gpu-instances/overview 与 /private-models/overview 全页不出现 region / location / data center 字样"

[[product.processing_region.point]]
text_zh = "创建容器的接口请求体只有 name、gpu_config、container_image、cloud_init_user_data 四个字段，没有区域参数——即文档层既未披露具体机房，也未提供区域选择能力。(c) 反向的口子：合同 §6(b) 允许 Provider 随时「substitute, reconfigure, upgrade, maintain, replace, relocate, or use alternate Provider-controlled infrastructure」，未限定地域。(d) 不确定性（本条为承接推断，非本档单独表态）：官方没有针对专属部署 / GPU 租用的区域声明，这里是「公司级隐私政策未排除本档」的读法"

[[product.processing_region.point]]
text_zh = "deepinfra.com/dpa 为 404，无公开 DPA 可核对数据所在地条款。"

[product.role]
kind = "processor"
anchor = "deepinfra-tos-5a-processes-on-behalf-of-customer"

[[product.role.point]]
text_zh = "结论：受托处理方（processor），但比 api 档弱一档。(a) 依据：合同 §5(a)「To the extent Provider processes personal data or other data or sensitive information on behalf of Customer in providing the Services, such processing is governed by Provider's privacy policy ...」——限定语是「the Services」，而 §1 把 Services 定义为「the services described as the responsibility of Provider (the \"Services\") in each Service Order」，即由订单界定、并不限于按量 API：专属部署与 GPU 租用一经下单即落入其中。这与 §7(b) 不同——后者的对象 Customer Data 被收窄到「requests into the Provider-run models」，所以 training / zdr 两维在本档记 not_found，而角色维度不受那条收窄影响，这是本档五维结论不一致的原因。(b) 佐证：§4(a)「Provider shall use commercially reasonable efforts to maintain the network, power, and physical environment for the servers provided as part of the Services」——本档的服务器仍由 DeepInfra 运维，不是客户自有机房，客户买到的是专属算力而非自建设施"

[[product.role.point]]
text_zh = "§5(b) 要求客户自备提供数据的「rights, consents, notices, and lawful bases」，是控制方侧义务，与 processor 定位配套。(c) 不确定性：合同全文不出现 processor / controller 字样，未引用 GDPR Art.28，也未附 SCC"

[[product.role.point]]
text_zh = "deepinfra.com/dpa 为 404，没有公开 DPA 可核对本档的角色条款与子处理方安排。(d) 边界：GPU 实例租用档客户对容器内环境有 root / SSH 控制权，客户在容器里自行处理第三方个人数据时的角色分层（客户是否成为该场景下的控制方），公开条款未作区分。"

