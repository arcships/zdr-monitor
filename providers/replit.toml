[[product]]
id = "pro"
badge = "Pro 团队档"
category = "coding_plan"
plan_level = "team"

[product.training]
mark = "no"
mode = "opt_out"
anchor = "pro-training-and-optout"

[[product.training.point]]
text = "The Pro Agreement licenses the content for training and provides the exit in the same breath: Replit may also use Customer Content to develop, train, and improve its models and AI Features, and customers can opt out through the settings page."
text_zh = "Pro 协议在同一处既给出训练许可也给出退出通道：Replit 可将客户内容用于开发、训练与改进其模型与 AI 功能，客户可通过设置页退出。"

[[product.training.point]]
text = "The documented path is Settings → Personalization → opt out of Model Improvement, and it applies to new content associated with the account."
text_zh = "文档给出的路径是 Settings → Personalization → 关闭 Model Improvement，作用于该账号此后产生的新内容。"
anchor = "model-improvement-pro-only"

[[product.training.point]]
text = "Upstream endpoint behaviour is set by Replit's OpenRouter configuration, not by the user: paid endpoints have training disabled, free endpoints may train on prompts and completions and may publish them to public datasets."
text_zh = "上游端点行为由 Replit 的 OpenRouter 配置决定，而非用户：付费端点关闭训练，免费端点可用提示词与补全做训练，并可能发布到公开数据集。"
anchor = "aiintegrations-selfserve-defaults"

[product.zdr]
mark = "unknown"
searched = [
  "https://replit.com/pro-agreement",
  "https://replit.com/dpa",
  "https://replit.com/privacy-policy",
  "https://docs.replit.com/features/integrations/replit-ai-integrations",
  "https://docs.replit.com/features/security/shared-responsibility-model",
  "https://replit.com/enterprise-agreement",
]

[[product.zdr.point]]
text = "The Pro Agreement contains no zero-data-retention commitment, and the DPA does not mention ZDR either. In Replit's documentation ZDR exists only as an Enterprise routing rule."
text_zh = "Pro 协议没有零数据保留承诺，DPA 也没有提到 ZDR。在 Replit 文档里 ZDR 只作为企业档的路由规则存在。"
anchor = "aiintegrations-enterprise-zdr-only"

[[product.zdr.point]]
text = "That Enterprise rule is explicit about being tier-specific: only models with a Zero Data Retention policy are available, so Enterprise requests are only routed to endpoints that do not retain any data — with the stated trade-off that fewer models are available."
text_zh = "那条企业规则明确是按档位限定的：只提供带零数据保留政策的模型，因此企业请求只路由到不保留任何数据的端点——代价是可用模型更少。"
anchor = "aiintegrations-enterprise-zdr-rationale"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "privacy-retention-deidentify"

[[product.retention.point]]
text = "The privacy policy's commitment is only the as-needed deletion or de-identification rule; no period for prompt and response content is published."
text_zh = "隐私政策的承诺只有「不再需要即删除或去标识化」这一条；提示词与响应正文没有公布期限。"

[[product.retention.point]]
text = "Pro is covered by the DPA: the customer may request return or deletion of Customer Personal Data up to ninety days after termination of the agreement, and Replit may retain it where the law requires."
text_zh = "Pro 档受 DPA 覆盖：客户可在协议终止后 90 天内请求返还或删除客户个人数据，法律要求保留的除外。"
anchor = "dpa-return-or-deletion-90-days"

[[product.retention.point]]
text = "Opting out of model improvement stops future training use but does not delete anything: opting out does not delete your content, remove it from your projects, or affect your ability to use the services."
text_zh = "退出模型改进只停止今后的训练用途，并不删除任何东西：退出不会删除你的内容、不会把它从项目中移除，也不影响你使用服务。"
anchor = "model-improvement-optout-keeps-content"

[[product.retention.point]]
text = "Paid subscriptions are exempt from the free-tier inactivity deletion trigger."
text_zh = "付费订阅不受免费档闲置删除触发条件的约束。"
anchor = "inactivity-paid-exempt"

[product.processing_region]
codes = ["US", "selected"]
anchor = "sharedres-pro-workspace-geo"

[[product.processing_region.point]]
text = "Pro customers can choose a Workspace location when the workspace is created; the responsibility matrix assigns data residency to Replit as the mechanism with the customer configuring it."
text_zh = "Pro 客户可在创建工作区时选择 Workspace 位置；责任矩阵把数据驻留归为 Replit 提供机制、客户做配置。"

[[product.processing_region.point]]
text = "Publishing geography is chosen at publish time and cannot be changed afterwards, and the two settings need not match."
text_zh = "发布地域在发布时选定且之后不可更改，两个设置也不必一致。"
anchor = "geography-cannot-change"

[[product.processing_region.point]]
text = "Outside the residency controls, services are primarily hosted in the United States and may be hosted elsewhere."
text_zh = "在驻留控制之外，服务主要托管在美国，也可能托管在其他地方。"
anchor = "privacy-hosted-in-us"

[product.role]
kind = "processor"
anchor = "dpa-customer-controller-company-processor"

[[product.role.point]]
text = "Where the customer acts as a controller, Replit is appointed as a processor for the personal data provided to perform the services on the customer's behalf. Module 3 (processor-to-processor) applies where the customer is itself a processor."
text_zh = "在客户作为控制者的情况下，Replit 被指定为受托处理方，处理客户为履行服务而提供的数据；客户本身是处理方时适用 Module 3（处理方对处理方）。"

[[product.role.point]]
text = "The DPA reaches this tier through the Commercial Agreement, which the ToS says applies to Pro and Enterprise Services."
text_zh = "DPA 经由商业协议覆盖本档，而 ToS 写明商业协议适用于 Pro 与 Enterprise 服务。"
anchor = "dpa-incorporated-into-commercial-agreement"

[[product]]
id = "enterprise"
badge = "企业版"
category = "coding_plan"
plan_level = "enterprise"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "ent-use-restrictions-no-training"

[[product.training.point]]
text = "The Enterprise Agreement carries an express use restriction: Replit will not use Customer Content to develop or improve its own products or services, train machine learning models, or create derivative works, except as expressly permitted in the agreement."
text_zh = "企业协议含明确的使用限制：除协议明确允许外，Replit 不会用客户内容开发或改进自家产品或服务、训练机器学习模型或创作衍生作品。"

[[product.training.point]]
text = "Replit's product documentation states the same in one line: for Enterprise users, Replit does not use customer content to train its models."
text_zh = "Replit 的产品文档用一句话重复了同一结论：对企业用户，Replit 不会用客户内容训练其模型。"
anchor = "model-improvement-enterprise-no-train"

[[product.training.point]]
text = "Usage Data is carved out of the restriction — de-identified interaction data that excludes Customer Content remains usable for internal analytics and business purposes."
text_zh = "Usage Data 被排除在该限制之外——不含客户内容的去标识化交互数据仍可用于内部分析与商业目的。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "aiintegrations-enterprise-zdr-only"

[[product.zdr.point]]
text = "For Enterprise organisations Replit enforces a routing rule rather than offering an opt-in: only models with a Zero Data Retention policy are available, so Enterprise requests are only routed to endpoints that do not retain any data."
text_zh = "对企业组织，Replit 强制一条路由规则而非提供自助开关：只提供带零数据保留政策的模型，企业请求只路由到不保留任何数据的端点。"
anchor = "aiintegrations-enterprise-zdr-rationale"

[[product.zdr.point]]
text = "Scope matters here: this ZDR is about which upstream endpoints Replit will route to through AI Integrations, not a statement that Replit itself retains nothing. Replit's platform-side retention (privacy policy, DPA, deletion windows) is unchanged by it, and the trade-off is a more limited model list."
text_zh = "适用范围要注意：这条 ZDR 讲的是 Replit 经 AI Integrations 会路由到哪些上游端点，不等于 Replit 自身什么都不留。平台侧的保留（隐私政策、DPA、删除窗口）不因此改变，代价是可用模型更少。"

[product.retention]
object = "input_output"
basis = "fixed_period"
days = 90
anchor = "dpa-return-or-deletion-90-days"

[[product.retention.point]]
text = "The DPA gives the enterprise-tier window: the customer may request return or deletion of Customer Personal Data up to ninety days after termination, and Replit may retain it where required by law."
text_zh = "DPA 给出企业档窗口：客户可在终止后 90 天内请求返还或删除客户个人数据，法律要求保留的除外。"

[[product.retention.point]]
text = "The Enterprise Agreement adds a 30-day migration window: the customer may migrate or request migration of its content for up to thirty days after termination."
text_zh = "企业协议另给 30 天迁移窗口：客户可在终止后 30 天内迁移或请求迁移其内容。"
anchor = "ent-data-migration-30-days"

[[product.retention.point]]
text = "Outside those windows the privacy policy's as-needed deletion rule still applies, and no period for prompt and response content is published."
text_zh = "在这些窗口之外，隐私政策的按需删除规则仍然适用，提示词与响应正文没有公布期限。"
anchor = "privacy-retention-deidentify"

[product.processing_region]
codes = ["US", "selected"]
anchor = "geography-enterprise-enforce"

[[product.processing_region.point]]
text = "Enterprise admins can enforce a publishing geography for all projects across the organisation; the policy applies only to projects not yet published, and already-published projects keep their geography."
text_zh = "企业管理员可为全组织的项目强制发布地域；该策略只对尚未发布的项目生效，已发布项目保持原地域。"

[[product.processing_region.point]]
text = "Outside the residency controls, services are primarily hosted in the United States and may be hosted elsewhere."
text_zh = "在驻留控制之外，服务主要托管在美国，也可能托管在其他地方。"
anchor = "privacy-hosted-in-us"

[[product.processing_region.point]]
text = "The subprocessor list places the AI-model entries in the USA — Anthropic, OpenAI, Google, Baseten, Fireworks AI and OpenRouter are all listed as USA, which is the upstream hop this ledger has to account for separately."
text_zh = "子处理者清单把 AI 模型相关条目列在美国——Anthropic、OpenAI、Google、Baseten、Fireworks AI 与 OpenRouter 均标 USA，这是台账必须单独核算的上游一跳。"
anchor = "subprocessors-model-providers"

[product.role]
kind = "processor"
anchor = "dpa-customer-controller-company-processor"

[[product.role.point]]
text = "Customer as controller, Replit appointed as processor for the personal data provided to perform the services on the customer's behalf; processor-to-processor terms apply where the customer is itself a processor."
text_zh = "客户为控制者，Replit 被指定为受托处理方，处理客户为履行服务而提供的数据；客户本身是处理方时适用处理方对处理方条款。"

[[product.role.point]]
text = "Replit's responsibility matrix assigns the processing of prompts and model interaction — how they are logged, retained and whether used for training — to Replit, compliant with the Terms of Service and the DPA."
text_zh = "Replit 的责任矩阵把提示词与模型交互的处理（如何记录、保留、是否用于训练）划归 Replit 负责，依据是服务条款与 DPA。"
anchor = "sharedres-processing-of-prompts"

