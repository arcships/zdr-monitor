name = "Replit"
name_en = "Replit"
line = "replit"
site = "global"
plan_levels = ["free", "individual", "team", "enterprise"]
entity = "Replit, Inc."
homepage = "https://replit.com"
endpoint = ""
doc = "https://docs.replit.com/legal-and-security-info/model-improvement"

[[source]]
url = "https://docs.replit.com/features/integrations/replit-ai-integrations"
channel = "developer_data"
tier = "core"
note = "Replit AI Integrations 文档 (Last updated August 1, 2026)。披露上游跳的实际配置：个人与团队用户走 OpenRouter 时，付费端点训练关闭、免费端点训练开启且可把提示词与补全发布到公开数据集；Enterprise 组织只允许 Zero Data Retention 端点。ZDR 的适用范围因此仅限 AI Integrations + Enterprise，不能外推为 Replit 全面零保留。"

[[source]]
url = "https://docs.replit.com/features/security/geography"
channel = "developer_data"
tier = "core"
note = "Replit 地理文档。写明 Workspace 地域选择仅对 Pro 客户开放、发布地域选择对 Core/Pro/Enterprise 开放、免费客户默认发布到北美，且发布后地域不可更改。是 processing_region 维度的主来源。"

[[source]]
url = "https://docs.replit.com/features/security/shared-responsibility-model"
channel = "developer_data"
tier = "core"
note = "Replit 责任分担模型文档。逐行列出谁负责什么：提示词与模型交互的处理、记录、保留与训练由 Replit 负责；数据驻留方面 Pro 客户可在创建时选择 Workspace 位置；保留与删除是「Replit（机制）+ 客户（配置）」。是角色与责任边界的辅助来源。"

[[source]]
url = "https://docs.replit.com/legal-and-security-info/account-inactivity"
channel = "developer_data"
tier = "core"
note = "Replit 文档《Account inactivity》。写明 1 年未使用的账号属不活跃，Replit 保留终止并删除关联用户数据的权利。是 retention 的一个触发式期限。"

[[source]]
url = "https://docs.replit.com/legal-and-security-info/deleting-your-data"
channel = "developer_data"
tier = "core"
note = "Replit 文档《Deleting your data》。说明账号与项目内容的删除路径与生效范围，用于 retention 维度的删除机制说明。"

[[source]]
url = "https://docs.replit.com/legal-and-security-info/model-improvement"
channel = "developer_data"
tier = "core"
note = "Replit 文档《Model improvement》。训练开关的权威页：写明会用提示词、指令、上下文与生成的回复来开发和改进模型与 AI 功能；Pro 用户可在 Personalization 里 opt out Model Improvement；「This control is available to Pro users. For Enterprise users, Replit does not use customer content to train its models.」并明确 opt out 不删除内容。是 training 维度的产品层主来源，也是「免费档没有开关」的依据。"

[[source]]
url = "https://repl.it/site/subprocessors"
channel = "contract"
tier = "core"
note = "Replit 子处理者清单 (Last updated August 2026)。与推理直接相关的有 Anthropic、OpenAI、Google、Baseten、Fireworks AI、OpenRouter，所在地一律 USA（另有 IntouchCX 在 Canada）。DPA §5 明文指定本页为清单落点，因此按并入的合同文件对待。是 processing_region 与多跳链路的关键来源。"

[[source]]
url = "https://replit.com/dpa"
channel = "contract"
tier = "core"
note = "《Replit Data Processing Addendum》(Last updated April 1, 2026)。§2 客户为 Controller、Replit 为 Processor，且不得出售客户个人数据或用于协议与 DPA 列明之外的目的；§10 终止后 90 天内可请求返还或删除；§5 指明子处理者清单落点。是 role 与 retention（合同层）的主来源。"

[[source]]
url = "https://replit.com/enterprise-agreement"
channel = "contract"
tier = "core"
note = "《Replit Enterprise Agreement》(Last updated September 9, 2026)。§B.2.g Use Restrictions 方向相反：Replit 不会用客户内容开发或改进自己的产品服务、训练机器学习模型或创作衍生作品，除协议明确允许外；§B.2.c 限定许可范围「only as necessary to provide the Platform」；§F.4 终止后可迁移内容 30 天。是 enterprise 档 training 与 retention 的主来源。"

[[source]]
url = "https://replit.com/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "《Replit Privacy Policy》(Last updated August 3, 2026)。§3 把「improve the accuracy of our machine learning technologies such as code generation」挂在 legitimate interest 下——不依赖同意；§4 写明公开项目默认可被其他用户与搜索引擎看到；§8 只给原则性保留表述；§10 写明服务主要托管在美国、也可能托管在用户所在司法辖区之外。"

[[source]]
url = "https://replit.com/pro-agreement"
channel = "contract"
tier = "core"
note = "《Replit Pro Agreement》§C.2.c。个人付费档的训练条款：授予 Replit 非独占、全球、不可撤销、免版税的许可来托管/存储/复制/修改/展示客户内容，并明写「Replit may also use Customer Content to develop, train, and improve its models and AI Features」，客户可通过设置页 opt out。是 Pro 档 training 维度的合同层主来源。"

[[source]]
url = "https://replit.com/terms-of-service"
channel = "contract"
tier = "core"
note = "《Replit Terms of Service》(Last updated August 3, 2026)。首部声明 Pro 与 Enterprise 服务改由 Commercial Agreement 管辖——这是档位分流的合同依据。§3.b 保留为排障、改进服务与安全而访问私有 app 内容的权利；§5.c 只说账号删除按数据保留政策与适用法律处理，未给期限。"

[[product]]
id = "free"
badge = "免费层"
category = "coding_plan"
plan_level = "free"

[product.training]
mark = "no"
anchor = "model-improvement-pro-only"

[[product.training.point]]
text = "Replit uses the content you provide — prompts, instructions, context and the responses generated for you — to help develop and improve its models and AI features, and the off switch is tier-gated: the docs state plainly that this control is available to Pro users."
text_zh = "Replit 会用你提供的内容（提示词、指令、上下文与为你生成的回复）来开发和改进其模型与 AI 功能，而关闭开关按档位设限：文档直说该控制只对 Pro 用户开放。"

[[product.training.point]]
text = "The privacy policy grounds the same processing in legitimate interest rather than consent: product development and internal analytics, specifically to improve the accuracy of machine learning technologies such as code generation."
text_zh = "隐私政策把同一处理建立在正当利益而非同意之上：产品开发与内部分析，具体是为了提高代码生成等机器学习技术的准确性。"
anchor = "privacy-legitimate-interest-ml"

[[product.training.point]]
text = "Replit separately reserves the right to access the content of private apps for troubleshooting, improving the service, and ensuring safety and security — a content-access right that is not part of the training clause."
text_zh = "Replit 另外保留了为排障、改进服务与保障安全而访问私有 app 内容的权利——这是一项内容访问权，与训练条款不是同一件事。"
anchor = "tos-private-apps-access"

[product.zdr]
mark = "unknown"
searched = [
  "https://replit.com/privacy-policy",
  "https://replit.com/terms-of-service",
  "https://replit.com/pro-agreement",
  "https://replit.com/enterprise-agreement",
  "https://replit.com/dpa",
  "https://docs.replit.com/legal-and-security-info/model-improvement",
  "https://docs.replit.com/features/integrations/replit-ai-integrations",
  "https://docs.replit.com/legal-and-security-info/deleting-your-data",
  "https://docs.replit.com/features/security/shared-responsibility-model",
]

[[product.zdr.point]]
text = "No zero-data-retention commitment covers this tier. ZDR appears in Replit's documentation only as an Enterprise control over which model endpoints requests may be routed to; the free tier's terms, the privacy policy and the ToS say nothing about zero retention."
text_zh = "本档没有任何零数据保留承诺。ZDR 在 Replit 文档里只以「企业档限定可用端点」的形式出现；免费档的条款、隐私政策与 ToS 都没有提到零保留。"

[[product.zdr.point]]
text = "Upstream handling on self-serve tiers is configured by Replit rather than chosen by the user: paid endpoints have training disabled, but free endpoints may train on your prompts and completions and may publish them to public datasets."
text_zh = "自助档的上游处理由 Replit 配置而非用户选择：付费端点关闭训练，但免费端点可以用你的提示词与补全做训练，并可能把它们发布到公开数据集。"
anchor = "aiintegrations-selfserve-defaults"

[[product.zdr.point]]
text = "Whether a free-tier user can obtain ZDR by contract is not addressed in any public document — this is an undisclosed option, not a stated refusal."
text_zh = "免费档用户能否通过合同拿到 ZDR，公开文档没有涉及——这是未披露的选项，不是明确的拒绝。"

[product.retention]
object = "input_output"
basis = "as_needed"
anchor = "privacy-retention-deidentify"

[[product.retention.point]]
text = "The privacy policy commits only to deleting or de-identifying data when it is no longer needed in identifiable form, unless a longer period is required by law — no period for prompt and response content is published."
text_zh = "隐私政策只承诺在不再需要以可识别形式保存时删除或去标识化，法律要求更长期限的除外——提示词与响应正文没有公布任何期限。"

[[product.retention.point]]
text = "Free accounts carry a concrete inactivity trigger: an account not used within a 1-year period may be terminated and its associated user data deleted, including the Replit Apps tied to it. Paid subscriptions are exempt from that trigger."
text_zh = "免费账号有一条明确的闲置触发条件：1 年内未使用的账号可被终止并删除关联用户数据，包括其下的 Replit Apps。付费订阅不受该触发条件约束。"
anchor = "inactivity-one-year-free"

[[product.retention.point]]
text = "Account deletion is documented as removing all content from Replit and purging personal information from its systems, with no recovery afterwards."
text_zh = "账号删除被写明为移除 Replit 上的全部内容并从系统中清除个人信息，之后不可恢复。"
anchor = "deleting-account-purges"

[[product.retention.point]]
text = "Public-facing content is a different object with default exposure: profile, code and posts may be viewable and searchable by other users and indexed by search engines by default."
text_zh = "对外公开的内容是另一个对象且默认暴露：个人资料、代码与帖子默认可被其他用户查看与搜索，并被搜索引擎索引。"
anchor = "privacy-public-content"

[product.processing_region]
codes = ["US"]
anchor = "privacy-hosted-in-us"

[[product.processing_region.point]]
text = "Services are primarily hosted in the United States and may also be hosted outside your jurisdiction; using the Services from elsewhere means accepting transfer of your data to the US and other hosting jurisdictions for storage, access and processing."
text_zh = "服务主要托管在美国，也可能托管在你所在司法辖区之外；从其他地区使用服务即表示接受数据被转移到美国及其他托管地存储、访问与处理。"

[[product.processing_region.point]]
text = "Publishing geography is a choice made when a project is published, and it is permanent: geography cannot be changed after publishing and a published project cannot be migrated to another geography."
text_zh = "发布地域是发布项目时做出的选择，且不可更改：发布后地域不能变更，已发布项目也无法迁移到其他地域。"
anchor = "geography-cannot-change"

[product.role]
kind = "unknown"
searched = [
  "https://replit.com/terms-of-service",
  "https://replit.com/privacy-policy",
  "https://replit.com/dpa",
  "https://docs.replit.com/features/security/shared-responsibility-model",
  "https://replit.com/pro-agreement",
  "https://replit.com/enterprise-agreement",
]

[[product.role.point]]
text = "This tier has no controller/processor designation. The DPA is incorporated into the Replit Commercial Agreement, and the ToS states that the Commercial Agreement applies only if you use the Pro or Enterprise Service — so the free tier runs on the ToS and the privacy policy, neither of which assigns a role."
text_zh = "本档没有控制者/受托处理方的定性。DPA 并入的是 Replit Commercial Agreement，而 ToS 写明只有使用 Pro 或 Enterprise 服务才适用该商业协议——因此免费档只受 ToS 与隐私政策管辖，两者都未约定角色。"
anchor = "dpa-incorporated-into-commercial-agreement"

[[product.role.point]]
text = "The DPA's own definition of its scope points the same way: it is incorporated into the Commercial Agreement and covers processing by Replit on behalf of the Customer identified in that agreement."
text_zh = "DPA 自己界定的适用范围也指向同一结论：它并入商业协议，覆盖 Replit 代该协议中确定的客户进行的处理。"
anchor = "dpa-customer-controller-company-processor"

