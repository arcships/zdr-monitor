[[product.role.point]]
text_zh = "(b) DPA Schedule 4 把「Anthropic / United States / AI services」列为 Fireworks 的授权子处理者，读起来像 Fireworks 以 processor 身份再委托——合同层据此把 FireRouter 这一跳记为 processor，Anthropic 记为 subprocessor。两条事实并列保留、不取平均；「pass-through 时 Fireworks 是 conduit 还是 processor」仍需人工澄清。"

