text_zh = "合同层与「默认多区域」一致：DPA Schedule 4 里 AWS 为「United States, Japan」、Oracle Cloud Infrastructure 为「United States, Japan, United Kingdom, Germany」、Crusoe 为「United States, Iceland」、Cloudflare 为「Closest data center to End User (global)」。"
