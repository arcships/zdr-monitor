[product.processing_region]
codes = ["US"]
anchor = "fireworks-securetraining-gcs-managed-storage"

[[product.processing_region.point]]
text_zh = "data_residency 页 Limitations：「**Training.** Fine-tuning and training jobs are blocked. Support is coming soon.」即开启数据驻留的账号不能跑训练"

[[product.processing_region.point]]
text = "When training runs on Fireworks-managed storage, \"training data is stored in Google Cloud Storage (GCS) with only a reference link retained in our database.\" The US code refers to where the training dataset and checkpoints are stored, not to the whole training path."
text_zh = "未开启驻留时，训练数据落在 Google Cloud Storage（secure_training 页：training data is stored in Google Cloud Storage (GCS)）。codes=[\"US\"] 的对象是训练数据集与 checkpoint 的存储地，不是训练全链路。"
anchor = "fireworks-securetraining-gcs-managed-storage"

[[product.processing_region.point]]
text = "The contract layer puts that storage in the United States — DPA Schedule 4 lists Google Cloud Platform / \"United States\" — but the same table also carries Japan, the United Kingdom, Germany and Iceland for other infrastructure (AWS: United States, Japan; Oracle: United States, Japan, United Kingdom, Germany; Crusoe: United States, Iceland), so \"US\" must not be read as \"training infrastructure only in the US\"."
text_zh = "合同层把该存储地记为美国——DPA Schedule 4 的 Google Cloud Platform 处理地是「United States」；但同一张表里其他基础设施还列了 Japan / United Kingdom / Germany / Iceland（AWS：United States, Japan；Oracle：United States, Japan, United Kingdom, Germany；Crusoe：United States, Iceland），所以 US 不能读成「训练基础设施只在美国」。"
anchor = "fireworks-dpa-sched4-gcp-us"

[product.role]
kind = "processor"
anchor = "fireworks-dpa-3-a-processor"

[[product.role.point]]
text_zh = "DPA §3(a) 的 processor 角色覆盖 Agreement 下的全部 Processing（未按训练/推理切分）"

[[product.role.point]]
text_zh = "但训练档的客户自控组件（reward model、rollout server、客户自有 bucket、客户 KMS 密钥）在 DPA 中没有单独的角色约定，置信度因此降到 medium。"

