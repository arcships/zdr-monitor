[[product.training.point]]
text_zh = "FireRouter 文档只描述路由、计费与鉴权，没有就「pass-through 到第三方后数据如何被使用」作任何承诺"

[[product.training.point]]
text_zh = "DPA §4.3(f) 的禁令对象是 Company（Fireworks）自身，未延伸约束 Anthropic/OpenAI。多跳判定：本跳（Fireworks 侧）无明确承诺，上游跳（Anthropic/OpenAI）的条款不在本台账本家范围内，因此按「任一跳明确为否则全链为否」+ 保守假设处理，不在本家记 training 的正面结论。"

[[product.training.point]]
text_zh = "原先绑在本条的引文（「can pass a request through to a third-party provider, which Fireworks cannot constrain to a region.」）讲的是处理地约束力，既不涉及训练，也不涉及保留，故不再绑在本条；该引文现绑在本档 processing_region 条目。"

[product.zdr]
mark = "no"
mode = "not_disclosed"
searched = [
  "https://docs.fireworks.ai/ecosystem/firerouter/overview",
  "https://docs.fireworks.ai/accounts/data-residency",
  "https://fireworks.ai/dpa",
]

[[product.zdr.point]]
text = "Fireworks' own Zero Data Retention wording (ToS §3.6 and the Zero Data Retention page) is written for the inference path Fireworks itself serves. The FireRouter docs cover routing, billing and authentication only, and neither page states a zero-retention position for the pass-through hop, whose executor is a third-party provider."
text_zh = "Fireworks 自己的零保留表述（ToS §3.6 与《Zero Data Retention》页）针对的是 Fireworks 自己提供推理的那条路径。FireRouter 文档只写路由、计费与鉴权，两处都没有就 pass-through 这一跳（执行方是第三方 provider）给出零保留方案。"

[[product.zdr.point]]
text = "Contrary reading, kept side by side: DPA §4.5 says Company shall not retain prompt inputs or model outputs beyond the lifecycle of the applicable request, and DPA Schedule 4 lists Anthropic as an authorised sub-processor — read at contract level, the pass-through hop may already be covered. The verdict stays at no because Fireworks' ZDR documentation does not extend the commitment to the third-party hop, and the upstream hop's own retention policy is not part of this provider's scope."
text_zh = "相反口径并列保留：DPA §4.5 承诺 Company 不保留 prompt inputs / model outputs 超过请求生命周期，Schedule 4 又把 Anthropic 列为授权子处理者——按合同层读，pass-through 这一跳可能已被 DPA 覆盖。结论仍记否：Fireworks 的 ZDR 文档没有把承诺延伸到第三方跳，上游跳（Anthropic）自己的保留政策不在本台账本家范围内。"
anchor = "fireworks-dpa-4-5-request-lifecycle"

[product.retention]
object = "input_output"
basis = "undisclosed"
searched = [
  "https://docs.fireworks.ai/ecosystem/firerouter/overview",
  "https://docs.fireworks.ai/accounts/data-residency",
  "https://fireworks.ai/dpa",
]

[[product.retention.point]]
text = "The only retention-adjacent disclosure FireRouter makes is about credentials: \"Provider keys sent on individual requests are not persisted by FireRouter.\" (a per-request provider key is not stored; when workspace BYOK is provisioned by Fireworks the credential lives in the customer workspace and is supplied server-side). It says nothing about the retention period of request/response content on the pass-through path, which is why this row is recorded as undisclosed instead of being anchored to that sentence."
text_zh = "FireRouter 唯一与保留沾边的披露是凭据侧：「Provider keys sent on individual requests are not persisted by FireRouter.」（逐请求携带的 provider key 不落库；若由 Fireworks 侧开通 workspace BYOK，则凭据存在客户 workspace 里、由服务端注入）。它没有说 pass-through 路径上请求/响应正文的保留期，故本行按「未披露」记 searched[]，不把这条句子当依据。"
anchor = "fireworks-firerouter-third-party-provider-key"

[[product.retention.point]]
text_zh = "Fireworks 侧的 ZDR（ToS §3.6）只承诺 inference，而 pass-through 的执行方是第三方，故不能把 Fireworks 的 ZDR 结论直接套到本档。"

[[product.retention.point]]
text = "Contract-layer termination deletion: under DPA §11.2(b) Company deletes all copies of Covered Data on expiry of the Retention Period (§11.2(a): thirty (30) days from expiry of the Agreement), other than Administration Data and Usage Data."
text_zh = "合同层终止后删除：DPA §11.2(b) 在 Retention Period（§11.2(a)：协议终止后 30 天）届满时删除所有 Covered Data 副本，Administration Data 与 Usage Data 除外。"
anchor = "fireworks-dpa-11-2-b-post-termination-delete"

[[product.retention.point]]
text = "DPA Schedule 2: \"All Personal Data is deleted from the Services following service termination.\""
text_zh = "DPA Schedule 2：「All Personal Data is deleted from the Services following service termination.」"
anchor = "fireworks-dpa-sched2-all-personal-data-deleted-on-termination"

