text_zh = "同 api：ToS §3.6 那句自带两处限定——依适用法律要求（或为提供服务/支持所必需）时不适用，以及厂商保留对 Content 使用安全审查工具的权利。"
anchor = "fireworks-tos-3-6-safety-screening"

[product.retention]
