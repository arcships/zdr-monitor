basis = "none"
anchor = "fireworks-datahandling-no-persistent-log"

[[product.retention.point]]
text = "Request bodies follow the api tier: \"In either case, prompt and generation data are not logged into any persistent storage.\" basis=\"none\" covers that request-body half, not the prompt cache below."
text_zh = "请求正文同 api 档：「In either case, prompt and generation data are not logged into any persistent storage.」本行 basis=\"none\" 覆盖的是这一半（请求正文不落盘），不含下一条的 prompt cache。"
anchor = "fireworks-datahandling-no-persistent-log"

[[product.retention.point]]
text = "Tier-specific: dedicated deployments share a single prompt cache by default, and \"Cached prompts usually stay in the cache for at least several minutes. Depending on the model, load level, and deployment configuration, it can be up to several hours.\" The period is a range, not a fixed term, so no days value is given. The same page admits \"a minor risk of a timing attack\" and offers x-prompt-cache-isolation-key for full isolation. Confidence medium: that page describes cache behaviour, it makes no dedicated-specific retention promise."
text_zh = "本档特有面：dedicated 默认共享单一 prompt cache，缓存内容在内存中「at least several minutes…up to several hours」——是区间而非固定期限，故本行不给 days。同页承认这带来「a minor risk of a timing attack」，需用 x-prompt-cache-isolation-key 才能完全隔离。置信度 medium：该页只描述缓存行为，未针对 dedicated 单独声明保留承诺。"
anchor = "fireworks-promptcaching-cache-lifetime"

[[product.retention.point]]
text = "The ToS §3.6 sentence behind this tier's ZDR promise carries two limits: it does not apply where \"otherwise required by Applicable Law (or to provide the Service or support to you)\", and the vendor keeps the right to use safety screening tools on the Content."
text_zh = "本档 ZDR 承诺所依据的 ToS §3.6 自带两处限定：依适用法律要求（或为提供服务/支持所必需）时不适用，以及厂商保留对 Content 使用安全审查工具的权利。"
anchor = "fireworks-tos-3-6-safety-screening"

[[product.retention.point]]
text = "Contract-layer termination deletion: under DPA §11.2(b) Company deletes all copies of Covered Data on expiry of the Retention Period (§11.2(a): thirty (30) days from expiry of the Agreement), other than Administration Data and Usage Data."
text_zh = "合同层终止后删除：DPA §11.2(b) 在 Retention Period（§11.2(a)：协议终止后 30 天）届满时删除所有 Covered Data 副本，Administration Data 与 Usage Data 除外。"
anchor = "fireworks-dpa-11-2-b-post-termination-delete"

[[product.retention.point]]
