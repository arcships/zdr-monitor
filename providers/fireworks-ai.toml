[[product]]
id = "training"
badge = "训练微调"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "by_contract"
anchor = "fireworks-dpa-4-3-f-no-training"

[[product.training.point]]
text_zh = "训练档的「不训练」含义与推理档不同：DPA §4.3(f) 禁止「using Covered Data to train, fine-tune, or otherwise improve any shared or foundational model」，docs《Secure Training》「your training data is never used to train Fireworks-owned or shared models」——即客户数据只用于训练客户自己的模型，不会进入 Fireworks 自有/共享模型。注意这是合同禁令，不是「数据不留存」。"

[product.zdr]
mark = "no"
anchor = "fireworks-tos-3-6-inference-scope"

[[product.zdr.point]]
text_zh = "ToS §3.6 明文排除：「our Zero Data Retention commitment applies to your use of the Service for inference. It does not apply to any feature of the Service that, by design, requires the retention or further processing of data beyond the time needed to generate and deliver Output — including…any training, fine-tuning, or agent features.」即训练档没有零保留承诺，只有上面那套「客户自控 + 30 天产物」的保留规则。"

[product.retention]
days = 30
object = "mixed"
basis = "fixed_period"
anchor = "fireworks-securetraining-job-artifacts-30-days"

[[product.retention.point]]
text_zh = "对象分明：数据集——Managed Training 上传到 Fireworks 管理的 GCS，客户可在作业完成后立即删除"

[[product.retention.point]]
text_zh = "BYOB 则留在客户自己的桶里、Fireworks 就地读取不留副本"

[[product.retention.point]]
text_zh = "Training API 根本不上传数据集，trainer 只收到瞬时 tokenized Datum 批次。产物——Job chunks/artifacts（中间 checkpoint）与 Traces/logs（请求响应元数据）均保留 30 天后删除，可提前请求删除。RFT 的 rollout 数据集可应请求删除。删除入口：控制台/API 删数据集，checkpoint/trace/rollout 需联系 account team。"

[product.processing_region]
codes = ["US"]
anchor = "fireworks-dataresidency-restricts-region"

[[product.processing_region.point]]
text_zh = "data_residency 页 Limitations：「**Training.** Fine-tuning and training jobs are blocked. Support is coming soon.」即开启数据驻留的账号不能跑训练"

[[product.processing_region.point]]
text_zh = "未开启驻留时，训练数据落在 Google Cloud Storage（secure_training 页），DPA Schedule 4 的 GCP 处理地为 United States。"

[product.role]
kind = "processor"
anchor = "fireworks-dpa-3-a-processor"

[[product.role.point]]
text_zh = "DPA §3(a) 的 processor 角色覆盖 Agreement 下的全部 Processing（未按训练/推理切分）"

[[product.role.point]]
text_zh = "但训练档的客户自控组件（reward model、rollout server、客户自有 bucket、客户 KMS 密钥）在 DPA 中没有单独的角色约定，置信度因此降到 medium。"

