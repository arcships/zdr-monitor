text_zh = "FireRouter 文档只描述路由、计费与鉴权，没有就「pass-through 到第三方后数据如何被使用」作任何承诺"

[[product.training.point]]
text_zh = "DPA §4.3(f) 的禁令对象是 Company（Fireworks）自身，未延伸约束 Anthropic/OpenAI。多跳判定：本跳（Fireworks 侧）无明确承诺，上游跳（Anthropic/OpenAI）的条款不在本台账本家范围内，因此按「任一跳明确为否则全链为否」+ 保守假设处理，不在本家记 training 的正面结论。"

[[product.training.point]]
text_zh = "原先绑在本条的引文（「can pass a request through to a third-party provider, which Fireworks cannot constrain to a region.」）讲的是处理地约束力，不涉及训练，不构成对 training 维度的表述，故不再绑在本条；该引文仍绑在本档 zdr 条目。"

[product.zdr]
mark = "no"
anchor = "fireworks-dataresidency-firerouter-third-party"

[[product.zdr.point]]
text_zh = "data_residency 页在 Limitations 里明写「FireRouter can pass a request through to a third-party provider, which Fireworks cannot constrain to a region.」，同时该页说明开启 data residency 的账号无法使用 FireRouter（请求返回 403）。即 Fireworks 自己承认无法对本档的第三方跳作区域/处理约束"

[[product.zdr.point]]
text_zh = "零保留同样不能由 Fireworks 单方面保证。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "fireworks-firerouter-third-party-provider-key"

[[product.retention.point]]
text_zh = "FireRouter 只披露了凭据侧的一条保留规则：「Provider keys sent on individual requests are not persisted by FireRouter.」（逐请求携带的 provider key 不落库；若由 Fireworks 侧开通 workspace BYOK，则凭据存在客户 workspace 里、由服务端注入）。对请求/响应正文在 pass-through 路径上的保留期没有任何披露。Fireworks 侧的 ZDR（ToS §3.6）只承诺 inference，而 pass-through 的执行方是第三方，故不能把 Fireworks 的 ZDR 结论直接套到本档。"

[product.processing_region]
codes = ["US"]
anchor = "fireworks-firerouter-pass-through-anthropic"

[[product.processing_region.point]]
text_zh = "pass-through 路径由客户自己的 provider key 直连上游（默认 Anthropic），处理地由上游决定"

[[product.processing_region.point]]
text_zh = "Fireworks 声明无法约束（data_residency 页）。Redirect 路径仍走 Fireworks 开源模型，此时适用 api 档结论。"

[product.role]
kind = "unknown"
anchor = "fireworks-dpa-sched4-anthropic-subprocessor"

[[product.role.point]]
text_zh = "两条口径需要并列：(a) firerouter_overview 页把第三方描述为「provider」，用客户自己的 key 计费，读起来像客户与上游的直接关系"

[[product.role.point]]
text_zh = "(b) DPA Schedule 4 却把「Anthropic / United States / AI services」列为 Fireworks 的授权子处理者，读起来像 Fireworks 以 processor 身份再委托。两处都是官方文件，本轮不选边、不调和，如实并列，并把「FireRouter pass-through 时 Fireworks 是 conduit 还是 processor」标为需要人工澄清的问题。"

