[[source]]
url = "https://docs.fireworks.ai/accounts/data-residency"
channel = "developer_data"
tier = "core"
note = "《Data residency》企业功能页：默认 None（不限制区域），可把账号锁定到 US 单一区域；列出 residency 开启后被拒的功能（训练、FireRouter、BYOC）。既是处理地维度的主要来源，也是 FireRouter/BYOC 多跳与自管档的官方披露点。"

[[source]]
url = "https://docs.fireworks.ai/deployments/regions"
channel = "developer_data"
tier = "core"
note = "《Regions》页：默认多区域（GLOBAL/US/EUROPE/APAC），并列出全部可用的单区域（含 AP_TOKYO、EU_FRANKFURT、EU_ICELAND、US_* 等）与 BYOC 入口。处理地维度里「默认不限定单一国家」的依据。"

[[source]]
url = "https://docs.fireworks.ai/ecosystem/firerouter/overview"
channel = "developer_data"
tier = "core"
note = "《FireRouter》产品文档：托管路由服务，默认在 Fireworks 开源模型与闭源模型之间选路，pass-through 默认目标是 Claude Opus 5（Anthropic），用客户自己的 provider key 计费。这是本家唯一把请求实际转给第三方的功能，构成多跳链路，因此单列 products 行。"

[[source]]
url = "https://docs.fireworks.ai/guides/prompt-caching"
channel = "developer_data"
tier = "core"
note = "《Prompt caching》功能文档。给出 KV 缓存/prompt 缓存的存活时长区间（数分钟到数小时，内存中），是 retention 维度上唯一披露缓存保留时长的官方来源；§Data privacy 说明 serverless 每账号独立缓存、dedicated 默认共享缓存。"

[[source]]
url = "https://docs.fireworks.ai/guides/security_compliance/data_handling"
channel = "developer_data"
tier = "core"
note = "文档站 Security & Compliance 下的《Zero Data Retention》页（页面标题即 Zero Data Retention），覆盖推理档的默认保留策略与 Response API 例外。旧记录唯一一条候选，本轮四步验证通过（HTTP 200 / 12820B / 有主体×动作条款 / 可定位原句）。"

[[source]]
url = "https://docs.fireworks.ai/guides/security_compliance/secure_training"
channel = "developer_data"
tier = "core"
note = "文档站《Secure Training》页：按 Managed Training / Managed Training+BYOB / Training API 三种训练形态分别给出「数据放在哪、Fireworks 保留什么、怎么删」，是训练档 retention 与 training 维度的权威。明确写出推理档 ZDR 与训练档保留的边界。"

[[source]]
url = "https://fireworks.ai/dpa"
channel = "contract"
tier = "core"
note = "《Data Processing Addendum (v3.2)》，jina 抓回的是 22 页 PDF/DOCX 渲染（页面 URL 为 fireworks.ai/dpa，由 ToS §2.4 并入）。这是 role / retention / training / processing_region 的合同层权威：§3 角色、§4.3(f) 禁止训练、§4.5 请求生命周期保留、§11 终止后删除、Schedule 2「limited data retention」、Schedule 4 授权子处理者及其处理地。适用对象是「business customer」签署的 Agreement（含自服务条款）。"

[[source]]
url = "https://fireworks.ai/terms-of-service"
channel = "contract"
tier = "core"
note = "Fireworks.ai, Inc. 的通用服务条款（正文含 §3 Content、§3.6 Zero Data Retention、§10.1 Privacy）。覆盖平台全部付费/免费服务档：serverless 推理、专用部署、训练与微调、Response API、agent 功能。§3.1 定义 Input/Output/Content，§2.4 把 www.fireworks.ai/dpa 并入本条款，§3.6 是 zdr / training / retention 三个维度的合同层最高权威，§10.1 是处理地维度的合同层依据。本文件未出现 controller/processor 字样，角色维度以 DPA 为准。"

[[product]]
id = "api"
badge = "按量 API"
category = "api"
plan_level = "any"

[product.training]
mark = "yes"
mode = "default"
anchor = "fireworks-tos-3-6-no-training"

[[product.training.point]]
text_zh = "同顶层 training：ToS §3.6 + DPA §4.3(f) 无条件禁止用 Content/Covered Data 训练自有或共享模型"

[[product.training.point]]
text_zh = "隐私政策与文档层另带「without your explicit opt-in」限定。"

[product.zdr]
mark = "yes"
mode = "default"
anchor = "fireworks-tos-3-6-zdr-policy"

[[product.zdr.point]]
text_zh = "同顶层 zdr：默认开启、无需申请"

[[product.zdr.point]]
text_zh = "例外为 Response API、prompt caching、training/fine-tuning/agent 功能"

[[product.zdr.point]]
text = "Documentation layer narrows the no-logging statement to open models: \"Fireworks does not log or store prompt or generation data for any open models, without explicit user opt-in.\""
text_zh = "文档层把「不记录」的范围限定在 open models：「Fireworks does not log or store prompt or generation data for any open models, without explicit user opt-in.」"
anchor = "fireworks-datahandling-open-models-limit"

[[product.zdr.point]]
text = "Two limits sit inside the very ToS §3.6 sentence this verdict is anchored to: the promise does not apply where \"otherwise required by Applicable Law (or to provide the Service or support to you)\", and \"you agree that we have the right to use safety screening tools on the Content as we deem appropriate\" — the one opening in the no-logging promise that lets the vendor keep processing Content."
text_zh = "结论所绑的 ToS §3.6 同一句里自带两处限定：依适用法律要求（或为向你提供服务/支持所必需）时不适用，以及「you agree that we have the right to use safety screening tools on the Content as we deem appropriate」（厂商保留对 Content 使用安全审查工具的权利）——这是「不记录、不留存」承诺里唯一允许继续处理 Content 的口子。"
anchor = "fireworks-tos-3-6-safety-screening"

[[product.zdr.point]]
text = "Contract layer adds a precondition (DPA §4.5): the no-retention obligation applies when the customer uses the Services in accordance with Company's Zero Data Retention configuration and usage documentation, and keeping that configuration consistent with the then-current documentation is the customer's responsibility. DPA §2 makes the DPA supersede the Agreement in case of contradictions, so this limit is not a channel-priority argument."
text_zh = "合同层另有 DPA §4.5 的前提：不保留义务只在客户按 Company 的 ZDR 配置与使用文档使用服务时成立，维持配置与最新文档一致的责任在客户。DPA §2 规定冲突时 DPA 优先于 Agreement——这条限定来自同层优先，不是 channel 排序。"
anchor = "fireworks-dpa-4-5-request-lifecycle"

[product.retention]
object = "input_output"
basis = "none"
anchor = "fireworks-tos-3-6-zdr-policy"

[[product.retention.point]]
text_zh = "同顶层 retention。本档内部还要再分：默认推理请求正文不落盘"
anchor = "fireworks-datahandling-no-persistent-log"

[[product.retention.point]]
text = "Mechanism, verbatim: \"prompt and generation data exist only in volatile memory for the duration of the request\"; with prompt caching active, some prompt data and its associated KV caches can sit in volatile memory for several minutes."
text_zh = "机制（逐字）：「prompt and generation data exist only in volatile memory for the duration of the request」；prompt caching 激活时，部分 prompt 数据与相关 KV 缓存可在内存中保留数分钟。"
anchor = "fireworks-datahandling-volatile-memory"

[[product.retention.point]]
text_zh = "prompt cache 内存保留数分钟~数小时"
anchor = "fireworks-promptcaching-cache-lifetime"

[[product.retention.point]]
text_zh = "Response API store=True 默认 30 天"
anchor = "fireworks-datahandling-response-api-store-default"

[[product.retention.point]]
text = "Stored conversation data is deleted automatically after 30 days, and can be deleted immediately through the DELETE API endpoint with the response_id."
text_zh = "已存储的会话数据 30 天后自动删除，也可用 DELETE API + response_id 立即删除。"
anchor = "fireworks-datahandling-response-api-30-days"

[[product.retention.point]]
text_zh = "Batch API 上传的数据集保留期未披露。"

[[product.retention.point]]
text = "Feature-level exception: prompt and generation data can be logged when the user explicitly opts in (e.g. FireOptimizer) — the one path on that page where prompt content is recorded, and only on the user's choice."
text_zh = "功能级例外：用户显式 opt-in 后可记录 prompt 与 generation 数据（如 FireOptimizer）——该页里唯一一条记录 prompt 正文的路径，且以用户选择为前提。"
anchor = "fireworks-datahandling-optin-logging"

[[product.retention.point]]
text = "Object note: metadata (e.g. number of tokens in a request) is logged as required to deliver the service — a logs-object disclosure this row's object=input_output does not cover."
text_zh = "对象说明：元数据（如请求的 token 数）按提供服务所需记录——属 logs 对象，本行 object=input_output 不覆盖它。"
anchor = "fireworks-datahandling-metadata-logs"

[[product.retention.point]]
text = "The ToS §3.6 sentence this verdict is anchored to carries two limits: the promise does not apply where \"otherwise required by Applicable Law (or to provide the Service or support to you)\", and the vendor keeps the right to use safety screening tools on the Content."
text_zh = "结论所绑的 ToS §3.6 同一句自带两处限定：依适用法律要求（或为提供服务/支持所必需）时不适用，以及厂商保留对 Content 使用安全审查工具的权利。"
anchor = "fireworks-tos-3-6-safety-screening"

[[product.retention.point]]
text = "Contract layer (DPA §4.5) conditions the no-retention obligation on the customer using the Services in accordance with Company's Zero Data Retention configuration and usage documentation, with the customer responsible for keeping that configuration current."
text_zh = "合同层（DPA §4.5）：不保留义务以「客户按 Company 的 ZDR 配置与使用文档使用服务」为前提，维持配置一致的责任在客户。"
anchor = "fireworks-dpa-4-5-request-lifecycle"

[[product.retention.point]]
text = "Contract-layer termination deletion: under DPA §11.2(b) Company deletes all copies of Covered Data processed by Company or any Authorised Sub-processor on expiry of the Retention Period, where §11.2(a) defines the Retention Period as the thirty (30) days from expiry of the Agreement — a deletion commitment at termination time, not the retention period of request content."
text_zh = "合同层终止后删除：DPA §11.2(b) 规定在 Retention Period 届满时删除 Company 或任何授权子处理者处理的所有 Covered Data 副本（Administration Data 与 Usage Data 例外）；Retention Period 由 §11.2(a) 定义为协议终止后 30 天——这是终止时点的删除承诺，不是请求正文的保留期。"
anchor = "fireworks-dpa-11-2-b-post-termination-delete"

[[product.retention.point]]
text = "DPA Schedule 2 puts the same commitment in one line: \"All Personal Data is deleted from the Services following service termination.\""
text_zh = "DPA Schedule 2 一句话写明同一条承诺：「All Personal Data is deleted from the Services following service termination.」"
anchor = "fireworks-dpa-sched2-all-personal-data-deleted-on-termination"

[product.processing_region]
codes = ["global", "selected"]
anchor = "fireworks-dataresidency-restricts-region"

[[product.processing_region.point]]
text_zh = "同顶层 processing_region：默认 None（多区域，可跨 GLOBAL/US/EUROPE/APAC），可账号级锁 US，EU-only 需联系销售"

[[product.processing_region.point]]
text_zh = "residency 只约束推理且不搬迁已有部署。"

[[product.processing_region.point]]
text = "Contract layer supports the global code: DPA Schedule 4 lists authorised sub-processors outside the United States — Oracle Cloud Infrastructure (United States, Japan, United Kingdom, Germany), with AWS (United States, Japan), Crusoe (United States, Iceland) and Cloudflare (closest data center to End User, global) on the same table."
text_zh = "合同层支撑 codes 里的 global：DPA Schedule 4 的授权子处理者不限于美国——Oracle Cloud Infrastructure「United States, Japan, United Kingdom, Germany」，同一张表里 AWS 为「United States, Japan」、Crusoe 为「United States, Iceland」、Cloudflare 为「Closest data center to End User (global)」。"
anchor = "fireworks-dpa-sched4-oracle-multi"

[[product.processing_region.point]]
text = "One row of that schedule is explicitly global: Cloudflare is listed at the \"Closest data center to End User (global)\", i.e. processing follows the end user's location rather than a fixed country."
text_zh = "该表里有一行的处理地是明文的 global：Cloudflare 记为「Closest data center to End User (global)」，即按终端用户位置就近处理，而非固定国家。"
anchor = "fireworks-dpa-sched4-cloudflare-global"

[[product.processing_region.point]]
text = "Schedule 2 of the same DPA adds that \"All Company processing occurs in physical data centers that are managed by AWS, GCP, Oracle Cloud\" — the contract layer describes multi-country infrastructure, not a single-country default."
text_zh = "同一 DPA 的 Schedule 2 另写「All Company processing occurs in physical data centers that are managed by AWS, GCP, Oracle Cloud.」——合同层描述的是多国基础设施，不是单国默认。"
anchor = "fireworks-dpa-sched2-aws-gcp-oracle-datacenters"

[[product.processing_region.point]]
text = "ToS §10.1 is the contract-layer US wording — \"your personal information may be transferred to, and/or processed in, the United States\". It sits alongside the developer_data page (default None, lockable to US) without changing the codes; its object is personal information in the Privacy Notice / DPA sense (Covered Data counts as Personal Data), not the processing location of the request body itself."
text_zh = "ToS §10.1 是合同层的美国口径——「your personal information may be transferred to, and/or processed in, the United States」。它与 developer_data 页的「默认 None、可锁 US」并列，不改变 codes；对象是 Privacy Notice / DPA 口径下的个人信息（Covered Data 属 Personal Data），不等于请求正文本身的处理地。"
anchor = "fireworks-tos-10-1-us-processing"

[product.role]
kind = "processor"
anchor = "fireworks-dpa-3-a-processor"

[[product.role.point]]
text_zh = "同顶层 role：DPA §3(a) processor/service provider"

[[product.role.point]]
text_zh = "Administration Data 与 Usage Data 走 §3(b) controller。"

