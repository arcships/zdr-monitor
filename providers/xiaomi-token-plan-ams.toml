[product.training]
mark = "yes"
mode = "default"
anchor = "mimo-os-3-1-no-training"

[[product.training.point]]
text = "Same as top-level training: both official texts of the overseas tier state unconditionally that Xiaomi will not use the content you provide for model training or any other purposes. The Chinese privacy terms (§3.1) read 「小米不会将您提供的内容用于模型训练或任何其他目的。」; the English privacy policy snapshot now renders the same sentence as \"Xiaomi will not use the content you provide for model training or any other purposes.\" — unconditional, and the object is the content you provide (not only text). The earlier English snapshot's conditional, text-only wording (\"Without your prior consent, Xiaomi will not use the text content …\") went away with the served-build switch, so it is no longer recorded side by side; that is a change in which build the URL serves, not a withdrawal of the commitment."
text_zh = "同顶层 training：海外档两份官方正文都无条件写明不将您提供的内容用于模型训练或任何其他目的。中文隐私条款 §3.1「小米不会将您提供的内容用于模型训练或任何其他目的。」；英文隐私政策现行快照同句为「Xiaomi will not use the content you provide for model training or any other purposes.」——无条件，对象是「您提供的内容」而非仅文本。此前英文快照的条件式、仅文本措辞（未经事先同意、不将文本内容…）随站点返回的构建切换消失，不再并列记录；这是 URL 返回构建的变化，不是厂商撤销承诺。"

[[product.training.point]]
text = "The only purpose-widening opening is the non-personally identifiable information in §3.3 (once aggregated, it may be used to improve the service)."
text_zh = "唯一用途扩张口子是 §3.3 的非个人身份识别信息（聚合后可用于改进服务）。"

