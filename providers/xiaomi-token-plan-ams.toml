note = "《Xiaomi MiMo Service Agreement》英文版（正文自述 Effective Date: 7 July 2026）。**本 URL 现行快照装的是境内构建正文，与 ams（海外）档不对应**：§1.1 自述「This Agreement applies to your use of Xiaomi MiMo services within the territory of the People's Republic of China」，并指向另行发布的境外版服务协议（「If you use our services outside the People's Republic of China…the terms of the service agreement applicable to services outside the People's Republic of China, as published on Xiaomi MiMo, shall govern」），运营主体为 Beijing Xiaomi Mobile Software Co., Ltd.；§3.16（原 §3.13）点名 Token Plan（内容仅为不退款/不取消/小米可调整活动规则，不涉数据用途）；第 4 节 Data Protection Provisions 是委托处理附录，开头自限「The scope of the Data Protection Provisions is limited to the Chinese mainland.」（4.1 定义与角色、4.2 目的与使用、4.3 权利义务、4.4 Data Storage、4.5 Security Measures）。现行两条关键句：§4.1「you shall act as the Personal Information Controller, and Xiaomi shall act as the Personal Information Processor.」；§4.4「Xiaomi shall, unless prohibited by applicable laws, cease processing or permanently delete the personal information within a reasonable time. When providing services within the Chinese mainland, Xiaomi shall store the relevant data on servers located within the Chinese mainland and shall not transfer such information outside of this jurisdiction.」；§6.1 另有「涉嫌违法活动的记录可留存」例外。**本档此前引用的境外版正文（运营主体 Xiaomi Technologies Singapore Pte. Ltd.、§1.1 适用境外、§4.1「Xiaomi acts as a Processor…you are the Data Controller」、§4.4「outside the Chinese Mainland → Europe and Singapore」）在本仓库已无快照，属抓取缺口——境外版重抓前不得据此写 ams 档结论，也不得写成厂商撤销承诺。**全文无内容使用授权条款（唯一 train 命中是 §4.5 的人员培训），无零保留/ZDR 表述，无量化保留期。"

[[source]]
url = "https://mimo.mi.com/docs/en-US/terms/privacy-policy"
fetch = "browser"
channel = "consumer_privacy"
tier = "core"
note = "《Xiaomi MiMo Privacy Policy》英文版（快照首行载 Version：v20260806，正文自述 Our Privacy Policy was published and became effective as of 25 June 2026）。**本 URL 现行快照装的是境内构建正文，不是海外版**：引言主体为 Beijing Xiaomi Mobile Software Co., Ltd.，保留政策末段写「your personal information will be stored within the territory of the People's Republic of China」并指向另行发布的境外版隐私政策。现行训练条款为条件式、对象只写文本：「Without your prior consent, Xiaomi will not use the text content provided by you for model training or any other purposes.」；§(3) Retention policy 写目的所需期限，并含公众利益/科学或历史研究/统计目的可继续保留的例外；§(4)(ii) 写删除后备份系统可能无法立即删除。**现行快照已无 EEA/荷兰/新加坡分区表述（全文无 EEA、Netherlands、Singapore 命中），故 ams 档的居住地分区与 EEA 控制者证据改由第三来源（privacy.mi.com 中文版）承担；本档英文境外版正文在本仓库无快照，属抓取缺口。**全文无零保留/ZDR、无 DPA 附件。"

[[source]]
url = "https://privacy.mi.com/XiaomiMiMoPlatformos/zh_CN/"
channel = "consumer_privacy"
tier = "core"
note = "《Xiaomi MiMo 平台隐私条款》中文版（2026-06-25 更新），主体同为 Xiaomi Technology Netherlands B.V. + Xiaomi Technologies Singapore Pte. Ltd.，是海外档的官方中文文本，本档训练、保留与处理地的主证据来源；实测与文档站中文隐私政策 https://mimo.mi.com/docs/zh-CN/terms/privacy-policy 正文逐字相同（去掉 URL 头后 diff=0），同一文档两个 URL。§3.1「小米不会将您提供的内容用于模型训练或任何其他目的。」，同条目内「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」紧邻声音克隆与音频授权句；§6 保留期限（目的所需期限，未量化，例外仅为「但适用法律另有要求或允许的除外」）；§8 删除后备份系统可能无法立即移除；§10 荷兰/新加坡数据中心与 EEA 控制者安排（未按居住地写明「存储于荷兰数据中心」；英文快照现为境内构建、已无 §10 分区表述，本仓库此前记载的英文分区映射目前无任何快照支持，需查 git 历史或等境外版重抓）；§12 原则上不用于自动化决策。"

