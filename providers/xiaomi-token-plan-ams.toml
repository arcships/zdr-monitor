[[product.zdr.point]]
text = "Same as top-level zdr: the official documents do state storage and retention (overseas tier: §6 of the Chinese privacy terms, plus the delayed deletion from the backup system in §8 of the same document) while carrying no zero-retention commitment and no way to apply for one, and the overseas site publishes no DPA. Explicit retention plus the absence of any ZDR statement is what supports mark=no — not any single backup-delay clause."
text_zh = "同顶层 zdr：官方文档明示会存储与保留（海外档见中文隐私条款 §6，以及同文档 §8 的备份延迟删除），同时全文无零保留承诺或申请方式，海外站也无公开 DPA。「有明示的存储与保留依据 + 无零保留表述」才是 mark=no 的依据，不是靠某一条备份延迟句。"

[[product.zdr.point]]
text = "The searched[] list mixes URLs that do have snapshots in this repository with ones that do not (the zh-CN paths, the Token Plan subscription page, the Token Plan FAQ, the DPA page). The latter are a fetch gap on our side: they are not evidence that the vendor offers no zero-retention option, and \"not found\" must not be written up as \"the vendor does not offer it\"."
text_zh = "searched[] 里既有本仓库已有快照的 URL，也有尚未抓到的（zh-CN 路径、Token Plan 订阅页、Token Plan FAQ、DPA 页）。后者是我方抓取缺口，不构成「厂商不提供零保留」的证据；不得把「查不到」写成「厂商不提供」。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "mimo-os-6-retention-purpose"

[[product.retention.point]]
text = "Same as top-level retention: the overseas Chinese privacy terms (§6) retain personal information for the period necessary for the purposes described in those terms, or as required by applicable law (not quantified), and state that once the collection purpose is fulfilled, a deletion request is confirmed, or the corresponding service is terminated, retention stops and the information is deleted or anonymised (\"unless otherwise required or permitted by applicable law\"); deletion from the backup system may be delayed (§8 of the same document). The Service Agreement §4.4 deletion clause is not used as ams-tier evidence: the current snapshot of that agreement is the in-PRC build, whose §1.1 and §4 limit it to the Chinese mainland, so it is recorded side by side only, pending a re-fetch of the overseas version."
text_zh = "同顶层 retention：海外档中文隐私条款 §6 按本隐私条款所述之目的所需期限或适用法律要求保留（未量化），并写明一旦收集目的达成、确认删除请求或终止相应服务，即停止保留并删除或匿名化（「但适用法律另有要求或允许的除外」）；备份系统删除有延迟（同文档 §8）。服务协议 §4.4 的删除条款不作为本档依据——该协议现行快照是境内构建，§1.1 与 §4 自限中国大陆，仅作并列记录，待境外版重抓后确认。"

[[product.retention.point]]
text = "KV cache and access logs are not disclosed"
text_zh = "KV 缓存、访问日志未披露"

[[product.retention.point]]
text = "No request-level retention period is committed."
text_zh = "无请求级期限承诺。"

[[product.retention.point]]
text = "Exception recorded side by side (in-PRC build v20260806 of the English privacy policy): \"In cases where data is retained for reasons of public interest, scientific or historical research, or statistical purposes, we will continue to retain such data in accordance with applicable laws, even if further processing is incompatible with the original collection purposes.\" The overseas Chinese text writes the same carve-out more narrowly (\"unless otherwise required or permitted by applicable law\"), so the two are not merged into one ams conclusion."
text_zh = "并列记录的例外（英文隐私政策境内构建 v20260806）：因公众利益、科学或历史研究、统计目的而保留数据时，即使进一步处理与原始收集目的不符，仍会依适用法律继续保留。海外档中文文本的例外写法更窄（「但适用法律另有要求或允许的除外」），两者不合并成一条 ams 结论。"

[[product.retention.point]]
text = "Exception recorded side by side (Service Agreement §6.1, in-PRC build): \"Xiaomi reserves the right to retain records of any activity suspected of violating laws or regulations, or involving suspected illegal or criminal conduct...\" The same snapshot limits that agreement to the Chinese mainland (§1.1 and §4), so it is not an ams-tier exception today — it goes on the list to confirm once the overseas version is re-fetched."
text_zh = "并列记录的例外（服务协议 §6.1，境内构建）：小米保留留存涉嫌违法或涉嫌违法犯罪活动记录的权利。同一快照的 §1.1 与 §4 把该协议限制在中国大陆，故暂不作为 ams 档现行例外，列入待境外版重抓后确认的清单。"

[product.processing_region]
codes = ["NL", "SG"]
anchor = "mimo-os-10-nl-sg-datacenters"

[[product.processing_region.point]]
text = "Same as top-level processing_region: the official Chinese text of the overseas tier states that Xiaomi has data centres in the Netherlands and Singapore (「目前，小米在荷兰和新加坡设有数据中心」), and that Xiaomi Technology Netherlands B.V. acts as the data controller for users in the EEA, UK or Switzerland. The residence-based mapping this TOML used to record (EEA/UK/CH residents stored in the Netherlands, non-EEA residents in Singapore) is not carried by any snapshot in this repository right now: this TOML recorded that wording earlier, no current snapshot carries it, and it must not be written up as present fact — confirming it needs the git history or a re-fetch of the overseas version."
text_zh = "同顶层 processing_region：海外档官方中文文本写明「目前，小米在荷兰和新加坡设有数据中心」，EEA/UK/CH 用户由 Xiaomi Technology Netherlands B.V. 担任数据控制者。本 TOML 此前记载的按居住地分区（EEA/UK/CH 居民存荷兰、非 EEA 存新加坡）目前没有任何快照支持——本仓库此前记载过该句，现行快照已无该句，需查 git 历史或等境外版重抓确认。"

[[product.processing_region.point]]
text = "At the contract layer the Service Agreement snapshot now holds the in-PRC build: §4.4 says \"When providing services within the Chinese mainland, Xiaomi shall store the relevant data on servers located within the Chinese mainland and shall not transfer such information outside of this jurisdiction.\" — the opposite direction from the earlier \"outside the Chinese Mainland → Europe and Singapore\" sentence, which no snapshot supports any more. The two are recorded side by side; the overseas version has to be re-fetched before it can be used again."
text_zh = "合同层：服务协议快照现为境内构建，§4.4 写「在中国大陆境内提供服务时，小米应将相关数据存储在中国大陆境内的服务器上，不得将该信息传输至该司法辖区之外」——与此前「中国大陆以外 → 欧洲和新加坡」方向相反，后者已无快照支持。两条并列记录；境外版重抓前不得再据此写结论。"

[[product.processing_region.point]]
text = "No official statement binds the cluster endpoint (ams) to a storage location."
text_zh = "集群 endpoint（ams）与存储地之间没有官方明示的绑定关系。"

[product.role]
kind = "processor"
anchor = "mimo-os-3-1-entrusted-processing"

[[product.role.point]]
text = "Same as top-level role: the overseas tier's role evidence is the official Chinese privacy terms — 「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」 (English rendering: \"You authorise Xiaomi MiMo to process the information you upload on an entrusted basis to provide the service\"). The sentence sits in the API-service item but immediately follows the voice-cloning and audio-authorisation sentences, so whether it covers API/Token Plan in general is open. The privacy policy separately identifies Xiaomi as controller in the EEA consumer context; both layers are recorded side by side."
text_zh = "同顶层 role：海外档角色依据是官方中文隐私条款「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」。该句位于「应用程序接口服务」条目内，但紧邻声音克隆与音频授权句，是否覆盖 API/Token Plan 的一般场景存疑。隐私政策另在 EEA 消费者语境下自认 controller，两层并列。"

[[product.role.point]]
text = "The contract layer is an in-PRC build today: §4 opens with \"The scope of the Data Protection Provisions is limited to the Chinese mainland.\" and §4.1 now reads \"you shall act as the Personal Information Controller, and Xiaomi shall act as the Personal Information Processor.\" That agreement therefore cannot serve as the ams tier's main role evidence until the overseas version is re-fetched — a gap on our side, not a statement by the vendor."
text_zh = "合同层现为境内构建：§4 开头自限「本数据保护条款的范围限于中国大陆」，§4.1 现写「您为个人信息控制者，小米为个人信息受托处理方」。该协议在境外版重抓前不能作为 ams 档 role 的主证据——这是我方的来源缺口，不是厂商的表态。"

