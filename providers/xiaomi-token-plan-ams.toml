[[product.zdr.point]]
text = "Same as top-level zdr: the official documentation carries no zero-retention commitment and no way to apply for one, and the overseas site publishes no DPA"
text_zh = "同顶层 zdr：官方文档无零保留承诺或申请方式，海外站无公开 DPA"

[[product.zdr.point]]
text = "\"Not found\" must not be written up as \"the vendor does not offer it\"."
text_zh = "不得把「查不到」写成「厂商不提供」。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "mimo-en-6-retention-purpose"

[[product.retention.point]]
text = "Same as top-level retention: retained \"for the period necessary for the purposes described in this Privacy Policy\" (not quantified), plus cessation of processing or permanent deletion \"within a reasonable period\" after service termination or a user request (Service Agreement §4.4), plus delayed deletion from the backup system"
text_zh = "同顶层 retention：目的所需期限（未量化）+ 服务终止/用户请求后「合理期限」内删除（服务协议 §4.4）+ 备份延迟删除"

[[product.retention.point]]
text = "KV cache and access logs are not disclosed"
text_zh = "KV 缓存、访问日志未披露"

[[product.retention.point]]
text = "No request-level retention period is committed."
text_zh = "无请求级期限承诺。"

[product.processing_region]
codes = ["NL", "SG"]
anchor = "mimo-en-10-eea-stored-in-nl"

[[product.processing_region.point]]
text = "Same as top-level processing_region: data of EEA/UK/Switzerland residents is stored in data centres located in the Netherlands, and data of non-EEA residents in Singapore"
text_zh = "同顶层 processing_region：EEA/UK/CH 居民数据存储于荷兰数据中心、非 EEA 居民存储于新加坡"

[[product.processing_region.point]]
text = "At the contract layer: \"When providing services outside the Chinese Mainland, Xiaomi will store the relevant data on servers located in Europe and Singapore.\""
text_zh = "合同层承诺「中国大陆以外 → 欧洲和新加坡服务器」"

[[product.processing_region.point]]
text = "No official statement binds the cluster endpoint (ams) to a storage location."
text_zh = "集群 endpoint（ams）与存储地之间没有官方明示的绑定关系。"

[product.role]
kind = "processor"
anchor = "mimo-sa-4-1-processor-controller"

[[product.role.point]]
text = "Same as top-level role: at the contract layer the structure is an entrusted one, \"Xiaomi acts as a Processor in data processing activities, and you are the Data Controller\" (Service Agreement §4.1), while the privacy policy identifies Xiaomi as controller in the EEA consumer context; both layers are recorded side by side."
text_zh = "同顶层 role：合同层为 processor/controller 委托结构（服务协议 §4.1），隐私政策在 EEA 消费者语境下自认 controller，两层并列。"

