[[source]]
url = "https://mimo.mi.com/docs/en-US/quick-start/terms/user-agreement"
channel = "contract"
tier = "core"
note = "《Xiaomi MiMo Service Agreement》英文版（正文自述 updated on July 7, 2026），覆盖中国大陆以外区域的国际站服务，含 API 与 Token Plan 订阅档：§1.1 明确「This Agreement applies to your use of the services outside the territory of the People's Republic of China (PRC)」且运营主体为 Xiaomi Technologies Singapore Pte. Ltd.；§3.13 明文点名 Token Plan（内容仅为不退款/不取消/小米可调整活动规则，不涉数据用途）；第 4 节 Data Protection Terms 是专门面向中国大陆以外区域的委托处理附录（4.1 定义与角色、4.2 目的与使用、4.3 权利义务、4.4 Data Storage、4.5 Security Measures）。本档最重要的两条：§4.1「Xiaomi acts as a Processor…you are the Data Controller」与 §4.4「When providing services outside the Chinese Mainland, Xiaomi will store the relevant data on servers located in Europe and Singapore」。全文无内容使用授权条款（唯一 train 命中是 §4.5 的人员培训），无零保留/ZDR 表述，无量化保留期。"

[[source]]
url = "https://mimo.mi.com/docs/en-US/terms/privacy-policy"
channel = "consumer_privacy"
tier = "core"
note = "《Xiaomi MiMo Privacy Policy》英文版（正文自述 updated on June 25, 2026），即服务协议第 4 节所称的「Xiaomi MiMo Privacy Policy」，主体为 Xiaomi Technology Netherlands B.V. + Xiaomi Technologies Singapore Pte. Ltd.，面向中国大陆以外区域。§3.1 覆盖「the API services or the Xiaomi MiMo Code」（含 prepaid API services）；§10 按居住地分档写明存储地与控制者：EEA/UK/CH 居民的数据存储在荷兰数据中心、可传输至新加坡；非 EEA 居民的数据存储在新加坡数据中心、可传输至荷兰。本档是 ams 条目最具体、且与「欧洲」直接相关的英文政策文本。全文无量化保留期、无 ZDR/零保留、无 DPA 附件。"

[[source]]
url = "https://privacy.mi.com/XiaomiMiMoPlatformos/zh_CN/"
channel = "consumer_privacy"
tier = "core"
note = "《Xiaomi MiMo 平台隐私条款》中文版（2026-06-25 更新），主体同为 Xiaomi Technology Netherlands B.V. + Xiaomi Technologies Singapore Pte. Ltd.，是海外档的官方中文文本；实测与文档站中文隐私政策 https://mimo.mi.com/docs/zh-CN/terms/privacy-policy 正文逐字相同（去掉 URL 头后 diff=0），同一文档两个 URL。§3.1「小米不会将您提供的内容用于模型训练或任何其他目的。」；§10 荷兰/新加坡数据中心与 EEA 控制者安排（但未按居住地写明「存储于荷兰数据中心」，比英文版弱）；§12 原则上不用于自动化决策。"

[[product]]
id = "token-plan-europe-cluster"
badge = "欧洲集群"
category = "coding_plan"
plan_level = "individual"

[product.training]
mark = "yes"
mode = "default"
anchor = "mimo-en-3-1-no-training"

[[product.training.point]]
text = "Same as top-level training: on the overseas tier, \"Xiaomi will not use the content you provide for model training or any other purposes\", unconditionally (§3.1)"
text_zh = "同顶层 training：海外档无条件不用于训练（§3.1）"

[[product.training.point]]
text = "The only purpose-widening opening is the non-personally identifiable information in §3.3 (once aggregated, it may be used to improve the service)."
text_zh = "唯一用途扩张口子是 §3.3 的非个人身份识别信息（聚合后可用于改进服务）。"

[product.zdr]
mark = "no"
anchor = "mimo-en-8-backup-deletion-delay"
