tier = "core"
note = "《Xiaomi MiMo Service Agreement》英文版（正文自述 Our Service Agreement was updated on July 7, 2026）。**本 URL 现行快照装的是境外（国际）构建正文，与 ams（海外）档对应**：§1.1 运营主体写明「Xiaomi MiMo is operated by Xiaomi Technologies Singapore Pte. Ltd.」，协议自述「This Agreement applies to your use of the services outside the territory of the People's Republic of China (PRC)」，境内访问由另行发布在开放平台的境内条款管辖；§8.1 适用新加坡法并约定 SIAC 仲裁。§3.1「Xiaomi MiMo is only a neutral technical service provider…」；§3.13 点名 Token Plan（内容仅为不退款/不取消/小米可调整活动规则，不涉数据用途）。第 4 节 Data Protection Terms 是境外适用的委托处理附录（4.1 定义与角色、4.2 目的与使用、4.3 权利义务、4.4 Data Storage、4.5 Security Measures）：开篇「These Data Protection Terms apply to regions outside the Chinese Mainland.」；§4.1「Xiaomi acts as a Processor in data processing activities, and you are the Data Controller.」；§4.4「Upon service expiration, completion of the agreed purpose, or at your request, unless prohibited by laws that Xiaomi must comply with, Xiaomi will cease processing or permanently delete the personal information within a reasonable period. When providing services outside the Chinese Mainland, Xiaomi will store the relevant data on servers located in Europe and Singapore.」；§6.1 另有「涉嫌违法活动的记录可留存」例外。**同一 URL 此前快照装的是境内构建正文（§1.1 适用中国大陆、§4 限中国大陆、运营主体 Beijing Xiaomi Mobile Software Co., Ltd.）；本次抓取返回境外构建，自述更新日期 July 7, 2026 与上一版一致，属站点按构建/地区分发的变体切换，不是厂商改条款，也不代表承诺被撤销；后续重抓可能再切回境内构建，届时锚点会再次失效。**全文无内容使用授权条款（唯一 train 命中是 §4.5 的人员培训），无零保留/ZDR 表述，无量化保留期。"

[[source]]
url = "https://mimo.mi.com/docs/en-US/terms/privacy-policy"
fetch = "browser"
channel = "consumer_privacy"
tier = "core"
note = "《Xiaomi MiMo Privacy Policy》英文版（正文自述 Our Privacy Policy was updated on June 25 , 2026）。**本 URL 现行快照装的是境外（国际）构建正文，不是境内版**：引言主体为 Xiaomi Technology Netherlands B.V.、Xiaomi Technologies Singapore Pte. Ltd. and its affiliates；§9 分别给出 EEA/UK/CH（Xiaomi Technology Netherlands B.V.）与其他国家/地区（Xiaomi Technologies Singapore Pte. Ltd.）的联系主体；§10 写「Xiaomi uses regional data hosting infrastructure located in the Netherlands and Singapore.」并按居住地分工：EEA/UK/CH 居民由 Netherlands B.V. 任数据控制器、个人信息存荷兰数据中心，境外居民由 Singapore Pte. Ltd. 任控制器、个人信息存新加坡数据中心。训练条款为无条件、对象是全部内容：「Xiaomi will not use the content you provide for model training or any other purposes.」；§6 保留政策写目的所需期限，例外收窄为「except when required or permitted by applicable law…」；§8 的删除权一节写删除后备份系统可能无法立即移除。**同一 URL 此前快照装的是境内构建正文（含 PRC 存储句、无 EEA/荷兰/新加坡分区，训练句为条件式、只覆盖文本）；本次抓取返回境外构建，自述更新日期 June 25, 2026 与上一版一致，属站点按构建/地区分发的变体切换，不是厂商改条款。**全文无零保留/ZDR、无 DPA 附件。"

[[source]]
url = "https://privacy.mi.com/XiaomiMiMoPlatformos/zh_CN/"
channel = "consumer_privacy"
tier = "core"
note = "《Xiaomi MiMo 平台隐私条款》中文版（2026-06-25 更新），主体同为 Xiaomi Technology Netherlands B.V. + Xiaomi Technologies Singapore Pte. Ltd.，是海外档的官方中文文本，本档训练、保留与处理地的主证据来源；实测与文档站中文隐私政策 https://mimo.mi.com/docs/zh-CN/terms/privacy-policy 正文逐字相同（去掉 URL 头后 diff=0），同一文档两个 URL。§3.1「小米不会将您提供的内容用于模型训练或任何其他目的。」，同条目内「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」紧邻声音克隆与音频授权句；§6 保留期限（目的所需期限，未量化，例外仅为「但适用法律另有要求或允许的除外」）；§8 删除后备份系统可能无法立即移除；§10 荷兰/新加坡数据中心与 EEA 控制者安排（本节本身未按居住地逐条写明「存储于荷兰数据中心」；英文隐私政策快照现亦为境外构建，其 §10 明确按居住地写明 EEA/UK/CH 数据存荷兰、境外存新加坡，两文互为佐证）；§12 原则上不用于自动化决策。"

