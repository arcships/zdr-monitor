]

[[product.zdr.point]]
text = "Same as top-level zdr: the official documents do state storage and retention (overseas tier: §6 of the Chinese privacy terms and §6 of the English privacy policy, the delayed deletion from the backup system in the English §8 / Chinese §8, and Service Agreement §4.4 — now the overseas build — which commits to storing data in Europe and Singapore and to ceasing processing or permanently deleting within a reasonable period) while carrying no zero-retention commitment and no way to apply for one, and the overseas site publishes no DPA. Explicit retention plus the absence of any ZDR statement is what supports mark=no — not any single backup-delay clause."
text_zh = "同顶层 zdr：官方文档明示会存储与保留（海外档见中文隐私条款 §6、英文隐私政策 §6 与 §8 的备份延迟删除，以及现为境外构建的服务协议 §4.4——承诺数据存欧洲与新加坡、并在合理期限内停止处理或彻底删除），同时全文无零保留承诺或申请方式，海外站也无公开 DPA。「有明示的存储与保留依据 + 无零保留表述」才是 mark=no 的依据，不是靠某一条备份延迟句。"

[[product.zdr.point]]
text = "The searched[] list mixes URLs that do have snapshots in this repository with ones that do not (the zh-CN paths, the Token Plan subscription page, the Token Plan FAQ, the DPA page). The latter are a fetch gap on our side: they are not evidence that the vendor offers no zero-retention option, and \"not found\" must not be written up as \"the vendor does not offer it\"."
text_zh = "searched[] 里既有本仓库已有快照的 URL，也有尚未抓到的（zh-CN 路径、Token Plan 订阅页、Token Plan FAQ、DPA 页）。后者是我方抓取缺口，不构成「厂商不提供零保留」的证据；不得把「查不到」写成「厂商不提供」。"

[product.retention]
object = "input_output"
basis = "undisclosed"
anchor = "mimo-os-6-retention-purpose"

[[product.retention.point]]
text = "Same as top-level retention: the overseas privacy texts (§6 of the Chinese terms, §6 of the English policy) retain personal information for the period necessary for the purposes described there, or as required by applicable law (not quantified), and state that once the collection purpose is fulfilled, a deletion request is confirmed, or the corresponding service is terminated, retention stops and the information is deleted or anonymised (the English text: \"except when required or permitted by applicable law\"). The Service Agreement §4.4 deletion clause can now be used as ams-tier evidence too: the current snapshot is the overseas build, whose §4 limits it to regions outside the Chinese Mainland, and §4.4 says \"Upon service expiration, completion of the agreed purpose, or at your request, unless prohibited by laws that Xiaomi must comply with, Xiaomi will cease processing or permanently delete the personal information within a reasonable period.\" Deletion from the backup system may still be delayed (§8 of both privacy texts). basis stays undisclosed: no quantified period is given."
text_zh = "同顶层 retention：海外档隐私正文（中文条款 §6、英文政策 §6）按所述目的所需期限或适用法律要求保留（未量化），并写明一旦收集目的达成、确认删除请求或终止相应服务，即停止保留并删除或匿名化（英文写「except when required or permitted by applicable law」）。服务协议 §4.4 的删除条款现可作为本档依据——现行快照是境外构建，§4 自限中国大陆以外，§4.4「Upon service expiration, completion of the agreed purpose, or at your request, unless prohibited by laws that Xiaomi must comply with, Xiaomi will cease processing or permanently delete the personal information within a reasonable period.」。备份系统删除仍可能延迟（两份隐私正文的 §8）。basis 维持 undisclosed：未给量化期限。"

[[product.retention.point]]
text = "KV cache and access logs are not disclosed"
text_zh = "KV 缓存、访问日志未披露"

[[product.retention.point]]
text = "No request-level retention period is committed."
text_zh = "无请求级期限承诺。"

[[product.retention.point]]
text = "Retention exception (does not change basis = undisclosed): the English privacy policy snapshot no longer carries the broad \"public interest, scientific or historical research, or statistical purposes\" carve-out it previously had; the served (overseas) build writes the narrower exception \"except when required or permitted by applicable law, in which case, your personal information will be isolated and will not be further processed except for the attendance of legal responsibilities and other purposes permitted by applicable law.\" That matches the narrower wording of the Chinese privacy terms (「但适用法律另有要求或允许的除外」), so there is no side-by-side conflict left for the ams tier."
text_zh = "保留例外（不改变 basis=undisclosed）：英文隐私政策快照不再包含此前那句宽泛的「公众利益、科学或历史研究、统计目的」例外；现行（境外）构建写的是更窄的例外「except when required or permitted by applicable law, in which case, your personal information will be isolated and will not be further processed except for the attendance of legal responsibilities and other purposes permitted by applicable law.」，与中文隐私条款「但适用法律另有要求或允许的除外」一致，ams 档不再有并列冲突。"

[[product.retention.point]]
text = "Exception (Service Agreement §6.1, now the overseas build and therefore an ams-tier exception): \"Xiaomi has the right to keep relevant records of suspected violations of laws and regulations and suspected illegal crimes, and report to the relevant competent authorities in accordance with the law and cooperate with the relevant competent authorities in investigation.\" The object is records of suspected violations, not request content as a general rule."
text_zh = "例外（服务协议 §6.1，现为境外构建，故属 ams 档例外）：「Xiaomi has the right to keep relevant records of suspected violations of laws and regulations and suspected illegal crimes, and report to the relevant competent authorities in accordance with the law and cooperate with the relevant competent authorities in investigation.」对象是涉嫌违法的记录，不是一般的请求正文。"

[product.processing_region]
codes = ["NL", "SG"]
anchor = "mimo-os-10-nl-sg-datacenters"

[[product.processing_region.point]]
text = "Same as top-level processing_region: the overseas tier's official texts state data-centre locations in the Netherlands and Singapore. The Chinese privacy terms (source 3): 「目前，小米在荷兰和新加坡设有数据中心」, with Xiaomi Technology Netherlands B.V. as controller for users in the EEA, UK or Switzerland. The English privacy policy snapshot is now the overseas build and §10 carries the residence-based mapping again: if you reside in the EEA/UK/CH, Netherlands B.V. is the controller and the personal information collected is stored in data centres located in the Netherlands; if you reside outside them, Singapore Pte. Ltd. is the controller and the information is stored in a data centre located in Singapore. Both are first-party texts; the English one is the same document as published on the docs site."
text_zh = "同顶层 processing_region：海外档官方文本写明数据中心在荷兰与新加坡。中文隐私条款（来源 3）「目前，小米在荷兰和新加坡设有数据中心」，EEA/UK/CH 用户由 Xiaomi Technology Netherlands B.V. 担任数据控制者。英文隐私政策快照现为境外构建，§10 重新载有按居住地分工：EEA/UK/CH 居民由 Netherlands B.V. 控制、所收集个人信息存荷兰数据中心；境外居民由 Singapore Pte. Ltd. 控制、信息存新加坡数据中心。两份都是官方正文，英文版即文档站发布的同一文档。"

[[product.processing_region.point]]
text = "At the contract layer the Service Agreement snapshot now holds the overseas build: §4 opens with \"These Data Protection Terms apply to regions outside the Chinese Mainland.\" and §4.4 says \"When providing services outside the Chinese Mainland, Xiaomi will store the relevant data on servers located in Europe and Singapore.\" — the same direction as the privacy layer's Netherlands/Singapore, and no longer the earlier in-PRC \"shall not transfer such information outside of this jurisdiction\" wording. The change came from the served build switching back to the overseas variant, not from a vendor amendment; codes stay NL and SG because the privacy texts name those two data-centre countries specifically."
text_zh = "合同层：服务协议快照现为境外构建，§4 开篇「These Data Protection Terms apply to regions outside the Chinese Mainland.」，§4.4「When providing services outside the Chinese Mainland, Xiaomi will store the relevant data on servers located in Europe and Singapore.」——与隐私层荷兰/新加坡同向，不再是此前境内版的「不得将该信息传输至该司法辖区之外」。变化源于站点返回的构建切回境外变体，不是厂商修订；codes 仍取 NL、SG，因为隐私正文点名的是这两个数据中心国家。"

[[product.processing_region.point]]
text = "No official statement binds the cluster endpoint (ams) to a storage location."
text_zh = "集群 endpoint（ams）与存储地之间没有官方明示的绑定关系。"

[product.role]
kind = "processor"
anchor = "mimo-os-3-1-entrusted-processing"

[[product.role.point]]
text = "Same as top-level role: the overseas tier's role evidence is the official Chinese privacy terms — 「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」; the English privacy policy now renders the same clause as \"You authorize Xiaomi MiMo to process the information you upload on an entrusted basis to provide the service, and Xiaomi MiMo does not need to obtain any additional authorization from any other party.\" The sentence sits in the API-service item but immediately follows the voice-cloning and audio-authorisation sentences, so whether it covers API/Token Plan in general is open. The privacy policy separately identifies Xiaomi as controller in the EEA consumer context (§10); both layers are recorded side by side."
text_zh = "同顶层 role：海外档角色依据是官方中文隐私条款「您授权 Xiaomi MiMo 受托处理您上传的信息以提供该服务」；英文隐私政策现行正文把同一句写为「You authorize Xiaomi MiMo to process the information you upload on an entrusted basis to provide the service, and Xiaomi MiMo does not need to obtain any additional authorization from any other party.」。该句位于「应用程序接口服务」条目内，但紧邻声音克隆与音频授权句，是否覆盖 API/Token Plan 的一般场景存疑。隐私政策另在 EEA 消费者语境下（§10）自认 controller，两层并列。"

[[product.role.point]]
text = "The contract layer is now the overseas build and can serve as ams-tier role evidence: §4 opens with \"These Data Protection Terms apply to regions outside the Chinese Mainland.\" and §4.1 reads \"Xiaomi acts as a Processor in data processing activities, and you are the Data Controller.\" — consistent with kind = processor. (§1.1 identifies the operator as Xiaomi Technologies Singapore Pte. Ltd. and limits the agreement to use of the services outside the PRC.)"
text_zh = "合同层现为境外构建，可作为 ams 档 role 依据：§4 开篇「These Data Protection Terms apply to regions outside the Chinese Mainland.」，§4.1「Xiaomi acts as a Processor in data processing activities, and you are the Data Controller.」——与 kind = processor 一致。（§1.1 运营主体为 Xiaomi Technologies Singapore Pte. Ltd.，协议限境外使用。）"

