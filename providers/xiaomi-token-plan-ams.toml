[product.training]
mark = "yes"
mode = "default"
anchor = "mimo-os-3-1-no-training"

[[product.training.point]]
text = "Same as top-level training: on the overseas tier the official Chinese privacy terms (§3.1) state unconditionally that Xiaomi will not use the content you provide for model training or any other purposes (「小米不会将您提供的内容用于模型训练或任何其他目的」, English rendering). The English privacy policy snapshot taken at the same time holds the in-PRC build, where the same clause is conditional and limited to text: \"Without your prior consent, Xiaomi will not use the text content provided by you for model training or any other purposes.\" — images, video and audio are not covered there. Both facts are recorded side by side; the English sentence going missing does not change the verdict."
text_zh = "同顶层 training：海外档官方中文隐私条款 §3.1 无条件写明「小米不会将您提供的内容用于模型训练或任何其他目的」；同一时间的英文隐私政策快照装的是境内构建正文，同一句改为条件式且对象只写文本内容（未经您事先同意，不将您提供的文本内容用于模型训练或任何其他目的），图片/视频/音频未表态。两条事实并列保留，不因英文快照里找不到原句而改判。"

[[product.training.point]]
text = "The only purpose-widening opening is the non-personally identifiable information in §3.3 (once aggregated, it may be used to improve the service)."
text_zh = "唯一用途扩张口子是 §3.3 的非个人身份识别信息（聚合后可用于改进服务）。"

