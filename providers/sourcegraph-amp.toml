[[product]]
id = "free"
badge = "Hobby（Free）"
category = "coding_plan"
plan_level = "free"
[product.training]
mark = "yes"
mode = "default"
anchor = "amp-training-optin"
[[product.training.point]]
text_zh = "训练是 opt-in：官方写的是「除非你显式打开训练，否则 Amp 和它的分包商都不用你的数据训练模型」，开关在 User Settings。"
[[product.training.point]]
text_zh = "例外是挂自己的 ChatGPT/Grok 订阅跑模型——那时走的是对方的消费级账号条款，Amp 的训练开关管不着，得去对方的 Data Controls 里单独关。"
anchor = "amp-personal-subscription-terms"
[[product.training.point]]
text = "One lower-authority source points the other way: the privacy policy lists \"product improvement\" among Amp's own legitimate interests, and \"plan for and enhance our service\" among the uses of automatically collected data. Under this ledger's rule that improving a service counts as training, that sentence would argue the opposite; it is a consumer_privacy-level general statement, while the security page's \"Neither Amp nor our subprocessors train models on your data, unless you have explicitly opted into training.\" is the developer_data-level commitment and outranks it (contract > developer_data > enterprise_privacy_faq > consumer_privacy). Both facts are kept, and the mark stays yes on the security page."
text_zh = "有一条低位阶表述方向相反：隐私政策把「product improvement」列进 Amp 自身的合法利益，自动收集数据的用途里也有「plan for and enhance our service」。按本台账「用来改进服务算训练」的口径，这句本应推出 mark=no；但它是 consumer_privacy 层级的一般性表述，而安全页的「Neither Amp nor our subprocessors train models on your data, unless you have explicitly opted into training.」属 developer_data 层级，按 contract > developer_data > enterprise_privacy_faq > consumer_privacy 优先。两条事实并列保留，结论仍以安全页为准记 yes。"
anchor = "amp-privacy-product-improvement"
[product.zdr]
mark = "no"
anchor = "amp-mdr-not-zero"
[[product.zdr.point]]
text = "MDR is a qualified mechanism rather than a blanket zero-retention promise: it is \"available to all Amp users when Amp sends requests through model provider connections managed by Amp and using Amp credits.\" Requests routed through a customer-managed connection are not covered."
text_zh = "MDR 是有条件的机制，不是无条件的零保留承诺：官方写它「available to all Amp users when Amp sends requests through model provider connections managed by Amp and using Amp credits」。走客户自管连接的调用不在覆盖范围内。"
anchor = "amp-mdr-availability"
[[product.zdr.point]]
text = "The object is the provider hop, not Amp's own storage: \"MDR only covers data handled by third-party model providers during inference (the process of generating a model response). It does not control how Amp stores thread data.\" Amp's own thread storage is governed by the retention row instead."
text_zh = "对象是模型商那一跳，不是 Amp 自己的存储：官方写「MDR only covers data handled by third-party model providers during inference (the process of generating a model response). It does not control how Amp stores thread data.」。Amp 自身的 thread 存储由 retention 列的规则管辖。"
anchor = "amp-mdr-third-party-only"
[[product.zdr.point]]
text = "Coverage is not uniform across models: \"Certain models or features may require longer retention. A provider may retain data for up to 30 days when specified in its current documentation.\" 30 days is an upper bound for that subset, not a general retention period."
text_zh = "覆盖程度不因模型而一致：官方写「Certain models or features may require longer retention. A provider may retain data for up to 30 days when specified in its current documentation.」。这里的 30 天是该子集的上限，不是普遍保留期。"
anchor = "amp-mdr-30d-exception"
[[product.zdr.point]]
text = "And some calls cannot be limited at all: \"Some models and features are not eligible for MDR.\" Eligibility can change as providers change their terms, so whether a given call is covered has to be checked per model and feature where it is enabled."
text_zh = "而且有些调用根本不在覆盖范围内：官方写「Some models and features are not eligible for MDR.」。资格会随模型商条款变化，某次调用是否受覆盖必须在启用处按模型/功能确认。"
anchor = "amp-mdr-not-eligible"
[[product.zdr.point]]
text = "Exception to the ordinary rule (retained only as long as needed to return a response): \"Providers may retain safety and abuse monitoring data, including classifier results, trust and safety scores, and content flagged as potentially violating their usage policies. Each provider retains this data according to its abuse prevention and safety policies.\""
text_zh = "常规规则（只为返回响应所需时长保留）之外的第一条例外：官方写「Providers may retain safety and abuse monitoring data, including classifier results, trust and safety scores, and content flagged as potentially violating their usage policies. Each provider retains this data according to its abuse prevention and safety policies.」。"
anchor = "amp-mdr-abuse-exception"
[[product.zdr.point]]
text = "Second exception: \"Providers may retain data when required by law, a court order, or a regulatory requirement.\""
text_zh = "第二条例外：官方写「Providers may retain data when required by law, a court order, or a regulatory requirement.」。"
anchor = "amp-mdr-legal-exception"
[[product.zdr.point]]
text = "BYOK leaves the MDR regime: \"Requests sent with your key are covered by the retention terms of your provider account.\" The MDR page says the same in its own words — the retention terms of the provider account apply instead."
text_zh = "BYOK 不适用 MDR：官方写「Requests sent with your key are covered by the retention terms of your provider account.」。MDR 页同义表述为：客户自管连接的调用改为适用其模型账号的保留条款。"
anchor = "amp-byok-provider-terms"
[[product.zdr.point]]
text = "The provider-side object is not only the prompt text: \"Providers may store computational artifacts derived from prompts, such as key/value tensors or cached tokens, for a limited period. In this case, the provider does not persist the original prompt text after generating the response.\" KV cache / cached tokens are a separate object from Amp's thread data, and no period is given beyond \"a limited period\"."
text_zh = "模型商侧的对象不只是提示词正文：官方写「Providers may store computational artifacts derived from prompts, such as key/value tensors or cached tokens, for a limited period. In this case, the provider does not persist the original prompt text after generating the response.」。KV 缓存/缓存 token 与 Amp 的 thread 数据是两个对象，期限只写了「a limited period」，没有具体天数。"
anchor = "amp-mdr-kv-cache"
[product.retention]
days = 30
object = "input_output"
basis = "until_termination"
anchor = "amp-thread-delete-30d"
[[product.retention.point]]
text = "Account-level retention runs with the account: \"Amp retains your information while your account is active.\" This is the account-data clock; it is not the same object as the 30-day thread-deletion window."
text_zh = "账号级保留随账号存续：「Amp retains your information while your account is active.」。这是账号信息的时钟，与线程删除后 30 天的窗口不是同一对象。"
anchor = "amp-account-retention"
[[product.retention.point]]
text = "Audit logs are a separate object from thread content, and their period is a floor: \"Audit logs are retained for a minimum of 30 days.\" That is not a deadline for deleting inputs and outputs — the thread-deletion window is a different rule."
text_zh = "审计日志是与线程内容不同的对象，且期限是下限：「Audit logs are retained for a minimum of 30 days.」。这不等于输入输出在 30 天后删除——线程删除窗口是另一条规则。"
anchor = "amp-audit-log-retention-min-30d"
[[product.retention.point]]
text = "What that object is: structured application audit logs (timestamps, actor IDs, request details, event information) collected internally and monitored by Amp's security team, not exposed to Workspace Admins by default, but providable for Enterprise workspaces on request, for example during customer audits or incidents."
text_zh = "该对象的范围：结构化应用审计日志（时间戳、actor ID、request details、事件信息），由 Amp 安全团队内部收集与监控，默认不对工作区管理员开放，但企业工作区可按需调取（例如客户审计或事件调查）。"
anchor = "amp-audit-log-scope"
[[product.retention.point]]
text = "Orb-side object: \"Amp reuses a snapshot for at most 72 hours and then replaces it. Replaced snapshots are queued for deletion, but cannot be deleted until all orbs created from it have also been deleted - either by deleting threads, or removing a project.\" 72 hours is a reuse ceiling for project snapshots (cloned repository plus setup results), and deletion after replacement can be deferred until every orb derived from that snapshot is gone."
text_zh = "Orb 侧对象：官方写「Amp reuses a snapshot for at most 72 hours and then replaces it. Replaced snapshots are queued for deletion, but cannot be deleted until all orbs created from it have also been deleted - either by deleting threads, or removing a project.」。72 小时是项目快照（克隆仓库 + setup 结果）的复用上限；替换后的删除会推迟到由该快照派生的 orb 全部消失为止。"
anchor = "amp-orb-snapshot-72h"
[[product.retention.point]]
text = "Orbs have no retention period of their own: \"Amp does not offer a retention period for orbs that is separate from threads.\""
text_zh = "Orb 没有独立保留期：官方写「Amp does not offer a retention period for orbs that is separate from threads.」。"
anchor = "amp-orb-no-separate-retention"
[[product.retention.point]]
text = "Deletion is not the end of retention: \"After account deletion, Amp may retain information as needed to perform our contractual obligations, comply with tax, legal, and audit obligations, resolve disputes, preserve legal rights, or enforce our agreements. We retain sales inquiry records after account deletion because they are business correspondence. We keep them only as long as needed for sales follow-up, recordkeeping, legal and audit obligations, or resolving disputes.\" Read together with the 30-day window: that window covers thread content, while account information and sales correspondence can outlive it."
text_zh = "删除不等于全部信息即刻消失：官方写「After account deletion, Amp may retain information as needed to perform our contractual obligations, comply with tax, legal, and audit obligations, resolve disputes, preserve legal rights, or enforce our agreements. We retain sales inquiry records after account deletion because they are business correspondence. We keep them only as long as needed for sales follow-up, recordkeeping, legal and audit obligations, or resolving disputes.」。与 30 天窗口并读：窗口管的是线程内容，账号信息与销售往来记录可以更久。"
anchor = "amp-account-deletion-exception"
[product.processing_region]
codes = ["US"]
anchor = "amp-us-processing"
[product.role]
kind = "unknown"
searched = ["https://ampcode.com/privacy-policy", "https://ampcode.com/security", "https://ampcode.com/docs/enterprise/minimal-data-retention", "https://ampcode.com/docs/pricing"]
[[product.role.point]]
text = "No controller/processor designation: none of the pages checked (privacy policy, security reference, minimal data retention, pricing) names Amp's role toward its users or customers. The only instruction-based processing described belongs to Amp's service providers — the privacy policy says those vendors process Personal Information on Amp's instructions — which describes Amp directing its own suppliers, not Amp's role toward its customers."
text_zh = "没有角色指定：已核实四页（隐私政策、安全参考、Minimal Data Retention、定价页）都没有写明 Amp 相对用户/客户是控制者还是受托方。唯一出现「按指示处理」的是隐私政策描述 Amp 的服务提供者按 Amp 的指示处理个人信息——那是 Amp 指挥自己的供应商，不是 Amp 相对客户的角色。"
[[product.role.point]]
text = "The direction is not settled in the text either way: the policy is written as Amp setting its own purposes (it lists the legal bases it relies on, including its own legitimate interests), which reads more like a controller posture than a processor one — but that is an inference from the framing, not a designation, so the kind is recorded as unknown and has to be confirmed in the contract."
text_zh = "方向在原文里并未定死：隐私政策是按「Amp 自己设定处理目的」写的（它列出自己依赖的法律基础，含自身合法利益），读起来更像控制者而非受托方；但这是从行文推出的推断、不是角色指定，故 kind 记 unknown，需在合同层面确认。"

