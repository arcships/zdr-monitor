[[product.role.point]]
text = "The sentence previously bound here is about ownership, not about the contract role: the security page says Enterprise-workspace threads belong to the enterprise rather than to the individual creator. Data ownership is not a controller/processor designation, so that quote now supports the retention row and this row stays unknown."
text_zh = "原先绑在本条的引文讲的是归属、不是合同角色：安全页写企业工作区的线程归企业所有而非创建者个人。数据归属不是控制者/受托方的角色指定，该引文现改绑 retention 列，本条记 unknown。"
[[product.role.point]]
text = "The enterprise legal terms are outside the checked set: the minimal-data-retention page points Enterprise customers to \"Data Retention for Enterprise Subscriptions\" in the Terms of Service for the full legal terms that apply to their plan, and that document is not among the sources this ledger monitors — so even if it designates a role, it cannot be verified from the pages checked."
text_zh = "企业档的完整法律条款不在已核实范围内：Minimal Data Retention 页把企业客户指向 Terms of Service 里的「Data Retention for Enterprise Subscriptions」，该文档尚未纳入本台账的来源；即使其中指定了角色，也无法从已核实的页面确认。"
[[product.role.point]]
text = "The workspace relationship is not addressed: nothing in the pages checked states a data role between a workspace and its members. The only workspace-scoped statements are about Enterprise thread ownership and about thread visibility — not about who is controller or processor for member data."
text_zh = "工作区关系未约定：已核实文档没有表述工作区与其成员之间的数据角色；涉及工作区的表述只有企业档线程归属与线程可见范围，不涉及成员数据由谁控制。"
[[product.role.point]]
text = "Access context for workspace buyers (not a role finding): joining a workspace with the same account used for personal threads makes those existing threads visible to all workspace members, unless the user makes those threads private or signs up to the workspace with a separate account under a separate email."
text_zh = "工作区采购方关心的访问范围（不是角色判定）：用同一账号加入工作区后，此前创建的个人线程会对全体工作区成员可见，除非把这些线程设为 private，或改用另一个邮箱的独立账号加入。"
anchor = "amp-workspace-thread-visibility"
[[product.role.point]]
text = "Private is not invisible to admins: private threads remain visible to workspace admins for workspace management purposes, and every admin access to a private thread is audit-logged."
text_zh = "private 不等于对管理员不可见：private 线程对工作区管理员仍可见（用于工作区管理），且管理员每次访问 private 线程都会被审计记录。"
anchor = "amp-private-threads-admin-visible"

