[[anchor]]
id = "amp-training-optin"
source_id = "bd8ae33ee1627160"
topics = ["training"]
[anchor.selector]
prefix = ""
exact = "Neither Amp nor our subprocessors train models on your data, unless you have explicitly opted into training."
suffix = ""
[[anchor]]
id = "amp-personal-subscription-terms"
source_id = "bd8ae33ee1627160"
topics = ["training"]
[anchor.selector]
prefix = ""
exact = "When Amp uses a personal ChatGPT or Grok subscription, the model provider’s consumer account terms and data controls apply. These controls are separate from Amp’s training setting, and Amp cannot change them for you."
suffix = ""
[[anchor]]
id = "amp-workspace-training"
source_id = "bd8ae33ee1627160"
topics = ["training"]
[anchor.selector]
prefix = ""
exact = "If you’re on an Amp workspace, turning training on requires the approval of the Workspace Admin."
suffix = ""
[[anchor]]
id = "amp-enterprise-never-train"
source_id = "bd8ae33ee1627160"
topics = ["training"]
[anchor.selector]
prefix = ""
exact = "On an [Amp Enterprise](https://ampcode.com/docs/pricing#enterprise) workspace plan (paid or trial) training can _never_ be enabled."
suffix = ""
[[anchor]]
id = "amp-mdr-not-zero"
source_id = "f504aba9503d94e3"
topics = ["zdr"]
[anchor.selector]
prefix = ""
exact = "It limits how long third-party model providers retain prompts and responses. It does not mean that no data is ever retained."
suffix = ""
[[anchor]]
id = "amp-thread-delete-30d"
source_id = "bd8ae33ee1627160"
topics = ["retention"]
[anchor.selector]
prefix = ""
exact = "When a thread is explicitly deleted, all data for that thread is removed within 30 days of thread deletion."
suffix = ""
[[anchor]]
id = "amp-us-processing"
source_id = "4931216970fe2975"
topics = ["processing_region"]
[anchor.selector]
prefix = ""
exact = "We store and process the information that we collect in the United States in accordance with this Privacy Policy, though our employees, contractors, and service providers may store and process data outside the United States."
suffix = ""
[[anchor]]
id = "amp-account-retention"
source_id = "4931216970fe2975"
topics = ["role"]
[anchor.selector]
prefix = ""
exact = "Amp retains your information while your account is active."
suffix = ""
