name: 重试停滞的 DimCode 任务

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: retry-dim-issues
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: 重新派发没有 PR 的旧任务
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '1 hour ago' +%s)"
          count=0
          while IFS=$'\t' read -r number created provider; do
            [ -n "$number" ] || continue
            created_epoch="$(date -u -d "$created" +%s)"
            [ "$created_epoch" -le "$cutoff" ] || continue
            [ -n "$provider" ] || continue
            if [ "$(gh pr list --repo "$REPO" --state all --head "dim/issue-$number" --json number --jq length)" -gt 0 ]; then
              continue
            fi
            gh api --method POST "repos/$REPO/dispatches" \
              -f event_type=policy-review -f "client_payload[provider]=$provider" -F "client_payload[issue_number]=$number"
            count=$((count + 1))
            [ "$count" -ge 3 ] && break
          done < <(gh issue list --repo "$REPO" --state open --label automation \
            --limit 1000 --json number,createdAt,labels \
            --jq 'sort_by(.createdAt) | .[] | select([.labels[].name] | index("blocked") | not)
                  | [.number, .createdAt, ([.labels[].name | select(startswith("provider:")) | ltrimstr("provider:")] | first // "")] | @tsv')
          echo "重新派发 $count 条"

      - name: 重新派发打回后没重做成的 PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 打回后派发的 issue-fixer 跑失败了（agent 中途出错、没给出 STATUS）：PR 停在打回那一刻，
          # 上一步又因为已经有 PR 而跳过它。最后一条打回评论比 PR 最新提交还新、且超过一小时，就再派一次
          cutoff="$(date -u -d '1 hour ago' +%s)"
          # 同时要 comments 和 commits，GraphQL 节点数有上限，一次只取 30 个开着的 PR
          # shellcheck disable=SC2016 # $c 是 jq 变量，不是 shell 变量
          gh pr list --repo "$REPO" --state open --limit 30 --json number,headRefName,labels,comments,commits \
            --jq '.[] | select(.headRefName | startswith("dim/issue-"))
                  | select([.labels[].name] | index("needs-human") | not)
                  | ([.comments[] | select(.body | startswith("<!-- zdr-agent-pr -->"))] | last) as $c
                  | select($c != null and ($c.body | contains("**打回**")) and $c.createdAt > (.commits | last | .committedDate))
                  | [(.headRefName | ltrimstr("dim/issue-")), $c.createdAt, ($c.body | capture("换用 `(?<m>[^`]+)`").m // "")] | @tsv' \
          | while IFS=$'\t' read -r issue at model; do
              [ "$(date -u -d "$at" +%s)" -le "$cutoff" ] || continue
              provider="$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name | select(startswith("provider:")) | ltrimstr("provider:")] | first // ""')"
              [ -n "$provider" ] || continue
              args=(-f event_type=policy-review -f "client_payload[provider]=$provider" -F "client_payload[issue_number]=$issue")
              [ -z "$model" ] || args+=(-f "client_payload[model]=$model")
              gh api --method POST "repos/$REPO/dispatches" "${args[@]}"
              echo "重新派发 #$issue（$provider${model:+，$model}）"
            done
