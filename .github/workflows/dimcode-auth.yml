name: DimCode 登录态续期

# agent job 用的是 secrets.DIMCODE_AUTH_JSON 里的 OAuth 登录态。访问令牌 7 天过期，刷新令牌会轮换，
# runner 上续出来的新令牌不写回就丢了。所以续期只在这里做：串行、写回 secret，
# 其余 job 只读 secret、令牌不够新就失败（见 .github/actions/setup-dimcode）。

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 不管还剩多久都续期
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dimcode-auth
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN 不能写 secret：用 GitHub App（需要 Secrets: Read and write 权限）或 ZDR_BOT_TOKEN
      - id: app
        uses: ./.github/actions/setup-git-committer
        with:
          app-id: ${{ vars.ZDR_APP_ID }}
          private-key: ${{ secrets.ZDR_APP_PRIVATE_KEY }}
          token: ${{ secrets.ZDR_BOT_TOKEN }}
          permission-secrets: write

      - uses: ./.github/actions/setup-dimcode
        with:
          auth-json: ${{ secrets.DIMCODE_AUTH_JSON }}
          models-json: ${{ secrets.DIMCODE_MODELS_JSON }}
          min-hours: "0"

      - name: 续期并写回 secret
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          dir="$HOME/.dimcode/v2"
          left="$(jq -r '((.nextApiOauth.expires // 0) / 1000 - now) | floor' "$dir/auth.json")"
          if [ "$FORCE" != "true" ] && [ "$left" -gt $((3 * 86400)) ]; then
            echo "还剩 $((left / 3600)) 小时，不续"
            exit 0
          fi
          # 用刷新令牌换发（dim auth login 在 runner 上会等浏览器授权，见 refresh.mjs）
          node .github/actions/setup-dimcode/refresh.mjs "$dir/auth.json"
          # 刷新令牌可能已经轮换，旧的就作废了：先写回 secret，写不回就重试，再验证
          for i in 1 2 3; do
            gh secret set DIMCODE_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$dir/auth.json" && break
            [ "$i" = 3 ] && { echo "::error::新令牌写不回 secret，需要按 docs/maintenance.md 重新登录"; exit 1; }
            sleep 10
          done
          dim auth status
          echo "只回复 OK" | dim exec --stdin --json --policy read-only --provider dimcode-api-oauth \
            --model "${DIMCODE_MODEL:-deepseek-v4.1-flash}" --no-hooks > "$RUNNER_TEMP/check.jsonl" || true
          # 令牌已经续上、写回了 secret；调不通模型如果是额度问题，跟登录态无关
          if grep -q insufficient_balance "$RUNNER_TEMP/check.jsonl"; then
            echo "::error::令牌已续期，但 DimCode 账户额度用完（insufficient_balance），agent 暂时都跑不了，需要充值"
            exit 1
          fi
          jq -e 'select(.eventType == "run:ended" and .payload.status == "completed")' "$RUNNER_TEMP/check.jsonl" >/dev/null
          echo "已续期到 $(jq -r '.nextApiOauth.expires / 1000 | todate' "$dir/auth.json")"
